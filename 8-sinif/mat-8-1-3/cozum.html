<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çözümler · Keşfet ve Çöz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--muted:#5b6478;--line:#dfe5ef;--bg:#f5f7fb;--card:#fff;--ss:#6741d9;--kk:#0b7285;--b:#d0700f;--ok:#2b8a3e;--warn:#c92a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif}
header{background:linear-gradient(135deg,#1c5fbf,#2f8fe0);color:#fff;padding:18px 16px 22px}

main{max-width:780px;margin:14px auto 40px;padding:0 16px}
nav.sec{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}nav.sec button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}

ol.sec{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
ol.sec li{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}ol.sec li.dogru{border-color:var(--ok);background:#ebfbee;font-weight:800}
.adim{border-left:4px solid var(--c);padding:6px 12px;margin:8px 0;background:#fff;border-radius:0 10px 10px 0;animation:gel .35s ease-out}
.adim b{color:var(--c)}@keyframes gel{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dug{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
button.btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.dikkat{background:#fff4e6;border:2px solid #f59f00;border-radius:12px;padding:10px 14px;margin:12px 0 4px}.dikkat b{color:#d9480f}
.tuzak{font-size:15px;color:var(--muted);margin-top:8px}
.cevap{font-weight:900;color:var(--ok);margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid var(--line);padding:8px 10px;text-align:left}th{background:#e3fafc;color:#0b7285;font-size:13px;letter-spacing:.06em}
.ses{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border-radius:12px;background:#eef2ff}

.ses span{font-size:14px;color:var(--muted)}
.gizli{display:none}
.tum{margin:4px 0 14px;font-size:14px}.tum a{color:#1c5fbf;font-weight:800}
@media (prefers-reduced-motion:reduce){.adim{animation:none}}
/* Canlandır (05.10.2026) */
.sek{display:flex;gap:6px;margin:12px 0 0;border-bottom:2px solid var(--line)}
.sek button{border:0;background:none;font:inherit;font-weight:900;font-size:15px;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);min-height:44px;position:relative;top:2px;border-bottom:3px solid transparent}
.sek button[aria-selected=true]{color:var(--c);border-bottom-color:var(--c);background:#fff8f0}
.sek .yeni{display:inline-block;font-size:10px;background:#2b8a3e;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.06em}
.cn{padding-top:10px}
.cn-yon{background:#eef6ff;border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:10px}
.cn-sahne{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;min-height:120px;overflow-x:auto}

.cn-adimci input,.cn-test input{width:84px;height:44px;border:2px solid var(--line);border-radius:12px;font:inherit;font-weight:900;text-align:center;font-size:18px}
.cn-test label{font-weight:800;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.cn-btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
.cn-btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.cn-btn[aria-pressed=true]{background:var(--ac,var(--c));color:#fff;border-color:var(--ac,var(--c))}
.cn-btn:disabled{opacity:.5}
.cn-hazir{display:flex;flex-wrap:wrap;gap:6px}

.cn-dur .iyi{color:var(--ok);font-weight:900}.cn-dur .kotu{color:var(--warn);font-weight:900}
.cn-df{margin-top:10px;overflow-x:auto}@media(max-width:480px){.cn-adimci>span{flex-basis:100%}.cn-h{font-size:12px;padding:5px 0}.cn-izg{gap:3px}.cn-sahne{padding:6px}}@media(max-width:480px){.cn-df table{font-size:13px}.cn-df td,.cn-df th{padding:4px 5px}}.cn-df summary{font-weight:900;cursor:pointer;padding:6px 0}.cn-say{color:var(--muted);font-weight:700}
.cn-df table{font-size:15px}.cn-df td{padding:5px 8px}.cn-df tr.cn-iyi td{background:#ebfbee}.cn-df tr.cn-kotu td{background:#fff5f5}.cn-df tr.cn-son td{outline:2px solid var(--c);outline-offset:-2px}
.cn-p{animation:cnGel .35s ease-out both}@keyframes cnGel{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cn-o{fill:#ffa94d;stroke:#d9480f;stroke-width:1}.cn-o2{fill:#e8590c}.cn-k{fill:#ffc9c9;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:3 2}
.cn-cerceve{stroke:#2b8a3e;stroke-width:3}.cn-et{font-size:13px;font-weight:800;fill:#5b6478}.cn-et.b,.cn-et2b{font-weight:900;fill:#1d2433}.cn-et2{font-size:11px;fill:#5b6478;font-weight:700}.cn-et2b{font-size:13px;fill:#fff}
.cn-ku{fill:#fff4e6;stroke:#ffa94d;stroke-width:1.5}.cn-kk{fill:#fff5f5;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:4 3}
.cn-tahta0{fill:#f1f3f5;stroke:#ced4da}.cn-tahta{fill:#c08552;stroke:#8d5a2b}
.cn-ek{stroke:#868e96;stroke-width:2}.cn-sinir{stroke:#c92a2a;stroke-width:3;stroke-dasharray:5 4}.cn-yay{fill:none;stroke:#f76707;stroke-width:2}
.cn-v1{stroke:#2b8a3e;stroke-width:3}.cn-v2{stroke:#c92a2a;stroke-width:3}.cn-kis{font-size:20px}.cn-bus{font-size:16px}.cn-bek{stroke:#c92a2a;stroke-width:5;stroke-linecap:round;opacity:.6}
.cn-kum{fill:#ffe8cc;stroke:#e8590c;stroke-width:3}.cn-kum2{fill:#495057}.cn-para{fill:#ffd43b;opacity:.85}.cn-buyuk{font-size:26px;font-weight:900;fill:#1d2433}
.cn-zem{fill:#adb5bd}.cn-kat{fill:#f1f3f5;stroke:#ced4da}.cn-katon{fill:#d3f9d8;stroke:#2b8a3e}.cn-katoff{fill:#ffe3e3;stroke:#e03131}
.cn-izg{display:grid;gap:4px}.cn-h,.cn-gb{border-radius:8px;text-align:center;font-weight:800;font-size:14px;padding:6px 0}.cn-h{background:#f1f3f5;transition:background .25s,transform .25s}
.cn-gb{background:none;color:var(--muted);font-size:12px}.cn-h.on{background:#ffa94d;color:#1d2433}.cn-h.yeni{transform:scale(1.18);box-shadow:0 0 0 3px #e8590c}
.cn-kartlar{display:flex;flex-wrap:wrap;gap:6px;padding:4px}.cn-kart{min-width:44px;padding:8px 10px;text-align:center;border-radius:10px;background:#fff4e6;border:2px solid #ffa94d;font-weight:900;animation:cnGel .3s}
.cn-kart.kare{background:#e7f5ff;border-color:#1c7ed6}.cn-bosk{color:var(--muted)}
.cn-cift{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 4px;font-weight:800}.cn-cift i{font-weight:600;color:#1c7ed6}
.cn-katlar{padding:4px}.cn-katsat{display:inline-flex;flex-wrap:wrap;gap:6px}.cn-kat2{background:#e6fcf5;border:1.5px solid #12b886;border-radius:8px;padding:3px 8px;font-weight:800;animation:cnGel .3s}.cn-sonsuz{font-weight:800;color:#0b7285}
.cn-onr{background:#f8f0fc;border:2px solid #ae3ec9;border-radius:12px;padding:10px 14px}.cn-kanit{padding:10px 4px 2px}
.cn-kay{display:inline-flex;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap}.cn-kay{max-width:100%}.cn-kay input{width:min(220px,70vw);accent-color:#d0700f}.cn-satir>*{min-width:0;max-width:100%}
@media (prefers-reduced-motion:reduce){.cn-p,.cn-kart,.cn-kat2{animation:none}.cn-h{transition:none}}
/* 05.10.2026 · KOŞUL ve LABİRENT motorları (SB 6.1.1) */
@media(max-width:560px){.soru [style*="grid-template-columns:repeat"]{grid-template-columns:1fr!important}}   /* çok sütunlu konuşma balonları telefonda alt alta */
.cn-kl{list-style:none;padding:0;margin:0;display:grid;gap:4px}.cn-not{color:var(--muted);font-size:14px}.cn-sonuc{margin-top:6px;font-weight:800}
.cn-secg{gap:6px}.cn-secad{font-weight:800;flex-basis:100%}.cn-secg .cn-btn{padding:8px 12px}
.cn-mv{fill:#74c0fc;stroke:#1c7ed6;stroke-width:1}.cn-tl{fill:#69db7c;stroke:#2b8a3e;stroke-width:1.5}
.cn-lab{display:grid;gap:4px;align-items:center;max-width:460px;margin:0 auto}
.cn-lc{min-height:44px;border-radius:8px;border:1.5px solid #ced4da;background:#fff;font:inherit;font-weight:900;font-size:16px;cursor:pointer;padding:0;color:var(--ink)}
.cn-lc.yol{background:#d3f9d8;border-color:#2b8a3e}.cn-lc.simdi{background:#2b8a3e;color:#fff;box-shadow:0 0 0 3px #b2f2bb}.cn-lc.kapali{background:#ffe3e3;border-color:#e03131;color:#c92a2a;text-decoration:line-through}
.cn-lok{color:#2b8a3e;font-weight:900;text-align:center}.cn-lcik{min-height:44px;border:0;background:none;font:inherit;font-weight:900;color:#d9480f;cursor:pointer;padding:0;white-space:nowrap;font-size:14px}.cn-lcik:disabled{cursor:default}

</style></head><body>
<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }
      if (!art && !o.sandalye) sv += `<rect x="10" y="10" width="${gen * hc}" height="${sira * hc}" fill="none" class="cn-cerceve"/>
        <text x="${10 + gen * hc / 2}" y="${H + 4}" class="cn-et" text-anchor="middle">${gen} ${o.birim || ""}</text>
        <text x="${W + 4}" y="${10 + sira * hc / 2}" class="cn-et" dominant-baseline="middle">${sira} ${o.birim || ""}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W + 70} ${H + 22}" role="img" aria-label="${N} ${o.ad || "kare"}, her sırada ${gen}">${sv}</svg>`;
      const r = o.kural ? o.kural(gen, sira, art, N) : null;
      let m;
      if (art) m = `<span class="kotu">✘</span> ${N} ${o.ad || "kare"} her sırada ${gen} olacak biçimde dizilince ${sira} tam sıra oluşur, <b>${art} ${o.ad || "kare"} artar</b>. Dikdörtgen olmaz: ${N} : ${gen} işleminde kalan ${art}.`;
      else m = `<span class="iyi">✔</span> <b>${N} = ${gen} ${x} ${sira}</b> · ${sira} sıra, her sırada ${gen} ${o.ad || "kare"}; hiç artmadı.` + (gen === sira ? ` <b>Kare oldu!</b> İki kenar aynı: ${gen}.` : "");
      if (!art && o.cevre) m += ` Çevre = 2 ${x} (${gen} + ${sira}) = <b>${2 * (gen + sira)} m</b>.`;
      if (r && r.msg) m += `<br>${r.msg}`;
      s.dur.innerHTML = m;
      const sutunlar = o.satir ? o.satir(gen, sira, art, N, r) : [gen, art ? `${sira} (+ ${art} artan)` : sira, art, art ? "olmaz" : (gen === sira ? "kare" : "dikdörtgen")];
      s.yaz(N + ":" + gen, sutunlar, !art && (!r || r.ok !== false));
    }
    ciz(g.get());
  }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {
    const N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });
    const g = adimci(o.etiket, 1, o.max || N, o.bas || 2, v => { sonK = v; });

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {

    function dene(d) {

      if (r === 0) { bul.add(d); bul.add(b); ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${N} : ${d} = ${b}, kalan 0 → <b>${d} ${x} ${b} = ${N}</b>. ${d} ve ${b} çarpandır.` + (d * d >= N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} ${d * d === N ? "=" : ">"} ${N}. Artık yeni çift çıkmaz; bütün çarpanlar bulundu.` : eksik() : ""); }
      else { s.dur.innerHTML = `<span class="kotu">✘</span> ${N} : ${d} işleminde bölüm ${b}, <b>kalan ${r}</b>. ${d}, ${E(N,"in")} çarpanı değildir.` + (d * d > N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} > ${N}. Daha büyük bölen denemeye gerek yok; çarpan listesi tamam.` : eksik() : ""); }
      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));

      for (let i = 1; i <= (o.katSay || 12); i++) { sat.appendChild(h("span", "cn-kat2", `${N * i}`)); await bekle(220); }

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */
  function KUMBARA(el, o) {

    const k = o.k; let hafta = 0, tmr = null;

      sv.push(`<rect x="116" y="${176 - yuk}" width="108" height="${yuk}" rx="10" class="cn-para"/>`);

  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →
     koşullar tek tek denetlenir (✔/✘) → deney defterine yazılır. Doğru cevap verilmez; öğrenci uygun girdiyi kendisi arar.
     o.girdi: [{ad, min, max, bas} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → SVG/HTML · o.kosullar: [{ad, f(v) → bool | {ok, not}}]
     o.dugme: düğme yazısı (false → her değişiklikte denetlenir) · o.sonuc(v, hepsi, L) · o.satir(v, hepsi, L) · o.iyi(v, L) · o.ek: [{ad, deger(v) → v}] */
  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);
      s.dur.innerHTML = m;
      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);

  }

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

/* ANA_KURALLAR §4.y-3: Etkinliklerde bütün kesirler kesir çizgisiyle (alt alta pay/payda) gösterilir. Düz yazılmış a/b biçimleri otomatik dönüştürülür. */
(function(){
  if (window.__kesirCizgi) return; window.__kesirCizgi = 1;
  const RX = /(^|[^\w\/.,:%])([−-])?(?:(\d+) )?(\d{1,4})\/(\d{1,4})(?![\w\/.,]\d|\w)/g;
  const ATLA = "script,style,svg,textarea,input,select,code,.ilr,.frac,[data-duz]";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function donustur(kok){
    if (!kok || !kok.nodeType) return;
    if (kok.nodeType === 3) kok = kok.parentElement;
    if (!kok || (kok.closest && kok.closest(ATLA))) return;
    const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      if (!/\d\/\d/.test(t.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = t.parentElement; if (!p || p.closest(ATLA)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const L = []; let t; while ((t = w.nextNode())) L.push(t);
    L.forEach(t => {
      let deg = false;
      const h = esc(t.nodeValue).replace(RX, (m, a, s, tam, p, q) => { deg = true;
        return a + (s ? "−" : "") + (tam ? tam + " " : "") + '<span class="frac"><span>' + p + "</span><span>" + q + "</span></span>"; });
      if (!deg) return;
      const k = document.createElement("span"); k.innerHTML = h; t.replaceWith(...k.childNodes);
    });
  }
  let bekleyen = new Set(), plan = 0;
  const calis = () => { plan = 0; const b = bekleyen; bekleyen = new Set(); b.forEach(donustur); };
  const gozcu = new MutationObserver(ms => { ms.forEach(m => {
      if (m.type === "characterData") bekleyen.add(m.target); else m.addedNodes.forEach(n => bekleyen.add(n)); });
    if (!plan) plan = requestAnimationFrame(calis); });
  const bas = () => { donustur(document.body); gozcu.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bas); else bas();
  const st = document.createElement("style");
  st.textContent = ".frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}.frac>span{display:block;text-align:center;padding:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor}";
  document.head.appendChild(st);
})();

/* MAT.8.1.3 · Rasyonel ve İrrasyonel Sayılar · bağlam sorularının "Canlandır" düzenekleri (06.10.2026) — ortak motor: canlandir.js (dokunulmaz)

  document.head.appendChild(st);
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"), den = h("div", "cn-den"), dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın."); dur.setAttribute("aria-live", "polite");

    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"), kayit = new Set();
    const yaz = (k, hucre, iyi) => {
      [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === k)); if (kayit.has(k)) return;
      kayit.add(k); const tr = h("tr", iyi === true ? "cn-iyi cn-son" : iyi === false ? "cn-kotu cn-son" : "cn-son"); tr.dataset.k = k;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz };
  }
  function adimci(et, min, max, deger, deg, yaz) {
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${et}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}" aria-label="${et.replace(/<[^>]+>/g, "")}"><button type="button" aria-label="artır">+</button>${yaz ? '<b class="z8-yz"></b>' : ""}`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input"), yz = w.querySelector(".z8-yz");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v))); if (isNaN(v)) v = min; i.value = v; if (yz) yz.innerHTML = yaz(v); deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    if (yz) yz.innerHTML = yaz(deger);
    return { w, ayarla, get: () => +i.value };
  }
  /* ---------- sayı yardımcıları (kesirler: [pay, payda]) ---------- */
  const ebob = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const R = (p, q = 1) => { if (Array.isArray(p)) return R(p[0], p[1]); if (q < 0) { p = -p; q = -q; } const g = ebob(p, q); return [p / g, q / g]; };

        ifade(n) → üslü yazılış (HTML), durum(n, v) → durum metni, ciz(n, v) → SVG/HTML, sutun, satir(n, v) → hücreler, iyi(n, v) → true/false/null, ilk */
  CN.ZINCIR = function (el, o) {
    const n0 = o.n0 || 0, bas = R(o.bas), kat = R(o.kat);
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun, ilk: o.ilk });
    const deger = n => carp(bas, us(kat, n - n0));
    const kut = h("div", "cn-satir"); const a = adimci(o.etiket || "Adım:", n0, o.nMax, n0, n => ciz(n), o.yazAdim);

    let tmr = null;
    const dur = () => { clearInterval(tmr); tmr = null; bO.textContent = "▶ Oynat"; };
    bO.onclick = () => { if (tmr) { dur(); return; } if (a.get() >= o.nMax) a.ayarla(n0); bO.textContent = "❚❚ Durdur";
      tmr = setInterval(() => { if (a.get() >= o.nMax) { dur(); return; } a.ayarla(a.get() + 1); }, az ? 80 : 900); };
    bS.onclick = () => { dur(); a.ayarla(n0); };
    function ciz(n) {
      const v = deger(n);
      s.sah.innerHTML = o.ciz ? o.ciz(n, v) : "";
      s.dur.innerHTML = o.durum ? o.durum(n, v) : `<span class="z8-ifade">${o.ifade(n)} = ${F(v)}</span>`;
      s.yaz("n" + n, o.satir ? o.satir(n, v) : [n, o.ifade(n), F(v)], o.iyi ? o.iyi(n, v) : null);
    }
    ciz(n0);
  };

     o.girdi: [{ad, min, max, bas, yaz?} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → sahne · o.sonuc(v) → durum metni · o.satir(v) → defter hücreleri · o.iyi(v) → true/false/null */
  CN.DENEY = function (el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun, ilk: o.ilk });
    const v = o.girdi.map(g => g.bas); let kur = false;
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); }; w.appendChild(b); return b; });
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }, g.yaz); w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    function degis() { if (!kur) return; const c = v.slice(); s.sah.innerHTML = o.ciz(c); s.dur.innerHTML = o.sonuc(c); if (!o.kaydet || o.kaydet(c)) s.yaz(c.join("|"), o.satir(c), o.iyi ? o.iyi(c) : null); }
    kur = true; degis();
  };
})();

      { secAd: "Top:", sonuc: (x, G) => `Bu sayı <b>${TUR(x)}</b>: ${x.r ? "top dışarı bırakılır." : "top makinenin içinde kalır."}<br>Tutulan top: ${G.length} / 8 · İçeride kalan: <b>${G.filter(y => !y.r).length}</b>`,
        sutun: ["Top", "Sayı", "Gösterim", "Nereye?"], satir: x => [x.ad, x.h, x.g, x.r ? "Dışarı" : "İçeride"], iyi: x => x.r ? true : false,
        yon: "Kıskaçla topları sırayla tutun (top seçin). Sayının türüne göre topun dışarı bırakılıp bırakılmadığına bakın.", bitis: "Sekiz topu da tuttuğunuzda." }),

    /* 6 · dart: 8 dilim, 4 isabet */
    6: el => { const D = [{ ad: "1. dilim", h: K("0,04"), g: "0,2", r: 1, i: 1 }, { ad: "2. dilim", h: dv("2,", "4"), g: "2,444…", r: 1, i: 1 }, { ad: "3. dilim", h: K(7), g: "2,645751311…", r: 0, i: 1 }, { ad: "4. dilim", h: "π", g: "3,141592654…", r: 0, i: 1 },
        { ad: "5. dilim", h: "0,3", g: "0,3", r: 1, i: 0 }, { ad: "6. dilim", h: K(10), g: "3,16227766…", r: 0, i: 0 }, { ad: "7. dilim", h: K("0,9"), g: "0,948683298…", r: 0, i: 0 }, { ad: "8. dilim", h: kes(5, 8), g: "0,625", r: 1, i: 0 }];
      kartDeney(el, D, { secAd: "Dilim:", sonuc: (x, G) => `Bu sayı <b>${TUR(x)}</b> (${x.r ? 10 : 20} puanlık dilim). ${x.i ? ok(true, "Elif bu dilime isabet ettirdi.") : "Elif bu dilime atış yapmadı."}<br>İncelenen isabetli dilimlerden toplanan puan: <b>${G.filter(y => y.i).reduce((s, y) => s + (y.r ? 10 : 20), 0)}</b> (${G.filter(y => y.i).length} / 4 isabet)`,
        sutun: ["Dilim", "Sayı", "Tür", "İsabet", "Puan"], satir: x => [x.ad, x.h, TUR(x), x.i ? "Evet" : "Hayır", x.i ? (x.r ? 10 : 20) : "—"], iyi: x => x.i ? true : null,
        yon: "Dart tahtasının dilimlerini sırayla seçin. Her dilimdeki sayının türüne ve Elif'in o dilime isabet ettirip ettirmediğine bakın; isabetli dilimlerin puanlarını toplayın.", bitis: "Dört isabetli dilimi incelediğinizde." }); },

    /* 7 · yarışma kartı: tanım + 4 sayı */
    7: el => { const A = [{ h: K(8), r: 0, s: 1, d: 0 }, { h: dv("0,", "3"), r: 1, s: 1, d: 1 }, { h: "π", r: 0, s: 1, d: 0 }, { h: K(kes(4, 9)), r: 1, s: 0, d: 0 }];
      const T = { "sonsuz": x => x.s, "sonsuz ve devirsiz": x => x.s && !x.d, "devirli": x => x.d, "sonlu": x => !x.s };
      CN.DENEY(el, { girdi: [{ ad: "Ön yüzdeki boşluk:", sec: Object.keys(T), bas: "sonsuz" }],
        ciz: ([t]) => `<p class="z8-ifade" style="text-align:center">“Ondalık gösterimi <u>${t}</u> olan sayılara irrasyonel sayı denir.”</p><div class="z9-sat">${A.map(x => `<div class="z9-kart ${T[t](x) ? "i" : "s"}">${x.h}</div>`).join("")}</div><p class="z8-not" style="text-align:center">Turuncu kartlar bu tanıma göre irrasyonel sayılır.</p>`,
        sonuc: ([t]) => { const n = A.filter(T[t]).length, dog = A.every(x => !!T[t](x) === !x.r); return `Bu tanıma göre irrasyonel sayılan kart: <b>${n}</b>. ` + (dog ? ok(true, "Tanım dört kartta da doğru sonuç veriyor.") : `<span class="z8-no">Tanım en az bir kartta yanlış sonuç veriyor: ${A.filter(x => !!T[t](x) !== !x.r).map(x => x.h).join(", ")}</span>`); },
        sutun: ["Tanım", "İrrasyonel sayılan", "Dört kartta doğru mu?"], satir: ([t]) => [t, A.filter(T[t]).length, A.every(x => !!T[t](x) === !x.r) ? "Evet" : "Hayır"], iyi: ([t]) => A.every(x => !!T[t](x) === !x.r),
        yon: `Boşluğa farklı ifadeler koyun. Tanım, arka yüzdeki dört kartı doğru ayırıyor mu? (${K(8)} = 2,828427125…, 0,333…, π = 3,14159…, ${K(kes(4, 9))} = ${kes(2, 3)})`, bitis: "Dört kartı doğru ayıran tanımı bulduğunuzda." }); },

    /* 8 · çim alanları */
    8: el => { const A = [["2,25", 225, 2], ["3,6", 36, 1], ["6,25", 625, 2], ["0,4", 4, 1], ["12,1", 121, 1]]; const gor = new Map();
      CN.DENEY(el, { girdi: [{ ad: "Çim alanı (m²):", sec: A.map(x => x[0]), bas: "2,25" }],
        ciz: ([a]) => { const x = A.find(y => y[0] === a), k = Math.sqrt(x[1] / 10 ** x[2]), s = Math.min(180, k * 52); return svg(360, 210, `<rect x="20" y="${200 - s}" width="${s}" height="${s}" fill="#d8f5a2" stroke="#5c940d" stroke-width="3"/>` + tx(20 + s / 2, 194 - s / 2 + 6, `${a} m²`, "cn-et b") + tx(290, 90, "Kenar:", "cn-et") + tx(290, 118, `√${a} m`, "cn-et b"), "Kare çim alanı"); },
        sonuc: ([a]) => { const x = A.find(y => y[0] === a); const m = x[2] === 2 ? x[1] : x[1] * 10; const ek = ekranR(m, 1); const tk = Number.isInteger(Math.sqrt(m));
          gor.set(a, tk ? 4 * Math.sqrt(m) / 10 : null); const top = [...gor.values()].filter(v => v !== null).reduce((s, v) => s + v, 0);
          return `Kenar: ${K(a)} = <span class="z8-ifade">${ek}${tk ? "" : "…"}</span> m → <b>${tk ? "rasyonel" : "irrasyonel"}</b>. ` + (tk ? `Çit: 4 · ${tr(Math.sqrt(m) / 10)} = <b>${tr(4 * Math.sqrt(m) / 10)} m</b>` : "Çit çekilmez.") + `<br>Şimdiye kadar çit çekilecek alanların çit toplamı: <b>${tr(top)} m</b>`; },
        sutun: ["Alan (m²)", "Kenar (m)", "Tür", "Çit (m)"], satir: ([a]) => { const x = A.find(y => y[0] === a), m = x[2] === 2 ? x[1] : x[1] * 10, tk = Number.isInteger(Math.sqrt(m)); return [a, ekranR(m, 1) + (tk ? "" : "…"), tk ? "rasyonel" : "irrasyonel", tk ? tr(4 * Math.sqrt(m) / 10) : "—"]; },
        iyi: ([a]) => { const x = A.find(y => y[0] === a), m = x[2] === 2 ? x[1] : x[1] * 10; return Number.isInteger(Math.sqrt(m)); },
        yon: "Çim alanlarını sırayla seçin. Kenar uzunluğu alanın kareköküdür; kenarın rasyonel olup olmadığına bakın. Rasyonel kenarlı alanların çevresine çit çekilir.", bitis: "Beş çim alanını da incelediğinizde." }); },

    /* 9 · çember ölçümleri */
    9: el => { const O = { Kaan: [34.6, 11], Lale: [50.3, 16], Mert: [81.7, 26], Nisa: [106.8, 34] };
      CN.DENEY(el, { girdi: [{ ad: "Öğrenci:", sec: Object.keys(O), bas: "Kaan" }],
        ciz: ([a]) => { const [c, d] = O[a], b = c / d; return `<div class="z8-kutu"><div>${ekr(`${tr(c)} : ${d} (uzunluk : çap)`, ekranK(Math.round(c * 10), d * 10))}</div><div>${ekr("π (10 rakam)", "3,141592654")}</div></div>`; },
        sonuc: ([a]) => { const [c, d] = O[a], b = c / d, f = Math.abs(b - Math.PI); return `${a}: <span class="z8-ifade">${tr(c)} : ${d} = ${ekranK(Math.round(c * 10), d * 10, 7)}…</span> · π'den farkı yaklaşık <b>${tr(f.toFixed(4))}</b>.<br>Ölçümler sonlu ondalık sayılardır; bölümleri rasyoneldir ve hiçbiri π'ye eşit olamaz.`; },
        sutun: ["Öğrenci", "Bölüm", "π'den farkı"], satir: ([a]) => { const [c, d] = O[a]; return [a, ekranK(Math.round(c * 10), d * 10, 7), tr(Math.abs(c / d - Math.PI).toFixed(4))]; },
        yon: "Öğrencileri sırayla seçin. Her öğrencinin uzunluk : çap bölümünü π ile karşılaştırın ve farkları deney defterinde izleyin. Hangi bölüm π'ye en yakın?", bitis: "Dört öğrencinin bölümünü karşılaştırdığınızda." }); },

    /* 10 · sayı hunisi */
    10: el => kartDeney(el, [{ ad: "K", h: kes(3, 11), g: "0,272727…", n: "kesir", r: 1 }, { ad: "L", h: K(5), g: "2,236067977…", n: "5 tam kare değil", r: 0 }, { ad: "M", h: dv("0,", "12"), g: "0,121212…", n: "devirli", r: 1 },
      { ad: "N", h: K(kes(1, 16)), g: "0,25", n: `${K(kes(1, 16))} = ${kes(1, 4)}`, r: 1 }, { ad: "P", h: "0,8", g: "0,8", n: "sonlu", r: 1 }, { ad: "R", h: K("0,1"), g: "0,316227766…", n: "0,1 = 1/10; 10 tam kare değil", r: 0 }],
      { secAd: "Kart:", sonuc: (x, G) => `Bu sayı <b>${TUR(x)}</b>: kart ${x.r ? "kaba düşer." : "hunide kalır."}<br>Kaba düşen kartlar: <b>${G.filter(y => y.r).map(y => y.ad).sort().join(", ") || "—"}</b>`,
        sutun: ["Kart", "Sayı", "Gösterim", "Nereye?"], satir: x => [x.ad, x.h, x.g, x.r ? "Kap" : "Huni"], iyi: x => !!x.r,
        yon: "Kartları sırayla huniye atın (kart seçin). Rasyonel sayılar kaba düşer, irrasyonel sayılar hunide kalır.", bitis: "Altı kartın hepsini attığınızda." }),

    /* 11 · iki ekran, 1/13 */
    11: el => CN.DENEY(el, { girdi: [{ ad: "Ekrana sığan rakam:", min: 6, max: 20, bas: 8 }],
      ciz: ([n]) => `<div class="z8-kutu"><div>${ekr(`1 : 13 · ekrana ${n} rakam sığıyor`, ekranK(1, 13, n))}</div></div><div class="z9-bas"><span class="v">0</span><span class="v">,</span>${basak(1, 13, 18).map((d, i) => `<span class="${i < n - 1 ? (Math.floor(i / 6) % 2 ? "g" : "on") : ""}">${d}</span>`).join("")}<span class="v">…</span></div><p class="z8-not" style="text-align:center">Alt satır: uzun bölmeyle bulunan basamaklar (renkliler ekranda görünenler).</p>`,
      sonuc: ([n]) => { const e = ekranK(1, 13, n), f = (e.split(",")[1] || ""), g = basak(1, 13, f.length).join(""); return `Ekran: <span class="z8-ifade">${e}</span> · 1/13 = ${dvH(1, 13)}<br>` + (f === g ? "Ekrandaki son rakam gerçek basamakla aynı." : `Son rakam yuvarlandı: gerçek basamak ${g.slice(-1)}, ekranda ${f.slice(-1)}.`) + ` Devreden 076923 grubu ekranda <b>${Math.floor((f.length - (f === g ? 0 : 1)) / 6)}</b> kez tam görünüyor.`; },
      sutun: ["Rakam", "Ekran", "Grup kaç kez?"], satir: ([n]) => { const e = ekranK(1, 13, n), f = (e.split(",")[1] || ""), g = basak(1, 13, f.length).join(""); return [n, e, Math.floor((f.length - (f === g ? 0 : 1)) / 6)]; }, iyi: ([n]) => n === 8 || n === 16 ? true : null,
      yon: "Ekrana sığan rakam sayısını değiştirin. Ayşe'nin (8 rakam) ve Efe'nin (16 rakam) ekranlarını kurun; devreden grup görünüyor mu, son rakam gerçek basamakla aynı mı?", bitis: "8 ve 16 rakamlık ekranları karşılaştırdığınızda." }),

    /* 12 · dokuz kart, gruplar */
    12: el => { const L = [{ ad: "0,4", h: "0,4", v: "2/5" }, { ad: "2/5", h: kes(2, 5), v: "2/5" }, { ad: "√(4/25)", h: K(kes(4, 25)), v: "2/5" }, { ad: "6/15", h: kes(6, 15), v: "2/5" }, { ad: "2,5", h: "2,5", v: "5/2" }, { ad: "5/2", h: kes(5, 2), v: "5/2" }, { ad: "√(25/4)", h: K(kes(25, 4)), v: "5/2" }, { ad: "10/4", h: kes(10, 4), v: "5/2" }, { ad: "√2,5", h: K("2,5"), v: "irr" }];
      const gor = new Set(); const AD = { "2/5": `${kes(2, 5)} = 0,4`, "5/2": `${kes(5, 2)} = 2,5`, irr: `${K("2,5")} = 1,58113883… (irrasyonel)` };
      CN.DENEY(el, { girdi: [{ ad: "Kart:", sec: L.map(x => x.ad), bas: "0,4", yaz: a => L.find(x => x.ad === a).h }],
        ciz: ([a]) => `<div class="z9-sat">${L.map(x => `<div class="z9-kart ${gor.has(x.ad) || x.ad === a ? (x.v === "irr" ? "i" : x.v === "2/5" ? "r" : "") : "s"}" style="font-size:20px">${x.h}</div>`).join("")}</div>`,
        sonuc: ([a]) => { const x = L.find(y => y.ad === a); gor.add(a); const G = new Set([...gor].map(b => L.find(y => y.ad === b).v)); return `Bu kartın değeri: <span class="z8-ifade">${AD[x.v]}</span><br>İncelenen kartlarda şimdiye kadar <b>${G.size}</b> farklı değer (grup) var${G.has("irr") ? "; biri irrasyonel" : ""}.`; },
        sutun: ["Kart", "Değeri"], satir: ([a]) => { const x = L.find(y => y.ad === a); return [x.h, AD[x.v]]; }, iyi: ([a]) => L.find(y => y.ad === a).v === "irr" ? false : null,
        yon: `Kartları sırayla seçin; her kartın değerini sade kesir ya da ondalık gösterimle bulun. Aynı değerli kartlar aynı renge boyanır. ${K("2,5")} ile 2,5'in değerlerini karşılaştırın.`, bitis: "Dokuz kartın hepsini incelediğinizde." }); },

    /* 13 · program: n mod 4 */
    13: el => CN.DENEY(el, { girdi: [{ ad: "Basamak sırası:", min: 1, max: 60, bas: 1 }],
      ciz: ([n]) => { const k = Math.max(16, Math.min(60, Math.ceil(n / 4) * 4)); return `<div class="z9-bas"><span class="v">0</span><span class="v">,</span>${Array.from({ length: k }, (_, i) => `<span class="${i + 1 === n ? "on" : Math.floor(i / 4) % 2 ? "g" : ""}">${(i + 1) % 4}</span>`).join("")}<span class="v">…</span></div>`; },
      sonuc: ([n]) => `${n}. basamak: ${n} = 4 · ${Math.floor(n / 4)} + ${n % 4} → kalan <span class="z8-ifade">${n % 4}</span><br>Kalanlar 1, 2, 3, 0 sırasıyla tekrar ediyor: sayı 0,<span class="dv">1230</span> = ${kes(1230, 9999)}; devirli olduğu için <b>rasyonel</b>.`,
      sutun: ["Sıra", "4'e bölümden kalan", "Rakam"], satir: ([n]) => [n, n % 4, n % 4], iyi: ([n]) => n === 50 ? true : null,
      yon: "Basamak sırasını değiştirin; programın o basamağa yazdığı rakama bakın. Rakamlar nasıl bir sırayla geliyor? 50. basamağa da bakın.", bitis: "Tekrar eden grubu ve 50. basamağı deney defterinde gördüğünüzde." }),

    /* 14 · iki turlu kart oyunu */
    14: el => { const C = { Deniz: [[{ h: K("0,16"), r: 1, g: "0,4" }, { h: "π", r: 0, g: "3,14159…" }, { h: dv("2,", "3"), r: 1, g: "2,333…" }], [{ h: K("2,5"), r: 0, g: "1,58113883…" }, { h: K("0,1"), r: 0, g: "0,316227766…" }]],
        Efe: [[{ h: K(12), r: 0, g: "3,464101615…" }, { h: "0,5", r: 1, g: "0,5" }, { h: K(kes(1, 9)), r: 1, g: "0,333…" }], [{ h: K("3,24"), r: 1, g: "1,8" }, { h: K(7), r: 0, g: "2,645751311…" }]] };
      const P = (t, r) => t === 0 ? (r ? 3 : 1) : (r ? 1 : 3); const gor = new Map();
      CN.DENEY(el, { girdi: [{ ad: "Oyuncu:", sec: ["Deniz", "Efe"], bas: "Deniz" }, { ad: "Tur:", sec: ["1. tur", "2. tur"], bas: "1. tur" }],
        ciz: ([o, t]) => { const ti = t[0] - 1; return `<div class="z9-sat">${C[o][ti].map(x => `<div class="z9-kart ${x.r ? "r" : "i"}" style="font-size:22px">${x.h}<div class="z8-not">${x.g} · ${x.r ? "R" : "İ"} · <b>${P(ti, x.r)} puan</b></div></div>`).join("")}</div><p class="z8-not" style="text-align:center">${ti ? "2. tur: rasyonel 1, irrasyonel 3 puan" : "1. tur: rasyonel 3, irrasyonel 1 puan"}</p>`; },
        sonuc: ([o, t]) => { const ti = t[0] - 1, p = C[o][ti].reduce((s, x) => s + P(ti, x.r), 0); gor.set(o + ti, p); const top = n => (gor.has(n + 0) && gor.has(n + 1)) ? gor.get(n + 0) + gor.get(n + 1) : null;
          return `${o}, ${t}: <b>${p} puan</b>.` + ["Deniz", "Efe"].map(n => top(n) !== null ? `<br>${n}'in iki turda toplam puanı: <b>${top(n)}</b>` : "").join(""); },
        sutun: ["Oyuncu", "Tur", "Puan"], satir: ([o, t]) => { const ti = t[0] - 1; return [o, t, C[o][ti].reduce((s, x) => s + P(ti, x.r), 0)]; },
        yon: "Oyuncuyu ve turu seçin; kartların türüne ve o turun kuralına göre kazandırdığı puana bakın. Dört durumu da deneyip iki oyuncunun toplam puanını bulun.", bitis: "Dört durumu da deney defterinde gördüğünüzde." }); },

    /* 15 · halılar k/4 m² */
    15: el => { const bul = new Set();
      CN.DENEY(el, { girdi: [{ ad: "Halının alanı (m²) = k / 4, k:", min: 1, max: 40, bas: 2 }],
        ciz: ([k]) => { const s = Math.sqrt(k / 4) * 54; return svg(360, 200, `<rect x="20" y="${190 - s}" width="${s}" height="${s}" fill="#ffd8a8" stroke="#e8590c" stroke-width="3"/>` + tx(270, 80, `${tr(k / 4)} m²`, "cn-et b") + tx(270, 110, `kenar: √${tr(k / 4)} m`, "cn-et"), "Kare halı"); },
        sonuc: ([k]) => { const tk = Number.isInteger(Math.sqrt(k)); if (tk) bul.add(k); return `Alan ${kes(k, 4)} = ${tr(k / 4)} m² · Kenar ${K(tr(k / 4))} = <span class="z8-ifade">${ekranR(k * 25, 1)}${tk ? "" : "…"}</span> m → <b>${tk ? "rasyonel" : "irrasyonel"}</b>${tk ? ` (${kes(Math.sqrt(k), 2)})` : ""}.<br>Vitrine konacak halılardan şimdiye kadar bulunan: <b>${bul.size}</b>`; },
        sutun: ["k", "Alan (m²)", "Kenar (m)", "Vitrine"], satir: ([k]) => { const tk = Number.isInteger(Math.sqrt(k)); return [k, tr(k / 4), ekranR(k * 25, 1) + (tk ? "" : "…"), tk ? "Evet" : "Hayır"]; }, iyi: ([k]) => Number.isInteger(Math.sqrt(k)) ? true : null,
        yon: "k sayısını değiştirerek halının alanını seçin. Kenar uzunluğunun rasyonel olduğu halılar vitrine konur. Payda 4 tam kare olduğuna göre k nasıl bir sayı olmalı?", bitis: "1'den 40'a kadar vitrine konacak bütün halıları bulduğunuzda." }); },

    /* 16 · önerme: ekranı dolduran her sayı irrasyoneldir */
    16: el => { const O = { Ali: [kes(1, 7), () => ekranK(1, 7), 1], Banu: [kes(2, 3), () => ekranK(2, 3), 1], Cem: [K(10), () => ekranR(10), 0], Deniz: [kes(5, 17), () => ekranK(5, 17), 1] };
      CN.DENEY(el, { girdi: [{ ad: "Öğrenci:", sec: Object.keys(O), bas: "Ali" }],

  k.innerHTML=`<span class="et">KALEM KÂĞIT · ${s.no}</span><h2>${s.bas}</h2><p>${s.yon}</p><table><thead><tr><th>SAYI</th><th>CEVAP</th></tr></thead><tbody>${s.r.map(r=>`<tr><td><b>${r.n}</b></td><td>${r.c}</td></tr>`).join("")}</tbody></table>`;return k;}
function kartB(s){const k=document.createElement("section");k.className="kart";k.style.setProperty("--c","var(--b)");k.id="b"+s.no;
  const L="ABCD";const sec=s.sec?`<ol class="sec">${s.sec.map((x,i)=>`<li class="${L[i]===s.c?"":""}" data-h="${L[i]}"><b>${L[i]})</b> ${x}</li>`).join("")}</ol>`:"";
  k.innerHTML=`<span class="et">${V.bet||"BAĞLAM TEMELLİ SORU"} · ${s.no}</span><h2>${window.CANL&&CANL[s.no]?"Canlandırın, deneyin, çözümü görün":"Adım adım çözüm"}</h2><div class="soru">${s.on||""}${s.g?`<div>${s.g}</div>`:""}${s.son||""}<p><b>${s.k}</b></p>${sec}${s.secg?'<p><i>Seçenekler kitaptaki görsellerdir.</i></p>':""}</div>`;
  let cozKap=k;
  if(window.CANL&&CANL[s.no]){const sek=document.createElement("div");sek.className="sek";sek.setAttribute("role","tablist");
    sek.innerHTML=`<button type="button" role="tab" aria-selected="true">▶ Canlandır ve dene<span class="yeni">YENİ</span></button><button type="button" role="tab" aria-selected="false">Adım adım çözüm</button>`;
    const p1=document.createElement("div");p1.className="cn";p1.setAttribute("role","tabpanel");const p2=document.createElement("div");p2.setAttribute("role","tabpanel");p2.hidden=true;
    k.append(sesKutu(s.ses),sek,p1,p2);let kur=false;const ac=i=>{sek.querySelectorAll("button").forEach((b,j)=>b.setAttribute("aria-selected",i===j));p1.hidden=i!==0;p2.hidden=i!==1;if(i===0&&!kur){kur=true;CANL[s.no](p1);}};
    sek.querySelectorAll("button").forEach((b,i)=>b.onclick=()=>ac(i));ac(q.get("g")==="cozum"?1:0);cozKap=p2;}
  if(cozKap===k)k.appendChild(sesKutu(s.ses));const w=document.createElement("div");cozKap.appendChild(w);
  adimAdim(w,s.a,()=>{const c=document.createElement("p");c.className="cevap";c.innerHTML=`<b>Doğru cevap:</b> ${s.c}`;w.appendChild(c);
    k.querySelectorAll("ol.sec li").forEach(li=>{if(li.dataset.h===s.c)li.classList.add("dogru");});
    if(s.t){const t=document.createElement("p");t.className="tuzak";t.innerHTML="<b>Diğer seçenekler neden yanlış?</b> "+s.t;w.appendChild(t);}});
  const d=document.createElement("div");d.className="dikkat";d.innerHTML=`<b>Dikkat!</b> ${s.d}`;cozKap.appendChild(d);return k;}
const ic=$("#ic");
const BOL=[["s","Sıra Sende",V.s,kartS],["k","Kalem Kâğıt",V.k,kartK],["b",V.bad||"Bağlam Soruları",V.b,kartB]].filter(x=>x[2].length);
if(tek&&BOL.some(x=>x[0]===tek)){const n=+q.get(tek);const [,,L,f]=BOL.find(x=>x[0]===tek);const s=L.find(x=>x.no===n)||L[0];ic.appendChild(f(s));$("#tum").hidden=false;$("#nav").remove();}
else{let akt=BOL[0][0];const nav=$("#nav");const ciz=()=>{ic.innerHTML="";nav.innerHTML=BOL.map(([k,a,L])=>`<button type="button" data-k="${k}" aria-pressed="${k===akt}">${a} (${L.length})</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{akt=b.dataset.k;ciz();});const [,,L,f]=BOL.find(x=>x[0]===akt);L.forEach(s=>ic.appendChild(f(s)));};ciz();}

/* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
