:root{--kb1:#1864ab;--kb2:#0b7285;--acc:#1864ab;--kbr:12px;

:root[data-theme="dark"]{--acc:#4dabf7}
body{background:var(--bg);background-image:radial-gradient(circle at 12% -10%,color-mix(in srgb,var(--kb1) 14%,transparent),transparent 45%),radial-gradient(circle at 100% 0,color-mix(in srgb,var(--kb2) 12%,transparent),transparent 40%);background-attachment:fixed}
.wrap{max-width:1320px}

.kb-hero h1{color:#fff;font-size:clamp(28px,4.2vw,42px)}
.kb-hero .lead{color:rgba(255,255,255,.92);margin-bottom:10px;max-width:80ch}
.kb-ilerleme{position:relative;z-index:1;display:flex;align-items:center;gap:12px;font-weight:700;font-size:14px;max-width:460px}
.kb-bar{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
.kb-bar i{display:block;height:100%;width:0;border-radius:99px;background:#fff;transition:width .5s}
.kb-duzen{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.kb-yan{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding-right:4px;scrollbar-width:thin}
.kb-yan .index{grid-template-columns:1fr;gap:6px}

.index a{border-radius:10px;min-height:0;transition:transform .15s,border-color .15s;border-width:2px}
.index a:hover{transform:translateX(3px)}
.index a[aria-current="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card));box-shadow:0 4px 14px -8px var(--acc)}
.index li:nth-child(6n+1) .n{background:var(--p1)} .index li:nth-child(6n+2) .n{background:var(--p2)}
.index li:nth-child(6n+3) .n{background:var(--p3)} .index li:nth-child(6n+4) .n{background:var(--p4)}
.index li:nth-child(6n+5) .n{background:var(--p5)} .index li:nth-child(6n+6) .n{background:var(--p6)}
.index .n{color:#fff!important}
.index a.kb-tamam .n{background:var(--acc3)!important}
.index a.kb-tamam .n::after{content:"✓";position:absolute;font-size:15px}
.index a.kb-tamam .n{font-size:0;position:relative}
.panel{border-radius:16px;border:0;box-shadow:0 12px 34px -18px rgba(20,30,60,.35);padding:20px 22px 22px;position:relative;overflow:hidden}
.panel::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--kb1),var(--kb2),var(--p2))}

.kb-gezinti{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}

/* Tek düğme ve menü */
.kb-dugme{position:fixed;top:14px;right:14px;z-index:60;width:56px;height:56px;border-radius:50%;border:3px solid #fff;cursor:pointer;

.kb-seg{display:flex;border:2px solid var(--line);border-radius:99px;overflow:hidden}

.kb-yonerge header{padding:16px 20px;color:#fff;background:linear-gradient(125deg,var(--kb1),var(--kb2));font:800 20px/1.2 "Nunito","Segoe UI",system-ui,sans-serif}

.kb-yonerge .ic ol{padding-left:20px;margin:8px 0} .kb-yonerge .ic li{margin:4px 0}
.kb-yonerge .ic .gorev{background:var(--soft);border-radius:12px;padding:10px 14px;font-weight:500;border-left:5px solid var(--acc)}
.kb-yonerge footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 18px}
.kb-kutlama{position:fixed;pointer-events:none;z-index:70}
.kb-kutlama i{position:absolute;width:9px;height:9px;border-radius:2px;animation:kbpat .8s ease-out forwards}
@keyframes kbpat{to{transform:translate(var(--x),var(--y)) rotate(260deg);opacity:0}}
.kb-gizli{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Erişilebilirlik sınıfları */
html.kb-y1 .wrap{zoom:1.15} html.kb-y2 .wrap{zoom:1.3}
html.kb-rahat body{letter-spacing:.03em;word-spacing:.12em;line-height:1.85}
html.kb-karsit{--ink:#000;--muted:#111;--line:#000;--bg:#fff;--card:#fff;--soft:#fff7cc;--acc:#0030b8;--acc3:#006b2e;--bad:#b00000;--grid:transparent}

html.kb-azhareket *,html.kb-azhareket *::before,html.kb-azhareket *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}

/* tek kareli zemin: kutuların arka plan ızgarası kapatılır, çizim alanları düz zemin üzerinde durur (iki ızgara üst üste binmez) */
.panel,.card,.stage,.tahta,.sahne,.board,.kutu,.alan{background-image:none!important}

/* Sayıya Türkçe ek: "i" belirtme (18'i), "e" yönelme (4'e), "in" ilgi (6'nın), "de" bulunma (12'de) */
function ek(n,tur){const son=n%10,on=Math.floor(n/10)%10;let s;
  if(son)s=["","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"][son];else if(on)s=["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"][on];else s=n%1000===0?"bin":"yüz";

/* Görev listesi: sırayla, tek tek */

  function ciz(){d.innerHTML=`<div class="gbas">Görevler <b>${Math.min(i,liste.length)} / ${liste.length}</b></div><ol>`+liste.map((g,j)=>j<i?`<li class="tamam"><span>✓</span><div>${g.m}${sonuc[j]?`<small>${sonuc[j]}</small>`:""}</div></li>`:j===i?`<li class="simdi"><span>${j+1}</span><div>${g.m}</div></li>`:`<li class="sonra"><span>${j+1}</span><div>Sıradaki görev</div></li>`).join("")+`</ol>`;

function sor(kap,soru,secs,dogru,okMsg,sonra){

function segment(kap,secenekler,deger,fn){const d=document.createElement("div");d.className="seg";d.innerHTML=secenekler.map(s=>`<button data-v="${s[0]}" aria-pressed="${String(s[0])===String(deger)}">${s[1]}</button>`).join("");
  d.querySelectorAll("button").forEach(b=>b.onclick=()=>{d.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));fn(b.dataset.v);});kap.appendChild(d);return d;}
const karistir=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

function kitapUyari(ad){if(document.getElementById("kitapUyari"))return;const d=document.createElement("div");d.id="kitapUyari";d.setAttribute("role","status");
  d.style.cssText="position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:90;max-width:min(560px,calc(100vw - 28px));background:#fff8e6;color:#3b2f00;border:2px solid #f0a500;border-radius:14px;padding:10px 42px 10px 14px;font:600 15px/1.45 system-ui,sans-serif;box-shadow:0 10px 26px -12px rgba(0,0,0,.45)";
  d.innerHTML=`<b style="display:block;color:#a15c00;margin-bottom:2px">Kitaptaki karekoda tıklayarak açtınız</b>${ad} tarayıcıda açıldı. Bitirince bu sekmeyi kapatıp kitaba dönebilirsiniz.<button aria-label="Uyarıyı kapat" style="position:absolute;right:8px;top:6px;border:0;background:none;font-size:20px;cursor:pointer;color:#a15c00">×</button>`;
  d.querySelector("button").onclick=()=>d.remove();document.body.appendChild(d);setTimeout(()=>{if(d.isConnected)d.remove();},9000);}
function kesifBaslat(ACT,BILGI){
  const kok=document.getElementById("kesif");
  let tekMod=false;
  function liste(){tekMod=false;document.title=BILGI.baslik;
    kok.innerHTML=`<header class="ogr-bas"><div class="eyebrow">${BILGI.ust}</div><h1>${BILGI.baslik}</h1><p class="lead">${BILGI.aciklama}</p></header>
      <p class="ogr-not">Öğretmen görünümü. Öğrenciler kitaptaki karekodu okuttuğunda yalnız ilgili etkinliği görür.</p>
      <ol class="kartlar-l">${ACT.map((a,i)=>`<li><button class="ek" data-i="${i}"><span class="n">${i+1}</span><span><b>${a.ad}</b><small>${a.amac}</small></span></button></li>`).join("")}</ol>`;
    kok.querySelectorAll(".ek").forEach(b=>b.onclick=()=>{try{history.replaceState(null,"","#e"+(+b.dataset.i+1));}catch(e){}yonergeEkrani(+b.dataset.i,false);});
    const y=document.getElementById("yonlendir");if(y)y.hidden=true;window.scrollTo(0,0);}
  function yonergeEkrani(i,tek){tekMod=tek;const a=ACT[i];document.title=`${i+1}. ${a.ad} · ${BILGI.kisa}`;
    kok.innerHTML=`<div class="yon-ekran"><div class="yon-kart">
      <div class="yon-ust">${tek?"":`<button class="ghost geri">‹ Bütün etkinlikler</button>`}<span class="kod">${BILGI.kod} · Keşfetme Etkinliği ${i+1}</span></div>
      <div class="yon-no">${i+1}</div><h2>${a.ad}</h2>
      <p class="amac"><b>Amaç:</b> ${a.amac}</p>
      <div class="lab">Ne yapacaksınız?</div><ol class="adimlar">${a.adimlar.map(s=>`<li>${s}</li>`).join("")}</ol>
      <p class="sure">Yaklaşık ${a.sure||6} dakika · Telefonda da yapabilirsiniz.</p>
      <button class="primary basla">Etkinliğe Başlayın</button></div></div>`;
    if(!tek)kok.querySelector(".geri").onclick=()=>{try{history.replaceState(null,"","#liste");}catch(e){}liste();};
    kok.querySelector(".basla").onclick=()=>{bip(660,.1);etkinlik(i);};
    const y=document.getElementById("yonlendir");if(y)y.hidden=true;window.scrollTo(0,0);}
  function etkinlik(i){const a=ACT[i];
    kok.innerHTML=`<div class="etk-ekran" id="panel"><div class="etk-ust"><button class="ghost yon">‹ Yönerge</button><h2>${i+1}. ${a.ad}</h2></div>
      <p class="task gizli-gorev">${a.amac}</p><div class="etk-ic" id="act"></div></div>`;
    kok.querySelector(".yon").onclick=()=>yonergeEkrani(i,tekMod);
    try{a.ciz(kok.querySelector("#act"));}catch(err){kok.querySelector("#act").innerHTML=`<div class="fb no">Bu etkinlik yüklenirken bir sorun oluştu: ${String(err&&err.message||err)}</div>`;console.error(err);}
    window.scrollTo(0,0);}
  /* 01.10.2026: karekod adresi ?e=5 (kitaptan tıklanınca ?e=5&k=1); eski #e5 / #e5-k biçimi de okunur */
  function hedef(){const q=new URLSearchParams(location.search);if(q.has("e")&&/^\d+$/.test(q.get("e")))return {i:+q.get("e")-1,k:q.get("k")==="1"};
    const m=location.hash.match(/^#e(\d+)(-k)?$/);return m?{i:+m[1]-1,k:!!m[2]}:{i:-1,k:false};}
  window.addEventListener("kesif-tekrar",()=>{const h=hedef();if(h.i>=0)etkinlik(h.i);});
  function yol(){const H=hedef();const m=H.i>=0?[null,String(H.i+1),H.k?"-k":undefined]:null;const i=H.i;
    if(i>=0&&i<ACT.length){yonergeEkrani(i,true);if(m[2])kitapUyari(`Keşfetme Etkinliği ${i+1} · ${ACT[i].ad}`);}else liste();}
  window.addEventListener("hashchange",yol);yol();
}

/* ================= 8. sınıf keşif atölyeleri · Aşamalı etkinlik düzeni (yerel yardımcılar) =================
   kesif_ortak.js'e dokunmaz; kur.py bu dosyayı ortak şablondan sonra, fasikül dosyasından önce ekler.
   ANA_KURALLAR §4.x: açık yönerge (Ne yapacaksın? / Nasıl? / Ne zaman biter?), numaralı aşamalar, her aşama kendi
   çerçevesinde; bir aşama bitince sonraki açılır. Tahmin adımı içeriği gizlemez. Geri bildirim yönlendiricidir.
   Kullanım:
     const S=asamali(p);                         // 3 aşama: Dene ve keşfet · Kuralı bul · Kendini dene
     const k=S.ac(1,{ne,nasil:[…],biter});       // Aşama 1 gövdesi (çizim, denetimler, görevler, defter buraya)
     S.tahmin(k,soru,[[değer,etiket],…],doğruDeğer,sonuçMetni);   // isteğe bağlı, içeriği gizlemez
     const c=S.kural(2);  S.soru(c,soru,[doğru,[yanlış,ipucu],…],açıklama,sonra);
     const m=S.son();     S.sayi(m,üstHTML,doğru,açıklama,ipucu,sonra,özelİpucu);
     S.bitir(kural);
*/
const A8_ADLAR=["Deneyin ve keşfedin","Kuralı bulun","Kendinizi deneyin"];
/* Aşama 1'in bitiş cümlesi (görev listesi) */
const bitG=n=>`Sağdaki (telefonda aşağıdaki) görev listesinde ${n} görev var. Hepsi tamamlanınca Aşama 1 biter ve Aşama 2 açılır.`;
/* Yönerge ekranı maddeleri: Ne yapacaksın? / Nasıl? / Ne zaman biter? */
const ynr=(ne,nasil,biter)=>[ne,`<b>Nasıl?</b> ${nasil}`,`<b>Ne zaman biter?</b> ${biter||"Her ekranda tek adım var: Tahmin, Deney, Kuralı bulun, Yeni örnek. Bir adımı bitirince alttaki <b>“Sonraki adım →”</b> düğmesine basınız; eski adım kapanır, yenisi açılır. Yeni örnekteki soruyu doğru cevaplayınca etkinlik biter."}`];
/* Durum satırı: ayrı bilgiler "·" ile değil, ayrı kutucuklarla yazılır (§5.x-6) */
const dz=(...a)=>a.filter(Boolean).map(x=>`<span class="a8-dz">${x}</span>`).join("");
/* Etiketli sürgü: adı, anlık değeri, uç değerleri ve − / + düğmeleri görünür (29.09.2026 kuralı) */
function surgu(etiket,min,max,deger,fn,o={}){const adim=o.adim||1,birim=o.birim?" "+o.birim:"";
  const w=document.createElement("div");w.className="a8-surgu";
  w.innerHTML=`<div class="a8-s-bas"><span>${etiket}</span><output>${deger}${birim}</output></div>
    <div class="a8-s-cub"><button type="button" class="ghost a8-az" aria-label="${etiket}: azalt">−</button><span class="a8-uc a8-min">${min}</span>
    <input type="range" min="${min}" max="${max}" step="${adim}" value="${deger}" aria-label="${etiket}"><span class="a8-uc a8-max">${max}</span>
    <button type="button" class="ghost a8-ar" aria-label="${etiket}: artır">+</button></div>`;
  const i=w.querySelector("input"),out=w.querySelector("output");
  const yaz_=v=>{i.value=v;out.textContent=v+birim;};
  const degis=v=>{v=Math.max(+i.min,Math.min(+i.max,v));if(v===+i.value)return;yaz_(v);fn&&fn(v);};
  i.oninput=()=>{out.textContent=i.value+birim;fn&&fn(+i.value);};
  w.querySelector(".a8-az").onclick=()=>degis(+i.value-adim);w.querySelector(".a8-ar").onclick=()=>degis(+i.value+adim);
  return {el:w,get v(){return +i.value;},set v(x){yaz_(x);},maks(x){i.max=x;w.querySelector(".a8-max").textContent=x;if(+i.value>x)yaz_(x);}};}
/* Sayı düğmeleri: sürgü yerine üzerinde sayı yazan düğmeler */
function sayiDugme(kap,etiket,degerler,deger,fn){const d=document.createElement("div");d.className="a8-sd";
  d.innerHTML=`<span class="a8-sd-ad">${etiket}</span>`;const sg=segment(d,degerler.map(x=>Array.isArray(x)?x:[x,String(x)]),deger,fn);kap.appendChild(d);return sg;}

function asamali(p,adlar=A8_ADLAR){document.body.classList.remove("ta-mod");
  p.innerHTML=`<ol class="a8-serit" aria-label="Aşamalar">${adlar.map((a,i)=>`<li data-a="${i+1}"><span>${i+1}</span><b>Aşama ${i+1}</b><em>${a}</em></li>`).join("")}</ol><div class="a8-kap"></div>`;
  const kap=p.querySelector(".a8-kap"),F=[];let tah=null;
  adlar.forEach((a,i)=>{const s=document.createElement("section");s.className="a8 kilitli";
    s.innerHTML=`<header class="a8-bas"><span class="a8-no">Aşama ${i+1}</span><h3>${a}</h3><span class="a8-dur">Kilitli</span></header><div class="a8-ic"><p class="a8-kilit">Aşama ${i} tamamlanınca bu aşama açılır.</p></div>`;
    kap.appendChild(s);F.push(s);});
  const serit=n=>p.querySelectorAll(".a8-serit li").forEach(li=>{const a=+li.dataset.a;li.classList.toggle("on",a===n);li.classList.toggle("bitti",a<n);});
  const yonKutu=o=>`<div class="a8-yon"><div class="a8-y"><b>Ne yapacaksınız?</b><p>${o.ne}</p></div><div class="a8-y"><b>Nasıl?</b>${Array.isArray(o.nasil)?`<ol>${o.nasil.map(x=>`<li>${x}</li>`).join("")}</ol>`:`<p>${o.nasil}</p>`}</div><div class="a8-y"><b>Ne zaman biter?</b><p>${o.biter}</p></div></div>`;
  /* Aşama 1 gövdesini düzenler: tahmin üstte; çizim ve denetimleri tek çerçevede (sahne); görevler ve defter yanda */
  function duzenle(g){const t=g.querySelector(":scope>.a8-tahmin");const yan=[...g.children].filter(c=>c.classList.contains("gorevler")||c.classList.contains("defter"));
    const sahne=document.createElement("div");sahne.className="a8-sahne";sahne.innerHTML=`<div class="a8-sahne-ad">Deney alanı</div>`;
    [...g.children].forEach(c=>{if(c!==t&&!yan.includes(c))sahne.appendChild(c);});
    const iz=document.createElement("div");iz.className="a8-izgara";iz.appendChild(sahne);
    if(yan.length){const y=document.createElement("div");y.className="a8-yan";yan.sort((a,b)=>b.classList.contains("gorevler")-a.classList.contains("gorevler")).forEach(c=>y.appendChild(c));iz.appendChild(y);}
    g.appendChild(iz);
    /* Telefonda küçülen çizim yazılarını okunur boyda tut (en az ~11 px) */
    const oku=()=>sahne.querySelectorAll("svg").forEach(sv=>{const vb=sv.viewBox&&sv.viewBox.baseVal;if(!vb||!vb.width||!sv.clientWidth)return;const o=sv.clientWidth/vb.width;if(o>=.95)return;
      sv.querySelectorAll("text").forEach(t=>{const fs=+t.getAttribute("font-size")||16;if(fs*o<11)t.style.fontSize=(11/o).toFixed(1)+"px";});});
    oku();new MutationObserver(oku).observe(sahne,{childList:true,subtree:true});}
  const tamamla=n=>F.forEach((s,i)=>{if(i<n&&!s.classList.contains("tamam")){s.classList.remove("kilitli","acik");s.classList.add("tamam");s.querySelector(".a8-dur").textContent="Tamamlandı ✓";}});
  const S={
    ac(n,o){tamamla(n-1);const s=F[n-1];s.classList.remove("kilitli");s.classList.add("acik");s.querySelector(".a8-dur").textContent="Şimdi";
      const ic=s.querySelector(".a8-ic");ic.innerHTML=yonKutu(o);const g=document.createElement("div");g.className="a8-govde";ic.appendChild(g);
      if(n===2&&tah){const m=tah.goster();if(m)g.insertAdjacentHTML("afterbegin",`<p class="a8-karsi"><b>Tahminin ve deneyin sonucu:</b> ${m}</p>`);}
      serit(n);yonlendir(o.ne);
      if(n===1)queueMicrotask(()=>duzenle(g));
      else setTimeout(()=>s.scrollIntoView({behavior:azHareket()?"auto":"smooth",block:"start"}),120);
      return g;},
    kural(k,o={}){return S.ac(o.n||2,{ne:o.ne||"Aşama 1'de gördüklerinden kuralı çıkaracaksınız.",
      nasil:o.nasil||["Soruyu okuyunuz. Yukarıdaki deney defterine ve çizime bakabilirsiniz.","Bir seçeneğe dokununuz. Yanlış seçerseniz başka bir seçenek deneyiniz."],
      biter:o.biter||`${k>1?k+" soruyu da":"Soruyu"} doğru cevaplayınca Aşama ${(o.n||2)+1} açılır.`});},
    son(o={}){return S.ac(o.n||3,{ne:o.ne||"Bulduğunuz kuralı yeni bir soruda kullanacaksınız.",
      nasil:o.nasil||["Soruyu dikkatle okuyunuz.","Cevabınızı kutuya yazınız ve “Kontrol edin” düğmesine basınız. Yanlışsa yeniden deneyiniz."],
      biter:o.biter||"Doğru cevabı yazınca etkinlik biter ve “Ne öğrendim?” kartı açılır."});},
    /* Tahmin: isteğe bağlı; seçilmese de deney yapılabilir. Aşama 2 açılınca tahmin sonuçla karşılaştırılır. */
    tahmin(k,soru,secs,dogru,sonuc){const d=document.createElement("div");d.className="a8-tahmin";
      d.innerHTML=`<div class="a8-t-bas"><b>Önce tahmin edin</b><small>Tahmininizi seçiniz ya da doğrudan deneye başlayınız; tahmin etmek zorunlu değil.</small></div><p class="a8-t-soru">${soru}</p><div class="secler">${secs.map(s=>`<button class="sec" data-v="${s[0]}">${s[1]}</button>`).join("")}</div><p class="a8-t-not" hidden></p>`;
      k.prepend(d);let sec=null,secT="",bitti=false;const not=d.querySelector(".a8-t-not");
      d.querySelectorAll(".sec").forEach(b=>b.onclick=()=>{if(bitti)return;d.querySelectorAll(".sec").forEach(x=>x.classList.remove("secili"));b.classList.add("secili");sec=b.dataset.v;secT=b.innerHTML;
        not.hidden=false;not.innerHTML=`Tahmininiz: <b>${secT}</b>. Aşama 1 bitince tahmininiz sonuçla karşılaştırılacak. Fikrinizi değiştirirseniz başka bir seçeneğe dokunabilirsiniz.`;bip(600,.06);});
      tah={goster(){bitti=true;d.querySelectorAll(".sec").forEach(b=>{b.disabled=true;if(dogru!==null&&dogru!==undefined&&b.dataset.v===String(dogru))b.classList.add("dogru");});
        let m;if(sec===null)m=`Tahmin seçmediniz. Sonuç: ${sonuc}`;else if(dogru===null||dogru===undefined)m=`Tahmininiz: <b>${secT}</b>. ${sonuc}`;
        else if(sec===String(dogru))m=`Tahmininiz (<b>${secT}</b>) doğru çıktı! ${sonuc}`;else m=`Tahmininiz <b>${secT}</b> idi; deney başka bir sonuç verdi. ${sonuc}`;
        not.hidden=false;not.innerHTML=m;return m;}};return d;},
    /* Seçmeli soru: secs[0] doğru; diğerleri [metin, ipucu]. Seçenekler karışık sırayla gelir. */
    soru(kap,soru,secs,ok,sonra){const L=karistir(secs.map((s,i)=>({t:Array.isArray(s)?s[0]:s,ip:Array.isArray(s)?s[1]:"",d:i===0})));
      const no=kap.querySelectorAll(".a8-soru").length+1;const d=document.createElement("div");d.className="sor a8-soru";
      d.innerHTML=`<p class="soru"><span class="a8-sn">${no}. soru</span>${soru}</p><div class="secler">${L.map((s,i)=>`<button class="sec" data-i="${i}">${s.t}</button>`).join("")}</div><div class="fb" hidden></div>`;
      kap.appendChild(d);const f=d.querySelector(".fb");let bitti=false;
      d.querySelectorAll(".sec").forEach(b=>b.onclick=()=>{if(bitti)return;const s=L[+b.dataset.i];
        if(s.d){bitti=true;b.classList.add("dogru");d.querySelectorAll(".sec").forEach(x=>x.disabled=true);fb(f,true,`<b>Doğru.</b> ${ok}`);bip(760,.12);sonra&&setTimeout(sonra,500);}
        else{b.classList.add("yanlis");b.disabled=true;fb(f,false,`<b>Bu seçenek doğru değil.</b> Yeniden deneyiniz.`);bip(220,.15,"triangle");}});
      return d;},
    /* Sayı cevaplı soru: yanlışta önce özel ipucu (hata türü), sonra genel ipucu gösterilir */
    sayi(kap,ust,dogru,ok,ipucu,sonra,ozel){const d=document.createElement("div");d.className="sor a8-sayi";
      d.innerHTML=`${ust}<div class="row"><label class="a8-cvp">Cevabınız: <input class="ans" inputmode="numeric" autocomplete="off"></label><button class="primary k">Kontrol edin</button></div><div class="fb" hidden></div>`;
      kap.appendChild(d);const f=d.querySelector(".fb"),inp=d.querySelector(".ans");let bitti=false,yd=0;
      const kontrol=()=>{if(bitti)return;const h=inp.value.replace(/[\s.]/g,"");if(!h){fb(f,false,"Önce cevabınızı kutuya yazınız.");return;}const v=+h;
        if(v===dogru){bitti=true;inp.disabled=true;fb(f,true,`<b>Doğru.</b> ${ok}`);bip(880,.2);sonra&&setTimeout(sonra,600);}
        else{const o=ozel&&ozel(v);fb(f,false,`<b>${h} doğru değil.</b> ${(++yd)>=3?"Yeniden deneyiniz. Doğru cevap: "+dogru:"Yeniden deneyiniz."}`);bip(220,.15,"triangle");}};
      d.querySelector(".k").onclick=kontrol;inp.onkeydown=e=>{if(e.key==="Enter")kontrol();};return d;},
    bitir(kural){tamamla(F.length);serit(F.length+1);const d=document.createElement("section");d.className="ogrendim";
      d.innerHTML=`<div class="og-bas">Ne öğrendim?</div><p>${kural}</p><div class="row"><button class="primary tekrar">Etkinliği baştan yapın</button></div>`;
      kap.appendChild(d);d.querySelector(".tekrar").onclick=()=>window.dispatchEvent(new Event("kesif-tekrar"));
      yonlendir("Etkinliği bitirdiniz. İsterseniz baştan yapabilirsiniz.");setTimeout(()=>d.scrollIntoView({behavior:azHareket()?"auto":"smooth",block:"center"}),150);}
  };
  return S;}

/* ================= Tek adım düzeni (pilot · 30.09.2026) =================
   Her ekranda yalnız bir adım görünür; adım bitince altta "Sonraki adım →" açılır, eski adım kapanır.
   asamali(p) ile aynı arayüzü sunar (ac, tahmin, kural, soru, son, sayi, bitir); etkinlikte asamali yerine adimli yazmak yeter.
   Adımlar: Tahmin (varsa) → Deney → Kuralı bulun (her soru ayrı ekran) → Yeni örnek → Ne öğrendim?
   Üstte: ilerleme şeridi + "Şimdiye kadar" hatırlatması (önceki adımların sonucu, deney defteri).
   Altta (sabit): bu adımda ne yapılacağı / bitince ne olacağı, "‹ Önceki adım" ve "Sonraki adım →". */
function adimli(p){document.body.classList.add("ta-mod");
  p.innerHTML=`<div class="ta">
    <div class="ta-ust"><div class="ta-serit" aria-label="Adımlar"></div><div class="ta-sayac" aria-live="polite"></div></div>
    <div class="ta-hatir" hidden></div>
    <div class="ta-ekranlar"></div>
    <div class="ta-alt"><div class="ta-not"></div><div class="ta-dug"><button type="button" class="ghost ta-geri">‹ Önceki adım</button><button type="button" class="primary ta-ileri" disabled>Sonraki adım →</button></div></div>
  </div>`;
  const R=p.querySelector(".ta"),kap=R.querySelector(".ta-ekranlar"),hat=R.querySelector(".ta-hatir"),notu=R.querySelector(".ta-not"),
        geri=R.querySelector(".ta-geri"),ileri=R.querySelector(".ta-ileri"),serit=R.querySelector(".ta-serit"),sayac=R.querySelector(".ta-sayac");
  const E=[];let cur=-1,tah=null,durumMetni="",kuralSay=0,kuralNo=0,deneyEl=null,basladi=false;const ozet=[];
  const EVRE={tahmin:"Tahmin",deney:"Deney",kural:"Kuralı bulun",yeni:"Yeni örnek",son:"Ne öğrendim?"};
  function ekran(tur,baslik,o={}){const s=document.createElement("section");s.className="ta-ekran";s.hidden=true;
    s.innerHTML=`<header class="ta-bas"><span class="ta-evre">${EVRE[tur]}</span><h3>${baslik}</h3></header><div class="ta-ic"></div>`;
    const e={tur,s,ic:s.querySelector(".ta-ic"),tamam:false,simdi:o.simdi||"",sonra:o.sonra||"",ileriAd:o.ileriAd||"Sonraki adım →"};

/* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

  const s=$("#kbSay"); if(s)s.textContent=n+" / "+L.length+" etkinlik tamamlandı";
  const i=simdiki(), r=$("#kbSira"); if(r)r.textContent=(i+1)+" / "+L.length;
  const o=$("#kbOnce"), z=$("#kbSonra"); if(o)o.disabled=i<=0; if(z)z.disabled=i>=L.length-1;}
let gecis=0;
function git(d){const L=linkler(), i=simdiki()+d; if(L[i]){gecis=Date.now(); L[i].click();}}
$("#kbOnce")&&($("#kbOnce").onclick=()=>git(-1)); $("#kbSonra")&&($("#kbSonra").onclick=()=>git(1));
const idx=$("#index"); if(idx){ idx.addEventListener("click",()=>{gecis=Date.now()},true);
  new MutationObserver(()=>setTimeout(ilerleme,0)).observe(idx,{subtree:true,attributes:true,attributeFilter:["aria-current"]}); }
window.addEventListener("hashchange",()=>{gecis=Date.now()});
setTimeout(ilerleme,50);

/* --- Ses --- */
let ac=null;
function ton(f,t0,sure,tip,hacim){const c=ac;const o=c.createOscillator(),g=c.createGain();o.type=tip;o.frequency.setValueAtTime(f[0],c.currentTime+t0);
  if(f[1])o.frequency.exponentialRampToValueAtTime(f[1],c.currentTime+t0+sure);
  g.gain.setValueAtTime(0.0001,c.currentTime+t0);g.gain.exponentialRampToValueAtTime(hacim,c.currentTime+t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t0+sure);
  o.connect(g).connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+sure+0.02);}
function sesCal(tur){ if(!A.ses)return; try{ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended")ac.resume();
  if(tur==="ok"){ton([659],0,.13,"sine",.22);ton([880],.11,.16,"sine",.22);ton([1319],.22,.22,"sine",.12);}
  else if(tur==="no"){ton([260,180],0,.28,"triangle",.2);}
  else ton([1200],0,.04,"sine",.06); }catch(e){} }
function kutla(el){ if(A.azhareket||!el)return; const r=el.getBoundingClientRect(); const k=D.createElement("div"); k.className="kb-kutlama";
  k.style.left=(r.left+Math.min(60,r.width/2))+"px"; k.style.top=(r.top+r.height/2)+"px";
  const renk=["var(--p1)","var(--p2)","var(--p3)","var(--p4)","var(--p5)","var(--p6)"];
  for(let i=0;i<18;i++){const p=D.createElement("i");const a=Math.random()*Math.PI*2,m=50+Math.random()*70;
    p.style.background=renk[i%6];p.style.setProperty("--x",Math.cos(a)*m+"px");p.style.setProperty("--y",(Math.sin(a)*m-30)+"px");k.appendChild(p);}
  D.body.appendChild(k); setTimeout(()=>k.remove(),900); }

/* Doğru / yanlış geri bildirimini yakala: etkinlik kodu fb(...) ya da .ok/.no sınıfı kullanır */
let sonEylem=0; ["click","keydown"].forEach(t=>D.addEventListener(t,e=>{ if(t==="click"||e.key==="Enter"||e.key===" ")sonEylem=Date.now(); },true));
let kuyruk=[], zam=null;
const has=(s,t)=>(" "+(s||"")+" ").includes(" "+t+" ");
new MutationObserver(ms=>{ const now=Date.now(); if(now-sonEylem>900||now-gecis<450)return;
  ms.forEach(m=>{ const el=m.target; if(!(el instanceof Element)||el.closest(".kb-menu,.kb-yonerge,#index"))return;
    const fb=el.classList.contains("fb"), ok=el.classList.contains("ok"), no=el.classList.contains("no");
    if(!ok&&!no)return; if(!fb&&((ok&&has(m.oldValue,"ok"))||(no&&has(m.oldValue,"no"))))return;
    kuyruk.push({el,fb,ok}); });
  if(kuyruk.length&&!zam)zam=setTimeout(()=>{ const f=kuyruk.filter(x=>x.fb).pop(); let ok, el;
      if(f){ok=f.ok;el=f.el}else{ok=!kuyruk.some(x=>!x.ok);el=kuyruk[kuyruk.length-1].el}
      kuyruk=[];zam=null; sesCal(ok?"ok":"no");
      if(ok){ kutla(el); const i=simdiki(); if(i>=0&&(f||!$("#panel .fb"))){tamam.add(i);yaz(ILR,[...tamam]);ilerleme();} }
      const d=$("#kbDuyuru"); if(d)d.textContent=ok?"Doğru.":"Yeniden deneyiniz."; },110);
}).observe(D.body,{subtree:true,attributes:true,attributeFilter:["class"],attributeOldValue:true});

/* --- Ayarları uygula --- */
function uygula(){ H.classList.toggle("kb-sesyok",!A.ses);
  ["karsit","rahat","azhareket"].forEach(k=>H.classList.toggle("kb-"+k,!!A[k]));
  H.classList.toggle("kb-y1",A.boy===1); H.classList.toggle("kb-y2",A.boy===2);
  if(A.tema)H.setAttribute("data-theme",A.tema); else H.removeAttribute("data-theme");
  const s=$("#kbSes"); s.setAttribute("aria-pressed",A.ses); $("#kbSesY").textContent=A.ses?"Ses açık":"Ses kapalı";
  s.querySelector(".on").style.display=A.ses?"":"none"; s.querySelector(".off").style.display=A.ses?"none":"";
  D.querySelectorAll(".kb-anahtar").forEach(b=>b.setAttribute("aria-checked",!!A[b.dataset.k]));
  D.querySelectorAll("#kbBoy button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.v===A.boy));
  D.querySelectorAll("#kbTema button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===A.tema));
  yaz(ANAHTAR,A); }
uygula();
const dug=$("#kbDugme"), men=$("#kbMenu");
function menu(ac_){ men.hidden=!ac_; dug.setAttribute("aria-expanded",ac_); if(ac_)men.querySelector("button").focus(); }
dug.onclick=()=>menu(men.hidden);
D.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!men.hidden){menu(false);dug.focus();} });
D.addEventListener("click",e=>{ if(!men.hidden&&!men.contains(e.target)&&!dug.contains(e.target))menu(false); });
$("#kbSes").onclick=()=>{A.ses=!A.ses;uygula();sesCal("ok");};
D.querySelectorAll(".kb-anahtar").forEach(b=>b.onclick=()=>{A[b.dataset.k]=!A[b.dataset.k];uygula();});
D.querySelectorAll("#kbBoy button").forEach(b=>b.onclick=()=>{A.boy=+b.dataset.v;uygula();});
D.querySelectorAll("#kbTema button").forEach(b=>b.onclick=()=>{A.tema=b.dataset.v;uygula();});
$("#kbSifir").onclick=()=>{A=Object.assign({},VARS);uygula();};
const tam=$("#kbTam"); if(!D.fullscreenEnabled)tam.hidden=true;
tam.onclick=()=>{ try{ D.fullscreenElement?D.exitFullscreen():H.requestFullscreen(); }catch(e){} };

/* --- Yönerge ve sesli okuma --- */
const metin=el=>{ if(!el)return ""; const c=el.cloneNode(true); c.querySelectorAll(".frac").forEach(f=>{const s=f.querySelectorAll("span"); if(s.length>1)f.replaceWith(s[0].textContent+"/"+s[1].textContent);}); return c.textContent.replace(/\s+/g," ").trim(); };
const PAYDA={2:"ikide",3:"üçte",4:"dörtte",5:"beşte",6:"altıda",7:"yedide",8:"sekizde",9:"dokuzda",10:"onda",12:"on ikide",20:"yirmide",100:"yüzde"};
const okunus=t=>String(t).replace(/(−|-)?(\d+)\/(\d+)/g,(m,sg,a,b)=>(sg?"eksi ":"")+(PAYDA[b]||b+"'te")+" "+a).replace(/\|([^|]+)\|/g,"$1'in mutlak değeri").replace(/(^|[\s(])−\s?(\d)/g,"$1eksi $2").replace(/°C/g," derece");
const kesH=t=>String(t).replace(/(−|-)?(\d+)\/(\d+)/g,(m,sg,a,b)=>(sg?"−":"")+'<span class="frac"><span>'+a+'</span><span>'+b+'</span></span>');
const sesPuan=v=>(/natural|online|neural/i.test(v.name)?4:/google/i.test(v.name)?3:/enhanced|premium|geliş|siri/i.test(v.name)?3:1);
function yonergeMetni(){ const p=$("#panel")||D.body, h=p.querySelector("h2"), g=[];
  p.querySelectorAll(".intro,.task").forEach(e=>{const t=metin(e); if(t&&!g.includes(t)&&g.length<2)g.push(t);});
  if(!g.length&&$(".lead"))g.push(metin($(".lead")));
  return {baslik:metin(h)||D.title, gorev:g}; }
function yonergeAc(){ const y=yonergeMetni(); $("#kbYB").textContent=y.baslik;
  $("#kbYIc").innerHTML='<p class="gorev"></p><ol><li>Görevi okuyunuz; şekil ya da sayı doğrusu üzerinde deneme yapabilirsiniz.</li><li>Cevabınızı yazıp ya da seçip <b>Kontrol edin</b> düğmesine basınız.</li><li>Geri bildirimi okuyunuz. Yanlışsa ipucuyla yeniden deneyiniz.</li><li><b>Yeni soru</b> ile aynı etkinliği farklı sayılarla tekrarlayabilir, <b>Sonraki</b> ile ilerleyebilirsiniz.</li></ol><p style="font-size:14px;color:var(--muted)">Klavye: Tab ile düğmeler arasında geçiniz, Enter ile seçiniz. Esc menüyü kapatır.</p>';
  $("#kbYIc .gorev").innerHTML=kesH(y.gorev.join(" ").replace(/[<>&]/g,""));
  const d=$("#kbYonerge"); menu(false); if(d.showModal)d.showModal(); else d.setAttribute("open",""); }
$("#kbYon").onclick=yonergeAc;
$("#kbYKapat").onclick=()=>{ const d=$("#kbYonerge"); speechSynthesis&&speechSynthesis.cancel(); d.close?d.close():d.removeAttribute("open"); };
const konusabilir="speechSynthesis" in window;
function sesliOku(t){ if(!konusabilir)return; speechSynthesis.cancel();
  const v=speechSynthesis.getVoices().filter(v=>/^tr/i.test(v.lang)).sort((a,b)=>sesPuan(b)-sesPuan(a))[0];
  (okunus(t).match(/[^.!?]+[.!?]?/g)||[t]).forEach(c=>{ const u=new SpeechSynthesisUtterance(c.trim()); u.lang="tr-TR"; u.rate=.95; if(v)u.voice=v; speechSynthesis.speak(u); }); }
function okuPanel(){ const y=yonergeMetni(); sesliOku(y.baslik+". "+y.gorev.join(" ")); }
if(!konusabilir){ $("#kbOku").hidden=true; $("#kbYOku").hidden=true; }
$("#kbOku").onclick=()=>{ const b=$("#kbOku"); if(b.getAttribute("aria-pressed")==="true"){speechSynthesis.cancel();b.setAttribute("aria-pressed","false");return;}
  b.setAttribute("aria-pressed","true"); okuPanel(); const t=setInterval(()=>{ if(!speechSynthesis.speaking){b.setAttribute("aria-pressed","false");clearInterval(t);} },400); };
$("#kbYOku").onclick=()=>sesliOku(metin($("#kbYB"))+". "+metin($("#kbYIc")));
})();
</script>

<script id="kesir-cizgi">
/* ANA_KURALLAR §4.y-3: Etkinliklerde bütün kesirler kesir çizgisiyle (alt alta pay/payda) gösterilir. Düz yazılmış a/b biçimleri otomatik dönüştürülür. */
(function(){
  if (window.__kesirCizgi) return; window.__kesirCizgi = 1;
  const RX = /(^|[^\w\/.,:%])([−-])?(?:(\d+) )?(\d{1,4})\/(\d{1,4})(?![\w\/.,]\d|\w)/g;
  const ATLA = "script,style,svg,textarea,input,select,code,.ilr,.frac,[data-duz]";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function donustur(kok){
    if (!kok || !kok.nodeType) return;
    if (kok.nodeType === 3) kok = kok.parentElement;
    if (!kok || (kok.closest && kok.closest(ATLA))) return;
    const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      if (!/\d\/\d/.test(t.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = t.parentElement; if (!p || p.closest(ATLA)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const L = []; let t; while ((t = w.nextNode())) L.push(t);
    L.forEach(t => {
      let deg = false;
      const h = esc(t.nodeValue).replace(RX, (m, a, s, tam, p, q) => { deg = true;
        return a + (s ? "−" : "") + (tam ? tam + " " : "") + '<span class="frac"><span>' + p + "</span><span>" + q + "</span></span>"; });
      if (!deg) return;
      const k = document.createElement("span"); k.innerHTML = h; t.replaceWith(...k.childNodes);
    });
  }
  let bekleyen = new Set(), plan = 0;
  const calis = () => { plan = 0; const b = bekleyen; bekleyen = new Set(); b.forEach(donustur); };
  const gozcu = new MutationObserver(ms => { ms.forEach(m => {
      if (m.type === "characterData") bekleyen.add(m.target); else m.addedNodes.forEach(n => bekleyen.add(n)); });
    if (!plan) plan = requestAnimationFrame(calis); });
  const bas = () => { donustur(document.body); gozcu.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bas); else bas();
  const st = document.createElement("style");
  st.textContent = ".frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}.frac>span{display:block;text-align:center;padding:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor}";
  document.head.appendChild(st);
})();
</script>
