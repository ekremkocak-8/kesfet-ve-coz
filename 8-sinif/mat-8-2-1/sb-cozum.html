<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çözümler · Keşfet ve Çöz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--muted:#5b6478;--line:#dfe5ef;--bg:#f5f7fb;--card:#fff;--ss:#6741d9;--kk:#0b7285;--b:#d0700f;--ok:#2b8a3e;--warn:#c92a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif}
header{background:linear-gradient(135deg,#1c5fbf,#2f8fe0);color:#fff;padding:18px 16px 22px}

main{max-width:780px;margin:14px auto 40px;padding:0 16px}
nav.sec{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}nav.sec button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}

ol.sec{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
ol.sec li{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}ol.sec li.dogru{border-color:var(--ok);background:#ebfbee;font-weight:800}
.adim{border-left:4px solid var(--c);padding:6px 12px;margin:8px 0;background:#fff;border-radius:0 10px 10px 0;animation:gel .35s ease-out}
.adim b{color:var(--c)}@keyframes gel{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dug{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
button.btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.dikkat{background:#fff4e6;border:2px solid #f59f00;border-radius:12px;padding:10px 14px;margin:12px 0 4px}.dikkat b{color:#d9480f}
.tuzak{font-size:15px;color:var(--muted);margin-top:8px}
.cevap{font-weight:900;color:var(--ok);margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid var(--line);padding:8px 10px;text-align:left}th{background:#e3fafc;color:#0b7285;font-size:13px;letter-spacing:.06em}
.ses{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border-radius:12px;background:#eef2ff}

.ses span{font-size:14px;color:var(--muted)}
.gizli{display:none}
.tum{margin:4px 0 14px;font-size:14px}.tum a{color:#1c5fbf;font-weight:800}
@media (prefers-reduced-motion:reduce){.adim{animation:none}}
/* Canlandır (05.10.2026) */
.sek{display:flex;gap:6px;margin:12px 0 0;border-bottom:2px solid var(--line)}
.sek button{border:0;background:none;font:inherit;font-weight:900;font-size:15px;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);min-height:44px;position:relative;top:2px;border-bottom:3px solid transparent}
.sek button[aria-selected=true]{color:var(--c);border-bottom-color:var(--c);background:#fff8f0}
.sek .yeni{display:inline-block;font-size:10px;background:#2b8a3e;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.06em}
.cn{padding-top:10px}
.cn-yon{background:#eef6ff;border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:10px}
.cn-sahne{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;min-height:120px;overflow-x:auto}

.cn-adimci input,.cn-test input{width:84px;height:44px;border:2px solid var(--line);border-radius:12px;font:inherit;font-weight:900;text-align:center;font-size:18px}
.cn-test label{font-weight:800;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.cn-btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
.cn-btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.cn-btn[aria-pressed=true]{background:var(--ac,var(--c));color:#fff;border-color:var(--ac,var(--c))}
.cn-btn:disabled{opacity:.5}
.cn-hazir{display:flex;flex-wrap:wrap;gap:6px}

.cn-dur .iyi{color:var(--ok);font-weight:900}.cn-dur .kotu{color:var(--warn);font-weight:900}
.cn-df{margin-top:10px;overflow-x:auto}@media(max-width:480px){.cn-adimci>span{flex-basis:100%}.cn-h{font-size:12px;padding:5px 0}.cn-izg{gap:3px}.cn-sahne{padding:6px}}@media(max-width:480px){.cn-df table{font-size:13px}.cn-df td,.cn-df th{padding:4px 5px}}.cn-df summary{font-weight:900;cursor:pointer;padding:6px 0}.cn-say{color:var(--muted);font-weight:700}
.cn-df table{font-size:15px}.cn-df td{padding:5px 8px}.cn-df tr.cn-iyi td{background:#ebfbee}.cn-df tr.cn-kotu td{background:#fff5f5}.cn-df tr.cn-son td{outline:2px solid var(--c);outline-offset:-2px}
.cn-p{animation:cnGel .35s ease-out both}@keyframes cnGel{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cn-o{fill:#ffa94d;stroke:#d9480f;stroke-width:1}.cn-o2{fill:#e8590c}.cn-k{fill:#ffc9c9;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:3 2}
.cn-cerceve{stroke:#2b8a3e;stroke-width:3}.cn-et{font-size:13px;font-weight:800;fill:#5b6478}.cn-et.b,.cn-et2b{font-weight:900;fill:#1d2433}.cn-et2{font-size:11px;fill:#5b6478;font-weight:700}.cn-et2b{font-size:13px;fill:#fff}
.cn-ku{fill:#fff4e6;stroke:#ffa94d;stroke-width:1.5}.cn-kk{fill:#fff5f5;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:4 3}
.cn-tahta0{fill:#f1f3f5;stroke:#ced4da}.cn-tahta{fill:#c08552;stroke:#8d5a2b}
.cn-ek{stroke:#868e96;stroke-width:2}.cn-sinir{stroke:#c92a2a;stroke-width:3;stroke-dasharray:5 4}.cn-yay{fill:none;stroke:#f76707;stroke-width:2}
.cn-v1{stroke:#2b8a3e;stroke-width:3}.cn-v2{stroke:#c92a2a;stroke-width:3}.cn-kis{font-size:20px}.cn-bus{font-size:16px}.cn-bek{stroke:#c92a2a;stroke-width:5;stroke-linecap:round;opacity:.6}
.cn-kum{fill:#ffe8cc;stroke:#e8590c;stroke-width:3}.cn-kum2{fill:#495057}.cn-para{fill:#ffd43b;opacity:.85}.cn-buyuk{font-size:26px;font-weight:900;fill:#1d2433}
.cn-zem{fill:#adb5bd}.cn-kat{fill:#f1f3f5;stroke:#ced4da}.cn-katon{fill:#d3f9d8;stroke:#2b8a3e}.cn-katoff{fill:#ffe3e3;stroke:#e03131}
.cn-izg{display:grid;gap:4px}.cn-h,.cn-gb{border-radius:8px;text-align:center;font-weight:800;font-size:14px;padding:6px 0}.cn-h{background:#f1f3f5;transition:background .25s,transform .25s}
.cn-gb{background:none;color:var(--muted);font-size:12px}.cn-h.on{background:#ffa94d;color:#1d2433}.cn-h.yeni{transform:scale(1.18);box-shadow:0 0 0 3px #e8590c}
.cn-kartlar{display:flex;flex-wrap:wrap;gap:6px;padding:4px}.cn-kart{min-width:44px;padding:8px 10px;text-align:center;border-radius:10px;background:#fff4e6;border:2px solid #ffa94d;font-weight:900;animation:cnGel .3s}
.cn-kart.kare{background:#e7f5ff;border-color:#1c7ed6}.cn-bosk{color:var(--muted)}
.cn-cift{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 4px;font-weight:800}.cn-cift i{font-weight:600;color:#1c7ed6}
.cn-katlar{padding:4px}.cn-katsat{display:inline-flex;flex-wrap:wrap;gap:6px}.cn-kat2{background:#e6fcf5;border:1.5px solid #12b886;border-radius:8px;padding:3px 8px;font-weight:800;animation:cnGel .3s}.cn-sonsuz{font-weight:800;color:#0b7285}
.cn-onr{background:#f8f0fc;border:2px solid #ae3ec9;border-radius:12px;padding:10px 14px}.cn-kanit{padding:10px 4px 2px}
.cn-kay{display:inline-flex;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap}.cn-kay{max-width:100%}.cn-kay input{width:min(220px,70vw);accent-color:#d0700f}.cn-satir>*{min-width:0;max-width:100%}
@media (prefers-reduced-motion:reduce){.cn-p,.cn-kart,.cn-kat2{animation:none}.cn-h{transition:none}}
/* 05.10.2026 · KOŞUL ve LABİRENT motorları (SB 6.1.1) */
@media(max-width:560px){.soru [style*="grid-template-columns:repeat"]{grid-template-columns:1fr!important}}   /* çok sütunlu konuşma balonları telefonda alt alta */
.cn-kl{list-style:none;padding:0;margin:0;display:grid;gap:4px}.cn-not{color:var(--muted);font-size:14px}.cn-sonuc{margin-top:6px;font-weight:800}
.cn-secg{gap:6px}.cn-secad{font-weight:800;flex-basis:100%}.cn-secg .cn-btn{padding:8px 12px}
.cn-mv{fill:#74c0fc;stroke:#1c7ed6;stroke-width:1}.cn-tl{fill:#69db7c;stroke:#2b8a3e;stroke-width:1.5}
.cn-lab{display:grid;gap:4px;align-items:center;max-width:460px;margin:0 auto}
.cn-lc{min-height:44px;border-radius:8px;border:1.5px solid #ced4da;background:#fff;font:inherit;font-weight:900;font-size:16px;cursor:pointer;padding:0;color:var(--ink)}
.cn-lc.yol{background:#d3f9d8;border-color:#2b8a3e}.cn-lc.simdi{background:#2b8a3e;color:#fff;box-shadow:0 0 0 3px #b2f2bb}.cn-lc.kapali{background:#ffe3e3;border-color:#e03131;color:#c92a2a;text-decoration:line-through}
.cn-lok{color:#2b8a3e;font-weight:900;text-align:center}.cn-lcik{min-height:44px;border:0;background:none;font:inherit;font-weight:900;color:#d9480f;cursor:pointer;padding:0;white-space:nowrap;font-size:14px}.cn-lcik:disabled{cursor:default}

</style></head><body>
<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }
      if (!art && !o.sandalye) sv += `<rect x="10" y="10" width="${gen * hc}" height="${sira * hc}" fill="none" class="cn-cerceve"/>
        <text x="${10 + gen * hc / 2}" y="${H + 4}" class="cn-et" text-anchor="middle">${gen} ${o.birim || ""}</text>
        <text x="${W + 4}" y="${10 + sira * hc / 2}" class="cn-et" dominant-baseline="middle">${sira} ${o.birim || ""}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W + 70} ${H + 22}" role="img" aria-label="${N} ${o.ad || "kare"}, her sırada ${gen}">${sv}</svg>`;
      const r = o.kural ? o.kural(gen, sira, art, N) : null;
      let m;
      if (art) m = `<span class="kotu">✘</span> ${N} ${o.ad || "kare"} her sırada ${gen} olacak biçimde dizilince ${sira} tam sıra oluşur, <b>${art} ${o.ad || "kare"} artar</b>. Dikdörtgen olmaz: ${N} : ${gen} işleminde kalan ${art}.`;
      else m = `<span class="iyi">✔</span> <b>${N} = ${gen} ${x} ${sira}</b> · ${sira} sıra, her sırada ${gen} ${o.ad || "kare"}; hiç artmadı.` + (gen === sira ? ` <b>Kare oldu!</b> İki kenar aynı: ${gen}.` : "");
      if (!art && o.cevre) m += ` Çevre = 2 ${x} (${gen} + ${sira}) = <b>${2 * (gen + sira)} m</b>.`;
      if (r && r.msg) m += `<br>${r.msg}`;
      s.dur.innerHTML = m;
      const sutunlar = o.satir ? o.satir(gen, sira, art, N, r) : [gen, art ? `${sira} (+ ${art} artan)` : sira, art, art ? "olmaz" : (gen === sira ? "kare" : "dikdörtgen")];
      s.yaz(N + ":" + gen, sutunlar, !art && (!r || r.ok !== false));
    }
    ciz(g.get());
  }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {
    const N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });
    const g = adimci(o.etiket, 1, o.max || N, o.bas || 2, v => { sonK = v; });

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {

    const tamamMi = () => { for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) return false; return true; };
    const eksik = () => { const L = []; for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) L.push(i); return ` <br>Henüz denenmeyen küçük bölenler var: <b>${L.join(", ")}</b>. Bunları da deneyin.`; };
    function dene(d) {

      else { s.dur.innerHTML = `<span class="kotu">✘</span> ${N} : ${d} işleminde bölüm ${b}, <b>kalan ${r}</b>. ${d}, ${E(N,"in")} çarpanı değildir.` + (d * d > N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} > ${N}. Daha büyük bölen denemeye gerek yok; çarpan listesi tamam.` : eksik() : ""); }
      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));

      for (let i = 1; i <= (o.katSay || 12); i++) { sat.appendChild(h("span", "cn-kat2", `${N * i}`)); await bekle(220); }

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */
  function KUMBARA(el, o) {

  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →
     koşullar tek tek denetlenir (✔/✘) → deney defterine yazılır. Doğru cevap verilmez; öğrenci uygun girdiyi kendisi arar.
     o.girdi: [{ad, min, max, bas} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → SVG/HTML · o.kosullar: [{ad, f(v) → bool | {ok, not}}]
     o.dugme: düğme yazısı (false → her değişiklikte denetlenir) · o.sonuc(v, hepsi, L) · o.satir(v, hepsi, L) · o.iyi(v, L) · o.ek: [{ad, deger(v) → v}] */
  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);
      s.dur.innerHTML = m;
      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

/* ANA_KURALLAR §4.y-3: Etkinliklerde bütün kesirler kesir çizgisiyle (alt alta pay/payda) gösterilir. Düz yazılmış a/b biçimleri otomatik dönüştürülür. */
(function(){
  if (window.__kesirCizgi) return; window.__kesirCizgi = 1;
  const RX = /(^|[^\w\/.,:%])([−-])?(?:(\d+) )?(\d{1,4})\/(\d{1,4})(?![\w\/.,]\d|\w)/g;
  const ATLA = "script,style,svg,textarea,input,select,code,.ilr,.frac,[data-duz]";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function donustur(kok){
    if (!kok || !kok.nodeType) return;
    if (kok.nodeType === 3) kok = kok.parentElement;
    if (!kok || (kok.closest && kok.closest(ATLA))) return;
    const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      if (!/\d\/\d/.test(t.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = t.parentElement; if (!p || p.closest(ATLA)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const L = []; let t; while ((t = w.nextNode())) L.push(t);
    L.forEach(t => {
      let deg = false;
      const h = esc(t.nodeValue).replace(RX, (m, a, s, tam, p, q) => { deg = true;
        return a + (s ? "−" : "") + (tam ? tam + " " : "") + '<span class="frac"><span>' + p + "</span><span>" + q + "</span></span>"; });
      if (!deg) return;
      const k = document.createElement("span"); k.innerHTML = h; t.replaceWith(...k.childNodes);
    });
  }
  let bekleyen = new Set(), plan = 0;
  const calis = () => { plan = 0; const b = bekleyen; bekleyen = new Set(); b.forEach(donustur); };
  const gozcu = new MutationObserver(ms => { ms.forEach(m => {
      if (m.type === "characterData") bekleyen.add(m.target); else m.addedNodes.forEach(n => bekleyen.add(n)); });
    if (!plan) plan = requestAnimationFrame(calis); });
  const bas = () => { donustur(document.body); gozcu.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bas); else bas();
  const st = document.createElement("style");
  st.textContent = ".frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}.frac>span{display:block;text-align:center;padding:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor}";
  document.head.appendChild(st);
})();

/* SORU BANKASI · MAT.8.2.1 · Dik Koordinat Sistemi · 16 yeni nesil sorunun "Canlandır" düzenekleri (14.10.2026) — §4.k, §19-10/11

  document.head.appendChild(st);

  /* ---------- iskelet: yönerge, sahne, denetimler, durum, deney defteri ---------- */
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"), den = h("div", "cn-den"), dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın."); dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"), kayit = new Set();
    const yaz = (k, hucre, iyi) => {
      [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === k)); if (kayit.has(k)) return;
      kayit.add(k); const tr = h("tr", iyi === true ? "cn-iyi cn-son" : iyi === false ? "cn-kotu cn-son" : "cn-son"); tr.dataset.k = k;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz };
  }
  /* − değer + adımcı (değer kutusu yazılamaz; telefon klavyesinde eksi işareti sorunu olmasın diye) */
  function adimci(et, min, max, deger, deg, yaz) {
    const w = h("div", "c8-adim"); w.innerHTML = `<span>${et}</span><button type="button" class="cn-btn ghost" aria-label="${et.replace(/<[^>]+>/g, "")} azalt">−</button><b></b><button type="button" class="cn-btn ghost" aria-label="${et.replace(/<[^>]+>/g, "")} artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), o = w.querySelector("b"); let v = deger;
    const ayarla = x => { v = Math.max(min, Math.min(max, x)); o.innerHTML = yaz ? yaz(v) : tv(v); deg(v); };
    a.onclick = () => ayarla(v - 1); b.onclick = () => ayarla(v + 1); o.innerHTML = yaz ? yaz(v) : tv(v);
    return { w, ayarla };
  }
  /* Serbest deney: o.girdi [{ad, min, max, bas, yaz?} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) · o.sonuc(v) · o.satir(v) · o.iyi(v) */
  function DENEY(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun, ilk: o.ilk });
    const v = o.girdi.map(g => g.bas); let kur = false;
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); }; w.appendChild(b); return b; });
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }, g.yaz); w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    function degis() { if (!kur) return; const c = v.slice(); s.sah.innerHTML = o.ciz(c); s.dur.innerHTML = o.sonuc(c); s.yaz(c.join("|"), o.satir(c), o.iyi ? o.iyi(c) : null); }
    kur = true; degis();
  }

  /* ---------- sayı yardımcıları ---------- */
  const tv = x => { const r = Math.round(x * 10000) / 10000; return (r < 0 ? "−" : "") + String(Math.abs(r)).replace(".", ","); };
  const ik = (x, y, f = tv) => `(${f(x)}, ${f(y)})`;
  const kes = (p, q) => `<span class="frac"><span>${p}</span><span>${q}</span></span>`;
  const fr = (v, n = 2) => { const m = Math.round(v * n), s = m < 0 ? "−" : "", a = Math.abs(m), t = Math.floor(a / n), r = a % n; return r ? s + (t ? t + " " : "") + kes(r, n) : s + t; };
  const K = x => `<span class="krk"><span>${x}</span></span>`;
  const ok = (b, m) => b ? `<span class="c8-ok">✔ ${m}</span>` : `<span class="c8-no">✘ ${m}</span>`;
  const bolge = (x, y) => x === 0 && y === 0 ? "orijin" : y === 0 ? "x ekseni üzerinde" : x === 0 ? "y ekseni üzerinde" : x > 0 && y > 0 ? "I. bölge" : x < 0 && y > 0 ? "II. bölge" : x < 0 ? "III. bölge" : "IV. bölge";
  const MAVI = "#1c7ed6", TUR = "#e8590c", YES = "#2b8a3e", BOR = "#9b1c36", MOR = "#7048e8", GRI = "#868e96";

  /* ---------- dik koordinat sistemi çizici ----------
     o: x0, x1, y0, y1, u, kare, etiket, ara, eksen(false), sayi(false), pt [{x,y,t,c,yer,r,bos}], yol [{p,c,k,kesik,kapali,dolgu}], boya [{x,y,w,h,c,st,t}], ek(X,Y) */
  function dz(o) {
    const u = o.u || 30, k = o.kare || 1, { x0, x1, y0, y1 } = o, fs = o.fs || 14;
    const eks = o.eksen !== false, yE = eks && x0 <= 0 && 0 <= x1, xE = eks && y0 <= 0 && 0 <= y1, e = .6 * u;
    const sol = xE ? e + 14 : 14, alt = yE ? e + 14 : 14, ust = yE ? e + 26 : 14, sag = xE ? e + 22 : 14;
    const W = sol + (x1 - x0) / k * u + sag, H = ust + (y1 - y0) / k * u + alt, X = v => sol + (v - x0) / k * u, Y = v => ust + (y1 - v) / k * u, f = n => (+n).toFixed(1), s = [];
    const yazi = (x, y, t, c = "#111", an = "middle", w = 800, size = fs) => `<text x="${f(x)}" y="${f(y)}" font-size="${size}" font-weight="${w}" text-anchor="${an}" fill="${c}" stroke="#fff" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke">${t}</text>`;
    s.push(`<rect x="0" y="0" width="${f(W)}" height="${f(H)}" fill="#fff"/>`);
    (o.boya || []).forEach(b => { s.push(`<rect x="${f(X(b.x))}" y="${f(Y(b.y + b.h))}" width="${f(b.w / k * u)}" height="${f(b.h / k * u)}" fill="${b.c}"${b.st ? ` stroke="${b.st}" stroke-width="2.2"` : ""}/>`); if (b.t) s.push(yazi(X(b.x + b.w / 2), Y(b.y + b.h / 2) + 5, b.t, b.st || "#111")); });
    if (o.ara) { for (let v = x0; v <= x1 + 1e-9; v += o.ara) s.push(`<line x1="${f(X(v))}" y1="${f(Y(y0))}" x2="${f(X(v))}" y2="${f(Y(y1))}" stroke="#dfe5ef" stroke-width=".7"/>`);
      for (let v = y0; v <= y1 + 1e-9; v += o.ara) s.push(`<line x1="${f(X(x0))}" y1="${f(Y(v))}" x2="${f(X(x1))}" y2="${f(Y(v))}" stroke="#dfe5ef" stroke-width=".7"/>`); }
    for (let v = x0; v <= x1 + 1e-9; v += k) s.push(`<line x1="${f(X(v))}" y1="${f(Y(y0))}" x2="${f(X(v))}" y2="${f(Y(y1))}" stroke="#c9d1de" stroke-width="1"/>`);
    for (let v = y0; v <= y1 + 1e-9; v += k) s.push(`<line x1="${f(X(x0))}" y1="${f(Y(v))}" x2="${f(X(x1))}" y2="${f(Y(v))}" stroke="#c9d1de" stroke-width="1"/>`);
    (o.yol || []).forEach(r => { const P = r.p.map(([a, b]) => `${f(X(a))},${f(Y(b))}`).join(" ");
      s.push(r.kapali ? `<polygon points="${P}" fill="${r.dolgu || "none"}" stroke="${r.c}" stroke-width="${r.k || 3}"/>` : `<polyline points="${P}" fill="none" stroke="${r.c}" stroke-width="${r.k || 3}" stroke-linejoin="round" stroke-linecap="round"${r.kesik ? ' stroke-dasharray="7 5"' : ""}/>`); });
    if (eks) {
      if (xE) { const ya = Y(0), xa = X(x0) - e, xb = X(x1) + e; s.push(`<line x1="${f(xa + 4)}" y1="${f(ya)}" x2="${f(xb - 4)}" y2="${f(ya)}" stroke="#111" stroke-width="2"/><path d="M${f(xb)} ${f(ya)} l-10 -5.5 v11 z M${f(xa)} ${f(ya)} l10 -5.5 v11 z" fill="#111"/>` + yazi(xb + 5, ya + 6, "x", "#111", "start", 800, fs + 2)); }
      if (yE) { const xa = X(0), ya = Y(y1) - e, yb = Y(y0) + e; s.push(`<line x1="${f(xa)}" y1="${f(ya + 4)}" x2="${f(xa)}" y2="${f(yb - 4)}" stroke="#111" stroke-width="2"/><path d="M${f(xa)} ${f(ya)} l-5.5 10 h11 z M${f(xa)} ${f(yb)} l-5.5 -10 h11 z" fill="#111"/>` + yazi(xa, ya - 7, "y", "#111", "middle", 800, fs + 2)); }
      if (o.sayi !== false) { const et = o.etiket || k;
        if (xE) for (let v = Math.ceil(x0 / et) * et; v <= x1 + 1e-9; v += et) { if (Math.abs(v) < 1e-9) continue; s.push(`<line x1="${f(X(v))}" y1="${f(Y(0) - 4)}" x2="${f(X(v))}" y2="${f(Y(0) + 4)}" stroke="#111" stroke-width="1.4"/>` + yazi(X(v), Y(0) + fs + 3, tv(v), "#111", "middle", 700)); }
        if (yE) for (let v = Math.ceil(y0 / et) * et; v <= y1 + 1e-9; v += et) { if (Math.abs(v) < 1e-9) continue; s.push(`<line x1="${f(X(0) - 4)}" y1="${f(Y(v))}" x2="${f(X(0) + 4)}" y2="${f(Y(v))}" stroke="#111" stroke-width="1.4"/>` + yazi(X(0) - 7, Y(v) + fs * .35, tv(v), "#111", "end", 700)); }
        if (xE && yE) s.push(yazi(X(0) - 6, Y(0) + fs + 3, "0", "#111", "end", 700)); } }
    (o.pt || []).forEach(p => { const x = X(p.x), y = Y(p.y), r = p.r || 6;
      s.push(p.bos ? `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="#fff" stroke="${p.c || MAVI}" stroke-width="3"/>` : `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${p.c || MAVI}" stroke="#fff" stroke-width="1.5"/>`);
      if (p.t) { const yer = p.yer || "ne", dx = { ne: 9, nw: -9, se: 9, sw: -9, n: 0, s: 0, e: 11, w: -11 }[yer], dy = { ne: -8, nw: -8, se: fs + 5, sw: fs + 5, n: -11, s: fs + 8, e: 5, w: 5 }[yer];
        s.push(yazi(x + dx, y + dy, p.t, p.c || MAVI, /e$/.test(yer) ? "start" : /w$/.test(yer) ? "end" : "middle", 800, fs + 1)); } });
    if (o.ek) s.push(o.ek(X, Y, yazi));
    return `<svg class="c8-dz" viewBox="0 0 ${f(W)} ${f(H)}" role="img" aria-label="${o.aria || "Dik koordinat sistemi"}">${s.join("")}</svg>`;
  }
  /* ızgara boyunca L biçimli rota (önce yatay, sonra dikey) */
  const L = (a, b) => [a, [b[0], a[1]], b];
  const uz = (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]);
  const sg = v => (v < 0 ? "−" : "") + Math.abs(v);
  const IK = (x, y) => `(${x}, ${y})`;

  return {
    /* 1 · sinema bileti D8 → (3, 4) */
    1: el => { const H = "ABCDE"; const yer = (h_, n) => [n <= 5 ? n - 6 : n - 5, H.indexOf(h_) + 1];
      DENEY(el, { girdi: [{ ad: "Sıra harfi:", sec: [...H], bas: "A" }, { ad: "Koltuk numarası:", min: 1, max: 10, bas: 1 }],
        ciz: ([h_, n]) => { const [x, y] = yer(h_, n), pt = [];
          for (const c of H) for (let k = 1; k <= 10; k++) { const [a, b] = yer(c, k); if (a !== x || b !== y) pt.push({ x: a, y: b, c: "#adb5bd", r: 5 }); }
          pt.push({ x, y, c: TUR, r: 9, t: h_ + n, yer: x < 0 ? "nw" : "ne" });
          return dz({ x0: -6, x1: 6, y0: 0, y1: 6, u: 30, pt, ek: (X, Y, yazi) => [1, 2, 3, 4, 5].map(i => yazi(X(6) - 2, Y(i) + 5, H[i - 1], BOR, "end")).join("") }); },
        sonuc: ([h_, n]) => { const [x, y] = yer(h_, n); return `Bilet <b>${h_}${n}</b> → ordinat: ${h_} perdeden ${y}. sıra = <b>${y}</b>; apsis: ${n <= 5 ? `koridorun solunda, ${6 - n}. koltuk` : `koridorun sağında, ${n - 5}. koltuk`} = <b>${sg(x)}</b><br>Koltuk: <b class="c8-b">${IK(sg(x), y)}</b>`
          + (h_ === "D" && n === 8 ? `<br>${ok(true, "Selin'in koltuğu bulundu.")}` : ""); },
        sutun: ["Bilet", "Sıralı ikili"], satir: ([h_, n]) => { const [x, y] = yer(h_, n); return [h_ + n, IK(sg(x), y)]; }, iyi: ([h_, n]) => h_ === "D" && n === 8 ? true : null,
        yon: "Sıra harfini ve koltuk numarasını değiştirin; koltuğun hangi sıralı ikiliyle gösterildiğine bakın. Koridorun sağındaki 6 numaranın apsisinin 1 olduğuna dikkat edin.", bitis: "D8 koltuğunun sıralı ikilisini bulduğunuzda." }); },

    /* 2 · kuruyan fidanın yeri (−5, −4) */
    2: el => { const F = [[-5, 3], [2, 3], [2, -4]];
      DENEY(el, { girdi: [{ ad: "Yeni fidanın apsisi:", sec: [-5, -4, -2, 2, 5], bas: -4, yaz: sg }, { ad: "Yeni fidanın ordinatı:", sec: [-5, -4, 3], bas: -5, yaz: sg }],
        ciz: ([a, b]) => { const d = a === -5 && b === -4;
          return dz({ x0: -6, x1: 6, y0: -6, y1: 4, u: 22, yol: [{ p: [...F, [a, b], F[0]], c: d ? YES : TUR, k: 3, kesik: !d }], pt: [...F.map(([x, y]) => ({ x, y, c: YES, r: 7 })), { x: a, y: b, c: TUR, r: 8, t: "yeni", yer: "sw" }] }); },
        sonuc: ([a, b]) => { const d1 = a === -5, d2 = b === -4;
          return `Yeni fidan <b>${IK(sg(a), sg(b))}</b>: (−5, 3) ile aynı dikey hizada ${d1 ? "✔" : "değil ✘"} · (2, −4) ile aynı yatay hizada ${d2 ? "✔" : "değil ✘"}<br>` + (d1 && d2 ? ok(true, "Dört kenarın hepsi eksenlere paralel: dikdörtgen tamamlandı.") : ok(false, "Kenarlardan en az biri eksenlere paralel değil.")); },
        sutun: ["Yeni fidan", "Dikdörtgen mi?"], satir: ([a, b]) => [IK(sg(a), sg(b)), a === -5 && b === -4 ? "Evet" : "Hayır"], iyi: ([a, b]) => a === -5 && b === -4,
        yon: "Yeni fidanın apsisini ve ordinatını seçin; dört fidanı birleştiren şeklin kenarlarının eksenlere paralel olup olmadığına bakın.", bitis: "Kenarları eksenlere paralel dikdörtgeni elde ettiğinizde." }); },

    /* 3 · gezi rehberi: yer – nokta eşleştirme */
    3: el => { const P = { P: [-4, 0], R: [3, -2], S: [0, 5], T: [-2, 3] }, Y = { "Müze": "P", "Park": "R", "Okul": "S", "Hastane": "T" };
      const tarif = { "Müze": "kulenin tam batısı", "Park": "kulenin güneydoğusu", "Okul": "kulenin tam kuzeyi", "Hastane": "kulenin kuzeybatısı" };
      const yon = ([x, y]) => x === 0 ? (y > 0 ? "tam kuzey" : "tam güney") : y === 0 ? (x > 0 ? "tam doğu" : "tam batı") : (y > 0 ? "kuzey" : "güney") + (x > 0 ? "doğu" : "batı");
      DENEY(el, { girdi: [{ ad: "Yer:", sec: Object.keys(Y), bas: "Müze" }, { ad: "Nokta:", sec: Object.keys(P), bas: "T" }],
        ciz: ([y_, n]) => dz({ x0: -5, x1: 4, y0: -3, y1: 6, u: 26, pt: Object.entries(P).map(([k, [x, y]]) => ({ x, y, t: k, c: k === n ? TUR : GRI, r: k === n ? 8 : 5, yer: x < 0 ? "nw" : "ne" })) }),
        sonuc: ([y_, n]) => { const p = P[n], ek = { "tam kuzey": "tam kuzeyinde", "tam güney": "tam güneyinde", "tam doğu": "tam doğusunda", "tam batı": "tam batısında", kuzeydoğu: "kuzeydoğusunda", kuzeybatı: "kuzeybatısında", güneydoğu: "güneydoğusunda", güneybatı: "güneybatısında" };
          return `${y_}: “${tarif[y_]}”. ${n} ${IK(sg(p[0]), sg(p[1]))} noktası kulenin <b>${ek[yon(p)]}</b>dır (${bolge(...p)}).<br>` + (Y[y_] === n ? ok(true, `${y_} – ${n} eşleşmesi doğru.`) : ok(false, "Tarif ile noktanın yönü uyuşmuyor.")); },
        sutun: ["Yer", "Nokta", "Uyuyor mu?"], satir: ([y_, n]) => [y_, n, Y[y_] === n ? "Evet" : "Hayır"], iyi: ([y_, n]) => Y[y_] === n,
        yon: "Bir yer ve bir nokta seçin; noktanın kuleye göre yönünü tarifle karşılaştırın. “Tam batı” x ekseni üzerinde, “kuzeybatı” II. bölgededir.", bitis: "Dört yerin her biri için uyan noktayı bulduğunuzda." }); },

    /* 4 · Türk daması: art arda atlama */
    4: el => { const S0 = [[3, 3], [4, 4], [6, 4], [1, 7], [7, 6]], YOL = [[3, 2], [3, 4], [5, 4], [7, 4]], AL = [[3, 3], [4, 4], [6, 4]];
      DENEY(el, { girdi: [{ ad: "Atlama sayısı:", min: 0, max: 3, bas: 0 }],
        ciz: ([n]) => { const u = 34, so = 30, W = so + 8 * u + 8, H = 8 * u + 34, q = [`<rect width="${W}" height="${H}" fill="#fff"/>`];
          const X = c => so + (c - .5) * u, Yy = r => 4 + (8 - r + .5) * u;
          for (let c = 1; c <= 8; c++) for (let r = 1; r <= 8; r++) q.push(`<rect x="${so + (c - 1) * u}" y="${4 + (8 - r) * u}" width="${u}" height="${u}" fill="${(c + r) % 2 ? "#f3e3c3" : "#e2c391"}"/>`);
          for (let c = 1; c <= 8; c++) q.push(`<text x="${X(c)}" y="${H - 8}" font-size="15" font-weight="800" text-anchor="middle">${c}</text>`);
          for (let r = 1; r <= 8; r++) q.push(`<text x="${so - 9}" y="${Yy(r) + 5}" font-size="15" font-weight="800" text-anchor="end">${r}</text>`);
          const alinan = AL.slice(0, n).map(String);
          S0.forEach(p => { if (!alinan.includes(String(p))) q.push(`<circle cx="${X(p[0])}" cy="${Yy(p[1])}" r="12" fill="#2b2f36"/>`); });
          if (n) q.push(`<polyline points="${YOL.slice(0, n + 1).map(([c, r]) => `${X(c)},${Yy(r)}`).join(" ")}" fill="none" stroke="${TUR}" stroke-width="4" stroke-dasharray="7 5"/>`);
          const w = YOL[n]; q.push(`<circle cx="${X(w[0])}" cy="${Yy(w[1])}" r="12" fill="#fff" stroke="#5b6478" stroke-width="2.5"/>`);
          return `<svg class="c8-dz" viewBox="0 0 ${W} ${H}" role="img" aria-label="Dama tahtası">${q.join("")}</svg>`; },
        sonuc: ([n]) => { const w = YOL[n]; return n ? `${n}. atlama: ${IK(...AL[n - 1])} karesindeki taş alındı. Beyaz taş <b class="c8-b">${IK(...w)}</b> karesinde.` + (n === 3 ? `<br>${ok(true, "Alınacak başka taş yok: beyaz taş burada durur.")}` : "<br>Alınabilecek taş var mı? Bir atlama daha deneyin.") : "Beyaz taş (3, 2) karesinde; önünde (3, 3)'te siyah taş var."; },
        sutun: ["Atlama", "Beyaz taşın karesi"], satir: ([n]) => [n, IK(...YOL[n])], iyi: ([n]) => n === 3 ? true : null,
        yon: "Atlama sayısını birer birer artırın; beyaz taşın hangi taşın üzerinden atladığını ve hangi karede durduğunu izleyin. Önce sütun, sonra satır numarası yazılır.", bitis: "Alınacak taş kalmadığında." }); },

    /* 5 · robot süpürge: yarım metrelik adımlar */
    5: el => { const K = [["5 adım doğu", 2.5, 0], ["3 adım kuzey", 0, 1.5], ["7 adım batı", -3.5, 0]];
      const yer = n => K.slice(0, n).reduce(([x, y], [, a, b]) => [x + a, y + b], [0, 0]);
      DENEY(el, { girdi: [{ ad: "Uygulanan komut:", min: 0, max: 3, bas: 0 }],
        ciz: ([n]) => { const P = [[0, 0]]; for (let i = 1; i <= n; i++) P.push(yer(i)); const p = yer(n);
          return dz({ x0: -3, x1: 3, y0: -2, y1: 3, u: 40, ara: .5, yol: [{ p: P, c: TUR, k: 4 }], pt: [{ x: 0, y: 0, c: "#495057", r: 7 }, { x: p[0], y: p[1], c: MAVI, r: 9, t: "robot", yer: "ne" }] }); },
        sonuc: ([n]) => { const p = yer(n); return n ? `${n}. komut: <b>${K[n - 1][0]}</b> (${K[n - 1][0].split(" ")[0]} · 1/2 m) · Robot <b class="c8-b">(${fr(p[0])}, ${fr(p[1])})</b> noktasında.` + (n === 3 ? `<br>${ok(true, "Doğu ve batı adımları apsisi, kuzey adımları ordinatı değiştirdi.")}` : "") : "Robot şarj istasyonunda: (0, 0)."; },

    /* 6 · voleybol: hücum bölgesi */
    6: el => { const O = { Ece: [-2, 3, "−2"], Selin: [-2.5, -2, "−5/2"], Zeynep: [-4, 1, "−4"], Defne: [-3, -3, "−3"], "İpek": [-Math.sqrt(8), 2, "−√8"], Nil: [-8, 0, "−8"] }; const gor = new Set();

        sutun: ["Oyuncu", "Fileye uzaklık", "Hücum bölgesinde mi?"], satir: ([a]) => [a, a === "İpek" ? "√8 ≈ 2,83" : tv(Math.abs(O[a][0])), Math.abs(O[a][0]) < 3 ? "Evet" : "Hayır"], iyi: ([a]) => Math.abs(O[a][0]) < 3,
        yon: "Oyuncuları sırayla seçin; turuncu kesikli çizgi oyuncunun fileye uzaklığını gösterir. 3 m'den az olanları sayın.", bitis: "Altı oyuncunun hepsini incelediğinizde." }); },

    /* 7 · koordinat tombalası */
    7: el => { const N = [[3, -1], [-2, 2], [0, -3], [-1, -2], [4, 1]];
      const KART = { Ali: [["3", "−1", 3, -1], ["2", "−2", 2, -2], ["0", "−3", 0, -3]], Can: [["−1", "−2", -1, -2], ["√16", "1", 4, 1], ["−3", "0", -3, 0]],
        Deniz: [["−√4", "2", -2, 2], ["1", "−2", 1, -2], ["4", "1", 4, 1]], Ece: [["√9", "−1", 3, -1], ["−4/2", "2", -2, 2], ["0", "−√9", 0, -3]] };
      const var_ = (x, y) => N.some(([a, b]) => a === x && b === y);
      DENEY(el, { girdi: [{ ad: "Öğrenci:", sec: Object.keys(KART), bas: "Ali" }],
        ciz: ([a]) => dz({ x0: -4, x1: 5, y0: -4, y1: 3, u: 28, pt: [...N.map(([x, y], i) => ({ x, y, c: GRI, r: 6, t: String(i + 1), yer: x < 0 ? "nw" : "ne" })),

          return K.map(([p, q, x, y]) => `(${p}, ${q}) = ${IK(sg(x), sg(y))} ${var_(x, y) ? "✔" : "✘"}`).join(" · ") + "<br>" + (h ? ok(true, `${a}: “Tombala!”`) : ok(false, `${a}'nin kartında işaretli olmayan bir ikili var.`)); },
        sutun: ["Öğrenci", "İşaretli ikili sayısı"], satir: ([a]) => [a, KART[a].filter(([, , x, y]) => var_(x, y)).length + " / 3"], iyi: ([a]) => KART[a].every(([, , x, y]) => var_(x, y)),
        yon: "Öğrencileri sırayla seçin; karttaki ikililer sadeleştirilip çizimde halkayla gösterilir. Yeşil halka işaretli bir noktaya oturur.", bitis: "“Tombala!” diyen öğrenciyi bulduğunuzda." }); },

    /* 8 · metro aktarması */
    8: el => { const S = { Kale: [-3.5, 0], Liman: [4.5, 0], Merkez: [0, 0], Hastane: [0, 2.5], "Üniversite": [0, -4] };
      const yol = (a, b) => { const p = S[a], q = S[b]; if (p[1] === 0 && q[1] === 0 || p[0] === 0 && q[0] === 0) return [[p, q], Math.abs(p[0] - q[0]) + Math.abs(p[1] - q[1])];

      DENEY(el, { girdi: [{ ad: "Biniş:", sec: Object.keys(S), bas: "Kale" }, { ad: "İniş:", sec: Object.keys(S), bas: "Liman" }],
        ciz: ([a, b]) => { const [P] = yol(a, b); return dz({ x0: -4, x1: 5, y0: -5, y1: 3, u: 26, yol: [{ p: [[-4, 0], [5, 0]], c: "#ffc9c9", k: 8 }, { p: [[0, -5], [0, 3]], c: "#a5d8ff", k: 8 }, { p: P, c: TUR, k: 4 }],
          pt: Object.entries(S).map(([k, [x, y]]) => ({ x, y, t: k, c: k === a || k === b ? TUR : GRI, r: 6, yer: y === 0 ? (x < 0 ? "sw" : "se") : "e" })) }); },

        sutun: ["Yolculuk", "Yol (km)"], satir: ([a, b]) => [`${a} → ${b}`, tv(yol(a, b)[1])], iyi: ([a, b]) => a === "Kale" && b === "Hastane" ? true : null,

    /* 9 · koordinat kapmaca */
    9: el => { const O = { Ali: [3, 2], Banu: [-1, -4], Can: [0, 3], Deniz: [2, -5] };
      const yer = ([x, y], n) => [n >= 1 ? -x : x, n >= 2 ? -y : y];
      DENEY(el, { girdi: [{ ad: "Uygulanan komut:", min: 0, max: 2, bas: 0 }],
        ciz: ([n]) => dz({ x0: -6, x1: 6, y0: -6, y1: 6, u: 22, etiket: 2, pt: Object.entries(O).map(([k, p]) => { const [x, y] = yer(p, n); return { x, y, t: k, c: k === "Deniz" ? TUR : MAVI, r: 7, yer: x < 0 ? "nw" : "ne" }; }) }),
        sonuc: ([n]) => (n ? `${n}. komut: ${n === 1 ? "apsislerin" : "ordinatların"} işareti değişti.<br>` : "Başlangıç.<br>") + Object.entries(O).map(([k, p]) => { const q = yer(p, n); return `${k} ${IK(sg(q[0]), sg(q[1]))}: ${bolge(...q)}`; }).join(" · "),
        sutun: ["Komut", "II. bölgede"], satir: ([n]) => [n, Object.entries(O).filter(([, p]) => bolge(...yer(p, n)) === "II. bölge").map(([k]) => k).join(", ") || "—"], iyi: () => null,
        yon: "Komutları birer birer uygulayın; her öğrencinin yeni noktasını ve bölgesini izleyin. 0'ın işaretinin değişmediğine dikkat edin.", bitis: "İki komuttan sonra II. bölgedeki öğrenciyi bulduğunuzda." }); },

    /* 10 · kilit deseni */
    10: el => { const D = [[-1, 1], [0, 0], [1, 1], [1, 0], [0, -1]];
      DENEY(el, { girdi: [{ ad: "Çizilen nokta sayısı:", min: 1, max: 5, bas: 1 }],
        ciz: ([n]) => { const pt = []; for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) pt.push({ x: i, y: j, c: "#adb5bd", r: 6 });
          D.slice(0, n).forEach(([x, y], i) => pt.push({ x, y, c: i === 0 ? "#f59f00" : MAVI, r: 9, t: String(i + 1), yer: "ne" }));

        sutun: ["Nokta", "Sıralı ikili"], satir: ([n]) => [n, IK(sg(D[n - 1][0]), sg(D[n - 1][1]))], iyi: ([n]) => n === 5 ? true : null,

    /* 11 · orman yangın ihbarları */
    11: el => { const I = [[2, -0.5, "(2, −1/2)"], [-0.75, -5, "(−3/4, −5)"], [0, 3.5, "(0, 7/2)"], [-2.5, 1, "(−5/2, 1)"], [4, 3, "(4, 3)"], [1 / 3, -2, "(1/3, −2)"], [3.5, -6, "(7/2, −6)"], [-6, 0, "(−6, 0)"]];
      const E = { "I. bölge": "Kartal", "II. bölge": "Şahin", "III. bölge": "Doğan", "IV. bölge": "Atmaca" }; const say = {};
      const ekip = (x, y) => E[bolge(x, y)] || "İtfaiye aracı";
      DENEY(el, { girdi: [{ ad: "İhbar:", min: 1, max: 8, bas: 1 }],
        ciz: ([n]) => { const [x, y] = I[n - 1]; return dz({ x0: -7, x1: 5, y0: -7, y1: 5, u: 20, etiket: 2, pt: [{ x, y, c: TUR, r: 8, t: "duman", yer: x < 0 ? "nw" : "ne" }],
          ek: (X, Y, yazi) => [["Kartal", 2.5, 4], ["Şahin", -3.5, 4], ["Doğan", -3.5, -6.3], ["Atmaca", 2.5, -6.3]].map(([t, a, b]) => yazi(X(a), Y(b), t, YES)).join("") }); },

          return `${n}. ihbar ${g}: ${bolge(x, y)} → <b>${e}</b><br>İncelenen ihbarlar: ${Object.keys(say).length} / 8 · ` + Object.entries(S).map(([k, v]) => `${k}: ${v}`).join(" · "); },
        sutun: ["İhbar", "Nokta", "Giden"], satir: ([n]) => [n, I[n - 1][2], ekip(I[n - 1][0], I[n - 1][1])], iyi: () => null,
        yon: "İhbarları sırayla seçin; noktanın bölgesine göre hangi ekibin gideceğine bakın. Eksen üzerindeki ihbarlara itfaiye aracı gider.", bitis: "Sekiz ihbarın hepsini incelediğinizde." }); },

    /* 12 · sınıf planında orijin seçimi */
    12: el => { const A = { K: [4, 2], L: [3, 3], M: [8, 8], N: [1, 2] }, Ece = [6, 5], Can = [3, 5];
      DENEY(el, { girdi: [{ ad: "Orijin adayı:", sec: Object.keys(A), bas: "L" }],
        ciz: ([k]) => { const [ox, oy] = A[k]; return dz({ x0: 0, x1: 9, y0: 0, y1: 8, u: 28, eksen: false,
          pt: [{ x: Ece[0], y: Ece[1], t: "Ece", c: MOR, r: 7, yer: "ne" }, { x: Can[0], y: Can[1], t: "Can", c: MOR, r: 7, yer: "nw" }, ...Object.entries(A).map(([t, [x, y]]) => ({ x, y, t, c: t === k ? TUR : GRI, r: t === k ? 8 : 5, yer: "se" }))],
          ek: (X, Y) => `<line x1="${X(0)}" y1="${Y(oy)}" x2="${X(9)}" y2="${Y(oy)}" stroke="#111" stroke-width="2.4"/><line x1="${X(ox)}" y1="${Y(0)}" x2="${X(ox)}" y2="${Y(8)}" stroke="#111" stroke-width="2.4"/>` }); },
        sonuc: ([k]) => { const [ox, oy] = A[k], e = [Ece[0] - ox, Ece[1] - oy], c = [Can[0] - ox, Can[1] - oy], d = e[0] === 2 && e[1] === 3 && c[0] === -1 && c[1] === 3;

        sutun: ["Orijin", "Ece", "Can"], satir: ([k]) => { const [ox, oy] = A[k]; return [k, IK(sg(Ece[0] - ox), sg(Ece[1] - oy)), IK(sg(Can[0] - ox), sg(Can[1] - oy))]; },
        iyi: ([k]) => k === "K",
        yon: "Orijin adaylarını sırayla seçin; eksenler o noktadan geçecek şekilde çizilir. Ece'nin ve Can'ın yeni koordinatlarını okuyun.", bitis: "Ece (2, 3) ve Can (−1, 3) olduğunda." }); },

    /* 13 · akıllı tahtada orijini sürükleme */
    13: el => { const A = [-3, 1], B = [2, -1];
      DENEY(el, { girdi: [{ ad: "Orijinin yeni yeri · apsis:", min: -5, max: 3, bas: 0, yaz: sg }, { ad: "Orijinin yeni yeri · ordinat:", min: -3, max: 4, bas: 0, yaz: sg }],
        ciz: ([ox, oy]) => dz({ x0: -6, x1: 4, y0: -4, y1: 5, u: 26, eksen: false,
          pt: [{ x: A[0], y: A[1], t: "A", c: BOR, r: 7, yer: "nw" }, { x: B[0], y: B[1], t: "B", c: MAVI, r: 7, yer: "se" }, { x: ox, y: oy, c: "#111", r: 4 }],
          ek: (X, Y) => `<line x1="${X(-6)}" y1="${Y(oy)}" x2="${X(4)}" y2="${Y(oy)}" stroke="#111" stroke-width="2.4"/><line x1="${X(ox)}" y1="${Y(-4)}" x2="${X(ox)}" y2="${Y(5)}" stroke="#111" stroke-width="2.4"/>` }),
        sonuc: ([ox, oy]) => { const a = [A[0] - ox, A[1] - oy], b = [B[0] - ox, B[1] - oy], d = a[0] === 1 && a[1] === -2;
          return `A <b>${IK(sg(a[0]), sg(a[1]))}</b> · B <b>${IK(sg(b[0]), sg(b[1]))}</b><br>` + (d ? ok(true, "A noktası (1, −2) oldu; B'nin yeni koordinatlarını okuyun.") : "A noktasının (1, −2) olması için orijini taşımaya devam edin."); },
        sutun: ["Orijin", "A", "B"], satir: ([ox, oy]) => [IK(sg(ox), sg(oy)), IK(sg(A[0] - ox), sg(A[1] - oy)), IK(sg(B[0] - ox), sg(B[1] - oy))], iyi: ([ox, oy]) => A[0] - ox === 1 && A[1] - oy === -2,
        yon: "Orijini − ve + düğmeleriyle taşıyın; noktalar yerinde kalır, koordinatları değişir. A'nın (1, −2) olduğu orijini bulun.", bitis: "A (1, −2) olduğunda B'nin koordinatlarını okuduğunuzda." }); },

    /* 14 · plaj şemsiyeleri */
    14: el => { const S = { 1: [-4, 2.5, "(−4, 5/2)"], 2: [1, 3, "(1, 3)"], 3: [5, 1.75, "(5, 7/4)"], 4: [-Math.sqrt(3), 4, "(−√3, 4)"], 5: [3, 2, "(3, 2)"], 6: [-2, -1, "(−2, −1)"] }; const uy = new Set();
      DENEY(el, { girdi: [{ ad: "Şemsiye:", sec: Object.keys(S), bas: "1" }],
        ciz: ([k]) => { const [x, y] = S[k]; return dz({ x0: -6, x1: 6, y0: -3, y1: 5, u: 22, boya: [{ x: -6, y: -3, w: 12, h: 3, c: "#d0ebff" }, { x: -1.5, y: 0, w: 3, h: 5, c: "#e6f4ea" }, { x: -6, y: 0, w: 12, h: 2, c: "#fff4e6" }],
          pt: [{ x, y, c: TUR, r: 8, t: k + ". şemsiye", yer: x < 0 ? "nw" : "ne" }] }); },
        sonuc: ([k]) => { const [x, y, g] = S[k], r1 = y >= 2, r2 = Math.abs(x) > 1.5; if (r1 && r2) uy.add(k);
          return `${k}. şemsiye ${g}: kıyıya uzaklık ${y > 0 ? (k === "3" ? "7/4" : tv(y)) + " m" : "— (denizde)"} ${r1 ? "✔" : "✘"} · koridora (y eksenine) uzaklık ${k === "4" ? "√3 ≈ 1,73" : tv(Math.abs(x))} m ${r2 ? "✔" : "✘"}<br>`
            + (r1 && r2 ? ok(true, "Kurallara uygun.") : ok(false, "Kurallardan en az birine uymuyor.")) + ` · Uygun bulunan: <b>${[...uy].sort().join(", ") || "—"}</b>`; },
        sutun: ["Şemsiye", "Kıyı kuralı", "Koridor kuralı"], satir: ([k]) => [k, S[k][1] >= 2 ? "✔" : "✘", Math.abs(S[k][0]) > 1.5 ? "✔" : "✘"], iyi: ([k]) => S[k][1] >= 2 && Math.abs(S[k][0]) > 1.5,
        yon: "Şemsiyeleri sırayla seçin. Turuncu şerit kıyıdan 2 m'den yakın kumsalı, yeşil şerit koridoru gösterir; şemsiye ikisinin de dışında ve kumsalda olmalıdır.", bitis: "Altı şemsiyenin hepsini incelediğinizde." }); },

    /* 15 · İHA: kare kenarını bulma */
    15: el => { const Kk = [-2, 3], Lk = [1, -1], P = { P: [3, 2], R: [2, 3], S: [3, -2], T: [6, 4] };
      DENEY(el, { girdi: [{ ad: "Bir karenin kenarı (m):", sec: [50, 100, 150, 200], bas: 50 }, { ad: "Nokta:", sec: Object.keys(P), bas: "R" }],
        ciz: ([s, n]) => dz({ x0: -6, x1: 7, y0: -3, y1: 5, u: 24, eksen: false, pt: [{ x: Kk[0], y: Kk[1], t: "K(−200, 300)", c: MOR, r: 6, yer: "nw" }, { x: Lk[0], y: Lk[1], t: "L(100, −100)", c: MOR, r: 6, yer: "sw" },
          ...Object.entries(P).map(([k, [x, y]]) => ({ x, y, t: k, c: k === n ? TUR : GRI, r: k === n ? 8 : 5, yer: "ne" }))] }),
        sonuc: ([s, n]) => { const uy = 3 * s === 300 && 4 * s === 400, p = P[n], c = [-200 + (p[0] - Kk[0]) * s, 300 + (p[1] - Kk[1]) * s];
          return `K'den L'ye 3 kare doğu = <b>${3 * s} m</b>, 4 kare güney = <b>${4 * s} m</b> (koordinatlara göre 300 m ve 400 m olmalı) ${uy ? "✔" : "✘"}<br>${n} noktası bu ölçekle <b>${IK(sg(c[0]), sg(c[1]))}</b>`
            + (uy && c[0] === 300 && c[1] === 200 ? `<br>${ok(true, "Sinyal bu noktadan geliyor.")}` : ""); },
        sutun: ["Kare (m)", "Nokta", "Koordinatlar"], satir: ([s, n]) => { const p = P[n]; return [s, n, IK(sg(-200 + (p[0] - Kk[0]) * s), sg(300 + (p[1] - Kk[1]) * s))]; },
        iyi: ([s, n]) => s === 100 && n === "P" ? true : s !== 100 ? false : null,
        yon: "Önce kare kenarını değiştirin; K ile L arasındaki kare sayısının koordinat farklarıyla uyuşup uyuşmadığına bakın. Sonra noktaları seçip koordinatlarını okuyun.", bitis: "(300, 200) noktasını bulduğunuzda." }); },

    /* 16 · havuzu dolaşan kedi */
    16: el => { const Ke = [-5, -2], Ma = [4, 3];
      const R = { "Havuzun içinden": [Ke, [4, -2], Ma], "Alttan dolaş": [Ke, [-5, -4], [4, -4], Ma], "Üstten dolaş": [Ke, [-5, 6], [4, 6], Ma] };

ock;width:4mm\"></span><span class=\"nw\">Park: P</span><span style=\"display:inline-block;width:4mm\"></span><span class=\"nw\">Okul: T</span><span style=\"display:inline-block;width:4mm\"></span><span class=\"nw\">Hastane: S</span>"], "secg": null, "c": "C", "a": ["Tam batı: x ekseni üzerinde, apsis negatif → P(−4, 0). Tam kuzey: y ekseni üzerinde, ordinat pozitif → S(0, 5).", "Güneydoğu (+, −): IV. bölge → R(3, −2). Kuzeybatı (−, +): II. bölge → T(−2, 3)."], "t": "A: “tam batı” ile “kuzeybatı” karıştırılmış", "d": "“Tam batı” x ekseni üzerinde (ordinat 0), “tam kuzey” y ekseni üzerinde (apsis 0) demektir. Kuzeybatı II. bölge, güneydoğu IV. bölgedir; “tam batı” ile “kuzeybatı”yı karıştırmayın.", "ses": "b03"}, {"no": 4, "on": "<p>Türk damasında taşlar bir kare ileri ya da yana (sağa, sola) gidebilir. Rakip taşın hemen ötesindeki kare boşsa taş, rakip taşın üzerinden atlayarak onu alır; aldıktan sonra yeniden alabileceği taş varsa atlamaya devam eder. Taşlar geri gidemez. Aşağıdaki tahtada kareler (sütun numarası, satır numarası) sıralı ikilisiyle adlandırılmıştır; beyaz taşın ileri yönü satır numarasının arttığı yöndür.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 2316 824\" width=\"2316\" style=\"width:150mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAEOAvgDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAEDAgQFBgcI/8QAPxAAAQMCBQEFBQYFAwQDAQAAAQACAwQRBRIhMUFRBhMiYXEUMlKBkSMzQqGx0RUkcpLBYuHwB0NTghY08YP/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/xAAjEQEBAAIDAQEAAwADAQAAAAAAAQIRAyExEkEEE1EUIjJx/9oADAMBAAIRAxEAPwDpgaLNoQN0WVl5XoFlZQAsggALIBAFkAgBSgCmyAApASyyAQAsrIAsgqiAEssgiCLKbIpCAgClSEEKbJZSgxsimyFBFkupSyCFNkspQLLJQFkgiykJZLIJsossgiAApIUBZIIsilQEUspsi oke=\"#495057\" stroke-width=\"2.3800000000000003\" fill-opacity=\".95\"/><text x=\"870.0\" y=\"232.2\" font-size=\"34\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">3 m</text><rect x=\"223.5\" y=\"661.5\" width=\"213.1\" height=\"57.0\" rx=\"13.299999999999999\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"2.66\" fill-opacity=\".95\"/><text x=\"330.0\" y=\"703.7\" font-size=\"38\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">ev sahibi</text><rect x=\"1091.0\" y=\"661.5\" width=\"278.1\" height=\"57.0\" rx=\"13.299999999999999\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"2.66\" fill-opacity=\".95\"/><text x=\"1230.0\" y=\"703.7\" font-size=\"38\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">konuk takım</text></g></svg>", "son": "<p>Antrenörün tabletinde ev sahibi takımın oyuncularının konumları şöyledir:</p><div style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:3mm;margin:0 auto;max-width:150mm\"><div style=\"border:.4mm solid #5b6478;border-radius:2.5mm;min-width:16mm;padding:2mm 3mm;text-align:center;font-size:11.5pt;color:#111111;background:#f7f8fb\"><div style=\"font-size:9pt;font-weight:700;margin-bottom:1mm\">Ece</div><span class=\"nw\">(−2, 3)</span></div><div style=\"border:.4mm solid #5b6478;border-radius:2.5mm;min-width:16mm;padding:2mm 3mm;text-align:center;font-size:11.5pt;color:#111111;background:#f7f8fb\"><div style=\"font-size:9pt;font-weight:700;margin-bottom:1mm\">Selin</div><span class=\"nw\">(−5/2, −2)</span></div><div style=\"border:.4mm solid #5b6478;border-radius:2.5mm;min-width:16mm;padding:2mm 3mm;text-align:center;font-size:11.5pt;color:#111111;background:#f7f8fb\"><div style=\"font-size:9pt;font-weight:700;margin-bottom:1mm\">Zeynep</div><span class=\"nw\">(−4, 1)</span></div><div style=\"border:.4mm solid #5b6478;border-radius:2.5mm;min-width:16mm;padding:2mm 3mm;text-align:center;font-size:11.5pt;color:#111111;background:#f7f8fb\"><div style=\"font-size:9pt;font-weight:700;margin-bottom:1mm\">Defne</div><span class=\"nw\">(−3, −3)</span></div><div style=\"border:.4mm solid #5b6478;border-radius:2.5mm;min-width:16mm;padding:2mm 3mm;text-align:center;font-size:11.5pt;color:#111111;background:#f7f8fb\"><div style=\"font-size:9pt;font-weight:700;margin-bottom:1mm\">İpek</div><span class=\"nw\">(−<span class=\"krk\"><span>8</span></span>, 2)</span></div><div style=\"border:.4mm solid #5b6478;border-radius:2.5mm;min-width:16mm;padding:2mm 3mm;text-align:center;font-size:11.5pt;color:#111111;background:#f7f8fb\"><div style=\"font-size:9pt;font-weight:700;margin-bottom:1mm\">Nil</div><span class=\"nw\">(−8, 0)</span></div></div>", "k": "Buna göre, ev sahibi takımın kaç oyuncusu hücum bölgesindedir?", "sec": ["2", "3", "4", "5"], "secg": null, "c": "B", "a": ["Fileye uzaklık, y eksenine uzaklıktır: apsisin mutlak değeri.", "Ece 2 m, Selin 5/2 m, İpek <span class=\"krk\"><span>8</span></span> ≈ 2,83 m: üçü de 3 m'den az. Defne tam 3 m, Zeynep 4 m, Nil 8 m uzaktadır.", "Hücum bölgesinde 3 oyuncu vardır."], "t": "4: tam 3 m uzaklıktaki Defne de sayılmış; 2: <span class=\"krk\"><span>8</span></span> 3'ten büyük sanılmış", "d": "Fileye uzaklık, y eksenine uzaklıktır: apsisin mutlak değerine bakın. Tam 3 m uzaklıktaki oyuncu “3 m'den az” şartını sağlamaz; √8 ≈ 2,83 m'dir.", "ses": "b06"}, {"no": 7, "on": "<p>Bir sınıfta “Koordinat Tombalası” oynanmaktadır. Öğretmen, tahtadaki dik koordinat sisteminde aşağıdaki beş noktayı işaretlemiştir. Öğrencilerin kartlarında üçer sıralı ikili yazılıdır. Kartındaki üç ikilinin üçü de işaretlenen noktalardan birini gösteren öğrenci “Tombala!” der.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 2377 834\" width=\"2377\" style=\"width:150mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8 aretlidir.", "Ali'nin (2, −2), Can'ın (−3, 0), Deniz'in (1, −2) ikilisi işaretli değildir."], "t": "Kartlardaki sayıları sadeleştirmeden karar verilmemelidir.", "d": "Kartlardaki sayıları önce sadeleştirin: √9 = 3, −4/2 = −2, √16 = 4. Bileşenlerin sırasına da dikkat edin: (2, −2) ile (−2, 2) farklı noktalardır.", "ses": "b07"}, {"no": 8, "on": "<p>Bir şehrin metro planına dik koordinat sistemi yerleştirilmiştir; her birim 1 km'dir. Kırmızı hat x ekseni, mavi hat y ekseni boyunca uzanır ve iki hat orijindeki Merkez istasyonunda buluşur. Harita uygulaması istasyonların koordinatlarını ondalık gösterimle yazmakta ve bileşenleri noktalı virgülle ayırmaktadır.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 2584 864\" width=\"2584\" style=\"width:150mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAD+AvgDASIAAhEBAxEB/8QAHAABAAEFAQEAAAAAAAAAAAAAAAUCAwQGBwEI/8QATxAAAQMCAwQFBwYKCAYCAwAAAQACAwQRBRIhBjFBUQcTImFxMnKBkaGxwRQjM0JS0RUlNDVic3SywuEkNkNTY4KD8BYmREWS8QiElKLS/8QAGQEBAQEBAQEAAAAAAAAAAAAAAAECAwQF/8QAIxEBAQACAwEBAAICAwAAAAAAAAECEQMhMRJBMlEUIgQTcf/aAAwDAQACEQMRAD8A2RzNLqxKWMaXPc1rRqS42AUgYuHFQe07QMDrP1RWHRWzEMPmu2Osgc7kJAr4Y1wu0hw7iuX04PWu8xvvKyWSPiddkjmH9F1ldJt0cxaKxNH82fR71pTMYxSEdisltyJv71fbtRiYble6N472a+xTRtuBisVSWNWtx7ZSj6aiY7zXkfesmLbCif8AS080fhZyG0uYwdwVJissSLaTCZDb5Rk89pCzI8QoZ7dXVwO/zhFU9SFR1ICzMof5JBHMKl0dkGGY9dy8MdxuWW4DkqS3RQYRhHJeGO4WZ1ZXnV3QYPU24K3LF827RZ7orb1bnZ82bBUYnVC1iFbNO0m+UehZ3V9ydV3KDB+TDg5w9K9bTP4O9YWd1Vl7lQYpjkDAA2N3rCx5GOG9lvAqSc3RWJGaoMAkDe1w9Ctucw/WA8VmujO9WHt1IKDGIHCxVJAV10TR9UepUGIa2B9aDGa1Uz9iIuP1dVeYFZxCP+hvOYt4aK/iLmz0GWnfKRq4hvq/mVl43UupcLkcxzA9/YZn3XK8w0Nioom3INrn06qL2hq5H1EVOxxDWjM75rPqdy5+1vyIQFjRp8iHLQ6cvZc+lVXFr i ters; D: desen sondan başa okunmuş", "d": "Desen başlangıç halkasından başlar ve okla biter; noktaları bu sırayla okuyun. Her noktada önce apsis (sağ–sol), sonra ordinat (yukarı–aşağı) yazılır.", "ses": "b10"}, {"no": 11, "on": "<p>Bir ormanın haritasında yangın gözetleme kulesi orijin alınmıştır; x ekseninin pozitif yönü doğuyu, y ekseninin pozitif yönü kuzeyi gösterir ve her birim 1 km'dir. Orman dört bölgeye ayrılmıştır; her bölgeden bir ekip sorumludur. Eksenler boyunca uzanan yangın yollarındaki ihbarlara itfaiye aracı gider.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 2456 864\" width=\"2456\" style=\"width:150mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAELAvgDASIAAhEBAxEB/8QAHAABAAMBAQEBAQAAAAAAAAAAAAMEBQIBBgcI/8QAQhAAAgIBAwIFAgMHAwMDAgYDAQIDEQAEEiExQQUTIlFhMnEUgZEHI0KhscHw0eHxBlJiFSQzcoIWJTVDkqJ0ssL/xAAYAQEBAQEBAAAAAAAAAAAAAAAAAQIDBP/EACIRAQEAAgIDAQADAQEAAAAAAAABAhEhMQMSQVETIjJhQv/aAAwDAQACEQMRAD8A+RUqzda29OOuTyWkMRQkSEHmqs30zhET8CHJBZn6+2SahqjRfMIYDub4/wArOFvLL2KZyirv5bi2HFe2RvpGlmjl06AKxIAuiCM4hDHUqGYkH1AVd8ZOriXSeQkILhjuHf75LxeBINGZLbUOrSuaXaRx8nM6V5NJIVEqP2BUWMnOmljcyNJafw85w0ZZQWhYOWNOP17ZcRPCdVNp99i34FdwOOcDTXqVZAy7at17G/8AfOI9RIqDzmY7uKPpAyRR5UKmjMQSLB6X/vk5g9nU6eQh033/AB3/AGyMpHKsZKl93DAdh8Z75hRxF9LJY3j1E/5WNGDK7tKCNgNEDHU2PNRLCno2FWUUGfk1/wAZxoV8yZRyAhBJJ/l/XOtSzCFS6iQge3IHY5InphV4xTFrNcdMb/qEpRpHGzbJdAg0b/4yq6C13udrCyctaSSUzOZCg2KaPdsgkPCsUYmrB6hR/wA5ZxwPF8klEiau5a+pyeR3klAUb1JpQR/PKcCoJSzsbU2u3ocm077tV5m88NuWjzx14+2XKCbVo07rHGirtNHkfzyTXCMxKu5WKgVXbjInAfVq20FCdxcGvnn5zjVOGcMVDxAg13/XMT4OtM0K3J6i4B3AdwfjPdsRCIGkaJm3NsHT8sg0uoNsEhWq9XyPvkumO6ddiONxpyvSvfNXeyLUwZkDiNtinlujCsorPGkn7pgQSOSK2nJdRqnZ2V3HlhiDxRP2yi2xprjTaL /2)</span>, <span class=\"nw\">(−3/4, −5)</span>, <span class=\"nw\">(0, 7/2)</span>, <span class=\"nw\">(−5/2, 1)</span>, <span class=\"nw\">(4, 3)</span>, <span class=\"nw\">(1/3, −2)</span>, <span class=\"nw\">(7/2, −6)</span>, <span class=\"nw\">(−6, 0)</span>.</p>", "k": "Buna göre, <u>en fazla</u> ihbara giden ekip ya da araç hangisidir?", "sec": ["Kartal", "İtfaiye aracı", "Doğan", "Atmaca"], "secg": null, "c": "D", "a": ["Bir bileşeni 0 olan (0, 7/2) ve (−6, 0) yangın yolundadır: itfaiye aracı (2 ihbar).", "(2, −1/2), (1/3, −2) ve (7/2, −6) noktalarında apsis pozitif, ordinat negatiftir: IV. bölge, Atmaca (3 ihbar). Diğer ekiplere birer ihbar düşer."], "t": "B: eksen üzerindeki ihbarlar bir bölgeye atanmamış ama sayı karıştırılmış; C: (−3/4, −5) gibi ihbarlar yalnız ordinata bakılarak sayılmış", "d": "Bir bileşeni 0 olan ihbar yangın yolundadır ve hiçbir bölgede değildir; oraya itfaiye aracı gider. Kesirli bileşenlerde yalnız işaretlere bakın: (1/3, −2) IV. bölgededir.", "ses": "b11"}, {"no": 12, "on": "<p>Bir sınıf planı kareli zemine çizilmiştir; eksenler gösterilmemiştir. x ekseninin pozitif yönü sağa, y ekseninin pozitif yönü yukarı doğrudur ve her kare 1 birimdir. Öğretmen, K, L, M ve N noktalarından birini orijin seçecektir.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1150 784\" width=\"1150\" style=\"width:102.7mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAIGAvgDASIAAhEBAxEB/8QAGwAAAwADAQEAAAAAAAAAAAAAAAECAwQFBgf/xABLEAABAgQEAwUGAwUGBAUEAwEBAAIREiExAyJBUQRhcQUTMoGRQlKhscHRBiNiFDNDcuEVJFOCkvAWVJPxJTREorJVg5TSBzVFc//EABoBAQEAAwEBAAAAAAAAAAAAAAABAgMEBQb/xAAlEQEAAgIBAwUBAQEBAAAAAAAAAQIDETEEITISExRBUWFCInH/2gAMAwEAAhEDEQA/APT9 s=\"nw\">(−6, 4)</span>", "<span class=\"nw\">(6, −4)</span>"], "secg": null, "c": "D", "a": ["A'nın yeni koordinatları (1, −2) ise A, yeni orijinin 1 birim sağında ve 2 birim aşağısındadır. Görüntüde A (−3, 1)'de olduğundan yeni orijin eski sistemde (−4, 3) noktasıdır.", "B (2, −1), yeni orijinin 6 birim sağında ve 4 birim aşağısındadır: (6, −4)."], "t": "A: orijin ters yöne taşınmış; B: B'nin koordinatlarına A'nın yeni koordinatları eklenmiş; C: işaretler ters", "d": "Orijin taşınınca noktalar yerinde kalır, koordinatları değişir. Önce A'nın yeni koordinatlarından yeni orijinin yerini bulun; sonra B'yi bu orijine göre sayın.", "ses": "b13"}, {"no": 14, "on": "<p>Bir plajın planına dik koordinat sistemi yerleştirilmiştir. Cankurtaran kulesi orijindedir ve x ekseni kıyı çizgisi boyunca uzanır; y ekseninin pozitif yönü kumsala, negatif yönü denize doğrudur ve her birim 1 m'dir. Belediyenin şemsiye kuralları şunlardır:</p><div style=\"margin:1mm 0 1mm 2mm\"><div>• Şemsiye kumsalda olmalı ve kıyı çizgisine uzaklığı <u>en az</u> 2 m olmalıdır.</div><div>• Kulenin önündeki koridor boş kalmalıdır: şemsiyenin y eksenine uzaklığı 3/2 m'den fazla olmalıdır.</div></div>", "g": "<svg class=\"foto511\" viewBox=\"0 0 2944 864\" width=\"2944\" style=\"width:150mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCADfAvgDASIAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAECAwQFBgf/xAA5EAACAgEDAwMCBAUCBgMBAQABAgARAxIhMQRBURMiYQUyI3GBkQYUQqHRUrEHM2LB4fAVJPFDgv/EABoBAQEAAwEBAAAAAAAAAAAAAAABAgMEBQb/xAAnEQEAAQQBBAIBBQEAAAAAAAAAAQIREhMDITEyUQRhQRQiI1Khkf/aAAwDAQACEQMRAD8A+mIBLKSPgmUc5MXv+5QTBGpWR2pydpZQcfT27WBsaM8x3pH4i6lbZpQBgja1K6TsRAGnpyyiwDfzGQ6FXItsrcirgDtiLFSzEc96kqNOINhO43 olid #5b6478;border-radius:2.5mm;min-width:16mm;padding:2mm 3mm;text-align:center;font-size:11.5pt;color:#111111;background:#f7f8fb\"><div style=\"font-size:9pt;font-weight:700;margin-bottom:1mm\">4. şemsiye</div><span class=\"nw\">(−<span class=\"krk\"><span>3</span></span>, 4)</span></div><div style=\"border:.4mm solid #5b6478;border-radius:2.5mm;min-width:16mm;padding:2mm 3mm;text-align:center;font-size:11.5pt;color:#111111;background:#f7f8fb\"><div style=\"font-size:9pt;font-weight:700;margin-bottom:1mm\">5. şemsiye</div><span class=\"nw\">(3, 2)</span></div><div style=\"border:.4mm solid #5b6478;border-radius:2.5mm;min-width:16mm;padding:2mm 3mm;text-align:center;font-size:11.5pt;color:#111111;background:#f7f8fb\"><div style=\"font-size:9pt;font-weight:700;margin-bottom:1mm\">6. şemsiye</div><span class=\"nw\">(−2, −1)</span></div></div>", "k": "Buna göre, kaç şemsiye belediyenin kurallarına uygundur?", "sec": ["1", "2", "3", "4"], "secg": null, "c": "C", "a": ["Kıyıya uzaklık ordinattır (kumsalda ordinat pozitif): ordinat en az 2 olmalı. 3. şemsiye (7/4 &lt; 2) ve 6. şemsiye (denizde) uymaz.", "Koridor kuralı: |apsis| &gt; 3/2. 2. şemsiye (|1| &lt; 3/2) uymaz; 4. şemsiye uyar (<span class=\"krk\"><span>3</span></span> ≈ 1,73 &gt; 1,5).", "Uygun şemsiyeler 1, 4 ve 5'tir: 3 şemsiye."], "t": "2: 5. şemsiyede 2 m dâhil edilmemiş; 4: 2. şemsiye uygun sanılmış ya da <span class=\"krk\"><span>3</span></span> küçük sanılmış", "d": "Kıyıya uzaklık ordinatın, koridora (y eksenine) uzaklık apsisin mutlak değeridir. “En az 2 m” ifadesinde 2 m dâhildir; √3 ≈ 1,73 m, 3/2 = 1,5 m'den fazladır.", "ses": "b14"}, {"no": 15, "on": "<p>Bir arama-kurtarma İHA'sı ormanda kaybolan bir yürüyüşçüyü aramaktadır. İHA'nın ekranındaki kareli haritada eksenler gösterilmemiştir; x ekseninin pozitif yönü doğuyu, y ekseninin pozitif yönü kuzeyi gösterir ve koordinatlar metre cinsindendir. Ekranda yalnız K ve L noktalarının koordinatları yazılıdır; karelerin kenar uzunluğu yazılmamıştır.</p>",     k.querySelectorAll("ol.sec li").forEach(li=>{if(li.dataset.h===s.c)li.classList.add("dogru");});

/* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
