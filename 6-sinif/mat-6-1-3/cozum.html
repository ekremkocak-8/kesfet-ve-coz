<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çözümler · Keşfet ve Çöz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--muted:#5b6478;--line:#dfe5ef;--bg:#f5f7fb;--card:#fff;--ss:#6741d9;--kk:#0b7285;--b:#d0700f;--ok:#2b8a3e;--warn:#c92a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif}
header{background:linear-gradient(135deg,#1c5fbf,#2f8fe0);color:#fff;padding:18px 16px 22px}

main{max-width:780px;margin:14px auto 40px;padding:0 16px}
nav.sec{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}nav.sec button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}

ol.sec{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
ol.sec li{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}ol.sec li.dogru{border-color:var(--ok);background:#ebfbee;font-weight:800}
.adim{border-left:4px solid var(--c);padding:6px 12px;margin:8px 0;background:#fff;border-radius:0 10px 10px 0;animation:gel .35s ease-out}
.adim b{color:var(--c)}@keyframes gel{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dug{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
button.btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.dikkat{background:#fff4e6;border:2px solid #f59f00;border-radius:12px;padding:10px 14px;margin:12px 0 4px}.dikkat b{color:#d9480f}
.tuzak{font-size:15px;color:var(--muted);margin-top:8px}
.cevap{font-weight:900;color:var(--ok);margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid var(--line);padding:8px 10px;text-align:left}th{background:#e3fafc;color:#0b7285;font-size:13px;letter-spacing:.06em}
.ses{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border-radius:12px;background:#eef2ff}

.ses span{font-size:14px;color:var(--muted)}
.gizli{display:none}
.tum{margin:4px 0 14px;font-size:14px}.tum a{color:#1c5fbf;font-weight:800}
@media (prefers-reduced-motion:reduce){.adim{animation:none}}
/* Canlandır (05.10.2026) */
.sek{display:flex;gap:6px;margin:12px 0 0;border-bottom:2px solid var(--line)}
.sek button{border:0;background:none;font:inherit;font-weight:900;font-size:15px;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);min-height:44px;position:relative;top:2px;border-bottom:3px solid transparent}
.sek button[aria-selected=true]{color:var(--c);border-bottom-color:var(--c);background:#fff8f0}
.sek .yeni{display:inline-block;font-size:10px;background:#2b8a3e;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.06em}
.cn{padding-top:10px}
.cn-yon{background:#eef6ff;border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:10px}
.cn-sahne{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;min-height:120px;overflow-x:auto}

.cn-adimci input,.cn-test input{width:84px;height:44px;border:2px solid var(--line);border-radius:12px;font:inherit;font-weight:900;text-align:center;font-size:18px}
.cn-test label{font-weight:800;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.cn-btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
.cn-btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.cn-btn[aria-pressed=true]{background:var(--ac,var(--c));color:#fff;border-color:var(--ac,var(--c))}
.cn-btn:disabled{opacity:.5}
.cn-hazir{display:flex;flex-wrap:wrap;gap:6px}

.cn-dur .iyi{color:var(--ok);font-weight:900}.cn-dur .kotu{color:var(--warn);font-weight:900}
.cn-df{margin-top:10px;overflow-x:auto}@media(max-width:480px){.cn-adimci>span{flex-basis:100%}.cn-h{font-size:12px;padding:5px 0}.cn-izg{gap:3px}.cn-sahne{padding:6px}}@media(max-width:480px){.cn-df table{font-size:13px}.cn-df td,.cn-df th{padding:4px 5px}}.cn-df summary{font-weight:900;cursor:pointer;padding:6px 0}.cn-say{color:var(--muted);font-weight:700}
.cn-df table{font-size:15px}.cn-df td{padding:5px 8px}.cn-df tr.cn-iyi td{background:#ebfbee}.cn-df tr.cn-kotu td{background:#fff5f5}.cn-df tr.cn-son td{outline:2px solid var(--c);outline-offset:-2px}
.cn-p{animation:cnGel .35s ease-out both}@keyframes cnGel{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cn-o{fill:#ffa94d;stroke:#d9480f;stroke-width:1}.cn-o2{fill:#e8590c}.cn-k{fill:#ffc9c9;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:3 2}
.cn-cerceve{stroke:#2b8a3e;stroke-width:3}.cn-et{font-size:13px;font-weight:800;fill:#5b6478}.cn-et.b,.cn-et2b{font-weight:900;fill:#1d2433}.cn-et2{font-size:11px;fill:#5b6478;font-weight:700}.cn-et2b{font-size:13px;fill:#fff}
.cn-ku{fill:#fff4e6;stroke:#ffa94d;stroke-width:1.5}.cn-kk{fill:#fff5f5;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:4 3}
.cn-tahta0{fill:#f1f3f5;stroke:#ced4da}.cn-tahta{fill:#c08552;stroke:#8d5a2b}
.cn-ek{stroke:#868e96;stroke-width:2}.cn-sinir{stroke:#c92a2a;stroke-width:3;stroke-dasharray:5 4}.cn-yay{fill:none;stroke:#f76707;stroke-width:2}
.cn-v1{stroke:#2b8a3e;stroke-width:3}.cn-v2{stroke:#c92a2a;stroke-width:3}.cn-kis{font-size:20px}.cn-bus{font-size:16px}.cn-bek{stroke:#c92a2a;stroke-width:5;stroke-linecap:round;opacity:.6}
.cn-kum{fill:#ffe8cc;stroke:#e8590c;stroke-width:3}.cn-kum2{fill:#495057}.cn-para{fill:#ffd43b;opacity:.85}.cn-buyuk{font-size:26px;font-weight:900;fill:#1d2433}
.cn-zem{fill:#adb5bd}.cn-kat{fill:#f1f3f5;stroke:#ced4da}.cn-katon{fill:#d3f9d8;stroke:#2b8a3e}.cn-katoff{fill:#ffe3e3;stroke:#e03131}
.cn-izg{display:grid;gap:4px}.cn-h,.cn-gb{border-radius:8px;text-align:center;font-weight:800;font-size:14px;padding:6px 0}.cn-h{background:#f1f3f5;transition:background .25s,transform .25s}
.cn-gb{background:none;color:var(--muted);font-size:12px}.cn-h.on{background:#ffa94d;color:#1d2433}.cn-h.yeni{transform:scale(1.18);box-shadow:0 0 0 3px #e8590c}
.cn-kartlar{display:flex;flex-wrap:wrap;gap:6px;padding:4px}.cn-kart{min-width:44px;padding:8px 10px;text-align:center;border-radius:10px;background:#fff4e6;border:2px solid #ffa94d;font-weight:900;animation:cnGel .3s}
.cn-kart.kare{background:#e7f5ff;border-color:#1c7ed6}.cn-bosk{color:var(--muted)}
.cn-cift{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 4px;font-weight:800}.cn-cift i{font-weight:600;color:#1c7ed6}
.cn-katlar{padding:4px}.cn-katsat{display:inline-flex;flex-wrap:wrap;gap:6px}.cn-kat2{background:#e6fcf5;border:1.5px solid #12b886;border-radius:8px;padding:3px 8px;font-weight:800;animation:cnGel .3s}.cn-sonsuz{font-weight:800;color:#0b7285}
.cn-onr{background:#f8f0fc;border:2px solid #ae3ec9;border-radius:12px;padding:10px 14px}.cn-kanit{padding:10px 4px 2px}
.cn-kay{display:inline-flex;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap}.cn-kay{max-width:100%}.cn-kay input{width:min(220px,70vw);accent-color:#d0700f}.cn-satir>*{min-width:0;max-width:100%}
@media (prefers-reduced-motion:reduce){.cn-p,.cn-kart,.cn-kat2{animation:none}.cn-h{transition:none}}
/* 05.10.2026 · KOŞUL ve LABİRENT motorları (SB 6.1.1) */
@media(max-width:560px){.soru [style*="grid-template-columns:repeat"]{grid-template-columns:1fr!important}}   /* çok sütunlu konuşma balonları telefonda alt alta */
.cn-kl{list-style:none;padding:0;margin:0;display:grid;gap:4px}.cn-not{color:var(--muted);font-size:14px}.cn-sonuc{margin-top:6px;font-weight:800}
.cn-secg{gap:6px}.cn-secad{font-weight:800;flex-basis:100%}.cn-secg .cn-btn{padding:8px 12px}
.cn-mv{fill:#74c0fc;stroke:#1c7ed6;stroke-width:1}.cn-tl{fill:#69db7c;stroke:#2b8a3e;stroke-width:1.5}
.cn-lab{display:grid;gap:4px;align-items:center;max-width:460px;margin:0 auto}
.cn-lc{min-height:44px;border-radius:8px;border:1.5px solid #ced4da;background:#fff;font:inherit;font-weight:900;font-size:16px;cursor:pointer;padding:0;color:var(--ink)}
.cn-lc.yol{background:#d3f9d8;border-color:#2b8a3e}.cn-lc.simdi{background:#2b8a3e;color:#fff;box-shadow:0 0 0 3px #b2f2bb}.cn-lc.kapali{background:#ffe3e3;border-color:#e03131;color:#c92a2a;text-decoration:line-through}
.cn-lok{color:#2b8a3e;font-weight:900;text-align:center}.cn-lcik{min-height:44px;border:0;background:none;font:inherit;font-weight:900;color:#d9480f;cursor:pointer;padding:0;white-space:nowrap;font-size:14px}.cn-lcik:disabled{cursor:default}

</style></head><body>
<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }
      if (!art && !o.sandalye) sv += `<rect x="10" y="10" width="${gen * hc}" height="${sira * hc}" fill="none" class="cn-cerceve"/>
        <text x="${10 + gen * hc / 2}" y="${H + 4}" class="cn-et" text-anchor="middle">${gen} ${o.birim || ""}</text>
        <text x="${W + 4}" y="${10 + sira * hc / 2}" class="cn-et" dominant-baseline="middle">${sira} ${o.birim || ""}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W + 70} ${H + 22}" role="img" aria-label="${N} ${o.ad || "kare"}, her sırada ${gen}">${sv}</svg>`;
      const r = o.kural ? o.kural(gen, sira, art, N) : null;
      let m;
      if (art) m = `<span class="kotu">✘</span> ${N} ${o.ad || "kare"} her sırada ${gen} olacak biçimde dizilince ${sira} tam sıra oluşur, <b>${art} ${o.ad || "kare"} artar</b>. Dikdörtgen olmaz: ${N} : ${gen} işleminde kalan ${art}.`;
      else m = `<span class="iyi">✔</span> <b>${N} = ${gen} ${x} ${sira}</b> · ${sira} sıra, her sırada ${gen} ${o.ad || "kare"}; hiç artmadı.` + (gen === sira ? ` <b>Kare oldu!</b> İki kenar aynı: ${gen}.` : "");
      if (!art && o.cevre) m += ` Çevre = 2 ${x} (${gen} + ${sira}) = <b>${2 * (gen + sira)} m</b>.`;
      if (r && r.msg) m += `<br>${r.msg}`;
      s.dur.innerHTML = m;
      const sutunlar = o.satir ? o.satir(gen, sira, art, N, r) : [gen, art ? `${sira} (+ ${art} artan)` : sira, art, art ? "olmaz" : (gen === sira ? "kare" : "dikdörtgen")];
      s.yaz(N + ":" + gen, sutunlar, !art && (!r || r.ok !== false));
    }
    ciz(g.get());
  }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {
    const N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });
    const g = adimci(o.etiket, 1, o.max || N, o.bas || 2, v => { sonK = v; });

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {

  function KOSUL(el, o) {

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.

  function LABIRENT(el, o) {

    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

      bitis: "Dört kutuyu da birkaç sıra sayısıyla denediğinizde." }); },

  /* 2 · 1–60 dolapları kalburla */
  2: el => CN.KOSUL(el, { girdi: [sec("Kalburun son adımı:", ["başlangıç", "1", "2", "3", "5", "7"], "başlangıç", s => s === "başlangıç" ? s : s === "1" ? "1'i çiz" : s + "'nin katları".replace("3'nin", "3'ün").replace("5'nin", "5'in"))], dugme: false,
    ciz: ([s]) => { const ad = ["başlangıç", "1", "2", "3", "5", "7"].indexOf(s), P = [2, 3, 5, 7].slice(0, Math.max(0, ad - 1));
      const elen = n => (ad >= 1 && n === 1) || P.some(p => n !== p && n % p === 0);
      const kalan = [...Array(60)].map((_, i) => i + 1).filter(n => !elen(n) && !(n === 1 && ad >= 1)).length - (ad >= 1 ? 0 : 0);
      return izg(60, 10, n => elen(n) ? "e" : (ad >= 5 && n > 1 ? "a" : "")) + `<p class="cn-sonuc">Elenmemiş dolap: ${kalan}</p>`; },
    kosullar: [{ ad: "Elenmeyen sayıların hepsi asal", f: ([s]) => s === "7" }],
    sutun: ["Son adım", "Elenmemiş"], satir: ([s]) => { const ad = ["başlangıç", "1", "2", "3", "5", "7"].indexOf(s), P = [2, 3, 5, 7].slice(0, Math.max(0, ad - 1)); return [s, [...Array(60)].map((_, i) => i + 1).filter(n => !((ad >= 1 && n === 1) || P.some(p => n !== p && n % p === 0))).length]; },
    yon: "Kalburu adım adım uygulayın: önce 1'i çizin, sonra 2, 3, 5 ve 7'nin katlarını eleyin. Her adımda kaç dolap kaldığını deney defterinden izleyin.",
    bitis: "7'nin katları da elendiğinde; kalan sarı dolapları sayın." }),

  /* 3 · öğrencilerin önermeleri: iki asal */
  3: el => CN.KOSUL(el, { girdi: [sayi("1. asal sayı:", 2, 47, 2), sayi("2. asal sayı:", 2, 47, 3)],
    ciz: ([a, b]) => kart([a, b], asal) + `<p class="cn-sonuc">${a} x ${b} = ${a * b} · ${a} + ${b} = ${a + b}</p>`,
    kosullar: [{ ad: "İki sayı da asal", f: ([a, b]) => asal(a) && asal(b) }, { ad: "Çarpım asal (Ali)", f: ([a, b]) => ({ ok: asal(a * b), not: `${a * b}` }) },
      { ad: "Toplam tek (Cem: toplam çift değilse 2 yoktur?)".replace(" (Cem: toplam çift değilse 2 yoktur?)", ""), f: ([a, b]) => ({ ok: (a + b) % 2 === 1, not: (a + b) % 2 ? "sayılardan biri 2" : "iki sayı da tek ya da ikisi de 2" }) },
      { ad: "Toplam asal (Deniz)", f: ([a, b]) => ({ ok: asal(a + b), not: `${a + b}` }) }],
    sutun: ["Sayılar", "Çarpım", "Toplam", "Toplam asal mı?"], satir: ([a, b]) => [`${a} ve ${b}`, a * b, a + b, asal(a + b) ? "evet" : "hayır"], iyi: ([a, b]) => asal(a) && asal(b),
    yon: "İki asal sayı seçip Sına'ya basın. Ali'nin ve Deniz'in önermelerini bozan örnekler arayın; iki tek asalın toplamına dikkat edin.",
    bitis: "Her öğrencinin önermesini en az iki sayı ikilisiyle sınadığınızda." }),

  /* 4 · yarışma ekranı */
  4: el => CN.KOSUL(el, { girdi: [sec("Ekrandaki sayı:", [39, 69, 85, 89], 39)], dugme: "2, 3, 5, 7 ile sına ▶",
    ciz: ([n]) => `<p class="cn-sonuc">${[2, 3, 5, 7].map(d => bk(n, d)).join("<br>")}</p>`,
    kosullar: [{ ad: "2, 3, 5 ve 7'nin hiçbirine bölünmüyor", f: ([n]) => [2, 3, 5, 7].every(d => n % d) }],
    sutun: ["Sayı", "Bölen bulundu mu?", "Karar"], satir: ([n], h) => [n, h ? "hayır" : [2, 3, 5, 7].find(d => n % d === 0), h ? "asal" : "asal değil"],
    yon: "Ekrandaki sayıları tek tek seçip 2, 3, 5 ve 7 ile sınayın. Hangi sayıda hiçbir bölme kalansız değil?",
    bitis: "Dört sayıyı da sınadığınızda." }),

  /* 5 · kart oyunu puanları */
  5: el => CN.KOSUL(el, { girdi: [sec("Kart:", [60, 32, 30], 60, n => `${{ 60: "Ece", 32: "Mert", 30: "Can" }[n]}: ${n}`)], dugme: "Asal çarpanlarına ayır ▶",
    ciz: ([n]) => algo(n) + `<p class="cn-sonuc">${n} = ${xY(fac(n))}</p>`,
    kosullar: [{ ad: "Puan = farklı asal çarpan sayısı", f: ([n]) => ({ ok: true, not: `farklı asal çarpanlar: ${fa(n).join(", ")} → ${fa(n).length} puan` }) }],
    sutun: ["Kart", "Asal çarpanlar (tekrarlı)", "Farklı asal çarpanlar", "Puan"], satir: ([n]) => [n, xY(fac(n)), fa(n).join(", "), fa(n).length],
    yon: "Her kartı asal çarpanlarına ayırın. Tekrar eden asal çarpanın puanı bir kez mi, her seferinde mi sayılıyor? Puanları deney defterinde toplayın.",
    bitis: "Üç kartı da ayırdığınızda." }),

  /* 6 · kod puanı */
  6: el => CN.KOSUL(el, { girdi: [sec("Kart:", [96, 98, 99, 100], 96)], dugme: "Algoritmayı çalıştır ▶",
    ciz: ([n]) => algo(n), kosullar: [{ ad: "Kod puanı = sağ sütundaki sayıların toplamı", f: ([n]) => ({ ok: true, not: `${fac(n).join(" + ")} = ${fac(n).reduce((a, b) => a + b, 0)}` }) }],
    sutun: ["Kart", "Sağ sütun", "Kod puanı"], satir: ([n]) => [n, fac(n).join(", "), fac(n).reduce((a, b) => a + b, 0)],
    yon: "Kartları sırayla algoritmayla ayırın; kod puanlarını deney defterinde karşılaştırın. Büyük sayının puanı hep büyük mü?",
    bitis: "Dört kartın kod puanını bulduğunuzda." }),

  /* 7 · 240'ın farklı ağaçları */
  7: el => CN.KOSUL(el, { girdi: [sec("İlk dallar:", ["2 x 120", "4 x 60", "6 x 40", "12 x 20", "15 x 16"], "6 x 40")], dugme: "Ağacı tamamla ▶",
    ciz: ([s]) => { const [a, b] = s.split(" x ").map(Number); return `<p class="cn-sonuc">240 → ${a} ve ${b}<br>${a} → ${xY(fac(a))} · ${b} → ${xY(fac(b))}</p>` + kart([...fac(a), ...fac(b)].sort((x, y) => x - y), x => x === 2); },
    kosullar: [{ ad: "Yapraklar asal", f: () => true }, { ad: "Yapraklardaki 2'lerin sayısı", f: ([s]) => ({ ok: true, not: String(fac(240).filter(x => x === 2).length) }) }],
    sutun: ["İlk dallar", "Yapraklar", "2'lerin sayısı"], satir: ([s]) => { const [a, b] = s.split(" x ").map(Number); const L = [...fac(a), ...fac(b)].sort((x, y) => x - y); return [s, L.join(", "), L.filter(x => x === 2).length]; },
    yon: "240'ın ağacını farklı ilk dallarla başlatın. Yapraklardaki asal sayılar ve 2'lerin sayısı değişiyor mu?",
    bitis: "En az üç farklı başlangıç denediğinizde." }),

  /* 8 · şifre: asal çarpanları yalnız 2 ve 7, üç basamaklı en küçük */
  8: el => CN.KOSUL(el, { girdi: [sayi("Denenen şifre:", 90, 240, 98)],
    ciz: ([n]) => `<p class="cn-sonuc">${n} = ${xY(fac(n))}</p>`,
    kosullar: [{ ad: "Üç basamaklı", f: ([n]) => n >= 100 }, { ad: "Asal çarpanları yalnız 2 ve 7", f: ([n]) => ({ ok: fa(n).join() === "2,7", not: `asal çarpanlar: ${fa(n).join(", ")}` }) }],
    sutun: ["Şifre", "Asal çarpanlar", "Uygun mu?"], satir: ([n], h) => [n, fa(n).join(", "), h ? "uygun" : "değil"],
    yon: "Şifreyi değiştirip Sına'ya basın. 14'ün katlarını (98, 112, 126 …) deneyin; asal çarpanlarına 3 ya da 5 giren sayılar uygun değildir. Uygun sayıların en küçüğünü bulun.",
    bitis: "Uygun üç basamaklı en küçük şifreyi bulduğunuzu düşündüğünüzde." }),

  /* 9 · robot: kendisi hariç en büyük çarpan */
  9: el => CN.CARPAN(el, { N: 75, hazir: [75, 98], max: 120,
    yon: "Ekrandaki sayının çarpan çiftlerini bölerek bulun. Kendisi hariç en büyük çarpan, en küçük asal çarpanla eşleşen çarpandır; iki ekran için bulup toplayın.",
    bitis: "75 ve 98'in bütün çarpan çiftlerini bulduğunuzda." }),

  /* 10 · vida kutuları */
  10: el => CN.KOSUL(el, { girdi: [sec("Kutu:", [14, 15, 25, 42], 14, k => ({ 14: "14'lü", 15: "15'li", 25: "25'li", 42: "42'li" })[k] + " kutu")], dugme: "Paketle ▶",
    ciz: ([k]) => `<p class="cn-sonuc">Vida: 2 x 3 x 5 x 7 = 210 · Kutu: ${k} = ${xY(fac(k))}</p>`,
    kosullar: [{ ad: "Kutunun asal çarpanları vida sayısının asal çarpanları arasında", f: ([k]) => ({ ok: 210 % k === 0, not: bk(210, k) }) }],
    sutun: ["Kutu", "Kutunun asal çarpanları", "Artan vida"], satir: ([k]) => [k, xY(fac(k)), 210 % k],
    yon: "Kutu türlerini sırayla deneyin. Kutu sayısının asal çarpanlarını vida sayısının asal çarpanlarıyla karşılaştırın; hangi kutuda fazladan bir asal gerekiyor?",
    bitis: "Dört kutu türünü de denediğinizde." }),

  /* 11 · yürüyüş grupları */
  11: el => { const G = { Gezgin: 38, Martı: 39, Kartal: 65, Doğa: 59 };
    return CN.KOSUL(el, { girdi: [sec("Grup:", Object.keys(G), "Gezgin", g => `${g} (${G[g]})`), sayi("Ekip sayısı:", 2, 20, 2)], dugme: "Ekiplere ayır ▶",
      ciz: ([g, e]) => `<p class="cn-sonuc">${G[g]} kişi, ${e} ekip → ${bk(G[g], e)}</p>`,
      kosullar: [{ ad: "Ekipler eşit", f: ([g, e]) => G[g] % e === 0 }, { ad: "Her ekipte en az 2 kişi", f: ([g, e]) => G[g] / e >= 2 }],
      sutun: ["Grup", "Ekip", "Ekipteki kişi", "Sonuç"], satir: ([g, e], h) => [g, e, G[g] % e ? "—" : G[g] / e, h ? "olur" : "olmaz"],
      yon: "Her grubu farklı ekip sayılarıyla bölmeyi deneyin. Hangi grubun hiçbir ekip sayısıyla bölünemediğini bulun.",
      bitis: "Dört grubu da denediğinizde." }); },

  /* 12 · kardeşlerin yaşları */
  12: el => CN.KOSUL(el, { girdi: [sayi("Kaç yıl sonra:", 0, 20, 0)], dugme: false,
    ciz: ([y]) => kart([8 + y, 16 + y], asal) + `<p class="cn-sonuc">Ece ${8 + y} · Emre ${16 + y}</p>`,
    kosullar: [{ ad: "Ece'nin yaşı asal", f: ([y]) => asal(8 + y) }, { ad: "Emre'nin yaşı asal", f: ([y]) => asal(16 + y) }],
    sutun: ["Yıl sonra", "Ece", "Emre", "İkisi de asal mı?"], satir: ([y], h) => [y, 8 + y, 16 + y, h ? "evet" : "hayır"],
    yon: "Yılları birer birer ilerletin. İkisinin yaşının da asal olduğu ilk yılı bulun; yaş farkının değişip değişmediğine bakın.",
    bitis: "İlk uygun yılı bulduğunuzda." }),

  /* 13 · rakam kartları */
  13: el => CN.KOSUL(el, { girdi: [sec("Onlar:", [1, 2, 5, 7], 1), sec("Birler:", [1, 2, 5, 7], 2)],
    ciz: ([a, b]) => kart([`${a}${b}`], () => asal(10 * a + b)),
    kosullar: [{ ad: "Farklı kartlar", f: ([a, b]) => a !== b }, { ad: "Sayı asal", f: ([a, b]) => ({ ok: asal(10 * a + b), not: asal(10 * a + b) ? "" : (() => { const n = 10 * a + b, p = fac(n)[0]; return `${n} = ${p} x ${n / p}`; })() }) }],
    sutun: ["Sayı", "Asal mı?"], satir: ([a, b]) => [`${a}${b}`, asal(10 * a + b) ? "evet" : "hayır"], iyi: ([a, b]) => a !== b && asal(10 * a + b),
    yon: "Kartları basamaklara koyup sınayın. Birler basamağı 2 ya da 5 olan sayıları ayrıca denemeye gerek var mı? Puan getiren bütün sayıları bulun.",
    bitis: "Puan getiren sayıların hepsini bulduğunuzu düşündüğünüzde." }),

  /* 14 · sınıf mevcudu */
  14: el => CN.KOSUL(el, { girdi: [sec("Mevcut (40'tan küçük bir asal):", [29, 31, 37], 29), sayi("Katılan öğrenci:", 0, 9, 0)],
    ciz: ([m, k]) => `<p class="cn-sonuc">${m} + ${k} = ${m + k} öğrenci · ${bk(m + k, 4)}</p>`,
    kosullar: [{ ad: "Mevcut, 40'tan küçük en büyük asal", f: ([m]) => m === 37 }, { ad: "4'er kişilik gruplar tam", f: ([m, k]) => (m + k) % 4 === 0 }],
    sutun: ["Mevcut", "Katılan", "Toplam", "4'e bölünür mü?"], satir: ([m, k]) => [m, k, m + k, (m + k) % 4 ? "hayır" : "evet"],
    yon: "Önce 40'tan küçük en büyük asal sayıyı seçin, sonra katılan öğrenci sayısını artırarak gruplar tam olana kadar deneyin.",
    bitis: "İki koşul birlikte sağlandığında." }),

  /* 15 · Can'ın önermesi */
  15: el => CN.ONERME(el, { onermeler: [{ ad: "Can", metin: "Tek bir asal sayıya 6 eklersem her zaman yine bir asal sayı elde ederim.",
      sina: n => { if (!(asal(n) && n % 2)) return { ok: true, goster: `${n} tek bir asal sayı değil; bu sayı önermeyi sınamaz.`, not: "Tek bir asal sayı yazın." };
        const m = n + 6; return { ok: asal(m), goster: `${n} + 6 = ${m}${asal(m) ? " (asal)" : ` = ${fac(m)[0]} x ${m / fac(m)[0]}`}` }; } }],
    yon: "Tek asal sayılar yazıp Sına'ya basın. 6 eklenince asal olmayan bir sayı veren bir asal bulursanız önerme çürür.",
    bitis: "Bir karşı örnek bulduğunuzda." }),

  /* 16 · eksik algoritma kartı */
  16: el => CN.KOSUL(el, { girdi: [sayi("■ tahmini:", 100, 700, 300)],
    ciz: ([n]) => `<p class="cn-sonuc">■ = ${n} → ■ : 3 = ${n % 3 ? "kalanlı" : n / 3}${n % 3 ? "" : ` → ▲ : 3 = ${(n / 3) % 3 ? "kalanlı" : n / 9}`}</p>`,
    kosullar: [{ ad: "■ : 3 kalansız", f: ([n]) => n % 3 === 0 }, { ad: "▲ : 3 kalansız", f: ([n]) => n % 9 === 0 }, { ad: "♦ : 5 = 13", f: ([n]) => n === 585 }],
    sutun: ["■", "▲", "♦", "Uyuyor mu?"], satir: ([n], h) => [n, n % 3 ? "—" : n / 3, n % 9 ? "—" : n / 9, h ? "evet" : "hayır"],
    yon: "■ için bir sayı yazıp Sına'ya basın. Algoritmayı aşağıdan yukarı kurmayı düşünün: 13 x 5 = ♦, ♦ x 3 = ▲, ▲ x 3 = ■.",
    bitis: "Bütün koşulları sağlayan ■'yi bulduğunuzda." }),

  /* 17 · bilmece */
  17: el => CN.KOSUL(el, { girdi: [sayi("Sayı:", 2, 99, 26)],
    ciz: ([n]) => `<p class="cn-sonuc">${n} = ${xY(fac(n))} · farklı asal çarpanlar: ${fa(n).join(", ")}</p>`,
    kosullar: [{ ad: "Farklı asal çarpanların toplamı 15", f: ([n]) => ({ ok: fa(n).reduce((a, b) => a + b, 0) === 15, not: `toplam ${fa(n).reduce((a, b) => a + b, 0)}` }) }, { ad: "100'den küçük", f: ([n]) => n < 100 }],
    sutun: ["Sayı", "Farklı asal çarpanlar", "Toplam"], satir: ([n]) => [n, fa(n).join(", "), fa(n).reduce((a, b) => a + b, 0)],
    yon: "Sayıları deneyin. Toplamı 15 olan farklı asal sayıları düşünün (2 ve 13; 3, 5 ve 7). Koşula uyan sayıların en büyüğünü bulun.",
    bitis: "Koşula uyan en büyük sayıyı bulduğunuzda." }),

  /* 18 · ürün kodları */
  18: el => { const U = { A: [2, 3, 3, 7], B: [2, 3, 5, 7], C: [3, 3, 7, 7], D: [2, 2, 3, 7] }; const v = L => L.reduce((a, b) => a * b, 1);
    return CN.KOSUL(el, { girdi: [sec("Ürün:", ["A", "B", "C", "D"], "A", s => s + " ürünü")], dugme: "Siparişle karşılaştır ▶",
      ciz: ([u]) => `<p class="cn-sonuc">${u} ürünü: ${xY(U[u])} = ${v(U[u])}</p>`,
      kosullar: [{ ad: "9'a bölünür (iki tane 3 var)", f: ([u]) => ({ ok: v(U[u]) % 9 === 0, not: bk(v(U[u]), 9) }) }, { ad: "14'e bölünür (2 ve 7 var)", f: ([u]) => ({ ok: v(U[u]) % 14 === 0, not: bk(v(U[u]), 14) }) }],
      sutun: ["Ürün", "Asal çarpanlar", "9'a?", "14'e?"], satir: ([u]) => [u, xY(U[u]), v(U[u]) % 9 ? "hayır" : "evet", v(U[u]) % 14 ? "hayır" : "evet"],
      yon: "Ürünleri sırayla seçip siparişle karşılaştırın. Bölme yapmadan, asal çarpanlara bakarak karar verebilir misiniz?",
      bitis: "Dört ürünü de denediğinizde." }); },

  /* 19 · çarpan sayısı tablosu */
  19: el => CN.KOSUL(el, { girdi: [sec("Sayı:", [1, 19, 27, 34], 1)], dugme: "Çarpanları say ▶",
    ciz: ([n]) => `<p class="cn-sonuc">${n} sayısının çarpanları: ${divs(n).join(", ")}</p>`,
    kosullar: [{ ad: "Tam iki çarpan (asal)", f: ([n]) => ({ ok: divs(n).length === 2, not: `${divs(n).length} çarpan` }) }],
    sutun: ["Sayı", "Çarpanlar", "Çarpan sayısı", "Asal mı?"], satir: ([n], h) => [n, divs(n).join(", "), divs(n).length, h ? "evet" : "hayır"],
    yon: "Tablodaki sayıları sırayla seçip çarpanlarını sayın. 1'in çarpan sayısına dikkat edin.",
    bitis: "Dört sayıyı da denediğinizde." }),

  /* 20 · üç kilit */
  20: el => CN.KOSUL(el, { girdi: [sayi("■ (en küçük şifre):", 1, 20, 5)], dugme: false,
    ciz: ([a]) => kart([a, a + 1, a + 2], x => asal(x)) + `<p class="cn-sonuc">■ = ${a} · ▲ = ${a + 1} · ♦ = ${a + 2}</p>`,
    kosullar: [{ ad: "■ asal", f: ([a]) => asal(a) }, { ad: "▲ asal", f: ([a]) => asal(a + 1) }, { ad: "♦, 4'ün katı", f: ([a]) => (a + 2) % 4 === 0 }],
    sutun: ["■", "▲", "♦", "Hepsi uyuyor mu?"], satir: ([a], h) => [a, a + 1, a + 2, h ? "evet" : "hayır"],
    yon: "■'yi değiştirerek ardışık üç sayıyı izleyin. ■ ve ▲'nın ikisinin de asal olduğu durumları arayın; ardışık iki sayıdan biri her zaman çifttir.",
    bitis: "Üç koşulu birlikte sağlayan sayıları bulduğunuzda." }),
};
})();

<script>
const V={"baslik": "Asal Sayılar ve Asal Çarpanlar", "kod": "6. SINIF · MAT.6.1.3", "ses": "", "bet": "BAĞLAM TEMELLİ SORU", "bad": "Bağlam Soruları", "s": [{"no": 1, "bas": "Asal sayıyı tanıma", "q": [{"k": "41, 45, 49 ve 43 sayılarının çarpanlarını yazınız. Bu sayılardan hangileri asaldır?", "a": ["41'in çarpanları: 1, 41. 43'ün çarpanları: 1, 43.", "45'in çarpanları: 1, 3, 5, 9, 15, 45. 49'un çarpanları: 1, 7, 49.", "Tam iki çarpanı (1 ve kendisi) olan sayılar asaldır."], "c": "41 ve 43 asaldır; 45 ve 49 asal değildir."}, {"k": "17 tane eş kare karo kullanılarak dikdörtgen biçiminde kaç farklı zemin döşenebilir? Bu sonuca göre 17 asal sayı mıdır?", "a": ["Dikdörtgenin bir sırasındaki karo sayısı ile sıra sayısının çarpımı 17 olmalıdır.", "17 = 1 x 17 dışında 17'yi veren bir çarpım yoktur; 2, 3, 4, …, 16 sayılarından hiçbiri 17'yi kalansız bölmez.", "Yalnız tek sıralı (1 x 17) bir zemin döşenebilir. 17'nin yalnız iki çarpanı (1 ve 17) vardır."], "c": "Yalnız 1 zemin (1 x 17); 17 asaldır."}]}, {"no": 2, "bas": "Kalbur düşüncesi", "q": [{"k": "50 ile 70 arasındaki asal sayıları kalbur düşüncesiyle bulunuz.", "a": ["Çift sayılar (2'nin katları) elenir: 52, 54, …, 68.", "Kalan tek sayılardan 3'ün katları (51, 57, 63, 69), 5'in katı (55) ve 7'nin katı (63) elenir.", "Elenmeyen sayılar asaldır."], "c": "53, 59, 61, 67"}, {"k": "Altı sütunlu bir tabloya sayılar 1'den başlayarak satır satır yazılmıştır (1. satır: 1, 2, 3, 4, 5, 6). 79 sayısı tablonun hangi sütunundadır? 79, 6'nın hangi katının yanındadır?", "a": ["6'nın katları 6. sütundadır: 6, 12, 18, …, 78.", "79 = 6 x 13 + 1 olduğundan 79, 78'in hemen sağındaki sütuna, yani yeni satırın 1. sütununa düşer.", "79, 6'nın katı olan 78'in 1 fazlasıdır."], "c": "1. sütun; 79 = 6 x 13 + 1 (78'in yanı)"}]}, {"no": 3, "bas": "Önerme ve karşı örnek", "q": [{"k": "“Bir asal sayının 2 katı da asal sayıdır.” önermesi doğru mudur? Gerekçesiyle açıklayınız.", "a": ["Bir asal sayının 2 katı, 2'nin de katıdır; 2'ye kalansız bölünür.", "Örneğin 5'in 2 katı 10'dur; 10 = 2 x 5 olduğundan 10'un çarpanları 1, 2, 5, 10'dur.", "2'den büyük her çift sayının en az üç çarpanı (1, 2 ve kendisi) vardır; asal olamaz."], "c": "Yanlıştır; örneğin 2 x 5 = 10 asal değildir."}, {"k": "“Rakamlarının toplamı 10 olan her iki basamaklı sayı asaldır.” önermesinin yanlış olduğunu bir karşı örnekle gösteriniz.", "a": ["Rakamlarının toplamı 10 olan iki basamaklı sayılar: 19, 28, 37, 46, 55, 64, 73, 82, 91.", "28 çift sayıdır: 28 = 2 x 14. 28'in çarpanları 1, 2, 4, 7, 14, 28'dir.", "Önermeyi sağlamayan tek bir sayı, önermenin yanlış olduğunu gösterir."], "c": "Karşı örnek: 28 (46, 55, 64, 82 ve 91 de olur)."}]}, {"no": 4, "bas": "Asal mı, değil mi?", "q": [{"k": "63 ve 67 sayılarının asal olup olmadığını gerekçeleriyle belirleyiniz.", "a": ["63'ün rakamlarının toplamı 9'dur; 63, 3'e bölünür: 63 = 3 x 21. 63 asal değildir.", "67 tektir, rakamlarının toplamı 13'tür, birler basamağı 7'dir: 2, 3 ve 5'e bölünmez.", "67 : 7 işleminde bölüm 9, kalan 4'tür. 100'den küçük olan 67, 2, 3, 5 ve 7'nin hiçbirine bölünmediği için asaldır."], "c": "63 asal değildir (63 = 3 x 21); 67 asaldır."}, {"k": "Hesap makinesi kullanarak 221 sayısının asal olup olmadığını belirleyiniz.", "a": ["221 tektir; rakamlarının toplamı 5 olduğundan 3'e, birler basamağı 1 olduğundan 5'e bölünmez.", "Hesap makinesiyle asal sayılara sırayla bölünür: 221 : 7 ≈ 31,57 ve 221 : 11 ≈ 20,09 (bölüm doğal sayı değil).", "221 : 13 = 17; bölüm bir doğal sayıdır. 221 = 13 x 17 olduğundan 221'in 1 ve kendisinden başka çarpanları vardır."], "c": "221 asal değildir; 221 = 13 x 17."}]}, {"no": 5, "bas": "Çarpan listesinden asal çarpanlar", "q": [{"k": "46 sayısının çarpanlarını yazınız. Bu çarpanlardan hangileri 46'nın asal çarpanlarıdır?", "a": ["46'nın çarpan çiftleri: 1 x 46, 2 x 23. Çarpanlar: 1, 2, 23, 46.", "1 asal değildir; 46 çift olduğu için asal değildir.", "2 ve 23 asaldır; bunlar 46'nın asal çarpanlarıdır."], "c": "Çarpanlar: 1, 2, 23, 46 · asal çarpanlar: 2 ve 23"}, {"k": "20, 24, 40 ve 36 sayılarından asal çarpanları aynı olanları eşleştiriniz.", "a": ["20'nin çarpanları 1, 2, 4, 5, 10, 20 → asal çarpanları 2 ve 5. 40'ın asal çarpanları da 2 ve 5'tir.", "24'ün çarpanları 1, 2, 3, 4, 6, 8, 12, 24 → asal çarpanları 2 ve 3. 36'nın asal çarpanları da 2 ve 3'tür.", "Asal çarpanları aynı olan sayıların çarpanları farklı olabilir."], "c": "20 ile 40 (2 ve 5) · 24 ile 36 (2 ve 3)"}]}, {"no": 6, "bas": "Asal çarpanlarına ayırma", "q": [{"k": "132 sayısını asal çarpan algoritmasıyla asal çarpanlarına ayırınız.", "a": ["132 çifttir: 132 : 2 = 66. 66 çifttir: 66 : 2 = 33.", "33, 3'e bölünür: 33 : 3 = 11. 11 asaldır: 11 : 11 = 1.", "Sağ sütundaki asal sayılar çarpılır: 132 = 2 x 2 x 3 x 11."], "c": "132 = 2 x 2 x 3 x 11"}, {"k": "Bir çarpan ağacında en üstte 126 yazmaktadır. İlk dallar 2 ve ■, ■ sayısının dalları 7 ve ▲, ▲ sayısının dalları 3 ve 3'tür. ■ ve ▲ kaçtır? 126'yı asal çarpanlarının çarpımı olarak yazınız.", "a": ["126 = 2 x ■ olduğundan ■ = 126 : 2 = 63.", "63 = 7 x ▲ olduğundan ▲ = 63 : 7 = 9; 9 = 3 x 3.", "Ağacın yaprakları 2, 7, 3, 3'tür: 126 = 2 x 3 x 3 x 7."], "c": "■ = 63, ▲ = 9; 126 = 2 x 3 x 3 x 7"}]}, {"no": 7, "bas": "Sayı ile asal çarpanları arasındaki ilişkiler", "q": [{"k": "Asal çarpanları 2, 3 ve 5 olan (başka asal çarpanı olmayan) en küçük üç basamaklı sayı kaçtır?", "a": ["Sayı 2, 3 ve 5'in her birini en az bir kez içermelidir: 2 x 3 x 5 = 30 ve sayı 30'un katıdır.", "30'un katları: 30, 60, 90, 120, … 120 üç basamaklı ilk kattır.", "120 = 2 x 2 x 2 x 3 x 5; başka asal çarpanı yoktur."], "c": "120"}, {"k": "154 = 2 x 7 x 11 olduğuna göre 4, 14, 21, 22, 33 ve 77 sayılarından hangileri 154'ün çarpanıdır?", "a": ["154'ün asal çarpanlarından seçilen grupların çarpımları 154'ün çarpanlarıdır: 2 x 7 = 14, 2 x 11 = 22, 7 x 11 = 77.", "4 = 2 x 2: 154'te yalnız bir tane 2 vardır. 21 = 3 x 7 ve 33 = 3 x 11: 3, 154'ün asal çarpanı değildir.", "Çarpan olanlar 14, 22 ve 77'dir."], "c": "14, 22 ve 77 çarpandır; 4, 21 ve 33 değildir."}]}, {"no": 8, "bas": "Asal sayılar ve problemler", "q": [{"k": "Bir öğrencinin yaşı bir asal sayıdır. 5 yıl sonra da yaşı bir asal sayı olacaktır. Bu öğrenci bugün kaç yaşındadır?", "a": ["Bir sayı ile 5 fazlasından biri tek, öbürü çifttir (tek + tek = çift, çift + tek = tek).", "İkisi de asal olacaksa çift olan 2 olmalıdır; çünkü çift sayılardan yalnız 2 asaldır.", "5 fazlası 2 olan bir doğal sayı yoktur; o hâlde bugünkü yaş 2'dir ve 5 yıl sonra 7 olur."], "c": "2 yaşındadır (5 yıl sonra 7)."}, {"k": "Bir koro öğretmeni öğrencilerini eşit sayıda öğrencinin bulunduğu sıralara dizmek istiyor. Her sırada en az 2 öğrenci ve en az 2 sıra olacaktır. Öğrenci sayısı 40 ile 50 arasında olduğuna ve bu dizilim yapılamadığına göre öğrenci sayısı kaç olabilir?", "a": ["Sıra sayısı x bir sıradaki öğrenci = öğrenci sayısı olmalıdır; iki çarpan da en az 2'dir.", "Böyle bir çarpım yazılamıyorsa öğrenci sayısının 1 ve kendisinden başka çarpanı yoktur; sayı asaldır.", "40 ile 50 arasındaki asal sayılar: 41, 43 ve 47 (42, 44, 46, 48 çift; 45 ve 49 asal değil)."], "c": "41, 43 ya da 47"}]}], "k": [{"no": 1, "bas": "Asal mı?", "yon": "Her sayının yanına sayı asalsa “asal” yazınız. Asal değilse sayıyı veren bir çarpımı (1 x sayı dışında) yazınız.", "r": [{"n": "26", "c": "asal değil (26 = 2 x 13)"}, {"n": "39", "c": "asal değil (39 = 3 x 13)"}, {"n": "59", "c": "asal"}, {"n": "34", "c": "asal değil (34 = 2 x 17)"}, {"n": "85", "c": "asal değil (85 = 5 x 17)"}, {"n": "89", "c": "asal"}, {"n": "87", "c": "asal değil (87 = 3 x 29)"}, {"n": "99", "c": "asal değil (99 = 3 x 33)"}, {"n": "37", "c": "asal"}, {"n": "62", "c": "asal değil (62 = 2 x 31)"}]}, {"no": 2, "bas": "Asal çarpanlarına ayırınız", "yon": "Her sayıyı asal çarpan algoritmasıyla asal çarpanlarına ayırınız ve asal çarpanlarının çarpımı olarak yazınız.", "r": [{"n": "44", "c": "44 = 2 x 2 x 11"}, {"n": "75", "c": "75 = 3 x 5 x 5"}, {"n": "98", "c": "98 = 2 x 7 x 7"}, {"n": "104", "c": "104 = 2 x 2 x 2 x 13"}, {"n": "135", "c": "135 = 3 x 3 x 3 x 5"}, {"n": "162", "c": "162 = 2 x 3 x 3 x 3 x 3"}, {"n": "190", "c": "190 = 2 x 5 x 19"}, {"n": "231", "c": "231 = 3 x 7 x 11"}]}, {"no": 3, "bas": "Asal çarpanlar ve sayı", "yon": "İlk dört satırda asal çarpanlarının çarpımı verilen sayıyı yazınız. Son dört satırda sayının kendisi hariç en büyük çarpanını yazınız.", "r": [{"n": "2 x 2 x 3 x 7", "c": "84"}, {"n": "3 x 5 x 13", "c": "195"}, {"n": "2 x 3 x 11", "c": "66"}, {"n": "2 x 2 x 2 x 17", "c": "136"}, {"n": "133: kendisi hariç en büyük çarpan", "c": "133 : 7 = 19"}, {"n": "116: kendisi hariç en büyük çarpan", "c": "116 : 2 = 58"}, {"n": "143: kendisi hariç en büyük çarpan", "c": "143 : 11 = 13"}, {"n": "161: kendisi hariç en büyük çarpan", "c": "161 : 7 = 23"}]}], "b": [{"no": 1, "on": "<p>Bir usta, dört kutudaki eş kare karoları kullanarak dikdörtgen biçiminde zeminler döşeyecektir. Her kutudaki karoların sayısı kutunun üzerindeki etikette yazmaktadır.</p>", "g": "<svg viewBox=\"0 0 700 240\" width=\"700\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"'Liberation Sans', Arial, sans-serif\"><rect x=\"0.0\" y=\"0.0\" width=\"700.0\" height=\"240.0\" rx=\"0\" fill=\"#f8f6f1\" stroke=\"none\" stroke-width=\"0\"/><rect x=\"0.0\" y=\"196.0\" width=\"700.0\" height=\"44.0\" rx=\"0\" fill=\"#e9e2d0\" stroke=\"none\" stroke-width=\"0\"/><path d=\"M30,110 l20,-18 h110 l-20,18 z\" fill=\"#f1f3f5\" stroke=\"#1c7ed6\" stroke-width=\"2\"/><rect x=\"30.0\" y=\"110.0\" width=\"110.0\" height=\"86.0\" rx=\"4\" fill=\"#ffffff\" stroke=\"#1c7ed6\" stroke-width=\"2.5\"/><path d=\"M140,110 l20,-18 v86 l-20,18 z\" fill=\"#e9ecef\" stroke=\"#1c7ed6\" stroke-width=\"2\"/><rect x=\"44.0\" y=\"128.0\" width=\"82.0\" height=\"50.0\" rx=\"6\" fill=\"#ffffff\" stroke=\"#1c7ed6\" stroke-width=\"1.6\"/><text x=\"85.0\" y=\"151.0\" font-size=\"12.5\" font-weight=\"800\" fill=\"#1c7ed6\" text-anchor=\"middle\">MAVI</text><text x=\"85.0\" y=\"171.0\" font-size=\"17\" font-weight=\"800\" fill=\ ır.", "ses": "b06"}, {"no": 7, "on": "<p>Ali ile Ayşe, 240 sayısını çarpan ağacı yöntemiyle asal çarpanlarına ayırmaktadır. Ali ağacını tamamlamıştır; Ayşe ise ağacına 6 x 40 ile başlamıştır.</p>", "g": "<svg viewBox=\"0 0 700 250\" width=\"700\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"'Liberation Sans', Arial, sans-serif\"><rect x=\"0.0\" y=\"0.0\" width=\"700.0\" height=\"250.0\" rx=\"0\" fill=\"#f6fbf4\" stroke=\"none\" stroke-width=\"0\"/><line x1=\"150.0\" y1=\"59.0\" x2=\"90.0\" y2=\"81.0\" stroke=\"#5c6370\" stroke-width=\"1.6\"/><line x1=\"150.0\" y1=\"59.0\" x2=\"210.0\" y2=\"81.0\" stroke=\"#5c6370\" stroke-width=\"1.6\"/><line x1=\"90.0\" y1=\"119.0\" x2=\"60.0\" y2=\"141.0\" stroke=\"#5c6370\" stroke-width=\"1.6\"/><line x1=\"90.0\" y1=\"119.0\" x2=\"120.0\" y2=\"141.0\" stroke=\"#5c6370\" stroke-width=\"1.6\"/><line x1=\"210.0\" y1=\"119.0\" x2=\"180.0\" y2=\"141.0\" stroke=\"#5c6370\" stroke-width=\"1.6\"/><line x1=\"210.0\" y1=\"119.0\" x2=\"240.0\" y2=\"141.0\" stroke=\"#5c6370\" stroke-width=\"1.6\"/><line x1=\"120.0\" y1=\"179.0\" x2=\"100.0\" y2=\"201.0\" stroke=\"#5c6370\" stroke-width=\"1.6\"/><line x1=\"120.0\" y1=\"179.0\" x2=\"140.0\" y2=\"201.0\" stroke=\"#5c6370\" stroke-width=\"1.6\"/><line x1=\"180.0\" y1=\"179.0\" x2=\"160.0\" y2=\"201.0\" stroke=\"#5c6370\" stroke-width=\"1.6\"/><line x1=\"180.0\" y1=\"179.0\" x2=\"200.0\" y2=\"201.0\" stroke=\"#5c6370\" stroke-width=\"1.6\"/><circle cx=\"150.0\" cy=\"40.0\" r=\"19.0\" fill=\"#ffffff\" stroke=\"#111111\" stroke-width=\"1.8\"/><text x=\"150.0\" y=\"46.0\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">240</text><circle cx=\"90.0\" cy=\"100.0\" r=\"19.0\" fill=\"#ffffff\" stroke=\"#111111\" stroke-width=\"1.8\"/><text x=\"90.0\" y=\"106.0\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">12</text><circle cx=\"210.0\" cy=\"100.0\" r=\"19.0\" fill=\"#ffffff\" stroke=\"#111111\" stroke-width=\"1.8\"/><text x=  y=\"14.0\" font-size=\"15\" font-weight=\"800\" fill=\"#2b8a3e\" text-anchor=\"middle\">Ayşe'nin çarpan ağacı (yarım)</text><line x1=\"520.0\" y1=\"59.0\" x2=\"460.0\" y2=\"81.0\" stroke=\"#5c6370\" stroke-width=\"1.6\"/><line x1=\"520.0\" y1=\"59.0\" x2=\"580.0\" y2=\"81.0\" stroke=\"#5c6370\" stroke-width=\"1.6\"/><circle cx=\"520.0\" cy=\"40.0\" r=\"19.0\" fill=\"#ffffff\" stroke=\"#111111\" stroke-width=\"1.8\"/><text x=\"520.0\" y=\"46.0\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">240</text><circle cx=\"460.0\" cy=\"100.0\" r=\"19.0\" fill=\"#ffffff\" stroke=\"#111111\" stroke-width=\"1.8\"/><text x=\"460.0\" y=\"106.0\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">6</text><circle cx=\"580.0\" cy=\"100.0\" r=\"19.0\" fill=\"#ffffff\" stroke=\"#111111\" stroke-width=\"1.8\"/><text x=\"580.0\" y=\"106.0\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">40</text><text x=\"520.0\" y=\"170.0\" font-size=\"28\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">…</text></svg>", "son": "<p>Ayşe ağacını, uçlarında yalnız asal sayılar kalana kadar sürdürecektir.</p>", "k": "Buna göre, Ayşe'nin ağacı tamamlandığında uçlardaki asal sayılardan kaç tanesi 2 olur?", "sec": ["2", "3", "4", "5"], "secg": null, "c": "C", "a": ["Ali'nin ağacının uçları 3, 2, 2, 2, 2, 5'tir: 240 = 2 x 2 x 2 x 2 x 3 x 5.", "Bir sayının asal çarpanlarına ayrılışı, hangi ağaç çizilirse çizilsin aynıdır. Ayşe'nin ağacında da dört tane 2 bulunur (6 = 2 x 3, 40 = 2 x 2 x 2 x 5)."], "t": "2: yalnız ilk dallardaki 6 ve 40'ın birer 2'si sayılmış; 3: 40'taki 2'lerden biri unutulmuş; 5: 3 de 2 sanılmış", "d": "Çarpan ağacında yaprakların hepsi asal olana kadar dallanma sürer. Farklı ağaçlar çizilse de yapraklardaki asal sayılar aynı çıkar.", "ses": "b07"}, {"no": 8, "on": "<p>Bir spor kulübündeki dolaplardan birinin kilidi üç basamaklı bir şifreyle açılmaktadır. Dolabın sahibi şifreyi hatırlamak için ya -size=\"16\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">bir sayıdır.</text><text x=\"545.0\" y=\"150.0\" font-size=\"16\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Asal çarpanları yalnız</text><text x=\"545.0\" y=\"176.0\" font-size=\"16\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">2 ve 7'dir.</text><text x=\"545.0\" y=\"204.0\" font-size=\"13.5\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Şifre mümkün olan en küçük sayıdır.</text></svg>", "son": "", "k": "Buna göre, dolabın şifresi kaçtır?", "sec": ["112", "168", "196", "224"], "secg": null, "c": "A", "a": ["Şifre 2'ye ve 7'ye bölünür ve başka asal çarpanı yoktur; yani 2 x 7 = 14'ün katıdır ve 14 ile çarpılan sayıda yalnız 2 ve 7 bulunur.", "14 x 2 = 28, 14 x 4 = 56, 14 x 8 = 112. 112 = 2 x 2 x 2 x 2 x 7 üç basamaklı ilk sayıdır (14 x 7 = 98 iki basamaklıdır)."], "t": "168: 168 = 2 x 2 x 2 x 3 x 7, 3 de asal çarpandır; 196 ve 224: koşula uyar ama en küçük değildir", "d": "Asal çarpanları yalnız 2 ve 7 olan sayılar 2 x 7 = 14'ün katıdır; ama 14'ün her katı uygun değildir: 14 ile çarpılan sayıda 3, 5 gibi başka bir asal bulunmamalıdır.", "ses": "b08"}, {"no": 9, "on": "<p>Bir robot, sırayla iki ekranda gördüğü sayılara göre ileri gitmektedir. Robotun kuralı ve ekranlardaki sayılar aşağıda gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 700 240\" width=\"700\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"'Liberation Sans', Arial, sans-serif\"><rect x=\"0.0\" y=\"0.0\" width=\"700.0\" height=\"240.0\" rx=\"0\" fill=\"#eef6f7\" stroke=\"none\" stroke-width=\"0\"/><rect x=\"30.0\" y=\"30.0\" width=\"300.0\" height=\"180.0\" rx=\"14\" fill=\"#ffffff\" stroke=\"#0b7285\" stroke-width=\"2.5\"/><text x=\"180.0\" y=\"70.0\" font-size=\"17\" font-weight=\"800\" fill=\"#0b7285\" text-anchor=\"middle\">ROBOTUN KURALI</text><text x=\"180.0\" y=\"104.0\" font-size=\"15.5\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Ekrandaki sa : 51 ya da 57 gibi 3'e bölünen tek sayılar asal sanılmış", "d": "Rakam koşullu sorularda önce rakamlarla yazılabilecek bütün sayıları listeleyiniz, sonra asal olanları seçiniz. Birler basamağı 2 ya da 5 olan iki basamaklı sayılar asal değildir.", "ses": "b13"}, {"no": 14, "on": "<p>Bir sınıfın tahtasına sınıfla ilgili bilgiler yazılmıştır. Öğretmen, sınıfı 4'er kişilik gruplara ayırmak istemektedir.</p>", "g": "<svg viewBox=\"0 0 700 230\" width=\"700\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"'Liberation Sans', Arial, sans-serif\"><rect x=\"0.0\" y=\"0.0\" width=\"700.0\" height=\"230.0\" rx=\"0\" fill=\"#f1f6fb\" stroke=\"none\" stroke-width=\"0\"/><rect x=\"40.0\" y=\"24.0\" width=\"360.0\" height=\"182.0\" rx=\"6\" fill=\"#2f4f3f\" stroke=\"#8a6a36\" stroke-width=\"7\"/><text x=\"220.0\" y=\"76.0\" font-size=\"20\" font-weight=\"800\" fill=\"#ffffff\" text-anchor=\"middle\">6-B sınıfı</text><text x=\"220.0\" y=\"114.0\" font-size=\"17\" font-weight=\"700\" fill=\"#d8f0e0\" text-anchor=\"middle\">Mevcut: 40'tan küçük</text><text x=\"220.0\" y=\"142.0\" font-size=\"17\" font-weight=\"700\" fill=\"#d8f0e0\" text-anchor=\"middle\">en büyük asal sayı</text><text x=\"220.0\" y=\"180.0\" font-size=\"16\" font-weight=\"700\" fill=\"#ffe8a3\" text-anchor=\"middle\">Gruplar: 4'er kişilik</text><circle cx=\"460.0\" cy=\"120.0\" r=\"13.5\" fill=\"#f6d7b8\" stroke=\"#8a5a3a\" stroke-width=\"1.2\"/><path d=\"M437.5,174.0 q0,-22 22.5,-22 q22.5,0 22.5,22 z\" fill=\"#a5d8ff\" stroke=\"#1864ab\" stroke-width=\"1.2\"/><circle cx=\"512.0\" cy=\"120.0\" r=\"13.5\" fill=\"#f6d7b8\" stroke=\"#8a5a3a\" stroke-width=\"1.2\"/><path d=\"M489.5,174.0 q0,-22 22.5,-22 q22.5,0 22.5,22 z\" fill=\"#a5d8ff\" stroke=\"#1864ab\" stroke-width=\"1.2\"/><circle cx=\"564.0\" cy=\"120.0\" r=\"13.5\" fill=\"#f6d7b8\" stroke=\"#8a5a3a\" stroke-width=\"1.2\"/><path d=\"M541.5,174.0 q0,-22 22.5,-22 q22.5,0 22.5,22 z\" fill=\"#a5d8ff\" stroke=\"#1864ab\" stroke-width=\"1.2\"/><circle   // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
