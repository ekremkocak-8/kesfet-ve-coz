const cs_=n=>divs(n).length;
function adaylar(){for(let d=0;d<500;d++){const L=karistir(aralik(10,40)).slice(0,4),c=L.map(cs_),m=Math.max(...c),en=L[c.indexOf(m)];if(c.filter(x=>x===m).length===1&&en!==Math.max(...L))return L;}return [30,31,16,35];}
function sayimTur(k,D,A){const L=adaylar();let i=0;
  k.insertAdjacentHTML("beforeend",`<div class="ys-kart">${L.map((x,j)=>`<div data-j="${j}"><b>${x}</b><small class="ys-c">? çarpan</small></div>`).join("")}</div><div class="ys-ic"></div><div class="ys-son"></div>`);
  const ic=k.querySelector(".ys-ic"),kr=j=>k.querySelector(`.ys-kart div[data-j="${j}"]`);
  const git=()=>{if(i>=L.length){ic.innerHTML="";const c=L.map(cs_),m=Math.max(...c),en=L[c.indexOf(m)],dig=L.filter(x=>x!==en);
      soruY(k.querySelector(".ys-son"),"Çarpan sayısı en fazla olan sayı hangisidir?",[String(en),...dig.map(String)],`Doğru! ${ekS(en,"in")} ${m} çarpanı var. En büyük sayı ${Math.max(...L)} ise yalnız ${cs_(Math.max(...L))} çarpana sahip.`,dig.map(x=>`${ekS(x,"in")} ${cs_(x)} çarpanı var; daha fazlası var.`),()=>A.tamam("Çarpan sayılarını karşılaştırdınız."));return;}
    const n=L[i];kr(i).classList.add("simdi");A.durum(`${i+1} / ${L.length}`);ic.innerHTML="";
    cokSec(ic,{ust:`<p class="soru"><b>${n}</b> sayısının bütün çarpanlarını seçiniz.</p>`,sayilar:aralik(1,n),dogru:new Set(divs(n)),yanlis:x=>`${kalanY(n,x)}; ${x} çarpan değil.`,eksik:(m,e)=>`${m} çarpan eksik. Çarpan çiftlerini düşününüz: ${e[0]} x ${n/e[0]} = ${n} gibi.`,ok:`Doğru! ${ekS(n,"in")} ${cs_(n)} çarpanı var.`,sonra:()=>{kr(i).classList.remove("simdi");kr(i).classList.add("tamam");kr(i).querySelector(".ys-c").textContent=`${cs_(n)} çarpan`;D.ekle([String(n),divs(n).join(", "),String(cs_(n))],"n"+n);i++;git();}});};git();}
function yarisTur(k,D,A){let tur=0,sen=0,bil=0,bitti=false,kilit=false;const R=[20,30,40];
  k.insertAdjacentHTML("beforeend",`<div class="kurallar"><h4>Yarış kuralları</h4><ul><li><b>Tur:</b> Yarış 3 turdur. Her turda 10 sayılık bir aralık verilir.<span class="orn">Örnek: 20 ile 29 arası.</span></li><li><b>Seçim:</b> Siz aralıktan bir sayı seçersiniz; bilgisayar da aynı aralıktan rastgele bir sayı seçer.</li><li><b>Kazanan:</b> Çarpan sayısı fazla olan sayıyı seçen turu alır. Eşitlikte tur berabere biter.<span class="orn">Örnek: 20'nin 6 çarpanı, 23'ün 2 çarpanı var; 20'yi seçen turu alır.</span></li><li><b>Bitiş:</b> 3 tur bitince yarış biter; kazanıp kaybetmeniz fark etmez.</li></ul></div><div class="skorlar s3"><div><small>Tur</small><b class="y-t">0 / 3</b></div><div><small>Siz</small><b class="y-s">0</b></div><div><small>Bilgisayar</small><b class="y-b">0</b></div></div><div class="dkart y-a"></div><div class="chips y-sec"></div><div class="fb" hidden></div>`);
  const f=k.querySelector(".fb"),ys=k.querySelector(".y-sec"),ya=k.querySelector(".y-a");
  const skor=()=>{k.querySelector(".y-t").textContent=`${Math.min(tur+1,3)} / 3`;k.querySelector(".y-s").textContent=sen;k.querySelector(".y-b").textContent=bil;A.durum(`Tur ${Math.min(tur+1,3)} / 3`);};
  function turAc(){if(tur>=R.length)return;kilit=false;const a=R[tur];ya.innerHTML=`<small>Tur ${tur+1}</small><p><b>${a}</b> ile <b>${a+9}</b> arasından bir sayı seçiniz.</p>`;ys.innerHTML=aralik(a,a+9).map(x=>`<button type="button" class="chip" data-v="${x}">${x}</button>`).join("");
    ys.querySelectorAll(".chip").forEach(b=>b.onclick=()=>oyna(+b.dataset.v));skor();}
  function oyna(x){if(bitti||kilit)return;kilit=true;const a=R[tur];let y;do{y=ra(a,a+9);}while(y===x);const cx=cs_(x),cy=cs_(y);ys.querySelectorAll(".chip").forEach(b=>b.disabled=true);
    const s=cx>cy?1:cx<cy?-1:0;if(s>0)sen++;else if(s<0)bil++;bip(s>0?760:s<0?220:500,.12);
    fb(f,s>=0,`Siz: ${x} (çarpanları ${divs(x).join(", ")}: ${cx} çarpan). Bilgisayar: ${y} (çarpanları ${divs(y).join(", ")}: ${cy} çarpan). ${s>0?"Turu siz aldınız!":s<0?"Turu bilgisayar aldı.":"Berabere."}`);
    D.ekle([`Tur ${tur+1}: ${x} ve ${y}`,`${cx} ve ${cy} çarpan`,s>0?"Siz":s<0?"Bilgisayar":"Berabere"],"y"+tur);tur++;skor();
    if(tur>=3){bitti=true;setTimeout(()=>{if(!k.isConnected)return;ya.innerHTML=`<small>Yarış bitti</small><p>Siz ${sen}, bilgisayar ${bil}. ${sen>bil?"Kazandınız!":sen===bil?"Berabere!":"Bilgisayar kazandı; bir dahaki sefere çok çarpanlı sayıları arayınız."}</p>`;ys.innerHTML="";A.tamam(`Yarış bitti: Siz ${sen}, bilgisayar ${bil}.`);},900);}
    else setTimeout(()=>{if(k.isConnected)turAc();},1400);}
  A.oto=()=>{if(bitti)return;const b=[...ys.querySelectorAll(".chip:not(:disabled)")];if(!b.length)return;b.sort((p,q)=>cs_(+q.dataset.v)-cs_(+p.dataset.v))[0].click();};turAc();}
const e_yaris=p=>{const D=defterY(["Sayı ya da tur","Çarpanlar","Çarpan sayısı ya da kazanan"]);
  asamali(p,{tahmin:{soru:"30 ile 31 sayılarından hangisinin çarpan sayısı daha fazladır?",secs:[["30","30"],["31","31"],["e","Eşittir"]],dogru:"30",neden:"30'un 8 çarpanı (1, 2, 3, 5, 6, 10, 15, 30), 31'in 2 çarpanı (1, 31) vardır."},
    asamalar:[
      {ad:"Çarpanları say",yon:["Sırası gelen sayının bütün çarpanlarını seçiniz ve kontrol ediniz.","Dört sayının çarpanlarını sayınca en çok çarpanı olanı seçiniz."],bitis:"Dört sayının çarpanlarını bulup soruyu doğru cevaplayınca.",kur:(k,A)=>sayimTur(k,D,A)},
      {ad:"Çarpan yarışı",yon:["Yarış kurallarını okuyunuz.","Her turda verilen aralıktan çarpanı çok olduğunu düşündüğünüz bir sayıya dokununuz."],bitis:"3 tur bitince.",kur:(k,A)=>yarisTur(k,D,A)},
      kuralA(D,[["Büyük sayının çarpan sayısı her zaman daha fazla mıdır?",["Hayır; örneğin 31, 30'dan büyüktür ama çarpanı daha azdır.","Evet, her zaman daha fazladır.","Evet, yalnız çift sayılarda."],"Doğru! Çarpan sayısı sayının büyüklüğüne bağlı değildir.",["Deftere bakınız: En büyük sayı en çok çarpana sahip değildi.","Çift sayılarda da olmaz: 32'nin 6, 30'un 8 çarpanı var."]],
        ["Çarpanı çok olan sayıları nasıl tanıdınız?",["1, 2, 3, 4, 5, 6 gibi birçok küçük sayıya kalansız bölünen sayıların çarpanı çoktur.","Son rakamı 9 olan sayıların çarpanı çoktur.","Tek sayıların çarpanı çoktur."],"Doğru! Her kalansız bölen bir çarpan çifti getirir.",["29 ve 39'un çarpanlarına bakınız: 29'un yalnız 2 çarpanı var.","Tek sayıların çoğu 2, 4, 6 gibi sayılara bölünmez."]]]),
      kendiY((m,son)=>{const L=adaylar(),c=L.map(cs_),mx=Math.max(...c),en=L[c.indexOf(mx)],dig=L.filter(x=>x!==en);
        soruY(m,`${L.join(", ")} sayıları veriliyor. Buna göre, bu sayılardan hangisinin çarpan sayısı en fazladır?`,[String(en),...dig.map(String)],`Doğru! ${ekS(en,"in")} ${mx} çarpanı var: ${divs(en).join(", ")}.`,dig.map(x=>`${ekS(x,"in")} ${cs_(x)} çarpanı var: ${divs(x).join(", ")}.`),son);})],
    kural:"Bir sayının çarpan sayısı, sayının büyüklüğüne bağlı <b>değildir</b>: 31, 30'dan büyüktür ama 30'un 8, 31'in yalnız 2 çarpanı vardır. Birçok küçük sayıya kalansız bölünen sayıların (ör. 30, 36, 40) çarpanı çoktur."});
};

/* 20 · ÇARPAN–KAT DÜELLOSU */
function duelloKur(k,havuz,D,A,sureF){
  k.insertAdjacentHTML("beforeend",`<div class="duel"><div class="skorlar"><div><small>Tur</small><b class="s-tur">0 / 8</b></div><div><small>Siz</small><b class="s-sen">0</b></div><div><small>Bilgisayar</small><b class="s-bil">0</b></div><div><small>Puan</small><b class="s-puan">0</b></div></div><div class="dsoru">Hazır olunca <b>Düelloyu başlatın</b> düğmesine basınız.</div><div class="yaris" aria-label="Süre çubuğu"><i></i></div><div class="secler dsec"><button type="button" class="sec dy" data-v="1" disabled>Doğru</button><button type="button" class="sec dy" data-v="0" disabled>Yanlış</button></div></div><div class="row"><button type="button" class="primary basl">Düelloyu başlatın</button></div><div class="fb" hidden></div>`);
  const ds=k.querySelector(".dsoru"),bar=k.querySelector(".yaris i"),bb=k.querySelector(".basl"),f=k.querySelector(".fb"),dy=[...k.querySelectorAll(".dy")];
  let tur=0,sen=0,bil=0,puan=0,zam=null,acik=false,Q=null,t0=0,sure=0,son=-1,oyn=0;
  function skor(){k.querySelector(".s-tur").textContent=`${Math.min(tur,8)} / 8`;k.querySelector(".s-sen").textContent=sen;k.querySelector(".s-bil").textContent=bil;k.querySelector(".s-puan").textContent=puan;A.durum(`Tur ${Math.min(tur,8)} / 8`);}
  const durdur=()=>{if(zam){clearInterval(zam);zam=null;}};
  function turBitti(kaz){acik=false;durdur();dy.forEach(b=>b.disabled=true);if(kaz)sen++;else bil++;D.ekle([Q.m,Q.d?"Doğru":"Yanlış",kaz?"Siz":"Bilgisayar"],"t"+oyn+"-"+tur);skor();
    if(tur>=8){setTimeout(()=>{if(!k.isConnected)return;fb(f,sen>=bil,sen>bil?`Düelloyu kazandınız! Siz ${sen}, bilgisayar ${bil}. Puanınız: ${puan}.`:sen===bil?`Berabere: ${sen} – ${bil}. Puanınız: ${puan}.`:`Bilgisayar kazandı: ${bil} – ${sen}. Kuralı bulun aşamasında yanlışlarınızı gözden geçiriniz.`);A.tamam(`Düello bitti: Siz ${sen}, bilgisayar ${bil}.`);},900);}
    else setTimeout(()=>{if(k.isConnected)yeniTur();},1600);}
  function yeniTur(){tur++;skor();let g;do{g=Math.floor(Math.random()*havuz.length);}while(g===son);son=g;Q=havuz[g]();acik=true;ds.innerHTML=Q.m;dy.forEach(b=>{b.disabled=false;b.classList.remove("dogru","yanlis");});
    sure=sureF(tur);t0=Date.now();bar.style.width="0%";durdur();
    zam=setInterval(()=>{if(!k.isConnected){durdur();return;}const o=(Date.now()-t0)/sure;bar.style.width=Math.min(100,o*100)+"%";
      if(o>=1&&acik){fb(f,false,`Süre bitti; tur bilgisayarın. Bu ifade <b>${Q.d?"doğru":"yanlış"}</b>. ${Q.a}`);turBitti(false);}},50);}
  dy.forEach(b=>b.onclick=()=>{if(!acik)return;const v=b.dataset.v==="1";
    if(v===Q.d){b.classList.add("dogru");const hizli=Date.now()-t0<sure/2;puan+=10+(hizli?5:0);bip(760,.1);fb(f,true,`Doğru! ${hizli?"Hızlı cevap: 15 puan.":"10 puan."} ${Q.a}`);turBitti(true);}
    else{b.classList.add("yanlis");bip(220,.12);fb(f,false,`Tur bilgisayarın. Bu ifade <b>${Q.d?"doğru":"yanlış"}</b>. ${Q.a}`);turBitti(false);}});
  bb.onclick=()=>{oyn++;tur=0;sen=0;bil=0;puan=0;bb.hidden=true;f.hidden=true;yeniTur();};
  A.oto=()=>{if(!bb.hidden&&!tur){bb.click();return;}if(acik)k.querySelector(`.dy[data-v="${Q.d?1:0}"]`).click();};
  skor();}
function duelloKurallar(k,A,ornek,bitince){
  k.insertAdjacentHTML("beforeend",`<div class="kurallar"><h4>Düello kuralları</h4><ul>
    <li><b>Tur:</b> Düello 8 turdur. Her turda ekrana bir ifade gelir.<span class="orn">Örnek: ${ornek.m}</span></li>

    <li><b>Puan:</b> Doğru cevap 10 puandır. Çubuğun yarısı dolmadan verilen doğru cevap 15 puandır.<span class="orn">Örnek: 3 hızlı doğru cevap 45 puan, 2 yavaş doğru cevap 20 puan eder; toplam 65 puan.</span></li>

  ()=>{const n=ra(11,60);return rastgele([{m:`${ekS(n,"in")} en büyük çarpanı ile en küçük katı eşittir.`,d:true,a:`İkisi de ${ekS(n,"dir")}.`},{m:`${ekS(n,"in")} en küçük katı ${ekS(2*n,"dir")}.`,d:false,a:`En küçük kat ${n} x 1 = ${ekS(n,"dir")}.`}]);},

  ()=>{const a=ra(3,9),b=ra(3,9),n=a*b;return rastgele([{m:`${a} x ${b} = ${n} olduğuna göre ${n}, ${ekS(a,"in")} katıdır.`,d:true,a:`${n} = ${a} x ${b}.`},{m:`${a} x ${b} = ${n} olduğuna göre ${a}, ${ekS(n,"in")} katıdır.`,d:false,a:`${a}, ${ekS(n,"in")} çarpanıdır; ${n}, ${ekS(a,"in")} katıdır.`}]);},
  ()=>{const L=rastgele([20,30,40,60]),p=ra(3,9);return {m:`${L} cm'lik çubuk tam santimetrelik ${p} eşit parçaya ayrılabilir.`,d:L%p===0,a:L%p?`${kalanY(L,p)}.`:`${p} x ${L/p} = ${L}.`};}];
const e_duello=p=>{const D=defterY(["İfade","Doğru mu?","Turu alan"]);
  asamali(p,{tahmin:{giris:"Bilgisayara karşı bir doğru–yanlış düellosu yapacaksınız. Önce bir tahminle ısınınız.",soru:"“7, 35'in çarpanıdır.” Bu ifade doğru mu?",secs:[["d","Doğru"],["y","Yanlış"]],dogru:"d",neden:"7 x 5 = 35."},

 {ad:"Çarpan mı, Bölen mi?",amac:"Çarpma ve bölmenin ters işlem olduğunu kullanarak bir sayının çarpanlarının aynı zamanda bölenleri olduğunu keşfetmek.",adimlar:["<b>Aşama 1:</b> Her çarpma işlemini ondan elde edilen iki bölme işlemiyle eşleştiriniz.","<b>Aşama 2:</b> ▲ ve ■ ile gizlenen sayıları bulunuz.",SON],sure:5,ciz:e_bolen},
 {ad:"Kalansız Bölme Testi",amac:"Bilyeleri kutulara eşit dağıtarak bir sayıyı kalansız bölen sayıların o sayının çarpanları olduğunu keşfetmek.",adimlar:["<b>Aşama 1:</b> Kutu sayısını seçiniz, bilyeler dağıtılsın; seçtiğiniz sayının çarpan olup olmadığına karar veriniz.","<b>Aşama 2:</b> Yeni bir sayının 10'a kadarki çarpanlarını seçiniz.",SON],sure:6,ciz:e_test},
 {ad:"Çarpan Listesi Kurucu",amac:"Çarpanları iki uçtan başlayarak sistemli biçimde listelemek; aramanın nerede durduğunu ve çarpan listesinin sınırlı olduğunu keşfetmek.",adimlar:["<b>Aşama 1–2:</b> Sıradaki sayının kalansız bölüp bölmediğine karar veriniz, eşini yazınız; yeni çift çıkmayacağını anlayınca <b>Liste tamam</b> düğmesine basınız.",SON],sure:7,ciz:e_liste},
 {ad:"Çarpan Ağacı",amac:"Bir sayıyı dallara ayırarak çarpan ağacı kurmak; ağaçtaki her sayının çarpan olduğunu ama ağacın bütün çarpanları göstermediğini keşfetmek.",adimlar:["<b>Aşama 1–2:</b> Kesik çizgili sayılara dokununuz ve onları iki çarpana ayırınız. İkinci ağaçta farklı bir ilk dal seçiniz.",SON],sure:7,ciz:e_agac},
 {ad:"Yüzlük Tabloda Katlar",amac:"Yüzlük tabloda bir sayının katlarını boyayarak katların düzenli aralıklarla ilerlediğini ve sayının sayma sayılarıyla çarpımı olduğunu keşfetmek.",adimlar:["<b>Aşama 1–2:</b> Yüzlük tabloda istenen sayının katlarına dokunarak onları boyayınız.",SON],sure:6,ciz:e_yuzluk},
 {ad:"Sayı Doğrusunda Atlamalar",amac:"Sayı doğrusunda eşit adımlarla zıplayan kurbağayla katları ve çarpanları ilişkilendirmek.",adimlar:["<b>Aşama 1:</b> <b>Zıpla</b> düğmesiyle kurbağayı ilerletiniz ve konduğu sayıları izleyiniz.","<b>Aşama 2:</b> Kurbağayı bayrağa tam kondurabilen adım uzunluklarını bulunuz.",SON],sure:6,ciz:e_atlama},
 {ad:"Kat mı, Değil mi?",amac:"Sayı kartlarını ayıklayarak bir sayının katlarını tanımak ve kat olduğunu çarpma ile göstermek.",adimlar:["<b>Aşama 1:</b> Bir karta, sonra gideceği kutuya dokununuz.","<b>Aşama 2:</b> Kat olan sayıları ▲ x ■ biçiminde yazınız.",SON],sure:5,ciz:e_ayikla},
 {ad:"Katların Sonu Var mı?",amac:"Kat makinesi ve çarpan kutusuyla bir sayının katlarının sınırsız, çarpanlarının sınırlı olduğunu keşfetmek.",adimlar:["<b>Aşama 1:</b> Kat makinesinde düğmelerle ilerleyiniz ve görevleri yapınız.","<b>Aşama 2:</b> Çarpan kutusunu doldurunuz, kat kutusuna kat ekleyiniz ve karşılaştırınız.",SON],sure:6,ciz:e_sonsuz},
 {ad:"Kumbara Hesabı",amac:"Her gün aynı miktar para atılan kumbarada biriken paraların katlar olduğunu, görülen bir miktarın ise atılan paranın katı olduğunu keşfetmek.",adimlar:["<b>Aşama 1:</b> <b>Bir gün geçirin</b> düğmesiyle kumbarayı doldurunuz ve soruyu cevaplayınız.","<b>Aşama 2:</b> Kumbarada görülen miktara göre her gün atılmış olabilecek miktarları bulunuz.",SON],sure:6,ciz:e_kumbara},
 {ad:"Mola Noktaları",amac:"Düzenli aralıklarla mola veren otobüsün mola noktalarının aralığın katları olduğunu keşfetmek ve mola sayısını bölmeyle bulmak.",adimlar:["<b>Aşama 1:</b> Yoldaki kilometre çizgilerine dokunarak mola noktalarına bayrak dik.","<b>Aşama 2:</b> Mola sayısını ve mola yerini hesaplayarak bulunuz.",SON],sure:6,ciz:e_mola},
 {ad:"Asansör Katları",amac:"Belirli katlarda duran asansörlerin durduğu katların bir sayının katları olduğunu keşfetmek.",adimlar:["<b>Aşama 1:</b> Çift katlarda duran asansörün duraklarını işaretleyiniz.","<b>Aşama 2:</b> 4'ün katlarında duran asansörü çalıştırınız ve yolculuklarda inilecek katı bulunuz.",SON],sure:6,ciz:e_asansor},
 {ad:"En Büyük Çarpan, En Küçük Kat",amac:"Bir sayının çarpanlarını ve katlarını boyayarak en büyük çarpanın ve en küçük katın sayının kendisi olduğunu keşfetmek.",adimlar:["<b>Aşama 1:</b> Çarpanları maviye, katları turuncuya boyayınız.","<b>Aşama 2:</b> Bilmecelerdeki gizli sayıları bulunuz.",SON],sure:6,ciz:e_sinir},
 {ad:"Bahçe Duvarı",amac:"Alanı verilen dikdörtgen bahçelerin kenarlarının çarpan çiftleri olduğunu, duvarın en kısa ve en uzun olduğu bahçeleri keşfetmek.",adimlar:["<b>Aşama 1:</b> Bahçenin enini seçiniz, bahçeyi kurunuz ve duvarın uzunluğunu hesaplayınız.","<b>Aşama 2:</b> Duvarı en kısa ve en uzun olan bahçeleri seçiniz.",SON],sure:7,ciz:e_bahce},
 {ad:"Çubukları Eşit Parçalara Ayır",amac:"Çubuğu cetvel üzerinde eşit parçalara keserek parça sayısının ve parça uzunluğunun çubuk uzunluğunun çarpanları olduğunu keşfetmek.",adimlar:["<b>Aşama 1:</b> Cetveldeki çizgilere dokunarak kesim yerlerini işaretleyiniz ve kontrol ediniz.","<b>Aşama 2:</b> Yeni çubuğun ayrılabileceği parça sayılarını seçiniz.",SON],sure:6,ciz:e_cubuk},
 {ad:"Kutulara Paketleme",amac:"Kurabiyeleri kutulara paketleyerek uygun kutu türlerinin çarpan, paketlenebilen siparişlerin kat olduğunu keşfetmek.",adimlar:["<b>Aşama 1:</b> Kutu türlerini deneyiniz ve hiç artmadan paketleyenleri seçiniz.","<b>Aşama 2:</b> Sabit kutu türüyle paketlenebilen siparişleri seçiniz.",SON],sure:6,ciz:e_paket},
 {ad:"Doğru mu, Yanlış mı?",amac:"Çarpan ve katlarla ilgili önermeleri değerlendirmek; yanlış önermeyi karşı örnekle göstermek, doğru önermeyi örneklerle test etmek.",adimlar:["<b>Aşama 1:</b> Önermelere Doğru ya da Yanlış de; yanlışsa karşı örneği seçiniz.","<b>Aşama 2:</b> Test laboratuvarında önermeyi kendi örneklerinizle deneyiniz.",SON],sure:7,ciz:e_onerme},
 {ad:"Çarpanı En Çok Olan Sayı",amac:"Sayıların çarpanlarını sayarak çarpan sayısının sayının büyüklüğüne bağlı olmadığını keşfetmek.",adimlar:["<b>Aşama 1:</b> Dört sayının çarpanlarını seçerek sayınız ve en çok çarpanı olanı bulunuz.","<b>Aşama 2:</b> Bilgisayara karşı çarpan yarışını oynayınız.",SON],sure:7,ciz:e_yaris},
 {ad:"Çarpan–Kat Düellosu",amac:"Çarpan ve kat bilgilerini süreli bir doğru–yanlış düellosunda kullanmak.",adimlar:["<b>Aşama 1:</b> Düello kurallarını okuyunuz ve ısınma sorusunu cevaplayınız.","<b>Aşama 2:</b> 8 turluk düelloyu oynayınız: Süre dolmadan Doğru ya da Yanlış düğmesine basınız.",SON],sure:7,ciz:e_duello}];
kesifBaslat(ACT,{baslik:"Çarpan ve Kat Keşif Atölyesi",kisa:"Çarpan ve Kat Keşif Atölyesi",kod:"MAT.6.1.1",ust:"6. SINIF · SAYILAR VE NİCELİKLER (1) · MAT.6.1.1",
  aciklama:"Bir doğal sayının çarpanları ve katları için yirmi keşfetme etkinliği. Her etkinlik aşama aşama ilerler: dikdörtgenler kurunuz, çarpan çiftlerini avlayınız, yüzlük tabloda ve sayı doğrusunda katları bulunuz; kumbara, mola, asansör, bahçe, çubuk ve paket problemlerinde kuralı kendiniz keşfediniz."});

</script>

<script>
(function(){
const D=document, H=D.documentElement, $=s=>D.querySelector(s);
const ANAHTAR="kb-ayar", ILR="kb-ilerleme:"+(D.title||location.pathname);
const oku=(k,v)=>{try{const s=localStorage.getItem(k);return s===null?v:JSON.parse(s)}catch(e){return v}};
const yaz=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const VARS={ses:true,boy:0,karsit:false,rahat:false,azhareket:matchMedia("(prefers-reduced-motion: reduce)").matches,tema:""};
let A=Object.assign({},VARS,oku(ANAHTAR,{}));

/* --- Düzen: başlık bandı, yan liste, gezinti --- */
const wrap=$(".wrap");
if(wrap){
  const h1=wrap.querySelector("h1"); let ust=h1; while(ust&&ust.parentElement!==wrap)ust=ust.parentElement;
  let hero;
  if(ust&&ust!==h1&&!ust.matches(".eyebrow,.lead")){ hero=ust; hero.classList.add("kb-hero"); wrap.prepend(hero); }
  else { hero=D.createElement("header"); hero.className="kb-hero";
    [...wrap.children].filter(e=>e.matches(".eyebrow,h1,.lead")).forEach(e=>hero.appendChild(e)); wrap.prepend(hero); }
  const idx=$("#index"), pan=$("#panel");
  if(idx&&pan){
    const d=D.createElement("div"); d.className="kb-duzen";
    const yan=D.createElement("aside"); yan.className="kb-yan"; yan.setAttribute("aria-label","Etkinlik listesi");
    const ana=D.createElement("main");
    pan.before(d); yan.appendChild(idx); ana.appendChild(pan); d.append(yan,ana);
    const g=D.createElement("nav"); g.className="kb-gezinti"; g.setAttribute("aria-label","Etkinlikler arası geçiş");
    g.innerHTML='<button class="ghost" id="kbOnce">‹ Önceki</button><span id="kbSira"></span><button class="primary" id="kbSonra">Sonraki ›</button>';
    ana.appendChild(g);
    const pr=D.createElement("div"); pr.className="kb-ilerleme"; pr.innerHTML='<div class="kb-bar"><i id="kbBar"></i></div><span id="kbSay"></span>'; hero.appendChild(pr);
  }
}
const linkler=()=>[...D.querySelectorAll("#index a[data-i]")];
const simdiki=()=>{const a=$('#index a[aria-current="true"]');return a?+a.dataset.i:-1};
let tamam=new Set(oku(ILR,[]));
function ilerleme(){const L=linkler(); if(!L.length)return;
  L.forEach(a=>a.classList.toggle("kb-tamam",tamam.has(+a.dataset.i)));
  const n=L.filter(a=>tamam.has(+a.dataset.i)).length;
  const b=$("#kbBar"); if(b)b.style.width=(100*n/L.length)+"%";
  const s=$("#kbSay"); if(s)s.textContent=n+" / "+L.length+" etkinlik tamamlandı";
  const i=simdiki(), r=$("#kbSira"); if(r)r.textContent=(i+1)+" / "+L.length;
  const o=$("#kbOnce"), z=$("#kbSonra"); if(o)o.disabled=i<=0; if(z)z.disabled=i>=L.length-1;}
let gecis=0;
function git(d){const L=linkler(), i=simdiki()+d; if(L[i]){gecis=Date.now(); L[i].click();}}
$("#kbOnce")&&($("#kbOnce").onclick=()=>git(-1)); $("#kbSonra")&&($("#kbSonra").onclick=()=>git(1));
const idx=$("#index"); if(idx){ idx.addEventListener("click",()=>{gecis=Date.now()},true);
  new MutationObserver(()=>setTimeout(ilerleme,0)).observe(idx,{subtree:true,attributes:true,attributeFilter:["aria-current"]}); }
window.addEventListener("hashchange",()=>{gecis=Date.now()});
setTimeout(ilerleme,50);

/* --- Ses --- */
let ac=null;
function ton(f,t0,sure,tip,hacim){const c=ac;const o=c.createOscillator(),g=c.createGain();o.type=tip;o.frequency.setValueAtTime(f[0],c.currentTime+t0);
  if(f[1])o.frequency.exponentialRampToValueAtTime(f[1],c.currentTime+t0+sure);
  g.gain.setValueAtTime(0.0001,c.currentTime+t0);g.gain.exponentialRampToValueAtTime(hacim,c.currentTime+t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t0+sure);
  o.connect(g).connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+sure+0.02);}
function sesCal(tur){ if(!A.ses)return; try{ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended")ac.resume();
  if(tur==="ok"){ton([659],0,.13,"sine",.22);ton([880],.11,.16,"sine",.22);ton([1319],.22,.22,"sine",.12);}
  else if(tur==="no"){ton([260,180],0,.28,"triangle",.2);}
  else ton([1200],0,.04,"sine",.06); }catch(e){} }
function kutla(el){ if(A.azhareket||!el)return; const r=el.getBoundingClientRect(); const k=D.createElement("div"); k.className="kb-kutlama";
  k.style.left=(r.left+Math.min(60,r.width/2))+"px"; k.style.top=(r.top+r.height/2)+"px";
  const renk=["var(--p1)","var(--p2)","var(--p3)","var(--p4)","var(--p5)","var(--p6)"];
  for(let i=0;i<18;i++){const p=D.createElement("i");const a=Math.random()*Math.PI*2,m=50+Math.random()*70;
    p.style.background=renk[i%6];p.style.setProperty("--x",Math.cos(a)*m+"px");p.style.setProperty("--y",(Math.sin(a)*m-30)+"px");k.appendChild(p);}
  D.body.appendChild(k); setTimeout(()=>k.remove(),900); }

/* Doğru / yanlış geri bildirimini yakala: etkinlik kodu fb(...) ya da .ok/.no sınıfı kullanır */
let sonEylem=0; ["click","keydown"].forEach(t=>D.addEventListener(t,e=>{ if(t==="click"||e.key==="Enter"||e.key===" ")sonEylem=Date.now(); },true));
let kuyruk=[], zam=null;
const has=(s,t)=>(" "+(s||"")+" ").includes(" "+t+" ");
new MutationObserver(ms=>{ const now=Date.now(); if(now-sonEylem>900||now-gecis<450)return;
  ms.forEach(m=>{ const el=m.target; if(!(el instanceof Element)||el.closest(".kb-menu,.kb-yonerge,#index"))return;
    const fb=el.classList.contains("fb"), ok=el.classList.contains("ok"), no=el.classList.contains("no");
    if(!ok&&!no)return; if(!fb&&((ok&&has(m.oldValue,"ok"))||(no&&has(m.oldValue,"no"))))return;
    kuyruk.push({el,fb,ok}); });
  if(kuyruk.length&&!zam)zam=setTimeout(()=>{ const f=kuyruk.filter(x=>x.fb).pop(); let ok, el;
      if(f){ok=f.ok;el=f.el}else{ok=!kuyruk.some(x=>!x.ok);el=kuyruk[kuyruk.length-1].el}
      kuyruk=[];zam=null; sesCal(ok?"ok":"no");
      if(ok){ kutla(el); const i=simdiki(); if(i>=0&&(f||!$("#panel .fb"))){tamam.add(i);yaz(ILR,[...tamam]);ilerleme();} }
      const d=$("#kbDuyuru"); if(d)d.textContent=ok?"Doğru.":"Yeniden deneyiniz."; },110);
}).observe(D.body,{subtree:true,attributes:true,attributeFilter:["class"],attributeOldValue:true});

/* --- Ayarları uygula --- */
function uygula(){ H.classList.toggle("kb-sesyok",!A.ses);
  ["karsit","rahat","azhareket"].forEach(k=>H.classList.toggle("kb-"+k,!!A[k]));
  H.classList.toggle("kb-y1",A.boy===1); H.classList.toggle("kb-y2",A.boy===2);
  if(A.tema)H.setAttribute("data-theme",A.tema); else H.removeAttribute("data-theme");
  const s=$("#kbSes"); s.setAttribute("aria-pressed",A.ses); $("#kbSesY").textContent=A.ses?"Ses açık":"Ses kapalı";
  s.querySelector(".on").style.display=A.ses?"":"none"; s.querySelector(".off").style.display=A.ses?"none":"";
  D.querySelectorAll(".kb-anahtar").forEach(b=>b.setAttribute("aria-checked",!!A[b.dataset.k]));
  D.querySelectorAll("#kbBoy button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.v===A.boy));
  D.querySelectorAll("#kbTema button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===A.tema));
  yaz(ANAHTAR,A); }
uygula();
const dug=$("#kbDugme"), men=$("#kbMenu");
function menu(ac_){ men.hidden=!ac_; dug.setAttribute("aria-expanded",ac_); if(ac_)men.querySelector("button").focus(); }
dug.onclick=()=>menu(men.hidden);
D.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!men.hidden){menu(false);dug.focus();} });
D.addEventListener("click",e=>{ if(!men.hidden&&!men.contains(e.target)&&!dug.contains(e.target))menu(false); });
$("#kbSes").onclick=()=>{A.ses=!A.ses;uygula();sesCal("ok");};
D.querySelectorAll(".kb-anahtar").forEach(b=>b.onclick=()=>{A[b.dataset.k]=!A[b.dataset.k];uygula();});
D.querySelectorAll("#kbBoy button").forEach(b=>b.onclick=()=>{A.boy=+b.dataset.v;uygula();});
D.querySelectorAll("#kbTema button").forEach(b=>b.onclick=()=>{A.tema=b.dataset.v;uygula();});
$("#kbSifir").onclick=()=>{A=Object.assign({},VARS);uygula();};
const tam=$("#kbTam"); if(!D.fullscreenEnabled)tam.hidden=true;
tam.onclick=()=>{ try{ D.fullscreenElement?D.exitFullscreen():H.requestFullscreen(); }catch(e){} };

/* --- Yönerge ve sesli okuma --- */
const metin=el=>{ if(!el)return ""; const c=el.cloneNode(true); c.querySelectorAll(".frac").forEach(f=>{const s=f.querySelectorAll("span"); if(s.length>1)f.replaceWith(s[0].textContent+"/"+s[1].textContent);}); return c.textContent.replace(/\s+/g," ").trim(); };
const PAYDA={2:"ikide",3:"üçte",4:"dörtte",5:"beşte",6:"altıda",7:"yedide",8:"sekizde",9:"dokuzda",10:"onda",12:"on ikide",20:"yirmide",100:"yüzde"};
const okunus=t=>String(t).replace(/(−|-)?(\d+)\/(\d+)/g,(m,sg,a,b)=>(sg?"eksi ":"")+(PAYDA[b]||b+"'te")+" "+a).replace(/\|([^|]+)\|/g,"$1'in mutlak değeri").replace(/(^|[\s(])−\s?(\d)/g,"$1eksi $2").replace(/°C/g," derece");
const kesH=t=>String(t).replace(/(−|-)?(\d+)\/(\d+)/g,(m,sg,a,b)=>(sg?"−":"")+'<span class="frac"><span>'+a+'</span><span>'+b+'</span></span>');
const sesPuan=v=>(/natural|online|neural/i.test(v.name)?4:/google/i.test(v.name)?3:/enhanced|premium|geliş|siri/i.test(v.name)?3:1);
function yonergeMetni(){ const p=$("#panel")||D.body, h=p.querySelector("h2"), g=[];
  p.querySelectorAll(".intro,.task").forEach(e=>{const t=metin(e); if(t&&!g.includes(t)&&g.length<2)g.push(t);});
  if(!g.length&&$(".lead"))g.push(metin($(".lead")));
  return {baslik:metin(h)||D.title, gorev:g}; }
function yonergeAc(){ const y=yonergeMetni(); $("#kbYB").textContent=y.baslik;
  $("#kbYIc").innerHTML='<p class="gorev"></p><ol><li>Görevi okuyunuz; şekil ya da sayı doğrusu üzerinde deneme yapabilirsiniz.</li><li>Cevabınızı yazıp ya da seçip <b>Kontrol edin</b> düğmesine basınız.</li><li>Geri bildirimi okuyunuz. Yanlışsa ipucuyla yeniden deneyiniz.</li><li><b>Yeni soru</b> ile aynı etkinliği farklı sayılarla tekrarlayabilir, <b>Sonraki</b> ile ilerleyebilirsiniz.</li></ol><p style="font-size:14px;color:var(--muted)">Klavye: Tab ile düğmeler arasında geçiniz, Enter ile seçiniz. Esc menüyü kapatır.</p>';
  $("#kbYIc .gorev").innerHTML=kesH(y.gorev.join(" ").replace(/[<>&]/g,""));
  const d=$("#kbYonerge"); menu(false); if(d.showModal)d.showModal(); else d.setAttribute("open",""); }
$("#kbYon").onclick=yonergeAc;
$("#kbYKapat").onclick=()=>{ const d=$("#kbYonerge"); speechSynthesis&&speechSynthesis.cancel(); d.close?d.close():d.removeAttribute("open"); };
const konusabilir="speechSynthesis" in window;
function sesliOku(t){ if(!konusabilir)return; speechSynthesis.cancel();
  const v=speechSynthesis.getVoices().filter(v=>/^tr/i.test(v.lang)).sort((a,b)=>sesPuan(b)-sesPuan(a))[0];
  (okunus(t).match(/[^.!?]+[.!?]?/g)||[t]).forEach(c=>{ const u=new SpeechSynthesisUtterance(c.trim()); u.lang="tr-TR"; u.rate=.95; if(v)u.voice=v; speechSynthesis.speak(u); }); }
function okuPanel(){ const y=yonergeMetni(); sesliOku(y.baslik+". "+y.gorev.join(" ")); }
if(!konusabilir){ $("#kbOku").hidden=true; $("#kbYOku").hidden=true; }
$("#kbOku").onclick=()=>{ const b=$("#kbOku"); if(b.getAttribute("aria-pressed")==="true"){speechSynthesis.cancel();b.setAttribute("aria-pressed","false");return;}
  b.setAttribute("aria-pressed","true"); okuPanel(); const t=setInterval(()=>{ if(!speechSynthesis.speaking){b.setAttribute("aria-pressed","false");clearInterval(t);} },400); };
$("#kbYOku").onclick=()=>sesliOku(metin($("#kbYB"))+". "+metin($("#kbYIc")));
})();
</script>

<script id="kesir-cizgi">
/* ANA_KURALLAR §4.y-3: Etkinliklerde bütün kesirler kesir çizgisiyle (alt alta pay/payda) gösterilir. Düz yazılmış a/b biçimleri otomatik dönüştürülür. */
(function(){
  if (window.__kesirCizgi) return; window.__kesirCizgi = 1;
  const RX = /(^|[^\w\/.,:%])([−-])?(?:(\d+) )?(\d{1,4})\/(\d{1,4})(?![\w\/.,]\d|\w)/g;
  const ATLA = "script,style,svg,textarea,input,select,code,.ilr,.frac,[data-duz]";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function donustur(kok){
    if (!kok || !kok.nodeType) return;
    if (kok.nodeType === 3) kok = kok.parentElement;
    if (!kok || (kok.closest && kok.closest(ATLA))) return;
    const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      if (!/\d\/\d/.test(t.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = t.parentElement; if (!p || p.closest(ATLA)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const L = []; let t; while ((t = w.nextNode())) L.push(t);
    L.forEach(t => {
      let deg = false;
      const h = esc(t.nodeValue).replace(RX, (m, a, s, tam, p, q) => { deg = true;
        return a + (s ? "−" : "") + (tam ? tam + " " : "") + '<span class="frac"><span>' + p + "</span><span>" + q + "</span></span>"; });
      if (!deg) return;
      const k = document.createElement("span"); k.innerHTML = h; t.replaceWith(...k.childNodes);
    });
  }
  let bekleyen = new Set(), plan = 0;
  const calis = () => { plan = 0; const b = bekleyen; bekleyen = new Set(); b.forEach(donustur); };
  const gozcu = new MutationObserver(ms => { ms.forEach(m => {
      if (m.type === "characterData") bekleyen.add(m.target); else m.addedNodes.forEach(n => bekleyen.add(n)); });
    if (!plan) plan = requestAnimationFrame(calis); });
  const bas = () => { donustur(document.body); gozcu.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bas); else bas();
  const st = document.createElement("style");
  st.textContent = ".frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}.frac>span{display:block;text-align:center;padding:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor}";
  document.head.appendChild(st);
})();
</script>
