<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çözümler · Keşfet ve Çöz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--muted:#5b6478;--line:#dfe5ef;--bg:#f5f7fb;--card:#fff;--ss:#6741d9;--kk:#0b7285;--b:#d0700f;--ok:#2b8a3e;--warn:#c92a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif}
header{background:linear-gradient(135deg,#1c5fbf,#2f8fe0);color:#fff;padding:18px 16px 22px}
header .ic{max-width:780px;margin:0 auto}header small{opacity:.9;font-weight:800;letter-spacing:.08em;font-size:12px}header h1{margin:4px 0 0;font-size:24px;line-height:1.2}
main{max-width:780px;margin:14px auto 40px;padding:0 16px}
nav.sec{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}nav.sec button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}
nav.sec button[aria-pressed=true]{background:#1c5fbf;color:#fff;border-color:#1c5fbf}
.kart{background:var(--card);border-radius:16px;box-shadow:0 2px 0 rgba(0,0,0,.04),0 6px 20px rgba(20,40,80,.06);padding:18px;margin:0 0 16px;border-top:5px solid var(--c,#1c5fbf)}
.et{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.1em;color:#fff;background:var(--c);border-radius:6px;padding:3px 9px}
h2{font-size:20px;margin:8px 0 4px;line-height:1.3}
.soru{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.soru svg{max-width:100%;height:auto}
ol.sec{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
ol.sec li{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}ol.sec li.dogru{border-color:var(--ok);background:#ebfbee;font-weight:800}
.adim{border-left:4px solid var(--c);padding:6px 12px;margin:8px 0;background:#fff;border-radius:0 10px 10px 0;animation:gel .35s ease-out}
.adim b{color:var(--c)}@keyframes gel{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dug{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
button.btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.dikkat{background:#fff4e6;border:2px solid #f59f00;border-radius:12px;padding:10px 14px;margin:12px 0 4px}.dikkat b{color:#d9480f}
.tuzak{font-size:15px;color:var(--muted);margin-top:8px}
.cevap{font-weight:900;color:var(--ok);margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid var(--line);padding:8px 10px;text-align:left}th{background:#e3fafc;color:#0b7285;font-size:13px;letter-spacing:.06em}
.ses{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border-radius:12px;background:#eef2ff}
.ses button{border:0;width:44px;height:44px;border-radius:50%;background:var(--c);color:#fff;font-size:18px;cursor:pointer}
.ses span{font-size:14px;color:var(--muted)}
.gizli{display:none}
.tum{margin:4px 0 14px;font-size:14px}.tum a{color:#1c5fbf;font-weight:800}
@media (prefers-reduced-motion:reduce){.adim{animation:none}}
</style></head><body>

const V={"baslik": "Çarpanlar ve Katlar", "kod": "6. SINIF · MAT.6.1.1", "ses": "ses", "s": [{"no": 1, "bas": "Çarpan çiftleri", "q": [{"k": "48'in bütün çarpan çiftlerini, hiçbirini atlamadan sistematik olarak yazınız. 48'in kaç çarpanı vardır?", "a": ["48'i 1 ile başlayarak sırayla bölünüz: 48 = 1 x 48 = 2 x 24 = 3 x 16 = 4 x 12 = 6 x 8.", "5 ve 7 denendiğinde kalan vardır; 7'den sonra 8 gelir, 8 zaten 6 x 8 çiftinde yazıldı. Arama burada biter.", "Çarpanlar: 1, 2, 3, 4, 6, 8, 12, 16, 24, 48."], "c": "5 çarpan çifti, 10 çarpan"}, {"k": "56 : 7 = 8 eşitliğine bakarak 56'nın iki çarpanını yazınız. Sonra 56'nın bu ikisinden farklı bir çarpanını daha bulup bir çarpma işlemiyle gösteriniz.", "a": ["Bölme ile çarpma ters işlemdir: 56 : 7 = 8 ise 56 = 7 x 8 olur.", "Bu yüzden 7 ve 8, 56'nın çarpanlarıdır.", "Başka bir çarpan: 56 = 2 x 28 olduğundan 2 (ya da 28) da 56'nın çarpanıdır. 1, 4, 14 ve 56 da doğru cevaptır."], "c": "7 ve 8; ayrıca 1, 2, 4, 14, 28 ya da 56"}]}, {"no": 2, "bas": "Çarpanların özellikleri", "q": [{"k": "Mert, “Her doğal sayının en az iki farklı çarpanı vardır.” diyor. Sıfırdan farklı doğal sayıları düşünerek Mert'in önermesinin her zaman doğru olup olmadığını bir örnekle açıklayınız.", "a": ["1'den büyük her sayının en az iki çarpanı vardır: 1 ve sayının kendisi. Örnek: 13 = 1 x 13.", "1 sayısının ise tek çarpanı vardır: 1 = 1 x 1.", "Önermeyi sağlamayan tek bir örnek, önermenin her zaman doğru olmadığını gösterir."], "c": "Her zaman doğru değildir; karşı örnek 1 (tek çarpanı vardır)."}, {"k": "36'nın çarpan çiftlerini çarpan ağacı ile gösteriniz. 36'nın çarpan sayısının neden tek sayı olduğunu açıklayınız.", "a": ["36 = 1 x 36 = 2 x 18 = 3 x 12 = 4 x 9 = 6 x 6.", "6 x 6 çiftinde iki çarpan aynıdır; 6 listeye yalnız bir kez yazılır.", "Çarpanlar: 1, 2, 3, 4, 6, 9, 12, 18, 36. Diğer çiftler ikişer çarpan verir, 6 x 6 tek çarpan verir."], "c": "9 çarpan; 6 x 6 çiftinde 6 bir kez sayılır."}]}, {"no": 3, "bas": "Katları bulma", "q": [{"k": "8'in 30 ile 70 arasındaki bütün katlarını yazınız.", "a": ["8'in katları 8'i sayma sayılarıyla çarparak bulunur: 8, 16, 24, 32, 40, 48, 56, 64, 72, …", "30'dan büyük ilk kat 8 x 4 = 32, 70'ten küçük son kat 8 x 8 = 64'tür."], "c": "32, 40, 48, 56, 64"}, {"k": "Sayı doğrusunda 0'dan başlayıp 6'şar birim zıplayan bir kurbağa, 50'yi geçmeden en son hangi sayıya konar? Bu sayıya kaçıncı zıplayışında konar?", "a": ["Kurbağanın konduğu sayılar 6'nın katlarıdır: 6, 12, 18, …", "6 x 8 = 48 ve 6 x 9 = 54 olduğundan 50'yi geçmeyen son kat 48'dir.", "48 = 6 x 8 olduğu için kurbağa bu sayıya 8. zıplayışında konar."], "c": "48; 8. zıplayış"}]}, {"no": 4, "bas": "Katların sayısı", "q": [{"k": "12'nin en küçük katı ile en büyük çarpanı arasındaki fark kaçtır? Nedenini açıklayınız.", "a": ["Sıfır hariç her doğal sayının en küçük katı kendisidir: 12 x 1 = 12.", "Bir sayının en büyük çarpanı da kendisidir: 12 = 12 x 1.", "İki sayı da 12 olduğundan fark 12 − 12 = 0'dır."], "c": "0"}, {"k": "7'nin 100'den küçük kaç tane katı vardır?", "a": ["7'nin katları 7 x 1, 7 x 2, 7 x 3, … biçimindedir.", "100 : 7 işleminde bölüm 14, kalan 2'dir. 7 x 14 = 98 < 100 ve 7 x 15 = 105 > 100.", "7 x 1'den 7 x 14'e kadar 14 kat vardır."], "c": "14"}]}, {"no": 5, "bas": "Çarpan mı, kat mı?", "q": [{"k": "9 x 7 = 63 eşitliğini kullanarak boşlukları “çarpanı” ya da “katı” sözcükleriyle doldurunuz.<br>a) 9, 63'ün ………… dır.  b) 63, 7'nin ………… dır.  c) 7, 63'ün ………… dır.", "a": ["Çarpılan sayılar sonucun çarpanıdır: 9 ve 7, 63'ün çarpanıdır.", "Sonuç, çarpılan sayıların katıdır: 63, 9'un ve 7'nin katıdır."], "c": "a) çarpanı  b) katı  c) çarpanı"}, {"k": "Bir sayı hem 30'un çarpanı hem de 5'in katıdır. Bu sayı hangi sayılar olabilir? Hepsini yazınız.", "a": ["30'un çarpanları: 1, 2, 3, 5, 6, 10, 15, 30.", "Bunlardan 5'in katı olanlar 5'e kalansız bölünenlerdir: 5, 10, 15, 30."], "c": "5, 10, 15, 30"}]}, {"no": 6, "bas": "Problemlerde çarpan ve kat", "q": [{"k": "84 öğrenci, her grupta eşit sayıda öğrenci olacak ve açıkta kimse kalmayacak şekilde gruplara ayrılacaktır. Bir grupta 5'ten fazla, 15'ten az öğrenci olacaksa bir gruptaki öğrenci sayısı kaç olabilir? Bütün olasılıkları yazınız.", "a": ["Açıkta kimse kalmadığı için bir gruptaki öğrenci sayısı 84'ün çarpanıdır.", "84 = 1 x 84 = 2 x 42 = 3 x 28 = 4 x 21 = 6 x 14 = 7 x 12. Çarpanlar: 1, 2, 3, 4, 6, 7, 12, 14, 21, 28, 42, 84.", "5'ten fazla, 15'ten az olanlar: 6, 7, 12, 14."], "c": "6, 7, 12 ya da 14"}, {"k": "Bir saat kulesi her 15 dakikada bir çalmaktadır. Kule saat 09.00'da çaldıktan sonra saat 10.40'a kadar kaç kez daha çalar?", "a": ["Kule 09.00'dan sonra 15, 30, 45, … dakika geçince çalar; bu süreler 15'in katlarıdır.", "09.00 ile 10.40 arası 100 dakikadır. 15 x 6 = 90 ≤ 100 ve 15 x 7 = 105 > 100.", "Kule 09.15, 09.30, 09.45, 10.00, 10.15 ve 10.30'da çalar."], "c": "6 kez"}]}], "k": [{"no": 1, "bas": "Çarpanlarını yazınız", "yon": "Her sayının bütün çarpanlarını küçükten büyüğe yazınız. Çarpan çiftlerini kullanırsanız hiçbirini atlamazsınız.", "r": [{"n": "18", "c": "1, 2, 3, 6, 9, 18"}, {"n": "24", "c": "1, 2, 3, 4, 6, 8, 12, 24"}, {"n": "29", "c": "1, 29"}, {"n": "32", "c": "1, 2, 4, 8, 16, 32"}, {"n": "45", "c": "1, 3, 5, 9, 15, 45"}, {"n": "50", "c": "1, 2, 5, 10, 25, 50"}]}, {"no": 2, "bas": "Katlarını yazınız", "yon": "Her sayının ilk beş katını yazınız. Unutmayınız: Bir sayının en küçük katı kendisidir.", "r": [{"n": "6", "c": "6, 12, 18, 24, 30"}, {"n": "9", "c": "9, 18, 27, 36, 45"}, {"n": "11", "c": "11, 22, 33, 44, 55"}, {"n": "15", "c": "15, 30, 45, 60, 75"}, {"n": "25", "c": "25, 50, 75, 100, 125"}, {"n": "40", "c": "40, 80, 120, 160, 200"}]}, {"no": 3, "bas": "Çarpanı mı, katı mı?", "yon": "Boşluğa “çarpanıdır”, “katıdır” ya da “hem çarpanı hem katıdır” yazınız.", "r": [{"n": "6, 42'nin …", "c": "çarpanıdır"}, {"n": "54, 9'un …", "c": "katıdır"}, {"n": "13, 52'nin …", "c": "çarpanıdır"}, {"n": "75, 25'in …", "c": "katıdır"}, {"n": "1, 37'nin …", "c": "çarpanıdır"}, {"n": "48, 48'in …", "c": "hem çarpanı hem k n sonuna kadar çıkacaktır.</p>", "k": "Buna göre, Arda aşağıdaki basamaklardan hangisine basar?", "sec": ["13", "23", "31", "33"], "secg": null, "c": "D", "a": ["Arda'nın bastığı basamaklar sayı doğrusunda 3'er atlanarak bulunur: 3, 6, 9, 12, … Bu sayılar 3'ün katlarıdır (3 x 1, 3 x 2, 3 x 3, …).", "Seçeneklerdeki sayılardan 3'e kalansız bölünen bulunur: 13 : 3 işleminde kalan 1, 23 : 3 işleminde kalan 2, 31 : 3 işleminde kalan 1'dir.", "33 = 3 x 11 olduğundan Arda 11. adımında 33. basamağa basar."], "t": "13 ve 23: birler basamağı 3 olan sayılar 3'ün katı sanılmış; 31: onlar basamağındaki 3'e bakılmış", "d": "Birler basamağı 3 olan sayılar 3'ün katı olmak zorunda değildir. Her seçeneği 3'e bölerek kalanı kontrol ediniz.", "ses": "b03"}, {"no": 4, "on": "<p>Bir okulda bilim şenliği düzenlenecektir. Şenliğe katılan öğrenciler, deney yapmak için eşit sayıda öğrenciden oluşan gruplara ayrılacaktır.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1672 941\" width=\"1672\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAGsAvgDASIAAhEBAxEB/8QAHAAAAAcBAQAAAAAAAAAAAAAAAAECAwQFBgcI/8QATxAAAQMCAwQFCAYIBAQFBAMAAQACAwQRBRIhBhMxQSJRYXGBBxQycpGhscEVIzNCUtEWNENTYoKS4SQ1c/AlVGOiRHSTsvEXZKPCRYPS/8QAGgEAAwEBAQEAAAAAAAAAAAAAAAECAwQFBv/EADMRAAICAQMCBQIFBAIDAQAAAAABAhEDEiExBEETFCIyUVJhFUJxgbEjM5GhBfBDYtHh/9oADAMBAAIRAxEAPwDqj8FpXcAW9xVbimDCCmdJG8nsK0ahYqL0bu9GmL7C1SXcy1PA6zYgOkTaymOwSrGoZfuKEA/x0XrBakcFjHHF3ZtKbVUZF2HVkfGN6RlqIzqHDvC2NgeSIxsdxaD4JvEhLLIyQrKiMekfakxYg6SS+uZvNaiaip5GHNE3h1LMNpWsqnNboC6wUyxyS2ZUcibposY8dkbYOAKkMx1h9JvsRHAYnMBD3A2TL8AePRkB7wqrIibxsnsximdxJCfFfTOGkrfaqN2DVLeAB7iolVS1FMzM9rmjrT1TXKDTB8MmYhNHJNdhvqnITdoVBBJI6YhxuAtDg1pZi1+tgkslyB46iLcSkXKuHU0TuLUy7DozwJC0MyvCOD9ZZ3qTJ +zb+xHx6/uZI1CELRg/9k=\" x=\"0\" y=\"0\" width=\"1916\" height=\"621\" preserveAspectRatio=\"none\"/><g transform=\"translate(0,-200)\"><line x1=\"56.0\" y1=\"350.0\" x2=\"1860.0\" y2=\"350.0\" stroke=\"#111111\" stroke-width=\"4\"/><line x1=\"56.0\" y1=\"328.0\" x2=\"56.0\" y2=\"372.0\" stroke=\"#111111\" stroke-width=\"4\"/><line x1=\"1860.0\" y1=\"328.0\" x2=\"1860.0\" y2=\"372.0\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"958.0\" y=\"330.0\" font-size=\"56\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">70 cm</text></g></svg>", "son": "<p>Parçaların uzunluğu santimetre cinsinden bir doğal sayı olacaktır. Marangoz, bu çubuktan 3'ten fazla parça elde etmek istemektedir.</p>", "k": "Buna göre, bir parçanın uzunluğu <u>en fazla</u> kaç santimetre olabilir?", "sec": ["14", "17", "23", "35"], "secg": null, "c": "A", "a": ["Çubuk eş parçalara hiç artmadan kesileceğinden parça sayısı da parça uzunluğu da 70'in çarpanıdır: 70 = 1 x 70 = 2 x 35 = 5 x 14 = 7 x 10.", "Parça sayısı 3'ten fazla olmalıdır. Parça sayısı arttıkça parça kısalır; bu yüzden 3'ten büyük en küçük parça sayısı seçilir. 4, 70'in çarpanı değildir; 5 ise çarpandır.", "70 : 5 = 14 olduğundan bir parça en fazla 14 cm olur."], "t": "17: 70 : 4 işleminin bölümü alınmış, oysa kalan 2 artar; 23: 3 parçaya kesilmiş gibi düşünülmüş, 70 : 3 kalanlıdır; 35: parça sayısı koşulu unutulup 2 parça alınmış", "d": "Parça uzunluğu en fazla olsun istiyorsak parça sayısı en az olmalıdır. Parça sayısıyla ilgili koşulu unutmayınız.", "ses": "b08"}, {"no": 9, "on": "<p>Bir otobüs durağındaki tabelada, duraktan kalkan otobüslerin sefer bilgileri yazmaktadır. Otobüsler, ilk seferden sonra her zaman eşit aralıklarla kalkmaktadır.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1672 730\" width=\"1672\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmK 72\" height=\"730\" preserveAspectRatio=\"none\"/><g transform=\"translate(0,-70)\"><text x=\"414.0\" y=\"198.0\" font-size=\"30.3\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-maxw=\"370\">DURAK SEFER BİLGİSİ</text><text x=\"414.0\" y=\"305.0\" font-size=\"42\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" data-maxw=\"360\" data-grup=\"r09\">İlk sefer:</text><text x=\"414.0\" y=\"380.0\" font-size=\"70\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">07.00</text><text x=\"414.0\" y=\"500.0\" font-size=\"42\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" data-maxw=\"360\" data-grup=\"r09\">Sefer aralığı:</text><text x=\"414.0\" y=\"575.0\" font-size=\"66\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-maxw=\"360\">25 dakika</text><text x=\"961.0\" y=\"186.0\" font-size=\"92\" font-weight=\"800\" fill=\"#f8f9fa\" text-anchor=\"middle\" data-maxw=\"270\">08.50</text></g></svg>", "son": "<p>Elif, durağa saatin gösterdiği anda gelmiştir. O sırada durakta bekleyen otobüs yoktur.</p>", "k": "Buna göre, Elif bir otobüse binmek için <u>en az</u> kaç dakika bekler?", "sec": ["5", "10", "15", "25"], "secg": null, "c": "C", "a": ["Otobüsler 07.00'dan sonra 25, 50, 75, 100, 125, … dakika geçince kalkar; bu süreler 25'in katlarıdır.", "Saat 08.50, ilk seferden 60 + 50 = 110 dakika sonradır. 110, 25'in katı değildir: 25 x 4 = 100 ve 25 x 5 = 125.", "Sonraki otobüs 125. dakikada, yani saat 09.05'te kalkar. Elif en az 125 − 110 = 15 dakika bekler."], "t": "5: saat başında, 09.00'da sefer olduğu sanılmış; 10: önceki seferle (08.40) aradaki süre alınmış; 25: sefer aralığı cevap sanılmış", "d": "Saatleri ilk seferden geçen dakikaya çeviriniz. Seferler ilk kalkıştan itibaren sayılır; her saat başında sefer olduğunu varsaymayınız.", "ses": "b09"}, {"no": 10, "on": "<p>Zemin kattan başka 22 katı olan bir iş merkezinde iki asansör bulunmaktadır. Asansörlerin durduğu katlar, zemin kattaki bilgi panosunda aşağı kata gitmek isteyenler bir alt ya da bir üst kattan merdivenle çıkmaktadır.</p>", "k": "Buna göre, 1. kat ile 22. kat arasındaki katların (1. ve 22. kat dâhil) kaç tanesine zemin kattan asansörle doğrudan <u>gidilemez</u>?", "sec": ["6", "7", "11", "16"], "secg": null, "c": "A", "a": ["Mavi asansör tek numaralı 11 katta durur: 1, 3, 5, …, 21.", "Sarı asansör 4'ün katlarında durur: 4 x 1 = 4, 8, 12, 16, 4 x 5 = 20. 4 x 6 = 24 &gt; 22 olduğundan başka kat yoktur. Bu katların hepsi çift numaralıdır; mavi asansörün durduğu katlarla aynı değildir.", "Asansörle gidilen kat sayısı 11 + 5 = 16'dır. Gidilemeyen katlar 22 − 16 = 6 tanedir: 2, 6, 10, 14, 18, 22."], "t": "7: 20 = 4 x 5 olduğu gözden kaçırılıp 20. kat da gidilemeyen kat sayılmış; 11: yalnız mavi asansör düşünülüp çift numaralı katların hepsi sayılmış; 16: asansörle gidilebilen kat sayısı bulunmuş", "d": "İki asansörün durduğu katları birleştirirken ortak kat olup olmadığını kontrol ediniz. 1. ve 22. katın sayıma dâhil olduğuna dikkat ediniz.", "ses": "b10"}, {"no": 11, "on": "<p>Bir öğretmen, öğrencileri için deneme sınavı kâğıtları hazırlamıştır. Kâğıtlardan biri ve öğretmenin masasındaki not aşağıda gösterilmiştir.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1672 800\" width=\"1672\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAFsAvgDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAAMBAgQFBgf/xABDEAABAwIDBAcHAgUEAgICAwEBAAIDBBESITEFE0FxBiIyUWGBkRRCUnKhscGC0SMzQ1PhBxVikiTwRPFjohZzsuL/xAAaAQEBAAMBAQAAAAAAAAAAAAAAAQIDBAUG/8QAKBEBAQACAQUAAQQDAQEBAAAAAAECEQMEEiExQSITMlFhQnGxgRSR/9oADAMBAAIRAxEAPwDylRPXSUhZPG3adGwhgEwJcwm9g1wz4HwyXBLqFhd7M+ekxase3eN9RmvStx4HyOa8RQuDWNiNnySG2h1yNrW/dc/a9E3EGQhhkY3+K5gJaziGgnWwGupGXBY3KXxlGzHH t=\"700\" fill=\"#111111\" text-anchor=\"middle\">24</text><text x=\"1261.0\" y=\"700.0\" font-size=\"50\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">25</text><text x=\"409.0\" y=\"819.0\" font-size=\"50\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">26</text><text x=\"552.5\" y=\"819.0\" font-size=\"50\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">27</text><text x=\"694.5\" y=\"819.0\" font-size=\"50\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">28</text><text x=\"835.0\" y=\"819.0\" font-size=\"50\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">29</text><text x=\"975.5\" y=\"819.0\" font-size=\"50\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">30</text><text x=\"1117.0\" y=\"819.0\" font-size=\"50\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">31</text></g></svg>", "son": "<p>Aylin, takvimde numarası 7'nin katı olan günleri işaretleyecektir. Aylin, işaretlemeden önce şu önermeleri yazmıştır:</p><div style=\"margin:1mm 0 1mm 2mm\"><div style=\"margin:.6mm 0\">I. İşaretlenecek günlerin hepsi haftanın aynı gününe denk gelir.</div><div style=\"margin:.6mm 0\">II. Ekim ayı 30 gün çekseydi işaretlenecek gün sayısı daha az olurdu.</div><div style=\"margin:.6mm 0\">III. Hangi ay olursa olsun, bir ayda işaretlenecek ilk gün pazartesidir.</div></div>", "k": "Buna göre, Aylin'in yazdığı önermelerden hangileri doğrudur?", "sec": ["Yalnız I", "Yalnız II", "I ve II", "I ve III"], "secg": null, "c": "A", "a": ["7'nin katları 7, 14, 21, 28, 35, …'tir; ayda 31 gün olduğundan işaretlenecek günler 7, 14, 21, 28'dir.", "I: Ardışık iki kat arasında 7 gün, yani tam bir hafta vardır. Bu yüzden hepsi haftanın aynı günüdür (bu takvimde çarşamba). Doğrudur.", "II: Ay 30 gün çekseydi de 7, 14, 21, 28 işaretlenirdi; 35 zaten 31'den büyüktür. Sayı değişmez. Yanlıştır.", "III: Bu takvimde 7 Ekim Çarşambaya denk gelir; ilk işaretli gün ayın hangi günle başladığına bağlıdır. Yanlıştır."], "t": "Yalnız II ve I ve II: 30 günlük ayda 28'in de işaretleneceği gözden kaçırılmış; I ve III: tek bir örnek ayın bütün aylar için geçerli olduğu sanılmış", "d": "Her önermeyi ayrı ayrı sınayınız. Bir önermenin yanlış olduğunu göstermek için tek bir karşı örnek yeter.", "ses": "b13"}, {"no": 14, "on": "<p>Öğretmen, tahtaya bir önerme yazmıştır. Ada, Berk, Cem ve Duru, bu önermeyi desteklemek için birer sayı seçip örnek kart hazırlamıştır. Tahtadaki önerme ve öğrencilerin kartları aşağıda gösterilmiştir.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1170 610\" width=\"1170\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAGMAvgDASIAAhEBAxEB/8QAGwAAAwADAQEAAAAAAAAAAAAAAAECAwQFBgf/xABLEAACAQIDAwYJCgUCBAcBAQAAAQIDEQQhMQUSQRNRU2GRkgYUFSIyUnGBkxYjM0JDRFShsdEkNHKCwWJjJXODsjVkosLh8PEmNv/EABsBAQEAAwEBAQAAAAAAAAAAAAABAgQFAwYH/8QALxEBAAECBAUEAgICAgMAAAAAAAECAxETFFEEEiEyYRUzUpExQQVxIjRTgcHR8P/aAAwDAQACEQMRAD8A1r72pLedgT80TVzBpE7NsiWbyKySEUTayGsg1Y87kQWFYtRFLUqpSvnYCs9BNWAQAusHmQJ5vqJtxKeQgBBcAsABbMEsgYCazE0O/MGpBNgaZZPEBJDYJZ5jCoApkgDEO3EQQW5xWC4gGIfAQCdwzGIBCGIAEPIAiRDYAILDsABukvIologkBtBYqjUTRSQ7ZEECKdhFCT5xMYgC7HdglzItJpATmhbzRTfAniFNSdtAJu7lL2ANLIaQkx3AHcmzvYeXOG9bRgKzFmDm2xb2QA0xWHdibAVgsFhgJIdkOwmwFoIYBSeepLiishZAJomzLEERa2VxlNZ6E24gS7BmNrMVgEAxAANDE8wFYllNEMBAA0ECGCHey6wqbXYWBNlJATKNiVexcyUQSA2nYAPUvmJelwz97GZoi1xtdhaiSwidBp53ApIKe8miWh+wUnwWiAHdInrYNvQlvMIJSBZha47WALBbqGtLsaRFLdtqNIoMgIa5iN3tMkmiLtoBWsF8wbfMNRbzClcLceA7LgTcAazD2Dz1FdkRLeYh2zuJsoNAbEBAuIDfUIAvYAFcBsljuIBAMMgExFNoMuYgiwWKz5gs2URYCrdYt0BCL3UlmTqQS2BVhXSKC2Yae0L5AkAcCGW8hWIJ3ese6OwZsoaWQO4JdYEEtMGkVqFkVUJA3YppE6gF+oLviAXYA2S2N6Cs+YBAOw9QJsO3OOwALUQZjAVmA28shcQE0TbMyEsCbB7QYvaACtmNCeQBftByfMKwndgF0DBITIAA/MeQCCzT  saymaktadır. Ali, bu yolla 20'nin çarpan sayısını doğru bulmuştur.</p>", "k": "Buna göre, Ali bu yolu aşağıdaki sayılardan hangisi için kullanırsa çarpan sayısını yanlış bulur?", "sec": ["21", "33", "35", "49"], "secg": null, "c": "D", "a": ["Ali'nin yolu, her dikdörtgenin iki farklı kenar uzunluğu olduğunda doğru sonuç verir.", "21 = 1 x 21 = 3 x 7; 33 = 1 x 33 = 3 x 11; 35 = 1 x 35 = 5 x 7. Her birinde 2 dikdörtgen ve 4 çarpan vardır; yol doğru sonuç verir.", "49 = 1 x 49 = 7 x 7. Ali 2 dikdörtgen çizer ve 2 x 2 = 4 çarpan bulur.", "7 x 7 dikdörtgeninin iki kenarı aynı sayıdır; 7 yalnız bir kez sayılır. 49'un çarpanları 1, 7, 49'dur; çarpan sayısı 3'tür. Yol, kenarları eşit bir dikdörtgen (kare) kurulabilen sayılarda uygulanamaz."], "t": "21, 33 ve 35: bütün dikdörtgenlerinin kenarları farklı olduğundan yol doğru sonuç verir; bu sayıları seçen öğrenci tek sayıların ya da büyük çarpanı olan sayıların yolu bozduğunu sanmıştır", "d": "Aynı sayının kendisiyle çarpıldığı çift (7 x 7 gibi) özel bir durumdur. Böyle bir çiftte çarpan yalnız bir kez sayılır.", "ses": "b16"}, {"no": 17, "on": "<p>Matematik kulübündeki Aras, Bade ve Can, sıfır hariç doğal sayıların çarpanları ve katları hakkında birer önerme söylemiştir. Öğrencilerin önermeleri aşağıda gösterilmiştir.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1672 760\" width=\"1672\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAFZAvgDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAAEDBAUGAgcI/8QAUxAAAQMCAwQGBQgHBgQEBAcAAQACAwQRBRIhBjFBURMiMmFxgQcUQpGhFSMzUnKxwdE0Q1NigpLhFiQ1k7LwRHOD8SVUVaIXNnTSJjdFY3WUs//EABoBAAIDAQEAAAAAAAAAAAAAAAADAQIEBQb/xAA2EQACAgEDAgQEBgICAQUBAAAAAQIDEQQhMRJBEyIyURRhgaEFM0JScZEVsSNTJDRDwdHh8P/aAAwDAQACEQMRA e bağlı değildir."], "t": "95: en büyük sayının en çok çarpanı olduğu sanılmış; 86: çift ve büyük sayı olduğu için çok çarpanı olduğu sanılmış; 93: 3'e bölündüğü görülüp başka çarpanları da olduğu sanılmış", "d": "Büyük sayının daha çok çarpanı olduğunu varsaymayınız. Her kartın çarpan çiftlerini tek tek yazıp sayınız.", "ses": "b18"}, {"no": 19, "on": "<p>Dikdörtgen biçimindeki bir okul bahçesinin alanı 66 m²'dir. Bahçenin kenar uzunlukları metre cinsinden birer doğal sayıdır ve her biri 2 m'den fazladır.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1672 941\" width=\"1672\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAGsAvgDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAwABAgQFBgcI/8QASRAAAgEDAwIEBAMFBgUDAwEJAQIDAAQREiExBUETIlFhBjJxgRSRoSNCwdHwFRYzUrHhByRTYvFygpJDRKIXJSY0VGNzg7KT/8QAGgEBAQEBAQEBAAAAAAAAAAAAAAECAwQFBv/EAC8RAAICAQQCAQQCAQMFAQAAAAABAhEDEiExURNBYQQUIjJScTNigZEFI6Gx8PH/2gAMAwEAAhEDEQA/APV6emp65HQVKlSoBUqVKgHpU1KgHpUhVca2JIc88ZqN0VKyxTUBn0fM5z6Zqut246ikJbyPsB74JpZaL9KlSqmRUgfeqHVJZRAywLKHTDBlOBn0NZ/TurfslhnZ4DGpBLKMZz29e++a8OT62EMmhloL1q+nhgLxhg8bBgBupAPNEtusrNohVyJI2VZjKAuSRnC5xms+6vIpQ0viRtDpB1kZA3wSfSsOWZrS5urtLiO4ZCSoeMFeRtjP03r5cPqJLLJ3yafB3r3ESTLEW8zZ4HGBnf0ooIIyDkGuCTqtzL1SSF42gu3H7IiQHQe+ocEYH2rrulXkc/S/xPizyRgsTJMBkgdxjtX1cH1LyN6jBfpldXzpYNpOk47H0qlHewdShmiTWhwBk7bnjHvtWSLua3kuYWSUEjJbOpQeMkAdwM/amT6uMaa3TLR0gZWzpIODg47GlXP9E6onixWkkdw00kYfUvmjxnBPtv8A610Fd8OTyRtkFSp6VdgNSpUqAelTUqAempUqAVKlSoBUqVKgFSpUqAVKlSoB6VNSoB6alSoBUqVKgFSpUqAVKlSoBUqVKgFSpUqAVKlSoBUqVKgFSpU1APSpqVAPTUqVAPTUqVAKlSzSoBUqVKgFSpUqAVKnrI6p1K3NtmGV5M5BEL4weNxzz9Oa55MihG2C4nUIHydQi0sFcSkKQTsBjmpG/tQ8cZmUPKxWNc7vj0HpXEXl3MpldHYKg2fVl9hsM9jmqcXxBLa3sk6QC4ePdRLCE823yk7537H0rxQ+qm5UzLdHpL   k.appendChild(sesKutu(s.ses));const w=document.createElement("div");k.appendChild(w);
  adimAdim(w,s.a,()=>{const c=document.createElement("p");c.className="cevap";c.textContent=`Doğru cevap: ${s.c}`;w.appendChild(c);
    k.querySelectorAll("ol.sec li").forEach(li=>{if(li.dataset.h===s.c)li.classList.add("dogru");});
    if(s.t){const t=document.createElement("p");t.className="tuzak";t.innerHTML="<b>Diğer seçenekler neden yanlış?</b> "+s.t;w.appendChild(t);}});
  const d=document.createElement("div");d.className="dikkat";d.innerHTML=`<b>Dikkat!</b> ${s.d}`;k.appendChild(d);return k;}
const ic=$("#ic");
const BOL=[["s","Sıra Sende",V.s,kartS],["k","Kalem Kâğıt",V.k,kartK],["b","Bağlam Soruları",V.b,kartB]];
if(tek){const n=+q.get(tek);const [,,L,f]=BOL.find(x=>x[0]===tek);const s=L.find(x=>x.no===n)||L[0];ic.appendChild(f(s));$("#tum").hidden=false;$("#nav").remove();}
else{let akt="s";const nav=$("#nav");const ciz=()=>{ic.innerHTML="";nav.innerHTML=BOL.map(([k,a,L])=>`<button type="button" data-k="${k}" aria-pressed="${k===akt}">${a} (${L.length})</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{akt=b.dataset.k;ciz();});const [,,L,f]=BOL.find(x=>x[0]===akt);L.forEach(s=>ic.appendChild(f(s)));};ciz();}

/* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
