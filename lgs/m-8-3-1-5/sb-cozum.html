<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--muted:#5b6478;--line:#dfe5ef;--bg:#f5f7fb;--card:#fff;--ss:#6741d9;--kk:#0b7285;--b:#d0700f;--ok:#2b8a3e;--warn:#c92a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif}
header{background:linear-gradient(135deg,#1c5fbf,#2f8fe0);color:#fff;padding:18px 16px 22px}

nav.sec{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}nav.sec button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}

ol.sec li{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}ol.sec li.dogru{border-color:var(--ok);background:#ebfbee;font-weight:800}
.adim{border-left:4px solid var(--c);padding:6px 12px;margin:8px 0;background:#fff;border-radius:0 10px 10px 0;animation:gel .35s ease-out}

.dug{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
button.btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.dikkat{background:#fff4e6;border:2px solid #f59f00;border-radius:12px;padding:10px 14px;margin:12px 0 4px}.dikkat b{color:#d9480f}

table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid var(--line);padding:8px 10px;text-align:left}th{background:#e3fafc;color:#0b7285;font-size:13px;letter-spacing:.06em}

@media (prefers-reduced-motion:reduce){.adim{animation:none}}
/* Canlandır (05.10.2026) */
.sek{display:flex;gap:6px;margin:12px 0 0;border-bottom:2px solid var(--line)}
.sek button{border:0;background:none;font:inherit;font-weight:900;font-size:15px;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);min-height:44px;position:relative;top:2px;border-bottom:3px solid transparent}
.sek button[aria-selected=true]{color:var(--c);border-bottom-color:var(--c);background:#fff8f0}
.sek .yeni{display:inline-block;font-size:10px;background:#2b8a3e;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.06em}
.cn{padding-top:10px}
.cn-yon{background:#eef6ff;border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:10px}

.cn-btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
.cn-btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}

.cn-hazir{display:flex;flex-wrap:wrap;gap:6px}

.cn-df{margin-top:10px;overflow-x:auto}@media(max-width:480px){.cn-adimci>span{flex-basis:100%}.cn-h{font-size:12px;padding:5px 0}.cn-izg{gap:3px}.cn-sahne{padding:6px}}@media(max-width:480px){.cn-df table{font-size:13px}.cn-df td,.cn-df th{padding:4px 5px}}.cn-df summary{font-weight:900;cursor:pointer;padding:6px 0}.cn-say{color:var(--muted);font-weight:700}

.cn-p{animation:cnGel .35s ease-out both}@keyframes cnGel{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cn-o{fill:#ffa94d;stroke:#d9480f;stroke-width:1}.cn-o2{fill:#e8590c}.cn-k{fill:#ffc9c9;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:3 2}
.cn-cerceve{stroke:#2b8a3e;stroke-width:3}.cn-et{font-size:13px;font-weight:800;fill:#5b6478}.cn-et.b,.cn-et2b{font-weight:900;fill:#1d2433}.cn-et2{font-size:11px;fill:#5b6478;font-weight:700}.cn-et2b{font-size:13px;fill:#fff}
.cn-ku{fill:#fff4e6;stroke:#ffa94d;stroke-width:1.5}.cn-kk{fill:#fff5f5;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:4 3}
.cn-tahta0{fill:#f1f3f5;stroke:#ced4da}.cn-tahta{fill:#c08552;stroke:#8d5a2b}
.cn-ek{stroke:#868e96;stroke-width:2}.cn-sinir{stroke:#c92a2a;stroke-width:3;stroke-dasharray:5 4}.cn-yay{fill:none;stroke:#f76707;stroke-width:2}
.cn-v1{stroke:#2b8a3e;stroke-width:3}.cn-v2{stroke:#c92a2a;stroke-width:3}.cn-kis{font-size:20px}.cn-bus{font-size:16px}.cn-bek{stroke:#c92a2a;stroke-width:5;stroke-linecap:round;opacity:.6}
.cn-kum{fill:#ffe8cc;stroke:#e8590c;stroke-width:3}.cn-kum2{fill:#495057}.cn-para{fill:#ffd43b;opacity:.85}.cn-buyuk{font-size:26px;font-weight:900;fill:#1d2433}
.cn-zem{fill:#adb5bd}.cn-kat{fill:#f1f3f5;stroke:#ced4da}.cn-katon{fill:#d3f9d8;stroke:#2b8a3e}.cn-katoff{fill:#ffe3e3;stroke:#e03131}
.cn-izg{display:grid;gap:4px}.cn-h,.cn-gb{border-radius:8px;text-align:center;font-weight:800;font-size:14px;padding:6px 0}.cn-h{background:#f1f3f5;transition:background .25s,transform .25s}
.cn-gb{background:none;color:var(--muted);font-size:12px}.cn-h.on{background:#ffa94d;color:#1d2433}.cn-h.yeni{transform:scale(1.18);box-shadow:0 0 0 3px #e8590c}
.cn-kartlar{display:flex;flex-wrap:wrap;gap:6px;padding:4px}.cn-kart{min-width:44px;padding:8px 10px;text-align:center;border-radius:10px;background:#fff4e6;border:2px solid #ffa94d;font-weight:900;animation:cnGel .3s}
.cn-kart.kare{background:#e7f5ff;border-color:#1c7ed6}.cn-bosk{color:var(--muted)}
.cn-cift{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 4px;font-weight:800}.cn-cift i{font-weight:600;color:#1c7ed6}
.cn-katlar{padding:4px}.cn-katsat{display:inline-flex;flex-wrap:wrap;gap:6px}.cn-kat2{background:#e6fcf5;border:1.5px solid #12b886;border-radius:8px;padding:3px 8px;font-weight:800;animation:cnGel .3s}.cn-sonsuz{font-weight:800;color:#0b7285}
.cn-onr{background:#f8f0fc;border:2px solid #ae3ec9;border-radius:12px;padding:10px 14px}.cn-kanit{padding:10px 4px 2px}
.cn-kay{display:inline-flex;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap}.cn-kay{max-width:100%}.cn-kay input{width:min(220px,70vw);accent-color:#d0700f}.cn-satir>*{min-width:0;max-width:100%}
@media (prefers-reduced-motion:reduce){.cn-p,.cn-kart,.cn-kat2{animation:none}.cn-h{transition:none}}
/* 05.10.2026 · KOŞUL ve LABİRENT motorları (SB 6.1.1) */
@media(max-width:560px){.soru [style*="grid-template-columns:repeat"]{grid-template-columns:1fr!important}}   /* çok sütunlu konuşma balonları telefonda alt alta */
.cn-kl{list-style:none;padding:0;margin:0;display:grid;gap:4px}.cn-not{color:var(--muted);font-size:14px}.cn-sonuc{margin-top:6px;font-weight:800}
.cn-secg{gap:6px}.cn-secad{font-weight:800;flex-basis:100%}.cn-secg .cn-btn{padding:8px 12px}
.cn-mv{fill:#74c0fc;stroke:#1c7ed6;stroke-width:1}.cn-tl{fill:#69db7c;stroke:#2b8a3e;stroke-width:1.5}
.cn-lab{display:grid;gap:4px;align-items:center;max-width:460px;margin:0 auto}
.cn-lc{min-height:44px;border-radius:8px;border:1.5px solid #ced4da;background:#fff;font:inherit;font-weight:900;font-size:16px;cursor:pointer;padding:0;color:var(--ink)}
.cn-lc.yol{background:#d3f9d8;border-color:#2b8a3e}.cn-lc.simdi{background:#2b8a3e;color:#fff;box-shadow:0 0 0 3px #b2f2bb}.cn-lc.kapali{background:#ffe3e3;border-color:#e03131;color:#c92a2a;text-decoration:line-through}
.cn-lok{color:#2b8a3e;font-weight:900;text-align:center}.cn-lcik{min-height:44px;border:0;background:none;font:inherit;font-weight:900;color:#d9480f;cursor:pointer;padding:0;white-space:nowrap;font-size:14px}.cn-lcik:disabled{cursor:default}

</style></head><body>
<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
window.SBH = "CADBBDACDBCAACBD";
/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }
      if (!art && !o.sandalye) sv += `<rect x="10" y="10" width="${gen * hc}" height="${sira * hc}" fill="none" class="cn-cerceve"/>
        <text x="${10 + gen * hc / 2}" y="${H + 4}" class="cn-et" text-anchor="middle">${gen} ${o.birim || ""}</text>
        <text x="${W + 4}" y="${10 + sira * hc / 2}" class="cn-et" dominant-baseline="middle">${sira} ${o.birim || ""}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W + 70} ${H + 22}" role="img" aria-label="${N} ${o.ad || "kare"}, her sırada ${gen}">${sv}</svg>`;
      const r = o.kural ? o.kural(gen, sira, art, N) : null;
      let m;
      if (art) m = `<span class="kotu">✘</span> ${N} ${o.ad || "kare"} her sırada ${gen} olacak biçimde dizilince ${sira} tam sıra oluşur, <b>${art} ${o.ad || "kare"} artar</b>. Dikdörtgen olmaz: ${N} : ${gen} işleminde kalan ${art}.`;
      else m = `<span class="iyi">✔</span> <b>${N} = ${gen} ${x} ${sira}</b> · ${sira} sıra, her sırada ${gen} ${o.ad || "kare"}; hiç artmadı.` + (gen === sira ? ` <b>Kare oldu!</b> İki kenar aynı: ${gen}.` : "");
      if (!art && o.cevre) m += ` Çevre = 2 ${x} (${gen} + ${sira}) = <b>${2 * (gen + sira)} m</b>.`;
      if (r && r.msg) m += `<br>${r.msg}`;
      s.dur.innerHTML = m;
      const sutunlar = o.satir ? o.satir(gen, sira, art, N, r) : [gen, art ? `${sira} (+ ${art} artan)` : sira, art, art ? "olmaz" : (gen === sira ? "kare" : "dikdörtgen")];
      s.yaz(N + ":" + gen, sutunlar, !art && (!r || r.ok !== false));
    }
    ciz(g.get());
  }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {
    const N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });
    const g = adimci(o.etiket, 1, o.max || N, o.bas || 2, v => { sonK = v; });

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {

      ciftler.innerHTML = L.filter(v => v * v <= N).map(v => `<span>${v} ${x} ${N / v}${v * v === N ? " <i>(aynı sayı: bir kez yazılır)</i>" : ""}</span>`).join("");
    }
    const tamamMi = () => { for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) return false; return true; };
    const eksik = () => { const L = []; for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) L.push(i); return ` <br>Henüz denenmeyen küçük bölenler var: <b>${L.join(", ")}</b>. Bunları da deneyin.`; };
    function dene(d) {
      if (!d || d < 1) return; denendi.add(d);
      const b = Math.floor(N / d), r = N % d;
      if (d > N) { s.dur.innerHTML = `${d} > ${N}: ${E(N,"den")} büyük sayı ${E(N,"in")} çarpanı olamaz.`; return; }
      if (r === 0) { bul.add(d); bul.add(b); ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${N} : ${d} = ${b}, kalan 0 → <b>${d} ${x} ${b} = ${N}</b>. ${d} ve ${b} çarpandır.` + (d * d >= N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} ${d * d === N ? "=" : ">"} ${N}. Artık yeni çift çıkmaz; bütün çarpanlar bulundu.` : eksik() : ""); }
      else { s.dur.innerHTML = `<span class="kotu">✘</span> ${N} : ${d} işleminde bölüm ${b}, <b>kalan ${r}</b>. ${d}, ${E(N,"in")} çarpanı değildir.` + (d * d > N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} > ${N}. Daha büyük bölen denemeye gerek yok; çarpan listesi tamam.` : eksik() : ""); }
      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));
      if (tamam) s.yaz("n" + N, [N, [...bul].sort((a, b) => a - b).join(", "), bul.size], true);
    }
    bD.onclick = () => dene(Math.round(+bi.value));
    bS.onclick = () => { let d = 1; while (denendi.has(d)) d++; bi.value = d; dene(d); };
    if (bK) bK.onclick = async () => {
      bK.disabled = true; katlar.textContent = ""; const sat = h("div", "cn-katsat"); katlar.append(h("b", "", `${E(N,"in")} katları: `), sat);
      for (let i = 1; i <= (o.katSay || 12); i++) { sat.appendChild(h("span", "cn-kat2", `${N * i}`)); await bekle(220); }
      sat.appendChild(h("span", "cn-sonsuz", "… ve sonsuza kadar sürer"));
      bK.disabled = false;
    };
    yeni();
  }

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */
  function KUMBARA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Para", "Sonuç"] });
    const k = o.k; let hafta = 0, tmr = null;
    const kut = h("div", "cn-satir"); const bA = dug("Bir hafta geçsin +"), bO = dug("▶ Haftaları oynat", "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bO, bS); s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Kumbarada şu para olabilir mi? <input type="number" inputmode="numeric" min="1" max="500"> TL</label>`;
    const bT = dug("Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test); const ti = test.querySelector("input");
    function ciz() {
      const top = hafta * k, sv = [];
      const yuk = Math.min(150, top * 1.4);
      sv.push(`<rect x="110" y="20" width="120" height="160" rx="22" class="cn-kum"/><rect x="150" y="14" width="40" height="8" rx="3" class="cn-kum2"/>`);
      sv.push(`<rect x="116" y="${176 - yuk}" width="108" height="${yuk}" rx="10" class="cn-para"/>`);
      sv.push(`<text x="170" y="110" text-anchor="middle" class="cn-buyuk">${top} TL</text><text x="170" y="134" text-anchor="middle" class="cn-et">${hafta}. hafta</text>`);
      let cizgi = ""; for (let i = 1; i <= hafta && i <= 16; i++) cizgi += `<text x="${260 + ((i - 1) % 4) * 52}" y="${40 + Math.floor((i - 1) / 4) * 34}" class="cn-et2">${k}${x}${i}=${k * i}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 480 190" role="img" aria-label="Kumbara">${sv.join("")}${cizgi}</svg>`;
      s.dur.innerHTML = hafta ? `${hafta}. hafta sonunda kumbarada ${k} ${x} ${hafta} = <b>${top} TL</b> var.` : `Kumbara boş. Her hafta ${k} TL atılıyor.`;
    }
    bA.onclick = () => { hafta++; ciz(); };
    bO.onclick = () => { if (tmr) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } bO.textContent = "❚❚ Durdur"; tmr = setInterval(() => { if (hafta >= 15) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } hafta++; ciz(); }, az ? 50 : 500); };
    bS.onclick = () => { hafta = 0; ciz(); };
    bT.onclick = () => {
      const v = Math.round(+ti.value); if (!v) return; const b = Math.floor(v / k), r = v % k;
      s.dur.innerHTML = r ? `<span class="kotu">✘</span> ${k} ${x} ${b} = ${k * b} TL, ${k} ${x} ${b + 1} = ${k * (b + 1)} TL. ${v} TL arada kalır (${v} : ${k} → kalan ${r}). Kumbarada hiçbir hafta ${v} TL olmaz.`
        : `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · ${b}. hafta sonunda kumbarada tam ${v} TL olur.`;
      if (!r) { hafta = b; ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · <b>${b}. hafta</b> sonunda kumbarada tam ${v} TL olur.`; }
      s.yaz("t" + v, [v + " TL", r ? `kalan ${r} ✘` : `${k} ${x} ${b} ✔`], !r);
    };
    ciz();
  }

  /* 9) ÖNERME LABORATUVARI: önermeyi farklı sayılarla sınama */
  function ONERME(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Önerme", "Sayı", "Sonuç"] });
    let akt = 0; const kut = h("div", "cn-hazir");
    const bt = o.onermeler.map((on, i) => { const b = dug(on.ad, "ghost"); b.setAttribute("aria-pressed", i === 0); b.onclick = () => { akt = i; bt.forEach((x, j) => x.setAttribute("aria-pressed", j === i)); goster(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Sınanacak sayı: <input type="number" inputmode="numeric" min="1" max="200" value="12"></label>`;
    const bT = dug("Sına"), bR = dug("Rastgele sayı", "ghost"); test.append(bT, bR); s.den.appendChild(test); const ti = test.querySelector("input");
    function goster() { s.sah.innerHTML = `<div class="cn-onr"><b>${o.onermeler[akt].ad}:</b> “${o.onermeler[akt].metin}”</div>`; s.dur.innerHTML = "Bir sayı yazıp Sına düğmesine basın. Önerme her sayıda doğru mu?"; }
    function sina(n) {
      const on = o.onermeler[akt], r = on.sina(n);
      s.sah.innerHTML = `<div class="cn-onr"><b>${on.ad}:</b> “${on.metin}”</div><div class="cn-kanit">${r.goster}</div>`;
      s.dur.innerHTML = (r.ok ? `<span class="iyi">✔</span> ${n} için önerme doğru.` : `<span class="kotu">✘</span> ${n} için önerme yanlış! Bir karşı örnek bulundu.`) + (r.not ? " " + r.not : "");
      s.yaz(akt + ":" + n, [on.ad, n, r.ok ? "doğru" : "yanlış (karşı örnek)"], r.ok);
    }
    bT.onclick = () => { const n = Math.round(+ti.value); if (n > 0) sina(n); };
    bR.onclick = () => { const n = 2 + Math.floor(Math.random() * 59); ti.value = n; sina(n); };

  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →
     koşullar tek tek denetlenir (✔/✘) → deney defterine yazılır. Doğru cevap verilmez; öğrenci uygun girdiyi kendisi arar.
     o.girdi: [{ad, min, max, bas} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → SVG/HTML · o.kosullar: [{ad, f(v) → bool | {ok, not}}]
     o.dugme: düğme yazısı (false → her değişiklikte denetlenir) · o.sonuc(v, hepsi, L) · o.satir(v, hepsi, L) · o.iyi(v, L) · o.ek: [{ad, deger(v) → v}] */
  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);
      s.dur.innerHTML = m;
      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);
    }
    kur = true; ciz();
    if (bS) s.dur.innerHTML = o.ilk || "Değerleri seçip Sına düğmesine basın."; else sina();
  }

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

/* M.8.3.1.5 · Pisagor Bağıntısı · bağlam sorularının “Canlandır” düzenekleri (25.10.2026, ANA_KURALLAR §4.k, §19-10/11).
   Motorlar (K8, CN.k8Iskelet, CN.LAB, CN.DURUM) canlandir_8211.js ile aynıdır; ortak canlandir.js'e dokunulmaz.

(() => { const st = document.createElement("style"); st.textContent = `.gr{display:block;width:100%;max-width:460px;margin:4px auto}.gr text{font-family:"Source Sans 3",Arimo,sans-serif}

.k8-satir{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}.cn-btn{min-width:44px;min-height:44px}
.frac{display:inline-grid;grid-template-rows:auto auto;vertical-align:middle;line-height:1.05;margin:0 .12em;text-align:center;font-size:.95em}.frac>span{display:block;padding:0 .2em}.frac>span:first-child{border-bottom:.08em solid currentColor}
.soru{overflow-x:auto}.cn-dur{overflow-x:auto}`; document.head.appendChild(st); })();
/* ---------------- yardımcılar ---------------- */
const K8 = (() => {
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const Q = (p, q = 1) => { if (q < 0) { p = -p; q = -q; } const g = gcd(p, q); return { p: p / g, q: q / g }; };
  const qp = (a, e) => { if (a === 0) return e > 0 ? Q(0) : null; return e >= 0 ? Q(a ** e) : Q(1, a ** (-e)); };   // a tam sayı
  const qpQ = (x, e) => e >= 0 ? Q(x.p ** e, x.q ** e) : Q(x.q ** (-e), x.p ** (-e));                                  // kesir taban
  const qEs = (x, y) => x && y && x.p === y.p && x.q === y.q;
  const qv = x => x.p / x.q;
  const sn = n => { if (typeof n === "bigint") { const s = (n < 0n ? -n : n).toString(); return (n < 0n ? "−" : "") + (s.length > 4 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, " ") : s); }
    if (typeof n !== "number") return String(n).replace(/-/g, "−"); const s = String(Math.abs(n)); return (n < 0 ? "−" : "") + (Math.abs(n) >= 10000 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, " ") : s); };
  const fr = (p, q) => `<span class="frac"><span>${p}</span><span>${q}</span></span>`;
  const qh = x => x === null ? "tanımsız" : x.q === 1 ? sn(x.p) : (x.p < 0 ? "−" : "") + fr(sn(Math.abs(x.p)), sn(x.q));
  const tb = a => typeof a === "number" && a < 0 ? `(${sn(a)})` : String(a);
  const us = (a, e) => `${tb(a)}<sup>${sn(e)}</sup>`;
  const UST = e => String(e).replace(/[−-]/g, "⁻").split("").map(c => c === "⁻" ? c : "⁰¹²³⁴⁵⁶⁷⁸⁹"[+c]).join("");
  const usU = (a, e) => `${typeof a === "number" && a < 0 ? `(${sn(a)})` : a}${UST(e)}`;
  const ondalik = (x, b = 1) => (Math.round(x * 10 ** b) / 10 ** b).toString().replace(".", ",");
  /* SVG kesir */
  const svgFr = (x, y, p, q, fs = 15, renk = "#1d2433") => `<text x="${x}" y="${y - fs * .2}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${renk}">${p}</text><line x1="${x - fs * .5}" y1="${y}" x2="${x + fs * .5}" y2="${y}" stroke="${renk}" stroke-width="${(fs * .08).toFixed(2)}"/><text x="${x}" y="${y + fs * .95}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${renk}">${q}</text>`;
  return { gcd, Q, qp, qpQ, qEs, qv, sn, fr, qh, tb, us, UST, usU, ondalik, svgFr };
})();

/* ---------------- ortak iskelet (canlandir.js ile aynı sınıflar) ---------------- */
CN.k8Iskelet = function (el, o) {
  const h = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.innerHTML = x; return e; };
  el.innerHTML = "";
  const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
  const sah = h("div", "cn-sahne"), den = h("div", "cn-den"), dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");

  el.append(y, sah, den, dur, df);
  const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
  const yaz = (anahtar, hucre, iyi) => {
    if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
    kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
    tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
    tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;

/* ---------------- MOTOR: LAB (kuvvet laboratuvarı) ----------------
   o.girdi: [{ad, min, max, bas, adim?, yaz?} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → sahne (SVG/HTML) · o.durum(v) → sonuç metni
   o.satir(v) → deney defteri satırı (null: yazılmaz) · o.iyi(v) → yeşil/kırmızı satır · o.anahtar(v) · o.hazir: [{ad, v:[…]}] */
CN.LAB = function (el, o) {
  const s = CN.k8Iskelet(el, o), v = o.girdi.map(g => g.bas), ayar = [];
  o.girdi.forEach((g, i) => {
    const w = s.h("div", "cn-satir");
    if (g.sec) {
      w.classList.add("cn-secg"); w.appendChild(s.h("span", "cn-secad", g.ad));
      const bs = g.sec.map(x => { const b = s.dug(g.yaz ? g.yaz(x) : K8.sn(x), "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
      const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); guncelle(); };
      ayar[i] = sec;
    } else {
      const adim = g.adim || 1, ond = adim % 1 !== 0, yz = g.yaz || (x => ond ? K8.ondalik(x) : K8.sn(x));
      const a = s.h("div", "cn-adimci");
      a.innerHTML = `<span>${g.ad}</span><button type="button" aria-label="${g.ad.replace(/<[^>]+>/g, "")} azalt">−</button>${ond || g.yaz ? `<output></output>` : `<input type="number" inputmode="numeric" min="${g.min}" max="${g.max}" aria-label="${g.ad.replace(/<[^>]+>/g, "")}">`}<button type="button" aria-label="${g.ad.replace(/<[^>]+>/g, "")} artır">+</button>`;
      const [b1, b2] = a.querySelectorAll("button"), inp = a.querySelector("input"), out = a.querySelector("output");
      const kur = x => { x = Math.max(g.min, Math.min(g.max, Math.round((+x) / adim) * adim)); if (isNaN(x)) x = g.min; x = +x.toFixed(4); v[i] = x; if (inp) inp.value = x; else out.innerHTML = yz(x); };
      const ata = x => { kur(x); guncelle(); };
      b1.onclick = () => ata(v[i] - adim); b2.onclick = () => ata(v[i] + adim);
      if (inp) inp.onchange = () => ata(String(inp.value).replace(",", "."));
      kur(g.bas); ayar[i] = ata; w.appendChild(a);
    }
    s.den.appendChild(w);
  });
  if (o.hazir) { const hz = s.h("div", "cn-hazir cn-secg"); if (o.hazirEt) hz.appendChild(s.h("span", "cn-secad", o.hazirEt)); o.hazir.forEach(x => { const b = s.dug(x.ad, "ghost"); b.onclick = () => { x.v.forEach((y, i) => { if (y != null) { v[i] = y; } }); x.v.forEach((y, i) => { if (y != null) ayar[i](y); }); }; hz.appendChild(b); }); s.den.appendChild(hz); }
  let hazir = false;
  function guncelle() {
    if (!hazir) return;
    const c = v.slice(); s.sah.innerHTML = o.ciz(c, s); s.dur.innerHTML = o.durum(c, s);
    const r = o.satir ? o.satir(c, s) : null;
    if (r) s.yaz(o.anahtar ? o.anahtar(c) : c.join("|"), r, o.iyi ? o.iyi(c) : undefined);
    if (o.sonra) o.sonra(c, s);
  }
  hazir = true; guncelle();
  return { v, ayar, s };
};

/* ---------------- MOTOR: DURUM (düğmelerle adım adım değişen durum) ----------------
   o.bas(secim) → başlangıç durumu · o.dugmeler: [{ad, f(d) → {d, msg} }] · o.ciz(d) · o.durum(d) · o.bitti(d) → {anahtar, hucre, iyi, msg} | null
   o.secim: {ad, sec, bas, yaz} (başlangıcı seçtirir; değişince düzenek baştan kurulur) */
CN.DURUM = function (el, o) {
  const s = CN.k8Iskelet(el, o); let sec = o.secim ? o.secim.bas : null, d = o.bas(sec), son = "", kapali = false;
  if (o.secim) {
    const w = s.h("div", "cn-satir cn-secg"); w.appendChild(s.h("span", "cn-secad", o.secim.ad));
    const bs = o.secim.sec.map(x => { const b = s.dug(o.secim.yaz ? o.secim.yaz(x) : K8.sn(x), "ghost"); b.setAttribute("aria-pressed", x === sec); b.onclick = () => { sec = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", o.secim.sec[j] === x)); bastan(); }; w.appendChild(b); return b; });
    s.den.appendChild(w);
  }
  const w = s.h("div", "cn-satir");
  const bt = o.dugmeler.map(g => { const b = s.dug(g.ad, g.ghost ? "ghost" : ""); b.onclick = () => { if (kapali) return; const r = g.f(d); if (r.d) d = r.d; son = r.msg || ""; ciz(); }; w.appendChild(b); return b; });
  const bB = s.dug("Baştan", "ghost"); bB.onclick = () => bastan(); w.appendChild(bB); s.den.appendChild(w);
  function bastan() { d = o.bas(sec); son = ""; kapali = false; ciz(); }
  function ciz() {
    s.sah.innerHTML = o.ciz(d, sec); let m = (son ? son + "<br>" : "") + o.durum(d, sec);
    const b = o.bitti ? o.bitti(d, sec) : null;
    if (b) { kapali = !!b.kapat; s.yaz(b.anahtar, b.hucre, b.iyi); if (b.msg) m += "<br>" + b.msg; }
    bt.forEach(x => x.disabled = kapali);
    s.dur.innerHTML = m;
  }
  ciz();
};

/* ---------------- 8226 yardımcıları: dünya koordinatlı ölçekli sahne çizici ---------------- */
const D8 = (() => {
  const eq = (a, b) => Math.abs(a - b) < 1e-9;
  const fmt = x => { if (Math.abs(x - Math.round(x)) < 1e-9) return K8.sn(Math.round(x)); return (x < 0 ? "−" : "") + K8.ondalik(Math.abs(x), 2); };
  const fr = (p, q) => K8.fr(p, q);
  /* o: {x0,x1,y0,y1,W,H,esit,pl,pr,pt,pb} */
  function sahne(o) {
    const W = o.W || 440, H = o.H || 230, pl = o.pl ?? 40, pr = o.pr ?? 40, pt = o.pt ?? 22, pb = o.pb ?? 34;
    let ux = (W - pl - pr) / (o.x1 - o.x0), uy = (H - pt - pb) / (o.y1 - o.y0); if (o.esit) ux = uy = Math.min(ux, uy);
    const X = x => pl + (x - o.x0) * ux, Y = y => pt + (o.y1 - y) * uy; let s = "";
    const A = {
      X, Y, ux, uy,
      L(x1, y1, x2, y2, r = "#1d2433", k = 2, d) { s += `<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" stroke="${r}" stroke-width="${k}" stroke-linecap="round"${d ? ` stroke-dasharray="${d}"` : ""}/>`; return A; },
      P(pts, f, r, k = 2) { s += `<polygon points="${pts.map(([x, y]) => X(x) + "," + Y(y)).join(" ")}" fill="${f}" stroke="${r}" stroke-width="${k}"/>`; return A; },
      Y2(pts, r, k = 3, d) { s += `<polyline points="${pts.map(([x, y]) => X(x) + "," + Y(y)).join(" ")}" fill="none" stroke="${r}" stroke-width="${k}" stroke-linejoin="round"${d ? ` stroke-dasharray="${d}"` : ""}/>`; return A; },
      T(x, y, t, fs = 14, an = "middle", r = "#1d2433", dx = 0, dy = 0) { s += `<text x="${X(x) + dx}" y="${Y(y) + dy}" font-size="${fs}" font-weight="800" text-anchor="${an}" fill="${r}" stroke="#fff" stroke-width="3.5" paint-order="stroke">${t}</text>`; return A; },
      N(x, y, r = "#9b1c36", bos = false, rr = 5) { s += `<circle cx="${X(x)}" cy="${Y(y)}" r="${rr}" fill="${bos ? "#fff" : r}" stroke="${r}" stroke-width="2.4"/>`; return A; },
      R(x, y, w, h, f, r) { s += `<rect x="${X(x)}" y="${Y(y + h)}" width="${w * ux}" height="${h * uy}" fill="${f}" stroke="${r}" stroke-width="1.6"/>`; return A; },
      zemin(x1, x2, y = 0) { s += `<line x1="${X(x1)}" y1="${Y(y)}" x2="${X(x2)}" y2="${Y(y)}" stroke="#5c5f66" stroke-width="2.4"/>`; return A; },
      izgara(adx = 1, ady = 1, renk = "#dfe4ec") {
        for (let x = Math.ceil(o.x0 / adx) * adx; x <= o.x1 + 1e-9; x += adx) s += `<line x1="${X(x)}" y1="${Y(o.y0)}" x2="${X(x)}" y2="${Y(o.y1)}" stroke="${renk}"/>`;
        for (let y = Math.ceil(o.y0 / ady) * ady; y <= o.y1 + 1e-9; y += ady) s += `<line x1="${X(o.x0)}" y1="${Y(y)}" x2="${X(o.x1)}" y2="${Y(y)}" stroke="${renk}"/>`; return A; },
      /* grafik eksenleri: xs, ys etiketlenecek değerler */
      eksen(xad, yad, xs, ys) {
        s += `<line x1="${X(o.x0)}" y1="${Y(o.y0)}" x2="${X(o.x1) + 14}" y2="${Y(o.y0)}" stroke="#111" stroke-width="1.8"/><path d="M${X(o.x1) + 20} ${Y(o.y0)}l-9 -4.5v9z"/>`;
        s += `<line x1="${X(o.x0)}" y1="${Y(o.y0)}" x2="${X(o.x0)}" y2="${Y(o.y1) - 12}" stroke="#111" stroke-width="1.8"/><path d="M${X(o.x0)} ${Y(o.y1) - 18}l-4.5 9h9z"/>`;
        xs.forEach(x => { s += `<line x1="${X(x)}" y1="${Y(o.y0) - 3}" x2="${X(x)}" y2="${Y(o.y0) + 3}" stroke="#111"/><text x="${X(x)}" y="${Y(o.y0) + 17}" font-size="13" font-weight="700" text-anchor="middle">${fmt(x)}</text>`; });
        ys.forEach(y => { s += `<line x1="${X(o.x0) - 3}" y1="${Y(y)}" x2="${X(o.x0) + 3}" y2="${Y(y)}" stroke="#111"/><text x="${X(o.x0) - 6}" y="${Y(y) + 5}" font-size="13" font-weight="700" text-anchor="end">${fmt(y)}</text>`; });
        if (xad) s += `<text x="${X(o.x1) + 4}" y="${Y(o.y0) - 8}" font-size="13" font-weight="800" text-anchor="end">${xad}</text>`;
        if (yad) s += `<text x="${X(o.x0) + 6}" y="${Y(o.y1) - 4}" font-size="13" font-weight="800" text-anchor="start">${yad}</text>`; return A; },
      /* (x, y) noktasından geçen m eğimli doğruyu sahne kutusuna kırparak çizer (xmin'den başlatılabilir) */
      dogru(x, y, m, r = "#9b1c36", k = 3, xmin = o.x0, xmax = o.x1, d) {
        const P = []; [xmin, xmax].forEach(xx => { const yy = y + m * (xx - x); if (yy >= o.y0 - 1e-9 && yy <= o.y1 + 1e-9) P.push([xx, yy]); });
        if (m !== 0) [o.y0, o.y1].forEach(yy => { const xx = x + (yy - y) / m; if (xx >= xmin - 1e-9 && xx <= xmax + 1e-9) P.push([xx, yy]); });
        P.sort((a, b) => a[0] - b[0]); if (P.length >= 2) A.L(P[0][0], P[0][1], P[P.length - 1][0], P[P.length - 1][1], r, k, d); return A; },
      ham(t) { s += t; return A; },
      svg() { const w = X(o.x1) + pr, h = Y(o.y0) + pb; return `<svg class="gr" viewBox="0 0 ${w.toFixed(1)} ${h.toFixed(1)}" style="max-width:${Math.round(Math.min(460, w * 1.15))}px">${s}</svg>`; }
    };
    return A;
  }
  return { eq, fmt, fr, sahne };
})();


/* ---------------- 8315: karekök yazımı (kök çizgili) ---------------- */
(() => { const st = document.createElement("style"); st.textContent = `.krk{display:inline-flex;align-items:flex-start;white-space:nowrap;vertical-align:baseline}

const P8 = (() => {

  const kokH = n => { const [a, b] = sade(n); return b === 1 ? K8.sn(a) : (a === 1 ? "" : K8.sn(a)) + krk(b); };

})();

/* SORU BANKASI · M.8.3.1.5 · Pisagor Bağıntısı · 16 yeni nesil sorunun “Canlandır” düzenekleri (25.10.2026, ANA_KURALLAR §4.k, §19-10/11).

   Seçeneklerin kitaptaki sırası window.SBH (cevap harfleri) ile kurulur: her düzenekte V[0] doğru değer, V[1..3] çeldiricilerdir.
   Öğrenci bir seçenek seçer → sahne o seçeneğin değeriyle ölçekli çizilir, sorudaki veriyle karşılaştırılır ve deney defterine yazılır.

  const iyi = t => `<span class="iyi">✔</span> ${t}`, kotu = t => `<span class="kotu">✘</span> ${t}`;

  const kokla = s => s.replace(/√\{([^}]*)\}/g, (_, x) => krk(x));
  const sira = no => { const o = [1, 2, 3]; o.splice(HR.indexOf(SBH[no - 1]), 0, 0); return o; };   // kitaptaki A–D → V indeksi
  const SEC = (no, o) => el => {
    const S_ = sira(no), V = S_.map(i => o.V[i]), n = (o.ek || []).length, sec = v => v[n];
    return CN.LAB(el, {
      yon: o.yon + " Sınamak istediğiniz seçeneği seçin; sahne o seçeneğe göre çizilir ve sorudaki bilgiyle karşılaştırılır.",
      bitis: o.bitis || "Sahneyle tutan seçeneği bulduğunuzda ve en az iki yanlış seçeneğin neden tutmadığını gördüğünüzde.",
      sutun: ["Seçenek"].concat(o.ekSut || [], [o.olcAd, "Sonuç"]),
      girdi: (o.ek || []).concat([{ ad: "Seçenek:", sec: [0, 1, 2, 3], bas: 0, yaz: i => `${HR[i]}) ${V[i].h}` }]),
      ciz: v => o.ciz(V[sec(v)], v),
      durum: v => { const r = o.test(V[sec(v)], v); return `<b>${HR[sec(v)]})</b> ${kokla(r.m)}<br>` + (r.ok ? iyi("Tutuyor.") : kotu("Tutmuyor.")); },
      satir: v => { const r = o.test(V[sec(v)], v); return [HR[sec(v)]].concat(o.ekHucre ? o.ekHucre(v) : [], [kokla(r.olc), r.ok ? "tutuyor" : "tutmuyor"]); },
      anahtar: v => v.join("|"), iyi: v => o.test(V[sec(v)], v).ok
    });

  const C = {};

  /* 1 · ekran 60 × 45: seçenekteki uzunlukta bir çubuk köşeden karşı köşeye doğru uzatılır */
  C[1] = SEC(1, { V: [N_(75), N_(105), N_(15), N_(85)], yon: "Seçenekteki uzunlukta bir çubuk ekranın sol alt köşesinden sağ üst köşesine doğru uzatılır.", olcAd: "Çubuğun ucu",
    ciz: e => { const S = sahne({ x0: -5, x1: 95, y0: -5, y1: 70, H: 250, esit: true }), a = Math.atan2(45, 60), L = Math.min(e.v, 110);
      S.R(0, 0, 60, 45, "#e7f1fb", MAV).L(0, 0, L * Math.cos(a), L * Math.sin(a), TUR, 4).N(60, 45, BOR, true).T(30, 0, "60 cm", 13, "middle", "#1d2433", 0, 18).T(0, 22.5, "45 cm", 13, "end", "#1d2433", -6, 4); return S.svg(); },
    test: e => { const g = Math.hypot(60, 45); return { ok: eq(e.v, g), olc: kars(e.v, g, " cm"), m: `${e.h} cm'lik çubuk köşeden köşeye konunca karşı köşeye ${kars(e.v, g, " cm")}.` }; } });

  /* 2 · bahçe 80 × 60: kenarlardan yol 140 m; seçenekteki fark kadar kısa bir çapraz yol çizilir */
  C[2] = SEC(2, { V: [N_(40), N_(100), N_(140), N_(20)], yon: "Kenarlardan yol 80 + 60 = 140 m'dir. Çapraz yol, seçenekteki fark kadar kısa alınıp köşeden kantine doğru çizilir.", olcAd: "Çapraz yolun ucu",
    ciz: e => { const S = sahne({ x0: -5, x1: 90, y0: -5, y1: 66, H: 240, esit: true }), a = Math.atan2(60, 80), L = Math.max(0, 140 - e.v);
      S.R(0, 0, 80, 60, "#e3f4f6", CAM).Y2([[0, 0], [80, 0], [80, 60]], "#868e96", 2, "6 4").L(0, 0, L * Math.cos(a), L * Math.sin(a), TUR, 4).N(0, 0, BOR).N(80, 60, MAV, true).T(80, 60, "kantin", 12, "end", MAV, -8, -6); return S.svg(); },
    test: e => { const L = 140 - e.v, g = 100; return { ok: eq(L, g), olc: fmt(L) + " m", m: `Fark ${e.h} m ise çapraz yol 140 − ${e.h} = ${fmt(L)} m olur; bu yol karşı köşeye ${kars(L, g, " m")}.` }; } });

  /* 3 · çadır: taban 3,2 m, eğik bez 2 m */
  C[3] = SEC(3, { V: [N_(1.2), N_(0.4), N_(1.6), N_(2.4)], yon: "Orta direk seçenekteki boyda dikilir; tepeden taban köşesine eğik bez gerilir.", olcAd: "Gereken bez",
    ciz: e => { const h = e.v, S = sahne({ x0: -2, x1: 2, y0: -.2, y1: 2.7, H: 230, esit: true });
      S.zemin(-2, 2).P([[-1.6, 0], [1.6, 0], [0, h]], "#fff0e6", TUR, 2.6).L(0, 0, 0, h, KUM, 3).T(0.8, 0, "1,6 m", 12, "middle", "#1d2433", 0, 16).T(0, h / 2, fmt(h) + " m", 12, "start", KUM, 6, 4); return S.svg(); },
    test: e => { const b = Math.hypot(1.6, e.v); return { ok: eq(b, 2), olc: fmt(r2(b)) + " m", m: `Direk ${e.h} m olursa eğik bez √{1,6² + ${e.h}²} ≈ <b>${fmt(r2(b))} m</b> olmalıdır; bez 2 m'dir.` }; } });

  /* 4 · yelken: 4,8 m ve 2 m */
  C[4] = SEC(4, { V: [N_(5.2), N_(6.8), N_(2.8), N_(4.4)], yon: "Seçenekteki uzunlukta şerit, yelkenin eğik kenarı boyunca bomun ucundan direğin tepesine doğru serilir.", olcAd: "Şeridin ucu",
    ciz: e => { const S = sahne({ x0: -.6, x1: 3.2, y0: -.3, y1: 7.2, H: 260, esit: true }), a = Math.atan2(4.8, -2), L = Math.min(e.v, 7);
      S.P([[0, 0], [2, 0], [0, 4.8]], "#f1edfd", MOR, 2.2).L(2, 0, 2 + L * Math.cos(a), L * Math.sin(a), TUR, 4).N(0, 4.8, BOR, true); return S.svg(); },
    test: e => { const g = Math.hypot(4.8, 2); return { ok: eq(e.v, g), olc: kars(e.v, g, " m"), m: `${e.h} m'lik şerit eğik kenar boyunca direğin tepesine ${kars(e.v, g, " m")}.` }; } });

  /* 5 · bilardo: (1, 3) → (4, 0) → (9, 5), kare 10 cm */
  C[5] = SEC(5, { V: [Rt(80, 2), N_(160), Rt(40, 2), N_(80)], yon: "Seçenekteki uzunlukta bir ip, topun yolu boyunca toptan cebe doğru serilir.", olcAd: "İpin ucu",
    ciz: e => { const S = sahne({ x0: 0, x1: 100, y0: 0, y1: 60, W: 420, H: 270, esit: true, pl: 12, pr: 12, pt: 12, pb: 12 }).izgara(10, 10);
      const P = [[10, 30], [40, 0], [90, 50]], d1 = Math.hypot(30, 30), L = e.v; let pts = [[10, 30]];
      if (L <= d1) pts.push([10 + 30 * L / d1, 30 - 30 * L / d1]); else { pts.push([40, 0]); const k = Math.min(L - d1, 80 * Math.SQRT2) / Math.hypot(50, 50); pts.push([40 + 50 * k, 50 * k]); }
      S.Y2(P, "#adb5bd", 2, "5 4").Y2(pts, TUR, 4).N(10, 30, "#1d2433").N(90, 50, MAV, true); return S.svg(); },
    test: e => { const g = 80 * Math.SQRT2, ek = e.v > g + 1e-9 ? " (fazlası masanın dışına taşar)" : ""; return { ok: eq(e.v, g), olc: kars(e.v, g, " cm"), m: `${e.h} cm'lik ip topun yolu boyunca serilince cebe ${kars(e.v, g, " cm")}${ek}. Yolun parçaları 3 sağ 3 aşağı ve 5 sağ 5 yukarı karedir.` }; } });

  /* 6 · çift kanatlı kapı: kanat 1 m, uçlar arası 0,8 m */
  C[6] = SEC(6, { V: [N_(80), N_(60), N_(40), N_(120)], yon: "Kanatlar, uçları kapı hizasından seçenekteki kadar içeride olacak biçimde açılır (üstten görünüm).", olcAd: "Uçlar arası yatay uzaklık",
    ciz: e => { const d = e.v / 100, S = sahne({ x0: -.2, x1: 2.2, y0: -1.25, y1: .25, H: 200, esit: true });
      S.L(-.2, 0, 0, 0, "#5c5f66", 5).L(2, 0, 2.2, 0, "#5c5f66", 5).L(0, 0, 2, 0, "#ced4da", 1.4, "5 4");
      if (d <= 1) { const x = Math.sqrt(1 - d * d); S.L(0, 0, x, -d, CAM, 5).L(2, 0, 2 - x, -d, CAM, 5).N(x, -d, BOR).N(2 - x, -d, BOR); } return S.svg(); },
    test: e => { const d = e.v / 100; if (d > 1) return { ok: false, olc: "—", m: `1 m'lik kanadın ucu kapı hizasından ${e.h} cm içeri gidemez.` };
      const x = Math.sqrt(1 - d * d), u = 2 - 2 * x; return { ok: eq(r2(u), 0.8), olc: fmt(r2(u)) + " m", m: `Uç ${e.h} cm içerideyse her kanadın ucu menteşeden yatayda √{1 − ${fmt(d)}²} ≈ ${fmt(r2(x))} m uzakta olur; uçlar arası ≈ <b>${fmt(r2(u))} m</b>. Soruda 0,8 m'dir.` }; } });

  /* 7 · sarkaç: ip 1,7 m, yatay kayma 0,8 m */
  C[7] = SEC(7, { V: [N_(20), N_(80), N_(150), N_(90)], yon: "Top, ilk konumundan seçenekteki kadar yukarı kaldırılır; ip gergin tutulur.", olcAd: "Topun yatay kayması",
    ciz: e => { const r = e.v / 100, S = sahne({ x0: -1.9, x1: 1.9, y0: -1.9, y1: .15, H: 240, esit: true }); S.L(-1.9, 0, 1.9, 0, "#5c5f66", 4).L(0, 0, 0, -1.7, "#ced4da", 1.4, "5 4").N(0, -1.7, "#adb5bd");
      const y = -(1.7 - r); if (Math.abs(y) <= 1.7) { const x = Math.sqrt(1.7 * 1.7 - y * y); S.L(0, 0, x, y, "#1d2433", 2).N(x, y, TUR, false, 7); } return S.svg(); },
    test: e => { const r = e.v / 100, y = 1.7 - r; if (y < -1.7 || r > 3.4) return { ok: false, olc: "—", m: "Top bu kadar yükselemez." };
      const x = Math.sqrt(Math.max(0, 1.7 * 1.7 - y * y)); return { ok: eq(r2(x), 0.8), olc: fmt(r2(x)) + " m", m: `Top ${e.h} cm yükselirse tavanın ${fmt(r2(y))} m altında olur; yatay kayma √{1,7² − ${fmt(r2(y))}²} ≈ <b>${fmt(r2(x))} m</b>. Soruda 0,8 m'dir.` }; } });

  /* 8 · kule: yola uzaklık 3 km, çekim 5 km */
  C[8] = SEC(8, { V: [N_(8), N_(4), N_(10), N_(6)], yon: "Yolda H'nin iki yanına eşit paylaşılan, seçenekteki uzunlukta bir çekim bölümü işaretlenir.", olcAd: "Bölüm ucunun kuleye uzaklığı",
    ciz: e => { const h = e.v / 2, S = sahne({ x0: -6, x1: 6, y0: -.6, y1: 3.6, H: 190, esit: true });
      S.L(-6, 0, 6, 0, "#5c5f66", 3).L(-h, 0, h, 0, YES, 6).L(0, 0, 0, 3, "#adb5bd", 1.4, "5 4").L(0, 3, h, 0, TUR, 2).L(0, 3, -h, 0, TUR, 2).N(0, 3, BOR, false, 6).T(0, 0, "H", 12, "middle", "#1d2433", 0, 16); return S.svg(); },
    test: e => { const d = Math.hypot(3, e.v / 2); return { ok: eq(d, 5), olc: fmt(r2(d)) + " km", m: `Bölüm ${e.h} km ise uçları H'den ${fmt(e.v / 2)} km uzaktadır; kuleye uzaklık √{9 + ${fmt(e.v / 2)}²} ≈ <b>${fmt(r2(d))} km</b>. Çekim en çok 5 km'dir; bölümün ucu tam 5 km'de olmalıdır.` }; } });

  /* 9 · origami: 12 cm'lik kareden üç kez orta noktalar */
  C[9] = SEC(9, { V: [Rt(3, 2), N_(6), N_(3), Rt(6, 2)], yon: "Kâğıda 1. kareden başlayarak orta nokta kareleri çizilir; seçenekteki uzunlukta bir çubuk 4. karenin bir kenarına konur.", olcAd: "Çubuk ve kenar",
    ciz: e => { const S = sahne({ x0: -1, x1: 13, y0: -1, y1: 13, W: 300, H: 300, esit: true, pl: 8, pr: 8, pt: 8, pb: 8 });
      S.P([[0, 0], [12, 0], [12, 12], [0, 12]], "#fff0e6", TUR).P([[6, 0], [12, 6], [6, 12], [0, 6]], "#e7f1fb", MAV).P([[3, 3], [9, 3], [9, 9], [3, 9]], "#e3f4f6", CAM).P([[6, 3], [9, 6], [6, 9], [3, 6]], "#f1edfd", MOR);
      const L = Math.min(e.v, 13), u = Math.SQRT1_2; S.L(6, 3, 6 + L * u, 3 + L * u, BOR, 4); return S.svg(); },
    test: e => { const g = 3 * Math.SQRT2; return { ok: eq(e.v, g), olc: kars(e.v, g, " cm"), m: `${e.h} cm'lik çubuk 4. karenin kenarına konunca kenarın öbür ucuna ${kars(e.v, g, " cm")}. Her yeni karenin kenarı, öncekinin yarı kenarlarıyla kurulan dik üçgenin hipotenüsüdür.` }; } });

  /* 10 · kaykay pisti: (1,2 ; 0,9) ve (0,8 ; 0,6) */
  C[10] = SEC(10, { V: [N_(2.5), N_(3.5), N_(1.5), N_(3)], yon: "Seçenekteki uzunlukta kaydırmaz bant, birinci eğik bölümün altından başlayarak iki eğik bölüm boyunca serilir.", olcAd: "Bandın ucu",
    ciz: e => { const S = sahne({ x0: -.2, x1: 3.4, y0: -.1, y1: 1.2, H: 170, esit: true }); const P = [[0, 0], [1.2, .9], [2, .9], [2.8, .3], [3.3, .3]];
      S.P([[0, 0], [1.2, .9], [2, .9], [2.8, .3], [3.3, .3], [3.3, 0]], "#fff0e6", TUR, 1.6);
      let L = e.v, pts = [[0, 0]]; const segs = [[[0, 0], [1.2, .9]], [[2, .9], [2.8, .3]]];
      for (const [a, b] of segs) { const d = Math.hypot(b[0] - a[0], b[1] - a[1]), k = Math.min(1, L / d); if (L <= 0) break; S.L(a[0], a[1], a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, BOR, 5); L -= d; }
      return S.svg(); },
    test: e => ({ ok: eq(e.v, 2.5), olc: kars(e.v, 2.5, " m"), m: `${e.h} m'lik bant iki eğik bölüme serilince bölümlerin sonuna ${kars(e.v, 2.5, " m")}. Eğik bölümler dik kenarları 1,2 ve 0,9 m ile 0,8 ve 0,6 m olan dik üçgenlerin hipotenüsleridir.` }) });

  /* 11 · şerit katlama: genişlik 8, Q üst kenarda soldan 4 cm */
  C[11] = SEC(11, { V: [N_(10), N_(5), Rt(4, 5), Rt(5, 5)], yon: "P noktası alt kenarda A'dan seçenekteki kadar uzağa konur; A köşesi, |PA| = |PQ| olacak biçimde üst kenara katlanır.", olcAd: "A'nın üst kenarda geldiği yer",
    ciz: e => { const p = e.v, S = sahne({ x0: -1, x1: 15, y0: -1, y1: 9.5, H: 230, esit: true }); S.R(0, 0, 14, 8, "#ffffff", "#1d2433").N(4, 8, MAV, true);
      if (p >= 8) { const q = p - Math.sqrt(p * p - 64); S.P([[p, 0], [q, 8], [0, 0]], "#e7f1fb", MAV, 1.6).L(p, 0, q, 8, MAV, 2.4).N(q, 8, TUR).N(p, 0, BOR).T(p, 0, "P", 12, "middle", BOR, 0, 16); } return S.svg(); },
    test: e => { const p = e.v; if (p < 8) return { ok: false, olc: "—", m: `|AP| = ${e.h} cm olursa |PQ| = ${e.h} cm, şeridin 8 cm'lik genişliğinden kısadır; A üst kenara ulaşamaz.` };
      const q = p - Math.sqrt(p * p - 64); return { ok: eq(r2(q), 4), olc: "soldan " + fmt(r2(q)) + " cm", m: `|AP| = ${e.h} cm ise A, üst kenarda P'nin hizasından √{|AP|² − 8²} ≈ ${fmt(r2(p - q))} cm geride, sol üst köşeden ≈ <b>${fmt(r2(q))} cm</b> uzağa gelir. Soruda 4 cm'dir.` }; } });

  /* 12 · bisikletliler: 60 ve 80 m/dk, 500 m */
  C[12] = SEC(12, { V: [N_(5), N_(4), N_(7), N_(3)], yon: "İki bisikletli seçenekteki süre kadar yol alır; aralarındaki uzaklık ölçülür.", olcAd: "Aradaki uzaklık",
    ciz: e => { const t = e.v, S = sahne({ x0: -40, x1: 620, y0: -40, y1: 460, H: 250, esit: true }); S.L(0, 0, 600, 0, "#ced4da", 6).L(0, 0, 0, 450, "#ced4da", 6)
      .L(0, 60 * t, 80 * t, 0, Math.hypot(60 * t, 80 * t) > 500 ? BOR : YES, 2, "6 4").N(0, 60 * t, CAM, false, 6).N(80 * t, 0, TUR, false, 6).N(0, 0, "#1d2433"); return S.svg(); },
    test: e => { const d = Math.hypot(60 * e.v, 80 * e.v); return { ok: eq(d, 500), olc: fmt(r1(d)) + " m", m: `${e.h} dakikada Melis ${fmt(60 * e.v)} m, Kerem ${fmt(80 * e.v)} m gider; aradaki uzaklık √{${fmt(60 * e.v)}² + ${fmt(80 * e.v)}²} = <b>${fmt(r1(d))} m</b>. Telsizler 500 m'de çekmez olur.` }; } });

  /* 13 · çerçeve 60 × 25, kayma 15 */
  C[13] = SEC(13, { V: [N_(300), N_(375), N_(900), N_(450)], yon: "Çerçevenin alanı seçenekteki kadar azaltılır; bu alan için gereken yükseklik ve üst kenarın kayması bulunur.", olcAd: "Üst kenarın kayması",
    ciz: e => { const h = (1500 - e.v) / 60, S = sahne({ x0: -3, x1: 90, y0: -3, y1: 28, H: 200, esit: true }); S.R(0, 0, 60, 25, "none", "#adb5bd");
      if (h > 0 && h <= 25) { const k = Math.sqrt(625 - h * h); S.P([[0, 0], [60, 0], [60 + k, h], [k, h]], "#f6ead2", KUM, 2.6); } return S.svg(); },
    test: e => { const h = (1500 - e.v) / 60; if (h <= 0 || h > 25) return { ok: false, olc: "—", m: "Bu alan çerçeveyle elde edilemez." };
      const k = Math.sqrt(625 - h * h); return { ok: eq(r2(k), 15), olc: fmt(r2(k)) + " cm", m: `Alan ${e.h} cm² azalırsa yükseklik [1500 − ${e.h}] : 60 = ${fmt(r2(h))} cm olur; 25 cm'lik yan çubukla kayma √{25² − ${fmt(r2(h))}²} ≈ <b>${fmt(r2(k))} cm</b>. Soruda 15 cm'dir.`.replace("[", "(").replace("]", ")") }; } });

  /* 14 · karton 40 × 30, köşelerden 8 ve 6 */
  C[14] = SEC(14, { V: [N_(124), N_(140), N_(156), N_(104)], yon: "Seçenekteki çevre doğru kabul edilir; kalan düz kenarlar çıkarılınca dört eğik kenara düşen uzunluk bulunur.", olcAd: "Bir eğik kenar",
    ciz: e => { const W = 40, H = 30, S = sahne({ x0: -3, x1: 43, y0: -3, y1: 33, H: 220, esit: true }); S.R(0, 0, W, H, "none", "#adb5bd")
      .P([[8, 0], [32, 0], [40, 6], [40, 24], [32, 30], [8, 30], [0, 24], [0, 6]], "#f1edfd", MOR, 2.4); return S.svg(); },
    test: e => { const k = (e.v - (140 - 56)) / 4; return { ok: eq(k * k, 100), olc: fmt(r2(k)) + " cm", m: `Düz kenarlar 140 − 4 · 14 = 84 cm'dir. Çevre ${e.h} cm ise her eğik kenar [${e.h} − 84] : 4 = <b>${fmt(r2(k))} cm</b> olur; dik kenarları 8 ve 6 cm olan dik üçgende eğik kenarın karesi 100 olmalıdır, ${fmt(r2(k))}² = ${fmt(r2(k * k))}.`.replace("[", "(").replace("]", ")") }; } });

  /* 15 · Pisagor ağacı: 1. adım kenar 8 */
  C[15] = SEC(15, { V: [Rt(2, 2), N_(1), N_(4), N_(2)], yon: "4. adımdaki kare seçenekteki kenarla alınır; adımlar geriye doğru izlenerek 1. adımdaki karenin kenarı bulunur.", olcAd: "1. adımdaki kenar",
    ciz: e => { const S = sahne({ x0: -1, x1: 9, y0: -1, y1: 9, W: 260, H: 260, esit: true, pl: 8, pr: 8, pt: 8, pb: 8 }), s = Math.min(Math.sqrt(8) * e.v, 9);
      S.R(0, 0, 8, 8, "none", "#adb5bd").R(0, 0, s, s, "#e3f4f6", CAM).R(0, 0, e.v, e.v, "#fff0e6", TUR); return S.svg(); },
    test: e => { const a = e.v * e.v, a1 = a * 8, s1 = Math.sqrt(a1); return { ok: eq(r2(s1), 8), olc: fmt(r2(s1)) + " cm", m: `4. adımdaki karenin alanı ${fmt(r2(a))} cm² ise her geri adımda alan iki katına çıkar: 1. adımda ${fmt(r2(a1))} cm², kenar ≈ <b>${fmt(r2(s1))} cm</b>. Soruda 8 cm'dir.` }; } });

  /* 16 · koliler: 20 × 30 ve 40 × 10 */
  C[16] = SEC(16, { V: [top(120, 20, 5), N_(180), top(140, 20, 5), N_(160)], yon: "Bant seçenekteki uzunlukta alınır; düz parçalar (60 + 10 + 20 + 30 = 120 cm) çıkarılınca eğik parçaya kalan uzunluk bulunur.", olcAd: "Eğik parçaya kalan",
    ciz: e => { const S = sahne({ x0: -4, x1: 64, y0: -4, y1: 34, H: 210, esit: true }); S.R(0, 0, 20, 30, "#f6ead2", KUM).R(20, 0, 40, 10, "#fff0e6", TUR)
      .Y2([[20, 30], [0, 30], [0, 0], [60, 0], [60, 10]], BOR, 3, "6 4"); const k = e.v - 120, g = Math.hypot(40, 20), f = Math.min(1, k / g);
      if (k > 0) S.L(60, 10, 60 - 40 * f, 10 + 20 * f, YES, 4); return S.svg(); },
    test: e => { const k = e.v - 120, g = Math.hypot(40, 20); return { ok: eq(k, g), olc: fmt(r2(k)) + " cm", m: `Eğik parçaya ${fmt(r2(k))} cm kalır; bu parça yüksek kolinin köşesine ${kars(k, g, " cm")}. Eğik parça yatayda 40 cm, dikeyde 20 cm ilerler.` }; } });

  return C;
})();

</script>
<script>
const V={"baslik": "Pisagor Bağıntısı · Soru Bankası", "kod": "LGS · M.8.3.1.5 · SORU BANKASI", "ses": "", "bet": "YENİ NESİL SORU", "bad": "Yeni Nesil Sorular", "s": [], "k": [], "b": [{"no": 1, "on": "<p>Bir bilgisayar ekranının boyutu, ekranın karşılıklı iki köşesi arasındaki uzaklıkla belirtilir. Ayşe'nin aldığı ekran dikdörtgen biçimindedir.</p>", "g": "<div style=\"display:flex;justify-content:center\"><div style=\"border:.45mm solid #1c6fb8;border-radius:3mm;background:#fff;padding:2mm 3.2mm;font-size:10.6pt;text-align:left\"><div style=\"font-weight:800;color:#1c6fb8;margin-bottom:.8mm\">Ekran Ölçüleri</div><div style=\"margin:.4mm 0\">Ekranın eni: 60 cm</div><div style=\"margin:.4mm 0\">Ekranın boyu: 45 cm</div></div></div>", "son": "", "k": "Buna göre, Ayşe'nin ekranının karşılıklı iki köşesi arasındaki uzaklık kaç santimetredir?", "sec": ["105", "15", "75", "85"], "secg": null, "c": "C", "a": ["Köşegen ekranı iki eş dik üçgene ayırır; köşegen hipotenüstür.", "60<sup>2</sup> + 45<sup>2</sup> = 3 600 + 2 025 = 5 625.", "<span class=\"krk\"><span>5</span></span> 625 = 75 cm."], "t": "105: en ve boy toplanmış; 15: en ve boy çıkarılmış; 85: tahmin", "d": "Ekranın boyutu köşegendir; en ile boy toplanmaz, köşegen dik kenarları en ve boy olan dik üçgenin hipotenüsüdür.", "ses": "b01"}, {"no": 2, "on": "<p>Dikdörtgen biçimindeki okul bahçesinin bir köşesinde bulunan Can, karşı köşedeki kantine gidecektir. Can ya bahçenin kenarları boyunca yürüyecek ya da bahçeyi çapraz olarak düz bir çizgide geçecektir.</p>", "g": "<div style=\"display:flex;justify-content:center\"><div style=\"border:.45mm solid #0b7285;border-radius:3mm;background:#fff;padding:2mm 3.2mm;font-size:10.6pt;text-align:left\"><div style=\"font-weight:800;color:#0b7285;margin-bottom:.8mm\">Okul Bahçesi</div><div style=\"margin:.4mm 0\">Bahçenin uzun kenarı: 80 m</div><div style=\"margin:.4mm 0\">Bahçenin kısa kenarı: 60 m</div></div></div>", "son": "", "k": "Buna göre, Can çapraz yürürse kenarlardan yürümesine göre kaç metre daha az yol yürür?", "sec": ["40", "100", "140", "20"], "secg": null, "c": "A", "a": ["Kenarlardan yol 80 + 60 = 140 m.", "Çapraz yol köşegendir: 6 400 + 3 600 = 10 000, 100 m.", "Fark 140 − 100 = 40 m."], "t": "100: çapraz yol; 140: kenarlardan yol; 20: 80 − 60", "d": "Soru iki yol arasındaki farkı soruyor: önce çapraz yolu bulun, sonra kenarlardan yoldan çıkarın.", "ses": "b02"}, {"no": 3, "on": "<p>Bir kamp çadırının ön yüzü, eş kenarları çadırın eğik bezleri olan ikizkenar üçgen biçimindedir. Çadırın orta direği, tepeden yere dik olarak inmekte ve tabanı iki eş parçaya ayırmaktadır.</p>", "g": "<div style=\"display:flex;justify-content:center\"><div style=\"border:.45mm solid #d9480f;border-radius:3mm;background:#fff;padding:2mm 3.2mm;font-size:10.6pt;text-align:left\"><div style=\"font-weight:800;color:#d9480f;margin-bottom:.8mm\">Çadır Ölçüleri</div><div style=\"margin:.4mm 0\">Çadırın taban genişliği: 3,2 m</div><div style=\"margin:.4mm 0\">Bir eğik bezin uzunluğu: 2 m</div></div></div>", "son": "", "k": "Buna göre, çadırın orta direği kaç metredir?", "sec": ["0,4", "1,6", "2,4", "1,2"], "secg": null, "c": "D", "a": ["Direk tabanı 1,6 m'lik iki eş parçaya ayırır.", "Direk, hipotenüsü 2 m ve bir dik kenarı 1,6 m olan dik üçgenin öbür dik kenarıdır.", "4 − 2,56 = 1,44; direk 1,2 m."], "t": "0,4: 2 − 1,6; 1,6: yarım taban; 2,4: 3,2 − 0,8 tahmini", "d": "Orta direk tabanı iki eş parçaya ayırır; dik üçgenin yatay kenarı 3,2 m değil 1,6 m'dir.", "ses": "b03"}, {"no": 4, "on": "<p>Bir yelkenli teknenin yelkeni dik üçgen biçimindedir. Yelkenin bir dik kenarı direk boyunca, öbür dik kenarı yatay bom boyunca uzanmaktadır. Yelkenin eğik kenarına koruyucu şerit dikilecektir.</p>", "g": "<div style=\"display:flex;justify-content:center\"><div style=\"border:.45mm solid #6741d9;border-radius:3mm;background:#fff;padding:2mm 3.2mm;font-size:10.6pt;text-align:left\"><div style=\"font-weight:800;color:#6741d9;margin-bottom:.8mm\">Yelken Ölçüleri</div><div style=\"margin:.4mm 0\">Direk boyunca kenar: 4,8 m</div><div style=\"margin:.4mm 0\">Bom boyunca kenar: 2 m</div></div></div>", "son": "", "k": "Buna göre, kaç metre şerit dikilecektir?", "sec": ["6,8", "5,2", "2,8", "4,4"], "secg": null, "c": "B", "a": ["Eğik kenar hipotenüstür.", "4,8<sup>2</sup> + 2<sup>2</sup> = 23,04 + 4 = 27,04.", "<span class=\"krk\"><span>27,04</span></span> = 5,2 m (5,2 · 5,2 = 27,04)."], "t": "6,8: dik kenarlar toplanmış; 2,8: dik kenarlar çıkarılmış; 4,4: kareler çıkarılıp yanlış kök alınmış", "d": "Ondalık sayıların karesini dikkatle alın: 4,8<sup>2</sup> = 23,04. Toplamın karekökünü almayı unutmayın.", "ses": "b04"}, {"no": 5, "on": "<p>Bir bilardo masasının üstten görünümü kareli zemine çizilmiştir. Her karenin kenarı gerçekte 10 cm'dir. Top, masanın alt kenarına bir kez çarpıp şekildeki gibi düz yollarla cebe gitmiştir.</p>", "g": "<svg viewBox=\"0 0 276 172\" width=\"276\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"Liberation Sans, Arial, sans-serif\"><g transform=\"translate(8.0 164.0)\"><line x1=\"0.0\" y1=\"-0.0\" x2=\"0.0\" y2=\"-156.0\" stroke=\"#cfd6e2\" stroke-width=\"0.9\"/><line x1=\"26.0\" y1=\"-0.0\" x2=\"26.0\" y2=\"-156.0\" stroke=\"#cfd6e2\" stroke-width=\"0.9\"/><line x1=\"52.0\" y1=\"-0.0\" x2=\"52.0\" y2=\"-156.0\" stroke=\"#cfd6e2\" stroke-width=\"0.9\"/><line x1=\"78.0\" y1=\"-0.0\" x2=\"78.0\" y2=\"-156.0\" stroke=\"#cfd6e2\" stroke-width=\"0.9\"/><line x1=\"104.0\" y1=\"-0.0\" x2=\"104.0\" y2=\"-156.0\" stroke=\"#cfd6e2\" stroke-width=\"0.9\"/><line x1=\"130.0\" y1=\"-0.0\" x2=\"130.0\" y2=\"-156.0\" stroke=\"#cfd6e2\" stroke-width=\"0.9\"/><line x1=\"156.0\" y1=\"-0.0\" x2=\"156.0\" y2=\"-156.0\" stroke=\"#cfd6e2\" stroke-width=\"0.9\"/><line x1=\"182.0\" y1=\"-0.0\" x2=\"182.0\" y2=\"-156.0\" stroke=\"#cfd6e2\" stroke-width=\"0.9\"/><line x1=\"208.0\" y1=\"-0.0\" x2=\"208.0\" y2=\"-156.0\" stroke=\"#cfd6e2\" stroke-width=\"0.9\"/><line x1=\"234.0\" y1=\"-0.0\" x2=\"234.0\" y2=\"-156.0\" stroke=\"#cfd6e2\" stroke-width=\"0.9\"/><line x1=\"260.0\" y1=\"-0.0\" x2=\"260.0\" y2=\"-156.0\" stroke=\"#cfd6e2\" stroke-width=\"0.9\"/><line x1=\"0.0\" y1=\"-0.0\" x2=\"260.0\" y2=\"-0.0\" stroke=\"#cfd6e2\" stroke-width=\"0.9\"/><line x1=\"0.0\" y1=\"-26.0\" x2=\"260.0\" y2=\"-26.0\" stroke=\"#cfd6e2\" stroke-width=\"0.9\"/><line x1=\"0.0\" y1=\"-52.0\" x2=\"260.0\" y2=\"-52.0\" stroke=\"#cfd6e2\" stroke-width=\"0.9\"/><line x1=\"0.0\" y1=\"-78.0\" x2=\"260.0\" y2=\"-78.0\" stroke=\"#cfd6e2\" stroke-width=\"0.9\"/><line x1=\"0.0\" y1=\"-104.0\" x2=\"260.0\" y2=\"-104.0\" stroke=\"#cfd6e2\" stroke-width=\"0.9\"/><line x1=\"0.0\" y1=\"-130.0\" x2=\"260.0\" y2=\"-130.0\" stroke=\"#cfd6e2\" stroke-width=\"0.9\"/><line x1=\"0.0\" y1=\"-156.0\" x2=\"260.0\" y2=\"-156.0\" stroke=\"#cfd6e2\" stroke-width=\"0.9\"/><line x1=\"26.0\" y1=\"-78.0\" x2=\"104.0\" y2=\"-0.0\" stroke=\"#9b1c36\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><line x1=\"104.0\" y1=\"-0.0\" x2=\"234.0\" y2=\"-130.0\" stroke=\"#9b1c36\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><circle cx=\"26.0\" cy=\"-78.0\" r=\"3.4\" fill=\"#111111\" stroke=\"#111111\" stroke-width=\"0\"/><circle cx=\"234.0\" cy=\"-130.0\" r=\"3.4\" fill=\"#fff\" stroke=\"#1c6fb8\" stroke-width=\"1.6\"/><circle cx=\"104.0\" cy=\"-0.0\" r=\"2.6\" fill=\"#9b1c36\" stroke=\"#9b1c36\" stroke-width=\"0\"/><text x=\"13.7\" y=\"-85.7\" font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.4\" stroke-linejoin=\"round\" paint-order=\"stroke\">Top</text><text x=\"246.8\" y=\"-138.1\" font-size=\"13\" font-weight=\"800\" fill=\"#1c6fb8\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.4\" stroke-linejoin=\"round\" paint-order=\"stroke\">Cep</text></g></svg>", "son": "", "k": "Buna göre, topun aldığı yol kaç santimetredir?", "sec": ["160", "80<span class=\"krk\"><span>2</span></span>", "40<span class=\"krk\"><span>2</span></span>", "80"], "secg": null, "c": "B", "a": ["Birinci parça 3 kare sağa, 3 kare aşağı: 9 + 9 = 18, 3<span class=\"krk\"><span>2</span></span> birim.", "İkinci parça 5 kare sağa, 5 kare yukarı: 25 + 25 = 50, 5<span class=\"krk\"><span>2</span></span> birim.", "Toplam 8<span class=\"krk\"><span>2</span></span> birim; 1 birim 10 cm: 80<span class=\"krk\"><span>2</span></span> cm."], "t": "160: kare sayıları toplanmış, 16 · 10; 40<span class=\"krk\"><span>2</span></span>: birim 5 cm alınmış; 80: <span class=\"krk\"><span>2</span></span> unutulmuş", "d": "Yolu iki düz parçaya ayırın; her parçanın yatay ve dikey kare sayısını ayrı sayın, sonra birim uzunlukla çarpın.", "ses": "b05"}, {"no": 6, "on": "<p>Bir mağazanın çift kanatlı cam kapısının iki eş kanadı kapı boşluğunun iki yanındaki menteşelere bağlıdır. Kapı kapalıyken kanatların uçları boşluğun ortasında birleşir. Kanatlar içeri doğru eşit miktarda açıldığında uçları arasındaki yatay uzaklık 0,8 m olmuştur.</p>", "g": "<div style=\"display:flex;justify-content:center\"><div style=\"border:.45mm solid #0b7285;border-radius:3mm;background:#fff;padding:2mm 3.2mm;font-size:10.6pt;text-align:left\"><div style=\"font-weight:800;color:#0b7285;margin-bottom:.8mm\">Kapı Ölçüleri</div><div style=\"margin:.4mm 0\">Kapı boşluğunun genişliği: 2 m</div><div style=\"margin:.4mm 0\">Kanatların uçları arası (yatay): 0,8 m</div></div></div>", "son": "<p>Kanatlar açılırken uçları kapı hizasından içeri doğru ilerler.</p>", "k": "Buna göre, açık kanatların uçları kapı hizasından kaç santimetre içeridedir?", "sec": ["60", "40", "120", "80"], "secg": null, "c": "D", "a": ["Her kanat 1 m'dir.", "Bir kanadın ucunun menteşeye yatay uzaklığı (2 − 0,8) : 2 = 0,6 m.", "Kanat hipotenüs: içeri uzaklık<sup>2</sup> = 1 − 0,36 = 0,64, 0,8 <span class=\"txz\">m = 80</span> cm."], "t": "60: yatay uzaklık; 40: uçlar arasının yarısı; 120: 2 − 0,8", "d": "Her kanat kapı boşluğunun yarısı kadardır (1 m); menteşeye yatay uzaklık (2 − 0,8) : 2 = 0,6 m'dir.", "ses": "b06"}, {"no": 7, "on": "<p>Bir fen deneyinde tavana bağlı gergin bir ipin ucuna küçük bir top asılmıştır. İp dikey durumdan çekilerek top, ilk konumuna göre yatayda 0,8 m uzaklaştırılmıştır; ip gergin kalmıştır.</p>", "g": "<div style=\"display:flex;justify-content:center\"><div style=\"border:.45mm solid #8a5a00;border-radius:3mm;background:#fff;padding:2mm 3.2mm;font-size:10.6pt;text-align:left\"><div style=\"font-weight:800;color:#8a5a00;margin-bottom:.8mm\">Sarkaç Deneyi</div><div style=\"margin:.4mm 0\">İpin uzunluğu: 1,7 m</div><div style=\"margin:.4mm 0\">Topun yatay yer değiştirmesi: 0,8 m</div></div></div>", "son": "", "k": "Buna göre, top ilk konumuna göre kaç santimetre yükselmiştir?", "sec": ["20", "80", "150", "90"], "secg": null, "c": "A", "a": ["İp hipotenüs, yatay yer değiştirme bir dik kenardır.", "Dikey kenar: 2,89 − 0,64 = 2,25, 1,5 m; top tavanın 1,5 m altındadır.", "İlk konumda 1,7 m altındaydı: yükselme 1,7 − 1,5 = 0,2 <span class=\"txz\">m = 20</span> cm."], "t": "80: yatay yer değiştirme; 150: tavana dikey uzaklık; 90: 1,7 − 0,8", "d": "Önce topun tavana dikey uzaklığını bulun; yükselme ip boyu ile bu uzaklığın farkıdır.", "ses": "b07"}, {"no": 8, "on": "<p>Düz bir yolun kenarındaki bir telefon kulesi, kuleye uzaklığı 5 km'den fazla olmayan yerlerde çekmektedir. Kulenin yola en yakın noktası H'dir.</p>", "g": "<div style=\"display:flex;justify-content:center\"><div style=\"border:.45mm solid #9b1c36;border-radius:3mm;background:#fff;padding:2mm 3.2mm;font-size:10.6pt;text-align:left\"><div style=\"font-weight:800;color:#9b1c36;margin-bottom:.8mm\">Telefon Kulesi</div><div style=\"margin:.4mm 0\">Kulenin yola en kısa uzaklığı: 3 km</div><div style=\"margin:.4mm 0\">Kulenin çekim uzaklığı: en çok 5 km</div></div></div>", "son": "<p>Yolda H noktasının iki yanında çekim alanı eşit uzunluktadır.</p>", "k": "Buna göre, yolun kaç kilometrelik bölümünde telefon çeker?", "sec": ["4", "10", "8", "6"], "secg": null, "c": "C", "a": ["Kuleden yola en kısa uzaklık dik doğrultudadır (3 km).", "Yolda çekimin bittiği noktaya kuleden 5 km: H'ye uzaklığı 25 − 9 = 16, 4 km.", "H'nin iki yanında 4'er km: 8 km."], "t": "4: yalnız bir yan; 10: 2 · 5; 6: 2 · 3", "d": "Kuleden yola en kısa uzaklık dik doğrultudadır; çekimin bittiği noktalar H'nin iki yanındadır.", "ses": "b08"}, {"no": 9, "on": "<p>Bir origami çalışmasında kare kâğıdın kenarlarının orta noktaları birleştirilerek ikinci kare, ikinci karenin kenarlarının orta noktaları birleştirilerek üçüncü kare ve aynı yolla dördüncü kare çizilmiştir.</p>", "g": "<svg viewBox=\"0 0 220 238\" width=\"220\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"Liberation Sans, Arial, sans-serif\"><g transform=\"translate(8.0 212.0)\"><polygon points=\"0.0,-0.0 204.0,-0.0 204.0,-204.0 0.0,-204.0\" fill=\"#fff0e6\" stroke=\"#d9480f\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><polygon points=\"102.0,-0.0 204.0,-102.0 102.0,-204.0 0.0,-102.0\" fill=\"#e7f1fb\" stroke=\"#1c6fb8\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"51.0,-51.0 153.0,-51.0 153.0,-153.0 51.0,-153.0\" fill=\"#e3f4f6\" stroke=\"#0b7285\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"102.0,-51.0 153.0,-102.0 102.0,-153.0 51.0,-102.0\" fill=\"#f1edfd\" stroke=\"#6741d9\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"102.0\" y=\"16.7\" font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.4\" stroke-linejoin=\"round\" paint-order=\"stroke\">12 cm</text></g></svg>", "son": "", "k": "Buna göre, en içteki dördüncü karenin bir kenarı kaç santimetredir?", "sec": ["6", "3", "6<span class=\"krk\"><span>2</span></span>", "3<span class=\"krk\"><span>2</span></span>"], "secg": null, "c": "D", "a": ["İkinci karenin kenarı dik kenarları 6 cm olan dik üçgenin hipotenüsü: 36 + 36 = 72, 6<span class=\"krk\"><span>2</span></span> cm.", "Üçüncü kare: yarılar 3<span class=\"krk\"><span>2</span></span>; 18 + 18 = 36, 6 cm.", "Dördüncü kare: yarılar 3; 9 + 9 = 18, 3<span class=\"krk\"><span>2</span></span> cm."], "t": "6: üçüncü kare; 3: her adımda yarıya inildiği sanılmış; 6<span class=\"krk\"><span>2</span></span>: ikinci kare", "d": "Her yeni karenin kenarı, bir önceki karenin yarı kenarlarından kurulan dik üçgenin hipotenüsüdür; kenar her adımda yarıya inmez.", "ses": "b09"}, {"no": 10, "on": "<p>Bir kaykay pistinde iki düz eğik bölüm vardır. Birinci eğik bölüm yerden yukarı çıkarak bir platforma ulaşır; ikinci eğik bölüm platformdan daha alçak bir basamağa iner.</p>", "g": "<div style=\"display:flex;flex-direction:column;align-items:center\"><p style=\"text-align:center;margin:0 0 1mm;font-size:10.6pt\"><b>Tablo:</b> Pist Ölçüleri</p><table style=\"border-collapse:collapse;font-size:10.6pt\"><thead><tr><th style=\"border:.3mm solid #d9480f;background:#fff0e6;padding:1.1mm 2.6mm;font-weight:700\">Bölüm</th><th style=\"border:.3mm solid #d9480f;background:#fff0e6;padding:1.1mm 2.6mm;font-weight:700\">Yatay uzunluk</th><th style=\"border:.3mm solid #d9480f;background:#fff0e6;padding:1.1mm 2.6mm;font-weight:700\">Dikey değişim</th></tr></thead><tbody><tr><td style=\"border:.3mm solid #d9480f;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">1. eğik bölüm</td><td style=\"border:.3mm solid #d9480f;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">1,2 m</td><td style=\"border:.3mm solid #d9480f;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">0,9 m yükselir</td></tr><tr><td style=\"border:.3mm solid #d9480f;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">2. eğik bölüm</td><td style=\"border:.3mm solid #d9480f;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">0,8 m</td><td style=\"border:.3mm solid #d9480f;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">0,6 m alçalır</td></tr></tbody></table></div>", "son": "<p>Eğik bölümlerin yüzeyleri kaydırmaz bantla kaplanacaktır.</p>", "k": "Buna göre, iki eğik bölümün toplam uzunluğu kaç metredir?", "sec": ["3,5", "2,5", "1,5", "3"], "secg": null, "c": "B", "a": ["Birinci bölüm: 0,81 + 1,44 = 2,25, 1,5 m.", "İkinci bölüm: 0,36 + 0,64 = 1, 1 m.", "Toplam 1,5 + 1 = 2,5 m."], "t": "3,5: bütün uzunluklar toplanmış; 1,5: yalnız birinci bölüm; 3: yatay ve dikey yanlış eşleştirilmiş", "d": "Bant yalnız eğik bölümlere serilir; yatay platform ve basamak uzunlukları eklenmez.", "ses": "b10"}, {"no": 11, "on": "<p>Genişliği 8 cm olan uzun bir kâğıt şeridin A köşesi, [PR] boyunca katlanarak şeridin üst kenarındaki Q noktasına getirilmiştir. Q noktası şeridin sol üst köşesinden 4 cm uzaktadır.</p>", "g": "<svg viewBox=\"0 0 240 190\" width=\"240\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"Liberation Sans, Arial, sans-serif\"><g transform=\"translate(23.6 163.3)\"><polygon points=\"160.0,-0.0 0.0,-80.0 64.0,-128.0\" fill=\"#e7f1fb\" stroke=\"none\"/><polygon points=\"0.0,-0.0 208.0,-0.0 208.0,-128.0 0.0,-128.0\" fill=\"none\" stroke=\"#111111\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><line x1=\"160.0\" y1=\"-0.0\" x2=\"0.0\" y2=\"-80.0\" stroke=\"#9b1c36\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><line x1=\"160.0\" y1=\"-0.0\" x2=\"64.0\" y2=\"-128.0\" stroke=\"#1c6fb8\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"-80.0\" x2=\"64.0\" y2=\"-128.0\" stroke=\"#1c6fb8\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"-0.0\" x2=\"64.0\" y2=\"-128.0\" stroke=\"#333333\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><circle cx=\"64.0\" cy=\"-128.0\" r=\"3.4\" fill=\"#1c6fb8\" stroke=\"#1c6fb8\" stroke-width=\"0\"/><text x=\"-9.4\" y=\"14.4\" font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.4\" stroke-linejoin=\"round\" paint-order=\"stroke\">A</text><text x=\"160.0\" y=\"16.7\" font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.4\" stroke-line
