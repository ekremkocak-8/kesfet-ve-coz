<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çözümler · Keşfet ve Çöz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--muted:#5b6478;--line:#dfe5ef;--bg:#f5f7fb;--card:#fff;--ss:#6741d9;--kk:#0b7285;--b:#d0700f;--ok:#2b8a3e;--warn:#c92a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif}
header{background:linear-gradient(135deg,#1c5fbf,#2f8fe0);color:#fff;padding:18px 16px 22px}

main{max-width:780px;margin:14px auto 40px;padding:0 16px}
nav.sec{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}nav.sec button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}

ol.sec{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
ol.sec li{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}ol.sec li.dogru{border-color:var(--ok);background:#ebfbee;font-weight:800}
.adim{border-left:4px solid var(--c);padding:6px 12px;margin:8px 0;background:#fff;border-radius:0 10px 10px 0;animation:gel .35s ease-out}
.adim b{color:var(--c)}@keyframes gel{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dug{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
button.btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.dikkat{background:#fff4e6;border:2px solid #f59f00;border-radius:12px;padding:10px 14px;margin:12px 0 4px}.dikkat b{color:#d9480f}
.tuzak{font-size:15px;color:var(--muted);margin-top:8px}
.cevap{font-weight:900;color:var(--ok);margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid var(--line);padding:8px 10px;text-align:left}th{background:#e3fafc;color:#0b7285;font-size:13px;letter-spacing:.06em}
.ses{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border-radius:12px;background:#eef2ff}

.ses span{font-size:14px;color:var(--muted)}
.gizli{display:none}
.tum{margin:4px 0 14px;font-size:14px}.tum a{color:#1c5fbf;font-weight:800}
@media (prefers-reduced-motion:reduce){.adim{animation:none}}
/* Canlandır (05.10.2026) */
.sek{display:flex;gap:6px;margin:12px 0 0;border-bottom:2px solid var(--line)}
.sek button{border:0;background:none;font:inherit;font-weight:900;font-size:15px;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);min-height:44px;position:relative;top:2px;border-bottom:3px solid transparent}
.sek button[aria-selected=true]{color:var(--c);border-bottom-color:var(--c);background:#fff8f0}
.sek .yeni{display:inline-block;font-size:10px;background:#2b8a3e;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.06em}
.cn{padding-top:10px}
.cn-yon{background:#eef6ff;border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:10px}
.cn-sahne{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;min-height:120px;overflow-x:auto}

.cn-adimci input,.cn-test input{width:84px;height:44px;border:2px solid var(--line);border-radius:12px;font:inherit;font-weight:900;text-align:center;font-size:18px}
.cn-test label{font-weight:800;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.cn-btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
.cn-btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.cn-btn[aria-pressed=true]{background:var(--ac,var(--c));color:#fff;border-color:var(--ac,var(--c))}
.cn-btn:disabled{opacity:.5}
.cn-hazir{display:flex;flex-wrap:wrap;gap:6px}

.cn-dur .iyi{color:var(--ok);font-weight:900}.cn-dur .kotu{color:var(--warn);font-weight:900}
.cn-df{margin-top:10px;overflow-x:auto}@media(max-width:480px){.cn-adimci>span{flex-basis:100%}.cn-h{font-size:12px;padding:5px 0}.cn-izg{gap:3px}.cn-sahne{padding:6px}}@media(max-width:480px){.cn-df table{font-size:13px}.cn-df td,.cn-df th{padding:4px 5px}}.cn-df summary{font-weight:900;cursor:pointer;padding:6px 0}.cn-say{color:var(--muted);font-weight:700}
.cn-df table{font-size:15px}.cn-df td{padding:5px 8px}.cn-df tr.cn-iyi td{background:#ebfbee}.cn-df tr.cn-kotu td{background:#fff5f5}.cn-df tr.cn-son td{outline:2px solid var(--c);outline-offset:-2px}
.cn-p{animation:cnGel .35s ease-out both}@keyframes cnGel{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cn-o{fill:#ffa94d;stroke:#d9480f;stroke-width:1}.cn-o2{fill:#e8590c}.cn-k{fill:#ffc9c9;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:3 2}
.cn-cerceve{stroke:#2b8a3e;stroke-width:3}.cn-et{font-size:13px;font-weight:800;fill:#5b6478}.cn-et.b,.cn-et2b{font-weight:900;fill:#1d2433}.cn-et2{font-size:11px;fill:#5b6478;font-weight:700}.cn-et2b{font-size:13px;fill:#fff}
.cn-ku{fill:#fff4e6;stroke:#ffa94d;stroke-width:1.5}.cn-kk{fill:#fff5f5;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:4 3}
.cn-tahta0{fill:#f1f3f5;stroke:#ced4da}.cn-tahta{fill:#c08552;stroke:#8d5a2b}
.cn-ek{stroke:#868e96;stroke-width:2}.cn-sinir{stroke:#c92a2a;stroke-width:3;stroke-dasharray:5 4}.cn-yay{fill:none;stroke:#f76707;stroke-width:2}
.cn-v1{stroke:#2b8a3e;stroke-width:3}.cn-v2{stroke:#c92a2a;stroke-width:3}.cn-kis{font-size:20px}.cn-bus{font-size:16px}.cn-bek{stroke:#c92a2a;stroke-width:5;stroke-linecap:round;opacity:.6}
.cn-kum{fill:#ffe8cc;stroke:#e8590c;stroke-width:3}.cn-kum2{fill:#495057}.cn-para{fill:#ffd43b;opacity:.85}.cn-buyuk{font-size:26px;font-weight:900;fill:#1d2433}
.cn-zem{fill:#adb5bd}.cn-kat{fill:#f1f3f5;stroke:#ced4da}.cn-katon{fill:#d3f9d8;stroke:#2b8a3e}.cn-katoff{fill:#ffe3e3;stroke:#e03131}
.cn-izg{display:grid;gap:4px}.cn-h,.cn-gb{border-radius:8px;text-align:center;font-weight:800;font-size:14px;padding:6px 0}.cn-h{background:#f1f3f5;transition:background .25s,transform .25s}
.cn-gb{background:none;color:var(--muted);font-size:12px}.cn-h.on{background:#ffa94d;color:#1d2433}.cn-h.yeni{transform:scale(1.18);box-shadow:0 0 0 3px #e8590c}
.cn-kartlar{display:flex;flex-wrap:wrap;gap:6px;padding:4px}.cn-kart{min-width:44px;padding:8px 10px;text-align:center;border-radius:10px;background:#fff4e6;border:2px solid #ffa94d;font-weight:900;animation:cnGel .3s}
.cn-kart.kare{background:#e7f5ff;border-color:#1c7ed6}.cn-bosk{color:var(--muted)}
.cn-cift{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 4px;font-weight:800}.cn-cift i{font-weight:600;color:#1c7ed6}
.cn-katlar{padding:4px}.cn-katsat{display:inline-flex;flex-wrap:wrap;gap:6px}.cn-kat2{background:#e6fcf5;border:1.5px solid #12b886;border-radius:8px;padding:3px 8px;font-weight:800;animation:cnGel .3s}.cn-sonsuz{font-weight:800;color:#0b7285}
.cn-onr{background:#f8f0fc;border:2px solid #ae3ec9;border-radius:12px;padding:10px 14px}.cn-kanit{padding:10px 4px 2px}
.cn-kay{display:inline-flex;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap}.cn-kay{max-width:100%}.cn-kay input{width:min(220px,70vw);accent-color:#d0700f}.cn-satir>*{min-width:0;max-width:100%}
@media (prefers-reduced-motion:reduce){.cn-p,.cn-kart,.cn-kat2{animation:none}.cn-h{transition:none}}
/* 05.10.2026 · KOŞUL ve LABİRENT motorları (SB 6.1.1) */
@media(max-width:560px){.soru [style*="grid-template-columns:repeat"]{grid-template-columns:1fr!important}}   /* çok sütunlu konuşma balonları telefonda alt alta */
.cn-kl{list-style:none;padding:0;margin:0;display:grid;gap:4px}.cn-not{color:var(--muted);font-size:14px}.cn-sonuc{margin-top:6px;font-weight:800}
.cn-secg{gap:6px}.cn-secad{font-weight:800;flex-basis:100%}.cn-secg .cn-btn{padding:8px 12px}
.cn-mv{fill:#74c0fc;stroke:#1c7ed6;stroke-width:1}.cn-tl{fill:#69db7c;stroke:#2b8a3e;stroke-width:1.5}
.cn-lab{display:grid;gap:4px;align-items:center;max-width:460px;margin:0 auto}
.cn-lc{min-height:44px;border-radius:8px;border:1.5px solid #ced4da;background:#fff;font:inherit;font-weight:900;font-size:16px;cursor:pointer;padding:0;color:var(--ink)}
.cn-lc.yol{background:#d3f9d8;border-color:#2b8a3e}.cn-lc.simdi{background:#2b8a3e;color:#fff;box-shadow:0 0 0 3px #b2f2bb}.cn-lc.kapali{background:#ffe3e3;border-color:#e03131;color:#c92a2a;text-decoration:line-through}
.cn-lok{color:#2b8a3e;font-weight:900;text-align:center}.cn-lcik{min-height:44px;border:0;background:none;font:inherit;font-weight:900;color:#d9480f;cursor:pointer;padding:0;white-space:nowrap;font-size:14px}.cn-lcik:disabled{cursor:default}

</style></head><body>
<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }
      if (!art && !o.sandalye) sv += `<rect x="10" y="10" width="${gen * hc}" height="${sira * hc}" fill="none" class="cn-cerceve"/>
        <text x="${10 + gen * hc / 2}" y="${H + 4}" class="cn-et" text-anchor="middle">${gen} ${o.birim || ""}</text>
        <text x="${W + 4}" y="${10 + sira * hc / 2}" class="cn-et" dominant-baseline="middle">${sira} ${o.birim || ""}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W + 70} ${H + 22}" role="img" aria-label="${N} ${o.ad || "kare"}, her sırada ${gen}">${sv}</svg>`;
      const r = o.kural ? o.kural(gen, sira, art, N) : null;
      let m;
      if (art) m = `<span class="kotu">✘</span> ${N} ${o.ad || "kare"} her sırada ${gen} olacak biçimde dizilince ${sira} tam sıra oluşur, <b>${art} ${o.ad || "kare"} artar</b>. Dikdörtgen olmaz: ${N} : ${gen} işleminde kalan ${art}.`;
      else m = `<span class="iyi">✔</span> <b>${N} = ${gen} ${x} ${sira}</b> · ${sira} sıra, her sırada ${gen} ${o.ad || "kare"}; hiç artmadı.` + (gen === sira ? ` <b>Kare oldu!</b> İki kenar aynı: ${gen}.` : "");
      if (!art && o.cevre) m += ` Çevre = 2 ${x} (${gen} + ${sira}) = <b>${2 * (gen + sira)} m</b>.`;
      if (r && r.msg) m += `<br>${r.msg}`;
      s.dur.innerHTML = m;
      const sutunlar = o.satir ? o.satir(gen, sira, art, N, r) : [gen, art ? `${sira} (+ ${art} artan)` : sira, art, art ? "olmaz" : (gen === sira ? "kare" : "dikdörtgen")];
      s.yaz(N + ":" + gen, sutunlar, !art && (!r || r.ok !== false));
    }
    ciz(g.get());
  }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {
    const N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });
    const g = adimci(o.etiket, 1, o.max || N, o.bas || 2, v => { sonK = v; });

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {

  C[6] = SEC(6, { V: [114, 66, 32, 98], yon: "Meydan ölçekli çizilir, açıortay yol eklenir ve E'de C tarafındaki açı ölçülür.", olcAd: "Ölçülen m(AÊC)",

  /* 7 · deniz feneri: en kısa ışık hattı */
  C[7] = SEC(7, { V: [30, 80, 20, 40], yon: "Fenerden iskele doğrultusuna seçenekteki uzunlukta dik bir hat indirilir.", olcAd: "Hattın ucu nerede?",

    test: e => { const y = 5 - e / 10; return { ok: eq(y, 1), olc: y > 1 ? "doğrultuya ulaşmadı" : y < 1 ? "doğrultuyu geçti" : "tam doğrultuda", m: `Hat ${e} m (${fmt(e / 10)} birim) inince ucu ${eq(y, 1) ? "tam iskele doğrultusuna değer" : y > 1 ? "doğrultuya ulaşmaz" : "doğrultunun ötesine geçer"}. Fenerin doğrultuya uzaklığı 4 birim = 40 m.` }; } });

  /* 8 · terzi: 52 cm kenarda yay açıklığı */
  C[8] = SEC(8, { V: [26, 13, 27, 52], yon: "Kenarın iki ucundan seçenekteki açıklıkla yaylar çizilir.", olcAd: "Kesişim sayısı",
    ciz: e => { const S = sahne({ x0: -6, x1: 58, y0: -40, y1: 40, W: 400 }); S.L([0, 0], [52, 0], "#1d2433", 3).N([0, 0], "", "#1d2433").N([52, 0], "", "#1d2433"); S.yay([0, 0], e, -50, 50, MOR).yay([52, 0], e, 130, 230, MOR); cember([0, 0], e, [52, 0], e).forEach(P => S.N(P, "", BOR, 0, 12, 4.5)); return S.svg(); },
    test: e => { const n = cember([0, 0], e, [52, 0], e).length; return { ok: n === 2 && e === 27, olc: `${n} nokta`, m: `${e} cm açıklıkla yaylar ${n === 2 ? "iki noktada kesişir" : n === 1 ? "tek noktada değer" : "kesişmez"}${n === 2 && e !== 27 ? "; ama bu en küçük açıklık değil" : ""}.` }; } });

  /* 9 · oyun alanı: 17, 17, 16 */
  C[9] = SEC(9, { V: [33, 50, 34, 66], yon: "Alan yol boyunca katlanır; kenar uzunlukları toplanıp seçenekteki çit uzunluğuyla karşılaştırılır.", olcAd: "Seçenek ile çevre",
    ciz: () => { const S = sahne({ x0: -1, x1: 17, y0: -2, y1: 16, W: 360 }); S.P([[8, 15], [0, 0], [16, 0]], "#e7f6ea", KUM, 3).L([8, 15], [8, 0], TUR, 2.4, "6 4").dik([8, 0], [8, 15], [16, 0]).T([4, 7.5], "17 m", 13, "#1d2433", -6, 0, "end").T([12, 7.5], "17 m", 13, TUR, 6, 0, "start").T([8, 0], "16 m", 13, "#1d2433", 0, 18); return S.svg(); },
    test: e => ({ ok: e === 50, olc: `${e} m / 50 m`, m: `Katlanınca AC, AB'nin üstüne gelir: |AC| = 17 m. Çevre 17 + 17 + 16 = <b>50 m</b>; seçenek ${e} m.` }) });

  /* 10 · yelken: üç kenar aynı */
  { const T = kkk(4, 3.6, 2.8);
    C[10] = SEC(10, { V: ["cak", "aci", "buyuk", "cevre"], yon: "İkinci yelken aynı üç kenarla kesilip birincinin üstüne konur (gerekirse çevrilerek).", olcAd: "Üst üste konunca",

      test: e => ({ ok: e === "cak", olc: "tam çakıştı", m: e === "cak" ? "İkinci yelken birincinin üstüne tam oturdu: açıları da alanı da aynı." : "İki yelken üst üste tam oturdu; seçenekteki farklılık görülmedi." }) }); }

  /* 11 · sera: A = 52°, C = 75° */
  C[11] = SEC(11, { V: [75, 52, 127, 53], yon: "6 m'lik tabanın A ucunda 52°, B ucunda seçenekteki açı çizilir; tepedeki C açısı ölçülür.", olcAd: "Tepede ölçülen açı",
    ciz: e => { if (52 + e >= 180) return `<p class="cn-not">52° + ${e}° ≥ 180°: ışınlar kesişmez.</p>`; const T = aka(6, 52, e); const S = ucgen(T, [], 1); S.aciYay(T[1], T[0], T[2], 20, "#1d2433", "52°").aciYay(T[2], T[0], T[1], 20, "#1d2433", e + "°").aciYay(T[0], T[1], T[2], 16, TUR, fmt(180 - 52 - e, 0) + "°"); return S.svg(); },
    test: e => { const c = 180 - 52 - e; return { ok: c === 75, olc: c > 0 ? c + "°" : "çizilemez", m: c > 0 ? `Tepede ${c}° ölçülür; sera planında tepe açısı 75°.` : "Işınlar kesişmez." }; } });

  /* 12 · park planı: 6,4 cm, 1 cm ↔ 5 m */
  C[12] = SEC(12, { V: [320, 16, 32, 11.4], yon: "Seçenekteki gerçek uzunluk ölçeğe bölünerek plandaki uzunluğa çevrilir.", olcAd: "Plandaki karşılığı",
    ciz: e => { const S = sahne({ x0: -0.5, x1: 8, y0: -0.6, y1: 5, W: 380 }); S.P([[2, 4.6], [0, 0], [7.6, 0]], "#e7f6ea", KUM).L([2, 4.6], [3.8, 0], MAV, 2.6, "6 4"); return S.svg(); },
    test: e => { const p = e / 5; return { ok: eq(p, 6.4), olc: fmt(p, 2) + " cm", m: `${fmt(e)} m planda ${fmt(e)} : 5 = <b>${fmt(p, 2)} cm</b> olur; planda ölçülen 6,4 cm.` }; } });

  /* 13 · bayraklar: üç açı */
  C[13] = SEC(13, { V: ["cak", "bicim", "kenar", "yok"], yon: "İki atölyenin bayrakları aynı açılarla farklı uzunlukta tabanlarla çizilir.", olcAd: "Karşılaştırma",
    ciz: () => { const S = sahne({ x0: -0.5, x1: 15, y0: -0.5, y1: 5.5, W: 420 }); S.P(aka(4.2, 60, 70), "#fff0e6", TUR); S.P(aka(6.3, 60, 70).map(p => [p[0] + 7.5, p[1]]), "#fff0e6", TUR); return S.svg(); },
    test: e => ({ ok: e === "bicim", olc: "aynı açılar, farklı kenarlar", m: e === "bicim" ? "İki bayrağın açıları aynı, kenarları farklı: aynı biçim, farklı büyüklük." : "Çizimde bayrakların büyüklükleri farklı çıktı; seçenek tutmuyor." }) });

  /* 14 · kumaş: |AB| = 30, B = 40°, |AC| = 22 */
  { const A = [30 * Math.cos(40 * R), 30 * Math.sin(40 * R)];
    const kes = () => { const k = 30 * Math.cos(40 * R), d = 22 * 22 - (30 * Math.sin(40 * R)) ** 2; return [k - Math.sqrt(d), k + Math.sqrt(d)]; };
    C[14] = SEC(14, { V: [2, 1, 0, "s"], yon: "A merkezli 22 cm'lik yay çizilir; B'deki ışını kaç noktada kestiği sayılır.", olcAd: "Kesişim sayısı",
      ciz: () => { const S = sahne({ x0: -2, x1: 46, y0: -4, y1: 24, W: 420 }); S.L([0, 0], A, "#1d2433", 2.6).L([0, 0], [46, 0], "#1d2433", 2).yay(A, 22, 220, 330, MOR); kes().forEach(x => S.N([x, 0], "", BOR, 0, 12, 5)); S.N(A, "A", "#1d2433", 90).N([0, 0], "B", "#1d2433", 200); return S.svg(); },
      test: e => ({ ok: e === 2, olc: "2 nokta", m: `Yay ışını <b>iki</b> noktada kesti; seçenek ${e === "s" ? "sonsuz çok" : e} diyor.` }) }); }

  /* 15 · projektörler */
  { const AY = [[85, 95], [100, 75], [60, 130], [110, 74]];
    C[15] = SEC(15, { V: [15, 175, 25, 5], yon: "Dört ayarın ışınları çizilir; buluşan ayarda buluşma açısı ölçülür ve seçenekle karşılaştırılır.", olcAd: "Buluşma açısı",

    test: e => ({ ok: e === 2, olc: "2 nokta", m: `İki yay <b>iki</b> noktada kesişir (BC'nin iki yanında). Seçenek ${e === "s" ? "sonsuz çok" : e}.` }) });

  /* 19 · katlanır merdiven */
  { const d = t => 2 * 1.6 * Math.sin(t / 2 * R);

      ciz: () => { const S = sahne({ x0: -2.2, x1: 2.2, y0: -0.2, y1: 1.8, W: 380 }); [[30, MAV], [60, TUR]].forEach(([t, r]) => { const w = d(t) / 2, hh = 1.6 * Math.cos(t / 2 * R); S.L([0, hh], [-w, 0], r, 2.6).L([0, hh], [w, 0], r, 2.6).T([t === 30 ? w : -w, 0], fmt(d(t), 2) + " m", 12, r, 0, 16); }); return S.svg(); },
      test: e => ({ ok: e === "12", olc: `30°: ${fmt(d(30), 2)} m; 60°: ${fmt(d(60), 2)} m`, m: `Açı büyüyünce uzaklık arttı (I doğru); her açı için tek uzaklık çıktı (II doğru); 30°'den 60°'ye uzaklık ${fmt(d(60) / d(30), 2)} katına çıktı, 2 katı değil (III yanlış).` }) }); }

  /* 20 · üç eşit parsel: BC = 45 m */
  { const NOK = { "15-30": [15, 30], "22,5-45": [22.5, 45], "15-22,5": [15, 22.5], "10-20": [10, 20] };
    C[20] = SEC(20, { V: ["22,5-45", "15-22,5", "15-30", "10-20"], yon: "Çitler seçenekteki noktalara çekilir; üç parselin alanları hesaplanır.", olcAd: "Parsel alanları",
      ciz: e => { const [k, l] = NOK[e]; const S = sahne({ x0: -2, x1: 47, y0: -3, y1: 26, W: 420 }); S.P([[14, 24], [0, 0], [45, 0]], "#eef6e8", KUM).L([14, 24], [k, 0], TUR, 2.4).L([14, 24], [l, 0], TUR, 2.4).N([k, 0], "K", "#1d2433", 270).N([l, 0], "L", "#1d2433", 270); return S.svg(); },
      test: e => { const [k, l] = NOK[e], a = [k, l - k, 45 - l].map(x => x * 24 / 2); const ok = a.every(x => eq(x, a[0])); return { ok, olc: a.map(x => fmt(x)).join("; "), m: `Parsellerin alanları ${a.map(x => fmt(x) + " m²").join(", ")}${ok ? ": üçü eşit." : ": eşit değil."}` }; } }); }

  return C;
})();

ontent:center;margin:1.2mm 0\"><svg style=\"width:46mm;max-width:100%;height:auto\" viewBox=\"0 0 247 184\" width=\"247\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"Liberation Sans, Arial, sans-serif\"><polygon points=\"86.4,42.3 40.4,148.1 206.0,148.1\" fill=\"#f4f7fc\" stroke=\"#111111\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><line x1=\"40.4\" y1=\"148.1\" x2=\"113.1\" y2=\"65.9\" stroke=\"#d9480f\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><line x1=\"206.0\" y1=\"148.1\" x2=\"63.4\" y2=\"95.2\" stroke=\"#1c6fb8\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><line x1=\"40.4\" y1=\"148.1\" x2=\"135.5\" y2=\"85.7\" stroke=\"#6741d9\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><path d=\"M62.2 133.8 A26.0 26.0 0 0 0 50.8 124.2\" fill=\"none\" stroke=\"#6741d9\" stroke-width=\"1.5\"/><path d=\"M72.4 148.1 A32.0 32.0 0 0 0 67.2 130.5\" fill=\"none\" stroke=\"#6741d9\" stroke-width=\"1.5\"/><polyline points=\"108.5,71.1 113.7,75.8 118.4,70.5\" fill=\"none\" stroke=\"#111111\" stroke-width=\"1.4\"/><line x1=\"80.4\" y1=\"71.1\" x2=\"69.4\" y2=\"66.3\" stroke=\"#111111\" stroke-width=\"1.6\"/><line x1=\"57.4\" y1=\"124.0\" x2=\"46.4\" y2=\"119.2\" stroke=\"#111111\" stroke-width=\"1.6\"/><circle cx=\"86.4\" cy=\"42.3\" r=\"3.2\" fill=\"#111111\" stroke=\"#111111\" stroke-width=\"0\"/><circle cx=\"40.4\" cy=\"148.1\" r=\"3.2\" fill=\"#111111\" stroke=\"#111111\" stroke-width=\"0\"/><circle cx=\"206.0\" cy=\"148.1\" r=\"3.2\" fill=\"#111111\" stroke=\"#111111\" stroke-width=\"0\"/><circle cx=\"82.6\" cy=\"100.4\" r=\"0.01\" fill=\"#111111\" stroke=\"#111111\" stroke-width=\"0\"/><circle cx=\"141.8\" cy=\"124.3\" r=\"0.01\" fill=\"#111111\" stroke=\"#111111\" stroke-width=\"0\"/><circle cx=\"107.0\" cy=\"104.4\" r=\"0.01\" fill=\"#111111\" stroke=\"#111111\" stroke-width=\"0\"/><text x=\"80.3\" y=\"30.5\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.4\" stroke-linejoin=\"round\" paint-order=\"stroke\">A</text><text x=\"23.8\" y=\"162.2\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.4\" stroke-linejoin=\"round\" paint-order=\"stroke\">B</text><text x=\"223.5\" y=\"160.3\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.4\" stroke-linejoin=\"round\" paint-order=\"stroke\">C</text><text x=\"65.2\" y=\"109.8\" font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.4\" stroke-linejoin=\"round\" paint-order=\"stroke\">1</text><text x=\"163.7\" y=\"128.7\" font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.4\" stroke-linejoin=\"round\" paint-order=\"stroke\">2</text><text x=\"102.4\" y=\"92.2\" font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.4\" stroke-linejoin=\"round\" paint-order=\"stroke\">3</text></svg></span>", "a": ["1: B'den AC'ye dik inmiştir; h<sub>b</sub>.", "2: C'yi AB'nin orta noktasına birleştirir (çentikler); V<sub>c</sub>.", "3: B açısını iki eş açıya böler (yaylar); n<sub>B</sub>."], "c": "1 = h<sub>b</sub>, 2 = V<sub>c</sub>, 3 = n<sub>B</sub>"}]}, {"no": 2, "bas": "Yükseklik", "q": [{"k": "Dar açılı bir DEF üçgeninde E köşesinden DF kenarına yüksekliği inşa ediniz. Yaptığınız adımları sırasıyla yazınız.", "a": ["E merkezli bir yay çizilir; yay DF'yi iki noktada keser (P ve R).", "P ve R merkezli, aynı açıklıkta iki yay DF'nin öbür yanında kesişir (K).", "E ile K birleştirilir; DF'yi kestiği nokta yüksekliğin ayağıdır (H). [EH] = h<sub>e</sub>."], "c": "E merkezli yay, P ve R merkezli eş yaylar, E ile K'nin birleştirilmesi"}, {"k": "B açısı geniş olan bir ABC üçgeninde C köşesinden AB kenarına yükseklik inşa edilecektir. İnşaya başlamadan önce ne yapılmalıdır? Yüksekliğin ayağı nerede olur?", "a": ["B açısı geniş olduğundan C'den AB'ye dik inen doğru, AB kenarının B'den öteki uzantısını keser.", "AB önce B'den öteye kesikli çizgiyle uzatılır; C merkezli yay bu uzantıyı da keser.", "Ayak, uzantının üzerinde, B'nin ötesindedir; yükseklik üçgenin dışında kalır."], "c": "AB, B'den öteye uzatılır; ayak uzantıda, üçgenin dışındadır"}]}, {"no": 3, "bas": "Kenarortay", "q": [{"k": "<span class=\"nw\">|KL|</span> = 10,6 cm olan KLM üçgeninde M'den KL'ye kenarortay inşa edilecektir. K ve L merkezli yayların açıklığı 5 cm seçilirse ne olur? Uygun bir açıklık örneği veriniz.", "a": ["Kenarın yarısı 10,6 : 2 = 5,3 cm'dir.", "5 &lt; 5,3 olduğundan iki yay birbirine değmez; orta nokta bulunamaz.", "Açıklık 5,3 cm'den büyük ve iki yayda eşit seçilmelidir; örneğin 6 cm."], "c": "Yaylar kesişmez; açıklık 5,3 cm'den büyük olmalıdır (ör. 6 cm)"}, {"k": "Kareli zeminde köşeleri P(1, 1), R(6, 4) ve S(2, 6) noktalarında olan üçgende S köşesinden PR kenarına kenarortay çiziniz. PR'nin orta noktası nereye düşer?", "a": ["P'den R'ye 5 birim sağa ve 3 birim yukarı gidilir.", "Adımların yarısı 2,5 ve 1,5'tir: orta nokta (3,5; 2,5) noktasıdır, bir karenin tam ortasına düşer.", "S ile bu nokta birleştirilir."], "c": "Orta nokta (3,5; 2,5), karenin merkezi"}]}, {"no": 4, "bas": "Açıortay", "q": [{"k": "Bir ABC üçgeninde B açısının açıortayını inşa ediniz. İnşadan sonra açıortayın doğru çizildiğini hangi araçla, nasıl kontrol edersiniz?", "a": ["B merkezli bir yay BA'yı P'de, BC'yi R'de keser.", "P ve R merkezli, aynı açıklıkta iki yay açının içinde K'de kesişir; BK ışını AC'yi D'de keser.", "Açıölçerle <span class=\"nw\">m(AB̂D)</span> ve <span class=\"nw\">m(DB̂C)</span> ölçülür; ikisi eşitse inşa doğrudur."], "c": "Açıölçerle iki açının eşit olduğu ölçülür"}, {"k": "<span class=\"nw\">m(Â)</span> = 54° ve <span class=\"nw\">m(Ĉ)</span> = 82° olan ABC üçgeninde [BD], B açısının açıortayıdır (D, AC üzerinde). <span class=\"nw\">m(BD̂A)</span> ve <span class=\"nw\">m(BD̂C)</span> kaç derecedir?", "a": ["<span class=\"nw\">m(B̂)</span> = 180° − 54° − 82° = 44°; açıortay 22°'lik iki açı ayırır.", "ABD üçgeninde <span class=\"nw\">m(BD̂A)</span> = 180° − 54° − 22° = 104°.", "BDC üçgeninde <span class=\"nw\">m(BD̂C)</span> = 180° − 82° − 22° = 76°; 104° + 76° = 180°."], "c": "<span class=\"nw\">m(BD̂A)</span> = 104°, <span class=\"nw\">m(BD̂C)</span> = 76°"}]}, {"no": 5, "bas": "Aynı köşeden üç eleman", "q": [{"k": "Kenarları farklı bir ABC üçgeninde A'dan çizilen yükseklik, açıortay ve kenarortayın ayakları sırasıyla H, E ve D'dir. Ölçümde <span class=\"nw\">|BH|</span> = 2,3 cm ve <span class=\"nw\">|BD|</span> = 4,6 cm bulunmuştur. <span class=\"nw\">|BE|</span> için 1,8 cm, 3,4 cm ve 5,2 cm değerlerinden hangisi olabilir?", "a": ["Açıortayın ayağı, yüksekliğin ve kenarortayın ayakları arasındadır.", "E, B'den 2,3 cm ile 4,6 cm arasında bir uzaklıktadır.", "Bu değerlerden yalnız 3,4 cm bu aralıktadır."], "c": "3,4 cm"}, {"k": "ABC üçgeninde [BK], B açısının açıortayıdır ve aynı zamanda AC kenarına ait yüksekliktir. <span class=\"nw\">|BC|</span> = 13 cm ve <span class=\"nw\">|AC|</span> = 8 cm olduğuna göre üçgenin çevresi kaç santimetredir?", "a": ["B'den çizilen açıortay ile yükseklik çakıştığı için üçgen BK boyunca katlanınca BA, BC'nin üstüne gelir: üçgen ikizkenardır.", "<span class=\"nw\">|BA|</span> = <span class=\"nw\">|BC|</span> = 13 cm.", "Çevre = 13 + 13 + 8 = 34 cm."], "c": "34 cm"}]}, {"no": 6, "bas": "Üç kenarla çizim", "q": [{"k": "Kenarları 6 cm, 8 cm ve 9 cm olan bir üçgen çiziniz. Üçgenin en büyük açısının ölçüsünü yaklaşık olarak bulunuz.", "a": ["9 cm'lik kenar cetvelle çizilir; uçlarından 6 cm ve 8 cm açıklıklı yaylar çizilip kesişim noktası bulunur.", "En büyük açı en uzun kenarın karşısındaki açıdır; açıölçerle ölçülür.", "Ölçüm yaklaşık 79°'dir."], "c": "Yaklaşık 79°"}, {"k": "Kenarları 7 cm, 7 cm ve 4 cm olan ikizkenar üçgeni çizerken pergelin açıklığını en az kaç kez değiştirmeniz gerekir? Çizip açılarını ölçünüz.", "a": ["4 cm'lik taban cetvelle çizilir.", "Pergel 7 cm açılır; tabanın iki ucundan aynı açıklıkla yaylar çizilir, açıklık değiştirilmez.", "Tepe açısı yaklaşık 33°, taban açıları yaklaşık 73°'dir."], "c": "Açıklık değiştirilmez (tek açıklık); yaklaşık 33°, 73°, 73°"}]}, {"no": 7, "bas": "İki kenar–açı, kenar–iki açı", "q": [{"k": "<span class=\"nw\">|DE|</span> = 7 cm, <span class=\"nw\">|DF|</span> = 4 cm ve <span class=\"nw\">m(D̂)</span> = 75° olan DEF üçgenini çiziniz ve EF kenarını ölçünüz.", "a": ["Açıölçerle 75°'lik D açısı çizilir.", "Kollar üzerinde D'den 7 cm uzakta E, 4 cm uzakta F işaretlenir.", "E ile F birleştirilir; <span class=\"nw\">|EF|</span> ≈ 7,1 cm ölçülür."], "c": "<span class=\"nw\">|EF|</span> ≈ 7,1 cm"}, {"k": "<span class=\"nw\">|KL|</span> = 7 cm, <span class=\"nw\">m(M̂)</span> = 63° ve <span class=\"nw\">m(K̂)</span> = 49° olan KLM üçgenini çiziniz.", "a": ["M açısı KL kenarının ucunda değildir; önce L açısı bulunur: 180° − 63° − 49° = 68°.", "7 cm'lik [KL] çizilir; K'de 49°'lik, L'de 68°'lik açılarla ışınlar çizilir; kesişim M'dir.", "Ölçüm: <span class=\"nw\">|KM|</span> ≈ 7,3 cm, <span class=\"nw\">|LM|</span> ≈ 5,9 cm."], "c": "<span class=\"nw\">m(L̂)</span> = 68°; <span class=\"nw\">|KM|</span> ≈ 7,3 cm, <span class=\"nw\">|LM|</span> ≈ 5,9 cm"}]}, {"no": 8, "bas": "Yeterli eleman ve çizim problemleri", "q": [{"k": "Aşağıdaki eleman takımlarından hangileri tek bir üçgen belirler? Gerekçesini yazınız.<br>I. 4 cm, 6 cm, 9 cm &nbsp; II. 35°, 65°, 80° &nbsp; III. 9 cm ve 5 cm'lik kenarlar ile 5 cm'lik kenarın karşısındaki 25°'lik açı &nbsp; IV. 8 cm'lik kenar ve uçlarındaki 55° ile 70°", "a": ["I üç kenardır: tek üçgen.", "II yalnız açılardır: aynı biçimde farklı büyüklükte sonsuz çok üçgen.", "III'te açı iki kenarın arasında değildir: yay ışını iki noktada keser, iki üçgen çizilebilir.", "IV bir kenar ve iki ucundaki açıdır (55° + 70° &lt; 180°): tek üçgen."], "c": "I ve IV"}, {"k": "<span class=\"nw\">|BC|</span> = 8 cm, <span class=\"nw\">m(B̂)</sp zunluğundaki düz bir kumaş kenarının orta noktasını terzi pergeliyle bulacaktır. Kenarın iki ucunu merkez alarak aynı açıklıkla iki yay çizecek ve yayların kesişim noktalarını birleştirecektir. Pergelin açıklığı santimetre cinsinden bir doğal sayı olacaktır.</p>", "g": "<div style=\"display:flex;justify-content:center\"><div style=\"border:.45mm solid #6741d9;border-radius:3mm;background:#fff;padding:2mm 3.2mm;font-size:10.6pt;text-align:left\"><div style=\"font-weight:800;color:#6741d9;margin-bottom:.8mm\">Terzinin Notu</div><div style=\"margin:.4mm 0\">Kumaş kenarı: 52 cm</div><div style=\"margin:.4mm 0\">Yayların açıklığı: eşit</div><div style=\"margin:.4mm 0\">Açıklık: doğal sayı (cm)</div></div></div>", "son": "", "k": "Buna göre, yayların iki noktada kesişmesi için pergelin açıklığı <u style=\"white-space:nowrap\">en az</u> kaç santimetre olmalıdır?", "sec": ["26", "13", "27", "52"], "secg": null, "c": "C", "a": ["Yayların iki noktada kesişmesi için açıklık kenarın yarısından (26 cm) büyük olmalıdır.", "26'dan büyük en küçük doğal sayı 27'dir. (26: yaylar tek noktada değer; 13: dörtte bir alınmış; 52: kenarın tamamı alınmış, en az değil)"], "t": "", "d": "Açıklık kenarın tam yarısı olursa yaylar tek noktada değer; açıklık yarısından büyük olmalıdır.", "ses": "b08"}, {"no": 9, "on": "<p>Üçgen biçimindeki bir oyun alanının A köşesinden BC kenarına bir yürüyüş yolu yapılmıştır. Yol, BC kenarına diktir ve BC kenarını iki eş parçaya ayırmaktadır. Oyun alanının çevresine çit çekilecektir.</p>", "g": "<svg viewBox=\"0 0 214 234\" width=\"214\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"Liberation Sans, Arial, sans-serif\"><polygon points=\"106.9,42.5 38.9,170.0 174.9,170.0\" fill=\"#e7f6ea\" stroke=\"#8a5a00\" stroke-width=\"3\" stroke-linejoin=\"round\"/><line x1=\"106.9\" y1=\"42.5\" x2=\"106.9\" y2=\"170.0\" stroke=\"#d9480f\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><line x1=\"38.9\" y1=\"198.0\" x2=\"174.9\" y .3\" font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.4\" stroke-linejoin=\"round\" paint-order=\"stroke\">17 m</text></svg>", "son": "", "k": "Buna göre, kaç metre çit gerekir?", "sec": ["33", "50", "34", "66"], "secg": null, "c": "B", "a": ["Yol hem yükseklik hem kenarortaydır; alan bu yol boyunca katlanınca AB, AC'nin üstüne gelir: |AC| = |AB| = 17 m.", "Çevre = 17 + 17 + 16 = 50 m. (33: AC eklenmemiş; 34: taban eklenmemiş; 66: uzunluklar iki kez sayılmış)"], "t": "", "d": "Yol hem dik hem ortalıyorsa alanın iki kenarı eşittir; eşit kenarlar A'da birleşen kenarlardır.", "ses": "b09"}, {"no": 10, "on": "<p>Bir yelken atölyesinde kenar uzunlukları 2,8 m, 3,6 m ve 4 m olan üçgen bir yelken kesilmiştir. Atölye aynı ölçülerle ikinci bir yelken keserek başka bir tekneye takacaktır.</p>", "g": "<svg viewBox=\"0 0 202 155\" width=\"202\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"Liberation Sans, Arial, sans-serif\"><polygon points=\"81.5,42.7 40.7,116.1 160.7,116.1\" fill=\"#e7f1fb\" stroke=\"#111111\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><circle cx=\"81.5\" cy=\"42.7\" r=\"3.2\" fill=\"#111111\" stroke=\"#111111\" stroke-width=\"0\"/><circle cx=\"40.7\" cy=\"116.1\" r=\"3.2\" fill=\"#111111\" stroke=\"#111111\" stroke-width=\"0\"/><circle cx=\"160.7\" cy=\"116.1\" r=\"3.2\" fill=\"#111111\" stroke=\"#111111\" stroke-width=\"0\"/><text x=\"76.8\" y=\"30.5\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.4\" stroke-linejoin=\"round\" paint-order=\"stroke\">A</text><text x=\"23.8\" y=\"129.6\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.4\" stroke-linejoin=\"round\" paint-order=\"stroke\">B</text><text x=\"178.1\" y=\"128.3\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.4\" str roke-width=\"3.4\" stroke-linejoin=\"round\" paint-order=\"stroke\">2. atölye</text><g transform=\"translate(0.0 22.1)\"><polygon points=\"106.6,10.0 10.0,177.3 167.5,177.3\" fill=\"#fff0e6\" stroke=\"#d9480f\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><path d=\"M26.0 177.3 A16.0 16.0 0 0 0 18.0 163.5\" fill=\"none\" stroke=\"#111111\" stroke-width=\"1.5\"/><path d=\"M162.0 162.3 A16.0 16.0 0 0 0 151.5 177.3\" fill=\"none\" stroke=\"#111111\" stroke-width=\"1.5\"/><path d=\"M99.6 22.1 A14.0 14.0 0 0 0 111.4 23.2\" fill=\"none\" stroke=\"#111111\" stroke-width=\"1.5\"/><text x=\"39.9\" y=\"164.4\" font-size=\"12\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.4\" stroke-linejoin=\"round\" paint-order=\"stroke\">60°</text><text x=\"139.3\" y=\"161.9\" font-size=\"12\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.4\" stroke-linejoin=\"round\" paint-order=\"stroke\">70°</text><text x=\"103.8\" y=\"46.7\" font-size=\"12\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.4\" stroke-linejoin=\"round\" paint-order=\"stroke\">50°</text></g></g></svg>", "son": "", "k": "Buna göre, iki atölyenin bayrakları için aşağıdakilerden hangisi kesinlikle doğrudur?", "sec": ["Bayraklar üst üste konunca tam çakışır.", "Bayraklar aynı biçimde fakat farklı büyüklükte olabilir.", "Bayrakların kenar uzunlukları aynıdır.", "Bu açılarla üçgen çizilemez."], "secg": null, "c": "B", "a": ["Yalnız üç açı verilmiştir; hiçbir kenar verilmemiştir.", "Üç açı üçgenin büyüklüğünü belirlemez: aynı biçimde farklı büyüklükte bayraklar kesilebilir. (Tam çakışma ve aynı kenarlar: büyüklüğün belli olduğu sanılmış; çizilemez: açıların toplamı 180° olduğundan çizilebilir)"], "t": "", "d": "Yalnız üç açı verilince büyüklük belli değildir; aynı biçimde farklı büyüklükte üçgenler çizilebilir.", "ses": "b13"}, {"no": 14, "on": "<p>Bir terzi, kumaştan bir ABC üçgeni kesecektir. Önce 30 cm'lik [AB] kenarını çizmiş, B köşesinde AB ile 40°'lik açı yapan bir ışın çizmiştir. Üçüncü köşe C bu ışının üzerinde olacak ve |AC| = 22 cm olacaktır.</p>", "g": "<svg viewBox=\"0 0 323 192\" width=\"323\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"Liberation Sans, Arial, sans-serif\"><line x1=\"40.6\" y1=\"158.3\" x2=\"178.5\" y2=\"42.6\" stroke=\"#111111\" stroke-width=\"2.6\" stroke-linecap=\"round\"/><line x1=\"40.6\" y1=\"158.3\" x2=\"304.6\" y2=\"158.3\" stroke=\"#111111\" stroke-width=\"2.0\" stroke-linecap=\"round\"/><path d=\"M70.6 158.3 A30.0 30.0 0 0 0 63.5 139.0\" fill=\"none\" stroke=\"#111111\" stroke-width=\"1.5\"/><circle cx=\"178.5\" cy=\"42.6\" r=\"3.2\" fill=\"#111111\" stroke=\"#111111\" stroke-width=\"0\"/><circle cx=\"40.6\" cy=\"158.3\" r=\"3.2\" fill=\"#111111\" stroke=\"#111111\" stroke-width=\"0\"/><text x=\"86.9\" y=\"146.1\" font-size=\"13\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.4\" stroke-linejoin=\"round\" paint-order=\"stroke\">40°</text><text x=\"178.5\" y=\"29.7\" font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.4\" stroke-linejoin=\"round\" paint-order=\"stroke\">A</text><text x=\"23.4\" y=\"169.9\" font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.4\" stroke-linejoin=\"round\" paint-order=\"stroke\">B</text><text x=\"94.3\" y=\"87.3\" font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.4\" stroke-linejoin=\"round\" paint-order=\"stroke\">30 cm</text></svg>", "son": "", "k": "Buna göre, terzinin kesebileceği birbirinden farklı üçgen sayısı kaçtır?", "sec": ["2", "1", "0", "Sonsuz çok"], "secg": null, "c": "A", "a": ["C, A merkezli 22 cm yarıçaplı yay ile ışının kesişimidir.", "A'nın ışına uzaklığı 22 cm'den kısa, |AB| = 30 cm ise 22 cm'den uzundur; yay ışını B'den farklı iki noktada keser.", "İki farklı C noktası, iki farklı üçgen verir. (1: takımın yettiği sanılmış; 0: yayın ışına ulaşmadığı sanılmış; sonsuz çok: açının iki kenar arasında olmadığı için hiç belirlenmediği sanılmış)"], "t": "", "d": "Verilen açı iki kenarın arasında değildir; A merkezli yay ışını iki noktada kesebilir.", "ses": "b14"}, {"no": 15, "on": "<p>Bir sahnenin önündeki 8 m'lik düz şeridin iki ucuna birer ışık projektörü konmuştur. Projektörler şeritle verilen açıları yapacak biçimde sahneye doğru ışın göndermektedir. Görevli dört farklı ayar denemiştir.</p>", "g": "<div style=\"display:flex;flex-direction:column;align-items:center\"><p style=\"text-align:center;margin:0 0 1mm;font-size:10.6pt\"><b>Tablo:</b> Projektör Ayarları</p><table style=\"border-collapse:collapse;font-size:10.6pt\"><thead><tr><th style=\"border:.3mm solid #9b1c36;background:#fbeef0;padding:1.1mm 2.6mm;font-weight:700\">Ayar</th><th style=\"border:.3mm solid #9b1c36;background:#fbeef0;padding:1.1mm 2.6mm;font-weight:700\">Sol projektörün açısı</th><th style=\"border:.3mm solid #9b1c36;background:#fbeef0;padding:1.1mm 2.6mm;font-weight:700\">Sağ projektörün açısı</th></tr></thead><tbody><tr><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">1. ayar</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">85°</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">95°</td></tr><tr><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">2. ayar</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">100°</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">75°</td></tr><tr><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">3. ayar</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">60°</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">130°</td></tr><tr><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">4. ayar</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">110°</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">74°</td></tr></tbody></table></div>", "son": "<p>Işınların sahnede bir noktada buluştuğu ayarda iki ışın ve şerit bir üçgen oluşturmaktadır.</p>", "k": "Buna göre, ışınların buluştuğu ayarda buluşma noktasındaki açı kaç derecedir?", "sec": ["15", "175", "25", "5"], "secg": null, "c": "D", "a": ["İki ışının buluşması için şeridin uçlarındaki açıların toplamı 180°'den küçük olmalıdır: 180 (1. ayar), 175 (2. ayar), 190 (3. ayar), 184 (4. ayar).", "Yalnız 2. ayarda buluşurlar.", "Buluşma noktasındaki açı 180° − 175° = 5°'dir. (175: iki açının toplamı; 25: iki açının farkı; 15: yanlış ayar seçilmiş)"], "t": "", "d": "Uçlardaki açıların toplamı 180°'den küçükse ışınlar buluşur; buluşma açısı 180°'den bu toplam çıkarılarak bulunur.", "ses": "b15"}, {"no": 16, "on": "<p>Bir robotik kulübünde dört çizim robotuna, BC kenarı 9 cm olan farklı üçgenlerde A köşesinden BC'ye yükseklik inşa ettirilmiştir. Robotların çizdiği doğru parçasının BC'yi kestiği nokta H'dir. Öğrenciler çizimleri cetvel ve açıölçerle ölçüp tabloya yazmıştır.</p>", "g": "<div style=\"display:flex;flex-direction:column;align-items:center\"><p style=\"text-align:center;margin:0 0 1mm;font-size:10.6pt\"><b>Tablo:</b> Ölçüm Sonuçları</p><table style=\"border-collapse:collapse;font-size:10.6pt\"><thead><tr><th style=\"border:.3mm solid #9b1c36;background:#fbeef0;padding:1.1mm 2.6mm;font-weight:700\">Robot</th><th style=\"border:.3mm solid #9b1c36;background:#fbeef0;padding:1.1mm 2.6mm;font-weight:700\">|BH| (cm)</th><th style=\"border:.3mm solid #9b1c36;background:#fbeef0;padding:1.1mm 2.6mm;font-weight:700\">|HC| (cm)</th><th style=\"border:.3mm solid #9b1c36;background:#fbeef0;padding:1.1mm 2.6mm;font-weight:700\"><span class=\"nw\">m(AĤB)</span></th><th style=\"border:.3mm solid #9b1c36;background:#fbeef0;padding:1.1mm 2.6mm;font-weight:700\"><span class=\"nw\">m(AĤC)</span></th></tr></thead><tbody><tr><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">1. robot</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">3,1</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">5,9</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">90°</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">90°</td></tr><tr><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">2. robot</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">4</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">5</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">90°</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">90°</td></tr><tr><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">3. robot</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">2,6</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">6,4</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">88°</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">92°</td></tr><tr><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">4. robot</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">9</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">0</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">90°</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center\">90°</td></tr></tbody></table></div>", "son": "<p>4. robotun çizdiği üçgende B köşesindeki açı dik açıdır.</p>", "k": "Buna göre, hangi robotun çizdiği [AH] kesinlikle yükseklik değildir?", "sec": ["1. robot", "2. robot", "3. robot", "4. robot"], "secg": null, "c": "C", "a": ["Yükseklik BC'ye diktir; H noktasındaki iki açı 90° olmalıdır.", "3. robotta açılar 88° ve 92°'dir: [AH] dik değildir, yükseklik değildir.", "1. ve 2. robotta ayağın kenarın ortasında olmaması önemli değildir; 4. robotta ayağın köşede olması dik üçgende doğaldır. (2. robot: ayağın ortada olması gerektiği sanılmış; 4. robot: ayak köşede olamaz sanılmış)"], "t": "", "d": "Yükseklikte H noktasındaki iki açı 90°'dir; ayağın kenarın ortasında olması gerekmez.", "ses": "b16"}, {"no": 17, "on": "<p>Bir gölün kıyısındaki A iskelesinden karşı kıyıdaki düz BC kıyı şeridine üç farklı yaya köprüsü planlanmıştır. Köprülerden biri kıyı şeridine dik, biri kıyı şeridini iki eş parçaya ayıran noktaya giden, biri de A'daki açıyı iki eş açıya bölen köprüdür. Planlanan köprülerin uzunlukları 44 m, 47 m ve 53 m'dir; hangi uzunluğun hangi köprüye ait olduğu yazılmamıştır.</p>", "g": "<div style=\"display:flex;gap:3mm;justify-content:center;flex-wrap:wrap\"><div style=\"border:.45mm solid #0b7285;background:#e3f4f6;border-radius:2.4mm;padding:1.6mm 3.4mm;min-width:14mm;text-align:center;font-weight:700;font-size:12pt\">44 m</div><div style=\"border:.45mm solid #0b7285;background:#e3f4f6;border-radius:2.4mm;padding:1.6mm 3.4mm;min-width:14mm;text-align:center;font-weight:700;font-size:12pt\">47 m</div><div style=\"border:.45mm solid #0b7285;background:#e3f4f6;border-radius:2.4mm;padding:1.6mm 3.4mm;min-width:14mm;text-align:center;font-weight:700;font-size:12pt\">53 m</div></div>", "son": "<p>A iskelesi ile B ve C noktaları bir üçgenin köşeleridir ve bu üçgenin kenarları birbirinden farklıdır.</p>", "k": "Buna göre, kıyı şeridini iki eş parçaya ayıran noktaya giden köprünün uzunluğu kaç metredir?", "sec": ["44", "53", "47", "Belirlenemez"], "secg": null, "c": "B", "a": ["Kenarları farklı bir üçgende aynı köşeden çizilen elemanlar için yükseklik &lt; açıortay &lt; kenarortay sırası geçerlidir.", "En kısa köprü (44 m) dik olandır, 47 m açıortaydır; kenarortay en uzun olan 53 m'dir. (44: en kısa yol kenarortay sanılmış; 47: açıortay ile kenarortay karıştırılmış; belirlenemez: ölçerek görülen sıra kullanılmamış)"], "t": "", "d": "Kenarları farklı üçgende aynı köşeden çizilen elemanlardan yükseklik en kısa, kenarortay en uzundur.", "ses": "b17"}, {"no": 18, "on": "<p>Bir bahçede birbirinden 9 m uzaktaki B ve C noktalarında iki fıskiye vardır. Bahçıvan bir fidanı, B fıskiyesine 5 m ve C fıskiyesine 7 m uzaklıkta olacak biçimde dikecektir. Bahçe her yönde yeterince geniştir.</p>", "g": "<svg viewBox=\"0 0 313 84\" width=\"313\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"Liberation Sans, Arial, sans-serif\"><line x1=\"66.6\" y1=\"18.0\" x2=\"246.6\" y2=\"18.0\" stroke=\"#6b7385\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><line x1=\"66.6\" y1=\"48.0\" x2=\"246.6\" y2=\"48.0\" stroke=\"#6b7385\" stroke-width=\"1.2\"/><line x1=\"66.6\" y1=\"53.0\" x2=\"66.6\" y2=\"43.0\" stroke=\"#6b7385\" stroke-width=\"1.2\"/><line x1=\"246.6\" y1=\"53.0\" x2=\"246.6\" y2=\"43.0\" stroke=\"#6b7385\" stroke-width=\"1.2\"/><circle cx=\"66.6\" cy=\"18.0\" r=\"3.2\" fill=\"#1c6fb8\" stroke=\"#1c6fb8\" stroke-width=\"0\"/><circle cx=\"246.6\" cy=\"18.0\" r=\"3.2\" fill=\"#1c6fb8\" stroke=\"#1c6fb8\" stroke-width=\"0\"/><text x=\"156.6\" y=\"62.1\" font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.4\" stroke-linejoin=\"round\" paint-order=\"stroke\">9 m</text><text x=\"50.2\" y=\"28.7\" font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.4\" stroke-linejoin=\"round\" paint-order=\"stroke\">B fıskiyesi</text><text x=\"263.1\" y=\"28.7\" font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\"     if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
