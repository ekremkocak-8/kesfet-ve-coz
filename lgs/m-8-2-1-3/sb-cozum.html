<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çözümler · Keşfet ve Çöz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--muted:#5b6478;--line:#dfe5ef;--bg:#f5f7fb;--card:#fff;--ss:#6741d9;--kk:#0b7285;--b:#d0700f;--ok:#2b8a3e;--warn:#c92a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif}
header{background:linear-gradient(135deg,#1c5fbf,#2f8fe0);color:#fff;padding:18px 16px 22px}

main{max-width:780px;margin:14px auto 40px;padding:0 16px}
nav.sec{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}nav.sec button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}

ol.sec{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
ol.sec li{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}ol.sec li.dogru{border-color:var(--ok);background:#ebfbee;font-weight:800}
.adim{border-left:4px solid var(--c);padding:6px 12px;margin:8px 0;background:#fff;border-radius:0 10px 10px 0;animation:gel .35s ease-out}
.adim b{color:var(--c)}@keyframes gel{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dug{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
button.btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.dikkat{background:#fff4e6;border:2px solid #f59f00;border-radius:12px;padding:10px 14px;margin:12px 0 4px}.dikkat b{color:#d9480f}
.tuzak{font-size:15px;color:var(--muted);margin-top:8px}
.cevap{font-weight:900;color:var(--ok);margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid var(--line);padding:8px 10px;text-align:left}th{background:#e3fafc;color:#0b7285;font-size:13px;letter-spacing:.06em}
.ses{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border-radius:12px;background:#eef2ff}

.ses span{font-size:14px;color:var(--muted)}
.gizli{display:none}
.tum{margin:4px 0 14px;font-size:14px}.tum a{color:#1c5fbf;font-weight:800}
@media (prefers-reduced-motion:reduce){.adim{animation:none}}
/* Canlandır (05.10.2026) */
.sek{display:flex;gap:6px;margin:12px 0 0;border-bottom:2px solid var(--line)}
.sek button{border:0;background:none;font:inherit;font-weight:900;font-size:15px;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);min-height:44px;position:relative;top:2px;border-bottom:3px solid transparent}
.sek button[aria-selected=true]{color:var(--c);border-bottom-color:var(--c);background:#fff8f0}
.sek .yeni{display:inline-block;font-size:10px;background:#2b8a3e;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.06em}
.cn{padding-top:10px}
.cn-yon{background:#eef6ff;border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:10px}
.cn-sahne{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;min-height:120px;overflow-x:auto}

.cn-adimci input,.cn-test input{width:84px;height:44px;border:2px solid var(--line);border-radius:12px;font:inherit;font-weight:900;text-align:center;font-size:18px}
.cn-test label{font-weight:800;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.cn-btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
.cn-btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.cn-btn[aria-pressed=true]{background:var(--ac,var(--c));color:#fff;border-color:var(--ac,var(--c))}
.cn-btn:disabled{opacity:.5}
.cn-hazir{display:flex;flex-wrap:wrap;gap:6px}

.cn-dur .iyi{color:var(--ok);font-weight:900}.cn-dur .kotu{color:var(--warn);font-weight:900}
.cn-df{margin-top:10px;overflow-x:auto}@media(max-width:480px){.cn-adimci>span{flex-basis:100%}.cn-h{font-size:12px;padding:5px 0}.cn-izg{gap:3px}.cn-sahne{padding:6px}}@media(max-width:480px){.cn-df table{font-size:13px}.cn-df td,.cn-df th{padding:4px 5px}}.cn-df summary{font-weight:900;cursor:pointer;padding:6px 0}.cn-say{color:var(--muted);font-weight:700}
.cn-df table{font-size:15px}.cn-df td{padding:5px 8px}.cn-df tr.cn-iyi td{background:#ebfbee}.cn-df tr.cn-kotu td{background:#fff5f5}.cn-df tr.cn-son td{outline:2px solid var(--c);outline-offset:-2px}
.cn-p{animation:cnGel .35s ease-out both}@keyframes cnGel{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cn-o{fill:#ffa94d;stroke:#d9480f;stroke-width:1}.cn-o2{fill:#e8590c}.cn-k{fill:#ffc9c9;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:3 2}
.cn-cerceve{stroke:#2b8a3e;stroke-width:3}.cn-et{font-size:13px;font-weight:800;fill:#5b6478}.cn-et.b,.cn-et2b{font-weight:900;fill:#1d2433}.cn-et2{font-size:11px;fill:#5b6478;font-weight:700}.cn-et2b{font-size:13px;fill:#fff}
.cn-ku{fill:#fff4e6;stroke:#ffa94d;stroke-width:1.5}.cn-kk{fill:#fff5f5;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:4 3}
.cn-tahta0{fill:#f1f3f5;stroke:#ced4da}.cn-tahta{fill:#c08552;stroke:#8d5a2b}
.cn-ek{stroke:#868e96;stroke-width:2}.cn-sinir{stroke:#c92a2a;stroke-width:3;stroke-dasharray:5 4}.cn-yay{fill:none;stroke:#f76707;stroke-width:2}
.cn-v1{stroke:#2b8a3e;stroke-width:3}.cn-v2{stroke:#c92a2a;stroke-width:3}.cn-kis{font-size:20px}.cn-bus{font-size:16px}.cn-bek{stroke:#c92a2a;stroke-width:5;stroke-linecap:round;opacity:.6}
.cn-kum{fill:#ffe8cc;stroke:#e8590c;stroke-width:3}.cn-kum2{fill:#495057}.cn-para{fill:#ffd43b;opacity:.85}.cn-buyuk{font-size:26px;font-weight:900;fill:#1d2433}
.cn-zem{fill:#adb5bd}.cn-kat{fill:#f1f3f5;stroke:#ced4da}.cn-katon{fill:#d3f9d8;stroke:#2b8a3e}.cn-katoff{fill:#ffe3e3;stroke:#e03131}
.cn-izg{display:grid;gap:4px}.cn-h,.cn-gb{border-radius:8px;text-align:center;font-weight:800;font-size:14px;padding:6px 0}.cn-h{background:#f1f3f5;transition:background .25s,transform .25s}
.cn-gb{background:none;color:var(--muted);font-size:12px}.cn-h.on{background:#ffa94d;color:#1d2433}.cn-h.yeni{transform:scale(1.18);box-shadow:0 0 0 3px #e8590c}
.cn-kartlar{display:flex;flex-wrap:wrap;gap:6px;padding:4px}.cn-kart{min-width:44px;padding:8px 10px;text-align:center;border-radius:10px;background:#fff4e6;border:2px solid #ffa94d;font-weight:900;animation:cnGel .3s}
.cn-kart.kare{background:#e7f5ff;border-color:#1c7ed6}.cn-bosk{color:var(--muted)}
.cn-cift{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 4px;font-weight:800}.cn-cift i{font-weight:600;color:#1c7ed6}
.cn-katlar{padding:4px}.cn-katsat{display:inline-flex;flex-wrap:wrap;gap:6px}.cn-kat2{background:#e6fcf5;border:1.5px solid #12b886;border-radius:8px;padding:3px 8px;font-weight:800;animation:cnGel .3s}.cn-sonsuz{font-weight:800;color:#0b7285}
.cn-onr{background:#f8f0fc;border:2px solid #ae3ec9;border-radius:12px;padding:10px 14px}.cn-kanit{padding:10px 4px 2px}
.cn-kay{display:inline-flex;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap}.cn-kay{max-width:100%}.cn-kay input{width:min(220px,70vw);accent-color:#d0700f}.cn-satir>*{min-width:0;max-width:100%}
@media (prefers-reduced-motion:reduce){.cn-p,.cn-kart,.cn-kat2{animation:none}.cn-h{transition:none}}
/* 05.10.2026 · KOŞUL ve LABİRENT motorları (SB 6.1.1) */
@media(max-width:560px){.soru [style*="grid-template-columns:repeat"]{grid-template-columns:1fr!important}}   /* çok sütunlu konuşma balonları telefonda alt alta */
.cn-kl{list-style:none;padding:0;margin:0;display:grid;gap:4px}.cn-not{color:var(--muted);font-size:14px}.cn-sonuc{margin-top:6px;font-weight:800}
.cn-secg{gap:6px}.cn-secad{font-weight:800;flex-basis:100%}.cn-secg .cn-btn{padding:8px 12px}
.cn-mv{fill:#74c0fc;stroke:#1c7ed6;stroke-width:1}.cn-tl{fill:#69db7c;stroke:#2b8a3e;stroke-width:1.5}
.cn-lab{display:grid;gap:4px;align-items:center;max-width:460px;margin:0 auto}
.cn-lc{min-height:44px;border-radius:8px;border:1.5px solid #ced4da;background:#fff;font:inherit;font-weight:900;font-size:16px;cursor:pointer;padding:0;color:var(--ink)}
.cn-lc.yol{background:#d3f9d8;border-color:#2b8a3e}.cn-lc.simdi{background:#2b8a3e;color:#fff;box-shadow:0 0 0 3px #b2f2bb}.cn-lc.kapali{background:#ffe3e3;border-color:#e03131;color:#c92a2a;text-decoration:line-through}
.cn-lok{color:#2b8a3e;font-weight:900;text-align:center}.cn-lcik{min-height:44px;border:0;background:none;font:inherit;font-weight:900;color:#d9480f;cursor:pointer;padding:0;white-space:nowrap;font-size:14px}.cn-lcik:disabled{cursor:default}

</style></head><body>
<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }
      if (!art && !o.sandalye) sv += `<rect x="10" y="10" width="${gen * hc}" height="${sira * hc}" fill="none" class="cn-cerceve"/>
        <text x="${10 + gen * hc / 2}" y="${H + 4}" class="cn-et" text-anchor="middle">${gen} ${o.birim || ""}</text>
        <text x="${W + 4}" y="${10 + sira * hc / 2}" class="cn-et" dominant-baseline="middle">${sira} ${o.birim || ""}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W + 70} ${H + 22}" role="img" aria-label="${N} ${o.ad || "kare"}, her sırada ${gen}">${sv}</svg>`;
      const r = o.kural ? o.kural(gen, sira, art, N) : null;
      let m;
      if (art) m = `<span class="kotu">✘</span> ${N} ${o.ad || "kare"} her sırada ${gen} olacak biçimde dizilince ${sira} tam sıra oluşur, <b>${art} ${o.ad || "kare"} artar</b>. Dikdörtgen olmaz: ${N} : ${gen} işleminde kalan ${art}.`;
      else m = `<span class="iyi">✔</span> <b>${N} = ${gen} ${x} ${sira}</b> · ${sira} sıra, her sırada ${gen} ${o.ad || "kare"}; hiç artmadı.` + (gen === sira ? ` <b>Kare oldu!</b> İki kenar aynı: ${gen}.` : "");
      if (!art && o.cevre) m += ` Çevre = 2 ${x} (${gen} + ${sira}) = <b>${2 * (gen + sira)} m</b>.`;
      if (r && r.msg) m += `<br>${r.msg}`;
      s.dur.innerHTML = m;
      const sutunlar = o.satir ? o.satir(gen, sira, art, N, r) : [gen, art ? `${sira} (+ ${art} artan)` : sira, art, art ? "olmaz" : (gen === sira ? "kare" : "dikdörtgen")];
      s.yaz(N + ":" + gen, sutunlar, !art && (!r || r.ok !== false));
    }
    ciz(g.get());
  }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {
    const N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });
    const g = adimci(o.etiket, 1, o.max || N, o.bas || 2, v => { sonK = v; });

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {

      ciftler.innerHTML = L.filter(v => v * v <= N).map(v => `<span>${v} ${x} ${N / v}${v * v === N ? " <i>(aynı sayı: bir kez yazılır)</i>" : ""}</span>`).join("");

    const tamamMi = () => { for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) return false; return true; };
    const eksik = () => { const L = []; for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) L.push(i); return ` <br>Henüz denenmeyen küçük bölenler var: <b>${L.join(", ")}</b>. Bunları da deneyin.`; };
    function dene(d) {
      if (!d || d < 1) return; denendi.add(d);
      const b = Math.floor(N / d), r = N % d;
      if (d > N) { s.dur.innerHTML = `${d} > ${N}: ${E(N,"den")} büyük sayı ${E(N,"in")} çarpanı olamaz.`; return; }
      if (r === 0) { bul.add(d); bul.add(b); ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${N} : ${d} = ${b}, kalan 0 → <b>${d} ${x} ${b} = ${N}</b>. ${d} ve ${b} çarpandır.` + (d * d >= N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} ${d * d === N ? "=" : ">"} ${N}. Artık yeni çift çıkmaz; bütün çarpanlar bulundu.` : eksik() : ""); }
      else { s.dur.innerHTML = `<span class="kotu">✘</span> ${N} : ${d} işleminde bölüm ${b}, <b>kalan ${r}</b>. ${d}, ${E(N,"in")} çarpanı değildir.` + (d * d > N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} > ${N}. Daha büyük bölen denemeye gerek yok; çarpan listesi tamam.` : eksik() : ""); }
      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));
      if (tamam) s.yaz("n" + N, [N, [...bul].sort((a, b) => a - b).join(", "), bul.size], true);
    }
    bD.onclick = () => dene(Math.round(+bi.value));
    bS.onclick = () => { let d = 1; while (denendi.has(d)) d++; bi.value = d; dene(d); };
    if (bK) bK.onclick = async () => {
      bK.disabled = true; katlar.textContent = ""; const sat = h("div", "cn-katsat"); katlar.append(h("b", "", `${E(N,"in")} katları: `), sat);
      for (let i = 1; i <= (o.katSay || 12); i++) { sat.appendChild(h("span", "cn-kat2", `${N * i}`)); await bekle(220); }
      sat.appendChild(h("span", "cn-sonsuz", "… ve sonsuza kadar sürer"));
      bK.disabled = false;
    };
    yeni();
  }

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */
  function KUMBARA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Para", "Sonuç"] });
    const k = o.k; let hafta = 0, tmr = null;
    const kut = h("div", "cn-satir"); const bA = dug("Bir hafta geçsin +"), bO = dug("▶ Haftaları oynat", "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bO, bS); s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Kumbarada şu para olabilir mi? <input type="number" inputmode="numeric" min="1" max="500"> TL</label>`;
    const bT = dug("Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test); const ti = test.querySelector("input");
    function ciz() {
      const top = hafta * k, sv = [];
      const yuk = Math.min(150, top * 1.4);
      sv.push(`<rect x="110" y="20" width="120" height="160" rx="22" class="cn-kum"/><rect x="150" y="14" width="40" height="8" rx="3" class="cn-kum2"/>`);
      sv.push(`<rect x="116" y="${176 - yuk}" width="108" height="${yuk}" rx="10" class="cn-para"/>`);
      sv.push(`<text x="170" y="110" text-anchor="middle" class="cn-buyuk">${top} TL</text><text x="170" y="134" text-anchor="middle" class="cn-et">${hafta}. hafta</text>`);
      let cizgi = ""; for (let i = 1; i <= hafta && i <= 16; i++) cizgi += `<text x="${260 + ((i - 1) % 4) * 52}" y="${40 + Math.floor((i - 1) / 4) * 34}" class="cn-et2">${k}${x}${i}=${k * i}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 480 190" role="img" aria-label="Kumbara">${sv.join("")}${cizgi}</svg>`;
      s.dur.innerHTML = hafta ? `${hafta}. hafta sonunda kumbarada ${k} ${x} ${hafta} = <b>${top} TL</b> var.` : `Kumbara boş. Her hafta ${k} TL atılıyor.`;
    }
    bA.onclick = () => { hafta++; ciz(); };
    bO.onclick = () => { if (tmr) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } bO.textContent = "❚❚ Durdur"; tmr = setInterval(() => { if (hafta >= 15) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } hafta++; ciz(); }, az ? 50 : 500); };
    bS.onclick = () => { hafta = 0; ciz(); };
    bT.onclick = () => {
      const v = Math.round(+ti.value); if (!v) return; const b = Math.floor(v / k), r = v % k;
      s.dur.innerHTML = r ? `<span class="kotu">✘</span> ${k} ${x} ${b} = ${k * b} TL, ${k} ${x} ${b + 1} = ${k * (b + 1)} TL. ${v} TL arada kalır (${v} : ${k} → kalan ${r}). Kumbarada hiçbir hafta ${v} TL olmaz.`
        : `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · ${b}. hafta sonunda kumbarada tam ${v} TL olur.`;
      if (!r) { hafta = b; ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · <b>${b}. hafta</b> sonunda kumbarada tam ${v} TL olur.`; }
      s.yaz("t" + v, [v + " TL", r ? `kalan ${r} ✘` : `${k} ${x} ${b} ✔`], !r);
    };
    ciz();
  }

  /* 9) ÖNERME LABORATUVARI: önermeyi farklı sayılarla sınama */
  function ONERME(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Önerme", "Sayı", "Sonuç"] });
    let akt = 0; const kut = h("div", "cn-hazir");
    const bt = o.onermeler.map((on, i) => { const b = dug(on.ad, "ghost"); b.setAttribute("aria-pressed", i === 0); b.onclick = () => { akt = i; bt.forEach((x, j) => x.setAttribute("aria-pressed", j === i)); goster(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Sınanacak sayı: <input type="number" inputmode="numeric" min="1" max="200" value="12"></label>`;
    const bT = dug("Sına"), bR = dug("Rastgele sayı", "ghost"); test.append(bT, bR); s.den.appendChild(test); const ti = test.querySelector("input");
    function goster() { s.sah.innerHTML = `<div class="cn-onr"><b>${o.onermeler[akt].ad}:</b> “${o.onermeler[akt].metin}”</div>`; s.dur.innerHTML = "Bir sayı yazıp Sına düğmesine basın. Önerme her sayıda doğru mu?"; }
    function sina(n) {

      s.dur.innerHTML = (r.ok ? `<span class="iyi">✔</span> ${n} için önerme doğru.` : `<span class="kotu">✘</span> ${n} için önerme yanlış! Bir karşı örnek bulundu.`) + (r.not ? " " + r.not : "");
      s.yaz(akt + ":" + n, [on.ad, n, r.ok ? "doğru" : "yanlış (karşı örnek)"], r.ok);

  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →
     koşullar tek tek denetlenir (✔/✘) → deney defterine yazılır. Doğru cevap verilmez; öğrenci uygun girdiyi kendisi arar.
     o.girdi: [{ad, min, max, bas} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → SVG/HTML · o.kosullar: [{ad, f(v) → bool | {ok, not}}]
     o.dugme: düğme yazısı (false → her değişiklikte denetlenir) · o.sonuc(v, hepsi, L) · o.satir(v, hepsi, L) · o.iyi(v, L) · o.ek: [{ad, deger(v) → v}] */
  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);
      s.dur.innerHTML = m;
      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);
    }
    kur = true; ciz();
    if (bS) s.dur.innerHTML = o.ilk || "Değerleri seçip Sına düğmesine basın."; else sina();
  }

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

/* M.8.2.1.3 · Özdeşlikler · bağlam sorularının “Canlandır” düzenekleri (25.10.2026, ANA_KURALLAR §4.k, §19-10/11).
   Motorlar (K8, CN.k8Iskelet, CN.LAB, CN.DURUM) canlandir_8141.js ile aynıdır; ortak canlandir.js'e dokunulmaz.

.k8-satir{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}.cn-btn{min-width:44px;min-height:44px}

/* ---------------- yardımcılar ---------------- */
const K8 = (() => {
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const Q = (p, q = 1) => { if (q < 0) { p = -p; q = -q; } const g = gcd(p, q); return { p: p / g, q: q / g }; };
  const qp = (a, e) => { if (a === 0) return e > 0 ? Q(0) : null; return e >= 0 ? Q(a ** e) : Q(1, a ** (-e)); };   // a tam sayı
  const qpQ = (x, e) => e >= 0 ? Q(x.p ** e, x.q ** e) : Q(x.q ** (-e), x.p ** (-e));                                  // kesir taban
  const qEs = (x, y) => x && y && x.p === y.p && x.q === y.q;
  const qv = x => x.p / x.q;
  const sn = n => { if (typeof n === "bigint") { const s = (n < 0n ? -n : n).toString(); return (n < 0n ? "−" : "") + (s.length > 4 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, " ") : s); }
    if (typeof n !== "number") return String(n).replace(/-/g, "−"); const s = String(Math.abs(n)); return (n < 0 ? "−" : "") + (Math.abs(n) >= 10000 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, " ") : s); };
  const fr = (p, q) => `<span class="frac"><span>${p}</span><span>${q}</span></span>`;
  const qh = x => x === null ? "tanımsız" : x.q === 1 ? sn(x.p) : (x.p < 0 ? "−" : "") + fr(sn(Math.abs(x.p)), sn(x.q));
  const tb = a => typeof a === "number" && a < 0 ? `(${sn(a)})` : String(a);
  const us = (a, e) => `${tb(a)}<sup>${sn(e)}</sup>`;
  const UST = e => String(e).replace(/[−-]/g, "⁻").split("").map(c => c === "⁻" ? c : "⁰¹²³⁴⁵⁶⁷⁸⁹"[+c]).join("");
  const usU = (a, e) => `${typeof a === "number" && a < 0 ? `(${sn(a)})` : a}${UST(e)}`;
  const ondalik = (x, b = 1) => (Math.round(x * 10 ** b) / 10 ** b).toString().replace(".", ",");
  /* SVG kesir */
  const svgFr = (x, y, p, q, fs = 15, renk = "#1d2433") => `<text x="${x}" y="${y - fs * .2}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${renk}">${p}</text><line x1="${x - fs * .5}" y1="${y}" x2="${x + fs * .5}" y2="${y}" stroke="${renk}" stroke-width="${(fs * .08).toFixed(2)}"/><text x="${x}" y="${y + fs * .95}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${renk}">${q}</text>`;
  return { gcd, Q, qp, qpQ, qEs, qv, sn, fr, qh, tb, us, UST, usU, ondalik, svgFr };
})();

/* ---------------- ortak iskelet (canlandir.js ile aynı sınıflar) ---------------- */
CN.k8Iskelet = function (el, o) {
  const h = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.innerHTML = x; return e; };
  el.innerHTML = "";
  const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
  const sah = h("div", "cn-sahne"), den = h("div", "cn-den"), dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
  dur.setAttribute("aria-live", "polite");
  const df = h("details", "cn-df"); df.open = true;
  df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
  el.append(y, sah, den, dur, df);
  const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
  const yaz = (anahtar, hucre, iyi) => {
    if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
    kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
    tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
    tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
  };
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };
  return { h, sah, den, dur, yaz, dug, sayi: () => kayit.size, kayit };
};

/* ---------------- MOTOR: LAB (kuvvet laboratuvarı) ----------------
   o.girdi: [{ad, min, max, bas, adim?, yaz?} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → sahne (SVG/HTML) · o.durum(v) → sonuç metni
   o.satir(v) → deney defteri satırı (null: yazılmaz) · o.iyi(v) → yeşil/kırmızı satır · o.anahtar(v) · o.hazir: [{ad, v:[…]}] */
CN.LAB = function (el, o) {
  const s = CN.k8Iskelet(el, o), v = o.girdi.map(g => g.bas), ayar = [];
  o.girdi.forEach((g, i) => {
    const w = s.h("div", "cn-satir");
    if (g.sec) {
      w.classList.add("cn-secg"); w.appendChild(s.h("span", "cn-secad", g.ad));
      const bs = g.sec.map(x => { const b = s.dug(g.yaz ? g.yaz(x) : K8.sn(x), "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
      const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); guncelle(); };
      ayar[i] = sec;
    } else {
      const adim = g.adim || 1, ond = adim % 1 !== 0, yz = g.yaz || (x => ond ? K8.ondalik(x) : K8.sn(x));
      const a = s.h("div", "cn-adimci");
      a.innerHTML = `<span>${g.ad}</span><button type="button" aria-label="${g.ad.replace(/<[^>]+>/g, "")} azalt">−</button>${ond || g.yaz ? `<output></output>` : `<input type="number" inputmode="numeric" min="${g.min}" max="${g.max}" aria-label="${g.ad.replace(/<[^>]+>/g, "")}">`}<button type="button" aria-label="${g.ad.replace(/<[^>]+>/g, "")} artır">+</button>`;
      const [b1, b2] = a.querySelectorAll("button"), inp = a.querySelector("input"), out = a.querySelector("output");
      const kur = x => { x = Math.max(g.min, Math.min(g.max, Math.round((+x) / adim) * adim)); if (isNaN(x)) x = g.min; x = +x.toFixed(4); v[i] = x; if (inp) inp.value = x; else out.innerHTML = yz(x); };
      const ata = x => { kur(x); guncelle(); };
      b1.onclick = () => ata(v[i] - adim); b2.onclick = () => ata(v[i] + adim);
      if (inp) inp.onchange = () => ata(String(inp.value).replace(",", "."));
      kur(g.bas); ayar[i] = ata; w.appendChild(a);
    }
    s.den.appendChild(w);
  });
  if (o.hazir) { const hz = s.h("div", "cn-hazir cn-secg"); if (o.hazirEt) hz.appendChild(s.h("span", "cn-secad", o.hazirEt)); o.hazir.forEach(x => { const b = s.dug(x.ad, "ghost"); b.onclick = () => { x.v.forEach((y, i) => { if (y != null) { v[i] = y; } }); x.v.forEach((y, i) => { if (y != null) ayar[i](y); }); }; hz.appendChild(b); }); s.den.appendChild(hz); }
  let hazir = false;
  function guncelle() {
    if (!hazir) return;
    const c = v.slice(); s.sah.innerHTML = o.ciz(c, s); s.dur.innerHTML = o.durum(c, s);
    const r = o.satir ? o.satir(c, s) : null;
    if (r) s.yaz(o.anahtar ? o.anahtar(c) : c.join("|"), r, o.iyi ? o.iyi(c) : undefined);
    if (o.sonra) o.sonra(c, s);
  }
  hazir = true; guncelle();
  return { v, ayar, s };
};

/* ---------------- MOTOR: DURUM (düğmelerle adım adım değişen durum) ----------------
   o.bas(secim) → başlangıç durumu · o.dugmeler: [{ad, f(d) → {d, msg} }] · o.ciz(d) · o.durum(d) · o.bitti(d) → {anahtar, hucre, iyi, msg} | null
   o.secim: {ad, sec, bas, yaz} (başlangıcı seçtirir; değişince düzenek baştan kurulur) */
CN.DURUM = function (el, o) {
  const s = CN.k8Iskelet(el, o); let sec = o.secim ? o.secim.bas : null, d = o.bas(sec), son = "", kapali = false;
  if (o.secim) {
    const w = s.h("div", "cn-satir cn-secg"); w.appendChild(s.h("span", "cn-secad", o.secim.ad));
    const bs = o.secim.sec.map(x => { const b = s.dug(o.secim.yaz ? o.secim.yaz(x) : K8.sn(x), "ghost"); b.setAttribute("aria-pressed", x === sec); b.onclick = () => { sec = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", o.secim.sec[j] === x)); bastan(); }; w.appendChild(b); return b; });
    s.den.appendChild(w);
  }
  const w = s.h("div", "cn-satir");
  const bt = o.dugmeler.map(g => { const b = s.dug(g.ad, g.ghost ? "ghost" : ""); b.onclick = () => { if (kapali) return; const r = g.f(d); if (r.d) d = r.d; son = r.msg || ""; ciz(); }; w.appendChild(b); return b; });
  const bB = s.dug("Baştan", "ghost"); bB.onclick = () => bastan(); w.appendChild(bB); s.den.appendChild(w);
  function bastan() { d = o.bas(sec); son = ""; kapali = false; ciz(); }
  function ciz() {
    s.sah.innerHTML = o.ciz(d, sec); let m = (son ? son + "<br>" : "") + o.durum(d, sec);
    const b = o.bitti ? o.bitti(d, sec) : null;
    if (b) { kapali = !!b.kapat; s.yaz(b.anahtar, b.hucre, b.iyi); if (b.msg) m += "<br>" + b.msg; }
    bt.forEach(x => x.disabled = kapali);
    s.dur.innerHTML = m;
  }
  ciz();
};

/* ---------------- alan modeli çizici (cizim8213.model ile aynı mantık: birim uzunluklardan ölçekli) ----------------
   P: [{x,y,w,h,r:"m"|"t"|"p"|"c"|"g",ad,bos,tarali,kesik}] · O: [[kenar,a,b,metin,konum?]] kenar ∈ ust/alt/sol/sag · o: {W, maxH} */
const AM = (() => {
  const RN = { m: ["#1c6fbf", "#d6e6f8"], t: ["#d9480f", "#ffe3d1"], p: ["#6d3fc0", "#e6dcf7"], c: ["#0b7285", "#d3eef2"], g: ["#495057", "#e9ecef"] };
  let pid = 0;
  const T = (x, y, s, fs = 15, anc = "middle") => `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${fs}" font-weight="800" text-anchor="${anc}" fill="#111" stroke="#fff" stroke-width="3" paint-order="stroke">${s}</text>`;
  function alanS(P, O = [], o = {}) {
    const xs = P.flatMap(p => [p.x, p.x + p.w]), ys = P.flatMap(p => [p.y, p.y + p.h]);
    const X0 = Math.min(...xs), X1 = Math.max(...xs), Y0 = Math.min(...ys), Y1 = Math.max(...ys);
    const sol = O.some(k => k[0] === "sol") ? 70 : 12, sag = O.some(k => k[0] === "sag") ? 70 : 12, ust = O.some(k => k[0] === "ust") ? 34 : 12, alt = O.some(k => k[0] === "alt") ? 34 : 12;
    const W = o.W || 360, maxH = o.maxH || 300;
    const b = Math.min((W - sol - sag) / (X1 - X0), (maxH - ust - alt) / (Y1 - Y0));
    const PX = x => sol + (x - X0) * b, PY = y => ust + (y - Y0) * b; let s = "", d = "";
    P.forEach(p => {
      const r = RN[p.r || "m"]; let f = p.bos ? "#fff" : r[1];
      if (p.tarali && !p.bos) { const id = "am" + (++pid); d += `<pattern id="${id}" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fff"/><line x1="0" y1="0" x2="0" y2="7" stroke="${r[0]}" stroke-width="2.2" stroke-opacity=".55"/></pattern>`; f = `url(#${id})`; }
      s += `<rect x="${PX(p.x).toFixed(1)}" y="${PY(p.y).toFixed(1)}" width="${(p.w * b).toFixed(1)}" height="${(p.h * b).toFixed(1)}" fill="${f}" stroke="${p.kesik ? r[0] : "#111"}" stroke-width="1.5" ${p.kesik ? 'stroke-dasharray="6 4"' : ""}/>`;
    });
    P.forEach(p => { if (p.ad && p.w * b > 18 && p.h * b > 16) s += T(PX(p.x + p.w / 2), PY(p.y + p.h / 2) + 5, p.ad, Math.min(15, p.h * b - 2)); });
    O.forEach(([k, a, c, m, kon]) => {
      if (k === "ust" || k === "alt") { const yy = PY(kon != null ? kon : (k === "ust" ? Y0 : Y1)) + (k === "ust" ? -12 : 12), x1 = PX(a), x2 = PX(c);
        s += `<line x1="${x1}" y1="${yy}" x2="${x2}" y2="${yy}" stroke="#333" stroke-width="1.1"/><line x1="${x1}" y1="${yy - 4}" x2="${x1}" y2="${yy + 4}" stroke="#333"/><line x1="${x2}" y1="${yy - 4}" x2="${x2}" y2="${yy + 4}" stroke="#333"/>` + T((x1 + x2) / 2, k === "ust" ? yy - 5 : yy + 17, m);
      } else { const xx = PX(kon != null ? kon : (k === "sol" ? X0 : X1)) + (k === "sol" ? -12 : 12), y1 = PY(a), y2 = PY(c);
        s += `<line x1="${xx}" y1="${y1}" x2="${xx}" y2="${y2}" stroke="#333" stroke-width="1.1"/><line x1="${xx - 4}" y1="${y1}" x2="${xx + 4}" y2="${y1}" stroke="#333"/><line x1="${xx - 4}" y1="${y2}" x2="${xx + 4}" y2="${y2}" stroke="#333"/>` + T(k === "sol" ? xx - 6 : xx + 6, (y1 + y2) / 2 + 5, m, 15, k === "sol" ? "end" : "start"); }
    });
    const Wt = PX(X1) + sag, Ht = PY(Y1) + alt;
    return `<svg class="gr" viewBox="0 0 ${Wt.toFixed(0)} ${Ht.toFixed(0)}" style="max-width:${Wt.toFixed(0)}px"><defs>${d}</defs>${s}</svg>`;
  }
  const kare4 = (a, b, adlar, la, lb) => alanS([{ x: 0, y: 0, w: a, h: a, r: "m", ad: adlar[0] }, { x: a, y: 0, w: b, h: a, r: "t", ad: adlar[1] }, { x: 0, y: a, w: a, h: b, r: "t", ad: adlar[2] }, { x: a, y: a, w: b, h: b, r: "p", ad: adlar[3] }],
    [["ust", 0, a, la], ["ust", a, a + b, lb], ["sol", 0, a, la], ["sol", a, a + b, lb]]);
  const yanyana = (...L) => `<div class="k8-satir" style="align-items:flex-end">${L.map(x => `<div style="flex:1 1 150px;max-width:260px">${x}</div>`).join("")}</div>`;
  return { alanS, kare4, yanyana };
})();

window.CANL = (() => {

  const sn = K8.sn, { alanS, kare4, yanyana } = AM;

  const C = {};

    sutun: ["x", "(x + 6)²", "x² + 12x + 36", "x² + 36"], girdi: [{ ad: "x =", min: 1, max: 15, bas: 4 }],

    durum: ([a]) => { const k = 2 * a - 3; return `(2a − 3)² = ${k}² = <b>${k * k}</b>; 4a² − 12a + 9 = <b>${4 * a * a - 12 * a + 9}</b> ` + iyi("hep eşit") + `; 4a² − 9 = ${4 * a * a - 9} ` + kotu("farklı"); },

  const E4 = [["I", "(x + 1)²", "x² + 2x + 1", x => (x + 1) ** 2, x => x * x + 2 * x + 1], ["II", "(x − 2)(x + 2)", "x² − 4", x => (x - 2) * (x + 2), x => x * x - 4],
              ["III", "(x − 1)²", "x² − 1", x => (x - 1) ** 2, x => x * x - 1], ["IV", "(2 − x)²", "(x − 2)²", x => (2 - x) ** 2, x => (x - 2) ** 2]];
  C[4] = L({ yon: "Bir eşitlik ve bir x değeri seçin; iki tarafın değeri hesaplanır. İki tarafı farklı çıkaran değer karşı örnektir.", bitis: "Karşı örneği olan eşitliği bulduğunuzda.",

  /* 7 · fayans (3x + 2)² */
  C[7] = L({ yon: "x değerini değiştirin; salon büyük, şerit ve küçük fayanslarla döşenir. Fayans sayılarını izleyin.", bitis: "Şerit fayans sayısının x'e bağlı olmadığını gördüğünüzde.",

    satir: ([x]) => [x, 4 * x * x + 12 * x + 9, 2 * x + 3, (2 * x + 3) ** 2] });

  /* 7 · mutfak ve kilerler: toplam x² */
  C[7] = L({ yon: "x değerini değiştirin. Mutfak (x − 2)², kilerler 2 · x ve 2 · (x − 2) olarak hesaplanır.", bitis: "Toplamın hep x² olduğunu gördüğünüzde.",
    sutun: ["x", "Mutfak", "Kilerler", "Toplam", "x²"], girdi: [{ ad: "x =", min: 3, max: 12, bas: 6 }],
    ciz: ([x]) => alanS([{ x: 0, y: 0, w: x - 2, h: x - 2, r: "m", ad: "mutfak" }, { x: x - 2, y: 0, w: 2, h: x, r: "t", ad: "kiler" }, { x: 0, y: x - 2, w: x - 2, h: 2, r: "p", ad: "kiler" }], [["ust", 0, x - 2, `${x - 2}`], ["ust", x - 2, x, "2"], ["sag", 0, x, `${x}`]], { maxH: 240 }),
    durum: ([x]) => `${(x - 2) ** 2} + ${2 * x} + ${2 * (x - 2)} = <b>${(x - 2) ** 2 + 4 * x - 4}</b> m² ` + iyi(`= ${x}² (kenarı ${x} m olan kare)`),
    satir: ([x]) => [x, (x - 2) ** 2, 4 * x - 4, (x - 2) ** 2 + 4 * x - 4, x * x] });

  /* 8 · taksit: n² − (n − 4)(n + 4) */
  C[8] = L({ yon: "n değerini değiştirin. Ali'nin ve Veli'nin ödediği toplam tutarlar (yüz TL) hesaplanır.", bitis: "Farkın n'ye bağlı olmadığını gördüğünüzde.",
    sutun: ["n", "Ali (yüz TL)", "Veli (yüz TL)", "Fark (TL)"], girdi: [{ ad: "n =", min: 5, max: 20, bas: 8 }],
    ciz: ([n]) => yanyana(alanS([{ x: 0, y: 0, w: n - 4, h: n + 4, r: "t", ad: "Ali" }], [["ust", 0, n - 4, `${n - 4} ay`], ["sol", 0, n + 4, `${n + 4}`]], { W: 200, maxH: 220 }), alanS([{ x: 0, y: 0, w: n, h: n, r: "m", ad: "Veli" }], [["ust", 0, n, `${n} ay`], ["sol", 0, n, `${n}`]], { W: 200, maxH: 220 })),
    durum: ([n]) => `Ali ${(n - 4) * (n + 4)} yüz TL, Veli ${n * n} yüz TL; fark ${n * n - (n - 4) * (n + 4)} yüz TL = <b>${sn(100 * (n * n - (n - 4) * (n + 4)))}</b> TL`,
    satir: ([n]) => [n, (n - 4) * (n + 4), n * n, sn(1600)] });

  /* 9 · katla-kes: a² − (2b)² */
  C[9] = L({ yon: "a ve b değerlerini değiştirin. Dört katlı kâğıttan kesilen b kenarlı kare, açılınca kenarı 2b olan bir delik oluşturur.", bitis: "Kalan alanın a² − 4b² olduğunu gördüğünüzde.",
    sutun: ["a", "b", "Delik", "Kalan", "a² − 4b²"], girdi: [{ ad: "a =", min: 8, max: 20, bas: 12 }, { ad: "b =", min: 1, max: 3, bas: 2 }],
    ciz: ([a, b]) => alanS([{ x: 0, y: 0, w: a, h: a, r: "c" }, { x: a / 2 - b, y: a / 2 - b, w: 2 * b, h: 2 * b, r: "g", bos: true, kesik: true }], [["ust", 0, a, `${a} cm`], ["alt", a / 2 - b, a / 2 + b, `${2 * b}`, a / 2 + b]], { maxH: 240 }),
    durum: ([a, b]) => `${a * a} − ${(2 * b) ** 2} = <b>${a * a - 4 * b * b}</b> cm²` + (a * a - b * b !== a * a - 4 * b * b ? `; tek kat kesilseydi ${a * a - b * b} olurdu.` : ""),
    satir: ([a, b]) => [a, b, (2 * b) ** 2, a * a - 4 * b * b, a * a - 4 * b * b] });

  /* 10 · geometri tahtası: 9(x + 1)² − 9x² */
  C[10] = L({ yon: "Çivi aralığını (x) değiştirin. İki tahtadaki karelerin kenarları 3x ve 3(x + 1)'dir.", bitis: "Farkın 18x + 9 ile hep aynı çıktığını gördüğünüzde.",
    sutun: ["x", "1. kare", "2. kare", "Fark", "18x + 9"], girdi: [{ ad: "x =", min: 1, max: 6, bas: 2 }],
    ciz: ([x]) => yanyana(alanS([{ x: 0, y: 0, w: 3 * x, h: 3 * x, r: "p" }], [["ust", 0, 3 * x, `${3 * x} cm`]], { W: 200, maxH: 200 }), alanS([{ x: 0, y: 0, w: 3 * x + 3, h: 3 * x + 3, r: "p" }], [["ust", 0, 3 * x + 3, `${3 * x + 3} cm`]], { W: 220, maxH: 220 })),
    durum: ([x]) => `${(3 * x + 3) ** 2} − ${9 * x * x} = <b>${(3 * x + 3) ** 2 - 9 * x * x}</b>; 18x + 9 = ${18 * x + 9} ` + iyi("aynı."),
    satir: ([x]) => [x, 9 * x * x, (3 * x + 3) ** 2, (3 * x + 3) ** 2 - 9 * x * x, 18 * x + 9] });

  /* 11 · uygulama: A + B = 9 */
  C[11] = L({ yon: "A sayısını değiştirin; B = 9 − A olur. Üç tuşun sonuçları hesaplanır. Ç tuşunun 14 verdiği durumu arayın.", bitis: "Ç = 14 iken F tuşunun sonucunu bulduğunuzda.",
    sutun: ["A", "B", "T: A² + B²", "Ç: A · B", "F: (A − B)²"], girdi: [{ ad: "A =", min: 0, max: 9, bas: 4 }],
    ciz: ([a]) => { const b = 9 - a; return `<div class="k8-satir"><span class="k8-kart">T = ${a * a + b * b}</span><span class="k8-kart" style="--kr:#1c6fbf">Ç = ${a * b}</span><span class="k8-kart" style="--kr:#6d3fc0">F = ${(a - b) ** 2}</span></div>`; },
    durum: ([a]) => { const b = 9 - a; return `A = ${a}, B = ${b}: 81 − 4 · ${a * b} = ${81 - 4 * a * b} = (A − B)² ` + (a * b === 14 ? iyi(`Ç = 14; F = <b>${(a - b) ** 2}</b>.`) : kotu("Ç tuşu 14 vermiyor.")); },
    satir: ([a]) => { const b = 9 - a; return [a, b, a * a + b * b, a * b, (a - b) ** 2]; }, iyi: ([a]) => a * (9 - a) === 14 });

  /* 12 · üst üste kareler */
  C[12] = L({ yon: "x değerini değiştirin. Mor ve turuncu kartların görünen kısımları hesaplanır.", bitis: "Farkın hep 8 olduğunu gördüğünüzde.",
    sutun: ["x", "Mor görünen", "Turuncu görünen", "Fark"], girdi: [{ ad: "x =", min: 1, max: 10, bas: 3 }],
    ciz: ([x]) => alanS([{ x: 0, y: 0, w: x + 4, h: x + 4, r: "p" }, { x: 0, y: 2, w: x + 2, h: x + 2, r: "t" }, { x: 0, y: 4, w: x, h: x, r: "m" }], [["ust", 0, x + 4, `${x + 4}`], ["alt", 0, x, `${x}`]], { maxH: 240 }),
    durum: ([x]) => `Mor ${(x + 4) ** 2} − ${(x + 2) ** 2} = ${4 * x + 12}, turuncu ${(x + 2) ** 2} − ${x * x} = ${4 * x + 4}; fark <b>8</b>`,
    satir: ([x]) => [x, 4 * x + 12, 4 * x + 4, 8] });

  /* 13 · çit: (x + 3)² − (x + 7)(x − 1) */
  C[13] = L({ yon: "x değerini değiştirin. Eski bahçenin çevresiyle aynı uzunlukta çit, kenarı x + 3 olan kare bahçeyi çevirir.", bitis: "Alan farkının hep 16 olduğunu gördüğünüzde.",
    sutun: ["x", "Çit", "Eski alan", "Yeni alan", "Fark"], girdi: [{ ad: "x =", min: 2, max: 12, bas: 5 }],
    ciz: ([x]) => yanyana(alanS([{ x: 0, y: 0, w: x + 7, h: x - 1, r: "c" }], [["ust", 0, x + 7, `${x + 7}`], ["sol", 0, x - 1, `${x - 1}`]], { W: 220, maxH: 200 }), alanS([{ x: 0, y: 0, w: x + 3, h: x + 3, r: "m" }], [["ust", 0, x + 3, `${x + 3}`]], { W: 180, maxH: 200 })),
    durum: ([x]) => `Çit ${4 * x + 12} m. ${(x + 3) ** 2} − ${(x + 7) * (x - 1)} = <b>16</b> m²`,
    satir: ([x]) => [x, 4 * x + 12, (x + 7) * (x - 1), (x + 3) ** 2, 16] });

  /* 14 · börek: 3t² − 20 = 1 180 */
  C[14] = L({ yon: "t değerini değiştirin. Üç börekten elde edilen gelir hesaplanır; gelir 1 180 TL olduğunda dur.", bitis: "Gelirin 1 180 TL olduğu t değerini bulduğunuzda.",
    sutun: ["t", "Peynirli", "Patatesli", "Ispanaklı", "Gelir"], girdi: [{ ad: "t =", min: 5, max: 30, bas: 12 }],
    ciz: ([t]) => alanS([{ x: 0, y: 0, w: t + 2, h: t - 2, r: "t", ad: "peynirli" }, { x: t + 3, y: 0, w: t + 4, h: t - 4, r: "p", ad: "patatesli" }, { x: 2 * t + 8, y: 0, w: t, h: t, r: "c", ad: "ıspanaklı" }], [], { W: 420, maxH: 200 }),
    durum: ([t]) => { const g = (t + 2) * (t - 2) + (t + 4) * (t - 4) + t * t; return `Gelir = 3 · ${t * t} − 20 = <b>${sn(g)}</b> TL ` + (g === 1180 ? iyi(`1 180 TL. Ispanaklı börek ${t} TL.`) : g < 1180 ? kotu("az") : kotu("fazla")); },
    satir: ([t]) => [t, (t + 2) * (t - 2), (t + 4) * (t - 4), t * t, sn((t + 2) * (t - 2) + (t + 4) * (t - 4) + t * t)], iyi: ([t]) => 3 * t * t - 20 === 1180 });

  /* 15 · halı: b − a = 3, ab = 70 */
  C[15] = L({ yon: "Kısa kenarı (a) değiştirin; uzun kenar a + 3 olur. Alanın 70 m² olduğu durumu bulun ve iki kare halının alanlarını toplayın.", bitis: "Alan 70 iken kare halıların toplamını bulduğunuzda.",
    sutun: ["a", "a + 3", "Alan", "a² + (a + 3)²", "9 + 2 · alan"], girdi: [{ ad: "a =", min: 1, max: 12, bas: 4 }],
    ciz: ([a]) => yanyana(alanS([{ x: 0, y: 0, w: a + 3, h: a, r: "t", ad: `${a * (a + 3)}` }], [["ust", 0, a + 3, `${a + 3}`], ["sol", 0, a, `${a}`]], { W: 200, maxH: 180 }),
      alanS([{ x: 0, y: 0, w: a, h: a, r: "m", ad: `${a * a}` }], [["ust", 0, a, `${a}`]], { W: 140, maxH: 180 }), alanS([{ x: 0, y: 0, w: a + 3, h: a + 3, r: "p", ad: `${(a + 3) ** 2}` }], [["ust", 0, a + 3, `${a + 3}`]], { W: 180, maxH: 180 })),
    durum: ([a]) => `Alan ${a * (a + 3)} m². a² + (a + 3)² = ${a * a + (a + 3) ** 2} = 9 + 2 · ${a * (a + 3)} ` + (a * (a + 3) === 70 ? iyi(`Alan 70: kare halılar <b>${a * a + (a + 3) ** 2}</b> m².`) : kotu("alan 70 değil")),
    satir: ([a]) => [a, a + 3, a * (a + 3), a * a + (a + 3) ** 2, 9 + 2 * a * (a + 3)], iyi: ([a]) => a * (a + 3) === 70 });

  /* 16 · ayna çerçevesi: ((x + 6)² − (x − 2)²) : 4 */
  C[16] = L({ yon: "x değerini değiştirin. Dört eş tahtanın toplam alanı dış kare ile iç karenin farkıdır; bir tahta bunun dörtte biridir.", bitis: "Bir tahtanın 4x + 8 olduğunu gördüğünüzde.",
    sutun: ["x", "Dört tahta", "Bir tahta", "4x + 8"], girdi: [{ ad: "x =", min: 3, max: 12, bas: 5 }],

    satir: ([x]) => { const t = (x + 6) ** 2 - (x - 2) ** 2; return [x, t, t / 4, 4 * x + 8]; } });

  return C;

imetrekare cinsinden veren ifade aşağıdakilerden hangisidir?", "sec": ["64a<sup>2</sup> − 64", "8a<sup>2</sup> − 16a + 8", "64a<sup>2</sup> − 16a + 64", "64a<sup>2</sup> − 128a + 64"], "secg": null, "c": "D", "a": ["Tahtanın bir kenarı 8(a − 1) = 8a − 8 cm'dir.", "Alan (8a − 8)<sup>2</sup> = 64a<sup>2</sup> − 2 · 8a · 8 + 64 = 64a<sup>2</sup> − 128a + 64 cm<sup>2</sup>. (Ya da 64 · (a − 1)<sup>2</sup> = 64(a<sup>2</sup> − 2a + 1).)"], "t": "64a<sup>2</sup> − 64: iki kare farkı sanılmış; 8a<sup>2</sup> − 16a + 8: 8 ile kare değil kenar çarpılmış; 64a<sup>2</sup> − 16a + 64: ortadaki terim yanlış", "d": "Tahtanın kenarı bir bölmenin kenarının 8 katıdır: 8(a − 1). Karesi alınırken 8 de karesiyle (64) çarpılır.", "ses": "b02"}, {"no": 3, "on": "<p>Bir sinema salonunda koltuklar sıralar hâlinde dizilmiştir. Salonda (s + 6) sıra vardır ve her sırada (s − 6) koltuk bulunmaktadır.</p>", "g": "<div style=\"display:flex;flex-direction:column;align-items:center\"><p style=\"text-align:center;margin:0 0 1mm;font-size:10.6pt\"><b>Tablo:</b> Salon Düzeni</p><table style=\"border-collapse:collapse;font-size:10.6pt\"><thead><tr><th style=\"border:.3mm solid #1c6fbf;background:#e7f0fb;padding:1.1mm 2.6mm;font-weight:700\">Sıra sayısı</th><th style=\"border:.3mm solid #1c6fbf;background:#e7f0fb;padding:1.1mm 2.6mm;font-weight:700\">Bir sıradaki koltuk sayısı</th></tr></thead><tbody><tr><td style=\"border:.3mm solid #1c6fbf;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">s + 6</td><td style=\"border:.3mm solid #1c6fbf;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">s − 6</td></tr></tbody></table></div>", "son": "<p>Bütün sıralardaki koltuk sayısı eşittir.</p>", "k": "Buna göre, salondaki koltukların sayısını veren ifade aşağıdakilerden hangisidir?", "sec": ["s<sup>2</sup> − 36", "s<sup>2</sup> + 36", "s<sup>2</sup> − 12s + 36", "s<sup>2</sup> − 6"], "secg": null, "c": "A", "a": ["Koltuk sayısı = sıra sayısı · bir sıradaki koltuk sayısı = (s + 6)(s − 6).", "İki kare farkı: s<sup>2</sup> − 6<sup>2</sup> = s<sup>2</sup> − 36."], "t": "s<sup>2</sup> + 36: işaret hatası; s<sup>2</sup> − 12s + 36: farkın karesi sanılmış; s<sup>2</sup> − 6: 6'nın karesi alınmamış", "d": "Koltuk sayısı sıra sayısı ile bir sıradaki koltuk sayısının çarpımıdır. (s + 6)(s − 6) iki kare farkıdır; ortada terim kalmaz.", "ses": "b03"}, {"no": 4, "on": "<p>Bir fidanlıkta fidanlar, her sırada 99 fidan olacak şekilde 99 sıra hâlinde dikilmiştir. Bahçıvan fidanların sayısını, 99'u 100'den 1 eksik olarak düşünüp farkın karesi özdeşliğiyle hesaplamıştır.</p>", "g": "<div style=\"display:flex;flex-direction:column;align-items:center\"><p style=\"text-align:center;margin:0 0 1mm;font-size:10.6pt\"><b>Tablo:</b> Fidanlık</p><table style=\"border-collapse:collapse;font-size:10.6pt\"><thead><tr><th style=\"border:.3mm solid #1c6fbf;background:#e7f0fb;padding:1.1mm 2.6mm;font-weight:700\">Sıra sayısı</th><th style=\"border:.3mm solid #1c6fbf;background:#e7f0fb;padding:1.1mm 2.6mm;font-weight:700\">Bir sıradaki fidan</th></tr></thead><tbody><tr><td style=\"border:.3mm solid #1c6fbf;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">99</td><td style=\"border:.3mm solid #1c6fbf;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">99</td></tr></tbody></table></div>", "son": "", "k": "Buna göre, bahçıvanın bulduğu fidan sayısı kaçtır?", "sec": ["9 899", "9 999", "9 801", "9 701"], "secg": null, "c": "C", "a": ["99<sup>2</sup> = (100 − 1)<sup>2</sup> = 100<sup>2</sup> − 2 · 100 · 1 + 1<sup>2</sup>.", "10 000 − 200 + 1 = 9 801."], "t": "9 899: iki katı alınmamış; 9 999: 100<sup>2</sup> − 1<sup>2</sup>; 9 701: 1 çıkarılmış ve iki katı yanlış", "d": "99 = 100 − 1 yazılır. Farkın karesinde ortadaki terim 2 · 100 · 1 = 200'dür ve çıkarılır; son terim 1<sup>2</sup> eklenir.", "ses": "b04"}, {"no": 5, "on": "<p>Bir çerçeveci, kare biçimindeki bir fotoğrafı kare biçimindeki bir paspartunun ortasına yerleştirmiştir. Paspartunun bir kenarı (x + 9) cm'dir ve fotoğrafın her kenarı ile paspartunun kenarı arasında 2 cm mesafe vardır.</p>", "g": "<svg viewBox=\"0 0 210.0 201.2\" width=\"210\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"32.8\" y=\"34.0\" width=\"157.2\" height=\"157.2\" fill=\"#e9ecef\" stroke=\"#111111\" stroke-width=\"1.5\"/><rect x=\"59.0\" y=\"60.2\" width=\"104.8\" height=\"104.8\" fill=\"#d3eef2\" stroke=\"#111111\" stroke-width=\"1.5\"/><text x=\"111.4\" y=\"118.4\" font-family=\"Source Sans 3,Liberation Sans,sans-serif\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3\" paint-order=\"stroke\">Fotoğraf</text><line x1=\"32.8\" y1=\"22.0\" x2=\"190.0\" y2=\"22.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"32.8\" y1=\"18.0\" x2=\"32.8\" y2=\"26.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"190.0\" y1=\"18.0\" x2=\"190.0\" y2=\"26.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><text x=\"111.4\" y=\"17.0\" font-family=\"Source Sans 3,Liberation Sans,sans-serif\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"4\" paint-order=\"stroke\">x + 9</text><line x1=\"20.8\" y1=\"34.0\" x2=\"20.8\" y2=\"60.2\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"16.8\" y1=\"34.0\" x2=\"24.8\" y2=\"34.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"16.8\" y1=\"60.2\" x2=\"24.8\" y2=\"60.2\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><text x=\"14.8\" y=\"52.9\" font-family=\"Source Sans 3,Liberation Sans,sans-serif\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\" stroke=\"#ffffff\" stroke-width=\"4\" paint-order=\"stroke\">2</text></svg>", "son": "<p>Paspartunun fotoğrafla örtülmeyen kısmı gri renktedir.</p>", "k": "Buna göre, paspartunun gri kısmının alanını santimetrekare cinsinden veren ifade aşağıdakilerden hangisidir?", "sec": ["8x + 16", "4x + 56", "16x + 56", "8x + 56"], "secg": null, "c": "D", "a": ["Fotoğrafın kenarı x + 9 − 4 = x + 5 cm'dir.", "Gri kısım (x + 9)<sup>2</sup> − (x + 5)<sup>2</sup> = (x<sup>2</sup> + 18x + 81) − (x<sup>2</sup> + 10x + 25) = 8x + 56 cm<sup>2</sup>."], "t": "8x + 16: sabit terimler farkı yanlış; 4x + 56: ortadaki terimler farkı yanlış; 16x + 56: 2 cm bir yandan düşülmüş gibi işlem karışmış", "d": "Fotoğrafın kenarı paspartudan her iki yanda 2'şer cm, yani toplam 4 cm kısadır: x + 5.", "ses": "b05"}, {"no": 6, "on": "<p>Bir seramik atölyesinde duvar panosu; kenar uzunluğu x dm olan büyük kare, kenarları x dm ve 1 dm olan şerit ve kenarı 1 dm olan küçük kare seramiklerle şekildeki gibi boşluksuz döşenmiştir.</p>", "g": "<svg viewBox=\"0 0 230.0 232.0\" width=\"230\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"22.0\" y=\"34.0\" width=\"57.8\" height=\"57.8\" fill=\"#d6e6f8\" stroke=\"#111111\" stroke-width=\"1.5\"/><rect x=\"79.8\" y=\"34.0\" width=\"57.8\" height=\"57.8\" fill=\"#d6e6f8\" stroke=\"#111111\" stroke-width=\"1.5\"/><rect x=\"137.7\" y=\"34.0\" width=\"24.1\" height=\"57.8\" fill=\"#ffe3d1\" stroke=\"#111111\" stroke-width=\"1.5\"/><rect x=\"161.8\" y=\"34.0\" width=\"24.1\" height=\"57.8\" fill=\"#ffe3d1\" stroke=\"#111111\" stroke-width=\"1.5\"/><rect x=\"185.9\" y=\"34.0\" width=\"24.1\" height=\"57.8\" fill=\"#ffe3d1\" stroke=\"#111111\" stroke-width=\"1.5\"/><rect x=\"22.0\" y=\"91.8\" width=\"57.8\" height=\"57.8\" fill=\"#d6e6f8\" stroke=\"#111111\" stroke-width=\"1.5\"/><rect x=\"79.8\" y=\"91.8\" width=\"57.8\" height=\"57.8\" fill=\"#d6e6f8\" stroke=\"#111111\" stroke-width=\"1.5\"/><rect x=\"137.7\" y=\"91.8\" width=\"24.1\" height=\"57.8\" fill=\"#ffe3d1\" stroke=\"#111111\" stroke-width=\"1.5\"/><rect x=\"161.8\" y=\"91.8\" width=\"24.1\" height=\"57.8\" fill=\"#ffe3d1\" stroke=\"#111111\" stroke-width=\"1.5\"/><rect x=\"185.9\" y=\"91.8\" width=\"24.1\" height=\"57.8\" f ec": ["2x + 3", "x + 3", "4x + 9", "2x + 6"], "secg": null, "c": "A", "a": ["Bir kenar boyunca iki büyük kare (2x) ve üç şeridin kısa kenarı (3 · 1) yan yana gelir.", "Kenar 2x + 3; alan (2x + 3)<sup>2</sup> = 4x<sup>2</sup> + 12x + 9 ile de 4 büyük kare, 12 şerit, 9 küçük kare sayılır."], "t": "x + 3: büyük karelerden biri alınmış; 4x + 9: kenar ile karo sayıları karıştırılmış; 2x + 6: şerit sayısı iki katı alınmış", "d": "Kenarı bulmak için karoların sayısına değil, bir kenar boyunca yan yana gelen karolara bakın: iki büyük kare ve üç şerit.", "ses": "b06"}, {"no": 7, "on": "<p>Bir ev planında kare biçimindeki mutfağın bir kenarı (x − 2) m'dir. Mutfağın iki komşu duvarına bitişik, kısa kenarları 2 m olan dikdörtgen biçiminde iki kiler vardır; kilerlerden birinin uzun kenarı x m, diğerininki (x − 2) m'dir.</p>", "g": "<svg viewBox=\"0 0 230.0 210.39999999999998\" width=\"230\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"32.8\" y=\"34.0\" width=\"124.8\" height=\"124.8\" fill=\"#d6e6f8\" stroke=\"#111111\" stroke-width=\"1.5\"/><rect x=\"157.6\" y=\"34.0\" width=\"41.6\" height=\"166.4\" fill=\"#ffe3d1\" stroke=\"#111111\" stroke-width=\"1.5\"/><rect x=\"32.8\" y=\"158.8\" width=\"124.8\" height=\"41.6\" fill=\"#e6dcf7\" stroke=\"#111111\" stroke-width=\"1.5\"/><text x=\"95.2\" y=\"102.2\" font-family=\"Source Sans 3,Liberation Sans,sans-serif\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3\" paint-order=\"stroke\">Mutfak</text><text x=\"178.4\" y=\"121.7\" font-family=\"Source Sans 3,Liberation Sans,sans-serif\" font-size=\"12.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3\" paint-order=\"stroke\">Kiler</text><text x=\"95.2\" y=\"185.4\" font-family=\"Source Sans 3,Liberation Sans,sans-serif\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3\" paint-order=\"stroke\">K 33\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"16.8\" y1=\"200.4\" x2=\"24.8\" y2=\"200.4\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><text x=\"14.8\" y=\"185.4\" font-family=\"Source Sans 3,Liberation Sans,sans-serif\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\" stroke=\"#ffffff\" stroke-width=\"4\" paint-order=\"stroke\">2</text></svg>", "son": "<p>Mutfak ve kilerlerin zeminleri aynı fayansla döşenecektir.</p>", "k": "Buna göre, fayans döşenecek alanın tamamını metrekare cinsinden veren ifade aşağıdakilerden hangisidir?", "sec": ["x<sup>2</sup> − 4x + 4", "x<sup>2</sup> + 4", "x<sup>2</sup>", "x<sup>2</sup> − 4"], "secg": null, "c": "C", "a": ["Mutfak (x − 2)<sup>2</sup> = x<sup>2</sup> − 4x + 4 m<sup>2</sup>.", "Kilerler 2 · x + 2 · (x − 2) = 4x − 4 m<sup>2</sup>.", "Toplam x<sup>2</sup> − 4x + 4 + 4x − 4 = x<sup>2</sup> m<sup>2</sup>; mutfak ve kilerler birlikte kenarı x m olan bir kare oluşturur."], "t": "x<sup>2</sup> − 4x + 4: yalnız mutfak; x<sup>2</sup> + 4: kilerler 2 · x ve 2 · x alınmış; x<sup>2</sup> − 4: köşedeki 2 · 2'lik bölge iki kez çıkarılmış", "d": "Kilerlerden biri x, diğeri (x − 2) uzunluğundadır; ikisini de 2 ile çarpın. Mutfak ve kilerler birlikte kenarı x olan bir kare oluşturur.", "ses": "b07"}, {"no": 8, "on": "<p>Ali ve Veli aynı model birer bisiklet almıştır. Ali bisikletini (n − 4) ay boyunca her ay (n + 4) yüz TL, Veli ise n ay boyunca her ay n yüz TL ödeyerek almıştır.</p>", "g": "<div style=\"display:flex;flex-direction:column;align-items:center\"><p style=\"text-align:center;margin:0 0 1mm;font-size:10.6pt\"><b>Tablo:</b> Ödeme Planları</p><table style=\"border-collapse:collapse;font-size:10.6pt\"><thead><tr><th style=\"border:.3mm solid #1c6fbf;background:#e7f0fb;padding:1.1mm 2.6mm;font-weight:700\"></th><th style=\"border:.3mm solid #1c6fbf;background:#e7f0fb;padding:1.1mm 2.6mm;font-weight:700\">Taksit sayısı (ay)</th><th style=\"border:.3mm solid #1c6fbf;background:#e7f0fb;padding:1.1mm 2.6mm;font-weight:700\">Aylık taksit (yüz TL)</th></tr></thead><tbody><tr><td style=\"border:.3mm solid #1c6fbf;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">Ali</td><td style=\"border:.3mm solid #1c6fbf;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">n − 4</td><td style=\"border:.3mm solid #1c6fbf;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">n + 4</td></tr><tr><td style=\"border:.3mm solid #1c6fbf;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">Veli</td><td style=\"border:.3mm solid #1c6fbf;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">n</td><td style=\"border:.3mm solid #1c6fbf;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">n</td></tr></tbody></table></div>", "son": "<p>Taksitler dışında ödeme yapılmamıştır.</p>", "k": "Buna göre, Veli bisiklet için Ali'den kaç TL fazla ödemiştir?", "sec": ["16", "1 600", "800", "3 200"], "secg": null, "c": "B", "a": ["Ali (n − 4)(n + 4) = n<sup>2</sup> − 16 yüz TL, Veli n · n = n<sup>2</sup> yüz TL ödemiştir.", "Fark 16 yüz TL = 1 600 TL'dir; n'nin değerine bağlı değildir."], "t": "16: birim yüz TL'ye çevrilmemiş; 800: 8 yüz TL alınmış; 3 200: farkın iki katı", "d": "Taksitler yüz TL cinsindendir. Fark 16 yüz TL olduğundan TL'ye çevirmek için 100 ile çarpın.", "ses": "b08"}, {"no": 9, "on": "<p>Kenar uzunluğu a cm olan kare biçimindeki bir kâğıt önce ortadan ikiye, sonra yine ortadan ikiye katlanarak dört katlı küçük bir kare elde edilmiştir. Kâğıdın merkezinin bulunduğu köşeden kenar uzunluğu b cm olan kare bir parça kesilip kâğıt açılmıştır.</p>", "g": "<svg viewBox=\"0 0 360.0 196.0\" width=\"360\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><g transform=\"translate(0.0 0.0)\"><rect x=\"22.0\" y=\"34.0\" width=\"108.0\" height=\"108.0\" fill=\"#d3eef2\" stroke=\"#111111\" stroke-width=\"1.5\"/><rect x=\"94.0\" y=\"106.0\" width=\"36.0\" height=\"36.0\" fill=\"#ffffff\" stroke=\"#868e96\" stroke-width=\"1.5\" stroke-das \" text-anchor=\"middle\">Açılmış</text></g></svg>", "son": "<p>Açılan kâğıdın ortasında kare biçiminde bir delik oluşmuştur.</p>", "k": "Buna göre, açılan kâğıdın alanını santimetrekare cinsinden veren ifade aşağıdakilerden hangisidir?", "sec": ["a<sup>2</sup> − b<sup>2</sup>", "a<sup>2</sup> − 2b<sup>2</sup>", "a<sup>2</sup> − 4b<sup>2</sup>", "a<sup>2</sup> − 4ab + 4b<sup>2</sup>"], "secg": null, "c": "C", "a": ["Dört kat birlikte kesildiği için açılınca dört tane b · b'lik kare birleşerek kenarı 2b olan bir delik oluşur.", "Kalan alan a<sup>2</sup> − (2b)<sup>2</sup> = a<sup>2</sup> − 4b<sup>2</sup> = (a − 2b)(a + 2b)."], "t": "a<sup>2</sup> − b<sup>2</sup>: tek kat kesilmiş sanılmış; a<sup>2</sup> − 2b<sup>2</sup>: deliğin kenarı 2b alınıp karesi yanlış; a<sup>2</sup> − 4ab + 4b<sup>2</sup>: (a − 2b)<sup>2</sup> ile karıştırılmış", "d": "Kâğıt dört kat olduğu için kesilen kare açılınca dört kare birleşir; deliğin kenarı b değil 2b'dir.", "ses": "b09"}, {"no": 10, "on": "<p>İki geometri tahtasında çiviler, yatay ve dikey doğrultuda eşit aralıklarla dizilmiştir. Birinci tahtada komşu iki çivi arasındaki uzaklık x cm, ikinci tahtada (x + 1) cm'dir. Her iki tahtada da bir lastik, bir kenarı 3 aralık uzunluğunda olan kare biçiminde gerilmiştir.</p>", "g": "<svg viewBox=\"0 0 394.0 202.0\" width=\"394\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><g transform=\"translate(0.0 0.0)\"><rect x=\"10\" y=\"10\" width=\"160\" height=\"160\" rx=\"6\" fill=\"#f3ead8\" stroke=\"#8a6d3b\" stroke-width=\"1.6\"/><rect x=\"22\" y=\"22\" width=\"102\" height=\"102\" fill=\"none\" stroke=\"#6d3fc0\" stroke-width=\"3\"/><circle cx=\"22\" cy=\"22\" r=\"3.4\" fill=\"#333333\"/><circle cx=\"22\" cy=\"56\" r=\"3.4\" fill=\"#333333\"/><circle cx=\"22\" cy=\"90\" r=\"3.4\" fill=\"#333333\"/><circle cx=\"22\" cy=\"124\" r=\"3.4\" fill=\"#333333\"/><circle cx=\"22\" cy=\"158\" r=\"3.4\" fill=\"#333333\"/><circle cx=\"56\" cy=\"22\" r=\"3.4\" fill=\"#333333\"/><circle cx=\"56\" cy=\"56 =\"#333333\"/><circle cx=\"56\" cy=\"158\" r=\"3.4\" fill=\"#333333\"/><circle cx=\"90\" cy=\"22\" r=\"3.4\" fill=\"#333333\"/><circle cx=\"90\" cy=\"56\" r=\"3.4\" fill=\"#333333\"/><circle cx=\"90\" cy=\"90\" r=\"3.4\" fill=\"#333333\"/><circle cx=\"90\" cy=\"124\" r=\"3.4\" fill=\"#333333\"/><circle cx=\"90\" cy=\"158\" r=\"3.4\" fill=\"#333333\"/><circle cx=\"124\" cy=\"22\" r=\"3.4\" fill=\"#333333\"/><circle cx=\"124\" cy=\"56\" r=\"3.4\" fill=\"#333333\"/><circle cx=\"124\" cy=\"90\" r=\"3.4\" fill=\"#333333\"/><circle cx=\"124\" cy=\"124\" r=\"3.4\" fill=\"#333333\"/><circle cx=\"124\" cy=\"158\" r=\"3.4\" fill=\"#333333\"/><circle cx=\"158\" cy=\"22\" r=\"3.4\" fill=\"#333333\"/><circle cx=\"158\" cy=\"56\" r=\"3.4\" fill=\"#333333\"/><circle cx=\"158\" cy=\"90\" r=\"3.4\" fill=\"#333333\"/><circle cx=\"158\" cy=\"124\" r=\"3.4\" fill=\"#333333\"/><circle cx=\"158\" cy=\"158\" r=\"3.4\" fill=\"#333333\"/><text x=\"39.0\" y=\"192.0\" font-family=\"Source Sans 3,Liberation Sans,sans-serif\" font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">aralık: x + 1 cm</text></g></svg>", "son": "<p>Lastiklerin oluşturduğu karelerin içi tahta yüzeyidir.</p>", "k": "Buna göre, ikinci tahtadaki karenin alanı birinci tahtadakinden kaç santimetrekare fazladır?", "sec": ["18x + 9", "9", "6x + 9", "18x + 1"], "secg": null, "c": "A", "a": ["Birinci karenin kenarı 3x, alanı 9x<sup>2</sup>; ikinci karenin kenarı 3x + 3, alanı (3x + 3)<sup>2</sup> = 9x<sup>2</sup> + 18x + 9.", "Fark 18x + 9 cm<sup>2</sup>."], "t": "9: ortadaki terim unutulmuş; 6x + 9: kenarlar 3 ile çarpılmadan fark alınmış; 18x + 1: 3'ün karesi alınmamış", "d": "Karenin kenarı 3 aralık uzunluğundadır: 3x ve 3(x + 1). Kenarları farklı olan iki karenin alanları farkını bulun.", "ses": "b10"}, {"no": 11, "on": "<p>Bir hesaplama uygulamasında A ve B sayıları girildikten sonra üç tuştan birine basılmakta ve ekranda yalnız o tuşun sonucu görünmektedir.</p>", "g": "<div style=\"display:flex;flex-direction:column;align-items:center\"><p style=\"text-align:center;margin:0 0 1mm;font-size:10.6pt\"><b>Tablo:</b> Uygulamanın Tuşları</p><table style=\"border-collapse:collapse;font-size:10.6pt\"><thead><tr><th style=\"border:.3mm solid #1c6fbf;background:#e7f0fb;padding:1.1mm 2.6mm;font-weight:700\">Tuş</th><th style=\"border:.3mm solid #1c6fbf;background:#e7f0fb;padding:1.1mm 2.6mm;font-weight:700\">Ekrandaki sonuç</th></tr></thead><tbody><tr><td style=\"border:.3mm solid #1c6fbf;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">T</td><td style=\"border:.3mm solid #1c6fbf;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">A² + B²</td></tr><tr><td style=\"border:.3mm solid #1c6fbf;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">Ç</td><td style=\"border:.3mm solid #1c6fbf;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">A · B</td></tr><tr><td style=\"border:.3mm solid #1c6fbf;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">F</td><td style=\"border:.3mm solid #1c6fbf;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">(A − B)²</td></tr></tbody></table></div>", "son": "<p>Ela, girdiği iki sayının toplamının 9 olduğunu biliyor. Ç tuşuna bastığında ekranda 14 görmüştür.</p>", "k": "Buna göre, Ela aynı sayılarla F tuşuna basarsa ekranda hangi sayıyı görür?", "sec": ["53", "25", "67", "5"], "secg": null, "c": "B", "a": ["(A − B)<sup>2</sup> = (A + B)<sup>2</sup> − 4AB.", "81 − 4 · 14 = 81 − 56 = 25 (sayılar 7 ve 2)."], "t": "53: T tuşunun sonucu, 81 − 28; 67: 81 − 14; 5: A − B", "d": "(A − B)<sup>2</sup> = (A + B)<sup>2</sup> − 4AB. A · B'yi 4 ile çarpmayı unutmayın; 2 ile çarparsanız T tuşunun sonucunu bulursunuz.", "ses": "b11"}, {"no": 12, "on": "<p>Kenar uzunlukları (x + 4) cm, (x + 2) cm ve x cm olan mor, turuncu ve mavi kare kartlar; büyükten küçüğe doğru sol alt köşeleri çakışacak şekilde üst üste konmuştur.</p>", "g": "<svg viewBox=\"0 0 220.0 196.0\" width=\"220\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"22.0\" y=\"34.0\" width=\"132.0\" height=\"132.0\" fill=\"#e6dcf7\" stroke=\"#111111\" stroke-width=\"1.5\"/><rect x=\"22.0\" y=\"56.0\" width=\"110.0\" height=\"110.0\" fill=\"#ffe3d1\" stroke=\"#111111\" stroke-width=\"1.5\"/><rect x=\"22.0\" y=\"78.0\" width=\"88.0\" height=\"88.0\" fill=\"#d6e6f8\" stroke=\"#111111\" stroke-width=\"1.5\"/><line x1=\"22.0\" y1=\"22.0\" x2=\"154.0\" y2=\"22.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"22.0\" y1=\"18.0\" x2=\"22.0\" y2=\"26.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"154.0\" y1=\"18.0\" x2=\"154.0\" y2=\"26.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><text x=\"88.0\" y=\"17.0\" font-family=\"Source Sans 3,Liberation Sans,sans-serif\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"4\" paint-order=\"stroke\">x + 4</text><line x1=\"144.0\" y1=\"56.0\" x2=\"144.0\" y2=\"166.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"140.0\" y1=\"56.0\" x2=\"148.0\" y2=\"56.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"140.0\" y1=\"166.0\" x2=\"148.0\" y2=\"166.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><text x=\"150.0\" y=\"116.8\" font-family=\"Source Sans 3,Liberation Sans,sans-serif\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"start\" stroke=\"#ffffff\" stroke-width=\"4\" paint-order=\"stroke\">x + 2</text><line x1=\"22.0\" y1=\"178.0\" x2=\"110.0\" y2=\"178.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"22.0\" y1=\"174.0\" x2=\"22.0\" y2=\"182.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"110.0\" y1=\"174.0\" x2=\"110.0\" y2=\"182.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><text x=\"66.0\" y=\"196.0\" font-family=\"Source Sans 3,Liberation Sans,sans-serif\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"4\" paint-order=\"stroke\">x</text></svg>", "son": "<p>Mor kartın ve turuncu kartın yalnız görünen kısımları hesaba katılacaktır.</p>", "k": "Buna göre, mor kartın görünen kısmının alanı turuncu kartın görünen kısmının alanından kaç santimetrekare fazladır?", "sec": ["4x + 8", "4", "16", "8"], "secg": null, "c": "D", "a": ["Morun görünen kısmı (x + 4)<sup>2</sup> − (x + 2)<sup>2</sup> = 4x + 12 cm<sup>2</sup>.", "Turuncunun görünen kısmı (x + 2)<sup>2</sup> − x<sup>2</sup> = 4x + 4 cm<sup>2</sup>.", "Fark 8 cm<sup>2</sup>; x'e bağlı değildir."], "t": "4x + 8: turuncunun yerine mavi kartın alanı çıkarılmış gibi sadeleştirme hatası; 4: kenar farklarının çarpımı 2 · 2; 16: 4<sup>2</sup>", "d": "Görünen kısım, kartın alanından üstündeki kartın alanı çıkarılarak bulunur. İki farkı ayrı ayrı yazıp sonra karşılaştırın.", "ses": "b12"}, {"no": 13, "on": "<p>Bir çiftçi, kenar uzunlukları (x + 7) m ve (x − 1) m olan dikdörtgen biçimindeki bahçesinin çevresine çektiği çiti söküp aynı çitin tamamıyla kare biçiminde yeni bir bahçenin çevresini çevirmiştir.</p>", "g": "<svg viewBox=\"0 0 380.0 165.2\" width=\"380\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><g transform=\"translate(0.0 19.0)\"><rect x=\"68.0\" y=\"34.0\" width=\"112.0\" height=\"59.3\" fill=\"#d3eef2\" stroke=\"#111111\" stroke-width=\"1.5\"/><line x1=\"68.0\" y1=\"22.0\" x2=\"180.0\" y2=\"22.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"68.0\" y1=\"18.0\" x2=\"68.0\" y2=\"26.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"180.0\" y1=\"18.0\" x2=\"180.0\" y2=\"26.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><text x=\"124.0\" y=\"17.0\" font-family=\"Source Sans 3,Liberation Sans,sans-serif\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"4\" paint-order=\"stroke\">x + 7</text><line x1=\"56.0\" y1=\"34.0\" x2=\"56.0\" y2=\"93.3\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"52.0\" y1=\"34.0\" x2=\"60.0\" y2=\"34.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"52.0\" y1=\"93.3\" x2=\"60.0\" y2=\"93.3\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><text x=\"50.0\" y=\"69.4\" font-family=\"Source Sans 3,Liberation Sans,sans-serif\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\" stroke=\"#ffffff\" stroke-width=\"4\" paint-order=\"stroke\">x − 1</text><text x=\"100.0\" y=\"121.3\" font-family=\"Source Sans 3,Liberation Sans,sans-serif\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Eski bahçe</text></g><g transform=\"translate(230.0 0.0)\"><rect x=\"32.8\" y=\"34.0\" width=\"97.2\" height=\"97.2\" fill=\"#d6e6f8\" stroke=\"#111111\" stroke-width=\"1.5\"/><line x1=\"32.8\" y1=\"22.0\" x2=\"130.0\" y2=\"22.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"32.8\" y1=\"18.0\" x2=\"32.8\" y2=\"26.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"130.0\" y1=\"18.0\" x2=\"130.0\" y2=\"26.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><text x=\"81.4\" y=\"17.0\" font-family=\"Source Sans 3,Liberation Sans,sans-serif\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"4\" paint-order=\"stroke\">?</text><line x1=\"20.8\" y1=\"34.0\" x2=\"20.8\" y2=\"131.2\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"16.8\" y1=\"34.0\" x2=\"24.8\" y2=\"34.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"16.8\" y1=\"131.2\" x2=\"24.8\" y2=\"131.2\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><text x=\"14.8\" y=\"88.4\" font-family=\"Source Sans     // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
