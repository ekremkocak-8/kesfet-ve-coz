<rect x=\"390.0\" y=\"80.0\" width=\"52.0\" height=\"40.0\" rx=\"0\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.6\"/><text x=\"416.0\" y=\"106.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"17\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">3</text><line x1=\"452.0\" y1=\"100.0\" x2=\"492.0\" y2=\"100.0\" stroke=\"#1971c2\" stroke-width=\"1.4\"/><polygon points=\"492.0,100.0 484.0,104.0 484.0,96.0\" fill=\"#1971c2\"/><line x1=\"120.0\" y1=\"136.0\" x2=\"80.0\" y2=\"136.0\" stroke=\"#1971c2\" stroke-width=\"1.4\"/><polygon points=\"80.0,136.0 88.0,132.0 88.0,140.0\" fill=\"#1971c2\"/><text x=\"472.0\" y=\"136.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"11.5\" font-weight=\"700\" fill=\"#1971c2\" text-anchor=\"middle\">kaydırılabilir</text></svg>", "son": "<p>Üst şerit sabittir. Alt şerit, kareler tam olarak alt alta gelecek şekilde sağa ya da sola kaydırılabilmektedir. Ece alt şeridi, üst şeridin dört karesinin hepsinin altında bir kare bulunacak ve alt alta gelen dört ifadenin hepsinin değeri tam sayı olacak şekilde bir konuma getirmiştir.</p>", "k": "Buna göre, bu konumda alt alta gelen dört ifadenin değerleri toplamı kaçtır?", "sec": ["12", "28", "30", "34"], "secg": null, "c": "C", "a": ["Alt şeritte 6, üst şeritte 4 kare olduğundan dört karenin hepsinin altında kare bulunan 3 konum vardır: alt şerit ilk konumda, 1 kare sola ya da 2 kare sola kaydırılmış.", "İlk konumda üsler −2, −1, 0, 1'dir: (−3)<sup>−2</sup> = <span class=\"frac\"><span>1</span><span>9</span></span> tam sayı değildir. 1 kare kaydırınca üsler −1, 0, 1, 2'dir: (−3)<sup>−1</sup> tam sayı değildir.", "2 kare kaydırınca üsler 0, 1, 2, 3 olur: (−3)<sup>0</sup> = 1, (−2)<sup>1</sup> = −2, 2<sup>2</sup> = 4, 3<sup>3</sup> = 27; hepsi tam sayıdır. Toplam 1 − 2 + 4 + 27 = 30'dur."], "t": "28: (−3)<sup>0</sup> = −1 alınmış; 34: (−2)<sup>1</sup> = 2 alınmış; 12: 3<sup>3</sup> = 3 · 3 = 9 alınmış.", "d": "Üs negatifse ve taban −1 değilse değer kesir olur. Bu yüzden dört değerin tam sayı olması için alt şeritteki negatif üslerin üst şeridin altından çıkması gerekir. (−3)<sup>0</sup> = 1'dir.", "ses": "b13"}, {"no": 14, "on": "<p>Bir laboratuvarda maya hücreleriyle bir deney yapılmıştır. Deneyde yapılanlar, araştırmacının deney defterine aşağıdaki gibi yazılmıştır.</p>", "g": "<svg viewBox=\"0 0 642 176\" width=\"642\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><ellipse cx=\"110\" cy=\"96\" rx=\"92\" ry=\"34\" fill=\"#f1f3f5\" stroke=\"#495057\" stroke-width=\"2\"/><ellipse cx=\"110\" cy=\"90\" rx=\"84\" ry=\"28\" fill=\"#fff9db\" stroke=\"#adb5bd\" stroke-width=\"1.2\"/><circle cx=\"80.0\" cy=\"88.0\" r=\"4.5\" fill=\"#ffe066\" stroke=\"#e8a33c\" stroke-width=\"1\"/><circle cx=\"96.0\" cy=\"98.0\" r=\"4.5\" fill=\"#ffe066\" stroke=\"#e8a33c\" stroke-width=\"1\"/><circle cx=\"120.0\" cy=\"84.0\" r=\"4.5\" fill=\"#ffe066\" stroke=\"#e8a33c\" stroke-width=\"1\"/><circle cx=\"140.0\" cy=\"96.0\" r=\"4.5\" fill=\"#ffe066\" stroke=\"#e8a33c\" stroke-width=\"1\"/><circle cx=\"106.0\" cy=\"90.0\" r=\"4.5\" fill=\"#ffe066\" stroke=\"#e8a33c\" stroke-width=\"1\"/><circle cx=\"130.0\" cy=\"104.0\" r=\"4.5\" fill=\"#ffe066\" stroke=\"#e8a33c\" stroke-width=\"1\"/><text x=\"110.0\" y=\"150.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">Petri kabı (temsilî)</text><rect x=\"232.0\" y=\"10.0\" width=\"400.0\" height=\"156.0\" rx=\"8\" fill=\"#fff\" stroke=\"#1f7a8c\" stroke-width=\"1.6\"/><text x=\"432.0\" y=\"32.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#1f7a8c\" text-anchor=\"middle\">Deney defteri</text><text x=\"246.0\" y=\"60.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"start\">0. dakika</text><text x=\"400.0\" y=\"60.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"600\" fill=\"#000000\" text-anchor=\"start\">Kapta 2 maya hücresi var.</text><text x=\"246.0\" y=\"84.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"start\">Her 30 dakikada bir</text><text x=\"400.0\" y=\"84.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"600\" fill=\"#000000\" text-anchor=\"start\">Hücre sayısı 3 katına çıkıyor.</text><text x=\"246.0\" y=\"108.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"start\">3. saatin sonunda</text><text x=\"400.0\" y=\"108.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"600\" fill=\"#000000\" text-anchor=\"start\">İlaç damlatılıyor: hücrelerin yalnız</text><text x=\"246.0\" y=\"132.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"start\"></text><text x=\"400.0\" y=\"132.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"600\" fill=\"#000000\" text-anchor=\"start\">3<tspan baseline-shift=\"super\" font-size=\"68%\">−4</tspan>'ü canlı kalıyor.</text><text x=\"246.0\" y=\"156.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"start\">İlaçtan sonra</text><text x=\"400.0\" y=\"156.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"600\" fill=\"#000000\" text-anchor=\"start\">Hücreler aynı şekilde çoğalıyor.</text></svg>", "son": "<p>Deney boyunca ilaç dışında hiçbir hücre ölmemiştir.</p>", "k": "Buna göre, deneyin başlangıcından 5 saat sonra kapta kaç maya hücresi bulunur?", "sec": ["162", "216", "486", "1458"], "secg": null, "c": "D", "a": ["3 saatte 6 kez 30 dakika vardır. 3. saatin sonunda hücre sayısı 2 · 3<sup>6</sup> = 2 · 729 = 1458'dir.", "İlaçtan sonra hücrelerin 3<sup>−4</sup> = <span class=\"frac\"><span>1</span><span>81</span></span>'i canlı kalır: 1458 · <span class=\"frac\"><span>1</span><span>81</span></span> = 18 hücre.", "Kalan 2 saatte 4 kez 30 dakika vardır: 18 · 3<sup>4</sup> = 18 · 81 = 1458 hücre."], "t": "162: kalan 2 saatte 2 kez çoğalma olduğu sanılmış; 486: kalan sürede 3 kez çoğalma hesaplanmış; 216: 3<sup>4</sup> yerine 3 · 4 = 12 alınmış.", "d": "Süreyi yarım saatlere bölün: 3 saatte 6, kalan 2 saatte 4 çoğalma vardır. İlaçtan sonra kalan hücreler yine her yarım saatte 3 katına çıkar.", "ses": "b14"}, {"no": 15, "on": "<p>Ece, 20 sorudan oluşan bir deneme sınavına girmiştir. Sınavın puanlama kuralları ve Ece'nin sonuç kartı aşağıda gösterilmiştir. Sonuç kartındaki sayılar okunamamaktadır.</p>", "g": "<svg viewBox=\"0 0 590 170\" width=\"590\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"10.0\" y=\"10.0\" width=\"300.0\" height=\"150.0\" rx=\"8\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1.6\"/><rect x=\"10.0\" y=\"10.0\" width=\"300.0\" height=\"32.0\" rx=\"8\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.4\"/><text x=\"160.0\" y=\"32.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#1971c2\" text-anchor=\"middle\">DENEME SONUCU · Ece</text><rect x=\"22.0\" y=\"56.0\" width=\"84.0\" height=\"30.0\" rx=\"4\" fill=\"#f1f3f5\" stroke=\"#495057\" stroke-width=\"1.1\"/><text x=\"64.0\" y=\"76.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">Doğru</text><rect x=\"22.0\" y=\"92.0\" width=\"84.0\" height=\"50.0\" rx=\"4\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1.1\"/><text x=\"64.0\" y=\"126.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"22\" font-weight=\"800\" fill=\"#c2255c\" text-anchor=\"middle\">?</text><rect x=\"118.0\" y=\"56.0\" width=\"84.0\" height=\"30.0\" rx=\"4\" fill=\"#f1f3f5\" stroke=\"#495057\" stroke-width=\"1.1\"/><text x=\"160.0\" y=\"76.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">Yanlış</text><rect x=\"118.0\" y=\"92.0\" width=\"84.0\" height=\"50.0\" rx=\"4\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1.1\"/><text x=\"160.0\" y=\"126.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"22\" font-weight=\"800\" fill=\"#c2255c\" text-anchor=\"middle\">?</text><rect x=\"214.0\" y=\"56.0\" width=\"84.0\" height=\"30.0\" rx=\"4\" fill=\"#f1f3f5\" stroke=\"#495057\" stroke-width=\"1.1\"/><text x=\"256.0\" y=\"76.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">Boş</text><rect x=\"214.0\" y=\"92.0\" width=\"84.0\" height=\"50.0\" rx=\"4\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1.1\"/><text x=\"256.0\" y=\"126.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"22\" font-weight=\"800\" fill=\"#c2255c\" text-anchor=\"middle\">?</text><rect x=\"330.0\" y=\"10.0\" width=\"250.0\" height=\"150.0\" rx=\"8\" fill=\"#fff4e6\" stroke=\"#e8590c\" stroke-width=\"1.4\"/><text x=\"455.0\" y=\"34.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#e8590c\" text-anchor=\"middle\">Puanlama</text><text x=\"350.0\" y=\"64.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Soru sayısı: 20</text><text x=\"350.0\" y=\"90.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Her doğru: +4 puan</text><text x=\"350.0\" y=\"116.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Her yanlış: −1 puan</text><text x=\"350.0\" y=\"142.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Boş: 0 puan</text></svg>", "son": "<p>Ece'nin doğru, yanlış ve boş cevap sayılarının her biri 2'nin pozitif tam sayı kuvvetidir.</p>", "k": "Buna göre, Ece'nin bu sınavdaki puanı <u style=\"white-space:nowrap\">en fazla</u> kaçtır?", "sec": ["56", "60", "62", "64"], "secg": null, "c": "C", "a": ["2'nin pozitif tam sayı kuvvetleri 2, 4, 8, 16, …'dır. Üç sayının toplamı 20 olmalıdır: 16 + 2 + 2 = 20 ya da 8 + 8 + 4 = 20.", "Doğru sayısı ne kadar fazla olursa puan o kadar artar. 16 doğru, 2 yanlış, 2 boş için puan 16 · 4 − 2 · 1 = 64 − 2 = 62'dir.", "8 doğru içeren dağılımlarda puan en fazla 8 · 4 − 4 = 28'dir. En fazla puan 62'dir."], "t": "64: yanlış cevapların puan kaybettirdiği unutulmuş; 60: yanlış sayısı 4 alınmış; 56: her yanlışın 4 puan kaybettirdiği sanılmış, 64 − 2 · 4 yapılmış.", "d": "Üç sayının toplamı 20 olmalı ve her biri 2, 4, 8, 16 gibi 2'nin pozitif kuvveti olmalıdır (1 = 2<sup>0</sup> pozitif kuvvet değildir). Yanlışlar puan kaybettirir; doğru sayısını büyütmek tek başına yetmeyebilir.", "ses": "b15"}, {"no": 16, "on": "<p>Defne, mavi torbadan bir kart çekip üzerindeki sayıyı taban, turuncu torbadan bir kart çekip üzerindeki sayıyı üs olarak kullanarak bir üslü ifade yazacaktır. Torbalardaki kartlar aşağıda gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 480 200\" width=\"480\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><path d=\"M40 50 Q20 150 50 170 L190 170 Q220 150 200 50 Z\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"2\"/><path d=\"M50 50 Q120 30 190 50\" fill=\"none\" stroke=\"#1971c2\" stroke-width=\"3\"/><rect x=\"60.0\" y=\"70.0\" width=\"36.0\" height=\"38.0\" rx=\"5\" fill=\"#fff\" stroke=\"#1971c2\" stroke-width=\"1.4\"/><text x=\"78.0\" y=\"96.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">−3</text><rect x=\"104.0\" y=\"70.0\" width=\"36.0\" height=\"38.0\" rx=\"5\" fill=\"#fff\" stroke=\"#1971c2\" stroke-width=\"1.4\"/><text x=\"122.0\" y=\"96.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">−2</text><rect x=\"148.0\" y=\"70.0\" width=\"36.0\" height= "k": "Buna göre, değeri negatif bir tam sayı olan kaç farklı ifade yazılabilir?", "sec": ["3", "4", "5", "6"], "secg": null, "c": "B", "a": ["Bütün tabanlar negatiftir. Pozitif çift üsle (2) sonuç pozitiftir. Pozitif tek üsle (3) sonuç negatif tam sayıdır: (−3)<sup>3</sup> = −27, (−2)<sup>3</sup> = −8, (−1)<sup>3</sup> = −1 → 3 ifade.", "Negatif üslerle sonuç genellikle kesirdir: (−3)<sup>−1</sup> = −<span class=\"frac\"><span>1</span><span>3</span></span>, (−2)<sup>−1</sup> = −<span class=\"frac\"><span>1</span><span>2</span></span> … Ancak taban −1 olduğunda (−1)<sup>−1</sup> = <span class=\"frac\"><span>1</span><span>−1</span></span> = −1 bir tam sayıdır.", "(−1)<sup>−2</sup> = 1 pozitiftir. Değeri negatif tam sayı olan ifade sayısı 3 + 1 = 4'tür."], "t": "3: (−1)<sup>−1</sup> ifadesinin tam sayı olduğu fark edilmemiş; 6: negatif tabanın bütün tek üslü ifadeleri (−1 üssü dâhil) tam sayı sanılmış; 5: (−1)<sup>−2</sup> de negatif sanılmış.", "d": "Negatif tabanın pozitif tek kuvveti negatif tam sayıdır. Negatif üs genellikle kesir verir; ama taban −1 ise (−1)<sup>−1</sup> = −1 tam sayıdır. Bu ifadeyi gözden kaçırmayın.", "ses": "b16"}]};

  const n=document.createElement("button");n.className="btn";n.type="button";const t=document.createElement("button");t.className="btn ghost";t.type="button";t.textContent="Bütün adımları göster";
  const ciz=()=>{n.textContent=i<list.length?`${i+1}. adımı göster (${list.length} adım)`:"Çözüm tamamlandı";n.disabled=i>=list.length;t.hidden=i>=list.length;};
  const ekle=()=>{const x=document.createElement("div");x.className="adim";x.innerHTML=`<b>${i+1}. adım</b> · ${list[i]}`;kap.insertBefore(x,dd);i++;if(i>=list.length&&son)son();ciz();};
  n.onclick=ekle;t.onclick=()=>{while(i<list.length)ekle();};dd.append(n,t);kap.appendChild(dd);ciz();}
function kartS(s){const k=document.createElement("section");k.className="kart";k.style.setProperty("--c","var(--ss)");k.id="s"+s.no;
  k.innerHTML=`<span class="et">SIRA SENDE · ${s.no}</span><h2>${s.bas}</h2>`;
  s.q.forEach((x,j)=>{const w=document.createElement("div");w.innerHTML=`<div class="soru"><b>${j+1}.</b> ${x.k}</div>`;k.appendChild(w);
    k.appendChild(sesKutu(`s${s.no}-${j+1}`));adimAdim(w,x.a,()=>{const c=document.createElement("p");c.className="cevap";c.innerHTML="<b>Cevap:</b> "+x.c;w.appendChild(c);});});return k;}
function kartK(s){const k=document.createElement("section");k.className="kart";k.style.setProperty("--c","var(--kk)");k.id="k"+s.no;
  k.innerHTML=`<span class="et">KALEM KÂĞIT · ${s.no}</span><h2>${s.bas}</h2><p>${s.yon}</p><table><thead><tr><th>SAYI</th><th>CEVAP</th></tr></thead><tbody>${s.r.map(r=>`<tr><td><b>${r.n}</b></td><td>${r.c}</td></tr>`).join("")}</tbody></table>`;return k;}
function kartB(s){const k=document.createElement("section");k.className="kart";k.style.setProperty("--c","var(--b)");k.id="b"+s.no;
  const L="ABCD";const sec=s.sec?`<ol class="sec">${s.sec.map((x,i)=>`<li class="${L[i]===s.c?"":""}" data-h="${L[i]}"><b>${L[i]})</b> ${x}</li>`).join("")}</ol>`:"";
  k.innerHTML=`<span class="et">${V.bet||"BAĞLAM TEMELLİ SORU"} · ${s.no}</span><h2>${window.CANL&&CANL[s.no]?"Canlandırın, deneyin, çözümü görün":"Adım adım çözüm"}</h2><div class="soru">${s.on||""}${s.g?`<div>${s.g}</div>`:""}${s.son||""}<p><b>${s.k}</b></p>${sec}${s.secg?'<p><i>Seçenekler kitaptaki görsellerdir.</i></p>':""}</div>`;
  let cozKap=k;
  if(window.CANL&&CANL[s.no]){const sek=document.createElement("div");sek.className="sek";sek.setAttribute("role","tablist");
    sek.innerHTML=`<button type="button" role="tab" aria-selected="true">▶ Canlandır ve dene<span class="yeni">YENİ</span></button><button type="button" role="tab" aria-selected="false">Adım adım çözüm</button>`;
    const p1=document.createElement("div");p1.className="cn";p1.setAttribute("role","tabpanel");const p2=document.createElement("div");p2.setAttribute("role","tabpanel");p2.hidden=true;
    k.append(sesKutu(s.ses),sek,p1,p2);let kur=false;const ac=i=>{sek.querySelectorAll("button").forEach((b,j)=>b.setAttribute("aria-selected",i===j));p1.hidden=i!==0;p2.hidden=i!==1;if(i===0&&!kur){kur=true;CANL[s.no](p1);}};
    sek.querySelectorAll("button").forEach((b,i)=>b.onclick=()=>ac(i));ac(q.get("g")==="cozum"?1:0);cozKap=p2;}
  if(cozKap===k)k.appendChild(sesKutu(s.ses));const w=document.createElement("div");cozKap.appendChild(w);
  adimAdim(w,s.a,()=>{const c=document.createElement("p");c.className="cevap";c.innerHTML=`<b>Doğru cevap:</b> ${s.c}`;w.appendChild(c);
    k.querySelectorAll("ol.sec li").forEach(li=>{if(li.dataset.h===s.c)li.classList.add("dogru");});
    if(s.t){const t=document.createElement("p");t.className="tuzak";t.innerHTML="<b>Diğer seçenekler neden yanlış?</b> "+s.t;w.appendChild(t);}});
  const d=document.createElement("div");d.className="dikkat";d.innerHTML=`<b>Dikkat!</b> ${s.d}`;cozKap.appendChild(d);return k;}
const ic=$("#ic");
const BOL=[["s","Sıra Sende",V.s,kartS],["k","Kalem Kâğıt",V.k,kartK],["b",V.bad||"Bağlam Soruları",V.b,kartB]].filter(x=>x[2].length);
if(tek&&BOL.some(x=>x[0]===tek)){const n=+q.get(tek);const [,,L,f]=BOL.find(x=>x[0]===tek);const s=L.find(x=>x.no===n)||L[0];ic.appendChild(f(s));$("#tum").hidden=false;$("#nav").remove();}
else{let akt=BOL[0][0];const nav=$("#nav");const ciz=()=>{ic.innerHTML="";nav.innerHTML=BOL.map(([k,a,L])=>`<button type="button" data-k="${k}" aria-pressed="${k===akt}">${a} (${L.length})</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{akt=b.dataset.k;ciz();});const [,,L,f]=BOL.find(x=>x[0]===akt);L.forEach(s=>ic.appendChild(f(s)));};ciz();}
</script></body></html>
