<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çözümler · Keşfet ve Çöz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--muted:#5b6478;--line:#dfe5ef;--bg:#f5f7fb;--card:#fff;--ss:#6741d9;--kk:#0b7285;--b:#d0700f;--ok:#2b8a3e;--warn:#c92a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif}
header{background:linear-gradient(135deg,#1c5fbf,#2f8fe0);color:#fff;padding:18px 16px 22px}

main{max-width:780px;margin:14px auto 40px;padding:0 16px}
nav.sec{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}nav.sec button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}

ol.sec{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
ol.sec li{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}ol.sec li.dogru{border-color:var(--ok);background:#ebfbee;font-weight:800}
.adim{border-left:4px solid var(--c);padding:6px 12px;margin:8px 0;background:#fff;border-radius:0 10px 10px 0;animation:gel .35s ease-out}
.adim b{color:var(--c)}@keyframes gel{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dug{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
button.btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.dikkat{background:#fff4e6;border:2px solid #f59f00;border-radius:12px;padding:10px 14px;margin:12px 0 4px}.dikkat b{color:#d9480f}
.tuzak{font-size:15px;color:var(--muted);margin-top:8px}
.cevap{font-weight:900;color:var(--ok);margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid var(--line);padding:8px 10px;text-align:left}th{background:#e3fafc;color:#0b7285;font-size:13px;letter-spacing:.06em}
.ses{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border-radius:12px;background:#eef2ff}

.ses span{font-size:14px;color:var(--muted)}
.gizli{display:none}
.tum{margin:4px 0 14px;font-size:14px}.tum a{color:#1c5fbf;font-weight:800}
@media (prefers-reduced-motion:reduce){.adim{animation:none}}
/* Canlandır (05.10.2026) */
.sek{display:flex;gap:6px;margin:12px 0 0;border-bottom:2px solid var(--line)}
.sek button{border:0;background:none;font:inherit;font-weight:900;font-size:15px;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);min-height:44px;position:relative;top:2px;border-bottom:3px solid transparent}
.sek button[aria-selected=true]{color:var(--c);border-bottom-color:var(--c);background:#fff8f0}
.sek .yeni{display:inline-block;font-size:10px;background:#2b8a3e;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.06em}
.cn{padding-top:10px}
.cn-yon{background:#eef6ff;border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:10px}
.cn-sahne{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;min-height:120px;overflow-x:auto}

.cn-adimci input,.cn-test input{width:84px;height:44px;border:2px solid var(--line);border-radius:12px;font:inherit;font-weight:900;text-align:center;font-size:18px}
.cn-test label{font-weight:800;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.cn-btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
.cn-btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.cn-btn[aria-pressed=true]{background:var(--ac,var(--c));color:#fff;border-color:var(--ac,var(--c))}
.cn-btn:disabled{opacity:.5}
.cn-hazir{display:flex;flex-wrap:wrap;gap:6px}

.cn-dur .iyi{color:var(--ok);font-weight:900}.cn-dur .kotu{color:var(--warn);font-weight:900}
.cn-df{margin-top:10px;overflow-x:auto}@media(max-width:480px){.cn-adimci>span{flex-basis:100%}.cn-h{font-size:12px;padding:5px 0}.cn-izg{gap:3px}.cn-sahne{padding:6px}}@media(max-width:480px){.cn-df table{font-size:13px}.cn-df td,.cn-df th{padding:4px 5px}}.cn-df summary{font-weight:900;cursor:pointer;padding:6px 0}.cn-say{color:var(--muted);font-weight:700}
.cn-df table{font-size:15px}.cn-df td{padding:5px 8px}.cn-df tr.cn-iyi td{background:#ebfbee}.cn-df tr.cn-kotu td{background:#fff5f5}.cn-df tr.cn-son td{outline:2px solid var(--c);outline-offset:-2px}
.cn-p{animation:cnGel .35s ease-out both}@keyframes cnGel{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cn-o{fill:#ffa94d;stroke:#d9480f;stroke-width:1}.cn-o2{fill:#e8590c}.cn-k{fill:#ffc9c9;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:3 2}
.cn-cerceve{stroke:#2b8a3e;stroke-width:3}.cn-et{font-size:13px;font-weight:800;fill:#5b6478}.cn-et.b,.cn-et2b{font-weight:900;fill:#1d2433}.cn-et2{font-size:11px;fill:#5b6478;font-weight:700}.cn-et2b{font-size:13px;fill:#fff}
.cn-ku{fill:#fff4e6;stroke:#ffa94d;stroke-width:1.5}.cn-kk{fill:#fff5f5;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:4 3}
.cn-tahta0{fill:#f1f3f5;stroke:#ced4da}.cn-tahta{fill:#c08552;stroke:#8d5a2b}
.cn-ek{stroke:#868e96;stroke-width:2}.cn-sinir{stroke:#c92a2a;stroke-width:3;stroke-dasharray:5 4}.cn-yay{fill:none;stroke:#f76707;stroke-width:2}
.cn-v1{stroke:#2b8a3e;stroke-width:3}.cn-v2{stroke:#c92a2a;stroke-width:3}.cn-kis{font-size:20px}.cn-bus{font-size:16px}.cn-bek{stroke:#c92a2a;stroke-width:5;stroke-linecap:round;opacity:.6}
.cn-kum{fill:#ffe8cc;stroke:#e8590c;stroke-width:3}.cn-kum2{fill:#495057}.cn-para{fill:#ffd43b;opacity:.85}.cn-buyuk{font-size:26px;font-weight:900;fill:#1d2433}
.cn-zem{fill:#adb5bd}.cn-kat{fill:#f1f3f5;stroke:#ced4da}.cn-katon{fill:#d3f9d8;stroke:#2b8a3e}.cn-katoff{fill:#ffe3e3;stroke:#e03131}
.cn-izg{display:grid;gap:4px}.cn-h,.cn-gb{border-radius:8px;text-align:center;font-weight:800;font-size:14px;padding:6px 0}.cn-h{background:#f1f3f5;transition:background .25s,transform .25s}
.cn-gb{background:none;color:var(--muted);font-size:12px}.cn-h.on{background:#ffa94d;color:#1d2433}.cn-h.yeni{transform:scale(1.18);box-shadow:0 0 0 3px #e8590c}
.cn-kartlar{display:flex;flex-wrap:wrap;gap:6px;padding:4px}.cn-kart{min-width:44px;padding:8px 10px;text-align:center;border-radius:10px;background:#fff4e6;border:2px solid #ffa94d;font-weight:900;animation:cnGel .3s}
.cn-kart.kare{background:#e7f5ff;border-color:#1c7ed6}.cn-bosk{color:var(--muted)}
.cn-cift{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 4px;font-weight:800}.cn-cift i{font-weight:600;color:#1c7ed6}
.cn-katlar{padding:4px}.cn-katsat{display:inline-flex;flex-wrap:wrap;gap:6px}.cn-kat2{background:#e6fcf5;border:1.5px solid #12b886;border-radius:8px;padding:3px 8px;font-weight:800;animation:cnGel .3s}.cn-sonsuz{font-weight:800;color:#0b7285}
.cn-onr{background:#f8f0fc;border:2px solid #ae3ec9;border-radius:12px;padding:10px 14px}.cn-kanit{padding:10px 4px 2px}
.cn-kay{display:inline-flex;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap}.cn-kay{max-width:100%}.cn-kay input{width:min(220px,70vw);accent-color:#d0700f}.cn-satir>*{min-width:0;max-width:100%}
@media (prefers-reduced-motion:reduce){.cn-p,.cn-kart,.cn-kat2{animation:none}.cn-h{transition:none}}
/* 05.10.2026 · KOŞUL ve LABİRENT motorları (SB 6.1.1) */
@media(max-width:560px){.soru [style*="grid-template-columns:repeat"]{grid-template-columns:1fr!important}}   /* çok sütunlu konuşma balonları telefonda alt alta */
.cn-kl{list-style:none;padding:0;margin:0;display:grid;gap:4px}.cn-not{color:var(--muted);font-size:14px}.cn-sonuc{margin-top:6px;font-weight:800}
.cn-secg{gap:6px}.cn-secad{font-weight:800;flex-basis:100%}.cn-secg .cn-btn{padding:8px 12px}
.cn-mv{fill:#74c0fc;stroke:#1c7ed6;stroke-width:1}.cn-tl{fill:#69db7c;stroke:#2b8a3e;stroke-width:1.5}
.cn-lab{display:grid;gap:4px;align-items:center;max-width:460px;margin:0 auto}
.cn-lc{min-height:44px;border-radius:8px;border:1.5px solid #ced4da;background:#fff;font:inherit;font-weight:900;font-size:16px;cursor:pointer;padding:0;color:var(--ink)}
.cn-lc.yol{background:#d3f9d8;border-color:#2b8a3e}.cn-lc.simdi{background:#2b8a3e;color:#fff;box-shadow:0 0 0 3px #b2f2bb}.cn-lc.kapali{background:#ffe3e3;border-color:#e03131;color:#c92a2a;text-decoration:line-through}
.cn-lok{color:#2b8a3e;font-weight:900;text-align:center}.cn-lcik{min-height:44px;border:0;background:none;font:inherit;font-weight:900;color:#d9480f;cursor:pointer;padding:0;white-space:nowrap;font-size:14px}.cn-lcik:disabled{cursor:default}

</style></head><body>
<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }
      if (!art && !o.sandalye) sv += `<rect x="10" y="10" width="${gen * hc}" height="${sira * hc}" fill="none" class="cn-cerceve"/>
        <text x="${10 + gen * hc / 2}" y="${H + 4}" class="cn-et" text-anchor="middle">${gen} ${o.birim || ""}</text>
        <text x="${W + 4}" y="${10 + sira * hc / 2}" class="cn-et" dominant-baseline="middle">${sira} ${o.birim || ""}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W + 70} ${H + 22}" role="img" aria-label="${N} ${o.ad || "kare"}, her sırada ${gen}">${sv}</svg>`;
      const r = o.kural ? o.kural(gen, sira, art, N) : null;
      let m;
      if (art) m = `<span class="kotu">✘</span> ${N} ${o.ad || "kare"} her sırada ${gen} olacak biçimde dizilince ${sira} tam sıra oluşur, <b>${art} ${o.ad || "kare"} artar</b>. Dikdörtgen olmaz: ${N} : ${gen} işleminde kalan ${art}.`;
      else m = `<span class="iyi">✔</span> <b>${N} = ${gen} ${x} ${sira}</b> · ${sira} sıra, her sırada ${gen} ${o.ad || "kare"}; hiç artmadı.` + (gen === sira ? ` <b>Kare oldu!</b> İki kenar aynı: ${gen}.` : "");
      if (!art && o.cevre) m += ` Çevre = 2 ${x} (${gen} + ${sira}) = <b>${2 * (gen + sira)} m</b>.`;
      if (r && r.msg) m += `<br>${r.msg}`;
      s.dur.innerHTML = m;
      const sutunlar = o.satir ? o.satir(gen, sira, art, N, r) : [gen, art ? `${sira} (+ ${art} artan)` : sira, art, art ? "olmaz" : (gen === sira ? "kare" : "dikdörtgen")];
      s.yaz(N + ":" + gen, sutunlar, !art && (!r || r.ok !== false));
    }
    ciz(g.get());
  }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {
    const N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });
    const g = adimci(o.etiket, 1, o.max || N, o.bas || 2, v => { sonK = v; });

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {

      ciftler.innerHTML = L.filter(v => v * v <= N).map(v => `<span>${v} ${x} ${N / v}${v * v === N ? " <i>(aynı sayı: bir kez yazılır)</i>" : ""}</span>`).join("");

    const tamamMi = () => { for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) return false; return true; };
    const eksik = () => { const L = []; for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) L.push(i); return ` <br>Henüz denenmeyen küçük bölenler var: <b>${L.join(", ")}</b>. Bunları da deneyin.`; };
    function dene(d) {
      if (!d || d < 1) return; denendi.add(d);
      const b = Math.floor(N / d), r = N % d;
      if (d > N) { s.dur.innerHTML = `${d} > ${N}: ${E(N,"den")} büyük sayı ${E(N,"in")} çarpanı olamaz.`; return; }
      if (r === 0) { bul.add(d); bul.add(b); ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${N} : ${d} = ${b}, kalan 0 → <b>${d} ${x} ${b} = ${N}</b>. ${d} ve ${b} çarpandır.` + (d * d >= N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} ${d * d === N ? "=" : ">"} ${N}. Artık yeni çift çıkmaz; bütün çarpanlar bulundu.` : eksik() : ""); }
      else { s.dur.innerHTML = `<span class="kotu">✘</span> ${N} : ${d} işleminde bölüm ${b}, <b>kalan ${r}</b>. ${d}, ${E(N,"in")} çarpanı değildir.` + (d * d > N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} > ${N}. Daha büyük bölen denemeye gerek yok; çarpan listesi tamam.` : eksik() : ""); }
      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));
      if (tamam) s.yaz("n" + N, [N, [...bul].sort((a, b) => a - b).join(", "), bul.size], true);
    }
    bD.onclick = () => dene(Math.round(+bi.value));
    bS.onclick = () => { let d = 1; while (denendi.has(d)) d++; bi.value = d; dene(d); };
    if (bK) bK.onclick = async () => {
      bK.disabled = true; katlar.textContent = ""; const sat = h("div", "cn-katsat"); katlar.append(h("b", "", `${E(N,"in")} katları: `), sat);
      for (let i = 1; i <= (o.katSay || 12); i++) { sat.appendChild(h("span", "cn-kat2", `${N * i}`)); await bekle(220); }
      sat.appendChild(h("span", "cn-sonsuz", "… ve sonsuza kadar sürer"));
      bK.disabled = false;
    };
    yeni();
  }

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */
  function KUMBARA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Para", "Sonuç"] });
    const k = o.k; let hafta = 0, tmr = null;
    const kut = h("div", "cn-satir"); const bA = dug("Bir hafta geçsin +"), bO = dug("▶ Haftaları oynat", "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bO, bS); s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Kumbarada şu para olabilir mi? <input type="number" inputmode="numeric" min="1" max="500"> TL</label>`;
    const bT = dug("Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test); const ti = test.querySelector("input");
    function ciz() {
      const top = hafta * k, sv = [];
      const yuk = Math.min(150, top * 1.4);
      sv.push(`<rect x="110" y="20" width="120" height="160" rx="22" class="cn-kum"/><rect x="150" y="14" width="40" height="8" rx="3" class="cn-kum2"/>`);
      sv.push(`<rect x="116" y="${176 - yuk}" width="108" height="${yuk}" rx="10" class="cn-para"/>`);
      sv.push(`<text x="170" y="110" text-anchor="middle" class="cn-buyuk">${top} TL</text><text x="170" y="134" text-anchor="middle" class="cn-et">${hafta}. hafta</text>`);
      let cizgi = ""; for (let i = 1; i <= hafta && i <= 16; i++) cizgi += `<text x="${260 + ((i - 1) % 4) * 52}" y="${40 + Math.floor((i - 1) / 4) * 34}" class="cn-et2">${k}${x}${i}=${k * i}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 480 190" role="img" aria-label="Kumbara">${sv.join("")}${cizgi}</svg>`;
      s.dur.innerHTML = hafta ? `${hafta}. hafta sonunda kumbarada ${k} ${x} ${hafta} = <b>${top} TL</b> var.` : `Kumbara boş. Her hafta ${k} TL atılıyor.`;
    }
    bA.onclick = () => { hafta++; ciz(); };
    bO.onclick = () => { if (tmr) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } bO.textContent = "❚❚ Durdur"; tmr = setInterval(() => { if (hafta >= 15) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } hafta++; ciz(); }, az ? 50 : 500); };
    bS.onclick = () => { hafta = 0; ciz(); };
    bT.onclick = () => {
      const v = Math.round(+ti.value); if (!v) return; const b = Math.floor(v / k), r = v % k;
      s.dur.innerHTML = r ? `<span class="kotu">✘</span> ${k} ${x} ${b} = ${k * b} TL, ${k} ${x} ${b + 1} = ${k * (b + 1)} TL. ${v} TL arada kalır (${v} : ${k} → kalan ${r}). Kumbarada hiçbir hafta ${v} TL olmaz.`
        : `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · ${b}. hafta sonunda kumbarada tam ${v} TL olur.`;
      if (!r) { hafta = b; ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · <b>${b}. hafta</b> sonunda kumbarada tam ${v} TL olur.`; }
      s.yaz("t" + v, [v + " TL", r ? `kalan ${r} ✘` : `${k} ${x} ${b} ✔`], !r);
    };
    ciz();
  }

  /* 9) ÖNERME LABORATUVARI: önermeyi farklı sayılarla sınama */
  function ONERME(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Önerme", "Sayı", "Sonuç"] });
    let akt = 0; const kut = h("div", "cn-hazir");
    const bt = o.onermeler.map((on, i) => { const b = dug(on.ad, "ghost"); b.setAttribute("aria-pressed", i === 0); b.onclick = () => { akt = i; bt.forEach((x, j) => x.setAttribute("aria-pressed", j === i)); goster(); }; kut.appendChild(b); return b; });

  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →
     koşullar tek tek denetlenir (✔/✘) → deney defterine yazılır. Doğru cevap verilmez; öğrenci uygun girdiyi kendisi arar.
     o.girdi: [{ad, min, max, bas} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → SVG/HTML · o.kosullar: [{ad, f(v) → bool | {ok, not}}]
     o.dugme: düğme yazısı (false → her değişiklikte denetlenir) · o.sonuc(v, hepsi, L) · o.satir(v, hepsi, L) · o.iyi(v, L) · o.ek: [{ad, deger(v) → v}] */
  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);
      s.dur.innerHTML = m;
      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);
    }
    kur = true; ciz();
    if (bS) s.dur.innerHTML = o.ilk || "Değerleri seçip Sına düğmesine basın."; else sina();
  }

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

const K8 = (() => {
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const Q = (p, q = 1) => { if (q < 0) { p = -p; q = -q; } const g = gcd(p, q); return { p: p / g, q: q / g }; };
  const qp = (a, e) => { if (a === 0) return e > 0 ? Q(0) : null; return e >= 0 ? Q(a ** e) : Q(1, a ** (-e)); };   // a tam sayı
  const qpQ = (x, e) => e >= 0 ? Q(x.p ** e, x.q ** e) : Q(x.q ** (-e), x.p ** (-e));                                  // kesir taban
  const qEs = (x, y) => x && y && x.p === y.p && x.q === y.q;
  const qv = x => x.p / x.q;
  const sn = n => { if (typeof n === "bigint") { const s = (n < 0n ? -n : n).toString(); return (n < 0n ? "−" : "") + (s.length > 4 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, " ") : s); }
    if (typeof n !== "number") return String(n).replace(/-/g, "−"); const s = String(Math.abs(n)); return (n < 0 ? "−" : "") + (Math.abs(n) >= 10000 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, " ") : s); };
  const fr = (p, q) => `<span class="frac"><span>${p}</span><span>${q}</span></span>`;
  const qh = x => x === null ? "tanımsız" : x.q === 1 ? sn(x.p) : (x.p < 0 ? "−" : "") + fr(sn(Math.abs(x.p)), sn(x.q));
  const tb = a => typeof a === "number" && a < 0 ? `(${sn(a)})` : String(a);
  const us = (a, e) => `${tb(a)}<sup>${sn(e)}</sup>`;
  const UST = e => String(e).replace(/[−-]/g, "⁻").split("").map(c => c === "⁻" ? c : "⁰¹²³⁴⁵⁶⁷⁸⁹"[+c]).join("");
  const usU = (a, e) => `${typeof a === "number" && a < 0 ? `(${sn(a)})` : a}${UST(e)}`;
  const ondalik = (x, b = 1) => (Math.round(x * 10 ** b) / 10 ** b).toString().replace(".", ",");
  /* SVG kesir */
  const svgFr = (x, y, p, q, fs = 15, renk = "#1d2433") => `<text x="${x}" y="${y - fs * .2}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${renk}">${p}</text><line x1="${x - fs * .5}" y1="${y}" x2="${x + fs * .5}" y2="${y}" stroke="${renk}" stroke-width="${(fs * .08).toFixed(2)}"/><text x="${x}" y="${y + fs * .95}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${renk}">${q}</text>`;
  return { gcd, Q, qp, qpQ, qEs, qv, sn, fr, qh, tb, us, UST, usU, ondalik, svgFr };
})();

/* ---------------- ortak iskelet (canlandir.js ile aynı sınıflar) ---------------- */
CN.k8Iskelet = function (el, o) {
  const h = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.innerHTML = x; return e; };
  el.innerHTML = "";
  const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
  const sah = h("div", "cn-sahne"), den = h("div", "cn-den"), dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
  dur.setAttribute("aria-live", "polite");
  const df = h("details", "cn-df"); df.open = true;
  df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
  el.append(y, sah, den, dur, df);
  const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
  const yaz = (anahtar, hucre, iyi) => {
    if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
    kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
    tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
    tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
  };
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };
  return { h, sah, den, dur, yaz, dug, sayi: () => kayit.size, kayit };
};

/* ---------------- MOTOR: LAB (kuvvet laboratuvarı) ----------------
   o.girdi: [{ad, min, max, bas, adim?, yaz?} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → sahne (SVG/HTML) · o.durum(v) → sonuç metni
   o.satir(v) → deney defteri satırı (null: yazılmaz) · o.iyi(v) → yeşil/kırmızı satır · o.anahtar(v) · o.hazir: [{ad, v:[…]}] */
CN.LAB = function (el, o) {
  const s = CN.k8Iskelet(el, o), v = o.girdi.map(g => g.bas), ayar = [];
  o.girdi.forEach((g, i) => {
    const w = s.h("div", "cn-satir");
    if (g.sec) {
      w.classList.add("cn-secg"); w.appendChild(s.h("span", "cn-secad", g.ad));
      const bs = g.sec.map(x => { const b = s.dug(g.yaz ? g.yaz(x) : K8.sn(x), "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
      const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); guncelle(); };
      ayar[i] = sec;
    } else {
      const adim = g.adim || 1, ond = adim % 1 !== 0, yz = g.yaz || (x => ond ? K8.ondalik(x) : K8.sn(x));
      const a = s.h("div", "cn-adimci");
      a.innerHTML = `<span>${g.ad}</span><button type="button" aria-label="${g.ad.replace(/<[^>]+>/g, "")} azalt">−</button>${ond || g.yaz ? `<output></output>` : `<input type="number" inputmode="numeric" min="${g.min}" max="${g.max}" aria-label="${g.ad.replace(/<[^>]+>/g, "")}">`}<button type="button" aria-label="${g.ad.replace(/<[^>]+>/g, "")} artır">+</button>`;
      const [b1, b2] = a.querySelectorAll("button"), inp = a.querySelector("input"), out = a.querySelector("output");
      const kur = x => { x = Math.max(g.min, Math.min(g.max, Math.round((+x) / adim) * adim)); if (isNaN(x)) x = g.min; x = +x.toFixed(4); v[i] = x; if (inp) inp.value = x; else out.innerHTML = yz(x); };
      const ata = x => { kur(x); guncelle(); };
      b1.onclick = () => ata(v[i] - adim); b2.onclick = () => ata(v[i] + adim);
      if (inp) inp.onchange = () => ata(String(inp.value).replace(",", "."));
      kur(g.bas); ayar[i] = ata; w.appendChild(a);
    }
    s.den.appendChild(w);
  });
  if (o.hazir) { const hz = s.h("div", "cn-hazir cn-secg"); if (o.hazirEt) hz.appendChild(s.h("span", "cn-secad", o.hazirEt)); o.hazir.forEach(x => { const b = s.dug(x.ad, "ghost"); b.onclick = () => { x.v.forEach((y, i) => { if (y != null) { v[i] = y; } }); x.v.forEach((y, i) => { if (y != null) ayar[i](y); }); }; hz.appendChild(b); }); s.den.appendChild(hz); }
  let hazir = false;
  function guncelle() {
    if (!hazir) return;
    const c = v.slice(); s.sah.innerHTML = o.ciz(c, s); s.dur.innerHTML = o.durum(c, s);
    const r = o.satir ? o.satir(c, s) : null;
    if (r) s.yaz(o.anahtar ? o.anahtar(c) : c.join("|"), r, o.iyi ? o.iyi(c) : undefined);
    if (o.sonra) o.sonra(c, s);
  }
  hazir = true; guncelle();
  return { v, ayar, s };
};

/* ---------------- MOTOR: DURUM (düğmelerle adım adım değişen durum) ----------------
   o.bas(secim) → başlangıç durumu · o.dugmeler: [{ad, f(d) → {d, msg} }] · o.ciz(d) · o.durum(d) · o.bitti(d) → {anahtar, hucre, iyi, msg} | null
   o.secim: {ad, sec, bas, yaz} (başlangıcı seçtirir; değişince düzenek baştan kurulur) */
CN.DURUM = function (el, o) {
  const s = CN.k8Iskelet(el, o); let sec = o.secim ? o.secim.bas : null, d = o.bas(sec), son = "", kapali = false;
  if (o.secim) {
    const w = s.h("div", "cn-satir cn-secg"); w.appendChild(s.h("span", "cn-secad", o.secim.ad));
    const bs = o.secim.sec.map(x => { const b = s.dug(o.secim.yaz ? o.secim.yaz(x) : K8.sn(x), "ghost"); b.setAttribute("aria-pressed", x === sec); b.onclick = () => { sec = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", o.secim.sec[j] === x)); bastan(); }; w.appendChild(b); return b; });
    s.den.appendChild(w);
  }
  const w = s.h("div", "cn-satir");
  const bt = o.dugmeler.map(g => { const b = s.dug(g.ad, g.ghost ? "ghost" : ""); b.onclick = () => { if (kapali) return; const r = g.f(d); if (r.d) d = r.d; son = r.msg || ""; ciz(); }; w.appendChild(b); return b; });
  const bB = s.dug("Baştan", "ghost"); bB.onclick = () => bastan(); w.appendChild(bB); s.den.appendChild(w);
  function bastan() { d = o.bas(sec); son = ""; kapali = false; ciz(); }
  function ciz() {
    s.sah.innerHTML = o.ciz(d, sec); let m = (son ? son + "<br>" : "") + o.durum(d, sec);
    const b = o.bitti ? o.bitti(d, sec) : null;
    if (b) { kapali = !!b.kapat; s.yaz(b.anahtar, b.hucre, b.iyi); if (b.msg) m += "<br>" + b.msg; }
    bt.forEach(x => x.disabled = kapali);
    s.dur.innerHTML = m;
  }
  ciz();
};

/* ======================================================================= 20 soru */
window.CANL = (() => {
  const { Q, qp, qpQ, qEs, qv, sn, fr, qh, tb, us, usU, ondalik, svgFr } = K8;
  const iyi = t => `<span class="iyi">✔</span> ${t}`, kotu = t => `<span class="kotu">✘</span> ${t}`;
  const carpim = (a, n, en = 6) => n === 0 ? "1" : n <= en ? Array(n).fill(tb(a)).join(" · ") : `${Array(3).fill(tb(a)).join(" · ")} · … · ${tb(a)} (${n} tane)`;

  /* 1 · Kalem deposu: koli → kutu → paket → kalem, her düzeyde 4 ile çarpılır */
  const DUZ = ["koli", "kutu", "paket", "kalem"];
  function depoSvg(k) {
    const W = 360, R = ["#ffd8a8", "#a5d8ff", "#d0bfff", "#b2f2bb"], C = ["#e8590c", "#1c7ed6", "#7048e8", "#2b8a3e"]; let g = "";
    const kutu = (x, y, s, lv) => {
      if (lv > k) return;
      if (lv === 4) { for (let i = 0; i < 4; i++) { const xx = x + s * (.18 + i * .2); g += `<rect x="${xx}" y="${y + s * .15}" width="${s * .1}" height="${s * .62}" rx="${s * .04}" fill="${R[3]}" stroke="${C[3]}" stroke-width="1.2"/><path d="M${xx} ${y + s * .77} l${s * .05} ${s * .1} l${s * .05} ${-s * .1}z" fill="${C[3]}"/>`; } return; }
      const h = s / 2, p = lv === 1 ? 6 : lv === 2 ? 4 : 3;
      for (let i = 0; i < 4; i++) { const xx = x + (i % 2) * h, yy = y + Math.floor(i / 2) * h;
        g += `<rect x="${xx + p / 2}" y="${yy + p / 2}" width="${h - p}" height="${h - p}" rx="${lv === 1 ? 10 : 6}" fill="${R[lv - 1]}" stroke="${C[lv - 1]}" stroke-width="${lv === 1 ? 3 : 2}"/>`;
        kutu(xx + p / 2 + 2, yy + p / 2 + 2, h - p - 4, lv + 1); }
    };
    kutu(4, 4, W - 8, 1);
    return `<svg viewBox="0 0 ${W} ${W}" role="img" aria-label="Depo: ${k}. düzeye kadar açıldı">${g}</svg>`;
  }
  const C1 = el => CN.LAB(el, {
    yon: "Depoyu düzey düzey açın: önce koliler, sonra kutular, paketler ve kalemler görünsün. Her düzeyde kaç tane olduğunu ve bunu gösteren çarpımı izleyin.",
    bitis: "Kalemler düzeyine kadar açıp kalem sayısını gösteren üslü ifadeyi deney defterinde gördüğünüzde.",
    sutun: ["Açılan düzey", "Çarpım", "Üslü yazım", "Sayı"],
    girdi: [{ ad: "Açılan düzey:", sec: [1, 2, 3, 4], bas: 1, yaz: k => ["Koliler", "Kutular", "Paketler", "Kalemler"][k - 1] }],
    ciz: ([k]) => depoSvg(k),
    durum: ([k]) => `${k === 4 ? iyi("") : ""}Depoda ${4 ** k} ${DUZ[k - 1]} var: <b>${carpim(4, k)} = ${us(4, k)} = ${4 ** k}</b>.` + (k < 4 ? ` Bir düzey daha açın: her ${DUZ[k - 1]}${k === 1 ? "de" : k === 2 ? "da" : "te"} 4 ${DUZ[k]} var.` : " Bütün kalemler göründü."),
    satir: ([k]) => [["Koliler", "Kutular", "Paketler", "Kalemler"][k - 1], carpim(4, k), us(4, k), 4 ** k],
    iyi: ([k]) => k === 4 ? true : undefined });

  /* 2 · Birim küplerden büyük küp */
  function kupSvg(n, h) {
    const W = 360, Hh = 330, s = Math.min(26, 300 / (2 * n * .866 + 1), 300 / (n + h + .5)), c = s * .866;
    const ox = W / 2, oy = 30 + h * s + (Hh - 30 - (h * s + n * s)) / 2;
    const P = (x, y, z) => `${(ox + (x - y) * c).toFixed(1)},${(oy + (x + y) * s / 2 - z * s).toFixed(1)}`;
    const K = []; for (let z = 0; z < h; z++) for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) K.push([x, y, z]);
    K.sort((A, B) => (A[0] + A[1] + A[2]) - (B[0] + B[1] + B[2]));
    const yuz = (pts, r) => `<polygon points="${pts.map(q => P(...q)).join(" ")}" fill="${r}" stroke="#2b2370" stroke-width="1" stroke-linejoin="round"/>`;
    let g = ""; K.forEach(([x, y, z]) => { const ust = z === h - 1;
      g += yuz([[x, y, z + 1], [x + 1, y, z + 1], [x + 1, y + 1, z + 1], [x, y + 1, z + 1]], ust ? "#ffd43b" : "#c5bcf8") + yuz([[x + 1, y, z], [x + 1, y + 1, z], [x + 1, y + 1, z + 1], [x + 1, y, z + 1]], "#9a8af0") + yuz([[x, y + 1, z], [x + 1, y + 1, z], [x + 1, y + 1, z + 1], [x, y + 1, z + 1]], "#7563dc"); });

    satir: ([n, h]) => { h = Math.min(h, n); return [n, h, `${us(n, 2)} = ${n * n}`, h === n ? `${us(n, 3)} = ${n ** 3}` : n * n * h]; },

  /* 3 · video izlenme sayısı */
  const C3 = el => CN.LAB(el, {

    sutun: ["Tarih", "Üslü yazım", "İzlenme", "10 000'den fazla mı?"],
    girdi: [{ ad: "Nisan ayının günü:", min: 1, max: 15, bas: 1 }],
    ciz: ([g]) => { let o = ""; const W = 600, H = 176, mx = 2 ** 17;
      for (let d = 1; d <= g; d++) { const v = 2 ** (d + 2), h = Math.max(2, v / mx * 140), x = 20 + (d - 1) * 38;

      return svg(W, H, o, "izlenme sütunları"); },
    durum: ([g]) => { const v = 2 ** (g + 2); return `${g} Nisan: 2${UST(g + 2)} = <b>${sn(v)}</b> izlenme. ` + (v > 10000 ? (2 ** (g + 1) > 10000 ? "Bu gün 10 000'i geçen ilk gün değil." : iyi("10 000 ilk kez bu gün geçildi.")) : "Henüz 10 000'e ulaşılmadı."); },

  const C4 = el => { const bul = new Set(); return CN.LAB(el, {
    yon: "Üç basamağın her biri için bir rakam kartı seçin. Oluşan sayının 2'nin ya da 3'ün bir kuvveti olup olmadığı ve kartların bir kez kullanılıp kullanılmadığı denetlenir. Şifre olabilecek bütün sayıları arayın.",

  const F = { F1: { s: "4⁻¹ &lt; 5⁻²", a: [Q(1, 4), Q(1, 25)], op: "<", y: "F2", d: "F3" }, F2: { s: "(−2)⁻³ &gt; (−2)⁻²", a: [Q(-1, 8), Q(1, 4)], op: ">", y: "F4", d: "C" },

      return svg(420, 160, `<rect x="204" y="60" width="12" height="80" fill="#adb5bd"/><g transform="rotate(${-egim} 210 60)"><line x1="70" y1="60" x2="350" y2="60" stroke="#495057" stroke-width="6"/>
        <ellipse cx="80" cy="44" rx="34" ry="20" fill="#2b8a3e"/>${tx(80, 49, "3 kg", 13, "#fff")}<rect x="300" y="36" width="100" height="20" rx="6" fill="#ced4da"/>${tx(350, 51, s.toString().replace(".", ",") + " kg", 13)}</g>`, "terazi"); },
    durum: ([x, y]) => { const s = Q(2 * x + y, 8); const d = s.p * 1 === 3 * s.q;
      return `Sağ kefe: ${x} · ${fr(1, 4)} + ${y} · ${fr(1, 8)} = <b>${qh(s)}</b> kg. ` + (d ? (x && y ? iyi(`Denge! ${x + y} ağırlık.`) : kotu("Denge var ama iki türden de en az birer ağırlık olmalı.")) : "Denge yok."); },
    satir: ([x, y]) => { const s = Q(2 * x + y, 8), d = s.p === 3 * s.q; return [x, y, qh(s) + " kg", d ? "evet" : "hayır", x + y]; },
    iyi: ([x, y]) => (2 * x + y === 24 && x > 0 && y > 0) ? true : undefined });

  /* 11 · boncuklu tel */
  const C11 = el => CN.LAB(el, {
    yon: "Telin büküleceği yeri seçin: aşağıdaki koldaki boncuk sayısını belirleyin. Aşağıdaki boncuk sayısının ters işaretlisi taban, yukarıdakilerin sayısı üs olur. Bütün bükülüşleri deneyin.",
    bitis: "Altı bükülüşün hepsini deneyip en büyük ve en küçük değeri bulduğunuzda.",
    sutun: ["Aşağıdaki kol", "Yukarıdaki kol", "İfade", "Değer"],
    girdi: [{ ad: "Aşağıdaki koldaki boncuk:", sec: [1, 2, 3, 4, 5, 6], bas: 5 }],
    ciz: ([k]) => { let o = `<line x1="120" y1="20" x2="120" y2="${20 + (7 - k) * 22}" stroke="#868e96" stroke-width="3"/><line x1="140" y1="${36 + (7 - k) * 22}" x2="140" y2="${40 + 7 * 22 + 20}" stroke="#868e96" stroke-width="3"/>`;
      for (let i = 0; i < 7 - k; i++) o += `<circle cx="120" cy="${32 + i * 22}" r="9" fill="#ffd8a8" stroke="#e8590c"/>`;
      for (let i = 0; i < k; i++) o += `<circle cx="140" cy="${50 + (7 - k) * 22 + i * 22}" r="9" fill="#a5d8ff" stroke="#1971c2"/>`;
      o += tx(300, 120, usS(-k, 7 - k) + " = " + sn((-k) ** (7 - k)), 22); return svg(440, 230, o, "tel"); },
    durum: ([k]) => `Aşağıda ${k}, yukarıda ${7 - k} boncuk: <b>${us(-k, 7 - k)} = ${sn((-k) ** (7 - k))}</b>.`,
    satir: ([k]) => [k, 7 - k, us(-k, 7 - k), sn((-k) ** (7 - k))] });

  /* 12 · dört tuşlu program (CN.DURUM) */
  const deg12 = d => d.a === 0 && d.e <= 0 ? null : qp(d.a, d.e);
  const C12 = el => CN.DURUM(el, {
    yon: "Tuşlara basarak ekrandaki ifadenin tabanını ya da üssünü değiştirin. Basma sayısı sayılır. Değer " + fr(1, 64) + " olunca deneme deftere yazılır. Daha az basmayla ulaşmanın yollarını arayın.",
    bitis: "Değeri " + fr(1, 64) + " yapan en az basma sayısını bulduğunuzda.",
    sutun: ["Ulaşılan ifade", "Basma sayısı"],
    bas: () => ({ a: 5, e: 2, n: 0 }),
    dugmeler: [{ ad: "Taban +1", f: d => ({ d: { ...d, a: d.a + 1, n: d.n + 1 } }) }, { ad: "Taban −1", f: d => ({ d: { ...d, a: d.a - 1, n: d.n + 1 } }) },
               { ad: "Üs +1", f: d => ({ d: { ...d, e: d.e + 1, n: d.n + 1 } }) }, { ad: "Üs −1", f: d => ({ d: { ...d, e: d.e - 1, n: d.n + 1 } }) }],
    ciz: d => `<p class="k8-buyuk">${us(d.a, d.e)}</p>`,
    durum: d => { const v = deg12(d); return `Ekran: ${us(d.a, d.e)} = <b>${v ? qh(v) : "tanımsız"}</b> · basma sayısı: <b>${d.n}</b>`; },
    bitti: d => { const v = deg12(d); return v && qEs(v, Q(1, 64)) ? { anahtar: d.a + "|" + d.e + "|" + d.n, hucre: [us(d.a, d.e), d.n], iyi: true, kapat: true, msg: iyi(`${fr(1, 64)} değerine ${d.n} basmada ulaştınız. Daha az basmayla ulaşılabilir mi? Baştan deneyebilirsiniz.`) } : null; } });

  /* 13 · kaydırılan şeritler */
  const UST13 = [-3, -2, 2, 3], ALT13 = [-2, -1, 0, 1, 2, 3];
  const C13 = el => CN.LAB(el, {
    yon: "Alt şeridi kaydırın (üst şeridin dört karesinin hepsinin altında kare olacak konumlar). Alt alta gelen dört ifadenin değerleri hesaplanır. Hepsinin tam sayı olduğu konumu bulun.",
    bitis: "Dört değerin de tam sayı olduğu konumu bulup toplamı gördüğünüzde.",
    sutun: ["Sola kaydırma", "İfadeler", "Hepsi tam sayı mı?", "Toplam"],
    girdi: [{ ad: "Alt şeridi sola kaydırma (kare):", sec: [0, 1, 2], bas: 0 }],
    ciz: ([s]) => { let o = ""; UST13.forEach((v, i) => o += `<rect x="${110 + i * 52}" y="10" width="52" height="40" fill="#fff4e6" stroke="#e8590c"/>` + tx(136 + i * 52, 36, sn(v), 16));
      ALT13.forEach((v, j) => o += `<rect x="${110 + (j - s) * 52}" y="56" width="52" height="40" fill="#d0ebff" stroke="#1971c2"/>` + tx(136 + (j - s) * 52, 82, sn(v), 16));
      return svg(520, 104, o, "şeritler"); },
    durum: ([s]) => { const L = UST13.map((a, i) => qp(a, ALT13[i + s])); const ok = L.every(x => x.q === 1);
      return UST13.map((a, i) => `${us(a, ALT13[i + s])} = ${qh(L[i])}`).join("; ") + "<br>" + (ok ? iyi(`Hepsi tam sayı. Toplam: <b>${L.reduce((a, b) => a + b.p, 0)}</b>.`) : kotu("Tam sayı olmayan değer var.")); },
    satir: ([s]) => { const L = UST13.map((a, i) => qp(a, ALT13[i + s])), ok = L.every(x => x.q === 1); return [s, UST13.map((a, i) => us(a, ALT13[i + s])).join(", "), ok ? "evet" : "hayır", ok ? L.reduce((a, b) => a + b.p, 0) : "—"]; },
    iyi: ([s]) => s === 2 });

  /* 14 · maya hücreleri ve ilaç */
  const say14 = y => { let n = 2; for (let i = 1; i <= y; i++) { n *= 3; if (i === 6) n = n / 81; } return n; };
  const C14 = el => CN.LAB(el, {
    yon: "Geçen süreyi yarım saat yarım saat artırın. Her 30 dakikada hücre sayısı 3 katına çıkar; 3. saatin sonunda ilaç damlatılır ve hücrelerin yalnız 3⁻⁴'ü canlı kalır.",
    bitis: "5. saatin sonundaki hücre sayısını bulduğunuzda.",
    sutun: ["Süre", "Olay", "Hücre sayısı"],
    girdi: [{ ad: "Geçen süre (yarım saat):", min: 0, max: 10, bas: 0 }],
    ciz: ([y]) => { let o = ""; for (let i = 0; i <= y; i++) { const n = say14(i), h = Math.max(2, n / 1458 * 120);
      o += `<rect x="${20 + i * 44}" y="${140 - h}" width="30" height="${h}" fill="${i === 6 ? "#e03131" : "#ffd43b"}"/>` + tx(35 + i * 44, 158, String(i / 2).replace(".", ","), 13, "#495057"); }
      return svg(500, 180, o + tx(496, 176, "saat", 13, "#495057", "end"), "hücre sayıları"); },
    durum: ([y]) => `${y / 2} saat sonra kapta <b>${sn(say14(y))}</b> hücre var.` + (y === 6 ? " İlaç damlatıldı: " + "1458 · 3⁻⁴ = 18." : ""),
    satir: ([y]) => [String(y / 2).replace(".", ",") + " saat", y === 0 ? "başlangıç" : y === 6 ? "çoğalma ve ilaç" : "çoğalma", sn(say14(y))],
    iyi: ([y]) => y === 10 ? true : undefined });

  /* 15 · deneme puanı */
  const KV = [1, 2, 4, 8, 16];
  const C15 = el => CN.LAB(el, {
    yon: "Doğru, yanlış ve boş sayılarını seçin. Toplamın 20 olup olmadığı ve her sayının 2'nin pozitif tam sayı kuvveti olup olmadığı denetlenir; puan hesaplanır. En yüksek puanı arayın.",
    bitis: "Koşulları sağlayan bütün dağılımları deneyip en yüksek puanı bulduğunuzda.",
    sutun: ["Doğru", "Yanlış", "Boş", "Koşullar", "Puan"],
    girdi: [["Doğru", 8], ["Yanlış", 8], ["Boş", 4]].map(([a, b]) => ({ ad: a + ":", sec: KV, bas: b })),
    ciz: ([d, y, b]) => `<div class="k8-satir"><span class="k8-kart">${d}</span><span class="k8-kart" style="--kr:#e03131">${y}</span><span class="k8-kart" style="--kr:#868e96">${b}</span></div>`,
    durum: ([d, y, b]) => { const t = d + y + b === 20, p = [d, y, b].every(x => x > 1); return (t ? "" : kotu(`Toplam ${d + y + b}, 20 değil. `)) + (p ? "" : kotu("1 = 2⁰ pozitif kuvvet değildir. ")) + `Puan: 4 · ${d} − ${y} = <b>${4 * d - y}</b>.`; },
    satir: ([d, y, b]) => [d, y, b, d + y + b === 20 && [d, y, b].every(x => x > 1) ? "uygun ✔" : "uymuyor", 4 * d - y],
    iyi: ([d, y, b]) => d + y + b === 20 && [d, y, b].every(x => x > 1) });

  /* 16 · iki torba */
  const C16 = el => { const bul = new Set(); return CN.LAB(el, {
    yon: "Mavi torbadan bir taban, turuncu torbadan bir üs seçin. İfadenin değeri hesaplanır. Değeri negatif bir tam sayı olan bütün ifadeleri bulun.",
    bitis: "9 ifadenin hepsini denediğinizde ya da hepsini bulduğunuzu düşündüğünüzde.",
    sutun: ["İfade", "Değer", "Negatif tam sayı mı?"],
    girdi: [{ ad: "Mavi torba (taban):", sec: [-3, -2, -1], bas: -3 }, { ad: "Turuncu torba (üs):", sec: [-2, -1, 3], bas: 3 }],
    ciz: ([a, e]) => `<p class="k8-buyuk">${us(a, e)} = ${qh(qp(a, e))}</p>`,
    durum: ([a, e]) => { const v = qp(a, e), ok = v.q === 1 && v.p < 0; if (ok) bul.add(a + "|" + e);
      return (ok ? iyi("Negatif tam sayı.") : "Negatif tam sayı değil.") + `<br>Bulduklarınız (${bul.size}): ${[...bul].map(x => us(...x.split("|").map(Number))).join(", ") || "henüz yok"}.`; },
    satir: ([a, e]) => { const v = qp(a, e); return [us(a, e), qh(v), v.q === 1 && v.p < 0 ? "evet" : "hayır"]; },
    iyi: ([a, e]) => { const v = qp(a, e); return v.q === 1 && v.p < 0; } }); };

  return { 1: C1, 2: C2, 3: C3, 4: C4, 5: C5, 6: C6, 7: C7, 8: C8, 9: C9, 10: C10, 11: C11, 12: C12, 13: C13, 14: C14, 15: C15, 16: C16 };
})();

["Buz parçaları A ucuna 2<sup>0</sup> = 1, 2, 4, 8, 16, 32 ve 64 cm uzaklıktadır (128 &gt; 100 olduğundan 7 parça vardır).", "Isılar aynı hızla ilerlediği için çubuğun ortasında, A ucundan 50 cm uzaklıkta karşılaşır. A ucuna 50 cm'den yakın olan buzlar 1. mumun ısısıyla erir: 1, 2, 4, 8, 16, 32 → 6 parça.", "64 cm'deki buz B ucuna daha yakındır (100 − 64 = 36 cm); 2. mumun ısısıyla erir → 1 parça. Fark 6 − 1 = 5'tir."], "t": "4: 2<sup>0</sup> = 1 cm'deki buz unutulmuş; 6: 1. mumun erittiği parça sayısı farkla karıştırılmış; 3: 32 cm'deki buz da B ucuna yakın sanılmış.", "d": "2'nin doğal sayı kuvvetleri 2<sup>0</sup> = 1'den başlar; 1 cm'deki buzu unutmayın. Isılar aynı hızla ilerlediği için çubuğun tam ortasında karşılaşır: her buzun hangi uca daha yakın olduğuna bakın.", "ses": "b01"}, {"no": 2, "on": "<p>Bir bilim merkezindeki saatte iki sıra lamba vardır. Üst sıradaki lambalar saati, alt sıradaki lambalar dakikayı göstermektedir. Her lambanın altında, lamba yandığında eklenen değer yazılıdır. Bir sıradaki yanan lambaların değerleri toplanarak saat ya da dakika bulunur.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1260 550\" width=\"1260\" style=\"width:150mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAFMAvgDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAQACAwQFBgcI/8QARBAAAQMCBAMFBQYEBAYBBQAAAQACAwQRBRIhMRNBUQYiMmFxFCOBkdEVM0JSobEkYsHhU3KS8BYlNEOC8XM1RFSTwv/EABkBAQEBAQEBAAAAAAAAAAAAAAABAwIEBf/EACQRAQADAAICAgMBAAMAAAAAAAABAhEDMRIhBEETIjJRI0Jh/9oADAMBAAIRAxEAPwDzJ5u5BqR3RCxbHDdWoGgqqFcpwuZdQshgso3MsnuJAQGoXKg3QKKZokBUzhZqjsSqM18ZhkzDZW4ZszBdSPhvuEzIGaBXdTMNkYHKAh0Zup3EgpzQHbomNqkBqMJgaBc2sBbzXQ0l3wZoHcMk97v5mnXzvbZYeERe0QRxvAcyPw2JBDv/AEtk00T size=\"38\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">?</text></g></svg>", "son": "<p>Ada'nın belirleyeceği şifre, 2'nin ya da 3'ün bir kuvvetidir.</p>", "k": "Buna göre, Ada'nın belirleyebileceği <u style=\"white-space:nowrap\">en büyük</u> şifre ile <u style=\"white-space:nowrap\">en küçük</u> şifrenin farkı kaçtır?", "sec": ["217", "256", "384", "473"], "secg": null, "c": "D", "a": ["Üç basamaklı 2'nin kuvvetleri 128, 256 ve 512'dir; üç basamaklı 3'ün kuvvetleri 243 ve 729'dur.", "Kartlarda 8 ve 4 rakamı yoktur; 128 ve 243 yazılamaz. 256, 512 ve 729 kartlarla yazılabilir.", "En büyük şifre 729, en küçük şifre 256'dır. Fark 729 − 256 = 473'tür."], "t": "256: 729 düşünülmeyip en büyük şifre 512 alınmış, 512 − 256 yapılmış; 384: ayrıca 128 de yazılabilir sanılıp 512 − 128 yapılmış; 217: en küçük şifre 512 alınmış, 256 gözden kaçmış.", "d": "Önce üç basamaklı bütün 2 ve 3 kuvvetlerini yazın, sonra her birinin rakamlarının kartlarda olup olmadığını denetleyin. Kartta olmayan bir rakam (4 ya da 8) o sayıyı eler.", "ses": "b04"}, {"no": 5, "on": "<p>Uzunluğu 1 m olan bir rafa K, L, M ve N kutuları, aralarında boşluk kalmayacak şekilde ve rafın bir ucundan başlanarak yan yana konmuştur. Kutuların genişlikleri aşağıdaki tabloda verilmiştir.</p>", "g": "<div class=\"sbw\" style=\"display:flex;flex-direction:column;align-items:center;gap:3mm;width:100%\"><svg class=\"foto511\" viewBox=\"0 0 1376 410\" width=\"1376\" style=\"width:150mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCADiAvgDASIAAhEBAxEB/8QAGwABAQADAQEBAAAAAAAAAAAAAAECAwQFBgf/xABLEAACAQICBQcGCwUHAwUAAAAAAQIDEQQSEyExQZEFUVNhgZLRBhRCUnGhByIyM0NUcqKxssEjNDVicxUkNkR0guEWJmMlZJ undaki değerlerin toplamı <span class=\"frac\"><span>1</span><span>16</span></span> + <span class=\"frac\"><span>8</span><span>16</span></span> = <span class=\"frac\"><span>9</span><span>16</span></span>'dır."], "t": "<span class=\"frac\"><span>41</span><span>16</span></span>: 5<sup>0</sup> ve (−1)<sup>6</sup> de L kutusuna atılmış; <span class=\"frac\"><span>1</span><span>16</span></span>: 2<sup>−1</sup> negatif sanılıp K kutusuna atılmış; <span class=\"frac\"><span>1</span><span>2</span></span>: (−4)<sup>−2</sup> negatif sanılıp K kutusuna atılmış.", "d": "Değeri 1 olan kartlar “1'den küçük mü?” sorusuna “Hayır” cevabı verir. −3<sup>−2</sup> ifadesinde eksi işareti tabana ait değildir; değer negatiftir. (−4)<sup>−2</sup> ise pozitiftir.", "ses": "b06"}, {"no": 7, "on": "<p>Bir su arıtma düzeneğinde su, art arda dizilmiş özdeş filtrelerden geçmektedir. Her filtre, kendisine gelen sudaki kirin yalnız <span class=\"frac\"><span>1</span><span>3</span></span>'ünü geçirmekte, geri kalanını tutmaktadır.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1500 724\" width=\"1500\" style=\"width:145.0mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAFvAvgDASIAAhEBAxEB/8QAGwAAAQUBAQAAAAAAAAAAAAAAAQACAwQFBgf/xABPEAABAwIEAQcGDAQEBQIGAwABAAIDBBEFEiExQQYTIlFhcZEUMlKBobEVIzM1QlNicnOSwdEkJTRDB4Ky4RZUY/DxhMI2RHSDk6JVZLP/xAAaAQEBAQEBAQEAAAAAAAAAAAAAAQIDBAUG/8QAKBEBAQACAgEEAgICAwEAAAAAAAECERIxAwQTIVEyQRRhInEzQlKB/9oADAMBAAIRAxEAPwC/yg+fXfeXW4F/QtXJcoPn133l1uA/0LVznbpWsEUAitMAg/zD3Jya7zD3Iry3EfnGp/Fd71UcrmIj+ZVP4jveqblzbQSrPl+VWhJss+b5ZVD2KVqhapmoJGnROTAnDVA8J4TAnBFSNTwo2qRqCVinYoWBTsCImapWqFqmYFRKE4JrU8ILlGbELcp3iy56G4NwtOmnIsCg1rpKKOQEKUG6IKSCKBJJJICgkigCSKCBj2XVa an>4</span></span> + y · <span class=\"frac\"><span>1</span><span>8</span></span> = 3 olmalıdır.", "Eşitlik 8 ile çarpılırsa 2x + y = 24 olur. Ağırlık sayısı x + y = 24 − x'tir; x büyüdükçe toplam azalır.", "y en az 1 olmalı ve 2x + y = 24 olduğundan y çift sayıdır; en küçük y = 2, x = 11'dir. En az 11 + 2 = 13 ağırlık konur."], "t": "12: yalnız 1. tür ağırlık kullanılmış, 2. türden de en az bir tane konması gerektiği unutulmuş; 14: x = 10, y = 4 bulunup daha az ağırlıkla denge aranmamış; 23: yalnız 1 tane 1. tür ağırlık konup kalan 2. türle tamamlanmış.", "d": "Ağırlıkları kesre çevirin ve eşitliği 8 ile çarparak sadeleştirin (2x + y = 24). Toplam ağırlık sayısını azaltmak için ağır olan türden olabildiğince çok kullanın, ama hafif türden de en az bir tane bulunmalıdır.", "ses": "b10"}, {"no": 11, "on": "<p>Mert'in elinde, üzerinde 7 boncuk bulunan esnek bir tel vardır. Mert teli iki boncuğun arasından bükerek bir kolunu yukarıda, diğer kolunu aşağıda bırakmaktadır. Sonra aşağıdaki koldaki boncuk sayısının ters işaretlisini taban, yukarıdaki koldaki boncuk sayısını üs olarak alıp bir üslü ifade yazmaktadır.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1176 540\" width=\"1176\" style=\"width:150mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAFdAvgDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAgMAAQQFBgf/xAA/EAACAgEDAgQDBgUDAwMEAwABAgADEQQSITFBBRNRYSIycRQjQlKBkQahscHRFWLhM0NyJFPwFoKS8SWiwv/EABoBAQEBAQEBAQAAAAAAAAAAAAABAgMEBQb/xAAlEQEBAAICAgICAgMBAAAAAAAAAQIRAxIhMQQTQVEiYQUUMnH/2gAMAwEAAhEDEQA/APobQM8wmgThXU1TCMWkYZYlZ7+k5ep7zrX/ACzk6nvMZN4san4jG54iAfjjQZhsq48Tn395uvmC/vM1uMLnkzNaeZpfqZltMkKw6nvM6dZo1HeZ06zY01iaU6TPVNK9JiqzagcGcu/5p1dR0nLv6maiVVU \" height=\"45.0\" rx=\"10.5\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"2.1\" fill-opacity=\".95\"/><text x=\"1230.0\" y=\"600.8\" font-size=\"30\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">Büküm yeri</text><line x1=\"1190.0\" y1=\"568.0\" x2=\"1118.2\" y2=\"516.5\" stroke=\"#495057\" stroke-width=\"4\"/><path d=\"M1112.0,512.0 L1124.6,514.2 L1118.1,523.2 Z\" fill=\"#495057\"/><rect x=\"283.4\" y=\"302.8\" width=\"373.1\" height=\"54.4\" rx=\"11.899999999999999\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"2.3800000000000003\" fill-opacity=\".95\"/><text x=\"470.0\" y=\"342.2\" font-size=\"34\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">Yazılan ifade: (−5)<tspan baseline-shift=\"super\" font-size=\"68%\">2</tspan></text></g></svg>", "son": "<p>Yukarıda, telin bir bükülüşü ve bu bükülüşte yazılan ifade örnek olarak gösterilmiştir. Her iki kolda da en az bir boncuk bulunmaktadır.</p>", "k": "Buna göre, Mert'in yazabileceği ifadelerden değeri <u style=\"white-space:nowrap\">en büyük</u> olan ile <u style=\"white-space:nowrap\">en küçük</u> olanın farkı kaçtır?", "sec": ["17", "89", "113", "145"], "secg": null, "c": "D", "a": ["Aşağıdaki kolda k boncuk varsa yukarıdaki kolda 7 − k boncuk vardır; ifade (−k)<sup>7 − k</sup> olur (k = 1, 2, …, 6).", "Değerler: (−1)<sup>6</sup> = 1, (−2)<sup>5</sup> = −32, (−3)<sup>4</sup> = 81, (−4)<sup>3</sup> = −64, (−5)<sup>2</sup> = 25, (−6)<sup>1</sup> = −6.", "En büyük 81, en küçük −64'tür. Fark 81 − (−64) = 145'tir."], "t": "17: fark alınırken −64'ün işareti unutulmuş; 89: (−3)<sup>4</sup> negatif sanılıp en büyük değer 25 alınmış; 113: (−4)<sup>3</sup> pozitif sanılıp en küçük değer −32 alınmış.", "d": "Taban negatiftir; üs çiftse değer pozitif, tekse negatiftir. En küçük değer için mutlak değeri büyük bir negatif sonuç arayın; farkı alırken eksi işaretini unutmayın.", "ses": "b11"}, {"no": 12, "on": "<p>Bir hesap programının ekranında bir üslü ifade ya "matrix(0.9950 0.0502 -0.0282 1.1150 981.8 498.7)\"><text x=\"0.0\" y=\"0.0\" font-size=\"21\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-maxw=\"107\" data-sabit=\"1\">Üs</text></g><g transform=\"matrix(0.9912 0.0655 -0.0280 1.1074 981.2 524.2)\"><text x=\"0.0\" y=\"0.0\" font-size=\"21\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">−1</text></g></g></svg>", "son": "<p>Kerem, tuşları kullanarak ekrandaki ifadenin değerini <span class=\"frac\"><span>1</span><span>64</span></span> yapmak istemektedir.</p>", "k": "Buna göre, Kerem tuşlara toplam <u style=\"white-space:nowrap\">en az</u> kaç kez basmalıdır?", "sec": ["6", "7", "8", "11"], "secg": null, "c": "A", "a": ["<span class=\"frac\"><span>1</span><span>64</span></span> sayısının tabanı ve üssü tam sayı olan yazılışları: 2<sup>−6</sup>, (−2)<sup>−6</sup>, 4<sup>−3</sup>, 8<sup>−2</sup>, (−8)<sup>−2</sup> ve 64<sup>−1</sup>'dir.", "Ekranda 5<sup>2</sup> vardır. Her yazılış için gereken basma sayısı, tabanın ve üssün değişim miktarlarının toplamıdır: 2<sup>−6</sup> için 3 + 8 = 11; 4<sup>−3</sup> için 1 + 5 = 6; 8<sup>−2</sup> için 3 + 4 = 7; diğerleri daha fazladır.", "En az 6 kez basılır (1 kez “Taban −1”, 5 kez “Üs −1”)."], "t": "11: yalnız 2<sup>−6</sup> yazılışı düşünülmüş; 7: 8<sup>−2</sup> yazılışı bulunmuş ama 4<sup>−3</sup> denenmemiş; 8: üssün 2'den −3'e inmesi için 5 yerine 7 basma sayılmış.", "d": "Önce hedef değerin bütün yazılışlarını bulun: <span class=\"frac\"><span>1</span><span>64</span></span> = 2<sup>−6</sup> = 4<sup>−3</sup> = 8<sup>−2</sup> … Sonra her yazılış için tabanın ve üssün ne kadar değiştiğini toplayın; en kısa yolu seçin.", "ses": "b12"}, {"no": 13, "on": "<p>Ece iki kâğıt şeridi üst üste koymuştur. Üst şeridin karelerindeki sayılar taban, alt şeridin karelerindeki sayılar üs olarak kullanılmaktadır. Alt alta gelen iki kareden bir üslü ifade yazılmaktadır. Şeritlerin ilk konumu aşağıda gösterilmiştir.</p>", "g": "<svg class=\"foto5 xt-anchor=\"middle\">−3</text><text x=\"608.0\" y=\"328.0\" font-size=\"64\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">−2</text><text x=\"763.0\" y=\"328.0\" font-size=\"64\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2</text><text x=\"918.0\" y=\"328.0\" font-size=\"64\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">3</text><text x=\"453.0\" y=\"486.0\" font-size=\"64\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">−2</text><text x=\"608.0\" y=\"486.0\" font-size=\"64\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">−1</text><text x=\"763.0\" y=\"486.0\" font-size=\"64\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">0</text><text x=\"919.0\" y=\"486.0\" font-size=\"64\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">1</text><text x=\"1074.0\" y=\"486.0\" font-size=\"64\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2</text><text x=\"1229.0\" y=\"486.0\" font-size=\"64\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">3</text><rect x=\"154.6\" y=\"278.0\" width=\"190.9\" height=\"54.0\" rx=\"12.6\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"2.5200000000000005\" fill-opacity=\".95\"/><text x=\"250.0\" y=\"318.0\" font-size=\"36\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">Üst şerit</text><rect x=\"160.1\" y=\"436.0\" width=\"179.9\" height=\"54.0\" rx=\"12.6\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"2.5200000000000005\" fill-opacity=\".95\"/><text x=\"250.0\" y=\"476.0\" font-size=\"36\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">Alt şerit</text><line x1=\"700.0\" y1=\"598.0\" x2=\"479.6\" y2=\"598.0\" stroke=\"#1971c2\" stroke-width=\"5\"/><path d=\"M470.0,598.0 L484.4,591.0 L484.4,605.0 Z\" fill=\"#1971c2\"/><line x1=\"1010.0\" y1=\"598.0\" x2=\"1230.4\" y2=\"598.0\" stroke=\"#1971c2\" stroke-width=\"5\"/><path d=\"M1240.0,598.0 L1225.6,605.0 L1225.6,591.0 Z\" fill=\"#1971c2\"/><rect x=\"736.9\" y=\"574.0\" width=\"236.2\" height=\"48.0\" rx=\"11.2\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"2.24\" fill-opacity=\".95\"/><text x=\"855.0\" y=\"609.5\" font-size=\"32\" font-weight=\"800\" fill=\"#1971c2\" text-anchor=\"middle\" data-sabit=\"1\">kaydırılabilir</text></g></svg>", "son": "<p>Üst şerit sabittir. Alt şerit, kareler tam olarak alt alta gelecek şekilde sağa ya da sola kaydırılabilmektedir. Ece alt şeridi, üst şeridin dört karesinin hepsinin altında bir kare bulunacak ve alt alta gelen dört ifadenin hepsinin değeri tam sayı olacak şekilde bir konuma getirmiştir.</p>", "k": "Buna göre, bu konumda alt alta gelen dört ifadenin değerleri toplamı kaçtır?", "sec": ["12", "28", "30", "34"], "secg": null, "c": "C", "a": ["Alt şeritte 6, üst şeritte 4 kare olduğundan dört karenin hepsinin altında kare bulunan 3 konum vardır: alt şerit ilk konumda, 1 kare sola ya da 2 kare sola kaydırılmış.", "İlk konumda üsler −2, −1, 0, 1'dir: (−3)<sup>−2</sup> = <span class=\"frac\"><span>1</span><span>9</span></span> tam sayı değildir. 1 kare kaydırınca üsler −1, 0, 1, 2'dir: (−3)<sup>−1</sup> tam sayı değildir.", "2 kare kaydırınca üsler 0, 1, 2, 3 olur: (−3)<sup>0</sup> = 1, (−2)<sup>1</sup> = −2, 2<sup>2</sup> = 4, 3<sup>3</sup> = 27; hepsi tam sayıdır. Toplam 1 − 2 + 4 + 27 = 30'dur."], "t": "28: (−3)<sup>0</sup> = −1 alınmış; 34: (−2)<sup>1</sup> = 2 alınmış; 12: 3<sup>3</sup> = 3 · 3 = 9 alınmış.", "d": "Üs negatifse ve taban −1 değilse değer kesir olur. Bu yüzden dört değerin tam sayı olması için alt şeritteki negatif üslerin üst şeridin altından çıkması gerekir. (−3)<sup>0</sup> = 1'dir.", "ses": "b13"}, {"no": 14, "on": "<p>Bir laboratuvarda maya hücreleriyle bir deney yapılmıştır. Deneyde yapılanlar, araştırmacının deney defterine aşağıdaki gibi yazılmıştır.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1160 602\" width=\"1160\" style=\"width:134.9mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" f t><text x=\"450.0\" y=\"222.0\" font-size=\"46\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Doğru</text><text x=\"450.0\" y=\"304.0\" font-size=\"80\" font-weight=\"800\" fill=\"#c2255c\" text-anchor=\"middle\">?</text><text x=\"450.0\" y=\"403.0\" font-size=\"46\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Yanlış</text><text x=\"450.0\" y=\"485.0\" font-size=\"80\" font-weight=\"800\" fill=\"#c2255c\" text-anchor=\"middle\">?</text><text x=\"450.0\" y=\"583.0\" font-size=\"46\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Boş</text><text x=\"450.0\" y=\"665.0\" font-size=\"80\" font-weight=\"800\" fill=\"#c2255c\" text-anchor=\"middle\">?</text><text x=\"940.0\" y=\"272.0\" font-size=\"38\" font-weight=\"800\" fill=\"#e8590c\" text-anchor=\"middle\">Puanlama</text><text x=\"776.0\" y=\"333.0\" font-size=\"34.6\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\" data-maxw=\"350\">Soru sayısı: 20</text><text x=\"776.0\" y=\"393.0\" font-size=\"34.6\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\" data-maxw=\"350\">Her doğru: +4 puan</text><text x=\"776.0\" y=\"453.0\" font-size=\"34.6\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\" data-maxw=\"350\">Her yanlış: −1 puan</text><text x=\"776.0\" y=\"513.0\" font-size=\"34.6\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\" data-maxw=\"350\">Boş: 0 puan</text></g></svg>", "son": "<p>Ece'nin doğru, yanlış ve boş cevap sayılarının her biri 2'nin pozitif tam sayı kuvvetidir.</p>", "k": "Buna göre, Ece'nin bu sınavdaki puanı <u style=\"white-space:nowrap\">en fazla</u> kaçtır?", "sec": ["56", "60", "62", "64"], "secg": null, "c": "C", "a": ["2'nin pozitif tam sayı kuvvetleri 2, 4, 8, 16, …'dır. Üç sayının toplamı 20 olmalıdır: 16 + 2 + 2 = 20 ya da 8 + 8 + 4 = 20.", "Doğru sayısı ne kadar fazla olursa puan o kadar artar. 16 doğru, 2 yanlış, 2 boş için puan 16 · 4 − 2 · 1 = 64 − 2 = 62'dir.", "8 doğru içeren dağılımlarda puan en fazla 8 · 4 − 4 = 28'dir. En fazla puan 62'dir."], "t": "64: yanlış cevapların puan kaybettirdiği unutulmuş; 60: yanlış sayısı 4 alınmış; 56: her yanlışın 4 puan kaybettirdiği sanılmış, 64 − 2 · 4 yapılmış.", "d": "Üç sayının toplamı 20 olmalı ve her biri 2, 4, 8, 16 gibi 2'nin pozitif kuvveti olmalıdır (1 = 2<sup>0</sup> pozitif kuvvet değildir). Yanlışlar puan kaybettirir; doğru sayısını büyütmek tek başına yetmeyebilir.", "ses": "b15"}, {"no": 16, "on": "<p>Defne, mavi torbadan bir kart çekip üzerindeki sayıyı taban, turuncu torbadan bir kart çekip üzerindeki sayıyı üs olarak kullanarak bir üslü ifade yazacaktır. Torbalardaki kartlar aşağıda gösterilmiştir.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1190 688\" width=\"1190\" style=\"width:121.1mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAG3AvgDASIAAhEBAxEB/8QAHAAAAgMBAQEBAAAAAAAAAAAAAgMAAQQFBgcI/8QARxAAAQMCBAIHBQUFBwMFAQEBAQACEQMhBBIxQQVREyJhcYGR8AYyUqGxFELB0eEVIzNi8QcWQ1NygpIkJTQ1RFRjc6KDk//EABoBAQEBAQEBAQAAAAAAAAAAAAABAgMEBQb/xAAnEQEBAAICAQQCAwADAQAAAAAAAQIRAxIxBBMhURRBIjJhIzNSQv/aAAwDAQACEQMRAD8A+ilUURQqKiiiiioooogtRRRUQK1StERRRWoKVqQiAQVCsBEGog1FUGo2tRNajDUQAaihHCkIFkICE4hLcilFQKyqCBjU5qS1OaiGBWhVhASipRBcqKlJREUJVEoHOVVZchzpT6kJBriURrL0Besprjmq6ftQaC5UXJIqSjDkByiCWHI2ulAaootkDkAm6oqibq9kAqiiVFUARZUiKFRUKFEVSCkJRIVFCUJRFCdEAuQFGUBQAUBRlA5AspZKY5LcoFuSnJrkpyiws6oSiKEooDqhciKFygU43QonIUUxqYEtqYEQYRBCEQQErVK0FqKKBBaiisIIooFaCKKKINOA/wDJavU4f3QvL8P/APJC9Rh/dC1izk1NRKmqytMqKW7RMKW5BlrLFU1W2ssVQXQCz3gurh/dC5TPeC61D3Qi1pboorbooiOAhKIoUEVqlajSKKKIIrUUREUURQhFQrCsBEGoqgEQaia1MDUQAajARAIoA1QUAjAQyoTKaQUqpVKK6ENwluTAgeIMIpLlQVuB2BVAOnQ+SgY1NaUpoPIpoBQGESAIpRBKlUqiUVcqi6EBegc9QML0p70BqdqW58hUDV    Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.

(function(){

    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
