": "B", "a": ["1. yol ayrımı: 4<sup>−1</sup> = <span class=\"frac\"><span>1</span><span>4</span></span> ve 5<sup>−2</sup> = <span class=\"frac\"><span>1</span><span>25</span></span>; <span class=\"frac\"><span>1</span><span>4</span></span> &lt; <span class=\"frac\"><span>1</span><span>25</span></span> yanlıştır. “Yanlış” yoluna girilir.", "2. yol ayrımı: (−2)<sup>−3</sup> = −<span class=\"frac\"><span>1</span><span>8</span></span> ve (−2)<sup>−2</sup> = <span class=\"frac\"><span>1</span><span>4</span></span>; −<span class=\"frac\"><span>1</span><span>8</span></span> &gt; <span class=\"frac\"><span>1</span><span>4</span></span> yanlıştır. “Yanlış” yoluna girilir.", "3. yol ayrımı: −2<sup>−4</sup> = −<span class=\"frac\"><span>1</span><span>16</span></span> ve (−4)<sup>−1</sup> = −<span class=\"frac\"><span>1</span><span>4</span></span>; −<span class=\"frac\"><span>1</span><span>16</span></span> &gt; −<span class=\"frac\"><span>1</span><span>4</span></span> doğrudur. “Doğru” yolundan B çıkışına ulaşılır."], "t": "E: 4<sup>−1</sup> &lt; 5<sup>−2</sup> karşılaştırması tabanlara bakılarak doğru sanılmış; C: (−2)<sup>−3</sup> pozitif sanılıp ikinci karşılaştırma doğru kabul edilmiş; A: negatif sayılarda mutlak değeri büyük olanın büyük olduğu sanılmış.", "d": "Her yol ayrımında iki ifadenin değerini ayrı ayrı hesaplayın. Negatif sayılarda mutlak değeri büyük olan daha küçüktür; tabanı büyük olan negatif kuvvet daha küçüktür (4<sup>−1</sup> &gt; 5<sup>−2</sup>).", "ses": "b08"}, {"no": 9, "on": "<p>Bir destede 1'den n'ye kadar ardışık doğal sayılarla numaralandırılmış n tane kart vardır. Ece, numarası 2'nin pozitif tam sayı kuvveti olan kartları kırmızı kutuya, numarası 3'ün pozitif tam sayı kuvveti olan kartları mavi kutuya koymuştur. Diğer kartlar destede kalmıştır.</p>", "g": "<svg viewBox=\"0 0 640 164\" width=\"640\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><path d=\"M30 60 L190 60 L180 150 L40 150 Z\" fill=\"#ffc9c9\" stroke=\"#e03131\" stroke-width=\"2\"/><rect x=\"60.0\" y=\"34.0\" width=\"30.0\" height=\"40.0\" rx=\"4\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1.2\"/><rect x=\"94.0\" y=\"30.0\" width=\"30.0\" height=\"40.0\" rx=\"4\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1.2\"/><rect x=\"128.0\" y=\"26.0\" width=\"30.0\" height=\"40.0\" rx=\"4\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1.2\"/><text x=\"110.0\" y=\"116.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#e03131\" text-anchor=\"middle\">Kırmızı kutu</text><path d=\"M250 60 L410 60 L400 150 L260 150 Z\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"2\"/><rect x=\"280.0\" y=\"34.0\" width=\"30.0\" height=\"40.0\" rx=\"4\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1.2\"/><rect x=\"314.0\" y=\"30.0\" width=\"30.0\" height=\"40.0\" rx=\"4\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1.2\"/><rect x=\"348.0\" y=\"26.0\" width=\"30.0\" height=\"40.0\" rx=\"4\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1.2\"/><text x=\"330.0\" y=\"116.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#1971c2\" text-anchor=\"middle\">Mavi kutu</text><rect x=\"470.0\" y=\"40.0\" width=\"150.0\" height=\"110.0\" rx=\"8\" fill=\"#fff4e6\" stroke=\"#e8590c\" stroke-width=\"1.4\"/><text x=\"545.0\" y=\"70.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#e8590c\" text-anchor=\"middle\">Kart destesi</text><rect x=\"498.0\" y=\"84.0\" width=\"70.0\" height=\"40.0\" rx=\"4\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1.1\"/><rect x=\"503.0\" y=\"88.0\" width=\"70.0\" height=\"40.0\" rx=\"4\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1.1\"/><rect x=\"508.0\" y=\"92.0\" width=\"70.0\" height=\"40.0\" rx=\"4\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1.1\"/><rect x=\"513.0\" y=\"96.0\" width=\"70.0\" height=\"40.0\" rx=\"4\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1.1\"/><text x=\"545.0\" y=\"146.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">1, 2, 3, …, n</text></svg>", "son": "<p>Kırmızı kutuda tam olarak 4 kart, mavi kutuda tam olarak 3 kart vardır.</p>", "k": "Buna göre, n kaç farklı değer alabilir?", "sec": ["5", "6", "15", "16"], "secg": null, "c": "A", "a": ["Kırmızı kutuda 2, 4, 8 ve 16 numaralı kartlar vardır; 32 numaralı kart olmamalıdır. Buna göre 16 ≤ n ≤ 31'dir.", "Mavi kutuda 3, 9 ve 27 numaralı kartlar vardır; 81 numaralı kart olmamalıdır. Buna göre 27 ≤ n ≤ 80'dir.", "İki koşul birlikte: 27 ≤ n ≤ 31. n; 27, 28, 29, 30 ve 31 olabilir, 5 farklı değer alır."], "t": "16: yalnız kırmızı kutunun koşulu kullanılmış (16 ≤ n ≤ 31); 15: ayrıca uçlardan biri sayılmamış; 6: n = 32 de uygun sanılmış.", "d": "“Tam olarak 4 kart” hem en az hem en fazla demektir: 2<sup>4</sup> = 16 kutuda olmalı, 2<sup>5</sup> = 32 olmamalı. İki kutunun koşulunu birlikte kullanın; aralığın uçlarını da sayın.", "ses": "b09"}, {"no": 10, "on": "<p>Eşit kollu bir terazinin sol kefesinde 3 kg kütleli bir karpuz vardır. Sağ kefeye, kütleleri aşağıda verilen iki tür ağırlıktan konarak terazi dengeye getirilecektir.</p>", "g": "<svg viewBox=\"0 0 580 150\" width=\"580\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"213.0\" y=\"46.0\" width=\"14.0\" height=\"84.0\" rx=\"0\" fill=\"#adb5bd\" stroke=\"#495057\" stroke-width=\"1.3\"/><rect x=\"160.0\" y=\"128.0\" width=\"120.0\" height=\"12.0\" rx=\"3\" fill=\"#868e96\" stroke=\"#495057\" stroke-width=\"1.3\"/><line x1=\"70.0\" y1=\"46.0\" x2=\"370.0\" y2=\"46.0\" stroke=\"#495057\" stroke-width=\"5\"/><circle cx=\"220.0\" cy=\"46.0\" r=\"7.0\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1.6\"/><line x1=\"80.0\" y1=\"46.0\" x2=\"34.0\" y2=\"86.0\" stroke=\"#495057\" stroke-width=\"1.2\"/><line x1=\"80.0\" y1=\"46.0\" x2=\"126.0\" y2=\"86.0\" stroke=\"#495057\" stroke-width=\"1.2\"/><path d=\"M22 86 Q80 110 138 86 Z\" fill=\"#e9ecef\" stroke=\"#495057\" stroke-width=\"1.4\"/><line x1=\"360.0\" y1=\"46.0\" x2=\"314.0\" y2=\"86.0\" stroke=\"#495057\" stroke-width=\"1.2\"/><line x1=\"360.0\" y1=\"46.0\" x2=\"406.0\" y2=\"86.0\" stroke=\"#495057\" stroke-width=\"1.2\"/><path d=\"M302 86 Q360 110 418 86 Z\" fill=\"#e9ecef\" stroke=\"#495057\" stroke-width=\"1.4\"/><ellipse cx=\"80\" cy=\"68\" rx=\"36\" ry=\"24\" fill=\"#2b8a3e\" stroke=\"#1b5e20\" stroke-width=\"1.6\"/><path d=\"M52 60 q 28 -14 56 0 M50 72 q 30 -12 60 0\" stroke=\"#69db7c\" stroke-width=\"3\" fill=\"none\"/><rect x=\"29.3\" y=\"9.7\" width=\"101.4\" height=\"19.5\" rx=\"5\" fill=\"#ffffff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"80.0\" y=\"23.3\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">Karpuz: 3 kg</text><rect x=\"290.0\" y=\"10.1\" width=\"140.0\" height=\"18.8\" rx=\"5\" fill=\"#ffffff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"360.0\" y=\"23.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">Ağırlıklar konacak</text><path d=\"M430 74 L436 46 L460 46 L466 74 Z\" fill=\"#ced4da\" stroke=\"#495057\" stroke-width=\"1.2\"/><rect x=\"442.0\" y=\"40.0\" width=\"12.0\" height=\"7.0\" rx=\"0\" fill=\"#ced4da\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"478.0\" y=\"58.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"start\">1. tür ağırlık</text><text x=\"478.0\" y=\"76.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"start\">4<tspan baseline-shift=\"super\" font-size=\"68%\">−1</tspan> kg</text><path d=\"M430 136 L436 108 L460 108 L466 136 Z\" fill=\"#ced4da\" stroke=\"#495057\" stroke-width=\"1.2\"/><rect x=\"442.0\" y=\"102.0\" width=\"12.0\" height=\"7.0\" rx=\"0\" fill=\"#ced4da\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"478.0\" y=\"120.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"start\">2. tür ağırlık</text><text x=\"478.0\" y=\"138.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"start\">2<tspan baseline-shift=\"super\" font-size=\"68%\">−3</tspan> kg</text></svg>", "son": "<p>Her iki tür ağırlıktan en az birer tane kullanılacaktır.</p>", "k": "Buna göre, sağ kefeye konacak ağırlıkların sayısı <u style=\"white-space:nowrap\">en az</u> kaçtır?", "sec": ["12", "13", "14", "23"], "secg": null, "c": "B", "a": ["4<sup>−1</sup> kg = <span class=\"frac\"><span>1</span><span>4</span></span> kg ve 2<sup>−3</sup> kg = <span class=\"frac\"><span>1</span><span>8</span></span> kg'dır. 1. türden x, 2. türden y tane konursa x · <span class=\"frac\"><span>1</span><span>4</span></span> + y · <span class=\"frac\"><span>1</span><span>8</span></span> = 3 olmalıdır.", "Eşitlik 8 ile çarpılırsa 2x + y = 24 olur. Ağırlık sayısı x + y = 24 − x'tir; x büyüdükçe toplam azalır.", "y en az 1 olmalı ve 2x + y = 24 olduğundan y çift sayıdır; en küçük y = 2, x = 11'dir. En az 11 + 2 = 13 ağırlık konur."], "t": "12: yalnız 1. tür ağırlık kullanılmış, 2. türden de en az bir tane konması gerektiği unutulmuş; 14: x = 10, y = 4 bulunup daha az ağırlıkla denge aranmamış; 23: yalnız 1 tane 1. tür ağırlık konup kalan 2. türle tamamlanmış.", "d": "Ağırlıkları kesre çevirin ve eşitliği 8 ile çarparak sadeleştirin (2x + y = 24). Toplam ağırlık sayısını azaltmak için ağır olan türden olabildiğince çok kullanın, ama hafif türden de en az bir tane bulunmalıdır.", "ses": "b10"}, {"no": 11, "on": "<p>Mert'in elinde, üzerinde 7 özdeş boncuk bulunan esnek bir tel vardır. Mert teli iki boncuğun arasından bükerek bir kolunu yukarıda, diğer kolunu aşağıda bırakmaktadır. Sonra aşağıdaki koldaki boncuk sayısının ters işaretlisini taban, yukarıdaki koldaki boncuk sayısını üs olarak alıp bir üslü ifade yazmaktadır.</p>", "g": "<svg viewBox=\"0 0 590 290\" width=\"590\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><path d=\"M120 40 V104 Q120 114 130 114 H130\" fill=\"none\" stroke=\"#868e96\" stroke-width=\"3\"/><path d=\"M130 114 Q142 114 142 126 V276\" fill=\"none\" stroke=\"#868e96\" stroke-width=\"3\"/><circle cx=\"120.0\" cy=\"52.0\" r=\"9.0\" fill=\"#ffd8a8\" stroke=\"#e8590c\" stroke-width=\"1.6\"/><circle cx=\"120.0\" cy=\"74.0\" r=\"9.0\" fill=\"#ffd8a8\" stroke=\"#e8590c\" stroke-width=\"1.6\"/><circle cx=\"142.0\" cy=\"144.0\" r=\"9.0\" fill=\"#a5d8ff\" stroke=\"#1971c2\" stroke-width=\"1.6\"/><circle cx=\"142.0\" cy=\"170.0\" r=\"9.0\" fill=\"#a5d8ff\" stroke=\"#1971c2\" stroke-width=\"1.6\"/><circle cx=\"142.0\" cy=\"196.0\" r=\"9.0\" fill=\"#a5d8ff\" stroke=\"#1971c2\" stroke-width=\"1.6\"/><circle cx=\"142.0\" cy=\"222.0\" r=\"9.0\" fill=\"#a5d8ff\" stroke=\"#1971c2\" stroke-width=\"1.6\"/><circle cx=\"142.0\" cy=\"248.0\" r=\"9.0\" fill=\"#a5d8ff\" stroke=\"#1971c2\" stroke-width=\"1.6\"/><rect x=\"127.0\" y=\"50.1\" width=\"170.0\" height=\"18.8\" rx=\"5\" fill=\"#ffffff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"212.0\" y=\"63.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#e8590c\" text-anchor=\"middle\">Yukarıdaki kol: 2 boncuk</text><rect x=\"151.0\" y=\"188.1\" width=\"170.0\" height=\"18.8\" rx=\"5\" fill=\"#ffffff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"236.0\" y=\"201.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#1971c2\" text-anchor=\"middle\">Aşağıdaki kol: 5 boncuk</text><rect x=\"194.0\" y=\"102.6\" width=\"84.0\" height=\"18.0\" rx=\"5\" fill=\"#ffffff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"236.0\" y=\"115.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">Büküm yeri</text><rect x=\"380.0\" y=\"96.0\" width=\"190.0\" height=\"64.0\" rx=\"8\" fill=\"#fff\" stroke=\"#1f7a8c\" stroke-width=\"1.6\"/><text x=\"475.0\" y=\"120.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">Yazılan ifade</text><text x=\"475.0\" y=\"148.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"22\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">(−5)<tspan baseline-shift=\"super\" font-size=\"68%\">2</tspan></text></svg>", "son": "<p>Yukarıda, telin bir bükülüşü ve bu bükülüşte yazılan ifade örnek olarak gösterilmiştir. Her iki kolda da en az bir boncuk bulunmaktadır.</p>", "k": "Buna göre, Mert'in yazabileceği ifadelerden değeri <u style=\"white-space:nowrap\">en büyük</u> olan ile <u style=\"white-space:nowrap\">en küçük</u> olanın farkı kaçtır?", "sec": ["17", "89", "113", "145"], "secg": null, "c": "D", "a": ["Aşağıdaki kolda k boncuk varsa yukarıdaki kolda 7 − k boncuk vardır; ifade (−k)<sup>7 − k</sup> olur (k = 1, 2, …, 6).", "Değerler: (−1)<sup>6</sup> = 1, (−2)<sup>5</sup> = −32, (−3)<sup>4</sup> = 81, (−4)<sup>3</sup> = −64, (−5)<sup>2</sup> = 25, (−6)<sup>1</sup> = −6.", "En büyük 81, en küçük −64'tür. Fark 81 − (−64) = 145'tir."], "t": "17: fark alınırken −64'ün işareti unutulmuş; 89: (−3)<sup>4</sup> negatif sanılıp en büyük değer 25 alınmış; 113: (−4)<sup>3</sup> pozitif sanılıp en küçük değer −32 alınmış.", "d": "Taban negatiftir; üs çiftse değer pozitif, tekse negatiftir. En küçük değer için mutlak değeri büyük bir negatif sonuç arayın; farkı alırken eksi işaretini unutmayın.", "ses": "b11"}, {"no": 12, "on": "<p>Bir hesap programının ekranında bir üslü ifade yazılıdır. Programdaki dört tuştan birine her basıldığında ekrandaki ifadenin tabanı ya da üssü 1 artmakta ya da 1 azalmaktadır. Ekranın ve tuşların görünümü aşağıda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 440 190\" width=\"440\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"10.0\" y=\"10.0\" width=\"420.0\" height=\"170.0\" rx=\"12\" fill=\"#e9ecef\" stroke=\"#868e96\" stroke-width=\"2\"/><rect x=\"110.0\" y=\"24.0\" width=\"220.0\" height=\"62.0\" rx=\"6\" fill=\"#f1f8e9\" stroke=\"#495057\" stroke-width=\"1.6\"/><text x=\"220.0\" y=\"68.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"30\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">5<tspan baseline-shift=\"super\" font-size=\"68%\">2</tspan></text><rect x=\"22.0\" y=\"110.0\" width=\"92.0\" height=\"44.0\" rx=\"8\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1.6\"/><text x=\"68.0\" y=\"138.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">Taban +1</text><rect x=\"124.0\" y=\"110.0\" width=\"92.0\" height=\"44.0\" rx=\"8\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1.6\"/><text x=\"170.0\" y=\"138.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">Taban −1</text><rect x=\"226.0\" y=\"110.0\" width=\"92.0\" height=\"44.0\" rx=\"8\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1.6\"/><text x=\"272.0\" y=\"138.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">Üs +1</text><rect x=\"328.0\" y=\"110.0\" width=\"92.0\" height=\"44.0\" rx=\"8\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1.6\"/><text x=\"374.0\" y=\"138.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">Üs −1</text></svg>", "son": "<p>Kerem, tuşları kullanarak ekrandaki ifadenin değerini <span class=\"frac\"><span>1</span><span>64</span></span> yapmak istemektedir.</p>", "k": "Buna göre, Kerem tuşlara toplam <u style=\"white-space:nowrap\">en az</u> kaç kez basmalıdır?", "sec": ["6", "7", "8", "11"], "secg": null, "c": "A", "a": ["<span class=\"frac\"><span>1</span><span>64</span></span> sayısının tabanı ve üssü tam sayı olan yazılışları: 2<sup>−6</sup>, (−2)<sup>−6</sup>, 4<sup>−3</sup>, 8<sup>−2</sup>, (−8)<sup>−2</sup> ve 64<sup>−1</sup>'dir.", "Ekranda 5<sup>2</sup> vardır. Her yazılış için gereken basma sayısı, tabanın ve üssün değişim miktarlarının toplamıdır: 2<sup>−6</sup> için 3 + 8 = 11; 4<sup>−3</sup> için 1 + 5 = 6; 8<sup>−2</sup> için 3 + 4 = 7; diğerleri daha fazladır.", "En az 6 kez basılır (1 kez “Taban −1”, 5 kez “Üs −1”)."], "t": "11: yalnız 2<sup>−6</sup> yazılışı düşünülmüş; 7: 8<sup>−2</sup> yazılışı bulunmuş ama 4<sup>−3</sup> denenmemiş; 8: üssün 2'den −3'e inmesi için 5 yerine 7 basma sayılmış.", "d": "Önce hedef değerin bütün yazılışlarını bulun: <span class=\"frac\"><span>1</span><span>64</span></span> = 2<sup>−6</sup> = 4<sup>−3</sup> = 8<sup>−2</sup> … Sonra her yazılış için tabanın ve üssün ne kadar değiştiğini toplayın; en kısa yolu seçin.", "ses": "b12"}, {"no": 13, "on": "<p>Ece iki kâğıt şeridi üst üste koymuştur. Üst şeridin karelerindeki sayılar taban, alt şeridin karelerindeki sayılar üs olarak kullanılmaktadır. Alt alta gelen iki kareden bir üslü ifade yazılmaktadır. Şeritlerin ilk konumu aşağıda gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 512 146\" width=\"512\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><text x=\"10.0\" y=\"44.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"800\" fill=\"#e8590c\" text-anchor=\"start\">Üst şerit</text><text x=\"10.0\" y=\"104.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"800\" fill=\"#1971c2\" text-anchor=\"start\">Alt şerit</text><rect x=\"130.0\" y=\"20.0\" width=\"52.0\" height=\"40.0\" rx=\"0\" fill=\"#fff4e6\" stroke=\"#e8590c\" stroke-width=\"1.6\"/><text x=\"156.0\" y=\"46.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"17\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">−3</text><rect x=\"182.0\" y=\"20.0\" width=\"52.0\" height=\"40.0\" rx=\"0\" fill=\"#fff4e6\" stroke=\"#e8590c\" stroke-width=\"1.6\"/><text x=\"208.0\" y=\"46.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"17\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">−2</text><rect x=\"234.0\" y=\"20.0\" width=\"52.0\" height=\"40.0\" rx=\"0\" fill=\"#fff4e6\" stroke=\"#e8590c\" stroke-width=\"1.6\"/><text x=\"260.0\" y=\"46.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"17\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">2</text><rect x=\"286.0\" y=\"20.0\" width=\"52.0\" height=\"40.0\" rx=\"0\" fill=\"#fff4e6\" stroke=\"#e8590c\" stroke-width=\"1.6\"/><text x=\"312.0\" y=\"46.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"17\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">3</text><rect x=\"130.0\" y=\"80.0\" width=\"52.0\" height=\"40.0\" rx=\"0\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.6\"/><text x=\"156.0\" y=\"106.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"17\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">−2</text><rect x=\"182.0\" y=\"80.0\" width=\"52.0\" height=\"40.0\" rx=\"0\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.6\"/><text x=\"208.0\" y=\"106.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"17\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">−1</text><rect x=\"234.0\" y=\"80.0\" width=\"52.0\" height=\"40.0\" rx=\"0\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.6\"/><text x=\"260.0\" y=\"106.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"17\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">0</text><rect x=\"286.0\" y=\"80.0\" width=\"52.0\" height=\"40.0\" rx=\"0\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.6\"/><text x=\"312.0\" y=\"106.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"17\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">1</text><rect x=\"338.0\" y=\"80.0\" width=\"52.0\" height=\"40.0\" rx=\"0\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.6\"/><text x=\"364.0\" y=\"106.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"17\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">2</text><rect x=\"390.0\" y=\"80.0\" width=\"52.0\" height=\"40.0\" rx=\"0\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.6\"/><text x=\"416.0\" y=\"106.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"17\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">3</text><line x1=\"452.0\" y1=\"100.0\" x2=\"492.0\" y2=\"100.0\" stroke=\"#1971c2\" stroke-width=\"1.4\"/><polygon points=\"492.0,100.0 484.0,104.0 484.0,96.0\" fill=\"#1971c2\"/><line x1=\"120.0\" y1=\"136.0\" x2=\"80.0\" y2=\"136.0\" stroke=\"#1971c2\" stroke-width=\"1.4\"/><polygon points=\"80.0,136.0 88.0,132.0 88.0,140.0\" fill=\"#1971c2\"/><text x=\"472.0\" y=\"136.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"11.5\" font-weight=\"700\" fill=\"#1971c2\" text-anchor=\"middle\">kaydırılabilir</text></svg>", "son": "<p>Üst şerit sabittir. Alt şerit, kareler tam olarak alt alta gelecek şekilde sağa ya da sola kaydırılabilmektedir. Ece alt şeridi, üst şeridin dört karesinin hepsinin altında bir kare bulunacak ve alt alta gelen dört ifadenin hepsinin değeri tam sayı olacak şekilde bir konuma getirmiştir.</p>", "k": "Buna göre, bu konumda alt alta gelen dört ifadenin değerleri toplamı kaçtır?", "sec": ["12", "28", "30", "34"], "secg": null, "c": "C", "a": ["Alt şeritte 6, üst şeritte 4 kare olduğundan dört karenin hepsinin altında kare bulunan 3 konum vardır: alt şerit ilk konumda, 1 kare sola ya da 2 kare sola kaydırılmış.", "İlk konumda üsler −2, −1, 0, 1'dir: (−3)<sup>−2</sup> = <span class=\"frac\"><span>1</span><span>9</span></span> tam sayı değildir. 1 kare kaydırınca üsler −1, 0, 1, 2'dir: (−3)<sup>−1</sup> tam sayı değildir.", "2 kare kaydırınca üsler 0, 1, 2, 3 olur: (−3)<sup>0</sup> = 1, (−2)<sup>1</sup> = −2, 2<sup>2</sup> = 4, 3<sup>3</sup> = 27; hepsi tam sayıdır. Toplam 1 − 2 + 4 + 27 = 30'dur."], "t": "28: (−3)<sup>0</sup> = −1 alınmış; 34: (−2)<sup>1</sup> = 2 alınmış; 12: 3<sup>3</sup> = 3 · 3 = 9 alınmış.", "d": "Üs negatifse ve taban −1 değilse değer kesir olur. Bu yüzden dört değerin tam sayı olması için alt şeritteki negatif üslerin üst şeridin altından çıkması gerekir. (−3)<sup>0</sup> = 1'dir.", "ses": "b13"}, {"no": 14, "on": "<p>Bir laboratuvarda maya hücreleriyle bir deney yapılmıştır. Deneyde yapılanlar, araştırmacının deney defterine aşağıdaki gibi yazılmıştır.</p>", "g": "<svg viewBox=\"0 0 642 176\" width=\"642\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><ellipse cx=\"110\" cy=\"96\" rx=\"92\" ry=\"34\" fill=\"#f1f3f5\" stroke=\"#495057\" stroke-width=\"2\"/><ellipse cx=\"110\" cy=\"90\" rx=\"84\" ry=\"28\" fill=\"#fff9db\" stroke=\"#adb5bd\" stroke-width=\"1.2\"/><circle cx=\"80.0\" cy=\"88.0\" r=\"4.5\" fill=\"#ffe066\" stroke=\"#e8a33c\" stroke-width=\"1\"/><circle cx=\"96.0\" cy=\"98.0\" r=\"4.5\" fill=\"#ffe066\" stroke=\"#e8a33c\" stroke-width=\"1\"/><circle cx=\"120.0\" cy=\"84.0\" r=\"4.5\" fill=\"#ffe066\" stroke=\"#e8a33c\" stroke-width=\"1\"/><circle cx=\"140.0\" cy=\"96.0\" r=\"4.5\" fill=\"#ffe066\" stroke=\"#e8a33c\" stroke-width=\"1\"/><circle cx=\"106.0\" cy=\"90.0\" r=\"4.5\" fill=\"#ffe066\" stroke=\"#e8a33c\" stroke-width=\"1\"/><circle cx=\"130.0\" cy=\"104.0\" r=\"4.5\" fill=\"#ffe066\" stroke=\"#e8a33c\" stroke-width=\"1\"/><text x=\"110.0\" y=\"150.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">Petri kabı (temsilî)</text><rect x=\"232.0\" y=\"10.0\" width=\"400.0\" height=\"156.0\" rx=\"8\" fill=\"#fff\" stroke=\"#1f7a8c\" stroke-width=\"1.6\"/><text x=\"432.0\" y=\"32.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#1f7a8c\" text-anchor=\"middle\">Deney defteri</text><text x=\"246.0\" y=\"60.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"start\">0. dakika</text><text x=\"400.0\" y=\"60.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-we >", "k": "Buna göre, Ece'nin bu sınavdaki puanı <u style=\"white-space:nowrap\">en fazla</u> kaçtır?", "sec": ["56", "60", "62", "64"], "secg": null, "c": "C", "a": ["2'nin pozitif tam sayı kuvvetleri 2, 4, 8, 16, …'dır. Üç sayının toplamı 20 olmalıdır: 16 + 2 + 2 = 20 ya da 8 + 8 + 4 = 20.", "Doğru sayısı ne kadar fazla olursa puan o kadar artar. 16 doğru, 2 yanlış, 2 boş için puan 16 · 4 − 2 · 1 = 64 − 2 = 62'dir.", "8 doğru içeren dağılımlarda puan en fazla 8 · 4 − 4 = 28'dir. En fazla puan 62'dir."], "t": "64: yanlış cevapların puan kaybettirdiği unutulmuş; 60: yanlış sayısı 4 alınmış; 56: her yanlışın 4 puan kaybettirdiği sanılmış, 64 − 2 · 4 yapılmış.", "d": "Üç sayının toplamı 20 olmalı ve her biri 2, 4, 8, 16 gibi 2'nin pozitif kuvveti olmalıdır (1 = 2<sup>0</sup> pozitif kuvvet değildir). Yanlışlar puan kaybettirir; doğru sayısını büyütmek tek başına yetmeyebilir.", "ses": "b15"}, {"no": 16, "on": "<p>Defne, mavi torbadan bir kart çekip üzerindeki sayıyı taban, turuncu torbadan bir kart çekip üzerindeki sayıyı üs olarak kullanarak bir üslü ifade yazacaktır. Torbalardaki kartlar aşağıda gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 480 200\" width=\"480\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><path d=\"M40 50 Q20 150 50 170 L190 170 Q220 150 200 50 Z\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"2\"/><path d=\"M50 50 Q120 30 190 50\" fill=\"none\" stroke=\"#1971c2\" stroke-width=\"3\"/><rect x=\"60.0\" y=\"70.0\" width=\"36.0\" height=\"38.0\" rx=\"5\" fill=\"#fff\" stroke=\"#1971c2\" stroke-width=\"1.4\"/><text x=\"78.0\" y=\"96.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">−3</text><rect x=\"104.0\" y=\"70.0\" width=\"36.0\" height=\"38.0\" rx=\"5\" fill=\"#fff\" stroke=\"#1971c2\" stroke-width=\"1.4\"/><text x=\"122.0\" y=\"96.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">−2</text><rec     k.append(sesKutu(s.ses),sek,p1,p2);let kur=false;const ac=i=>{sek.querySelectorAll("button").forEach((b,j)=>b.setAttribute("aria-selected",i===j));p1.hidden=i!==0;p2.hidden=i!==1;if(i===0&&!kur){kur=true;CANL[s.no](p1);}};
    sek.querySelectorAll("button").forEach((b,i)=>b.onclick=()=>ac(i));ac(q.get("g")==="cozum"?1:0);cozKap=p2;}
  if(cozKap===k)k.appendChild(sesKutu(s.ses));const w=document.createElement("div");cozKap.appendChild(w);
  adimAdim(w,s.a,()=>{const c=document.createElement("p");c.className="cevap";c.innerHTML=`<b>Doğru cevap:</b> ${s.c}`;w.appendChild(c);

if(tek&&BOL.some(x=>x[0]===tek)){const n=+q.get(tek);const [,,L,f]=BOL.find(x=>x[0]===tek);const s=L.find(x=>x.no===n)||L[0];ic.appendChild(f(s));$("#tum").hidden=false;$("#nav").remove();}
else{let akt=BOL[0][0];const nav=$("#nav");const ciz=()=>{ic.innerHTML="";nav.innerHTML=BOL.map(([k,a,L])=>`<button type="button" data-k="${k}" aria-pressed="${k===akt}">${a} (${L.length})</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{akt=b.dataset.k;ciz();});const [,,L,f]=BOL.find(x=>x[0]===akt);L.forEach(s=>ic.appendChild(f(s)));};ciz();}
</script></body></html><script>
/* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
