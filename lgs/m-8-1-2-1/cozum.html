-weight=\"800\" fill=\"#1971c2\" text-anchor=\"middle\">bölge</text><line x1=\"22.0\" y1=\"28.0\" x2=\"122.0\" y2=\"28.0\" stroke=\"#000000\" stroke-width=\"1.2\"/><polygon points=\"22.0,28.0 29.0,31.5 29.0,24.5\" fill=\"#000000\"/><polygon points=\"122.0,28.0 115.0,31.5 115.0,24.5\" fill=\"#000000\"/><text x=\"72.0\" y=\"20.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">3<tspan baseline-shift=\"super\" font-size=\"70%\">3</tspan> m</text><text x=\"160.0\" y=\"72.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"800\" fill=\"#1971c2\" text-anchor=\"middle\">2.</text><text x=\"160.0\" y=\"89.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"800\" fill=\"#1971c2\" text-anchor=\"middle\">bölge</text><line x1=\"126.0\" y1=\"28.0\" x2=\"194.0\" y2=\"28.0\" stroke=\"#000000\" stroke-width=\"1.2\"/><polygon points=\"126.0,28.0 133.0,31.5 133.0,24.5\" fill=\"#000000\"/><polygon points=\"194.0,28.0 187.0,31.5 187.0,24.5\" fill=\"#000000\"/><text x=\"160.0\" y=\"20.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">3<tspan baseline-shift=\"super\" font-size=\"70%\">2</tspan> m</text><text x=\"227.0\" y=\"72.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"800\" fill=\"#1971c2\" text-anchor=\"middle\">3.</text><text x=\"227.0\" y=\"89.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"800\" fill=\"#1971c2\" text-anchor=\"middle\">bölge</text><line x1=\"198.0\" y1=\"28.0\" x2=\"256.0\" y2=\"28.0\" stroke=\"#000000\" stroke-width=\"1.2\"/><polygon points=\"198.0,28.0 205.0,31.5 205.0,24.5\" fill=\"#000000\"/><polygon points=\"256.0,28.0 249.0,31.5 249.0,24.5\" fill=\"#000000\"/><text x=\"227.0\" y=\"20.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">3<tspan baseline-shift=\"super\" font-size=\"70%\">1</tspan> m</text><text x=\"289.0\" y=\"72.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"800\" fill=\"#1971c2\" text-anchor=\"middle\">4.</text><text x=\"289.0\" y=\"89.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"800\" fill=\"#1971c2\" text-anchor=\"middle\">bölge</text><line x1=\"260.0\" y1=\"28.0\" x2=\"318.0\" y2=\"28.0\" stroke=\"#000000\" stroke-width=\"1.2\"/><polygon points=\"260.0,28.0 267.0,31.5 267.0,24.5\" fill=\"#000000\"/><polygon points=\"318.0,28.0 311.0,31.5 311.0,24.5\" fill=\"#000000\"/><text x=\"289.0\" y=\"20.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">3<tspan baseline-shift=\"super\" font-size=\"70%\">0</tspan> m</text><line x1=\"20.0\" y1=\"40.0\" x2=\"20.0\" y2=\"110.0\" stroke=\"#000000\" stroke-width=\"3\"/><line x1=\"320.0\" y1=\"40.0\" x2=\"320.0\" y2=\"110.0\" stroke=\"#000000\" stroke-width=\"3\"/><text x=\"14.0\" y=\"128.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"start\">Başlangıç duvarı</text><text x=\"326.0\" y=\"128.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"end\">Bitiş duvarı</text><text x=\"170.0\" y=\"146.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">Havuzun üstten görünüşü (ölçekli değildir)</text></svg>", "son": "<p>Havuzda bir mavi ve bir turuncu top yüzmektedir. Toplar halatların üzerinde değildir ve uzaklıklar havuz boyunca ölçülmektedir. Mavi top 1. bölgede değildir. Turuncu topun başlangıç duvarına uzaklığı, mavi topun başlangıç duvarına uzaklığından 3<sup>2</sup> m fazladır. Bu bilgilere göre aşağıdaki ifadeler yazılmıştır.<br>I. Mavi top 2. bölgededir.<br>II. Turuncu top 4. bölgededir.<br>III. Turuncu topun bitiş duvarına uzaklığı 2<sup>2</sup> m'den azdır.</p>", "k": "Buna göre, bu ifadelerden hangileri <u style=\"white-space:nowrap\">kesinlikle</u> doğrudur?", "sec": ["Yalnız I", "I ve III", "II ve III", "I, II ve III"], "secg": null, "c": "B", "a": ["Bölge uzunlukları <span class=\"nw\">3<sup>3</sup> = 27</span> m, <span class=\"nw\">3<sup>2</sup> = 9</span> m, <span class=\"nw\">3<sup>1</sup> = 3</span> m ve <span class=\"nw\">3<sup>0</sup> = 1</span> m'dir; havuz 27 + 9 + 3 + 1 = 40 m uzunluğundadır. Başlangıç duvarından ölçülürse halatlar 27 m, 36 m ve 39 m'dedir: 1. bölge 0–27 m, 2. bölge 27–36 m, 3. bölge 36–39 m, 4. bölge 39–40 m. Mavi top 1. bölgede olmadığından başlangıç duvarına uzaklığı 27 m'den fazladır; turuncu top <span class=\"nw\">3<sup>2</sup> = 9</span> m daha ileride olduğundan 36 m'den fazla uzaktadır. Turuncu top havuzun içinde olduğundan uzaklığı en fazla 40 m'dir; bu durumda mavi topun uzaklığı en fazla 40 − 9 = 31 m'dir. I. Mavi top 27 m ile 31 m arasında, yani 2. bölgededir: kesinlikle doğru. II. Turuncu top 36 m ile 40 m arasındadır; 3. bölgede de (ör. mavi 28 m, turuncu 37 m) 4. bölgede de (ör. mavi 30,5 m, turuncu 39,5 m) olabilir: kesin değil. III. Turuncu topun başlangıç duvarına uzaklığı 36 m'den fazla olduğundan bitiş duvarına uzaklığı 40 − 36 = 4 m'den azdır; <span class=\"nw\">2<sup>2</sup> = 4</span> olduğundan kesinlikle doğru. Cevap I ve III. (I, II ve III: 3<sup>2</sup> m'lik farkın turuncu topu son bölgeye taşıdığı sanılmış, 3. bölgenin <span class=\"nw\">3<sup>1</sup> = 3</span> m olduğu gözden kaçmış; Yalnız I: turuncu top 36 m'deki halatın üzerinde düşünülüp bitiş duvarına uzaklığı tam 4 m bulunmuş, topların halat üzerinde olmadığı gözden kaçmış; II ve III: havuzun bitiş duvarı hesaba katılmayıp mavi topun 3. bölgede de olabileceği sanılmış.) [Deneme esinli özgün soru]"], "t": "", "d": "“Kesinlikle doğru” ifadesi her durumda doğru olmalıdır. Topların halatların üzerinde olmadığını ve turuncu topun havuzun içinde kaldığını unutmayınız.", "ses": "b14"}, {"no": 15, "on": "<p>Elif'in hoparlöründe ses düzeyini değiştiren iki tuş vardır. Tuşların işlevleri aşağıda gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 340 134\" width=\"340\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"14.0\" y=\"10.0\" width=\"92.0\" height=\"116.0\" rx=\"12\" fill=\"#e9ecef\" stroke=\"#495057\" stroke-width=\"1.8\"/><circle cx=\"60.0\" cy=\"44.0\" r=\"22.0\" fill=\"#adb5bd\" stroke=\"#495057\" stroke-width=\"1.6\"/><circle cx=\"60.0\" cy=\"44.0\" r=\"8.0\" fill=\"#495057\" stroke=\"#495057\" stroke-width=\"1\"/><circle cx=\"60.0\" cy=\"98.0\" r=\"14.0\" fill=\"#adb5bd\" stroke=\"#495057\" stroke-width=\"1.6\"/><circle cx=\"60.0\" cy=\"98.0\" r=\"5.0\" fill=\"#495057\" stroke=\"#495057\" stroke-width=\"1\"/><circle cx=\"134.0\" cy=\"28.0\" r=\"14.0\" fill=\"#fff\" stroke=\"#1f7a8c\" stroke-width=\"1.8\"/><text x=\"134.0\" y=\"34.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"18\" font-weight=\"800\" fill=\"#1f7a8c\" text-anchor=\"middle\">+</text><text x=\"156.0\" y=\"26.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">tuşu: ses düzeyi</text><text x=\"156.0\" y=\"42.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">2 katına çıkar</text><circle cx=\"134.0\" cy=\"72.0\" r=\"14.0\" fill=\"#fff\" stroke=\"#1f7a8c\" stroke-width=\"1.8\"/><text x=\"134.0\" y=\"78.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"18\" font-weight=\"800\" fill=\"#1f7a8c\" text-anchor=\"middle\">−</text><text x=\"156.0\" y=\"70.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">tuşu: ses düzeyi</text><text x=\"156.0\" y=\"86.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">yarıya iner</text><line x1=\"122.0\" y1=\"98.0\" x2=\"334.0\" y2=\"98.0\" stroke=\"#ced4da\" stroke-width=\"1\"/><text x=\"122.0\" y=\"118.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"start\">Başlangıç: 8 birim</text><text x=\"250.0\" y=\"118.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"start\">Son:</text><text x=\"292.0\" y=\"108.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">1</text><line x1=\"285.0\" y1=\"113.0\" x2=\"299.0\" y2=\"113.0\" stroke=\"#000000\" stroke-width=\"1.3\"/><text x=\"292.0\" y=\"128.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">2</text><text x=\"304.0\" y=\"118.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"start\">birim</text></svg>", "son": "<p>Elif, ses düzeyi 8 birim iken tuşlara art arda basmaya başlamış ve ses düzeyi <span class=\"frac\"><span>1</span><span>2</span></span> birim olduğunda durmuştur. Elif \"+\" tuşuna en az bir kez basmıştır.</p>", "k": "Buna göre, Elif tuşlara toplam <u style=\"white-space:nowrap\">en az</u> kaç kez basmıştır?", "sec": ["4", "5", "6", "8"], "secg": null, "c": "C", "a": ["<span class=\"nw\">8 = 2<sup>3</sup></span> ve <span class=\"frac\"><span>1</span><span>2</span></span> = 2<sup>−1</sup>'dir. Yalnız \"−\" tuşuna basılsaydı ses düzeyi 8 → 4 → 2 → 1 → <span class=\"frac\"><span>1</span><span>2</span></span> olurdu (4 basış). \"+\" tuşuna basılan her seferde ses düzeyi 2 katına çıktığı için bunu geri almak üzere \"−\" tuşuna bir kez daha basılmalıdır. \"+\" tuşuna en az 1 kez basıldığından \"−\" tuşuna en az 5 kez basılır; toplam en az 1 + 5 = 6 basış. Örnek: 8 → 16 → 8 → 4 → 2 → 1 → <span class=\"frac\"><span>1</span><span>2</span></span>. (4: \"+\" tuşu koşulu unutulmuş; 5: \"+\" tuşuna basıldığı hâlde \"−\" tuşuna 4 kez basılmış sanılmış; 8: \"+\" tuşuna 2 kez basılmış.) [Özgün]"], "t": "", "d": "“+” tuşuna en az bir kez basılmıştır. Ses düzeyini 2 katına çıkaran her basış, yarıya indiren bir basışla geri alınmak zorundadır.", "ses": "b15"}, {"no": 16, "on": "<p>Bir göletteki nilüferlerin kapladığı alan her gün bir önceki günün 2 katı olmaktadır. Gözlemin başladığı gün nilüferler 1 m² alan kaplamaktadır.</p><p>Defne, kaplanan alanı 2<sup>t</sup> m² ifadesiyle göstermiştir. Burada t, gözlemin başladığı günden sonraki günler için geçen gün sayısıdır; gözlemden önceki günler için t negatif tam sayıdır (gözlemden 1 gün önce t = −1).</p>", "g": "<svg viewBox=\"0 0 340 128\" width=\"340\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"14.0\" y1=\"76.0\" x2=\"334.0\" y2=\"76.0\" stroke=\"#000000\" stroke-width=\"1.4\"/><polygon points=\"334.0,76.0 326.0,80.0 326.0,72.0\" fill=\"#000000\"/><line x1=\"34.0\" y1=\"71.0\" x2=\"34.0\" y2=\"81.0\" stroke=\"#000000\" stroke-width=\"1.4\"/><text x=\"34.0\" y=\"98.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">t = −3</text><circle cx=\"34.0\" cy=\"46.0\" r=\"10.0\" fill=\"#f1f3f5\" stroke=\"#adb5bd\" stroke-width=\"1.2\"/><text x=\"34.0\" y=\"51.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#c2255c\" text-anchor=\"middle\">?</text><text x=\"34.0\" y=\"118.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#c2255c\" text-anchor=\"middle\">? m²</text><line x1=\"90.0\" y1=\"71.0\" x2=\"90.0\" y2=\"81.0\" stroke=\"#000000\" stroke-width=\"1.4\"/><text x=\"90.0\" y=\"98.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">t = −2</text><circle cx=\"90.0\" cy=\"46.0\" r=\"10.0\" fill=\"#f1f3f5\" stroke=\"#adb5bd\" stroke-width=\"1.2\"/><text x=\"90.0\" y=\"51.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#c2255c\" text-anchor=\"middle\">?</text><text x=\"90.0\" y=\"118.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#c2255c\" text-anchor=\"middle\">? m²</text><line x1=\"146.0\" y1=\"71.0\" x2=\"146.0\" y2=\"81.0\" stroke=\"#000000\" stroke-width=\"1.4\"/><text x=\"146.0\" y=\"98.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">t = −1</text><circle cx=\"146.0\" cy=\"46.0\" r=\"10.0\" fill=\"#f1f3f5\" stroke=\"#adb5bd\" stroke-width=\"1.2\"/><text x=\"146.0\" y=\"51.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#c2255c\" text-anchor=\"middle\">?</text><text x=\"146.0\" y=\"118.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#c2255c\" text-anchor=\"middle\">? m²</text><line x1=\"202.0\" y1=\"71.0\" x2=\"202.0\" y2=\"81.0\" stroke=\"#000000\" stroke-width=\"1.4\"/><text x=\"202.0\" y=\"98.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">t = 0</text><circle cx=\"202.0\" cy=\"50.0\" r=\"8.0\" fill=\"#b2f2bb\" stroke=\"#2b8a3e\" stroke-width=\"1.4\"/><line x1=\"202.0\" y1=\"50.0\" x2=\"207.6\" y2=\"44.4\" stroke=\"#fff\" stroke-width=\"1.6\"/><text x=\"202.0\" y=\"118.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">1 m²</text><line x1=\"258.0\" y1=\"71.0\" x2=\"258.0\" y2=\"81.0\" stroke=\"#000000\" stroke-width=\"1.4\"/><text x=\"258.0\" y=\"98.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">t = 1</text><circle cx=\"258.0\" cy=\"47.0\" r=\"11.0\" fill=\"#b2f2bb\" stroke=\"#2b8a3e\" stroke-width=\"1.4\"/><line x1=\"258.0\" y1=\"47.0\" x2=\"265.7\" y2=\"39.3\" stroke=\"#fff\" stroke-width=\"1.6\"/><text x=\"258.0\" y=\"118.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">2 m²</text><line x1=\"314.0\" y1=\"71.0\" x2=\"314.0\" y2=\"81.0\" stroke=\"#000000\" stroke-width=\"1.4\"/><text x=\"314.0\" y=\"98.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">t = 2</text><circle cx=\"314.0\" cy=\"43.0\" r=\"15.0\" fill=\"#b2f2bb\" stroke=\"#2b8a3e\" stroke-width=\"1.4\"/><line x1=\"314.0\" y1=\"43.0\" x2=\"324.5\" y2=\"32.5\" stroke=\"#fff\" stroke-width=\"1.6\"/><text x=\"314.0\" y=\"118.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">4 m²</text><line x1=\"172.0\" y1=\"8.0\" x2=\"172.0\" y2=\"64.0\" stroke=\"#1f7a8c\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><text x=\"176.0\" y=\"18.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"700\" fill=\"#1f7a8c\" text-anchor=\"start\">Gözlemin başladığı gün</text></svg>", "son": "<p>Defne'nin modeline göre aşağıdaki ifadeler yazılmıştır.<br>I. Gözlemden 2 gün önce nilüferler <span class=\"frac\"><span>1</span><span>4</span></span> m² alan kaplamaktadır.<br>II. Gözlemden 4 gün önce kaplanan alan, gözlemden 2 gün önce kaplanan alanın yarısıdır.<br>III. Gözlemden 3 gün önce kaplanan alan, gözlemden 3 gün sonra kaplanan alanın 64'te biridir.</p>", "k": "Buna göre, bu ifadelerden hangileri doğrudur?", "sec": ["Yalnız I", "Yalnız III", "I ve II", "I ve III"], "secg": null, "c": "D", "a": ["I. t = −2: 2<sup>−2</sup> = <span class=\"frac\"><span>1</span><span>2<sup>2</sup></span></span> = <span class=\"frac\"><span>1</span><span>4</span></span> m²: doğru. II. t = −4: 2<sup>−4</sup> = <span class=\"frac\"><span>1</span><span>16</span></span> m²; <span class=\"frac\"><span>1</span><span>16</span></span>, <span class=\"frac\"><span>1</span><span>4</span></span>'ün yarısı değil dörtte biridir (2 gün önce alan iki kez yarıya iner): yanlış. III. t = −3: 2<sup>−3</sup> = <span class=\"frac\"><span>1</span><span>8</span></span> m²; t = 3: <span class=\"nw\">2<sup>3</sup> = 8</span> m². 8 : 64 = <span class=\"frac\"><span>1</span><span>8</span></span> olduğundan doğru. Cevap I ve III. (I ve II: gün sayısı farkı 2 olduğu hâlde alanın bir kez yarıya indiği sanılmış; Yalnız I: III'te 2<sup>−3</sup> ile 2<sup>3</sup>'ün ilişkisi kurulamamış; Yalnız III: 2<sup>−2</sup> = −4 sanılıp I yanlış bulunmuş.) [LGS tarzı]"], "t": "", "d": "Negatif üs, sonucu negatif yapmaz: 2<sup>−2</sup> = <span class=\"frac\"><span>1</span><span>4</span></span>'tür. İki gün geri gidildiğinde alan iki kez yarıya iner.", "ses": "b16"}, {"no": 17, "on": "<p>Bir okul şenliğindeki oyunda oyuncu önce çarkı çevirmekte, sonra zarı atmaktadır. Çarkın gösterdiği sayı taban, zarın üst yüzündeki sayı üs olarak alınmaktadır.</p><p>Oyuncunun puanı, oluşan üslü ifadenin değeridir. Çark ve zarın yüzlerindeki sayılar aşağıda gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 340 150\" width=\"340\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><path d=\"M82,72 L82.0,18.0 A54,54 0 0 1 136.0,72.0 Z\" fill=\"#fff4e6\" stroke=\"#e8590c\" stroke-width=\"1.6\"/><text x=\"103.0\" y=\"57.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"17\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">−3</text><path d=\"M82,72 L136.0,72.0 A54,54 0 0 1 82.0,126.0 Z\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.6\"/><text x=\"103.0\" y=\"99.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"17\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">−2</text><path d=\"M82,72 L82.0,126.0 A54,54 0 0 1 28.0,72.0 Z\" fill=\"#e5dbff\" stroke=\"#7048e8\" stroke-width=\"1.6\"/><text x=\"61.0\" y=\"99.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"17\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">2</text><path d=\"M82,72 L28.0,72.0 A54,54 0 0 1 82.0,18.0 Z\" fill=\"#e9ecef\" str m içi bir bilgi yarışmasında her turda yarışmacılar dörder kişilik gruplara ayrılmaktadır. Her turda bütün yarışmacılar bir gruba girmekte ve hiçbir yarışmacı açıkta kalmamaktadır.</p><p>Her gruptan yalnız grup birincisi bir sonraki tura kalmaktadır. Son turda tek bir grup yarışmakta ve bu grubun birincisi şampiyon olmaktadır.</p>", "g": "<svg viewBox=\"0 0 340 140\" width=\"340\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><text x=\"32.0\" y=\"30.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"800\" fill=\"#1f7a8c\" text-anchor=\"middle\">1. tur</text><rect x=\"62.0\" y=\"14.0\" width=\"52.0\" height=\"24.0\" rx=\"6\" fill=\"#fff\" stroke=\"#1f7a8c\" stroke-width=\"1.5\"/><circle cx=\"71.0\" cy=\"26.0\" r=\"4.2\" fill=\"#ffd8a8\" stroke=\"#e8590c\" stroke-width=\"1.1\"/><circle cx=\"82.3\" cy=\"26.0\" r=\"4.2\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.1\"/><circle cx=\"93.6\" cy=\"26.0\" r=\"4.2\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.1\"/><circle cx=\"104.9\" cy=\"26.0\" r=\"4.2\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.1\"/><rect x=\"124.0\" y=\"14.0\" width=\"52.0\" height=\"24.0\" rx=\"6\" fill=\"#fff\" stroke=\"#1f7a8c\" stroke-width=\"1.5\"/><circle cx=\"133.0\" cy=\"26.0\" r=\"4.2\" fill=\"#ffd8a8\" stroke=\"#e8590c\" stroke-width=\"1.1\"/><circle cx=\"144.3\" cy=\"26.0\" r=\"4.2\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.1\"/><circle cx=\"155.6\" cy=\"26.0\" r=\"4.2\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.1\"/><circle cx=\"166.9\" cy=\"26.0\" r=\"4.2\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.1\"/><rect x=\"186.0\" y=\"14.0\" width=\"52.0\" height=\"24.0\" rx=\"6\" fill=\"#fff\" stroke=\"#1f7a8c\" stroke-width=\"1.5\"/><circle cx=\"195.0\" cy=\"26.0\" r=\"4.2\" fill=\"#ffd8a8\" stroke=\"#e8590c\" stroke-width=\"1.1\"/><circle cx=\"206.3\" cy=\"26.0\" r=\"4.2\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.1\"/><circle cx=\"217.6\" cy=\" e cx=\"205.0\" cy=\"76.0\" r=\"4.2\" fill=\"#ffd8a8\" stroke=\"#e8590c\" stroke-width=\"1.1\"/><circle cx=\"216.3\" cy=\"76.0\" r=\"4.2\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.1\"/><circle cx=\"227.6\" cy=\"76.0\" r=\"4.2\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.1\"/><circle cx=\"238.9\" cy=\"76.0\" r=\"4.2\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.1\"/><line x1=\"170.0\" y1=\"92.0\" x2=\"170.0\" y2=\"106.0\" stroke=\"#333333\" stroke-width=\"1.4\"/><polygon points=\"170.0,106.0 166.0,98.0 174.0,98.0\" fill=\"#333333\"/><text x=\"176.0\" y=\"104.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#333333\" text-anchor=\"start\">…</text><text x=\"32.0\" y=\"128.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"800\" fill=\"#1f7a8c\" text-anchor=\"middle\">Son tur</text><rect x=\"144.0\" y=\"112.0\" width=\"52.0\" height=\"24.0\" rx=\"6\" fill=\"#fff\" stroke=\"#1f7a8c\" stroke-width=\"1.5\"/><circle cx=\"153.0\" cy=\"124.0\" r=\"4.2\" fill=\"#ffd8a8\" stroke=\"#e8590c\" stroke-width=\"1.1\"/><circle cx=\"164.3\" cy=\"124.0\" r=\"4.2\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.1\"/><circle cx=\"175.6\" cy=\"124.0\" r=\"4.2\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.1\"/><circle cx=\"186.9\" cy=\"124.0\" r=\"4.2\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.1\"/><line x1=\"200.0\" y1=\"124.0\" x2=\"222.0\" y2=\"124.0\" stroke=\"#333333\" stroke-width=\"1.4\"/><polygon points=\"222.0,124.0 214.0,128.0 214.0,120.0\" fill=\"#333333\"/><text x=\"228.0\" y=\"129.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"800\" fill=\"#e8590c\" text-anchor=\"start\">Şampiyon</text></svg>", "son": "<p>Turuncu yarışmacılar grup birincilerini göstermektedir (temsilî).</p>", "k": "Buna göre, yarışmaya katılan yarışmacı sayısı aşağıdakilerden hangisi <u style=\"white-space:nowrap\">olamaz</u>?", "sec": ["64", "256", "512", "1024"], "secg": null, "c": "C", "a": ["Son turda 4 yarışmacı vardır. Her tur, bir önceki turdaki yarışmacı sayısının dörtte birini bir sonraki tura bırakır; geriye doğru gidildiğinde her tur öncesinde yarışmacı sayısı 4 katına çıkar: 4, 16, 64, 256, 1024, … Yarışmacı sayısı 4'ün pozitif kuvveti olmalıdır. <span class=\"nw\">64 = 4<sup>3</sup></span> (3 tur), <span class=\"nw\">256 = 4<sup>4</sup></span> (4 tur), <span class=\"nw\">1024 = 4<sup>5</sup></span> (5 tur). <span class=\"nw\">512 = 2<sup>9</sup></span> ise 4'ün kuvveti değildir: 512 → 128 → 32 → 8 → 2 olur ve 2 kişi dörtlü grup oluşturamaz. (1024 ya da 256: sayı büyük olduğu için yarışmanın düzgün yürümeyeceği sanılmış; 64: <span class=\"nw\">64 = 8<sup>2</sup></span> olduğu için 4'ün kuvveti olmadığı sanılmış. <span class=\"nw\">512 = 2<sup>9</sup></span> olduğu için 2'nin her kuvvetinin 4'ün de kuvveti olduğunu düşünen öğrenci 512'yi uygun bulur.) [Özgün]"], "t": "", "d": "Son turda 4 kişi vardır; geriye doğru her tur yarışmacı sayısı 4 katına çıkar. 2'nin her kuvveti 4'ün kuvveti değildir.", "ses": "b18"}, {"no": 19, "on": "<p>Bir laboratuvarda üç kaba farklı türde birer bakteri konmuştur. Her kaptaki bakteri sayısı, belirli bir süre boyunca her saatin sonunda belirli bir katına çıkmıştır.</p><p>Kaplara ait bilgiler aşağıdaki tabloda verilmiştir.</p>", "g": "<table style=\"border-collapse:collapse;font-size:10.5pt;margin:0 auto;\"><thead><tr><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Kap</th><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Başlangıçtaki bakteri sayısı</th><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Her saatin sonunda bakteri sayısı kaç katına çıkar?</th><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Deney süresi</th></tr></thead><tbody><tr><td style=\"border:1px z üslere bakılmış.) [Deneme esinli]"], "t": "", "d": "Üssü büyük olan sayı her zaman büyük değildir. Üç sayıyı aynı üsle yazıp tabanlarını karşılaştırınız.", "ses": "b19"}, {"no": 20, "on": "<p>Nehir'in önünde üzerinde birer tam sayı yazan beş mavi ve beş turuncu kart vardır. Nehir, bir mavi kartı taban, bir turuncu kartı üs olarak seçip bir üslü ifade oluşturacaktır.</p><p>Kartlar aşağıda gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 340 142\" width=\"340\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><text x=\"12.0\" y=\"18.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"800\" fill=\"#1971c2\" text-anchor=\"start\">Mavi kartlar (taban)</text><text x=\"12.0\" y=\"86.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"800\" fill=\"#e8590c\" text-anchor=\"start\">Turuncu kartlar (üs)</text><rect x=\"12.0\" y=\"26.0\" width=\"38.0\" height=\"40.0\" rx=\"6\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.6\"/><text x=\"31.0\" y=\"52.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">−4</text><rect x=\"56.0\" y=\"26.0\" width=\"38.0\" height=\"40.0\" rx=\"6\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.6\"/><text x=\"75.0\" y=\"52.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">−2</text><rect x=\"100.0\" y=\"26.0\" width=\"38.0\" height=\"40.0\" rx=\"6\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.6\"/><text x=\"119.0\" y=\"52.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">2</text><rect x=\"144.0\" y=\"26.0\" width=\"38.0\" height=\"40.0\" rx=\"6\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.6\"/><text x=\"163.0\" y=\"52.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">4</text><rect x=\"1 /* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();
