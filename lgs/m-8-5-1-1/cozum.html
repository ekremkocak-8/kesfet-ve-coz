<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çözümler · Keşfet ve Çöz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--muted:#5b6478;--line:#dfe5ef;--bg:#f5f7fb;--card:#fff;--ss:#6741d9;--kk:#0b7285;--b:#d0700f;--ok:#2b8a3e;--warn:#c92a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif}
header{background:linear-gradient(135deg,#1c5fbf,#2f8fe0);color:#fff;padding:18px 16px 22px}

main{max-width:780px;margin:14px auto 40px;padding:0 16px}
nav.sec{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}nav.sec button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}

ol.sec{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
ol.sec li{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}ol.sec li.dogru{border-color:var(--ok);background:#ebfbee;font-weight:800}
.adim{border-left:4px solid var(--c);padding:6px 12px;margin:8px 0;background:#fff;border-radius:0 10px 10px 0;animation:gel .35s ease-out}
.adim b{color:var(--c)}@keyframes gel{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dug{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
button.btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.dikkat{background:#fff4e6;border:2px solid #f59f00;border-radius:12px;padding:10px 14px;margin:12px 0 4px}.dikkat b{color:#d9480f}
.tuzak{font-size:15px;color:var(--muted);margin-top:8px}
.cevap{font-weight:900;color:var(--ok);margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid var(--line);padding:8px 10px;text-align:left}th{background:#e3fafc;color:#0b7285;font-size:13px;letter-spacing:.06em}
.ses{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border-radius:12px;background:#eef2ff}

.ses span{font-size:14px;color:var(--muted)}
.gizli{display:none}
.tum{margin:4px 0 14px;font-size:14px}.tum a{color:#1c5fbf;font-weight:800}
@media (prefers-reduced-motion:reduce){.adim{animation:none}}
/* Canlandır (05.10.2026) */
.sek{display:flex;gap:6px;margin:12px 0 0;border-bottom:2px solid var(--line)}
.sek button{border:0;background:none;font:inherit;font-weight:900;font-size:15px;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);min-height:44px;position:relative;top:2px;border-bottom:3px solid transparent}
.sek button[aria-selected=true]{color:var(--c);border-bottom-color:var(--c);background:#fff8f0}
.sek .yeni{display:inline-block;font-size:10px;background:#2b8a3e;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.06em}
.cn{padding-top:10px}
.cn-yon{background:#eef6ff;border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:10px}
.cn-sahne{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;min-height:120px;overflow-x:auto}

.cn-adimci input,.cn-test input{width:84px;height:44px;border:2px solid var(--line);border-radius:12px;font:inherit;font-weight:900;text-align:center;font-size:18px}
.cn-test label{font-weight:800;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.cn-btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
.cn-btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.cn-btn[aria-pressed=true]{background:var(--ac,var(--c));color:#fff;border-color:var(--ac,var(--c))}
.cn-btn:disabled{opacity:.5}
.cn-hazir{display:flex;flex-wrap:wrap;gap:6px}

.cn-dur .iyi{color:var(--ok);font-weight:900}.cn-dur .kotu{color:var(--warn);font-weight:900}
.cn-df{margin-top:10px;overflow-x:auto}@media(max-width:480px){.cn-adimci>span{flex-basis:100%}.cn-h{font-size:12px;padding:5px 0}.cn-izg{gap:3px}.cn-sahne{padding:6px}}@media(max-width:480px){.cn-df table{font-size:13px}.cn-df td,.cn-df th{padding:4px 5px}}.cn-df summary{font-weight:900;cursor:pointer;padding:6px 0}.cn-say{color:var(--muted);font-weight:700}
.cn-df table{font-size:15px}.cn-df td{padding:5px 8px}.cn-df tr.cn-iyi td{background:#ebfbee}.cn-df tr.cn-kotu td{background:#fff5f5}.cn-df tr.cn-son td{outline:2px solid var(--c);outline-offset:-2px}
.cn-p{animation:cnGel .35s ease-out both}@keyframes cnGel{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cn-o{fill:#ffa94d;stroke:#d9480f;stroke-width:1}.cn-o2{fill:#e8590c}.cn-k{fill:#ffc9c9;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:3 2}
.cn-cerceve{stroke:#2b8a3e;stroke-width:3}.cn-et{font-size:13px;font-weight:800;fill:#5b6478}.cn-et.b,.cn-et2b{font-weight:900;fill:#1d2433}.cn-et2{font-size:11px;fill:#5b6478;font-weight:700}.cn-et2b{font-size:13px;fill:#fff}
.cn-ku{fill:#fff4e6;stroke:#ffa94d;stroke-width:1.5}.cn-kk{fill:#fff5f5;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:4 3}
.cn-tahta0{fill:#f1f3f5;stroke:#ced4da}.cn-tahta{fill:#c08552;stroke:#8d5a2b}
.cn-ek{stroke:#868e96;stroke-width:2}.cn-sinir{stroke:#c92a2a;stroke-width:3;stroke-dasharray:5 4}.cn-yay{fill:none;stroke:#f76707;stroke-width:2}
.cn-v1{stroke:#2b8a3e;stroke-width:3}.cn-v2{stroke:#c92a2a;stroke-width:3}.cn-kis{font-size:20px}.cn-bus{font-size:16px}.cn-bek{stroke:#c92a2a;stroke-width:5;stroke-linecap:round;opacity:.6}
.cn-kum{fill:#ffe8cc;stroke:#e8590c;stroke-width:3}.cn-kum2{fill:#495057}.cn-para{fill:#ffd43b;opacity:.85}.cn-buyuk{font-size:26px;font-weight:900;fill:#1d2433}
.cn-zem{fill:#adb5bd}.cn-kat{fill:#f1f3f5;stroke:#ced4da}.cn-katon{fill:#d3f9d8;stroke:#2b8a3e}.cn-katoff{fill:#ffe3e3;stroke:#e03131}
.cn-izg{display:grid;gap:4px}.cn-h,.cn-gb{border-radius:8px;text-align:center;font-weight:800;font-size:14px;padding:6px 0}.cn-h{background:#f1f3f5;transition:background .25s,transform .25s}
.cn-gb{background:none;color:var(--muted);font-size:12px}.cn-h.on{background:#ffa94d;color:#1d2433}.cn-h.yeni{transform:scale(1.18);box-shadow:0 0 0 3px #e8590c}
.cn-kartlar{display:flex;flex-wrap:wrap;gap:6px;padding:4px}.cn-kart{min-width:44px;padding:8px 10px;text-align:center;border-radius:10px;background:#fff4e6;border:2px solid #ffa94d;font-weight:900;animation:cnGel .3s}
.cn-kart.kare{background:#e7f5ff;border-color:#1c7ed6}.cn-bosk{color:var(--muted)}
.cn-cift{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 4px;font-weight:800}.cn-cift i{font-weight:600;color:#1c7ed6}
.cn-katlar{padding:4px}.cn-katsat{display:inline-flex;flex-wrap:wrap;gap:6px}.cn-kat2{background:#e6fcf5;border:1.5px solid #12b886;border-radius:8px;padding:3px 8px;font-weight:800;animation:cnGel .3s}.cn-sonsuz{font-weight:800;color:#0b7285}
.cn-onr{background:#f8f0fc;border:2px solid #ae3ec9;border-radius:12px;padding:10px 14px}.cn-kanit{padding:10px 4px 2px}
.cn-kay{display:inline-flex;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap}.cn-kay{max-width:100%}.cn-kay input{width:min(220px,70vw);accent-color:#d0700f}.cn-satir>*{min-width:0;max-width:100%}
@media (prefers-reduced-motion:reduce){.cn-p,.cn-kart,.cn-kat2{animation:none}.cn-h{transition:none}}
/* 05.10.2026 · KOŞUL ve LABİRENT motorları (SB 6.1.1) */
@media(max-width:560px){.soru [style*="grid-template-columns:repeat"]{grid-template-columns:1fr!important}}   /* çok sütunlu konuşma balonları telefonda alt alta */
.cn-kl{list-style:none;padding:0;margin:0;display:grid;gap:4px}.cn-not{color:var(--muted);font-size:14px}.cn-sonuc{margin-top:6px;font-weight:800}
.cn-secg{gap:6px}.cn-secad{font-weight:800;flex-basis:100%}.cn-secg .cn-btn{padding:8px 12px}
.cn-mv{fill:#74c0fc;stroke:#1c7ed6;stroke-width:1}.cn-tl{fill:#69db7c;stroke:#2b8a3e;stroke-width:1.5}
.cn-lab{display:grid;gap:4px;align-items:center;max-width:460px;margin:0 auto}
.cn-lc{min-height:44px;border-radius:8px;border:1.5px solid #ced4da;background:#fff;font:inherit;font-weight:900;font-size:16px;cursor:pointer;padding:0;color:var(--ink)}
.cn-lc.yol{background:#d3f9d8;border-color:#2b8a3e}.cn-lc.simdi{background:#2b8a3e;color:#fff;box-shadow:0 0 0 3px #b2f2bb}.cn-lc.kapali{background:#ffe3e3;border-color:#e03131;color:#c92a2a;text-decoration:line-through}
.cn-lok{color:#2b8a3e;font-weight:900;text-align:center}.cn-lcik{min-height:44px;border:0;background:none;font:inherit;font-weight:900;color:#d9480f;cursor:pointer;padding:0;white-space:nowrap;font-size:14px}.cn-lcik:disabled{cursor:default}

</style></head><body>
<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }
      if (!art && !o.sandalye) sv += `<rect x="10" y="10" width="${gen * hc}" height="${sira * hc}" fill="none" class="cn-cerceve"/>
        <text x="${10 + gen * hc / 2}" y="${H + 4}" class="cn-et" text-anchor="middle">${gen} ${o.birim || ""}</text>
        <text x="${W + 4}" y="${10 + sira * hc / 2}" class="cn-et" dominant-baseline="middle">${sira} ${o.birim || ""}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W + 70} ${H + 22}" role="img" aria-label="${N} ${o.ad || "kare"}, her sırada ${gen}">${sv}</svg>`;
      const r = o.kural ? o.kural(gen, sira, art, N) : null;
      let m;
      if (art) m = `<span class="kotu">✘</span> ${N} ${o.ad || "kare"} her sırada ${gen} olacak biçimde dizilince ${sira} tam sıra oluşur, <b>${art} ${o.ad || "kare"} artar</b>. Dikdörtgen olmaz: ${N} : ${gen} işleminde kalan ${art}.`;
      else m = `<span class="iyi">✔</span> <b>${N} = ${gen} ${x} ${sira}</b> · ${sira} sıra, her sırada ${gen} ${o.ad || "kare"}; hiç artmadı.` + (gen === sira ? ` <b>Kare oldu!</b> İki kenar aynı: ${gen}.` : "");
      if (!art && o.cevre) m += ` Çevre = 2 ${x} (${gen} + ${sira}) = <b>${2 * (gen + sira)} m</b>.`;
      if (r && r.msg) m += `<br>${r.msg}`;
      s.dur.innerHTML = m;
      const sutunlar = o.satir ? o.satir(gen, sira, art, N, r) : [gen, art ? `${sira} (+ ${art} artan)` : sira, art, art ? "olmaz" : (gen === sira ? "kare" : "dikdörtgen")];
      s.yaz(N + ":" + gen, sutunlar, !art && (!r || r.ok !== false));
    }
    ciz(g.get());
  }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {
    const N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });
    const g = adimci(o.etiket, 1, o.max || N, o.bas || 2, v => { sonK = v; });

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {

      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */

  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →

  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);

      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

const K8 = (() => {
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const Q = (p, q = 1) => { if (q < 0) { p = -p; q = -q; } const g = gcd(p, q); return { p: p / g, q: q / g }; };
  const qp = (a, e) => { if (a === 0) return e > 0 ? Q(0) : null; return e >= 0 ? Q(a ** e) : Q(1, a ** (-e)); };   // a tam sayı
  const qpQ = (x, e) => e >= 0 ? Q(x.p ** e, x.q ** e) : Q(x.q ** (-e), x.p ** (-e));                                  // kesir taban
  const qEs = (x, y) => x && y && x.p === y.p && x.q === y.q;
  const qv = x => x.p / x.q;
  const sn = n => { if (typeof n === "bigint") { const s = (n < 0n ? -n : n).toString(); return (n < 0n ? "−" : "") + (s.length > 4 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, " ") : s); }
    if (typeof n !== "number") return String(n).replace(/-/g, "−"); const s = String(Math.abs(n)); return (n < 0 ? "−" : "") + (Math.abs(n) >= 10000 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, " ") : s); };
  const fr = (p, q) => `<span class="frac"><span>${p}</span><span>${q}</span></span>`;
  const qh = x => x === null ? "tanımsız" : x.q === 1 ? sn(x.p) : (x.p < 0 ? "−" : "") + fr(sn(Math.abs(x.p)), sn(x.q));
  const tb = a => typeof a === "number" && a < 0 ? `(${sn(a)})` : String(a);
  const us = (a, e) => `${tb(a)}<sup>${sn(e)}</sup>`;
  const UST = e => String(e).replace(/[−-]/g, "⁻").split("").map(c => c === "⁻" ? c : "⁰¹²³⁴⁵⁶⁷⁸⁹"[+c]).join("");
  const usU = (a, e) => `${typeof a === "number" && a < 0 ? `(${sn(a)})` : a}${UST(e)}`;
  const ondalik = (x, b = 1) => (Math.round(x * 10 ** b) / 10 ** b).toString().replace(".", ",");

  const svgFr = (x, y, p, q, fs = 15, renk = "#1d2433") => `<text x="${x}" y="${y - fs * .2}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${renk}">${p}</text><line x1="${x - fs * .5}" y1="${y}" x2="${x + fs * .5}" y2="${y}" stroke="${renk}" stroke-width="${(fs * .08).toFixed(2)}"/><text x="${x}" y="${y + fs * .95}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${renk}">${q}</text>`;
  return { gcd, Q, qp, qpQ, qEs, qv, sn, fr, qh, tb, us, UST, usU, ondalik, svgFr };

/* ---------------- ortak iskelet (canlandir.js ile aynı sınıflar) ---------------- */
CN.k8Iskelet = function (el, o) {
  const h = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.innerHTML = x; return e; };
  el.innerHTML = "";
  const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
  const sah = h("div", "cn-sahne"), den = h("div", "cn-den"), dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
  dur.setAttribute("aria-live", "polite");
  const df = h("details", "cn-df"); df.open = true;
  df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
  el.append(y, sah, den, dur, df);
  const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
  const yaz = (anahtar, hucre, iyi) => {
    if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
    kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
    tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
    tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
  };
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };
  return { h, sah, den, dur, yaz, dug, sayi: () => kayit.size, kayit };
};

/* ---------------- MOTOR: LAB (kuvvet laboratuvarı) ----------------
   o.girdi: [{ad, min, max, bas, adim?, yaz?} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → sahne (SVG/HTML) · o.durum(v) → sonuç metni
   o.satir(v) → deney defteri satırı (null: yazılmaz) · o.iyi(v) → yeşil/kırmızı satır · o.anahtar(v) · o.hazir: [{ad, v:[…]}] */
CN.LAB = function (el, o) {
  const s = CN.k8Iskelet(el, o), v = o.girdi.map(g => g.bas), ayar = [];
  o.girdi.forEach((g, i) => {
    const w = s.h("div", "cn-satir");
    if (g.sec) {
      w.classList.add("cn-secg"); w.appendChild(s.h("span", "cn-secad", g.ad));
      const bs = g.sec.map(x => { const b = s.dug(g.yaz ? g.yaz(x) : K8.sn(x), "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
      const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); guncelle(); };
      ayar[i] = sec;
    } else {
      const adim = g.adim || 1, ond = adim % 1 !== 0, yz = g.yaz || (x => ond ? K8.ondalik(x) : K8.sn(x));
      const a = s.h("div", "cn-adimci");
      a.innerHTML = `<span>${g.ad}</span><button type="button" aria-label="${g.ad.replace(/<[^>]+>/g, "")} azalt">−</button>${ond || g.yaz ? `<output></output>` : `<input type="number" inputmode="numeric" min="${g.min}" max="${g.max}" aria-label="${g.ad.replace(/<[^>]+>/g, "")}">`}<button type="button" aria-label="${g.ad.replace(/<[^>]+>/g, "")} artır">+</button>`;
      const [b1, b2] = a.querySelectorAll("button"), inp = a.querySelector("input"), out = a.querySelector("output");
      const kur = x => { x = Math.max(g.min, Math.min(g.max, Math.round((+x) / adim) * adim)); if (isNaN(x)) x = g.min; x = +x.toFixed(4); v[i] = x; if (inp) inp.value = x; else out.innerHTML = yz(x); };
      const ata = x => { kur(x); guncelle(); };
      b1.onclick = () => ata(v[i] - adim); b2.onclick = () => ata(v[i] + adim);
      if (inp) inp.onchange = () => ata(String(inp.value).replace(",", "."));
      kur(g.bas); ayar[i] = ata; w.appendChild(a);
    }
    s.den.appendChild(w);
  });
  if (o.hazir) { const hz = s.h("div", "cn-hazir cn-secg"); if (o.hazirEt) hz.appendChild(s.h("span", "cn-secad", o.hazirEt)); o.hazir.forEach(x => { const b = s.dug(x.ad, "ghost"); b.onclick = () => { x.v.forEach((y, i) => { if (y != null) { v[i] = y; } }); x.v.forEach((y, i) => { if (y != null) ayar[i](y); }); }; hz.appendChild(b); }); s.den.appendChild(hz); }
  let hazir = false;
  function guncelle() {
    if (!hazir) return;
    const c = v.slice(); s.sah.innerHTML = o.ciz(c, s); s.dur.innerHTML = o.durum(c, s);
    const r = o.satir ? o.satir(c, s) : null;
    if (r) s.yaz(o.anahtar ? o.anahtar(c) : c.join("|"), r, o.iyi ? o.iyi(c) : undefined);
    if (o.sonra) o.sonra(c, s);
  }
  hazir = true; guncelle();
  return { v, ayar, s };
};

/* ---------------- MOTOR: DURUM (düğmelerle adım adım değişen durum) ----------------
   o.bas(secim) → başlangıç durumu · o.dugmeler: [{ad, f(d) → {d, msg} }] · o.ciz(d) · o.durum(d) · o.bitti(d) → {anahtar, hucre, iyi, msg} | null
   o.secim: {ad, sec, bas, yaz} (başlangıcı seçtirir; değişince düzenek baştan kurulur) */
CN.DURUM = function (el, o) {
  const s = CN.k8Iskelet(el, o); let sec = o.secim ? o.secim.bas : null, d = o.bas(sec), son = "", kapali = false;
  if (o.secim) {
    const w = s.h("div", "cn-satir cn-secg"); w.appendChild(s.h("span", "cn-secad", o.secim.ad));
    const bs = o.secim.sec.map(x => { const b = s.dug(o.secim.yaz ? o.secim.yaz(x) : K8.sn(x), "ghost"); b.setAttribute("aria-pressed", x === sec); b.onclick = () => { sec = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", o.secim.sec[j] === x)); bastan(); }; w.appendChild(b); return b; });
    s.den.appendChild(w);
  }
  const w = s.h("div", "cn-satir");
  const bt = o.dugmeler.map(g => { const b = s.dug(g.ad, g.ghost ? "ghost" : ""); b.onclick = () => { if (kapali) return; const r = g.f(d); if (r.d) d = r.d; son = r.msg || ""; ciz(); }; w.appendChild(b); return b; });
  const bB = s.dug("Baştan", "ghost"); bB.onclick = () => bastan(); w.appendChild(bB); s.den.appendChild(w);
  function bastan() { d = o.bas(sec); son = ""; kapali = false; ciz(); }
  function ciz() {
    s.sah.innerHTML = o.ciz(d, sec); let m = (son ? son + "<br>" : "") + o.durum(d, sec);
    const b = o.bitti ? o.bitti(d, sec) : null;
    if (b) { kapali = !!b.kapat; s.yaz(b.anahtar, b.hucre, b.iyi); if (b.msg) m += "<br>" + b.msg; }
    bt.forEach(x => x.disabled = kapali);
    s.dur.innerHTML = m;
  }
  ciz();
};

ar siyah kalem vardır; kutudaki kalemlerin sayısı 26'dan azdır. Rastgele alınan bir kalemin siyah olması kırmızı olmasından daha fazla olasılıklıdır. Siyah kalem sayısı kaç olabilir?", "a": ["Siyah kalem sayısı 6'dan fazladır: en az 7.", "6 + 9 = 15; 15 + siyah sayısı 26'dan az olmalı: siyah en fazla 10."], "c": "7, 8, 9 ya da 10"}]}, {"no": 6, "bas": "Eşit şans ve <span class=\"frac\"><span>1</span><span>n</span></span>", "q": [{"k": "Aşağıdaki deneylerin hangilerinde çıktılar eşit şansa sahiptir? Eşit şanslı olanlarda her çıktının olasılık değerini yazınız.<br>I. Renkleri dışında özdeş ve üzerinde farklı harfler yazılı 5 topun bulunduğu bir torbadan bir top çekilmesi<br>II. Bir ayın 31 gününden birinin kura ile seçilmesi<br>III. Okul servisinin durağa “erken” ya da “geç” gelmesi<br>IV. 6 eş dilimli, 2 dilimi aynı renkte olan bir çarkta çıkan rengin okunması", "a": ["I ve II'de hiçbir çıktı kayırılmaz: I'de her top <span class=\"frac\"><span>1</span><span>5</span></span>, II'de her gün <span class=\"frac\"><span>1</span><span>31</span></span>.", "III'teki iki sonuç eşit koşullarda gerçekleşmez; IV'te dilimler eşit şanslıdır ama iki dilimi olan renk öteki renklerle eşit şanslı değildir."], "c": "I (<span class=\"frac\"><span>1</span><span>5</span></span>) ve II (<span class=\"frac\"><span>1</span><span>31</span></span>)"}, {"k": "DEFNE kelimesinin harfleri, her harf bir karta gelecek şekilde ayrı ayrı özdeş kartlara yazılmıştır. Kartlardan biri rastgele çekiliyor. Kartların her birinin olasılık değerini yazınız. Harfler eşit şanslı mıdır? Gerekçesiyle açıklayınız.", "a": ["5 kart eşit şanslıdır: her kartın olasılık değeri <span class=\"frac\"><span>1</span><span>5</span></span>.", "E harfi iki kartta yazılıdır; E gelmesi D gelmesinden daha fazla olasılıklıdır."], "c": "Her kart <span class=\"frac\"><span>1</span><span>5</span></span>; harfler eşit şanslı değildir."}]}, {"no": 7, "bas": "<span class=\"frac\"><span>1</span><span>n</span></span>'den n'ye", "q": [{"k": "Bir bilgi yarışmasında soru zarflarından biri kura ile seçilecektir. Her zarfın seçilme olasılık değeri <span class=\"frac\"><span>1</span><span>36</span></span>'dır. Zarflar tarih, bilim, spor ve sanat konularına eşit sayıda ayrılmıştır. Her konuda kaç zarf vardır? Seçilen zarfın bilim konusundan olma olasılık değeri kaçtır?", "a": ["Her zarf <span class=\"frac\"><span>1</span><span>36</span></span> olduğuna göre 36 zarf vardır; 36 : 4 = 9 zarf her konuda.", "Dört konu eşit sayıda zarf içerdiğinden konular eşit şanslıdır: <span class=\"frac\"><span>1</span><span>4</span></span>."], "c": "9 zarf; <span class=\"frac\"><span>1</span><span>4</span></span>"}, {"k": "Aşağıdaki yargılardan hangileri eşit şans düşüncesini yanlış kullanmaktadır? Gerekçesiyle belirtiniz.<br>I. “Otobüs durağa ya zamanında gelir ya gecikir; zamanında gelme olasılığı <span class=\"frac\"><span>1</span><span>2</span></span>'dir.”<br>II. “1'den 5'e kadar numaralandırılmış eş dilimli bir çarkta 3 gelme olasılığı <span class=\"frac\"><span>1</span><span>5</span></span>'tir.”<br>III. “Torbada 1 kırmızı ve 3 mavi top var. Çekilen top ya kırmızı ya mavidir; kırmızı olma olasılığı <span class=\"frac\"><span>1</span><span>2</span></span>'dir.”", "a": ["I: iki sonuç eşit koşullarda gerçekleşmez; <span class=\"frac\"><span>1</span><span>2</span></span> denemez. III: eşit şanslı çıktılar 4 toptur, renkler eşit şanslı değildir.", "II: 5 eş dilim eşit şanslıdır; her dilim <span class=\"frac\"><span>1</span><span>5</span></span>, doğrudur."], "c": "I ve III"}]}, {"no": 8, "bas": "LGS problemleri", "q": [{"k": "Bir okulun satranç ve drama kulüplerindeki öğrencilerin sayıları aşağıdaki tabloda verilmiştir; drama kulübündeki kız öğrencilerin sayısı silinmiştir. Her öğrenci yalnız bir kulübe üyedir.<div style=\"display:flex;justify-content:center\"><table style=\"border-collapse:collapse;font-size:10pt\"><thead><tr><th style=\"border:.3mm solid #1f7a8c;background:#e6f4f7;padding:1.1mm 2.4mm;font-weight:700\"></th><th style=\"border:.3mm solid #1f7a8c;background:#e6f4f7;padding:1.1mm 2.4mm;font-weight:700\">Kız</th><th style=\"border:.3mm solid #1f7a8c;background:#e6f4f7;padding:1.1mm 2.4mm;font-weight:700\">Erkek</th></tr></thead><tbody><tr><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;font-weight:700;background:#f8f9fa;\">Satranç</td><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;\">8</td><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;\">6</td></tr><tr><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;font-weight:700;background:#f8f9fa;\">Drama</td><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;\">?</td><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;\">3</td></tr></tbody></table></div>Bu iki kulüpten rastgele seçilen bir öğrencinin kız olması erkek olmasından daha fazla olasılıklı; drama kulübünden olması satranç kulübünden olmasından daha az olasılıklıdır. Silinen sayı kaç farklı değer alabilir?", "a": ["Kızlar erkeklerden çok: 8 + silinen sayı, 6 + 3 = 9'dan fazla → silinen sayı en az 2.", "Drama üyeleri satranç üyelerinden az: silinen sayı + 3, 8 + 6 = 14'ten az → en fazla 10. Değerler 2, 3, …, 10."], "c": "9 farklı değer"}, {"k": "Bir torbada yalnız kırmızı ve mavi bilyeler vardır; rastgele çekilen bir bilyenin kırmızı olması mavi olmasıyla eşit olasılıklıdır. Torbaya 4 kırmızı bilye eklenince torbada 40 bilye olur. Başlangıçta torbada kaç mavi bilye vardı?", "a": ["Eşit olasılıklı olduğu için başlangıçta kırmızı ve mavi bilyeler eşit sayıdadır.", "40 − 4 = 36 bilye başlangıçtaki toplamdır; 36 : 2 = 18 mavi bilye."], "c": "18"}]}], "k": [{"no": 1, "bas": "Olası durumları yazınız", "yon": "Her deneyin ya da olayın bütün olası durumlarını çizgiye liste biçiminde yazınız; parantez içinde olası durum sayısını belirtiniz.", "r": [{"n": "<span class=\"uzun\">Ece, Kaan ve Selin'den biri kura ile nöbetçi seçilecektir.</span>", "c": "Ece, Kaan, Selin (3)"}, {"n": "<span class=\"uzun\">Üzerinde 3, 6 ve 0 yazan üç karttan ikisiyle iki basamaklı sayılar yazılacaktır.</span>", "c": "30, 36, 60, 63 (4)"}, {"n": "<span class=\"uzun\">Beyaz ve lacivert renkli; S, M ve L bedenli tişörtlerden bir tişört seçilecektir.</span>", "c": "beyaz–S, beyaz–M, beyaz–L, lacivert–S, lacivert–M, lacivert–L (6)"}, {"n": "<span class=\"uzun\">Kırmızı, mavi, yeşil ve siyah kalemlerden ikisi birlikte seçilecektir.</span>", "c": "kırmızı–mavi, kırmızı–yeşil, kırmızı–siyah, mavi–yeşil, mavi–siyah, yeşil–siyah (6)"}, {"n": "<span class=\"uzun\">Hilesiz bir sayı küpünde “3'ün katı gelmesi” olayı</span>", "c": "3, 6 (2)"}, {"n": "<span class=\"uzun\">1 TL, 50 kuruşluk ve 25 kuruşluk birer madenî paradan ikisi kardeşe verilecektir; verilebilecek farklı tutarlar</span>", "c": "1 TL 50 kuruş, 1 TL 25 kuruş, 75 kuruş (3)"}]}, {"no": 2, "bas": "Karşılaştırınız", "yon": "Her satırdaki birinci olayın ikinci olaya göre daha fazla, eşit ya da daha az olasılıklı olduğunu ve olaylara ait olası durum sayılarını yazınız. Sayı küpü 1'den 6'ya kadar numaralandırılmış ve hilesizdir.", "r": [{"n": "<span class=\"uzun\">Sayı küpü: “2'den büyük sayı gelmesi” ile “5'ten küçük sayı gelmesi”</span>", "c": "Eşit (4 ve 4)"}, {"n": "<span class=\"uzun\">Sayı küpü: “1'den büyük tek sayı gelmesi” ile “4'ün böleni gelmesi”</span>", "c": "Daha az (2 ve 3)"}, {"n": "<span class=\"uzun\">Torba (3 mor, 6 beyaz, 2 pembe top): “mor top” ile “pembe top”</span>", "c": "Daha fazla (3 ve 2)"}, {"n": "<span class=\"uzun\">Aynı torba: “mor ya da pembe top” ile “beyaz top”</span>", "c": "Daha az (5 ve 6)"}, {"n": "<span class=\"uzun\">8 eş dilimli çark (5 turuncu, 3 mavi dilim): “mavi” ile “turuncu”</span>", "c": "Daha az (3 ve 5)"}, {"n": "<span class=\"uzun\">1'den 9'a kadar numaralı kartlar: “asal numara” ile “tek numara”</span>", "c": "Daha az (4 ve 5)"}, {"n": "<span class=\"uzun\">Aynı kartlar: “3'ün katı numara” ile “4'ten küçük numara”</span>", "c": "Eşit (3 ve 3)"}, {"n": "<span class=\"uzun\">Aynı kartlar: “çift numara” ile “5'ten büyük numara”</span>", "c": "Eşit (4 ve 4)"}]}, {"no": 3, "bas": "Eşit şanslı mı? <span class=\"frac\"><span>1</span><span>n</span></span> kaçtır?", "yon": "Her deneyin çıktılarının eşit şansa sahip olup olmadığını yazınız; eşit şanslıysa çıktı sayısını (n) ve her çıktının olasılık değerini yazınız.", "r": [{"n": "<span class=\"uzun\">Hilesiz bir madenî para atılıyor.</span>", "c": "Evet; n = 2, <span class=\"frac\"><span>1</span><span>2</span></span>"}, {"n": "<span class=\"uzun\">1'den 8'e kadar numaralandırılmış eş dilimli bir çark çevriliyor.</span>", "c": "Evet; n = 8, <span class=\"frac\"><span>1</span><span>8</span></span>"}, {"n": "<span class=\"uzun\">27 kişilik bir sınıftan kura ile bir öğrenci seçiliyor.</span>", "c": "Evet; n = 27, <span class=\"frac\"><span>1</span><span>27</span></span>"}, {"n": "<span class=\"uzun\">Bir dilimi çarkın yarısı kadar olan üç dilimli bir çark çevriliyor.</span>", "c": "Hayır (dilimler eş değil)"}, {"n": "<span class=\"uzun\">Torbada 2 sarı ve 1 mavi top var; çekilen topun rengi okunuyor.</span>", "c": "Hayır (sarı iki topta); her top <span class=\"frac\"><span>1</span><span>3</span></span>"}, {"n": "<span class=\"uzun\">Renkleri dışında özdeş 9 topun bulunduğu bir torbadan bir top çekiliyor.</span>", "c": "Evet; n = 9, <span class=\"frac\"><span>1</span><span>9</span></span>"}, {"n": "<span class=\"uzun\">Bir yüzü daha ağır yapılmış bir sayı küpü atılıyor.</span>", "c": "Hayır"}, {"n": "<span class=\"uzun\">Bir öğrencinin sınav sonucu “geçti” ya da “kaldı” olarak bekleniyor.</span>", "c": "Hayır (iki sonuç eşit şanslı değil)"}]}], "b": [{"no": 1, "on": "<p>Okul gezisinde fotoğraf çekecek öğrenci, aday öğrenciler arasından kura ile seçilecektir. Aday öğrencilerin adları ve şubeleri aşağıdaki listede verilmiştir.</p>", "g": "<div style=\"display:flex;justify-content:center\"><table style=\"border-collapse:collapse;font-size:10.8pt\"><thead><tr><th style=\"border:.3mm solid #1f7a8c;background:#e6f4f7;padding:1.1mm 2.4mm;font-weight:700\">Ad</th><th style=\"border:.3mm solid #1f7a8c;background:#e6f4f7;padding:1.1mm 2.4mm;font-weight:700\">Şube</th></tr></thead><tbody><tr><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;font-weight:700;background:#f8f9fa;\">Ayşe</td><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;\">A</td></tr><tr><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;font-weight:700;background:#f8f9fa;\">Burak</td><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;\">B</td></tr><tr><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;font-weight:700;background:#f8f9fa;\">Cem</td><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;\">C</td></tr><tr><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;font-weight:700;background:#f8f9fa;\">Duru</td><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;\">B</td></tr><tr><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;font-weight:700;background:#f8f9fa;\">Eda</td><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;\">A</td></tr><tr><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;font-weight:700;background:#f8f9fa;\">Furkan</td><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;\">B</td></tr></tbody></table></div>", "son": "", "k": "Buna göre, “B şubesinden bir öğrencinin seçilmesi” olayına ait olası durumlar aşağıdakilerden hangisidir?", "sec": ["Burak, Duru", "Ayşe, Eda", "Burak, Duru, Furkan", "Ayşe, Burak, Cem, Duru, Eda, Furkan"], "secg": null, "c": "C", "a": ["Listede şubesi B olan öğrenciler seçilir.", "Burak, Duru ve Furkan B şubesindedir; olaya ait 3 olası durum vardır. (Burak, Duru: listenin sonundaki Furkan gözden kaçmış; Ayşe, Eda: A şubesi seçilmiş; altı öğrenci: tüm olası durumlar yazılmış)"], "t": "", "d": "Olaya ait olası durumlar, listede koşulu sağlayan bütün çıktılardır. Listeyi sonuna kadar tarayınız; bir adı atlamak olası durumları eksik yazmak demektir.", "ses": "b01"}, {"no": 2, "on": "<p>Bir dondurmacının tabelasında satılan aromalar ve külah türleri aşağıda verilmiştir. Her aroma her iki külahla satılmaktadır.</p>", "g": "<div style=\"display:flex;justify-content:center\"><table style=\"border-collapse:collapse;font-size:10.8pt\"><thead><tr><th style=\"border:.3mm solid #1f7a8c;background:#e6f4f7;padding:1.1mm 2.4mm;font-weight:700\">Aromalar</th><th style=\"border:.3mm solid #1f7a8c;background:#e6f4f7;padding:1.1mm 2.4mm;font-weight:700\">Külahlar</th></tr></thead><tbody><tr><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;font-weight:700;background:#f8f9fa;\">vanilyalı</td><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;\">sade</td></tr><tr><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;font-weight:700;background:#f8f9fa;\">çikolatalı</td><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;\">kakaolu</td></tr><tr><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;font-weight:700;background:#f8f9fa;\">limonlu</td><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;\"></td></tr><tr><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;font-weight:700;background:#f8f9fa;\">çilekli</td><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;\"></td></tr></tbody></table></div>", "son": "<p>Müşteri bir aroma ve bir külah seçerek tek toplu bir dondurma alacaktır.</p>", "k": "Buna göre, müşterinin alabileceği dondurma için kaç olası durum vardır?", "sec": ["8", "6", "4", "16"], "secg": null, "c": "A", "a": ["Aromalar satırlara, külahlar sütunlara yazılırsa tabloda 4 satır ve 2 sütun olur.", "Her hücre bir dondurmadır: 4 · 2 = 8 olası durum. (6: aroma ve külah sayıları toplanmış; 4: yalnız aromalar sayılmış; 16: 4 ile 4 çarpılmış)"], "t": "", "d": "Her hücre bir olası durumdur: aroma sayısı ile külah sayısı toplanmaz; tablo kurulur ve hücreler sayılır.", "ses": "b02"}, {"no": 3, "on": "<p>Beden eğitimi dersinde hangi etkinliğin yapılacağı, aşağıdaki eş dilimli çark çevrilerek belirlenecektir. Her rengin hangi etkinliği gösterdiği çarkın yanında verilmiştir.</p>", "g": "<div style=\"display:flex;justify-content:center;align-items:center;gap:8mm\"><svg viewBox=\"0 0 184 188\" width=\"184\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><path d=\"M92 96 L92.00 26.00 A70 70 0 0 1 141.50 46.50 Z\" fill=\"#1c7ed6\" stroke=\"#ffffff\" stroke-width=\"2\"/><path d=\"M92 96 L141.50 46.50 A70 70 0 0 1 162.00 96.00 Z\" fill=\"#1c7ed6\" stroke=\"#ffffff\" stroke-width=\"2\"/><path d=\"M92 96 L162.00 96.00 A70 70 0 0 1 141.50 145.50 Z\" fill=\"#1c7ed6\" stroke=\"#ffffff\" stroke-width=\"2\"/><path d=\"M92 96 L141.50 145.50 A70 70 0 0 1 92.00 166.00 Z\" fill=\"#f76707\" stroke=\"#ffffff\" stroke-width=\"2\"/><path d=\"M92 96 L92.00 166.00 A70 70 0 0 1 42.50 145.50 Z\" fill=\"#f76707\" stroke=\"#ffffff\" stroke-width=\"2\"/><path d=\"M92 96 L42.50 145.50 A70 70 0 0 1 22.00 96.00 Z\" fill=\"#7048e8\" stroke=\"#ffffff\" stroke-width=\"2\"/><path d=\"M92 96 L22.00 96.00 A70 70 0 0 1 42.50 46.50 Z\" fill=\"#7048e8\" stroke=\"#ffffff\" stroke-width=\"2\"/><path d=\"M92 96 L42.50 46.50 A70 70 0 0 1 92.00 26.00 Z\" fill=\"#ffffff\" stroke=\"#ffffff\" stroke-width=\"2\"/><circle cx=\"92.0\" cy=\"96.0\" r=\"70.0\" fill=\"none\" stroke=\"#000000\" stroke-width=\"2.2\"/><circle cx=\"92.0\" cy=\"96.0\" r=\"6.0\" fill=\"#495057\" stroke=\"#000000\" stroke-width=\"1.2\"/><path d=\"M82 6 L102 6 L92 30 Z\" fill=\"#000000\"/></svg><div style=\"font-size:10.8pt;font-weight:600\"><div style=\"display:flex;align-items:center;gap:1.6mm;margin:1mm 0\"><span style=\"display:inline-block;width:5mm;height:5mm;border-radius:1mm;border:.3mm solid #495057;background:#1c7ed6\"></span>Voleybol</div><div style=\"display:flex;align-items:center;gap:1.6mm;margin:1mm 0\"><span style=\"display:inline-block;width:5mm;height:5mm;border-radius:1mm;border:.3mm solid #495057;background:#f76707\"></span>Yakan top</div><div style=\"display:flex;align-items:center;gap:1.6mm;margin:1mm 0\"><span style=\"display:inline-block;width:5mm;height:5mm;border-radius:1mm;border:.3mm solid #495057;background:#7048e8\"></span>Satranç</div><div style=\"display:flex;align-items:center;gap:1.6mm;margin:1mm 0\"><span style=\"display:inline-block;width:5mm;height:5mm;border-radius:1mm;border:.3mm solid #495057;background:#ffffff\"></span>Bilmece</div></div></div>", "son": "", "k": "Buna göre, hangi iki etkinliğin gelmesi eşit olasılıklıdır?", "sec": ["Voleybol ve yakan top", "Satranç ve bilmece", "Voleybol ve bilmece", "Yakan top ve satranç"], "secg": null, "c": "D", "a": ["Her etkinliğin dilimleri sayılır: voleybol 3, yakan top 2, satranç 2, bilmece 1.", "Dilim sayıları eşit olan etkinlikler yakan top ve satrançtır. (Voleybol ve yakan top: en fazla dilimli iki etkinlik seçilmiş; satranç ve bilmece, voleybol ve bilmece: dilimler sayılmamış)"], "t": "", "d": "Eşit olasılıklı olaylar, dilim sayıları aynı olan olaylardır. Etkinliklerin dilimlerini renk açıklamasına bakarak tek tek sayınız.", "ses": "b03"}, {"no": 4, "on": "<p>Bir okul kütüphanesinde ayın okuyucusu, okuma kartı olan öğrenciler 2.2mm;min-width:12mm;padding:1.8mm 2.2mm;background:#1f7a8c;text-align:center;font-size:12.5pt;font-weight:800;color:#fff\">?</div></div><div style=\"display:flex;flex-direction:column;align-items:center;gap:1mm\"><div style=\"border:.45mm solid #1f7a8c;border-radius:2.2mm;min-width:12mm;padding:1.8mm 2.2mm;background:#1f7a8c;text-align:center;font-size:12.5pt;font-weight:800;color:#fff\">?</div></div></div><p style=\"text-align:center;margin:.5mm 0 0;font-size:10pt\">(Zarflar temsilîdir.)</p>", "son": "", "k": "Buna göre, zarflardan birinin çekilmesiyle her öğrencinin seçilme olasılık değeri kaçtır?", "sec": ["<span class=\"frac\"><span>1</span><span>2</span></span>", "<span class=\"frac\"><span>1</span><span>32</span></span>", "<span class=\"frac\"><span>32</span><span>32</span></span>", "<span class=\"frac\"><span>1</span><span>31</span></span>"], "secg": null, "c": "B", "a": ["32 zarf özdeştir ve karıştırılmıştır; hiçbir öğrenci kayırılmaz, çıktılar eşit şanslıdır.", "Eşit şanslı 32 çıktının her birinin olasılık değeri <span class=\"frac\"><span>1</span><span>32</span></span>'dir. (<span class=\"frac\"><span>1</span><span>2</span></span>: “seçilir ya da seçilmez” diye iki sonuç düşünülmüş; <span class=\"frac\"><span>32</span><span>32</span></span>: bütün kartlar düşünülmüş; <span class=\"frac\"><span>1</span><span>31</span></span>: öğrenci kendisi dışındakilerle karşılaştırılmış)"], "t": "", "d": "Kura zarfları özdeş ve karışık olduğunda her öğrenci eşit şanslıdır: 32 çıktının her biri <span class=\"frac\"><span>1</span><span>32</span></span>'dir. “Seçilir ya da seçilmez” iki eşit şanslı sonuç değildir.", "ses": "b04"}, {"no": 5, "on": "<p>Ece ile kardeşi bir kutu oyunu oynamaktadır. Oyunda 1'den 6'ya kadar numaralandırılmış hilesiz bir sayı küpü atılır ve piyon, üst yüze gelen sayı kadar kare ilerletilir. Ece'nin piyonu ve yıldızlı kare aşağıda gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 384 98\" width=\"384\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"16.0\" y=\"30.0\" width=\"40.0\" height=\"40.0\" rx=\"6\" fill=\"#e7f5ff\" stroke=\"#333333\" stroke-width=\"1.4\"/><rect x=\"60.0\" y=\"30.0\" width=\"40.0\" height=\"40.0\" rx=\"6\" fill=\"#e7f5ff\" stroke=\"#333333\" stroke-width=\"1.4\"/><rect x=\"104.0\" y=\"30.0\" width=\"40.0\" height=\"40.0\" rx=\"6\" fill=\"#e7f5ff\" stroke=\"#333333\" stroke-width=\"1.4\"/><rect x=\"148.0\" y=\"30.0\" width=\"40.0\" height=\"40.0\" rx=\"6\" fill=\"#e7f5ff\" stroke=\"#333333\" stroke-width=\"1.4\"/><rect x=\"192.0\" y=\"30.0\" width=\"40.0\" height=\"40.0\" rx=\"6\" fill=\"#fff4e6\" stroke=\"#333333\" stroke-width=\"1.4\"/><rect x=\"236.0\" y=\"30.0\" width=\"40.0\" height=\"40.0\" rx=\"6\" fill=\"#e7f5ff\" stroke=\"#333333\" stroke-width=\"1.4\"/><rect x=\"280.0\" y=\"30.0\" width=\"40.0\" height=\"40.0\" rx=\"6\" fill=\"#e7f5ff\" stroke=\"#333333\" stroke-width=\"1.4\"/><rect x=\"324.0\" y=\"30.0\" width=\"40.0\" height=\"40.0\" rx=\"6\" fill=\"#e7f5ff\" stroke=\"#333333\" stroke-width=\"1.4\"/><circle cx=\"36.0\" cy=\"50.0\" r=\"11.0\" fill=\"#c2255c\" stroke=\"#000000\" stroke-width=\"1.4\"/><polygon points=\"212.0,37.0 215.2,45.6 224.4,46.0 217.2,51.7 219.6,60.5 212.0,55.5 204.4,60.5 206.8,51.7 199.6,46.0 208.8,45.6\" fill=\"#f2c94c\" stroke=\"#a07a1c\" stroke-width=\"1.2\"/><text x=\"36.0\" y=\"88.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"11.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">Piyon</text><text x=\"212.0\" y=\"88.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"11.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">Yıldız</text></svg>", "son": "<p>Ece'nin piyonunun bu atışta yıldızlı kareye ya da yıldızlı karenin ilerisine gelmesi gerekmektedir.</p>", "k": "Buna göre, bu olaya ait olası durumlar aşağıdakilerden hangisidir?", "sec": ["4, 5, 6", "5, 6", "1, 2, 3", "3, 4, 5, 6"], "secg": null, "c": "A", "a": ["Piyon ile yıldızlı kare arasında 4 kare vardır; piyon 4 kare ilerlerse yıldıza gelir.", "4, 5 ve 6 sayıları piyonu yıldıza ya da ilerisine götürür: olaya ait olası durumlar 4, 5, 6. (5, 6: yıldıza tam gelmek “ileri” sayılmamış; 1, 2, 3: yıldıza ulaşamayan durumlar yazılmış; 3, 4, 5, 6: piyonun bulunduğu kare de sayılmış)"], "t": "", "d": "Yıldıza tam gelmek de koşulu sağlar. Piyon ile yıldız arasındaki kareleri sayarken piyonun bulunduğu kareyi saymayınız.", "ses": "b05"}, {"no": 6, "on": "<p>Bir okulun futbol takımı için beyaz, lacivert ve kırmızı renkli formalar ile beyaz ve lacivert renkli şortlar alınmıştır. Takım her maçta bir forma ve bir şort giymektedir; forma ile şort aynı renk olmamaktadır.</p>", "g": "<div style=\"display:flex;justify-content:center\"><table style=\"border-collapse:collapse;font-size:10.8pt\"><thead><tr><th style=\"border:.3mm solid #1f7a8c;background:#e6f4f7;padding:1.1mm 2.4mm;font-weight:700\">Forma</th><th style=\"border:.3mm solid #1f7a8c;background:#e6f4f7;padding:1.1mm 2.4mm;font-weight:700\">Şort</th></tr></thead><tbody><tr><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;font-weight:700;background:#f8f9fa;\">beyaz</td><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;\">beyaz</td></tr><tr><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;font-weight:700;background:#f8f9fa;\">lacivert</td><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;\">lacivert</td></tr><tr><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;font-weight:700;background:#f8f9fa;\">kırmızı</td><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;\"></td></tr></tbody></table></div>", "son": "", "k": "Buna göre, takımın bir maçta giyebileceği forma ve şort için kaç olası durum vardır?", "sec": ["6", "5", "4", "3"], "secg": null, "c": "C", "a": ["Forma ve şort seçimleri tabloyla yazılır: 3 · 2 = 6 hücre.", "Aynı renkli beyaz–beyaz ve lacivert–lacivert hücreleri çıkarılır: 6 − 2 = 4 olası durum. (6: aynı renk koşulu unutulmuş; 5: yalnız bir aynı renkli eşleşme çıkarılmış; 3: yalnız kırmızı forma ile kurulan durumlar ve bir eşleşme sayılmış)"], "t": "", "d": "Koşul tablodaki bazı hücreleri siler: önce bütün forma–şort eşleşmelerini yazınız, sonra aynı renkli olanları çıkarınız.", "ses": "b06"}, {"no": 7, "on": "<p>Bir müzede düzenlenen atölyelerin ücretleri aşağıdaki tabloda verilmiştir. Kaan bu atölyelerden farklı iki tanesine katılacaktır.</p>", "g": "<div style=\"display:flex;justify-content:center\"><table style=\"border-collapse:collapse;font-size:10.8pt\"><thead><tr><th style=\"border:.3mm solid #1f7a8c;background:#e6f4f7;padding:1.1mm 2.4mm;font-weight:700\">Atölye</th><th style=\"border:.3mm solid #1f7a8c;background:#e6f4f7;padding:1.1mm 2.4mm;font-weight:700\">Ücret</th></tr></thead><tbody><tr><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;font-weight:700;background:#f8f9fa;\">Seramik</td><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;\">25 TL</td></tr><tr><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;font-weight:700;background:#f8f9fa;\">Ebru</td><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;\">35 TL</td></tr><tr><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;font-weight:700;background:#f8f9fa;\">Ahşap boyama</td><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;\">40 TL</td></tr><tr><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;font-weight:700;background:#f8f9fa;\">Robotik</td><td style=\"border:.3mm solid #1f7a8c;padding:1.1mm 2.4mm;text-align:center;white-space:nowrap;\">50 TL</td></tr><tr><td style=\"border:. ez.", "ses": "b12"}, {"no": 13, "on": "<p>Elif okul kütüphanesinden iki kitap ödünç alacaktır. Seçebileceği kitaplar üç roman ile iki hikâye kitabıdır. Elif aldığı iki kitaptan en az birinin roman olmasını istemektedir.</p>", "g": "<div style=\"display:grid;grid-template-columns:repeat(5,max-content);gap:2.4mm 3mm;justify-content:center;margin:1mm 0\"><div style=\"display:flex;flex-direction:column;align-items:center;gap:1mm\"><div style=\"border:.45mm solid #1f7a8c;border-radius:2.2mm;background:#eef8fa;min-width:18mm;padding:1.8mm 2.2mm;text-align:center;font-size:11pt;font-weight:700;white-space:nowrap\">Roman 1</div></div><div style=\"display:flex;flex-direction:column;align-items:center;gap:1mm\"><div style=\"border:.45mm solid #1f7a8c;border-radius:2.2mm;background:#eef8fa;min-width:18mm;padding:1.8mm 2.2mm;text-align:center;font-size:11pt;font-weight:700;white-space:nowrap\">Roman 2</div></div><div style=\"display:flex;flex-direction:column;align-items:center;gap:1mm\"><div style=\"border:.45mm solid #1f7a8c;border-radius:2.2mm;background:#eef8fa;min-width:18mm;padding:1.8mm 2.2mm;text-align:center;font-size:11pt;font-weight:700;white-space:nowrap\">Roman 3</div></div><div style=\"display:flex;flex-direction:column;align-items:center;gap:1mm\"><div style=\"border:.45mm solid #1f7a8c;border-radius:2.2mm;background:#eef8fa;min-width:18mm;padding:1.8mm 2.2mm;text-align:center;font-size:11pt;font-weight:700;white-space:nowrap\">Hikâye 1</div></div><div style=\"display:flex;flex-direction:column;align-items:center;gap:1mm\"><div style=\"border:.45mm solid #1f7a8c;border-radius:2.2mm;background:#eef8fa;min-width:18mm;padding:1.8mm 2.2mm;text-align:center;font-size:11pt;font-weight:700;white-space:nowrap\">Hikâye 2</div></div></div>", "son": "", "k": "Buna göre, Elif'in ödünç alacağı iki kitap için kaç olası durum vardır?", "sec": ["10", "6", "3", "9"], "secg": null, "c": "D", "a": ["İki kitap sistemli yazılır: roman–roman 3 seçim (R1–R2, R1–R3, R2–R3), roman–hikâye 3 · 2 = 6 seçim, hikâye–hikâye 1 seçim.", "En az biri roman olmalı: hikâye–hikâye çıkarılır, 3 + 6 = 9 olası durum. (10: “en az biri roman” koşulu unutulmuş; 6: iki roman birlikte seçilmemiş; 3: yalnız iki roman seçilmiş)"], "t": "", "d": "“En az biri roman” koşulu, yalnız iki hikâye kitabının birlikte seçildiği durumu dışarıda bırakır. Seçimleri sistemli yazınız.", "ses": "b13"}, {"no": 14, "on": "<p>Bir el işi kutusunda kırmızı, mavi ve yeşil olmak üzere toplam 33 kurdele vardır. Kutuda 7 kırmızı kurdele bulunmaktadır.</p>", "g": "", "son": "<p>Kutudan rastgele alınan bir kurdelenin mavi olması, kırmızı olmasından daha fazla olasılıklı; yeşil olmasından daha az olasılıklıdır.</p>", "k": "Buna göre, kutuda <u style=\"white-space:nowrap\">en fazla</u> kaç mavi kurdele vardır?", "sec": ["13", "12", "8", "26"], "secg": null, "c": "B", "a": ["Mavi ve yeşil kurdeleler toplam 33 − 7 = 26'dır.", "Mavi 7'den fazla, yeşilden az olmalıdır: mavi 12 ise yeşil 14 olur; mavi 13 olursa yeşil de 13 olur, eşit olasılıklı olur.", "Mavi en fazla 12'dir. (13: mavi ile yeşilin eşit olabileceği sanılmış; 8: mavi en az kaç olur diye bakılmış; 26: mavi ve yeşil birlikte alınmış)"], "t": "", "d": "Mavi ve yeşil kurdelelerin toplamı sabittir. Mavi yeşile eşit olursa iki olay eşit olasılıklı olur; mavi yeşilden az olmalıdır.", "ses": "b14"}, {"no": 15, "on": "<p>Bir okul servisindeki öğrencilere 1'den başlayarak sırayla numara verilmiştir. Servisteki öğrencilerden biri, her gün kura ile servis sorumlusu seçilmektedir.</p>", "g": "<div style=\"display:grid;grid-template-columns:repeat(4,max-content);gap:2.4mm 3mm;justify-content:center;margin:1mm 0\"><div style=\"display:flex;flex-direction:column;align-items:center;gap:1mm\"><div style=\"border:.45mm solid #1f7a8c;border-radius:2.2mm;background:#eef8fa;min-width:12mm;padding:1.8mm 2.2mm;text-align:center;font-size:12.5pt;font-weight:700;white-space:nowrap\">1</div></div><div style=\"display:flex;flex-direction:column;align-items:center;gap:1mm\"><div style=\"border:.45mm solid #1f7a8c;border-radius:2.2mm;background:#eef8fa;min-width:12mm;padding:1.8mm 2.2mm;text-align:center;font-size:12.5pt;font-weight:700;white-space:nowrap\">2</div></div><div style=\"display:flex;flex-direction:column;align-items:center;gap:1mm\"><div style=\"border:.45mm solid #1f7a8c;border-radius:2.2mm;background:#eef8fa;min-width:12mm;padding:1.8mm 2.2mm;text-align:center;font-size:12.5pt;font-weight:700;white-space:nowrap\">3</div></div><div style=\"display:flex;flex-direction:column;align-items:center;gap:1mm\"><div style=\"border:.45mm solid #1f7a8c;border-radius:2.2mm;background:#eef8fa;min-width:12mm;padding:1.8mm 2.2mm;text-align:center;font-size:12.5pt;font-weight:700;white-space:nowrap\">…</div></div></div>", "son": "<p>Bir gün servise 3 yeni öğrenci binmiş ve onlara da sıradaki numaralar verilmiştir. Bu yeni öğrencilerle birlikte yapılan kurada her öğrencinin seçilme olasılık değeri <span class=\"frac\"><span>1</span><span>40</span></span> olmuştur.</p>", "k": "Buna göre, yeni öğrenciler binmeden önce serviste numarası tek sayı olan kaç öğrenci vardı?", "sec": ["20", "18", "19", "37"], "secg": null, "c": "C", "a": ["Yeni öğrencilerle birlikte 40 öğrenci vardır; yeni öğrenciler binmeden önce 40 − 3 = 37 öğrenci vardı.", "1'den 37'ye kadar tek sayılar: 1, 3, …, 37; (37 + 1) : 2 = 19 öğrenci. (20: 1'den 40'a kadar tek sayılar sayılmış; 18: 37'nin yarısı aşağı yuvarlanmış; 37: ilk durumdaki öğrenci sayısı bulunmuş)"], "t": "", "d": "Yeni öğrencilerle birlikte kaç öğrenci olduğunu bulduktan sonra sorunun hangi durumu sorduğuna bakınız: yeni öğrenciler binmeden önceki durum.", "ses": "b15"}, {"no": 16, "on": "<p>Bir mutfak terazisi en çok 10 kg tartabilmektedir. Kütleleri aşağıda verilen altı paketten ikisi birlikte bu teraziyle tartılacaktır.</p>", "g": "<svg viewBox=\"0 0 480.0 82\" width=\"480\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"14.0\" y=\"50.0\" width=\"36.4\" height=\"20.0\" rx=\"4\" fill=\"#f k": "Buna göre, terazinin gösterebileceği değer için kaç farklı olası durum vardır?", "sec": ["6", "9", "15", "11"], "secg": null, "c": "A", "a": ["Toplamı 10 kg'ı aşmayan ikililer: 2 + 3, 2 + 4, 2 + 6, 2 + 7, 2 + 8, 3 + 4, 3 + 6, 3 + 7, 4 + 6 (9 ikili).", "Toplamlar 5, 6, 8, 9, 10, 7, 9, 10, 10'dur; farklı değerler 5, 6, 7, 8, 9, 10: 6 olası durum. (9: ikili sayısı alınmış; 15: terazinin sınırı unutulup bütün ikililer sayılmış; 11: sınırı aşan toplamlarla birlikte farklı değerler sayılmış)"], "t": "", "d": "Terazinin sınırını aşan ikililer olası durum değildir. Kalan ikililerin toplamlarından aynı olanları bir kez sayınız.", "ses": "b16"}, {"no": 17, "on": "<p>Bir oyuncak kutusunda renkleri dışında özdeş 9 sarı, 7 mor ve 4 turuncu top vardır. Kutudan eşit sayıda sarı ve mor top alınıp kutunun yanına konacaktır.</p>", "g": "<svg viewBox=\"0 0 371 165\" width=\"371\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><path d=\"M44 30 Q20 83.55000000000001 30 139 Q133.5 161 237 139 Q247 83.55000000000001 223 30 Z\" fill=\"#f4ecdf\" stroke=\"#8d6e46\" stroke-width=\"2\"/><path d=\"M40 30 Q133.5 12 227 30\" fill=\"#e9dcc6\" stroke=\"#8d6e46\" stroke-width=\"2\"/><rect x=\"117.5\" y=\"14\" width=\"32\" height=\"8\" rx=\"3\" fill=\"#b08968\"/><circle cx=\"58.5\" cy=\"62.0\" r=\"10.0\" fill=\"#f2c94c\" stroke=\"#495057\" stroke-width=\"1.4\"/><circle cx=\"55.0\" cy=\"58.2\" r=\"2.8\" fill=\"#ffffff\" opacity=\".35\"/><circle cx=\"83.5\" cy=\"62.0\" r=\"10.0\" fill=\"#f2c94c\" stroke=\"#495057\" stroke-width=\"1.4\"/><circle cx=\"80.0\" cy=\"58.2\" r=\"2.8\" fill=\"#ffffff\" opacity=\".35\"/><circle cx=\"108.5\" cy=\"62.0\" r=\"10.0\" fill=\"#f2c94c\" stroke=\"#495057\" stroke-width=\"1.4\"/><circle cx=\"105.0\" cy=\"58.2\" r=\"2.8\" fill=\"#ffffff\" opacity=\".35\"/><circle cx=\"133.5\" cy=\"62.0\" r=\"10.0\" fill=\"#f2c94c\" stroke=\"#495057\" stroke-width=\"1.4\"/><circle cx=\"130.0\" cy=\"58.2\" r=\"2.8\" fill=\"#ffffff\" opacity=\".35\"/><circle cx=\"158.5\" cy=\"62.0\    Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
