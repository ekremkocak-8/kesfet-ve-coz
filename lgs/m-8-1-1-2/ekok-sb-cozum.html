<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çözümler · Keşfet ve Çöz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--muted:#5b6478;--line:#dfe5ef;--bg:#f5f7fb;--card:#fff;--ss:#6741d9;--kk:#0b7285;--b:#d0700f;--ok:#2b8a3e;--warn:#c92a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif}
header{background:linear-gradient(135deg,#1c5fbf,#2f8fe0);color:#fff;padding:18px 16px 22px}

main{max-width:780px;margin:14px auto 40px;padding:0 16px}
nav.sec{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}nav.sec button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}

ol.sec{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
ol.sec li{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}ol.sec li.dogru{border-color:var(--ok);background:#ebfbee;font-weight:800}
.adim{border-left:4px solid var(--c);padding:6px 12px;margin:8px 0;background:#fff;border-radius:0 10px 10px 0;animation:gel .35s ease-out}
.adim b{color:var(--c)}@keyframes gel{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dug{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
button.btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.dikkat{background:#fff4e6;border:2px solid #f59f00;border-radius:12px;padding:10px 14px;margin:12px 0 4px}.dikkat b{color:#d9480f}
.tuzak{font-size:15px;color:var(--muted);margin-top:8px}
.cevap{font-weight:900;color:var(--ok);margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid var(--line);padding:8px 10px;text-align:left}th{background:#e3fafc;color:#0b7285;font-size:13px;letter-spacing:.06em}
.ses{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border-radius:12px;background:#eef2ff}

.ses span{font-size:14px;color:var(--muted)}
.gizli{display:none}
.tum{margin:4px 0 14px;font-size:14px}.tum a{color:#1c5fbf;font-weight:800}
@media (prefers-reduced-motion:reduce){.adim{animation:none}}
/* Canlandır (05.10.2026) */
.sek{display:flex;gap:6px;margin:12px 0 0;border-bottom:2px solid var(--line)}
.sek button{border:0;background:none;font:inherit;font-weight:900;font-size:15px;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);min-height:44px;position:relative;top:2px;border-bottom:3px solid transparent}
.sek button[aria-selected=true]{color:var(--c);border-bottom-color:var(--c);background:#fff8f0}
.sek .yeni{display:inline-block;font-size:10px;background:#2b8a3e;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.06em}
.cn{padding-top:10px}
.cn-yon{background:#eef6ff;border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:10px}
.cn-sahne{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;min-height:120px;overflow-x:auto}

.cn-adimci input,.cn-test input{width:84px;height:44px;border:2px solid var(--line);border-radius:12px;font:inherit;font-weight:900;text-align:center;font-size:18px}
.cn-test label{font-weight:800;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.cn-btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
.cn-btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.cn-btn[aria-pressed=true]{background:var(--ac,var(--c));color:#fff;border-color:var(--ac,var(--c))}
.cn-btn:disabled{opacity:.5}
.cn-hazir{display:flex;flex-wrap:wrap;gap:6px}

.cn-dur .iyi{color:var(--ok);font-weight:900}.cn-dur .kotu{color:var(--warn);font-weight:900}
.cn-df{margin-top:10px;overflow-x:auto}@media(max-width:480px){.cn-adimci>span{flex-basis:100%}.cn-h{font-size:12px;padding:5px 0}.cn-izg{gap:3px}.cn-sahne{padding:6px}}@media(max-width:480px){.cn-df table{font-size:13px}.cn-df td,.cn-df th{padding:4px 5px}}.cn-df summary{font-weight:900;cursor:pointer;padding:6px 0}.cn-say{color:var(--muted);font-weight:700}
.cn-df table{font-size:15px}.cn-df td{padding:5px 8px}.cn-df tr.cn-iyi td{background:#ebfbee}.cn-df tr.cn-kotu td{background:#fff5f5}.cn-df tr.cn-son td{outline:2px solid var(--c);outline-offset:-2px}
.cn-p{animation:cnGel .35s ease-out both}@keyframes cnGel{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cn-o{fill:#ffa94d;stroke:#d9480f;stroke-width:1}.cn-o2{fill:#e8590c}.cn-k{fill:#ffc9c9;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:3 2}
.cn-cerceve{stroke:#2b8a3e;stroke-width:3}.cn-et{font-size:13px;font-weight:800;fill:#5b6478}.cn-et.b,.cn-et2b{font-weight:900;fill:#1d2433}.cn-et2{font-size:11px;fill:#5b6478;font-weight:700}.cn-et2b{font-size:13px;fill:#fff}
.cn-ku{fill:#fff4e6;stroke:#ffa94d;stroke-width:1.5}.cn-kk{fill:#fff5f5;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:4 3}
.cn-tahta0{fill:#f1f3f5;stroke:#ced4da}.cn-tahta{fill:#c08552;stroke:#8d5a2b}
.cn-ek{stroke:#868e96;stroke-width:2}.cn-sinir{stroke:#c92a2a;stroke-width:3;stroke-dasharray:5 4}.cn-yay{fill:none;stroke:#f76707;stroke-width:2}
.cn-v1{stroke:#2b8a3e;stroke-width:3}.cn-v2{stroke:#c92a2a;stroke-width:3}.cn-kis{font-size:20px}.cn-bus{font-size:16px}.cn-bek{stroke:#c92a2a;stroke-width:5;stroke-linecap:round;opacity:.6}
.cn-kum{fill:#ffe8cc;stroke:#e8590c;stroke-width:3}.cn-kum2{fill:#495057}.cn-para{fill:#ffd43b;opacity:.85}.cn-buyuk{font-size:26px;font-weight:900;fill:#1d2433}
.cn-zem{fill:#adb5bd}.cn-kat{fill:#f1f3f5;stroke:#ced4da}.cn-katon{fill:#d3f9d8;stroke:#2b8a3e}.cn-katoff{fill:#ffe3e3;stroke:#e03131}
.cn-izg{display:grid;gap:4px}.cn-h,.cn-gb{border-radius:8px;text-align:center;font-weight:800;font-size:14px;padding:6px 0}.cn-h{background:#f1f3f5;transition:background .25s,transform .25s}
.cn-gb{background:none;color:var(--muted);font-size:12px}.cn-h.on{background:#ffa94d;color:#1d2433}.cn-h.yeni{transform:scale(1.18);box-shadow:0 0 0 3px #e8590c}
.cn-kartlar{display:flex;flex-wrap:wrap;gap:6px;padding:4px}.cn-kart{min-width:44px;padding:8px 10px;text-align:center;border-radius:10px;background:#fff4e6;border:2px solid #ffa94d;font-weight:900;animation:cnGel .3s}
.cn-kart.kare{background:#e7f5ff;border-color:#1c7ed6}.cn-bosk{color:var(--muted)}
.cn-cift{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 4px;font-weight:800}.cn-cift i{font-weight:600;color:#1c7ed6}
.cn-katlar{padding:4px}.cn-katsat{display:inline-flex;flex-wrap:wrap;gap:6px}.cn-kat2{background:#e6fcf5;border:1.5px solid #12b886;border-radius:8px;padding:3px 8px;font-weight:800;animation:cnGel .3s}.cn-sonsuz{font-weight:800;color:#0b7285}
.cn-onr{background:#f8f0fc;border:2px solid #ae3ec9;border-radius:12px;padding:10px 14px}.cn-kanit{padding:10px 4px 2px}
.cn-kay{display:inline-flex;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap}.cn-kay{max-width:100%}.cn-kay input{width:min(220px,70vw);accent-color:#d0700f}.cn-satir>*{min-width:0;max-width:100%}
@media (prefers-reduced-motion:reduce){.cn-p,.cn-kart,.cn-kat2{animation:none}.cn-h{transition:none}}
/* 05.10.2026 · KOŞUL ve LABİRENT motorları (SB 6.1.1) */
@media(max-width:560px){.soru [style*="grid-template-columns:repeat"]{grid-template-columns:1fr!important}}   /* çok sütunlu konuşma balonları telefonda alt alta */
.cn-kl{list-style:none;padding:0;margin:0;display:grid;gap:4px}.cn-not{color:var(--muted);font-size:14px}.cn-sonuc{margin-top:6px;font-weight:800}
.cn-secg{gap:6px}.cn-secad{font-weight:800;flex-basis:100%}.cn-secg .cn-btn{padding:8px 12px}
.cn-mv{fill:#74c0fc;stroke:#1c7ed6;stroke-width:1}.cn-tl{fill:#69db7c;stroke:#2b8a3e;stroke-width:1.5}
.cn-lab{display:grid;gap:4px;align-items:center;max-width:460px;margin:0 auto}
.cn-lc{min-height:44px;border-radius:8px;border:1.5px solid #ced4da;background:#fff;font:inherit;font-weight:900;font-size:16px;cursor:pointer;padding:0;color:var(--ink)}
.cn-lc.yol{background:#d3f9d8;border-color:#2b8a3e}.cn-lc.simdi{background:#2b8a3e;color:#fff;box-shadow:0 0 0 3px #b2f2bb}.cn-lc.kapali{background:#ffe3e3;border-color:#e03131;color:#c92a2a;text-decoration:line-through}
.cn-lok{color:#2b8a3e;font-weight:900;text-align:center}.cn-lcik{min-height:44px;border:0;background:none;font:inherit;font-weight:900;color:#d9480f;cursor:pointer;padding:0;white-space:nowrap;font-size:14px}.cn-lcik:disabled{cursor:default}

</style></head><body>
<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }
      if (!art && !o.sandalye) sv += `<rect x="10" y="10" width="${gen * hc}" height="${sira * hc}" fill="none" class="cn-cerceve"/>
        <text x="${10 + gen * hc / 2}" y="${H + 4}" class="cn-et" text-anchor="middle">${gen} ${o.birim || ""}</text>
        <text x="${W + 4}" y="${10 + sira * hc / 2}" class="cn-et" dominant-baseline="middle">${sira} ${o.birim || ""}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W + 70} ${H + 22}" role="img" aria-label="${N} ${o.ad || "kare"}, her sırada ${gen}">${sv}</svg>`;
      const r = o.kural ? o.kural(gen, sira, art, N) : null;
      let m;
      if (art) m = `<span class="kotu">✘</span> ${N} ${o.ad || "kare"} her sırada ${gen} olacak biçimde dizilince ${sira} tam sıra oluşur, <b>${art} ${o.ad || "kare"} artar</b>. Dikdörtgen olmaz: ${N} : ${gen} işleminde kalan ${art}.`;
      else m = `<span class="iyi">✔</span> <b>${N} = ${gen} ${x} ${sira}</b> · ${sira} sıra, her sırada ${gen} ${o.ad || "kare"}; hiç artmadı.` + (gen === sira ? ` <b>Kare oldu!</b> İki kenar aynı: ${gen}.` : "");
      if (!art && o.cevre) m += ` Çevre = 2 ${x} (${gen} + ${sira}) = <b>${2 * (gen + sira)} m</b>.`;
      if (r && r.msg) m += `<br>${r.msg}`;
      s.dur.innerHTML = m;
      const sutunlar = o.satir ? o.satir(gen, sira, art, N, r) : [gen, art ? `${sira} (+ ${art} artan)` : sira, art, art ? "olmaz" : (gen === sira ? "kare" : "dikdörtgen")];
      s.yaz(N + ":" + gen, sutunlar, !art && (!r || r.ok !== false));
    }
    ciz(g.get());
  }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {
    const N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });
    const g = adimci(o.etiket, 1, o.max || N, o.bas || 2, v => { sonK = v; });

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */

    if (alt.children.length) s.den.appendChild(alt);

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });

    const hc = [];

      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);

    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];

    function boya() {

      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };

    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };

})();

    etiket: m => S2(m), kisaEt: m => S2(m), basMetin: "Saat 07.30: iki hattın trenleri perona birlikte geldi.",
    ek: t => t < 490 ? "Ayşe henüz istasyonda değil (08.10'da gelecek)." : t === 490 ? "Ayşe şimdi perona geldi." : `Ayşe ${t - 490} dakikadır bekliyor.`,
    sutun: ["Aralıklar", "Birlikte geliş", "Ayşe'nin beklediği"],
    satir: (t, a, b) => [`${a} ve ${b} dk`, S2(t), t >= 490 ? `<b>${t - 490} dk</b>` : "Ayşe gelmedi"], iyi: (t, a, b) => a === 6 && b === 8 && t >= 490,
    yon: "Zamanı “Sonraki olay” ile ilerletin. Turuncu noktalar A hattının, mavi noktalar B hattının trenleridir; yeşil çizgi iki trenin perona birlikte geldiği anı (anonsu) gösterir. Ayşe 08.10'da perona geliyor. Ondan sonraki ilk yeşil çizgiye kadar kaç dakika bekliyor?",
    bitis: "Ayşe'nin anonsu duyduğu anı bulduğunuzda." }),

  /* 2 · trafik ışıkları 90 sn ve 120 sn, 08.00–08.30 */
  2: el => CN.IKIRITIM(el, { a: 90, b: 120, son: 1800, birim: "sn", adlar: ["1. ışık", "2. ışık"], min: 10, max: 200,
    etiket: v => `08.${String(Math.floor(v / 60)).padStart(2, "0")}${v % 60 ? `'${v % 60}"` : ""}`, kisaEt: v => `08.${String(v / 60).padStart(2, "0")}`,
    basMetin: "Saat 08.00: iki ışık aynı anda yeşile döndü (bu sayılmaz).",
    bitti: (a, b, ort) => `08.30'a kadar iki ışık <b>${ort} kez</b> aynı anda yeşile döndü.`, bittiSatir: (a, b, ort) => [`${a} ve ${b} sn`, "08.30'a kadar", `toplam ${ort}`],
    yon: "Zamanı ilerletin. Turuncu noktalar 1. ışığın, mavi noktalar 2. ışığın yeşile döndüğü anlardır; yeşil çizgi ikisinin aynı anda döndüğü anı gösterir. 08.30 da sayılıyor mu? 08.00'den sonra kaç kez aynı anda yeşile dönüyorlar?",
    bitis: "Zaman 08.30'a (1800. saniye) ulaştığında." }),

  /* 3 · kitap: Can 12, Ece 18 sayfa/gün; Can 5 gün önce başladı */
  3: el => CN.KOSUL(el, { dugme: false, sutun: ["Sayfa", "Can (gün)", "Ece (gün)", "Fark"],
    girdi: [{ ad: "Kitabın sayfa sayısı:", min: 36, max: 400, bas: 100 }],
    ciz: ([p]) => kutuk([kart(sayi(p / 12), `Can'ın okuduğu gün${p % 12 ? " · tam değil" : ""}`, p % 12 ? "no" : "ok"), kart(sayi(p / 18), `Ece'nin okuduğu gün${p % 18 ? " · tam değil" : ""}`, p % 18 ? "no" : "ok"),
      kart(sayi(p / 12 - p / 18), "gün farkı")]),
    kosullar: [{ ad: "Can kitabı tam günlerde bitiriyor (12'nin katı)", f: ([p]) => p % 12 === 0 }, { ad: "Ece kitabı tam günlerde bitiriyor (18'in katı)", f: ([p]) => p % 18 === 0 },
      { ad: "Can 5 gün daha uzun okuyor", f: ([p]) => p / 12 - p / 18 === 5 }],
    sonuc: ([p], hepsi) => hepsi ? `Kitap <b>${p} sayfa</b>: Can ${p / 12} günde, Ece ${p / 18} günde okur.` : "",
    satir: ([p], hepsi) => [p, p % 12 ? "—" : p / 12, p % 18 ? "—" : p / 18, hepsi ? "<b>5 gün ✔</b>" : p % 36 ? "olmaz" : `${p / 12 - p / 18} gün`],
    yon: "Kitabın sayfa sayısını değiştirin; Can'ın ve Ece'nin kitabı kaç günde bitirdiği anında hesaplanır. Önce iki çocuğun da kitabı tam günlerde bitirdiği sayıları bulun. Bu sayılarda gün farkı nasıl değişiyor? Fark 5 gün olunca ne oluyor?",
    bitis: "Üç koşulu birlikte sağlayan sayfa sayısını bulduğunuzda." }),

  /* 4 · uydular 90 ve 120 dk, 24 saat */
  4: el => CN.IKIRITIM(el, { a: 90, b: 120, son: 1440, birim: "dk", adlar: ["A uydusu", "B uydusu"], min: 10, max: 240,
    etiket: m => m >= 1440 ? "ertesi gün 00.00" : S2(m), kisaEt: m => S2(m), basMetin: "Saat 00.00: iki uydu istasyonun üstünden birlikte geçti (bu da sayılır).",
    bitti: (a, b, ort, L) => `Gün içinde 00.00 ile birlikte ${1 + L.filter(v => v < 1440).length} kez birlikte geçtiler${L.includes(1440) ? " (ertesi günün 00.00'ı o güne ait değildir)" : ""}.`,
    bittiSatir: (a, b, ort, L) => [`${a} ve ${b} dk`, "o gün içinde", `<b>${1 + L.filter(v => v < 1440).length}</b>`],
    yon: "Zamanı ilerletin. Turuncu noktalar A uydusunun, mavi noktalar B uydusunun geçişleridir; yeşil çizgiler birlikte geçişleri gösterir. 00.00 da sayılıyor. Ertesi günün 00.00'ı o güne ait mi?",
    bitis: "Gün sonuna ulaştığınızda." }),

  /* 5 · dişli çarklar 18 ve 24 diş */
  5: el => CN.IKIRITIM(el, { a: 18, b: 24, son: 144, birim: "diş", adlar: ["A çarkı", "B çarkı"], max: 40,
    etiket: v => `${v} diş geçti`, basMetin: "Başlangıç: kırmızı dişler birbirine değiyor.", sutun: ["Diş sayıları", "Geçen diş", "A turu", "B turu", "Toplam tur"],
    ek: (t, a, b) => `A çarkı ${Math.floor(t / a)} tam tur, B çarkı ${Math.floor(t / b)} tam tur döndü.`,
    satir: (t, a, b) => [`${a} ve ${b}`, t, t / a, t / b, `<b>${t / a + t / b}</b>`],
    yon: "Çarkları dişler geçtikçe ilerletin. Turuncu nokta A çarkının, mavi nokta B çarkının kırmızı dişinin başlangıç yerine geldiği anı gösterir. Kırmızı dişler ilk kez ne zaman yeniden değiyor? O ana kadar iki çark toplam kaç tur dönüyor?",
    bitis: "Kırmızı dişlerin ilk kez yeniden değdiği anı bulduğunuzda." }),

  /* 6 · duvar süsü: yıldız 24 cm, çiçek 36 cm, duvar 300 cm */
  6: el => CN.IKIRITIM(el, { a: 24, b: 36, son: 300, birim: "cm", adlar: ["Yıldız", "Çiçek"], max: 80,
    etiket: v => v ? `${v}. cm` : "duvarın başı", basMetin: "Duvarın başında yıldız ile çiçek aynı hizada (bu da sayılır).",
    bitti: (a, b, ort) => `Duvar boyunca baştaki dâhil <b>${ort + 1} yerde</b> yıldız ile çiçek aynı hizada.`, bittiSatir: (a, b, ort) => [`${a} ve ${b} cm`, "duvarın sonu", `baş dâhil ${ort + 1}`],
    yon: "Duvar boyunca ilerleyin. Turuncu noktalar yıldızların, mavi noktalar çiçeklerin yeridir; yeşil çizgi ikisinin aynı hizaya geldiği yeri gösterir. Duvar 3 m = 300 cm'dir. Baştaki hiza da sayılınca kaç yer oluyor?",
    bitis: "Duvarın sonuna (300 cm) ulaştığınızda." }),

  /* 7 · anket %40 ve %75, servisli kız = servisli erkek, 420–450 öğrenci */
  7: el => CN.KOSUL(el, { dugme: false, sutun: ["Kız", "Erkek", "Servisli kız", "Servisli erkek", "Sonuç"],
    girdi: [{ ad: "Kız öğrenci sayısı:", min: 100, max: 400, bas: 200 }, { ad: "Erkek öğrenci sayısı:", min: 100, max: 300, bas: 200 }],
    ciz: ([k, e]) => kutuk([kart(sayi(k * 0.4), "servisli kız (%40)", Number.isInteger(k * 0.4) ? "" : "no"), kart(sayi(e * 0.75), "servisli erkek (%75)", Number.isInteger(e * 0.75) ? "" : "no"), kart(k + e, "okuldaki öğrenci")]),
    kosullar: [{ ad: "Servisli kız sayısı tam sayı", f: ([k]) => (k * 2) % 5 === 0 }, { ad: "Servisli erkek sayısı tam sayı", f: ([, e]) => (e * 3) % 4 === 0 },
      { ad: "Servisli kız = servisli erkek", f: ([k, e]) => k * 2 * 4 === e * 3 * 5 }, { ad: "Okulda 420'den fazla, 450'den az öğrenci", f: ([k, e]) => k + e > 420 && k + e < 450 }],
    sonuc: ([k, e], hepsi) => hepsi ? `Servisle gelen: ${k * 2 / 5} + ${e * 3 / 4} = <b>${k * 2 / 5 + e * 3 / 4} öğrenci</b>.` : "",
    satir: ([k, e], hepsi) => [k, e, sayi(k * 0.4), sayi(e * 0.75), hepsi ? `<b>${k * 2 / 5 + e * 3 / 4}</b>` : "olmaz"],
    yon: "Kız ve erkek öğrenci sayılarını değiştirin; servisle gelenler anında hesaplanır. Öğrenci sayıları doğal sayı olduğu için servisli sayılar da tam olmalı. Servisli kızlar ile servisli erkekler eşit olunca kız ve erkek sayıları arasında nasıl bir ilişki görüyorsunuz?",
    bitis: "Dört koşulu birlikte sağlayan sayıları bulduğunuzda." }),

  /* 8 · traktör tekerlekleri 180 ve 270 cm */
  8: el => CN.IKIRITIM(el, { a: 180, b: 270, son: 1100, birim: "cm", adlar: ["Ön leke", "Arka leke"], min: 50, max: 400,
    etiket: v => metre(v), kisaEt: v => metre(v), basMetin: "Başlangıç: iki leke de yere değiyor.", sutun: ["Çevreler", "Alınan yol", "Ön tur", "Arka tur"],
    ek: (t, a, b) => `Ön tekerlek ${Math.floor(t / a)}, arka tekerlek ${Math.floor(t / b)} tam tur attı.`,
    satir: (t, a, b) => [`${a} ve ${b} cm`, `<b>${metre(t)}</b>`, t / a, t / b],
    yon: "Traktörü ilerletin. Turuncu noktalar ön lekenin, mavi noktalar arka lekenin yere değdiği yerlerdir; yeşil çizgi ikisinin aynı anda değdiği yeri gösterir. İlk yeşil çizgiye kadar traktör kaç metre gidiyor?",
    bitis: "İki lekenin ilk kez yeniden aynı anda yere değdiği yeri bulduğunuzda." }),

  /* 9 · binalar: kat yüksekliği 320 ve 280 cm, köprü */
  9: el => CN.IKIRITIM(el, { a: 320, b: 280, son: 4500, birim: "cm", adlar: ["A binası döşemesi", "B binası döşemesi"], min: 200, max: 400,
    etiket: v => metre(v), kisaEt: v => metre(v), basMetin: "Zemin: iki binanın zemin katı aynı düzeyde (köprü zemine yapılmaz).", sutun: ["Kat yükseklikleri", "Köprü yüksekliği", "A katı", "B katı"],
    ek: (t, a, b) => `Bu yükseklik A binasında ${t % a ? "döşemeye denk gelmiyor" : t / a + ". katın döşemesi"}, B binasında ${t % b ? "döşemeye denk gelmiyor" : t / b + ". katın döşemesi"}.`,
    satir: (t, a, b) => [`${a} ve ${b} cm`, `<b>${metre(t)}</b>`, t / a + ". kat", t / b + ". kat"],
    yon: "Yükseklik çizgisini yukarı doğru ilerletin. Turuncu noktalar A binasının, mavi noktalar B binasının kat döşemeleridir; yeşil çizgi iki döşemenin aynı yükseklikte olduğu yeri gösterir. Köprü en alçak yeşil çizgiye yapılır. Kaç metre yüksekte?",
    bitis: "Köprünün yapılabileceği en alçak yüksekliği bulduğunuzda." }),

  /* 10 · akıllı kilit: 15 ve 18'in katı, dört basamaklı, rakamları farklı, en küçük */
  10: el => CN.KOSUL(el, { dugme: false, sutun: ["Şifre", "15'in katı", "18'in katı", "Rakamlar farklı", "Kilit"],
    girdi: [{ ad: "Denenen şifre:", min: 1000, max: 1500, bas: 1000 }],
    ciz: ([n]) => kutuk([kart(n, "ekrandaki şifre"), kart(n % 15 ? `${n % 15} kalır` : "kalansız", "15'e bölüm", n % 15 ? "no" : "ok"), kart(n % 18 ? `${n % 18} kalır` : "kalansız", "18'e bölüm", n % 18 ? "no" : "ok"),
      kart(new Set(String(n)).size === 4 ? "farklı" : "tekrar var", "rakamlar", new Set(String(n)).size === 4 ? "ok" : "no")]),
    kosullar: [{ ad: "15'in katı", f: ([n]) => n % 15 === 0 }, { ad: "18'in katı", f: ([n]) => n % 18 === 0 }, { ad: "Rakamları farklı", f: ([n]) => new Set(String(n)).size === 4 }],
    sonuc: ([n], hepsi) => hepsi ? `${n} bütün ipuçlarını sağlıyor. Bundan küçük bir şifre de sağlıyor mu? Defterinize bakın.` : "",
    satir: ([n], hepsi) => [n, n % 15 ? "✘" : "✔", n % 18 ? "✘" : "✔", new Set(String(n)).size === 4 ? "✔" : "✘", hepsi ? "<b>açıldı</b>" : "kapalı"],
    yon: "Şifreyi 1000'den başlayarak değiştirin. Hem 15'in hem 18'in katı olan sayılar arasında nasıl bir düzen görüyorsunuz (kaçar kaçar artıyorlar)? İpuçlarının hepsini sağlayan en küçük sayıyı bulun.",
    bitis: "Kilidi açan en küçük şifreyi bulduğunuzda." }),

  /* 11 · makine bakımı 120 ve 180 saat, pazartesi 08.00 */
  11: el => CN.IKIRITIM(el, { a: 120, b: 180, son: 720, birim: "saat", adlar: ["A makinesi", "B makinesi"], min: 12, max: 240,
    etiket: v => `${GUN[Math.floor((8 + v) / 24) % 7]} ${String((8 + v) % 24).padStart(2, "0")}.00 (${Math.floor((8 + v) / 24)}. gün)`, kisaEt: v => `${v} sa`,
    basMetin: "Pazartesi 08.00: iki makine birlikte bakıma alındı.", sutun: ["Aralıklar", "Ortak bakım", "Geçen saat", "Gün"],
    satir: (t, a, b) => [`${a} ve ${b} saat`, `<b>${GUN[Math.floor((8 + t) / 24) % 7]}</b>`, t, `${t / 24} gün`],
    yon: "Zamanı ilerletin. Turuncu noktalar A makinesinin, mavi noktalar B makinesinin bakım anlarıdır; yeşil çizgi ortak bakımı gösterir. Bir gün 24 saattir. Bir sonraki ortak bakım haftanın hangi gününe denk geliyor?",
    bitis: "Bir sonraki ortak bakımın gününü bulduğunuzda." }),

  /* 12 · boya: mavi 4 L, sarı 6 L, eşit miktar, yeşil < 50 L */
  12: el => CN.KOSUL(el, { dugme: false, sutun: ["Mavi kutu", "Sarı kutu", "Mavi / sarı", "Yeşil boya", "Kutu"],
    girdi: [{ ad: "Mavi kutu (4 L):", min: 1, max: 15, bas: 3 }, { ad: "Sarı kutu (6 L):", min: 1, max: 10, bas: 3 }],
    ciz: ([m, s]) => kutuk([kart(`${4 * m} L`, `${m} mavi kutu`), kart(`${6 * s} L`, `${s} sarı kutu`), kart(`${4 * m + 6 * s} L`, "karışım", 4 * m === 6 * s ? "ok" : "no")]),
    kosullar: [{ ad: "Mavi ve sarı boya eşit miktarda", f: ([m, s]) => 4 * m === 6 * s }, { ad: "Yeşil boya 50 L'den az", f: ([m, s]) => 4 * m + 6 * s < 50 }],
    sonuc: ([m, s], hepsi) => hepsi ? `${4 * m + 6 * s} L yeşil boya için <b>${m + s} kutu</b>. Daha çok yeşil boya elde edilebilir mi?` : "",
    satir: ([m, s], hepsi) => [m, s, `${4 * m} / ${6 * s} L`, `${4 * m + 6 * s} L`, hepsi ? `<b>${m + s}</b>` : "olmaz"],
    yon: "Mavi ve sarı kutu sayılarını değiştirin. Boyalar eşit miktarda olmalı ve hiç artmamalı. Eşitlik hangi litrelerde sağlanıyor? 50 L'den az, en çok yeşil boyayı bulun.",
    bitis: "Koşulları sağlayan en çok yeşil boyayı bulduğunuzda." }),

  /* 13 · kulüpler 6 ve 9 okul gününde bir; pazartesi–cuma */
  13: el => CN.IKIRITIM(el, { a: 6, b: 9, son: 40, birim: "okul günü", adlar: ["Robotik", "Satranç"], max: 15,
    etiket: v => `${Math.floor(v / 5) + 1}. hafta ${OKUL[v % 5]}`, kisaEt: v => `${Math.floor(v / 5) + 1}. h ${OKUL[v % 5].slice(0, 3)}`,
    basMetin: "1. haftanın pazartesisi: iki kulüp aynı gün toplandı.", sutun: ["Aralıklar", "Ortak toplantı", "Geçen okul günü"],
    satir: (t, a, b) => [`${a} ve ${b} okul günü`, `<b>${Math.floor(t / 5) + 1}. hafta ${OKUL[t % 5]}</b>`, t],
    yon: "Okul günlerini ilerletin (hafta sonları sayılmaz). Turuncu noktalar robotik, mavi noktalar satranç toplantılarıdır; yeşil çizgi ortak toplantıyı gösterir. İlk ortak toplantı kaçıncı haftanın hangi günü?",
    bitis: "İlk ortak toplantının gününü bulduğunuzda." }),

  /* 14 · yol: 30 m ve 40 m'de bir direk, 1 km */
  14: el => CN.IKIRITIM(el, { a: 30, b: 40, son: 1000, birim: "m", adlar: ["Üst kenar", "Alt kenar"], max: 100,
    etiket: v => v ? `${v}. m` : "yolun başı", basMetin: "Yolun başı: iki kenarda karşılıklı direk var (bu çift de sayılır).",
    bitti: (a, b, ort) => `Yolun başındaki çift dâhil <b>${ort + 1} çift</b> karşılıklı direk var.`, bittiSatir: (a, b, ort) => [`${a} ve ${b} m`, "1 km", `baş dâhil ${ort + 1}`],
    yon: "Yol boyunca ilerleyin. Turuncu noktalar üst kenardaki, mavi noktalar alt kenardaki direklerdir; yeşil çizgi karşılıklı direkleri gösterir. Yolun sonu (1000 m) bir yeşil çizgiye denk geliyor mu? Baştaki çift de sayılınca kaç çift oluyor?",
    bitis: "Yolun sonuna ulaştığınızda." }),

  /* 15 · tarif: 3 yumurta + 4 bardak un; 10'lu viyol, 6 bardaklık paket */
  15: el => CN.KOSUL(el, { dugme: false, sutun: ["Tepsi", "Yumurta", "Un", "Ambalaj"],
    girdi: [{ ad: "Tepsi sayısı:", min: 1, max: 40, bas: 5 }],
    ciz: ([t]) => kutuk([kart(`${3 * t} yumurta`, (3 * t) % 10 ? `${Math.ceil(3 * t / 10)} viyol · ${10 - (3 * t) % 10} yumurta artar` : `${3 * t / 10} viyol · artmaz`, (3 * t) % 10 ? "no" : "ok"),
      kart(`${4 * t} bardak un`, (4 * t) % 6 ? `${Math.ceil(4 * t / 6)} paket · ${6 - (4 * t) % 6} bardak artar` : `${4 * t / 6} paket · artmaz`, (4 * t) % 6 ? "no" : "ok")]),
    kosullar: [{ ad: "Yumurta artmıyor", f: ([t]) => (3 * t) % 10 === 0 }, { ad: "Un artmıyor", f: ([t]) => (4 * t) % 6 === 0 }],
    sonuc: ([t], hepsi) => hepsi ? `${t} tepsi: ${3 * t / 10} viyol + ${4 * t / 6} paket = <b>${3 * t / 10 + 4 * t / 6} ambalaj</b>.` : "",
    satir: ([t], hepsi) => [t, (3 * t) % 10 ? "artar" : `${3 * t / 10} viyol`, (4 * t) % 6 ? "artar" : `${4 * t / 6} paket`, hepsi ? `<b>${3 * t / 10 + 4 * t / 6}</b>` : "olmaz"],
    yon: "Tepsi sayısını değiştirin; gereken yumurta ve un ile alınması gereken viyol ve paketler anında görünür. Yumurta hangi tepsi sayılarında artmıyor? Un hangilerinde? İkisinin birlikte artmadığı en küçük tepsi sayısını bulun.",
    bitis: "Hiçbir malzemenin artmadığı en küçük tepsi sayısını ve ambalaj sayısını bulduğunuzda." }),

  /* 16 · kütüphane 9 ve 12 günde bir, 1 Eylül → 31 Aralık */
  16: el => CN.IKIRITIM(el, { a: 9, b: 12, son: 121, birim: "gün", adlar: ["Ali", "Ece"], max: 30,
    etiket: d => tarih(d), kisaEt: d => tarih(d), basMetin: "1 Eylül: Ali ile Ece kütüphanede karşılaştı (bu sayılmaz).",
    bitti: (a, b, ort) => `31 Aralık'a kadar <b>${ort} kez daha</b> aynı gün gittiler.`, bittiSatir: (a, b, ort) => [`${a} ve ${b} gün`, "31 Aralık'a kadar", `toplam ${ort}`],
    yon: "Günleri ilerletin. Turuncu noktalar Ali'nin, mavi noktalar Ece'nin kütüphaneye gittiği günlerdir; yeşil çizgi ikisinin aynı gün gittiğini gösterir. Eylül 30, ekim 31, kasım 30, aralık 31 gündür. Yıl sonuna kadar kaç kez daha karşılaşıyorlar?",
    bitis: "31 Aralık'a ulaştığınızda." }),
};
})();

<script>

height=\"44.0\" rx=\"6\" fill=\"#000000\" stroke=\"#495057\" stroke-width=\"2\"/><text x=\"635.0\" y=\"90.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"22\" font-weight=\"800\" fill=\"#ff6b6b\" text-anchor=\"middle\">08.10</text><text x=\"635.0\" y=\"124.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">istasyon saati</text></svg>", "son": "<p>Ayşe, iki hattın trenlerinin perona birlikte geldiği anda yapılan anonsu dinleyip ardından trene binecektir. Ayşe perona istasyon saatinin gösterdiği anda gelmiştir.</p>", "k": "Buna göre, Ayşe anonsu duymak için <u style=\"white-space:nowrap\">en az</u> kaç dakika bekler?", "sec": ["2", "6", "8", "14"], "secg": null, "c": "C", "a": ["İki hattın trenleri EKOK(6, 8) = 24 dakikada bir birlikte gelir: 07.30, 07.54, 08.18, …", "Ayşe 08.10'da peronadır; 07.54 geçmiştir. Bir sonraki ortak an 08.18'dir: 8 dakika bekler."], "t": "2: A hattının bir sonraki treni 08.12'de gelir; 6: 08.10'da gelen B treninden sonra A ile buluşma sanılmış; 14: 07.30'a 24 dakika eklenip 07.54 yerine 08.24 bulunmuş.", "d": "İki hattın trenleri 24 dakikada bir birlikte gelir. Ayşe 08.10'da gelir; 07.54'teki ortak an geçmiştir. 08.10'da yalnız B treni, 08.12'de yalnız A treni gelir; anons için ikisinin birlikte gelmesini bekleyin.", "ses": "b01"}, {"no": 2, "on": "<p>Bir caddede art arda iki trafik ışığı vardır. Işıkların yeşile dönme aralıkları kavşaktaki bilgi plakalarında yazılıdır.</p>", "g": "<svg viewBox=\"0 0 690 230\" width=\"690\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"0.0\" y=\"150.0\" width=\"690.0\" height=\"50.0\" rx=\"0\" fill=\"#ced4da\" stroke=\"#868e96\" stroke-width=\"1.2\"/><line x1=\"0.0\" y1=\"175.0\" x2=\"690.0\" y2=\"175.0\" stroke=\"#ffffff\" stroke-width=\"3\" stroke-dasharray=\"16 10\"/><rect x=\"167.0\" y=\"40.0\" width=\"6.0\" height=\"110.0\" rx=\"0\" fill=\"#495057\" stroke=\"none\" stroke-width=\"0\"/><rect x=\"154.0\" y=\"20.0\" width=\"32.0\" height=\"76.0\" rx=\"6\" fill=\"#212529\" stroke=\"#495057\" stroke-width=\"1.4\"/><circle cx=\"170.0\" cy=\"33.0\" r=\"9.0\" fill=\"#495057\" stroke=\"#000000\" stroke-width=\"1\"/><circle cx=\"170.0\" cy=\"57.0\" r=\"9.0\" fill=\"#495057\" stroke=\"#000000\" stroke-width=\"1\"/><circle cx=\"170.0\" cy=\"81.0\" r=\"9.0\" fill=\"#40c057\" stroke=\"#000000\" stroke-width=\"1\"/><rect x=\"162.0\" y=\"45.6\" width=\"200.0\" height=\"20.8\" rx=\"6\" fill=\"#ffffff\" stroke=\"#868e96\" stroke-width=\"1.2\"/><text x=\"262.0\" y=\"61.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">1. ışık: 90 saniyede bir yeşil</text><rect x=\"497.0\" y=\"40.0\" width=\"6.0\" height=\"110.0\" rx=\"0\" fill=\"#495057\" stroke=\"none\" stroke-width=\"0\"/><rect x=\"484.0\" y=\"20.0\" width=\"32.0\" height=\"76.0\" rx=\"6\" fill=\"#212529\" stroke=\"#495057\" stroke-width=\"1.4\"/><circle cx=\"500.0\" cy=\"33.0\" r=\"9.0\" fill=\"#495057\" stroke=\"#000000\" stroke-width=\"1\"/><circle cx=\"500.0\" cy=\"57.0\" r=\"9.0\" fill=\"#495057\" stroke=\"#000000\" stroke-width=\"1\"/><circle cx=\"500.0\" cy=\"81.0\" r=\"9.0\" fill=\"#40c057\" stroke=\"#000000\" stroke-width=\"1\"/><rect x=\"492.0\" y=\"45.6\" width=\"200.0\" height=\"20.8\" rx=\"6\" fill=\"#ffffff\" stroke=\"#868e96\" stroke-width=\"1.2\"/><text x=\"592.0\" y=\"61.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">2. ışık: 120 saniyede bir yeşil</text><text x=\"345.0\" y=\"220.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"600\" fill=\"#333333\" text-anchor=\"middle\">Kavşak plakasında yazan bilgiler etiketlerde gösterilmiştir.</text></svg>", "son": "<p>Saat 08.00'de iki ışık aynı anda yeşile dönmüştür. Bir sürücü, iki ışığın aynı anda yeşile döndüğü anları saymaktadır.</p>", "k": "Buna göre, 08.00'den sonra 08.30'a kadar (08.30 dâhil) iki ışık kaç kez aynı anda yeşile döner?", "sec": ["4", "5", "6", "7"], "secg": null, "c": "B", "a": ["İki ışık EKOK(90, 120) = 360 saniyede, yani 6 dakikada bir aynı anda yeşile döner.", "08.06, 08.12, 08.18, 08.24, 08.30 → 5 kez."], "t": "6: 08.00 de sayılmış; 7: ortak süre 5 dakika sanılmış ve 08.00 sayılmış; 4: 08.30 dâhil edilmemiş.", "d": "Saniyeleri dakikaya çevirin: EKOK(90, 120) = 360 saniye = 6 dakika. Soru 08.00'den sonrasını soruyor; 08.00 sayılmaz, 08.30 ise dâhildir.", "ses": "b02"}, {"no": 3, "on": "<p>Can ile Ece aynı kitabı okumuştur. Her biri her gün aynı sayıda sayfa okumuş ve kitabı tam olarak bitirmiştir. Okuma çizelgeleri aşağıda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 690 184\" width=\"690\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"60.0\" y=\"20.0\" width=\"250.0\" height=\"150.0\" rx=\"6\" fill=\"#fffdf2\" stroke=\"#c9b48a\" stroke-width=\"1.6\"/><rect x=\"60.0\" y=\"20.0\" width=\"250.0\" height=\"34.0\" rx=\"6\" fill=\"#e3edfb\" stroke=\"none\" stroke-width=\"0\"/><text x=\"185.0\" y=\"43.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#1c5fbf\" text-anchor=\"middle\">Can'ın okuma çizelgesi</text><text x=\"80.0\" y=\"86.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Kitap: Uzay Yolcuları</text><text x=\"80.0\" y=\"116.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Her gün okunan: 12 sayfa</text><text x=\"80.0\" y=\"146.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Bitiş: 20 Kasım</text><rect x=\"380.0\" y=\"20.0\" width=\"250.0\" height=\"150.0\" rx=\"6\" fill=\"#fffdf2\" stroke=\"#c9b48a\" stroke-width=\"1.6\"/><rect x=\"380.0\" y=\"20.0\" width=\"250.0\" height=\"34.0\" rx=\"6\" fill=\"#fff0e2\" stroke=\"none\" stroke-width=\"0\"/><text x=\"505.0\" y=\"43.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#d9480f\" text-anchor=\"middle\">Ece'ın okuma çizelgesi</text><text x=\"400.0\" y=\"86.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Kitap: Uzay Yolcuları</text><text x=\"400.0\" y=\"116.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Her gün okunan: 18 sayfa</text><text x=\"400.0\" y=\"146.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Bitiş: 20 Kasım</text></svg>", "son": "<p>Can kitabı okumaya Ece'den 5 gün önce başlamıştır. İkisi de kitabı aynı gün bitirmiştir.</p>", "k": "Buna göre, kitap kaç sayfadır?", "sec": ["72 sayfa", "108 sayfa", "144 sayfa", "180 sayfa"], "secg": null, "c": "D", "a": ["Kitabın sayfa sayısı hem 12'nin hem 18'in katıdır: EKOK(12, 18) = 36'nın katı → 36 · k.", "Can 36 · k : 12 = 3 · k günde, Ece 36 · k : 18 = 2 · k günde okur. Fark k = 5 gündür.", "Kitap 36 · 5 = 180 sayfadır. Denetim: Can 15 günde, Ece 10 günde okur."], "t": "72, 108 ve 144: fark 2, 3 ve 4 gün olan ortak katlar.", "d": "Sayfa sayısı hem 12'nin hem 18'in katıdır. Ortak katı 36 · k alınca Can 3 · k, Ece 2 · k günde okur; gün farkı k'dir.", "ses": "b03"}, {"no": 4, "on": "<p>Bir yer istasyonu iki uyduyu izlemektedir. Uyduların istasyonun tam üstünden geçme aralıkları istasyondaki ekranda aşağıdaki gibi gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 690 220\" width=\"690\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><defs><clipPath id=\"sb8112b-uydu\"><rect x=\"0\" y=\"0\" width=\"690\" height=\"220\" rx=\"8\"/></clipPath></defs><g clip-path=\"url(#sb8112b-uydu)\"><rect x=\"0.0\" y=\"0.0\" width=\"690.0\" height=\"220.0\" rx=\"0\" fill=\"#0b1d3a\" stroke=\"none\" stroke-width=\"0\"/><circle cx=\"345.0\" cy=\"260.0\" r=\"140.0\" fill=\"#1971c2\" stroke=\"#74c0fc\" stroke-w ses": "b06"}, {"no": 7, "on": "<p>Bir okulda öğrencilerin okula servisle gelip gelmediğini öğrenmek için anket yapılmıştır. Okuldaki bütün öğrenciler ankete katılmıştır. Anketin sonuç panosu aşağıda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 690 210\" width=\"690\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"150.0\" y=\"10.0\" width=\"390.0\" height=\"190.0\" rx=\"10\" fill=\"#ffffff\" stroke=\"#2b8a3e\" stroke-width=\"2.4\"/><rect x=\"150.0\" y=\"10.0\" width=\"390.0\" height=\"36.0\" rx=\"10\" fill=\"#2b8a3e\" stroke=\"none\" stroke-width=\"0\"/><rect x=\"150.0\" y=\"34.0\" width=\"390.0\" height=\"12.0\" rx=\"0\" fill=\"#2b8a3e\" stroke=\"none\" stroke-width=\"0\"/><text x=\"345.0\" y=\"34.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#ffffff\" text-anchor=\"middle\">SERVİS ANKETİ SONUCU</text><text x=\"170.0\" y=\"80.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"start\">Kız öğrenciler</text><rect x=\"300.0\" y=\"64.0\" width=\"200.0\" height=\"22.0\" rx=\"4\" fill=\"#f1f3f5\" stroke=\"#adb5bd\" stroke-width=\"1\"/><rect x=\"300.0\" y=\"64.0\" width=\"80.0\" height=\"22.0\" rx=\"4\" fill=\"#f06595\" stroke=\"none\" stroke-width=\"0\"/><text x=\"386.0\" y=\"80.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"start\">%40</text><text x=\"170.0\" y=\"136.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"start\">Erkek öğrenciler</text><rect x=\"300.0\" y=\"120.0\" width=\"200.0\" height=\"22.0\" rx=\"4\" fill=\"#f1f3f5\" stroke=\"#adb5bd\" stroke-width=\"1\"/><rect x=\"300.0\" y=\"120.0\" width=\"150.0\" height=\"22.0\" rx=\"4\" fill=\"#339af0\" stroke=\"none\" stroke-width=\"0\"/><text x=\"444.0\" y=\"136.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#ffffff\" text-anchor=\"end\">%75</text><text x=\"345.0\" y=\"186.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">Servisle gelenlerin oranı</text></svg>", "son": "<p>Servisle gelen kız öğrenci sayısı, servisle gelen erkek öğrenci sayısına eşittir. Okulda 420'den fazla, 450'den az öğrenci vardır.</p>", "k": "Buna göre, okula servisle gelen kaç öğrenci vardır?", "sec": ["114", "152", "228", "285"], "secg": null, "c": "C", "a": ["%40 = 2/5 ve %75 = 3/4'tür. Servisle gelen kız sayısı 2'nin, erkek sayısı 3'ün katıdır; bu sayılar eşit olduğundan EKOK(2, 3) = 6'nın katıdır: 6 · k.", "Kız sayısı 6 · k · 5/2 = 15 · k, erkek sayısı 6 · k · 4/3 = 8 · k; okulda 23 · k öğrenci vardır. 420 ile 450 arasında 23 · 19 = 437.", "Servisle gelenler 2 · 6 · 19 = 228 öğrencidir."], "t": "114: yalnız kızlar ya da yalnız erkekler; 285: kız öğrenci sayısı; 152: erkek öğrenci sayısı.", "d": "Yüzdeleri kesre çevirin: %40 = 2/5, %75 = 3/4. Servisli kız ve erkek sayıları eşit olduğundan bu sayı hem 2'nin hem 3'ün katıdır. Soru servisle gelen bütün öğrencileri soruyor.", "ses": "b07"}, {"no": 8, "on": "<p>Bir traktörün ön ve arka tekerleklerine birer boya lekesi bulaşmıştır. Traktör, iki leke de yere değerken düz bir yolda ileri doğru hareket etmeye başlamıştır. Tekerleklerin çevre uzunlukları, traktörün kullanım kılavuzunda aşağıdaki gibi verilmiştir.</p>", "g": "<svg viewBox=\"0 0 690 236\" width=\"690\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"20.0\" y1=\"200.0\" x2=\"670.0\" y2=\"200.0\" stroke=\"#8d6e63\" stroke-width=\"3\"/><rect x=\"250.0\" y=\"70.0\" width=\"230.0\" height=\"70.0\" rx=\"8\" fill=\"#2f9e44\" stroke=\"#1b5e20\" stroke-width=\"2\"/><rect x=\"400.0\" y=\"30.0\" width=\"70.0\" height=\"50.0\" rx=\"4\" fill=\"#d3f9d8\" stroke=\"#1b5e20\" stroke-width=\"2\"/><circle cx=\"300.0\" cy=\"158.0\" r=\"42.0\" fill=\"#343a40\" stroke=\"#000000\" stroke-width=\"2\"/><circle cx=\"300.0\" cy=\"158.0\" r=\"14.0\" fill=\"     k.querySelectorAll("ol.sec li").forEach(li=>{if(li.dataset.h===s.c)li.classList.add("dogru");});
    if(s.t){const t=document.createElement("p");t.className="tuzak";t.innerHTML="<b>Diğer seçenekler neden yanlış?</b> "+s.t;w.appendChild(t);}});

/* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
