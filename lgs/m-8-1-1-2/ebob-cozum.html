<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çözümler · Keşfet ve Çöz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--muted:#5b6478;--line:#dfe5ef;--bg:#f5f7fb;--card:#fff;--ss:#6741d9;--kk:#0b7285;--b:#d0700f;--ok:#2b8a3e;--warn:#c92a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif}
header{background:linear-gradient(135deg,#1c5fbf,#2f8fe0);color:#fff;padding:18px 16px 22px}

main{max-width:780px;margin:14px auto 40px;padding:0 16px}
nav.sec{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}nav.sec button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}

ol.sec{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
ol.sec li{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}ol.sec li.dogru{border-color:var(--ok);background:#ebfbee;font-weight:800}
.adim{border-left:4px solid var(--c);padding:6px 12px;margin:8px 0;background:#fff;border-radius:0 10px 10px 0;animation:gel .35s ease-out}
.adim b{color:var(--c)}@keyframes gel{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dug{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
button.btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.dikkat{background:#fff4e6;border:2px solid #f59f00;border-radius:12px;padding:10px 14px;margin:12px 0 4px}.dikkat b{color:#d9480f}
.tuzak{font-size:15px;color:var(--muted);margin-top:8px}
.cevap{font-weight:900;color:var(--ok);margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid var(--line);padding:8px 10px;text-align:left}th{background:#e3fafc;color:#0b7285;font-size:13px;letter-spacing:.06em}
.ses{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border-radius:12px;background:#eef2ff}

.ses span{font-size:14px;color:var(--muted)}
.gizli{display:none}
.tum{margin:4px 0 14px;font-size:14px}.tum a{color:#1c5fbf;font-weight:800}
@media (prefers-reduced-motion:reduce){.adim{animation:none}}
/* Canlandır (05.10.2026) */
.sek{display:flex;gap:6px;margin:12px 0 0;border-bottom:2px solid var(--line)}
.sek button{border:0;background:none;font:inherit;font-weight:900;font-size:15px;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);min-height:44px;position:relative;top:2px;border-bottom:3px solid transparent}
.sek button[aria-selected=true]{color:var(--c);border-bottom-color:var(--c);background:#fff8f0}
.sek .yeni{display:inline-block;font-size:10px;background:#2b8a3e;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.06em}
.cn{padding-top:10px}
.cn-yon{background:#eef6ff;border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:10px}
.cn-sahne{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;min-height:120px;overflow-x:auto}

.cn-adimci input,.cn-test input{width:84px;height:44px;border:2px solid var(--line);border-radius:12px;font:inherit;font-weight:900;text-align:center;font-size:18px}
.cn-test label{font-weight:800;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.cn-btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
.cn-btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.cn-btn[aria-pressed=true]{background:var(--ac,var(--c));color:#fff;border-color:var(--ac,var(--c))}
.cn-btn:disabled{opacity:.5}
.cn-hazir{display:flex;flex-wrap:wrap;gap:6px}

.cn-dur .iyi{color:var(--ok);font-weight:900}.cn-dur .kotu{color:var(--warn);font-weight:900}
.cn-df{margin-top:10px;overflow-x:auto}@media(max-width:480px){.cn-adimci>span{flex-basis:100%}.cn-h{font-size:12px;padding:5px 0}.cn-izg{gap:3px}.cn-sahne{padding:6px}}@media(max-width:480px){.cn-df table{font-size:13px}.cn-df td,.cn-df th{padding:4px 5px}}.cn-df summary{font-weight:900;cursor:pointer;padding:6px 0}.cn-say{color:var(--muted);font-weight:700}
.cn-df table{font-size:15px}.cn-df td{padding:5px 8px}.cn-df tr.cn-iyi td{background:#ebfbee}.cn-df tr.cn-kotu td{background:#fff5f5}.cn-df tr.cn-son td{outline:2px solid var(--c);outline-offset:-2px}
.cn-p{animation:cnGel .35s ease-out both}@keyframes cnGel{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cn-o{fill:#ffa94d;stroke:#d9480f;stroke-width:1}.cn-o2{fill:#e8590c}.cn-k{fill:#ffc9c9;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:3 2}
.cn-cerceve{stroke:#2b8a3e;stroke-width:3}.cn-et{font-size:13px;font-weight:800;fill:#5b6478}.cn-et.b,.cn-et2b{font-weight:900;fill:#1d2433}.cn-et2{font-size:11px;fill:#5b6478;font-weight:700}.cn-et2b{font-size:13px;fill:#fff}
.cn-ku{fill:#fff4e6;stroke:#ffa94d;stroke-width:1.5}.cn-kk{fill:#fff5f5;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:4 3}
.cn-tahta0{fill:#f1f3f5;stroke:#ced4da}.cn-tahta{fill:#c08552;stroke:#8d5a2b}
.cn-ek{stroke:#868e96;stroke-width:2}.cn-sinir{stroke:#c92a2a;stroke-width:3;stroke-dasharray:5 4}.cn-yay{fill:none;stroke:#f76707;stroke-width:2}
.cn-v1{stroke:#2b8a3e;stroke-width:3}.cn-v2{stroke:#c92a2a;stroke-width:3}.cn-kis{font-size:20px}.cn-bus{font-size:16px}.cn-bek{stroke:#c92a2a;stroke-width:5;stroke-linecap:round;opacity:.6}
.cn-kum{fill:#ffe8cc;stroke:#e8590c;stroke-width:3}.cn-kum2{fill:#495057}.cn-para{fill:#ffd43b;opacity:.85}.cn-buyuk{font-size:26px;font-weight:900;fill:#1d2433}
.cn-zem{fill:#adb5bd}.cn-kat{fill:#f1f3f5;stroke:#ced4da}.cn-katon{fill:#d3f9d8;stroke:#2b8a3e}.cn-katoff{fill:#ffe3e3;stroke:#e03131}
.cn-izg{display:grid;gap:4px}.cn-h,.cn-gb{border-radius:8px;text-align:center;font-weight:800;font-size:14px;padding:6px 0}.cn-h{background:#f1f3f5;transition:background .25s,transform .25s}
.cn-gb{background:none;color:var(--muted);font-size:12px}.cn-h.on{background:#ffa94d;color:#1d2433}.cn-h.yeni{transform:scale(1.18);box-shadow:0 0 0 3px #e8590c}
.cn-kartlar{display:flex;flex-wrap:wrap;gap:6px;padding:4px}.cn-kart{min-width:44px;padding:8px 10px;text-align:center;border-radius:10px;background:#fff4e6;border:2px solid #ffa94d;font-weight:900;animation:cnGel .3s}
.cn-kart.kare{background:#e7f5ff;border-color:#1c7ed6}.cn-bosk{color:var(--muted)}
.cn-cift{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 4px;font-weight:800}.cn-cift i{font-weight:600;color:#1c7ed6}
.cn-katlar{padding:4px}.cn-katsat{display:inline-flex;flex-wrap:wrap;gap:6px}.cn-kat2{background:#e6fcf5;border:1.5px solid #12b886;border-radius:8px;padding:3px 8px;font-weight:800;animation:cnGel .3s}.cn-sonsuz{font-weight:800;color:#0b7285}
.cn-onr{background:#f8f0fc;border:2px solid #ae3ec9;border-radius:12px;padding:10px 14px}.cn-kanit{padding:10px 4px 2px}
.cn-kay{display:inline-flex;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap}.cn-kay{max-width:100%}.cn-kay input{width:min(220px,70vw);accent-color:#d0700f}.cn-satir>*{min-width:0;max-width:100%}
@media (prefers-reduced-motion:reduce){.cn-p,.cn-kart,.cn-kat2{animation:none}.cn-h{transition:none}}
/* 05.10.2026 · KOŞUL ve LABİRENT motorları (SB 6.1.1) */
@media(max-width:560px){.soru [style*="grid-template-columns:repeat"]{grid-template-columns:1fr!important}}   /* çok sütunlu konuşma balonları telefonda alt alta */
.cn-kl{list-style:none;padding:0;margin:0;display:grid;gap:4px}.cn-not{color:var(--muted);font-size:14px}.cn-sonuc{margin-top:6px;font-weight:800}
.cn-secg{gap:6px}.cn-secad{font-weight:800;flex-basis:100%}.cn-secg .cn-btn{padding:8px 12px}
.cn-mv{fill:#74c0fc;stroke:#1c7ed6;stroke-width:1}.cn-tl{fill:#69db7c;stroke:#2b8a3e;stroke-width:1.5}
.cn-lab{display:grid;gap:4px;align-items:center;max-width:460px;margin:0 auto}
.cn-lc{min-height:44px;border-radius:8px;border:1.5px solid #ced4da;background:#fff;font:inherit;font-weight:900;font-size:16px;cursor:pointer;padding:0;color:var(--ink)}
.cn-lc.yol{background:#d3f9d8;border-color:#2b8a3e}.cn-lc.simdi{background:#2b8a3e;color:#fff;box-shadow:0 0 0 3px #b2f2bb}.cn-lc.kapali{background:#ffe3e3;border-color:#e03131;color:#c92a2a;text-decoration:line-through}
.cn-lok{color:#2b8a3e;font-weight:900;text-align:center}.cn-lcik{min-height:44px;border:0;background:none;font:inherit;font-weight:900;color:#d9480f;cursor:pointer;padding:0;white-space:nowrap;font-size:14px}.cn-lcik:disabled{cursor:default}

</style></head><body>
<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }
      if (!art && !o.sandalye) sv += `<rect x="10" y="10" width="${gen * hc}" height="${sira * hc}" fill="none" class="cn-cerceve"/>
        <text x="${10 + gen * hc / 2}" y="${H + 4}" class="cn-et" text-anchor="middle">${gen} ${o.birim || ""}</text>
        <text x="${W + 4}" y="${10 + sira * hc / 2}" class="cn-et" dominant-baseline="middle">${sira} ${o.birim || ""}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W + 70} ${H + 22}" role="img" aria-label="${N} ${o.ad || "kare"}, her sırada ${gen}">${sv}</svg>`;
      const r = o.kural ? o.kural(gen, sira, art, N) : null;
      let m;
      if (art) m = `<span class="kotu">✘</span> ${N} ${o.ad || "kare"} her sırada ${gen} olacak biçimde dizilince ${sira} tam sıra oluşur, <b>${art} ${o.ad || "kare"} artar</b>. Dikdörtgen olmaz: ${N} : ${gen} işleminde kalan ${art}.`;
      else m = `<span class="iyi">✔</span> <b>${N} = ${gen} ${x} ${sira}</b> · ${sira} sıra, her sırada ${gen} ${o.ad || "kare"}; hiç artmadı.` + (gen === sira ? ` <b>Kare oldu!</b> İki kenar aynı: ${gen}.` : "");
      if (!art && o.cevre) m += ` Çevre = 2 ${x} (${gen} + ${sira}) = <b>${2 * (gen + sira)} m</b>.`;
      if (r && r.msg) m += `<br>${r.msg}`;
      s.dur.innerHTML = m;
      const sutunlar = o.satir ? o.satir(gen, sira, art, N, r) : [gen, art ? `${sira} (+ ${art} artan)` : sira, art, art ? "olmaz" : (gen === sira ? "kare" : "dikdörtgen")];
      s.yaz(N + ":" + gen, sutunlar, !art && (!r || r.ok !== false));
    }
    ciz(g.get());
  }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {
    const N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });
    const g = adimci(o.etiket, 1, o.max || N, o.bas || 2, v => { sonK = v; });

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.

    kosullar: [{ ad: "1. bölümdeki eski ağaçlar (12 m arayla) yeni düzene uyuyor", f: ([d]) => 12 % d === 0 }, { ad: "2. bölümdeki eski ağaçlar (18 m arayla, 228. metreden başlayarak) yeni düzene uyuyor", f: ([d]) => 18 % d === 0 && 228 % d === 0 }],
    sonuc: ([d], hepsi) => hepsi ? `Yolda ${462 / d} aralık, ${462 / d + 1} ağaç olur. Bunların 33'ü eski ağaçtır; belediye <b>${462 / d + 1 - 33}</b> yeni ağaç diker.` : "Bazı eski ağaçların sökülmesi gerekir; bu aralık olmaz.",
    satir: ([d], hepsi) => [d + " m", hepsi ? "hepsi yerinde" : "sökülen var", hepsi ? 462 / d + 1 : "—", hepsi ? `<b>${462 / d + 1 - 33}</b>` : "olmaz"],
    iyi: ([d]) => 12 % d === 0 && 18 % d === 0 && 228 % d === 0,
    yon: "Yeni ağaçlar arasındaki aralığı değiştirin. Eski ağaçların hepsi yerinde kalabiliyor mu? Aralık büyüdükçe dikilecek yeni ağaç sayısı ne oluyor?",
    bitis: "Eski ağaçların hepsini yerinde bırakan aralıkların hepsini denediğinizde." }),

  18: el => CN.KOSUL(el, { dugme: false, sutun: ["a", "A tankı", "Bidon (EBOB)", "Bidon sayısı"],
    girdi: [{ ad: "A tankındaki 2'nin kuvveti (a):", min: 0, max: 8, bas: 1 }],
    ciz: ([a]) => { const A = 2 ** a * 15, g = CN.gcd(A, 792);
      return `<div class="cn-usl" style="grid-template-columns:auto repeat(4,minmax(44px,auto))"><span>A tankı</span><span>2<sup>${a}</sup></span><span>3</span><span>5</span><span class="gri">11<sup>0</sup></span>
        <span>B tankı</span><span>2<sup>3</sup></span><span>3<sup>2</sup></span><span class="gri">5<sup>0</sup></span><span>11</span></div>
        <div class="cn-kutuk"><div class="cn-kart2">${A} L<small>A tankı</small></div><div class="cn-kart2">792 L<small>B tankı</small></div><div class="cn-kart2 ${g === 24 ? "ok" : "no"}">${g} L<small>en büyük eş bidon</small></div></div>`; },
    kosullar: [{ ad: ([a]) => `A tankında 1000 L'den az süt var (${2 ** a * 15} L)`, f: ([a]) => 2 ** a * 15 < 1000 }, { ad: "En büyük eş bidon 24 L", f: ([a]) => CN.gcd(2 ** a * 15, 792) === 24 }],
    sonuc: ([a], hepsi) => hepsi ? `${2 ** a * 15} : 24 = ${2 ** a * 15 / 24} ve 792 : 24 = 33; toplam <b>${2 ** a * 15 / 24 + 33}</b> bidon.` : "",
    satir: ([a], hepsi) => { const A = 2 ** a * 15, g = CN.gcd(A, 792); return [a, A + " L", g + " L", hepsi ? `<b>${A / 24 + 33}</b>` : "olmaz"]; },
    yon: "A tankındaki 2'nin kuvvetini (a) değiştirin. Süt miktarı, en büyük eş bidon (iki miktarın EBOB'u) ve bidon sayısı anında değişir. Hangi a değerlerinde bidon 24 L oluyor ve A tankı 1000 L'den az kalıyor? Bidon sayısı en fazla ne zaman oluyor?",
    bitis: "0'dan 8'e kadar bütün a değerlerini denediğinizde." }),

  19: el => CN.KOSUL(el, { dugme: false, sutun: ["İkinci tahta", "En uzun eş parça", "Uygun mu?"],
    girdi: [{ ad: "İkinci tahta (cm):", min: 150, max: 240, bas: 170 }],
    ciz: ([t]) => { const g = CN.gcd(216, t), sk = 440 / 240;

  20: el => CN.KOSUL(el, { dugme: false, sutun: ["Kaç yıl sonra", "Yaşlar", "Ortak bölenler", "EBOB"],

    bitis: "En az 16 yıl ilerleyip EBOB'un aldığı değerleri defterde gördüğünüzde." }),

<script>
const V={"baslik": "Ortak Bölenler ve EBOB", "kod": "LGS · M.8.1.1.2 · Fasikül 2", "ses": "", "bet": "BAĞLAM TEMELLİ SORU", "bad": "Bağlam Soruları", "s": [{"no": 1, "bas": "Listeleme yöntemiyle ortak bölenler", "q": [{"k": "32 ile 56'nın ortak bölenlerini listeleme yöntemiyle bulunuz. EBOB(32, 56) kaçtır?", "a": ["32'nin bölenleri: 1, 2, 4, 8, 16, 32.", "56'nın bölenleri: 1, 2, 4, 7, 8, 14, 28, 56.", "İki listede de bulunanlar: 1, 2, 4, 8. Bunlar ortak bölenlerdir; en büyüğü 8'dir."], "c": "Ortak bölenler 1, 2, 4, 8; EBOB(32, 56) = 8"}, {"k": "76 ile 114'ün ortak bölenlerinden 5'ten büyük olanları yazınız.", "a": ["76'nın bölenleri: 1, 2, 4, 19, 38, 76.", "114'ün bölenleri: 1, 2, 3, 6, 19, 38, 57, 114.", "Ortak bölenler: 1, 2, 19, 38. Bunlardan 5'ten büyük olanlar 19 ve 38'dir."], "c": "19 ve 38"}]}, {"no": 2, "bas": "Algoritma yöntemiyle EBOB", "q": [{"k": "132 ile 156'nın EBOB'unu algoritma yöntemiyle bulunuz. Bu iki sayının kaç ortak böleni vardır?", "a": ["132 ve 156'yı birlikte 2'ye bölünüz: 66 ve 78. Yine birlikte 2'ye bölünüz: 33 ve 39.", "33 ve 39'u birlikte 3'e bölünüz: 11 ve 13. 11 ile 13'ün ortak böleni kalmadı; işlem biter.", "EBOB = 2 · 2 · 3 = 12. Ortak bölenler 12'nin bölenleridir: 1, 2, 3, 4, 6, 12."], "c": "EBOB = 12; 6 ortak bölen"}, {"k": "112 ile 160'ın ortak bölenlerinden kaç tanesi tek sayıdır?", "a": ["112 ve 160 birlikte dört kez 2'ye bölünür: 56 ve 80, 28 ve 40, 14 ve 20, 7 ve 10. 7 ile 10'un ortak böleni yoktur.", "EBOB = 2 · 2 · 2 · 2 = 16. Ortak bölenler 16'nın bölenleridir: 1, 2, 4, 8, 16.", "Bunlardan yalnız 1 tek sayıdır."], "c": "1 tane (yalnız 1)"}]}, {"no": 3, "bas": "Asal çarpanlarla EBOB", "q": [{"k": "A = 2<sup>3</sup> · 5<sup>2</sup> · 11 ve B = 2 · 3<sup>2</sup> · 5<sup>3</sup> olduğuna göre EBOB(A, B) kaçtır?", "a": ["Aynı tabanları alt alta yazınız: A'da 3<sup>0</sup>, B'de 11<sup>0</sup> gizlidir.", "Her tabanın küçük kuvvetini alınız: 2<sup>1</sup>, 3<sup>0</sup>, 5<sup>2</sup>, 11<sup>0</sup>.", "EBOB = 2 · 5<sup>2</sup>  miktarın ortak böleni olmalıdır. 250 g → 18 + 28 = 46 paket; 400 g ikisini de bölmez; 500 g → 9 + 14 = 23 paket; 750 g, 7000'i bölmez. En az paket 500 g'lık paketlerle elde edilir: 23."], "t": "20: fındık 750 g'lık, ceviz 500 g'lık paketlere konmuş, \"aynı boy\" koşulu unutulmuş; 32: fındık 250 g'lık, ceviz 500 g'lık paketlere konmuş; 46: ortak bölenlerin en küçüğü seçilmiş", "d": "Önce kilogramları grama çeviriniz. “Bütün paketler aynı boyda” koşulu, iki ürün için tek bir paket boyu seçilmesi demektir; paket boyu iki miktarın da ortak böleni olmalıdır.", "ses": "b01"}, {"no": 2, "on": "<p>Bir kaçış odası oyununda kasanın şifresi üç basamaklı bir sayıdır. Şifrenin her rakamı, kasanın üzerindeki bir kart ikilisine göre bulunmaktadır.</p>", "g": "<svg viewBox=\"0 0 810 500\" width=\"810\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAHVAvgDASIAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAECAwQFBgf/xABOEAACAQIDBAYFCQYCCQQBBQAAAQIDEQQSIQUxQVEGE2FxgZEUIjKhwRUjQlJygpKx0SQzNFNi4UPwFiVEVGNzg5OiBzVF8YQmZJTC0v/EABgBAQEBAQEAAAAAAAAAAAAAAAABAgME/8QAIxEBAAIBBQEAAwEBAQAAAAAAAAERAgMSEyExUQQyQWEigf/aAAwDAQACEQMRAD8A+lkmPrYR3zS7ymGxLrwcsqSzNIw02LCxXrOwnrFyIJsLEdZEnPEoWFhmjzRN1zAgWJ05k2ArYWLWFgK2Fi1hYgrYE2YsURYE2FgIBNhYCATYAQCQBBBYiwEE2FgAIsSSQRYWJAEEgACCQAIBJRAAAkgEgAABAJIAAkAAAQBYAoEkEgALkATcgAAAAACJAgEgCLEgAAAAABAAAAAFAEACQAABBNwAAAAAAAQBIAAAAAAAAAAAADxlfH1KtTNmaSeiPQbL/hX9pnjqs7Ja8Ueu2Q74Rv8AqZlW+LjcPzKIFiRw8QAHEANSU3zIAE3fMZpLiwAJzy5k52U1JAt1jHWPkVAF+s7ET1iMYCMnWRGeJjuAMuePMZlzMQAy3XMnQwi7AzCxhuxmfMWrNYWMWaXMZ5BKZLCxRVJE9Y+SBS1hYqqnYOt7ALWFiOsQ6xFE2Fhni+IzRfEACbrmNOYEAkAQCQBAJsLEEEFrCxRAJsLEEAkFEAkAQCQBFgSAIsASAAFwABAEggkgEEkFAEgCCQCAQSAIBIsBAFgUAAAJIAAAAAAAJIJAAAAAAAAAAAAAAPm9fcu9Hstjq2D+8zxtd6JdqPZ7Hf7F94yreFuHvAKAAAAELUIkDgAJ3 "330.0\" stroke=\"#000000\" stroke-width=\"2.4\" stroke-dasharray=\"6 5\"/><line x1=\"1208.0\" y1=\"250.0\" x2=\"1208.0\" y2=\"330.0\" stroke=\"#000000\" stroke-width=\"2.4\" stroke-dasharray=\"6 5\"/><rect x=\"126.2\" y=\"480.4\" width=\"49.6\" height=\"49.3\" rx=\"10\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"2\" fill-opacity=\".94\"/><text x=\"151.0\" y=\"516.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"34\" font-weight=\"800\" fill=\"#1f7a8c\" text-anchor=\"middle\">A</text><rect x=\"529.2\" y=\"480.4\" width=\"49.6\" height=\"49.3\" rx=\"10\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"2\" fill-opacity=\".94\"/><text x=\"554.0\" y=\"516.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"34\" font-weight=\"800\" fill=\"#1f7a8c\" text-anchor=\"middle\">B</text><rect x=\"1208.2\" y=\"480.4\" width=\"49.6\" height=\"49.3\" rx=\"10\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"2\" fill-opacity=\".94\"/><text x=\"1233.0\" y=\"516.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"34\" font-weight=\"800\" fill=\"#1f7a8c\" text-anchor=\"middle\">C</text></g></svg>", "son": "<p>A ile B ve B ile C ayakları arasına, ardışık iki direk arasındaki ve bir ayak ile ona en yakın direk arasındaki uzaklıklar birbirine eşit olacak şekilde direk takılacaktır. Ayakların tam üzerine direk takılmayacaktır. Bu uzaklık metre cinsinden bir doğal sayıdır ve olabilecek <u style=\"white-space:nowrap\">en fazla</u> değerdedir.</p>", "k": "Buna göre, köprüye kaç bayrak direği takılır?", "sec": ["6", "7", "8", "10"], "secg": null, "c": "A", "a": ["Uzaklık 57 ile 95'in ortak böleni olmalıdır; en fazla değer <span class=\"nw\">EBOB(57, 95) = 19</span> m'dir. A ile B arasında 57 : 19 = 3 aralık vardır; uçlara direk takılmadığından 3 − 1 = 2 direk takılır. B ile C arasında 95 : 19 = 5 aralık → 5 − 1 = 4 direk. Toplam 6 direk."], "t": "8: aralık sayıları toplanmış; 10: uçlara da direk takılmış; 7: iki bölüm tek bir düz yol gibi düşünülüp B ayağı unutulmuş", "d": "B ayağında köprü iki bölüme ayrılır; iki bölümü ayrı ayrı düşününüz. Ayakların üzerine direk takılmadığı için her bölümde direk sayısı aralık sayısından 1 eksiktir.", "ses": "b03"}, {"no": 4, "on": "<p>Bir baharatçı, pul biber ve kimyonu birbirine karıştırmadan, hiç artmayacak şekilde birbirine eş ve olabilecek en ağır paketlere koyacaktır.</p>", "g": "<svg viewBox=\"0 0 680 410\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAHKAvgDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAAECAwQFBgcI/8QASBAAAgIBAgQFAgMDCAkCBgMBAQIAAxEEIQUSMUEGEyJRYTJxFIGRI0KxBxUzUpKhwdEWJTRDU2JyguEkNRdUk6Lw8SZEY3P/xAAZAQEAAwEBAAAAAAAAAAAAAAAAAQIDBAX/xAAnEQEBAAIBAwUBAQADAQEAAAAAAQIRAxIhMQQTMkFRIhRCYXEzI//aAAwDAQACEQMRAD8A9OhCEAhCEAhCEAhCJAWAhCARYkICwiReVj0U/pGwkI7kf+qYmCOuB9yJG4nVJFjC9Y3NqD7uInnU/wDHq/tiNw1T4SP8Rp++oq/tiIdVpv8A5ir+2I6oaqWLIRqaO19X9sRfxNH/AB6/7YkdUOmpYSPzqv8Aip/aEcLaz0sQ/wDcJPVDVOzEic6/11/tCLkHow/WNw1Swh+Y/WGI3DQhFwfaJJ2gQhCAQhCAQhCARYkIBCEICwhAwCESEBYRIQCLEi5EAhAAnoCfsIvK39Vv0gJFhyt1x+u0QkL1ZR92EjcTqlhGG2odbax93EQ30D/f1D/vEbhqpISI6mhdzqav7YgNTQdxqKiPcOJHVE9NSwkX4nTjrqav7Yi/iKP+PX/bEdUOmpISP8RR/wAer+2IvmVnpYn9oR1RHTT4RAynoyn7ERdvcfrJ6oaohD7QwfYxtAhCEkEIQgEIRYCRYkWAQhCAQiRYBCEJAIQhJBCEIBCEIBCEIBCEIBCEIBCEIBCEIBCEIEUWEIBCEIAIQhAIYhCAQMIQMniniHTcMsekVvfeo3rX0gfczCt8Y8QaxQlFFIbpgFsfeT+K9OE4jXfgYsQZ/Kcy7lSwx9iB1E4uTkyl1HZx8eNm61bvE/GbcFdWQucEIo3MpXcV4neSDxDUEknYWcv8JRVs2P6hynoPaMe0qxZPUR1/zmPVlftt0YnW63VFvXqtSVLerN7dYnnWrlhdYxOwDWkgxoxYgLPyEdB7RHWnIQv6T3PaRup1ApsW3lezKH905zn7yyGFKFn5MDYvk7yE0o9g8z1IPpI9/tEqrIf1MShP73b8pG6ai0bediCqqT0PvJvw9LUlmJPMMco65+JVRlYhayrBdwPb8/aWxqLFTCqvpx2zzfaO4mRLG9JFZzjIHXEmZVIWvARgRhh3xKws/beiv0nqc4YflJBWj5AsZ164bfHyJHc0t2OzLYjHmD9QRjHxmTIW5VApwFHUGVq352HK7+VjfI+o/Esl8BHLHlQ9M9fgxuo1D+dSpV > → 1, 2, 5 ya da 10. Sıra sayısı 120 : 1 = 120, 120 : 2 = 60, 120 : 5 = 24 ya da 120 : 10 = 12 olur. 20 sıra için bir sırada 6 fidan gerekir; 6, 50'yi bölmez."], "t": "20, toplam 120'nin bölenidir; \"her sırada tek tür\" koşulu gözden kaçarsa olabilir sanılır.", "d": "“Her sırada tek tür” koşulu, çam ve ladin fidanlarının ayrı ayrı sıralanması demektir. Toplam fidan sayısını bölen her sayı uygun olmaz.", "ses": "b06"}, {"no": 7, "on": "<p>Bir fırında sabah pişirilen poğaça ve simitlerin sayıları ile öğlene kadar satılanların sayıları aşağıda gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 920 520\" width=\"920\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAGtAvgDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAAECBAUDBgf/xABDEAACAgIABAMFBQcCBQMEAwEBAgADBBEFEiExE0FRBiJhcYEUMpGhsRUjM0JSwdFiciRDU+HwB4LxFjRzkkRjooT/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/xAAjEQEBAAICAgICAwEAAAAAAAAAAQIRAyESMQRBE1EUImEy/9oADAMBAAIRAxEAPwD6VFCEy0cJGG4Djkdw3AlHI7huQShFDcoI4tw3AcIoQCEIQHCLcNwHCEIBHuR3DcCW45Dce4EoSO4bgShI7huBKEW4bgOKLcNwCEIQCEIoDhCEAhCEAhCEBQhCAQhCA4obhAcRhCBF35ELHymNfYyWGz1mnm9KAfLfWZdpGuhB+clI425Ssw6Hn8iJTtZmPM7czRZWRTjMGtYAEe6BKWJxanKyjjhWB77ImNzenTxutrlScp2Z0JDHR2YMD5De4EMvkAPU9JU06Vg6906luoaP3jMp+I4WN/Hz8ev4GwbkB7S8IU6GW1v/AOOpj/aTyjUxt9R6aky7WZ5Ov2rwVI5KMp//AGgf3mjT7SUuOmJb9XEnnj+y8Wf6egUzpvpMevjaOdfZbB/7wZcq4njMQrlqi3Qc46fiJqZysXDKJHudyMkZGbZOKBhAIQiJgBihCARGEIChCLZ9YDigSfWLcAMUe4oBFAxbgBkTGYjAURjkdwFFqMxEyAkdR7iJgKECYjARijigIxRmKBGEDCBuwijlBDUNw3AIQhAICEIEoRbhICOKAlDhFHAIQhAIQhAYhFuPcgNRajigEIQgOEUJQGEIQCOKEAhDUIDhFCAQhCA4RRwCEUID3FuEIBCEIBCEIBDUIbgEIQgJgGBVgCD3BmZlYnhbKqWTyM04/h3Eg+W+1hv/AG5XQWK1rSth19f7zEa7Je5moufHyKveR620dfH4T13/AKjYipZQ1IFbX0mtXJ6cwbevzng+G1ZAzrxf+7sTSsp6lt/2nlssyr6mNl4o7XcW4tZaUt4llb7ACzX5CXFoLKDc9jk9 font-family=\"Source Sans 3\",sans-serif font-size=\"28\" font-weight=\"800\" fill=\"#c2255c\" text-anchor=\"middle\">Satılan: 60 tane</text></g></svg>", "son": "<p>Satılmayan ürünlerin tamamı, ürünler karıştırılmadan ve her tepside eşit sayıda ürün olacak şekilde tepsilere dizilecektir. Bir tepsiye <u style=\"white-space:nowrap\">en fazla</u> 40 ürün sığmaktadır.</p>", "k": "Buna göre, bu iş için <u style=\"white-space:nowrap\">en az</u> kaç tepsi gerekir?", "sec": ["2", "3", "5", "7"], "secg": null, "c": "B", "a": ["[Deneme esinli] Kalan poğaça: 120 − 60 = 60; kalan simit: 90 − 60 = 30. Bir tepsideki ürün sayısı 60 ile 30'un ortak bölenidir. En az tepsi için bu sayı en büyük olmalıdır: <span class=\"nw\">EBOB(60, 30) = 30</span>; 30 ürün tepsiye sığar (en fazla 40). 60 : 30 + 30 : 30 = 2 + 1 = 3 tepsi."], "t": "7: satış düşülmeden <span class=\"nw\">EBOB(120, 90) = 30 ile 4 + 3</span> alınmış; 2: yalnız poğaça tepsileri sayılmış", "d": "Tepsiye dizilecek olanlar sabah pişirilenler değil, satılmayan ürünlerdir. Önce satılanları çıkarınız; sonra tepsi sınırını kontrol ediniz.", "ses": "b07"}, {"no": 8, "on": "<p>Bir belediye, yeni açılan düz bir otobüs hattı boyunca eşit aralıklarla durak yapacaktır. Hattın başlangıcındaki terminal, okul ve hattın sonundaki hastane aşağıda gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 1024 386\" width=\"1024\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAEfAvgDASIAAhEBAxEB/8QAGwABAQADAQEBAAAAAAAAAAAAAAEDBAYFAgf/xABCEAACAgIAAwMICAUCBQQDAAAAAQIDBBEFEiExQVEGEzNhcZGhsRQiMlJicoHBI0Jjc9FDghU0orLhJFOD8BYlwv/EABgBAQEBAQEAAAAAAAAAAAAAAAABAgME/8QAJBEBAQEBAAICAQQDAQAAAAAAAAERAhIhA0ExEyJRcTJhkYH/2gAMAwEAAhEDEQA/AP1IAAAAAAAAAAAAAAAAhQAIUAAAAAAAAAAAAAAAAAQoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB :nowrap\">en az</u> kaç durak yapılır?", "sec": ["6", "10", "11", "12"], "secg": null, "c": "C", "a": ["Duraklar arasındaki uzaklık hem 1350'yi hem 2250'yi bölmelidir. <span class=\"nw\">EBOB(1350, 2250) = 450</span>'dir; ancak uzaklık 400 m'yi geçemez. 450'nin 400'den küçük en büyük böleni 225'tir. Hat 2250 : 225 = 10 aralığa ayrılır; başta ve sonda da durak olduğundan 10 + 1 = 11 durak yapılır."], "t": "6: 400 m sınırı unutulup 450 m alınmış; 10: aralık sayısı durak sayısı sanılmış; 12: okul durağı ayrıca eklenmiş", "d": "Okulun önünde de durak olacağı için aralık hem terminal–okul uzunluğunu hem bütün hattı bölmelidir. 400 m sınırını ve hattın iki ucundaki durakları unutmayınız.", "ses": "b08"}, {"no": 9, "on": "<p>Defne, bir roman ile bir bilim kitabını aynı gün okumaya başlamıştır. Kitapların sayfa sayıları aşağıda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 944 520\" width=\"944\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAGjAvgDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAAECAwQFBgf/xABVEAACAQMBBQMHBwQNDAIBBQAAAQIDBBEFEiExQVETYXEGIjJSgZGhFBVCcrHB0SMzYqIWJCU0NVVzkpOjssLSREVTVGNkgoOElOHwJkOzNmV0pPH/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/xAAiEQEBAAICAgMBAQEBAAAAAAAAAQIRAxIxQRMhUQRhFCL/2gAMAwEAAhEDEQA/APRUXi+Xh956g8rB4vorqmeqzuRlaAAAgAAAAAAoAAAAAAAAAAGIYAAAADEMAAAAAAAAAAAAOI8AAhiAaJviQJviAhDAIQLiAIKk+IhviI0gAAAADAAAAAAAAAAAAAAIBhuEADDkAAIAAAAAABDwAAAAAAAAIBgAgAMgABkMgAhiAAAAAAAAExgAhDYgAAAAAAAQDwIAAAABAAADAAEAAAgG0AHl+F9B+J6pb4p9x5Wf78h4s9RTf5KL/RRlamk+j9wYfR+44VDTLbUNR1WVzK5lKF3sxULqpBRjsReEoyS6mheTmnrg71f9dW/xAdXD6MNl9H7jmryfsVwne/8AfVf8ROOh2Skvy1/x/wBdqfiB0MPoww+hwtJ0+jd6cqta5vpVO1qwb+VzXo1JRXPoka3otu/8q1BeF5MDpBg5nzLRXC91Ff8AVyM2o6c7elQlS1DUI7dzSpy/bTfmylh8gO4IwfM0P4x1Nf8AVP8AAPmeP8Z6p/3P/gDeBg+af/3TU/8AuF/h ,sans-serif font-size=\"26\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">192 sayfa</text></g></svg>", "son": "<p>Defne her gün romandan eşit sayıda sayfa, bilim kitabından da eşit sayıda sayfa okumuştur. İki kitabı da aynı gün bitirmiştir. Okuma 30 günden kısa sürmüştür.</p>", "k": "Buna göre, Defne'nin bir günde okuduğu toplam sayfa sayısı <u style=\"white-space:nowrap\">en az</u> kaçtır?", "sec": ["5", "20", "30", "40"], "secg": null, "c": "B", "a": ["Gün sayısı hem 288'i hem 192'yi bölmelidir; yani 288 ile 192'nin ortak bölenidir. <span class=\"nw\">EBOB(288, 192) = 96</span>'dır ve ortak bölenler 96'nın bölenleridir. Günlük toplam sayfanın en az olması için gün sayısı en fazla olmalıdır: 96'nın 30'dan küçük en büyük böleni 24'tür. Günde 288 : 24 + 192 : 24 = 12 + 8 = 20 sayfa. (5: 30 günden kısa koşulu unutulup 96 gün alınmış; 30: 16 gün alınmış; 40: 12 gün alınmış) [Deneme esinli]"], "t": "", "d": "Gün sayısı iki kitabın sayfa sayısını da bölmelidir. Günlük sayfanın en az olması için gün sayısı en fazla olmalıdır; 30 gün sınırını unutmayınız.", "ses": "b09"}, {"no": 10, "on": "<p>Bir bilim şenliğindeki sayı makinesinin ekranına iki doğal sayı girilmektedir. Makine her adımda büyük sayıdan küçük sayıyı çıkarır ve büyük sayının yerine bu farkı yazar. Ekrandaki iki sayı birbirine eşit olduğunda makine durur.</p>", "g": "<div style=\"display:flex;flex-direction:column;align-items:center;gap:2.5mm\"><svg viewBox=\"0 0 370 305\" width=\"54mm\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAJzAvgDASIAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAEFAgMEBgf/xABJEAABAgMDCAUIBwcEAgMBAAAAAQIDBBEFEyEGEhYxQVFSkRQVVGFxFyIyU1Vyk7EHM0JWYoGSIzQ1NkNjcyQlREVGoSaCg8H/xAAaAQEBAAMBAQAAAAAAAAAAAAAAAQIDBAUG/8QAJxEBAAIBAwUBA l=\"#000000\"/><rect x=\"264.0\" y=\"10.0\" width=\"66.0\" height=\"40.0\" rx=\"6\" fill=\"#e6f4f7\" stroke=\"#1f7a8c\" stroke-width=\"1.6\"/><text x=\"282.0\" y=\"36.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">4</text><text x=\"312.0\" y=\"36.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">4</text><text x=\"297.0\" y=\"69.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">3. adım</text><text x=\"297.0\" y=\"87.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#c2255c\" text-anchor=\"middle\">makine durur</text></svg></div>", "son": "<p>Makinenin çalışmasına ait bir örnek yukarıda gösterilmiştir. Makinenin ekranına 187 ve 119 sayıları girilmiştir.</p>", "k": "Buna göre, makine durduğunda ekranda görünen sayı kaçtır?", "sec": ["7", "11", "17", "34"], "secg": null, "c": "C", "a": ["187 − 119 = 68 → (68, 119); 119 − 68 = 51 → (68, 51); 68 − 51 = 17 → (17, 51); 51 − 17 = 34 → (17, 34); 34 − 17 = 17 → (17, 17). Makine 17'de durur. İki sayının ortak bölenleri farklarını da böler; bu yüzden her adımda ortak bölenler değişmez ve makine iki sayının EBOB'unda durur: <span class=\"nw\">EBOB(187, 119) = 17</span>. (7: 119 = 7 · 17 çarpanı seçilmiş; 11: 187 = 11 · 17 çarpanı seçilmiş; 34: son adım yapılmamış) [LGS kuralı]"], "t": "", "d": "Makine her adımda büyük sayıdan küçüğü çıkarır. İki sayının ortak bölenleri farklarını da böler; bu yüzden makine EBOB'da durur. Son adımı atlamayınız.", "ses": "b10"}, {"no": 11, "on": "<p>Bir perde atölyesinde uzunlukları 252 cm ve 396 cm olan iki desenli kumaş vardır. Kumaşların üzerindeki desen, aşağıdaki gibi her 6 cm'de bir tekrar etmektedir.</p>", "g": "<div style=\"display:flex;flex-direction:column;align-items:center;gap:2.5mm\"><svg viewBox=\"0 0 960 295\" width=\"100mm\" xmln OB(252, 396) = 36</span>; 36'nın bölenlerinden 6'nın katı olanlar 6, 12, 18 ve 36'dır → 4 değer. (2. yol: kumaşlarda 42 ve 66 desen vardır; bir parçadaki desen sayısı <span class=\"nw\">EBOB(42, 66) = 6</span>'nın bölenidir: 1, 2, 3, 6 → 4.)"], "t": "9: desen koşulu unutulup 36'nın bütün bölenleri sayılmış; 5: 36'nın 6 ve daha büyük bölenleri sayılıp 9 da alınmış; 6: desen sayılarının EBOB'u cevap sanılmış", "d": "Parçalarda desen bölünmeyeceği için parça uzunluğu hem ortak bölen hem de 6'nın katı olmalıdır. Soru en uzun parçayı değil, kaç farklı uzunluk olabileceğini soruyor.", "ses": "b11"}, {"no": 12, "on": "<p>Bir maket atölyesinde uzunlukları aşağıda verilen dört ahşap çıta vardır.</p>", "g": "<svg viewBox=\"0 0 975 340\" width=\"975\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAEJAvgDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAAECAwQGBQf/xABQEAACAAMCCQkEBQkFCAIDAAAAAQIDEQQSEyExQVFUYZGSBRQVUlNxgaHRBhaT8CIjMkRiNEJDVWN0orLhJnKjscIkMzVFZIPB8QeCNkbD/8QAGAEBAQEBAQAAAAAAAAAAAAAAAAECAwT/xAAeEQEBAQEBAQEBAQEBAAAAAAAAARESAhMDIVExQf/aAAwDAQACEQMRAD8A7rwQtw6IWI8T1JJrYO9D8oiNV0oAvIafcKukapoYBUdROmgPAAqOuwj4Dx6AMdf7RLF9y/8A6HoqrzHmKO57Rw1SdbHTH/fPSU5dnBvZNVYk9g6Mgp67ODzBz1mlwb2QTo3nChHDpfo4PMOcLs4fMCdAoiHOF2cIO0LqQ+YE8W0KbSKtH4IQVofZwgSox0IYdv8ARw72GG/BCBPGCq8lCGH/AAQ+YYf8EPmUTo9gYyCn/gg8x4d9SDzAk1tCn4iOHr+ZD5hhv2cG5kEqbQptI4d9nB5hzh9nCBOmPKJp7N5DD/s4Qw37OACdHoW8KEcN+zgDDfggKJBQjh/2cIsP+CHewJhRaCDnvs4d7Gp/7OHzIJUWgKLQRc/9nB5hh/wQeYEqLR4hdWlEcO+pB5iw/wCzh8wLKKmVCqR5x+CEXOPwQeYFlH1QpooytWj8EAK0/hh3sL/FjTSyBTbQhzj8EAYf8EAP4su/iQqfiRXzj9nCPD/s4An8SoO6yGH/AAQeYc4/BB5lE6MKMjh31IPMOcPqQ+YEqPZvCj0reQw76kHmGGfUg3MH8Tp3BjIqf+zg8ww77ODzCHRjppIYfTLg8ww/7KDzAlQKIWH/AGcAYf8AZwASxdUVBYd9nB5jw77ODzAdEGLQRc99nD5iw77OHzAsxZ4Qos1SHOH2cIc4f #495057\" stroke-width=\"2\" fill-opacity=\".94\"/><text x=\"246.0\" y=\"353.1\" font-family=\"Source Sans 3\",sans-serif font-size=\"26\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">40 cm</text></g></svg>", "son": "<p>Atölyedeki bir öğrenci bu çıtalardan ikisini seçecektir. Seçtiği iki çıtayı hiç artmayacak şekilde birbirine eş ve olabilecek <u style=\"white-space:nowrap\">en uzun</u> parçalara kesecektir. Öğrenci, elde edeceği parça sayısının <u style=\"white-space:nowrap\">en az</u> olmasını istemektedir.</p>", "k": "Buna göre, öğrencinin seçmesi gereken çıtalar hangileridir?", "sec": ["K ve N", "L ve M", "M ve N", "K ve L"], "secg": null, "c": "D", "a": ["Her ikili için parça uzunluğu EBOB, parça sayısı (toplam uzunluk) : EBOB'dur. K ve L: EBOB 20 → 2 + 5 = 7 parça; M ve N: EBOB 29 → 4 + 5 = 9 parça; K ve N: EBOB 5 → 37 parça; L ve M: EBOB 4 → 54 parça. En az parça K ve L ile elde edilir."], "t": "M ve N: en uzun parçayı veren ikili seçilmiş; parça en uzun olsa da toplam uzunluk büyük olduğu için parça sayısı en az değildir.", "d": "En uzun parçayı veren ikili, en az parçayı vermeyebilir. Her ikili için parça sayısını (toplam uzunluk : EBOB) ayrı ayrı hesaplayıp karşılaştırınız.", "ses": "b12"}, {"no": 13, "on": "<p>Bir takı tasarımcısı, 60 kırmızı ve 165 beyaz boncuğun tamamını kullanarak bir kolye yapacaktır. Kolyede boncuklar, aşağıdaki gibi kırmızı ve beyaz bloklar hâlinde sırayla dizilecektir.</p>", "g": "<svg viewBox=\"0 0 920 315\" width=\"920\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAEEAvgDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAQFAgMGAQcI/8QAPhAAAgIBAQYDBgQEBQMFAQAAAAECAwQRBRIhMUFRExRhBiJScYGRMkKhsQcjYtEVJDNDwXLh8BZjc4KS8f/EABoBAQEBAQEBAQAAAAAAAAAAAAABAgMEBQb/xAAtEQEAAwABBAE  cinsinden bir doğal sayıdır ve 1 m'den kısadır.</p>", "k": "Buna göre, terzi <u style=\"white-space:nowrap\">en az</u> kaç parça elde eder?", "sec": ["3", "15", "16", "30"], "secg": null, "c": "B", "a": ["Parçalar tek renkli olacağından şerit, dikiş yerinden de kesilmek zorundadır; yani iki kumaş ayrı ayrı bölünür (bütünler bağımsızdır). Parça uzunluğu 112 ile 128'in ortak bölenidir; en az parça için en uzun parça seçilir: <span class=\"nw\">EBOB(112, 128) = 16 cm (1</span> m'den kısa). 112 : 16 + 128 : 16 = 7 + 8 = 15 parça."], "t": "3: şerit tek bütün sanılıp 240'ın 100'den küçük en büyük böleni 80 alınmış; 16: parça uzunluğu bulunup bırakılmış; 30: 8 cm'lik parçalar alınmış", "d": "Parçalar tek renkli olacağı için şerit dikiş yerinden de kesilir; iki kumaş ayrı ayrı bölünür. Parça uzunluğunun 1 m'den kısa olduğuna dikkat ediniz.", "ses": "b14"}, {"no": 15, "on": "<p>Bir süsleme atölyesinde 176 cm uzunluğundaki mavi kurdele ile 208 cm uzunluğundaki sarı kurdele, birbirine eş ve olabilecek <u style=\"white-space:nowrap\">en uzun</u> parçalara kesilecektir.</p>", "g": "<svg viewBox=\"0 0 990 340\" width=\"990\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAEFAvgDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAAECAwQGBQf/xABHEAACAQICBgQJCQcEAgMBAAAAARECAwQhBRIxQVFhcYGRkgYTMlNUodHh8BQVIkJDRFKCkxYjMzRisfEkcqLBY3MmNYNk/8QAGgEBAQEBAQEBAAAAAAAAAAAAAAECAwQFBv/EACoRAQABAgUDBAIDAQEAAAAAAAABAgMEERIUURUxUgUTIZEyQRYiYUJx/9oADAMBAAIRAxEAPwD6QAAeV6BufQyidxc9j6Cnf1mKmoIjM5kiOwwsE82ukhcVL1U+JNld2vYk1M7JCvm9txpPEx5xn0TRTfySjP6qPnVv/wC0xSfnGfRNFL/SW+hGqSp6SGlIkSOjmUBAAAQApGACHIiAQxDABAGZQCAJAACQbIEDFMb/AFA6mQEsG2KZ2sMuKAAYMWfSFAdQZ8A2bgF2i7Rv4yF1EBImANv4QUSIG3wXYKX8IBgKauApewBuRZhmGfFAAMMxMBZjF1h0MgIAFIZ8PUFJ57pFnANcZ7A2f4ATYTIMMoATAT idir."], "t": "22: kurdeleler ayrı ayrı kesilmiş gibi 10 + 12 hesaplanmış; 24: parça sayısı bulunmuş; 13: sarı kurdelenin parça sayısı alınmış", "d": "Kurdeleler üst üste olduğundan aynı noktadaki kesim tek kesimdir. Parça sayısını değil, kesim sayısını sayınız; kurdelenin ucu kesim sayılmaz.", "ses": "b15"}, {"no": 16, "on": "<p>Bir okulun 8. sınıflarından A şubesinde 34, B şubesinde 46 öğrenci vardır. Beden eğitimi öğretmeni, okulun halk oyunları gösterisi için her şubeyi kendi içinde gruplara ayırmıştır.</p>", "g": "<svg viewBox=\"0 0 1545 610\" width=\"1545\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAEsAvgDASIAAhEBAxEB/8QAHAAAAAcBAQAAAAAAAAAAAAAAAAECAwQFBgcI/8QASRAAAgEDAgIIAwQIBQQBAgYDAQIDAAQRBSESMQYTIkFRYXGBMpGhFEKxwQcVI1JygtHhM0NikvAkU6LxFiWyJjREY4PCZHOT/8QAGgEAAwEBAQEAAAAAAAAAAAAAAAIDAQQFBv/EADERAAICAQMDAgMHBAMAAAAAAAABAhEDEiExBEFREyIUMmEFQlJxgbHBkaHh8SPR8P/aAAwDAQACEQMRAD8A1mTR5pO9CkKiqFFR1gApVJoVoCs0VFmhQArNFQoUGAoxRUYrQDzQoqOgAUKFETQAeaPNJFHQAdChmhQAKPNFQrTA80KKhQAKFChQAYoUVCgwOioUK0ACjoqGaADoqGaKgA6FChWgHRZoUVBgqhRZoUADNDNFQzWgKzQzSc0dBgdCizRZoAOjzSc0M0AHmhRZos1pgrNAmk5ojQArNDNJzRZrQDzRE0RNJzQAvNDNIzRFqAFE0WaQTRZrQF8VEWpBaiJrAFFqSTRE0kmsZoomkMaImkFqVsZIMmkE0RNJJqUmUSATRZoiaLNQZVElPgHpTgplD2R6U6ppkYxuQ9s00TS5T+0NNk1jYJDsR7PvTwO1MQnsn1p0cqEDF5o6TR5pjA6OizRg1hoZoUM0M1gAzQzWeuNWu49VkgE8axrKBwsoyV8tt6sotTt+EdZKAaRTix3CSJ+aLNRhqFswPBMjEDlxVXxa/wBbNwNbMoyRxcWRt7UOUbqw0y5ouqOmI51kUHPOnOMDmaYUXmjzUFdWsXlES3KFyeEDfn4VKSRXGQdqxb8G8DmacB2FM8Qp0HYVqMY1dWlvfW7W91CssTYyjctuVUE3RvSYpy0Ns0TRsChSVgVI3B51par5/wDGf1p1KS4YrinyhmbQ7O/C3ThgWyXQMOFj+6QRyJ3HgcUKmWTMbeRB3MCAeXLf8M0KzXLyboj4JdCizQzViIKGaFCtAOjpNDNAB0M0nNKzQAeaFFQoAVQoqOgA6FFmhmtMDoqGaKgA6Oio6ABRiioZoAVRUWaGaDBVFmizQrQDzQzRUKADzQpNHmgA6GaLNDNAB0VDNDNaAdFmhm  12'nin bölenidir: 2, 3, 4, 6 ya da 12. 12 kabul edilmez (10'dan az). 2 için yedek kalmaz, 3 için 1 yedek kalır. 4 için yedek sayısı 2, 6 için 4'tür. Grup sayısı 4'lü gruplarla 8 + 11 = 19, 6'lı gruplarla 5 + 7 = 12 olur; en az 12. (5: 10'dan az koşulu unutulup 12'li gruplar alınmış; 19: 4'lü gruplar alınmış; 26: 3'lü gruplar alınmış) [LGS kuralı: iki sayının ortak böleni farklarını da böler.]"], "t": "", "d": "Yedek öğrenci sayıları eşitse iki şubenin farkı tam gruplara ayrılır. Grup büyüklüğü için 10'dan az ve yedek sayısı 1'den fazla koşullarını birlikte kontrol ediniz.", "ses": "b16"}, {"no": 17, "on": "<p>Düz bir yolun iki bölümünün kenarına ağaçlar dikilmiştir. Yolun birinci bölümünde 12 m, ikinci bölümünde 18 m aralıklarla ağaç vardır. Yolun başında, sonunda ve iki bölümün birleştiği noktada da birer ağaç bulunmaktadır.</p>", "g": "<div style=\"display:flex;flex-direction:column;align-items:center;gap:2.5mm\"><svg viewBox=\"0 0 1376 265\" width=\"100mm\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCACSAvgDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAAEEBQYCAwf/xABTEAABAwIEAgUKAwMIBQkJAAABAgMRAAQFEiExE0EGUWGR0RQVIjJSU3GBoaIjVJJCscEkMzVDgrLh8BZERXOTJjRVcoOjs9LxJTZiY2R0hJTi/8QAGQEBAAMBAQAAAAAAAAAAAAAAAAECAwQF/8QAJhEAAgIBBAIDAQADAQAAAAAAAAECEQMSEyFRMUEUImEEMlJxI//aAAwDAQACEQMRAD8A2kURTorsOE5inFOipBzFEV0YAJOkUCD8KA5iiK6iioBzFEU4oigFFEU4oipAooinziRO8URUA5g0RXUUVIOYpxTijWgOYoiuqKA5iiKYIUmUkEHYiiKWBUV1SoBUU4pxQHMUoruKIpYOYoinFEUsHMURXUURSwcxRFOKcUsHMURTiiKWQKKIp0RSwcxRFdRRFLAopRXX8dqIpZIooinFEUsCiiKcURU2DmKIrqKIqLAooinRFTYFFEU4oilgUURTinFRYOYoiuooilg5iiK6iiKWDmKK6ikYG5ilgUURXUa0UsCiiKdEUAooiuqVAKKIrqilg5iiK6oqAcxTinRQCiiKdFSSKKIp0UAopxTpVACiKcaxRQCiinFOKA5iinpTigOacU6IoSKKIp60RQCiiKcUba0ARRTooBUU4ooBRRTooAiiBToqCDmK ize=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">18 m</text><line x1=\"10.0\" y1=\"78.0\" x2=\"167.9\" y2=\"78.0\" stroke=\"#000000\" stroke-width=\"1.2\"/><polygon points=\"10.0,78.0 17.0,81.5 17.0,74.5\" fill=\"#000000\"/><polygon points=\"167.9,78.0 160.9,81.5 160.9,74.5\" fill=\"#000000\"/><text x=\"89.0\" y=\"95.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">1. bölüm: 228 m</text><line x1=\"167.9\" y1=\"78.0\" x2=\"330.0\" y2=\"78.0\" stroke=\"#000000\" stroke-width=\"1.2\"/><polygon points=\"167.9,78.0 174.9,81.5 174.9,74.5\" fill=\"#000000\"/><polygon points=\"330.0,78.0 323.0,81.5 323.0,74.5\" fill=\"#000000\"/><text x=\"249.0\" y=\"95.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">2. bölüm: 234 m</text></svg></div>", "son": "<p>Belediye, mevcut ağaçların hiçbirini sökmeden aralarına yeni ağaçlar dikecektir. Dikimden sonra yol boyunca ardışık bütün ağaçlar arasındaki uzaklıklar birbirine eşit olacaktır.</p>", "k": "Buna göre, belediye <u style=\"white-space:nowrap\">en az</u> kaç ağaç diker?", "sec": ["33", "44", "45", "78"], "secg": null, "c": "C", "a": ["Eski ağaçlar yerinde kalacağından yeni aralık hem 12'yi hem 18'i bölmelidir; en az ağaç için aralık en büyük seçilir: <span class=\"nw\">EBOB(12, 18) = 6 m (228 de 6</span>'ya bölünür). Yolun uzunluğu 228 + 234 = 462 m; 462 : 6 = 77 aralık → 78 ağaç. Mevcut ağaçlar 228 : 12 + 234 : 18 + 1 = 19 + 13 + 1 = 33'tür. Yeni dikilecek ağaç 78 − 33 = 45."], "t": "78: toplam ağaç sayısı; 44: baştaki ağaç için +1 unutulmuş; 33: mevcut ağaç sayısı", "d": "Mevcut ağaçlar sökülmeyeceği için yeni aralık hem 12'yi hem 18'i bölmelidir. Soru toplam ağaç sayısını değil, yeni dikilecek ağaç sayısını soruyor.", "ses": "b17"}, {"no": 18, "on": "<p>Bir süt toplama merkezindeki iki tankta bulunan sütün litre cinsinden miktarları, asal çarpanlarının çarpım 0\" fill=\"#000000\" text-anchor=\"middle\">2<tspan baseline-shift=\"super\" font-size=\"70%\">3</tspan> · 3<tspan baseline-shift=\"super\" font-size=\"70%\">2</tspan> · 11 L</text></g></svg>", "son": "<p>Tanklardaki sütler birbirine karıştırılmadan, hiç artmayacak şekilde birbirine eş ve olabilecek <u style=\"white-space:nowrap\">en büyük</u> hacimli bidonlara doldurulacaktır. Bir bidonun hacmi 24 L'dir. A tankındaki süt miktarı 1000 L'den azdır ve ifadedeki a bir doğal sayıdır.</p>", "k": "Buna göre, kullanılan bidon sayısı <u style=\"white-space:nowrap\">en fazla</u> kaçtır?", "sec": ["38", "53", "73", "113"], "secg": null, "c": "C", "a": ["Bidonun hacmi EBOB'dur: <span class=\"nw\">24 = 2<sup>3</sup> · 3</span>. B tankında 2<sup>3</sup> olduğundan EBOB'daki 2 çarpanı 2<sup>3</sup> ise a ≥ 3 olmalıdır. <span class=\"nw\">A = 2<sup>a</sup> · 15</span> &lt; 1000 olduğundan a en fazla 6'dır <span class=\"nw\">(2<sup>6</sup> · 15 = 960</span>; <span class=\"nw\">2<sup>7</sup> · 15 = 1920)</span>. Bidon sayısı en fazla a = 6 iken olur: 960 : 24 + 792 : 24 = 40 + 33 = 73."], "t": "38: a = 3 alınmış; 53: a = 5 alınmış; 113: 1000 L sınırı unutulup a = 7 alınmış", "d": "Bidon hacmi EBOB'a eşit olmalıdır: 2'nin kuvveti A'da da en az 3 olmalı. A tankındaki 1000 L sınırını unutmayınız.", "ses": "b18"}, {"no": 19, "on": "<p>Bir marangoz, 216 cm uzunluğundaki bir tahta ile hırdavatçıdan alacağı ikinci bir tahtayı, hiç artmayacak şekilde birbirine eş ve olabilecek <u style=\"white-space:nowrap\">en uzun</u> parçalara kesecektir. Kesilen parçaların her biri 18 cm uzunluğunda olmalıdır.</p>", "g": "<svg viewBox=\"0 0 1260 570\" width=\"1260\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAFYAvgDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAA " y=\"604.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"32\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">18 cm</text></g></svg>", "son": "<p>Hırdavatçıdaki tahtaların uzunlukları santimetre cinsinden birer doğal sayıdır ve 160 cm'den fazladır.</p>", "k": "Buna göre, marangozun alacağı ikinci tahtanın uzunluğu <u style=\"white-space:nowrap\">en az</u> kaç santimetredir?", "sec": ["162", "180", "189", "198"], "secg": null, "c": "D", "a": ["İkinci tahta 18'in katı olmalı ve 216 ile EBOB'u tam olarak 18 olmalıdır. 216 = 18 · 12 olduğundan tahta = 18 · k için k ile 12'nin 1'den başka ortak böleni olmamalıdır. 160'tan büyük 18'in katları: 162 = 18 · 9 (EBOB 54), 180 = 18 · 10 (EBOB 36), 198 = 18 · 11 (EBOB 18) ✓. En az 198 cm."], "t": "162 ve 180: 18'in katı seçilmiş ama EBOB 18'den büyük çıkmış, parçalar \"olabilecek en uzun\" olunca 18 cm olmaz; 189: 18'e bölünmez, EBOB 27 olur", "d": "İkinci tahta 18'e bölünmelidir; ama bu yetmez. 216 ile ikinci tahtanın EBOB'u tam 18 olmalıdır; daha büyük bir ortak bölen varsa parçalar 18 cm olmaz.", "ses": "b19"}, {"no": 20, "on": "<p>Ece bu yıl 11, ağabeyi Kaan 19 yaşındadır. Ece, her yıl doğum gününde ikisinin yaşlarının en büyük ortak bölenini (EBOB) hesaplayıp not etmektedir.</p>", "g": "<svg viewBox=\"0 0 1346 738\" width=\"1346\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAGhAvgDASIAAhEBAxEB/8QAHAAAAgIDAQEAAAAAAAAAAAAAAAECAwQFBgcI/8QAUBAAAgEDAQMHBwgGCQMDAwUAAAECAwQRBRIhMQYTQVGRktEUIlJhcYGhBxUWMlNUscEjJEJVcqIzNENigrLC4fAlNWNEZJM2c3SDo7PS4v/EABkBAQEBAQEBAAAAAAAAAAAAAAABAgMEBf/EACgRAQEAAgEEAgICAgMBAAAAAAABAhEDEyExQQQSIjIzUSNDJEJxFP/aAAwDAQACEQMRAD8A9GiTRGJNGGkkSRFEkVEkSIokAxoSGA08E44ZAaeCLKm+DwhrhkSzje+I1hbiNwB0B1IeGRrZdHqD1sbjj2C2X6wgDo3g471kPWUI    Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.

    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;

      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});

    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
