<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çözümler · Keşfet ve Çöz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--muted:#5b6478;--line:#dfe5ef;--bg:#f5f7fb;--card:#fff;--ss:#6741d9;--kk:#0b7285;--b:#d0700f;--ok:#2b8a3e;--warn:#c92a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif}
header{background:linear-gradient(135deg,#1c5fbf,#2f8fe0);color:#fff;padding:18px 16px 22px}

main{max-width:780px;margin:14px auto 40px;padding:0 16px}
nav.sec{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}nav.sec button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}

ol.sec{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
ol.sec li{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}ol.sec li.dogru{border-color:var(--ok);background:#ebfbee;font-weight:800}
.adim{border-left:4px solid var(--c);padding:6px 12px;margin:8px 0;background:#fff;border-radius:0 10px 10px 0;animation:gel .35s ease-out}
.adim b{color:var(--c)}@keyframes gel{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dug{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
button.btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.dikkat{background:#fff4e6;border:2px solid #f59f00;border-radius:12px;padding:10px 14px;margin:12px 0 4px}.dikkat b{color:#d9480f}
.tuzak{font-size:15px;color:var(--muted);margin-top:8px}
.cevap{font-weight:900;color:var(--ok);margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid var(--line);padding:8px 10px;text-align:left}th{background:#e3fafc;color:#0b7285;font-size:13px;letter-spacing:.06em}
.ses{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border-radius:12px;background:#eef2ff}

.ses span{font-size:14px;color:var(--muted)}
.gizli{display:none}
.tum{margin:4px 0 14px;font-size:14px}.tum a{color:#1c5fbf;font-weight:800}
@media (prefers-reduced-motion:reduce){.adim{animation:none}}
/* Canlandır (05.10.2026) */
.sek{display:flex;gap:6px;margin:12px 0 0;border-bottom:2px solid var(--line)}
.sek button{border:0;background:none;font:inherit;font-weight:900;font-size:15px;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);min-height:44px;position:relative;top:2px;border-bottom:3px solid transparent}
.sek button[aria-selected=true]{color:var(--c);border-bottom-color:var(--c);background:#fff8f0}
.sek .yeni{display:inline-block;font-size:10px;background:#2b8a3e;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.06em}
.cn{padding-top:10px}
.cn-yon{background:#eef6ff;border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:10px}
.cn-sahne{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;min-height:120px;overflow-x:auto}

.cn-adimci input,.cn-test input{width:84px;height:44px;border:2px solid var(--line);border-radius:12px;font:inherit;font-weight:900;text-align:center;font-size:18px}
.cn-test label{font-weight:800;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.cn-btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
.cn-btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.cn-btn[aria-pressed=true]{background:var(--ac,var(--c));color:#fff;border-color:var(--ac,var(--c))}
.cn-btn:disabled{opacity:.5}
.cn-hazir{display:flex;flex-wrap:wrap;gap:6px}

.cn-dur .iyi{color:var(--ok);font-weight:900}.cn-dur .kotu{color:var(--warn);font-weight:900}
.cn-df{margin-top:10px;overflow-x:auto}@media(max-width:480px){.cn-adimci>span{flex-basis:100%}.cn-h{font-size:12px;padding:5px 0}.cn-izg{gap:3px}.cn-sahne{padding:6px}}@media(max-width:480px){.cn-df table{font-size:13px}.cn-df td,.cn-df th{padding:4px 5px}}.cn-df summary{font-weight:900;cursor:pointer;padding:6px 0}.cn-say{color:var(--muted);font-weight:700}
.cn-df table{font-size:15px}.cn-df td{padding:5px 8px}.cn-df tr.cn-iyi td{background:#ebfbee}.cn-df tr.cn-kotu td{background:#fff5f5}.cn-df tr.cn-son td{outline:2px solid var(--c);outline-offset:-2px}
.cn-p{animation:cnGel .35s ease-out both}@keyframes cnGel{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cn-o{fill:#ffa94d;stroke:#d9480f;stroke-width:1}.cn-o2{fill:#e8590c}.cn-k{fill:#ffc9c9;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:3 2}
.cn-cerceve{stroke:#2b8a3e;stroke-width:3}.cn-et{font-size:13px;font-weight:800;fill:#5b6478}.cn-et.b,.cn-et2b{font-weight:900;fill:#1d2433}.cn-et2{font-size:11px;fill:#5b6478;font-weight:700}.cn-et2b{font-size:13px;fill:#fff}
.cn-ku{fill:#fff4e6;stroke:#ffa94d;stroke-width:1.5}.cn-kk{fill:#fff5f5;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:4 3}
.cn-tahta0{fill:#f1f3f5;stroke:#ced4da}.cn-tahta{fill:#c08552;stroke:#8d5a2b}
.cn-ek{stroke:#868e96;stroke-width:2}.cn-sinir{stroke:#c92a2a;stroke-width:3;stroke-dasharray:5 4}.cn-yay{fill:none;stroke:#f76707;stroke-width:2}
.cn-v1{stroke:#2b8a3e;stroke-width:3}.cn-v2{stroke:#c92a2a;stroke-width:3}.cn-kis{font-size:20px}.cn-bus{font-size:16px}.cn-bek{stroke:#c92a2a;stroke-width:5;stroke-linecap:round;opacity:.6}
.cn-kum{fill:#ffe8cc;stroke:#e8590c;stroke-width:3}.cn-kum2{fill:#495057}.cn-para{fill:#ffd43b;opacity:.85}.cn-buyuk{font-size:26px;font-weight:900;fill:#1d2433}
.cn-zem{fill:#adb5bd}.cn-kat{fill:#f1f3f5;stroke:#ced4da}.cn-katon{fill:#d3f9d8;stroke:#2b8a3e}.cn-katoff{fill:#ffe3e3;stroke:#e03131}
.cn-izg{display:grid;gap:4px}.cn-h,.cn-gb{border-radius:8px;text-align:center;font-weight:800;font-size:14px;padding:6px 0}.cn-h{background:#f1f3f5;transition:background .25s,transform .25s}
.cn-gb{background:none;color:var(--muted);font-size:12px}.cn-h.on{background:#ffa94d;color:#1d2433}.cn-h.yeni{transform:scale(1.18);box-shadow:0 0 0 3px #e8590c}
.cn-kartlar{display:flex;flex-wrap:wrap;gap:6px;padding:4px}.cn-kart{min-width:44px;padding:8px 10px;text-align:center;border-radius:10px;background:#fff4e6;border:2px solid #ffa94d;font-weight:900;animation:cnGel .3s}
.cn-kart.kare{background:#e7f5ff;border-color:#1c7ed6}.cn-bosk{color:var(--muted)}
.cn-cift{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 4px;font-weight:800}.cn-cift i{font-weight:600;color:#1c7ed6}
.cn-katlar{padding:4px}.cn-katsat{display:inline-flex;flex-wrap:wrap;gap:6px}.cn-kat2{background:#e6fcf5;border:1.5px solid #12b886;border-radius:8px;padding:3px 8px;font-weight:800;animation:cnGel .3s}.cn-sonsuz{font-weight:800;color:#0b7285}
.cn-onr{background:#f8f0fc;border:2px solid #ae3ec9;border-radius:12px;padding:10px 14px}.cn-kanit{padding:10px 4px 2px}
.cn-kay{display:inline-flex;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap}.cn-kay{max-width:100%}.cn-kay input{width:min(220px,70vw);accent-color:#d0700f}.cn-satir>*{min-width:0;max-width:100%}
@media (prefers-reduced-motion:reduce){.cn-p,.cn-kart,.cn-kat2{animation:none}.cn-h{transition:none}}
/* 05.10.2026 · KOŞUL ve LABİRENT motorları (SB 6.1.1) */
@media(max-width:560px){.soru [style*="grid-template-columns:repeat"]{grid-template-columns:1fr!important}}   /* çok sütunlu konuşma balonları telefonda alt alta */
.cn-kl{list-style:none;padding:0;margin:0;display:grid;gap:4px}.cn-not{color:var(--muted);font-size:14px}.cn-sonuc{margin-top:6px;font-weight:800}
.cn-secg{gap:6px}.cn-secad{font-weight:800;flex-basis:100%}.cn-secg .cn-btn{padding:8px 12px}
.cn-mv{fill:#74c0fc;stroke:#1c7ed6;stroke-width:1}.cn-tl{fill:#69db7c;stroke:#2b8a3e;stroke-width:1.5}
.cn-lab{display:grid;gap:4px;align-items:center;max-width:460px;margin:0 auto}
.cn-lc{min-height:44px;border-radius:8px;border:1.5px solid #ced4da;background:#fff;font:inherit;font-weight:900;font-size:16px;cursor:pointer;padding:0;color:var(--ink)}
.cn-lc.yol{background:#d3f9d8;border-color:#2b8a3e}.cn-lc.simdi{background:#2b8a3e;color:#fff;box-shadow:0 0 0 3px #b2f2bb}.cn-lc.kapali{background:#ffe3e3;border-color:#e03131;color:#c92a2a;text-decoration:line-through}
.cn-lok{color:#2b8a3e;font-weight:900;text-align:center}.cn-lcik{min-height:44px;border:0;background:none;font:inherit;font-weight:900;color:#d9480f;cursor:pointer;padding:0;white-space:nowrap;font-size:14px}.cn-lcik:disabled{cursor:default}

</style></head><body>
<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }
      if (!art && !o.sandalye) sv += `<rect x="10" y="10" width="${gen * hc}" height="${sira * hc}" fill="none" class="cn-cerceve"/>
        <text x="${10 + gen * hc / 2}" y="${H + 4}" class="cn-et" text-anchor="middle">${gen} ${o.birim || ""}</text>
        <text x="${W + 4}" y="${10 + sira * hc / 2}" class="cn-et" dominant-baseline="middle">${sira} ${o.birim || ""}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W + 70} ${H + 22}" role="img" aria-label="${N} ${o.ad || "kare"}, her sırada ${gen}">${sv}</svg>`;
      const r = o.kural ? o.kural(gen, sira, art, N) : null;
      let m;
      if (art) m = `<span class="kotu">✘</span> ${N} ${o.ad || "kare"} her sırada ${gen} olacak biçimde dizilince ${sira} tam sıra oluşur, <b>${art} ${o.ad || "kare"} artar</b>. Dikdörtgen olmaz: ${N} : ${gen} işleminde kalan ${art}.`;
      else m = `<span class="iyi">✔</span> <b>${N} = ${gen} ${x} ${sira}</b> · ${sira} sıra, her sırada ${gen} ${o.ad || "kare"}; hiç artmadı.` + (gen === sira ? ` <b>Kare oldu!</b> İki kenar aynı: ${gen}.` : "");
      if (!art && o.cevre) m += ` Çevre = 2 ${x} (${gen} + ${sira}) = <b>${2 * (gen + sira)} m</b>.`;
      if (r && r.msg) m += `<br>${r.msg}`;
      s.dur.innerHTML = m;
      const sutunlar = o.satir ? o.satir(gen, sira, art, N, r) : [gen, art ? `${sira} (+ ${art} artan)` : sira, art, art ? "olmaz" : (gen === sira ? "kare" : "dikdörtgen")];
      s.yaz(N + ":" + gen, sutunlar, !art && (!r || r.ok !== false));
    }
    ciz(g.get());
  }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {
    const N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });
    const g = adimci(o.etiket, 1, o.max || N, o.bas || 2, v => { sonK = v; });

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */

    if (alt.children.length) s.den.appendChild(alt);

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });

    const hc = [];

      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);

    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];

    function boya() {

      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };

    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };

})();

const V={"baslik": "Ortak Katlar ve EKOK", "kod": "LGS · M.8.1.1.2 · Fasikül 3", "ses": "", "bet": "BAĞLAM TEMELLİ SORU", "bad": "Bağlam Soruları", "s": [{"no": 1, "bas": "Listeleme yöntemiyle ortak katlar", "q": [{"k": "8 ile 28'in 120'den küçük ortak katlarını listeleme yöntemiyle bulunuz. EKOK(8, 28) kaçtır?", "a": ["8'in 120'den küçük katları: 8, 16, 24, 32, 40, 48, 56, 64, 72, 80, 88, 96, 104, 112.", "28'in 120'den küçük katları: 28, 56, 84, 112.", "İki listede de bulunanlar 56 ve 112'dir. Ortak katların en küçüğü 56'dır."], "c": "56 ve 112; EKOK(8, 28) = 56"}, {"k": "4 ile 26'nın 50'den büyük, 150'den küçük ortak katlarını yazınız.", "a": ["4'ün katları: 4, 8, 12, …, 48, 52, 56, …; 26'nın katları: 26, 52, 78, 104, 130, 156, …", "İlk ortak kat 52'dir: EKOK(4, 26) = 52. Ortak katlar 52'nin katlarıdır: 52, 104, 156, …", "50'den büyük ve 150'den küçük olanlar 52 ve 104'tür."], "c": "52 ve 104"}]}, {"no": 2, "bas": "Algoritma yöntemiyle EKOK", "q": [{"k": "32 ile 48'in EKOK'unu algoritma yöntemiyle bulunuz.", "a": ["32 ve 48'i birlikte 2'ye bölünüz: 16 ve 24; 8 ve 12; 4 ve 6; 2 ve 3. Dört kez 2'ye bölündü.", "2 ile 3'ün ortak böleni kalmadı. 2 ve 3'ü çizginin sağına taşıyınız.", "Sağdaki bütün sayıları çarpınız: EKOK = 2 · 2 · 2 · 2 · 2 · 3 = 96."], "c": "96"}, {"k": "34 ile 51'in 300'den küçük kaç ortak katı vardır?", "a": ["34 ve 51'i birlikte 17'ye bölünüz: 2 ve 3. Ortak bölen kalmadığı için 2 ve 3 sağa taşınır.", "EKOK = 17 · 2 · 3 = 102. Ortak katlar 102'nin katlarıdır.", "102 ve 204 sayıları 300'den küçüktür; 306 büyüktür."], "c": "2 tane"}]}, {"no": 3, "bas": "Asal çarpanlarla EKOK", "q": [{"k": "A = 2<sup>2</sup> · 3 · 7 ve B = 2<sup>3</sup> · 5 olduğuna göre EKOK(A, B) kaçtır?", "a": ["Aynı tabanları alt alta yazınız: A'da 5<sup>0</sup>, B'de 3<sup>0</sup> ve 7<sup>0</sup> gizlidir.", "Her tabanın büyük kuvvetini alınız: 2<sup>3</sup>, 3, 5, 7.", "EKOK = 2<sup>3</sup> · 3 · 5 · 7 = 8 · 105 = 840."], "c": "840"}, {"k": "A = 2<sup>2</sup> · 7 ve B = 2 · 7<sup>2</sup> sayılarının EBOB'unu ve EKOK'unu bulunuz. EBOB · EKOK çarpımının A · B çarpımına eşit olduğunu gösteriniz.", "a": ["Küçük kuvvetler: EBOB = 2 · 7 = 14. Büyük kuvvetler: EKOK = 2<sup>2</sup> · 7<sup>2</sup> = 196.", "EBOB · EKOK = 14 · 196 = 2744.", "A = 28 ve B = 98 olduğundan A · B = 28 · 98 = 2744. İki çarpım eşittir."], "c": "EBOB = 14, EKOK = 196; 14 · 196 = 28 · 98 = 2744"}]}, {"no": 4, "bas": "Özdeş parçalardan eş bütünler", "q": [{"k": "Genişliği 28 cm olan özdeş dolaplar kendi aralarında yan yana dizilerek bir sıra, genişliği 32 cm olan özdeş dolaplar da kendi aralarında yan yana dizilerek başka bir sıra yapılacaktır. İki sıranın uzunluğu eşit ve olabildiğince kısa olacaktır. Toplam kaç dolap kullanılır?", "a": ["Sıra uzunluğu hem 28'in hem 32'nin katıdır; en kısası EKOK'tur.", "28 = 2<sup>2</sup> · 7 ve 32 = 2<sup>5</sup> olduğundan EKOK(28, 32) = 2<sup>5</sup> · 7 = 224 cm.", "224 : 28 = 8 dolap ve 224 : 32 = 7 dolap. Toplam 8 + 7 = 15 dolap."], "c": "15 dolap"}, {"k": "Bir kavşaktaki iki trafik lambasından biri 24 saniyede bir, diğeri 44 saniyede bir yeşil yanmaktadır. İki lamba birlikte yeşil yandıktan sonra 20 dakika içinde kaç kez daha birlikte yeşil yanar?", "a": ["Birlikte yanma süreleri 24 ile 44'ün ortak katlarıdır: EKOK(24, 44) = 264 saniye.", "20 dakika = 1200 saniye. 264'ün 1200'e kadar olan katları: 264, 528, 792, 1056.", "264 · 5 = 1320 > 1200 olduğundan lambalar 4 kez daha birlikte yanar."], "c": "4 kez"}]}, {"no": 5, "bas": "Kalanlı ortak kat problemleri", "q": [{"k": "Bir kutudaki cevizler 6'şar sayılınca 2 ceviz, 8'er sayılınca yine 2 ceviz artmaktadır. Kutudaki ceviz sayısı 50 ile 100 arasındadır. Kutuda en fazla kaç ceviz vardır?", "a": ["Artan 2 ceviz çıkarılırsa kalan sayı hem 6'nın hem 8'in katıdır: EKOK(6, 8) = 24.", "Ceviz sayısı 24 · k + 2 biçimindedir: 26, 50, 74, 98, 122, …", "50 ile 100 arasında olanlar 74 ve 98'dir. En fazla 98 ceviz vardır."], "c": "98"}, {"k": "Bir öğretmen kalemleri 5'er 5'er dağıtınca 1 kalemi, 7'şer 7'şer dağıtınca yine 1 kalemi eksik gelmektedir. Kalem sayısı 100'den azdır. Öğretmenin en fazla kaç kalemi vardır?", "a": ["1 kalem eklenirse sayı hem 5'in hem 7'nin katı olur: EKOK(5, 7) = 35.", "Kalem sayısı 35 · k − 1 biçimindedir: 34, 69, 104, …", "100'den küçük olanların en büyüğü 69'dur."], "c": "69"}]}, {"no": 6, "bas": "LGS kurallarıyla EKOK", "q": [{"k": "Hiç işlem yapmadan EKOK(13, 65) değerini bulunuz ve nedenini açıklayınız.", "a": ["65 = 5 · 13 olduğundan 65, 13'ün katıdır.", "EKOK büyük sayıdan küçük olamaz; 65 hem 13'ün hem 65'in katı olduğu için ortak katların en küçüğüdür.", "Büyük sayı küçük sayının katıysa EKOK büyük sayıdır."], "c": "65"}, {"k": "İki sayının EBOB'u 6, EKOK'u 84'tür. Sayılardan biri 12 olduğuna göre diğeri kaçtır?", "a": ["İki sayının çarpımı EBOB ile EKOK'un çarpımına eşittir: 12 · x = 6 · 84.", "6 · 84 = 504 ve 504 : 12 = 42.", "Kontrol: EBOB(12, 42) = 6 ve EKOK(12, 42) = 84."], "c": "42"}]}], "k": [{"no": 1, "bas": "İlk üç ortak katını yazınız", "yon": "Her sayı ikilisinin en küçük üç ortak katını küçükten büyüğe yazınız.", "r": [{"n": "6 ve 9", "c": "18, 36, 54"}, {"n": "4 ve 30", "c": "60, 120, 180"}, {"n": "10 ve 35", "c": "70, 140, 210"}, {"n": "12 ve 14", "c": "84, 168, 252"}, {"n": "15 ve 25", "c": "75, 150, 225"}, {"n": "20 ve 24", "c": "120, 240, 360"}]}, {"no": 2, "bas": "EKOK'unu bulunuz", "yon": "Her sayı ikilisinin en küçük ortak katını (EKOK) yazınız. İsterseniz algoritma yöntemini kullanınız.", "r": [{"n": "9 ve 24", "c": "72"}, {"n": "12 ve 21", "c": "84"}, {"n": "10 ve 22", "c": "110"}, {"n": "14 ve 16", "c": "112"}, {"n": "15 ve 24", "c": "120"}, {"n": "6 ve 26", "c": "78"}]}, {"no": 3, "bas": "Üslü yazımdan EKOK", "yon": "Asal çarpanları verilen sayıların EKOK'unu üslü biçimde ve sayı olarak yazınız.", "r": [{"n": "2³ · 3 ve 2 · 3²", "c": "2³ · 3² = 72"}, {"n": "5 · 7 ve 5²", "c": "5² · 7 = 175"}, {"n": "2² · 5 ve 2 · 3", "c": "2² · 3 · 5 = 60"}, {"n": "3 · 11 ve 3² · 5", "c": "3² · 5 · 11 = 495"}, {"n": "2 · 7 ve 3 · 5", "c": "2 · 3 · 5 · 7 = 210"}, {"n": "2⁴ ve 2² · 3", "c": "2⁴ · 3 = 48"}]}, {"no": 4, "bas": "En kısa eşit kuleler", "yon": "Yükseklikleri santimetre cinsinden verilen iki tür özdeş kutu kendi aralarında üst üste konarak eşit yükseklikte ve olabildiğince kısa iki kule yapılacaktır. Kule yüksekliğini ve toplam kutu sayısını yazınız.", "r": [{"n": "20 ve 30", "c": "60 cm; 3 + 2 = 5"}, {"n": "16 ve 40", "c": "80 cm; 5 + 2 = 7"}, {"n": "21 ve 35", "c": "105 cm; 5 + 3 = 8"}, {"n": "30 ve 45", "c": "90 cm; 3 + 2 = 5"}, {"n": "14 ve 35", "c": "70 cm; 5 + 2 = 7"}, {"n": "12 ve 40", "c": "120 cm; 10 + 3 = 13"}]}], "b": [{"no": 1, "on": "<p>Bir kıyı şeridindeki iki deniz feneri, her biri kendi süresi dolduğunda kısa bir süre yanacak şekilde çalışmaktadır. Fenerlerin ilk 30 saniyedeki yanma anları aşağıdaki zaman çizelgesinde noktalarla gösterilmiştir.</p>", "g": "<div class=\"og48\"><svg viewBox=\"0 0 1024 488\" width=\"1024\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAFqAvgDASIAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAECAwUEBgf/xABGEAACAQMBBAUIBwUIAgIDAAAAAQIDERIEBRMhkTFBUVNhFBdSVHGB0dIGByIyQqGiI2JykrEVFjNDRILB4TTwJPE1g5P/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/xAAkEQEBAQEAAgICAwADAQAAAAAAARECAxIhMRNBBCJRFCMyYf/aAAwDAQACEQMRAD8A6uYyMcicjpjDXMZmOQyGGtsyMjLIZDDW2RGZlkMga2zIzMshkDWuYzMchkDW2ZGZlmMga1zGZlkMgjbMZmOQyC62zGZjkMhhrbMZmWQyGGtcyczHIZDDW2YzMchkBtmMjHInIYa1zGRlcZDDWuQyMshkTDW2QyMchkDW2RORjkMga2yIyMshkMG2QzMchkMG2QyMcicgNchkZZEZBW+RGRlkMgjXIZGWQyC62yGRlkMga1yGRnkMgNMicjLInIDTIZGeQyA0yJyMshkBrkMjLInIDTInIyyGRBrkTkZXGQGuQyM8iMgNciVIyuMgNchkZ5DIDTInIyyJuFaZDIzyGQRrkMjPIZAa5DIzuMgNchkZZE5Aa5C5lkTcDS4yKZEZBWuQyM7jIDTInIyTJuRWmRNzO4uBpcm5nkMiDS5ORnkMgNMgUyAHEy8RkZZDM6ubbIZGOQyA1yGRlkRkBtkMjHMZAbZDIyyIyA2yIyMsh ıları yalnız ikisini birden bölen asal sayılarla bölmüş; ortak bölen kalmayınca kalan iki sayıyı çizginin sağına taşımıştır.</p>", "k": "Buna göre, A + B toplamı kaçtır?", "sec": ["96", "192", "264", "660"], "secg": null, "c": "B", "a": ["[LGS kuralı] Tablo sondan başa doğru çarpılarak geri kurulur. A: 5 · 3 · 2 · 2 = 60; B: 11 · 3 · 2 · 2 = 132. A + <span class=\"nw\">B = 192</span>."], "t": "96: bir 2 eksik alınmış, 30 + 66; 264: B'nin 2 katı; 660: sağdaki bütün sayıların çarpımı, yani EKOK(A, B) yazılmış", "d": "Tabloyu sondan başa doğru geri kurunuz: her satırdaki sayı, alttaki sayının soldaki bölenle çarpımıdır. Sağdaki bütün sayıların çarpımı A + B değil, EKOK'tur.", "ses": "b03"}, {"no": 4, "on": "<p>Bir sınıftaki oyunda, üzerlerinde 1'den 200'e kadar olan doğal sayıların yazılı olduğu 200 kart kullanılmaktadır. Kartlara aşağıdaki kurala göre yıldız çıkartmaları yapıştırılmıştır.</p>", "g": "<svg viewBox=\"0 0 1376 360\" width=\"1376\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCADHAvgDASIAAhEBAxEB/8QAGwABAQADAQEBAAAAAAAAAAAAAAECAwQFBgf/xABFEAACAQMBBQUFBAcFBwUAAAAAAQIDBBEFEiExUXEGMjNBYRMigbHRFFKRwRUjQmJylKEWJDRFklSCg4ST8PElU1VjdP/EABkBAQEBAQEBAAAAAAAAAAAAAAABAgMEBf/EACQRAQEAAgICAgIDAQEAAAAAAAABAhEDMRMhQVEEEgUiYTJx/9oADAMBAAIRAxEAPwD9YwY+WPMJ4Yyzi6bVPeyNkQCbXOXvJv34ACbMbwCZAArIUAAAIAAAAAAAGQAgAAAGAVUKAAIwHwAZIAEAAAIAQAAAIykCgBAKQFAmd4AAAEAAAAAQAQoAgAIoUgAEZWyAAAVEYAIoAQAAAgQAiqCAAACgQAgAAAGAUQoIQCAAAABCkAAMEyQAAFAAAAAAAAeoAgbYAAAAIAAAAAFAgAAAAAAAIAAABAABQ4ghQoQpAAYYAgKQIAgAAAAAQgMABQAAQBgCFIUCAAAAABAAABGAABFACAAAECFIFAAAIUgQGQQKAAAAAgQpCAAAoQACggApA2QAAAIUAAQEYBgAAACAAAAACgAA9MAHRgAAAAAAAAAAEKAAIXzIAZAAAAAAAACAKAFAgAAAECKYhgAAAABAoAAAYIAAARAUhFAAUAAQAQACFAEyMgBQgAQAAUIABSMDJAIAEAQoVAAAAIEUmQAoAQgoIAAAKBA ", "son": "<p>O gün toplanan yumurtalar 12'lik viyollere yerleştirildiğinde 5 yumurta, 30'luk viyollere yerleştirildiğinde de 5 yumurta açıkta kalmaktadır. Toplanan yumurta sayısı 400'den fazla, 450'den azdır.</p>", "k": "Buna göre, bu yumurtaların tamamı 30'luk viyollere yerleştirilirse kaç viyol tamamen dolar?", "sec": ["13", "14", "15", "35"], "secg": null, "c": "B", "a": ["[Deneme esinli] Açıkta kalan 5 yumurta çıkarılırsa kalan sayı hem 12'nin hem 30'un katıdır, yani <span class=\"nw\">EKOK(12, 30) = 60</span>'ın katıdır. 400 ile 450 arasında 60k + 5 biçiminde tek sayı vardır: 425. 30'luk viyol sayısı (425 − 5) : 30 = 14."], "t": "35: 12'lik viyol sayısı; 15: açıkta kalanlar da bir viyol sayılmış; 13: 390 alınmış", "d": "Açıkta kalan yumurtalar çıkarılınca kalan sayı iki viyol sayısının ortak katıdır. Soru yumurta sayısını değil, tamamen dolan 30'luk viyol sayısını soruyor.", "ses": "b08"}, {"no": 9, "on": "<p>Bir kart oyununda iki oyuncu birer sayı kartı çekmektedir. Oyun uygulaması, çekilen iki kartın üzerindeki sayıların EBOB'unu ve EKOK'unu ekranda göstermektedir.</p>", "g": "<svg viewBox=\"0 0 1380 875\" width=\"1380\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAHiAvgDASIAAhEBAxEB/8QAHAABAAEFAQEAAAAAAAAAAAAAAAECAwQFBwYI/8QATRAAAQMDAQQHBQQIAwcDAgcAAQACAwQFESEGEjFBBxMUUWFxgSIykaGxFUJSwSMzYnKCstHwJFOSFkNEY6LC4SU08Qg1F0Vkc4PS4v/EABoBAQEBAQEBAQAAAAAAAAAAAAABAgMEBQb/xAAvEQEAAgEDAwEFCQEBAQAAAAAAAQIRAxIhBDFBUSJhkaHwExRCcYGxwdHhMgXx/9oADAMBAAIRAxEAPwDsyIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiK3PPFTQSTzyNjijaXPe44DQOJKCp72sYXvcGtaMkk4AC8Xe+lOx2xzoqIPuMw0zEQ2PP7x4+gK8Btlt1WbUzyxU0jqWyRHAHB0+Obu/wHAc9V46CqrK6pFJZqSWaZ3BsTC97vhqg6LUdLm0Ex/ ", "son": "<p>Atölye bir günde eşit miktarda elma suyu ve portakal suyu şişelemiştir. O gün şişelenen meyve sularının toplam miktarı 10 L'yi geçmemiştir.</p>", "k": "Buna göre, atölyenin o gün doldurduğu şişe sayısı <u style=\"white-space:nowrap\">en fazla</u> kaçtır?", "sec": ["10", "13", "16", "26"], "secg": null, "c": "D", "a": ["[Deneme esinli] Her meyve suyunun miktarı 250'nin ve 400'ün ortak katıdır, yani <span class=\"nw\">EKOK(250, 400) = 2000</span> mL'nin katıdır. İki meyve suyu eşit olduğundan toplam 4000, 8000, 12 000 … mL olabilir; 10 <span class=\"nw\">L = 10 000</span> mL'yi geçmeyen en büyük toplam 8000 mL'dir. Her birinden 4000 mL: 4000 : 250 = 16 elma, 4000 : 400 = 10 portakal suyu şişesi; toplam 26."], "t": "13: her birinden 2000 mL alınmış; 16 ve 10: yalnız bir türün şişe sayısı", "d": "İki meyve suyunun miktarı eşittir ve 250'nin ve 400'ün ortak katıdır. 10 L'yi mililitreye çeviriniz; sınır iki meyve suyunun toplamı içindir.", "ses": "b13"}, {"no": 14, "on": "<p>Bir kutuda özdeş tahta çubuklar vardır. Çubuklar uç uca getirilerek her kenarı bir çubuk olan düzgün çokgenler oluşturulmaktadır.</p>", "g": "<svg viewBox=\"0 0 1024 328\" width=\"1024\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAD0AvgDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAAECAwQFBgf/xABOEAACAQICBQcHBwgJBAIDAAAAAQIDEQQhBRITMVFBYXGBkZLRBhQiUlNUoRUWMkKT0vAjM0NigqKxwQc0RFVjZHLh4iQ1g/GUo3OEwv/EABkBAQEBAQEBAAAAAAAAAAAAAAABAgMEBf/EACIRAQEAAgIDAAMBAQEAAAAAAAABAhESEyExUQNBYTIiBP/aAAwDAQACEQMRAD8A+l7+UZwqWmpK20o9xtfxNMNJ4SrvrVab/Wujyz/0Y13v4co6gGGMtpnSxev0TuJrEr68n0SNdsZ666AHMdWtH6VSaFt6ntZdo7YdddSwzlber7SXaPb1fay7R2xeuuoBzNtV9pLtDbVfaS7R2xOuumNI5e2q+1l2j21X2su0dsOuumBzNtV9rLtDbVfay7R2xeuumBzNtV9pLtHtqvtZDtidddIZzNtV9rLtHtqvtJdo7YdddIL ght=\"800\" fill=\"#000000\" text-anchor=\"middle\">düzgün altıgen</text></g></svg>", "son": "<p>Kutudaki çubukların tamamıyla birbirine değmeyen düzgün beşgenler oluşturulduğunda hiç çubuk artmamaktadır. Aynı çubukların tamamıyla birbirine değmeyen düzgün altıgenler oluşturulduğunda da hiç çubuk artmamaktadır.</p><p>Kutudaki çubuk sayısı 70'ten fazla, 100'den azdır. Bu çubukların tamamıyla, hiç çubuk artmayacak şekilde, birbirine değmeyen ve hepsi aynı kenar sayısına sahip başka düzgün çokgenler de oluşturulacaktır.</p>", "k": "Buna göre, bu çokgenlerin kenar sayısı aşağıdakilerden hangisi <u style=\"white-space:nowrap\">olamaz</u>?", "sec": ["3", "4", "9", "10"], "secg": null, "c": "B", "a": ["[Deneme esinli] Çubuk sayısı 5'in ve 6'nın ortak katıdır, yani <span class=\"nw\">EKOK(5, 6) = 30</span>'un katıdır. 70 ile 100 arasında yalnız 90 vardır. Kenar sayısı 90'ı tam bölmelidir: 3 (30 üçgen), 9 (10 dokuzgen), 10 (9 ongen) olur; 90, 4'e tam bölünmediği için 4 olamaz."], "t": "", "d": "Çubuk sayısı 5'in ve 6'nın ortak katıdır. Bu sayıyı bulduktan sonra her seçeneğin çubuk sayısını tam bölüp bölmediğini kontrol ediniz; soru “olamaz” diyor.", "ses": "b14"}, {"no": 15, "on": "<p>Bir parkta yürüyüş yolunun kenarına iki sıra bordür taşı döşenecektir. Üst sıraya bir kırmızı ve bir gri taştan oluşan ikili bu sırayla tekrar tekrar, alt sıraya ise yalnız sarı taşlar yan yana döşenecektir. Taşların uzunlukları aşağıda gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 430 447\" width=\"430\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAMWAvgDASIAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAECAwQFBgf/xABHEAACAgECBAQCCAMECAYCAwEBAgADERIhBBMxQQUiUWEycQYHFBUjQlKRM4GxU1ShwRc0NWJjcnPRFiQlJjZEQ3Q3guHw/8QAGgEBAQEBAQEBAAAAAAAAAAAAAAECAwQFB ": "<p>Taşlar kesilmeyecek ve aralarında boşluk bırakılmayacaktır. İki sıra aynı noktada başlayıp aynı noktada bitecek ve üst sıranın son taşı gri olacaktır. Sıraların uzunluğu 4 m'den fazla, 5 m'den azdır.</p>", "k": "Buna göre, üst sırada kaç kırmızı taş kullanılır?", "sec": ["15", "20", "24", "30"], "secg": null, "c": "A", "a": ["[Deneme esinli] Üst sıranın tekrar eden birimi bir kırmızı ve bir gri taştır: 20 + 12 = 32 cm. Sıra uzunluğu 32'nin ve 24'ün ortak katıdır, yani <span class=\"nw\">EKOK(32, 24) = 96</span>'nın katıdır. 400 ile 500 cm arasında yalnız 480 vardır. Üst sırada 480 : 32 = 15 birim, yani 15 kırmızı taş vardır."], "t": "20: alt sıradaki sarı taş sayısı; 30: üst sıradaki bütün taşlar sayılmış; 24: <span class=\"nw\">EKOK(20, 12) = 60</span> ile işlem yapılmış", "d": "Üst sıranın tekrar eden birimi bir kırmızı ve bir gri taştır (20 + 12). Sıra uzunluğunu santimetreye çeviriniz; soru yalnız kırmızı taş sayısını soruyor.", "ses": "b15"}, {"no": 16, "on": "<p>Bir hediyelik eşya atölyesinde 260 cm uzunluğundaki bir kurdeleden 16 cm ve 24 cm uzunluğunda parçalar kesilecektir.</p>", "g": "<svg viewBox=\"0 0 1470 755\" width=\"1470\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAGGAvgDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAMEAgUGAQcI/8QAThAAAgECBAIGBQcICAQGAwEAAAECAxEEBSExEkEGE1FhcYEiMpGh0RQVFkJSscEjM1RicpKT4SRDRFNVgoOiBzRz8EVjssLS8TVklOL/xAAaAQEAAwEBAQAAAAAAAAAAAAAAAQIDBAUG/8QAJhEBAAIBBAICAwEBAQEAAAAAAAECEQMSE1EhMRRBBDJhcSIjkf/aAAwDAQACEQMRAD8A+zAAAAAAAAAAAAAABynSDpgsHUnhMuUalWLtOtLWMH2Jc37itrRWMytWs2nEOrB8lxOcZliZuVbH4iT30qOK9isjLC5/mWCmpU8bVaX1ZTbXvMuaOm3BPb6wDlcj6Z0cZaljbQmvrrS3iuzvXuOpTTSad0zWt4t6Y2pNZ8vQAWVAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA ": null, "c": "C", "a": ["[Deneme esinli] Her türün toplam uzunluğu <span class=\"nw\">EKOK(16, 24) = 48</span>'in katıdır ve iki toplam eşittir; kesilen uzunluk 2 · 48k = 96k olur. 96k ≤ 260 için k en fazla 2'dir: 192 cm kesilir, 260 − 192 = 68 cm artar."], "t": "20: kesilen uzunluk yalnız 48'in katı sanılmış, 240; 164: k = 1 alınmış; 4: yalnız 16 cm'lik parçalar kesilmiş", "d": "İki türün toplam uzunlukları eşittir; kesilen toplam uzunluk 48'in iki katının katıdır. Artanın en az olması için kesilen uzunluk en fazla olmalıdır.", "ses": "b16"}, {"no": 17, "on": "<p>Bir okuldaki bir kutu kâğıt, A ve B yazıcılarında kullanılmıştır. A yazıcısı yalnız 12 sayfalık, B yazıcısı yalnız 20 sayfalık raporlar basmıştır. Her sayfa ayrı bir kâğıda basılmış ve basılan bütün raporlar tamamlanmıştır.</p>", "g": "<svg viewBox=\"0 0 900 455\" width=\"900\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAGAAvgDASIAAhEBAxEB/8QAHAABAQADAQEBAQAAAAAAAAAAAAECAwQFBgcI/8QATxAAAgECAQcHBwgHBgUEAwAAAAECAxEEBRITITFBUQYUUmFxgZEiMkKhscHRByNDU2JygpIVJDM0Y+HwRFRzg5OiFjWywvElNkXSdISj/8QAGQEBAQEBAQEAAAAAAAAAAAAAAAECAwQF/8QAIREBAQACAgMBAQEBAQAAAAAAAAECERITAyFRMWFBMgT/2gAMAwEAAhEDEQA/AP08AGVAC2AgLYWAgKAgQoAgKAoQoAAAAAAABbPgEQIua+AswBLlsSwFBLMvcBAXWSzAAWYAAFAgAAAAKAAAAAAIUAAABCgAAAIAAAAAAAAAAgAAAAAWAAEBSBQAgFBCgACAUgAAAAALgACXFwKCFAAEAoIUAQpAAAAAAAAAAAAAADZYAAAAECkAFIAABQBCggFIUgAAoEBSAWO0y6/6RjHaSVNz8mT8jfHpdvUBnGUZxU4u6ex2KAAAAEFwCgAAABADdot8Ec+DqzrYSnUnrckbMRLMw1WXCD9hhhFm4KjH+GiDaAAAAAAAKAAAAQIoIAoUgAoIUAQoCIAAoAAgAAAAAAAAAABCgCMABQAAQbQVagiWLZluYwqKonKN829k+PWgFmLPgZADGzFnwMgUY2ZM0zAGNmLMyJcCWFigDEGRN5FQFIAAAAAAAAAAAAAAbSABAFIAAKBAUAQpCgRgMBQFAAABAhSbgLHYZoxjs4lQFIAAAAAgBVAABSAMI5sotrJ2IttcLeJuilGEYrckjRlDXhFDfOpCPrOl7WQQABQAAAAAAAAhSAAAAAAAAACkA ", "sec": ["8", "11", "19", "38"], "secg": null, "c": "C", "a": ["[Deneme esinli] A salonunda 2. sıra 17 ile başladığından bir sırada 16 koltuk, B salonunda 2. sıra 23 ile başladığından bir sırada 22 koltuk vardır. Koltuk sayısı 16'nın ve 22'nin ortak katıdır: <span class=\"nw\">EKOK(16, 22) = 176</span>; bir sonraki ortak kat 352 olduğundan koltuk sayısı 176'dır. A'da 176 : 16 = 11, B'de 176 : 22 = 8 sıra; toplam 19."], "t": "38: 352 alınmış; 11 ve 8: yalnız bir salonun sıra sayısı", "d": "Bir sıradaki koltuk sayısını ikinci sıranın ilk numarasından bulunuz (17 ise bir sırada 16 koltuk vardır). Koltuk sayısı 250'den azdır.", "ses": "b18"}, {"no": 19, "on": "<p>Bir fidanlıkta çalışan Selin ile Emre, fidanlıktaki bütün fidanları sıralar hâlinde dikmek için aşağıdaki konuşmayı yapmıştır.</p>", "g": "<svg viewBox=\"0 0 1376 740\" width=\"1376\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAGZAvgDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAAECAwQFBgcI/8QATBAAAgEDAwEFBQQGBwUHBAMBAQIDAAQRBRIhMQYTQVFhFCIycYFCkaGxFSMzUnLBByQ1YrLR4TRzdPDxFjZDgpKiwiVTs9JEVIOE/8QAGgEBAQEBAQEBAAAAAAAAAAAAAAECAwQFBv/EACsRAQEAAgICAQQCAQMFAAAAAAABAhEDIRIxQQQTIlEyYRQzcaEjgbHR8P/aAAwDAQACEQMRAD8A9PooxRiuziSilxRUCUUtFAUUUVVFLRRQLRRRWthaKKKsoKWkoqgoopalBRRilqAoooqgpaSloCiiigKKKKAoooooooooClpKKBaKKKAooooFpQOaSnKMmpSlCHrj76Q58aeMAmkyc8nms7Z2QenNKADyaXPJIxR046+lQOByaG8T5U4DAprdTionyBnNOpOp5paiFoooqAoopKBaKKMUUtFFFFFFFA5NAox1pT1oBFFRsUCkpcc0UooooAqNFopKWgSloooCiikoFooooCiiigKKKKAooooCiiigKKKKAooooCiiigKKKKAooooCiiigKKKKAooooMmilNJXZyFFFFTYKMUUU2DFFLRirsFFLRigSilpKgKWilAqzYQUU7FFbCYpaKKAoooqgoooqApaSimwtFJRRS5pKKKApaMUYoCijFLQJiloooCiiloEpelFFQFPHHzpnWngY8OalSlJ6UAZH+dOCnOc0qg+WKztCAeeRSgY5zxRg9MUoz0PWohOpxmnAcUAY60tRCUtFFAUUUVAUUUtAlFLRRrQoooxQFOGBSdKXN s-serif font-size=\"52\" font-weight=\"800\" fill=\"#fff\" text-anchor=\"start\">Tost</text><text x=\"1265.0\" y=\"250.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"52\" font-weight=\"800\" fill=\"#ffe066\" text-anchor=\"end\">14 TL</text><text x=\"850.0\" y=\"345.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"52\" font-weight=\"800\" fill=\"#fff\" text-anchor=\"start\">Ayran</text><text x=\"1265.0\" y=\"345.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"52\" font-weight=\"800\" fill=\"#ffe066\" text-anchor=\"end\">10 TL</text><line x1=\"975.0\" y1=\"240.0\" x2=\"1110.0\" y2=\"240.0\" stroke=\"#9fb8a9\" stroke-width=\"3\" stroke-dasharray=\"4 10\"/><line x1=\"1005.0\" y1=\"335.0\" x2=\"1110.0\" y2=\"335.0\" stroke=\"#9fb8a9\" stroke-width=\"3\" stroke-dasharray=\"4 10\"/></g></svg></div>", "son": "<p>Defne'nin harçlığı 200 TL'den azdır. Defne harçlığının tamamıyla yalnız tost alırsa da yalnız ayran alırsa da hiç para artmamaktadır.</p><p>Bir süre sonra tostun ve ayranın fiyatlarına eşit miktarda zam yapılmıştır. Zam miktarı TL cinsinden bir doğal sayıdır. Zamdan sonra Defne'nin harçlığı, hiç para artmayacak şekilde tam 7 tost almaya yetmektedir.</p>", "k": "Buna göre, Defne zamlı fiyatlarla bir tost ve bir ayran aldıktan sonra harçlığından kaç TL kalır?", "sec": ["104", "110", "116", "120"], "secg": null, "c": "A", "a": ["[Deneme esinli] Harçlık 14'ün ve 10'un ortak katıdır: <span class=\"nw\">EKOK(14, 10) = 70</span>'in katı ve 200'den az → 70 ya da 140 TL. Harçlık 7 zamlı tosta eşit olduğundan zamlı tost 10 ya da 20 TL olur; zam olması için 20 TL, yani harçlık 140 TL ve zam 6 TL'dir. Zamlı ayran 16 TL. Kalan: 140 − 20 − 16 = 104 TL."], "t": "116: eski fiyatlar kullanılmış; 110: zam yalnız tosta eklenmiş; 120: yalnız tost alınmış", "d": "Harçlık hem 14'ün hem 10'un katıdır. Zamdan sonra harçlık 7 zamlı tosta eşittir; zam miktarını bulup zamlı fiyatlarla hesap yapınız.", "ses": "b20"}]};

const esc=s=>String(s);
function sesKutu(ad){if(!V.ses)return document.createComment("ses askıda");const d=document.createElement("div");d.className="ses";d.innerHTML=`<button type="button" aria-label="Sesli anlatımı dinle">▶</button><span>Sesli anlatım · öğretmen bu soruyu adım adım anlatıyor</span>`;
  const a=new Audio();a.preload="none";a.src=`${V.ses}/${ad}.mp3`;const b=d.querySelector("button"),y=d.querySelector("span");
  const hata=()=>{b.textContent="▶";y.textContent="Bu sorunun sesli anlatımı henüz yüklenmedi.";};
  a.onerror=hata;b.onclick=()=>{if(a.paused){const p=a.play();b.textContent="❚❚";if(p&&p.catch)p.catch(hata);}else{a.pause();b.textContent="▶";}};a.onended=()=>{b.textContent="▶";};return d;}
function adimAdim(kap,list,son){let i=0;const dd=document.createElement("div");dd.className="dug";
  const n=document.createElement("button");n.className="btn";n.type="button";const t=document.createElement("button");t.className="btn ghost";t.type="button";t.textContent="Bütün adımları göster";
  const ciz=()=>{n.textContent=i<list.length?`${i+1}. adımı göster (${list.length} adım)`:"Çözüm tamamlandı";n.disabled=i>=list.length;t.hidden=i>=list.length;};
  const ekle=()=>{const x=document.createElement("div");x.className="adim";x.innerHTML=`<b>${i+1}. adım</b> · ${list[i]}`;kap.insertBefore(x,dd);i++;if(i>=list.length&&son)son();ciz();};
  n.onclick=ekle;t.onclick=()=>{while(i<list.length)ekle();};dd.append(n,t);kap.appendChild(dd);ciz();}
function kartS(s){const k=document.createElement("section");k.className="kart";k.style.setProperty("--c","var(--ss)");k.id="s"+s.no;
  k.innerHTML=`<span class="et">SIRA SENDE · ${s.no}</span><h2>${s.bas}</h2>`;
  s.q.forEach((x,j)=>{const w=document.createElement("div");w.innerHTML=`<div class="soru"><b>${j+1}.</b> ${x.k}</div>`;k.appendChild(w);
    k.appendChild(sesKutu(`s${s.no}-${j+1}`));adimAdim(w,x.a,()=>{const c=document.createElement("p");c.className="cevap";c.innerHTML="<b>Cevap:</b> "+x.c;w.appendChild(c);});});return k;}
function kartK(s){const k=document.createElement("section");k.className="kart";k.style.setProperty("--c","var(--kk)");k.id="k"+s.no;
  k.innerHTML=`<span class="et">KALEM KÂĞIT · ${s.no}</span><h2>${s.bas}</h2><p>${s.yon}</p><table><thead><tr><th>SAYI</th><th>CEVAP</th></tr></thead><tbody>${s.r.map(r=>`<tr><td><b>${r.n}</b></td><td>${r.c}</td></tr>`).join("")}</tbody></table>`;return k;}
function kartB(s){const k=document.createElement("section");k.className="kart";k.style.setProperty("--c","var(--b)");k.id="b"+s.no;
  const L="ABCD";const sec=s.sec?`<ol class="sec">${s.sec.map((x,i)=>`<li class="${L[i]===s.c?"":""}" data-h="${L[i]}"><b>${L[i]})</b> ${x}</li>`).join("")}</ol>`:"";
  k.innerHTML=`<span class="et">${V.bet||"BAĞLAM TEMELLİ SORU"} · ${s.no}</span><h2>${window.CANL&&CANL[s.no]?"Canlandırın, deneyin, çözümü görün":"Adım adım çözüm"}</h2><div class="soru">${s.on||""}${s.g?`<div>${s.g}</div>`:""}${s.son||""}<p><b>${s.k}</b></p>${sec}${s.secg?'<p><i>Seçenekler kitaptaki görsellerdir.</i></p>':""}</div>`;
  let cozKap=k;
  if(window.CANL&&CANL[s.no]){const sek=document.createElement("div");sek.className="sek";sek.setAttribute("role","tablist");
    sek.innerHTML=`<button type="button" role="tab" aria-selected="true">▶ Canlandır ve dene<span class="yeni">YENİ</span></button><button type="button" role="tab" aria-selected="false">Adım adım çözüm</button>`;
    const p1=document.createElement("div");p1.className="cn";p1.setAttribute("role","tabpanel");const p2=document.createElement("div");p2.setAttribute("role","tabpanel");p2.hidden=true;
    k.append(sesKutu(s.ses),sek,p1,p2);let kur=false;const ac=i=>{sek.querySelectorAll("button").forEach((b,j)=>b.setAttribute("aria-selected",i===j));p1.hidden=i!==0;p2.hidden=i!==1;if(i===0&&!kur){kur=true;CANL[s.no](p1);}};
    sek.querySelectorAll("button").forEach((b,i)=>b.onclick=()=>ac(i));ac(q.get("g")==="cozum"?1:0);cozKap=p2;}
  if(cozKap===k)k.appendChild(sesKutu(s.ses));const w=document.createElement("div");cozKap.appendChild(w);
  adimAdim(w,s.a,()=>{const c=document.createElement("p");c.className="cevap";c.innerHTML=`<b>Doğru cevap:</b> ${s.c}`;w.appendChild(c);
    k.querySelectorAll("ol.sec li").forEach(li=>{if(li.dataset.h===s.c)li.classList.add("dogru");});
    if(s.t){const t=document.createElement("p");t.className="tuzak";t.innerHTML="<b>Diğer seçenekler neden yanlış?</b> "+s.t;w.appendChild(t);}});
  const d=document.createElement("div");d.className="dikkat";d.innerHTML=`<b>Dikkat!</b> ${s.d}`;cozKap.appendChild(d);return k;}
const ic=$("#ic");
const BOL=[["s","Sıra Sende",V.s,kartS],["k","Kalem Kâğıt",V.k,kartK],["b",V.bad||"Bağlam Soruları",V.b,kartB]].filter(x=>x[2].length);
if(tek&&BOL.some(x=>x[0]===tek)){const n=+q.get(tek);const [,,L,f]=BOL.find(x=>x[0]===tek);const s=L.find(x=>x.no===n)||L[0];ic.appendChild(f(s));$("#tum").hidden=false;$("#nav").remove();}
else{let akt=BOL[0][0];const nav=$("#nav");const ciz=()=>{ic.innerHTML="";nav.innerHTML=BOL.map(([k,a,L])=>`<button type="button" data-k="${k}" aria-pressed="${k===akt}">${a} (${L.length})</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{akt=b.dataset.k;ciz();});const [,,L,f]=BOL.find(x=>x[0]===akt);L.forEach(s=>ic.appendChild(f(s)));};ciz();}

/* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
