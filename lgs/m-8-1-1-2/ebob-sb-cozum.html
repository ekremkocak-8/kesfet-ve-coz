<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çözümler · Keşfet ve Çöz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--muted:#5b6478;--line:#dfe5ef;--bg:#f5f7fb;--card:#fff;--ss:#6741d9;--kk:#0b7285;--b:#d0700f;--ok:#2b8a3e;--warn:#c92a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif}
header{background:linear-gradient(135deg,#1c5fbf,#2f8fe0);color:#fff;padding:18px 16px 22px}

main{max-width:780px;margin:14px auto 40px;padding:0 16px}
nav.sec{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}nav.sec button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}

ol.sec{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
ol.sec li{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}ol.sec li.dogru{border-color:var(--ok);background:#ebfbee;font-weight:800}
.adim{border-left:4px solid var(--c);padding:6px 12px;margin:8px 0;background:#fff;border-radius:0 10px 10px 0;animation:gel .35s ease-out}
.adim b{color:var(--c)}@keyframes gel{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dug{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
button.btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.dikkat{background:#fff4e6;border:2px solid #f59f00;border-radius:12px;padding:10px 14px;margin:12px 0 4px}.dikkat b{color:#d9480f}
.tuzak{font-size:15px;color:var(--muted);margin-top:8px}
.cevap{font-weight:900;color:var(--ok);margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid var(--line);padding:8px 10px;text-align:left}th{background:#e3fafc;color:#0b7285;font-size:13px;letter-spacing:.06em}
.ses{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border-radius:12px;background:#eef2ff}

.ses span{font-size:14px;color:var(--muted)}
.gizli{display:none}
.tum{margin:4px 0 14px;font-size:14px}.tum a{color:#1c5fbf;font-weight:800}
@media (prefers-reduced-motion:reduce){.adim{animation:none}}
/* Canlandır (05.10.2026) */
.sek{display:flex;gap:6px;margin:12px 0 0;border-bottom:2px solid var(--line)}
.sek button{border:0;background:none;font:inherit;font-weight:900;font-size:15px;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);min-height:44px;position:relative;top:2px;border-bottom:3px solid transparent}
.sek button[aria-selected=true]{color:var(--c);border-bottom-color:var(--c);background:#fff8f0}
.sek .yeni{display:inline-block;font-size:10px;background:#2b8a3e;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.06em}
.cn{padding-top:10px}
.cn-yon{background:#eef6ff;border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:10px}
.cn-sahne{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;min-height:120px;overflow-x:auto}

.cn-adimci input,.cn-test input{width:84px;height:44px;border:2px solid var(--line);border-radius:12px;font:inherit;font-weight:900;text-align:center;font-size:18px}
.cn-test label{font-weight:800;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.cn-btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
.cn-btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.cn-btn[aria-pressed=true]{background:var(--ac,var(--c));color:#fff;border-color:var(--ac,var(--c))}
.cn-btn:disabled{opacity:.5}
.cn-hazir{display:flex;flex-wrap:wrap;gap:6px}

.cn-dur .iyi{color:var(--ok);font-weight:900}.cn-dur .kotu{color:var(--warn);font-weight:900}
.cn-df{margin-top:10px;overflow-x:auto}@media(max-width:480px){.cn-adimci>span{flex-basis:100%}.cn-h{font-size:12px;padding:5px 0}.cn-izg{gap:3px}.cn-sahne{padding:6px}}@media(max-width:480px){.cn-df table{font-size:13px}.cn-df td,.cn-df th{padding:4px 5px}}.cn-df summary{font-weight:900;cursor:pointer;padding:6px 0}.cn-say{color:var(--muted);font-weight:700}
.cn-df table{font-size:15px}.cn-df td{padding:5px 8px}.cn-df tr.cn-iyi td{background:#ebfbee}.cn-df tr.cn-kotu td{background:#fff5f5}.cn-df tr.cn-son td{outline:2px solid var(--c);outline-offset:-2px}
.cn-p{animation:cnGel .35s ease-out both}@keyframes cnGel{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cn-o{fill:#ffa94d;stroke:#d9480f;stroke-width:1}.cn-o2{fill:#e8590c}.cn-k{fill:#ffc9c9;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:3 2}
.cn-cerceve{stroke:#2b8a3e;stroke-width:3}.cn-et{font-size:13px;font-weight:800;fill:#5b6478}.cn-et.b,.cn-et2b{font-weight:900;fill:#1d2433}.cn-et2{font-size:11px;fill:#5b6478;font-weight:700}.cn-et2b{font-size:13px;fill:#fff}
.cn-ku{fill:#fff4e6;stroke:#ffa94d;stroke-width:1.5}.cn-kk{fill:#fff5f5;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:4 3}
.cn-tahta0{fill:#f1f3f5;stroke:#ced4da}.cn-tahta{fill:#c08552;stroke:#8d5a2b}
.cn-ek{stroke:#868e96;stroke-width:2}.cn-sinir{stroke:#c92a2a;stroke-width:3;stroke-dasharray:5 4}.cn-yay{fill:none;stroke:#f76707;stroke-width:2}
.cn-v1{stroke:#2b8a3e;stroke-width:3}.cn-v2{stroke:#c92a2a;stroke-width:3}.cn-kis{font-size:20px}.cn-bus{font-size:16px}.cn-bek{stroke:#c92a2a;stroke-width:5;stroke-linecap:round;opacity:.6}
.cn-kum{fill:#ffe8cc;stroke:#e8590c;stroke-width:3}.cn-kum2{fill:#495057}.cn-para{fill:#ffd43b;opacity:.85}.cn-buyuk{font-size:26px;font-weight:900;fill:#1d2433}
.cn-zem{fill:#adb5bd}.cn-kat{fill:#f1f3f5;stroke:#ced4da}.cn-katon{fill:#d3f9d8;stroke:#2b8a3e}.cn-katoff{fill:#ffe3e3;stroke:#e03131}
.cn-izg{display:grid;gap:4px}.cn-h,.cn-gb{border-radius:8px;text-align:center;font-weight:800;font-size:14px;padding:6px 0}.cn-h{background:#f1f3f5;transition:background .25s,transform .25s}
.cn-gb{background:none;color:var(--muted);font-size:12px}.cn-h.on{background:#ffa94d;color:#1d2433}.cn-h.yeni{transform:scale(1.18);box-shadow:0 0 0 3px #e8590c}
.cn-kartlar{display:flex;flex-wrap:wrap;gap:6px;padding:4px}.cn-kart{min-width:44px;padding:8px 10px;text-align:center;border-radius:10px;background:#fff4e6;border:2px solid #ffa94d;font-weight:900;animation:cnGel .3s}
.cn-kart.kare{background:#e7f5ff;border-color:#1c7ed6}.cn-bosk{color:var(--muted)}
.cn-cift{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 4px;font-weight:800}.cn-cift i{font-weight:600;color:#1c7ed6}
.cn-katlar{padding:4px}.cn-katsat{display:inline-flex;flex-wrap:wrap;gap:6px}.cn-kat2{background:#e6fcf5;border:1.5px solid #12b886;border-radius:8px;padding:3px 8px;font-weight:800;animation:cnGel .3s}.cn-sonsuz{font-weight:800;color:#0b7285}
.cn-onr{background:#f8f0fc;border:2px solid #ae3ec9;border-radius:12px;padding:10px 14px}.cn-kanit{padding:10px 4px 2px}
.cn-kay{display:inline-flex;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap}.cn-kay{max-width:100%}.cn-kay input{width:min(220px,70vw);accent-color:#d0700f}.cn-satir>*{min-width:0;max-width:100%}
@media (prefers-reduced-motion:reduce){.cn-p,.cn-kart,.cn-kat2{animation:none}.cn-h{transition:none}}
/* 05.10.2026 · KOŞUL ve LABİRENT motorları (SB 6.1.1) */
@media(max-width:560px){.soru [style*="grid-template-columns:repeat"]{grid-template-columns:1fr!important}}   /* çok sütunlu konuşma balonları telefonda alt alta */
.cn-kl{list-style:none;padding:0;margin:0;display:grid;gap:4px}.cn-not{color:var(--muted);font-size:14px}.cn-sonuc{margin-top:6px;font-weight:800}
.cn-secg{gap:6px}.cn-secad{font-weight:800;flex-basis:100%}.cn-secg .cn-btn{padding:8px 12px}
.cn-mv{fill:#74c0fc;stroke:#1c7ed6;stroke-width:1}.cn-tl{fill:#69db7c;stroke:#2b8a3e;stroke-width:1.5}
.cn-lab{display:grid;gap:4px;align-items:center;max-width:460px;margin:0 auto}
.cn-lc{min-height:44px;border-radius:8px;border:1.5px solid #ced4da;background:#fff;font:inherit;font-weight:900;font-size:16px;cursor:pointer;padding:0;color:var(--ink)}
.cn-lc.yol{background:#d3f9d8;border-color:#2b8a3e}.cn-lc.simdi{background:#2b8a3e;color:#fff;box-shadow:0 0 0 3px #b2f2bb}.cn-lc.kapali{background:#ffe3e3;border-color:#e03131;color:#c92a2a;text-decoration:line-through}
.cn-lok{color:#2b8a3e;font-weight:900;text-align:center}.cn-lcik{min-height:44px;border:0;background:none;font:inherit;font-weight:900;color:#d9480f;cursor:pointer;padding:0;white-space:nowrap;font-size:14px}.cn-lcik:disabled{cursor:default}

</style></head><body>
<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }
      if (!art && !o.sandalye) sv += `<rect x="10" y="10" width="${gen * hc}" height="${sira * hc}" fill="none" class="cn-cerceve"/>
        <text x="${10 + gen * hc / 2}" y="${H + 4}" class="cn-et" text-anchor="middle">${gen} ${o.birim || ""}</text>
        <text x="${W + 4}" y="${10 + sira * hc / 2}" class="cn-et" dominant-baseline="middle">${sira} ${o.birim || ""}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W + 70} ${H + 22}" role="img" aria-label="${N} ${o.ad || "kare"}, her sırada ${gen}">${sv}</svg>`;
      const r = o.kural ? o.kural(gen, sira, art, N) : null;
      let m;
      if (art) m = `<span class="kotu">✘</span> ${N} ${o.ad || "kare"} her sırada ${gen} olacak biçimde dizilince ${sira} tam sıra oluşur, <b>${art} ${o.ad || "kare"} artar</b>. Dikdörtgen olmaz: ${N} : ${gen} işleminde kalan ${art}.`;
      else m = `<span class="iyi">✔</span> <b>${N} = ${gen} ${x} ${sira}</b> · ${sira} sıra, her sırada ${gen} ${o.ad || "kare"}; hiç artmadı.` + (gen === sira ? ` <b>Kare oldu!</b> İki kenar aynı: ${gen}.` : "");
      if (!art && o.cevre) m += ` Çevre = 2 ${x} (${gen} + ${sira}) = <b>${2 * (gen + sira)} m</b>.`;
      if (r && r.msg) m += `<br>${r.msg}`;
      s.dur.innerHTML = m;
      const sutunlar = o.satir ? o.satir(gen, sira, art, N, r) : [gen, art ? `${sira} (+ ${art} artan)` : sira, art, art ? "olmaz" : (gen === sira ? "kare" : "dikdörtgen")];
      s.yaz(N + ":" + gen, sutunlar, !art && (!r || r.ok !== false));
    }
    ciz(g.get());
  }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {
    const N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });
    const g = adimci(o.etiket, 1, o.max || N, o.bas || 2, v => { sonK = v; });

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.

    sonuc: ([D, d], hepsi) => 40 % d === 0 && D % d === 0 ? `Lambalar: ${160 / d} + ${4 * D / d} = <b>${160 / d + 4 * D / d}</b>` : "",

    yon: "Önce dış yolun kenarını seçin, sonra lambalar arasındaki uzaklığı değiştirin. Lambalar köşelerden başlayarak dizilir. Hangi uzaklıklarda iki karede de her köşeye lamba geliyor? Uzaklık büyüdükçe lamba sayısı ne oluyor?",

  /* 9 · galeri duvarları */
  9: el => CN.ESPARCA(el, { birim: "cm", parcaAd: "tablo",

      { ad: "kapı çıkarılınca (630 cm)", butunler: [{ ad: "1. duvar: 740 − 110 = 630 cm", n: 630, renk: "#ae3ec9" }, { ad: "2. duvar: 840 cm", n: 840, renk: "#1c7ed6" }] }] },
    girdi: { ad: "Tablo genişliği (cm):", min: 20, max: 120, bas: 60 },
    kosul: p => [{ ad: "Genişlik 50 cm ile 80 cm arasında", ok: p >= 50 && p <= 80 }],
    sonuc: (p, R, ok, tam, ad) => ok ? `${ad.startsWith("kapı dahil") ? "Dikkat: Kapının önüne tablo asılmaz! " : ""}Toplam <b>${R[0].adet + R[1].adet} tablo</b>.` : "",
    sutun: ["1. duvar", "Genişlik", "Tablo sayısı"],
    satir: (p, R, ok, tam, ad) => [ad, p + " cm", ok ? `<b>${R[0].adet + R[1].adet}</b>` : tam ? "50–80 ✘" : "boşluk kalıyor"],
    yon: "Birinci duvarın hangi bölümüne tablo asılacağını seçin ve tablo genişliğini değiştirin. Duvarlar boşluksuz doluyor mu? 50 ile 80 cm arasında uygun genişliği arayın.",
    bitis: "Kapı çıkarılmış duvarla uygun genişliği ve tablo sayısını bulduğunuzda." }),

  /* 10 · depo fişi, okunamayan rakam */
  10: el => CN.KOSUL(el, { dugme: false, sutun: ["Şeker", "EBOB(234, şeker)", "Uygun mu?", "Çuval"],
    girdi: [{ ad: "Lekenin altındaki rakam:", min: 0, max: 9, bas: 0 }],
    ciz: ([r]) => { const s = 104 + 10 * r - 0 + 0, e = g(234, 100 + 10 * r + 4);
      return `<div class="cn-kutuk">${kart("234 kg", "un")}${kart(`1${r}4 kg`, "şeker")}${kart(e + " kg", "en ağır eş çuval", e === 26 ? "ok" : "no")}</div>`; },
    kosullar: [{ ad: "En ağır eş çuval 26 kg", f: ([r]) => g(234, 104 + 10 * r) === 26 }],
    sonuc: ([r], hepsi) => hepsi ? `Un 234 : 26 = 9, şeker ${104 + 10 * r} : 26 = ${(104 + 10 * r) / 26} çuval; toplam <b>${9 + (104 + 10 * r) / 26}</b>.` : "",
    satir: ([r], hepsi) => [`1${r}4 kg`, g(234, 104 + 10 * r), hepsi ? "evet" : "hayır", hepsi ? `<b>${9 + (104 + 10 * r) / 26}</b>` : "—"],
    yon: "Lekenin altındaki rakamı 0'dan 9'a kadar değiştirin. Her durumda un ile şekerin EBOB'u, yani en ağır eş çuval hesaplanır. Çuval 26 kg olan şeker miktarını bulun.",
    bitis: "On rakamın hepsini denediğinizde." }),

  /* 11 · çam ve meşe çıtalardan kare çerçeveler */
  11: el => CN.ESPARCA(el, { birim: "cm", parcaAd: "parça",
    butunler: [{ ad: "Çam: 390 cm", n: 390, renk: "#e0b98a" }, { ad: "Meşe: 260 cm", n: 260, renk: "#a0522d" }],
    girdi: { ad: "Parça uzunluğu (cm):", min: 1, max: 140, bas: 10 },
    kosul: p => [{ ad: "Parça 40 cm'den kısa", ok: p < 40 }],
    sonuc: (p, R, ok, tam) => { if (!tam) return "Çıtalardan biri eşit parçalara ayrılmıyor."; const c = Math.min(Math.floor(R[0].adet / 2), Math.floor(R[1].adet / 2));
      return `Her çerçeve 2 çam + 2 meşe: <b>${c} çerçeve</b>; artan çam ${R[0].adet - 2 * c}, artan meşe ${R[1].adet - 2 * c} parça.` + (p >= 40 ? " Ama parça 40 cm'den kısa olmalı." : ""); },
    sutun: ["Parça", "Çam / meşe parça", "Çerçeve", "Artan parça"],
    satir: (p, R, ok, tam) => { if (!tam) return [p + " cm", "—", "—", "olmaz"]; const c = Math.min(Math.floor(R[0].adet / 2), Math.floor(R[1].adet / 2));
      return [p + " cm", `${R[0].adet} / ${R[1].adet}`, c, ok ? `<b>${R[0].adet + R[1].adet - 4 * c}</b>` : `${R[0].adet + R[1].adet - 4 * c} (40 cm ✘)`]; },
    yon: "Parça uzunluğunu değiştirin; iki çıta bu uzunlukta kesilir. Hangi uzunluklar iki çıtaya da uyuyor? Kaç çerçeve yapılıyor ve kaç parça artıyor? 40 cm'den kısa en uzun parçayı arayın.",
    bitis: "40 cm'den kısa en uzun uygun parçayla artan parça sayısını bulduğunuzda." }),

  /* 12 · velodrom setleri */
  12: el => CN.KOSUL(el, { dugme: false, sutun: ["Set", "Tur", "Sürat", "Dayanıklılık", "Toplam set"],
    girdi: [{ ad: "Bir set (m):", sec: [300, 500, 600, 750, 900, 1000, 1500], yaz: v => v + " m", bas: 300 }],
    ciz: ([s]) => `<div class="cn-kutuk">${kart(s / 250 + " tur", "bir sette", s % 250 ? "no" : "ok")}${kart(6000 % s ? "artar" : 6000 / s + " set", "sürat 6000 m", 6000 % s ? "no" : "ok")}${kart(4500 % s ? "artar" : 4500 / s + " set", "dayanıklılık 4500 m", 4500 % s ? "no" : "ok")}</div>`,
    kosullar: [{ ad: "Set başlangıç çizgisinde biter (tam tur)", f: ([s]) => s % 250 === 0 }, { ad: "Sürat çalışması eşit setlere ayrılır", f: ([s]) => 6000 % s === 0 },
      { ad: "Dayanıklılık çalışması eşit setlere ayrılır", f: ([s]) => 4500 % s === 0 }, { ad: "Set en fazla 1 km", f: ([s]) => s <= 1000 }],
    sonuc: ([s], hepsi) => hepsi ? `Toplam <b>${6000 / s + 4500 / s} set</b>.` : "",

    bitis: "Yedi uzunluğu da denediğinizde." }),

  /* 13 · dağcının algoritma tablosu */
  13: el => CN.KOSUL(el, { dugme: false, sutun: ["Son satırdaki sayı", "Uzun ip", "Fark", "Parça"],
    girdi: [{ ad: "Son satırdaki lekeli sayı:", min: 1, max: 12, bas: 6 }],
    ciz: ([k]) => { const A = 420, B = 84 * k; let a = A, b = B, sat = []; [2, 2, 3, 7].forEach(p => { sat.push([a, b, p]); a /= p; b /= p; }); sat.push([a, b, ""]);
      return `<div class="cn-mak">${sat.map(([u, v, p]) => `<div><b>${u}</b><b>${v}</b><small style="text-align:left;color:#c2255c">${p}</small></div>`).join("")}</div><p class="cn-ust" style="text-align:center">EBOB = 2 · 2 · 3 · 7 = 84 cm · uzun ip ${B} cm</p>`; },
    kosullar: [{ ad: "Son satırda ortak bölen kalmadı (algoritma burada biter)", f: ([k]) => g(5, k) === 1 }, { ad: "Uzun ip kısa ipten 168 cm uzun", f: ([k]) => 84 * k - 420 === 168 }],
    sonuc: ([k], hepsi) => hepsi ? `Kısa ip 5, uzun ip ${k} parça: toplam <b>${5 + k} parça</b>.` : "",

    yon: "Ortak yüksekliği değiştirin; fotoğrafların genişlikleri alanlardan hesaplanır. Uygun yüksekliklerde şerit uzunluğunu deney defterinde karşılaştırın. En büyük ortak yükseklik en kısa şeridi veriyor mu?",

  /* 16 · dükkân planı */
  16: el => CN.KOSUL(el, { dugme: false, sutun: ["Depo-ofis genişliği", "Depo / ofis", "Derinlik", "Satış alanı", "Dükkân"],
    girdi: [{ ad: "Depo ve ofisin genişliği (m):", sec: [1, 2, 3, 6, 9], yaz: v => v + " m", bas: 3 }],
    ciz: ([x]) => { const hd = 54 / x, ho = 72 / x, H = hd + ho, y = 17 - x, sk = Math.min(12, 205 / H, 420 / 17);
      return svg(480, 260, `<rect x="20" y="10" width="${x * sk}" height="${hd * sk}" fill="#e3edfb" stroke="#1c5fbf" stroke-width="2"/><rect x="20" y="${10 + hd * sk}" width="${x * sk}" height="${ho * sk}" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="2"/><rect x="${20 + x * sk}" y="10" width="${y * sk}" height="${H * sk}" fill="#fff0e2" stroke="#d9480f" stroke-width="2"/>`
        + tx(240, 234, `satış alanı: ${y} × ${H} = ${y * H} m²`) + tx(240, 254, `derinlik ${H} m · ön cephe 17 m`), "dükkân planı"); },

    sonuc: ([x], hepsi) => hepsi ? `Satış alanı <b>${(17 - x) * 126 / x} m²</b>.` : "",
    satir: ([x], hepsi) => [x + " m", `${x}×${54 / x} / ${x}×${72 / x}`, 126 / x + " m", (17 - x) * 126 / x + " m²", 17 * 126 / x + " m²"],
    yon: "Depo ile ofisin ortak genişliğini (54 ile 72'nin ortak bölenlerinden biri) seçin; plan anında çizilir. Hangi genişlikte iki koşul da sağlanıyor?",
    bitis: "Beş genişliği de denediğinizde." }),
};
})();

00000\" stroke-width=\"1.4\"/><text x=\"467.0\" y=\"202.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">364 m</text><line x1=\"650.0\" y1=\"170.0\" x2=\"650.0\" y2=\"184.0\" stroke=\"#000000\" stroke-width=\"1.4\"/><text x=\"650.0\" y=\"202.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">520 m</text><text x=\"40.0\" y=\"34.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#333333\" text-anchor=\"start\">Cadde planı (bir kenar)</text><text x=\"46.0\" y=\"98.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"start\">başı</text><text x=\"644.0\" y=\"98.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"end\">sonu</text><text x=\"345.0\" y=\"230.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"600\" fill=\"#333333\" text-anchor=\"middle\">Çınar ağaçları temsilî olarak çizilmiştir.</text></svg>", "son": "<p>Direklerin dikileceği noktalardan ikisi çınarların bulunduğu noktalara denk gelecektir. Bu iki noktaya direk dikilmeyecek, lambalar çınarlara takılacaktır.</p>", "k": "Buna göre, belediye <u style=\"white-space:nowrap\">en az</u> kaç direk diker?", "sec": ["7", "9", "10", "11"], "secg": null, "c": "B", "a": ["Aralık, çınarlara kadar olan uzunlukları bölmelidir: caddenin başı ile 1. çınar arası 156 m, iki çınar arası 364 − 156 = 208 m, 2. çınar ile caddenin sonu arası 520 − 364 = 156 m.", "En az direk için aralık en büyük seçilir: EBOB(156, 208) = 52 m.", "520 : 52 = 10 aralık vardır; başa ve sona da direk konduğu için 11 nokta oluşur. İki nokta çınarlardır: 11 − 2 = 9 direk."], "t": "11: çınarların bulunduğu noktalara da direk sayılmış; 10: aralık sayısı direk sayısı sanılmış; 7: caddenin başı ve sonu da çıkarılmış.", "d": "Çınarlar direk düzeninin içinde kalmalıdır: aralık hem caddenin başı ile 1. çınar arasını (156 m) hem iki çınar arasını (208 m) bölmelidir. Çınarların bulunduğu iki noktaya direk dikilmediğini unutmayın.", "ses": "b01"}, {"no": 2, "on": "<p>Bir televizyon kanalının yayın akışında yer alan iki filmin süreleri aşağıda verilmiştir. Kanal, her filmi eşit sürelerde bölümlere ayıracak ve bölümler arasında reklam verecektir.</p>", "g": "<svg viewBox=\"0 0 690 246\" width=\"690\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"130.0\" y=\"14.0\" width=\"430.0\" height=\"214.0\" rx=\"12\" fill=\"#1f2a44\" stroke=\"#495057\" stroke-width=\"6\"/><rect x=\"150.0\" y=\"32.0\" width=\"390.0\" height=\"178.0\" rx=\"6\" fill=\"#26365c\" stroke=\"none\" stroke-width=\"0\"/><text x=\"345.0\" y=\"62.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"18\" font-weight=\"800\" fill=\"#ffd8a8\" text-anchor=\"middle\">YAYIN AKIŞI</text><text x=\"170.0\" y=\"104.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#ffffff\" text-anchor=\"start\">1. film: Kayıp Pusula</text><text x=\"170.0\" y=\"128.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"700\" fill=\"#d0ebff\" text-anchor=\"start\">Süre: 1 sa 52 dk</text><text x=\"170.0\" y=\"166.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#ffffff\" text-anchor=\"start\">2. film: Mavi Yolculuk</text><text x=\"170.0\" y=\"190.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"700\" fill=\"#d0ebff\" text-anchor=\"start\">Süre: 2 sa 20 dk</text><rect x=\"320.0\" y=\"228.0\" width=\"50.0\" height=\"10.0\" rx=\"0\" fill=\"#495057\" stroke=\"none\" stroke-width=\"0\"/><rect x=\"290.0\" y=\"236.0\" width=\"110.0\" height=\"6.0\" rx=\"3\" fill=\"#495057\" stroke=\"none\" stroke-width=\"0\"/></svg>", "son": "<p>Filmlerin başında ve sonunda reklam verilmeyecektir. İki filmde bir bölümün süresi aynıdır; bu süre dakika cinsinden bir doğal sayıdır ve 30 dakikadan kısadır. Bölümler olabildiğince uzun tutulacaktır.</p>", "k": "Buna göre, iki film boyunca toplam kaç kez reklam verilir?", "sec": ["7", "9", "11", "16"], "secg": null, "c": "A", "a": ["Süreler dakikaya çevrilir: 1 sa 52 dk = 112 dk, 2 sa 20 dk = 140 dk. Bölüm süresi 112 ile 140'ın ortak bölenidir: EBOB = 28.", "28 dk, 30 dakikadan kısadır ve en uzun bölüm süresidir. 1. film 112 : 28 = 4, 2. film 140 : 28 = 5 bölüme ayrılır.", "Reklamlar yalnız bölümlerin arasında verilir: 4 bölüm arasında 3, 5 bölüm arasında 4 reklam; toplam 7."], "t": "9: bölüm sayısı reklam sayısı sanılmış; 11: filmlerin başında ve sonunda da reklam sayılmış; 16: bölüm 14 dakika alınmış.", "d": "Önce süreleri dakikaya çevirin (1 sa 52 dk = 112 dk). Reklamlar yalnız bölümlerin arasında verilir: 4 bölümlük filmde 3 reklam arası vardır.", "ses": "b02"}, {"no": 3, "on": "<p>Bir pazarcı, özdeş iki kasadan birini domatesle, diğerini biberle doldurmuş ve kasaları tartmıştır. Tartıların ekranlarında görünen değerler aşağıda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 690 226\" width=\"690\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"70.0\" y=\"150.0\" width=\"200.0\" height=\"26.0\" rx=\"4\" fill=\"#adb5bd\" stroke=\"#000000\" stroke-width=\"1.4\"/><rect x=\"140.0\" y=\"176.0\" width=\"60.0\" height=\"40.0\" rx=\"4\" fill=\"#868e96\" stroke=\"#000000\" stroke-width=\"1.2\"/><rect x=\"146.0\" y=\"184.0\" width=\"48.0\" height=\"24.0\" rx=\"3\" fill=\"#111111\" stroke=\"none\" stroke-width=\"0\"/><text x=\"170.0\" y=\"202.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#8ce99a\" text-anchor=\"middle\">81 kg</text><rect x=\"90.0\" y=\"96.0\" width=\"160.0\" height=\"54.0\" rx=\"4\" fill=\"#f3e3c3\" stroke=\"#8a5a2b\" stroke-width=\"2\"/><circle cx=\"110.0\" cy=\"92.0\" r=\"11.0\" fill=\"#e8590c\" stroke=\"#e8590c\" stroke-width=\"1\"/><circle cx=\"134.0\" cy=\"92.0\" r=\"11.0\" fill=\"#e8590c\" stroke=\"#e8590c\" stroke-width=\"1\"/><circle cx=\"158.0\" cy=\"92.0\" r=\"11.0\" fill=\"#e8590c\" stroke=\"#e8590c\" stroke-width=\"1\"/><circle cx=\"182.0\" cy=\"92.0\" r=\"11.0\" fill=\"#e8590c\" stroke=\"#e8590c\" stroke-width=\"1\"/><circle cx=\"206.0\" cy=\"92.0\" r=\"11.0\" fill=\"#e8590c\" stroke=\"#e8590c\" stroke-width=\"1\"/><circle cx=\"230.0\" cy=\"92.0\" r=\"11.0\" fill=\"#e8590c\" stroke=\"#e8590c\" stroke-width=\"1\"/><text x=\"170.0\" y=\"128.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#8a5a2b\" text-anchor=\"middle\">Domates</text><rect x=\"370.0\" y=\"150.0\" width=\"200.0\" height=\"26.0\" rx=\"4\" fill=\"#adb5bd\" stroke=\"#000000\" stroke-width=\"1.4\"/><rect x=\"440.0\" y=\"176.0\" width=\"60.0\" height=\"40.0\" rx=\"4\" fill=\"#868e96\" stroke=\"#000000\" stroke-width=\"1.2\"/><rect x=\"446.0\" y=\"184.0\" width=\"48.0\" height=\"24.0\" rx=\"3\" fill=\"#111111\" stroke=\"none\" stroke-width=\"0\"/><text x=\"470.0\" y=\"202.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#8ce99a\" text-anchor=\"middle\">107 kg</text><rect x=\"390.0\" y=\"96.0\" width=\"160.0\" height=\"54.0\" rx=\"4\" fill=\"#f3e3c3\" stroke=\"#8a5a2b\" stroke-width=\"2\"/><circle cx=\"410.0\" cy=\"92.0\" r=\"11.0\" fill=\"#2b8a3e\" stroke=\"#2b8a3e\" stroke-width=\"1\"/><circle cx=\"434.0\" cy=\"92.0\" r=\"11.0\" fill=\"#2b8a3e\" stroke=\"#2b8a3e\" stroke-width=\"1\"/><circle cx=\"458.0\" cy=\"92.0\" r=\"11.0\" fill=\"#2b8a3e\" stroke=\"#2b8a3e\" stroke-width=\"1\"/><circle cx=\"482.0\" cy=\"92.0\" r=\"11.0\" fill=\"#2b8a3e\" stroke=\"#2b8a3e\" stroke-width=\"1\"/><circle cx=\"506.0\" cy=\"92.0\" r=\"11.0\" fill=\"#2b8a3e\" stroke=\"#2b8a3e\" stroke-width=\"1\"/><circle cx=\"530.0\" cy=\"92.0\" r=\"11.0\" fill=\"#2b8a3e\" stroke=\"#2b8a3e\" stroke-width=\"1\"/><text x=\"470.0\" y=\"128.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#8a5a2b\" text-anchor=\"middle\">Biber</text><rect x=\"220.0\" y=\"26.7\" width=\"250.0\" height=\"22.4\" rx=\"6\" fill=\"#ffffff\" stroke=\"#8a5a2b\" stroke-width=\"1.2\"/><text x=\"345.0\" y=\"44.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">Boş bir kasanın kütlesi: 3 kg</text></svg>", "son": "<p>Pazarcı domates ve biberleri birbirine karıştırmadan, hiç artmayacak şekilde eşit kütleli poşetlere koyacaktır. Bir poşetteki ürünün kütlesi kilogram cinsinden bir doğal sayıdır ve 5 kg'dan azdır. Olabildiğince az poşet kullanılacaktır.</p>", "k": "Buna göre, pazarcı kaç poşet kullanır?", "sec": ["91", "104", "182", "188"], "secg": null, "c": "A", "a": ["Tartı kasalarla birlikte tartmıştır; boş kasaların kütlesi çıkarılır: domates 81 − 3 = 78 kg, biber 107 − 3 = 104 kg.", "Poşetteki ürün 78 ile 104'ün ortak bölenidir: EBOB = 26 → 1, 2, 13, 26. En az poşet için 5 kg'dan az en büyük ortak bölen seçilir: 2 kg.", "78 : 2 + 104 : 2 = 39 + 52 = 91 poşet."], "t": "188: kasaların kütlesi çıkarılmamış, 1 kg'lık poşetler alınmış; 182: poşetler 1 kg alınmış; 104: biberin kütlesi.", "d": "Tartı, kasayla birlikte tartar. Boş kasanın kütlesini (3 kg) iki tartı değerinden de çıkarmadan ortak bölen aramayın.", "ses": "b03"}, {"no": 4, "on": "<p>Bir sınıfta “Ortak Bölen Avı” oyunu oynanmaktadır. Her oyuncunun kartında iki sayı yazılıdır. Öğretmen 1'den 20'ye kadar olan sayıları sırayla söylemektedir. Söylenen sayı, bir oyuncunun kartındaki iki sayının ortak böleniyse o oyuncu 1 puan almaktadır. Oyuncuların kartları aşağıda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 690 164\" width=\"690\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"20.0\" y=\"30.0\" width=\"146.0\" height=\"120.0\" rx=\"10\" fill=\"#ffffff\" stroke=\"#1f7a8c\" stroke-width=\"2.4\"/><text x=\"93.0\" y=\"60.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"17\" font-weight=\"800\" fill=\"#1f7a8c\" text-anchor=\"middle\">Ali</text><rect x=\"34.0\" y=\"78.0\" width=\"52.0\" height=\"52.0\" rx=\"6\" fill=\"#f8f9fa\" stroke=\"#868e96\" stroke-width=\"1.2\"/><text x=\"60.0\" y=\"112.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"20\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">36</text><rect x=\"100.0\" y=\"78.0\" width=\"52.0\" height=\"52.0\" rx=\"6\" fill=\"#f8f9fa\" stroke=\"#868e96\" stroke-width=\"1.2\"/><text x=\"126.0\" y=\"112.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"20\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">54</text><rect x=\"186.0\" y=\"30.0\" width=\"146.0\" height=\"120.0\" rx=\"10\" fill=\"#ffffff\" stroke=\"#e8590c\" stroke-width=\"2.4\"/><text x=\"259.0\" y=\"60.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"17\" font-weight=\"800\" fill=\"#e8590c\" text-anchor=\"middle\">Ece</text><rect x=\"200.0\" y=\"78.0\" width=\"52.0\" height=\"52.0\" rx=\"6\" fill=\"#f8f9fa\" stroke=\"#868e96\" stroke-width=\"1.2\"/><text x=\"226.0\" y=\"112.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"20\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">40</text><rect x=\"266.0\" y=\"78.0\" width=\"52.0\" height=\"52.0\" rx=\"6\" fill=\"#f8f9fa\" stroke=\"#868e96\" stroke-width=\"1.2\"/><text x=\"292.0\" y=\"112.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"20\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">100</text><rect x=\"352.0\" y=\"30.0\" width=\"146.0\" height=\"120.0\" rx=\"10\" fill=\"#ffffff\" stroke=\"#2b8a3e\" stroke-width=\"2.4\"/><text x=\"425.0\" y=\"60.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"17\" font-weight=\"800\" fill=\"#2b8a3e\" text-anchor=\"middle\">Can</text><rect x=\"366.0\" y=\"78.0\" width=\"52.0\" height=\"52.0\" rx=\"6\" fill=\"#f8f9fa\" stroke=\"#868e96\" stroke-width=\"1.2\"/><text x=\"392.0\" y=\"112.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"20\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">56</text><rect x=\"432.0\" y=\"78.0\" width=\"52.0\" height=\"52.0\" rx=\"6\" fill=\"#f8f9fa\" stroke=\"#868e96\" stroke-width=\"1.2\"/><text x=\"458.0\" y=\"112.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"20\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">70</text><rect x=\"518.0\" y=\"30.0\" width=\"146.0\" height=\"120.0\" rx=\"10\" fill=\"#ffffff\" stroke=\"#6741d9\" stroke-width=\"2.4\"/><text x=\"591.0\" y=\"60.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"17\" font-weight=\"800\" fill=\"#6741d9\" text-anchor=\"middle\">Defne</text><rect x=\"532.0\" y=\"78.0\" width=\"52.0\" height=\"52.0\" rx=\"6\" fill=\"#f8f9fa\" stroke=\"#868e96\" stroke-width=\"1.2\"/><text x=\"558.0\" y=\"112.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"20\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">60</text><rect x=\"598.0\" y=\"78.0\" width=\"52.0\" height=\"52.0\" rx=\"6\" fill=\"#f8f9fa\" stroke=\"#868e96\" stroke-width=\"1.2\"/><text x=\"624.0\" y=\"112.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"20\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">90</text></svg>", "son": "", "k": "Buna göre, öğretmen bütün sayıları söylediğinde <u style=\"white-space:nowrap\">en fazla</u> puanı alan oyuncu kaç puan almıştır?", "sec": ["4", "5", "6", "7"], "secg": null, "c": "D", "a": ["Bir oyuncunun puanı, kartındaki iki sayının 20'yi aşmayan ortak bölenlerinin sayısıdır. Ortak bölenler EBOB'un bölenleridir.", "Ali: EBOB(36, 54) = 18 → 1, 2, 3, 6, 9, 18 (6 puan). Ece: EBOB(40, 100) = 20 → 1, 2, 4, 5, 10, 20 (6 puan). Can: EBOB(56, 70) = 14 → 1, 2, 7, 14 (4 puan).", "Defne: EBOB(60, 90) = 30 → 1, 2, 3, 5, 6, 10, 15, 30; 30 söylenmediği için 7 puan. En fazla puanı Defne alır: 7."], "t": "6: Ali ya da Ece'nin puanı; 5: 20 söylenmemiş sanılıp Ece'nin puanı 5 alınmış; 4: Can'ın puanı. EBOB'u en büyük olan oyuncunun bütün ortak bölenleri söylenmeyebilir.", "d": "Puan, iki sayının 20'yi aşmayan ortak bölenlerinin sayısıdır. EBOB'u en büyük olan oyuncunun bütün ortak bölenleri söylenmeyebilir; 20'den büyük ortak bölen puan getirmez.", "ses": "b04"}, {"no": 5, "on": "<p>İki ortaokul, öğrencilerini aynı gün bir bilim merkezine götürecektir. Okullardan geziye katılacak öğrenci sayıları ile kiralanabilecek araçlar ve bir aracın günlük kirası aşağıda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 690 226\" width=\"690\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"20.0\" y=\"30.0\" width=\"230.0\" height=\"70.0\" rx=\"8\" fill=\"#e3edfb\" stroke=\"#1c5fbf\" stroke-width=\"2\"/><text x=\"135.0\" y=\"60.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">A Ortaokulu</text><text x=\"135.0\" y=\"86.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">Geziye katılan: 112 öğrenci</text><rect x=\"20.0\" y=\"120.0\" width=\"230.0\" height=\"70.0\" rx=\"8\" fill=\"#fff0e2\" stroke=\"#d9480f\" stroke-width=\"2\"/><text x=\"135.0\" y=\"150.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">B Ortaokulu</text><text x=\"135.0\" y=\"176.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">Geziye katılan: 168 öğrenci</text><rect x=\"280.0\" y=\"14.0\" width=\"390.0\" height=\"200.0\" rx=\"10\" fill=\"#ffffff\" stroke=\"#1c5fbf\" stroke-width=\"2.4\"/><rect x=\"280.0\" y=\"14.0\" width=\"390.0\" height=\"36.0\" rx=\"10\" fill=\"#1c5fbf\" stroke=\"none\" stroke-width=\"0\"/><rect x=\"280.0\" y=\"38.0\" width=\"390.0\" height=\"12.0\" rx=\"0\" fill=\"#1c5fbf\" stroke=\"none\" stroke-width=\"0\"/><text x=\"475.0\" y=\"38.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#ffffff\" text-anchor=\"middle\">ARAÇ KİRALAMA</text><text x=\"300.0\" y=\"72.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#333333\" text-anchor=\"start\">Araç</text><text x=\"500.0\" y=\"72.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#333333\" text-anchor=\"middle\">Kapasite</text><text x=\"650.0\" y=\"72.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#333333\" text-anchor=\"end\">Günlük kira</text><line x1=\"294.0\" y1=\"80.0\" x2=\"656.0\" y2=\"80.0\" stroke=\"#000000\" stroke-width=\"1.2\"/><text x=\"300.0\" y=\"104.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Minibüs</text><text x=\"500.0\" y=\"104.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">14 kişilik</text><text x=\"650.0\" y=\"104.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"end\">2400 TL</text><text x=\"300.0\" y=\"132.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Midibüs</text><text x=\"500.0\" y=\"132.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">24 kişilik</text><text x=\"650.0\" y=\"132.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"end\">3600 TL</text><text x=\"300.0\" y=\"160.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Otobüs</text><text x=\"500.0\" y=\"160.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">28 kişilik</text><text x=\"650.0\" y=\"160.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"end\">4500 TL</text><text x=\"300.0\" y=\"188.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Büyük otobüs</text><text x=\"500.0\" y=\"188.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">42 kişilik</text><text x=\"650.0\" y=\"188.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"end\">6300 TL</text></svg>", "son": "<p>Kiralanacak araçların hepsi aynı türden olacaktır. Her okulun öğrencileri ayrı araçlara binecek ve bütün araçlar tam dolu olacaktır. Öğretmenler ayrı bir araçla gidecektir.</p>", "k": "Buna göre, araç kiralama için ödenecek toplam ücret <u style=\"white-space:nowrap\">en az</u> kaç TL'dir?", "sec": ["43 200 TL", "44 100 TL", "45 000 TL", "48 000 TL"], "secg": null, "c": "C", "a": ["Araçlar tam dolu olacağından bir aracın kapasitesi 112 ile 168'in ortak bölenidir. EBOB(112, 168) = 56; ortak bölenler 1, 2, 4, 7, 8, 14, 28, 56'dır.", "Panodaki kapasitelerden yalnız 14 ve 28 ortak bölendir. 14 kişilik: 8 + 12 = 20 araç · 2400 = 48 000 TL. 28 kişilik: 4 + 6 = 10 araç · 4500 = 45 000 TL.", "En az ücret 45 000 TL'dir."], "t": "43 200: 24 kişilik araçlar seçilmiş, araçların tam dolu olması koşulu unutulmuş; 44 100: 42 kişilik araçlar seçilmiş, A Ortaokulunun bir aracı dolmaz; 48 000: 14 kişilik araçlar.", "d": "Araçların tam dolu olması, araç kapasitesinin 112 ile 168'in ortak böleni olması demektir. Kişi başına en ucuz görünen araç, tam dolu olmuyorsa seçilemez.", "ses": "b05"}, {"no": 6, "on": "<p>Bir bahçede iki sulama hortumuna eşit aralıklarla damlatıcı takılacaktır. Hortumların uzunlukları, üzerlerindeki etiketlerde yazılıdır.</p>", "g": "<svg viewBox=\"0 0 690 242\" width=\"690\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"30.0\" y=\"52.0\" width=\"30.0\" height=\"36.0\" rx=\"4\" fill=\"#adb5bd\" stroke=\"#000000\" stroke-width=\"1.2\"/><rect x=\"60.0\" y=\"66.0\" width=\"373.3\" height=\"8.0\" rx=\"4\" fill=\"#2b8a3e\" stroke=\"#1e6b30\" stroke-width=\"1\"/><rect x=\"161.7\" y=\"30.7\" width=\"170.0\" height=\"22.4\" rx=\"6\" fill=\"#ffffff\" stroke=\"#2b8a3e\" stroke-width=\"1.2\"/><text x=\"246.7\" y=\"48.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">1. hortum: 3,6 m</text><text x=\"45.0\" y=\"104.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">musluk</text><rect x=\"30.0\" y=\"142.0\" width=\"30.0\" height=\"36.0\" rx=\"4\" fill=\"#adb5bd\" stroke=\"#000000\" stroke-width=\"1.2\"/><rect x=\"60.0\" y=\"156.0\" width=\"560.0\" height=\"8.0\" rx=\"4\" fill=\"#2b8a3e\" stroke=\"#1e6b30\" stroke-width=\"1\"/><rect x=\"255.0\" y=\"120.7\" width=\"170.0\" height=\"22.4\" rx=\"6\" fill=\"#ffffff\" stroke=\"#2b8a3e\" stroke-width=\"1.2\"/><text x=\"340.0\" y=\"138.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">2. hortum: 5,4 m</text><text x=\"45.0\" y=\"194.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">musluk</text><text x=\"345.0\" y=\"232.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"600\" fill=\"#333333\" text-anchor=\"middle\">Hortumlar temsilî olarak çizilmiştir.</text></svg>", "son": "<p>Her hortumun başına damlatıcı takılacak, sonuna takılmayacaktır. İki hortumda damlatıcılar arasındaki uzaklık aynıdır; bu uzaklık santimetre cinsinden bir doğal sayıdır ve 40 cm'den kısadır. Olabildiğince az damlatıcı kullanılacaktır.</p>", "k": "Buna göre, kaç damlatıcı kullanılır?", "sec": ["20", "23", "25", "26"], "secg": null, "c": "C", "a": ["3,6 m = 360 cm ve 5,4 m = 540 cm'dir. Aralık bu iki uzunluğun ortak bölenidir: EBOB = 180.", "En az damlatıcı için 40 cm'den kısa en büyük ortak bölen seçilir: 36 cm. Hortumlarda 360 : 36 = 10 ve 540 : 36 = 15 aralık vardır.", "Damlatıcı yalnız başa takıldığından her hortumdaki damlatıcı sayısı aralık sayısına eşittir: 10 + 15 = 25."], "t": "26: hortumlar uç uca eklenmiş gibi düşünülüp 900 : 36 + 1 hesaplanmış; 23: başa da sona da damlatıcı takılmamış sayılmış; 20: aralık 45 cm alınmış, 45 cm 40 cm'den uzundur.", "d": "Damlatıcı başa takılıp sona takılmıyorsa her hortumdaki damlatıcı sayısı aralık sayısına eşittir. 40 cm sınırını unutmayın: 45 cm uygun değildir.", "ses": "b06"}, {"no": 7, "on": "<p>Bir kargo şirketi, A ve B firmalarının yüklerini tırla taşıyacaktır. Yüklerin kütleleri ve şirketin taşıma koşulları aşağıdaki panoda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 690 216\" width=\"690\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"20.0\" y=\"70.0\" width=\"300.0\" height=\"110.0\" rx=\"6\" fill=\"#e3edfb\" stroke=\"#1c5fbf\" stroke-width=\"2\"/><rect x=\"320.0\" y=\"100.0\" width=\"90.0\" height=\"80.0\" rx=\"8\" fill=\"#d0ebff\" stroke=\"#1c5fbf\" stroke-width=\"2\"/><rect x=\"340.0\" y=\"112.0\" width=\"50.0\" height=\"30.0\" rx=\"4\" fill=\"#ffffff\" stroke=\"#1c5fbf\" stroke-width=\"1.2\"/><circle cx=\"60.0\" cy=\"186.0\" r=\"16.0\" fill=\"#495057\" stroke=\"#000000\" stroke-width=\"1.2\"/><circle cx=\"60.0\" cy=\"186.0\" r=\"6.0\" fill=\"#adb5bd\" stroke=\"#000000\" stroke-width=\"1\"/><circle cx=\"130.0\" cy=\"186.0\" r=\"16.0\" fill=\"#495057\" stroke=\"#000000\" stroke-width=\"1.2\"/><circle cx=\"130.0\" cy=\"186.0\" r=\"6.0\" fill=\"#adb5bd\" stroke=\"#000000\" stroke-width=\"1\"/><circle cx=\"270.0\" cy=\"186.0\" r=\"16.0\" fill=\"#495057\" stroke=\"#000000\" stroke-width=\"1.2\"/><circle cx=\"270.0\" cy=\"186.0\" r=\"6.0\" fill=\"#adb5bd\" stroke=\"#000000\" stroke-width=\"1\"/><circle cx=\"360.0\" cy=\"186.0\" r=\"16.0\" fill=\"#495057\" stroke=\"#000000\" stroke-width=\"1.2\"/><circle cx=\"360.0\" cy=\"186.0\" r=\"6.0\" fill=\"#adb5bd\" stroke=\"#000000\" stroke-width=\"1\"/><text x=\"170.0\" y=\"132.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"22\" font-weight=\"800\" fill=\"#1c5fbf\" text-anchor=\"middle\">TIR</text><rect x=\"440.0\" y=\"14.0\" width=\"230.0\" height=\"196.0\" rx=\"10\" fill=\"#ffffff\" stroke=\"#d9480f\" stroke-width=\"2.4\"/><rect x=\"440.0\" y=\"14.0\" width=\"230.0\" height=\"36.0\" rx=\"10\" fill=\"#d9480f\" stroke=\"none\" stroke-width=\"0\"/><rect x=\"440.0\" y=\"38.0\" width=\"230.0\" height=\"12.0\" rx=\"0\" fill=\"#d9480f\" stroke=\"none\" stroke-width=\"0\"/><text x=\"555.0\" y=\"38.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#ffffff\" text-anchor=\"middle\">YÜK VE ÜCRET</text><text x=\"555.0\" y=\"76.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">A firması: 3600 kg</text><text x=\"555.0\" y=\"100.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">B firması: 4200 kg</text><text x=\"555.0\" y=\"124.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">Bir palete en fazla</text><text x=\"555.0\" y=\"148.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">500 kg yük konur.</text><text x=\"555.0\" y=\"172.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">Palet başına: 750 TL</text></svg>", "son": "<p>Yükler, firmaların yükleri karışmayacak şekilde eşit kütleli paletlere hiç yük artmadan yerleştirilecektir. Olabildiğince az palet kullanılacaktır.</p>", "k": "Buna göre, iki firmanın ödeyeceği toplam taşıma ücreti kaç TL'dir?", "sec": ["9750 TL", "19 500 TL", "29 250 TL", "39 000 TL"], "secg": null, "c": "B", "a": ["Bir paletteki yük 3600 ile 4200'ün ortak bölenidir: EBOB(3600, 4200) = 600 kg.", "Bir palete en fazla 500 kg konabildiğinden 500'ü aşmayan en büyük ortak bölen seçilir: 600 : 2 = 300 kg. A firması 3600 : 300 = 12, B firması 4200 : 300 = 14 palet; toplam 26 palet.", "Ücret 26 · 750 = 19 500 TL'dir."], "t": "9750: 500 kg sınırı unutulup 600 kg'lık paletler alınmış; 29 250: paletler 200 kg alınmış; 39 000: paletler 150 kg alınmış.", "d": "Palet yükü iki firmanın yükünün ortak bölenidir ama 500 kg'ı geçemez. EBOB 600 kg olduğu için 500'ü aşmayan en büyük ortak böleni arayın.", "ses": "b07"}, {"no": 8, "on": "<p>Bir parkta, merkezleri aynı olan ve kenarları birbirine paralel iki kare biçimli yürüyüş yolu vardır. İç yolun bir kenarının uzunluğu ve iki yol arasındaki çimenliğin genişliği aşağıdaki planda verilmiştir. Çimenliğin genişliği her yerde aynıdır.</p>", "g": "<svg viewBox=\"0 0 690 256\" width=\"690\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"140.0\" y=\"20.0\" width=\"220.0\" height=\"220.0\" rx=\"0\" fill=\"#e6f4ea\" stroke=\"#2b8a3e\" stroke-width=\"3\"/><rect x=\"184.0\" y=\"64.0\" width=\"132.0\" height=\"132.0\" rx=\"0\" fill=\"#ffffff\" stroke=\"#2b8a3e\" stroke-width=\"3\"/><rect x=\"225.3\" y=\"200.7\" width=\"49.4\" height=\"22.4\" rx=\"6\" fill=\"#ffffff\" stroke=\"#868e96\" stroke-width=\"1.2\"/><text x=\"250.0\" y=\"218.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">40 m</text><line x1=\"316.0\" y1=\"130.0\" x2=\"360.0\" y2=\"130.0\" stroke=\"#000000\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><rect x=\"314.4\" y=\"99.7\" width=\"47.1\" height=\"20.8\" rx=\"6\" fill=\"#ffffff\" stroke=\"#868e96\" stroke-width=\"1.2\"/><text x=\"338.0\" y=\"115.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">10 m</text><text x=\"250.0\" y=\"136.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">iç yol</text><text x=\"250.0\" y=\"40.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">dış yol</text><text x=\"470.0\" y=\"120.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"start\">Yolların genişliği</text><text x=\"470.0\" y=\"140.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"start\">dikkate alınmamıştır.</text></svg>", "son": "<p>İki yolun kenarına, her köşeye bir lamba gelecek şekilde eşit aralıklarla lamba dikilecektir. İki yolda lambalar arasındaki uzaklık aynıdır ve metre cinsinden bir doğal sayıdır.</p>", "k": "Buna göre, <u style=\"white-space:nowrap\">en az</u> kaç lamba dikilir?", "sec": ["8", "12", "16", "20"], "secg": null, "c": "D", "a": ["Dış karenin kenarı, iç karenin kenarına iki yandaki çimenlik eklenerek bulunur: 40 + 10 + 10 = 60 m.", "Aralık 40 ile 60'ın ortak bölenidir; en az lamba için EBOB(40, 60) = 20 m seçilir.", "Kare kapalı bir çizgidir; lamba sayısı aralık sayısına eşittir. İç yol: 160 : 20 = 8, dış yol: 240 : 20 = 12. Toplam 20 lamba."], "t": "8 ve 12: yalnız bir yolun lambaları; 16: köşelerdeki lambalar iki yol arasında ortak sanılıp çıkarılmış. Dış kenar 40 + 10 = 50 m alınırsa aralık 10 m bulunur ve sonuç da yanlış çıkar.", "d": "Dış karenin kenarı, iç karenin kenarına çimenliğin iki yanı eklenerek bulunur: 40 + 10 + 10. Kare kapalı bir çizgi olduğu için lamba sayısı aralık sayısına eşittir.", "ses": "b08"}, {"no": 9, "on": "<p>Bir sanat galerisinin iki duvarına tablolar asılacaktır. Duvarların uzunlukları ve birinci duvardaki kapının genişliği aşağıdaki planda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 690 140\" width=\"690\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"30.0\" y=\"40.0\" width=\"300.0\" height=\"16.0\" rx=\"0\" fill=\"#dee2e6\" stroke=\"#000000\" stroke-width=\"1.4\"/><rect x=\"285.0\" y=\"40.0\" width=\"45.0\" height=\"16.0\" rx=\"0\" fill=\"#ffffff\" stroke=\"#d9480f\" stroke-width=\"1.6\" stroke-dasharray=\"4 3\"/><rect x=\"380.0\" y=\"40.0\" width=\"300.0\" height=\"16.0\" rx=\"0\" fill=\"#dee2e6\" stroke=\"#000000\" stroke-width=\"1.4\"/><text x=\"180.0\" y=\"88.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">1. duvar: 7,4 m</text><text x=\"307.0\" y=\"32.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#d9480f\" text-anchor=\"middle\">kapı: 1,1 m</text><text x=\"530.0\" y=\"88.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">2. duvar: 8,4 m</text><text x=\"345.0\" y=\"128.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"600\" fill=\"#333333\" text-anchor=\"middle\">Galeri planı (üstten görünüm, ölçekli değildir)</text></svg>", "son": "<p>Tabloların hepsi aynı genişliktedir ve yan yana, aralarında boşluk kalmayacak şekilde asılacaktır. Kapının bulunduğu bölüme tablo asılmayacak, duvarların geri kalan bölümleri tablolarla tamamen dolacaktır. Bir tablonun genişliği santimetre cinsinden bir doğal sayıdır; <u style=\"white-space:nowrap\">en az</u> 50 cm, <u style=\"white-space:nowrap\">en fazla</u> 80 cm'dir.</p>", "k": "Buna göre, galeriye kaç tablo asılır?", "sec": ["12", "14", "21", "42"], "secg": null, "c": "C", "a": ["Birinci duvarda tablo asılacak bölüm 7,4 − 1,1 = 6,3 m = 630 cm, ikinci duvar 8,4 m = 840 cm'dir.", "Tablo genişliği 630 ile 840'ın ortak bölenidir: EBOB = 210. 210'un bölenlerinden 50 ile 80 arasında olan yalnız 70'tir.", "630 : 70 + 840 : 70 = 9 + 12 = 21 tablo."], "t": "12: yalnız ikinci duvarın tabloları; 14: tablo genişliği 105 cm alınmış, 80 cm'den geniştir; 42: tablo genişliği 35 cm alınmış, 50 cm'den dardır.", "d": "Kapının bulunduğu bölüme tablo asılmaz; birinci duvardan kapı genişliğini çıkarın. Sonra 50 ile 80 cm arasındaki ortak böleni seçin.", "ses": "b09"}, {"no": 10, "on": "<p>Bir kooperatifin deposundaki un ve şeker, birbirine karıştırılmadan, hiç artmayacak şekilde eşit kütleli ve olabilecek en ağır çuvallara doldurulmuştur. Depo fişinde şekerin kütlesini gösteren üç basamaklı sayının onlar basamağındaki rakam mürekkep lekesi nedeniyle okunamamaktadır.</p>", "g": "<svg viewBox=\"0 0 690 240\" width=\"690\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"220.0\" y=\"10.0\" width=\"250.0\" height=\"220.0\" rx=\"4\" fill=\"#fffdf2\" stroke=\"#c9b48a\" stroke-width=\"1.6\"/><text x=\"345.0\" y=\"44.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"18\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">DEPO FİŞİ</text><line x1=\"240.0\" y1=\"56.0\" x2=\"450.0\" y2=\"56.0\" stroke=\"#c9b48a\" stroke-width=\"1.2\"/><text x=\"250.0\" y=\"92.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Un:</text><text x=\"440.0\" y=\"92.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"end\">234 kg</text><text x=\"250.0\" y=\"132.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Şeker:</text><text x=\"372.0\" y=\"132.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"end\">1</text><text x=\"406.0\" y=\"132.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"start\">4 kg</text><ellipse cx=\"389\" cy=\"126\" rx=\"14\" ry=\"12\" fill=\"#5c6370\"/><circle cx=\"401\" cy=\"117\" r=\"4\" fill=\"#5c6370\"/><circle cx=\"378\" cy=\"138\" r=\"3\" fill=\"#5c6370\"/><text x=\"250.0\" y=\"172.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Bir çuval:</text><text x=\"440.0\" y=\"172.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"end\">26 kg</text><line x1=\"240.0\" y1=\"192.0\" x2=\"450.0\" y2=\"192.0\" stroke=\"#c9b48a\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/></svg>", "son": "", "k": "Buna göre, kooperatif toplam kaç çuval kullanmıştır?", "sec": ["13", "14", "15", "16"], "secg": null, "c": "A", "a": ["Çuvallar olabilecek en ağır olduğundan çuvalın kütlesi, un ile şekerin kütlelerinin EBOB'udur: EBOB(234, şeker) = 26.", "Şeker 26'nın katıdır ve 1 ile başlayıp 4 ile biter: 26'nın katları 104, 130, 156, 182 olup yalnız 104 uygundur. EBOB(234, 104) = 26 doğrulanır.", "Un 234 : 26 = 9 çuval, şeker 104 : 26 = 4 çuval; toplam 13 çuval."], "t": "14, 15 ve 16: şeker 130, 156 ya da 182 kg alınmış; bu sayılar 4 ile bitmez.", "d": "Çuvallar olabilecek en ağır olduğundan çuval kütlesi iki miktarın EBOB'udur. Şeker 26'nın katı olmakla kalmamalı, 234 ile EBOB'u tam 26 olmalı ve 1 ile başlayıp 4 ile bitmelidir.", "ses": "b10"}, {"no": 11, "on": "<p>Bir ahşap atölyesinde bir çam çıta ve bir meşe çıta vardır. Çıtaların uzunlukları aşağıda verilmiştir. Çıtalar hiç artmayacak şekilde birbirine eş parçalara kesilecektir. Bir parçanın uzunluğu santimetre cinsinden bir doğal sayıdır, 40 cm'den kısadır ve olabilecek en uzun değerdedir.</p>", "g": "<svg viewBox=\"0 0 690 200\" width=\"690\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"20.0\" y=\"50.0\" width=\"390.0\" height=\"16.0\" rx=\"3\" fill=\"#f3d9a4\" stroke=\"#8a5a2b\" stroke-width=\"1.4\"/><text x=\"215.0\" y=\"40.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">Çam çıta: 3,9 m</text><rect x=\"20.0\" y=\"120.0\" width=\"260.0\" height=\"16.0\" rx=\"3\" fill=\"#a0522d\" stroke=\"#5c2d0e\" stroke-width=\"1.4\"/><text x=\"150.0\" y=\"110.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">Meşe çıta: 2,6 m</text><rect x=\"500.0\" y=\"40.0\" width=\"130.0\" height=\"14.0\" rx=\"0\" fill=\"#f3d9a4\" stroke=\"#8a5a2b\" stroke-width=\"1.2\"/><rect x=\"500.0\" y=\"156.0\" width=\"130.0\" height=\"14.0\" rx=\"0\" fill=\"#f3d9a4\" stroke=\"#8a5a2b\" stroke-width=\"1.2\"/><rect x=\"500.0\" y=\"40.0\" width=\"14.0\" height=\"130.0\" rx=\"0\" fill=\"#a0522d\" stroke=\"#5c2d0e\" stroke-width=\"1.2\"/><rect x=\"616.0\" y=\"40.0\" width=\"14.0\" height=\"130.0\" rx=\"0\" fill=\"#a0522d\" stroke=\"#5c2d0e\" stroke-width=\"1.2\"/><text x=\"565.0\" y=\"194.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">Örnek çerçeve</text><text x=\"565.0\" y=\"32.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">çam</text><text x=\"492.0\" y=\"105.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"end\">meşe</text></svg>", "son": "<p>Parçalarla kare biçimli çerçeveler yapılacaktır. Her çerçevenin karşılıklı iki kenarı çam, diğer iki kenarı meşe parçadır. Olabildiğince çok çerçeve yapılacaktır.</p>", "k": "Buna göre, çerçeveler yapıldıktan sonra kaç parça artar?", "sec": ["0", "1", "5", "10"], "secg": null, "c": "C", "a": ["3,9 m = 390 cm ve 2,6 m = 260 cm'dir. Parça uzunluğu bu iki sayının ortak bölenidir: EBOB = 130. 40 cm'den kısa en büyük ortak bölen 26 cm'dir.", "Çam çıtadan 390 : 26 = 15, meşe çıtadan 260 : 26 = 10 parça elde edilir.", "Her çerçeve 2 meşe parça kullandığından en fazla 10 : 2 = 5 çerçeve yapılır; 5 · 2 = 10 çam parça kullanılır. 15 − 10 = 5 çam parça artar."], "t": "0: yalnız meşe parçalara bakılmış; 1: 40 cm sınırı unutulup parça 130 cm alınmış; 10: parça 13 cm alınmış.", "d": "Önce parça uzunluğunu 40 cm sınırıyla bulun. Her çerçeve 2 çam ve 2 meşe parça kullanır; çerçeve sayısını az olan parça türü belirler.", "ses": "b11"}, {"no": 12, "on": "<p>Bir bisikletçi, kapalı bir velodromda antrenman yapacaktır. Antrenman tahtasındaki bilgiler aşağıda verilmiştir. Bisikletçi sürat ve dayanıklılık çalışmalarının her birini eşit uzunlukta setlere bölecektir. İki çalışmada bir setin uzunluğu aynıdır.</p>", "g": "<svg viewBox=\"0 0 690 230\" width=\"690\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><ellipse cx=\"210\" cy=\"125\" rx=\"180\" ry=\"95\" fill=\"none\" stroke=\"#d9480f\" stroke-width=\"22\"/><ellipse cx=\"210\" cy=\"125\" rx=\"150\" ry=\"70\" fill=\"#e6f4ea\" stroke=\"#9cc59a\" stroke-width=\"1.4\"/><line x1=\"210.0\" y1=\"20.0\" x2=\"210.0\" y2=\"50.0\" stroke=\"#ffffff\" stroke-width=\"4\"/><text x=\"210.0\" y=\"14.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">başlangıç çizgisi</text><rect x=\"440.0\" y=\"18.0\" width=\"230.0\" height=\"190.0\" rx=\"10\" fill=\"#ffffff\" stroke=\"#2b8a3e\" stroke-width=\"2.4\"/><rect x=\"440.0\" y=\"18.0\" width=\"230.0\" height=\"36.0\" rx=\"10\" fill=\"#2b8a3e\" stroke=\"none\" stroke-width=\"0\"/><rect x=\"440.0\" y=\"42.0\" width=\"230.0\" height=\"12.0\" rx=\"0\" fill=\"#2b8a3e\" stroke=\"none\" stroke-width=\"0\"/><text x=\"555.0\" y=\"42.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#ffffff\" text-anchor=\"middle\">ANTRENMAN</text><text x=\"555.0\" y=\"80.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">Bir tur: 250 m</text><text x=\"555.0\" y=\"107.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">Sürat: 6 km</text><text x=\"555.0\" y=\"134.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">Dayanıklılık: 4,5 km</text><text x=\"555.0\" y=\"161.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">Bir set: en fazla 1 km</text></svg>", "son": "<p>Her set başlangıç çizgisinde başlayıp yine başlangıç çizgisinde bitmektedir.</p>", "k": "Buna göre, bisikletçi <u style=\"white-space:nowrap\">en az</u> kaç set yapar?", "sec": ["6", "7", "8", "14"], "secg": null, "c": "D", "a": ["Set başlangıç çizgisinde bitiyorsa set uzunluğu bir turun (250 m) katıdır. Ayrıca set uzunluğu 6000 m ile 4500 m'nin ortak bölenidir: EBOB = 1500.", "1500'ün 250'nin katı olan bölenleri 250, 500, 750 ve 1500'dür. Bir set en fazla 1 km olduğundan 1500 m olmaz. En az set için en uzun set seçilir: 750 m (3 tur).", "6000 : 750 + 4500 : 750 = 8 + 6 = 14 set."], "t": "7: 1 km sınırı unutulup set 1500 m alınmış; 8 ve 6: yalnız bir çalışmanın set sayısı.", "d": "Her set başlangıç çizgisinde bittiğinden set uzunluğu 250 m'nin katıdır. Set aynı zamanda 6000 ile 4500'ün ortak bölenidir ve 1 km'yi geçemez.", "ses": "b12"}, {"no": 13, "on": "<p>Bir dağcı, kısa olanı 4,2 m uzunluğunda olan iki ipi hiç artmayacak şekilde birbirine eş ve olabilecek en uzun parçalara kesecektir. Dağcı, iplerin santimetre cinsinden uzunluklarının EBOB'unu algoritma yöntemiyle defterine bulmuştur. Defterin ıslanan bölümündeki sayılar okunamamakta ve kesik çizgili kutularla gösterilmektedir.</p>", "g": "<div style=\"display:flex;justify-content:center\"><div style=\"background:#fffdf2;border:.4mm solid #c9b48a;border-radius:2mm;padding:2mm 5mm\"><svg viewBox=\"0 0 272 160\" width=\"272\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"126.0\" y1=\"4.0\" x2=\"126.0\" y2=\"156.0\" stroke=\"#000000\" stroke-width=\"1.8\"/><text x=\"40.0\" y=\"25.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">420</text><rect x=\"76.0\" y=\"7.8\" width=\"40.0\" height=\"24.0\" rx=\"4\" fill=\"#f1f3f5\" stroke=\"#868e96\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><text x=\"150.0\" y=\"25.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"700\" fill=\"#c2255c\" text-anchor=\"middle\">2</text><rect x=\"20.0\" y=\"37.8\" width=\"40.0\" height=\"24.0\" rx=\"4\" fill=\"#f1f3f5\" stroke=\"#868e96\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><rect x=\"76.0\" y=\"37.8\" width=\"40.0\" height=\"24.0\" rx=\"4\" fill=\"#f1f3f5\" stroke=\"#868e96\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><text x=\"150.0\" y=\"55.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"700\" fill=\"#c2255c\" text-anchor=\"middle\">2</text><rect x=\"20.0\" y=\"67.8\" width=\"40.0\" height=\"24.0\" rx=\"4\" fill=\"#f1f3f5\" stroke=\"#868e96\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><rect x=\"76.0\" y=\"67.8\" width=\"40.0\" height=\"24.0\" rx=\"4\" fill=\"#f1f3f5\" stroke=\"#868e96\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><text x=\"150.0\" y=\"85.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"700\" fill=\"#c2255c\" text-anchor=\"middle\">3</text><rect x=\"20.0\" y=\"97.8\" width=\"40.0\" height=\"24.0\" rx=\"4\" fill=\"#f1f3f5\" stroke=\"#868e96\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><rect x=\"76.0\" y=\"97.8\" width=\"40.0\" height=\"24.0\" rx=\"4\" fill=\"#f1f3f5\" stroke=\"#868e96\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><text x=\"150.0\" y=\"115.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"700\" fill=\"#c2255c\" text-anchor=\"middle\">7</text><text x=\"40.0\" y=\"145.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">5</text><rect x=\"76.0\" y=\"127.8\" width=\"40.0\" height=\"24.0\" rx=\"4\" fill=\"#f1f3f5\" stroke=\"#868e96\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/></svg></div></div>", "son": "<p>Uzun ip, kısa ipten 168 cm uzundur.</p>", "k": "Buna göre, dağcı toplam kaç parça ip elde eder?", "sec": ["2", "5", "7", "12"], "secg": null, "c": "D", "a": ["Tablonun sağındaki bölenlerin çarpımı EBOB'dur: 2 · 2 · 3 · 7 = 84. Parça uzunluğu 84 cm'dir; kısa ip 420 : 84 = 5 parçaya ayrılır (tablonun son satırında 5 vardır).", "Uzun ip 420 + 168 = 588 cm'dir: 588 : 84 = 7 parça. Tablonun son satırı 5 ve 7 olur; 5 ile 7'nin ortak böleni kalmadığı için algoritma doğru biter.", "Toplam 5 + 7 = 12 parça."], "t": "5 ve 7: yalnız bir ipin parçaları; 2: iki ip arasındaki fark (168 cm) parça uzunluğuna bölünmüş.", "d": "Tablonun sağındaki asalların çarpımı EBOB'dur (84 cm). Son satırdaki 5, kısa ipten çıkan parça sayısıdır; uzun ipin uzunluğunu farktan bulun.", "ses": "b13"}, {"no": 14, "on": "<p>Okul şenliği için tabanlarının uzunlukları eşit olan iki üçgen flama hazırlanmıştır. Flamalar, tabanları aynı ipin üzerine gelecek şekilde aşağıdaki gibi asılmıştır. Flamaların alanları üzerlerinde yazılıdır.</p>", "g": "<svg viewBox=\"0 0 690 242\" width=\"690\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"20.0\" y1=\"40.0\" x2=\"670.0\" y2=\"40.0\" stroke=\"#8a5a2b\" stroke-width=\"3\"/><polygon points=\"140,40 300,40 220,150\" fill=\"#e3edfb\" stroke=\"#1c5fbf\" stroke-width=\"2\"/><text x=\"220.0\" y=\"80.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">60 cm²</text><polygon points=\"390,40 550,40 470,210\" fill=\"#fff0e2\" stroke=\"#d9480f\" stroke-width=\"2\"/><text x=\"470.0\" y=\"90.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">105 cm²</text><text x=\"345.0\" y=\"232.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"600\" fill=\"#333333\" text-anchor=\"middle\">Şekil ölçekli değildir.</text></svg>", "son": "<p>Flamaların taban uzunluğu ve yükseklikleri santimetre cinsinden doğal sayıdır. Taban uzunluğu 20 cm'den kısadır.</p>", "k": "Buna göre, iki flamanın ipe en uzak köşeleri arasındaki yükseklik farkı <u style=\"white-space:nowrap\">en az</u> kaç santimetredir?", "sec": ["3", "6", "9", "15"], "secg": null, "c": "B", "a": ["Üçgenin alanı (taban · yükseklik) : 2'dir. Bu yüzden taban · yükseklik çarpımı birinci flamada 120, ikincide 210'dur. Taban, 120 ile 210'un ortak bölenidir: EBOB = 30.", "Yükseklik farkı 210 : taban − 120 : taban = 90 : taban'dır. Fark en az olsun diye taban en uzun seçilir; 20 cm'den kısa en büyük ortak bölen 15'tir.", "Yükseklikler 120 : 15 = 8 cm ve 210 : 15 = 14 cm'dir; fark 6 cm'dir."], "t": "3: 20 cm sınırı unutulup taban 30 cm alınmış; 9: taban 10 cm alınmış; 15: taban 6 cm alınmış.", "d": "Üçgenin alanında taban · yükseklik çarpımı alanın 2 katıdır (120 ve 210). Yükseklik farkı 90 : taban olduğundan fark en az olsun diye taban en uzun seçilir.", "ses": "b14"}, {"no": 15, "on": "<p>Ayşe, dikdörtgen biçimli iki fotoğrafı yan yana yapıştırarak dikdörtgen biçimli bir kolaj hazırlayacaktır. Fotoğrafların alanları, arkalarına yapıştırılan notlarda yazılıdır.</p>", "g": "<svg viewBox=\"0 0 690 232\" width=\"690\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"150.0\" y=\"40.0\" width=\"150.0\" height=\"150.0\" rx=\"2\" fill=\"#e7f5ff\" stroke=\"#1c5fbf\" stroke-width=\"2.4\"/><rect x=\"300.0\" y=\"40.0\" width=\"240.0\" height=\"150.0\" rx=\"2\" fill=\"#fff4e6\" stroke=\"#d9480f\" stroke-width=\"2.4\"/><rect x=\"184.6\" y=\"100.8\" width=\"80.7\" height=\"25.6\" rx=\"6\" fill=\"#ffffff\" stroke=\"#868e96\" stroke-width=\"1.2\"/><text x=\"225.0\" y=\"120.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">180 cm²</text><rect x=\"379.6\" y=\"100.8\" width=\"80.7\" height=\"25.6\" rx=\"6\" fill=\"#ffffff\" stroke=\"#868e96\" stroke-width=\"1.2\"/><text x=\"420.0\" y=\"120.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">300 cm²</text><text x=\"345.0\" y=\"220.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"600\" fill=\"#333333\" text-anchor=\"middle\">Fotoğraflar temsilî olarak çizilmiştir; ölçekli değildir.</text></svg>", "son": "<p>Fotoğrafların yükseklikleri eşittir ve aralarında boşluk kalmayacaktır. Fotoğrafların kenar uzunlukları santimetre cinsinden doğal sayıdır. Ayşe, kolajın çevresine renkli bir şerit yapıştıracaktır.</p>", "k": "Buna göre, Ayşe'nin kullanacağı şerit <u style=\"white-space:nowrap\">en az</u> kaç santimetredir?", "sec": ["88", "94", "104", "136"], "secg": null, "c": "A", "a": ["Ortak yükseklik 180 ile 300'ün ortak bölenidir: EBOB = 60 → 1, 2, 3, 4, 5, 6, 10, 12, 15, 20, 30, 60.", "Kolajın alanı 180 + 300 = 480 cm²'dir; genişliği 480 : yükseklik olur. Çevre 2 · (yükseklik + 480 : yükseklik): yükseklik 12 → 104, 15 → 94, 20 → 88, 30 → 92, 60 → 136 cm.", "En kısa şerit, yükseklik 20 cm iken 88 cm'dir. Ortak bölenin en büyük seçilmesi (60) çevreyi en küçük yapmaz."], "t": "136: yükseklik EBOB alınmış; 94 ve 104: yükseklik 15 cm ya da 12 cm alınmış.", "d": "Ortak yükseklik 180 ile 300'ün ortak bölenidir; ama en büyük ortak bölen en kısa şeridi vermez. Çevreyi her ortak bölen için hesaplayıp karşılaştırın.", "ses": "b15"}, {"no": 16, "on": "<p>Dikdörtgen biçimindeki bir dükkân; depo, ofis ve satış alanı olmak üzere dikdörtgen biçimli üç bölüme ayrılmıştır. Dükkânın planında depo ile ofisin alanları ve dükkânın ön cephesinin uzunluğu yazılıdır.</p>", "g": "<svg viewBox=\"0 0 690 280\" width=\"690\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"80.0\" y=\"20.0\" width=\"170.0\" height=\"90.0\" rx=\"0\" fill=\"#e3edfb\" stroke=\"#1c5fbf\" stroke-width=\"2\"/><rect x=\"80.0\" y=\"110.0\" width=\"170.0\" height=\"110.0\" rx=\"0\" fill=\"#e6f4ea\" stroke=\"#2b8a3e\" stroke-width=\"2\"/><rect x=\"250.0\" y=\"20.0\" width=\"300.0\" height=\"200.0\" rx=\"0\" fill=\"#fff0e2\" stroke=\"#d9480f\" stroke-width=\"2\"/><text x=\"165.0\" y=\"62.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">Depo</text><text x=\"165.0\" y=\"86.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">54 m²</text><text x=\"165.0\" y=\"160.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">Ofis</text><text x=\"165.0\" y=\"184.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">72 m²</text><text x=\"400.0\" y=\"112.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">Satış alanı</text><text x=\"400.0\" y=\"138.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"22\" font-weight=\"800\" fill=\"#d9480f\" text-anchor=\"middle\">?</text><line x1=\"315.0\" y1=\"244.0\" x2=\"80.0\" y2=\"244.0\" stroke=\"#000000\" stroke-width=\"1.4\"/><polygon points=\"80.0,244.0 88.0,240.0 88.0,248.0\" fill=\"#000000\"/><line x1=\"315.0\" y1=\"244.0\" x2=\"550.0\" y2=\"244.0\" stroke=\"#000000\" stroke-width=\"1.4\"/><polygon points=\"550.0,244.0 542.0,248.0 542.0,240.0\" fill=\"#000000\"/><rect x=\"275.0\" y=\"233.0\" width=\"80.0\" height=\"22.0\" rx=\"0\" fill=\"#ffffff\" stroke=\"#ffffff\" stroke-width=\"0\"/><text x=\"315.0\" y=\"250.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">17 m</text><text x=\"315.0\" y=\"270.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">ön cephe (vitrin tarafı)</text></svg>", "son": "<p>Bütün kenar uzunlukları metre cinsinden doğal sayıdır. Depo ile ofisin her kenarı en az 4 m'dir. Satış alanının alanı, dükkânın taban alanının yarısından fazladır.</p>", "k": "Buna göre, satış alanının alanı kaç metrekaredir?", "sec": ["112", "231", "238", "357"], "secg": null, "c": "B", "a": ["Depo ile ofisin genişliği ortaktır; bu genişlik 54 ile 72'nin ortak bölenidir: EBOB = 18 → 1, 2, 3, 6, 9, 18. Ön cephe 17 m olduğundan genişlik 17'den küçüktür.", "Kenarların en az 4 m olması için genişlik 6 (depo 6 × 9, ofis 6 × 12) ya da 9 (depo 9 × 6, ofis 9 × 8) olabilir. Genişlik 6 ise dükkânın derinliği 21 m, satış alanı 11 × 21 = 231 m²; genişlik 9 ise derinlik 14 m, satış alanı 8 × 14 = 112 m².", "Dükkânın alanı 357 m² iken 231 > 178,5'tir; 238 m² iken 112 < 119'dur. Koşula uyan satış alanı 231 m²'dir."], "t": "112: ikinci durumda satış alanı yarıdan küçüktür; 238: ikinci durumda dükkânın alanı; 357: birinci durumda dükkânın alanı.", "d": "Depo ile ofisin genişliği 54 ile 72'nin ortak bölenidir. Kenarların en az 4 m olması ve satış alanının dükkânın yarısından büyük olması koşullarını ayrı ayrı denetleyin.", "ses": "b16"}]};
const $=s=>document.querySelector(s);$("#kod").textContent=V.kod;$("#bas").textContent=V.baslik+" · Çözümler";

  n.onclick=ekle;t.onclick=()=>{while(i<list.length)ekle();};dd.append(n,t);kap.appendChild(dd);ciz();}

  k.innerHTML=`<span class="et">SIRA SENDE · ${s.no}</span><h2>${s.bas}</h2>`;

    k.appendChild(sesKutu(`s${s.no}-${j+1}`));adimAdim(w,x.a,()=>{const c=document.createElement("p");c.className="cevap";c.innerHTML="<b>Cevap:</b> "+x.c;w.appendChild(c);});});return k;}

  k.innerHTML=`<span class="et">KALEM KÂĞIT · ${s.no}</span><h2>${s.bas}</h2><p>${s.yon}</p><table><thead><tr><th>SAYI</th><th>CEVAP</th></tr></thead><tbody>${s.r.map(r=>`<tr><td><b>${r.n}</b></td><td>${r.c}</td></tr>`).join("")}</tbody></table>`;return k;}
