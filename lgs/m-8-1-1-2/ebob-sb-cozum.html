<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çözümler · Keşfet ve Çöz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--muted:#5b6478;--line:#dfe5ef;--bg:#f5f7fb;--card:#fff;--ss:#6741d9;--kk:#0b7285;--b:#d0700f;--ok:#2b8a3e;--warn:#c92a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif}
header{background:linear-gradient(135deg,#1c5fbf,#2f8fe0);color:#fff;padding:18px 16px 22px}

main{max-width:780px;margin:14px auto 40px;padding:0 16px}
nav.sec{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}nav.sec button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}

ol.sec{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
ol.sec li{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}ol.sec li.dogru{border-color:var(--ok);background:#ebfbee;font-weight:800}
.adim{border-left:4px solid var(--c);padding:6px 12px;margin:8px 0;background:#fff;border-radius:0 10px 10px 0;animation:gel .35s ease-out}
.adim b{color:var(--c)}@keyframes gel{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dug{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
button.btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.dikkat{background:#fff4e6;border:2px solid #f59f00;border-radius:12px;padding:10px 14px;margin:12px 0 4px}.dikkat b{color:#d9480f}
.tuzak{font-size:15px;color:var(--muted);margin-top:8px}
.cevap{font-weight:900;color:var(--ok);margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid var(--line);padding:8px 10px;text-align:left}th{background:#e3fafc;color:#0b7285;font-size:13px;letter-spacing:.06em}
.ses{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border-radius:12px;background:#eef2ff}

.ses span{font-size:14px;color:var(--muted)}
.gizli{display:none}
.tum{margin:4px 0 14px;font-size:14px}.tum a{color:#1c5fbf;font-weight:800}
@media (prefers-reduced-motion:reduce){.adim{animation:none}}
/* Canlandır (05.10.2026) */
.sek{display:flex;gap:6px;margin:12px 0 0;border-bottom:2px solid var(--line)}
.sek button{border:0;background:none;font:inherit;font-weight:900;font-size:15px;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);min-height:44px;position:relative;top:2px;border-bottom:3px solid transparent}
.sek button[aria-selected=true]{color:var(--c);border-bottom-color:var(--c);background:#fff8f0}
.sek .yeni{display:inline-block;font-size:10px;background:#2b8a3e;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.06em}
.cn{padding-top:10px}
.cn-yon{background:#eef6ff;border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:10px}
.cn-sahne{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;min-height:120px;overflow-x:auto}

.cn-adimci input,.cn-test input{width:84px;height:44px;border:2px solid var(--line);border-radius:12px;font:inherit;font-weight:900;text-align:center;font-size:18px}
.cn-test label{font-weight:800;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.cn-btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
.cn-btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.cn-btn[aria-pressed=true]{background:var(--ac,var(--c));color:#fff;border-color:var(--ac,var(--c))}
.cn-btn:disabled{opacity:.5}
.cn-hazir{display:flex;flex-wrap:wrap;gap:6px}

.cn-dur .iyi{color:var(--ok);font-weight:900}.cn-dur .kotu{color:var(--warn);font-weight:900}
.cn-df{margin-top:10px;overflow-x:auto}@media(max-width:480px){.cn-adimci>span{flex-basis:100%}.cn-h{font-size:12px;padding:5px 0}.cn-izg{gap:3px}.cn-sahne{padding:6px}}@media(max-width:480px){.cn-df table{font-size:13px}.cn-df td,.cn-df th{padding:4px 5px}}.cn-df summary{font-weight:900;cursor:pointer;padding:6px 0}.cn-say{color:var(--muted);font-weight:700}
.cn-df table{font-size:15px}.cn-df td{padding:5px 8px}.cn-df tr.cn-iyi td{background:#ebfbee}.cn-df tr.cn-kotu td{background:#fff5f5}.cn-df tr.cn-son td{outline:2px solid var(--c);outline-offset:-2px}
.cn-p{animation:cnGel .35s ease-out both}@keyframes cnGel{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cn-o{fill:#ffa94d;stroke:#d9480f;stroke-width:1}.cn-o2{fill:#e8590c}.cn-k{fill:#ffc9c9;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:3 2}
.cn-cerceve{stroke:#2b8a3e;stroke-width:3}.cn-et{font-size:13px;font-weight:800;fill:#5b6478}.cn-et.b,.cn-et2b{font-weight:900;fill:#1d2433}.cn-et2{font-size:11px;fill:#5b6478;font-weight:700}.cn-et2b{font-size:13px;fill:#fff}
.cn-ku{fill:#fff4e6;stroke:#ffa94d;stroke-width:1.5}.cn-kk{fill:#fff5f5;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:4 3}
.cn-tahta0{fill:#f1f3f5;stroke:#ced4da}.cn-tahta{fill:#c08552;stroke:#8d5a2b}
.cn-ek{stroke:#868e96;stroke-width:2}.cn-sinir{stroke:#c92a2a;stroke-width:3;stroke-dasharray:5 4}.cn-yay{fill:none;stroke:#f76707;stroke-width:2}
.cn-v1{stroke:#2b8a3e;stroke-width:3}.cn-v2{stroke:#c92a2a;stroke-width:3}.cn-kis{font-size:20px}.cn-bus{font-size:16px}.cn-bek{stroke:#c92a2a;stroke-width:5;stroke-linecap:round;opacity:.6}
.cn-kum{fill:#ffe8cc;stroke:#e8590c;stroke-width:3}.cn-kum2{fill:#495057}.cn-para{fill:#ffd43b;opacity:.85}.cn-buyuk{font-size:26px;font-weight:900;fill:#1d2433}
.cn-zem{fill:#adb5bd}.cn-kat{fill:#f1f3f5;stroke:#ced4da}.cn-katon{fill:#d3f9d8;stroke:#2b8a3e}.cn-katoff{fill:#ffe3e3;stroke:#e03131}
.cn-izg{display:grid;gap:4px}.cn-h,.cn-gb{border-radius:8px;text-align:center;font-weight:800;font-size:14px;padding:6px 0}.cn-h{background:#f1f3f5;transition:background .25s,transform .25s}
.cn-gb{background:none;color:var(--muted);font-size:12px}.cn-h.on{background:#ffa94d;color:#1d2433}.cn-h.yeni{transform:scale(1.18);box-shadow:0 0 0 3px #e8590c}
.cn-kartlar{display:flex;flex-wrap:wrap;gap:6px;padding:4px}.cn-kart{min-width:44px;padding:8px 10px;text-align:center;border-radius:10px;background:#fff4e6;border:2px solid #ffa94d;font-weight:900;animation:cnGel .3s}
.cn-kart.kare{background:#e7f5ff;border-color:#1c7ed6}.cn-bosk{color:var(--muted)}
.cn-cift{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 4px;font-weight:800}.cn-cift i{font-weight:600;color:#1c7ed6}
.cn-katlar{padding:4px}.cn-katsat{display:inline-flex;flex-wrap:wrap;gap:6px}.cn-kat2{background:#e6fcf5;border:1.5px solid #12b886;border-radius:8px;padding:3px 8px;font-weight:800;animation:cnGel .3s}.cn-sonsuz{font-weight:800;color:#0b7285}
.cn-onr{background:#f8f0fc;border:2px solid #ae3ec9;border-radius:12px;padding:10px 14px}.cn-kanit{padding:10px 4px 2px}
.cn-kay{display:inline-flex;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap}.cn-kay{max-width:100%}.cn-kay input{width:min(220px,70vw);accent-color:#d0700f}.cn-satir>*{min-width:0;max-width:100%}
@media (prefers-reduced-motion:reduce){.cn-p,.cn-kart,.cn-kat2{animation:none}.cn-h{transition:none}}
/* 05.10.2026 · KOŞUL ve LABİRENT motorları (SB 6.1.1) */
@media(max-width:560px){.soru [style*="grid-template-columns:repeat"]{grid-template-columns:1fr!important}}   /* çok sütunlu konuşma balonları telefonda alt alta */
.cn-kl{list-style:none;padding:0;margin:0;display:grid;gap:4px}.cn-not{color:var(--muted);font-size:14px}.cn-sonuc{margin-top:6px;font-weight:800}
.cn-secg{gap:6px}.cn-secad{font-weight:800;flex-basis:100%}.cn-secg .cn-btn{padding:8px 12px}
.cn-mv{fill:#74c0fc;stroke:#1c7ed6;stroke-width:1}.cn-tl{fill:#69db7c;stroke:#2b8a3e;stroke-width:1.5}
.cn-lab{display:grid;gap:4px;align-items:center;max-width:460px;margin:0 auto}
.cn-lc{min-height:44px;border-radius:8px;border:1.5px solid #ced4da;background:#fff;font:inherit;font-weight:900;font-size:16px;cursor:pointer;padding:0;color:var(--ink)}
.cn-lc.yol{background:#d3f9d8;border-color:#2b8a3e}.cn-lc.simdi{background:#2b8a3e;color:#fff;box-shadow:0 0 0 3px #b2f2bb}.cn-lc.kapali{background:#ffe3e3;border-color:#e03131;color:#c92a2a;text-decoration:line-through}
.cn-lok{color:#2b8a3e;font-weight:900;text-align:center}.cn-lcik{min-height:44px;border:0;background:none;font:inherit;font-weight:900;color:#d9480f;cursor:pointer;padding:0;white-space:nowrap;font-size:14px}.cn-lcik:disabled{cursor:default}

</style></head><body>
<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }
      if (!art && !o.sandalye) sv += `<rect x="10" y="10" width="${gen * hc}" height="${sira * hc}" fill="none" class="cn-cerceve"/>
        <text x="${10 + gen * hc / 2}" y="${H + 4}" class="cn-et" text-anchor="middle">${gen} ${o.birim || ""}</text>
        <text x="${W + 4}" y="${10 + sira * hc / 2}" class="cn-et" dominant-baseline="middle">${sira} ${o.birim || ""}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W + 70} ${H + 22}" role="img" aria-label="${N} ${o.ad || "kare"}, her sırada ${gen}">${sv}</svg>`;
      const r = o.kural ? o.kural(gen, sira, art, N) : null;
      let m;
      if (art) m = `<span class="kotu">✘</span> ${N} ${o.ad || "kare"} her sırada ${gen} olacak biçimde dizilince ${sira} tam sıra oluşur, <b>${art} ${o.ad || "kare"} artar</b>. Dikdörtgen olmaz: ${N} : ${gen} işleminde kalan ${art}.`;
      else m = `<span class="iyi">✔</span> <b>${N} = ${gen} ${x} ${sira}</b> · ${sira} sıra, her sırada ${gen} ${o.ad || "kare"}; hiç artmadı.` + (gen === sira ? ` <b>Kare oldu!</b> İki kenar aynı: ${gen}.` : "");
      if (!art && o.cevre) m += ` Çevre = 2 ${x} (${gen} + ${sira}) = <b>${2 * (gen + sira)} m</b>.`;
      if (r && r.msg) m += `<br>${r.msg}`;
      s.dur.innerHTML = m;
      const sutunlar = o.satir ? o.satir(gen, sira, art, N, r) : [gen, art ? `${sira} (+ ${art} artan)` : sira, art, art ? "olmaz" : (gen === sira ? "kare" : "dikdörtgen")];
      s.yaz(N + ":" + gen, sutunlar, !art && (!r || r.ok !== false));
    }
    ciz(g.get());
  }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {
    const N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });
    const g = adimci(o.etiket, 1, o.max || N, o.bas || 2, v => { sonK = v; });

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.

    sonuc: ([D, d], hepsi) => 40 % d === 0 && D % d === 0 ? `Lambalar: ${160 / d} + ${4 * D / d} = <b>${160 / d + 4 * D / d}</b>` : "",
    satir: ([D, d], hepsi) => [D + " m", d + " m", 40 % d ? "—" : 160 / d, D % d ? "—" : 4 * D / d, 40 % d || D % d ? "olmaz" : D === 60 ? `<b>${160 / d + 4 * D / d}</b>` : `${160 / d + 4 * D / d} (dış kenar yanlış)`],
    yon: "Önce dış yolun kenarını seçin, sonra lambalar arasındaki uzaklığı değiştirin. Lambalar köşelerden başlayarak dizilir. Hangi uzaklıklarda iki karede de her köşeye lamba geliyor? Uzaklık büyüdükçe lamba sayısı ne oluyor?",
    bitis: "Doğru dış kenarla en az lamba sayısını bulduğunuzda." }),

  /* 9 · galeri duvarları */
  9: el => CN.ESPARCA(el, { birim: "cm", parcaAd: "tablo",
    secim: { ad: "1. duvarda tablo asılacak bölüm:", L: [{ ad: "kapı dahil (740 cm)", butunler: [{ ad: "1. duvar: 740 cm", n: 740, renk: "#ae3ec9" }, { ad: "2. duvar: 840 cm", n: 840, renk: "#1c7ed6" }] },
      { ad: "kapı çıkarılınca (630 cm)", butunler: [{ ad: "1. duvar: 740 − 110 = 630 cm", n: 630, renk: "#ae3ec9" }, { ad: "2. duvar: 840 cm", n: 840, renk: "#1c7ed6" }] }] },
    girdi: { ad: "Tablo genişliği (cm):", min: 20, max: 120, bas: 60 },
    kosul: p => [{ ad: "Genişlik 50 cm ile 80 cm arasında", ok: p >= 50 && p <= 80 }],
    sonuc: (p, R, ok, tam, ad) => ok ? `${ad.startsWith("kapı dahil") ? "Dikkat: Kapının önüne tablo asılmaz! " : ""}Toplam <b>${R[0].adet + R[1].adet} tablo</b>.` : "",
    sutun: ["1. duvar", "Genişlik", "Tablo sayısı"],
    satir: (p, R, ok, tam, ad) => [ad, p + " cm", ok ? `<b>${R[0].adet + R[1].adet}</b>` : tam ? "50–80 ✘" : "boşluk kalıyor"],
    yon: "Birinci duvarın hangi bölümüne tablo asılacağını seçin ve tablo genişliğini değiştirin. Duvarlar boşluksuz doluyor mu? 50 ile 80 cm arasında uygun genişliği arayın.",
    bitis: "Kapı çıkarılmış duvarla uygun genişliği ve tablo sayısını bulduğunuzda." }),

  /* 10 · depo fişi, okunamayan rakam */
  10: el => CN.KOSUL(el, { dugme: false, sutun: ["Şeker", "EBOB(234, şeker)", "Uygun mu?", "Çuval"],
    girdi: [{ ad: "Lekenin altındaki rakam:", min: 0, max: 9, bas: 0 }],
    ciz: ([r]) => { const s = 104 + 10 * r - 0 + 0, e = g(234, 100 + 10 * r + 4);
      return `<div class="cn-kutuk">${kart("234 kg", "un")}${kart(`1${r}4 kg`, "şeker")}${kart(e + " kg", "en ağır eş çuval", e === 26 ? "ok" : "no")}</div>`; },
    kosullar: [{ ad: "En ağır eş çuval 26 kg", f: ([r]) => g(234, 104 + 10 * r) === 26 }],
    sonuc: ([r], hepsi) => hepsi ? `Un 234 : 26 = 9, şeker ${104 + 10 * r} : 26 = ${(104 + 10 * r) / 26} çuval; toplam <b>${9 + (104 + 10 * r) / 26}</b>.` : "",
    satir: ([r], hepsi) => [`1${r}4 kg`, g(234, 104 + 10 * r), hepsi ? "evet" : "hayır", hepsi ? `<b>${9 + (104 + 10 * r) / 26}</b>` : "—"],
    yon: "Lekenin altındaki rakamı 0'dan 9'a kadar değiştirin. Her durumda un ile şekerin EBOB'u, yani en ağır eş çuval hesaplanır. Çuval 26 kg olan şeker miktarını bulun.",
    bitis: "On rakamın hepsini denediğinizde." }),

  /* 11 · çam ve meşe çıtalardan kare çerçeveler */
  11: el => CN.ESPARCA(el, { birim: "cm", parcaAd: "parça",
    butunler: [{ ad: "Çam: 390 cm", n: 390, renk: "#e0b98a" }, { ad: "Meşe: 260 cm", n: 260, renk: "#a0522d" }],
    girdi: { ad: "Parça uzunluğu (cm):", min: 1, max: 140, bas: 10 },
    kosul: p => [{ ad: "Parça 40 cm'den kısa", ok: p < 40 }],
    sonuc: (p, R, ok, tam) => { if (!tam) return "Çıtalardan biri eşit parçalara ayrılmıyor."; const c = Math.min(Math.floor(R[0].adet / 2), Math.floor(R[1].adet / 2));
      return `Her çerçeve 2 çam + 2 meşe: <b>${c} çerçeve</b>; artan çam ${R[0].adet - 2 * c}, artan meşe ${R[1].adet - 2 * c} parça.` + (p >= 40 ? " Ama parça 40 cm'den kısa olmalı." : ""); },
    sutun: ["Parça", "Çam / meşe parça", "Çerçeve", "Artan parça"],
    satir: (p, R, ok, tam) => { if (!tam) return [p + " cm", "—", "—", "olmaz"]; const c = Math.min(Math.floor(R[0].adet / 2), Math.floor(R[1].adet / 2));
      return [p + " cm", `${R[0].adet} / ${R[1].adet}`, c, ok ? `<b>${R[0].adet + R[1].adet - 4 * c}</b>` : `${R[0].adet + R[1].adet - 4 * c} (40 cm ✘)`]; },
    yon: "Parça uzunluğunu değiştirin; iki çıta bu uzunlukta kesilir. Hangi uzunluklar iki çıtaya da uyuyor? Kaç çerçeve yapılıyor ve kaç parça artıyor? 40 cm'den kısa en uzun parçayı arayın.",
    bitis: "40 cm'den kısa en uzun uygun parçayla artan parça sayısını bulduğunuzda." }),

  /* 12 · velodrom setleri */
  12: el => CN.KOSUL(el, { dugme: false, sutun: ["Set", "Tur", "Sürat", "Dayanıklılık", "Toplam set"],
    girdi: [{ ad: "Bir set (m):", sec: [300, 500, 600, 750, 900, 1000, 1500], yaz: v => v + " m", bas: 300 }],
    ciz: ([s]) => `<div class="cn-kutuk">${kart(s / 250 + " tur", "bir sette", s % 250 ? "no" : "ok")}${kart(6000 % s ? "artar" : 6000 / s + " set", "sürat 6000 m", 6000 % s ? "no" : "ok")}${kart(4500 % s ? "artar" : 4500 / s + " set", "dayanıklılık 4500 m", 4500 % s ? "no" : "ok")}</div>`,
    kosullar: [{ ad: "Set başlangıç çizgisinde biter (tam tur)", f: ([s]) => s % 250 === 0 }, { ad: "Sürat çalışması eşit setlere ayrılır", f: ([s]) => 6000 % s === 0 },
      { ad: "Dayanıklılık çalışması eşit setlere ayrılır", f: ([s]) => 4500 % s === 0 }, { ad: "Set en fazla 1 km", f: ([s]) => s <= 1000 }],
    sonuc: ([s], hepsi) => hepsi ? `Toplam <b>${6000 / s + 4500 / s} set</b>.` : "",
    satir: ([s], hepsi) => [s + " m", s % 250 ? "tam değil" : s / 250, 6000 % s ? "—" : 6000 / s, 4500 % s ? "—" : 4500 / s, hepsi ? `<b>${6000 / s + 4500 / s}</b>` : "olmaz"],
    yon: "Bir setin uzunluğunu seçin. Set tam turlardan oluşuyor mu, iki çalışma da eşit setlere ayrılıyor mu, set 1 km'yi geçiyor mu? Bütün koşulları sağlayan setlerde toplam set sayısını karşılaştırın.",
    bitis: "Yedi uzunluğu da denediğinizde." }),

  /* 13 · dağcının algoritma tablosu */
  13: el => CN.KOSUL(el, { dugme: false, sutun: ["Son satırdaki sayı", "Uzun ip", "Fark", "Parça"],
    girdi: [{ ad: "Son satırdaki lekeli sayı:", min: 1, max: 12, bas: 6 }],
    ciz: ([k]) => { const A = 420, B = 84 * k; let a = A, b = B, sat = []; [2, 2, 3, 7].forEach(p => { sat.push([a, b, p]); a /= p; b /= p; }); sat.push([a, b, ""]);
      return `<div class="cn-mak">${sat.map(([u, v, p]) => `<div><b>${u}</b><b>${v}</b><small style="text-align:left;color:#c2255c">${p}</small></div>`).join("")}</div><p class="cn-ust" style="text-align:center">EBOB = 2 · 2 · 3 · 7 = 84 cm · uzun ip ${B} cm</p>`; },
    kosullar: [{ ad: "Son satırda ortak bölen kalmadı (algoritma burada biter)", f: ([k]) => g(5, k) === 1 }, { ad: "Uzun ip kısa ipten 168 cm uzun", f: ([k]) => 84 * k - 420 === 168 }],
    sonuc: ([k], hepsi) => hepsi ? `Kısa ip 5, uzun ip ${k} parça: toplam <b>${5 + k} parça</b>.` : "",
    satir: ([k], hepsi) => [k, 84 * k + " cm", 84 * k - 420 + " cm", hepsi ? `<b>${5 + k}</b>` : "olmaz"],
    yon: "Tablonun son satırındaki lekeli sayıyı değiştirin; uzun ip ve algoritma tablosu buna göre yeniden kurulur. Algoritma doğru bitiyor mu, iki ip arasındaki fark 168 cm oluyor mu?",
    bitis: "İki koşulu da sağlayan sayıyı bulup parça sayısını defterden okuyabildiğinizde." }),

  /* 14 · iki üçgen flama, ortak taban */
  14: el => CN.KOSUL(el, { dugme: false, sutun: ["Taban", "Yükseklikler", "Fark"],
    girdi: [{ ad: "Taban uzunluğu (cm):", min: 1, max: 30, bas: 4 }],
    ciz: ([b]) => { const h1 = 120 / b, h2 = 210 / b, sk = Math.min(3, 200 / h2), w = Math.min(120, b * 6);
      return svg(480, 240, `<line x1="10" y1="16" x2="470" y2="16" stroke="#8a5a2b" stroke-width="3"/><polygon points="${140 - w / 2},16 ${140 + w / 2},16 140,${16 + h1 * sk}" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/><polygon points="${340 - w / 2},16 ${340 + w / 2},16 340,${16 + h2 * sk}" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>`
        + tx(140, 34 + h1 * sk, `h = ${Number.isInteger(h1) ? h1 : h1.toFixed(2)} cm`) + tx(340, 34 + h2 * sk, `h = ${Number.isInteger(h2) ? h2 : h2.toFixed(2)} cm`), "iki üçgen flama"); },
    kosullar: [{ ad: "1. flamanın yüksekliği doğal sayı (120 : taban)", f: ([b]) => 120 % b === 0 }, { ad: "2. flamanın yüksekliği doğal sayı (210 : taban)", f: ([b]) => 210 % b === 0 }, { ad: "Taban 20 cm'den kısa", f: ([b]) => b < 20 }],
    sonuc: ([b], hepsi) => hepsi ? `Yükseklik farkı ${210 / b} − ${120 / b} = <b>${90 / b} cm</b>.` : "",
    satir: ([b], hepsi) => [b + " cm", 120 % b || 210 % b ? "—" : `${120 / b} ve ${210 / b}`, hepsi ? `<b>${90 / b}</b>` : "olmaz"],
    yon: "Taban uzunluğunu değiştirin; flamaların yükseklikleri alanlardan hesaplanır (taban · yükseklik : 2 = alan). Hangi tabanlarda yükseklikler doğal sayı oluyor? Taban uzadıkça yükseklik farkı ne oluyor?",
    bitis: "20 cm'den kısa bütün uygun tabanları denediğinizde." }),

  /* 15 · iki fotoğraf, ortak yükseklik, en kısa şerit */
  15: el => CN.KOSUL(el, { dugme: false, sutun: ["Yükseklik", "Genişlikler", "Kolaj", "Şerit (çevre)"],
    girdi: [{ ad: "Ortak yükseklik (cm):", min: 1, max: 60, bas: 6 }],
    ciz: ([h]) => { const w1 = 180 / h, w2 = 300 / h, sk = Math.min(4, 420 / (w1 + w2), 200 / h);
      return svg(480, 230, `<rect x="20" y="10" width="${w1 * sk}" height="${h * sk}" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/><rect x="${20 + w1 * sk}" y="10" width="${w2 * sk}" height="${h * sk}" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>`
        + tx(240, 224, `${(w1 + w2).toFixed(Number.isInteger(w1 + w2) ? 0 : 2)} cm × ${h} cm`), "iki fotoğraftan kolaj"); },
    kosullar: [{ ad: "1. fotoğrafın genişliği doğal sayı (180 : h)", f: ([h]) => 180 % h === 0 }, { ad: "2. fotoğrafın genişliği doğal sayı (300 : h)", f: ([h]) => 300 % h === 0 }],
    sonuc: ([h], hepsi) => hepsi ? `Çevre 2 · (${h} + ${480 / h}) = <b>${2 * (h + 480 / h)} cm</b>.` : "",
    satir: ([h], hepsi) => [h + " cm", hepsi ? `${180 / h} ve ${300 / h}` : "—", hepsi ? `${480 / h} × ${h}` : "—", hepsi ? `<b>${2 * (h + 480 / h)}</b>` : "olmaz"],
    yon: "Ortak yüksekliği değiştirin; fotoğrafların genişlikleri alanlardan hesaplanır. Uygun yüksekliklerde şerit uzunluğunu deney defterinde karşılaştırın. En büyük ortak yükseklik en kısa şeridi veriyor mu?",
    bitis: "180 ile 300'ün bütün ortak bölenlerini denediğinizde." }),

  /* 16 · dükkân planı */
  16: el => CN.KOSUL(el, { dugme: false, sutun: ["Depo-ofis genişliği", "Depo / ofis", "Derinlik", "Satış alanı", "Dükkân"],
    girdi: [{ ad: "Depo ve ofisin genişliği (m):", sec: [1, 2, 3, 6, 9], yaz: v => v + " m", bas: 3 }],
    ciz: ([x]) => { const hd = 54 / x, ho = 72 / x, H = hd + ho, y = 17 - x, sk = Math.min(12, 205 / H, 420 / 17);
      return svg(480, 260, `<rect x="20" y="10" width="${x * sk}" height="${hd * sk}" fill="#e3edfb" stroke="#1c5fbf" stroke-width="2"/><rect x="20" y="${10 + hd * sk}" width="${x * sk}" height="${ho * sk}" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="2"/><rect x="${20 + x * sk}" y="10" width="${y * sk}" height="${H * sk}" fill="#fff0e2" stroke="#d9480f" stroke-width="2"/>`
        + tx(240, 234, `satış alanı: ${y} × ${H} = ${y * H} m²`) + tx(240, 254, `derinlik ${H} m · ön cephe 17 m`), "dükkân planı"); },
    kosullar: [{ ad: "Depo ve ofisin kenarları en az 4 m", f: ([x]) => Math.min(x, 54 / x, 72 / x) >= 4 }, { ad: "Satış alanı dükkânın yarısından büyük", f: ([x]) => (17 - x) * (126 / x) > 17 * (126 / x) / 2 }],
    sonuc: ([x], hepsi) => hepsi ? `Satış alanı <b>${(17 - x) * 126 / x} m²</b>.` : "",
    satir: ([x], hepsi) => [x + " m", `${x}×${54 / x} / ${x}×${72 / x}`, 126 / x + " m", (17 - x) * 126 / x + " m²", 17 * 126 / x + " m²"],
    yon: "Depo ile ofisin ortak genişliğini (54 ile 72'nin ortak bölenlerinden biri) seçin; plan anında çizilir. Hangi genişlikte iki koşul da sağlanıyor?",
    bitis: "Beş genişliği de denediğinizde." }),
};
})();

 fill=\"#111111\" text-anchor=\"start\" data-maxw=\"322\" data-grup=\"sb8112a02\">2. film: Mavi Yolculuk</text><text x=\"528.0\" y=\"421.0\" font-size=\"26\" font-weight=\"700\" fill=\"#343a40\" text-anchor=\"start\" data-maxw=\"322\" data-grup=\"sb8112a02\">Süre: 2 sa 20 dk</text><line x1=\"522.0\" y1=\"351.0\" x2=\"854.0\" y2=\"351.0\" stroke=\"#ced4da\" stroke-width=\"2\"/></g></svg>", "son": "<p>Filmlerin başında ve sonunda reklam verilmeyecektir. İki filmde bir bölümün süresi aynıdır; bu süre dakika cinsinden bir doğal sayıdır ve 30 dakikadan kısadır. Bölümler olabildiğince uzun tutulacaktır.</p>", "k": "Buna göre, iki film boyunca toplam kaç kez reklam verilir?", "sec": ["7", "9", "11", "16"], "secg": null, "c": "A", "a": ["Süreler dakikaya çevrilir: 1 sa 52 dk = 112 dk, 2 sa 20 dk = 140 dk. Bölüm süresi 112 ile 140'ın ortak bölenidir: EBOB = 28.", "28 dk, 30 dakikadan kısadır ve en uzun bölüm süresidir. 1. film 112 : 28 = 4, 2. film 140 : 28 = 5 bölüme ayrılır.", "Reklamlar yalnız bölümlerin arasında verilir: 4 bölüm arasında 3, 5 bölüm arasında 4 reklam; toplam 7."], "t": "9: bölüm sayısı reklam sayısı sanılmış; 11: filmlerin başında ve sonunda da reklam sayılmış; 16: bölüm 14 dakika alınmış.", "d": "Önce süreleri dakikaya çevirin (1 sa 52 dk = 112 dk). Reklamlar yalnız bölümlerin arasında verilir: 4 bölümlük filmde 3 reklam arası vardır.", "ses": "b02"}, {"no": 3, "on": "<p>Bir pazarcı, özdeş iki kasadan birini domatesle, diğerini biberle doldurmuş ve kasaları tartmıştır. Tartıların ekranlarında görünen değerler aşağıda verilmiştir.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1376 688\" width=\"1376\" style=\"width:140.0mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs ill-opacity=\".95\"/><text x=\"480.0\" y=\"425.8\" font-size=\"30\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">Domates</text><rect x=\"854.3\" y=\"392.5\" width=\"111.4\" height=\"45.0\" rx=\"10.5\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"2.1\" fill-opacity=\".95\"/><text x=\"910.0\" y=\"425.8\" font-size=\"30\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">Biber</text><rect x=\"435.9\" y=\"28.0\" width=\"504.2\" height=\"48.0\" rx=\"11.2\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"2.24\" fill-opacity=\".95\"/><text x=\"688.0\" y=\"63.5\" font-size=\"32\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">Boş bir kasanın kütlesi: 3 kg</text></g></svg>", "son": "<p>Pazarcı domates ve biberleri birbirine karıştırmadan, hiç artmayacak şekilde eşit kütleli poşetlere koyacaktır. Bir poşetteki ürünün kütlesi kilogram cinsinden bir doğal sayıdır ve 5 kg'dan azdır. Olabildiğince az poşet kullanılacaktır.</p>", "k": "Buna göre, pazarcı kaç poşet kullanır?", "sec": ["91", "104", "182", "188"], "secg": null, "c": "A", "a": ["Tartı kasalarla birlikte tartmıştır; boş kasaların kütlesi çıkarılır: domates 81 − 3 = 78 kg, biber 107 − 3 = 104 kg.", "Poşetteki ürün 78 ile 104'ün ortak bölenidir: EBOB = 26 → 1, 2, 13, 26. En az poşet için 5 kg'dan az en büyük ortak bölen seçilir: 2 kg.", "78 : 2 + 104 : 2 = 39 + 52 = 91 poşet."], "t": "188: kasaların kütlesi çıkarılmamış, 1 kg'lık poşetler alınmış; 182: poşetler 1 kg alınmış; 104: biberin kütlesi.", "d": "Tartı, kasayla birlikte tartar. Boş kasanın kütlesini (3 kg) iki tartı değerinden de çıkarmadan ortak bölen aramayın.", "ses": "b03"}, {"no": 4, "on": "<p>Bir sınıfta “Ortak Bölen Avı” oyunu oynanmaktadır. Her oyuncunun kartında iki sayı yazılıdır. Öğretmen 1'den 20'ye kadar olan sayıları sırayla söylemektedir. Söylenen sayı, bir oyuncunun kartındaki iki sayının ortak böleniyse o oyuncu 1 puan almaktadır. Oyuncuların kartları aşağıda verilmiştir.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1170 658\" width=\"1170\" style=\"width:124.5mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAGsAvgDASIAAhEBAxEB/8QAHAAAAAcBAQAAAAAAAAAAAAAAAAECAwQFBgcI/8QAVRAAAQMCAwQFCAYFCAgFAwUAAQACAwQRBRIhBjFBURMiYXGRBxQyQlKBobEVIzNywdEkNGKy4RYlQ1NzgpKiNTZEVGN0k/AXJidkwoSU8UWDo9Li/8QAGgEAAgMBAQAAAAAAAAAAAAAAAQMAAgQFBv/EACsRAAICAQMEAgEFAQEBAQAAAAABAhEDEiExBCIyQRNRFCMzQmFxBVI0Q//aAAwDAQACEQMRAD8A66HB2oIKNZGCvqYCMsh7nKzp8e3CZnvCiyJlZYpIvY/SVdiw+omUmlxCnqHAMeL8lGxVwMM1iNyE2WgqF4Z+ox9yntGig4X+ox9ynt3JnoU+Q2iyUiCNLkMjwM1QvAVnJGfzmFpaj7Eqglb/ADkO5KnwMjyWkTOqFnNsY/0K9uK1EQ6gVJtjEDhWa2oKtj5Kz4OeVDbQBQgPr2qxqW/o6hNH1rU2RSPJYPF4x3JqNPPH1Q7k1GFyZLc6q4HmhONCQNycaoQccSKdxas5VzBz7N38Vp42Z4S08VSS4beodlGnarydRs0dNKKbsrmvIUymkJIUmPDmAddOwwwsJsNy19N1UKpmH/pS40ljRPLSBfer4atb3KhocjpAOSv2+qOxXzSjJWjD01+xE7bwOHYqCSAN3tutFPYQOJVUyeFxsSLJePFridCOdY+SPR0nSOuR1Vatha0AAJcDY3MGSyfEbWi5Kx5cLsvLPq3I4j10SoonCUOJSn1EMTdSCihqopZAGnVJ0tNCXmi3VliBoEdkoDQIWWwqIshZLskSSRwsL5XtY3m42ChArIWVJiW2eCYfmb5z08jfUiF/juVDL5UqGMm1BM4+qMwCNMhubIrLE0/lUwl0d6mlqIn+ywBw8dFNw/yi4JXz9D9dATuMoAB+KmlkNQQmZ6V0pBBsAnWSNlYHscHNduI4p3KSxMx7MrJWihxTA3V9MYeky34hV8my1TLEI31ZIbuNtVpnAgpQb1CryipO2Mx5541UTGxbH1NNVMmZU5i031G9aWKhlaWuJGm9SSE+wWZdSK08Ay5ZZWnIhtb9c9Z5ottNJ/ZlaNv2z1nrf+ZZP7MpH8gx4MFjcn861Lb+uVCjaCy6fxz/AExU/fKjwn6sha4mWW7NBs0ySasZTxyFt3A2CPbcecY10IJJijGiVsVNHHjYMhtZhsiGIUr9uZJqpw6HOW3O5Rrew3aoyropaeQNljdHfdmFrrotW4HZal+61ZbbDEYq/Fw2nymKIWBaN61FUD/JWl7glT4G4uSxo/8ARB+4sEx7Y8VD3ei2a58VvqIfzOdPUXPJx+kSfeKyM7v/ADlepG/2pp5K7Z6N1KMwaASAuetY69shuN4sr/CdqajD4RBK3pohoL77IsT2hhqoy2npBGXbyQrSae5owQy4bhVr7JkO0FFFgQpnMDZLWtyWTcbvJ5lGdSSd5RWQuzVjwxx3Xsdoh+mRfe text><rect x=\"886.6\" y=\"320.5\" width=\"350.8\" height=\"39.0\" rx=\"9.1\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1.8200000000000003\" fill-opacity=\".95\"/><text x=\"1062.0\" y=\"349.4\" font-size=\"26\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">Büyük otobüs: 42 kişilik</text><rect x=\"319.9\" y=\"47.5\" width=\"640.1\" height=\"45.0\" rx=\"10.5\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"2.1\" fill-opacity=\".95\"/><text x=\"640.0\" y=\"80.8\" font-size=\"30\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">A Ortaokulu: geziye katılan 112 öğrenci</text><rect x=\"318.4\" y=\"99.5\" width=\"643.2\" height=\"45.0\" rx=\"10.5\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"2.1\" fill-opacity=\".95\"/><text x=\"640.0\" y=\"132.8\" font-size=\"30\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">B Ortaokulu: geziye katılan 168 öğrenci</text></g></svg>", "son": "<p>Bu araç türlerinden yalnız bir tanesi kiralanacak ve öğretmenler kendi araçlarıyla gidecektir. Kiralanan araçlardaki öğrenciler aynı okuldan olup bütün araçlar tam dolu olacaktır.</p>", "k": "Buna göre, araç kiralama için ödenecek toplam ücret <u style=\"white-space:nowrap\">en az</u> kaç TL'dir?", "sec": ["43 200 TL", "44 100 TL", "45 000 TL", "48 000 TL"], "secg": null, "c": "C", "a": ["Araçlar tam dolu olacağından bir aracın kapasitesi 112 ile 168'in ortak bölenidir. EBOB(112, 168) = 56; ortak bölenler 1, 2, 4, 7, 8, 14, 28, 56'dır.", "Panodaki kapasitelerden yalnız 14 ve 28 ortak bölendir. 14 kişilik: 8 + 12 = 20 araç · 2400 = 48 000 TL. 28 kişilik: 4 + 6 = 10 araç · 4500 = 45 000 TL.", "En az ücret 45 000 TL'dir."], "t": "43 200: 24 kişilik araçlar seçilmiş, araçların tam dolu olması koşulu unutulmuş; 44 100: 42 kişilik araçlar seçilmiş, A Ortaokulunun bir aracı dolmaz; 48 000: 14 kişilik araçlar.", "d": "Araçların tam dolu olması, araç kapasitesinin 112 ile 168'in ortak böleni olması demektir. Kişi başına en ucuz görünen araç, tam dolu olmuyorsa seçilemez.", "ses": "b05"}, {"no": 6, "on": "<p>Bir bahçede iki sulama hortumuna eşit aralıklarla damlatıcı takılacaktır. Hortumların uzunlukları, üzerlerindeki etiketlerde yazılıdır.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1480 480\" width=\"1480\" style=\"width:150mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAD3AvgDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAwABAgQGBQcI/8QASRAAAgIBAwEGAgYJBAEDAwALAQIDEQAEEiExBRMiQVFhcYEGFDKRobEVFiNCUpLB0fAzU+HxYgckQ0RysjSCFzVFVWN0g5Si/8QAGQEBAQEBAQEAAAAAAAAAAAAAAAECAwQF/8QAKREAAgIABgEEAwADAQAAAAAAAAECEQMSExQhUTFBUmGxBDJiIkJxof/aAAwDAQACEQMRAD8A3d7R4gB08/PEzg1xwevxyA3XtamoDywgUM3P3Z4z0iUWpI+WEQcE1jIoBPPywnJFZSED1q8mv5ZA9QCMIBxV5QCj+0RzweecKopjz8cio8V+WT6P65ATPC9MkvORJpR6eZxLwM0QTeuMvA+eRbkn8Dk0rjIURNjOF9K3MekgkC7v2hHTnpndb7XGcb6TlU7NWRh9mQfkcxP9Wah+yMY3153JVkC9eeMbbO6/ulq598spMrX+0JJHT0xbhtoGr9c8h6aKTRTbSHCEH2yvPo2ZfDApv0NZ0WJf9kCwNfarBtHLF1fdWaTI0ceWPu46KMreQTyznajVz6dfFI4voGGaVpUKKzcEmvs5zZNAmr7Td9QSYkUd3zQvOkZHKcXXBxo/rjftGHiI2h2P2s6PZerGkklXXJtO4dR0AvA9uy6dZogJgZUP+mnp75VaHWRjdMwRJ1vvGs8ZqTtHmlw6sTdoCftJdmnjjpi7X0P/ADWWSTF2dGHcSWzhUWq9bJ+7Fp60moErR1GPCpYDcwHW6+OdTtCfso6AxabTpGxUENfQ55p4lSpI3HDz3To5UGsdHIkJRmF7lFEA+ntj6vSNqIY5tMRKdtoT9oew+GROjY/tSSyhCY9zeE0OfuyGlmkgg+r6sSQxM4eGUKevrnaJznTSaG7L0w71DFqD9aDFqLeFD/fOhoIp4u0IJNQiGOfvCrKK5rm842olMOpdtOd8jtsBqvKs6nY+rln1ek0sqbTFYJvr5dMko+WWFJpHNftCd+z4dPfdpAPE/wDFzdXnR03ahfs8vqljnjmndfGOlr1+OQn08Bh/bPE2laVTuUbQvkQRhX0bRdm12YSyNNvW06LXvkWX0RlNu7OW+p+r9pPDAmyJgLA8RqsAymLWlUnLhlDBiKK+oOFhWONW1sbFpY1A3noh98MH0naOhXv5kE0T0WUcsDndUKsC8KmJShDCuGHNfHIOUSB3jtRGwsluSci6waZyImtR5t54G4nBYISxNk31GV+CSOr2dLqJe1NL9Yu .0\" width=\"180.0\" height=\"76.0\" rx=\"10\" fill=\"#ffffff\" stroke=\"#495057\" stroke-width=\"3\" fill-opacity=\".97\"/><text x=\"1180.0\" y=\"498.0\" font-size=\"44\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-maxw=\"160\" data-grup=\"sb8112a06b\">3,6 m</text><line x1=\"914.0\" y1=\"685.0\" x2=\"1090.0\" y2=\"738.0\" stroke=\"#495057\" stroke-width=\"3\" stroke-dasharray=\"7 6\"/><rect x=\"1090.0\" y=\"700.0\" width=\"180.0\" height=\"76.0\" rx=\"10\" fill=\"#ffffff\" stroke=\"#495057\" stroke-width=\"3\" fill-opacity=\".97\"/><text x=\"1180.0\" y=\"754.0\" font-size=\"44\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-maxw=\"160\" data-grup=\"sb8112a06b\">5,4 m</text></g></svg>", "son": "<p>Her hortumun başına damlatıcı takılacak, sonuna takılmayacaktır. İki hortumda damlatıcılar arasındaki uzaklık aynıdır; bu uzaklık santimetre cinsinden bir doğal sayıdır ve 40 cm'den kısadır. Olabildiğince az damlatıcı kullanılacaktır.</p>", "k": "Buna göre, kaç damlatıcı kullanılır?", "sec": ["20", "23", "25", "26"], "secg": null, "c": "C", "a": ["3,6 m = 360 cm ve 5,4 m = 540 cm'dir. Aralık bu iki uzunluğun ortak bölenidir: EBOB = 180.", "En az damlatıcı için 40 cm'den kısa en büyük ortak bölen seçilir: 36 cm. Hortumlarda 360 : 36 = 10 ve 540 : 36 = 15 aralık vardır.", "Damlatıcı yalnız başa takıldığından her hortumdaki damlatıcı sayısı aralık sayısına eşittir: 10 + 15 = 25."], "t": "26: hortumlar uç uca eklenmiş gibi düşünülüp 900 : 36 + 1 hesaplanmış; 23: başa da sona da damlatıcı takılmamış sayılmış; 20: aralık 45 cm alınmış, 45 cm 40 cm'den uzundur.", "d": "Damlatıcı başa takılıp sona takılmıyorsa her hortumdaki damlatıcı sayısı aralık sayısına eşittir. 40 cm sınırını unutmayın: 45 cm uygun değildir.", "ses": "b06"}, {"no": 7, "on": "<p>Bir kargo şirketi, A ve B firmalarının yüklerini kamyonla taşıyacaktır. Yüklerin kütleleri ve şirketin taşıma koşulları aşağıdaki panoda verilmiştir.</p>", "g": "<svg class=\"foto511\" viewBox=\" a": ["Bir paletteki yük 3600 ile 4200'ün ortak bölenidir: EBOB(3600, 4200) = 600 kg.", "Bir palete en fazla 500 kg konabildiğinden 500'ü aşmayan en büyük ortak bölen seçilir: 600 : 2 = 300 kg. A firması 3600 : 300 = 12, B firması 4200 : 300 = 14 palet; toplam 26 palet.", "Ücret 26 · 750 = 19 500 TL'dir."], "t": "9750: 500 kg sınırı unutulup 600 kg'lık paletler alınmış; 29 250: paletler 200 kg alınmış; 39 000: paletler 150 kg alınmış.", "d": "Palet yükü iki firmanın yükünün ortak bölenidir ama 500 kg'ı geçemez. EBOB 600 kg olduğu için 500'ü aşmayan en büyük ortak böleni arayın.", "ses": "b07"}, {"no": 8, "on": "<p>Bir parkta, merkezleri aynı olan ve kenarları birbirine paralel iki kare biçimli yürüyüş yolu vardır. İç yolun bir kenarının uzunluğu ve iki yol arasındaki çimenliğin genişliği aşağıdaki görselde verilmiştir. Çimenliğin genişliği her yerde aynıdır; yolların genişliği dikkate alınmayacaktır.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1120 920\" width=\"1120\" style=\"width:85.2mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAJwAvgDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAgMBBAUABgf/xABFEAACAQMCBAQEAwYFAwMEAQUBAhEAAyESMQQiQVEFE2FxBjKBkRShsSNCwdHh8BUWJFLxM2JyNENTJWOCkjVEsoOiwv/EABkBAAMBAQEAAAAAAAAAAAAAAAABAgMEBf/EACQRAQEAAgEEAwEBAQEBAAAAAAABAhESAyExURMyQSJhcYGh/9oADAMBAAIRAxEAPwDyXEQFn5m6E5x3qj+IW1wdu0DpfVLsMyOxprB9A1E6hkmNzH8qG9wqjh1YkB4+X9K8+anahyvctgFwfLupOpx0O36VT4lrbXQUkGZM/rTA9wKeGkm2HBBJPtA+9IuIFY77ZmtMZqkO8FNpgr6m3IpIIgGKmNCYgzg0uWjTBA6jvVyEK6WgdfrtQjCjH1qY5hiZrj1EYqg44AM5HrXAzk70Ec5lYo1GSB9KZwxf7mmruKBVM5J9KYqrjBz3qKY8598g1JyYILZ7VK9JM1xwCoiepqNgSmRkRqgelEWCHJkbYoY1YyZogoCFiMbTOaQNWMEATE5rgWUQCGzv61ARjuYNFbU6pOc5pGPUqsANyKt ><text x=\"450.0\" y=\"870.0\" font-size=\"36\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">dış yol</text></g></svg>", "son": "<p>İki yolun kenarına, her köşeye bir lamba gelecek şekilde eşit aralıklarla lamba dikilecektir. İki yolda lambalar arasındaki uzaklık aynıdır ve metre cinsinden bir doğal sayıdır.</p>", "k": "Buna göre, <u style=\"white-space:nowrap\">en az</u> kaç lamba dikilir?", "sec": ["8", "12", "16", "20"], "secg": null, "c": "D", "a": ["Dış karenin kenarı, iç karenin kenarına iki yandaki çimenlik eklenerek bulunur: 40 + 10 + 10 = 60 m.", "Aralık 40 ile 60'ın ortak bölenidir; en az lamba için EBOB(40, 60) = 20 m seçilir.", "Kare kapalı bir çizgidir; lamba sayısı aralık sayısına eşittir. İç yol: 160 : 20 = 8, dış yol: 240 : 20 = 12. Toplam 20 lamba."], "t": "8 ve 12: yalnız bir yolun lambaları; 16: köşelerdeki lambalar iki yol arasında ortak sanılıp çıkarılmış. Dış kenar 40 + 10 = 50 m alınırsa aralık 10 m bulunur ve sonuç da yanlış çıkar.", "d": "Dış karenin kenarı, iç karenin kenarına çimenliğin iki yanı eklenerek bulunur: 40 + 10 + 10. Kare kapalı bir çizgi olduğu için lamba sayısı aralık sayısına eşittir.", "ses": "b08"}, {"no": 9, "on": "<p>Bir sanat galerisinin iki duvarına tablolar asılacaktır. Duvarların uzunlukları ve birinci duvardaki kapının genişliği aşağıdaki görselde verilmiştir.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1376 768\" width=\"1376\" style=\"width:125.4mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAGoAvgDASIAAhEBAxEB/8QAGwAAAwEBAQEBAAAAAAAAAAAAAQIDAAQFBgf/xABHEAACAQIDBAYHBgMHAwMFAAAAAQIDEQQSITFBYXEFEzJRgZEGIkJSobHBFCMzYnLRNHOCFSRDg+Hw8WOisgcWRCVTksLS/8QAGQEBAQEBA r.", "Un 234 : 26 = 9 çuval, şeker 104 : 26 = 4 çuval; toplam 13 çuval."], "t": "14, 15 ve 16: şeker 130, 156 ya da 182 kg alınmış; bu sayılar 4 ile bitmez.", "d": "Çuvallar olabilecek en ağır olduğundan çuval kütlesi iki miktarın EBOB'udur. Şeker 26'nın katı olmakla kalmamalı, 234 ile EBOB'u tam 26 olmalı ve 1 ile başlayıp 4 ile bitmelidir.", "ses": "b10"}, {"no": 11, "on": "<p>Bir ahşap atölyesinde bir çam çıta ve bir meşe çıta vardır. Çıtaların uzunlukları aşağıda verilmiştir. Çıtalar hiç artmayacak şekilde birbirine eş parçalara kesilecektir. Bir parçanın uzunluğu santimetre cinsinden bir doğal sayıdır, 40 cm'den kısadır ve olabilecek en uzun değerdedir.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1460 527\" width=\"1460\" style=\"width:150mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAESAvgDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAgMAAQQFBgf/xABJEAACAQMCAwQFBwoEBQUAAwABAhEAAyESMQRBUQUTImFxgZGh0QYUIzJSkuEHFRczQmJyk7HBFkOC8DRTY4OiJERUc/Elo+L/xAAYAQEBAQEBAAAAAAAAAAAAAAAAAQIDBf/EAB8RAQEBAQADAQEBAQEAAAAAAAABERICIVExQRNhgf/aAAwDAQACEQMRAD8Aym6oLIWjrIoblgNb8PdODy3rZc4RrmRbR8ZnnWN7HEhGe2r+H62ldq8x6LnXLFu2rLxFvUsR4RtXPbh1VW7oFY26iuk7lyQSwjBkc6tLWsRKmMyc1dTHEtI9t5OsDrEins4MAOynqRW9rQS5qCKw2xzobtpJLMmdxFL7JCAo1SxJgbirOgLjfeM04SFL6WCxNJuG4zYDKoOCYzWVZtFtzJEHzqFEIAkeumtqE+IH1UKb5GaANNtWiMgVelCsEHPppzWy0AACiAYOA0EDlQZWtW38G+NomlPwrD6sRXQ7sMTCAk5zVhOttfu1pHO7lwPEtA9kR4lxXRZFL6YIMc6o2mKcvLFQchrCn6tB3IXz9NdR7InImlGyu2mPOrtMc4WNWRpg1p4bsw3riyAV5xT14di2JkbV0uCs3EYHQcbCKdUx1eFt91YVNIUKABWuw/EMAeWQcVht3ryga7UjpW2xduAqBaZjMjGKw21W7l4X10kaTuCOddS13jDxtaAH2prJZuSolIjFPTiLbKx06ipO9NGy2puopi0wPNTQsGzpVIHPrS7ei6AwtgA7EiiNpVEtatz7KIFOK4QlV7+bxOkppyD8KO+QY8RI6A stroke-width=\"2.1\" fill-opacity=\".95\"/><text x=\"1236.0\" y=\"722.8\" font-size=\"30\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">Örnek çerçeve</text></g></svg>", "son": "<p>Parçalarla kare biçimli çerçeveler yapılacaktır. Her çerçevenin karşılıklı iki kenarı çam, diğer iki kenarı meşe parçadır. Olabildiğince çok çerçeve yapılacaktır.</p>", "k": "Buna göre, çerçeveler yapıldıktan sonra kaç parça artar?", "sec": ["0", "1", "5", "10"], "secg": null, "c": "C", "a": ["3,9 m = 390 cm ve 2,6 m = 260 cm'dir. Parça uzunluğu bu iki sayının ortak bölenidir: EBOB = 130. 40 cm'den kısa en büyük ortak bölen 26 cm'dir.", "Çam çıtadan 390 : 26 = 15, meşe çıtadan 260 : 26 = 10 parça elde edilir.", "Her çerçeve 2 meşe parça kullandığından en fazla 10 : 2 = 5 çerçeve yapılır; 5 · 2 = 10 çam parça kullanılır. 15 − 10 = 5 çam parça artar."], "t": "0: yalnız meşe parçalara bakılmış; 1: 40 cm sınırı unutulup parça 130 cm alınmış; 10: parça 13 cm alınmış.", "d": "Önce parça uzunluğunu 40 cm sınırıyla bulun. Her çerçeve 2 çam ve 2 meşe parça kullanır; çerçeve sayısını az olan parça türü belirler.", "ses": "b11"}, {"no": 12, "on": "<p>Bir bisikletçi, kapalı bir velodromda antrenman yapacaktır. Antrenman tahtasındaki bilgiler aşağıda verilmiştir. Bisikletçi sürat ve dayanıklılık çalışmalarının her birini eşit uzunlukta setlere bölecektir. İki çalışmada bir setin uzunluğu aynıdır.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1150 560\" width=\"1150\" style=\"width:143.8mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAFyAvgDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAAECAwUEBgf/xABNEAABAwIEAgYFCAcHAwMEAwABAAIDBBEFEiExQVEGEyJhcZEUMlKB = 14 set."], "t": "7: 1 km sınırı unutulup set 1500 m alınmış; 8 ve 6: yalnız bir çalışmanın set sayısı.", "d": "Her set başlangıç çizgisinde bittiğinden set uzunluğu 250 m'nin katıdır. Set aynı zamanda 6000 ile 4500'ün ortak bölenidir ve 1 km'yi geçemez.", "ses": "b12"}, {"no": 13, "on": "<p>Bir dağcı, kısa olanı 4,2 m uzunluğunda olan iki ipi hiç artmayacak şekilde birbirine eş ve olabilecek en uzun parçalara kesecektir. Dağcı, iplerin santimetre cinsinden uzunluklarının EBOB'unu algoritma yöntemiyle defterine bulmuştur. Defterin ıslanan bölümündeki sayılar okunamamakta ve kesik çizgili kutularla gösterilmektedir.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1020 480\" width=\"1020\" style=\"width:148.8mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAFmAvgDASIAAhEBAxEB/8QAGwAAAQUBAQAAAAAAAAAAAAAAAwABAgQFBgf/xABREAACAQMCAwQGBwUEBwYFBAMBAgMABBESIQUxQRMiUWEGFHGBkaEjMkKxwdHwB1JicuEVJDPxFhc0Q1NjgkVzg5KToiU1RISUZHSywqPS4v/EABoBAAIDAQEAAAAAAAAAAAAAAAABAgMEBQb/xAAqEQACAgICAQUBAAEFAQEAAAAAAQIRAyESMQQTIkFRYTJxBRQjM4FCYv/aAAwDAQACEQMRAD8AyYvQfg7tj+2Lj3Qr+dWR+z3hTDKcbmx1+hU/jVhbVtWQiDI3y550Z0ggALELkbgZPwzXK9SR1OETMPoDwk/V9It/DsAT8mpv9X1ox7npAmMdbc/nWnHxG3it2lVWURk8wVLe6p8P9I/WQ6+pnUvMEgE0+cxcImWP2aK2SOORY8ewOPvoR/Zne69K8XsCegbUpNdK/EZS5CxqmobjI2/OjLd3BQKyFsDpjPKhZZB6aOUP7MeLdL/hxH/eN+VQf9nt3asnrfE7RFdwuYwzkZOAcbV3iKx0u0jHUAWXXy+AqpxiSRrV8W5BjdCdLAgjWD1p+qxcDEg/ZhaOuW44W/kgGPmaKP2a8JVfpOMXQPj2Cj8a11uI49WsyRnOcOpHz5VCSd9Q7Pvqf3m/Gl6jHwRlH9nHCVJ1cbuR/wDbjb51TuP2dQg/3bjsZ8BNAV+410ySOVGvCgjpuKFLdfRELE2rcHcHb2ZprIxOCRyUn7OuJDPZ39i48S7L+FJP2b8VYZ9dsMeUjH8K6mK7K9kvaLpOV1FdicfjRQJbl17PskjYfSDJBz4gjr5VZyZCkcov7Nr8k6uK2C454LnHyo8f7M5TjtON2gH8MbE11qdmkmlXxgYJ0Zz idth=\"835\" height=\"395\" preserveAspectRatio=\"none\"/><g transform=\"translate(-400,-285)\"><text x=\"622.0\" y=\"393.0\" font-size=\"22.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-maxw=\"92\">180 cm²</text><text x=\"1075.0\" y=\"397.0\" font-size=\"22.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-maxw=\"92\">300 cm²</text></g></svg>", "son": "<p>Fotoğrafların yükseklikleri eşittir ve aralarında boşluk kalmayacaktır. Fotoğrafların kenar uzunlukları santimetre cinsinden doğal sayıdır. Ayşe, kolajın çevresine renkli bir şerit yapıştıracaktır.</p>", "k": "Buna göre, Ayşe'nin kullanacağı şerit <u style=\"white-space:nowrap\">en az</u> kaç santimetredir?", "sec": ["88", "94", "104", "136"], "secg": null, "c": "A", "a": ["Ortak yükseklik 180 ile 300'ün ortak bölenidir: EBOB = 60 → 1, 2, 3, 4, 5, 6, 10, 12, 15, 20, 30, 60.", "Kolajın alanı 180 + 300 = 480 cm²'dir; genişliği 480 : yükseklik olur. Çevre 2 · (yükseklik + 480 : yükseklik): yükseklik 12 → 104, 15 → 94, 20 → 88, 30 → 92, 60 → 136 cm.", "En kısa şerit, yükseklik 20 cm iken 88 cm'dir. Ortak bölenin en büyük seçilmesi (60) çevreyi en küçük yapmaz."], "t": "136: yükseklik EBOB alınmış; 94 ve 104: yükseklik 15 cm ya da 12 cm alınmış.", "d": "Ortak yükseklik 180 ile 300'ün ortak bölenidir; ama en büyük ortak bölen en kısa şeridi vermez. Çevreyi her ortak bölen için hesaplayıp karşılaştırın.", "ses": "b15"}, {"no": 16, "on": "<p>Dikdörtgen biçimindeki bir dükkân; depo, ofis ve satış alanı olmak üzere dikdörtgen biçimli üç bölüme ayrılmıştır. Dükkânın planında depo ile ofisin alanları ve dükkânın ön cephesinin uzunluğu yazılıdır.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 910 480\" width=\"910\" style=\"width:132.7mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiME     // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
