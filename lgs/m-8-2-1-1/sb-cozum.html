<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çözümler · Keşfet ve Çöz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--muted:#5b6478;--line:#dfe5ef;--bg:#f5f7fb;--card:#fff;--ss:#6741d9;--kk:#0b7285;--b:#d0700f;--ok:#2b8a3e;--warn:#c92a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif}
header{background:linear-gradient(135deg,#1c5fbf,#2f8fe0);color:#fff;padding:18px 16px 22px}

main{max-width:780px;margin:14px auto 40px;padding:0 16px}
nav.sec{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}nav.sec button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}

ol.sec{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
ol.sec li{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}ol.sec li.dogru{border-color:var(--ok);background:#ebfbee;font-weight:800}
.adim{border-left:4px solid var(--c);padding:6px 12px;margin:8px 0;background:#fff;border-radius:0 10px 10px 0;animation:gel .35s ease-out}
.adim b{color:var(--c)}@keyframes gel{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dug{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
button.btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.dikkat{background:#fff4e6;border:2px solid #f59f00;border-radius:12px;padding:10px 14px;margin:12px 0 4px}.dikkat b{color:#d9480f}
.tuzak{font-size:15px;color:var(--muted);margin-top:8px}
.cevap{font-weight:900;color:var(--ok);margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid var(--line);padding:8px 10px;text-align:left}th{background:#e3fafc;color:#0b7285;font-size:13px;letter-spacing:.06em}
.ses{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border-radius:12px;background:#eef2ff}

.ses span{font-size:14px;color:var(--muted)}
.gizli{display:none}
.tum{margin:4px 0 14px;font-size:14px}.tum a{color:#1c5fbf;font-weight:800}
@media (prefers-reduced-motion:reduce){.adim{animation:none}}
/* Canlandır (05.10.2026) */
.sek{display:flex;gap:6px;margin:12px 0 0;border-bottom:2px solid var(--line)}
.sek button{border:0;background:none;font:inherit;font-weight:900;font-size:15px;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);min-height:44px;position:relative;top:2px;border-bottom:3px solid transparent}
.sek button[aria-selected=true]{color:var(--c);border-bottom-color:var(--c);background:#fff8f0}
.sek .yeni{display:inline-block;font-size:10px;background:#2b8a3e;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.06em}
.cn{padding-top:10px}
.cn-yon{background:#eef6ff;border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:10px}
.cn-sahne{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;min-height:120px;overflow-x:auto}

.cn-adimci input,.cn-test input{width:84px;height:44px;border:2px solid var(--line);border-radius:12px;font:inherit;font-weight:900;text-align:center;font-size:18px}
.cn-test label{font-weight:800;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.cn-btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
.cn-btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.cn-btn[aria-pressed=true]{background:var(--ac,var(--c));color:#fff;border-color:var(--ac,var(--c))}
.cn-btn:disabled{opacity:.5}
.cn-hazir{display:flex;flex-wrap:wrap;gap:6px}

.cn-dur .iyi{color:var(--ok);font-weight:900}.cn-dur .kotu{color:var(--warn);font-weight:900}
.cn-df{margin-top:10px;overflow-x:auto}@media(max-width:480px){.cn-adimci>span{flex-basis:100%}.cn-h{font-size:12px;padding:5px 0}.cn-izg{gap:3px}.cn-sahne{padding:6px}}@media(max-width:480px){.cn-df table{font-size:13px}.cn-df td,.cn-df th{padding:4px 5px}}.cn-df summary{font-weight:900;cursor:pointer;padding:6px 0}.cn-say{color:var(--muted);font-weight:700}
.cn-df table{font-size:15px}.cn-df td{padding:5px 8px}.cn-df tr.cn-iyi td{background:#ebfbee}.cn-df tr.cn-kotu td{background:#fff5f5}.cn-df tr.cn-son td{outline:2px solid var(--c);outline-offset:-2px}
.cn-p{animation:cnGel .35s ease-out both}@keyframes cnGel{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cn-o{fill:#ffa94d;stroke:#d9480f;stroke-width:1}.cn-o2{fill:#e8590c}.cn-k{fill:#ffc9c9;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:3 2}
.cn-cerceve{stroke:#2b8a3e;stroke-width:3}.cn-et{font-size:13px;font-weight:800;fill:#5b6478}.cn-et.b,.cn-et2b{font-weight:900;fill:#1d2433}.cn-et2{font-size:11px;fill:#5b6478;font-weight:700}.cn-et2b{font-size:13px;fill:#fff}
.cn-ku{fill:#fff4e6;stroke:#ffa94d;stroke-width:1.5}.cn-kk{fill:#fff5f5;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:4 3}
.cn-tahta0{fill:#f1f3f5;stroke:#ced4da}.cn-tahta{fill:#c08552;stroke:#8d5a2b}
.cn-ek{stroke:#868e96;stroke-width:2}.cn-sinir{stroke:#c92a2a;stroke-width:3;stroke-dasharray:5 4}.cn-yay{fill:none;stroke:#f76707;stroke-width:2}
.cn-v1{stroke:#2b8a3e;stroke-width:3}.cn-v2{stroke:#c92a2a;stroke-width:3}.cn-kis{font-size:20px}.cn-bus{font-size:16px}.cn-bek{stroke:#c92a2a;stroke-width:5;stroke-linecap:round;opacity:.6}
.cn-kum{fill:#ffe8cc;stroke:#e8590c;stroke-width:3}.cn-kum2{fill:#495057}.cn-para{fill:#ffd43b;opacity:.85}.cn-buyuk{font-size:26px;font-weight:900;fill:#1d2433}
.cn-zem{fill:#adb5bd}.cn-kat{fill:#f1f3f5;stroke:#ced4da}.cn-katon{fill:#d3f9d8;stroke:#2b8a3e}.cn-katoff{fill:#ffe3e3;stroke:#e03131}
.cn-izg{display:grid;gap:4px}.cn-h,.cn-gb{border-radius:8px;text-align:center;font-weight:800;font-size:14px;padding:6px 0}.cn-h{background:#f1f3f5;transition:background .25s,transform .25s}
.cn-gb{background:none;color:var(--muted);font-size:12px}.cn-h.on{background:#ffa94d;color:#1d2433}.cn-h.yeni{transform:scale(1.18);box-shadow:0 0 0 3px #e8590c}
.cn-kartlar{display:flex;flex-wrap:wrap;gap:6px;padding:4px}.cn-kart{min-width:44px;padding:8px 10px;text-align:center;border-radius:10px;background:#fff4e6;border:2px solid #ffa94d;font-weight:900;animation:cnGel .3s}
.cn-kart.kare{background:#e7f5ff;border-color:#1c7ed6}.cn-bosk{color:var(--muted)}
.cn-cift{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 4px;font-weight:800}.cn-cift i{font-weight:600;color:#1c7ed6}
.cn-katlar{padding:4px}.cn-katsat{display:inline-flex;flex-wrap:wrap;gap:6px}.cn-kat2{background:#e6fcf5;border:1.5px solid #12b886;border-radius:8px;padding:3px 8px;font-weight:800;animation:cnGel .3s}.cn-sonsuz{font-weight:800;color:#0b7285}
.cn-onr{background:#f8f0fc;border:2px solid #ae3ec9;border-radius:12px;padding:10px 14px}.cn-kanit{padding:10px 4px 2px}
.cn-kay{display:inline-flex;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap}.cn-kay{max-width:100%}.cn-kay input{width:min(220px,70vw);accent-color:#d0700f}.cn-satir>*{min-width:0;max-width:100%}
@media (prefers-reduced-motion:reduce){.cn-p,.cn-kart,.cn-kat2{animation:none}.cn-h{transition:none}}
/* 05.10.2026 · KOŞUL ve LABİRENT motorları (SB 6.1.1) */
@media(max-width:560px){.soru [style*="grid-template-columns:repeat"]{grid-template-columns:1fr!important}}   /* çok sütunlu konuşma balonları telefonda alt alta */
.cn-kl{list-style:none;padding:0;margin:0;display:grid;gap:4px}.cn-not{color:var(--muted);font-size:14px}.cn-sonuc{margin-top:6px;font-weight:800}
.cn-secg{gap:6px}.cn-secad{font-weight:800;flex-basis:100%}.cn-secg .cn-btn{padding:8px 12px}
.cn-mv{fill:#74c0fc;stroke:#1c7ed6;stroke-width:1}.cn-tl{fill:#69db7c;stroke:#2b8a3e;stroke-width:1.5}
.cn-lab{display:grid;gap:4px;align-items:center;max-width:460px;margin:0 auto}
.cn-lc{min-height:44px;border-radius:8px;border:1.5px solid #ced4da;background:#fff;font:inherit;font-weight:900;font-size:16px;cursor:pointer;padding:0;color:var(--ink)}
.cn-lc.yol{background:#d3f9d8;border-color:#2b8a3e}.cn-lc.simdi{background:#2b8a3e;color:#fff;box-shadow:0 0 0 3px #b2f2bb}.cn-lc.kapali{background:#ffe3e3;border-color:#e03131;color:#c92a2a;text-decoration:line-through}
.cn-lok{color:#2b8a3e;font-weight:900;text-align:center}.cn-lcik{min-height:44px;border:0;background:none;font:inherit;font-weight:900;color:#d9480f;cursor:pointer;padding:0;white-space:nowrap;font-size:14px}.cn-lcik:disabled{cursor:default}

</style></head><body>
<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }
      if (!art && !o.sandalye) sv += `<rect x="10" y="10" width="${gen * hc}" height="${sira * hc}" fill="none" class="cn-cerceve"/>
        <text x="${10 + gen * hc / 2}" y="${H + 4}" class="cn-et" text-anchor="middle">${gen} ${o.birim || ""}</text>
        <text x="${W + 4}" y="${10 + sira * hc / 2}" class="cn-et" dominant-baseline="middle">${sira} ${o.birim || ""}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W + 70} ${H + 22}" role="img" aria-label="${N} ${o.ad || "kare"}, her sırada ${gen}">${sv}</svg>`;
      const r = o.kural ? o.kural(gen, sira, art, N) : null;
      let m;
      if (art) m = `<span class="kotu">✘</span> ${N} ${o.ad || "kare"} her sırada ${gen} olacak biçimde dizilince ${sira} tam sıra oluşur, <b>${art} ${o.ad || "kare"} artar</b>. Dikdörtgen olmaz: ${N} : ${gen} işleminde kalan ${art}.`;
      else m = `<span class="iyi">✔</span> <b>${N} = ${gen} ${x} ${sira}</b> · ${sira} sıra, her sırada ${gen} ${o.ad || "kare"}; hiç artmadı.` + (gen === sira ? ` <b>Kare oldu!</b> İki kenar aynı: ${gen}.` : "");
      if (!art && o.cevre) m += ` Çevre = 2 ${x} (${gen} + ${sira}) = <b>${2 * (gen + sira)} m</b>.`;
      if (r && r.msg) m += `<br>${r.msg}`;
      s.dur.innerHTML = m;
      const sutunlar = o.satir ? o.satir(gen, sira, art, N, r) : [gen, art ? `${sira} (+ ${art} artan)` : sira, art, art ? "olmaz" : (gen === sira ? "kare" : "dikdörtgen")];
      s.yaz(N + ":" + gen, sutunlar, !art && (!r || r.ok !== false));
    }
    ciz(g.get());
  }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {
    const N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });
    const g = adimci(o.etiket, 1, o.max || N, o.bas || 2, v => { sonK = v; });

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {

      ciftler.innerHTML = L.filter(v => v * v <= N).map(v => `<span>${v} ${x} ${N / v}${v * v === N ? " <i>(aynı sayı: bir kez yazılır)</i>" : ""}</span>`).join("");
    }
    const tamamMi = () => { for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) return false; return true; };
    const eksik = () => { const L = []; for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) L.push(i); return ` <br>Henüz denenmeyen küçük bölenler var: <b>${L.join(", ")}</b>. Bunları da deneyin.`; };
    function dene(d) {
      if (!d || d < 1) return; denendi.add(d);
      const b = Math.floor(N / d), r = N % d;
      if (d > N) { s.dur.innerHTML = `${d} > ${N}: ${E(N,"den")} büyük sayı ${E(N,"in")} çarpanı olamaz.`; return; }
      if (r === 0) { bul.add(d); bul.add(b); ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${N} : ${d} = ${b}, kalan 0 → <b>${d} ${x} ${b} = ${N}</b>. ${d} ve ${b} çarpandır.` + (d * d >= N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} ${d * d === N ? "=" : ">"} ${N}. Artık yeni çift çıkmaz; bütün çarpanlar bulundu.` : eksik() : ""); }
      else { s.dur.innerHTML = `<span class="kotu">✘</span> ${N} : ${d} işleminde bölüm ${b}, <b>kalan ${r}</b>. ${d}, ${E(N,"in")} çarpanı değildir.` + (d * d > N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} > ${N}. Daha büyük bölen denemeye gerek yok; çarpan listesi tamam.` : eksik() : ""); }
      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));
      if (tamam) s.yaz("n" + N, [N, [...bul].sort((a, b) => a - b).join(", "), bul.size], true);
    }
    bD.onclick = () => dene(Math.round(+bi.value));
    bS.onclick = () => { let d = 1; while (denendi.has(d)) d++; bi.value = d; dene(d); };
    if (bK) bK.onclick = async () => {
      bK.disabled = true; katlar.textContent = ""; const sat = h("div", "cn-katsat"); katlar.append(h("b", "", `${E(N,"in")} katları: `), sat);
      for (let i = 1; i <= (o.katSay || 12); i++) { sat.appendChild(h("span", "cn-kat2", `${N * i}`)); await bekle(220); }
      sat.appendChild(h("span", "cn-sonsuz", "… ve sonsuza kadar sürer"));
      bK.disabled = false;
    };
    yeni();
  }

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */
  function KUMBARA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Para", "Sonuç"] });
    const k = o.k; let hafta = 0, tmr = null;
    const kut = h("div", "cn-satir"); const bA = dug("Bir hafta geçsin +"), bO = dug("▶ Haftaları oynat", "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bO, bS); s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Kumbarada şu para olabilir mi? <input type="number" inputmode="numeric" min="1" max="500"> TL</label>`;
    const bT = dug("Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test); const ti = test.querySelector("input");
    function ciz() {
      const top = hafta * k, sv = [];
      const yuk = Math.min(150, top * 1.4);
      sv.push(`<rect x="110" y="20" width="120" height="160" rx="22" class="cn-kum"/><rect x="150" y="14" width="40" height="8" rx="3" class="cn-kum2"/>`);
      sv.push(`<rect x="116" y="${176 - yuk}" width="108" height="${yuk}" rx="10" class="cn-para"/>`);
      sv.push(`<text x="170" y="110" text-anchor="middle" class="cn-buyuk">${top} TL</text><text x="170" y="134" text-anchor="middle" class="cn-et">${hafta}. hafta</text>`);
      let cizgi = ""; for (let i = 1; i <= hafta && i <= 16; i++) cizgi += `<text x="${260 + ((i - 1) % 4) * 52}" y="${40 + Math.floor((i - 1) / 4) * 34}" class="cn-et2">${k}${x}${i}=${k * i}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 480 190" role="img" aria-label="Kumbara">${sv.join("")}${cizgi}</svg>`;
      s.dur.innerHTML = hafta ? `${hafta}. hafta sonunda kumbarada ${k} ${x} ${hafta} = <b>${top} TL</b> var.` : `Kumbara boş. Her hafta ${k} TL atılıyor.`;
    }
    bA.onclick = () => { hafta++; ciz(); };
    bO.onclick = () => { if (tmr) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } bO.textContent = "❚❚ Durdur"; tmr = setInterval(() => { if (hafta >= 15) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } hafta++; ciz(); }, az ? 50 : 500); };
    bS.onclick = () => { hafta = 0; ciz(); };
    bT.onclick = () => {
      const v = Math.round(+ti.value); if (!v) return; const b = Math.floor(v / k), r = v % k;
      s.dur.innerHTML = r ? `<span class="kotu">✘</span> ${k} ${x} ${b} = ${k * b} TL, ${k} ${x} ${b + 1} = ${k * (b + 1)} TL. ${v} TL arada kalır (${v} : ${k} → kalan ${r}). Kumbarada hiçbir hafta ${v} TL olmaz.`
        : `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · ${b}. hafta sonunda kumbarada tam ${v} TL olur.`;
      if (!r) { hafta = b; ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · <b>${b}. hafta</b> sonunda kumbarada tam ${v} TL olur.`; }
      s.yaz("t" + v, [v + " TL", r ? `kalan ${r} ✘` : `${k} ${x} ${b} ✔`], !r);
    };
    ciz();
  }

  /* 9) ÖNERME LABORATUVARI: önermeyi farklı sayılarla sınama */
  function ONERME(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Önerme", "Sayı", "Sonuç"] });
    let akt = 0; const kut = h("div", "cn-hazir");
    const bt = o.onermeler.map((on, i) => { const b = dug(on.ad, "ghost"); b.setAttribute("aria-pressed", i === 0); b.onclick = () => { akt = i; bt.forEach((x, j) => x.setAttribute("aria-pressed", j === i)); goster(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Sınanacak sayı: <input type="number" inputmode="numeric" min="1" max="200" value="12"></label>`;
    const bT = dug("Sına"), bR = dug("Rastgele sayı", "ghost"); test.append(bT, bR); s.den.appendChild(test); const ti = test.querySelector("input");
    function goster() { s.sah.innerHTML = `<div class="cn-onr"><b>${o.onermeler[akt].ad}:</b> “${o.onermeler[akt].metin}”</div>`; s.dur.innerHTML = "Bir sayı yazıp Sına düğmesine basın. Önerme her sayıda doğru mu?"; }
    function sina(n) {
      const on = o.onermeler[akt], r = on.sina(n);
      s.sah.innerHTML = `<div class="cn-onr"><b>${on.ad}:</b> “${on.metin}”</div><div class="cn-kanit">${r.goster}</div>`;
      s.dur.innerHTML = (r.ok ? `<span class="iyi">✔</span> ${n} için önerme doğru.` : `<span class="kotu">✘</span> ${n} için önerme yanlış! Bir karşı örnek bulundu.`) + (r.not ? " " + r.not : "");
      s.yaz(akt + ":" + n, [on.ad, n, r.ok ? "doğru" : "yanlış (karşı örnek)"], r.ok);
    }
    bT.onclick = () => { const n = Math.round(+ti.value); if (n > 0) sina(n); };
    bR.onclick = () => { const n = 2 + Math.floor(Math.random() * 59); ti.value = n; sina(n); };
    goster();
  }


  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →
     koşullar tek tek denetlenir (✔/✘) → deney defterine yazılır. Doğru cevap verilmez; öğrenci uygun girdiyi kendisi arar.
     o.girdi: [{ad, min, max, bas} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → SVG/HTML · o.kosullar: [{ad, f(v) → bool | {ok, not}}]
     o.dugme: düğme yazısı (false → her değişiklikte denetlenir) · o.sonuc(v, hepsi, L) · o.satir(v, hepsi, L) · o.iyi(v, L) · o.ek: [{ad, deger(v) → v}] */
  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);
      s.dur.innerHTML = m;
      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);
    }
    kur = true; ciz();
    if (bS) s.dur.innerHTML = o.ilk || "Değerleri seçip Sına düğmesine basın."; else sina();
  }

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

/* M.8.2.1.1–2 · Cebirsel İfadeler ve Çarpma · bağlam sorularının “Canlandır” düzenekleri (25.10.2026, ANA_KURALLAR §4.k, §19-10/11).
   Motorlar (K8, CN.k8Iskelet, CN.LAB, CN.DURUM) canlandir_8141.js ile aynıdır; ortak canlandir.js'e dokunulmaz.
   Her düzenekte öğrenci harfin değerini ve sınayacağı seçeneği seçer → sahne o değerle ölçekli çizilir, gerçek ölçü sahneden hesaplanır →
   seçeneğin verdiği değerle karşılaştırılıp deney defterine yazılır; doğru cevap düğmeyle verilmez, denemelerden çıkar. */
(() => { const st = document.createElement("style"); st.textContent = `.gr{display:block;width:100%;max-width:460px;margin:4px auto}.gr text{font-family:"Source Sans 3",Arimo,sans-serif}
.k8-kart{display:inline-flex;align-items:center;justify-content:center;min-width:64px;min-height:52px;padding:6px 12px;border-radius:14px;border:3px solid var(--kr,#d0700f);background:#fff;font-size:19px;font-weight:900}
.k8-satir{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}.cn-btn{min-width:44px;min-height:44px}
.frac{display:inline-grid;grid-template-rows:auto auto;vertical-align:middle;line-height:1.05;margin:0 .12em;text-align:center;font-size:.95em}.frac>span{display:block;padding:0 .2em}.frac>span:first-child{border-bottom:.08em solid currentColor}
.soru{overflow-x:auto}.cn-dur{overflow-x:auto}`; document.head.appendChild(st); })();
/* ---------------- yardımcılar ---------------- */
const K8 = (() => {
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const Q = (p, q = 1) => { if (q < 0) { p = -p; q = -q; } const g = gcd(p, q); return { p: p / g, q: q / g }; };
  const qp = (a, e) => { if (a === 0) return e > 0 ? Q(0) : null; return e >= 0 ? Q(a ** e) : Q(1, a ** (-e)); };   // a tam sayı
  const qpQ = (x, e) => e >= 0 ? Q(x.p ** e, x.q ** e) : Q(x.q ** (-e), x.p ** (-e));                                  // kesir taban
  const qEs = (x, y) => x && y && x.p === y.p && x.q === y.q;
  const qv = x => x.p / x.q;
  const sn = n => { if (typeof n === "bigint") { const s = (n < 0n ? -n : n).toString(); return (n < 0n ? "−" : "") + (s.length > 4 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, " ") : s); }
    if (typeof n !== "number") return String(n).replace(/-/g, "−"); const s = String(Math.abs(n)); return (n < 0 ? "−" : "") + (Math.abs(n) >= 10000 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, " ") : s); };
  const fr = (p, q) => `<span class="frac"><span>${p}</span><span>${q}</span></span>`;
  const qh = x => x === null ? "tanımsız" : x.q === 1 ? sn(x.p) : (x.p < 0 ? "−" : "") + fr(sn(Math.abs(x.p)), sn(x.q));
  const tb = a => typeof a === "number" && a < 0 ? `(${sn(a)})` : String(a);
  const us = (a, e) => `${tb(a)}<sup>${sn(e)}</sup>`;
  const UST = e => String(e).replace(/[−-]/g, "⁻").split("").map(c => c === "⁻" ? c : "⁰¹²³⁴⁵⁶⁷⁸⁹"[+c]).join("");
  const usU = (a, e) => `${typeof a === "number" && a < 0 ? `(${sn(a)})` : a}${UST(e)}`;
  const ondalik = (x, b = 1) => (Math.round(x * 10 ** b) / 10 ** b).toString().replace(".", ",");
  /* SVG kesir */
  const svgFr = (x, y, p, q, fs = 15, renk = "#1d2433") => `<text x="${x}" y="${y - fs * .2}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${renk}">${p}</text><line x1="${x - fs * .5}" y1="${y}" x2="${x + fs * .5}" y2="${y}" stroke="${renk}" stroke-width="${(fs * .08).toFixed(2)}"/><text x="${x}" y="${y + fs * .95}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${renk}">${q}</text>`;
  return { gcd, Q, qp, qpQ, qEs, qv, sn, fr, qh, tb, us, UST, usU, ondalik, svgFr };
})();

/* ---------------- ortak iskelet (canlandir.js ile aynı sınıflar) ---------------- */
CN.k8Iskelet = function (el, o) {
  const h = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.innerHTML = x; return e; };
  el.innerHTML = "";
  const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);

/* ---------------- MOTOR: LAB (kuvvet laboratuvarı) ----------------
   o.girdi: [{ad, min, max, bas, adim?, yaz?} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → sahne (SVG/HTML) · o.durum(v) → sonuç metni
   o.satir(v) → deney defteri satırı (null: yazılmaz) · o.iyi(v) → yeşil/kırmızı satır · o.anahtar(v) · o.hazir: [{ad, v:[…]}] */
CN.LAB = function (el, o) {
  const s = CN.k8Iskelet(el, o), v = o.girdi.map(g => g.bas), ayar = [];
  o.girdi.forEach((g, i) => {
    const w = s.h("div", "cn-satir");
    if (g.sec) {
      w.classList.add("cn-secg"); w.appendChild(s.h("span", "cn-secad", g.ad));
      const bs = g.sec.map(x => { const b = s.dug(g.yaz ? g.yaz(x) : K8.sn(x), "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
      const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); guncelle(); };
      ayar[i] = sec;
    } else {
      const adim = g.adim || 1, ond = adim % 1 !== 0, yz = g.yaz || (x => ond ? K8.ondalik(x) : K8.sn(x));
      const a = s.h("div", "cn-adimci");
      a.innerHTML = `<span>${g.ad}</span><button type="button" aria-label="${g.ad.replace(/<[^>]+>/g, "")} azalt">−</button>${ond || g.yaz ? `<output></output>` : `<input type="number" inputmode="numeric" min="${g.min}" max="${g.max}" aria-label="${g.ad.replace(/<[^>]+>/g, "")}">`}<button type="button" aria-label="${g.ad.replace(/<[^>]+>/g, "")} artır">+</button>`;
      const [b1, b2] = a.querySelectorAll("button"), inp = a.querySelector("input"), out = a.querySelector("output");
      const kur = x => { x = Math.max(g.min, Math.min(g.max, Math.round((+x) / adim) * adim)); if (isNaN(x)) x = g.min; x = +x.toFixed(4); v[i] = x; if (inp) inp.value = x; else out.innerHTML = yz(x); };
      const ata = x => { kur(x); guncelle(); };
      b1.onclick = () => ata(v[i] - adim); b2.onclick = () => ata(v[i] + adim);
      if (inp) inp.onchange = () => ata(String(inp.value).replace(",", "."));
      kur(g.bas); ayar[i] = ata; w.appendChild(a);
    }
    s.den.appendChild(w);
  });
  if (o.hazir) { const hz = s.h("div", "cn-hazir cn-secg"); if (o.hazirEt) hz.appendChild(s.h("span", "cn-secad", o.hazirEt)); o.hazir.forEach(x => { const b = s.dug(x.ad, "ghost"); b.onclick = () => { x.v.forEach((y, i) => { if (y != null) { v[i] = y; } }); x.v.forEach((y, i) => { if (y != null) ayar[i](y); }); }; hz.appendChild(b); }); s.den.appendChild(hz); }
  let hazir = false;
  function guncelle() {
    if (!hazir) return;
    const c = v.slice(); s.sah.innerHTML = o.ciz(c, s); s.dur.innerHTML = o.durum(c, s);
    const r = o.satir ? o.satir(c, s) : null;
    if (r) s.yaz(o.anahtar ? o.anahtar(c) : c.join("|"), r, o.iyi ? o.iyi(c) : undefined);
    if (o.sonra) o.sonra(c, s);
  }
  hazir = true; guncelle();
  return { v, ayar, s };
};

/* ---------------- MOTOR: DURUM (düğmelerle adım adım değişen durum) ----------------
   o.bas(secim) → başlangıç durumu · o.dugmeler: [{ad, f(d) → {d, msg} }] · o.ciz(d) · o.durum(d) · o.bitti(d) → {anahtar, hucre, iyi, msg} | null
   o.secim: {ad, sec, bas, yaz} (başlangıcı seçtirir; değişince düzenek baştan kurulur) */
CN.DURUM = function (el, o) {
  const s = CN.k8Iskelet(el, o); let sec = o.secim ? o.secim.bas : null, d = o.bas(sec), son = "", kapali = false;
  if (o.secim) {
    const w = s.h("div", "cn-satir cn-secg"); w.appendChild(s.h("span", "cn-secad", o.secim.ad));
    const bs = o.secim.sec.map(x => { const b = s.dug(o.secim.yaz ? o.secim.yaz(x) : K8.sn(x), "ghost"); b.setAttribute("aria-pressed", x === sec); b.onclick = () => { sec = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", o.secim.sec[j] === x)); bastan(); }; w.appendChild(b); return b; });
    s.den.appendChild(w);
  }
  const w = s.h("div", "cn-satir");
  const bt = o.dugmeler.map(g => { const b = s.dug(g.ad, g.ghost ? "ghost" : ""); b.onclick = () => { if (kapali) return; const r = g.f(d); if (r.d) d = r.d; son = r.msg || ""; ciz(); }; w.appendChild(b); return b; });
  const bB = s.dug("Baştan", "ghost"); bB.onclick = () => bastan(); w.appendChild(bB); s.den.appendChild(w);
  function bastan() { d = o.bas(sec); son = ""; kapali = false; ciz(); }
  function ciz() {
    s.sah.innerHTML = o.ciz(d, sec); let m = (son ? son + "<br>" : "") + o.durum(d, sec);
    const b = o.bitti ? o.bitti(d, sec) : null;
    if (b) { kapali = !!b.kapat; s.yaz(b.anahtar, b.hucre, b.iyi); if (b.msg) m += "<br>" + b.msg; }
    bt.forEach(x => x.disabled = kapali);
    s.dur.innerHTML = m;
  }
  ciz();
};


/* ---------------- 8211 yardımcıları: terim listesi cebiri, ölçekli dikdörtgen çizici ---------------- */
const C8 = (() => {
  const T = (c, m = {}) => ({ c, m: { ...m } });
  const parse = s => { s = String(s).replace(/<sup>(\d)<\/sup>/g, "^$1").replace(/²/g, "^2").replace(/\s/g, "").replace(/−/g, "-"); const R = []; const re = /([+-]?)(\d*)((?:[a-z](?:\^?\d)?)*)/g; let m;
    while ((m = re.exec(s)) && m[0] !== "") { const sg = m[1] === "-" ? -1 : 1, c = m[2] === "" ? 1 : +m[2], mm = {};
      (m[3].match(/[a-z]\^?\d?/g) || []).forEach(p => { const h = p[0], e = +(p.replace(/[a-z^]/g, "") || 1); mm[h] = (mm[h] || 0) + e; }); R.push(T(sg * c, mm)); if (re.lastIndex >= s.length) break; } return R; };
  const deger = (s, v) => parse(s).reduce((t, x) => t + x.c * Object.keys(x.m).reduce((p, h) => p * Math.pow(v[h], x.m[h]), 1), 0);
  const yaz = s => String(s).replace(/\^(\d)/g, "<sup>$1</sup>").replace(/-/g, "−");
  const RK = { mav: ["#1c6fbf", "#d6e6f8"], tur: ["#d9480f", "#ffe3d1"], mor: ["#6d3fc0", "#e6dcf7"], cam: ["#0b7285", "#d3eef2"], kum: ["#8a5a00", "#f6ead2"], kir: ["#c92a2a", "#ffe3e3"], bos: ["#495057", "#ffffff"] };
  const T8 = (x, y, s, fs = 14, w = 800, anc = "middle") => `<text x="${x}" y="${y}" font-size="${fs}" font-weight="${w}" text-anchor="${anc}" fill="#111" stroke="#fff" stroke-width="3.5" paint-order="stroke">${s}</text>`;
  /* P=[{x,y,w,h,r,t,dash}] model birimi; O=[{x1,y1,x2,y2,t,yan}] ölçüler */
  function sekil(P, O = [], W = 440, fs = 14) {
    const xs = [], ys = []; P.forEach(p => { xs.push(p.x, p.x + p.w); ys.push(p.y, p.y + p.h); }); O.forEach(o => { xs.push(o.x1, o.x2); ys.push(o.y1, o.y2); });
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys), gen = t => String(t).replace(/<[^>]+>/g, "").length * fs * .56 + 6, d = fs * 1.2;
    const pl = 10 + Math.max(0, ...O.filter(o => o.yan === "sol").map(o => d + 8 + gen(o.t))), pr = 10 + Math.max(0, ...O.filter(o => o.yan === "sag").map(o => d + 8 + gen(o.t)));
    const pt = 10 + (O.some(o => o.yan === "ust") ? d + fs : 0), pb = 10 + (O.some(o => o.yan === "alt") ? d + fs : 0);
    const u = Math.max(1.5, Math.min((W - pl - pr) / (x1 - x0 || 1), 280 / (y1 - y0 || 1))), X = x => pl + (x - x0) * u, Y = y => pt + (y - y0) * u; let s = "";
    P.forEach(p => { const r = RK[p.r || "mav"]; s += `<rect x="${X(p.x)}" y="${Y(p.y)}" width="${Math.max(0, p.w * u)}" height="${Math.max(0, p.h * u)}" fill="${r[1]}" stroke="${r[0]}" stroke-width="${p.ince ? 1 : 2}" ${p.dash ? 'stroke-dasharray="6 4"' : ""}/>`; });
    P.forEach(p => { if (p.t) s += T8(X(p.x + p.w / 2), Y(p.y + p.h / 2) + fs * .36, p.t, p.fs || fs); });
    O.forEach(o => { if (o.yan === "ust" || o.yan === "alt") { const yy = Y(o.y1) + (o.yan === "ust" ? -d : d), a = X(o.x1), b = X(o.x2);
        s += `<path d="M${a} ${yy}H${b}M${a} ${yy - 5}v10M${b} ${yy - 5}v10" stroke="#555" stroke-width="1.3" fill="none"/>` + T8((a + b) / 2, yy + (gen(o.t) + 4 < b - a ? fs * .36 : (o.yan === "ust" ? -fs * .5 : fs * 1.2)), o.t, fs); }
      else { const xx = X(o.x1) + (o.yan === "sol" ? -d : d), a = Y(o.y1), b = Y(o.y2);
        s += `<path d="M${xx} ${a}V${b}M${xx - 5} ${a}h10M${xx - 5} ${b}h10" stroke="#555" stroke-width="1.3" fill="none"/>` + T8(xx + (o.yan === "sol" ? -7 : 7), (a + b) / 2 + fs * .36, o.t, fs, 800, o.yan === "sol" ? "end" : "start"); } });
    const Wt = (x1 - x0) * u + pl + pr, Ht = (y1 - y0) * u + pt + pb;
    return `<svg class="gr" viewBox="0 0 ${Wt.toFixed(1)} ${Ht.toFixed(1)}" style="max-width:${Math.round(Math.min(Wt, 460))}px">${s}</svg>`;
  }
  return { parse, deger, yaz, sekil, RK };
})();

    yon: "k'yi değiştirin; ekran 8k'ye 5k, pencere (2k + 4)'e (k + 6) çizilir.",
    ciz: ([k]) => sekil([{ x: 0, y: 0, w: 8 * k, h: 5 * k, r: "mav" }, { x: 1, y: 1, w: 2 * k + 4, h: k + 6, r: "bos", t: "pencere" }],
      [{ x1: 0, y1: 5 * k, x2: 8 * k, y2: 5 * k, t: `8k = ${8 * k}`, yan: "alt" }, { x1: 0, y1: 0, x2: 0, y2: 5 * k, t: `5k = ${5 * k}`, yan: "sol" }], 360),
    olc: ([k]) => 40 * k * k - (2 * k + 4) * (k + 6), dt: ([k]) => `Ekran ${40 * k * k}, pencere ${(2 * k + 4) * (k + 6)} cm²` });
  /* 7 · tren istasyonları */
  C[7] = Q({ h: "k", min: 1, max: 6, bas: 2, olcAd: "A–D uzaklığı", sec: ["7k + 12", "7k + 16", "5k + 6", "7k + 8"], ilk: 1,
    yon: "k'yi değiştirin; AB, BC ve CD ölçekli olarak çizilir.",
    ciz: ([k]) => { const L = [2 * k + 3, 4 * k + 2, k + 7], T = L.reduce((a, b) => a + b, 0), u = 400 / T; let x = 20, s = `<line x1="20" y1="30" x2="${20 + T * u}" y2="30" stroke="#111" stroke-width="2.2"/>`;
      ["A", "B", "C", "D"].forEach((n, i) => { s += `<rect x="${x - 6}" y="24" width="12" height="12" fill="#fff" stroke="#1c6fbf" stroke-width="2"/><text x="${x}" y="56" font-size="14" font-weight="800" text-anchor="middle">${n}</text>`;
        if (i < 3) { s += `<text x="${x + L[i] * u / 2}" y="18" font-size="13" font-weight="800" text-anchor="middle">${L[i]}</text>`; x += L[i] * u; } });

    olc: ([k]) => 7 * k + 12, dt: ([k]) => `AB = ${2 * k + 3}, BC = 2 · ${2 * k + 3} − 4 = ${4 * k + 2}, CD = ${k + 7}` });
  /* 8 · havuz ve yürüme yolu */
  C[8] = Q({ h: "n", min: 2, max: 6, bas: 2, olcAd: "Yolun alanı", sec: ["16n + 32", "16n + 16", "8n + 16", "3n^2 + 28n + 32"], ilk: 1,
    yon: "n'yi değiştirin; havuz 3n'ye (n + 4), çevresindeki yol her yerde 2 m genişliğinde çizilir.",
    ciz: ([n]) => sekil([{ x: 0, y: 0, w: 3 * n + 4, h: n + 8, r: "kum" }, { x: 2, y: 2, w: 3 * n, h: n + 4, r: "cam", t: "havuz" }],
      [{ x1: 2, y1: n + 6, x2: 3 * n + 2, y2: n + 6, t: `3n = ${3 * n}`, yan: "alt" }, { x1: 3 * n + 4, y1: 2, x2: 3 * n + 4, y2: n + 6, t: `n + 4 = ${n + 4}`, yan: "sag" }], 340),
    olc: ([n]) => (3 * n + 4) * (n + 8) - 3 * n * (n + 4) });
  /* 9 · market para üstü */

  /* 10 · köşe yazısı */

  /* 11 · kurdeleli kutu */

=\"txz\">3(2r<sup>2</sup> + 10r) = 6r<sup>2</sup> + 30r</span>."], "t": "<span class=\"txz\">2r<sup>2</sup> + 10r</span>: alan; <span class=\"txz\">6r<sup>2</sup> + 5</span>: <span class=\"txz\">r + 5</span>'in yalnız ilk terimi çarpılmış; <span class=\"txz\">6r<sup>2</sup> + 10r</span>: <span class=\"txz\">10r</span> üç ile çarpılmamış", "d": "Önce bahçenin alanını <span class=\"txz\">2r(r + 5)</span> olarak bulun; sonra alanın bütün terimlerini 3 ile çarpın.", "ses": "b02"}, {"no": 3, "on": "<p>Bir binanın zemin katının yüksekliği <span class=\"txz\">(h + 5)</span> m, zemin katın üstündeki her katın yüksekliği <span class=\"txz\">(h + 3)</span> m'dir. Binada zemin kattan başka 5 kat vardır.</p>", "g": "<div style=\"display:flex;justify-content:center\"><div style=\"border:.45mm solid #9b1c36;border-radius:3mm;background:#fff;padding:2mm 3.2mm;font-size:10.6pt;text-align:left\"><div style=\"font-weight:800;color:#9b1c36;margin-bottom:.8mm\">Bina bilgileri</div><div style=\"margin:.4mm 0\">Zemin kat: <span class=\"txz\">(h + 5)</span> m</div><div style=\"margin:.4mm 0\">Diğer her kat: <span class=\"txz\">(h + 3)</span> m</div><div style=\"margin:.4mm 0\">Zeminden başka kat sayısı: 5</div></div></div>", "son": "", "k": "Buna göre, binanın yüksekliğini metre cinsinden veren cebirsel ifade aşağıdakilerden hangisidir?", "sec": ["<span class=\"txz\">6h + 20</span>", "<span class=\"txz\">6h + 8</span>", "<span class=\"txz\">6h + 30</span>", "<span class=\"txz\">5h + 20</span>"], "secg": null, "c": "A", "a": ["Üst katların toplam yüksekliği <span class=\"txz\">5(h + 3) = 5h + 15</span> m'dir.", "Bina <span class=\"txz\">h + 5 + 5h + 15 = 6h + 20</span> m'dir."], "t": "<span class=\"txz\">6h + 8</span>: 3 beş ile çarpılmamış; <span class=\"txz\">6h + 30</span>: zemin kat da <span class=\"txz\">(h + 3)</span> ile birlikte sayılmış; <span class=\"txz\">5h + 20</span>: zemin kattaki h unutulmuş", "d": "Zemin katın yüksekliği öbür katlardan farklıdır. Üstteki 5 katı <span class=\"txz\">5(h + 3)</span> ile, zemin katı ayrıca ekleyin.", "ses": "b03"}, {"no": 4, "on": "<p>Bir kırtasiye, tanesini <span class=\"txz\">(2p − 1)</span> TL'ye aldığı kalemlerin her birini <span class=\"txz\">(p + 3)</span> TL kârla satmaktadır. Bir günde <span class=\"txz\">(p + 4)</span> kalem satılmıştır.</p>", "g": "<div style=\"display:flex;gap:3mm;justify-content:center;flex-wrap:wrap\"><div style=\"border:.45mm solid #d9480f;background:#ffe3d1;border-radius:2.4mm;padding:1.6mm 3.4mm;min-width:14mm;text-align:center;font-weight:700;font-size:11pt\">Alış: <span class=\"txz\">(2p − 1)</span> TL</div><div style=\"border:.45mm solid #d9480f;background:#ffe3d1;border-radius:2.4mm;padding:1.6mm 3.4mm;min-width:14mm;text-align:center;font-weight:700;font-size:11pt\">Kâr: <span class=\"txz\">(p + 3)</span> TL</div><div style=\"border:.45mm solid #d9480f;background:#ffe3d1;border-radius:2.4mm;padding:1.6mm 3.4mm;min-width:14mm;text-align:center;font-weight:700;font-size:11pt\">Satılan: <span class=\"txz\">(p + 4)</span> tane</div></div>", "son": "", "k": "Buna göre, kırtasiyenin bu satıştan elde ettiği geliri TL cinsinden veren cebirsel ifade aşağıdakilerden hangisidir?", "sec": ["<span class=\"txz\">3p<sup>2</sup> + 8</span>", "<span class=\"txz\">2p<sup>2</sup> + 7p − 4</span>", "<span class=\"txz\">3p<sup>2</sup> + 14p + 8</span>", "<span class=\"txz\">3p<sup>2</sup> + 10p + 8</span>"], "secg": null, "c": "C", "a": ["Bir kalemin satış fiyatı <span class=\"txz\">(2p − 1) + (p + 3) = 3p + 2</span> TL'dir.", "Gelir <span class=\"txz\">(3p + 2)(p + 4) = 3p<sup>2</sup> + 12p + 2p + 8 = 3p<sup>2</sup> + 14p + 8</span>."], "t": "<span class=\"txz\">3p<sup>2</sup> + 8</span>: ortadaki çarpımlar unutulmuş; <span class=\"txz\">2p<sup>2</sup> + 7p − 4</span>: alış fiyatıyla çarpılmış; <span class=\"txz\">3p<sup>2</sup> + 10p + 8</span>: <span class=\"txz\">12p − 2p</span> alınmış", "d": "Satış fiyatı alış fiyatı ile kârın toplamıdır: <span class=\"txz\">3p + 2</span>. Gelir, satış fiyatı ile satılan kalem sayısının çarpımıdır.", "ses": "b04"}, {"no": 5, "on": "<p>Bir köprünün korkuluğuna eşit aralıklarla 9 direk dikilmiştir. İlk ve son direk korkuluğun iki ucundadır. Ardışık iki direk arasındaki uzaklık <span class=\"txz\">(d + 2)</span> m'dir.</p>", "g": "<svg viewBox=\"0 0 420 70\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"20.0\" y1=\"40.0\" x2=\"400.0\" y2=\"40.0\" stroke=\"#8a5a00\" stroke-width=\"3\" stroke-linecap=\"round\"/><rect x=\"16.0\" y=\"18.0\" width=\"8.0\" height=\"34.0\" fill=\"#f6ead2\" stroke=\"#8a5a00\" stroke-width=\"1.6\"/><rect x=\"63.5\" y=\"18.0\" width=\"8.0\" height=\"34.0\" fill=\"#f6ead2\" stroke=\"#8a5a00\" stroke-width=\"1.6\"/><rect x=\"111.0\" y=\"18.0\" width=\"8.0\" height=\"34.0\" fill=\"#f6ead2\" stroke=\"#8a5a00\" stroke-width=\"1.6\"/><rect x=\"158.5\" y=\"18.0\" width=\"8.0\" height=\"34.0\" fill=\"#f6ead2\" stroke=\"#8a5a00\" stroke-width=\"1.6\"/><rect x=\"206.0\" y=\"18.0\" width=\"8.0\" height=\"34.0\" fill=\"#f6ead2\" stroke=\"#8a5a00\" stroke-width=\"1.6\"/><rect x=\"253.5\" y=\"18.0\" width=\"8.0\" height=\"34.0\" fill=\"#f6ead2\" stroke=\"#8a5a00\" stroke-width=\"1.6\"/><rect x=\"301.0\" y=\"18.0\" width=\"8.0\" height=\"34.0\" fill=\"#f6ead2\" stroke=\"#8a5a00\" stroke-width=\"1.6\"/><rect x=\"348.5\" y=\"18.0\" width=\"8.0\" height=\"34.0\" fill=\"#f6ead2\" stroke=\"#8a5a00\" stroke-width=\"1.6\"/><rect x=\"396.0\" y=\"18.0\" width=\"8.0\" height=\"34.0\" fill=\"#f6ead2\" stroke=\"#8a5a00\" stroke-width=\"1.6\"/><line x1=\"24.0\" y1=\"62.0\" x2=\"63.5\" y2=\"62.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><text x=\"44.0\" y=\"60.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">d + 2</text></svg>", "son": "<p>Direklerin kalınlığı önemsenmeyecektir.</p>", "k": "Buna göre, korkuluğun uzunluğunu metre cinsinden veren cebirsel ifade aşağıdakilerden hangisidir?", "sec": ["<span class=\"txz\">9d + 18</span>", "<span class=\"txz\">10d + 20</span>", "<span class=\"txz\">8d + 2</span>", "<span class=\"txz\">8d + 16</span>"], "secg": null, "c": "D", "a": ["9 direk arasında 8 aralık vardır.", "Uzunluk <span class=\"txz\">8(d + 2) = 8d + 16</span> m."], "t": "<span class=\"txz\">9d + 18</span>: aralık sayısı direk sayısı sanılmış; <span class=\"txz\">10d + 20</span>: iki uçta da birer aralık eklenmiş; <span class=\"txz\">8d + 2</span>: 2 sekiz ile çarpılmamış", "d": "9 direk arasında 9 değil 8 aralık vardır; korkuluğun uzunluğu aralık sayısı ile aralığın çarpımıdır.", "ses": "b05"}, {"no": 6, "on": "<p>Kenar uzunlukları <span class=\"txz\">8k</span> cm ve <span class=\"txz\">5k</span> cm olan dikdörtgen biçimindeki bir akıllı tahta ekranında, kenar uzunlukları <span class=\"txz\">(2k + 4)</span> cm ve <span class=\"txz\">(k + 6)</span> cm olan dikdörtgen bir pencere açılmıştır.</p>", "g": "<svg viewBox=\"0 0 360.0 218.40000000000003\" width=\"360\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"87.2\" y=\"42.8\" width=\"212.5\" height=\"132.8\" fill=\"#eef3fb\" stroke=\"#111111\" stroke-width=\"1.6\"/><rect x=\"113.8\" y=\"69.4\" width=\"88.5\" height=\"79.7\" fill=\"#fff\" stroke=\"#1c6fbf\" stroke-width=\"1.6\"/><text stroke=\"#fff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\" x=\"158.0\" y=\"115.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">pencere</text><line x1=\"87.2\" y1=\"194.0\" x2=\"299.7\" y2=\"194.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"87.2\" y1=\"189.0\" x2=\"87.2\" y2=\"199.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"299.7\" y1=\"189.0\" x2=\"299.7\" y2=\"199.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><rect x=\"181.5\" y=\"184.1\" width=\"23.9\" height=\"19.8\" fill=\"#fff\" stroke=\"#fff\" stroke-width=\"0\"/><text x=\"193.4\" y=\"199.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">8k</text><line x1=\"318.1\" y1=\"42.8\" x2=\"318.1\" y2=\"175.6\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"313.1\" y1=\"42.8\" x2=\"323.1\" y2=\"42.8\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"313.1\" y1=\"175.6\" x2=\"323.1\" y2=\"175.6\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><text x=\"325.1\" y=\"115.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"start\">5k</text><line x1=\"113.8\" y1=\"51.0\" x2=\"202.3\" y2=\"51.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"113.8\" y1=\"46.0\" x2=\"113.8\" y2=\"56.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"202.3\" y1=\"46.0\" x2=\"202.3\" y2=\"56.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><rect x=\"128.1\" y=\"41.0\" width=\"59.8\" height=\"19.8\" fill=\"#fff\" stroke=\"#fff\" stroke-width=\"0\"/><text x=\"158.0\" y=\"56.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">2k + 4</text><line x1=\"95.4\" y1=\"69.4\" x2=\"95.4\" y2=\"149.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"90.4\" y1=\"69.4\" x2=\"100.4\" y2=\"69.4\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"90.4\" y1=\"149.0\" x2=\"100.4\" y2=\"149.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><text x=\"88.4\" y=\"115.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">k + 6</text></svg>", "son": "<p>Pencere tamamen ekranın içindedir.</p>", "k": "Buna göre, ekranın pencere dışında kalan bölümünün alanı kaç santimetrekaredir?", "sec": ["<span class=\"txz\">38k<sup>2</sup> − 16k − 24</span>", "<span class=\"txz\">38k<sup>2</sup> − 24</span>", "<span class=\"txz\">38k<sup>2</sup> + 16k + 24</span>", "<span class=\"txz\">42k<sup>2</sup> + 16k + 24</span>"], "secg": null, "c": "A", "a": ["Ekranın alanı <span class=\"txz\">8k · 5k = 40k<sup>2</sup></span> cm<sup>2</sup>'dir.", "Pencerenin alanı <span class=\"txz\">(2k + 4)(k + 6) = 2k<sup>2</sup> + 12k + 4k + 24 = 2k<sup>2</sup> + 16k + 24</span> cm<sup>2</sup>'dir.", "Kalan <span class=\"txz\">40k<sup>2</sup> − 2k<sup>2</sup> − 16k − 24 = 38k<sup>2</sup> − 16k − 24</span>."], "t": "<span class=\"txz\">38k<sup>2</sup> − 24</span>: pencerenin ortadaki çarpımları unutulmuş; <span class=\"txz\">38k<sup>2</sup> + 16k + 24</span>: eksi yalnız ilk terime uygulanmış; <span class=\"txz\">42k<sup>2</sup> + 16k + 24</span>: alanlar toplanmış", "d": "Pencerenin alanını <span class=\"txz\">(2k + 4)(k + 6)</span> çarpımıyla bulup ekranın alanından çıkarırken eksi işaretini pencerenin bütün terimlerine uygulayın.", "ses": "b06"}, {"no": 7, "on": "<p>Bir tren hattı üzerindeki A, B, C ve D istasyonları sırasıyla aşağıdaki gibidir. A ile B arası <span class=\"txz\">(2k + 3)</span> km'dir. B ile C arası, A ile B arasının 2 katından 4 km eksiktir. C ile D arası <span class=\"txz\">(k + 7)</span> km'dir.</p>", "g": "<svg viewBox=\"0 0 420 64\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"20.0\" y1=\"30.0\" x2=\"400.0\" y2=\"30.0\" stroke=\"#111111\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"14.0\" y=\"24.0\" width=\"12.0\" height=\"12.0\" fill=\"#fff\" stroke=\"#1c6fbf\" stroke-width=\"2\"/><text x=\"20.0\" y=\"56.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">A</text><rect x=\"104.0\" y=\"24.0\" width=\"12.0\" height=\"12.0\" fill=\"#fff\" stroke=\"#1c6fbf\" stroke-width=\"2\"/><text x=\"110.0\" y=\"56.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">B</text><rect x=\"294.0\" y=\"24.0\" width=\"12.0\" height=\"12.0\" fill=\"#fff\" stroke=\"#1c6fbf\" stroke-width=\"2\"/><text x=\"300.0\" y=\"56.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">C</text><rect x=\"394.0\" y=\"24.0\" width=\"12.0\" height=\"12.0\" fill=\"#fff\" stroke=\"#1c6fbf\" stroke-width=\"2\"/><text x=\"400.0\" y=\"56.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">D</text></svg>", "son": "<p>Şekildeki uzaklıklar ölçekli değildir.</p>", "k": "Buna göre, A ile D istasyonları arasındaki uzaklık kaç kilometredir?", "sec": ["<span class=\"txz\">7k + 16</span>", "<span class=\"txz\">5k + 6</span>", "<span class=\"txz\">7k + 12</span>", "<span class=\"txz\">7k + 8</span>"], "secg": null, "c": "C", "a": ["B ile C arası <span class=\"txz\">2(2k + 3) − 4 = 4k + 2</span> km'dir.", "A ile D arası <span class=\"txz\">(2k + 3) + (4k + 2) + (k + 7) = 7k + 12</span> km."], "t": "<span class=\"txz\">7k + 16</span>: 4 km eksik yerine fazla alınmış; <span class=\"txz\">5k + 6</span>: B–C arası <span class=\"txz\">2k − 1</span> sanılmış; <span class=\"txz\">7k + 8</span>: 3 iki ile çarpılmamış", "d": "“2 katından 4 km eksik”: önce <span class=\"txz\">(2k + 3)</span> iki ile çarpılır, sonra 4 çıkarılır. Sabit terimi de iki ile çarpmayı unutmayın.", "ses": "b07"}, {"no": 8, "on": "<p>Kenar uzunlukları <span class=\"txz\">3n</span> m ve <span class=\"txz\">(n + 4)</span> m olan dikdörtgen biçimindeki bir havuzun çevresine, her yerde 2 m genişliğinde olan bir yürüme yolu yapılmıştır.</p>", "g": "<svg viewBox=\"0 0 330.0 282.5846153846154\" width=\"330\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"10.0\" y=\"42.8\" width=\"232.8\" height=\"197.0\" fill=\"#f6ead2\" stroke=\"#8a5a00\" stroke-width=\"1.6\"/><rect x=\"45.8\" y=\"78.6\" width=\"161.2\" height=\"125.4\" fill=\"#d3eef2\" stroke=\"#0b7285\" stroke-width=\"1.6\"/><text stroke=\"#fff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\" x=\"126.4\" y=\"147.1\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">havuz</text><line x1=\"45.8\" y1=\"222.4\" x2=\"207.0\" y2=\"222.4\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"45.8\" y1=\"217.4\" x2=\"45.8\" y2=\"227.4\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"207.0\" y1=\"217.4\" x2=\"207.0\" y2=\"227.4\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><rect x=\"114.4\" y=\"212.4\" width=\"23.9\" height=\"19.8\" fill=\"#fff\" stroke=\"#fff\" stroke-width=\"0\"/><text x=\"126.4\" y=\"228.1\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">3n</text><line x1=\"225.4\" y1=\"78.6\" x2=\"225.4\" y2=\"204.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"220.4\" y1=\"78.6\" x2=\"230.4\" y2=\"78.6\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"220.4\" y1=\"204.0\" x2=\"230.4\" y2=\"204.0\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><text x=\"232.4\" y=\"147.1\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"start\">n + 4</text><line x1=\"10.0\" y1=\"24.4\" x2=\"45.8\" y2=\"24.4\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"10.0\" y1=\"19.4\" x2=\"10.0\" y2=\"29.4\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><line x1=\"45.8\" y1=\"19.4\" x2=\"45.8\" y2=\"29.4\" stroke=\"#333333\" stroke-width=\"1.1\" stroke-linecap=\"round\"/><rect x=\"20.4\" y=\"14.5\" width=\"15.0\" height=\"19.8\" fill=\"#fff\" stroke=\"#fff\" stroke-width=\"0\"/><text x=\"27.9\" y=\"30.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">2</text></svg>", "son": "<p>Yürüme yolunun dış kenarları havuzun kenarlarına paraleldir.</p>", "k": "Buna göre, yürüme yolunun alanı kaç metrekaredir?", "sec": ["<span class=\"txz\">16n + 16</span>", "<span class=\"txz\">16n + 32</span>", "<span class=\"txz\">8n + 16</span>", "<span class=\"txz\">3n<sup>2</sup> + 28n + 32</span>"], "secg": null, "c": "B", "a": ["Dış dikdörtgenin kenarları <span class=\"txz\">3n + 4</span> ve <span class=\"txz\">n + 8</span> m'dir; alanı <span class=\"txz\">(3n + 4)(n + 8) = 3n<sup>2</sup> + 28n + 32</span> m<sup>2</sup>.", "Havuz <span class=\"txz\">3n(n + 4) = 3n<sup>2</sup> + 12n</span> <span class=\"txz\">m<sup>2</sup></span>'dir.", "Yol <span class=\"txz\">3n<sup>2</sup> + 28n + 32 − 3n<sup>2</sup> − 12n = 16n + 32</span> m<sup>2</sup>."], "t": "<span class=\"txz\">16n + 16</span>: köşelerdeki karelerin her biri bir kez eksik sayılmış; <span class=\"txz\">8n + 16</span>: kenarlar yalnız bir yandan uzatılmış; <span class=\"txz\">3n<sup>2</sup> + 28n + 32</span>: havuz çıkarılmamış", "d": "Yol havuzun her yanındadır; dış dikdörtgenin her kenarı 2 + 2 = 4 m uzar. Yolun alanı dış dikdörtgen ile havuzun alanlarının farkıdır.", "ses": "b08"}, {"no": 9, "on": "<p>Bir markette peynirin kilogramı <span class=\"txz\">(p + 40)</span> TL, zeytinin kilogramı <span class=\"txz\">(p − 10)</span> TL'dir. Can bu marketten 2 kg peynir ve 3 kg zeytin almış, kasaya 500 TL vermiştir.</p>", "g": "<div style=\"display:flex;flex-direction:column;align-items:center\"><p style=\"text-align:center;margin:0 0 1mm;font-size:10.6pt\"><b>Tablo:</b> Can'ın Alışverişi</p><table style=\"border-collapse:collapse;font-size:10.6pt\"><thead><tr><th style=\"border:.3mm solid #0b7285;background:#d3eef2;padding:1.1mm 2.6mm;font-weight:700\">Ürün</th><th style=\"border:.3mm solid #0b7285;background:#d3eef2;padding:1.1mm 2.6mm;font-weight:700\">Kilogram fiyatı</th><th style=\"border:.3mm solid #0b7285;background:#d3eef2;padding:1.1mm 2.6mm;font-weight:700\">Alınan</th></tr></thead><tbody><tr><td style=\"border:.3mm solid #0b7285;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">Peynir</td><td style=\"border:.3mm solid #0b7285;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\"><span class=\"txz\">(p + 40)</span> TL</td><td style=\"border:.3mm solid #0b7285;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">2 kg</td></tr><tr><td style=\"border:.3mm solid #0b7285;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">Zeytin</td><td style=\"border:.3mm solid #0b7285;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\"><span class=\"txz\">(p − 10)</span> TL</td><td style=\"border:.3mm solid #0b7285;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">3 kg</td></tr></tbody></table></div>", "son": "", "k": "Buna göre, Can'ın aldığı para üstünü TL cinsinden veren cebirsel ifade aşağıdakilerden hangisidir?", "sec": ["<span class=\"txz\">550 − 5p</span>", "<span class=\"txz\">5p + 50</span>", "<span class=\"txz\">450 − 5p</span>", "<span class=\"txz\">450 + 5p</span>"], "secg": null, "c": "C", "a": ["Peynir <span class=\"txz\">2(p + 40) = 2p + 80</span>, zeytin <span class=\"txz\">3(p − 10) = 3p − 30</span> TL'dir; toplam <span class=\"txz\">5p + 50</span> TL.", "Para üstü <span class=\"txz\">500 − (5p + 50) = 450 − 5p</span> TL."], "t": "<span class=\"txz\">550 − 5p</span>: −30 eklenmiş; <span class=\"txz\">5p + 50</span>: ödenen tutar; <span class=\"txz\">450 + 5p</span>: parantezin önündeki eksi <span class=\"txz\">5p</span>'ye uygulanmamış", "d": "Önce ödenen tutarı <span class=\"txz\">(5p + 50)</span> bulun; para üstü 500'den bu tutarın tamamı çıkarılarak bulunur, eksi işareti iki terime de uygulanır.", "ses": "b09"}, {"no": 10, "on": "<p>Bir gazetenin köşe yazısı sütununda <span class=\"txz\">(s + 6)</span> satır vardır. İlk satır dışındaki her satırda <span class=\"txz\">(2s + 3)</span> harf bulunmaktadır; ilk satırda ise bu sayıdan 4 harf eksiktir.</p>", "g": "<div style=\"display:flex;justify-content:center\"><div style=\"border:.45mm solid #6d3fc0;border-radius:3mm;background:#fff;padding:2mm 3.2mm;font-size:10.6pt;text-align:left\"><div style=\"font-weight:800;color:#6d3fc0;margin-bottom:.8mm\">Köşe yazısı</div><div style=\"margin:.4mm 0\">Satır sayısı: <span class=\"txz\">(s + 6)</span></div><div style=\"margin:.4mm 0\">Bir satırdaki harf: <span class=\"txz\">(2s + 3)</span></div><div style=\"margin:.4mm 0\">İlk satır: 4 harf eksik</div></div></div>", "son": "", "k": "Buna göre, sütundaki harflerin toplam sayısını veren cebirsel ifade aşağıdakilerden hangisidir?", "sec": ["<span class=\"txz\">2s<sup>2</sup> + 15s + 14</span>", "<span class=\"txz\">2s<sup>2</sup> + 15s + 18</span>", "<span class=\"txz\">2s<sup>2</sup> + 14</span>", "<span class=\"txz\">2s<sup>2</sup> + 9s + 14</span>"], "secg": null, "c": "A", "a": ["Bütün satırlar dolu olsaydı <span class=\"txz\">(s + 6)(2s + 3) = 2s<sup>2</sup> + 3s + 12s + 18 = 2s<sup>2</sup> + 15s + 18</span> harf olurdu.", "İlk satırda 4 harf eksiktir: <span class=\"txz\">2s<sup>2</sup> + 15s + 14</span>."], "t": "<span class=\"txz\">2s<sup>2</sup> + 15s + 18</span>: eksik harfler çıkarılmamış; <span class=\"txz\">2s<sup>2</sup> + 14</span>: ortadaki çarpımlar unutulmuş; <span class=\"txz\">2s<sup>2</sup> + 9s + 14</span>: <span class=\"txz\">12s − 3s</span> alınmış", "d": "Bütün satırlar dolu olsaydı harf sayısı <span class=\"txz\">(s + 6)(2s + 3)</span> olurdu; ilk satırdaki 4 eksik harfi sonra çıkarın.", "ses": "b10"}, {"no": 11, "on": "<p>Bir hediye kutusunun ayrıtlarının uzunlukları a cm, <span class=\"txz\">(a + 4)</span> cm ve <span class=\"txz\">2a</span> cm'dir. Kutu, aşağıdaki gibi bir kurdeleyle iki yönde birer kez sarılmıştır. Kurdele kutunun yüzeylerine tam olarak yapışmakta ve fiyonk için ayrıca 30 cm kullanılmaktadır.</p>", "g": "<svg viewBox=\"0 0 260 150\" width=\"260\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"30.0,60.0 170.0,60.0 170.0,130.0 30.0,130.0\" fill=\"#f6ead2\" stroke=\"#8a5a00\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"30.0,60.0 90.0,25.0 230.0,25.0 170.0,60.0\" fill=\"#fbf1dc\" stroke=\"#8a5a00\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"170.0,60.0 230.0,25.0 230.0,95.0 170.0,130.0\" fill=\"#f3e3c2\" stroke=\"#8a5a00\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"96.0,60.0 104.0,60.0 104.0,130.0 96.0,130.0\" fill=\"#e6dcf7\" stroke=\"#6d3fc0\" stroke-width=\"1.2\" stroke-linejoin=\"round\"/><polygon points=\"96.0,60.0 156.0,25.0 164.0,25.0 104.0,60.0\" fill=\"#e6dcf7\" stroke=\"#6d3fc0\" stroke-width=\"1.2\" stroke-linejoin=\"round\"/><polygon points=\"60.0,42.5 200.0,42.5 196.0,45.0 56.0,45.0\" fill=\"#e6dcf7\" stroke=\"#6d3fc0\" stroke-width=\"1.2\" stroke-linejoin=\"round\"/><polygon points=\"170.0,95.0 230.0,60.0 230.0,64.0 170.0,99.0\" fill=\"#e6dcf7\" stroke=\"#6d3fc0\" stroke-width=\"1.2\" stroke-linejoin=\"round\"/><text x=\"100.0\" y=\"146.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">a + 4</text><text x=\"16.0\" y=\"100.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">a</text><text x=\"214.0\" y=\"120.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">2a</text></svg>", "son": "<p>Bir yönde sarılan kurdele kutunun a ve <span class=\"txz\">2a</span> ayrıtlarına, öbür yönde sarılan kurdele <span class=\"txz\">(a + 4)</span> ve <span class=\"txz\">2a</span> ayrıtlarına paralel yüzeylerden geçer.</p>", "k": "Buna göre, kullanılan kurdelenin uzunluğu kaç santimetredir?", "sec": ["<span class=\"txz\">12a + 46</span>", "<span class=\"txz\">12a + 38</span>", "<span class=\"txz\">8a + 38</span>", "<span class=\"txz\">6a + 34</span>"], "secg": null, "c": "B", "a": ["Birinci yönde kurdele <span class=\"txz\">2(a + 2a) = 6a</span> cm'dir.", "İkinci yönde kurdele <span class=\"txz\">2((a + 4) + 2a) = 6a + 8</span> cm'dir.", "Fiyonkla birlikte <span class=\"txz\">6a + 6a + 8 + 30 = 12a + 38</span> cm."], "t": "<span class=\"txz\">12a + 46</span>: 8 iki kez eklenmiş; <span class=\"txz\">8a + 38</span>: <span class=\"txz\">2a</span> ayrıtı bir yönde unutulmuş; <span class=\"txz\">6a + 34</span>: kurdeleler kutunun yalnız yarısını dolaşmış", "d": "Kurdele her yönde kutunun iki yüzünü ve iki yan yüzünü dolanır: 2(birinci ayrıt + ikinci ayrıt). Fiyonk payı ayrıca eklenir.", "ses": "b11"}, {"no": 12, "on": "<p>Bir manav, her biri <span class=\"txz\">(2t − 1)</span> kg domates bulunan kasaların tanesini <span class=\"txz\">3t</span> TL'den <span class=\"txz\">(t + 6)</span> kasa almıştır. Kasalardan 2'sindeki domatesler bozulmuş ve atılmıştır. Manav kalan domateslerin hepsini kilogramı 8 TL'den satmıştır.</p>", "g": "<div style=\"display:flex;flex-direction:column;align-items:center\"><p style=\"text-align:center;margin:0 0 1mm;font-size:10.6pt\"><b>Tablo:</b> Manavın Domatesleri</p><table style=\"border-collapse:collapse;font-size:10.6pt\"><thead><tr><th style=\"border:.3mm solid #d9480f;background:#ffe3d1;padding:1.1mm 2.6mm;font-weight:700\">Alınan kasa</th><th style=\"border:.3mm solid #d9480f;background:#ffe3d1;padding:1.1mm 2.6mm;font-weight:700\">Bir kasadaki domates</th><th style=\"border:.3mm solid #d9480f;background:#ffe3d1;padding:1.1mm 2.6mm;font-weight:700\">Kasanın alış fiyatı</th><th style=\"border:.3mm solid #d9480f;background:#ffe3d1;padding:1.1mm 2.6mm;font-weight:700\">Satış fiyatı</th></tr></thead><tbody><tr><td style=\"border:.3mm solid #d9480f;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\"><span class=\"txz\">(t + 6)</span></td><td style=\"border:.3mm solid #d9480f;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\"><span class=\"txz\">(2t − 1)</span> kg</td><td style=\"border:.3mm solid #d9480f;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">3t TL</td><td style=\"border:.3mm solid #d9480f;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">Kilogramı 8 TL</td></tr></tbody></table></div>", "son": "", "k": "Buna göre, manavın bu satıştan elde ettiği kârı TL cinsinden veren cebirsel ifade aşağıdakilerden hangisidir?", "sec": ["<span class=\"txz\">13t<sup>2</sup> + 54t − 48</span>", "<span class=\"txz\">16t<sup>2</sup> + 56t − 32</span>", "<span class=\"txz\">13t<sup>2</sup> + 38t + 32</span>", "<span class=\"txz\">13t<sup>2</sup> + 38t − 32</span>"], "secg": null, "c": "D", "a": ["Satılan kasa sayısı <span class=\"txz\">t + 4</span>'tür; satılan domates <span class=\"txz\">(t + 4)(2t − 1) = 2t<sup>2</sup> + 7t − 4</span> kg'dır.", "Gelir <span class=\"txz\">8(2t<sup>2</sup> + 7t − 4) = 16t<sup>2</sup> + 56t − 32</span> TL'dir.", "Maliyet <span class=\"txz\">3t(t + 6) = 3t<sup>2</sup> + 18t</span> TL'dir.", "Kâr <span class=\"txz\">16t<sup>2</sup> + 56t − 32 − 3t<sup>2</sup> − 18t = 13t<sup>2</sup> + 38t − 32</span> TL."], "t": "<span class=\"txz\">13t<sup>2</sup> + 54t − 48</span>: bozulan kasalar çıkarılmamış; <span class=\"txz\">16t<sup>2</sup> + 56t − 32</span>: gelir; <span class=\"txz\">13t<sup>2</sup> + 38t + 32</span>: −32'nin işareti değişmiş", "d": "Bozulan 2 kasa satılmaz ama parası ödenmiştir: gelirde <span class=\"txz\">(t + 4)</span> kasa, maliyette <span class=\"txz\">(t + 6)</span> kasa kullanılır.", "ses": "b12"}, {"no": 13, "on": "<p>Ali'nin oturduğu apartmanda her katın merdiveninde <span class=\"txz\">(2h + 1)</span> basamak, Ece'nin oturduğu apartmanda her katın merdiveninde <span class=\"txz\">(h + 3)</span> basamak vardır. Ali zemin kattan 4. kattaki evine, Ece 2. kattan 7. kattaki arkadaşının evine merdivenle çıkmıştır (h &gt; 5).</p>", "g": "<div style=\"display:flex;flex-direction:column;align-items:center\"><p style=\"text-align:center;margin:0 0 1mm;font-size:10.6pt\"><b>Tablo:</b> Merdivenle Çıkılan Katlar</p><table style=\"border-collapse:collapse;font-size:10.6pt\"><thead><tr><th style=\"border:.3mm solid #1c6fbf;background:#d6e6f8;padding:1.1mm 2.6mm;font-weight:700\"></th><th style=\"border:.3mm solid #1c6fbf;background:#d6e6f8;padding:1.1mm 2.6mm;font-weight:700\">Basamak (bir kat)</th><th style=\"border:.3mm solid #1c6fbf;background:#d6e6f8;padding:1.1mm 2.6mm;font-weight:700\">Başladığı kat</th><th style=\"border:.3mm solid #1c6fbf;background:#d6e6f8;padding:1.1mm 2.6mm;font-weight:700\">Çıktığı kat</th></tr></thead><tbody><tr><td style=\"border:.3mm solid #1c6fbf;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">Ali</td><td style=\"border:.3mm solid #1c6fbf;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\"><span class=\"txz\">(2h + 1)</span></td><td style=\"border:.3mm solid #1c6fbf;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">Zemin</td><td style=\"border:.3mm solid #1c6fbf;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">4. kat</td></tr><tr><td style=\"border:.3mm solid #1c6fbf;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">Ece</td><td style=\"border:.3mm solid #1c6fbf;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\"><span class=\"txz\">(h + 3)</span></td><td style=\"border:.3mm solid #1c6fbf;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">2. kat</td><td style=\"border:.3mm solid #1c6fbf;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">7. kat</td></tr></tbody></table></div>", "son": "", "k": "Buna göre, Ali'nin çıktığı basamak sayısı Ece'nin çıktığı basamak sayısından kaç fazladır?", "sec": ["<span class=\"txz\">3h − 11</span>", "<span class=\"txz\">3h + 19</span>", "<span class=\"txz\">13h + 19</span>", "<span class=\"txz\">3h − 1</span>"], "secg": null, "c": "A", "a": ["Ali 4 kat çıkmıştır: <span class=\"txz\">4(2h + 1) = 8h + 4</span> basamak.", "Ece 7 − 2 = 5 kat çıkmıştır: <span class=\"txz\">5(h + 3) = 5h + 15</span> basamak.", "Fark <span class=\"txz\">8h + 4 − 5h − 15 = 3h − 11</span>."], "t": "<span class=\"txz\">3h + 19</span>: −15 yerine +15 alınmış; <span class=\"txz\">13h + 19</span>: basamaklar toplanmış; <span class=\"txz\">3h − 1</span>: Ece 7 kat çıkmış sayılmış ve sabit terimler karışmış", "d": "Ece 2. kattan 7. kata çıkmıştır: 7 değil 5 kat. Ali zemin kattan 4. kata 4 kat çıkmıştır.", "ses": "b13"}, {"no": 14, "on": "<p>Bir stadyumun A tribünü 4, B tribünü 3 eş bloktan oluşmaktadır. Her blokta <span class=\"txz\">(r + 4)</span> sıra vardır. A tribününün bloklarında her sırada <span class=\"txz\">(2r − 3)</span> koltuk vardır; B tribününün bloklarında her sırada bundan 5 koltuk fazladır.</p>", "g": "<div style=\"display:flex;flex-direction:column;align-items:center\"><p style=\"text-align:center;margin:0 0 1mm;font-size:10.6pt\"><b>Tablo:</b> Tribünler</p><table style=\"border-collapse:collapse;font-size:10.6pt\"><thead><tr><th style=\"border:.3mm solid #9b1c36;background:#fbeef0;padding:1.1mm 2.6mm;font-weight:700\">Tribün</th><th style=\"border:.3mm solid #9b1c36;background:#fbeef0;padding:1.1mm 2.6mm;font-weight:700\">Blok sayısı</th><th style=\"border:.3mm solid #9b1c36;background:#fbeef0;padding:1.1mm 2.6mm;font-weight:700\">Bir bloktaki sıra</th><th style=\"border:.3mm solid #9b1c36;background:#fbeef0;padding:1.1mm 2.6mm;font-weight:700\">Bir sıradaki koltuk</th></tr></thead><tbody><tr><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">A</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">4</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\"><span class=\"txz\">(r + 4)</span></td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\"><span class=\"txz\">(2r − 3)</span></td></tr><tr><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">B</td><td styl
