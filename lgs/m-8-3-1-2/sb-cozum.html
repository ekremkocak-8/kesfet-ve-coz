<script>
const V={"baslik": "Üçgen Eşitsizliği ve Kenar–Açı İlişkisi · Soru Bankası", "kod": "LGS · M.8.3.1.2–3 · SORU BANKASI", "ses": "", "bet": "YENİ NESİL SORU", "bad": "Yeni Nesil Sorular", "s": [], "k": [], "b": [{"no": 1, "on": "<p>Can'ın oyuncak yapım setinde uzunlukları 4 cm, 7 cm, 9 cm, 10 cm ve 15 cm olan birer çubuk vardır. Can üç çubuğu uçlarından birleştirerek üçgen biçiminde çerçeveler yapmaktadır.</p>", "g": "<svg viewBox=\"0 0 233.5 170.4\" width=\"234\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"Liberation Sans, Arial, sans-serif\"><g transform=\"translate(8.0 15.7)\"><rect x=\"0.0\" y=\"-5.0\" width=\"44.0\" height=\"10\" rx=\"5.0\" fill=\"#f6ead2\" stroke=\"#8a5a00\" stroke-width=\"1.8\"/><text x=\"52.0\" y=\"5.4\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">4 cm</text><rect x=\"0.0\" y=\"29.0\" width=\"77.0\" height=\"10\" rx=\"5.0\" fill=\"#e7f1fb\" stroke=\"#1c6fb8\" stroke-width=\"1.8\"/><text x=\"85.0\" y=\"39.4\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">7 cm</text><rect x=\"0.0\" y=\"63.0\" width=\"99.0\" height=\"10\" rx=\"5.0\" fill=\"#f1edfd\" stroke=\"#6741d9\" stroke-width=\"1.8\"/><text x=\"107.0\" y=\"73.4\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">9 cm</text><rect x=\"0.0\" y=\"97.0\" width=\"110.0\" height=\"10\" rx=\"5.0\" fill=\"#e3f4f6\" stroke=\"#0b7285\" stroke-width=\"1.8\"/><text x=\"118.0\" y=\"107.4\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">10 cm</text><rect x=\"0.0\" y=\"131.0\" width=\"165.0\" height=\"10\" rx=\"5.0\" fill=\"#fff0e6\" stroke=\"#d9480f\" stroke-width=\"1.8\"/><text x=\"173.0\" y=\"141.4\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">15 cm</text></g></svg>", "son": "", "k": "Buna göre, Can aşağıdaki çubuk üçlülerinden hangisiyle bir çerçeve yapamaz?", "sec": ["4 cm, 7 cm, 10 cm", "7 cm, 9 cm, 15 cm", "4 cm, 9 cm, 15 cm", "9 cm, 10 cm, 15 cm"], "secg": null, "c": "C", "a": ["En uzun çubuk öbür iki çubuğun toplamından kısa olmalıdır.", "4 + 9 = 13 &lt; 15: uçlar buluşmaz.", "Öbür üçlülerde 11 &gt; 10, 16 &gt; 15, 19 &gt; 15. (Öbür seçenekler üçgen oluşturur)"], "t": "", "d": "Toplamı en uzun çubuktan büyük mü diye bakın; yalnız en uzun çubuğu denetlemek yeter.", "ses": "b01"}, {"no": 2, "on": "<p>Bir bisikletin kadrosundaki üç boru bir üçgen oluşturmaktadır. Borulardan ikisinin uzunlukları 55 cm ve 60 cm'dir.</p>", "g": "<svg viewBox=\"0 0 176.5 170.2\" width=\"176\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"Liberation Sans, Arial, sans-serif\"><g transform=\"translate(33.7 138.0)\"><polygon points=\"48.6,-130.0 0.0,0.0 126.2,0.0\" fill=\"#e7f1fb\" stroke=\"#111111\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><text x=\"-2.5\" y=\"-69.6\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">55 cm</text><text x=\"111.5\" y=\"-74.0\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">60 cm</text><text x=\"63.1\" y=\"18.9\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">?</text></g></svg>", "son": "", "k": "Buna göre, üçüncü borunun uzunluğu kaç santimetre olabilir?", "sec": ["50", "5", "115", "120"], "secg": null, "c": "A", "a": ["Üçüncü boru x ise 60 − 55 &lt; x &lt; 60 + 55, yani 5 &lt; x &lt; 115.", "Seçeneklerden yalnız 50 bu aralıktadır. (5 ve 115: uç değerler, borular düz bir çizgi olurdu; 120: toplamdan uzun)"], "t": "", "d": "Üçüncü boru, iki borunun farkından uzun, toplamından kısa olmalıdır; uç değerler alınmaz.", "ses": "b02"}, {"no": 3, "on": "<p>Bir yelkenlinin üçgen biçimindeki yelkeninin köşeleri D (direğin tepesi), E (direğin dibi) ve F (bumbanın ucu) ile gösterilmiştir. Yelkenin köşelerindeki açıların ölçüleri aşağıda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 143.4 233.1\" width=\"143\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"Liberation Sans, Arial, sans-serif\"><g transform=\"translate(23.5 201.0)\"><polygon points=\"14.9,-170.0 0.0,0.0 94.1,0.0\" fill=\"#e7f1fb\" stroke=\"#111111\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><path d=\"M12.3 -140.1 A30.0 30.0 0 0 0 27.6 -142.8\" fill=\"none\" stroke=\"#111111\" stroke-width=\"1.5\"/><text x=\"25.7\" y=\"-103.0\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">30°</text><path d=\"M18.0 0.0 A18.0 18.0 0 0 0 1.6 -17.9\" fill=\"none\" stroke=\"#111111\" stroke-width=\"1.5\"/><text x=\"26.2\" y=\"-18.6\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">85°</text><path d=\"M86.5 -16.3 A18.0 18.0 0 0 0 76.1 -0.0\" fill=\"none\" stroke=\"#111111\" stroke-width=\"1.5\"/><text x=\"64.2\" y=\"-13.7\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">65°</text><text x=\"12.0\" y=\"-179.2\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">D</text><text x=\"-8.2\" y=\"18.6\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">E</text><text x=\"105.0\" y=\"16.4\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">F</text></g></svg>", "son": "", "k": "Buna göre, yelkenin en uzun kenarı hangisidir?", "sec": ["<span class=\"nw\">[DE]</span>", "<span class=\"nw\">[EF]</span>", "Belirlenemez", "<span class=\"nw\">[DF]</span>"], "secg": null, "c": "D", "a": ["En büyük açı <span class=\"nw\">m(Ê)</span> = 85°'dir.", "En büyük açının karşısındaki kenar en uzundur: <span class=\"nw\">[DF]</span>. (<span class=\"nw\">[DE]</span>: 65°'nin karşısı; <span class=\"nw\">[EF]</span>: en küçük açının karşısı, en kısa kenar; belirlenemez: açılar sıralamaya yeter)"], "t": "", "d": "Önce en büyük açıyı bulun; en uzun kenar o açının köşesine dokunmayan kenardır.", "ses": "b03"}, {"no": 4, "on": "<p>Bir okulun bahçesinde köşeleri K, L ve M bayraklarıyla işaretlenmiş üçgen biçiminde bir koşu parkuru vardır. Bayraklar arasındaki uzaklıklar aşağıdaki tabloda verilmiştir.</p>", "g": "<div style=\"display:flex;flex-direction:column;align-items:center\"><p style=\"text-align:center;margin:0 0 1mm;font-size:10.6pt\"><b>Tablo:</b> Parkurun Kenarları</p><table style=\"border-collapse:collapse;font-size:10.6pt\"><thead><tr><th style=\"border:.3mm solid #9b1c36;background:#fbeef0;padding:1.1mm 2.6mm;font-weight:700\">Parkur kenarı</th><th style=\"border:.3mm solid #9b1c36;background:#fbeef0;padding:1.1mm 2.6mm;font-weight:700\">K – L</th><th style=\"border:.3mm solid #9b1c36;background:#fbeef0;padding:1.1mm 2.6mm;font-weight:700\">L – M</th><th style=\"border:.3mm solid #9b1c36;background:#fbeef0;padding:1.1mm 2.6mm;font-weight:700\">M – K</th></tr></thead><tbody><tr><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:left;white-space:nowrap\">Uzunluk (m)</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">120</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">150</td><td style=\"border:.3mm solid #9b1c36;padding:1.1mm 2.6mm;text-align:center;white-space:nowrap\">135</td></tr></tbody></table></div>", "son": "", "k": "Buna göre, parkurun en büyük açısı hangi bayrağın bulunduğu köşededir?", "sec": ["L", "K", "M", "Belirlenemez"], "secg": null, "c": "B", "a": ["En uzun kenar L – M (150 m) kenarıdır.", "En büyük açı en uzun kenarın karşısındaki köşededir: K bayrağı. (L ve M: en uzun kenarın uçlarındaki bayraklar; belirlenemez: üç kenar bilinmektedir)"], "t": "", "d": "Tablodaki en uzun kenarın uçlarındaki bayraklar değil, karşısındaki bayrak aranır.", "ses": "b04"}, {"no": 5, "on": "<p>Ahmet Bey bahçesindeki üç ağaç arasına üçgen biçiminde bir çit yapacaktır. 1. ağaç ile 2. ağaç arası 8 m, 2. ağaç ile 3. ağaç arası 12 m'dir. Ağaçlar aynı doğru üzerinde değildir.</p>", "g": "<svg viewBox=\"0 0 392.6 213.3\" width=\"393\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"Liberation Sans, Arial, sans-serif\"><g transform=\"translate(75.9 177.2)\"><line x1=\"90.0\" y1=\"-132.3\" x2=\"0.0\" y2=\"0.0\" stroke=\"#0b7285\" stroke-width=\"3.4\" stroke-linecap=\"round\"/><line x1=\"0.0\" y1=\"0.0\" x2=\"240.0\" y2=\"0.0\" stroke=\"#0b7285\" stroke-width=\"3.4\" stroke-linecap=\"round\"/><line x1=\"240.0\" y1=\"0.0\" x2=\"90.0\" y2=\"-132.3\" stroke=\"#6b7385\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-dasharray=\"7 5\"/><text x=\"27.7\" y=\"-72.5\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">8 m</text><text x=\"120.0\" y=\"18.9\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">12 m</text><text x=\"174.7\" y=\"-71.7\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">?</text><circle cx=\"90.0\" cy=\"-132.3\" r=\"7\" fill=\"#fff\" stroke=\"#0b7285\" stroke-width=\"3\"/><text x=\"83.8\" y=\"-154.1\" font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">1. ağaç</text><circle cx=\"0.0\" cy=\"0.0\" r=\"7\" fill=\"#fff\" stroke=\"#0b7285\" stroke-width=\"3\"/><text x=\"-38.4\" y=\"20.8\" font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">2. ağaç</text><circle cx=\"240.0\" cy=\"0.0\" r=\"7\" fill=\"#fff\" stroke=\"#0b7285\" stroke-width=\"3\"/><text x=\"279.3\" y=\"18.7\" font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">3. ağaç</text></g></svg>", "son": "<p>1. ağaç ile 3. ağaç arası metre cinsinden bir tam sayıdır.</p>", "k": "Buna göre, çitin toplam uzunluğu en az kaç metredir?", "sec": ["24", "25", "20", "39"], "secg": null, "c": "B", "a": ["4 &lt; x &lt; 20 olduğundan x en az 5 m'dir.", "Çit en az 8 + 12 + 5 = 25 m. (24: x = 4 alınmış; 20: üçüncü kenar eklenmemiş; 39: en uzun çit)"], "t": "", "d": "Çitin toplam uzunluğu sorulmaktadır; üçüncü kenarın en küçük tam sayı değerini iki kenara ekleyin.", "ses": "b05"}, {"no": 6, "on": "<p>Bir futbol sahasında kalenin iki direği arası 7 m'dir. Bir oyuncu sol direkten 11 m uzakta durmaktadır. Oyuncu ve iki direk aynı doğru üzerinde değildir.</p>", "g": "<svg viewBox=\"0 0 216.0 104.1\" width=\"216\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"Liberation Sans, Arial, sans-serif\"><g transform=\"translate(8.0 71.9)\"><polygon points=\"68.0,-63.9 0.0,0.0 200.0,0.0\" fill=\"#e7f1fb\" stroke=\"#111111\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><text x=\"20.1\" y=\"-41.4\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">7 m</text><text x=\"142.7\" y=\"-44.6\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">11 m</text><text x=\"100.0\" y=\"18.9\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">?</text></g></svg>", "son": "<p>Şekilde A sol direği, B sağ direği, C oyuncuyu göstermektedir.</p>", "k": "Buna göre, oyuncunun sağ direğe uzaklığı kaç metre olabilir?", "sec": ["4", "20", "3", "15"], "secg": null, "c": "D", "a": ["11 − 7 &lt; x &lt; 11 + 7, yani 4 &lt; x &lt; 18.", "Seçeneklerden yalnız 15 bu aralıktadır. (4: uç değer, oyuncu direklerle aynı doğruda olurdu; 20 ve 3: aralığın dışında)"], "t": "", "d": "Uzaklık 4 m ya da 18 m olsaydı oyuncu direklerle aynı doğru üzerinde olurdu.", "ses": "b06"}, {"no": 7, "on": "<p>Bir robot süpürgenin şarj istasyonu S, yemek masası M ve koltuk K noktalarındadır. S ile M arası 3,5 m, M ile K arası 2 m'dir. S, M ve K aynı doğru üzerinde değildir.</p>", "g": "<div style=\"display:flex;justify-content:center\"><div style=\"border:.45mm solid #0b7285;border-radius:3mm;background:#fff;padding:2mm 3.2mm;font-size:10.6pt;text-align:left\"><div style=\"font-weight:800;color:#0b7285;margin-bottom:.8mm\">Ev Krokisi</div><div style=\"margin:.4mm 0\">S ile M arası: 3,5 m</div><div style=\"margin:.4mm 0\">M ile K arası: 2 m</div><div style=\"margin:.4mm 0\">S ile K arası: metre cinsinden tam sayı</div></div></div>", "son": "", "k": "Buna göre, S ile K arasındaki uzaklık kaç farklı değer alabilir?", "sec": ["4", "3", "5", "6"], "secg": null, "c": "A", "a": ["3,5 − 2 &lt; x &lt; 3,5 + 2, yani 1,5 &lt; x &lt; 5,5.", "Tam sayılar 2, 3, 4, 5 → 4 değer. (3: 5 atlanmış; 5: 1 de sayılmış; 6: 1 ve 6 da sayılmış)"], "t": "", "d": "Uç değerler 1,5 ve 5,5 ondalıktır; aralıktaki tam sayıları dikkatle sayın.", "ses": "b07"}, {"no": 8, "on": "<p>Ece, Ali ve Can bir üçgenin köşelerinde durarak top oyunu oynamaktadır. Ece ile Ali arası 9 m, Ece ile Can arası 12 m'dir. Ece'nin bulunduğu köşedeki açı, üçgenin en büyük açısıdır.</p>", "g": "<svg viewBox=\"0 0 226.0 127.9\" width=\"226\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"Liberation Sans, Arial, sans-serif\"><g transform=\"translate(8.0 95.7)\"><polygon points=\"79.2,-87.7 0.0,0.0 210.0,0.0\" fill=\"#e7f1fb\" stroke=\"#111111\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><text x=\"24.3\" y=\"-52.3\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">9 m</text><text x=\"156.7\" y=\"-56.5\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">12 m</text><text x=\"105.0\" y=\"18.9\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">?</text></g></svg>", "son": "<p>Şekilde A Ece'yi, B Ali'yi, C Can'ı göstermektedir. Ali ile Can arası metre cinsinden bir tam sayıdır.</p>", "k": "Buna göre, Ali ile Can arasındaki uzaklık kaç farklı değer alabilir?", "sec": ["9", "11", "8", "7"], "secg": null, "c": "C", "a": ["En büyük açı Ece'de → karşısındaki Ali–Can kenarı en uzun: x &gt; 12.", "Üçgen eşitsizliği: 3 &lt; x &lt; 21.", "Ortak: 13, …, 20 → 8 değer. (9: 12 de sayılmış; 11: 20 − 9; 7: 20 atlanmış)"], "t": "", "d": "En büyük açı Ece'de ise karşısındaki Ali–Can kenarı 12 m'den uzun olmalıdır.", "ses": "b08"}, {"no": 9, "on": "<p>Bir belediye parkına üçgen biçiminde çiçek tarhları yapılacaktır. Her tarhın kenar uzunlukları metre cinsinden tam sayı, çevresi 11 m olacaktır.</p>", "g": "<div style=\"display:flex;justify-content:center\"><div style=\"border:.45mm solid #6741d9;border-radius:3mm;background:#fff;padding:2mm 3.2mm;font-size:10.6pt;text-align:left\"><div style=\"font-weight:800;color:#6741d9;margin-bottom:.8mm\">Tarh Planı</div><div style=\"margin:.4mm 0\">Tarhın biçimi: üçgen</div><div style=\"margin:.4mm 0\">Çevre: 11 m</div><div style=\"margin:.4mm 0\">Kenarlar: metre cinsinden tam sayı</div></div></div>", "son": "<p>Kenar uzunlukları aynı olan iki tarh aynı sayılır.</p>", "k": "Buna göre, birbirinden farklı kaç tarh yapılabilir?", "sec": ["3", "5", "6", "4"], "secg": null, "c": "D", "a": ["Her kenar yarı çevreden (5,5 m) kısa olmalıdır; en uzun kenar en fazla 5 m.", "En uzun 5: 1, 5, 5; 2, 4, 5; 3, 3, 5. En uzun 4: 3, 4, 4.", "Toplam 4 tarh. (3: 1, 5, 5 atlanmış; 5: 2, 3, 6 gibi oluşmayan bir üçlü sayılmış; 6: sıralı üçlüler ayrı sayılmış)"], "t": "", "d": "Kenarları sıralı yazın (a ≤ b ≤ c); aynı üçlüyü iki kez saymayın.", "ses": "b09"}, {"no": 10, "on": "<p>Üç köy arasına elektrik hattı çekilecektir. Köyler K, L ve M noktalarındadır ve hatlar köyleri birleştiren doğru parçaları boyunca çekilecektir. Haritada K köyündeki açı 50°, L köyündeki açı 75° olarak ölçülmüştür.</p>", "g": "<svg viewBox=\"0 0 201.6 209.8\" width=\"202\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"Liberation Sans, Arial, sans-serif\"><g transform=\"translate(26.7 180.9)\"><polygon points=\"40.2,-150.0 0.0,0.0 145.2,0.0\" fill=\"#e7f1fb\" stroke=\"#111111\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><path d=\"M35.5 -132.6 A18.0 18.0 0 0 0 50.5 -135.3\" fill=\"none\" stroke=\"#111111\" stroke-width=\"1.5\"/><text x=\"46.4\" y=\"-109.6\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">50°</text><path d=\"M18.0 0.0 A18.0 18.0 0 0 0 4.7 -17.4\" fill=\"none\" stroke=\"#111111\" stroke-width=\"1.5\"/><text x=\"28.2\" y=\"-16.2\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">75°</text><text x=\"37.0\" y=\"-159.1\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">K</text><text x=\"-11.8\" y=\"15.3\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">L</text><text x=\"158.3\" y=\"13.6\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">M</text></g></svg>", "son": "", "k": "Buna göre, en kısa hat hangi iki köy arasındadır?", "sec": ["K ile L", "L ile M", "K ile M", "Belirlenemez"], "secg": null, "c": "B", "a": ["<span class=\"nw\">m(M̂)</span> = 180° − (50° + 75°) = 55°.", "En küçük açı <span class=\"nw\">m(K̂)</span> = 50°; karşısındaki L–M hattı en kısadır. (K ile L: 55°'nin karşısı; K ile M: en büyük açının karşısı, en uzun hat; belirlenemez: açılar hesaplanabilir)"], "t": "", "d": "Önce üçüncü açıyı hesaplayın; en kısa hat en küçük açının karşısındadır.", "ses": "b10"}, {"no": 11, "on": "<p>Bir mimar, aynı çıtayı paylaşan iki üçgen pencere tasarlamıştır. Üst pencerenin öbür kenarları 30 cm ve 50 cm, alt pencerenin öbür kenarları 40 cm ve 85 cm'dir.</p>", "g": "<svg viewBox=\"0 0 289.3 241.5\" width=\"289\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"Liberation Sans, Arial, sans-serif\"><g transform=\"translate(81.9 104.6)\"><polygon points=\"49.0,-73.4 0.0,0.0 176.4,0.0\" fill=\"#e7f1fb\" stroke=\"#111111\" stroke-width=\"0\" stroke-linejoin=\"round\"/><polygon points=\"-49.6,106.6 0.0,0.0 176.4,0.0\" fill=\"#fff0e6\" stroke=\"#111111\" stroke-width=\"0\" stroke-linejoin=\"round\"/><polygon points=\"49.0,-73.4 0.0,0.0 -49.6,106.6 176.4,0.0\" fill=\"none\" stroke=\"#111111\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><line x1=\"0.0\" y1=\"0.0\" x2=\"176.4\" y2=\"0.0\" stroke=\"#111111\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><text x=\"49.9\" y=\"-82.8\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">A</text><text x=\"-14.9\" y=\"2.9\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">B</text><text x=\"-60.1\" y=\"123.4\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">C</text><text x=\"191.6\" y=\"4.8\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">D</text><text x=\"1.4\" y=\"-46.7\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">30 cm</text><text x=\"124.3\" y=\"-51.3\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">50 cm</text><text x=\"-50.6\" y=\"46.7\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">40 cm</text><text x=\"72.7\" y=\"78.5\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" stroke=\"#ffffff\" stroke-width=\"3.6\" stroke-linejoin=\"round\" paint-order=\"stroke\">85 cm</text></g></svg>", "son": "<p>Ortak çıta [BD]'dir ve uzunluğu santimetre cinsinden bir tam sayıdır.</p>", "k": "Buna göre, ortak çıtanın uzunluğu kaç farklı değer alabilir?", "sec": ["59", "33", "34", "79"], "secg": null, "c": "C", "a": ["Üst pencere: 20 &lt; x &lt; 80.", "Alt pencere: 45 &lt; x &lt; 125.", "Ortak kısım 45 &lt; x &lt; 80: 46, …, 79 → 34 değer. (59: yalnız üst pencere; 33: 79 atlanmış; 79: en büyük değer)"], "t": "", "d": "İki pencere için ayrı aralık yazıp ortak kısmı alın.", "ses": "b11"}, {"no": 12, "on": "<p>Zeynep, uzunluğu 9 cm olan [AB] doğru parçasını çizmiştir. Pergeliyle A merkezli, 5 cm yarıçaplı bir yay çizmiş; sonra B merkezli, r cm yarıçaplı bir yay çizecektir. İki yay kesişirse kesişme noktası C olacak ve ABC üçgeni çizilecektir.</p>", "g": "<div style=\"display:flex;justify-content:center\"><div style=\"border:.45mm solid #1c6fb8;border-radius:3mm;background:#fff;padding:2mm 3.2mm;font-size:10.6pt;text-align:left\"><div style=\"font-weight:800;color:#1c6fb8;margin-bottom:.8mm\">Çizim Planı</div><div style=\"margin:.4mm 0\"><span class=\"nw\">|AB|</span> = 9 cm</div><div style=\"margin:.4mm 0\">A merkezli yayın yarıçapı: 5 cm</div><div style=\"margin:.4mm 0\">B merkezli yayın yarıçapı: r cm</div></div></div>", "son": "<p>r santimetre cinsinden bir tam sayıdır.</p>", "k": "Buna göre, Zeynep'in ABC üçgenini çizebilmesi için r kaç farklı değer alabilir?", "sec": ["9", "10", "13", "8"], "secg": null, "c": "A", "a": ["Yaylar kesişirse |AC| = 5, |BC| = r ve |AB| = 9 bir üçgenin kenarlarıdır.", "4 &lt; r &lt; 14: 5, …, 13 → 9 değer. (10: 4 ya da 14 de sayılmış, yaylar o zaman tek noktada değer; 13: en büyük değer; 8: 13 atlanmış)"], "t": "", "d": "Yaylar tek noktada değdiğinde üç nokta aynı doğru üzerindedir; üçgen çizilemez.", "ses": "b12"}, {"no": 13, "on": "<p>Bir gözlem kulesi K, iki tekne T₁ ve T₂ noktalarındadır. Kule ile T₁ arası 6 km, kule ile T₂ arası 10 km'dir. Üç noktanın oluşturduğu üçgenin en büyük açısı T₁'de, en küçük açısı kulededir.</p>", "g": "<div style=\"display:flex;justify-content:center\"><div style=\"border:.45mm solid #0b7285;border-radius:3mm;background:#fff;padding:2mm 3.2mm;font-size:10.6pt;text-align:left\"><div style=\"font-weight:800;color:#0b7285;margin-bottom:.8mm\">Gözlem Kaydı</div><div style=\"margin:.4mm 0\">Kule – T₁: 6 km</div><div style=\"margin:.4mm 0\">Kule – T₂: 10 km</div><div style=\"margin:.4mm 0\">En büyük açı: T₁ köşesinde</div><div style=\"margin:.4mm 0\">En küçük açı: kule köşesinde</div></div></div>", "son": "<p>İki tekne arası kilometre cinsinden bir tam sayıdır.</p>", "k": "Buna göre, iki tekne arasındaki uzaklık kaç kilometredir?", "sec": ["5", "4", "6", "9"], "secg": null, "c": "A", "a": ["En büyük açı T₁'de → karşısındaki kule–T₂ kenarı (10 km) en uzun: x &lt; 10.", "En küçük açı kulede → karşısındaki T₁–T₂ kenarı en kısa: x &lt; 6.", "Üçgen eşitsizliği: x &gt; 4. Öyleyse x = 5. (4: uç değer; 6: eşitlik alınmış; 9: yalnız en büyük açı koşulu kullanılmış)"], "t": "", "d": "İki açı koşulunu ayrı ayrı kenar koşuluna çevirin, sonra üçgen eşitsizliğiyle birleştirin.", "ses": "b13"}, {"no": 14, "on": "<p>ABCD dörtgeni biçimindeki bir arazinin [AC] köşegeni boyunca bir yürüyüş yolu yapılacaktır. |AB| = 40 m, |BC| = 60 m, |CD| = 30 m ve |DA| = 50 m'dir. ABC üçgeninin en büyük açısı B köşesindedir.</p>", "g": "<div style=\"display:flex;justify-content:center\"><div style=\"border:.45mm solid #d9480f;border-radius:3mm;background:#fff;padding:2mm 3.2mm;font-size:10.6pt;text-align:left\"><div style=\"font-weight:800;color:#d9480f;margin-bottom:.8mm\">Arazi Ölçüleri</div><div style=\"margin:.4mm 0\"><span class=\"nw\">|AB|</span> = 40 m, <span class=\"nw\">|BC|</span> = 60 m</div><div style=\"margin:.4mm 0\"><span class=\"nw\">|CD|</span> = 30 m, <span class=\"nw\">|DA|</span> = 50 m</div><div style=\"margin:.4mm 0\">ABC üçgeninde en büyük açı: B</div></div></div>", "son": "<p>Yolun uzunluğu metre cinsinden bir tam sayıdır.</p>", "k": "Buna göre, yürüyüş yolu en az kaç metredir?", "sec": ["60", "21", "61", "79"], "secg": null, "c": "C", "a": ["B'deki açı en büyük → <span class=\"nw\">[AC]</span> ABC'nin en uzun kenarı: <span class=\"nw\">|AC|</span> &gt; 60.", "ABC: 20 &lt; <span class=\"nw\">|AC|</span> &lt; 100; ACD: 20 &lt; <span class=\"nw\">|AC|</span> &lt; 80.", "Ortak: 61 ≤ <span class=\"nw\">|AC|</span> ≤ 79; en az 61 m. (60: eşitlik alınmış; 21: açı koşulu kullanılmamış; 79: en büyük değer)"], "t": "", "d": "B'deki açı en büyükse [AC] ABC üçgeninin en uzun kenarıdır; ACD üçgenini de unutmayın.", "ses": "b14"}, {"no": 15, "on": "<p>Bir sınıf etkinliğinde kartlara 2, 3, 5, 7 ve 11 asal sayıları yazılmıştır. Bir öğrenci üç kart seçip kartlardaki sayıları santimetre cinsinden kenar uzunlukları olarak kullanacak ve bir üçgen çizecektir.</p>", "g": "<div style=\"display:flex;gap:3mm;justify-content:center;flex-wrap:wrap\"><div style=\"border:.45mm solid #9b1c36;background:#fbeef0;border-radius:2.4mm;padding:1.6mm 3.4mm;min-width:14mm;text-align:center;font-weight:700;font-size:12pt\">2</div><div style=\"border:.45mm solid #9b1c36;background:#fbeef0;border-radius:2.4mm;padding:1.6mm 3.4mm;min-width:14mm;text-align:center;font-weight:700;font-size:12pt\">3</div><div style=\"border:.45mm solid #9b1c36;background:#fbeef0;border-radius:2.4mm;padding:1.6mm 3.4mm;min-width:14mm;text-align:center;font-weight:700;font-size:12pt\">5</div><div style=\"border:.45mm solid #9b1c36;background:#fbeef0;border-radius:2.4mm;padding:1.6mm 3.4mm;min-width:14mm;text-align:center;font-weight:700;font-size:12pt\">7</div><div style=\"border:.45mm solid #9b1c36;background:#fbeef0;border-radius:2.4mm;padding:1.6mm 3.4mm;min-width:14mm;text-align:center;font-weight:700;font-size:12pt\">11</div></div>", "son": "", "k": "Buna göre, öğrenci kaç farklı kart üçlüsüyle üçgen çizebilir?", "sec": ["3", "2", "1", "4"], "secg": null, "c": "B", "a": ["En uzun kenar öbür ikisinin toplamından kısa olmalıdır.", "Oluşan üçlüler: 3, 5, 7 (8 &gt; 7) ve 5, 7, 11 (12 &gt; 11).", "3, 7, 11 (10 &lt; 11) ve 2'li üçlülerin hiçbiri oluşmaz. Toplam 2. (3: 3, 7, 11 de sayılmış; 1: 5, 7, 11 atlanmış; 4: 2, 5, 7 gibi üçlüler de sayılmış)"], "t": "", "d": "Her üçlüde en uzun kartı öbür ikisinin toplamıyla karşılaştırın; 2'li üçlülerin hiçbiri üçgen olmaz.", "ses": "b15"}, {"no": 16, "on": "<p>Bir kamp alanında 30 m uzunluğundaki bir ip, üç kazık arasına üçgen biçiminde gerilecektir. Kazıklar arası uzaklıklar metre cinsinden tam sayıdır. İki kazık arası 12 m'dir ve bu kenar üçgenin en uzun kenarıdır.</p>", "g": "<div style=\"display:flex;justify-content:center\"><div style=\"border:.45mm solid #8a5a00;border-radius:3mm;background:#fff;padding:2mm 3.2mm;font-size:10.6pt;text-align:left\"><div style=\"font-weight:800;color:#8a5a00;margin-bottom:.8mm\">Kamp Planı</div><div style=\"margin:.4mm 0\">İp uzunluğu: 30 m (tamamı kullanılır)</div><div style=\"margin:.4mm 0\">Bir kenar: 12 m (en uzun kenar)</div><div style=\"margin:.4mm 0\">Kenarlar: metre cinsinden tam sayı</div></div></div>", "son": "<p>Kenar uzunlukları aynı olan iki üçgen aynı sayılır.</p>", "k": "Buna göre, ip kaç farklı üçgen biçiminde gerilebilir?", "sec": ["4", "2", "5", "3"], "secg": null, "c": "D", "a": ["Öbür iki kenarın toplamı 30 − 12 = 18 m'dir ve ikisi de 12'den kısadır.", "Çiftler: 7 ve 11, 8 ve 10, 9 ve 9 → 3 üçgen. (4: 6 ve 12 de sayılmış, o zaman en uzun kenar iki tane olur; 2: 9 ve 9 atlanmış; 5: sıralı çiftler ayrı sayılmış)"], "t": "", "d": "12 m en uzun kenar olduğundan öbür iki kenar 12'den kısa olmalıdır; 6 ve 12 olmaz.", "ses": "b16"}]};

    k.append(sesKutu(s.ses),sek,p1,p2);let kur=false;const ac=i=>{sek.querySelectorAll("button").forEach((b,j)=>b.setAttribute("aria-selected",i===j));p1.hidden=i!==0;p2.hidden=i!==1;if(i===0&&!kur){kur=true;CANL[s.no](p1);}};
    sek.querySelectorAll("button").forEach((b,i)=>b.onclick=()=>ac(i));ac(q.get("g")==="cozum"?1:0);cozKap=p2;}
  if(cozKap===k)k.appendChild(sesKutu(s.ses));const w=document.createElement("div");cozKap.appendChild(w);
  adimAdim(w,s.a,()=>{const c=document.createElement("p");c.className="cevap";c.innerHTML=`<b>Doğru cevap:</b> ${s.c}`;w.appendChild(c);
    k.querySelectorAll("ol.sec li").forEach(li=>{if(li.dataset.h===s.c)li.classList.add("dogru");});
    if(s.t){const t=document.createElement("p");t.className="tuzak";t.innerHTML="<b>Diğer seçenekler neden yanlış?</b> "+s.t;w.appendChild(t);}});
  const d=document.createElement("div");d.className="dikkat";d.innerHTML=`<b>Dikkat!</b> ${s.d}`;cozKap.appendChild(d);return k;}
const ic=$("#ic");
const BOL=[["s","Sıra Sende",V.s,kartS],["k","Kalem Kâğıt",V.k,kartK],["b",V.bad||"Bağlam Soruları",V.b,kartB]].filter(x=>x[2].length);
if(tek&&BOL.some(x=>x[0]===tek)){const n=+q.get(tek);const [,,L,f]=BOL.find(x=>x[0]===tek);const s=L.find(x=>x.no===n)||L[0];ic.appendChild(f(s));$("#tum").hidden=false;$("#nav").remove();}
else{let akt=BOL[0][0];const nav=$("#nav");const ciz=()=>{ic.innerHTML="";nav.innerHTML=BOL.map(([k,a,L])=>`<button type="button" data-k="${k}" aria-pressed="${k===akt}">${a} (${L.length})</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{akt=b.dataset.k;ciz();});const [,,L,f]=BOL.find(x=>x[0]===akt);L.forEach(s=>ic.appendChild(f(s)));};ciz();}

/* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
