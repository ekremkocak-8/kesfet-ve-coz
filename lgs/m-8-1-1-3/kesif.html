<style>

}

    --acc:#f06595; --acc2:#ff922b; --acc3:#51cf66; --acc4:#66d9e8; --bad:#ff6b6b; --grid:rgba(240,101,149,.06); --onacc:#15121a; }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#15121a; --card:#1f1a25; --ink:#ede8f3; --muted:#a79fb4; --line:#3a3246; --soft:#2a2231;
  --acc:#f06595; --acc2:#ff922b; --acc3:#51cf66; --acc4:#66d9e8; --bad:#ff6b6b; --grid:rgba(240,101,149,.06); --onacc:#15121a; }
*{box-sizing:border-box}

.index a{display:flex;gap:8px;align-items:flex-start;text-decoration:none;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:4px;padding:8px 10px;min-height:58px}
.index a:hover{border-color:var(--acc)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px}

.list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}

.tah p,.acik p{margin:4px 0 8px;font-size:17px}

.asamalar{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 14px;counter-reset:a;flex-wrap:wrap}

.asamalar li.on{background:linear-gradient(135deg,var(--kb1),var(--kb2));color:#fff}.asamalar li.on::before{background:#fff;color:var(--kb1)}

.bolum{border-top:2px dashed var(--line);padding-top:12px;margin-top:14px}.bolum:first-child{border-top:0;margin-top:0;padding-top:0}

.sec:hover:not(:disabled){border-color:var(--acc)}.sec:disabled{cursor:default}
.sec.secili{border-color:var(--acc2);background:color-mix(in srgb,var(--acc2) 14%,var(--card))}
.sec.dogru{border-color:var(--acc3);background:color-mix(in srgb,var(--acc3) 16%,var(--card))}.sec.yanlis{border-color:var(--bad);opacity:.6}
.sor{margin-top:8px}
.defter{margin-top:12px;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.dbas{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc2);padding:6px 10px;background:var(--soft)}
.tsar{overflow-x:auto}.defter table.t{width:100%}.defter table.t th,.defter table.t td{border-left:0;border-right:0}
tr.yeni td{animation:yeni 1s ease-out}@keyframes yeni{from{background:color-mix(in srgb,var(--acc2) 30%,transparent)}}
.kay{display:inline-flex;align-items:center;gap:8px;font-weight:600}.kay b{min-width:2ch;font-variant-numeric:tabular-nums}.kay select{font:inherit;border-radius:8px;padding:3px 6px}
.durum{font-size:16px;font-variant-numeric:tabular-nums}
.kartsira{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}.ks-ad{font-weight:800;font-size:18px}
.kartlar{display:flex;gap:8px;flex-wrap:wrap;min-height:44px}

.pkart.secili{outline:3px solid var(--acc2);outline-offset:2px}.pkart.hayalet{position:fixed;z-index:80;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.takv{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:560px;margin:8px 0}
.tg{text-align:center;font-weight:800;font-size:13px;color:var(--muted)}
.tgun{font:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;min-height:48px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px}
.tgun b{font-size:14px}.tgun span{display:flex;gap:3px;min-height:10px}.nk{width:9px;height:9px;border-radius:50%;display:inline-block}.nk.kr{background:#e03131}.nk.mv{background:#1c7ed6}
.tgun.isr{border-color:var(--acc2);box-shadow:inset 0 0 0 2px var(--acc2)}.tgun.ort{background:#ffe066;color:#1c2433}
.stage.mini{margin-top:8px}
.nabiz{animation:nb 1.4s ease-in-out infinite}@keyframes nb{50%{opacity:.35}}
.ipucu{color:var(--muted);font-size:14px}
h1,h2,.bb,.dbas{font-family:"Nunito","Segoe UI",system-ui,sans-serif!important;letter-spacing:0}

.yonerge{margin:0 0 10px}.yonerge p{margin:3px 0;font-size:1.05rem;line-height:1.5}

.yap{font-weight:700;margin:8px 0}
.gorevler{border:2px solid var(--acc);border-radius:12px;margin:12px 0;overflow:hidden}
.gorevler .gbas{background:var(--acc);color:#fff;font-weight:800;padding:6px 12px;display:flex;justify-content:space-between}
.gorevler ol{list-style:none;margin:0;padding:6px 10px}
.gorevler li{display:flex;gap:10px;align-items:flex-start;padding:6px 4px;border-bottom:1px dashed var(--line)}.gorevler li:last-child{border-bottom:0}
.gorevler li>span{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:2px solid var(--line)}
.gorevler li.tamam>span{background:#2f9e44;border-color:#2f9e44;color:#fff}.gorevler li.tamam{opacity:.8}
.gorevler li.simdi{background:var(--soft);border-radius:8px}.gorevler li.simdi>span{background:var(--acc);border-color:var(--acc);color:#fff}

.bolum.kapali>*:not(h3){display:none}.bolum h3.bb{cursor:default}.bolum.kapali h3.bb,.bolum.acildi h3.bb{cursor:pointer}
.bb .oz{font-style:normal;font-weight:600;font-size:.85rem;color:var(--muted);margin-left:8px}
.bb .ac{display:none;margin-left:auto;font-size:.8rem;color:var(--acc)}.bolum.kapali .bb .ac{display:inline}
.nk.ye{background:#2f9e44}.bosk{color:var(--muted);font-size:.9rem}.soru{font-weight:700;font-size:1.05rem}
.buyukkesir{font-size:2rem;text-align:center;margin:8px 0}.btab{max-width:340px}.btab td.yildiz{background:#fff3bf;font-weight:800}
.kasaalan{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin:10px 0}.carklar{display:flex;gap:10px}.cark{display:flex;flex-direction:column;align-items:center;gap:4px}
.cark b{font:800 34px/1 Nunito,sans-serif;width:56px;height:64px;display:grid;place-items:center;border:3px solid var(--ink);border-radius:10px;background:var(--card)}
.lambalar{display:flex;flex-direction:column;gap:8px}.lamba{display:flex;align-items:center;gap:8px;font-weight:700}.lamba i{width:18px;height:18px;border-radius:50%;background:#dee2e6;border:2px solid #868e96}
.lamba.yes i{background:#40c057;border-color:#2f9e44}.lamba.no i{background:#fa5252;border-color:#c92a2a}
.kilit{font-weight:800;padding:4px 10px;border-radius:8px;background:#ffe3e3;color:#c92a2a;text-align:center}.kilit.acik{background:#d3f9d8;color:#2b8a3e}
.sekme .secili{background:var(--acc);color:#fff}.usl p{font-size:1.2rem;font-weight:700;margin:4px 0}.ayir{flex-wrap:wrap}
.lab{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;max-width:480px;margin:10px 0}
.lh{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);background:var(--card);font:800 18px/1 "Source Sans 3",sans-serif;position:relative;cursor:pointer;color:var(--ink);padding:0}
.lh small{position:absolute;top:3px;left:0;right:0;font-size:10px;font-weight:700;color:var(--muted)}.lh.gez{background:#d3f9d8;border-color:#2f9e44}.lh.ben{outline:3px solid #f08c00;outline-offset:1px}.lh.yanlis{background:#ffc9c9;border-color:#c92a2a}
.harita{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;max-width:560px;margin:8px 0}

.hk.bas{display:grid;place-items:center;border:0;background:none;font-weight:800;color:var(--muted);cursor:default}.hk.son{outline:2px solid #000}

:root{--acc:#0b6e79;--acc2:#d9480f;--acc3:#2f9e44;--acc4:#5f3dc4;--soft:#e8f5f6;--line:#d2e3e6;--bg:#f1f7f8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--acc:#3bc9db;--acc2:#ff8a4c;--acc3:#51cf66;--acc4:#9775fa;--soft:#14272b;--line:#28424a;--bg:#0c1618}}
:root[data-theme="dark"]{--acc:#3bc9db;--acc2:#ff8a4c;--acc3:#51cf66;--acc4:#9775fa;--soft:#14272b;--line:#28424a;--bg:#0c1618}
/* AA-BAS · Aralarında Asal atölyesine özgü biçimler */
.aa-sira{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.aa-sira>b{min-width:118px;font-size:16px}
.aa-pad{padding:10px 12px}
.aa-mat{display:grid;grid-template-columns:minmax(84px,auto) minmax(0,1fr) minmax(0,1fr);gap:6px;margin:8px 0}
.aa-mat .bas{font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;background:var(--soft);border-radius:8px;line-height:1.25}
.aa-mat .kova,.aa-kv .kova{border-radius:12px;min-height:84px}
.kova:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.aa-kart{display:inline-flex;align-items:center;gap:6px;font:800 19px/1.1 "Source Sans 3",sans-serif;padding:8px 14px;border:3px solid var(--acc2);border-radius:12px;background:var(--card);color:var(--ink)}
.aa-nk{font:800 18px/1 "Source Sans 3",sans-serif;min-width:48px;height:46px;padding:0 9px;border-radius:10px;border:3px solid var(--acc4);background:var(--card);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.aa-nk[aria-pressed="true"]{outline:3px solid var(--acc2);outline-offset:2px}
.aa-nk.ok,.hz.ok{background:#d3f9d8;border-color:#2f9e44;color:#000}.aa-nk.no,.hz.no{background:#ffe8cc;border-color:#e8590c;color:#000}
.aa-nk:disabled{opacity:.35;cursor:default}
.hz.ok,.hz.no{font-weight:800}.hz small{display:block;font-size:11px;font-weight:700}
.aa-skorlar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.aa-sk{border:2px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--card);text-align:center;min-width:92px}
.aa-sk small{display:block;font-size:12.5px;color:var(--muted);font-weight:700}.aa-sk b{font:800 22px Nunito,sans-serif}
.aa-kesir{font-size:2.3rem;text-align:center;margin:10px 0}.aa-kesir .frac{font-weight:800}
.seg .frac{font-size:15px}.aa-kv .frac,.defter .frac{font-size:1em}
.aa-dosya{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:8px 0}
.aa-dosya>div{border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--card)}.aa-dosya h4{margin:0 0 4px;font:800 22px Nunito,sans-serif;text-align:center}
.aa-dosya p{margin:2px 0;font-size:15px;font-variant-numeric:tabular-nums}
.aa-kat{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:6px 0}.aa-kat>b{min-width:100px}
.aa-kat .chip{min-width:46px;padding:5px 6px}
.aa-yon{font-size:14px;color:var(--muted);margin:4px 0}
.carklar{flex-wrap:wrap;align-items:center}.cark button{min-width:56px;padding:2px 0;font-size:16px}
.aa-isik{width:22px;height:22px;border-radius:50%;background:#dee2e6;border:2px solid #868e96;align-self:center}.aa-isik.yes{background:#40c057;border-color:#2f9e44}.aa-isik.no{background:#fa5252;border-color:#c92a2a}
tr.aa-isaret td{background:color-mix(in srgb,var(--acc3) 22%,var(--card));font-weight:700}
.defter tbody tr{cursor:default}.aa-tikla tbody tr{cursor:pointer}
@media (max-width:560px){.aa-dosya{grid-template-columns:1fr}.aa-sira>b,.aa-kat>b{min-width:0;width:100%}.aa-mat{grid-template-columns:64px minmax(0,1fr) minmax(0,1fr)}.aa-mat .bas{font-size:12.5px}}
@media (max-width:560px){.carklar{gap:6px}.cark b{width:44px;height:54px;font-size:28px}.cark button{min-width:44px}}
/* AA-SON */
body{background:var(--bg)}
#kesif{min-height:100dvh;padding-inline:16px;padding-block:14px 90px;max-width:1100px;margin:0 auto}
.ogr-bas{padding:22px 0 8px;padding-right:70px}.ogr-bas h1{margin:4px 0}.ogr-not{font-size:14px;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 12px}
.kartlar-l{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.kartlar-l .ek{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;font:inherit;color:var(--ink)}
.kartlar-l .ek:hover{border-color:var(--acc)}
.kartlar-l .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800}
.kartlar-l b{display:block;font-family:Nunito,sans-serif;font-size:16px}.kartlar-l small{display:block;color:var(--muted);font-size:13.5px;line-height:1.35;margin-top:2px}
.yon-ekran{min-height:calc(100dvh - 40px);display:grid;place-items:center}
.yon-kart{width:100%;max-width:620px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 22px;box-shadow:0 18px 40px -26px rgba(15,30,60,.5);display:flex;flex-direction:column;gap:10px}
.yon-ust{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-right:56px}.yon-ust .kod{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc4)}
.yon-no{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--acc),var(--acc4));color:#fff;font:900 30px/64px Nunito,sans-serif;text-align:center}
.yon-kart h2{font-size:28px}.amac{font-size:17px;margin:0}.lab{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.adimlar{margin:0;padding-left:22px;font-size:17px}.adimlar li{margin:4px 0}.sure{color:var(--muted);font-size:14px;margin:0}
.basla{font-size:20px;padding:14px 20px;border-radius:14px;margin-top:6px}
.etk-ekran{min-height:100dvh}
.etk-ust{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:10px;align-items:center;background:var(--bg);padding:10px 64px 10px 0;border-bottom:1px solid var(--line);margin-bottom:10px}
.etk-ust h2{font-size:20px}.gizli-gorev{position:absolute;left:-9999px}
#yonlendir{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--acc);color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));font-size:15.5px;box-shadow:0 -8px 20px -12px rgba(0,0,0,.4)}
#yonlendir .sm{color:#ffd8a8;font-weight:800;margin-right:6px}#yonlendir b{color:#fff}
.ogrendim{margin-top:18px;border:2px solid var(--acc3);border-radius:16px;padding:14px 16px;background:color-mix(in srgb,var(--acc3) 8%,var(--card))}
.og-bas{font:800 18px Nunito,sans-serif;color:var(--acc3)}.ogrendim p{font-size:17px;margin:6px 0}
.izgara10,.izgara{display:grid;gap:3px}.izgara10{grid-template-columns:repeat(10,minmax(0,1fr))}
.hz{font:inherit;font-weight:700;font-size:14px;padding:6px 0;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.hz.el{color:var(--muted);text-decoration:line-through}.hz.as{background:#ffe066;color:#000;border-color:#f08c00}
.isikb{font:inherit;font-weight:800;display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;cursor:pointer}
.isikb i{width:14px;height:14px;border-radius:50%;background:#ced4da}.isikb.kir i{background:#e03131;box-shadow:0 0 10px #e03131}.isikb.yes i{background:#2f9e44;box-shadow:0 0 10px #2f9e44}
.kovalar{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:8px}
.kova{font:inherit;text-align:left;border:2px dashed var(--acc4);border-radius:0 0 18px 18px;background:var(--card);color:var(--ink);padding:10px;min-height:96px;cursor:pointer}
.kova b{display:block;font-size:14px;margin-bottom:6px}.kova span{display:flex;flex-wrap:wrap;gap:4px}.kova i{font-style:normal;background:var(--soft);border-radius:6px;padding:1px 7px;font-weight:700;font-size:13px}
.sifre{display:flex;gap:8px;flex-wrap:wrap}.skut{font:inherit;display:flex;flex-direction:column;align-items:center;min-width:64px;padding:8px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer}
.skut b{font-size:18px}.skut span{font:900 26px Nunito,sans-serif;color:var(--acc2)}.skut.ac{border-color:var(--acc3)}.skut.sec{outline:3px solid var(--acc2)}
.kbitti{display:inline-block;font:900 24px Nunito,sans-serif;letter-spacing:.2em;background:var(--soft);padding:4px 12px;border-radius:10px;margin:4px}
.usk{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:4px 8px;background:var(--card)}.usk span{font:800 22px Nunito,sans-serif;min-width:44px;text-align:center}
.radar{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;padding:16px;border-radius:50%/16%;background:radial-gradient(circle,color-mix(in srgb,var(--acc4) 18%,var(--card)),var(--card));border:2px solid var(--acc4)}
.rd{font:inherit;font-weight:800;font-size:18px;padding:10px 0;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.rd.ev{border-color:var(--acc3);background:color-mix(in srgb,var(--acc3) 16%,var(--card))}.rd.hy{border-color:var(--bad);opacity:.6}.rd.sec{outline:3px solid var(--acc2)}
.izgt td{height:44px;min-width:64px;font-weight:800;font-size:17px}
.eslesme{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.esg{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--card)}.esg>b{font-size:13px;color:var(--muted)}
.cift{display:inline-flex;gap:2px;padding:3px;border-radius:10px}.cift.tam{background:color-mix(in srgb,var(--acc3) 20%,transparent)}.cift.yalniz{background:color-mix(in srgb,var(--bad) 16%,transparent)}
.cift i{font-style:normal;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--card);font-weight:800;border:1.5px solid var(--line)}.cift i.yeni{border-color:var(--acc2);color:var(--acc2)}.cift i.bosluk{border-style:dashed;color:var(--muted)}
.dolaplar{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin-top:10px}
.dol{font:inherit;display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:6px 6px 2px 2px;border:2px solid #868e96;background:#dee2e6;color:#000;cursor:pointer}.dol span{font-size:10px}.dol.ac{background:#fff3bf;border-color:#f08c00}
@media (max-width:560px){.dolaplar{grid-template-columns:repeat(6,minmax(0,1fr))}}
.tahta{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin-top:10px}
.ts{font:inherit;font-weight:800;padding:10px 0;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.ts.alindi{opacity:.25}.ts.olmaz{color:var(--muted);border-style:dashed}.ts.tehlike{background:#ffc9c9}.ts.yes{background:color-mix(in srgb,var(--acc3) 20%,var(--card));border-color:var(--acc3)}
@media (max-width:560px){.tahta{grid-template-columns:repeat(6,minmax(0,1fr))}}
.zincir{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:36px}.zincir span{font-weight:800;padding:3px 10px;border-radius:99px}.zincir .sen{background:var(--acc);color:#fff}.zincir .bil{background:var(--acc2);color:#fff}.zincir i{font-style:normal;color:var(--muted)}
.algt td{min-width:56px;font-weight:700;font-size:16px}.algt td.bl{border-left:3px solid var(--ink);color:var(--acc2)}.algt{border-collapse:collapse}.algt td{border:0;border-bottom:1px solid var(--line)}
.adaylar .chips{max-height:140px;overflow:auto}
.yon-kart .lab{display:block;width:auto;margin:6px 0 0}
.raf{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px dashed var(--line);border-radius:12px;margin:6px 0;flex-wrap:wrap}.raf>b{min-width:48px;font-size:18px}
.raf.ort{border-color:var(--acc3);background:color-mix(in srgb,var(--acc3) 8%,var(--card))}.ebobk{font:800 18px Nunito,sans-serif;color:var(--acc3);margin-left:auto}
.ustab th{white-space:nowrap}.ustab th small{display:block;font-size:12px;font-weight:600;color:var(--muted)}.ustab td{padding:6px}.ustab tr.cizgi td,.ustab tr.cizgi th{border-top:3px solid var(--ink)}
.uk{font:800 19px/1.1 Nunito,sans-serif;min-width:46px;padding:6px 8px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.uk.gizli{color:#adb5bd;border-style:dashed}.uk.on{border-color:var(--acc3);background:color-mix(in srgb,var(--acc3) 20%,var(--card))}
.pir{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0}.psira{display:flex;gap:6px;justify-content:center}
.pk{font:800 17px/1 "Source Sans 3",sans-serif;min-width:54px;padding:10px 4px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.pk:disabled{cursor:default;opacity:1}.pk.ic{background:var(--acc);border-color:var(--acc);color:#fff}.pk.aday{border-color:var(--acc2);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc2) 35%,transparent);cursor:pointer}.pk.iy{border-color:#f08c00;background:#fff3bf;color:#1c2433}
.duel{border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card);margin:8px 0}.skor{font-weight:700;color:var(--muted)}.dsoru{font:800 26px Nunito,sans-serif;margin:8px 0;text-align:center}
.yaris{height:14px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0}.yaris i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),#c92a2a)}
.dsec{justify-content:center}.tog[aria-pressed="true"]{border-color:var(--acc3);background:color-mix(in srgb,var(--acc3) 16%,var(--card));font-weight:700}
/* A8-BAS */

.a8.kilitli{border-style:dashed;background:transparent}.a8.kilitli .a8-no{background:var(--muted)}.a8.kilitli .a8-bas{background:transparent;border-bottom:0}
.a8-ic{padding:12px 14px 14px}.a8.kilitli .a8-ic{padding-top:0}

@media (min-width:820px){.a8-yon{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr) minmax(0,1fr)}}

.a8-y p{margin:0;font-size:16px;line-height:1.45}.a8-y ol{margin:0;padding-left:20px;font-size:16px;line-height:1.45}.a8-y li{margin:2px 0}

.a8-t-bas{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}.a8-t-bas b{font:800 15px Nunito,sans-serif;color:#d9480f}.a8-t-bas small{color:var(--muted);font-size:13.5px}

/* TA-BAS */
/* Tek adım düzeni (pilot) */
.ta{position:relative}
.ta-ust{display:flex;flex-direction:column;gap:6px;margin:0 0 10px}
.ta-serit{display:flex;gap:6px;flex-wrap:wrap}
.ta-n{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:12px;background:var(--soft);color:var(--muted);font-size:14px;line-height:1.2}
.ta-n i{flex:none;font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink);font-weight:800;font-size:13px}

.ta-def summary{cursor:pointer;font-weight:700;color:var(--acc);margin-top:4px}.ta-def-ic{margin-top:6px;overflow-x:auto}.ta-def-ic .defter{margin:0}

.ta-bas{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--soft);border-bottom:1px solid var(--line)}
.ta-evre{flex:none;font-weight:800;font-size:13px;background:var(--acc);color:#fff;border-radius:99px;padding:3px 10px}

.ta-yon .ta-ne{margin:0 0 4px;font-weight:700}.ta-yon ol{margin:0;padding-left:20px}.ta-yon li{margin:2px 0}
.ta-t-soru{font-weight:800;font-size:19px;margin:4px 0 10px}.ta-t-not{font-size:15.5px;color:var(--muted);margin:10px 0 0}
.ta-yeni-not{margin:0 0 10px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,#f08c00 9%,var(--card));border-left:4px solid #f08c00}
.ta-alt{position:sticky;bottom:0;z-index:20;margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;

    /* Tahmin: isteğe bağlı; seçilmese de deney yapılabilir. Aşama 2 açılınca tahmin sonuçla karşılaştırılır. */

  const TUR=[[24,36,[4,6,8,12]],[18,30,[2,3,6,9]],[16,40,[2,4,5,8]],[20,50,[2,4,5,10]],[42,70,[2,6,7,14]],[54,72,[4,6,9,18]]];
  const k=S.ac(1,{ne:"Altı turluk yarışta her kesri tek bölmeyle sadeleştirmeye çalışacaksınız.",
    durum:`Yarışta altı kesir var: ${TUR.map(([a,b])=>kH(a,b)).join(" ")}. Her turda dört bölen seçeneği verilir; pay ve payda seçtiğiniz sayıya bölünür.`,
    nasil:["Her turda bir bölen seçme hakkınız var.","Kesir tek bölmede en sade hâle gelirse <b>2 puan</b>, sadeleşir ama en sade hâle gelmezse <b>1 puan</b>, bölünemezse <b>0 puan</b> alırsınız.","Sonucu okuyunca “Sonraki tur” düğmesine basınız. Altı tur bitince isterseniz yeniden oynayabilirsiniz."],biter:bitG(3)});
  S.tahmin(k,`${kH(24,36)} kesrini tek bölmede en sade hâle getirmek için pay ve payda hangi sayıya bölünmelidir?`,[[4,"4"],[6,"6"],[12,"12"],[36,"36"]],12,`EBOB(24, 36) = 12; ${kH(24,36)} = ${kH(2,3)}.`);
  k.insertAdjacentHTML("beforeend",`<div class="aa-skorlar"><div class="aa-sk"><small>Tur</small><b class="tu">1 / 6</b></div><div class="aa-sk"><small>Puan</small><b class="pu">0</b></div><div class="aa-sk"><small>Tek bölmede en sade</small><b class="te">0</b></div></div>
    <div class="duel"><div class="aa-kesir kz"></div><div class="secler dsec sc"></div><div class="row"><button class="primary sonr" hidden>Sonraki tur →</button><button class="ghost yeni" hidden>Yeniden oynayın</button></div></div><div class="fb" hidden></div>`);
  const kz=k.querySelector(".kz"),sc=k.querySelector(".sc"),sonr=k.querySelector(".sonr"),yeni=k.querySelector(".yeni"),f=k.querySelector(".fb");
  let t=0,puan=0,tek=0,cev=false,oynanan=0,enTek=0;
  const D=defter(k,["Kesir","Seçilen bölen","Sonuç","Puan"]);
  const G=gorevler(k,[{m:"<b>3 turu</b> tamamlayınız.",ok:()=>oynanan>=3},{m:"Bir kesri <b>tek bölmede</b> en sade hâle getiriniz.",ok:()=>enTek>=1},
    {m:"Altı turun <b>hepsini</b> tamamlayınız.",ok:()=>oynanan>=6,s:()=>"Tek bölmede en sade hâle getiren bölen her turda EBOB idi."}],acikla);
  function skor(){k.querySelector(".tu").textContent=`${Math.min(t+1,6)} / 6`;k.querySelector(".pu").textContent=puan;k.querySelector(".te").textContent=tek;}
  function tur(){const [a,b,S4]=TUR[t];cev=false;sonr.hidden=true;f.hidden=true;kz.innerHTML=kH(a,b);
    sc.innerHTML=karistir(S4).map(d=>`<button class="sec" data-d="${d}">${d} ile bölün</button>`).join("");
    sc.querySelectorAll(".sec").forEach(bt=>bt.onclick=()=>{if(cev)return;cev=true;const d=+bt.dataset.d;let pn,son;
      if(a%d||b%d){pn=0;son=`${d}, ${a%d?"payı":"paydayı"} bölmez.`;bt.classList.add("yanlis");yanlisSes();}
      else{const p2=a/d,q2=b/d;if(gcd(p2,q2)===1){pn=2;tek++;enTek++;son=`${kH(a,b)} = ${kH(p2,q2)}: tek bölmede en sade hâle geldi.`;bt.classList.add("dogru");bip(880,.15);}
        else{pn=1;son=`${kH(a,b)} = ${kH(p2,q2)}: sadeleşti ama en sade hâlde değil.`;bt.classList.add("secili");bip(520,.1);}}
      puan+=pn;oynanan++;D.ekle([kH(a,b),d,pn===2?"En sade":pn===1?"Sadeleşti":"Bölünmedi",pn],`${oynanan}`);
      sc.querySelectorAll(".sec").forEach(x=>x.disabled=true);fb(f,pn===2,`${son} <b>${pn} puan</b>.`);
      if(t<5)sonr.hidden=false;else{yeni.hidden=false;f.innerHTML+=` Yarış bitti. Toplam puanınız: <b>${puan}</b>.`;}
      skor();G.kontrol();});
    skor();}
  sonr.onclick=()=>{if(t>=TUR.length-1||!cev)return;t++;tur();};yeni.onclick=()=>{t=0;puan=0;tek=0;yeni.hidden=true;tur();};
  tur();
  function acikla(){const c=S.kural(2);
    S.soru(c,"Bir kesri tek bölmede en sade hâle getiren bölen hangisidir?",
      ["Pay ile paydanın EBOB'u","Pay ile paydanın herhangi bir ortak böleni","Paydanın en küçük asal böleni"],
      "Her turda 2 puan getiren bölen, pay ile paydanın EBOB'uydu.",()=>
    S.soru(c,"Pay ve payda EBOB'larına bölündükten sonra yeni pay ile yeni payda için hangisi doğrudur?",
      ["Aralarında asaldır","İkisi de asaldır","İkisi de tek sayıdır"],
      `${kH(24,36)} = ${kH(2,3)}, ${kH(16,40)} = ${kH(2,5)}: yeni pay ile yeni paydanın ortak böleni yalnız 1'dir.`,meydan));}
  function meydan(){const m=S.son();
    S.sayi(m,soruKut(`${kH(48,80)} kesri tek bölmede en sade hâle getirilecektir. Pay ve payda hangi sayıya bölünmelidir?`),16,
      `EBOB(48, 80) = 16; ${kH(48,80)} = ${kH(3,5)}.`,"",
      ()=>S.bitir("Bir kesri <b>tek bölmede</b> en sade hâle getirmek için pay ve payda <b>EBOB'larına</b> bölünür. Bölümler aralarında asal olur; kesir artık sadeleşmez."));}
};

/* 16 · ARALARINDA ASAL SAYACI */
const e_sayac=p=>{const S=notr(adimli(p));const P=[2,3,5,7];
  const SAY=Array.from({length:30},(_,i)=>i+1);
  const k=S.ac(1,{ne:"1'den 30'a kadar olan sayılardan 18 ile ve 20 ile aralarında asal olanları eleme yoluyla sayacaksınız.",
    durum:"Sayı tablosunda 1'den 30'a kadar (1 ve 30 dâhil) 30 sayı var. Seçilen sayı <b>18</b> ya da <b>20</b> olabilir. Eleme düğmeleri: <b>2, 3, 5 ve 7</b>; bir düğme, o sayının tablodaki bütün katlarının üstünü çizer.",
    nasil:["Üstten seçilen sayıyı belirleyiniz.","Eleme düğmeleriyle, seçilen sayı ile aralarında asal <b>olmayan</b> bütün sayıların üstünü çiziniz.","Sonra üstü çizilmemiş sayıların her birine dokunarak sayınız; sayılan kutu sarı olur."],biter:bitG(3)});
  S.tahmin(k,"1 ile 30 arasındaki sayılardan (1 ve 30 dâhil) kaç tanesi 18 ile aralarında asaldır?",[[6,"6"],[10,"10"],[12,"12"],[15,"15"]],10,"1–30 arasında 18 ile aralarında asal 10 sayı vardır.");
  k.insertAdjacentHTML("beforeend",`<div class="row ay"></div><div class="a8-et">Eleme düğmeleri</div><div class="row el" style="margin-top:0"></div><div class="izgara10 iz" style="margin-top:8px"></div><p class="durum sn"></p><div class="fb" hidden></div>`);
  const ay=k.querySelector(".ay"),el=k.querySelector(".el"),iz=k.querySelector(".iz"),sn=k.querySelector(".sn"),f=k.querySelector(".fb");
  let N=18;const DUR={18:{e:new Set(),s:new Set()},20:{e:new Set(),s:new Set()}};
  const elendi=x=>[...DUR[N].e].some(q=>x%q===0);
  const elemeTamam=n=>asalC(n).every(q=>DUR[n].e.has(q));
  const kalan=n=>SAY.filter(x=>gcd(x,n)===1);
  const sayimTamam=n=>elemeTamam(n)&&kalan(n).every(x=>DUR[n].s.has(x));
  const D=defter(k,["Sayı","Kullanılan eleme düğmeleri","Kalan sayı adedi"]);
  const G=gorevler(k,[{m:"Seçilen sayı 18 iken 18 ile aralarında asal olmayan <b>bütün</b> sayıların üstünü çiziniz.",ok:()=>elemeTamam(18),s:()=>"2'nin ve 3'ün katları elendi."},
    {m:"18 için üstü çizilmemiş sayıların <b>hepsine</b> dokunarak sayınız.",ok:()=>sayimTamam(18),s:()=>"18 ile aralarında asal 10 sayı"},
    {m:"Seçilen sayı 20 iken aynı işi yapınız: eleyiniz ve kalanları sayınız.",ok:()=>sayimTamam(20),s:()=>"2'nin ve 5'in katları elendi; 20 ile aralarında asal 12 sayı"}],acikla);
  sayiDugme(ay,"Seçilen sayı:",[["18","18"],["20","20"]],"18",v=>{N=+v;f.hidden=true;ciz();});
  function ciz(){const d=DUR[N];
    el.innerHTML=P.map(q=>`<button class="ghost" data-q="${q}" aria-pressed="${d.e.has(q)}">${q}'${q===2?"nin":q===3?"ün":q===5?"in":"nin"} katlarını eleyin</button>`).join("");
    el.querySelectorAll("button").forEach(b=>b.onclick=()=>{const q=+b.dataset.q;if(d.e.has(q))return;
      if(N%q===0){d.e.add(q);fb(f,true,`${q}'${q===2?"nin":q===3?"ün":"in"} katlarının üstü çizildi.`);bip(600,.08);}
      else{fb(f,false,`Bu düğme, ${N} ile aralarında asal olan sayıları da eler. ${YD}`);yanlisSes();}ciz();G.kontrol();});
    iz.innerHTML=SAY.map(x=>`<button class="hz ${elendi(x)?"el":d.s.has(x)?"as":""}" data-x="${x}">${x}</button>`).join("");
    iz.querySelectorAll("button").forEach(b=>b.onclick=()=>{const x=+b.dataset.x;
      if(elendi(x)){fb(f,false,`${x} elendi; sayılmaz.`);return;}
      if(!elemeTamam(N)){fb(f,false,`Saymadan önce ${N} ile aralarında asal olmayan bütün sayıların üstünü çiziniz.`);yanlisSes();return;}
      if(!d.s.has(x)){d.s.add(x);bip(500+d.s.size*15,.05);}f.hidden=true;
      if(sayimTamam(N)){D.ekle([N,lst([...d.e].sort((a,b)=>a-b)),d.s.size],String(N));fb(f,true,`Sayım bitti: ${N} ile aralarında asal <b>${d.s.size}</b> sayı var.`);bip(880,.2);}
      ciz();G.kontrol();});
    sn.innerHTML=dz(`Üstü çizilen: <b>${SAY.filter(elendi).length}</b>`,`Sayılan: <b>${d.s.size}</b>`);}
  ciz();
  function acikla(){const c=S.kural(1);
    S.soru(c,"18 ile aralarında asal olanları bulmak için hangi sayıların katlarını elediniz?",
      ["18'in asal çarpanları olan 2'nin ve 3'ün","18'den küçük bütün asal sayıların","Yalnız 18'in katlarının"],
      "18 = 2 · 3<sup>2</sup>. 2'ye ya da 3'e bölünen sayılar 18 ile aralarında asal olamaz; kalanların hepsi aralarında asaldır.",meydan);}
  function meydan(){const m=S.son();
    S.sayi(m,soruKut("1'den 30'a kadar olan doğal sayılardan (1 ve 30 dâhil) kaç tanesi 15 ile aralarında asaldır?"),16,
      "15 = 3 · 5. 3'ün katları 10, 5'in katları 6 tanedir; 15 ve 30 iki kez sayılır: 10 + 6 − 2 = 14 sayı elenir, 30 − 14 = 16 sayı kalır.","",
      ()=>S.bitir("Bir sayıyla aralarında asal olan sayıları bulmak için o sayının <b>asal çarpanlarının katları elenir</b>; kalan sayılar o sayıyla aralarında asaldır. 1 her zaman kalır."));}
};

/* 17 · TAKIM NUMARALARI */
const e_takim=p=>{const S=notr(adimli(p));
  const L=[4,7,15,18,24],R=[5,9,14,31,36];
  const k=S.ac(1,{ne:"Kırmızı takımın her oyuncusunu, forma numarası kendi numarasıyla aralarında asal olan bir mavi takım oyuncusuyla eşleştireceksiniz.",
    durum:"Maç öncesi Kerem'in kırmızı takımı ile Elif'in mavi takımı selamlaşacak. Kırmızı formalar: <b>4, 7, 15, 18, 24</b>. Mavi formalar: <b>5, 9, 14, 31, 36</b>. Her oyuncu, karşı takımdan yalnız bir oyuncuyla eşleşir; eşlerin numaraları aralarında asal olmalıdır.",
    nasil:["Soldan bir kırmızı oyuncuya, sonra sağdan bir mavi oyuncuya dokununuz.","Numaralar aralarında asalsa iki oyuncu arasına çizgi çekilir. Eşleşmiş bir kırmızı oyuncuya yeniden dokunursanız eşleşme bozulur.","Beş kırmızı oyuncunun hepsi eşleşince deney biter."],biter:bitG(2)});
  S.tahmin(k,"18 numaralı kırmızı oyuncu, aşağıdaki mavi oyunculardan hangisiyle eşleşebilir?",[[9,"9"],[14,"14"],[31,"31"],[36,"36"]],31,"18 ile 31 aralarında asaldır; 9, 14 ve 36 ile 18'in 1'den başka ortak böleni vardır.");
  k.insertAdjacentHTML("beforeend",`<div class="stage"></div><div class="row"><button class="ghost boz">Eşleşmeleri bozun</button></div><div class="fb" hidden></div>`);
  const st=k.querySelector(".stage"),f=k.querySelector(".fb");let sec=null;const es={};/* sol indeks → sağ indeks */
  const D=defter(k,["Kırmızı","Mavi","EBOB"]);
  const G=gorevler(k,[{m:"<b>2 eşleşme</b> kurunuz.",ok:()=>Object.keys(es).length>=2},
    {m:"Beş kırmızı oyuncunun <b>hepsini</b> eşleştiriniz.",ok:()=>Object.keys(es).length===5,s:()=>Object.keys(es).map(i=>`${L[i]} – ${R[es[i]]}`).join(", ")}],acikla);
  const Y=i=>72+i*66;
  const forma=(x,y,n,renk,secili)=>`<path d="M${x-30} ${y-20} l14 -10 h32 l14 10 l-8 14 h-6 v34 h-32 v-34 h-6 z" fill="${renk}" stroke="${secili?"#f08c00":"#1c2433"}" stroke-width="${secili?5:2}" stroke-linejoin="round"/><text x="${x}" y="${y+12}" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">${n}</text>`;
  function ciz(){const sv=svgEl(360,400);let h=`<text x="80" y="22" text-anchor="middle" font-size="17" font-weight="800" fill="#c92a2a">Kırmızı takım</text><text x="280" y="22" text-anchor="middle" font-size="17" font-weight="800" fill="#1864ab">Mavi takım</text>`;
    Object.keys(es).forEach(i=>{h+=`<line x1="116" y1="${Y(+i)+4}" x2="244" y2="${Y(es[i])+4}" stroke="#2f9e44" stroke-width="5" stroke-linecap="round"/>`;});
    L.forEach((n,i)=>{h+=`<g data-l="${i}" style="cursor:pointer"><rect x="36" y="${Y(i)-33}" width="88" height="64" fill="transparent"/>${forma(80,Y(i),n,"#e03131",sec===i)}</g>`;});
    R.forEach((n,i)=>{h+=`<g data-r="${i}" style="cursor:pointer"><rect x="236" y="${Y(i)-33}" width="88" height="64" fill="transparent"/>${forma(280,Y(i),n,"#1c7ed6",false)}</g>`;});
    sv.innerHTML=h;st.replaceChildren(sv);
    sv.querySelectorAll("[data-l]").forEach(g=>g.onclick=()=>{const i=+g.dataset.l;if(es[i]!==undefined){delete es[i];sec=null;f.hidden=true;ciz();return;}sec=sec===i?null:i;ciz();});
    sv.querySelectorAll("[data-r]").forEach(g=>g.onclick=()=>{const j=+g.dataset.r;if(sec===null){fb(f,false,"Önce soldan bir kırmızı oyuncuya dokununuz.");return;}
      const a=L[sec],b=R[j],gg=gcd(a,b);
      if(Object.values(es).includes(j)){fb(f,false,`${b} numaralı mavi oyuncunun eşi var. Önce o eşleşmeyi bozunuz.`);return;}
      if(gg===1){es[sec]=j;D.ekle([a,b,1],a+"-"+b);fb(f,true,`${a} ile ${b} aralarında asaldır. Eşleştiler.`);bip(760,.1);sec=null;}
      else{D.ekle([a,b,gg],a+"-"+b);fb(f,false,`${a} ile ${b} sayılarının ortak böleni ${gg}. Bu ikili olmaz.`);yanlisSes();}
      ciz();G.kontrol();});}
  k.querySelector(".boz").onclick=()=>{Object.keys(es).forEach(i=>delete es[i]);sec=null;f.hidden=true;ciz();};
  ciz();
  function acikla(){const c=S.kural(2);
    S.soru(c,"4 numaralı oyuncunun eşi neden 14 ya da 36 olamadı?",
      ["14 ve 36 da 2'ye bölünür","14 ve 36, 4'ten büyüktür","14 ve 36 asal sayı değildir"],
      "4 ile 14'ün ve 4 ile 36'nın ortak böleni 2'dir. 9 da asal değildir ama 4 ile aralarında asaldır.",()=>
    S.soru(c,"24 numaralı oyuncunun eşinin numarası için hangisi doğrudur?",
      ["2'ye de 3'e de bölünmemelidir","Tek sayı olması yeterlidir","24'ten büyük olmalıdır"],
      "24 = 2<sup>3</sup> · 3. Eşin numarası 2'ye ya da 3'e bölünürse ortak bölen olur; 9 tek sayıdır ama 3'e bölünür.",meydan));}
  function meydan(){const m=S.son();
    S.sayi(m,yaz(["Ece'nin forma numarası 30'dur."])+soruKut("1'den 20'ye kadar olan numaralardan (1 ve 20 dâhil) kaç tanesi Ece'nin numarasıyla aralarında asaldır?"),6,
      "30 = 2 · 3 · 5. 2'ye, 3'e ve 5'e bölünmeyen numaralar: 1, 7, 11, 13, 17, 19.","",
      ()=>S.bitir("Bir sayıyla aralarında asal olan sayılar, o sayının <b>hiçbir asal çarpanına bölünmeyen</b> sayılardır. Asal çarpanı çok olan sayılar (24 = 2<sup>3</sup> · 3 gibi) için uygun eş bulmak daha zordur."));}
};

/* 18 · TERAZİ AKTARIMI */
const e_terazi=p=>{const S=notr(adimli(p));const T=36;
  const k=S.ac(1,{ne:"İki kap arasında un aktararak kaplardaki miktarların aralarında asal olduğu durumları bulacaksınız.",
    durum:"Toplam <b>36 kg</b> un iki kaba konmuştur: başta 1. kapta <b>20 kg</b>, 2. kapta <b>16 kg</b> un var. Kaplar arasında yalnız tam kilogram un aktarılır; toplam hep 36 kg kalır. Her kapta en az 1 kg un bulunur.",
    nasil:["Aktarma düğmeleriyle bir kaptan diğerine 1 kg ya da 5 kg un aktarınız.","Terazinin altında iki miktarın EBOB'u yazar; miktarlar aralarında asalsa terazinin üstündeki ışık yeşil yanar.","Her durum deney defterine yazılır."],biter:bitG(2)});
  S.tahmin(k,"1. kapta kaç kg un olursa kaplardaki miktarlar aralarında asal olur?",[[18,"18 kg"],[15,"15 kg"],[13,"13 kg"],[24,"24 kg"]],13,"1. kapta 13 kg, 2. kapta 23 kg un olursa EBOB(13, 23) = 1 olur.");
  k.insertAdjacentHTML("beforeend",`<div class="stage"></div><div class="row"><button class="ghost" data-d="-5">1. kaptan 2. kaba 5 kg</button><button class="ghost" data-d="-1">1. kaptan 2. kaba 1 kg</button><button class="ghost" data-d="1">2. kaptan 1. kaba 1 kg</button><button class="ghost" data-d="5">2. kaptan 1. kaba 5 kg</button></div><p class="durum sn"></p>`);
  const st=k.querySelector(".stage"),sn=k.querySelector(".sn");let a=20;
  const D=defter(k,["1. kap (kg)","2. kap (kg)","EBOB","Aralarında asal mı?"]);
  const asallar=()=>D.satirlar.map(s=>+s.key).filter(x=>gcd(x,T-x)===1);
  const G=gorevler(k,[{m:"Miktarların aralarında asal olduğu <b>3 farklı</b> durum bulunuz.",ok:()=>asallar().length>=3},
    {m:"1. kapta <b>10 kg'dan az</b> un varken miktarların aralarında asal olduğu <b>bütün</b> durumları bulunuz.",ok:()=>[1,5,7].every(x=>asallar().includes(x)),s:()=>"1. kapta 1 kg, 5 kg ya da 7 kg un"}],acikla);
  function ciz(){const b=T-a,g=gcd(a,b);const sv=svgEl(560,312);
    const th=(b-a)/T*0.35,co=Math.cos(th),si=Math.sin(th),U1=[280-170*co,70-170*si],U2=[280+170*co,70+170*si];
    const kap=([x,y],m,ad)=>{const py=y+150,hh=Math.max(4,Math.round(m/T*84));return `<line x1="${x-62}" y1="${py}" x2="${x}" y2="${y}" stroke="${css('--muted')}" stroke-width="2"/><line x1="${x+62}" y1="${py}" x2="${x}" y2="${y}" stroke="${css('--muted')}" stroke-width="2"/>
      <path d="M${x-48} ${py-96} L${x-40} ${py} H${x+40} L${x+48} ${py-96}" fill="${css('--card')}" stroke="${css('--ink')}" stroke-width="3" stroke-linejoin="round"/>
      <rect x="${x-39}" y="${py-hh}" width="78" height="${hh}" fill="#f1e3c6" stroke="#c9a66b"/>
      <line x1="${x-70}" y1="${py}" x2="${x+70}" y2="${py}" stroke="${css('--ink')}" stroke-width="5" stroke-linecap="round"/>
      <text x="${x}" y="${py+26}" text-anchor="middle" font-size="20" font-weight="800">${ad}: ${m} kg</text>`;};
    sv.innerHTML=`<path d="M280 70 L252 266 H308 Z" fill="${css('--line')}"/><rect x="226" y="264" width="108" height="10" rx="4" fill="${css('--muted')}"/>
      <line x1="${U1[0]}" y1="${U1[1]}" x2="${U2[0]}" y2="${U2[1]}" stroke="#868e96" stroke-width="8" stroke-linecap="round"/><circle cx="280" cy="70" r="8" fill="${css('--ink')}"/>`+

  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

<script>
(function(){
const D=document, H=D.documentElement, $=s=>D.querySelector(s);
const ANAHTAR="kb-ayar", ILR="kb-ilerleme:"+(D.title||location.pathname);
const oku=(k,v)=>{try{const s=localStorage.getItem(k);return s===null?v:JSON.parse(s)}catch(e){return v}};
const yaz=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const VARS={ses:true,boy:0,karsit:false,rahat:false,azhareket:matchMedia("(prefers-reduced-motion: reduce)").matches,tema:""};
let A=Object.assign({},VARS,oku(ANAHTAR,{}));

/* --- Düzen: başlık bandı, yan liste, gezinti --- */
const wrap=$(".wrap");
if(wrap){
  const h1=wrap.querySelector("h1"); let ust=h1; while(ust&&ust.parentElement!==wrap)ust=ust.parentElement;
  let hero;
  if(ust&&ust!==h1&&!ust.matches(".eyebrow,.lead")){ hero=ust; hero.classList.add("kb-hero"); wrap.prepend(hero); }
  else { hero=D.createElement("header"); hero.className="kb-hero";
    [...wrap.children].filter(e=>e.matches(".eyebrow,h1,.lead")).forEach(e=>hero.appendChild(e)); wrap.prepend(hero); }
  const idx=$("#index"), pan=$("#panel");
  if(idx&&pan){
    const d=D.createElement("div"); d.className="kb-duzen";
    const yan=D.createElement("aside"); yan.className="kb-yan"; yan.setAttribute("aria-label","Etkinlik listesi");
    const ana=D.createElement("main");
    pan.before(d); yan.appendChild(idx); ana.appendChild(pan); d.append(yan,ana);
    const g=D.createElement("nav"); g.className="kb-gezinti"; g.setAttribute("aria-label","Etkinlikler arası geçiş");
    g.innerHTML='<button class="ghost" id="kbOnce">‹ Önceki</button><span id="kbSira"></span><button class="primary" id="kbSonra">Sonraki ›</button>';
    ana.appendChild(g);
    const pr=D.createElement("div"); pr.className="kb-ilerleme"; pr.innerHTML='<div class="kb-bar"><i id="kbBar"></i></div><span id="kbSay"></span>'; hero.appendChild(pr);
  }
}
const linkler=()=>[...D.querySelectorAll("#index a[data-i]")];
const simdiki=()=>{const a=$('#index a[aria-current="true"]');return a?+a.dataset.i:-1};
let tamam=new Set(oku(ILR,[]));
function ilerleme(){const L=linkler(); if(!L.length)return;
  L.forEach(a=>a.classList.toggle("kb-tamam",tamam.has(+a.dataset.i)));
  const n=L.filter(a=>tamam.has(+a.dataset.i)).length;
  const b=$("#kbBar"); if(b)b.style.width=(100*n/L.length)+"%";
  const s=$("#kbSay"); if(s)s.textContent=n+" / "+L.length+" etkinlik tamamlandı";
  const i=simdiki(), r=$("#kbSira"); if(r)r.textContent=(i+1)+" / "+L.length;
  const o=$("#kbOnce"), z=$("#kbSonra"); if(o)o.disabled=i<=0; if(z)z.disabled=i>=L.length-1;}
let gecis=0;
function git(d){const L=linkler(), i=simdiki()+d; if(L[i]){gecis=Date.now(); L[i].click();}}
$("#kbOnce")&&($("#kbOnce").onclick=()=>git(-1)); $("#kbSonra")&&($("#kbSonra").onclick=()=>git(1));
const idx=$("#index"); if(idx){ idx.addEventListener("click",()=>{gecis=Date.now()},true);
  new MutationObserver(()=>setTimeout(ilerleme,0)).observe(idx,{subtree:true,attributes:true,attributeFilter:["aria-current"]}); }
window.addEventListener("hashchange",()=>{gecis=Date.now()});
setTimeout(ilerleme,50);

/* --- Ses --- */
let ac=null;
function ton(f,t0,sure,tip,hacim){const c=ac;const o=c.createOscillator(),g=c.createGain();o.type=tip;o.frequency.setValueAtTime(f[0],c.currentTime+t0);
  if(f[1])o.frequency.exponentialRampToValueAtTime(f[1],c.currentTime+t0+sure);
  g.gain.setValueAtTime(0.0001,c.currentTime+t0);g.gain.exponentialRampToValueAtTime(hacim,c.currentTime+t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t0+sure);
  o.connect(g).connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+sure+0.02);}
function sesCal(tur){ if(!A.ses)return; try{ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended")ac.resume();
  if(tur==="ok"){ton([659],0,.13,"sine",.22);ton([880],.11,.16,"sine",.22);ton([1319],.22,.22,"sine",.12);}
  else if(tur==="no"){ton([260,180],0,.28,"triangle",.2);}
  else ton([1200],0,.04,"sine",.06); }catch(e){} }
function kutla(el){ if(A.azhareket||!el)return; const r=el.getBoundingClientRect(); const k=D.createElement("div"); k.className="kb-kutlama";
  k.style.left=(r.left+Math.min(60,r.width/2))+"px"; k.style.top=(r.top+r.height/2)+"px";
  const renk=["var(--p1)","var(--p2)","var(--p3)","var(--p4)","var(--p5)","var(--p6)"];
  for(let i=0;i<18;i++){const p=D.createElement("i");const a=Math.random()*Math.PI*2,m=50+Math.random()*70;
    p.style.background=renk[i%6];p.style.setProperty("--x",Math.cos(a)*m+"px");p.style.setProperty("--y",(Math.sin(a)*m-30)+"px");k.appendChild(p);}
  D.body.appendChild(k); setTimeout(()=>k.remove(),900); }

/* Doğru / yanlış geri bildirimini yakala: etkinlik kodu fb(...) ya da .ok/.no sınıfı kullanır */
let sonEylem=0; ["click","keydown"].forEach(t=>D.addEventListener(t,e=>{ if(t==="click"||e.key==="Enter"||e.key===" ")sonEylem=Date.now(); },true));
let kuyruk=[], zam=null;
const has=(s,t)=>(" "+(s||"")+" ").includes(" "+t+" ");
new MutationObserver(ms=>{ const now=Date.now(); if(now-sonEylem>900||now-gecis<450)return;
  ms.forEach(m=>{ const el=m.target; if(!(el instanceof Element)||el.closest(".kb-menu,.kb-yonerge,#index"))return;
    const fb=el.classList.contains("fb"), ok=el.classList.contains("ok"), no=el.classList.contains("no");
    if(!ok&&!no)return; if(!fb&&((ok&&has(m.oldValue,"ok"))||(no&&has(m.oldValue,"no"))))return;
    kuyruk.push({el,fb,ok}); });
  if(kuyruk.length&&!zam)zam=setTimeout(()=>{ const f=kuyruk.filter(x=>x.fb).pop(); let ok, el;
      if(f){ok=f.ok;el=f.el}else{ok=!kuyruk.some(x=>!x.ok);el=kuyruk[kuyruk.length-1].el}
      kuyruk=[];zam=null; sesCal(ok?"ok":"no");
      if(ok){ kutla(el); const i=simdiki(); if(i>=0&&(f||!$("#panel .fb"))){tamam.add(i);yaz(ILR,[...tamam]);ilerleme();} }
      const d=$("#kbDuyuru"); if(d)d.textContent=ok?"Doğru.":"Yeniden deneyiniz."; },110);
}).observe(D.body,{subtree:true,attributes:true,attributeFilter:["class"],attributeOldValue:true});

/* --- Ayarları uygula --- */
function uygula(){ H.classList.toggle("kb-sesyok",!A.ses);
  ["karsit","rahat","azhareket"].forEach(k=>H.classList.toggle("kb-"+k,!!A[k]));
  H.classList.toggle("kb-y1",A.boy===1); H.classList.toggle("kb-y2",A.boy===2);
  if(A.tema)H.setAttribute("data-theme",A.tema); else H.removeAttribute("data-theme");
  const s=$("#kbSes"); s.setAttribute("aria-pressed",A.ses); $("#kbSesY").textContent=A.ses?"Ses açık":"Ses kapalı";
  s.querySelector(".on").style.display=A.ses?"":"none"; s.querySelector(".off").style.display=A.ses?"none":"";
  D.querySelectorAll(".kb-anahtar").forEach(b=>b.setAttribute("aria-checked",!!A[b.dataset.k]));
  D.querySelectorAll("#kbBoy button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.v===A.boy));
  D.querySelectorAll("#kbTema button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===A.tema));
  yaz(ANAHTAR,A); }
uygula();
const dug=$("#kbDugme"), men=$("#kbMenu");
function menu(ac_){ men.hidden=!ac_; dug.setAttribute("aria-expanded",ac_); if(ac_)men.querySelector("button").focus(); }
dug.onclick=()=>menu(men.hidden);
D.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!men.hidden){menu(false);dug.focus();} });
D.addEventListener("click",e=>{ if(!men.hidden&&!men.contains(e.target)&&!dug.contains(e.target))menu(false); });
$("#kbSes").onclick=()=>{A.ses=!A.ses;uygula();sesCal("ok");};
D.querySelectorAll(".kb-anahtar").forEach(b=>b.onclick=()=>{A[b.dataset.k]=!A[b.dataset.k];uygula();});
D.querySelectorAll("#kbBoy button").forEach(b=>b.onclick=()=>{A.boy=+b.dataset.v;uygula();});
D.querySelectorAll("#kbTema button").forEach(b=>b.onclick=()=>{A.tema=b.dataset.v;uygula();});
$("#kbSifir").onclick=()=>{A=Object.assign({},VARS);uygula();};
const tam=$("#kbTam"); if(!D.fullscreenEnabled)tam.hidden=true;
tam.onclick=()=>{ try{ D.fullscreenElement?D.exitFullscreen():H.requestFullscreen(); }catch(e){} };

/* --- Yönerge ve sesli okuma --- */
const metin=el=>{ if(!el)return ""; const c=el.cloneNode(true); c.querySelectorAll(".frac").forEach(f=>{const s=f.querySelectorAll("span"); if(s.length>1)f.replaceWith(s[0].textContent+"/"+s[1].textContent);}); return c.textContent.replace(/\s+/g," ").trim(); };
const PAYDA={2:"ikide",3:"üçte",4:"dörtte",5:"beşte",6:"altıda",7:"yedide",8:"sekizde",9:"dokuzda",10:"onda",12:"on ikide",20:"yirmide",100:"yüzde"};
const okunus=t=>String(t).replace(/(−|-)?(\d+)\/(\d+)/g,(m,sg,a,b)=>(sg?"eksi ":"")+(PAYDA[b]||b+"'te")+" "+a).replace(/\|([^|]+)\|/g,"$1'in mutlak değeri").replace(/(^|[\s(])−\s?(\d)/g,"$1eksi $2").replace(/°C/g," derece");
const kesH=t=>String(t).replace(/(−|-)?(\d+)\/(\d+)/g,(m,sg,a,b)=>(sg?"−":"")+'<span class="frac"><span>'+a+'</span><span>'+b+'</span></span>');
const sesPuan=v=>(/natural|online|neural/i.test(v.name)?4:/google/i.test(v.name)?3:/enhanced|premium|geliş|siri/i.test(v.name)?3:1);
function yonergeMetni(){ const p=$("#panel")||D.body, h=p.querySelector("h2"), g=[];
  p.querySelectorAll(".intro,.task").forEach(e=>{const t=metin(e); if(t&&!g.includes(t)&&g.length<2)g.push(t);});
  if(!g.length&&$(".lead"))g.push(metin($(".lead")));
  return {baslik:metin(h)||D.title, gorev:g}; }
function yonergeAc(){ const y=yonergeMetni(); $("#kbYB").textContent=y.baslik;
  $("#kbYIc").innerHTML='<p class="gorev"></p><ol><li>Görevi okuyunuz; şekil ya da sayı doğrusu üzerinde deneme yapabilirsiniz.</li><li>Cevabınızı yazıp ya da seçip <b>Kontrol edin</b> düğmesine basınız.</li><li>Geri bildirimi okuyunuz. Yanlışsa ipucuyla yeniden deneyiniz.</li><li><b>Yeni soru</b> ile aynı etkinliği farklı sayılarla tekrarlayabilir, <b>Sonraki</b> ile ilerleyebilirsiniz.</li></ol><p style="font-size:14px;color:var(--muted)">Klavye: Tab ile düğmeler arasında geçiniz, Enter ile seçiniz. Esc menüyü kapatır.</p>';
  $("#kbYIc .gorev").innerHTML=kesH(y.gorev.join(" ").replace(/[<>&]/g,""));
  const d=$("#kbYonerge"); menu(false); if(d.showModal)d.showModal(); else d.setAttribute("open",""); }
$("#kbYon").onclick=yonergeAc;
$("#kbYKapat").onclick=()=>{ const d=$("#kbYonerge"); speechSynthesis&&speechSynthesis.cancel(); d.close?d.close():d.removeAttribute("open"); };
const konusabilir="speechSynthesis" in window;
function sesliOku(t){ if(!konusabilir)return; speechSynthesis.cancel();
  const v=speechSynthesis.getVoices().filter(v=>/^tr/i.test(v.lang)).sort((a,b)=>sesPuan(b)-sesPuan(a))[0];
  (okunus(t).match(/[^.!?]+[.!?]?/g)||[t]).forEach(c=>{ const u=new SpeechSynthesisUtterance(c.trim()); u.lang="tr-TR"; u.rate=.95; if(v)u.voice=v; speechSynthesis.speak(u); }); }
function okuPanel(){ const y=yonergeMetni(); sesliOku(y.baslik+". "+y.gorev.join(" ")); }

<script id="kesir-cizgi">
/* ANA_KURALLAR §4.y-3: Etkinliklerde bütün kesirler kesir çizgisiyle (alt alta pay/payda) gösterilir. Düz yazılmış a/b biçimleri otomatik dönüştürülür. */
(function(){
  if (window.__kesirCizgi) return; window.__kesirCizgi = 1;
  const RX = /(^|[^\w\/.,:%])([−-])?(?:(\d+) )?(\d{1,4})\/(\d{1,4})(?![\w\/.,]\d|\w)/g;
  const ATLA = "script,style,svg,textarea,input,select,code,.ilr,.frac,[data-duz]";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function donustur(kok){
    if (!kok || !kok.nodeType) return;
    if (kok.nodeType === 3) kok = kok.parentElement;
    if (!kok || (kok.closest && kok.closest(ATLA))) return;
    const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      if (!/\d\/\d/.test(t.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = t.parentElement; if (!p || p.closest(ATLA)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const L = []; let t; while ((t = w.nextNode())) L.push(t);
    L.forEach(t => {
      let deg = false;
      const h = esc(t.nodeValue).replace(RX, (m, a, s, tam, p, q) => { deg = true;
        return a + (s ? "−" : "") + (tam ? tam + " " : "") + '<span class="frac"><span>' + p + "</span><span>" + q + "</span></span>"; });
      if (!deg) return;
      const k = document.createElement("span"); k.innerHTML = h; t.replaceWith(...k.childNodes);
    });
  }
  let bekleyen = new Set(), plan = 0;
  const calis = () => { plan = 0; const b = bekleyen; bekleyen = new Set(); b.forEach(donustur); };
  const gozcu = new MutationObserver(ms => { ms.forEach(m => {
      if (m.type === "characterData") bekleyen.add(m.target); else m.addedNodes.forEach(n => bekleyen.add(n)); });
    if (!plan) plan = requestAnimationFrame(calis); });
  const bas = () => { donustur(document.body); gozcu.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bas); else bas();
  const st = document.createElement("style");
  st.textContent = ".frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}.frac>span{display:block;text-align:center;padding:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor}";
  document.head.appendChild(st);
})();
</script>
