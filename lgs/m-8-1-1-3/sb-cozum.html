" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">İki sayfa numarasının çarpımı: 1722</text></svg>", "son": "<p>Kaan, iki sayfa numarasının en küçük ortak katını bulmak istemektedir.</p>", "k": "Buna göre, iki sayfa numarasının en küçük ortak katı kaçtır?", "sec": ["41", "83", "861", "1722"], "secg": null, "c": "D", "a": ["Ardışık iki sayı aralarında asaldır; aralarında asal iki sayının EKOK'u çarpımlarına eşittir.", "Sayfa numaralarının çarpımı 1722 olduğundan EKOK da 1722'dir. (Sayfalar 41 ve 42'dir; bunları bulmak gerekmez.)", "EKOK = 1722."], "t": "861: çarpım 2'ye bölünmüş, ardışık sayıların ortak böleni 2 sanılmış; 41 ve 83: sayfa numaralarından biri ya da toplamları bulunmuş.", "d": "Ardışık iki sayı her zaman aralarında asaldır; EKOK'ları çarpımlarına eşittir. Sayfaları bulmadan da cevap verebilirsiniz.", "ses": "b11"}, {"no": 12, "on": "<p>Bir basketbol antrenöründe beş oyuncunun formaları aşağıda gösterilmiştir. Antrenör bir alıştırma için bu oyunculardan üç kişilik bir grup seçecektir.</p>", "g": "<svg viewBox=\"0 0 620 170\" width=\"620\" height=\"170\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><path d=\"M40,40 l20,-16 h40 l20,16 l14,26 l-18,8 v84 h-72 v-84 l-18,-8 Z\" fill=\"#e7f5ff\" stroke=\"#1c5fbf\" stroke-width=\"1.8\"/><text x=\"80.0\" y=\"104.0\" font-family=\"Liberation Sans\" font-size=\"30\" font-weight=\"800\" fill=\"#1c5fbf\" text-anchor=\"middle\">4</text><path d=\"M160,40 l20,-16 h40 l20,16 l14,26 l-18,8 v84 h-72 v-84 l-18,-8 Z\" fill=\"#e7f5ff\" stroke=\"#1c5fbf\" stroke-width=\"1.8\"/><text x=\"200.0\" y=\"104.0\" font-family=\"Liberation Sans\" font-size=\"30\" font-weight=\"800\" fill=\"#1c5fbf\" text-anchor=\"middle\">7</text><path d=\"M280,40 l20,-16 h40 l20,16 l14,26 l-18,8 v84 h-72 v-84 l-18,-8 Z\" fill=\"#e7f5ff\" stroke=\"#1c5fbf\" stroke-width=\"1.8\"/><text x=\"320.0\" y=\"104.0\" font-family=\"Liberation Sans\" font-size=\"30\" font-weight=\"800\" fill=\"#1c5fbf\" text-anchor=\"middle\">9</text><path d=\"M400,40 l20,-16 h40 l20,16 l14,26 l-18,8 v84 h-72 v-84 l-18,-8 Z\" fill=\"#e7f5ff\" stroke=\"#1c5fbf\" stroke-width=\"1.8\"/><text x=\"440.0\" y=\"104.0\" font-family=\"Liberation Sans\" font-size=\"30\" font-weight=\"800\" fill=\"#1c5fbf\" text-anchor=\"middle\">10</text><path d=\"M520,40 l20,-16 h40 l20,16 l14,26 l-18,8 v84 h-72 v-84 l-18,-8 Z\" fill=\"#e7f5ff\" stroke=\"#1c5fbf\" stroke-width=\"1.8\"/><text x=\"560.0\" y=\"104.0\" font-family=\"Liberation Sans\" font-size=\"30\" font-weight=\"800\" fill=\"#1c5fbf\" text-anchor=\"middle\">15</text></svg>", "son": "<p>Antrenörün kuralına göre gruptaki her iki oyuncunun forma numaraları aralarında asal olmalıdır.</p>", "k": "Buna göre, antrenör kaç farklı grup seçebilir?", "sec": ["2", "3", "4", "5"], "secg": null, "c": "B", "a": ["Aralarında asal OLMAYAN ikililer bulunur: 4 ile 10 (2), 9 ile 15 (3), 10 ile 15 (5). Bu ikililer aynı grupta olamaz.", "Üçlüler tek tek denetlenir: {4, 7, 9}, {4, 7, 15} ve {7, 9, 10} uygundur; 10 ile 15 birlikte olamayacağı için 10'lu ve 15'li öteki üçlüler elenir.", "Antrenör 3 farklı grup seçebilir."], "t": "4: {4, 9, 15} de alınmış, 9 ile 15'in ortak böleni 3'tür; 5: {7, 10, 15} ve {4, 9, 15} de alınmış; 2: {7, 9, 10} gözden kaçmış, 9 ile 10 asal olmadığı hâlde aralarında asaldır.", "d": "Önce aralarında asal OLMAYAN ikilileri bulun (4–10, 9–15, 10–15). Bu ikililerden biri bulunan grupları eleyin; asal olmayan iki sayı da aralarında asal olabilir (9 ve 10).", "ses": "b12"}, {"no": 13, "on": "<p>Bir durağın bilgi ekranında dört otobüs hattının sefer aralıkları aşağıdaki gibi gösterilmiştir. Dört hattın otobüsleri saat 07.00'de bu duraktan birlikte kalkmıştır.</p>", "g": "<svg viewBox=\"0 0 640 216\" width=\"640\" height=\"216\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"150.0\" y=\"10.0\" width=\"340.0\" height=\"200.0\" rx=\"10\" fill=\"#ffffff\" stroke=\"#d9480f\" stroke-width=\"2.4\"/><rect x=\"150.0\" y=\"10.0\" width=\"340.0\" height=\"38.0\" rx=\"10\" fill=\"#d9480f\" stroke=\"none\" stroke-width=\"0\"/><rect x=\"150.0\" y=\"34.0\" width=\"340.0\" height=\"14.0\" rx=\"0\" fill=\"#d9480f\" stroke=\"none\" stroke-width=\"0\"/><text x=\"320.0\" y=\"36.0\" font-family=\"Liberation Sans\" font-size=\"16\" font-weight=\"800\" fill=\"#ffffff\" text-anchor=\"middle\">DURAK BİLGİ EKRANI</text><text x=\"250.0\" y=\"70.0\" font-family=\"Liberation Sans\" font-size=\"15\" font-weight=\"800\" fill=\"#5c6370\" text-anchor=\"middle\">Hat</text><text x=\"400.0\" y=\"70.0\" font-family=\"Liberation Sans\" font-size=\"15\" font-weight=\"800\" fill=\"#5c6370\" text-anchor=\"middle\">Sefer aralığı</text><line x1=\"170.0\" y1=\"78.0\" x2=\"470.0\" y2=\"78.0\" stroke=\"#111111\" stroke-width=\"1.2\"/><text x=\"250.0\" y=\"104.0\" font-family=\"Liberation Sans\" font-size=\"17\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">A hattı</text><text x=\"400.0\" y=\"104.0\" font-family=\"Liberation Sans\" font-size=\"17\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">6 dakika</text><text x=\"250.0\" y=\"132.0\" font-family=\"Liberation Sans\" font-size=\"17\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">B hattı</text><text x=\"400.0\" y=\"132.0\" font-family=\"Liberation Sans\" font-size=\"17\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">8 dakika</text><text x=\"250.0\" y=\"160.0\" font-family=\"Liberation Sans\" font-size=\"17\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">C hattı</text><text x=\"400.0\" y=\"160.0\" font-family=\"Liberation Sans\" font-size=\"17\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">9 dakika</text><text x=\"250.0\" y=\"188.0\" font-family=\"Liberation Sans\" font-size=\"17\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">D hattı</text><text x=\"400.0\" y=\"188.0\" font-family=\"Liberation Sans\" font-size=\"17\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">10 dakika</text></svg>", "son": "<p>Otobüsler gün boyunca sefer aralıklarına uygun olarak duraktan kalkmaktadır.</p>", "k": "Buna göre, aşağıdaki hat ikililerinden hangisinin otobüsleri saat 07.00'den sonra duraktan yeniden birlikte en geç kalkar?", "sec": ["A ve B hatları", "A ve C hatları", "B ve C hatları", "C ve D hatları"], "secg": null, "c": "D", "a": ["İki hattın otobüslerinin yeniden birlikte kalkması için geçen süre, sefer aralıklarının EKOK'udur.", "A–B: EKOK(6, 8) = 24; A–C: EKOK(6, 9) = 18; B–C: 8 ile 9 aralarında asal → 72; C–D: 9 ile 10 aralarında asal → 90 dakika.", "En geç C ve D hatları birlikte kalkar (08.30'da)."], "t": "B ve C hatları: aralarında asal ama çarpımları 72'dir, 90'dan küçüktür; A ve B ile A ve C: ortak bölenleri olduğu için EKOK küçüktür.", "d": "Aralarında asal iki sefer aralığının EKOK'u çarpımlarıdır; ortak böleni olanlarda EKOK daha küçüktür. Her ikili için EKOK'u ayrı ayrı hesaplayın.", "ses": "b13"}, {"no": 14, "on": "<p>Bir okulun fotoğraf sergisi için 84 fotoğraf, bir panoya satırlar ve sütunlar hâlinde asılacaktır. Her satırda eşit sayıda fotoğraf olacak ve hiç fotoğraf artmayacaktır.</p>", "g": "<svg viewBox=\"0 0 680 230\" width=\"680\" height=\"230\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"20.0\" y=\"10.0\" width=\"400.0\" height=\"210.0\" rx=\"6\" fill=\"#c69c6d\" stroke=\"#8a6a35\" stroke-width=\"3\"/><rect x=\"34.0\" y=\"24.0\" width=\"372.0\" height=\"182.0\" rx=\"4\" fill=\"#f3e3c3\" stroke=\"#a07b45\" stroke-width=\"1.5\"/><rect x=\"50.0\" y=\"40.0\" width=\"22.0\" height=\"18.0\" rx=\"2\" fill=\"#ffffff\" stroke=\"#868e96\" stroke-width=\"1\"/><rect x=\"80.0\" y=\"40.0\" width=\"22.0\" height=\"18.0\" rx=\"2\" fill=\"#ffffff\" stroke=\"#868e96\" stroke-width=\"1\"/><rect x=\"110.0\" y=\"40.0\" width=\"22.0\" height=\"18.0\" rx=\"2\" fill=\"#ffffff\" stroke=\"#868e96\" stroke-width=\"1\"/><rect x=\"140.0\" y=\"40.0\" width=\"22.0\" height=\"18.0\" rx=\"2\" fill=\"#ffffff\" stroke=\"#868e96\" stroke-width=\"1\"/><rect x=\"170.0\" y=\"40.0\" width=\"22 =\"Liberation Sans\" font-size=\"26\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">…</text><text x=\"220.0\" y=\"200.0\" font-family=\"Liberation Sans\" font-size=\"12\" font-weight=\"700\" fill=\"#5c6370\" text-anchor=\"middle\">Fotoğraflar asılmadan önce pano (temsilî düzen)</text><rect x=\"450.0\" y=\"50.0\" width=\"210.0\" height=\"120.0\" rx=\"8\" fill=\"#ffffff\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"555.0\" y=\"84.0\" font-family=\"Liberation Sans\" font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Sergi notu</text><text x=\"555.0\" y=\"120.0\" font-family=\"Liberation Sans\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">84 fotoğraf asılacak</text><text x=\"555.0\" y=\"148.0\" font-family=\"Liberation Sans\" font-size=\"13\" font-weight=\"700\" fill=\"#5c6370\" text-anchor=\"middle\">(satırlar ve sütunlar)</text></svg>", "son": "<p>Satır sayısı en az 2 olacak ve sütun sayısından az olacaktır. Satır sayısı ile sütun sayısı aralarında asal olacaktır.</p>", "k": "Buna göre, fotoğraflar kaç farklı düzende asılabilir?", "sec": ["3", "4", "6", "12"], "secg": null, "c": "A", "a": ["Satır sayısı · sütun sayısı = 84 = 2² · 3 · 7. Aralarında asal olmaları için 2² bütün olarak tek bir sayıya gider.", "Satır sayısı sütundan küçük olan ve en az 2 olan ikililer: 3 ile 28, 4 ile 21, 7 ile 12 (2 ile 42 ve 6 ile 14'te 2 ortaktır).", "Fotoğraflar 3 farklı düzende asılabilir."], "t": "4: 1 satırlı düzen de sayılmış; 6: aralarında asallık koşulu unutulmuş; 12: 84'ün bütün pozitif bölenleri sayılmış.", "d": "Satır · sütun = 84'tür. Aralarında asal olmaları için 2² aynı sayıya gitmelidir. Satırın en az 2 ve sütundan az olduğunu unutmayın.", "ses": "b14"}, {"no": 15, "on": "<p>Defne, kenar uzunlukları 13 cm ve 8 cm olan dikdörtgen biçimindeki bir kâğıttan kare parçalar kesecektir. Defne her seferinde elindeki kâğıdın kısa kenarı uzunluğunda bir kare keserek ayıracak, kalan dikdörtgenle devam edecektir.</p>", "g": "<svg viewBox=\"0 0 400 190\" width=\"400\" height=\"190\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"30.0\" y=\"30.0\" width=\"234.0\" height=\"144.0\" rx=\"0\" fill=\"#e7f5ff\" stroke=\"#1c5fbf\" stroke-width=\"2.2\"/><text x=\"147.0\" y=\"22.0\" font-family=\"Liberation Sans\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">13 cm</text><text x=\"274.0\" y=\"107.0\" font-family=\"Liberation Sans\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">8 cm</text><line x1=\"174.0\" y1=\"30.0\" x2=\"174.0\" y2=\"174.0\" stroke=\"#9b1c36\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/><text x=\"102.0\" y=\"108.0\" font-family=\"Liberation Sans\" font-size=\"15\" font-weight=\"700\" fill=\"#9b1c36\" text-anchor=\"middle\">1. kare</text><path d=\"M330,60 l40,-30 l12,10 l-40,30 Z M342,70 l40,30 l-12,10 l-40,-30 Z\" fill=\"#adb5bd\" stroke=\"#111111\" stroke-width=\"1.2\"/><text x=\"360.0\" y=\"140.0\" font-family=\"Liberation Sans\" font-size=\"13\" font-weight=\"700\" fill=\"#5c6370\" text-anchor=\"middle\">makas</text></svg>", "son": "<p>Defne, kâğıdın tamamı kare parçalara ayrılınca işlemi bitirecektir.</p>", "k": "Buna göre, Defne toplam kaç kare parça elde eder?", "sec": ["4", "5", "6", "8"], "secg": null, "c": "C", "a": ["Kesimler sırayla yazılır: 13 · 8'den 8'lik kare → kalan 5 · 8; 5'lik kare → kalan 5 · 3; 3'lük kare → kalan 2 · 3.", "2'lik kare → kalan 2 · 1; 1'lik kare → kalan 1 · 1; bu da 1'lik bir karedir.", "Toplam 6 kare elde edilir. Son karenin kenarı 1 cm'dir; çünkü 13 ile 8 aralarında asaldır (en büyük ortak bölen 1)."], "t": "5: son 1 · 1'lik parça kare sayılmamış; 4: 1'lik kareler hiç sayılmamış; 8: kenarlar farkı kadar 1'lik kare kesileceği sanılmış.", "d": "Her kesimde kısa kenar uzunluğunda kare kesilir. Son kalan 1 · 1'lik parça da bir karedir. Son karenin kenarı, iki kenar uzunluğunun en büyük ortak bölenidir.", "ses": "b15"}, {"no": 16, "on": "<p>Ece'nin iki kav /* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();
