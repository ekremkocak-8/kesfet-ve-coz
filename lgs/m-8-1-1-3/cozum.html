c": "A", "a": ["Kısa parça 9 cm ise uzun parça 50 − 9 = 41 cm olur; <span class=\"nw\">9 = 3<sup>2</sup></span> ve 41 asal sayıdır, ortak asal çarpan yoktur → aralarında asal.", "15 cm ise parçalar 15 ve 35 olur, ikisi de 5'e bölünür.", "18 cm ise 18 ve 32, 20 cm ise 20 ve 30 çift sayıdır; iki çift sayı aralarında asal olamaz."], "t": "15: iki tek sayının aralarında asal olduğu sanılmış; 18 ve 20: yalnız kısa parçanın asal olup olmadığına bakılmış ya da sayıların rakamlarına bakılmış.", "d": "İki parçanın toplamı 50 cm'dir; kısa parçayı seçince uzun parçayı da hesaplayıp iki uzunluğu birlikte kontrol ediniz. İki tek sayı da ortak bölene sahip olabilir.", "ses": "b03"}, {"no": 4, "on": "<p>Bir okul kantininde bir hafta boyunca her gün satılan poğaça sayıları aşağıdaki sütun grafiğinde gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 416 216.0\" width=\"416\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><text x=\"208.0\" y=\"17.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">Grafik: Kantinde günlere göre satılan poğaça sayıları</text><line x1=\"40.0\" y1=\"164.0\" x2=\"44.0\" y2=\"164.0\" stroke=\"#000000\" stroke-width=\"1.4\"/><text x=\"37.0\" y=\"168.3\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"600\" fill=\"#000000\" text-anchor=\"end\">10</text><line x1=\"40.0\" y1=\"138.0\" x2=\"44.0\" y2=\"138.0\" stroke=\"#000000\" stroke-width=\"1.4\"/><text x=\"37.0\" y=\"142.3\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"600\" fill=\"#000000\" text-anchor=\"end\">20</text><line x1=\"40.0\" y1=\"112.0\" x2=\"44.0\" y2=\"112.0\" stroke=\"#000000\" stroke-width=\"1.4\"/><text x=\"37.0\" y=\"116.3\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"600\" fill=\"#000000\" text-anchor=\"end\">30</text><line x1=\"40.0\" y1=\"86.0\" x2=\"44.0\" y2=\"86.0\" stroke=\"#000000\" stroke-width=\"1.4\"/><text x=\"37.0\" y=\"90.3\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"600\" fill=\"#000000\" text-anchor=\"end\">40</text><line x1=\"40.0\" y1=\"60.0\" x2=\"44.0\" y2=\"60.0\" stroke=\"#000000\" stroke-width=\"1.4\"/><text x=\"37.0\" y=\"64.3\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"600\" fill=\"#000000\" text-anchor=\"end\">50</text><text x=\"37.0\" y=\"194.3\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"600\" fill=\"#000000\" text-anchor=\"end\">0</text><line x1=\"44.0\" y1=\"190.0\" x2=\"384.0\" y2=\"190.0\" stroke=\"#000000\" stroke-width=\"1.4\"/><polygon points=\"384.0,190.0 376.0,194.0 376.0,186.0\" fill=\"#000000\"/><line x1=\"44.0\" y1=\"190.0\" x2=\"44.0\" y2=\"48.0\" stroke=\"#000000\" stroke-width=\"1.4\"/><polygon points=\"44.0,48.0 48.0,56.0 40.0,56.0\" fill=\"#000000\"/><text x=\"389.0\" y=\"194.5\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Gün</text><text x=\"44.0\" y=\"42.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">Poğaça sayısı</text><rect x=\"62.0\" y=\"91.2\" width=\"34.0\" height=\"98.8\" rx=\"0\" fill=\"#e6f4f7\" stroke=\"#1f7a8c\" stroke-width=\"1.4\"/><text x=\"79.0\" y=\"208.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">Pazartesi</text><text x=\"79.0\" y=\"86.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">38</text><rect x=\"126.0\" y=\"143.2\" width=\"34.0\" height=\"46.8\" rx=\"0\" fill=\"#e6f4f7\" stroke=\"#1f7a8c\" stroke-width=\"1.4\"/><text x=\"143.0\" y=\"208.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">Salı</text><text x=\"143.0\" y=\"138.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">18</text><rect x=\"190.0\" y=\"127.6\" width=\"34.0\" height=\"62.4\" rx=\"0\" fill=\"#e6f4f7\" stroke=\"#1f7a8c\" stroke-width=\"1.4\"/><text x=\"207.0\" y=\"208.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">Çarşamba</text><text x=\"207.0\" y=\"122.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">24</text><rect x=\"254.0\" y=\"151.0\" width=\"34.0\" height=\"39.0\" rx=\"0\" fill=\"#e6f4f7\" stroke=\"#1f7a8c\" stroke-width=\"1.4\"/><text x=\"271.0\" y=\"208.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">Perşembe</text><text x=\"271.0\" y=\"146.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">15</text><rect x=\"318.0\" y=\"86.0\" width=\"34.0\" height=\"104.0\" rx=\"0\" fill=\"#e6f4f7\" stroke=\"#1f7a8c\" stroke-width=\"1.4\"/><text x=\"335.0\" y=\"208.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">Cuma</text><text x=\"335.0\" y=\"81.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">40</text></svg>", "son": "<p>Kantin görevlisi, satılan poğaça sayıları aralarında asal olan iki günü seçerek bu günlerin satışlarını karşılaştıracaktır.</p>", "k": "Buna göre, görevlinin seçebileceği iki gün aşağıdakilerden hangisidir?", "sec": ["Pazartesi ve Çarşamba", "Salı ve Perşembe", "Çarşamba ve Cuma", "Pazartesi ve Perşembe"], "secg": null, "c": "D", "a": ["Grafiğe göre satışlar: Pazartesi 38, Salı 18, Çarşamba 24, Perşembe 15, Cuma 40.", "Pazartesi ve Çarşamba: 38 ile 24 çift sayıdır.", "Salı ve Perşembe: 18 ile 15'in ikisi de 3'e bölünür.", "Çarşamba ve Cuma: 24 ile 40'ın ortak böleni 8'dir.", "Pazartesi ve Perşembe: 38 = 2 · 19, 15 = 3 · 5; ortak asal çarpan yoktur → aralarında asaldır."], "t": "Salı ve Perşembe: biri tek biri çift olan iki sayının her zaman aralarında asal olduğu sanılmış; öteki seçeneklerde iki çift sayı vardır.", "d": "Önce grafikten her günün satış sayısını doğru okuyunuz. Biri tek, biri çift olan iki sayının her zaman aralarında asal olduğunu sanmayınız; 3 gibi tek bir ortak bölen de olabilir.", "ses": "b04"}, {"no": 5, "on": "<p>Bir aşçılık kursunda dört tatlının tarif kartı hazırlanmıştır. Her kartta, tarifteki şeker miktarının un miktarına oranı kesir olarak yazılmıştır.</p>", "g": "<svg viewBox=\"0 0 340 120\" width=\"340\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8.0\" y=\"8.0\" width=\"74.0\" height=\"104.0\" rx=\"8\" fill=\"#fff9db\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"45.0\" y=\"30.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#1f7a8c\" text-anchor=\"middle\">Kurabiye</text><line x1=\"18.0\" y1=\"40.0\" x2=\"72.0\" y2=\"40.0\" stroke=\"#adb5bd\" stroke-width=\"1\"/><text x=\"45.0\" y=\"66.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">12</text><line x1=\"32.1\" y1=\"71.0\" x2=\"57.9\" y2=\"71.0\" stroke=\"#000000\" stroke-width=\"1.3\"/><text x=\"45.0\" y=\"89.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">20</text><rect x=\"91.0\" y=\"8.0\" width=\"74.0\" height=\"104.0\" rx=\"8\" fill=\"#e7f5ff\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"128.0\" y=\"30.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#1f7a8c\" text-anchor=\"middle\">Kek</text><line x1=\"101.0\" y1=\"40.0\" x2=\"155.0\" y2=\"40.0\" stroke=\"#adb5bd\" stroke-width=\"1\"/><text x=\"128.0\" y=\"66.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">9</text><line x1=\"115.1\" y1=\"71.0\" x2=\"140.9\" y2=\"71.0\" stroke=\"#000000\" stroke-width=\"1.3\"/><text x=\"128.0\" y=\"89.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">24</text><rect x=\"174.0\" y=\"8.0\" width=\"74.0\" height=\"104.0\" rx=\"8\" fill=\"#fff9db\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"211.0\" y=\"30.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#1f7a8c\" text-anchor=\"middle\">Revani</text><line x1=\"184.0\" y1=\"40.0\" x2=\"238.0\" y2=\"40.0\" stroke=\"#adb5bd\" stroke-width=\"1\"/><text x=\"211.0\" y=\"66.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">15</text><line x1=\"198.1\" y1=\"71.0\" x2=\"223.9\" y2=\"71.0\" stroke=\"#000000\" stroke-width=\"1.3\"/><text x=\"211.0\" y=\"89.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">32</text><rect x=\"257.0\" y=\"8.0\" width=\"74.0\" height=\"104.0\" rx=\"8\" fill=\"#e7f5ff\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"294.0\" y=\"30.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#1f7a8c\" text-anchor=\"middle\">Pişmaniye</text><line x1=\"267.0\" y1=\"40.0\" x2=\"321.0\" y2=\"40.0\" stroke=\"#adb5bd\" stroke-width=\"1\"/><text x=\"294.0\" y=\"66.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">14</text><line x1=\"281.1\" y1=\"71.0\" x2=\"306.9\" y2=\"71.0\" stroke=\"#000000\" stroke-width=\"1.3\"/><text x=\"294.0\" y=\"89.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">40</text></svg>", "son": "<p>Kurs öğretmeni, oranı en sade hâliyle yazılmış kartı panoya asacaktır.</p>", "k": "Buna göre, öğretmenin panoya asacağı kart hangi tatlıya aittir?", "sec": ["Kurabiye", "Kek", "Revani", "Pişmaniye"], "secg": null, "c": "C", "a": ["Bir kesrin en sade hâlinde olması için pay ile paydanın aralarında asal olması gerekir.", "<span class=\"frac\"><span>12</span><span>20</span></span> kesrinde 12 ile 20'nin ortak böleni 4; <span class=\"frac\"><span>9</span><span>24</span></span> kesrinde 9 ile 24'ün ortak böleni 3; <span class=\"frac\"><span>14</span><span>40</span></span> kesrinde 14 ile 40'ın ortak böleni 2'dir.", "<span class=\"frac\"><span>15</span><span>32</span></span> kesrinde 15 = 3 · 5, <span class=\"nw\">32 = 2<sup>5</sup></span>; ortak asal çarpan yoktur → en sade hâldedir: Revani."], "t": "Kek: pay ile paydadan biri tek olduğu için sadeleşmeyeceği sanılmış; Pişmaniye ve Kurabiye: pay ve payda büyük olmadığı için sade sanılmış. Doğru kartta pay ve paydanın ikisi de asal sayı değildir.", "d": "Kesrin en sade hâlde olması için pay ile paydanın aralarında asal olması gerekir. Pay ya da paydanın tek olması, kesrin sadeleşmeyeceğini göstermez.", "ses": "b05"}, {"no": 6, "on": "<p>Bir saat atölyesinde birbirine geçmiş iki dişli çark vardır. Büyük çarkın 16, küçük çarkın 9 dişi bulunmaktadır. Çarkların birer dişi boyanmıştır.</p>", "g": "<svg viewBox=\"0 0 340 134\" width=\"340\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"152.8,61.5 152.8,70.5 147.6,72.1 146.0,80.1 150.2,83.6 146.8,91.9 141.4,91.4 136.8,98.2 139.3,103.0 133.0,109.3 128.2,106.8 121.4,111.4 121.9,116.8 113.6,120.2 110.1,116.0 102.1,117.6 100.5,122.8 91.5,122.8 89.9,117.6 81.9,116.0 78.4,120.2 70.1,116.8 70.6,111.4 63.8,106.8 59.0,109.3 52.7,103.0 55.2,98.2 50.6,91.4 45.2,91.9 41.8,83.6 46.0,80.1 44.4,72.1 39.2,70.5 39.2,61.5 44.4,59.9 46.0,51.9 41.8,48.4 45.2,40.1 50.6,40.6 55.2,33.8 52.7,29.0 59.0,22.7 63.8,25.2 70.6,20.6 70.1,15.2 78.4,11.8 81.9,16.0 89.9,14.4 91.5,9.2 100.5,9.2 102.1,14.4 110.1,16.0 113.6,11.8 121.9,15.2 121.4,20.6 128.2,25.2 133.0,22.7 139.3,29.0 136.8,33.8 141.4,40.6 146.8,40.1 150.2,48.4 146.0,51.9 147.6,59.9\" fill=\"#1f7a8c\" fill-opacity=\".18\" stroke=\"#1f7a8c\" stroke-width=\"1.4\"/><circle cx=\"96\" cy=\"66\" r=\"14.560000000000002\" fill=\"#fff\" stroke=\"#1f7a8c\" stroke-width=\"1.4\"/><text x=\"96.0\" y=\"100.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">16 diş</text><polygon points=\"220.7,61.1 220.7,70.9 215.3,72.2 212.5,80.1 215.7,84.5 209.4,92.0 204.5,89.6 197.2,93.8 196.8,99.3 187.2,101.0 185.0,96.0 176.7,94.5 172.9,98.5 164.5,93.6 165.9,88.3 160.6,81.9 155.1,82.4 151.8,73.3 156.3,70.2 156.3,61.8 151.8,58.7 155.1,49.6 160.6,50.1 165.9,43.7 164.5,38.4 172.9,33.5 176.7,37.5 185.0,36.0 187.2,31.0 196.8,32.7 197.2,38.2 204.5,42.4 209.4,40.0 215.7,47.5 212.5,51.9 215.3,59.8\" fill=\"#e8590c\" fill-opacity=\".18\" stroke=\"#e8590c\" stroke-width=\"1.4\"/><circle cx=\"186\" cy=\"66\" r=\"8.4\" fill=\"#fff\" stroke=\"#e8590c\" stroke-width=\"1.4\"/><text x=\"186.0\" y=\"88.5\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">9 diş</text><circle cx=\"153.0\" cy=\"66.0\" r=\"4.5\" fill=\"#c2255c\" stroke=\"#c2255c\" stroke-width=\"1\"/><circle cx=\"151.0\" cy=\"66.0\" r=\"4.5\" fill=\"#c2255c\" stroke=\"#c2255c\" stroke-width=\"1\"/><circle cx=\"262.0\" cy=\"26.0\" r=\"5.0\" fill=\"#c2255c\" stroke=\"#c2255c\" stroke-width=\"1\"/><text x=\"272.0\" y=\"31.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">boyalı diş</text></svg>", "son": "<p>Başlangıçta iki çarkın boyalı dişleri yukarıdaki gibi birbirine değmektedir. Çarklar dönerken her an bir dişin karşısında diğer çarkın bir dişi bulunmaktadır.</p>", "k": "Buna göre, boyalı dişlerin yeniden birbirine değmesi için küçük çark <u style=\"white-space:nowrap\">en az</u> kaç tam tur dönmelidir?", "sec": ["1", "9", "16", "144"], "secg": null, "c": "C", "a": ["Çarklar dönerken iki çarktan da aynı sayıda diş geçer.", "Boyalı dişlerin yeniden değmesi için geçen diş sayısı hem 16'nın hem 9'un katı olmalıdır; en az EKOK(16, 9) diş geçer.", "16 ile 9 aralarında asal olduğundan <span class=\"nw\">EKOK(16, 9) = 16 · 9 = 144</span>'tür.", "Küçük çark 144 : 9 = 16 tur, büyük çark 144 : 16 = 9 tur döner."], "t": "9: büyük çarkın tur sayısı bulunmuş; 144: geçen diş sayısı tur sayısı sanılmış; 1: <span class=\"nw\">EBOB(16, 9) = 1</span> bulunup cevap sanılmış.", "d": "İki çarktan aynı sayıda diş geçer; boyalı dişler, geçen diş sayısı iki diş sayısının da katı olunca buluşur. Soru küçük çarkın tur sayısını soruyor; geçen diş sayısını tur sayısıyla karıştırmayınız.", "ses": "b06"}, {"no": 7, "on": "<p>Bir ortaokulun kütüphanesinde her öğrencinin üyelik kodu iki sayıdan oluşmaktadır. Birinci sayı öğrencinin sınıf düzeyi (5, 6, 7 ya da 8), ikinci sayı öğrencinin okul numarasıdır.</p><p>Kütüphanenin bilgisayar programı, yalnız iki sayısı aralarında asal olan kodları kabul etmektedir. Örnek bir üye kartı aşağıda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 340 130\" width=\"340\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"40.0\" y=\"6.0\" width=\"260.0\" height=\"118.0\" rx=\"10\" fill=\"#f8f9fa\" stroke=\"#1f7a8c\" stroke-width=\"2\"/><rect x=\"40.0\" y=\"6.0\" width=\"260.0\" height=\"28.0\" rx=\"10\" fill=\"#1f7a8c\" stroke=\"#1f7a8c\" stroke-width=\"0\"/><rect x=\"40.0\" y=\"24.0\" width=\"260.0\" height=\"10.0\" rx=\"0\" fill=\"#1f7a8c\" stroke=\"#1f7a8c\" stroke-width=\"0\"/><text x=\"170.0\" y=\"26.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#fff\" text-anchor=\"middle\">OKUL KÜTÜPHANESİ ÜYE KARTI</text><rect x=\"54.0\" y=\"44.0\" width=\"52.0\" height=\"64.0\" rx=\"4\" fill=\"#dee2e6\" stroke=\"#adb5bd\" stroke-width=\"1.2\"/><circle cx=\"80.0\" cy=\"64.0\" r=\"10.0\" fill=\"#adb5bd\" stroke=\"#adb5bd\" stroke-width=\"1\"/><rect x=\"66.0\" y=\"78.0\" width=\"28.0\" height=\"22.0\" rx=\"10\" fill=\"#adb5bd\" stroke=\"#adb5bd\" stroke-width=\"0\"/><text x=\"118.0\" y=\"60.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Sınıf düzeyi: 8</text><text x=\"118.0\" y=\"82.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Okul numarası: 135</text><text x=\"118.0\" y=\"104.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#c2255c\" text-anchor=\"start\">Üyelik kodu: 8 – 135</text></svg>", "son": "<p>Okul numaraları birer sayma sayısıdır. Bu bilgilere göre aşağıdaki ifadeler yazılmıştır.<br>I. Kodu kabul edilen 8. sınıf öğrencilerinin okul numaraları tek sayıdır.<br>II. Okul numarası tek sayı olan her 6. sınıf öğrencisinin kodu kabul edilir.<br>III. Okul numarası 7'nin katı olmayan her 7. sınıf öğrencisinin kodu kabul edilir.</p>", "k": "Buna göre, bu ifadelerden hangileri doğrudur?", "sec": ["Yalnız I", "I ve II", "II ve III", "I ve III"], "secg": null, "c": "D", "a": ["I. 8'in 1'den başka bölenleri 2, 4 ve 8'dir; hepsi çifttir.", "Okul numarası çift olsaydı 8 ile en az 2 ortak böleni olurdu; bu yüzden kodu kabul edilenlerin numarası tektir: doğru.", "II. 6 = 2 · 3'tür; tek numaralar 2'ye bölünmez ama 3'e bölünebilir.", "Örneğin 6 ile 9'un ortak böleni 3'tür: yanlış.", "III. 7 asal sayıdır; 7'nin katı olmayan bir sayı ile 7'nin 1'den başka ortak böleni olamaz: doğru. Cevap I ve III."], "t": "I ve II: 6 ile tek sayıların aralarında asal olduğu sanılmış, 3 çarpanı unutulmuş; Yalnız I: III'te asal sayıların her sayıyla aralarında asal olmadığı düşünülüp ifade yanlış sanılmış.", "d": "“Her” ve “kesinlikle” içeren bir ifadeyi yanlış çıkarmak için tek bir karşı örnek yeter. 6 = 2 · 3 olduğu için tek bir sayı 6 ile 3 ortak bölenine sahip olabilir.", "ses": "b07"}, {"no": 8, "on": "<p>Bir okulun önündeki otobüs durağında sabah seferlerine ait bilgiler aşağıdaki tabloda verilmiştir. Otobüsler ilk seferden son sefere kadar eşit aralıklarla kalkmaktadır.</p>", "g": "<table style=\"border-collapse:collapse;font-size:10.5pt;margin:0 auto;\"><thead><tr><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">İlk sefer</th><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Son sefer</th><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Ardışık iki sefer arasındaki süre</th></tr></thead><tbody><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">7.00</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">10.00</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">18 dakika</td></tr></tbody></table>", "son": "<p>Defne, kalkış saatindeki saat ve dakika sayılarının aralarında asal olduğu seferlere \"şanslı sefer\" demektedir. Örneğin 8.15'te kalkan bir sefer, 8 ile 15 aralarında asal olduğu için şanslı seferdir.</p>", "k": "Buna göre, bu sabah seferlerinden kaç tanesi şanslı seferdir?", "sec": ["3", "4", "7", "11"], "secg": null, "c": "A", "a": ["Seferler 7.00, 7.18, 7.36, 7.54, 8.12, 8.30, 8.48, 9.06, 9.24, 9.42 ve 10.00'dır (11 sefer).", "7.00: 7 ile 0'ın ortak böleni 7'dir, şanslı değildir.", "7.18, 7.36, 7.54: 7 asal sayıdır ve 18, 36, 54 sayıları 7'nin katı değildir → şanslı.", "8.12, 8.30, 8.48 ve 10.00'da iki sayı da çifttir.", "9.06, 9.24, 9.42'de iki sayı da 3'e bölünür.", "Şanslı sefer sayısı 3'tür."], "t": "4: 0 ile 7 aralarında asal sanılıp 7.00 da sayılmış; 7: yalnız ikisi de çift olan seferler elenmiş, 3 ortak böleni gözden kaçmış; 11: bütün seferler sayılmış.", "d": "Seferleri ilk seferden başlayarak 18 dakika ekleyerek yazınız; saat 60 dakikayı geçince bir sonraki saate geçilir. 0 ile bir sayı aralarında asal değildir; tam saatleri dikkatle inceleyiniz.", "ses": "b08"}, {"no": 9, "on": "<p>Bir 8. sınıf şubesindeki 30 öğrencinin tamamı, beden eğitimi dersinde turuncu ve mavi olmak üzere iki takıma ayrılacaktır.</p>", "g": "<svg viewBox=\"0 0 340 124\" width=\"340\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"110.0\" y=\"6.0\" width=\"120.0\" height=\"34.0\" rx=\"8\" fill=\"#e6f4f7\" stroke=\"#1f7a8c\" stroke-width=\"1.6\"/><text x=\"170.0\" y=\"28.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">Şube: 30 öğrenci</text><line x1=\"150.0\" y1=\"42.0\" x2=\"82.0\" y2=\"70.0\" stroke=\"#000000\" stroke-width=\"1.4\"/><polygon points=\"82.0,70.0 87.9,63.3 90.9,70.7\" fill=\"#000000\"/><line x1=\"190.0\" y1=\"42.0\" x2=\"258.0\" y2=\"70.0\" stroke=\"#000000\" stroke-width=\"1.4\"/><polygon points=\"258.0,70.0 249.1,70.7 252.1,63.3\" fill=\"#000000\"/><rect x=\"18.0\" y=\"72.0\" width=\"128.0\" height=\"46.0\" rx=\"8\" fill=\"#ffe8cc\" stroke=\"#e8590c\" stroke-width=\"1.6\"/><text x=\"82.0\" y=\"92.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#e8590c\" text-anchor=\"middle\">Turuncu takım</text><text x=\"82.0\" y=\"110.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">? öğrenci</text><rect x=\"194.0\" y=\"72.0\" width=\"128.0\" height=\"46.0\" rx=\"8\" fill=\"#d0ebff\" stroke=\"#1971c2\" stroke-width=\"1.6\"/><text x=\"258.0\" y=\"92.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#1971c2\" text-anchor=\"middle\">Mavi takım</text><text x=\"258.0\" y=\"110.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">? öğrenci</text></svg>", "son": "<p>Her takımda <u style=\"white-space:nowrap\">en az</u> 2 öğrenci olacaktır. Öğretmen, iki takımdaki öğrenci sayılarının aralarında asal olmasını istemektedir.</p>", "k": "Buna göre, iki takımın öğrenci sayıları arasındaki fark <u style=\"white-space:nowrap\">en az</u> kaçtır?", "sec": ["2", "4", "6", "8"], "secg": null, "c": "B", "a": ["Takımlardan birinde a öğrenci varsa diğerinde 30 − a öğrenci vardır.", "a ile 30 − a'nın ortak bölenleri 30'u da böler; bu yüzden a, 2'ye, 3'e ve 5'e bölünmemelidir.", "Takımlar eşit olamaz (15 ile 15 aralarında asal değildir).", "Farkın küçük olması için sayılar 15'e yakın seçilir: 14 ile 16 çift, 13 ile 17 aralarında asaldır.", "En az fark 17 − 13 = 4."], "t": "2: 14 ile 16 ardışık çift sayılar aralarında asal sanılmış; 6: 12 ile 18 alınmış; 8: 11 ile 19 alınıp 13 ile 17 gözden kaçmış.", "d": "Takımlar eşit olamaz: 15 ile 15'in ortak böleni 15'tir. İki sayının ortak böleni toplamlarını (30) da böler; bu yüzden takım sayıları 2'ye, 3'e ve 5'e bölünmemelidir.", "ses": "b09"}, {"no": 10, "on": "<p>Bir çiftlikte birbirine boruyla bağlı iki su deposu vardır. Depolardaki su miktarları aşağıda gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 340 134\" width=\"340\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"20.0\" y=\"26.0\" width=\"96.0\" height=\"82.0\" rx=\"6\" fill=\"#f1f3f5\" stroke=\"#495057\" stroke-width=\"1.8\"/><rect x=\"22.0\" y=\"42.0\" width=\"92.0\" height=\"64.0\" rx=\"0\" fill=\"#a5d8ff\" stroke=\"#a5d8ff\" stroke-width=\"0\"/><ellipse cx=\"68\" cy=\"26\" rx=\"48\" ry=\"8\" fill=\"#e9ecef\" stroke=\"#495057\" stroke-width=\"1.8\"/><text x=\"68.0\" y=\"126.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#1f7a8c\" text-anchor=\"middle\">A deposu</text><rect x=\"38.0\" y=\"52.0\" width=\"60.0\" height=\"24.0\" rx=\"5\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1.2\"/><text x=\"68.0\" y=\"69.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">84 L</text><rect x=\"224.0\" y=\"26.0\" width=\"96.0\" height=\"82.0\" rx=\"6\" fill=\"#f1f3f5\" stroke=\"#495057\" stroke-width=\"1.8\"/><rect x=\"226.0\" y=\"78.0\" width=\"92.0\" height=\"28.0\" rx=\"0\" fill=\"#a5d8ff\" stroke=\"#a5d8ff\" stroke-width=\"0\"/><ellipse cx=\"272\" cy=\"26\" rx=\"48\" ry=\"8\" fill=\"#e9ecef\" stroke=\"#495057\" stroke-width=\"1.8\"/><text x=\"272.0\" y=\"126.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#1f7a8c\" text-anchor=\"middle\">B deposu</text><rect x=\"242.0\" y=\"52.0\" width=\"60.0\" height=\"24.0\" rx=\"5\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1.2\"/><text x=\"272.0\" y=\"69.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">36 L</text><rect x=\"116.0\" y=\"92.0\" width=\"108.0\" height=\"8.0\" rx=\"0\" fill=\"#ced4da\" stroke=\"#495057\" stroke-width=\"1.4\"/><rect x=\"162.0\" y=\"84.0\" width=\"16.0\" height=\"24.0\" rx=\"3\" fill=\"#ffc078\" stroke=\"#e8590c\" stroke-width=\"1.4\"/><line x1=\"136.0\" y1=\"74.0\" x2=\"204.0\" y2=\"74.0\" stroke=\"#e8590c\" stroke-width=\"1.4\"/><polygon points=\"204.0,74.0 196.0,78.0 196.0,70.0\" fill=\"#e8590c\"/><text x=\"170.0\" y=\"64.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">musluk</text></svg>", "son": "<p>Musluk açılarak A deposundan B deposuna bir miktar su aktarılacaktır. Aktarılan su miktarı litre cinsinden 1 ile 9 arasında (1 ve 9 dâhil) bir doğal sayıdır. Aktarımdan sonra iki depodaki su miktarları aralarında asal olacaktır.</p>", "k": "Buna göre, aktarılan su miktarı kaç farklı değer alabilir?", "sec": ["3", "4", "5", "9"], "secg": null, "c": "A", "a": ["x litre aktarılırsa depolarda 84 − x ve 36 + x litre su olur.", "Toplam her zaman 120 L'dir.", "x = 1: 83 ve 37 ✓; x = 2: 82 ve 38 (2); x = 3: 81 ve 39 (3); x = 4: 80 ve 40; x = 5: 79 ve 41 ✓; x = 6: 78 ve 42; x = 7: 77 ve 43 ✓ (77 = 7 · 11 asal değildir ama 43 ile ortak asal çarpanı yoktur); x = 8: 76 ve 44; x = 9: 75 ve 45 (15). Cevap 3."], "t": "4: 3'e bölünme kontrol edilmeyip 81 ile 39 da sayılmış; 5: iki tek sayının aralarında asal olduğu sanılmış; 9: bütün değerler sayılmış. 77 asal sayı olmadığı için x = 7'yi eleyen öğrenci 2 bulur.", "d": "Aktarımdan sonra iki depodaki miktarı birlikte yazınız; toplam hep 120 L'dir. Bir sayının asal olmaması, diğer sayıyla aralarında asal olmadığı anlamına gelmez (77 ile 43 gibi).", "ses": "b10"}, {"no": 11, "on": "<p>Bir marketin deposundaki ürünlerin raf kodları aşağıdaki tabloda verilmiştir.</p>", "g": "<table style=\"border-collapse:collapse;font-size:10.5pt;margin:0 auto;\"><thead><tr><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Ürün</th><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Raf kodu</th><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Ürün</th><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Raf kodu</th></tr></thead><tbody><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Un</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">37</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Makarna</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">121</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Şeker</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">32</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Pirinç</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">36</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Çay</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">75</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Mercimek</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">95</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Tuz</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">41</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Nohut</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">53</td></tr></tbody></table>", "son": "<p>Depo görevlisi, raf kodu asal sayı <u>olmayan</u> ürünlerden iki tanesini seçip yeni bir rafa yan yana koyacaktır. Seçilen iki ürünün raf kodları aralarında asal olmalıdır.</p>", "k": "Buna göre, görevli bu iki ürünü kaç farklı şekilde seçebilir?", "sec": ["3", "5", "7", "10"], "secg": null, "c": "C", "a": ["Asal olmayan kodlar: <span class=\"nw\">32 = 2<sup>5</sup></span>, <span class=\"nw\">36 = 2<sup>2</sup> · 3<sup>2</sup></span>, <span class=\"nw\">75 = 3 · 5<sup>2</sup></span>, 95 = 5 · 19, 121 = 11 · 11 (37, 41 ve 53 asaldır).", "Aralarında asal ikililer: 32–75, 32–95, 32–121, 36–95, 36–121, 75–121, 95–121 → 7.", "Aralarında asal olmayanlar: 32–36 (2), 36–75 (3), 75–95 (5)."], "t": "3: 121 asal sanılıp dışarıda bırakılmış; 5: iki tek sayının aralarında asal olamayacağı sanılıp 75–121 ve 95–121 elenmiş; 10: bütün ikililer sayılmış.", "d": "Önce raf kodu asal olan ürünleri dışarıda bırakınız; 121 = 11 · 11 asal değildir. Sonra kalan kodlardan oluşan bütün ikilileri tek tek kontrol ediniz.", "ses": "b11"}, {"no": 12, "on": "<p>Elif ile Zeynep pul biriktirmektedir. Bu hafta sonu iki koleksiyondaki pul sayıları aşağıda gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 340 142\" width=\"340\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"22.0\" y=\"10.0\" width=\"126.0\" height=\"84.0\" rx=\"6\" fill=\"#fff3bf\" stroke=\"#e8590c\" stroke-width=\"1.8\"/><rect x=\"22.0\" y=\"10.0\" width=\"12.0\" height=\"84.0\" rx=\"3\" fill=\"#e8590c\" stroke=\"#e8590c\" stroke-width=\"0\"/><rect x=\"46.0\" y=\"22.0\" width=\"24.0\" height=\"22.0\" rx=\"2\" fill=\"#fff\" stroke=\"#e8590c\" stroke-width=\"1\"/><rect x=\"78.0\" y=\"22.0\" width=\"24.0\" height=\"22.0\" rx=\"2\" fill=\"#fff\" stroke=\"#e8590c\" stroke-width=\"1\"/><rect x=\"110.0\" y=\"22.0\" width=\"24.0\" height=\"22.0\" rx=\"2\" fill=\"#fff\" stroke=\"#e8590c\" stroke-width=\"1\"/><rect x=\"46.0\" y=\"52.0\" width=\"24.0\" height=\"22.0\" rx=\"2\" fill=\"#fff\" stroke=\"#e8590c\" stroke-width=\"1\"/><rect x=\"78.0\" y=\"52.0\" width=\"24.0\" height=\"22.0\" rx=\"2\" fill=\"#fff\" stroke=\"#e8590c\" stroke-width=\"1\"/><rect x=\"110.0\" y=\"52.0\" width=\"24.0\" height=\"22.0\" rx=\"2\" fill=\"#fff\" stroke=\"#e8590c\" stroke-width=\"1\"/><text x=\"85.0\" y=\"114.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">Elif: 62 pul</text><rect x=\"192.0\" y=\"10.0\" width=\"126.0\" height=\"84.0\" rx=\"6\" fill=\"#e7f5ff\" stroke=\"#1971c2\" stroke-width=\"1.8\"/><rect x=\"192.0\" y=\"10.0\" width=\"12.0\" height=\"84.0\" rx=\"3\" fill=\"#1971c2\" stroke=\"#1971c2\" stroke-width=\"0\"/><rect x=\"216.0\" y=\"22.0\" width=\"24.0\" height=\"22.0\" rx=\"2\" fill=\"#fff\" stroke=\"#1971c2\" stroke-width=\"1\"/><rect x=\"248.0\" y=\"22.0\" width=\"24.0\" height=\"22.0\" rx=\"2\" fill=\"#fff\" stroke=\"#1971c2\" stroke-width=\"1\"/><rect x=\"280.0\" y=\"22.0\" width=\"24.0\" height=\"22.0\" rx=\"2\" fill=\"#fff\" stroke=\"#1971c2\" stroke-width=\"1\"/><rect x=\"216.0\" y=\"52.0\" width=\"24.0\" height=\"22.0\" rx=\"2\" fill=\"#fff\" stroke=\"#1971c2\" stroke-width=\"1\"/><rect x=\"248.0\" y=\"52.0\" width=\"24.0\" height=\"22.0\" rx=\"2\" fill=\"#fff\" stroke=\"#1971c2\" stroke-width=\"1\"/><rect x=\"280.0\" y=\"52.0\" width=\"24.0\" height=\"22.0\" rx=\"2\" fill=\"#fff\" stroke=\"#1971c2\" stroke-width=\"1\"/><text x=\"255.0\" y=\"114.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">Zeynep: 104 pul</text><text x=\"170.0\" y=\"134.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">Her hafta sonu ikisi de koleksiyonuna 1 pul eklemektedir.</text></svg>", "son": "<p>İki koleksiyondaki pul sayıları bu hafta sonu aralarında asal <u>değildir</u>.</p>", "k": "Buna göre, iki koleksiyondaki pul sayıları <u style=\"white-space:nowrap\">en az</u> kaç hafta sonra aralarında asal olur?", "sec": ["1", "3", "5", "42"], "secg": null, "c": "B", "a": ["İki koleksiyona her hafta aynı sayıda pul eklendiği için aradaki fark hep 104 − 62 = 42'dir.", "İki sayının ortak böleni farklarını da böler; bu yüzden yalnız 2, 3 ve 7 ortak bölen olabilir.", "1 hafta sonra: 63 ve 105 (3 ve 7 ortak); 2 hafta sonra: 64 ve 106 (2); 3 hafta sonra: 65 ve 107; 65 = 5 · 13, 107 asaldır, ortak asal çarpan yoktur ✓. En az 3 hafta."], "t": "1: iki tek sayının aralarında asal olduğu sanılmış; 5: iki sayının da asal olması gerektiği sanılmış (67 ve 109); 42: fark cevap sanılmış.", "d": "İki sayının ortak böleni farklarını da böler; farkın (42) asal çarpanları dışında ortak bölen olamaz. Sayıların ikisinin de asal olması gerekmez; aralarında asal olmaları yeter.", "ses": "b12"}, {"no": 13, "on": "<p>Bir koyun iki yakasında birer deniz feneri vardır. Fenerlerin ne kadar sürede bir ışık verdiği aşağıda gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 340 134\" width=\"340\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"0.0\" y=\"112.0\" width=\"340.0\" height=\"20.0\" rx=\"0\" fill=\"#d0ebff\" stroke=\"#d0ebff\" stroke-width=\"0\"/><polygon points=\"56,112 84,112 79,42 61,42\" fill=\"#fff\" stroke=\"#000000\" stroke-width=\"1.6\"/><rect x=\"57.0\" y=\"68.6\" width=\"26.0\" height=\"10.0\" rx=\"0\" fill=\"#e8590c\" stroke=\"#e8590c\" stroke-width=\"0\"/><rect x=\"59.0\" y=\"91.0\" width=\"22.0\" height=\"10.0\" rx=\"0\" fill=\"#e8590c\" stroke=\"#e8590c\" stroke-width=\"0\"/><rect x=\"59.0\" y=\"26.0\" width=\"22.0\" height=\"16.0\" rx=\"2\" fill=\"#fff3bf\" stroke=\"#000000\" stroke-width=\"1.4\"/><polygon points=\"57,26 83,26 70,14\" fill=\"#e8590c\" stroke=\"#000000\" stroke-width=\"1.4\"/><polygon points=\"256,112 284,112 279,54 261,54\" fill=\"#fff\" stroke=\"#000000\" stroke-width=\"1.6\"/><rect x=\"257.0\" y=\"76.0\" width=\"26.0\" height=\"10.0\" rx=\"0\" fill=\"#1971c2\" stroke=\"#1971c2\" stroke-width=\"0\"/><rect x=\"259.0\" y=\"94.6\" width=\"22.0\" height=\"10.0\" rx=\"0\" fill=\"#1971c2\" stroke=\"#1971c2\" stroke-width=\"0\"/><rect x=\"259.0\" y=\"38.0\" width=\"22.0\" height=\"16.0\" rx=\"2\" fill=\"#fff3bf\" stroke=\"#000000\" stroke-width=\"1.4\"/><polygon points=\"257,38 283,38 270,26\" fill=\"#1971c2\" stroke=\"#000000\" stroke-width=\"1.4\"/><text x=\"70.0\" y=\"128.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">1. fener</text><text x=\"270.0\" y=\"128.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">2. fener</text><rect x=\"104.0\" y=\"22.0\" width=\"132.0\" height=\"30.0\" rx=\"6\" fill=\"#fff\" stroke=\"#e8590c\" stroke-width=\"1.4\"/><text x=\"170.0\" y=\"42.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#e8590c\" text-anchor=\"middle\">10 saniyede bir</text><rect x=\"104.0\" y=\"62.0\" width=\"132.0\" height=\"30.0\" rx=\"6\" fill=\"#fff\" stroke=\"#1971c2\" stroke-width=\"1.4\"/><text x=\"170.0\" y=\"82.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#1971c2\" text-anchor=\"middle\">x saniyede bir</text></svg>", "son": "<p>x, 1'den büyük bir doğal sayıdır. İki fener aynı anda ışık verdikten sonra ilk kez 10 · x saniye sonra yine aynı anda ışık vermektedir.</p>", "k": "Buna göre, x aşağıdakilerden hangisi <u style=\"white-space:nowrap\">olamaz</u>?", "sec": ["7", "9", "11", "12"], "secg": null, "c": "D", "a": ["Fenerler, 10'un ve x'in ortak katı olan sürelerde birlikte ışık verir; ilk kez EKOK(10, x) saniye sonra.", "<span class=\"nw\">EKOK(10, x) = 10 ·</span> x olması için 10 ile x aralarında asal olmalıdır.", "7, 9 ve 11 sayılarının 10 ile 1'den başka ortak böleni yoktur.", "12 ile 10'un ortak böleni 2'dir; <span class=\"nw\">EKOK(10, 12) = 60</span> ≠ 120.", "Bu yüzden x, 12 olamaz."], "t": "9: asal sayı olmadığı için 10 ile aralarında asal olmadığı sanılmış. 7 ve 11 asal sayılardır ve 10'u bölmez; bu seçenekler, iki sayının ortak katının her zaman çarpımlarından küçük olduğunu düşünen öğrenciyi yanıltır.", "d": "İki sayının EKOK'u, ancak sayılar aralarında asalsa çarpımlarına eşittir. Asal olmayan bir sayı da 10 ile aralarında asal olabilir (9 gibi).", "ses": "b13"}, {"no": 14, "on": "<p>Nehir, gün numarası ile ay numarası aralarında asal olan günlere \"uğurlu gün\" demektedir. Örneğin 9 Mayıs, 9 ile 5 aralarında asal olduğu için uğurlu gündür. Bazı ayların numaraları ve gün sayıları aşağıdaki tabloda verilmiştir.</p>", "g": "<table style=\"border-collapse:collapse;font-size:10.5pt;margin:0 auto;\"><thead><tr><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Ay</th><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Ayın numarası</th><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Ayın gün sayısı</th></tr></thead><tbody><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Mart</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">3</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">31</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Eylül</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">9</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">30</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Ekim</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">10</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">31</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Aralık</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">12</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">31</td></tr></tbody></table>", "son": "<p>Nehir, doğduğu aydaki uğurlu günlerin sayısını hesaplamış ve 20 bulmuştur. Nehir, tablodaki aylardan birinde doğmuştur.</p>", "k": "Buna göre, Nehir hangi ayda doğmuş olabilir?", "sec": ["Mart", "Eylül", "Ekim", "Aralık"], "secg": null, "c": "B", "a": ["Mart (3): 31 günden 3'ün katı olan 10 gün (3, 6, …, 30) çıkarılır → 21.", "Eylül (9): <span class=\"nw\">9 = 3<sup>2</sup></span> olduğundan yine 3'ün katları elenir; 30 günde 10 kat vardır → 20.", "Ekim (10): 2'nin ya da 5'in katı olmayan günler: 31 günde 16 tek gün var, bunlardan 5, 15, 25 çıkar → 13.", "Aralık (12): 2'nin ya da 3'ün katı olmayan günler: 1, 5, 7, 11, 13, 17, 19, 23, 25, 29, 31 → 11. Cevap Eylül."], "t": "Mart: Mart ile Eylül'ün aynı asal çarpana (3) bağlı olduğu fark edilip ayların gün sayıları karıştırılmış; Ekim: yalnız 2'nin katları elenmiş, 5'in katları unutulmuş (16 bulunup en yakın değer seçilmiş); Aralık: 1 unutulmuş ya da asal günler sayılmış.", "d": "Uğurlu gün, gün numarası ile ay numarası aralarında asal olan gündür. Ay numarasının asal çarpanlarına bakınız ve ayın gün sayısını (30 ya da 31) doğru alınız.", "ses": "b14"}, {"no": 15, "on": "<p>Ada, halka biçimindeki bir kolyede eş aralıklarla dizilmiş 20 boncuğu boyamak için bir oyun kurmuştur. Ada, önce işaretli boncuğu boyamaktadır. Ardından her adımda saat yönünde k boncuk ilerlemekte ve geldiği boncuğu boyamaktadır.</p>", "g": "<svg viewBox=\"0 0 340 152\" width=\"340\" xmlns=\"http: text x=\"110.0\" y=\"14.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#c2255c\" text-anchor=\"middle\">işaretli boncuk</text><path d=\"M130,46 A41,41 0 0 1 151,84\" fill=\"none\" stroke=\"#000000\" stroke-width=\"1.6\"/><line x1=\"151.2\" y1=\"80.0\" x2=\"151.0\" y2=\"88.0\" stroke=\"#000000\" stroke-width=\"1.4\"/><polygon points=\"151.0,88.0 147.2,79.9 155.2,80.1\" fill=\"#000000\"/><text x=\"102.0\" y=\"87.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">saat yönü</text><rect x=\"196.0\" y=\"42.0\" width=\"136.0\" height=\"82.0\" rx=\"8\" fill=\"#e6f4f7\" stroke=\"#1f7a8c\" stroke-width=\"1.4\"/><text x=\"264.0\" y=\"64.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">Kolyede</text><text x=\"264.0\" y=\"84.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">20 boncuk</text><text x=\"264.0\" y=\"108.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"600\" fill=\"#333333\" text-anchor=\"middle\">(eş aralıklı)</text></svg>", "son": "<p>Örneğin k = 3 ise Ada, işaretli boncuktan sonra saat yönündeki 3. boncuğu boyar. Ada, daha önce boyadığı bir boncuğa geldiğinde oyun bitmektedir.</p>", "k": "Oyun bittiğinde kolyedeki boncukların hepsinin boyanmış olması için k aşağıdakilerden hangisi olabilir?", "sec": ["4", "5", "6", "9"], "secg": null, "c": "D", "a": ["Ada, işaretli boncuğa ilk kez k ile 20'nin ortak katı kadar boncuk ilerleyince döner; bu en az EKOK(k, 20) boncuktur.", "Bu sırada EKOK(k, 20) : k farklı boncuk boyanır.", "Hepsinin boyanması için bu sayı 20 olmalı, yani <span class=\"nw\">EKOK(k, 20) = 20 ·</span> k olmalıdır; k ile 20 aralarında asal olmalıdır.", "k = 4: 5 boncuk, k = 5: 4 boncuk, k = 6: 10 boncuk, k = 9: 20 boncuk boyanır. Cevap 9."], "t": "5: asal sayı olduğu için her boncuğa uğrayacağı sanılmış; 4 ve 6: tur sayısı ya da ilerleme miktarının küçük olmasının yeterli olduğu sanılmış.", "d": "Her adımda k boncuk ilerlenir; işaretli boncuğa dönüş k ile 20'nin EKOK'u kadar ilerleyince olur. Hepsinin boyanması için k ile 20 aralarında asal olmalıdır; k'nin asal olması yetmez.", "ses": "b15"}, {"no": 16, "on": "<p>Bir çiftçinin nehir kıyısında dikdörtgen biçiminde bir tarlası vardır. Tarlanın uzun kenarlarından biri nehir kıyısındadır.</p>", "g": "<svg viewBox=\"0 0 340 136\" width=\"340\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"0.0\" y=\"100.0\" width=\"340.0\" height=\"34.0\" rx=\"0\" fill=\"#a5d8ff\" stroke=\"#74c0fc\" stroke-width=\"0\"/><text x=\"300.0\" y=\"124.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#1864ab\" text-anchor=\"middle\">Nehir</text><path d=\"M20,116 q8,-5 16,0 t16,0\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.4\"/><path d=\"M80,116 q8,-5 16,0 t16,0\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.4\"/><path d=\"M140,116 q8,-5 16,0 t16,0\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.4\"/><path d=\"M200,116 q8,-5 16,0 t16,0\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.4\"/><rect x=\"70.0\" y=\"26.0\" width=\"200.0\" height=\"74.0\" rx=\"0\" fill=\"#d8f5a2\" stroke=\"#5c940d\" stroke-width=\"0\"/><line x1=\"70.0\" y1=\"26.0\" x2=\"70.0\" y2=\"100.0\" stroke=\"#8a5a2b\" stroke-width=\"3\" stroke-dasharray=\"7 4\"/><line x1=\"70.0\" y1=\"26.0\" x2=\"270.0\" y2=\"26.0\" stroke=\"#8a5a2b\" stroke-width=\"3\" stroke-dasharray=\"7 4\"/><line x1=\"270.0\" y1=\"26.0\" x2=\"270.0\" y2=\"100.0\" stroke=\"#8a5a2b\" stroke-width=\"3\" stroke-dasharray=\"7 4\"/><rect x=\"115.0\" y=\"50.0\" width=\"110.0\" height=\"26.0\" rx=\"6\" fill=\"#fff\" stroke=\"#5c940d\" stroke-width=\"1.2\"/><text x=\"170.0\" y=\"68.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">Alan: 360 m²</text><text x=\"170.0\" y=\"16.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#c2255c\" text-anchor=\"middle\">? m</text><text x=\"52.0\" y=\"66.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#c2255c\" text-anchor=\"end\">? m</text><line x1=\"286.0\" y1=\"34.0\" x2=\"312.0\" y2=\"34.0\" stroke=\"#8a5a2b\" stroke-width=\"3\" stroke-dasharray=\"7 4\"/><text x=\"316.0\" y=\"39.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">çit</text></svg>", "son": "<p>Tarlanın alanı 360 m²'dir. Kenar uzunlukları metre cinsinden 1'den büyük birer doğal sayıdır ve aralarında asaldır. Çiftçi, nehir kıyısındaki kenar hariç tarlanın üç kenarına tel çit çekecektir.</p>", "k": "Buna göre, çekilecek tel çitin uzunluğu <u style=\"white-space:nowrap\">en az</u> kaç metredir?", "sec": ["58", "61", "82", "89"], "secg": null, "c": "A", "a": ["<span class=\"nw\">360 = 2<sup>3</sup> · 3<sup>2</sup> · 5</span>.", "Kenarlar aralarında asal olduğundan aynı asal çarpan iki kenara bölünemez; <span class=\"nw\">2<sup>3</sup> = 8</span>, <span class=\"nw\">3<sup>2</sup> = 9</span> ve 5 çarpanları kenarlara bütün olarak dağıtılır.", "Kenarları 1'den büyük olan üç tarla vardır: kenarları 40 m ile 9 m, 45 m ile 8 m ya da 72 m ile 5 m.", "Çit = uzun kenar + 2 · kısa kenar: 40 + 18 = 58, 45 + 16 = 61, 72 + 10 = 82. En az 58 m."], "t": "61 ve 82: öteki tarlalar alınmış; 89: kısa kenar nehir kıyısına konmuş (9 + 2 · 40). Aralarında asal koşulu unutulursa kenarları 20 m ile 18 m olan tarla gibi tarlalarla daha kısa çit bulunur.", "d": "Kenarlar aralarında asal olduğundan bir asal çarpanın kuvvetleri tek bir kenarda toplanır (2<sup>3</sup> = 8 gibi). Çit yalnız üç kenara çekilir; nehir kıyısındaki uzun kenar çite girmez, iki kısa kenar ise iki kez sayılır.", "ses": "b16"}, {"no": 17, "on": "<p>Bir fidanlıkta fidanlar, köşedeki çeşme başlangıç noktası olacak şekilde bir koordinat sistemine göre dikilmiştir. Koordinatları 0 ile 20 arasındaki (0 ve 20 dâhil) doğal sayılardan oluşan her noktada, başlangıç noktası hariç, bir fidan vardır.</p>", "g": "<svg viewBox=\"0 0 340 156\" width=\"340\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><circle cx=\"34.0\" cy=\"112.0\" r=\"5.2\" fill=\"#b2f2bb\" stroke=\"#2b8a3e\" stroke-width=\"1.2\"/><circle cx=\"34.0\" cy=\"92.0\" r=\"5.2\" fill=\"#b2f2bb\" stroke=\"#2b8a3e\" stroke-width=\"1.2\"/><circle cx=\"34.0\" cy=\"72.0\" r=\"5.2\" fill=\"#b2f2bb\" stroke=\"#2b8a3e\" stroke-width=\"1.2\"/><circle cx=\"34.0\" cy=\"52.0\" r=\"5.2\" fill=\"#b2f2bb\" stroke=\"#2b8a3e\" stroke-width=\"1.2\"/><circle cx=\"54.0\" cy=\"132.0\" r=\"5.2\" fill=\"#b2f2bb\" stroke=\"#2b8a3e\" stroke-width=\"1.2\"/><circle cx=\"54.0\" cy=\"112.0\" r=\"5.2\" fill=\"#b2f2bb\" stroke=\"#2b8a3e\" stroke-width=\"1.2\"/><circle cx=\"54.0\" cy=\"92.0\" r=\"5.2\" fill=\"#b2f2bb\" stroke=\"#2b8a3e\" stroke-width=\"1.2\"/><circle cx=\"54.0\" cy=\"72.0\" r=\"5.2\" fill=\"#b2f2bb\" stroke=\"#2b8a3e\" stroke-width=\"1.2\"/><circle cx=\"54.0\" cy=\"52.0\" r=\"5.2\" fill=\"#b2f2bb\" stroke=\"#2b8a3e\" stroke-width=\"1.2\"/><circle cx=\"74.0\" cy=\"132.0\" r=\"5.2\" fill=\"#b2f2bb\" stroke=\"#2b8a3e\" stroke-width=\"1.2\"/><circle cx=\"74.0\" cy=\"112.0\" r=\"5.2\" fill=\"#b2f2bb\" stroke=\"#2b8a3e\" stroke-width=\"1.2\"/><circle cx=\"74.0\" cy=\"92.0\" r=\"5.2\" fill=\"#b2f2bb\" stroke=\"#2b8a3e\" stroke-width=\"1.2\"/><circle cx=\"74.0\" cy=\"72.0\" r=\"5.2\" fill=\"#b2f2bb\" stroke=\"#2b8a3e\" stroke-width=\"1.2\"/><circle cx=\"74.0\" cy=\"52.0\" r=\"5.2\" fill=\"#b2f2bb\" stroke=\"#2b8a3e\" stroke-width=\"1.2\"/><circle cx=\"94.0\" cy=\"132.0\" r=\"5.2\" fill=\"#b2f2bb\" stroke=\"#2b8a3e\" stroke-width=\"1.2\"/><circle cx=\"94.0\" cy=\"112.0\" r=\"5.2\" fill=\"#b2f2bb\" stroke=\"#2b8a3e\" stroke-width=\"1.2\"/><circle cx=\"94.0\" cy=\"92.0\" r=\"5.2\" fill=\"#b2f2bb\" stroke=\"#2b8a3e\" stroke-width=\"1.2\"/><circle cx=\" /text></svg>", "son": "<p>Efe, çeşmeden bir fidanın dibine yerde düz bir çizgi boyunca hortum uzatacaktır. Hortum, uzatıldığı fidan dışında hiçbir fidanın üzerinden geçmemelidir. Fidanların kalınlığı önemsenmeyecektir.</p>", "k": "Buna göre, Efe hortumu koordinatları aşağıdakilerden hangisi olan fidana uzatabilir?", "sec": ["(4, 6)", "(6, 9)", "(4, 15)", "(12, 9)"], "secg": null, "c": "C", "a": ["Hortum (a, b) noktasındaki fidana uzatılırsa a ile b'nin 1'den büyük bir ortak böleni d varsa, (a : d, b : d) noktası da aynı doğru üzerindedir ve orada bir fidan vardır.", "(4, 6) için (2, 3); (6, 9) için (2, 3); (12, 9) için (4, 3) ve (8, 6) noktalarındaki fidanlar yolu keser.", "4 ile 15 aralarında asal olduğundan çeşme ile (4, 15) noktası arasındaki doğru parçası üzerinde koordinatları doğal sayı olan başka nokta yoktur. Cevap (4, 15)."], "t": "Çeldiriciler: (6, 9) ve (12, 9): sayılardan biri tek olduğu için yolun açık olduğu sanılmış; (4, 6): fidan çeşmeye yakın olduğu için arada fidan kalmayacağı sanılmış.", "d": "Hortum, ortak böleni olan koordinatlarda daha yakındaki bir fidanın üzerinden geçer. Fidanın çeşmeye yakın ya da uzak olması değil, koordinatlarının aralarında asal olması önemlidir.", "ses": "b17"}, {"no": 18, "on": "<p>Elif ile Mert bir kart oyunu oynamaktadır. Masada üzerinde 6, 10 ve 15 yazan üç kart vardır.</p>", "g": "<svg viewBox=\"0 0 340 134\" width=\"340\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"6.0\" y=\"8.0\" width=\"328.0\" height=\"120.0\" rx=\"12\" fill=\"#e6fcf5\" stroke=\"#20c997\" stroke-width=\"1.4\"/><rect x=\"26.0\" y=\"26.0\" width=\"54.0\" height=\"74.0\" rx=\"7\" fill=\"#fff\" stroke=\"#000000\" stroke-width=\"1.6\"/><text x=\"53.0\" y=\"72.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"22\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">6</text><rect x=\"94.0\" y=\"26.0\" width=\"54.0\" height=\"74.0\" rx=\"7\" fill=\"#fff\" stroke=\"#000000\" stroke-width=\"1.6\"/><text x=\"121.0\" y=\"72.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"22\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">10</text><rect x=\"162.0\" y=\"26.0\" width=\"54.0\" height=\"74.0\" rx=\"7\" fill=\"#fff\" stroke=\"#000000\" stroke-width=\"1.6\"/><text x=\"189.0\" y=\"72.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"22\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">15</text><rect x=\"250.0\" y=\"26.0\" width=\"54.0\" height=\"74.0\" rx=\"7\" fill=\"#fff3bf\" stroke=\"#e8590c\" stroke-width=\"1.8\" stroke-dasharray=\"6 4\"/><text x=\"277.0\" y=\"72.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"24\" font-weight=\"800\" fill=\"#c2255c\" text-anchor=\"middle\">?</text><text x=\"105.0\" y=\"120.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">Masadaki kartlar</text><text x=\"277.0\" y=\"120.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">Elif'in kartı</text></svg>", "son": "<p>Elif, masaya üzerinde 20 ile 50 arasındaki (20 ve 50 hariç) bir doğal sayı yazan bir kart koyacaktır. Elif'in kartındaki sayı, masadaki kartların her birindeki sayıyla aralarında asal olmalıdır.</p>", "k": "Buna göre, Elif'in kartında yazan sayı kaç farklı değer alabilir?", "sec": ["7", "8", "10", "12"], "secg": null, "c": "B", "a": ["6 = 2 · 3, 10 = 2 · 5, 15 = 3 · 5; masadaki sayıların asal çarpanları 2, 3 ve 5'tir.", "Elif'in sayısı 2'ye, 3'e ve 5'e bölünmemelidir.", "21 ile 49 arasında bu koşulu sağlayanlar: 23, 29, 31, 37, 41, 43, 47 ve 49 → 8.", "49 = 7 · 7 asal değildir ama 6, 10 ve 15 ile ortak asal çarpanı yoktur."], "t": "7: yalnız asal sayılar sayılmış, 49 unutulmuş; 10: 5'e bölünebilme kontrol edilmeyip 25 ve 35 de sayılmış; 12: yalnız 2 ve 5 kontrol edilmiş.", "d": "Elif'in sayısı 6, 10 ve 15'in asal çarpanları olan 2, 3 ve 5'in hiçbirine bölünmemelidir. Asal olmayan bir sayı da bu koşulu sağlayabilir (49 gibi); 20 ve 50 hariçtir.", "ses": "b18"}, {"no": 19, "on": "<p>Bir bakkalda 50 kg pirinç bulunan bir çuval ile 16 kg bulgur bulunan bir çuval vardır. Bakkal, pirinç çuvalına 4 kg'lık özdeş pirinç paketleri, bulgur çuvalına da 5 kg'lık özdeş bulgur paketleri boşaltacaktır.</p>", "g": "<svg viewBox=\"0 0 340 128\" width=\"340\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><path d=\"M20,30 q-14,40 0,88 h76 q14,-48 0,-88 z\" fill=\"#f8f9fa\" stroke=\"#868e96\" stroke-width=\"1.8\"/><line x1=\"22.0\" y1=\"30.0\" x2=\"94.0\" y2=\"30.0\" stroke=\"#868e96\" stroke-width=\"3\"/><rect x=\"22.0\" y=\"56.0\" width=\"72.0\" height=\"46.0\" rx=\"5\" fill=\"#fff\" stroke=\"#868e96\" stroke-width=\"1.2\"/><text x=\"58.0\" y=\"75.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#868e96\" text-anchor=\"middle\">Pirinç</text><text x=\"58.0\" y=\"95.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">50 kg</text><rect x=\"116.0\" y=\"66.0\" width=\"44.0\" height=\"52.0\" rx=\"4\" fill=\"#f8f9fa\" stroke=\"#868e96\" stroke-width=\"1.6\"/><line x1=\"116.0\" y1=\"76.0\" x2=\"160.0\" y2=\"76.0\" stroke=\"#868e96\" stroke-width=\"1.2\"/><text x=\"138.0\" y=\"102.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">4 kg</text><path d=\"M188,30 q-14,40 0,88 h76 q14,-48 0,-88 z\" fill=\"#fff4e6\" stroke=\"#b35c00\" stroke-width=\"1.8\"/><line x1=\"190.0\" y1=\"30.0\" x2=\"262.0\" y2=\"30.0\" stroke=\"#b35c00\" stroke-width=\"3\"/><rect x=\"190.0\" y=\"56.0\" width=\"72.0\" height=\"46.0\" rx=\"5\" fill=\"#fff\" stroke=\"#b35c00\" stroke-width=\"1.2\"/><text x=\"226.0\" y=\"75.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#b35c00\" text-anchor=\"middle\">Bulgur</text><text x=\"226.0\" y=\"95.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font /* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
