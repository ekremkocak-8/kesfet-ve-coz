<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çözümler · Keşfet ve Çöz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--muted:#5b6478;--line:#dfe5ef;--bg:#f5f7fb;--card:#fff;--ss:#6741d9;--kk:#0b7285;--b:#d0700f;--ok:#2b8a3e;--warn:#c92a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif}
header{background:linear-gradient(135deg,#1c5fbf,#2f8fe0);color:#fff;padding:18px 16px 22px}

main{max-width:780px;margin:14px auto 40px;padding:0 16px}
nav.sec{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}nav.sec button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}

ol.sec{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
ol.sec li{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}ol.sec li.dogru{border-color:var(--ok);background:#ebfbee;font-weight:800}
.adim{border-left:4px solid var(--c);padding:6px 12px;margin:8px 0;background:#fff;border-radius:0 10px 10px 0;animation:gel .35s ease-out}
.adim b{color:var(--c)}@keyframes gel{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dug{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
button.btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.dikkat{background:#fff4e6;border:2px solid #f59f00;border-radius:12px;padding:10px 14px;margin:12px 0 4px}.dikkat b{color:#d9480f}
.tuzak{font-size:15px;color:var(--muted);margin-top:8px}
.cevap{font-weight:900;color:var(--ok);margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid var(--line);padding:8px 10px;text-align:left}th{background:#e3fafc;color:#0b7285;font-size:13px;letter-spacing:.06em}
.ses{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border-radius:12px;background:#eef2ff}

.ses span{font-size:14px;color:var(--muted)}
.gizli{display:none}
.tum{margin:4px 0 14px;font-size:14px}.tum a{color:#1c5fbf;font-weight:800}
@media (prefers-reduced-motion:reduce){.adim{animation:none}}
/* Canlandır (05.10.2026) */
.sek{display:flex;gap:6px;margin:12px 0 0;border-bottom:2px solid var(--line)}
.sek button{border:0;background:none;font:inherit;font-weight:900;font-size:15px;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);min-height:44px;position:relative;top:2px;border-bottom:3px solid transparent}
.sek button[aria-selected=true]{color:var(--c);border-bottom-color:var(--c);background:#fff8f0}
.sek .yeni{display:inline-block;font-size:10px;background:#2b8a3e;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.06em}
.cn{padding-top:10px}
.cn-yon{background:#eef6ff;border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:10px}
.cn-sahne{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;min-height:120px;overflow-x:auto}

.cn-adimci input,.cn-test input{width:84px;height:44px;border:2px solid var(--line);border-radius:12px;font:inherit;font-weight:900;text-align:center;font-size:18px}
.cn-test label{font-weight:800;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.cn-btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
.cn-btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.cn-btn[aria-pressed=true]{background:var(--ac,var(--c));color:#fff;border-color:var(--ac,var(--c))}
.cn-btn:disabled{opacity:.5}
.cn-hazir{display:flex;flex-wrap:wrap;gap:6px}

.cn-dur .iyi{color:var(--ok);font-weight:900}.cn-dur .kotu{color:var(--warn);font-weight:900}
.cn-df{margin-top:10px;overflow-x:auto}@media(max-width:480px){.cn-adimci>span{flex-basis:100%}.cn-h{font-size:12px;padding:5px 0}.cn-izg{gap:3px}.cn-sahne{padding:6px}}@media(max-width:480px){.cn-df table{font-size:13px}.cn-df td,.cn-df th{padding:4px 5px}}.cn-df summary{font-weight:900;cursor:pointer;padding:6px 0}.cn-say{color:var(--muted);font-weight:700}
.cn-df table{font-size:15px}.cn-df td{padding:5px 8px}.cn-df tr.cn-iyi td{background:#ebfbee}.cn-df tr.cn-kotu td{background:#fff5f5}.cn-df tr.cn-son td{outline:2px solid var(--c);outline-offset:-2px}
.cn-p{animation:cnGel .35s ease-out both}@keyframes cnGel{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cn-o{fill:#ffa94d;stroke:#d9480f;stroke-width:1}.cn-o2{fill:#e8590c}.cn-k{fill:#ffc9c9;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:3 2}
.cn-cerceve{stroke:#2b8a3e;stroke-width:3}.cn-et{font-size:13px;font-weight:800;fill:#5b6478}.cn-et.b,.cn-et2b{font-weight:900;fill:#1d2433}.cn-et2{font-size:11px;fill:#5b6478;font-weight:700}.cn-et2b{font-size:13px;fill:#fff}
.cn-ku{fill:#fff4e6;stroke:#ffa94d;stroke-width:1.5}.cn-kk{fill:#fff5f5;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:4 3}
.cn-tahta0{fill:#f1f3f5;stroke:#ced4da}.cn-tahta{fill:#c08552;stroke:#8d5a2b}
.cn-ek{stroke:#868e96;stroke-width:2}.cn-sinir{stroke:#c92a2a;stroke-width:3;stroke-dasharray:5 4}.cn-yay{fill:none;stroke:#f76707;stroke-width:2}
.cn-v1{stroke:#2b8a3e;stroke-width:3}.cn-v2{stroke:#c92a2a;stroke-width:3}.cn-kis{font-size:20px}.cn-bus{font-size:16px}.cn-bek{stroke:#c92a2a;stroke-width:5;stroke-linecap:round;opacity:.6}
.cn-kum{fill:#ffe8cc;stroke:#e8590c;stroke-width:3}.cn-kum2{fill:#495057}.cn-para{fill:#ffd43b;opacity:.85}.cn-buyuk{font-size:26px;font-weight:900;fill:#1d2433}
.cn-zem{fill:#adb5bd}.cn-kat{fill:#f1f3f5;stroke:#ced4da}.cn-katon{fill:#d3f9d8;stroke:#2b8a3e}.cn-katoff{fill:#ffe3e3;stroke:#e03131}
.cn-izg{display:grid;gap:4px}.cn-h,.cn-gb{border-radius:8px;text-align:center;font-weight:800;font-size:14px;padding:6px 0}.cn-h{background:#f1f3f5;transition:background .25s,transform .25s}
.cn-gb{background:none;color:var(--muted);font-size:12px}.cn-h.on{background:#ffa94d;color:#1d2433}.cn-h.yeni{transform:scale(1.18);box-shadow:0 0 0 3px #e8590c}
.cn-kartlar{display:flex;flex-wrap:wrap;gap:6px;padding:4px}.cn-kart{min-width:44px;padding:8px 10px;text-align:center;border-radius:10px;background:#fff4e6;border:2px solid #ffa94d;font-weight:900;animation:cnGel .3s}
.cn-kart.kare{background:#e7f5ff;border-color:#1c7ed6}.cn-bosk{color:var(--muted)}
.cn-cift{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 4px;font-weight:800}.cn-cift i{font-weight:600;color:#1c7ed6}
.cn-katlar{padding:4px}.cn-katsat{display:inline-flex;flex-wrap:wrap;gap:6px}.cn-kat2{background:#e6fcf5;border:1.5px solid #12b886;border-radius:8px;padding:3px 8px;font-weight:800;animation:cnGel .3s}.cn-sonsuz{font-weight:800;color:#0b7285}
.cn-onr{background:#f8f0fc;border:2px solid #ae3ec9;border-radius:12px;padding:10px 14px}.cn-kanit{padding:10px 4px 2px}
.cn-kay{display:inline-flex;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap}.cn-kay{max-width:100%}.cn-kay input{width:min(220px,70vw);accent-color:#d0700f}.cn-satir>*{min-width:0;max-width:100%}
@media (prefers-reduced-motion:reduce){.cn-p,.cn-kart,.cn-kat2{animation:none}.cn-h{transition:none}}
/* 05.10.2026 · KOŞUL ve LABİRENT motorları (SB 6.1.1) */
@media(max-width:560px){.soru [style*="grid-template-columns:repeat"]{grid-template-columns:1fr!important}}   /* çok sütunlu konuşma balonları telefonda alt alta */
.cn-kl{list-style:none;padding:0;margin:0;display:grid;gap:4px}.cn-not{color:var(--muted);font-size:14px}.cn-sonuc{margin-top:6px;font-weight:800}
.cn-secg{gap:6px}.cn-secad{font-weight:800;flex-basis:100%}.cn-secg .cn-btn{padding:8px 12px}
.cn-mv{fill:#74c0fc;stroke:#1c7ed6;stroke-width:1}.cn-tl{fill:#69db7c;stroke:#2b8a3e;stroke-width:1.5}
.cn-lab{display:grid;gap:4px;align-items:center;max-width:460px;margin:0 auto}
.cn-lc{min-height:44px;border-radius:8px;border:1.5px solid #ced4da;background:#fff;font:inherit;font-weight:900;font-size:16px;cursor:pointer;padding:0;color:var(--ink)}
.cn-lc.yol{background:#d3f9d8;border-color:#2b8a3e}.cn-lc.simdi{background:#2b8a3e;color:#fff;box-shadow:0 0 0 3px #b2f2bb}.cn-lc.kapali{background:#ffe3e3;border-color:#e03131;color:#c92a2a;text-decoration:line-through}
.cn-lok{color:#2b8a3e;font-weight:900;text-align:center}.cn-lcik{min-height:44px;border:0;background:none;font:inherit;font-weight:900;color:#d9480f;cursor:pointer;padding:0;white-space:nowrap;font-size:14px}.cn-lcik:disabled{cursor:default}

</style></head><body>
<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }
      if (!art && !o.sandalye) sv += `<rect x="10" y="10" width="${gen * hc}" height="${sira * hc}" fill="none" class="cn-cerceve"/>
        <text x="${10 + gen * hc / 2}" y="${H + 4}" class="cn-et" text-anchor="middle">${gen} ${o.birim || ""}</text>
        <text x="${W + 4}" y="${10 + sira * hc / 2}" class="cn-et" dominant-baseline="middle">${sira} ${o.birim || ""}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W + 70} ${H + 22}" role="img" aria-label="${N} ${o.ad || "kare"}, her sırada ${gen}">${sv}</svg>`;
      const r = o.kural ? o.kural(gen, sira, art, N) : null;
      let m;
      if (art) m = `<span class="kotu">✘</span> ${N} ${o.ad || "kare"} her sırada ${gen} olacak biçimde dizilince ${sira} tam sıra oluşur, <b>${art} ${o.ad || "kare"} artar</b>. Dikdörtgen olmaz: ${N} : ${gen} işleminde kalan ${art}.`;
      else m = `<span class="iyi">✔</span> <b>${N} = ${gen} ${x} ${sira}</b> · ${sira} sıra, her sırada ${gen} ${o.ad || "kare"}; hiç artmadı.` + (gen === sira ? ` <b>Kare oldu!</b> İki kenar aynı: ${gen}.` : "");
      if (!art && o.cevre) m += ` Çevre = 2 ${x} (${gen} + ${sira}) = <b>${2 * (gen + sira)} m</b>.`;
      if (r && r.msg) m += `<br>${r.msg}`;
      s.dur.innerHTML = m;
      const sutunlar = o.satir ? o.satir(gen, sira, art, N, r) : [gen, art ? `${sira} (+ ${art} artan)` : sira, art, art ? "olmaz" : (gen === sira ? "kare" : "dikdörtgen")];
      s.yaz(N + ":" + gen, sutunlar, !art && (!r || r.ok !== false));
    }
    ciz(g.get());
  }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {
    const N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });
    const g = adimci(o.etiket, 1, o.max || N, o.bas || 2, v => { sonK = v; });

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {

      ciftler.innerHTML = L.filter(v => v * v <= N).map(v => `<span>${v} ${x} ${N / v}${v * v === N ? " <i>(aynı sayı: bir kez yazılır)</i>" : ""}</span>`).join("");

    const tamamMi = () => { for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) return false; return true; };
    const eksik = () => { const L = []; for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) L.push(i); return ` <br>Henüz denenmeyen küçük bölenler var: <b>${L.join(", ")}</b>. Bunları da deneyin.`; };
    function dene(d) {
      if (!d || d < 1) return; denendi.add(d);
      const b = Math.floor(N / d), r = N % d;
      if (d > N) { s.dur.innerHTML = `${d} > ${N}: ${E(N,"den")} büyük sayı ${E(N,"in")} çarpanı olamaz.`; return; }
      if (r === 0) { bul.add(d); bul.add(b); ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${N} : ${d} = ${b}, kalan 0 → <b>${d} ${x} ${b} = ${N}</b>. ${d} ve ${b} çarpandır.` + (d * d >= N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} ${d * d === N ? "=" : ">"} ${N}. Artık yeni çift çıkmaz; bütün çarpanlar bulundu.` : eksik() : ""); }
      else { s.dur.innerHTML = `<span class="kotu">✘</span> ${N} : ${d} işleminde bölüm ${b}, <b>kalan ${r}</b>. ${d}, ${E(N,"in")} çarpanı değildir.` + (d * d > N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} > ${N}. Daha büyük bölen denemeye gerek yok; çarpan listesi tamam.` : eksik() : ""); }
      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));
      if (tamam) s.yaz("n" + N, [N, [...bul].sort((a, b) => a - b).join(", "), bul.size], true);
    }
    bD.onclick = () => dene(Math.round(+bi.value));
    bS.onclick = () => { let d = 1; while (denendi.has(d)) d++; bi.value = d; dene(d); };
    if (bK) bK.onclick = async () => {
      bK.disabled = true; katlar.textContent = ""; const sat = h("div", "cn-katsat"); katlar.append(h("b", "", `${E(N,"in")} katları: `), sat);
      for (let i = 1; i <= (o.katSay || 12); i++) { sat.appendChild(h("span", "cn-kat2", `${N * i}`)); await bekle(220); }
      sat.appendChild(h("span", "cn-sonsuz", "… ve sonsuza kadar sürer"));
      bK.disabled = false;
    };
    yeni();
  }

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */
  function KUMBARA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Para", "Sonuç"] });
    const k = o.k; let hafta = 0, tmr = null;
    const kut = h("div", "cn-satir"); const bA = dug("Bir hafta geçsin +"), bO = dug("▶ Haftaları oynat", "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bO, bS); s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Kumbarada şu para olabilir mi? <input type="number" inputmode="numeric" min="1" max="500"> TL</label>`;
    const bT = dug("Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test); const ti = test.querySelector("input");
    function ciz() {
      const top = hafta * k, sv = [];
      const yuk = Math.min(150, top * 1.4);
      sv.push(`<rect x="110" y="20" width="120" height="160" rx="22" class="cn-kum"/><rect x="150" y="14" width="40" height="8" rx="3" class="cn-kum2"/>`);
      sv.push(`<rect x="116" y="${176 - yuk}" width="108" height="${yuk}" rx="10" class="cn-para"/>`);
      sv.push(`<text x="170" y="110" text-anchor="middle" class="cn-buyuk">${top} TL</text><text x="170" y="134" text-anchor="middle" class="cn-et">${hafta}. hafta</text>`);
      let cizgi = ""; for (let i = 1; i <= hafta && i <= 16; i++) cizgi += `<text x="${260 + ((i - 1) % 4) * 52}" y="${40 + Math.floor((i - 1) / 4) * 34}" class="cn-et2">${k}${x}${i}=${k * i}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 480 190" role="img" aria-label="Kumbara">${sv.join("")}${cizgi}</svg>`;
      s.dur.innerHTML = hafta ? `${hafta}. hafta sonunda kumbarada ${k} ${x} ${hafta} = <b>${top} TL</b> var.` : `Kumbara boş. Her hafta ${k} TL atılıyor.`;
    }
    bA.onclick = () => { hafta++; ciz(); };
    bO.onclick = () => { if (tmr) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } bO.textContent = "❚❚ Durdur"; tmr = setInterval(() => { if (hafta >= 15) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } hafta++; ciz(); }, az ? 50 : 500); };
    bS.onclick = () => { hafta = 0; ciz(); };
    bT.onclick = () => {
      const v = Math.round(+ti.value); if (!v) return; const b = Math.floor(v / k), r = v % k;
      s.dur.innerHTML = r ? `<span class="kotu">✘</span> ${k} ${x} ${b} = ${k * b} TL, ${k} ${x} ${b + 1} = ${k * (b + 1)} TL. ${v} TL arada kalır (${v} : ${k} → kalan ${r}). Kumbarada hiçbir hafta ${v} TL olmaz.`
        : `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · ${b}. hafta sonunda kumbarada tam ${v} TL olur.`;
      if (!r) { hafta = b; ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · <b>${b}. hafta</b> sonunda kumbarada tam ${v} TL olur.`; }
      s.yaz("t" + v, [v + " TL", r ? `kalan ${r} ✘` : `${k} ${x} ${b} ✔`], !r);
    };
    ciz();
  }

  /* 9) ÖNERME LABORATUVARI: önermeyi farklı sayılarla sınama */
  function ONERME(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Önerme", "Sayı", "Sonuç"] });
    let akt = 0; const kut = h("div", "cn-hazir");
    const bt = o.onermeler.map((on, i) => { const b = dug(on.ad, "ghost"); b.setAttribute("aria-pressed", i === 0); b.onclick = () => { akt = i; bt.forEach((x, j) => x.setAttribute("aria-pressed", j === i)); goster(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Sınanacak sayı: <input type="number" inputmode="numeric" min="1" max="200" value="12"></label>`;
    const bT = dug("Sına"), bR = dug("Rastgele sayı", "ghost"); test.append(bT, bR); s.den.appendChild(test); const ti = test.querySelector("input");
    function goster() { s.sah.innerHTML = `<div class="cn-onr"><b>${o.onermeler[akt].ad}:</b> “${o.onermeler[akt].metin}”</div>`; s.dur.innerHTML = "Bir sayı yazıp Sına düğmesine basın. Önerme her sayıda doğru mu?"; }
    function sina(n) {
      const on = o.onermeler[akt], r = on.sina(n);
      s.sah.innerHTML = `<div class="cn-onr"><b>${on.ad}:</b> “${on.metin}”</div><div class="cn-kanit">${r.goster}</div>`;
      s.dur.innerHTML = (r.ok ? `<span class="iyi">✔</span> ${n} için önerme doğru.` : `<span class="kotu">✘</span> ${n} için önerme yanlış! Bir karşı örnek bulundu.`) + (r.not ? " " + r.not : "");
      s.yaz(akt + ":" + n, [on.ad, n, r.ok ? "doğru" : "yanlış (karşı örnek)"], r.ok);
    }
    bT.onclick = () => { const n = Math.round(+ti.value); if (n > 0) sina(n); };
    bR.onclick = () => { const n = 2 + Math.floor(Math.random() * 59); ti.value = n; sina(n); };
    goster();
  }


  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →
     koşullar tek tek denetlenir (✔/✘) → deney defterine yazılır. Doğru cevap verilmez; öğrenci uygun girdiyi kendisi arar.
     o.girdi: [{ad, min, max, bas} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → SVG/HTML · o.kosullar: [{ad, f(v) → bool | {ok, not}}]
     o.dugme: düğme yazısı (false → her değişiklikte denetlenir) · o.sonuc(v, hepsi, L) · o.satir(v, hepsi, L) · o.iyi(v, L) · o.ek: [{ad, deger(v) → v}] */
  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);
      s.dur.innerHTML = m;
      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);
    }
    kur = true; ciz();
    if (bS) s.dur.innerHTML = o.ilk || "Değerleri seçip Sına düğmesine basın."; else sina();
  }

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

/* SORU BANKASI · MAT.5.1.2 · yeni nesil soruların "Canlandır" düzenekleri (06.10.2026) — ortak motor: canlandir.js (CN.KOSUL)
   §4.k / §19-10: öğrenci değerleri elle değiştirir → çizim ve koşul lambaları anında değişir → her deneme deney defterine yazılır →
   tekrar dener. Doğru cevap düğmeyle verilmez; denemelerden çıkar. Ortak dosyalar değiştirilmez; çizim yardımcıları burada tanımlıdır. */
(() => {
  const NB = " ";
  const S = n => { const s = String(n); return Math.abs(n) < 10000 ? s : s.replace(/\B(?=(\d{3})+(?!\d))/g, NB); };
  // telefonda yazılar küçülmesin (§4.x-11): çizim en az 0,95 x genişlikte çizilir, dar ekranda yalnız kendi kutusu içinde kaydırılır
  const sv = (w, h, ic, et) => `<div style="overflow-x:auto;max-width:100%"><svg viewBox="0 0 ${w} ${h}" style="min-width:${Math.round(w * 0.95)}px" role="img" aria-label="${et || "canlandırma"}">${ic}</svg></div>`;
  const tx = (x, y, s, fs = 15, w = 800, f = "#1d2433", a = "middle") => `<text x="${x}" y="${y}" font-size="${fs}" font-weight="${w}" fill="${f}" text-anchor="${a}" font-family="Nunito,Arial,sans-serif">${s}</text>`;
  const rc = (x, y, w, h, f, s = "#1c7ed6", rx = 4, ek = "") => `<rect x="${x}" y="${y}" width="${Math.max(0, w)}" height="${h}" rx="${rx}" fill="${f}" stroke="${s}" stroke-width="2" ${ek}/>`;
  const ek = (ad, d, i = 0, min = 0, max = 1e9) => ({ ad, deger: v => { const y = v.slice(); y[i] = Math.max(min, Math.min(max, y[i] + d)); return y; } });
  const sa = m => `${String(Math.floor(m / 60) % 24).padStart(2, "0")}.${String(m % 60).padStart(2, "0")}`;
  const T = (ad, f) => ({ ad, f });
  const iyi = "#2b8a3e", kotu = "#c92a2a";
  if (!document.getElementById("sb512-stil")) { const st = document.createElement("style"); st.id = "sb512-stil";   // tek karakterli seçim düğmeleri de en az 44 px
    st.textContent = ".cn-secg .cn-btn{min-width:44px;min-height:44px}"; document.head.appendChild(st); }

  window.CANL = {
    /* 1 · gezi otobüsleri: öğrencileri firmalara yerleştir, ücreti en aza indir */
    1: el => { const F = [["Doğu", 28, 190], ["Kuzey", 42, 165], ["Güney", 35, 155]];

      return CN.KOSUL(el, { girdi: F.map(([a, k], i) => ({ ad: `${a} Turizm'e (en fazla ${k}):`, min: 0, max: k, bas: [28, 42, 20][i] })), dugme: false,

        ciz: v => { let o = ""; F.forEach(([a, k, u], i) => { const y = 14 + i * 58, w = 300 / 42;
            o += tx(96, y + 26, `${a} (${u} TL)`, 14, 800, "#1d2433", "end") + rc(104, y, k * w, 36, "#fff", "#adb5bd", 6) + rc(104, y, v[i] * w, 36, ["#ffe3e3", "#e7f5ff", "#ebfbee"][i], ["#e03131", "#1c7ed6", "#2b8a3e"][i], 6) +
              tx(104 + k * w + 10, y + 24, `${v[i]} kişi · ${S(v[i] * u)} TL`, 13.5, 700, "#1d2433", "start"); });
          return sv(560, 190, o + tx(280, 186, `Yerleşen: ${top(v)} / 90 öğrenci · Toplam ücret: ${S(ucret(v))} TL`, 15, 800, top(v) === 90 ? iyi : kotu)); },
        kosullar: [T("90 öğrencinin hepsi yerleşti (ne eksik ne fazla).", v => top(v) === 90),
                   T("Daha pahalı bir firmada öğrenci varken daha ucuz bir firmada boş koltuk kalmadı.", v => !ucuzBos(v))],
        sonuc: (v, h) => h ? `<p class="cn-sonuc">Bu yerleşimle ödenen ücret: <b>${S(ucret(v))} TL</b>. Başka bir yerleşim daha az tutar mı? Deneyin.</p>` : "",
        sutun: ["Doğu", "Kuzey", "Güney", "Toplam ücret"], satir: v => [v[0], v[1], v[2], top(v) === 90 ? S(ucret(v)) + " TL" : `${top(v)} kişi ✘`],
        yon: "Her firmaya kaç öğrenci yerleştireceğinizi değiştirin. Çubuklar dolar, ücret anında hesaplanır. Önce ekrandaki sırayla doldurun, sonra en ucuz firmadan başlayarak doldurun; iki toplam ücreti deney defterinde karşılaştırın.",
        bitis: "90 öğrencinin yerleştiği ve iki koşulun da yeşil olduğu yerleşimi bulduğunuzda." }); },

    /* 2 · sera pompası: aynı anda mı art arda mı? */
    2: el => { const D = [12, 20, 15];
      const saatlik = b => b === "Aynı anda başlar" ? Math.max(...D) : D.reduce((a, c) => a + c, 0);
      return CN.KOSUL(el, { girdi: [{ ad: "Sıraların sulaması:", sec: ["Art arda yapılır", "Aynı anda başlar"], bas: "Art arda yapılır" }, { ad: "Sayılan sulama (saat başı):", min: 1, max: 6, bas: 1 }], dugme: false,
        ciz: v => { let o = tx(20, 18, "Bir saat (0–60. dakika)", 13, 800, "#5b6478", "start"); const u = 8.6; let bas = 0;
          D.forEach((d, i) => { const x = 40 + (v[0] === "Aynı anda başlar" ? 0 : bas) * u; o += tx(34, 46 + i * 30, `${i + 1}.`, 13, 800, "#1d2433", "end") + rc(x, 30 + i * 30, d * u, 22, ["#e7f5ff", "#fff4e6", "#ebfbee"][i], ["#1c7ed6", "#e8590c", "#2b8a3e"][i], 4) + tx(x + d * u / 2, 46 + i * 30, d + " dk", 12, 800); bas += d; });
          o += `<line x1="40" y1="124" x2="${40 + 60 * u}" y2="124" stroke="#1d2433" stroke-width="2"/>` + rc(40, 130, saatlik(v[0]) * u, 14, "#d0bfff", "#7048e8", 3) + tx(40 + saatlik(v[0]) * u + 6, 142, `pompa ${saatlik(v[0])} dk çalışır`, 12.5, 800, "#7048e8", "start");
          return sv(580, 160, o) + `<p style="text-align:center;font-weight:800">${v[1]} sulama x ${saatlik(v[0])} dakika = ${v[1] * saatlik(v[0])} dakika</p>`; },
        kosullar: [T("Sulamalar paneldeki gibi her saat başında aynı anda başlıyor.", v => v[0] === "Aynı anda başlar"), T("08.00 ile 14.00 arasındaki bütün sulamalar sayıldı.", v => v[1] === 6)],
        sutun: ["Sulama biçimi", "Sulama sayısı", "Pompanın çalıştığı süre"], satir: v => [v[0], v[1], v[1] * saatlik(v[0]) + " dk"],
        yon: "Önce sıraların art arda sulandığını, sonra aynı anda başladığını seçip pompanın bir saatte kaç dakika çalıştığını karşılaştırın. Sonra 08.00 ile 14.00 arasında başlayan sulama sayısını ayarlayın.",
        bitis: "İki koşul da yeşil olduğunda." }); },

    /* 3 · tren haritası: Kale'ye uğrayan en kısa yol */
    3: el => { const P = { Akçay: [70, 150], Yeşilköy: [250, 50], Kale: [330, 150], Ilıca: [210, 240], Pınarbaşı: [520, 150] };
      const Dm = { "Akçay-Yeşilköy": 130, "Yeşilköy-Kale": 110, "Akçay-Ilıca": 80, "Ilıca-Kale": 190, "Ilıca-Pınarbaşı": 270, "Kale-Pınarbaşı": 150, "Yeşilköy-Pınarbaşı": 240 };
      const d = (a, b) => Dm[a + "-" + b] || Dm[b + "-" + a];
      const Y1 = { "Yeşilköy üzerinden": ["Akçay", "Yeşilköy", "Kale"], "Ilıca üzerinden": ["Akçay", "Ilıca", "Kale"] };
      const Y2 = { "Doğrudan": ["Kale", "Pınarbaşı"], "Yeşilköy üzerinden": ["Kale", "Yeşilköy", "Pınarbaşı"], "Ilıca üzerinden": ["Kale", "Ilıca", "Pınarbaşı"] };
      const yol = v => Y1[v[0]].concat(Y2[v[1]].slice(1)), uz = L => L.slice(1).reduce((t, b, i) => t + d(L[i], b), 0);
      return CN.KOSUL(el, { girdi: [{ ad: "Akçay → Kale:", sec: Object.keys(Y1), bas: "Ilıca üzerinden" }, { ad: "Kale → Pınarbaşı:", sec: Object.keys(Y2), bas: "Yeşilköy üzerinden" }], dugme: false,
        ciz: v => { const L = yol(v), kul = new Set(L.slice(1).map((b, i) => [L[i], b].sort().join("-"))); let o = "";
          Object.entries(Dm).forEach(([k, km]) => { const [a, b] = k.split("-"), [x1, y1] = P[a], [x2, y2] = P[b], on = kul.has([a, b].sort().join("-"));
            o += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${on ? "#e8590c" : "#ced4da"}" stroke-width="${on ? 7 : 4}"/>` + tx((x1 + x2) / 2, (y1 + y2) / 2 - 6, km + " km", 13, 800, on ? "#d9480f" : "#5b6478"); });
          Object.entries(P).forEach(([k, [x, y]]) => { o += rc(x - 8 - k.length * 4.5, y - 14, 16 + k.length * 9, 28, k === "Kale" ? "#fff4e6" : "#e7f5ff", k === "Kale" ? "#e8590c" : "#1c7ed6", 8) + tx(x, y + 5, k, 13.5); });
          return sv(600, 270, o) + `<p style="text-align:center;font-weight:800">${L.join(" → ")}: ${L.slice(1).map((b, i) => d(L[i], b)).join(" + ")} = ${uz(L)} km</p>`; },
        kosullar: [T("Yol Kale'den geçiyor.", v => yol(v).includes("Kale")), T("Bu yol, denenebilecek yolların en kısası.", v => uz(yol(v)) === 390)],
        sutun: ["Akçay → Kale", "Kale → Pınarbaşı", "Toplam"], satir: v => [v[0], v[1], uz(yol(v)) + " km"],
        yon: "İki parçanın yolunu seçin; seçilen hatlar haritada turuncu olur ve toplam uzunluk hesaplanır. Bütün seçenekleri deneyip deney defterindeki uzunlukları karşılaştırın.",
        bitis: "Altı yolun hepsini denediğinizde ve iki koşul da yeşil olduğunda." }); },

    /* 4 · fotoğraf baskısı: siparişi böl, tutarı karşılaştır */
    4: el => { const f = n => Math.min(n, 40) * 14 + Math.min(Math.max(n - 40, 0), 60) * 11 + Math.max(n - 100, 0) * 8;
      const tek = f(130);
      return CN.KOSUL(el, { girdi: [{ ad: "1. siparişteki fotoğraf:", min: 0, max: 130, bas: 130 }], dugme: false, ek: [ek("− 10", -10, 0, 0, 130), ek("+ 10", 10, 0, 0, 130), ek("− 1", -1, 0, 0, 130), ek("+ 1", 1, 0, 0, 130)],
        ciz: v => { const a = v[0], b = 130 - a; const ser = (n, y, ad) => { const p = [Math.min(n, 40), Math.min(Math.max(n - 40, 0), 60), Math.max(n - 100, 0)], u = 3.0; let x = 120, o = tx(112, y + 22, ad, 13, 800, "#1d2433", "end");
              p.forEach((k, i) => { if (k) { o += rc(x, y, k * u, 32, ["#ffe8cc", "#e7f5ff", "#ebfbee"][i], ["#e8590c", "#1c7ed6", "#2b8a3e"][i], 3) + (k * u > 40 ? tx(x + k * u / 2, y + 21, `${k} x ${[14, 11, 8][i]}`, 12, 800) : ""); x += k * u; } });
              return o + tx(x + 8, y + 21, n ? S(f(n)) + " TL" : "—", 13, 800, "#1d2433", "start"); };
          return sv(600, 104, ser(a, 8, "1. sipariş") + ser(b, 56, "2. sipariş")) + `<p style="text-align:center;font-weight:800">${b ? `İki sipariş: ${S(f(a))} + ${S(f(b))} = ${S(f(a) + f(b))} TL` : `Tek sipariş: ${S(tek)} TL`} · Tek siparişe göre fark: ${S(f(a) + f(b) - tek)} TL</p>`; },
        kosullar: [T("Fotoğraflar 65'er fotoğraflık iki siparişe bölündü.", v => v[0] === 65)],
        sutun: ["1. sipariş", "2. sipariş", "Toplam", "Tek siparişe göre fark"], satir: v => [v[0], 130 - v[0], S(f(v[0]) + f(130 - v[0])) + " TL", S(f(v[0]) + f(130 - v[0]) - tek) + " TL"],
        yon: "130 fotoğrafı iki siparişe bölün: 1. siparişteki fotoğraf sayısını değiştirin, gerisi 2. siparişe gider. Renkli parçalar her kademede kaç fotoğraf olduğunu gösterir. Önce 130'u tek sipariş olarak, sonra 65 ile 65 olarak, sonra başka bölüşlerle deneyin.",
        bitis: "65 ile 65 bölüşünü ve en az iki başka bölüşü deneyip tutarları karşılaştırdığınızda." }); },

    /* 5 · sayfa numaraları: kullanılan rakamları say */
    5: el => { const rk = n => Math.min(n, 9) + Math.max(0, Math.min(n, 99) - 9) * 2 + Math.max(0, n - 99) * 3;
      return CN.KOSUL(el, { girdi: [{ ad: "Kitabın sayfa sayısı:", min: 1, max: 600, bas: 300 }], dugme: false, ek: [ek("− 100", -100, 0, 1, 600), ek("+ 100", 100, 0, 1, 600), ek("− 10", -10, 0, 1, 600), ek("+ 10", 10, 0, 1, 600), ek("− 1", -1, 0, 1, 600), ek("+ 1", 1, 0, 1, 600)],
        ciz: v => { const n = v[0], a = Math.min(n, 9), b = Math.max(0, Math.min(n, 99) - 9), c = Math.max(0, n - 99), u = 0.16;
          let o = tx(10, 20, "Kullanılan rakamlar", 13, 800, "#5b6478", "start");
          [[a, 1, "1–9: tek basamaklı"], [b, 2, "10–99: iki basamaklı"], [c, 3, "100 ve sonrası: üç basamaklı"]].forEach(([k, bs, ad], i) => { const y = 32 + i * 40;
            o += tx(10, y + 18, ad, 12.5, 700, "#1d2433", "start") + rc(200, y, Math.max(2, k * bs * u), 26, ["#fff4e6", "#e7f5ff", "#ebfbee"][i], ["#e8590c", "#1c7ed6", "#2b8a3e"][i], 3) + tx(206 + k * bs * u, y + 18, `${k} sayfa x ${bs} = ${k * bs}`, 12.5, 800, "#1d2433", "start"); });
          return sv(600, 160, o) + `<p style="text-align:center;font-weight:800;font-size:18px">Makinenin ekranı: <span style="color:${rk(n) === 1137 ? iyi : "#1d2433"}">${rk(n)}</span> (hedef 1137)</p>`; },
        kosullar: [T("Ekranda 1137 görünüyor.", v => rk(v[0]) === 1137)],
        sutun: ["Sayfa sayısı", "Kullanılan rakam", "Hedefe göre"], satir: v => [v[0], rk(v[0]), rk(v[0]) === 1137 ? "tam ✔" : rk(v[0]) < 1137 ? "az" : "fazla"],
        yon: "Kitabın sayfa sayısını değiştirin; makine 1'den o sayfaya kadar kullanılan rakamları üç gruba ayırarak sayar. Ekranda 1137 görünen sayfa sayısını bulun. 1 sayfa artınca rakam sayısı kaç artıyor?",
        bitis: "Koşul yeşil olduğunda." }); },

    /* 6 · küp şeker paketleri: 1500 şeker, en az ödeme */
    6: el => { const P = { K: [300, 90], L: [500, 140], M: [750, 195] };
      return CN.KOSUL(el, { girdi: [{ ad: "Paket:", sec: ["K", "L", "M"], bas: "K" }, { ad: "Paket sayısı:", min: 1, max: 10, bas: 1 }], dugme: false,
        ciz: v => { const [a, f] = P[v[0]], n = v[1], top = a * n; let o = ""; for (let i = 0; i < n; i++) o += rc(10 + (i % 10) * 56, 10, 48, 60, ["#e7f5ff", "#fff4e6", "#f3f0ff"][["K", "L", "M"].indexOf(v[0])], "#495057", 6) + tx(34 + (i % 10) * 56, 46, a, 12.5, 800);
          return sv(580, 80, o) + `<p style="text-align:center;font-weight:800">${n} x ${a} = ${S(top)} şeker · ${n} x ${f} = ${S(n * f)} TL</p>`; },
        kosullar: [T("Tam 1500 şeker alındı.", v => P[v[0]][0] * v[1] === 1500)],
        sonuc: (v, h) => h ? `<p class="cn-sonuc">${v[0]} paketiyle 1500 şeker <b>${S(P[v[0]][1] * v[1])} TL</b> tutuyor. Diğer paketlerle de deneyip karşılaştırın.</p>` : "",
        sutun: ["Paket", "Adet", "Şeker", "Tutar"], satir: v => [v[0], v[1], S(P[v[0]][0] * v[1]), S(P[v[0]][1] * v[1]) + " TL"], iyi: v => P[v[0]][0] * v[1] === 1500,
        yon: "Bir paket türü seçin ve paket sayısını değiştirin; toplam şeker ve tutar hesaplanır. Üç paketle de tam 1500 şeker alın ve tutarları deney defterinde karşılaştırın.",
        bitis: "Üç paket türüyle de tam 1500 şekere ulaştığınızda." }); },

    /* 7 · dünya saati: iki şehirde uygun saatler */
    7: el => { const tr = v => 12 * 60 + v[0] * 10, tk = v => tr(v) + 360;
      const ayse = v => tr(v) >= 15 * 60 + 40, selim = v => tk(v) >= 21 * 60 && tk(v) <= 22 * 60 + 30;
      return CN.KOSUL(el, { girdi: [{ ad: "Türkiye saati (12.00'den sonra kaç kez 10 dakika):", min: 0, max: 60, bas: 18 }], dugme: false, ek: [ek("− 1 saat", -6, 0, 0, 60), ek("+ 1 saat", 6, 0, 0, 60), ek("− 10 dk", -1, 0, 0, 60), ek("+ 10 dk", 1, 0, 0, 60)],
        ciz: v => { const X = m => 20 + (m - 12 * 60) * 0.78; let o = "";
          [["Türkiye", 0, "#1c7ed6"], ["Tokyo", 360, "#e8590c"]].forEach(([ad, f, r], i) => { const y = 30 + i * 70;
            o += tx(20, y - 8, ad, 13.5, 800, r, "start") + `<line x1="20" y1="${y + 12}" x2="582" y2="${y + 12}" stroke="#adb5bd" stroke-width="2"/>`;
            for (let h = 12; h <= 22; h += 2) o += tx(X(h * 60), y + 32, sa((h * 60 + f) % 1440), 11.5, 700, "#5b6478"); });
          o += rc(X(15 * 60 + 40), 34, X(22 * 60) - X(15 * 60 + 40), 16, "#d0ebff", "#1c7ed6", 3) + tx(X(15 * 60 + 40) + 4, 47, "Ayşe uygun", 11.5, 800, "#1c7ed6", "start");
          o += rc(X(21 * 60 - 360), 104, X(22 * 60 + 30 - 360) - X(21 * 60 - 360), 16, "#ffe8cc", "#e8590c", 3) + tx(X(21 * 60 - 360) + 4, 117, "Selim uygun", 11.5, 800, "#e8590c", "start");
          o += `<line x1="${X(tr(v))}" y1="16" x2="${X(tr(v))}" y2="150" stroke="${ayse(v) && selim(v) ? "#2b8a3e" : "#c92a2a"}" stroke-width="3"/>`;
          return sv(600, 156, o) + `<p style="text-align:center;font-weight:800">Türkiye ${sa(tr(v))} · Tokyo ${sa(tk(v))}</p>`; },
        kosullar: [T("Ayşe bu saatte konuşabilir.", ayse), T("Selim bu saatte (Tokyo saatiyle) konuşabilir.", selim)],
        sutun: ["Türkiye", "Tokyo", "Sonuç"], satir: (v, h) => [sa(tr(v)), sa(tk(v)), h ? "ikisi de uygun ✔" : "uygun değil"],
        yon: "Türkiye saatini ileri geri alın; aynı anda Tokyo'da saatin kaç olduğu yazılır. İkisinin de uygun olduğu en erken ve en geç saatleri bulun.",
        bitis: "İkisinin de uygun olduğu en erken ve en geç saati deney defterine yazdığınızda." }); },

    /* 8 · uçak seferleri: aralık sayısı */
    8: el => CN.KOSUL(el, { girdi: [{ ad: "Sefer numarası:", min: 1, max: 14, bas: 4 }], dugme: false,
      ciz: v => { const n = v[0]; let o = `<line x1="20" y1="60" x2="590" y2="60" stroke="#1d2433" stroke-width="2"/>`;
        for (let k = 1; k <= n; k++) { const x = 30 + (k - 1) * 40; o += `<circle cx="${x}" cy="60" r="7" fill="${k === n ? "#e8590c" : "#1c7ed6"}"/>` + tx(x, 88, k + ".", 11.5, 800) + (k < n ? `<path d="M${x + 4} 50 Q${x + 20} 30 ${x + 36} 50" fill="none" stroke="#2b8a3e" stroke-width="2"/>` : ""); }
        return sv(600, 100, o) + `<p style="text-align:center;font-weight:800">1. seferden ${n}. sefere: ${n - 1} aralık x 40 dakika = ${(n - 1) * 40} dakika → ${n}. sefer ${sa(400 + (n - 1) * 40)}</p>`; },
      kosullar: [T("11. sefer seçildi.", v => v[0] === 11)],
      sonuc: (v, h) => h ? `<p class="cn-sonuc">Ali'nin bulduğu ${sa(400 + 11 * 40)}, 11 aralık sonrasıdır; bu da 12. seferin kalkış saatidir. Sefer numarasını 12 yapıp kontrol edin.</p>` : "",
      sutun: ["Sefer", "Aralık sayısı", "Kalkış"], satir: v => [v[0] + ".", v[0] - 1, sa(400 + (v[0] - 1) * 40)],
      yon: "Sefer numarasını değiştirin; her yeşil yay 40 dakikalık bir aralıktır. Önce ekrandaki 2, 3 ve 4. seferlerin saatlerini kontrol edin, sonra 11. seferin saatini bulun. Sefer sayısı ile aralık sayısı arasında nasıl bir ilişki var?",
      bitis: "Koşul yeşil olduğunda ve Ali ile Ece'nin hesabını karşılaştırdığınızda." }),

    /* 9 · sinema: filmlerin bitiş saatleri */
    9: el => { const K = { Ali: [675, 112, "1. salon"], Bora: [815, 138, "2. salon"], Cem: [965, 112, "1. salon"], Duru: [650, 138, "2. salon"] }, A = Object.keys(K);
      const bit = a => K[a][0] + K[a][1], fark = v => Math.abs(bit(v[0]) - bit(v[1]));
      return CN.KOSUL(el, { girdi: [{ ad: "1. arkadaş:", sec: A, bas: "Ali" }, { ad: "2. arkadaş:", sec: A, bas: "Bora" }], dugme: false,
        ciz: v => { const X = m => 70 + (m - 600) * 0.86; let o = "";
          for (let h = 10; h <= 18; h++) o += `<line x1="${X(h * 60)}" y1="10" x2="${X(h * 60)}" y2="196" stroke="#e9ecef"/>` + tx(X(h * 60), 212, h + ".00", 11, 700, "#5b6478");
          A.forEach((a, i) => { const y = 16 + i * 46, sec = v.includes(a);
            o += tx(62, y + 22, a, 13, 800, "#1d2433", "end") + rc(X(K[a][0]), y, K[a][1] * 0.86, 30, sec ? "#ffe8cc" : "#f1f3f5", sec ? "#e8590c" : "#adb5bd", 5) + tx(X(bit(a)) + 4, y + 21, sa(bit(a)), 12.5, 800, sec ? "#d9480f" : "#5b6478", "start"); });
          return sv(600, 220, o) + `<p style="text-align:center;font-weight:800">${v[0]} ${sa(bit(v[0]))} · ${v[1]} ${sa(bit(v[1]))} → fark ${Math.floor(fark(v) / 60)} saat ${fark(v) % 60} dakika</p>`; },
        kosullar: [T("İki farklı arkadaş seçildi.", v => v[0] !== v[1]), T("Bu iki arkadaşın filmleri birbirine en yakın saatlerde bitiyor.", v => v[0] !== v[1] && fark(v) === 1)],
        sutun: ["Arkadaşlar", "Bitiş saatleri", "Fark"], satir: v => [`${v[0]} – ${v[1]}`, `${sa(bit(v[0]))} – ${sa(bit(v[1]))}`, v[0] === v[1] ? "—" : `${Math.floor(fark(v) / 60)} sa ${fark(v) % 60} dk`],
        yon: "İki arkadaş seçin; filmlerin başlangıcı, süresi ve bitiş saati çizelgede görünür. Farklı ikilileri deneyip bitiş saatleri arasındaki farkları deney defterinde karşılaştırın.",
        bitis: "İki koşul da yeşil olduğunda." }); },

    /* 10 · yakıt paylaşımı */
    10: el => CN.KOSUL(el, { girdi: [{ ad: "Otomobildeki kişi sayısı (sürücü dâhil):", min: 1, max: 8, bas: 2 }], dugme: false,
      ciz: v => { const n = v[0], k = Math.ceil(1560 / n), w = 520 / n; let o = "";
        for (let i = 0; i < n; i++) o += rc(40 + i * w, 20, w, 40, i % 2 ? "#e7f5ff" : "#d0ebff", "#1c7ed6", 0) + (w > 50 ? tx(40 + i * w + w / 2, 45, (1560 % n ? "≈" : "") + k, 12.5, 800) : "");
        o += tx(300, 14, "Yakıt + yol ve köprü: 1365 + 195 = 1560 TL", 12.5, 800, "#5b6478");
        return sv(600, 74, o) + `<p style="text-align:center;font-weight:800">Kişi başı: 1560 : ${n} ${1560 % n ? "≈ " + Math.floor(1560 / n) + " TL (kalanlı)" : "= " + 1560 / n + " TL"} · Otobüs bileti: 420 TL</p>`; },
      kosullar: [T("Kişi başı maliyet otobüs biletinden az.", v => 1560 / v[0] < 420), T("Bir kişi eksik olsaydı kişi başı maliyet otobüs biletinden az olmazdı (en az kişi).", v => v[0] > 1 && 1560 / (v[0] - 1) >= 420)],
      sutun: ["Kişi", "Kişi başı", "Otobüse göre"], satir: v => [v[0], 1560 % v[0] ? "≈ " + Math.floor(1560 / v[0]) + " TL" : 1560 / v[0] + " TL", 1560 / v[0] < 420 ? "ucuz" : "pahalı"],
      yon: "Otomobildeki kişi sayısını değiştirin; 1560 TL'lik toplam masraf eşit parçalara bölünür. Kişi başı maliyetin otobüs biletinden (420 TL) ilk kez az olduğu kişi sayısını bulun.",
      bitis: "İki koşul da yeşil olduğunda." }),

    /* 11 · fatura: deste ve düzine */

        for (let i = 0; i < v[0]; i++) o += rc(10 + (i % 15) * 38, 56 + Math.floor(i / 15) * 34, 32, 26, "#e7f5ff", "#1c7ed6", 3) + tx(26 + (i % 15) * 38, 74 + Math.floor(i / 15) * 34, "12", 11.5, 800);
        const top = 150 + 12 * v[0];
        return sv(590, 128, o) + `<p style="text-align:center;font-weight:800">15 x 10 + ${v[0]} x 12 = 150 + ${12 * v[0]} = <span style="color:${top === 306 ? iyi : "#1d2433"}">${top}</span> (faturadaki toplam: 306)</p>`; },

      sutun: ["Düzine", "Silgi adedi", "Toplam ürün"], satir: v => [v[0], 12 * v[0], 150 + 12 * v[0]],
      yon: "Silgi düzinesinin sayısını değiştirin. Turuncu kutular 10'arlık kalem destelerini, mavi kutular 12'şerlik silgi düzinelerini gösterir. Toplam ürün adedinin faturadakiyle aynı olduğu düzine sayısını bulun.",

    /* 12 · kumaş fiyatı: 1 m² fiyatlarını sırala */

      ciz: v => { const L = v[0], m = { K: 190, L: L / 5, M: 145 }; let o = "";
        Object.entries(m).forEach(([k, p], i) => { const y = 14 + i * 46; o += tx(70, y + 22, `${k} (1 m²)`, 13, 800, "#1d2433", "end") + rc(80, y, p * 2.2, 32, ["#ffe8cc", "#e3fafc", "#f3f0ff"][i], ["#e8590c", "#0c8599", "#7048e8"][i], 4) + tx(88 + p * 2.2, y + 22, p + " TL", 13, 800, "#1d2433", "start"); });
        return sv(600, 150, o) + `<p style="text-align:center;font-weight:800">L: ${L} TL : 5 m² = ${L / 5} TL</p>`; },
      kosullar: [T("1 m² fiyatı en yüksek olan yalnız K.", v => v[0] / 5 < 190), T("1 m² fiyatı en düşük olan yalnız M.", v => v[0] / 5 > 145)],
      sutun: ["L'nin fiyatı", "L (1 m²)", "Görevlinin sözüne uygun mu?"], satir: (v, h) => [v[0] + " TL", v[0] / 5 + " TL", h ? "uygun ✔" : "uygun değil ✘"],
      yon: "L kumaşı için bir fiyat seçin; üç kumaşın 1 m² fiyatları çubuklarla karşılaştırılır. Seçeneklerdeki fiyatları (730, 860, 940, 950 TL) ve diğerlerini tek tek deneyin.",
      bitis: "Dört fiyatı da deneyip hangisinin görevlinin sözüne uymadığını deney defterinde gördüğünüzde." }),

        o += rc(200, 214, 190, 10, "#adb5bd", "#495057", 2) + tx(470, 110, sa(19 * 60 + 20 + 15 * k), 30, 800, k === 9 ? iyi : "#1d2433");
        return sv(600, 232, o) + `<p style="text-align:center;font-weight:800">${k} bölme x 15 dakika = ${15 * k} dakika → 19.20 + ${Math.floor(15 * k / 60)} saat ${15 * k % 60} dakika = ${sa(19 * 60 + 20 + 15 * k)}</p>`; },

    /* 14 · görüşmeden buluşmaya: süreyi ekle */
    14: el => { const bas = Date.UTC(2026, 9, 27, 18, 40), hedef = Date.UTC(2026, 10, 2, 10, 20);

      const zm = v => bas + ((v[0] * 24 + v[1]) * 60 + v[2]) * 60000, yaz = t => { const d = new Date(t); return `${d.getUTCDate()} ${AY[d.getUTCMonth()]} · ${sa(d.getUTCHours() * 60 + d.getUTCMinutes())}`; };

      bitis: "İki koşul da yeşil olduğunda (karşı örneği bulduğunuzda)." }),

e-width=\"1.2\"/><text x=\"408.0\" y=\"228.0\" font-size=\"14.5\" font-weight=\"800\" fill=\"#1c7ed6\" text-anchor=\"middle\">Sulama saatleri: 08.00 – 14.00</text></svg>", "son": "<p>Her saat başında üç sıranın sulaması aynı anda başlar; ilk sulama 08.00'de, son sulama 13.00'te başlamaktadır. Su pompası en az bir sıra sulanırken çalışır, hiçbir sıra sulanmıyorsa durur.</p>", "k": "Buna göre, pompa 08.00 ile 14.00 arasında toplam kaç dakika çalışır?", "sec": ["120", "240", "282", "360"], "secg": null, "c": "A", "a": ["Her saat başında üç sıra birlikte sulanmaya başlar; 12 ve 15 dakikalık sulamalar, 20 dakikalık sulama sürerken biter.", "Pompa her saatte en uzun sulama kadar, yani 20 dakika çalışır.", "08.00, 09.00, 10.00, 11.00, 12.00 ve 13.00'te başlayan 6 sulama vardır: 6 x 20 = 120 dakika."], "t": "240: pompanın durduğu süre bulunmuş; 282: sıraların süreleri art arda sulanıyormuş gibi toplanmış (6 x 47); 360: pompanın 6 saat boyunca hiç durmadığı sanılmış.", "d": "Üç sıra her saat başında aynı anda sulanmaya başlar; süreleri toplamayın. Pompa, sulama süresi en uzun olan sıra bitene kadar çalışır. 08.00 ile 14.00 arasında başlayan sulamaları da tek tek sayın: 13.00'te başlayan son sulamayı unutmayın.", "ses": "b02"}, {"no": 3, "on": "<p>Bir bölgedeki tren hatları ve istasyonlar arasındaki uzaklıklar aşağıdaki haritada gösterilmiştir. Trenler yalnız bu hatlarda ve istasyonlar arasında hiç ara vermeden gitmektedir.</p>", "g": "<svg style=\"width:150.0mm;max-width:100%;height:auto\" viewBox=\"0 0 600 278\" width=\"600\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"'Liberation Sans', Arial, sans-serif\"><rect x=\"2.0\" y=\"2.0\" width=\"596.0\" height=\"274.0\" rx=\"10\" fill=\"#f8f9fa\" stroke=\"#dee2e6\" stroke-width=\"1.2\"/><line x1=\"70.0\" y1=\"150.0\" x2=\"250.0\" y2=\"52.0\" stroke=\"#495057\" stroke-width=\"4\"/><line x1=\"70.0\" y1=\"150.0\" x2=\"250.0\" y2=\"52.0\" stroke=\"#ffffff\" stroke-width=\"1.4\" stroke-dasharray=\"8 8\"/><rect x= ddle\">Ilıca</text><rect x=\"470.6\" y=\"135.0\" width=\"98.8\" height=\"30.0\" rx=\"8\" fill=\"#e7f5ff\" stroke=\"#1c7ed6\" stroke-width=\"2\"/><text x=\"520.0\" y=\"155.0\" font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Pınarbaşı</text></svg>", "son": "<p>Bir gezgin Akçay istasyonundan trene binip Pınarbaşı istasyonuna gidecektir. Yolda Kale istasyonunda inip kaleyi gezecek, sonra yine trenle yolculuğuna devam edecektir.</p>", "k": "Buna göre, gezginin trenle gideceği yol <u>en az</u> kaç kilometredir?", "sec": ["350 km", "370 km", "390 km", "420 km"], "secg": null, "c": "C", "a": ["Akçay'dan Kale'ye: Yeşilköy üzerinden 130 + 110 = 240 km, Ilıca üzerinden 80 + 190 = 270 km. Kısa olan 240 km'dir.", "Kale'den Pınarbaşı'na: doğrudan 150 km (Yeşilköy ya da Ilıca üzerinden çok daha uzundur).", "Toplam: 240 + 150 = 390 km."], "t": "350 ve 370: Kale'ye uğramadan Akçay'dan Pınarbaşı'na giden yollar bulunmuş; 420: Akçay'dan Kale'ye Ilıca üzerinden gidilmiş.", "d": "Önce Kale'ye uğrama koşuluna dikkat edin: yolu iki parçaya ayırın (Akçay → Kale ve Kale → Pınarbaşı) ve her parçanın en kısa yolunu ayrı ayrı bulun. Kale'ye uğramayan yollar daha kısa olsa da soruya uymaz.", "ses": "b03"}, {"no": 4, "on": "<p>Bir fotoğrafçıda baskı ücreti, bir siparişteki fotoğraf sayısına göre kademeli olarak hesaplanmaktadır. Fotoğrafçının fiyat panosu aşağıda verilmiştir.</p>", "g": "<svg style=\"width:150.0mm;max-width:100%;height:auto\" viewBox=\"0 0 600 262\" width=\"600\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"'Liberation Sans', Arial, sans-serif\"><rect x=\"40.0\" y=\"10.0\" width=\"520.0\" height=\"240.0\" rx=\"10\" fill=\"#fffaf0\" stroke=\"#b08968\" stroke-width=\"3\"/><rect x=\"40.0\" y=\"10.0\" width=\"520.0\" height=\"52.0\" rx=\"10\" fill=\"#d9480f\" stroke=\"none\" stroke-width=\"0\"/><rect x=\"40.0\" y=\"44.0\" width=\"520.0\" height=\"18.0\" rx=\"0\" fill=\"#d9480f\" stroke=\"none\" stroke-width=\"0\"/><text x=\"300.0\" y=  TL."], "t": "90: ikinci siparişte de ilk 40 fotoğrafın 14 TL'den ödeneceği unutulmuş; 120: tek siparişte 100'den sonraki fotoğraflar da 11 TL'den hesaplanmış; 1670: iki siparişin toplam tutarı yazılmış.", "d": "Kademeli fiyatta her sipariş 1. fotoğraftan yeniden başlar. İki ayrı siparişte ilk 40 fotoğrafın yüksek fiyatı iki kez ödenir; tek siparişte ise 100'den sonraki fotoğraflar en ucuz kademeden ödenir. İki durumu ayrı ayrı hesaplayıp farkını alın.", "ses": "b04"}, {"no": 5, "on": "<p>Bir matbaada bir kitabın sayfalarına 1'den başlanarak sırayla numara basılmaktadır. Numaraları basan makinenin ekranı, o ana kadar kullanılan toplam rakam sayısını göstermektedir. Örneğin 12. sayfaya kadar 1–9 için 9, 10–12 için 3 x 2 = 6 rakam olmak üzere 15 rakam kullanılır.</p>", "g": "<svg style=\"width:150.0mm;max-width:100%;height:auto\" viewBox=\"0 0 600 262\" width=\"600\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"'Liberation Sans', Arial, sans-serif\"><rect x=\"14.0\" y=\"30.0\" width=\"300.0\" height=\"200.0\" rx=\"14\" fill=\"#e9ecef\" stroke=\"#495057\" stroke-width=\"2.4\"/><rect x=\"34.0\" y=\"50.0\" width=\"260.0\" height=\"70.0\" rx=\"8\" fill=\"#1d2433\" stroke=\"#0b0f17\" stroke-width=\"2\"/><text x=\"164.0\" y=\"74.0\" font-size=\"13\" font-weight=\"800\" fill=\"#ced4da\" text-anchor=\"middle\">KULLANILAN RAKAM</text><text x=\"164.0\" y=\"108.0\" font-size=\"30\" font-weight=\"800\" fill=\"#ffd43b\" text-anchor=\"middle\">1137</text><rect x=\"54.0\" y=\"140.0\" width=\"220.0\" height=\"26.0\" rx=\"4\" fill=\"#adb5bd\" stroke=\"#495057\" stroke-width=\"1.4\"/><rect x=\"54.0\" y=\"176.0\" width=\"220.0\" height=\"30.0\" rx=\"4\" fill=\"#ced4da\" stroke=\"#495057\" stroke-width=\"1.4\"/><line x1=\"80.0\" y1=\"140.0\" x2=\"80.0\" y2=\"166.0\" stroke=\"#495057\" stroke-width=\"1.2\"/><line x1=\"248.0\" y1=\"140.0\" x2=\"248.0\" y2=\"166.0\" stroke=\"#495057\" stroke-width=\"1.2\"/><path d=\"M360,92 L470,80 L470,236 L360,248 Z\" fill=\"#ffffff\"  1137 − 189 = 948; 948 : 3 = 316 sayfa.", "İlk üç basamaklı sayfa 100'dür; 99 + 316 = 415. Kitap 415 sayfadır."], "t": "316: üç basamaklı sayfa sayısında durulmuş; 379: bütün rakamlar 3'e bölünmüş; 409: iki basamaklı sayfa sayısı 99 sanılmış.", "d": "Rakamları basamak sayısına göre üç grupta sayın: 1–9 için 9, 10–99 için 90 x 2 = 180 rakam. Kalan rakamları 3'e bölünce yalnız üç basamaklı sayfaların sayısını bulursunuz; kitabın sayfa sayısı için bu sayıya 99'u ekleyin.", "ses": "b05"}, {"no": 6, "on": "<p>Bir kafe için küp şeker alınacaktır. Markette aynı marka küp şekerin üç farklı paketi satılmaktadır. Paketler ve raf etiketleri aşağıda gösterilmiştir.</p>", "g": "<svg style=\"width:150.0mm;max-width:100%;height:auto\" viewBox=\"0 0 600 264\" width=\"600\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"'Liberation Sans', Arial, sans-serif\"><rect x=\"20.0\" y=\"208.0\" width=\"560.0\" height=\"16.0\" rx=\"3\" fill=\"#c8a165\" stroke=\"#7a5a2b\" stroke-width=\"1.5\"/><rect x=\"40.0\" y=\"118.0\" width=\"150.0\" height=\"90.0\" rx=\"6\" fill=\"#e7f5ff\" stroke=\"#1c7ed6\" stroke-width=\"2\"/><rect x=\"60.0\" y=\"132.0\" width=\"28.0\" height=\"28.0\" rx=\"3\" fill=\"#ffffff\" stroke=\"#adb5bd\" stroke-width=\"1.2\"/><rect x=\"100.0\" y=\"132.0\" width=\"28.0\" height=\"28.0\" rx=\"3\" fill=\"#ffffff\" stroke=\"#adb5bd\" stroke-width=\"1.2\"/><rect x=\"140.0\" y=\"132.0\" width=\"28.0\" height=\"28.0\" rx=\"3\" fill=\"#ffffff\" stroke=\"#adb5bd\" stroke-width=\"1.2\"/><text x=\"115.0\" y=\"186.0\" font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">K paketi</text><rect x=\"46.0\" y=\"230.0\" width=\"138.0\" height=\"28.0\" rx=\"5\" fill=\"#ffffff\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"115.0\" y=\"250.0\" font-size=\"14.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">300 adet · 90 TL</text><rect x=\"226.0\" y=\"96.0\" width=\"150.0\" height=\"112.0\" rx=\"6\" fill=\"#fff4e6\" stroke=\"#e8590c\" st  TL"], "secg": null, "c": "D", "a": ["1500 şeker için: K paketinden 5 tane (300 x 5 = 1500), L paketinden 3 tane (500 x 3 = 1500), M paketinden 2 tane (750 x 2 = 1500) gerekir.", "Tutarlar: K: 5 x 90 = 450 TL, L: 3 x 140 = 420 TL, M: 2 x 195 = 390 TL.", "En az ödeme M paketiyle yapılır: 390 TL."], "t": "A: tek paketi en ucuz olan seçilmiş; B: ikinci en ucuz seçenekte durulmuş; C: L paketinde 300 şeker olduğu sanılıp 5 paket hesaplanmış.", "d": "Her paketten tam 1500 şeker için kaç paket gerektiğini bulun, sonra tutarları karşılaştırın. Bir paketin fiyatı en düşük olan her zaman en ekonomik değildir; aynı miktar şeker için ödenen toplam parayı karşılaştırın.", "ses": "b06"}, {"no": 7, "on": "<p>Ayşe'nin telefonundaki dünya saati uygulamasının aynı andaki görüntüsü aşağıda verilmiştir.</p>", "g": "<svg style=\"width:150.0mm;max-width:100%;height:auto\" viewBox=\"0 0 600 264\" width=\"600\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"'Liberation Sans', Arial, sans-serif\"><rect x=\"170.0\" y=\"4.0\" width=\"260.0\" height=\"256.0\" rx=\"26\" fill=\"#1d2433\" stroke=\"#0b0f17\" stroke-width=\"3\"/><rect x=\"182.0\" y=\"22.0\" width=\"236.0\" height=\"220.0\" rx=\"12\" fill=\"#ffffff\" stroke=\"none\" stroke-width=\"0\"/><rect x=\"270.0\" y=\"10.0\" width=\"60.0\" height=\"6.0\" rx=\"3\" fill=\"#495057\" stroke=\"none\" stroke-width=\"0\"/><text x=\"300.0\" y=\"50.0\" font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Dünya Saati</text><rect x=\"196.0\" y=\"68.0\" width=\"208.0\" height=\"70.0\" rx=\"10\" fill=\"#f1f3f5\" stroke=\"#ced4da\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"96.0\" font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"start\">İstanbul</text><text x=\"212.0\" y=\"120.0\" font-size=\"12.5\" font-weight=\"700\" fill=\"#5c6370\" text-anchor=\"start\">Bugün</text><text x=\"392.0\" y=\"116.0\" font-size=\"26\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">10.15</text><rect x=\"196.0\" y=\"150.0\" width=\"208.0\" height=\"70.0\" rx=\"10\" fill=\"#f1f3f5\" stroke=\"#ced4da\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"178.0\" font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"start\">Tokyo</text><text x=\"212.0\" y=\"202.0\" font-size=\"12.5\" font-weight=\"700\" fill=\"#5c6370\" text-anchor=\"start\">Bugün</text><text x=\"392.0\" y=\"198.0\" font-size=\"26\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">16.15</text></svg>", "son": "<p>Ayşe'nin Tokyo'da yaşayan kuzeni Selim, yalnız Tokyo saatiyle 21.00 ile 22.30 arasında telefonla konuşabilmektedir.</p><p>Ayşe ise okuldan döndükten sonra, Türkiye saatiyle 15.40'tan itibaren konuşabilmektedir.</p>", "k": "Buna göre, Ayşe kuzenini Türkiye saatiyle hangi saatler arasında arayabilir?", "sec": ["15.00 ile 16.30", "15.40 ile 16.30", "21.00 ile 22.30", "15.40 ile 22.30"], "secg": null, "c": "B", "a": ["Uygulamaya göre Tokyo'da saat, Türkiye'dekinden 16.15 − 10.15 = 6 saat ileridir.", "Selim'in uygun olduğu zaman Türkiye saatiyle 21.00 − 6 = 15.00 ile 22.30 − 6 = 16.30 arasıdır.", "Ayşe 15.40'tan önce konuşamaz; ikisinin de uygun olduğu zaman 15.40 ile 16.30 arasıdır."], "t": "A: Ayşe'nin okulda olduğu zaman dikkate alınmamış; C: Tokyo saatleri Türkiye saatine çevrilmemiş; D: Tokyo'daki bitiş saati çevrilmeden alınmış.", "d": "Önce iki şehir arasındaki saat farkını ekrandan bulun (Tokyo 6 saat ileride). Selim'in uygun olduğu saatleri Türkiye saatine çevirin, sonra Ayşe'nin uygun olduğu saatlerle ortak kısmı alın: iki koşul birlikte sağlanmalıdır.", "ses": "b07"}, {"no": 8, "on": "<p>Bir havalimanında Ekspres Hat'ın uçakları sabah 06.40'tan başlayarak eşit zaman aralıklarıyla kalkmaktadır. Kalkış ekranının bir bölümü aşağıda verilmiştir.</p>", "g": "<svg style=\"width:150.0mm;max-width:100%;height:auto\" viewBox=\"0 0 600 264\" width=\"600\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"'Liberation Sans', Arial, sans-serif\"><rect x=\"30.0\" y=\"6.0\" width=\"540.0\" height=\"252.0\" rx=\"12\" fill=\"#0b1d33\" stroke=\"#071222\" stroke-width=\"3\"/><text x=\"300.0\" y=\"40.0\" font-size=\"18\" font-weight=\"800\" fill=\"#ffd43b\" text-anchor=\"middle\">KALKIŞLAR</text><line x1=\"50.0\" y1=\"54.0\" x2=\"550.0\" y2=\"54.0\" stroke=\"#3b5b7c\" stroke-width=\"1.4\"/><text x=\"110.0\" y=\"80.0\" font-size=\"14\" font-weight=\"800\" fill=\"#9fb3c8\" text-anchor=\"middle\">Sefer</text><text x=\"300.0\" y=\"80.0\" font-size=\"14\" font-weight=\"800\" fill=\"#9fb3c8\" text-anchor=\"middle\">Hat</text><text x=\"490.0\" y=\"80.0\" font-size=\"14\" font-weight=\"800\" fill=\"#9fb3c8\" text-anchor=\"middle\">Saat</text><text x=\"110.0\" y=\"112.0\" font-size=\"16\" font-weight=\"700\" fill=\"#ffffff\" text-anchor=\"middle\">1. sefer</text><text x=\"300.0\" y=\"112.0\" font-size=\"16\" font-weight=\"700\" fill=\"#ffffff\" text-anchor=\"middle\">Ekspres Hat</text><text x=\"490.0\" y=\"112.0\" font-size=\"17\" font-weight=\"800\" fill=\"#ffd43b\" text-anchor=\"middle\">06.40</text><text x=\"110.0\" y=\"146.0\" font-size=\"16\" font-weight=\"700\" fill=\"#ffffff\" text-anchor=\"middle\">2. sefer</text><text x=\"300.0\" y=\"146.0\" font-size=\"16\" font-weight=\"700\" fill=\"#ffffff\" text-anchor=\"middle\">Ekspres Hat</text><text x=\"490.0\" y=\"146.0\" font-size=\"17\" font-weight=\"800\" fill=\"#ffd43b\" text-anchor=\"middle\">07.20</text><text x=\"110.0\" y=\"180.0\" font-size=\"16\" font-weight=\"700\" fill=\"#ffffff\" text-anchor=\"middle\">3. sefer</text><text x=\"300.0\" y=\"180.0\" font-size=\"16\" font-weight=\"700\" fill=\"#ffffff\" text-anchor=\"middle\">Ekspres Hat</text><text x=\"490.0\" y=\"180.0\" font-size=\"17\" font-weight=\"800\" fill=\"#ffd43b\" text-anchor=\"middle\">08.00</text><text x=\"110.0\" y=\"214.0\" font-size=\"16\" font-weight=\"700\" fill=\"#ffffff\" text-anchor=\"middle\">4. sefer</text><text x=\"300.0\" y=\"214.0\" font-size=\"16\" font-weight=\"700\" fill=\"#ffffff\" text-anchor=\"middle\">Ekspres Hat</text><text x=\"490.0\" y=\"214.0\" font-size=\"17\" font-weight=\"800\" fill=\"#ffd43b\" text-anchor=\"middle\">08.40</text><text x=\"300.0\" y=\"246.0\" font-size=\"20\" font-weight=\"800\" fill=\"#ffffff\" text-anchor=\"middle\">…</text></svg>", "son": "<p>Görevliler Ali ve Ece, 11. seferin kalkış saatini farklı yollarla hesaplamıştır.</p><div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:2.4mm;margin:1mm 0 .5mm\"><div style=\"border:.45mm solid #1c7ed6;border-radius:3.2mm;padding:1.6mm 2.4mm;background:#fff\"><b style=\"color:#1c7ed6\">Ali:</b> “06.40'a 11 x 40 = 440 dakika ekledim; 14.00 buldum.”</div><div style=\"border:.45mm solid #e8590c;border-radius:3.2mm;padding:1.6mm 2.4mm;background:#fff\"><b style=\"color:#e8590c\">Ece:</b> “06.40'a 10 x 40 = 400 dakika ekledim; 13.20 buldum.”</div></div>", "k": "Buna göre, aşağıdakilerden hangisi doğrudur?", "sec": ["Ece'nin hesabı doğrudur; 1. seferden 11. sefere kadar 10 aralık vardır.", "Ali'nin hesabı doğrudur; 11. sefer için 11 aralık eklenmelidir.", "İkisinin hesabı da yanlıştır; 11. sefer 13.40'ta kalkar.", "İkisinin hesabı da doğrudur; aradaki fark bir seferlik bekleme süresidir."], "secg": null, "c": "A", "a": ["Ekrandan iki sefer arasının 07.20 − 06.40 = 40 dakika olduğu görülür.", "1. seferden 11. sefere kadar 10 aralık vardır: 10 x 40 = 400 dakika = 6 saat 40 dakika.", "06.40 + 6 saat 40 dakika = 13.20. Ece'nin hesabı doğrudur; Ali sefer sayısı kadar aralık eklemiştir."], "t": "B: 11 sefer arasında 11 değil 10 aralık vardır; C: 13.40 için 10 aralığa fazladan 20 dakika eklenmiş olur; D: iki farklı sonuç aynı anda doğru olamaz.", "d": "1. seferden 11. sefere kadar 11 değil 10 aralık vardır (aralık sayısı = sefer sayısı − 1). Sefer saatini bulmak için ilk sefere aralık sayısı kadar 40 dakika ekleyin.", "ses": "b08"}, {"no": 9, "on": "<p>Bir sinemanın iki salonunda farklı filmler gösterilmektedir. Seans saatleri ve filmlerin süreleri, sinemanın girişindeki ekranda aşağıdaki gibi verilmiştir.</p>", "g": "<svg style=\"width:150.0mm;max-width:100%;height:auto\" viewBox=\"0 0 600 262\" width=\"600\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"'Liberation Sans', Arial, sans-serif\"><rect x=\"20.0\" y=\"6.0\" width=\"560.0\" height=\"250.0\" rx=\"12\" fill=\"#1d2433\" stroke=\"#0b0f17\" stroke-width=\"3\"/><text x=\"300.0\" y=\"42.0\" font-size=\"18\" font-weight=\"800\" fill=\"#ffd43b\" text-anchor=\"middle\">BUGÜNKÜ SEANSLAR</text><rect x=\"40.0\" y=\"62.0\" width=\"520.0\" height=\"82.0\" rx=\"8\" fill=\"#26324a\" stroke=\"#3b4b6b\" stroke-width=\"1.4\"/><text x=\"58.0\" y=\"90.0\" font-size=\"16\" font-weight=\"800\" fill=\"#ffffff\" text-anchor=\"start\">1. Salon · Deniz Yolculuğu</text><text x=\"58.0\" y=\"118.0\" font-size=\"14.5\" font-weight=\"700\" fill=\"#ced4da\" text-anchor=\"start\">Süre: 1 saat 52 dakika</text><text x=\"542.0\" y=\"118.0\" font-size=\"16\" font-weight=\"800\" fill=\"#ffd43b\" text-anchor=\"end\">11.15 · 13.40 · 16.05</text><rect x=\"40.0\" y=\"156.0\" width=\"520.0\" height=\"82.0\" rx=\"8\" fill=\"#26324a\" stroke=\"#3b4b6b\" stroke-width=\"1.4\"/><text x=\"58.0\" y=\"184.0\" font-size=\"16\" font-weight=\"800\" fill=\"#ffffff\" text-anchor=\"start\">2. Salon · Dağdaki Gözlemevi</text><text x=\"58.0\" y=\"212.0\" font-size=\"14.5\" font-weight=\"700\" fill=\"#ced4da\" text-anchor=\"start\">Süre: 2 saat 18 dakika</text><text x=\"542.0\" y=\"212.0\" font-size=\"16\" font-weight=\"800\" fill=\"#ffd43b\" text-anchor=\"end\">10.50 · 13.35 · 16.20</text></svg>", "son": "<p>Dört arkadaştan Ali 1. salonda 11.15 seansını, Bora 2. salonda 13.35 seansını, Cem 1. salonda 16.05 seansını, Duru 2. salonda 10.50 seansını izlemiştir. Filmler seans saatinde başlamış ve arasız gösterilmiştir.</p>", "k": "Buna göre, filmleri birbirine en yakın saatlerde biten iki arkadaş kimlerdir?", "sec": ["Bora ile Cem", "Ali ile Bora", "Ali ile Duru", "Duru ile Bora"], "secg": null, "c": "C", "a": ["1. salondaki film 1 saat 52 dakika sürer: Ali'nin filmi 11.15 + 1.52 → 13.07'de, Cem'in filmi 16.05 + 1.52 → 17.57'de biter.", "2. salondaki film 2 saat 18 dakika sürer: Duru'nun filmi 10.50 + 2.18 → 13.08'de, Bora'nın filmi 13.35 + 2.18 → 15.53'te biter.", "En yakın bitiş saatleri 13.07 ve 13.08'dir; aralarında 1 dakika vardır: Ali ile Duru."], "t": "A: Bora ile Cem arasında 2 saat 4 dakika vardır; B ve D: Bora'nın filmi 15.53'te biter, Ali ve Duru'dan yaklaşık 2 saat 45 dakika sonra; seans saatlerinin yakınlığına bakılmış olabilir.", "d": "Her arkadaş için önce bitiş saatini bulun: başlangıç + film süresi. Dakikalar 60'ı geçerse 1 saat ekleyin. Seans saatlerinin birbirine yakın olması filmlerin de yakın saatlerde bittiğini göstermez; süreler farklıdır.", "ses": "b09"}, {"no": 10, "on": "<p>Bir grup arkadaş iki şehir arasında yolculuk yapacaktır. Otobüsle gitmeleri hâlinde kişi başı bilet ücreti 420 TL'dir. Arkadaşlardan birinin otomobiliyle gitmeleri hâlinde ödenecek tutarlar ise aşağıda verilmiştir.</p>", "g": "<svg style=\"width:150.0mm;max-width:100%;height:auto\" viewBox=\"0 0 600 262\" width=\"600\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"'Liberation Sans', Arial, sans-serif\"><rect x=\"20.0\" y=\"14.0\" width=\"250.0\" height=\"236.0\" rx=\"6\" fill=\"#fffdf7\" stroke=\"#adb5bd\" stroke-width=\"1.4\"/><text x=\"145.0\" y=\"44.0\" font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">AKARYAKIT FİŞİ</text><line x1=\"36.0\" y1=\"56.0\" x2=\"254.0\" y2=\"56.0\" stroke=\"#adb5bd\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><text x=\"36.0\" y=\"90.0\" font-size=\"14.5\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">Yakıt (gidiş)</text><text x=\"254.0\" y=\"90.0\" font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">1365 TL</text><text x=\"36.0\" y=\"124.0\" font-size=\"14.5\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">Yol ve köprü</text><text x=\"254.0\" y=\"124.0\" font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">195 TL</text><line x1=\"36.0\" y1=\"146.0\" x2=\"254.0\" y2=\"146.0\" stroke=\"#adb5bd\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><text x=\"145.0\" y=\"190.0\" font-size=\"13.5\" font-weight=\"700\" fill=\"#5c6370\" text-anchor=\"middle\">Otomobille gidiş</text><rect x=\"330.0\" y=\"30.0\" width=\"240.0\" height=\"200.0\" rx=\"12\" fill=\"#e7f5ff\" stroke=\"#1c7ed6\" stroke-width=\"2\"/><rect x=\"390.0\" y=\"60.0\" width=\"120.0\" height=\"50.0\" rx=\"9.0\" fill=\"#ffd43b\" stroke=\"#e67700\" stroke-width=\"2\"/><rect x=\"400.0\" y=\"68.0\" width=\"20.0\" height=\"15.0\" rx=\"2\" fill=\"#e7f5ff\" stroke=\"#495057\" stroke-width=\"1\"/><rect x=\"426.0\" y=\"68.0\" width=\"20.0\" height=\"15.0\" rx=\"2\" fill=\"#e7f5ff\" stroke=\"#495057\" stroke-width=\"1\"/><rect x=\"452.0\" y=\"68.0\" width=\"20.0\" height=\"15.0\" rx=\"2\" fill=\"#e7f5ff\" stroke=\"#495057\" stroke-width=\"1\"/><rect x=\"478.0\" y=\"68.0\" width=\"20.0\" height=\"15.0\" rx=\"2\" fill=\"#e7f5ff\" stroke=\"#495057\" stroke-width=\"1\"/><circle cx=\"415.0\" cy=\"110.0\" r=\"9.0\" fill=\"#343a40\" stroke=\"#212529\" stroke-width=\"1\"/><circle cx=\"485.0\" cy=\"110.0\" r=\"9.0\" fill=\"#343a40\" stroke=\"#212529\" stroke-width=\"1\"/><text x=\"450.0\" y=\"160.0\" font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Otobüs bileti</text><text x=\"450.0\" y=\"194.0\" font-size=\"16\" font-weight=\"800\" fill=\"#1c7ed6\" text-anchor=\"middle\">Kişi başı 420 TL</text></svg>", "son": "<p>Otomobille gidilirse yakıt ile yol ve köprü ücreti, sürücü de dâhil olmak üzere otomobildeki herkes arasında eşit paylaşılacaktır.</p>", "k": "Buna göre, otomobille gitmenin kişi başı maliyetinin otobüs biletinden az olması için otomobilde <u>en az</u> kaç kişi bulunmalıdır?", "sec": ["3", "4", "5", "6"], "secg": null, "c": "B", "a": ["Otomobille gitmenin toplam maliyeti: 1365 + 195 = 1560 TL.", "3 kişi: 1560 : 3 = 520 TL; otobüsten pahalıdır.", "4 kişi: 1560 : 4 = 390 TL; otobüs biletinden (420 TL) azdır. En az 4 kişi gerekir."], "t": "3: sürücü hesaba katılmadan yalnız yolcular sayılmış; 5 ve 6: kişi başı maliyet otobüs biletinden azdır ama bu sayılar en az kişi sayısı değildir.", "d": "Sürücüyü de kişi sayısına katın. Toplam masrafa yakıtla birlikte yol ve köprü ücretini de ekleyin; sonra kişi sayısını birer birer artırarak kişi başı maliyetin otobüs biletinden ilk kez az olduğu sayıyı bulun.", "ses": "b10"}, {"no": 11, "on": "<p>Bir kırtasiye, toptancıdan kurşun kalem ve silgi almıştır. Toptancının faturasında silgi miktarının yazılı olduğu yer ıslanıp okunamaz hâle gelmiştir. Fatura aşağıda verilmiştir.</p>", "g": "<svg style=\"width:150.0mm;max-width:100%;height:auto\" viewBox=\"0 0 600 264\" width=\"600\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\" font-family=\"'Liberation Sans', Arial, sans-serif\"><rect x=\"80.0\" y=\"6.0\" width=\"440.0\" height=\"252.0\" rx=\"4\" fill=\"#ffffff\" stroke=\"#868e96\" stroke-width=\"1.6\"/><rect x=\"80.0\" y=\"6.0\" width=\"440.0\" height=\"44.0\" rx=\"4\" fill=\"#f1f3f5\" stroke=\"#868e96\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"35.0\" font-size=\"15.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">TOPTAN KIRTASİYE · SATIŞ FATURASI</text><text x=\"100.0\" y=\"74.0\" font-size=\"13.5\" font-weight=\"700\" fill=\"#5c6370\" text-anchor=\"start\">Fatura no: 4752</text><text x=\"500.0\" y=\"74.0\" font-size=\"13.5\" font-weight=\"700\" fill=\"#5c6370\" text-anchor=\"end\">Tarih: 12.09.2026</text><rect x=\"100.0\" y=\"88.0\" width=\"200.0\" height=\"34.0\" rx=\"0\" fill=\"#ffe8cc\" stroke=\"#868e96\" stroke-width=\"1.2\"/><text x=\"200.0\" y=\"110.4\" font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Ürün</text><rect x=\"300.0\" y=\"88.0\" width=\"200.0\" height=\"34.0\" rx=\"0\" fill=\"#ffe8cc\" stroke=\"#868e96\" stroke-width=\"1.2\"/><text x=\"400.0\" y=\"110.4\" font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor= const $=s=>document.querySelector(s);$("#kod").textContent=V.kod;$("#bas").textContent=V.baslik+" · Çözümler";

    const p1=document.createElement("div");p1.className="cn";p1.setAttribute("role","tabpanel");const p2=document.createElement("div");p2.setAttribute("role","tabpanel");p2.hidden=true;
    k.append(sesKutu(s.ses),sek,p1,p2);let kur=false;const ac=i=>{sek.querySelectorAll("button").forEach((b,j)=>b.setAttribute("aria-selected",i===j));p1.hidden=i!==0;p2.hidden=i!==1;if(i===0&&!kur){kur=true;CANL[s.no](p1);}};

  if(cozKap===k)k.appendChild(sesKutu(s.ses));const w=document.createElement("div");cozKap.appendChild(w);
  adimAdim(w,s.a,()=>{const c=document.createElement("p");c.className="cevap";c.innerHTML=`<b>Doğru cevap:</b> ${s.c}`;w.appendChild(c);
    k.querySelectorAll("ol.sec li").forEach(li=>{if(li.dataset.h===s.c)li.classList.add("dogru");});
    if(s.t){const t=document.createElement("p");t.className="tuzak";t.innerHTML="<b>Diğer seçenekler neden yanlış?</b> "+s.t;w.appendChild(t);}});
  const d=document.createElement("div");d.className="dikkat";d.innerHTML=`<b>Dikkat!</b> ${s.d}`;cozKap.appendChild(d);return k;}
const ic=$("#ic");
const BOL=[["s","Sıra Sende",V.s,kartS],["k","Kalem Kâğıt",V.k,kartK],["b",V.bad||"Bağlam Soruları",V.b,kartB]].filter(x=>x[2].length);
if(tek&&BOL.some(x=>x[0]===tek)){const n=+q.get(tek);const [,,L,f]=BOL.find(x=>x[0]===tek);const s=L.find(x=>x.no===n)||L[0];ic.appendChild(f(s));$("#tum").hidden=false;$("#nav").remove();}
