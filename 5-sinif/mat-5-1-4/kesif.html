function dogruSV(W,a,b,d,o={}){const x0=34,L=W-68,u=L/(b-a),kmax=Math.max(0,...(o.nok||[]).map(n=>n[3]||0)),y=o.y||(58+kmax*30),X=v=>x0+(v-a)*u;
  let s=`<line x1="14" y1="${y}" x2="${W-14}" y2="${y}" stroke="var(--ink)" stroke-width="2"/><polygon points="${W-6},${y} ${W-18},${y-6} ${W-18},${y+6}" fill="var(--ink)"/><polygon points="6,${y} 18,${y-6} 18,${y+6}" fill="var(--ink)"/>`;
  if(d)for(let i=0;i<=(b-a)*d;i++){const v=a+i/d,ana=i%d===0;s+=`<line class="cn" data-i="${i}" x1="${X(v)}" y1="${y-(ana?10:6)}" x2="${X(v)}" y2="${y+(ana?10:6)}" stroke="var(--ink)" stroke-width="${ana?2:1.3}"/>`;}
  for(let t=a;t<=b;t++)s+=`<line x1="${X(t)}" y1="${y-10}" x2="${X(t)}" y2="${y+10}" stroke="var(--ink)" stroke-width="2"/>`+tx(X(t),y+30,t,15,800);
  (o.cent||[]).forEach(([v,e])=>{s+=`<line x1="${X(v)}" y1="${y-11}" x2="${X(v)}" y2="${y+11}" stroke="var(--acc2)" stroke-width="2.6"/>`+(Array.isArray(e)?kesSV(X(v),y+30,e[0],e[1],13,"var(--acc2)"):tx(X(v),y+32,e,13,800,"var(--acc2)"));});
  (o.nok||[]).forEach(([v,e,rk,k])=>{const c=rk||"var(--acc2)",yy=y-24-(k||0)*30;s+=`<circle cx="${X(v)}" cy="${y}" r="7" fill="${c}"/>`+(k?`<line x1="${X(v)}" y1="${y-8}" x2="${X(v)}" y2="${yy+10}" stroke="var(--muted)" stroke-dasharray="2 2"/>`:"")
    +(e==null?"":Array.isArray(e)?(e.length===3?kesSV(X(v)+6,yy,e[1],e[2],13,c,e[0]):kesSV(X(v),yy,e[0],e[1],13,c)):tx(X(v),yy+6,e,14,800,c));});
  return SV(W,y+(o.alt||46),s,o.lab||"sayı doğrusu");}
/* Ondalık sayı doğrusu: değerler yüzde birlik tam sayı (430 → 4,3); her 'her' çentikte bir etiket */

  let s=`<line x1="14" y1="${y}" x2="${W-14}" y2="${y}" stroke="var(--ink)" stroke-width="2"/><polygon points="${W-6},${y} ${W-18},${y-6} ${W-18},${y+6}" fill="var(--ink)"/><polygon points="6,${y} 18,${y-6} 18,${y+6}" fill="var(--ink)"/>`;
  for(let i=0;i<=n;i++){const h=bas+i*adim,et=i%her===0;s+=`<line class="cn" data-h="${h}" x1="${X(h)}" y1="${y-(et?10:6)}" x2="${X(h)}" y2="${y+(et?10:6)}" stroke="var(--ink)" stroke-width="${et?2:1.3}"/>`+(et?tx(X(h),y+28,ondY(h),13,800):"");}
  (o.nok||[]).forEach(([h,e,rk,k])=>{const c=rk||"var(--acc2)",yy=y-22-(k||0)*28;s+=`<circle cx="${X(h)}" cy="${y}" r="7" fill="${c}"/>`+(k?`<line x1="${X(h)}" y1="${y-8}" x2="${X(h)}" y2="${yy+8}" stroke="var(--muted)" stroke-dasharray="2 2"/>`:"")+(e==null?"":tx(X(h),yy+5,e,14,800,c));});
  if(o.ok)o.ok.forEach(([h1,h2])=>{const xa=X(h1),xb=X(h2),xm=(xa+xb)/2;s+=`<path d="M${xa} ${y-8} Q${xm} ${y-46} ${xb} ${y-8}" fill="none" stroke="var(--acc4)" stroke-width="2"/>`;});
  return SV(W,y+40,s,o.lab||"ondalık sayı doğrusu");}

/* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

let sonEylem=0; ["click","keydown"].forEach(t=>D.addEventListener(t,e=>{ if(t==="click"||e.key==="Enter"||e.key===" ")sonEylem=Date.now(); },true));
let kuyruk=[], zam=null;
const has=(s,t)=>(" "+(s||"")+" ").includes(" "+t+" ");
new MutationObserver(ms=>{ const now=Date.now(); if(now-sonEylem>900||now-gecis<450)return;
  ms.forEach(m=>{ const el=m.target; if(!(el instanceof Element)||el.closest(".kb-menu,.kb-yonerge,#index"))return;
    const fb=el.classList.contains("fb"), ok=el.classList.contains("ok"), no=el.classList.contains("no");
    if(!ok&&!no)return; if(!fb&&((ok&&has(m.oldValue,"ok"))||(no&&has(m.oldValue,"no"))))return;
    kuyruk.push({el,fb,ok}); });
  if(kuyruk.length&&!zam)zam=setTimeout(()=>{ const f=kuyruk.filter(x=>x.fb).pop(); let ok, el;
      if(f){ok=f.ok;el=f.el}else{ok=!kuyruk.some(x=>!x.ok);el=kuyruk[kuyruk.length-1].el}
      kuyruk=[];zam=null; sesCal(ok?"ok":"no");
      if(ok){ kutla(el); const i=simdiki(); if(i>=0&&(f||!$("#panel .fb"))){tamam.add(i);yaz(ILR,[...tamam]);ilerleme();} }
      const d=$("#kbDuyuru"); if(d)d.textContent=ok?"Doğru.":"Yeniden deneyiniz."; },110);
}).observe(D.body,{subtree:true,attributes:true,attributeFilter:["class"],attributeOldValue:true});

/* --- Ayarları uygula --- */
function uygula(){ H.classList.toggle("kb-sesyok",!A.ses);
  ["karsit","rahat","azhareket"].forEach(k=>H.classList.toggle("kb-"+k,!!A[k]));
  H.classList.toggle("kb-y1",A.boy===1); H.classList.toggle("kb-y2",A.boy===2);
  if(A.tema)H.setAttribute("data-theme",A.tema); else H.removeAttribute("data-theme");
  const s=$("#kbSes"); s.setAttribute("aria-pressed",A.ses); $("#kbSesY").textContent=A.ses?"Ses açık":"Ses kapalı";
  s.querySelector(".on").style.display=A.ses?"":"none"; s.querySelector(".off").style.display=A.ses?"none":"";
  D.querySelectorAll(".kb-anahtar").forEach(b=>b.setAttribute("aria-checked",!!A[b.dataset.k]));
  D.querySelectorAll("#kbBoy button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.v===A.boy));
  D.querySelectorAll("#kbTema button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===A.tema));
  yaz(ANAHTAR,A); }
uygula();
const dug=$("#kbDugme"), men=$("#kbMenu");
function menu(ac_){ men.hidden=!ac_; dug.setAttribute("aria-expanded",ac_); if(ac_)men.querySelector("button").focus(); }
dug.onclick=()=>menu(men.hidden);
D.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!men.hidden){menu(false);dug.focus();} });
D.addEventListener("click",e=>{ if(!men.hidden&&!men.contains(e.target)&&!dug.contains(e.target))menu(false); });
$("#kbSes").onclick=()=>{A.ses=!A.ses;uygula();sesCal("ok");};
D.querySelectorAll(".kb-anahtar").forEach(b=>b.onclick=()=>{A[b.dataset.k]=!A[b.dataset.k];uygula();});
D.querySelectorAll("#kbBoy button").forEach(b=>b.onclick=()=>{A.boy=+b.dataset.v;uygula();});
D.querySelectorAll("#kbTema button").forEach(b=>b.onclick=()=>{A.tema=b.dataset.v;uygula();});
$("#kbSifir").onclick=()=>{A=Object.assign({},VARS);uygula();};
const tam=$("#kbTam"); if(!D.fullscreenEnabled)tam.hidden=true;
tam.onclick=()=>{ try{ D.fullscreenElement?D.exitFullscreen():H.requestFullscreen(); }catch(e){} };

/* --- Yönerge ve sesli okuma --- */
const metin=el=>{ if(!el)return ""; const c=el.cloneNode(true); c.querySelectorAll(".frac").forEach(f=>{const s=f.querySelectorAll("span"); if(s.length>1)f.replaceWith(s[0].textContent+"/"+s[1].textContent);}); return c.textContent.replace(/\s+/g," ").trim(); };
const PAYDA={2:"ikide",3:"üçte",4:"dörtte",5:"beşte",6:"altıda",7:"yedide",8:"sekizde",9:"dokuzda",10:"onda",12:"on ikide",20:"yirmide",100:"yüzde"};
const okunus=t=>String(t).replace(/(−|-)?(\d+)\/(\d+)/g,(m,sg,a,b)=>(sg?"eksi ":"")+(PAYDA[b]||b+"'te")+" "+a).replace(/\|([^|]+)\|/g,"$1'in mutlak değeri").replace(/(^|[\s(])−\s?(\d)/g,"$1eksi $2").replace(/°C/g," derece");
const kesH=t=>String(t).replace(/(−|-)?(\d+)\/(\d+)/g,(m,sg,a,b)=>(sg?"−":"")+'<span class="frac"><span>'+a+'</span><span>'+b+'</span></span>');
const sesPuan=v=>(/natural|online|neural/i.test(v.name)?4:/google/i.test(v.name)?3:/enhanced|premium|geliş|siri/i.test(v.name)?3:1);
function yonergeMetni(){ const p=$("#panel")||D.body, h=p.querySelector("h2"), g=[];
  p.querySelectorAll(".intro,.task").forEach(e=>{const t=metin(e); if(t&&!g.includes(t)&&g.length<2)g.push(t);});
  if(!g.length&&$(".lead"))g.push(metin($(".lead")));
  return {baslik:metin(h)||D.title, gorev:g}; }
function yonergeAc(){ const y=yonergeMetni(); $("#kbYB").textContent=y.baslik;
  $("#kbYIc").innerHTML='<p class="gorev"></p><ol><li>Görevi okuyunuz; şekil ya da sayı doğrusu üzerinde deneme yapabilirsiniz.</li><li>Cevabınızı yazıp ya da seçip <b>Kontrol edin</b> düğmesine basınız.</li><li>Geri bildirimi okuyunuz. Yanlışsa ipucuyla yeniden deneyiniz.</li><li><b>Yeni soru</b> ile aynı etkinliği farklı sayılarla tekrarlayabilir, <b>Sonraki</b> ile ilerleyebilirsiniz.</li></ol><p style="font-size:14px;color:var(--muted)">Klavye: Tab ile düğmeler arasında geçiniz, Enter ile seçiniz. Esc menüyü kapatır.</p>';
  $("#kbYIc .gorev").innerHTML=kesH(y.gorev.join(" ").replace(/[<>&]/g,""));
  const d=$("#kbYonerge"); menu(false); if(d.showModal)d.showModal(); else d.setAttribute("open",""); }
$("#kbYon").onclick=yonergeAc;
$("#kbYKapat").onclick=()=>{ const d=$("#kbYonerge"); speechSynthesis&&speechSynthesis.cancel(); d.close?d.close():d.removeAttribute("open"); };
const konusabilir="speechSynthesis" in window;
function sesliOku(t){ if(!konusabilir)return; speechSynthesis.cancel();
  const v=speechSynthesis.getVoices().filter(v=>/^tr/i.test(v.lang)).sort((a,b)=>sesPuan(b)-sesPuan(a))[0];
  (okunus(t).match(/[^.!?]+[.!?]?/g)||[t]).forEach(c=>{ const u=new SpeechSynthesisUtterance(c.trim()); u.lang="tr-TR"; u.rate=.95; if(v)u.voice=v; speechSynthesis.speak(u); }); }
function okuPanel(){ const y=yonergeMetni(); sesliOku(y.baslik+". "+y.gorev.join(" ")); }
if(!konusabilir){ $("#kbOku").hidden=true; $("#kbYOku").hidden=true; }
$("#kbOku").onclick=()=>{ const b=$("#kbOku"); if(b.getAttribute("aria-pressed")==="true"){speechSynthesis.cancel();b.setAttribute("aria-pressed","false");return;}
  b.setAttribute("aria-pressed","true"); okuPanel(); const t=setInterval(()=>{ if(!speechSynthesis.speaking){b.setAttribute("aria-pressed","false");clearInterval(t);} },400); };
$("#kbYOku").onclick=()=>sesliOku(metin($("#kbYB"))+". "+metin($("#kbYIc")));
})();
</script>

<script id="kesir-cizgi">
/* ANA_KURALLAR §4.y-3: Etkinliklerde bütün kesirler kesir çizgisiyle (alt alta pay/payda) gösterilir. Düz yazılmış a/b biçimleri otomatik dönüştürülür. */
(function(){
  if (window.__kesirCizgi) return; window.__kesirCizgi = 1;
  const RX = /(^|[^\w\/.,:%])([−-])?(?:(\d+) )?(\d{1,4})\/(\d{1,4})(?![\w\/.,]\d|\w)/g;
  const ATLA = "script,style,svg,textarea,input,select,code,.ilr,.frac,[data-duz]";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function donustur(kok){
    if (!kok || !kok.nodeType) return;
    if (kok.nodeType === 3) kok = kok.parentElement;
    if (!kok || (kok.closest && kok.closest(ATLA))) return;
    const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      if (!/\d\/\d/.test(t.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = t.parentElement; if (!p || p.closest(ATLA)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const L = []; let t; while ((t = w.nextNode())) L.push(t);
    L.forEach(t => {
      let deg = false;
      const h = esc(t.nodeValue).replace(RX, (m, a, s, tam, p, q) => { deg = true;
        return a + (s ? "−" : "") + (tam ? tam + " " : "") + '<span class="frac"><span>' + p + "</span><span>" + q + "</span></span>"; });
      if (!deg) return;
      const k = document.createElement("span"); k.innerHTML = h; t.replaceWith(...k.childNodes);
    });
  }
  let bekleyen = new Set(), plan = 0;
  const calis = () => { plan = 0; const b = bekleyen; bekleyen = new Set(); b.forEach(donustur); };
  const gozcu = new MutationObserver(ms => { ms.forEach(m => {
      if (m.type === "characterData") bekleyen.add(m.target); else m.addedNodes.forEach(n => bekleyen.add(n)); });
    if (!plan) plan = requestAnimationFrame(calis); });
  const bas = () => { donustur(document.body); gozcu.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bas); else bas();
  const st = document.createElement("style");
  st.textContent = ".frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}.frac>span{display:block;text-align:center;padding:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor}";
  document.head.appendChild(st);
})();
</script>
