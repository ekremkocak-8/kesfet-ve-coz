<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çözümler · Keşfet ve Çöz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--muted:#5b6478;--line:#dfe5ef;--bg:#f5f7fb;--card:#fff;--ss:#6741d9;--kk:#0b7285;--b:#d0700f;--ok:#2b8a3e;--warn:#c92a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif}
header{background:linear-gradient(135deg,#1c5fbf,#2f8fe0);color:#fff;padding:18px 16px 22px}

main{max-width:780px;margin:14px auto 40px;padding:0 16px}
nav.sec{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}nav.sec button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}

ol.sec{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
ol.sec li{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}ol.sec li.dogru{border-color:var(--ok);background:#ebfbee;font-weight:800}
.adim{border-left:4px solid var(--c);padding:6px 12px;margin:8px 0;background:#fff;border-radius:0 10px 10px 0;animation:gel .35s ease-out}
.adim b{color:var(--c)}@keyframes gel{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dug{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
button.btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.dikkat{background:#fff4e6;border:2px solid #f59f00;border-radius:12px;padding:10px 14px;margin:12px 0 4px}.dikkat b{color:#d9480f}
.tuzak{font-size:15px;color:var(--muted);margin-top:8px}
.cevap{font-weight:900;color:var(--ok);margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid var(--line);padding:8px 10px;text-align:left}th{background:#e3fafc;color:#0b7285;font-size:13px;letter-spacing:.06em}
.ses{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border-radius:12px;background:#eef2ff}

.ses span{font-size:14px;color:var(--muted)}
.gizli{display:none}
.tum{margin:4px 0 14px;font-size:14px}.tum a{color:#1c5fbf;font-weight:800}
@media (prefers-reduced-motion:reduce){.adim{animation:none}}
/* Canlandır (05.10.2026) */
.sek{display:flex;gap:6px;margin:12px 0 0;border-bottom:2px solid var(--line)}
.sek button{border:0;background:none;font:inherit;font-weight:900;font-size:15px;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);min-height:44px;position:relative;top:2px;border-bottom:3px solid transparent}
.sek button[aria-selected=true]{color:var(--c);border-bottom-color:var(--c);background:#fff8f0}
.sek .yeni{display:inline-block;font-size:10px;background:#2b8a3e;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.06em}
.cn{padding-top:10px}
.cn-yon{background:#eef6ff;border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:10px}
.cn-sahne{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;min-height:120px;overflow-x:auto}

.cn-adimci input,.cn-test input{width:84px;height:44px;border:2px solid var(--line);border-radius:12px;font:inherit;font-weight:900;text-align:center;font-size:18px}
.cn-test label{font-weight:800;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.cn-btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
.cn-btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.cn-btn[aria-pressed=true]{background:var(--ac,var(--c));color:#fff;border-color:var(--ac,var(--c))}
.cn-btn:disabled{opacity:.5}
.cn-hazir{display:flex;flex-wrap:wrap;gap:6px}

.cn-dur .iyi{color:var(--ok);font-weight:900}.cn-dur .kotu{color:var(--warn);font-weight:900}
.cn-df{margin-top:10px;overflow-x:auto}@media(max-width:480px){.cn-adimci>span{flex-basis:100%}.cn-h{font-size:12px;padding:5px 0}.cn-izg{gap:3px}.cn-sahne{padding:6px}}@media(max-width:480px){.cn-df table{font-size:13px}.cn-df td,.cn-df th{padding:4px 5px}}.cn-df summary{font-weight:900;cursor:pointer;padding:6px 0}.cn-say{color:var(--muted);font-weight:700}
.cn-df table{font-size:15px}.cn-df td{padding:5px 8px}.cn-df tr.cn-iyi td{background:#ebfbee}.cn-df tr.cn-kotu td{background:#fff5f5}.cn-df tr.cn-son td{outline:2px solid var(--c);outline-offset:-2px}
.cn-p{animation:cnGel .35s ease-out both}@keyframes cnGel{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cn-o{fill:#ffa94d;stroke:#d9480f;stroke-width:1}.cn-o2{fill:#e8590c}.cn-k{fill:#ffc9c9;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:3 2}
.cn-cerceve{stroke:#2b8a3e;stroke-width:3}.cn-et{font-size:13px;font-weight:800;fill:#5b6478}.cn-et.b,.cn-et2b{font-weight:900;fill:#1d2433}.cn-et2{font-size:11px;fill:#5b6478;font-weight:700}.cn-et2b{font-size:13px;fill:#fff}
.cn-ku{fill:#fff4e6;stroke:#ffa94d;stroke-width:1.5}.cn-kk{fill:#fff5f5;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:4 3}
.cn-tahta0{fill:#f1f3f5;stroke:#ced4da}.cn-tahta{fill:#c08552;stroke:#8d5a2b}
.cn-ek{stroke:#868e96;stroke-width:2}.cn-sinir{stroke:#c92a2a;stroke-width:3;stroke-dasharray:5 4}.cn-yay{fill:none;stroke:#f76707;stroke-width:2}
.cn-v1{stroke:#2b8a3e;stroke-width:3}.cn-v2{stroke:#c92a2a;stroke-width:3}.cn-kis{font-size:20px}.cn-bus{font-size:16px}.cn-bek{stroke:#c92a2a;stroke-width:5;stroke-linecap:round;opacity:.6}
.cn-kum{fill:#ffe8cc;stroke:#e8590c;stroke-width:3}.cn-kum2{fill:#495057}.cn-para{fill:#ffd43b;opacity:.85}.cn-buyuk{font-size:26px;font-weight:900;fill:#1d2433}
.cn-zem{fill:#adb5bd}.cn-kat{fill:#f1f3f5;stroke:#ced4da}.cn-katon{fill:#d3f9d8;stroke:#2b8a3e}.cn-katoff{fill:#ffe3e3;stroke:#e03131}
.cn-izg{display:grid;gap:4px}.cn-h,.cn-gb{border-radius:8px;text-align:center;font-weight:800;font-size:14px;padding:6px 0}.cn-h{background:#f1f3f5;transition:background .25s,transform .25s}
.cn-gb{background:none;color:var(--muted);font-size:12px}.cn-h.on{background:#ffa94d;color:#1d2433}.cn-h.yeni{transform:scale(1.18);box-shadow:0 0 0 3px #e8590c}
.cn-kartlar{display:flex;flex-wrap:wrap;gap:6px;padding:4px}.cn-kart{min-width:44px;padding:8px 10px;text-align:center;border-radius:10px;background:#fff4e6;border:2px solid #ffa94d;font-weight:900;animation:cnGel .3s}
.cn-kart.kare{background:#e7f5ff;border-color:#1c7ed6}.cn-bosk{color:var(--muted)}
.cn-cift{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 4px;font-weight:800}.cn-cift i{font-weight:600;color:#1c7ed6}
.cn-katlar{padding:4px}.cn-katsat{display:inline-flex;flex-wrap:wrap;gap:6px}.cn-kat2{background:#e6fcf5;border:1.5px solid #12b886;border-radius:8px;padding:3px 8px;font-weight:800;animation:cnGel .3s}.cn-sonsuz{font-weight:800;color:#0b7285}
.cn-onr{background:#f8f0fc;border:2px solid #ae3ec9;border-radius:12px;padding:10px 14px}.cn-kanit{padding:10px 4px 2px}
.cn-kay{display:inline-flex;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap}.cn-kay{max-width:100%}.cn-kay input{width:min(220px,70vw);accent-color:#d0700f}.cn-satir>*{min-width:0;max-width:100%}
@media (prefers-reduced-motion:reduce){.cn-p,.cn-kart,.cn-kat2{animation:none}.cn-h{transition:none}}
/* 05.10.2026 · KOŞUL ve LABİRENT motorları (SB 6.1.1) */
@media(max-width:560px){.soru [style*="grid-template-columns:repeat"]{grid-template-columns:1fr!important}}   /* çok sütunlu konuşma balonları telefonda alt alta */
.cn-kl{list-style:none;padding:0;margin:0;display:grid;gap:4px}.cn-not{color:var(--muted);font-size:14px}.cn-sonuc{margin-top:6px;font-weight:800}
.cn-secg{gap:6px}.cn-secad{font-weight:800;flex-basis:100%}.cn-secg .cn-btn{padding:8px 12px}
.cn-mv{fill:#74c0fc;stroke:#1c7ed6;stroke-width:1}.cn-tl{fill:#69db7c;stroke:#2b8a3e;stroke-width:1.5}
.cn-lab{display:grid;gap:4px;align-items:center;max-width:460px;margin:0 auto}
.cn-lc{min-height:44px;border-radius:8px;border:1.5px solid #ced4da;background:#fff;font:inherit;font-weight:900;font-size:16px;cursor:pointer;padding:0;color:var(--ink)}
.cn-lc.yol{background:#d3f9d8;border-color:#2b8a3e}.cn-lc.simdi{background:#2b8a3e;color:#fff;box-shadow:0 0 0 3px #b2f2bb}.cn-lc.kapali{background:#ffe3e3;border-color:#e03131;color:#c92a2a;text-decoration:line-through}
.cn-lok{color:#2b8a3e;font-weight:900;text-align:center}.cn-lcik{min-height:44px;border:0;background:none;font:inherit;font-weight:900;color:#d9480f;cursor:pointer;padding:0;white-space:nowrap;font-size:14px}.cn-lcik:disabled{cursor:default}

</style></head><body>
<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }
      if (!art && !o.sandalye) sv += `<rect x="10" y="10" width="${gen * hc}" height="${sira * hc}" fill="none" class="cn-cerceve"/>
        <text x="${10 + gen * hc / 2}" y="${H + 4}" class="cn-et" text-anchor="middle">${gen} ${o.birim || ""}</text>
        <text x="${W + 4}" y="${10 + sira * hc / 2}" class="cn-et" dominant-baseline="middle">${sira} ${o.birim || ""}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W + 70} ${H + 22}" role="img" aria-label="${N} ${o.ad || "kare"}, her sırada ${gen}">${sv}</svg>`;
      const r = o.kural ? o.kural(gen, sira, art, N) : null;
      let m;
      if (art) m = `<span class="kotu">✘</span> ${N} ${o.ad || "kare"} her sırada ${gen} olacak biçimde dizilince ${sira} tam sıra oluşur, <b>${art} ${o.ad || "kare"} artar</b>. Dikdörtgen olmaz: ${N} : ${gen} işleminde kalan ${art}.`;
      else m = `<span class="iyi">✔</span> <b>${N} = ${gen} ${x} ${sira}</b> · ${sira} sıra, her sırada ${gen} ${o.ad || "kare"}; hiç artmadı.` + (gen === sira ? ` <b>Kare oldu!</b> İki kenar aynı: ${gen}.` : "");
      if (!art && o.cevre) m += ` Çevre = 2 ${x} (${gen} + ${sira}) = <b>${2 * (gen + sira)} m</b>.`;
      if (r && r.msg) m += `<br>${r.msg}`;
      s.dur.innerHTML = m;
      const sutunlar = o.satir ? o.satir(gen, sira, art, N, r) : [gen, art ? `${sira} (+ ${art} artan)` : sira, art, art ? "olmaz" : (gen === sira ? "kare" : "dikdörtgen")];
      s.yaz(N + ":" + gen, sutunlar, !art && (!r || r.ok !== false));
    }
    ciz(g.get());
  }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {
    const N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });
    const g = adimci(o.etiket, 1, o.max || N, o.bas || 2, v => { sonK = v; });

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {

/* SORU BANKASI · MAT.5.1.1 · yeni nesil soruların "Canlandır" düzenekleri (06.10.2026) — motorlar: canlandir.js (KOSUL) ve
   canlandir_511.js (BOLUKLE, TEZGAH, KUTU, KART, SIRALA). Bu dosyada iki yeni küçük motor tanımlanır (ortak dosyalara dokunmadan):
   CN.CARK8  — yalnız ileri dönen şifre çarkları: her basışta rakam 1 artar (9'dan sonra 0); çark başına ve toplam çeviriş sayılır.
   CN.YAPBOZ — kenar işaretli bölük parçalarını sıraya dizme: komşu kenarlar anında denetlenir, oluşan sayı okunur.
   §4.k / §19-10: öğrenci düzeneği elle değiştirir, sonucu anında görür, her deneme deney defterine yazılır; cevap düğmeyle verilmez. */
(() => {
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };
  function iskelet(el, o) {   // canlandir.js ile aynı görünüm
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne c5-sahne"), den = h("div", "cn-den"), dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"), kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz };
  }
  if (!document.getElementById("sb5-stil")) { const st = h("style"); st.id = "sb5-stil"; st.textContent = `
.sb5-kilit{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;background:#1f3b57;border-radius:16px;padding:12px 8px;max-width:520px;margin:0 auto}
.sb5-cark{display:flex;flex-direction:column;align-items:center;gap:4px}
.sb5-cark b{font:900 26px/1.2 Nunito,system-ui,sans-serif;background:#f8f9fa;border-radius:6px;min-width:36px;text-align:center;padding:6px 0;color:#1d2433}
.sb5-cark button{width:44px;height:44px;border-radius:10px;border:2px solid #ffd8a8;background:#fff4e6;font-size:18px;font-weight:900;cursor:pointer;color:#d9480f}
.sb5-cark small{color:#fff;font-weight:800;font-size:12px}
.sb5-parcalar,.sb5-dizi{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:8px 0;min-height:64px}
.sb5-p{min-width:96px;height:58px;border:3px solid #d9480f;background:#fff4e6;border-radius:10px;font:900 22px Nunito,system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 8px;color:#1d2433}
.sb5-p:disabled{opacity:.25;cursor:default}.sb5-p i{font-style:normal;font-size:16px;color:#495057;min-width:14px}.sb5-p i.duz{border-left:4px solid #1d2433;height:40px;min-width:0}
.sb5-p i.duz.sag{border-left:0;border-right:4px solid #1d2433}
.sb5-ek{font-weight:900;font-size:20px;align-self:center}.sb5-ek.iyi{color:#2b8a3e}.sb5-ek.kotu{color:#c92a2a}
.cn-secg .cn-btn{min-width:44px}
@media(max-width:480px){.sb5-cark b{font-size:22px;min-width:30px}.sb5-p{min-width:84px;font-size:20px}
.c5-rak{padding:6px 4px}.c5-r{font-size:18px;min-width:16px;padding:8px 0}.c5-ara{margin:0 -16px}}
`; document.head.appendChild(st); }

  /* CN.CARK8: o.bas (rakam dizisi), o.hedefOk(str) → bool (kilit açılır mı), o.yon, o.bitis */
  function CARK8(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Çarklardaki rakamlar", "Toplam çeviriş", "Kilit"], ilk: "Bir çarkı ileri çevirmek için altındaki ▲ düğmesine basın." });
    let d = o.bas.split("").map(Number), say = d.map(() => 0);
    const kut = h("div", "cn-satir"); const bD = dug("Kilidi dene 🔒"), bB = dug("Başa dön", "ghost"); kut.append(bD, bB); s.den.appendChild(kut);
    function ciz() {
      s.sah.innerHTML = "";
      const k = h("div", "sb5-kilit");
      d.forEach((x, i) => { const c = h("div", "sb5-cark"); c.innerHTML = `<b>${x}</b><button type="button" aria-label="${i + 1}. çarkı ileri çevir">▲</button><small>${say[i]} kez</small>`;
        c.querySelector("button").onclick = () => { d[i] = (d[i] + 1) % 10; say[i]++; ciz(); s.dur.innerHTML = `Toplam çeviriş: <b>${say.reduce((a, b) => a + b, 0)}</b>. Şifreye ulaştığınızı düşünüyorsanız <b>Kilidi dene</b> düğmesine basın.`; };
        k.appendChild(c); });
      s.sah.appendChild(k);
    }
    bD.onclick = () => { const str = d.join(""), top = say.reduce((a, b) => a + b, 0), ac = o.hedefOk(str);
      s.dur.innerHTML = ac ? `<span class="iyi">✔</span> Kilit açıldı! Bu denemede çarkları toplam <b>${top}</b> kez çevirdiniz. Hiçbir çarkı gereğinden fazla çevirmediyseniz bu, en az çeviriş sayısıdır.` : `<span class="kotu">✘</span> Kilit açılmadı. Çarklardaki sayı şifrenin okunuşuyla uyuşmuyor. Çarkları ileri çevirmeye devam edin ya da başa dönün.`;
      s.yaz(str + ":" + top, [CN.S5(+str) + (str[0] === "0" ? " (başı 0)" : ""), top, ac ? "açıldı ✔" : "açılmadı ✘"], ac); };
    bB.onclick = () => { d = o.bas.split("").map(Number); say = d.map(() => 0); ciz(); s.dur.innerHTML = "Çarklar başlangıç durumuna döndü."; };
    ciz();
  }

  /* CN.YAPBOZ: o.parcalar [{s, sol, sag}] (sol/sag: "●", "▲", "■" ya da null = düz kenar) */
  function YAPBOZ(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Dizilen parçalar", "Kenarlar", "Oluşan sayı"], ilk: "Masadaki bir parçaya dokunun; parça yapbozun en sağına eklenir. Yapboza eklenen parçaya dokunursanız parça masaya geri döner." });
    const P = o.parcalar; let dizi = [];
    const kenar = (x, sag) => x ? `<i>${x}</i>` : `<i class="duz${sag ? " sag" : ""}" aria-label="düz kenar"></i>`;
    const ust = h("div"), alt = h("div"); s.sah.append(h("div", "cn-not", "Masadaki parçalar"), ust, h("div", "cn-not", "Yapboz (soldan sağa)"), alt);
    const kut = h("div", "cn-satir"); const bT = dug("Yapbozu boşalt", "ghost"); kut.appendChild(bT); s.den.appendChild(kut);
    bT.onclick = () => { dizi = []; ciz(); };
    function ciz() {
      ust.className = "sb5-parcalar"; alt.className = "sb5-dizi"; ust.innerHTML = ""; alt.innerHTML = "";
      P.forEach((p, j) => { const b = h("button", "sb5-p", kenar(p.sol, false) + `<span>${p.s}</span>` + kenar(p.sag, true)); b.type = "button"; b.disabled = dizi.includes(j);
        b.setAttribute("aria-label", `${p.s} parçası`); b.onclick = () => { dizi.push(j); ciz(); }; ust.appendChild(b); });
      let uy = true, ekler = [];
      dizi.forEach((j, t) => {
        if (t) { const a = P[dizi[t - 1]].sag, b = P[j].sol, ok = a && a === b; if (!ok) uy = false; ekler.push(ok); alt.appendChild(h("span", "sb5-ek " + (ok ? "iyi" : "kotu"), ok ? "✔" : "✘")); }
        const b = h("button", "sb5-p", kenar(P[j].sol, false) + `<span>${P[j].s}</span>` + kenar(P[j].sag, true)); b.type = "button"; b.setAttribute("aria-label", `${P[j].s} parçasını geri al`);
        b.onclick = () => { dizi.splice(t, 1); ciz(); }; alt.appendChild(b); });
      if (dizi.length < P.length) { s.dur.innerHTML = `Yapbozda ${dizi.length} / ${P.length} parça var. Bütün parçaları dizin.`; return; }
      const solDuz = !P[dizi[0]].sol, sagDuz = !P[dizi[dizi.length - 1]].sag, hepsi = uy && solDuz && sagDuz;
      const str = dizi.map(j => P[j].s).join(""), n = +str;
      s.dur.innerHTML = `Rakamlar yan yana: <b>${str}</b> → <span class="c5-sayi" style="display:inline-block;font-size:22px">${CN.renkli5(String(n))}</span><br>Okunuş: <b>“${CN.oku5(n)}”</b><br>` +
        (hepsi ? `<span class="iyi">✔</span> Bütün kenarlar birbirine uyuyor; düz kenarlar en solda ve en sağda.` : `<span class="kotu">✘</span> ${!uy ? "Kırmızı ✘ olan yerlerde komşu kenarların işaretleri farklı." : "Düz kenarlı parçalar yapbozun iki ucunda olmalı."} Parçaların yerini değiştirin.`);
      const ad = dizi.map(j => P[j].s).join(" | ");
      s.yaz(ad, [ad, hepsi ? "uyuyor ✔" : "uymuyor ✘", CN.S5(n)], hepsi);
    }
    ciz();
  }
  Object.assign(CN, { CARK8, YAPBOZ });
})();

window.CANL = (() => {
  const S = CN.S5, oku = CN.oku5, x = "x";
  const sozler = n => oku(n).split(" ");
  const bolukAd = n => ["milyar", "milyon", "bin"].filter(b => sozler(n).includes(b));

    for (let k = 0; k <= parca; k++) { const v = a + (b - a) * k / parca, ana = k % (parca / 2) === 0; sv += `<line x1="${X(v)}" y1="${y - (ana ? 9 : 6)}" x2="${X(v)}" y2="${y + (ana ? 9 : 6)}" stroke="#1d2433" stroke-width="1.6"/>`;

    if (isaret != null) sv += `<path d="M${X(isaret)} ${y + 12} l-9 16 h18 z" fill="#1c5fbf"/><text x="${X(isaret)}" y="${y + 50}" text-anchor="middle" class="cn-et b" style="fill:#1c5fbf">işaretçi</text>`;
    return `<svg viewBox="0 0 ${W} 132" role="img" aria-label="sayı doğrusu">${sv}</svg>`;
  };
  return {
    /* 1 · gazete haberlerini sıralama */
    1: el => CN.SIRALA(el, { istenen: "küçükten büyüğe",
      ogeler: [{ ad: "K", html: "<span>2 milyar 50 milyon</span>", deger: 2050000000 }, { ad: "L", html: "<span>iki milyar beş yüz bin</span>", deger: 2000500000 },
        { ad: "M", html: `<span>${S(2005000000)}</span>`, deger: 2005000000 }, { ad: "N", html: `<span>(2 ${x} 1 000 000 000) + (5 ${x} 100 000 000)</span>`, deger: 2500000000 }],
      sonuc: L => `Sıra: <b>${L.map(o => o.ad).join(", ")}</b>.`,
      yon: "Haber kartlarını ▲ ve ▼ ile yer değiştirerek sayıları küçükten büyüğe dizin. İki kartın arasındaki sembol, kartlardaki sayıların gerçek karşılaştırmasını gösterir; kırmızı sembol o iki kartın yerinin yanlış olduğunu söyler. Her denemeyi deftere yazın.",
      bitis: "Bütün semboller yeşil olunca ve sıralamayı deftere yazdığınızda." }),

    /* 2 · kayıt numarasını bölüklere ayırıp okuma */
    2: el => CN.BOLUKLE(el, { rakam: "30400706001",
      yon: "Etiketteki 11 rakam ayırıcısız yazıldı. Rakamların arasına dokunarak bölük ayırıcılarını koyun ve <b>Oku ▶</b> düğmesine basın. Ayırıcıları soldan başlayarak koyarsanız ne oluyor, sağdan başlayarak koyarsanız ne oluyor? İkisini de deneyin.",
      bitis: "Soldan ve sağdan ayırmayı deneyip doğru okunuşu deney defterinde gördüğünüzde." }),

    /* 3 · bavulun ileri dönen çarkları */
    3: el => CN.CARK8(el, { bas: "42098039", hedefOk: s => +s === 45018072,
      yon: "Kilidin şifresi “kırk beş milyon on sekiz bin yetmiş iki”dir. Çarkları yalnız ▲ ile ileri çevirebilirsiniz (9'dan sonra 0 gelir). Her çarkın altında kaç kez çevrildiği, durum satırında toplam çeviriş yazar. Şifreye ulaşınca <b>Kilidi dene</b>; sonra <b>Başa dön</b> ile daha az çevirişle açmayı deneyin.",
      bitis: "Kilidi açıp en az çeviriş sayısını deney defterinde bulduğunuzda." }),

    /* 4 · dokuz kartla en büyük sayı ("bin" söylenmeyecek) */
    4: el => CN.KART(el, { kartlar: ["6", "0", "2", "9", "0", "4", "0", "7", "0"],
      kosullar: [{ ad: "Okunurken “bin” sözcüğü söylenmiyor", f: n => !sozler(n).includes("bin") }],
      sonuc: (n, s, ok) => `<div class="c5-oku">“${oku(n)}”</div>${ok ? "Kurala uyan bir sayı kurdunuz. Daha büyüğünü kurabilir misiniz?" : "Bu sayı okunurken “bin” söyleniyor."}`,
      yon: "Dokuz kartın hepsini kutulara dizerek dokuz basamaklı sayılar kurun; sayının okunuşu ve kural lambası anında görünür. Kurala uyan sayıları deftere yazın ve aralarından en büyüğünü bulun. 0 kartlarını nereye koyduğunuz neyi değiştiriyor?",
      bitis: "Kurala uyan en büyük sayıyı kurup okunuşunu seçeneklerle karşılaştırdığınızda." }),

    /* 5 · anket formu: bölük kutularını birleştirme */
    5: el => CN.KUTU(el, { kutular: ["3", "040", "5"],
      kosullar: [{ ad: "Kaydedilen sayının okunuşu “üç milyon kırk bin beş”", f: n => oku(n) === "üç milyon kırk bin beş" }],
      yon: "Kutularda Elif Hanım'ın forma yazdıkları var. <b>Birleştir ▶</b> düğmesine basın: Bilgisayar gibi rakamları yan yana getirir, sayıyı yeniden bölükler ve okur. Sonra kutulardaki yazılışı değiştirerek kaydın “üç milyon kırk bin beş” olmasını sağlayın.",
      bitis: "Bilgisayarın kaydettiği sayıyı ve doğru kayıt için kutulara ne yazılması gerektiğini bulduğunuzda." }),

    /* 6 · televizyondaki sayı doğrusu */
    6: el => { const V = { K: 7300000, L: 7800000, M: 8100000, N: 8600000 };
      return CN.KOSUL(el, { girdi: [{ ad: "İşaretçi, 7 000 000'dan sağa kaç parça?", min: 0, max: 20, bas: 0 }], dugme: false,
        ciz: v => { const d = 7000000 + v[0] * 100000; return nokta(V, 7000000, 9000000, 20, d) + `<div class="c5-bilgi"><div><small>İşaretçinin gösterdiği sayı</small><b>${S(d)}</b></div><div><small>Okunuşu</small><b>${oku(d)}</b></div></div>`; },
        kosullar: [{ ad: "İşaretçi M noktasının tam altında", f: v => v[0] === 11 }],
        sutun: ["Parça", "Sayı", "Okunuş"], satir: v => [v[0], S(7000000 + v[0] * 100000), oku(7000000 + v[0] * 100000)], iyi: (v, L) => L[0].ok ? true : null,
        yon: "İşaretçiyi − ve + düğmeleriyle birer parça kaydırın; işaretçinin gösterdiği sayı ve okunuşu anında yazılır. Önce bir parçanın kaç olduğunu bulun (iki çentik arası), sonra işaretçiyi M noktasının altına getirin.",
        bitis: "İşaretçi M'nin altına geldiğinde ve bir parçanın değerini deftere bakarak açıklayabildiğinizde." }); },

    /* 7 · kalem fabrikasında paketleme (sayaçlar) */
    7: el => { const AD = ["kamyon", "palet", "sandık", "koli", "paket", "kutu", "kalem"], DEG = [1000000, 100000, 10000, 1000, 100, 10, 1], KART = [4, 0, 6, 0, 3, 0, 5];
      const top = v => v.reduce((t, k, i) => t + k * DEG[i], 0);
      return CN.KOSUL(el, { girdi: AD.map(a => ({ ad: `${a}:`, min: 0, max: 9, bas: 0 })), dugme: "Kalemleri say ✔",
        ciz: v => `<div class="c5-bilgi">${v.map((k, i) => `<div><small>${k} ${AD[i]} (her biri ${S(DEG[i])} kalem)</small><b>${S(k * DEG[i])} kalem</b></div>`).join("")}</div><div class="c5-sayi">${CN.renkli5(String(top(v)))}</div><div class="c5-oku">“${oku(top(v)) }”</div>`,
        kosullar: [{ ad: "Sayaçlar depo sayım kartıyla aynı", f: v => v.every((k, i) => k === KART[i]) }],
        sutun: ["Sayaçlar (kamyon → kalem)", "Toplam kalem", "Kartla aynı mı?"], satir: (v, ok) => [v.join(" · "), S(top(v)), ok ? "aynı ✔" : "farklı"],
        yon: "Önce yalnız 1 kamyon, sonra yalnız 1 sandık girip kaç kalem ettiğine bakın. Sonra depo sayım kartındaki sayıları sayaçlara girin; toplam kalem sayısı ve okunuşu anında yazılır. Hiç olmayan birim için sayaç 0'da kalır.",
        bitis: "Depo kartındaki sayıları girip toplam kalem sayısının okunuşunu bulduğunuzda." }); },

    /* 8 · bozuk 0 tuşu */
    8: el => CN.TEZGAH(el, { bas: "1000000000", okunus: true,
      kosullar: [{ ad: "Okunuş “beş milyar yetmiş bin dört yüz”", f: n => oku(n) === "beş milyar yetmiş bin dört yüz" }],
      bilgi: (n, s) => `<div><small>Bozuk klavyede ekranda görünen</small><b>${s.replace(/0/g, "") || "(boş)"}</b></div><div><small>Yazılmayan 0 sayısı</small><b>${(s.match(/0/g) || []).length}</b></div>`,
      sutun: ["Kurulan sayı", "Ekranda görünen", "Okunuş doğru mu?"], satir: (n, s, K) => [S(n), s.replace(/0/g, ""), K.hepsi ? "doğru ✔" : "değil"],
      yon: "Rakam çarklarıyla on basamaklı bir sayı kurun; okunuşu ve bozuk klavyede ekranda görünecek rakamlar hemen altında yazılır. Okunuş “beş milyar yetmiş bin dört yüz” olunca 5 ile 7 arasında kaç tane 0 olduğunu kurduğunuz sayıda kendiniz sayın.",
      bitis: "Doğru sayıyı kurup 5 ile 7 arasındaki 0'ları saydığınızda." }),

    /* 9 · kütüphane rafı */
    9: el => CN.SIRALA(el, { istenen: "küçükten büyüğe (soldan sağa)",
      ogeler: [4051237, 4105237, 4015732, 4150327, 4510723].map((v, i) => ({ ad: `${i + 1}. kitap`, html: `<span>${S(v)}</span>`, deger: v })),
      sonuc: L => `Raf düzeldi. Yeri değişen kitaplara bakın.`,
      yon: "Kitapları ▲ ve ▼ ile yer değiştirerek numaraları küçükten büyüğe dizin. Kitapların arasındaki sembol iki numaranın gerçek karşılaştırmasıdır. Yalnız bir kitabı taşıyarak rafı düzeltmeye çalışın; hangi kitap yerinden oynadı?",
      bitis: "Bütün semboller yeşil olunca ve yer değiştiren kitabı bulduğunuzda." }),

    /* 10 · yapboz */
    10: el => CN.YAPBOZ(el, { parcalar: [{ s: "009", sol: "▲", sag: "■" }, { s: "17", sol: null, sag: "●" }, { s: "460", sol: "■", sag: null }, { s: "305", sol: "●", sag: "▲" }],
      yon: "Masadaki parçalara dokunarak yapbozu soldan sağa dizin. Komşu iki parçanın kenar işaretleri aynıysa aralarında yeşil ✔ çıkar. Bütün parçalar dizilince oluşan sayı ve okunuşu yazılır. Farklı dizilişleri de deneyip okunuşların nasıl değiştiğine bakın.",
      bitis: "Bütün kenarlar uyduğunda ve sayının okunuşunu seçeneklerle karşılaştırdığınızda." }),

    /* 11 · sayı okuma yarışması */
    11: el => { const OK = { "altı milyar yetmiş milyon seksen bin dokuz yüz": "Defne", "altı yüz yedi milyon sekiz bin doksan": "Mert", "altı milyar yedi yüz milyon sekiz yüz bin dokuz yüz": "Ece" };
      return CN.BOLUKLE(el, { rakam: "6070080900",
        yorum: (G, dogru, t) => dogru ? `Bu okunuş <b>Defne</b>'nin okuyuşuyla aynı.`
          : G[0].length === 3 ? `Bölükleri soldan ayırdınız. Mert de böyle ayırmış (607 | 008 | 090 | 0) ve ilk üç grubu “altı yüz yedi milyon sekiz bin doksan” diye okumuştu.`
          : "Bu ayırma üç öğrencinin okuyuşundan farklı.",
        yon: "Tahtadaki rakamların arasına ayırıcı koyup <b>Oku ▶</b> düğmesine basın. Önce Defne gibi sağdan, sonra Mert gibi soldan üçer ayırın. Ece'nin okuyuşu için bölüklerin içindeki 0'lara dikkat edin: 070 ile 700 aynı mı?",
        bitis: "Mert'in ve Ece'nin okuyuşlarının nereden çıktığını defterdeki denemelerle açıklayabildiğinizde." }); },

    /* 12 · 15 boncuk ve abaküs */
    12: el => CN.TEZGAH(el, { bas: "1000000000", abakus: true, okunus: true,
      kosullar: [{ ad: "Toplam boncuk sayısı 15", f: (n, s) => s.split("").reduce((t, c) => t + +c, 0) === 15 },
        { ad: "Okunuşta bölük adı olarak yalnız “milyar” ve “bin” söyleniyor", f: n => bolukAd(n).join(",") === "milyar,bin" }],
      bilgi: (n, s) => `<div><small>Takılan boncuk</small><b>${s.split("").reduce((t, c) => t + +c, 0)} / 15</b></div>`,
      sutun: ["Sayı", "Boncuk", "Koşullar"], satir: (n, s, K) => [S(n), s.split("").reduce((t, c) => t + +c, 0), K.hepsi ? "ikisi de ✔" : K.L.map(r => r.ok ? "✔" : "✘").join(" ")],
      yon: "Çarkların ▲ ▼ düğmeleriyle çubuklara boncuk takın ya da çıkarın; abaküs, okunuş ve boncuk sayısı anında değişir. İki koşulu birlikte sağlayan sayıları deftere yazın. En büyük sayı için boncukları hangi çubuklara koymalısınız?",
      bitis: "İki koşulu da sağlayan en büyük sayıyı bulup deftere yazdığınızda." }),

    /* 13 · puan tablosu, iki gizli rakam */
    13: el => CN.TEZGAH(el, { bas: "4015012090", acik: [2, 4], okunus: false,
      kosullar: [{ ad: `Kaan'ın puanından (${S(4080215300)}) küçük`, f: n => n < 4080215300 }, { ad: `Efe'nin puanından (${S(4007990000)}) büyük`, f: n => n > 4007990000 }],
      sutun: ["■", "▲", "Duru'nun puanı", "Sıralama"], satir: (n, s, K) => [s[2], s[4], S(n), K.hepsi ? "uyuyor ✔" : "uymuyor ✘"],
      yon: "Duru'nun puanında yalnız ■ (on milyonlar) ve ▲ (yüz binler) çarkları değişebilir. Çarkları değiştirip her denemeyi deftere yazın; iki lamba da yeşil mi? ■'yi 0'dan 9'a kadar deneyin. ▲'yı değiştirmek sonucu değiştiriyor mu?",
      bitis: "■ yerine yazılabilecek bütün rakamları deftere yazıp saydığınızda." }),

    /* 14 · sihirbazın on iki rakamlık sayısı */
    14: el => CN.KOSUL(el, { girdi: [{ ad: "Seçilen rakam:", sec: [1, 2, 3, 4, 5, 6, 7, 8, 9], bas: 4 }], dugme: false,
      ciz: v => { const n = +String(v[0]).repeat(12), w = sozler(n); return `<div class="c5-sayi">${CN.renkli5(String(n))}</div><div class="c5-oku">${w.map((s, i) => `${s}<sup style="color:#d9480f">${i + 1}</sup>`).join(" ")}</div>`; },
      kosullar: [{ ad: v => `Okunuş ${sozler(+String(v[0]).repeat(12)).length} sözcük`, f: v => sozler(+String(v[0]).repeat(12)).length === 15 }],
      sutun: ["Rakam", "Sayı", "Sözcük sayısı"], satir: v => [v[0], S(+String(v[0]).repeat(12)), sozler(+String(v[0]).repeat(12)).length], iyi: (v, L) => L[0].ok ? true : null,
      yon: "Bir rakam seçin; rakam on iki kez yan yana yazılır ve okunuşundaki sözcükler numaralanır. Bütün rakamları deneyin. Sözcük sayısı hangi rakamda farklı çıkıyor? Bu rakamın bölüğünü nasıl okuduğumuza bakın.",
      bitis: "Dokuz rakamın hepsini deneyip okunuşu 15 sözcük olan rakamı bulduğunuzda." }),

    /* 15 · üç önerme */
    15: el => { const ON = {
        Ada: { m: "Okunuşunda “milyon” sözcüğü söylenen her sayı en az yedi basamaklıdır.", f: n => !sozler(n).includes("milyon") ? { ok: true, not: "(okunuşta “milyon” yok; önerme bu sayıyla sınanamaz)" } : { ok: String(n).length >= 7 } },
        Kaan: { m: "Okunuşu dört sözcükten oluşan her sayı yedi basamaklıdır.", f: n => sozler(n).length !== 4 ? { ok: true, not: `(okunuş ${sozler(n).length} sözcük; önerme bu sayıyla sınanamaz)` } : { ok: String(n).length === 7 } },
        Ela: { m: "On basamaklı her sayının okunuşunda en az iki bölük adı söylenir.", f: n => String(n).length !== 10 ? { ok: true, not: "(sayı on basamaklı değil; önerme bu sayıyla sınanamaz)" } : { ok: bolukAd(n).length >= 2 } } };
      return CN.KOSUL(el, { girdi: [{ ad: "Önerme:", sec: ["Ada", "Kaan", "Ela"], bas: "Ada" }, { ad: "Sınanacak sayı:", min: 1, max: 999999999999, bas: 4000300 }], dugme: "Sına ✔",
        ek: [400005, 1000000000, 4000300, 7000000, 1200400].map(n => ({ ad: S(n), deger: v => [v[0], n] })),
        ciz: v => `<div class="cn-onr"><b>${v[0]}:</b> “${ON[v[0]].m}”</div><div class="c5-sayi">${CN.renkli5(String(v[1]))}</div><div class="c5-oku">“${oku(v[1])}” · ${String(v[1]).length} basamak · ${sozler(v[1]).length} sözcük</div>`,
        kosullar: [{ ad: v => `${{ Ada: "Ada'nın", Kaan: "Kaan'ın", Ela: "Ela'nın" }[v[0]]} önermesi bu sayıda sağlanıyor`, f: v => ON[v[0]].f(v[1]) }],
        sutun: ["Önerme", "Sayı", "Sonuç"], satir: (v, ok, L) => [v[0], S(v[1]), L[0].not ? "sınanamaz" : ok ? "doğru" : "yanlış (karşı örnek)"], iyi: (v, L) => L[0].not ? null : L[0].ok,
        yon: "Bir önerme seçin, bir sayı yazın (ya da hazır düğmelerden seçin) ve <b>Sına</b> düğmesine basın. Sayının okunuşu, basamak sayısı ve sözcük sayısı yazılır. Her önerme için karşı örnek arayın; karşı örnek bulunan önerme her zaman doğru değildir.",
        bitis: "Üç önermenin her biri için kararınızı deney defterindeki denemelere dayanarak verdiğinizde." }); },

    /* 16 · çekiliş ipuçları */
    16: el => CN.TEZGAH(el, { bas: "700000123", acik: [6, 7, 8], okunus: true,
      kosullar: [{ ad: "Milyonlar bölüğü 700 ve “bin” söylenmiyor", f: n => Math.floor(n / 1e6) === 700 && !sozler(n).includes("bin") },
        { ad: "Birler bölüğündeki üç rakam birbirinden farklı", f: (n, s) => new Set(s.slice(6)).size === 3 },
        { ad: "Birler bölüğündeki rakamların toplamı 6", f: (n, s) => s.slice(6).split("").reduce((t, c) => t + +c, 0) === 6 }],
      sutun: ["Numara", "Okunuş", "İpuçları"], satir: (n, s, K) => [S(n), oku(n), K.hepsi ? "hepsine uyuyor ✔" : K.L.map(r => r.ok ? "✔" : "✘").join(" ")],
      yon: "Birler bölüğündeki üç çarkı değiştirerek numaralar kurun; ipucu lambaları anında yeşil ya da kırmızı olur. İpuçlarına uyan numaraları deftere yazın ve aralarından en büyüğünü bulun.",
      bitis: "İpuçlarına uyan en büyük numarayı bulup okunuşunu deftere yazdığınızda." }),
  };
})();

</script>
<script>

=\"#111111\" text-anchor=\"middle\">3</text><rect x=\"459.5\" y=\"96.0\" width=\"30.0\" height=\"50.0\" rx=\"4\" fill=\"#f8f9fa\" stroke=\"#495057\" stroke-width=\"1.2\"/><line x1=\"459.5\" y1=\"104.0\" x2=\"489.5\" y2=\"104.0\" stroke=\"#ced4da\" stroke-width=\"1\"/><line x1=\"459.5\" y1=\"138.0\" x2=\"489.5\" y2=\"138.0\" stroke=\"#ced4da\" stroke-width=\"1\"/><text x=\"474.5\" y=\"128.0\" font-family=\"Liberation Sans\" font-size=\"22\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">9</text><text x=\"345.0\" y=\"184.0\" font-family=\"Liberation Sans\" font-size=\"13\" font-weight=\"700\" fill=\"#ffffff\" text-anchor=\"middle\">Kilidin şu anki görünümü</text></svg>", "son": "<p>Kilidin şifresi, okunuşu “kırk beş milyon on sekiz bin yetmiş iki” olan sayıdır. Çarklarda şifrenin rakamları soldan sağa sırayla görününce kilit açılmaktadır.</p>", "k": "Buna göre, kilidin açılması için çarklar toplam <u>en az</u> kaç kez çevrilmelidir?", "sec": ["4", "12", "22", "28"], "secg": null, "c": "B", "a": ["Şifre rakamlarla 45 018 072'dir; rakamları soldan sağa 4, 5, 0, 1, 8, 0, 7, 2'dir. Kilitte 4, 2, 0, 9, 8, 0, 3, 9 görünmektedir.", "Değişmesi gereken çarklar: 2 → 5 (3 çeviriş), 9 → 1 (9 → 0 → 1, 2 çeviriş), 3 → 7 (4 çeviriş), 9 → 2 (9 → 0 → 1 → 2, 3 çeviriş).", "Toplam 3 + 2 + 4 + 3 = 12 çeviriş gerekir."], "t": "4: yalnız çevrilecek çark sayısı bulunmuş; 22: rakamlar arasındaki fark alınmış, 9'dan 1'e 8 çeviriş sayılmış; 28: çarkların geri yönde çevrildiği düşünülmüş.", "d": "Çark yalnız ileri döndüğü için 9'dan sonra 0 gelir: 9'dan 1'e iki, 9'dan 2'ye üç çeviriş yeter. İki rakam arasındaki farkı almak burada yanlış sonuç verir; her çarkı ayrı ayrı sayın.", "ses": "b03"}, {"no": 4, "on": "<p>Bir okulun “Sayı Ustası” yarışmasında yarışmacılara aşağıdaki dokuz rakam kartı verilmiştir. Kartların hepsi yan yana dizilerek dokuz basamaklı bir sayı yazılacaktır.</p>", "g": "<svg viewBox=\"0 0 462 56\" width=\"462\" height=\"56\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"3.0\" y=\"3.0\" width=\"40.0\" height=\"50.0\" rx=\"5\" fill=\"#ffffff\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"23.0\" y=\"36.0\" font-family=\"Liberation Sans\" font-size=\"23\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">6</text><rect x=\"55.0\" y=\"3.0\" width=\"40.0\" height=\"50.0\" rx=\"5\" fill=\"#ffffff\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"75.0\" y=\"36.0\" font-family=\"Liberation Sans\" font-size=\"23\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">0</text><rect x=\"107.0\" y=\"3.0\" width=\"40.0\" height=\"50.0\" rx=\"5\" fill=\"#ffffff\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"127.0\" y=\"36.0\" font-family=\"Liberation Sans\" font-size=\"23\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">2</text><rect x=\"159.0\" y=\"3.0\" width=\"40.0\" height=\"50.0\" rx=\"5\" fill=\"#ffffff\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"179.0\" y=\"36.0\" font-family=\"Liberation Sans\" font-size=\"23\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">9</text><rect x=\"211.0\" y=\"3.0\" width=\"40.0\" height=\"50.0\" rx=\"5\" fill=\"#ffffff\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"231.0\" y=\"36.0\" font-family=\"Liberation Sans\" font-size=\"23\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">0</text><rect x=\"263.0\" y=\"3.0\" width=\"40.0\" height=\"50.0\" rx=\"5\" fill=\"#ffffff\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"283.0\" y=\"36.0\" font-family=\"Liberation Sans\" font-size=\"23\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">4</text><rect x=\"315.0\" y=\"3.0\" width=\"40.0\" height=\"50.0\" rx=\"5\" fill=\"#ffffff\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"335.0\" y=\"36.0\" font-family=\"Liberation Sans\" font-size=\"23\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">0</text><rect x=\"367.0\" y=\"3.0\" width=\"40.0\" height=\"50.0\" rx=\"5\" fill=\"#ffffff\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"387.0\" y=\"36.0\" font-family=\"Liberation Sans\" font-size=\"23\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">7</text><rect x=\"419.0\" y=\"3.0\" width=\"40.0\" height=\"50.0\" rx=\"5\" fill=\"#ffffff\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"439.0\" y=\"36.0\" font-family=\"Liberation Sans\" font-size=\"23\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">0</text></svg>", "son": "<p>Yazılan sayı okunurken bölük adı olarak “bin” söylenmeyecektir. Yarışmayı, bu kurala uyan en büyük sayıyı yazan yarışmacı kazanacaktır.</p>", "k": "Buna göre, yarışmayı kazandıran sayının okunuşu aşağıdakilerden hangisidir?", "sec": ["dokuz yüz yetmiş altı milyon dört yüz yirmi bin", "dokuz yüz altmış yedi milyon dört yüz yirmi", "dokuz yüz yetmiş altı milyon dört yüz yirmi", "dokuz yüz yetmiş altı milyon dört yüz iki"], "secg": null, "c": "C", "a": ["“Bin” söylenmemesi için binler bölüğü 000 olmalıdır; dört tane 0 kartından üçü binler bölüğüne konur.", "Kalan 9, 7, 6, 4, 2 ve 0 kartları en büyük sayıyı verecek şekilde dizilir: milyonlar bölüğü 976, birler bölüğü 420.", "Sayı 976 000 420'dir; okunuşu “dokuz yüz yetmiş altı milyon dört yüz yirmi”dir."], "t": "A: kural unutulup en büyük sayı 976 420 000 yazılmış; B: 7 ile 6 kartlarının yeri değiştirilmiş; D: birler bölüğünde 2 ile 0 kartlarının yeri değiştirilmiş.", "d": "“Bin” söylenmemesi binler bölüğünün 000 olması demektir. Önce üç 0 kartını binler bölüğüne ayırın, sonra kalan kartları en büyük sayıyı verecek şekilde soldan sağa büyükten küçüğe dizin.", "ses": "b04"}, {"no": 5, "on": "<p>Bir sitenin yönetimi, site sakinlerinden bir anket formu doldurmalarını istemiştir. Formdaki sayılar bölük kutularına yazılmakta; bilgisayar ise kutulardaki rakamları soldan sağa doğru aralarına boşluk bırakmadan birleştirerek kaydetmektedir.</p>", "g": "<svg viewBox=\"0 0 690 218\" width=\"690\" height=\"218\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"110.0\" y=\"6.0\" width=\"470.0\" height=\"206.0\" rx=\"6\" fill=\"#ffffff\" stroke=\"#111111\" stroke-width=\"1.6\"/><rect x=\"110.0\" y=\"6.0\" width=\"470.0\" height=\"38.0\" rx=\"6\" fill=\"#e3edfb\" stroke=\"#1c5fbf\" stroke-width=\"1.4\"/><text x=\"345.0\" y=\"31.0\" font-family=\"Liberation Sans\" font-size=\"15\" font-weight=\"800\" fill=\"#1c5fbf\" text-anchor=\"middle\">SİTE YÖNETİMİ ANKETİ</text><text x=\"130.0\" y=\"70.0\" font-family=\"Liberation Sans\" font-size=\"12.5\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">Sitenizin geçen yıl kullandığı su miktarını (litre) bölük kutularına yazınız.</text><text x=\"200.0\" y=\"104.0\" font-family=\"Liberation Sans\" font-size=\"13\" font-weight=\"800\" fill=\"#5c6370\" text-anchor=\"middle\">Milyonlar</text><rect x=\"140.0\" y=\"114.0\" width=\"120.0\" height=\"50.0\" rx=\"6\" fill=\"#fffdf2\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"200.0\" y=\"148.0\" font-family=\"Liberation Sans\" font-size=\"26\" font-weight=\"700\" fill=\"#1c3d8a\" text-anchor=\"middle\">3</text><text x=\"345.0\" y=\"104.0\" font-family=\"Liberation Sans\" font-size=\"13\" font-weight=\"800\" fill=\"#5c6370\" text-anchor=\"middle\">Binler</text><rect x=\"285.0\" y=\"114.0\" width=\"120.0\" height=\"50.0\" rx=\"6\" fill=\"#fffdf2\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"345.0\" y=\"148.0\" font-family=\"Liberation Sans\" font-size=\"26\" font-weight=\"700\" fill=\"#1c3d8a\" text-anchor=\"middle\">040</text><text x=\"490.0\" y=\"104.0\" font-family=\"Liberation Sans\" font-size=\"13\" font-weight=\"800\" fill=\"#5c6370\" text-anchor=\"middle\">Birler</text><rect x=\"430.0\" y=\"114.0\" width=\"120.0\" height=\"50.0\" rx=\"6\" fill=\"#fffdf2\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"490.0\" y=\"148.0\" font-family=\"Liberation Sans\" font-size=\"26\" font-weight=\"700\" fill=\"#1c3d8a\" text-anchor=\"middle\">5</text><text x=\"345.0\" y=\"196.0\" font-family=\"Liberation Sans\" font-size=\"12\" font-weight=\"700\" fill=\"#5c6370\" text-anchor=\"middle\">Boş bölük kutusu bırakmayınız.</text></svg>", "son": "<p>Site yöneticisi Elif Hanım, sitenin geçen yıl kullandığı “üç milyon kırk bin beş” litre suyu forma yukarıdaki gibi yazmıştır.</p>", "k": "Buna göre, bilgisayarın kaydettiği sayının okunuşu aşağıdakilerden hangisidir?", "sec": ["üç milyon kırk bin beş", "üç bin dört yüz beş", "üç milyon kırk bin beş yüz", "otuz bin dört yüz beş"], "secg": null, "c": "D", "a": ["Bilgisayar kutulardaki rakamları yan yana birleştirir: 3, 040 ve 5 → 30405.", "Elif Hanım binler bölüğünü üç rakamla yazmış, ancak birler bölüğüne 005 yerine yalnız 5 yazmıştır.", "Kaydedilen sayı 30 405'tir; okunuşu “otuz bin dört yüz beş”tir."], "t": "A: Elif Hanım'ın yazmak istediği sayı; B: binler bölüğündeki 0 da atlanmış gibi düşünülmüş (3405); C: birler bölüğündeki 5, 500 gibi okunmuş.", "d": "Bir bölükte üç basamak vardır; 5 rakamı birler bölüğünde 005 olarak yazılmalıdır. Bölüğün başındaki 0'lar yazılmazsa rakamlar birleşince bütün basamaklar kayar ve sayı küçülür.", "ses": "b05"}, {"no": 6, "on": "<p>Bir televizyon yarışmasında izleyiciler dört yarışmacıdan birine oy vermiştir. Yayın sırasında yarışmacıların aldığı oy sayıları, ekrandaki bir sayı doğrusu üzerinde K, L, M ve N noktalarıyla gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 640 182\" width=\"640\" height=\"182\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"20.0\" y=\"4.0\" width=\"600.0\" height=\"164.0\" rx=\"14\" fill=\"#1d2433\" stroke=\"#0b0f17\" stroke-width=\"3\"/><rect x=\"34.0\" y=\"16.0\" width=\"572.0\" height=\"140.0\" rx=\"6\" fill=\"#f8fbff\" stroke=\"none\" stroke-width=\"0\"/><text x=\"320.0\" y=\"38.0\" font-family=\"Liberation Sans\" font-size=\"13\" font-weight=\"800\" fill=\"#5c6370\" text-anchor=\"middle\">Canlı oylama · Toplam oy</text><line x1=\"56.0\" y1=\"100.0\" x2=\"584.0\" y2=\"100.0\" stroke=\"#111111\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"92.0\" x2=\"70.0\" y2=\"10 : "<p>Kütüphane görevlisi, bu raftaki kitaplardan yalnız birinin yanlış yere konduğunu fark etmiştir.</p>", "k": "Buna göre, yanlış yere konan kitabın numarası aşağıdakilerden hangisidir?", "sec": ["4 015 732", "4 105 237", "4 150 327", "4 510 723"], "secg": null, "c": "A", "a": ["Numaraların hepsi yedi basamaklıdır ve milyonlar basamakları 4'tür; yüz binler basamaklarına bakılır: 0, 1, 0, 1, 5.", "Yüz binler basamağı 0 olan iki kitaptan 4 015 732, 4 051 237'den küçüktür (on binler basamağında 1 &lt; 5); bu yüzden en solda olmalıdır.", "4 015 732 rafın 3. sırasından alınıp en başa konursa sıra 4 015 732 &lt; 4 051 237 &lt; 4 105 237 &lt; 4 150 327 &lt; 4 510 723 olur."], "t": "4 510 723: rakamları en büyük görünen numara yanlış sanılmış; 4 105 237 ve 4 150 327: aynı rakamlarla yazıldıkları için yer değiştirmiş sanılmış.", "d": "Basamak sayıları eşit sayılar soldan sağa basamak basamak karşılaştırılır; ilk farklı basamak kararı verir. Yanlış yerdeki kitabı bulmak için sırayı bozan kitabı arayın: o kitap çıkarılınca kalan sıra doğru olmalıdır.", "ses": "b09"}, {"no": 10, "on": "<p>Ece, bir sayının bölüklerini dört yapboz parçasına yazmıştır. Her parçada bir bölükteki sayı bulunmaktadır. Parçalar masada aşağıdaki gibi karışık durmaktadır.</p>", "g": "<svg viewBox=\"0 0 690 188\" width=\"690\" height=\"188\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"20.0\" y=\"40.0\" width=\"140.0\" height=\"74.0\" rx=\"6\" fill=\"#fff4e6\" stroke=\"#d9480f\" stroke-width=\"2\"/><text x=\"90.0\" y=\"86.0\" font-family=\"Liberation Sans\" font-size=\"26\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">009</text><polygon points=\"32,69 24,83 40,83\" fill=\"#111111\"/><rect x=\"141.0\" y=\"70.0\" width=\"14.0\" height=\"14.0\" rx=\"0\" fill=\"#111111\" stroke=\"#111111\" stroke-width=\"1\"/><rect x=\"188.0\" y=\"74.0\" width=\"140.0\" height=\"74.0\" rx=\"6\" fill=\"#fff4e6\" stroke=\"#d9480f\" stroke-width=\"2\"/><text x=\"258.0\" y=\"120.0\" font-family=\"Liberation Sans\" font-size=\"26\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">17</text><line x1=\"188.0\" y1=\"72.0\" x2=\"188.0\" y2=\"150.0\" stroke=\"#111111\" stroke-width=\"4\"/><circle cx=\"316.0\" cy=\"111.0\" r=\"7.0\" fill=\"#111111\" stroke=\"#111111\" stroke-width=\"1\"/><rect x=\"356.0\" y=\"40.0\" width=\"140.0\" height=\"74.0\" rx=\"6\" fill=\"#fff4e6\" stroke=\"#d9480f\" stroke-width=\"2\"/><text x=\"426.0\" y=\"86.0\" font-family=\"Liberation Sans\" font-size=\"26\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">460</text><rect x=\"361.0\" y=\"70.0\" width=\"14.0\" height=\"14.0\" rx=\"0\" fill=\"#111111\" stroke=\"#111111\" stroke-width=\"1\"/><line x1=\"496.0\" y1=\"38.0\" x2=\"496.0\" y2=\"116.0\" stroke=\"#111111\" stroke-width=\"4\"/><rect x=\"524.0\" y=\"74.0\" width=\"140.0\" height=\"74.0\" rx=\"6\" fill=\"#fff4e6\" stroke=\"#d9480f\" stroke-width=\"2\"/><text x=\"594.0\" y=\"120.0\" font-family=\"Liberation Sans\" font-size=\"26\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">305</text><circle cx=\"536.0\" cy=\"111.0\" r=\"7.0\" fill=\"#111111\" stroke=\"#111111\" stroke-width=\"1\"/><polygon points=\"652,103 644,117 660,117\" fill=\"#111111\"/><text x=\"345.0\" y=\"178.0\" font-family=\"Liberation Sans\" font-size=\"12.5\" font-weight=\"700\" fill=\"#5c6370\" text-anchor=\"middle\">Kalın çizgi: düz kenar</text></svg>", "son": "<p>Yapbozda bir parçanın sağ kenarındaki işaret, sağına gelecek parçanın sol kenarındaki işaretle aynıdır. Düz kenarlı parçalar yapbozun en solunda ve en sağında yer alır. Yapboz tamamlanınca parçalardaki rakamlar arasında boşluk bırakılmadan yan yana okunacaktır.</p>", "k": "Buna göre, yapboz tamamlandığında oluşan sayının okunuşu aşağıdakilerden hangisidir?", "sec": ["dokuz yüz on yedi milyon dört yüz altmış bin üç yüz beş", "on yedi milyar üç yüz beş milyon dokuz yüz bin dört yüz altmış", "yüz yetmiş üç milyar elli milyon doksan dört bin altmış", "on yedi milyar üç yüz beş milyon dokuz bin dört yüz altmış"], "secg": null, "c": "D", "a": ["Sol kenarı düz olan parça (17) en sola gelir. Sağ kenarında ● vardır; sol kenarı ● olan 305 parçası onun sağına gelir.", "305'in sağ kenarındaki ▲ ile 009, 009'un sağ kenarındaki ■ ile 460 parçası eşleşir; 460'ın sağ kenarı düzdür. Sıra 17 | 305 | 009 | 460'tır.", "Sayı 17 305 009 460'tır; okunuşu “on yedi milyar üç yüz beş milyon dokuz bin dört yüz altmış”tır."], "t": "A: parçalar masadaki sırayla okunmuş ve baştaki 0'lar atılmış; B: 009 bölüğü 900 gibi okunmuş; C: birleşen sayı bölüklere soldan ayrılmış.", "d": "Önce düz kenarlı parçaları bulun: sol kenarı düz olan en sola, sağ kenarı düz olan en sağa gelir. Parçaları birleştirince 009 gibi bölüklerin başındaki 0'lar da sayının içinde yerini korur.", "ses": "b10"}, {"no": 11, "on": "<p>Bir sınıfta “Sayı Okuma Yarışması” düzenlenmiştir. Öğretmen akıllı tahtaya rakamları arasında boşluk bırakmadan bir sayı yazmış ve üç öğrenciden bu sayıyı okumasını istemiştir.</p>", "g": "<svg viewBox=\"0 0 690 144\" width=\"690\" height=\"144\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"130.0\" y=\"6.0\" width=\"430.0\" height=\"130.0\" rx=\"6\" fill=\"#2f4f3a\" stroke=\"#7a5a2b\" stroke-width=\"7\"/><text x=\"345.0\" y=\"82.0\" font-family=\"Liberation Sans\" font-size=\"30\" font-weight=\"700\" fill=\"#ffffff\" text-anchor=\"middle\">6070080900</text></svg>", "son": "<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:2.6mm;margin:1mm 0 .5mm\"><div style=\"border:.45mm solid #1c5fbf;border-radius:3.2mm;padding:1.8mm 2.6mm;background:#fff\"><b style=\"color:#1c5fbf\">Defne:</b> “altı milyar yetmiş milyon seksen bin dokuz yüz”</div><div style=\"border:.45mm solid #d9480f;border-radius:3.2mm;padding:1.8mm 2.6mm;background:#fff\"><b style=\"color:#d9480f\">Mert:</b> “altı yüz yedi milyon sekiz bin doksan”</div><div style=\"border:.45mm solid #2b8a3e;border-radius:3.2mm;padding:1.8mm 2.6mm;background:#fff\"><b style=\"color:#2b8a3e\">Ece:</b> “altı milyar yedi yüz milyon sekiz yüz bin dokuz yüz”</div></div><p>Öğretmen, yalnız Defne'nin sayıyı doğru okuduğunu söylemiştir.</p>", "k": "Buna göre, Mert ile Ece'nin yaptığı hatalar aşağıdakilerin hangisinde doğru verilmiştir?", "sec": ["Mert, 0 rakamlarını hiç yazmamış gibi okumuştur; Ece ise bölükleri soldan ayırmıştır.", "Mert, sayıyı doğru bölüklere ayırmıştır; Ece ise sayıyı on bir basamaklı sanmıştır.", "Mert, bölükleri soldan ayırmıştır; Ece ise 070 ve 080 bölüklerini 700 ve 800 gibi okumuştur.", "Mert, bölükleri soldan ayırmıştır; Ece ise sayıyı on bir basamaklı sanmıştır."], "secg": null, "c": "C", "a": ["Sayı on basamaklıdır; doğru bölükler 6 | 070 | 080 | 900'dür (Defne'nin okuyuşu).", "Mert soldan üçer ayırmıştır: 607 | 008 | 090 | 0; ilk üç grubu “altı yüz yedi milyon sekiz bin doksan” diye okumuş, son rakamı okumamıştır.", "Ece bölükleri doğru ayırmış ama 070'i “yedi yüz”, 080'i “sekiz yüz” diye okumuştur; bölüğün başındaki 0'ı sona taşımıştır."], "t": "A: Mert 0'ları atlamamış, gruplamayı soldan yapmıştır. B ve D: Ece sayıyı on basamaklı okumuştur; milyarlar bölüğü doğrudur.", "d": "Doğru okuma için bölükler sağdan ayrılır ve her bölük kendi adıyla okunur. 070 bölüğü “yetmiş”, 700 bölüğü “yedi yüz” diye okunur; bölüğün başındaki 0 ile sonundaki 0 aynı değildir.", "ses": "b11"}, {"no": 12, "on": "<p>Elif'in elinde 15 boncuk ve on çubuklu boş bir abaküs vardır. Elif, boncukların hepsini çubuklara takarak on basamaklı bir sayı gösterecektir. Her çubuktaki boncuk sayısı o basamaktaki rakamı göstermektedir ve bir çubuğa en fazla 9 boncuk takılabilmektedir.</p>", "g": "<svg viewBox=\"0 0 690 182\" width=\"690\" height=\"182\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"16.0\" y=\"124.0\" width=\"342.0\" height=\"10.0\" rx=\"2\" fill=\"#d9c3a5\" stroke=\"#111111\" stroke-width=\"1.2\"/><line x1=\"34.0\" y1=\"8.0\" x2=\"34.0\" y2=\"124.0\" stroke=\"#111111\" stroke-width=\"2\"/><text x=\"34.0\" y=\"150.0\" font-family=\"Liberati n büyük</u> sayı kaçtır?", "sec": ["6 000 900 000", "9 000 510 000", "9 000 600 000", "9 600 000 000"], "secg": null, "c": "C", "a": ["“Milyon” söylenmeyeceği için milyonlar bölüğünün üç çubuğu boş kalır; “bin” söyleneceği için binler bölüğünde en az bir boncuk olmalıdır.", "Sayının en büyük olması için milyarlar çubuğuna en fazla boncuk konur: 9. Kalan 6 boncuk, boş kalması gerekmeyen en soldaki çubuğa, yani yüz binler çubuğuna konur.", "Sayı 9 000 600 000'dur: “dokuz milyar altı yüz bin”."], "t": "9 600 000 000: “milyon” söylenir; 9 000 510 000 ve 6 000 900 000: kurala uyar ama boncuklar en soldaki çubuklara yerleştirilmemiştir.", "d": "“Milyon” söylenmeyecekse milyonlar bölüğünün üç çubuğu boş kalmalıdır. En büyük sayı için boncukları boş kalması gerekmeyen en soldaki çubuklara, her çubuğa en fazla 9 olacak şekilde yerleştirin.", "ses": "b12"}, {"no": 13, "on": "<p>Bir bilgisayar oyununun puan tablosunda en yüksek puanı alan dört oyuncu, puanları büyükten küçüğe doğru sıralanarak gösterilmektedir. Ekrana vuran ışık nedeniyle ikinci sıradaki oyuncunun puanında iki rakam görünmemektedir; bu rakamlar ■ ve ▲ ile gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 690 226\" width=\"690\" height=\"226\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"110.0\" y=\"4.0\" width=\"470.0\" height=\"218.0\" rx=\"12\" fill=\"#1d2433\" stroke=\"#0b0f17\" stroke-width=\"3\"/><rect x=\"124.0\" y=\"16.0\" width=\"442.0\" height=\"190.0\" rx=\"6\" fill=\"#f8fbff\" stroke=\"none\" stroke-width=\"0\"/><text x=\"345.0\" y=\"40.0\" font-family=\"Liberation Sans\" font-size=\"15\" font-weight=\"800\" fill=\"#7048e8\" text-anchor=\"middle\">EN YÜKSEK PUANLAR</text><line x1=\"144.0\" y1=\"50.0\" x2=\"546.0\" y2=\"50.0\" stroke=\"#ced4da\" stroke-width=\"1.2\"/><text x=\"156.0\" y=\"80.0\" font-family=\"Liberation Sans\" font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"start\">1.</text><text x=\"196.0\" y=\"80.0\" font-family=\"Liberation Sans\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">Kaan</text><text x=\"540.0\" y=\"80.0\" font-family=\"Liberation Sans\" font-size=\"17\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">4 080 215 300</text><text x=\"156.0\" y=\"116.0\" font-family=\"Liberation Sans\" font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"start\">2.</text><text x=\"196.0\" y=\"116.0\" font-family=\"Liberation Sans\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">Duru</text><text x=\"540.0\" y=\"116.0\" font-family=\"Liberation Sans\" font-size=\"17\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">4 0■5 ▲12 090</text><text x=\"156.0\" y=\"152.0\" font-family=\"Liberation Sans\" font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"start\">3.</text><text x=\"196.0\" y=\"152.0\" font-family=\"Liberation Sans\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">Efe</text><text x=\"540.0\" y=\"152.0\" font-family=\"Liberation Sans\" font-size=\"17\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">4 007 990 000</text><text x=\"156.0\" y=\"188.0\" font-family=\"Liberation Sans\" font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"start\">4.</text><text x=\"196.0\" y=\"188.0\" font-family=\"Liberation Sans\" font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">Mina</text><text x=\"540.0\" y=\"188.0\" font-family=\"Liberation Sans\" font-size=\"17\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">3 999 999 999</text></svg>", "son": "<p>Tablodaki oyuncuların puanları birbirinden farklıdır.</p>", "k": "Buna göre, ■ yerine yazılabilecek kaç farklı rakam vardır?", "sec": ["6", "7", "8", "9"], "secg": null, "c": "B", "a": ["Duru'nun puanı, Kaan'ınkinden küçük ve Efe'ninkinden büyük olmalıdır: 4 007 990 000 &lt; 4 0■5 ▲12 090 &lt; 4 080 215 300.", "Üç sayı da on basamaklıdır; ilk iki basamakları 4 ve 0'dır. Karar on milyonlar basamağında (■) verilir. ■ = 8 olursa 4 085 … &gt; 4 080 … olur; ■ = 9 de olmaz.", "■ = 0 olursa 4 005 … &lt; 4 007 … olur. ■ 1'den 7'ye kadar olduğunda ▲ ne olursa olsun sıralama doğrudur: 7 farklı rakam."], "t": "8: ■ = 8'de Duru'nun puanının Kaan'ınkini geçtiği gözden kaçmış; 9: bütün rakamlar sayılıp yalnız 0 çıkarılmış; 6: ■ = 7 sınır sanılıp sayılmamış.", "d": "Sayılar basamak basamak karşılaştırılırken ilk farklı basamak kararı verir. ■'nin her değerini hem üstteki hem alttaki puanla karşılaştırın; sınırdaki rakamları (0, 7, 8) ayrıca denetleyin.", "ses": "b13"}, {"no": 14, "on": "<p>Bir okul gösterisinde sihirbaz, seyircilerden birinden 1'den 9'a kadar bir rakam seçmesini ve bu rakamı tahtaya on iki kez yan yana yazmasını istemiştir. Tahtadaki yazı aşağıda ▲ ile gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 690 170\" width=\"690\" height=\"170\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"130.0\" y=\"6.0\" width=\"430.0\" height=\"130.0\" rx=\"6\" fill=\"#2f4f3a\" stroke=\"#7a5a2b\" stroke-width=\"7\"/><text x=\"345.0\" y=\"82.0\" font-family=\"Liberation Sans\" font-size=\"30\" font-weight=\"700\" fill=\"#ffffff\" text-anchor=\"middle\">▲▲▲ ▲▲▲ ▲▲▲ ▲▲▲</text><text x=\"345.0\" y=\"160.0\" font-family=\"Liberation Sans\" font-size=\"13\" font-weight=\"700\" fill=\"#5c6370\" text-anchor=\"middle\">▲: seyircinin seçtiği rakam</text></svg>", "son": "<p>Sihirbaz seyirciye, tahtadaki sayının okunuşunun kaç sözcükten oluştuğunu sormuş; seyirci “15” cevabını vermiştir. Sihirbaz bu cevaptan seçilen rakamı bulmuştur.</p>", "k": "Buna göre, seyircinin seçtiği rakam kaçtır?", "sec": ["1", "3", "5", "9"], "secg": null, "c": "A", "a": ["Sayının dört bölüğü de ▲▲▲ biçimindedir. Okunuşta her bölük okunur ve üç bölük adı (milyar, milyon, bin) söylenir.", "▲ 2'den 9'a kadar bir rakamsa her bölük dört sözcükle okunur (ör. 555 → “beş yüz elli beş”): 4 x 4 + 3 = 19 sözcük.", "▲ = 1 iken bölük 111 → “yüz on bir”, üç sözcüktür (“bir yüz” denmez): 4 x 3 + 3 = 15 sözcük. Seçilen rakam 1'dir."], "t": "3, 5, 9: bu rakamlarla okunuş 19 sözcüktür; sözcük sayısının rakama göre değiştiği sanılmış.", "d": "Her bölük ▲▲▲ biçiminde okunur ve üç bölük adı söylenir. 1 rakamında bölük “yüz on bir” diye okunur, “bir yüz” denmez; bu yüzden 1'in okunuşu diğer rakamlardan bir sözcük kısadır.", "ses": "b14"}, {"no": 15, "on": "<p>Bir bilim şenliğindeki “Sayı Dedektifleri” standında üç öğrenci, çok basamaklı sayıların okunuşlarıyla ilgili birer önerme yazmıştır.</p>", "g": "<svg viewBox=\"0 0 690 86\" width=\"690\" height=\"86\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"150.0\" y=\"8.0\" width=\"390.0\" height=\"70.0\" rx=\"10\" fill=\"#efe9fb\" stroke=\"#7048e8\" stroke-width=\"2\"/><text x=\"345.0\" y=\"40.0\" font-family=\"Liberation Sans\" font-size=\"20\" font-weight=\"800\" fill=\"#7048e8\" text-anchor=\"middle\">SAYI DEDEKTİFLERİ</text><text x=\"345.0\" y=\"64.0\" font-family=\"Liberation Sans\" font-size=\"13\" font-weight=\"700\" fill=\"#5c6370\" text-anchor=\"middle\">Önermeyi bir sayıyla sınayın!</text><circle cx=\"580.0\" cy=\"42.0\" r=\"18.0\" fill=\"none\" stroke=\"#111111\" stroke-width=\"3\"/><line x1=\"593.0\" y1=\"55.0\" x2=\"610.0\" y2=\"72.0\" stroke=\"#111111\" stroke-width=\"5\"/></svg>", "son": "<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:2.6mm;margin:1mm 0 .5mm\"><div style=\"border:.45mm solid #1c5fbf;border-radius:3.2mm;padding:1.8mm 2.6mm;background:#fff\"><b style=\"color:#1c5fbf\">Ada:</b> “Okunuşunda “milyon” sözcüğü söylenen her sayı en az yedi basamaklıdır.”</div><div style=\"border:.45mm solid #d9480f;border-radius:3.2mm;padding:1.8mm 2.6mm;background:#fff\"><b style=\"color:#d9480f\">Kaan:</b> “Okunuşu dört sözcükten oluşan her sayı yedi basamaklıdır.”</div><div style=\"border:.45mm solid #2b8a3e;border-radius:3.2mm;padding:1.8mm 2.6mm;background:#fff\"><b style=\"color:#2b8a3e\">Ela:</b> “On basamaklı her sayının okunuşunda en az iki bölük adı söylenir.”</div></div>", "k": "Bu /* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
