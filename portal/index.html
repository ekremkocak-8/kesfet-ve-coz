<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Keşfet ve Çöz Portalı</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Düzen: üstte sabit uygulama çubuğu, solda (masaüstü) / altta (telefon) gezinme; içerik kartları optik form kâğıdı diliyle */
:root{
  --kagit:#f6f4ef; --yuzey:#ffffff; --murekkep:#1d2a3a; --soluk:#5e6b7a; --cizgi:#e2ded4;
  --optik:#c8414f; --optik2:#fbe9eb; --lacivert:#24466b; --lacivert2:#e6edf5;
  --iyi:#2f8a57; --iyi2:#e3f3ea; --orta:#c98a12; --orta2:#fbf1dc; --zayif:#c8414f; --zayif2:#fbe9eb;
  --f-baslik:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --f-govde:"Nunito Sans","Segoe UI",system-ui,sans-serif; --f-sayi:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --golge:0 1px 2px rgba(29,42,58,.06),0 4px 14px rgba(29,42,58,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--kagit:#151a21;--yuzey:#1d242e;--murekkep:#e8edf3;--soluk:#9aa6b4;--cizgi:#2e3845;--optik:#ef6b78;--optik2:#3a2026;--lacivert:#8db4e0;--lacivert2:#1f2f43;--iyi:#5cc38a;--iyi2:#1c3326;--orta:#e7b04a;--orta2:#382c14;--zayif:#ef6b78;--zayif2:#3a2026;--golge:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--kagit:#151a21;--yuzey:#1d242e;--murekkep:#e8edf3;--soluk:#9aa6b4;--cizgi:#2e3845;--optik:#ef6b78;--optik2:#3a2026;--lacivert:#8db4e0;--lacivert2:#1f2f43;--iyi:#5cc38a;--iyi2:#1c3326;--orta:#e7b04a;--orta2:#382c14;--zayif:#ef6b78;--zayif2:#3a2026;--golge:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--kagit);color:var(--murekkep);font:15px/1.5 var(--f-govde);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-baslik);text-wrap:balance;margin:0}
.sayi{font-family:var(--f-sayi);font-variant-numeric:tabular-nums}
.serit{background:var(--optik2);color:var(--optik);font-size:13px;font-weight:700;text-align:center;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* giriş */
.giris{min-height:calc(100vh - 40px);display:grid;place-items:center;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.giris-kart{width:min(440px,100%);background:var(--yuzey);border-radius:18px;box-shadow:var(--golge);padding:26px;display:flex;flex-direction:column;gap:14px}
.marka{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:12px;background:var(--lacivert);display:grid;grid-template-columns:repeat(2,12px);gap:5px;place-content:center}
.logo i{width:12px;height:12px;border-radius:50%;border:2px solid #fff}.logo i.d{background:#fff}
.marka h1{font-size:24px}.marka small{display:block;color:var(--soluk);font-size:13px}
.sekme{display:grid;grid-template-columns:1fr 1fr;background:var(--kagit);border-radius:12px;padding:4px}
.sekme button{border:0;background:transparent;border-radius:9px;padding:9px;font-weight:700;color:var(--soluk);cursor:pointer}
.sekme button[aria-selected="true"]{background:var(--yuzey);color:var(--murekkep);box-shadow:var(--golge)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--soluk)}
input,select,textarea{border:1.5px solid var(--cizgi);background:var(--yuzey);border-radius:10px;padding:10px 12px;font-size:15px;font-weight:600;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--lacivert);outline-offset:1px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--lacivert2);color:var(--lacivert)}
.btn svg{width:18px;height:18px;flex:none}
.btn.ana{background:var(--lacivert);color:var(--yuzey)}
.btn.kirmizi{background:var(--optik);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.not{font-size:13px;color:var(--soluk)}
/* uygulama */
.app{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 32px)}
.yan{background:var(--yuzey);border-right:1px solid var(--cizgi);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.yan .marka{padding:0 6px 14px}.yan .marka h1{font-size:18px}
.yan nav{display:flex;flex-direction:column;gap:2px}
.yan nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;font-weight:700;color:var(--soluk);cursor:pointer}
.yan nav button svg{width:18px;height:18px;flex:none}
.yan nav button[aria-current="page"]{background:var(--lacivert2);color:var(--lacivert)}
.kim{margin-top:auto;padding:12px;border-radius:12px;background:var(--kagit);font-size:13px}
.kim b{display:block;font-size:14px}
.icerik{padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.ic{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.baslik-satir{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.baslik-satir h2{font-size:26px}
.baslik-satir p{margin:2px 0 0;color:var(--soluk)}
.kart{background:var(--yuzey);border-radius:16px;box-shadow:var(--golge);padding:18px;min-width:0}
.kart h3{font-size:17px;margin-bottom:10px}
.izgara{display:grid;gap:14px}
.i2{grid-template-columns:repeat(2,minmax(0,1fr))}.i3{grid-template-columns:repeat(3,minmax(0,1fr))}.i4{grid-template-columns:repeat(4,minmax(0,1fr))}
.ozet b{font-family:var(--f-sayi);font-size:28px;display:block}
.ozet span{color:var(--soluk);font-size:13px}
.etiket{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.e-iyi{background:var(--iyi2);color:var(--iyi)}.e-orta{background:var(--orta2);color:var(--orta)}.e-zayif{background:var(--zayif2);color:var(--zayif)}.e-mavi{background:var(--lacivert2);color:var(--lacivert)}
.liste{display:flex;flex-direction:column}
.satir{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--cizgi);flex-wrap:wrap}
.satir:last-child{border-bottom:0}
.satir .ad{font-weight:700;flex:1;min-width:160px}
.satir .ad small{display:block;font-weight:600;color:var(--soluk)}
.tema{font-family:var(--f-baslik);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--soluk);margin:6px 0 -6px}
.fas{display:flex;flex-direction:column;gap:10px}
.fas .kod{font-family:var(--f-sayi);font-size:12px;color:var(--optik);font-weight:600}
.fas h4{margin:0;font-family:var(--f-baslik);font-size:16px;line-height:1.25}
.baglar{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.baglar a,.baglar button{border:1.5px solid var(--cizgi);background:var(--yuzey);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;color:var(--lacivert);text-decoration:none;cursor:pointer}
.baglar a:hover,.baglar button:hover{border-color:var(--lacivert)}
.yatay{overflow-x:auto}
/* optik form */
.optik{background:var(--yuzey);border-radius:16px;box-shadow:var(--golge);overflow:hidden}
.optik-ust{background:var(--optik);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.optik-ust h3{font-size:18px}
.optik-ust .sayi{font-size:20px}
.optik-gov{padding:16px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 36px;background:repeating-linear-gradient(0deg,transparent 0 41px,var(--optik2) 41px 42px)}
.osat{display:flex;align-items:center;gap:10px;height:42px}
.osat .no{width:26px;text-align:right;font-family:var(--f-sayi);font-weight:600;color:var(--optik)}
.balon{width:30px;height:30px;border-radius:50%;border:2px solid var(--optik);background:var(--yuzey);color:var(--optik);font-family:var(--f-sayi);font-weight:600;font-size:13px;cursor:pointer;padding:0;display:grid;place-items:center}
.balon[aria-pressed="true"]{background:var(--murekkep);border-color:var(--murekkep);color:var(--yuzey)}
.balon.dogru{background:var(--iyi);border-color:var(--iyi);color:#fff}
.balon.yanlis{background:var(--zayif);border-color:var(--zayif);color:#fff}
.balon.cevap{box-shadow:0 0 0 3px var(--iyi2);border-color:var(--iyi)}
.osat .durum{font-size:12px;font-weight:800;margin-left:auto}
.optik-alt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-top:1px solid var(--cizgi);flex-wrap:wrap}
.vid{border:0;background:var(--optik2);color:var(--optik);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:800;cursor:pointer}
/* karne */
.cubuk{height:12px;border-radius:999px;background:var(--kagit);overflow:hidden;flex:1;min-width:120px}
.cubuk i{display:block;height:100%;border-radius:999px}
.oneri{border-left:4px solid var(--orta);background:var(--orta2);border-radius:12px;padding:12px 14px}
.oneri b{display:block}
/* ısı haritası */
table{border-collapse:collapse;width:100%}
.isi th,.isi td{padding:6px 6px;text-align:center;font-size:12px;white-space:nowrap}
.isi th{font-family:var(--f-sayi);font-weight:600;color:var(--soluk);position:sticky;top:0;background:var(--yuzey)}
.isi td:first-child,.isi th:first-child{text-align:left;position:sticky;left:0;background:var(--yuzey);z-index:1;font-weight:700}
.hucre{display:block;border-radius:6px;padding:5px 0;font-family:var(--f-sayi);font-weight:600;min-width:42px}
.analiz-cubuk{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:10px}
.analiz-cubuk div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.analiz-cubuk i{display:block;width:100%;border-radius:6px 6px 0 0}
.analiz-cubuk span{font-family:var(--f-sayi);font-size:11px;color:var(--soluk)}
.mobil-nav{display:none}
dialog{border:0;border-radius:16px;padding:22px;max-width:min(520px,calc(100vw - 32px));background:var(--yuzey);color:var(--murekkep);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,25,35,.45)}
.ekran-yok{color:var(--soluk);text-align:center;padding:24px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}.yan{display:none}
  .mobil-nav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--yuzey);border-top:1px solid var(--cizgi);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));z-index:5;justify-content:space-around}
  .mobil-nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--soluk);padding:4px 6px;cursor:pointer}
  .mobil-nav button svg{width:20px;height:20px}
  .mobil-nav button[aria-current="page"]{color:var(--lacivert)}
  .icerik{padding-bottom:90px}
  .i3,.i4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){.i2,.i3,.i4{grid-template-columns:1fr}.optik-gov{grid-template-columns:1fr}.baslik-satir h2{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.oynat{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.soru-kart{display:flex;flex-direction:column;gap:14px}
.soru-ust{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.soru-ust b{font-family:var(--f-baslik);font-size:18px}
.resim-kap{background:#fff;border-radius:12px;border:1px solid var(--cizgi);padding:10px;display:flex;justify-content:center;min-height:120px}
.soru-resim{max-width:100%;height:auto;display:block}
.siklar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sik{height:54px;border-radius:14px;border:2px solid var(--optik);background:var(--yuzey);color:var(--optik);font:600 20px var(--f-sayi);cursor:pointer}
.sik[aria-pressed="true"]{background:var(--murekkep);border-color:var(--murekkep);color:var(--yuzey)}
.sik.dogru{background:var(--iyi);border-color:var(--iyi);color:#fff}.sik.yanlis{background:var(--zayif);border-color:var(--zayif);color:#fff}.sik.cevap{border-color:var(--iyi);color:var(--iyi);box-shadow:0 0 0 4px var(--iyi2)}
.sik:disabled{cursor:default}
.soru-alt{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cozum{border-left:4px solid var(--iyi);background:var(--iyi2);border-radius:12px;padding:12px 14px;line-height:1.6}
.cozum-metin{margin-top:6px}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;margin:0 2px;font-size:.92em}.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 2px}.nw{white-space:nowrap}
.yan-optik{position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column}
.optik-liste{overflow:auto;padding:8px 12px;background:repeating-linear-gradient(0deg,transparent 0 41px,var(--optik2) 41px 42px)}
.yan-optik .osat{gap:6px}.yan-optik .osat.su{background:var(--lacivert2);border-radius:10px}
.yan-optik .osat .no{border:0;background:transparent;cursor:pointer;padding:0;width:28px;font-family:var(--f-sayi);font-weight:600;color:var(--optik);text-align:right}
.yan-optik .balon{width:28px;height:28px;font-size:12px}
.no-serit{display:none;gap:6px;overflow-x:auto;padding:2px 0 6px}
.nob{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--cizgi);background:var(--yuzey);font:600 13px var(--f-sayi);cursor:pointer}.nob.su{outline:3px solid var(--optik);outline-offset:1px}
.etk-duzen{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.etk-liste{display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 160px);overflow:auto;position:sticky;top:12px}
.etk-sat{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--murekkep)}
.etk-sat.su{background:var(--lacivert2);color:var(--lacivert)}
.etk-no{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--kagit);font:600 12px var(--f-sayi)}.etk-no.ok{background:var(--iyi);color:#fff}
.etk-ana{display:flex;flex-direction:column;gap:10px;min-width:0}
.etk-ust{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.etk-cerceve{width:100%;height:max(560px,calc(100vh - 230px));border:1px solid var(--cizgi);border-radius:14px;background:#fff}
@media (max-width:860px){.oynat{grid-template-columns:1fr}.yan-optik{display:none}.no-serit{display:flex}.etk-duzen{grid-template-columns:1fr}.etk-liste{display:none}.sik{height:58px}.ipucu{display:none}}

.ic{max-width:1560px}
@media (min-width:861px){.oynat{grid-template-columns:minmax(0,1fr) 270px}}
.tahta{display:flex;flex-direction:column;gap:8px;min-width:0}
.tahta-cubuk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:sticky;top:0;z-index:3;background:var(--yuzey);padding:4px 0}
.tgrup,.trenk{display:flex;gap:4px;align-items:center;background:var(--kagit);border-radius:10px;padding:3px}
.trenk:empty{display:none}
.tdug{min-width:36px;height:34px;border:0;border-radius:8px;background:transparent;color:var(--murekkep);font:600 16px var(--f-govde);cursor:pointer;padding:0 8px}
.tdug[aria-pressed="true"]{background:var(--lacivert);color:#fff}
.tdug:disabled{opacity:.35;cursor:default}
.trenk-b{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--cizgi);cursor:pointer;padding:0}
.trenk-b[aria-pressed="true"]{box-shadow:0 0 0 2px var(--murekkep)}
.tkal{width:30px;height:26px;border:0;border-radius:6px;background:transparent;cursor:pointer;display:grid;place-items:center}
.tkal i{display:block;width:18px;background:var(--murekkep);border-radius:3px}.tkal[aria-pressed="true"]{background:var(--lacivert2)}
.tahta-kayar{overflow:auto;background:#fff;border:1px solid var(--cizgi);border-radius:12px;padding:10px;display:flex;justify-content:center;max-height:calc(100vh - 140px)}
.tahta.buyuk .tahta-kayar{max-height:none}
.tahta-sahne{position:relative;display:inline-block;line-height:0;touch-action:pan-y}
.tahta-sahne .soru-resim{max-width:none;display:block;user-select:none;-webkit-user-drag:none}
.tahta-tuval{position:absolute;inset:0;touch-action:none}
.calisma-alani[hidden]{display:none!important}.calisma-alani{display:block;background-color:#fff;background-image:linear-gradient(#e6ebf2 1px,transparent 1px),linear-gradient(90deg,#e6ebf2 1px,transparent 1px);background-size:24px 24px;border-top:2px dashed #c9d2de}
.perde{position:absolute;left:0;right:0;bottom:0;background:repeating-linear-gradient(45deg,#e9e4d8 0 14px,#e2dccd 14px 28px);border-top:3px solid var(--lacivert);z-index:2;line-height:1.4}
.perde-tutamak{position:absolute;top:-16px;left:50%;transform:translateX(-50%);background:var(--lacivert);color:#fff;border-radius:999px;padding:3px 14px;font:700 12px var(--f-govde);cursor:ns-resize;touch-action:none}
.filigran{position:absolute;inset:0;pointer-events:none;z-index:6;background-repeat:repeat;border-radius:inherit}
.okuyucu{position:fixed;inset:0;z-index:60;background:var(--kagit);overflow:auto;display:flex;flex-direction:column;gap:8px;padding:12px max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.okuyucu-ust{display:flex;justify-content:flex-end}
.ok-tablo{overflow-x:auto;margin-top:12px}
.ok-tablo table{border-collapse:separate;border-spacing:0 6px;width:100%;max-width:620px}
.ok-tablo th{text-align:left;font-size:12px;font-weight:700;color:var(--soluk);padding:0 8px 0 0;letter-spacing:.02em}
.ok-tablo td{padding:0 8px 0 0}
.ok-tablo td:nth-child(1),.ok-tablo td:nth-child(3){width:120px}.ok-tablo td:nth-child(4){width:40px}
.ok-tablo input{width:100%;min-width:0}
.ok-tablo input.hatali{border-color:#c0392b;box-shadow:0 0 0 2px rgba(192,57,43,.15)}
.ok-sil{width:34px;height:34px;border-radius:50%;border:1px solid var(--cizgi);background:var(--yuzey);color:var(--soluk);cursor:pointer;font-size:18px;line-height:1}
.ok-sil:hover{color:#c0392b;border-color:#c0392b}
.ok-alt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.ok-alt .not{margin:0;flex:1;min-width:200px}
.gizli{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.rol-tanit{display:flex;gap:12px;align-items:center;background:var(--kagit);border-radius:12px;padding:10px 12px}.rol-tanit .rol-ikon{font-size:26px;line-height:1}.rol-tanit div{display:flex;flex-direction:column;gap:2px}.rol-tanit b{font-size:16px;color:var(--lacivert)}.rol-tanit span{font-size:13px;color:var(--soluk)}
.uye-dug{border:1.5px dashed var(--optik);color:var(--optik);background:transparent;font-weight:700}
.bag-dug{background:transparent;padding:0;text-align:left}

@media (max-width:860px){.mobil-nav{overflow-x:auto;justify-content:flex-start;gap:2px;scrollbar-width:none;overscroll-behavior-x:contain}.mobil-nav::-webkit-scrollbar{display:none}.mobil-nav button{flex:1 0 66px;min-height:48px;white-space:nowrap}}

/* ====== görünüm 27.10.2026: renkli ama ciddi ====== */
:root{--r:#2f6fd6;--r2:#e8f0fc;--golge:0 1px 2px rgba(29,42,58,.05),0 6px 18px rgba(29,42,58,.07);--golge2:0 10px 30px rgba(29,42,58,.12)}
.r-mavi{--r:#2f6fd6;--r2:#e7effc}.r-mor{--r:#7048c9;--r2:#efe9fb}.r-yesil{--r:#23865a;--r2:#e2f4ea}.r-turuncu{--r:#d9741a;--r2:#fcefe2}
.r-kirmizi{--r:#c8414f;--r2:#fbe8ea}.r-turkuaz{--r:#16878f;--r2:#e0f3f4}.r-pembe{--r:#c13c7c;--r2:#fbe7f1}.r-gri{--r:#5e6b7a;--r2:#eceff3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) :is(.r-mavi,.r-mor,.r-yesil,.r-turuncu,.r-kirmizi,.r-turkuaz,.r-pembe,.r-gri){--r2:color-mix(in srgb,var(--r) 22%,#1d242e)}
  :root:not([data-theme="light"]) .r-mavi{--r:#7fa8ef}:root:not([data-theme="light"]) .r-mor{--r:#b39af0}:root:not([data-theme="light"]) .r-yesil{--r:#5cc38a}:root:not([data-theme="light"]) .r-turuncu{--r:#f0a35e}
  :root:not([data-theme="light"]) .r-kirmizi{--r:#ef7b87}:root:not([data-theme="light"]) .r-turkuaz{--r:#5ec6cc}:root:not([data-theme="light"]) .r-pembe{--r:#ec85b8}:root:not([data-theme="light"]) .r-gri{--r:#9aa6b4}}
body{background:radial-gradient(1200px 500px at 100% -10%,color-mix(in srgb,var(--lacivert2) 70%,transparent),transparent 60%),var(--kagit);background-attachment:fixed}
/* logo */
.logo-kap{display:inline-grid;place-items:center;background:#fff;border-radius:12px;padding:5px 8px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.logo-kap img{height:34px;width:auto;display:block}.logo-kap.buyuk img{height:56px}
/* kenar menü */
.yan{padding:18px 12px;gap:6px;background:color-mix(in srgb,var(--yuzey) 92%,transparent);backdrop-filter:blur(8px)}
.yan .marka{flex-direction:column;align-items:flex-start;gap:8px;padding:0 6px 16px;border-bottom:1px solid var(--cizgi);margin-bottom:8px}
.yan nav{gap:3px}
.yan nav button{padding:7px 10px;gap:11px;transition:background .15s,color .15s}
.nav-ikon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--r2);color:var(--r);flex:none;transition:transform .15s}
.yan nav button svg{width:18px;height:18px}
.yan nav button:hover{background:var(--kagit);color:var(--murekkep)}.yan nav button:hover .nav-ikon{transform:scale(1.06)}
.yan nav button[aria-current="page"]{background:var(--r2);color:var(--murekkep);box-shadow:inset 3px 0 0 var(--r)}
.yan nav button[aria-current="page"] .nav-ikon{background:var(--r);color:#fff}
.kim{border:1px solid var(--cizgi)}
/* başlık + sekmeler */
.baslik-satir h2{font-size:28px;letter-spacing:-.01em}
.baslik-satir h2::after{content:"";display:block;width:42px;height:4px;border-radius:4px;background:var(--r,var(--optik));margin-top:8px}
.alt-sekme{display:flex;gap:6px;flex-wrap:wrap;background:var(--yuzey);border:1px solid var(--cizgi);border-radius:14px;padding:5px;align-self:flex-start;max-width:100%;box-shadow:var(--golge)}
.alt-sekme button{border:0;background:transparent;border-radius:10px;padding:8px 14px;font-weight:700;color:var(--soluk);cursor:pointer;transition:background .15s,color .15s}
.alt-sekme button:hover{color:var(--murekkep);background:var(--kagit)}
.alt-sekme button[aria-selected="true"]{background:var(--r);color:#fff;box-shadow:0 3px 10px color-mix(in srgb,var(--r) 35%,transparent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .alt-sekme button[aria-selected="true"]{color:#141a22}}
.sekme button[aria-selected="true"]{color:var(--r,var(--murekkep))}
/* kartlar ve düğmeler */
.kart{border:1px solid color-mix(in srgb,var(--cizgi) 70%,transparent);box-shadow:var(--golge);border-radius:18px}
.btn{transition:transform .12s,box-shadow .15s,background .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(29,42,58,.12)}
.btn.ana{background:linear-gradient(135deg,var(--lacivert),color-mix(in srgb,var(--lacivert) 70%,#7048c9))}
.btn.beyaz{background:#fff;color:#24466b}.btn.seffaf{background:rgba(255,255,255,.16);color:#fff;border:1.5px solid rgba(255,255,255,.45)}
.ozet{position:relative;overflow:hidden;border-left:4px solid var(--r)}
.izgara>.ozet:nth-child(4n+1){--r:#2f6fd6}.izgara>.ozet:nth-child(4n+2){--r:#23865a}.izgara>.ozet:nth-child(4n+3){--r:#d9741a}.izgara>.ozet:nth-child(4n+4){--r:#7048c9}
.ozet b{color:var(--r)}
.etiket{font-weight:800}
/* öğrenci karşılama */
.karsila{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;border-radius:22px;padding:26px 28px;color:#fff;
  background:radial-gradient(500px 200px at 90% 10%,rgba(255,255,255,.18),transparent 60%),linear-gradient(125deg,#24466b 0%,#3b5bb5 55%,#7048c9 100%);box-shadow:var(--golge2);position:relative;overflow:hidden}
.karsila::after{content:"";position:absolute;right:-40px;bottom:-60px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.07)}
.karsila-yazi{flex:1;min-width:240px;position:relative;z-index:1}
.karsila-ust{font:600 12px var(--f-sayi);letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.karsila h2{font-size:32px;margin:6px 0 6px;color:#fff}.karsila p{margin:0 0 16px;opacity:.92;font-size:16px}
.karsila-dug{display:flex;gap:10px;flex-wrap:wrap}
.halka{position:relative;width:126px;height:126px;flex:none;color:#fff;z-index:1}
.halka svg{width:100%;height:100%}.halka>div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.halka b{font-size:26px;line-height:1}.halka span{font-size:12px;opacity:.85}
/* kitaplık */
.tema{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--r);font-weight:800;margin:10px 0 -4px}
.tema::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--r);flex:none}
.fas{box-shadow:inset 0 4px 0 var(--r),var(--golge);transition:transform .15s,box-shadow .15s}
.fas:hover{transform:translateY(-2px);box-shadow:inset 0 4px 0 var(--r),var(--golge2)}
.fas .kod{color:var(--r)}
.fas-ilerle{height:6px;border-radius:999px;background:var(--r2);overflow:hidden}.fas-ilerle i{display:block;height:100%;background:var(--r);border-radius:999px;min-width:3px}
.baglar button{transition:background .12s,border-color .12s,color .12s}
.baglar .b-konu{--b:#2f6fd6}.baglar .b-test{--b:#c8414f}.baglar .b-kesif{--b:#23865a}.baglar .b-pek{--b:#d9741a}.baglar .b-coz{--b:#7048c9}
.baglar :is(.b-konu,.b-test,.b-kesif,.b-pek,.b-coz){color:var(--b);border-color:color-mix(in srgb,var(--b) 30%,var(--cizgi))}
.baglar :is(.b-konu,.b-test,.b-kesif,.b-pek,.b-coz):hover{background:var(--b);color:#fff;border-color:var(--b)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .baglar :is(.b-konu,.b-test,.b-kesif,.b-pek,.b-coz){color:color-mix(in srgb,var(--b) 55%,#fff)}}
/* veli */
.cocuk-kim{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--r);color:#fff;font:800 20px var(--f-baslik);flex:none;box-shadow:0 4px 12px color-mix(in srgb,var(--r) 35%,transparent)}
/* giriş ekranı */
.giris-duzen{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);width:min(940px,100%);background:var(--yuzey);border-radius:24px;box-shadow:var(--golge2);overflow:hidden}
.giris-duzen .giris-kart{box-shadow:none;border-radius:0;width:100%;padding:30px}
.giris-tanit{background:radial-gradient(420px 220px at 85% 0%,rgba(255,255,255,.18),transparent 60%),linear-gradient(150deg,#24466b,#3b5bb5 55%,#7048c9);color:#fff;padding:34px 32px;display:flex;flex-direction:column;gap:18px}
.giris-tanit h2{font-size:30px;line-height:1.15;color:#fff}
.giris-tanit ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.giris-tanit li{padding-left:28px;position:relative;opacity:.95}
.giris-tanit li::before{content:"✓";position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:12px;font-weight:800}
.giris-tanit .logo-kap{align-self:flex-start}
.giris-geri{margin-top:auto;color:#fff;opacity:.85;font-weight:700;text-decoration:none}.giris-geri:hover{opacity:1;text-decoration:underline}
.giris-kart .marka .logo-kap{display:none}
.kart :is(input,select,textarea){max-width:100%}.izgara>*{min-width:0}.izgara>label>:is(select,input){width:100%}
.odul-kutu{margin-top:12px;border-radius:16px;padding:16px 18px;background:linear-gradient(135deg,#fff4d6,#ffe1ec);color:#5a3a00;border:1px solid #f3cf7a}
.odul-ust{display:flex;align-items:center;gap:10px;font-size:18px}.odul-ust span{font-size:30px;animation:zipla .8s ease 2}
.odul-kutu ul{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}.odul-kutu li{display:flex;justify-content:space-between;gap:10px}
@keyframes zipla{0%,100%{transform:none}40%{transform:translateY(-6px) rotate(-8deg)}70%{transform:translateY(0) rotate(6deg)}}
.kazan{margin-top:14px;padding-top:12px;border-top:1px dashed var(--cizgi)}

/* seçim listeleri */
.secim-kutu{border:1.5px solid var(--cizgi);border-radius:14px;background:var(--yuzey);margin-top:6px;overflow:hidden}
.secim-ust{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--cizgi);background:var(--kagit)}
.secim-ara{flex:1;min-width:140px;padding:7px 10px;font-size:14px}
.secim-say{font:600 12px var(--f-sayi);color:var(--soluk);margin-left:auto}
.secim-dug{border:0;background:transparent;color:var(--lacivert);font-weight:800;font-size:13px;cursor:pointer;padding:4px 6px;border-radius:8px}.secim-dug:hover{background:var(--lacivert2)}
.secim-kutu .secim-liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));align-items:start;gap:6px;padding:8px;margin:0;max-height:260px;overflow:auto;overscroll-behavior:contain}
.secim-kutu .secim{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border:1.5px solid var(--cizgi);border-radius:10px;cursor:pointer;line-height:1.3;overflow-wrap:anywhere;font-size:14px;transition:background .12s,border-color .12s}
.secim-kutu .secim:hover{border-color:var(--lacivert)}
.secim-kutu .secim input{margin:2px 0 0;flex:none;width:17px;height:17px;accent-color:var(--lacivert)}
.secim-kutu .secim:has(input:checked){background:var(--lacivert2);border-color:var(--lacivert);color:var(--murekkep)}
.secim-kutu .secim:has(input:disabled){opacity:.6;cursor:default}
@media (max-width:600px){.secim-kutu .secim-liste{grid-template-columns:1fr;max-height:300px}}
.nav-ikon{position:relative}
.rozet-say{position:absolute;top:-6px;right:-7px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--optik);color:#fff;font:800 11px/18px var(--f-govde);text-align:center;box-shadow:0 0 0 2px var(--yuzey);animation:nabiz 2s ease-in-out 3}
@keyframes nabiz{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@media (prefers-reduced-motion: reduce){.rozet-say{animation:none}}
.gundem-bas{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.gundem-bas h3{margin:0}
.gundem-liste{display:flex;flex-direction:column;gap:10px}
.duyuru{border:1.5px solid var(--cizgi);border-radius:14px;padding:12px 14px;cursor:pointer;background:var(--yuzey);transition:border-color .15s,box-shadow .15s}
.duyuru:hover{border-color:var(--r,var(--lacivert))}
.duyuru.yeni{border-color:color-mix(in srgb,#c13c7c 45%,var(--cizgi));background:color-mix(in srgb,#c13c7c 5%,var(--yuzey))}
.duyuru.onemli{box-shadow:inset 4px 0 0 var(--optik)}
.duyuru-ust{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}.duyuru-kim{font-weight:800;color:var(--murekkep)}
.duyuru h4{margin:6px 0 4px;font:700 16px var(--f-baslik)}
.duyuru-metin{margin:0;color:var(--soluk);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.duyuru-metin.acik{display:block;color:var(--murekkep)}
.gundem-canli{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1.5px solid var(--cizgi);border-radius:14px;padding:10px 14px}
.gundem-canli>div{flex:1;min-width:160px;display:flex;flex-direction:column}.gundem-ikon{font-size:24px}

/* sadeleştirme */
.ipucu{font-size:13px;color:var(--soluk)}
.ipucu summary{cursor:pointer;font-weight:700;color:var(--lacivert);list-style:none;display:inline-flex;gap:4px;align-items:center;padding:2px 0}
.ipucu summary::-webkit-details-marker{display:none}
.ipucu[open] summary{margin-bottom:4px}.ipucu p{margin:0;background:var(--kagit);border-radius:10px;padding:10px 12px;line-height:1.5}
.baslik-satir .ipucu{margin-top:2px}
.katlanir{padding:0;overflow:hidden}
.katla-bas{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;background:transparent;padding:16px 18px;font:700 17px var(--f-baslik);color:var(--murekkep);cursor:pointer;text-align:left}
.katla-bas:hover{background:var(--kagit)}
.katla-ok{width:20px;height:20px;flex-shrink:0;transition:transform .2s;color:var(--soluk)}
.katlanir:not(.kapali) .katla-ok{transform:rotate(180deg)}
.katla-govde{padding:0 18px 18px;display:flex;flex-direction:column;gap:10px}
.katlanir.kapali .katla-govde{display:none}
.form-kart.kapali{background:transparent;box-shadow:none;border:0}
.form-kart.kapali .katla-bas{width:auto;display:inline-flex;background:var(--r,var(--lacivert));color:#fff;border-radius:12px;padding:11px 18px;font:700 15px var(--f-govde);box-shadow:0 4px 12px color-mix(in srgb,var(--r,var(--lacivert)) 30%,transparent)}
.form-kart.kapali .katla-ok{display:none}
.form-kart:not(.kapali) .katla-bas{color:var(--r,var(--lacivert))}
.bilgi-serit{padding:2px 2px}
.bos-kart{padding-top:12px;padding-bottom:12px}.bos-kart .ekran-yok{padding:6px 0;text-align:left}
.satir-ac{padding:6px 12px;font-size:18px;line-height:1;background:transparent;border:1.5px solid var(--cizgi);color:var(--soluk)}
.satir-ac[aria-expanded="true"]{background:var(--lacivert2);color:var(--lacivert);border-color:var(--lacivert)}
.satir-eylem{display:none;width:100%;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding-top:4px}
.satir.acik .satir-eylem{display:flex}
.tema{cursor:pointer;user-select:none;padding:8px 4px;border-radius:10px}.tema:hover{background:var(--r2)}
.tema-ok{display:inline-block;transition:transform .2s;font-size:18px;line-height:1}.tema.kapali .tema-ok{transform:rotate(-90deg)}
.tema::before{display:none}
.izgara.gizli{display:none}
.baglar .paket-dug{order:9;flex-basis:100%;border:0!important;background:transparent!important;padding:2px 0;text-align:left;font-size:12px;color:var(--optik)!important;text-decoration:underline;text-underline-offset:3px}
.baglar .paket-dug:hover{color:var(--murekkep)!important}
/* giriş animasyonu */
@keyframes yukari{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ic>*{animation:yukari .32s ease both}.ic>*:nth-child(2){animation-delay:.04s}.ic>*:nth-child(3){animation-delay:.08s}.ic>*:nth-child(4){animation-delay:.12s}.ic>*:nth-child(n+5){animation-delay:.16s}
@media (prefers-reduced-motion: reduce){.ic>*{animation:none}.btn,.fas,.nav-ikon{transition:none}}
@media (max-width:600px){.karsila .halka{display:none}}
@media (max-width:860px){
  .giris-duzen{grid-template-columns:1fr}.giris-tanit{padding:22px}.giris-tanit ul,.giris-tanit h2{display:none}.giris-tanit{flex-direction:row;align-items:center;justify-content:space-between}.giris-geri{margin-top:0}
  .giris-kart .marka{display:none}
  .mobil-nav button .nav-ikon{width:30px;height:26px;border-radius:9px;background:transparent;color:var(--soluk)}
  .mobil-nav button[aria-current="page"] .nav-ikon{background:var(--r2);color:var(--r)}
  .mobil-nav button[aria-current="page"]{color:var(--murekkep)}
  .karsila{padding:20px}.karsila h2{font-size:26px}.halka{width:96px;height:96px}.halka b{font-size:20px}
  .baslik-satir h2{font-size:24px}
  .izgara.i4:has(>.ozet){grid-template-columns:repeat(2,minmax(0,1fr))}.ozet{padding:14px}.ozet b{font-size:24px}
  .alt-sekme{overflow-x:auto;flex-wrap:nowrap;width:100%}.alt-sekme button{white-space:nowrap}
}
/* ---- çalışma programı ---- */
.tur-secim{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tur-dug{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--cizgi);background:var(--yuzey);color:var(--murekkep);cursor:pointer;font:inherit}
.tur-dug b{font:700 16px var(--f-baslik)}.tur-dug small{color:var(--soluk)}
.tur-dug:hover{border-color:var(--r,var(--lacivert))}
.tur-dug.secili{border-color:var(--r,var(--lacivert));background:var(--r2,var(--lacivert2));box-shadow:0 0 0 2px color-mix(in srgb,var(--r,var(--lacivert)) 25%,transparent)}
.sekme-kucuk{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--kagit);margin-bottom:10px;flex-wrap:wrap}
.sekme-kucuk button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font:600 14px var(--f-govde);color:var(--soluk);cursor:pointer}
.sekme-kucuk button.secili{background:var(--yuzey);color:var(--murekkep);box-shadow:var(--golge)}
.gun-izgara{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.gun-izgara label{font-size:13px}
.onizleme{border:1.5px dashed color-mix(in srgb,var(--r,var(--lacivert)) 45%,transparent);background:var(--r2,var(--lacivert2))}
.onizleme-ust{display:flex;gap:12px;align-items:flex-start}.onizleme-ust p{margin:2px 0 0}
.rob{font-size:28px;line-height:1}
.onizleme-not{margin:10px 0 0;padding-left:20px;color:var(--soluk);font-size:14px;display:flex;flex-direction:column;gap:4px}
.onizleme-ilk{margin-top:10px;display:flex;flex-direction:column;gap:3px;font-size:13px}.onizleme-ilk small{color:var(--soluk);font-weight:700}
.plan-bos{text-align:center;align-items:center}.plan-bos .tur-secim{width:100%;margin-top:6px}
.plan-cipler{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.plan-cip{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;padding:9px 14px;border-radius:12px;border:1.5px solid var(--cizgi);background:var(--yuzey);color:var(--murekkep);cursor:pointer;font:inherit;text-align:left}
.plan-cip small{color:var(--soluk)}.plan-cip[aria-selected="true"]{border-color:var(--r,var(--lacivert));background:var(--r2,var(--lacivert2))}
.plan-gorunum{display:flex;flex-direction:column;gap:14px}

async function veliKayit(ad, tel, email, password, kvkk, sozl) {

  let r = await sb.auth.signUp({ email: email.trim(), password });
  if (r.error) { if (/already|registered|exists/i.test(r.error.message)) throw new Error("Bu e-postayla zaten bir hesap var. “Hesabım var” deyip giriş yapın."); throw r.error; }
  if (!r.data.session) throw new Error("E-posta onayı açık görünüyor. Yöneticiye haber verin.");
  r = await sb.rpc("veli_ol", { p_ad: ad, p_telefon: tel, p_kvkk: !!kvkk, p_sozlesme: !!sozl });
  if (r.error) throw new Error(/veli_ol|PGRST20[25]|could not find/i.test(r.error.message || "") ? "Veli üyeliği henüz açılmadı (Supabase'te 17_veli.sql çalıştırılmalı)." : hataMetni(r.error));

function belgeDersListesi() { const id = "belge-dersler"; if (!document.getElementById(id)) document.body.append(h("datalist", { id }, ...BELGE_DERS.map(d => h("option", { value: d[0] })))); return id; }

function belgeYukleKarti(L, yenile) {

// online tahta: yazılı ve soru PDF'leri

  const fs = h("select", { "aria-label": "PDF", class: "ot-sec" }); let son = null, og = null;

  const b0 = depo.al("od_belge", null); if (L.some(b => b.id === b0)) fs.value = b0;
  const alan = h("div");

    let adres; try { adres = await belgeAdres(b); } catch (e) { alan.append(h("div", { class: "kart" }, h("p", { class: "ekran-yok" }, hataMetni(e)))); return; }
