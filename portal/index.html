<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Keşfet ve Çöz Portalı</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Düzen: üstte sabit uygulama çubuğu, solda (masaüstü) / altta (telefon) gezinme; içerik kartları optik form kâğıdı diliyle */
:root{
  --kagit:#f6f4ef; --yuzey:#ffffff; --murekkep:#1d2a3a; --soluk:#5e6b7a; --cizgi:#e2ded4;
  --optik:#c8414f; --optik2:#fbe9eb; --lacivert:#24466b; --lacivert2:#e6edf5;
  --iyi:#2f8a57; --iyi2:#e3f3ea; --orta:#c98a12; --orta2:#fbf1dc; --zayif:#c8414f; --zayif2:#fbe9eb;
  --f-baslik:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --f-govde:"Nunito Sans","Segoe UI",system-ui,sans-serif; --f-sayi:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --golge:0 1px 2px rgba(29,42,58,.06),0 4px 14px rgba(29,42,58,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--kagit:#151a21;--yuzey:#1d242e;--murekkep:#e8edf3;--soluk:#9aa6b4;--cizgi:#2e3845;--optik:#ef6b78;--optik2:#3a2026;--lacivert:#8db4e0;--lacivert2:#1f2f43;--iyi:#5cc38a;--iyi2:#1c3326;--orta:#e7b04a;--orta2:#382c14;--zayif:#ef6b78;--zayif2:#3a2026;--golge:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--kagit:#151a21;--yuzey:#1d242e;--murekkep:#e8edf3;--soluk:#9aa6b4;--cizgi:#2e3845;--optik:#ef6b78;--optik2:#3a2026;--lacivert:#8db4e0;--lacivert2:#1f2f43;--iyi:#5cc38a;--iyi2:#1c3326;--orta:#e7b04a;--orta2:#382c14;--zayif:#ef6b78;--zayif2:#3a2026;--golge:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--kagit);color:var(--murekkep);font:15px/1.5 var(--f-govde);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-baslik);text-wrap:balance;margin:0}
.sayi{font-family:var(--f-sayi);font-variant-numeric:tabular-nums}
.serit{background:var(--optik2);color:var(--optik);font-size:13px;font-weight:700;text-align:center;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* giriş */
.giris{min-height:calc(100vh - 40px);display:grid;place-items:center;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.giris-kart{width:min(440px,100%);background:var(--yuzey);border-radius:18px;box-shadow:var(--golge);padding:26px;display:flex;flex-direction:column;gap:14px}
.marka{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:12px;background:var(--lacivert);display:grid;grid-template-columns:repeat(2,12px);gap:5px;place-content:center}
.logo i{width:12px;height:12px;border-radius:50%;border:2px solid #fff}.logo i.d{background:#fff}
.marka h1{font-size:24px}.marka small{display:block;color:var(--soluk);font-size:13px}
.sekme{display:grid;grid-template-columns:1fr 1fr;background:var(--kagit);border-radius:12px;padding:4px}
.sekme button{border:0;background:transparent;border-radius:9px;padding:9px;font-weight:700;color:var(--soluk);cursor:pointer}
.sekme button[aria-selected="true"]{background:var(--yuzey);color:var(--murekkep);box-shadow:var(--golge)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--soluk)}
input,select,textarea{border:1.5px solid var(--cizgi);background:var(--yuzey);border-radius:10px;padding:10px 12px;font-size:15px;font-weight:600;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--lacivert);outline-offset:1px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--lacivert2);color:var(--lacivert)}
.btn svg{width:18px;height:18px;flex:none}
.btn.ana{background:var(--lacivert);color:var(--yuzey)}
.btn.kirmizi{background:var(--optik);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.not{font-size:13px;color:var(--soluk)}
/* uygulama */
.app{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 32px)}
.yan{background:var(--yuzey);border-right:1px solid var(--cizgi);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.yan .marka{padding:0 6px 14px}.yan .marka h1{font-size:18px}
.yan nav{display:flex;flex-direction:column;gap:2px}
.yan nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;font-weight:700;color:var(--soluk);cursor:pointer}
.yan nav button svg{width:18px;height:18px;flex:none}
.yan nav button[aria-current="page"]{background:var(--lacivert2);color:var(--lacivert)}
.kim{margin-top:auto;padding:12px;border-radius:12px;background:var(--kagit);font-size:13px}
.kim b{display:block;font-size:14px}
.icerik{padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.ic{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.baslik-satir{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.baslik-satir h2{font-size:26px}
.baslik-satir p{margin:2px 0 0;color:var(--soluk)}
.kart{background:var(--yuzey);border-radius:16px;box-shadow:var(--golge);padding:18px;min-width:0}
.kart h3{font-size:17px;margin-bottom:10px}
.izgara{display:grid;gap:14px}
.i2{grid-template-columns:repeat(2,minmax(0,1fr))}.i3{grid-template-columns:repeat(3,minmax(0,1fr))}.i4{grid-template-columns:repeat(4,minmax(0,1fr))}
.ozet b{font-family:var(--f-sayi);font-size:28px;display:block}
.ozet span{color:var(--soluk);font-size:13px}
.etiket{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.e-iyi{background:var(--iyi2);color:var(--iyi)}.e-orta{background:var(--orta2);color:var(--orta)}.e-zayif{background:var(--zayif2);color:var(--zayif)}.e-mavi{background:var(--lacivert2);color:var(--lacivert)}
.liste{display:flex;flex-direction:column}
.satir{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--cizgi);flex-wrap:wrap}
.satir:last-child{border-bottom:0}
.satir .ad{font-weight:700;flex:1;min-width:160px}
.satir .ad small{display:block;font-weight:600;color:var(--soluk)}
.tema{font-family:var(--f-baslik);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--soluk);margin:6px 0 -6px}
.fas{display:flex;flex-direction:column;gap:10px}
.fas .kod{font-family:var(--f-sayi);font-size:12px;color:var(--optik);font-weight:600}
.fas h4{margin:0;font-family:var(--f-baslik);font-size:16px;line-height:1.25}
.baglar{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.baglar a,.baglar button{border:1.5px solid var(--cizgi);background:var(--yuzey);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;color:var(--lacivert);text-decoration:none;cursor:pointer}
.baglar a:hover,.baglar button:hover{border-color:var(--lacivert)}
.yatay{overflow-x:auto}
/* optik form */
.optik{background:var(--yuzey);border-radius:16px;box-shadow:var(--golge);overflow:hidden}
.optik-ust{background:var(--optik);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.optik-ust h3{font-size:18px}
.optik-ust .sayi{font-size:20px}
.optik-gov{padding:16px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 36px;background:repeating-linear-gradient(0deg,transparent 0 41px,var(--optik2) 41px 42px)}
.osat{display:flex;align-items:center;gap:10px;height:42px}
.osat .no{width:26px;text-align:right;font-family:var(--f-sayi);font-weight:600;color:var(--optik)}
.balon{width:30px;height:30px;border-radius:50%;border:2px solid var(--optik);background:var(--yuzey);color:var(--optik);font-family:var(--f-sayi);font-weight:600;font-size:13px;cursor:pointer;padding:0;display:grid;place-items:center}
.balon[aria-pressed="true"]{background:var(--murekkep);border-color:var(--murekkep);color:var(--yuzey)}
.balon.dogru{background:var(--iyi);border-color:var(--iyi);color:#fff}
.balon.yanlis{background:var(--zayif);border-color:var(--zayif);color:#fff}
.balon.cevap{box-shadow:0 0 0 3px var(--iyi2);border-color:var(--iyi)}
.osat .durum{font-size:12px;font-weight:800;margin-left:auto}
.optik-alt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-top:1px solid var(--cizgi);flex-wrap:wrap}
.vid{border:0;background:var(--optik2);color:var(--optik);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:800;cursor:pointer}
/* karne */
.cubuk{height:12px;border-radius:999px;background:var(--kagit);overflow:hidden;flex:1;min-width:120px}
.cubuk i{display:block;height:100%;border-radius:999px}
.oneri{border-left:4px solid var(--orta);background:var(--orta2);border-radius:12px;padding:12px 14px}
.oneri b{display:block}
/* ısı haritası */
table{border-collapse:collapse;width:100%}
.isi th,.isi td{padding:6px 6px;text-align:center;font-size:12px;white-space:nowrap}
.isi th{font-family:var(--f-sayi);font-weight:600;color:var(--soluk);position:sticky;top:0;background:var(--yuzey)}
.isi td:first-child,.isi th:first-child{text-align:left;position:sticky;left:0;background:var(--yuzey);z-index:1;font-weight:700}
.hucre{display:block;border-radius:6px;padding:5px 0;font-family:var(--f-sayi);font-weight:600;min-width:42px}
.analiz-cubuk{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:10px}
.analiz-cubuk div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.analiz-cubuk i{display:block;width:100%;border-radius:6px 6px 0 0}
.analiz-cubuk span{font-family:var(--f-sayi);font-size:11px;color:var(--soluk)}
.mobil-nav{display:none}
dialog{border:0;border-radius:16px;padding:22px;max-width:min(520px,calc(100vw - 32px));background:var(--yuzey);color:var(--murekkep);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,25,35,.45)}
.ekran-yok{color:var(--soluk);text-align:center;padding:24px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}.yan{display:none}
  .mobil-nav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--yuzey);border-top:1px solid var(--cizgi);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));z-index:5;justify-content:space-around}
  .mobil-nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--soluk);padding:4px 6px;cursor:pointer}
  .mobil-nav button svg{width:20px;height:20px}
  .mobil-nav button[aria-current="page"]{color:var(--lacivert)}
  .icerik{padding-bottom:90px}
  .i3,.i4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){.i2,.i3,.i4{grid-template-columns:1fr}.optik-gov{grid-template-columns:1fr}.baslik-satir h2{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

async function ogrGiris(kod, no, pin) {

  if (!kod || no === "NaN") throw new Error("Sınıf kodunu ve okul numaranı yaz.");
  if (!/^\d{4}$/.test(pin)) throw new Error("Şifre 4 rakamdan oluşur.");
  depo.yaz("sinif_kodu", kod); depo.yaz("numara", no);
  const email = `${kod.toLowerCase()}.${no}@${ALAN}`, password = `kvc-${kod}-${pin}`;
  const g = await sb.auth.signInWithPassword({ email, password });
  if (!g.error) { sb.rpc("giris_yazildi").then(() => {}); return; }
  if (!/invalid login/i.test(g.error.message)) throw g.error;
  // ilk giriş: hesap açılır, sonra öğretmenin açtığı kayda bağlanır
  const r = await sb.auth.signUp({ email, password });
  if (r.error) { if (/already|registered|exists/i.test(r.error.message)) throw new Error("Sınıf kodu, numara ya da şifre yanlış."); throw r.error; }
  if (!r.data.session) throw new Error("Portal kurulumu tamamlanmamış (e-posta onayı açık). Öğretmenine haber ver.");
  const b = await sb.rpc("ogrenci_bagla", { p_sinif_kodu: kod, p_numara: +no, p_pin: pin });
  if (b.error || b.data?.hata) { await sb.auth.signOut({ scope: "local" }).catch(() => {}); throw new Error(b.data?.hata || hataMetni(b.error)); }
}
