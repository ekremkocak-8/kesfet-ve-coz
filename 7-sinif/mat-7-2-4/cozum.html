<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* ANA_KURALLAR §4.y-3: Etkinliklerde bütün kesirler kesir çizgisiyle (alt alta pay/payda) gösterilir. Düz yazılmış a/b biçimleri otomatik dönüştürülür. */
(function(){
  if (window.__kesirCizgi) return; window.__kesirCizgi = 1;
  const RX = /(^|[^\w\/.,:%])([−-])?(?:(\d+) )?(\d{1,4})\/(\d{1,4})(?![\w\/.,]\d|\w)/g;
  const ATLA = "script,style,svg,textarea,input,select,code,.ilr,.frac,[data-duz]";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function donustur(kok){
    if (!kok || !kok.nodeType) return;
    if (kok.nodeType === 3) kok = kok.parentElement;
    if (!kok || (kok.closest && kok.closest(ATLA))) return;
    const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      if (!/\d\/\d/.test(t.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = t.parentElement; if (!p || p.closest(ATLA)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const L = []; let t; while ((t = w.nextNode())) L.push(t);
    L.forEach(t => {
      let deg = false;
      const h = esc(t.nodeValue).replace(RX, (m, a, s, tam, p, q) => { deg = true;
        return a + (s ? "−" : "") + (tam ? tam + " " : "") + '<span class="frac"><span>' + p + "</span><span>" + q + "</span></span>"; });
      if (!deg) return;
      const k = document.createElement("span"); k.innerHTML = h; t.replaceWith(...k.childNodes);
    });
  }
  let bekleyen = new Set(), plan = 0;
  const calis = () => { plan = 0; const b = bekleyen; bekleyen = new Set(); b.forEach(donustur); };
  const gozcu = new MutationObserver(ms => { ms.forEach(m => {
      if (m.type === "characterData") bekleyen.add(m.target); else m.addedNodes.forEach(n => bekleyen.add(n)); });
    if (!plan) plan = requestAnimationFrame(calis); });
  const bas = () => { donustur(document.body); gozcu.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bas); else bas();
  const st = document.createElement("style");
  st.textContent = ".frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}.frac>span{display:block;text-align:center;padding:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor}";
  document.head.appendChild(st);
})();

/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {

    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });

    async function dagit(k) {

      const kolon = Math.min(k, 6), satirK = Math.ceil(k / kolon), gw = kolon * 14 + 16, gh = satirK * 14 + 26;

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */
  function ATLA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Sonuç"] });
    let k = o.k, L = o.son; const W = 660, sol = 22, sag = 22, sk = (W - sol - sag) / L;

    const bA = dug("▶ Oynat"), bB = dug("+1 " + (o.adimAd || "adım"), "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bB, bS);
    let kA = null;
    if (o.kSec) { kA = adimci(o.kEtiket || "Adım:", 2, Math.floor(L / 2), k, v => { k = v; sifirla(); }); kut.prepend(kA.w); }

    const bT = dug(o.testDugme || "Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test);
    const ti = test.querySelector("input");
    function taban() {
      let sv = `<line x1="${sol}" y1="62" x2="${sol + L * sk}" y2="62" class="cn-ek"/>`;

      for (let v = 0; v <= L; v += adimT) sv += `<line x1="${sol + v * sk}" y1="${v % et ? 58 : 54}" x2="${sol + v * sk}" y2="66" class="cn-ek"/>` + (v % et ? "" : `<text x="${sol + v * sk}" y="82" text-anchor="middle" class="cn-et">${o.etYaz ? o.etYaz(v) : v}</text>`);
      sv += `<line x1="${sol + L * sk}" y1="30" x2="${sol + L * sk}" y2="70" class="cn-sinir"/><text x="${sol + L * sk}" y="24" text-anchor="end" class="cn-et">${o.sonEt || L}</text>`;

    }

      izle.forEach((v, i) => {

        sv += `<path d="M${x1} 62 Q${(x1 + x2) / 2} ${yy} ${x2} 62" class="cn-yay"/><circle cx="${x2}" cy="62" r="4.5" class="${o.renk ? o.renk(v, i + 1) : "cn-o"}"/>`;
        if (izle.length <= 14 || i === izle.length - 1 || i % Math.ceil(izle.length / 10) === 0) sv += `<text x="${x2}" y="${98}" text-anchor="middle" class="cn-et2">${v}</text>`;
      });

      const son = izle.length ? izle[izle.length - 1] : 0, ix = sol + son * sk;
      sv += `<text x="${ix}" y="50" text-anchor="middle" class="cn-kis">${o.simge || "●"}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W} 104" role="img" aria-label="${k} birimlik adımlarla ilerleme">${sv}</svg>`;
    }
    const ileri = () => {
      const v = (n + 1) * k;
      if (v > L) { durdur(); s.dur.innerHTML = `<span class="kotu">■</span> Sonraki ${o.adimAd || "adım"} ${k} ${x} ${n + 1} = <b>${v}</b> olurdu; bu ${E(L,"den")} büyük. ${o.bitti ? o.bitti(n, k, L) : `Toplam ${n} ${o.adimAd || "adım"}; son değer ${n * k}.`}`; if (!izle.length) ciz(); return false; }
      n++; izle.push(v); ciz(); s.dur.innerHTML = o.durum ? o.durum(n, v, k) : `${n}. ${o.adimAd || "adım"}: ${k} ${x} ${n} = <b>${v}</b>`; return true;

      s.dur.innerHTML = m; s.yaz("t" + v, [v, r === 0 ? (ic ? `${k} ${x} ${b} ✔` : `${k} ${x} ${b} (sınır dışı)`) : `kalan ${r} ✘`], r === 0 && ic);

  }

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || [o.kAd || "k", "Boyanan", "En büyük"] });
    let k = o.k || 2, son = o.son;
    const kut = h("div", "cn-satir");

    if (o.sonSec) { const sw = h("div", "cn-hazir"); o.sonSec.forEach(v => { const b = dug(v + " gün", "ghost"); b.onclick = () => { son = v; kur(); temiz(); }; sw.appendChild(b); }); s.den.append(kut, sw); }

      const g = h("div", "cn-izg" + (o.takvim ? " cn-tak" : "")); g.style.gridTemplateColumns = `repeat(${o.sutunSay},1fr)`;

    function temiz() { hucre.forEach(c => c && c.classList.remove("on", "yeni")); s.dur.innerHTML = o.ilk || "Sayıyı seçip Boya düğmesine basın."; }

      }

      s.yaz(k + ":" + son, o.satir ? o.satir(k, say, enb, son) : [k, say, enb], o.iyi ? o.iyi(k, say, enb, son) : null);
      calis = false; bB.disabled = false;

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */
  function ASANSOR(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Açık asansörler", "Gidilen kat", "Gidilemeyen kat"] });
    const ac = o.asansor.map(() => false);
    const kut = h("div", "cn-satir"); const bt = o.asansor.map((a, i) => { const b = dug(a.ad, "ghost"); b.style.setProperty("--ac", a.renk); b.setAttribute("aria-pressed", "false"); b.onclick = () => { ac[i] = !ac[i]; b.setAttribute("aria-pressed", ac[i]); ciz(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    function ciz() {
      let sv = ""; const H = o.kat * 17 + 40; let git = 0, gitme = [];
      for (let f = o.kat; f >= 0; f--) {

        sv += `<rect x="60" y="${y}" width="150" height="15" rx="2" class="${f === 0 ? "cn-zem" : herhangi ? "cn-katon" : (ac.some(Boolean) ? "cn-katoff" : "cn-kat")}"/><text x="52" y="${y + 12}" text-anchor="end" class="cn-et">${f === 0 ? "Z" : f}</text>`;
        o.asansor.forEach((a, i) => { if (dur[i]) sv += `<circle cx="${230 + i * 22}" cy="${y + 7.5}" r="6" fill="${a.renk}"/>`; });
      }
      s.sah.innerHTML = `<svg viewBox="0 0 300 ${H}" style="max-height:440px" role="img" aria-label="${o.kat} katlı bina">${sv}</svg>`;
      const acik = o.asansor.filter((a, i) => ac[i]).map(a => a.ad);

      s.yaz(acik.join("+"), [acik.join(" + "), git, gitme.length], null);

    ciz();
  }

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */
  function SAAT(el, o) {

      let onc = null, snr = null;
      for (let m = bas; m <= bit + ara; m += ara) { if (m <= var_) onc = m; if (m >= var_ && snr == null) snr = m; if (m <= bit) sv += `<text x="${20 + (m - bas) * sk}" y="40" text-anchor="middle" class="cn-bus">🚌</text>`; }

      if (snr != null && snr <= bit + ara) { const sx = 20 + (Math.min(snr, bit) - bas) * sk; sv += `<path d="M${vx} 56 L${sx} 56" class="cn-bek"/>`; }

      const gec = var_ - bas;
      s.dur.innerHTML = `${o.kisi} durağa ${saDa(var_)} geliyor: ilk seferden <b>${gec} dakika</b> sonra. Seferler ${E(ara,"in")} katı olan dakikalarda: ${ara} ${x} ${Math.floor(gec / ara)} = ${Math.floor(gec / ara) * ara}` + (gec % ara ? `, ${ara} ${x} ${Math.floor(gec / ara) + 1} = ${(Math.floor(gec / ara) + 1) * ara}. Sonraki otobüs ${saDa(snr)}; bekleme <b>${snr - var_} dakika</b>.` : `. Tam sefer saatinde geldi; bekleme <b>0 dakika</b>.`);
      s.yaz(ara + ":" + var_, [ara + " dk", sa(var_), sa(onc), sa(snr), (snr - var_) + " dk"], null);
    }
    ciz();
  }

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Çarpanlar", "Çarpan sayısı"] });
    let N = o.N || o.hazir[0]; let bul = new Set(), denendi = new Set();
    const kut = h("div", "cn-satir");
    const sA = adimci("Sayı:", 2, o.max || 200, N, v => { N = v; yeni(); });
    kut.appendChild(sA.w);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => sA.ayarla(n); hz.appendChild(b); }); kut.appendChild(hz); }
    s.den.appendChild(kut);
    const bolen = h("div", "cn-satir cn-test"); bolen.innerHTML = `<label>Bölen deneyin: <input type="number" inputmode="numeric" min="1"></label>`;
    const bD = dug("Böl"), bS = dug("Sıradakini dene", "ghost"); bolen.append(bD, bS); s.den.appendChild(bolen);
    const bi = bolen.querySelector("input");
    let bK = null; if (o.katlar) { bK = dug(o.katDugme || "Katlarını say ▶", "ghost"); s.den.appendChild(bK); }
    const ciftler = h("div", "cn-cift"); const katlar = h("div", "cn-katlar");
    function yeni() { bul = new Set(); denendi = new Set(); ciz(); s.dur.innerHTML = `${N} sayısını 1, 2, 3, … sayılarına bölerek çarpan çiftlerini bulun.`; katlar.textContent = ""; }
    function ciz() {
      const L = [...bul].sort((a, b) => a - b);
      s.sah.innerHTML = ""; const kartlar = h("div", "cn-kartlar");
      L.forEach(v => kartlar.appendChild(h("span", "cn-kart" + (v * v === N ? " kare" : ""), v)));
      if (!L.length) kartlar.appendChild(h("span", "cn-bosk", "Henüz çarpan bulunmadı"));
      s.sah.append(kartlar, ciftler, katlar);
      ciftler.innerHTML = L.filter(v => v * v <= N).map(v => `<span>${v} ${x} ${N / v}${v * v === N ? " <i>(aynı sayı: bir kez yazılır)</i>" : ""}</span>`).join("");
    }
    const tamamMi = () => { for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) return false; return true; };
    const eksik = () => { const L = []; for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) L.push(i); return ` <br>Henüz denenmeyen küçük bölenler var: <b>${L.join(", ")}</b>. Bunları da deneyin.`; };
    function dene(d) {
      if (!d || d < 1) return; denendi.add(d);
      const b = Math.floor(N / d), r = N % d;
      if (d > N) { s.dur.innerHTML = `${d} > ${N}: ${E(N,"den")} büyük sayı ${E(N,"in")} çarpanı olamaz.`; return; }
      if (r === 0) { bul.add(d); bul.add(b); ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${N} : ${d} = ${b}, kalan 0 → <b>${d} ${x} ${b} = ${N}</b>. ${d} ve ${b} çarpandır.` + (d * d >= N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} ${d * d === N ? "=" : ">"} ${N}. Artık yeni çift çıkmaz; bütün çarpanlar bulundu.` : eksik() : ""); }
      else { s.dur.innerHTML = `<span class="kotu">✘</span> ${N} : ${d} işleminde bölüm ${b}, <b>kalan ${r}</b>. ${d}, ${E(N,"in")} çarpanı değildir.` + (d * d > N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} > ${N}. Daha büyük bölen denemeye gerek yok; çarpan listesi tamam.` : eksik() : ""); }
      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));
      if (tamam) s.yaz("n" + N, [N, [...bul].sort((a, b) => a - b).join(", "), bul.size], true);
    }
    bD.onclick = () => dene(Math.round(+bi.value));
    bS.onclick = () => { let d = 1; while (denendi.has(d)) d++; bi.value = d; dene(d); };
    if (bK) bK.onclick = async () => {
      bK.disabled = true; katlar.textContent = ""; const sat = h("div", "cn-katsat"); katlar.append(h("b", "", `${E(N,"in")} katları: `), sat);
      for (let i = 1; i <= (o.katSay || 12); i++) { sat.appendChild(h("span", "cn-kat2", `${N * i}`)); await bekle(220); }
      sat.appendChild(h("span", "cn-sonsuz", "… ve sonsuza kadar sürer"));
      bK.disabled = false;
    };
    yeni();
  }

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */
  function KUMBARA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Para", "Sonuç"] });
    const k = o.k; let hafta = 0, tmr = null;
    const kut = h("div", "cn-satir"); const bA = dug("Bir hafta geçsin +"), bO = dug("▶ Haftaları oynat", "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bO, bS); s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Kumbarada şu para olabilir mi? <input type="number" inputmode="numeric" min="1" max="500"> TL</label>`;
    const bT = dug("Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test); const ti = test.querySelector("input");
    function ciz() {
      const top = hafta * k, sv = [];
      const yuk = Math.min(150, top * 1.4);
      sv.push(`<rect x="110" y="20" width="120" height="160" rx="22" class="cn-kum"/><rect x="150" y="14" width="40" height="8" rx="3" class="cn-kum2"/>`);
      sv.push(`<rect x="116" y="${176 - yuk}" width="108" height="${yuk}" rx="10" class="cn-para"/>`);
      sv.push(`<text x="170" y="110" text-anchor="middle" class="cn-buyuk">${top} TL</text><text x="170" y="134" text-anchor="middle" class="cn-et">${hafta}. hafta</text>`);
      let cizgi = ""; for (let i = 1; i <= hafta && i <= 16; i++) cizgi += `<text x="${260 + ((i - 1) % 4) * 52}" y="${40 + Math.floor((i - 1) / 4) * 34}" class="cn-et2">${k}${x}${i}=${k * i}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 480 190" role="img" aria-label="Kumbara">${sv.join("")}${cizgi}</svg>`;
      s.dur.innerHTML = hafta ? `${hafta}. hafta sonunda kumbarada ${k} ${x} ${hafta} = <b>${top} TL</b> var.` : `Kumbara boş. Her hafta ${k} TL atılıyor.`;
    }
    bA.onclick = () => { hafta++; ciz(); };
    bO.onclick = () => { if (tmr) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } bO.textContent = "❚❚ Durdur"; tmr = setInterval(() => { if (hafta >= 15) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } hafta++; ciz(); }, az ? 50 : 500); };
    bS.onclick = () => { hafta = 0; ciz(); };
    bT.onclick = () => {
      const v = Math.round(+ti.value); if (!v) return; const b = Math.floor(v / k), r = v % k;
      s.dur.innerHTML = r ? `<span class="kotu">✘</span> ${k} ${x} ${b} = ${k * b} TL, ${k} ${x} ${b + 1} = ${k * (b + 1)} TL. ${v} TL arada kalır (${v} : ${k} → kalan ${r}). Kumbarada hiçbir hafta ${v} TL olmaz.`
        : `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · ${b}. hafta sonunda kumbarada tam ${v} TL olur.`;
      if (!r) { hafta = b; ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · <b>${b}. hafta</b> sonunda kumbarada tam ${v} TL olur.`; }
      s.yaz("t" + v, [v + " TL", r ? `kalan ${r} ✘` : `${k} ${x} ${b} ✔`], !r);
    };
    ciz();
  }

  /* 9) ÖNERME LABORATUVARI: önermeyi farklı sayılarla sınama */
  function ONERME(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Önerme", "Sayı", "Sonuç"] });
    let akt = 0; const kut = h("div", "cn-hazir");
    const bt = o.onermeler.map((on, i) => { const b = dug(on.ad, "ghost"); b.setAttribute("aria-pressed", i === 0); b.onclick = () => { akt = i; bt.forEach((x, j) => x.setAttribute("aria-pressed", j === i)); goster(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Sınanacak sayı: <input type="number" inputmode="numeric" min="1" max="200" value="12"></label>`;
    const bT = dug("Sına"), bR = dug("Rastgele sayı", "ghost"); test.append(bT, bR); s.den.appendChild(test); const ti = test.querySelector("input");
    function goster() { s.sah.innerHTML = `<div class="cn-onr"><b>${o.onermeler[akt].ad}:</b> “${o.onermeler[akt].metin}”</div>`; s.dur.innerHTML = "Bir sayı yazıp Sına düğmesine basın. Önerme her sayıda doğru mu?"; }
    function sina(n) {
      const on = o.onermeler[akt], r = on.sina(n);
      s.sah.innerHTML = `<div class="cn-onr"><b>${on.ad}:</b> “${on.metin}”</div><div class="cn-kanit">${r.goster}</div>`;
      s.dur.innerHTML = (r.ok ? `<span class="iyi">✔</span> ${n} için önerme doğru.` : `<span class="kotu">✘</span> ${n} için önerme yanlış! Bir karşı örnek bulundu.`) + (r.not ? " " + r.not : "");
      s.yaz(akt + ":" + n, [on.ad, n, r.ok ? "doğru" : "yanlış (karşı örnek)"], r.ok);
    }
    bT.onclick = () => { const n = Math.round(+ti.value); if (n > 0) sina(n); };
    bR.onclick = () => { const n = 2 + Math.floor(Math.random() * 59); ti.value = n; sina(n); };
    goster();
  }


  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →
     koşullar tek tek denetlenir (✔/✘) → deney defterine yazılır. Doğru cevap verilmez; öğrenci uygun girdiyi kendisi arar.
     o.girdi: [{ad, min, max, bas} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → SVG/HTML · o.kosullar: [{ad, f(v) → bool | {ok, not}}]
     o.dugme: düğme yazısı (false → her değişiklikte denetlenir) · o.sonuc(v, hepsi, L) · o.satir(v, hepsi, L) · o.iyi(v, L) · o.ek: [{ad, deger(v) → v}] */
  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);
      s.dur.innerHTML = m;
      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);
    }
    kur = true; ciz();
    if (bS) s.dur.innerHTML = o.ilk || "Değerleri seçip Sına düğmesine basın."; else sina();
  }

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

/* AKIS-BAS */
const AKIS=(()=>{
  const DOL={bas:"#fff3bf",bit:"#fff3bf",gir:"#ffe8cc",isl:"#e5dbff",kar:"#d0ebff",cik:"#ffdeeb"},CZ="#3b3f4a",VR="#e8590c",LH=17.5,INK="#111111";
  let cv=null;
  const temiz=s=>String(s).replace(/<[^>]+>/g,"");
  const tw=(s,fs)=>{try{cv=cv||document.createElement("canvas").getContext("2d");cv.font=`700 ${fs}px Arimo, "Liberation Sans", Arial, sans-serif`;return cv.measureText(temiz(s)).width;}catch(e){return temiz(s).length*fs*.58;}};
  const es=s=>temiz(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const T=(x,y,s,fs=13.5,w=700,r=INK,a="middle")=>`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${fs}" font-weight="${w}" fill="${r}" text-anchor="${a}" style="font-family:Arimo,'Liberation Sans',Arial,sans-serif">${es(s)}</text>`;
  const uc=(x,y,yon,r=CZ,b=5.2)=>{const P={sag:[x,y,x-b*1.6,y-b*.8,x-b*1.6,y+b*.8],sol:[x,y,x+b*1.6,y-b*.8,x+b*1.6,y+b*.8],asagi:[x,y,x-b*.8,y-b*1.6,x+b*.8,y-b*1.6],yukari:[x,y,x-b*.8,y+b*1.6,x+b*.8,y+b*1.6]}[yon];
    return `<polygon points="${P[0].toFixed(1)},${P[1].toFixed(1)} ${P[2].toFixed(1)},${P[3].toFixed(1)} ${P[4].toFixed(1)},${P[5].toFixed(1)}" fill="${r}"/>`;};
  const cz=(pts,u,r=CZ,sw=1.6)=>`<path d="M${pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L")}" fill="none" stroke="${r}" stroke-width="${sw}" stroke-linejoin="round"/>`+(u?uc(pts[pts.length-1][0],pts[pts.length-1][1],u,r):"");
  const sat=m=>Array.isArray(m)?m:String(m).split("\n");
  function olcu(t,m,fs){const L=sat(m),n=L.length,w=Math.max(...L.map(x=>tw(x,fs))),th=LH*n;
    if(t==="bas"||t==="bit")return [Math.max(78,w+34),30+LH*(n-1)];
    if(t==="gir")return [Math.max(104,w+46),32+LH*(n-1)];
    if(t==="isl")return [Math.max(96,w+24),32+LH*(n-1)];

<script>
const V={"baslik": "Algoritmayı Yapılandırma", "kod": "7. SINIF · MAT.7.2.4", "ses": "", "bet": "BAĞLAM TEMELLİ SORU", "bad": "Bağlam Soruları", "s": [{"no": 1, "bas": "Algoritma ve ifade yöntemleri", "q": [{"k": "Bir kafede çay 15 TL, simit 18 TL'dir. 2 çay ve 3 simit alan Ali'nin ödeyeceği tutarı bulan algoritmanın girdilerini, işlem adımlarını ve çıktısını yazınız.", "a": ["Girdiler: çay fiyatı 15 TL, simit fiyatı 18 TL, 2 çay, 3 simit.", "İşlemler: 2 · 15 = 30; 3 · 18 = 54; 30 + 54 = 84.", "Çıktı: ödenecek tutar 84 TL."], "c": "Girdiler 15, 18, 2, 3; çıktı 84 TL"}, {"k": "“Bir sayı al. Sayıyı 2 ile çarp, sonuca 9 ekle ve bulduğun sonucu yazdır.” algoritmasını sözde kodla yazınız.", "a": ["Doğal dil paragrafını tek işlemli adımlara bölünüz.", "1. Adım: Başla. 2. Adım: Sayıyı (n) gir. 3. Adım: A = 2 · n hesapla. 4. Adım: Sonuç = A + 9 hesapla.", "5. Adım: Sonucu yazdır. 6. Adım: Bitir."], "c": "6 adımlı sözde kod"}]}, {"no": 2, "bas": "Adımlar arasındaki ilişkiler", "q": [{"k": "Aşağıdaki algoritmada yan yana iki adımdan hangilerinin yeri, sonuç değişmeden değiştirilebilir? Gerekçesiyle yazınız.<br><b>1. Adım:</b> Başla.<br><b>2. Adım:</b> Kitap sayısını (k) gir.<br><b>3. Adım:</b> Defter sayısını (d) gir.<br><b>4. Adım:</b> T = k + d hesapla.<br><b>5. Adım:</b> Kutu = T : 4 hesapla.<br><b>6. Adım:</b> Kutuyu yazdır.<br><b>7. Adım:</b> Bitir.", "a": ["2. ve 3. adımlar birbirinin sonucunu kullanmaz; yerleri değiştirilebilir.", "4. adım 2. ve 3. adımların, 5. adım 4. adımın, 6. adım 5. adımın sonucunu kullanır; bu adımlar bağlıdır.", "Yalnız 2. ve 3. adımların yeri değiştirilebilir."], "c": "Yalnız 2. ve 3. adımlar"}, {"k": "Aşağıdaki algoritmanın adım tablosunu yazınız ve çıktıyı bulunuz.<br><b>1. Adım:</b> Başla.<br><b>2. Adım:</b> a'yı 7, b'yi 3 olarak gir.<br><b>3. Adım:</b> a'yı b kadar artır.<br><b>4. Adım:</b> b'yi a ile çarp.<br><b>5. Adım:</b> a'yı 1 azalt.<br><b>6. Adım:</b> a ve b'yi yazdır.<br><b>7. Adım:</b> Bitir.", "a": ["2. adımdan sonra a = 7, b = 3.", "3. adım: a = 10. 4. adım: b = 3 · 10 = 30.", "5. adım: a = 9. Çıktı: a = 9, b = 30."], "c": "a = 9, b = 30"}]}, {"no": 3, "bas": "İşlem algoritmaları", "q": [{"k": "Bir sayıyı 101 ile çarpmanın kısa yolunu algoritma olarak yazınız. Algoritmanın dayandığı işlem özelliğini belirtiniz ve 57 ile çalıştırınız.", "a": ["n · 101 = n · (100 + 1) = n · 100 + n (dağılma özelliği).", "1. Adım: Başla. 2. Adım: Sayıyı (n) gir. 3. Adım: A = n · 100 hesapla. 4. Adım: Sonuç = A + n hesapla. 5. Adım: Sonucu yazdır. 6. Adım: Bitir.", "n = 57: A = 5 700; Sonuç = 5 700 + 57 = 5 757."], "c": "5 757"}, {"k": "−20 : (3 − 7) + 2 · 9 işlemini her satırda tek işlem yapan bir sözde kodla yazınız ve sonucu bulunuz.", "a": ["A = 3 − 7 = −4 (önce ayraç).", "B = −20 : A = 5; C = 2 · 9 = 18 (çarpma ve bölme soldan sağa).", "Sonuç = B + C = 23."], "c": "23"}]}, {"no": 4, "bas": "Karar adımı", "q": [{"k": "Bir hava durumu ekranının algoritması önce “t ≥ 30 mu?” diye sorar; cevap Evet ise “Sıcak” yazdırır. Cevap Hayır ise “t ≤ 10 mu?” diye sorar; Evet ise “Soğuk”, Hayır ise “Ilık” yazdırır. Algoritmayı t = 30, t = 10 ve t = 18 ile izleyiniz.", "a": ["t = 30: 30 ≥ 30 doğrudur → “Sıcak”.", "t = 10: 10 ≥ 30 yanlış; 10 ≤ 10 doğru → “Soğuk”.", "t = 18: iki koşul da sağlanmaz → “Ilık”."], "c": "Sıcak, Soğuk, Ilık"}, {"k": "Bir kargo şirketi 2 kg ve altındaki paketler için 70 TL, 2 kg'dan ağır paketler için 110 TL almaktadır. Ücreti bulan algoritmanın karar adımını sözde kodla yazınız ve 2 kg'lık paketin ücretini bulunuz.", "a": ["Sınır 2 kg “ve altı” olduğu için koşul ≤ ile yazılır.", "3. Adım: Eğer kütle ≤ 2 ise ücreti 70 olarak hesapla, değilse ücreti 110 olarak hesapla.", "2 kg: 2 ≤ 2 doğrudur → 70 TL."], "c": "Kütle ≤ 2 ise 70, değilse 110; 70 TL"}]}, {"no": 5, "bas": "Döngü", "q": [{"k": "Aşağıdaki algoritmanın kaç tur çalışacağını ve çıktısını adım tablosuyla bulunuz.<br><b>1. Adım:</b> Başla.<br><b>2. Adım:</b> T'yi 5, sayacı 0 olarak gir.<br><b>3. Adım:</b> T'yi 3 ile çarp.<br><b>4. Adım:</b> Sayacı 1 artır.<br><b>5. Adım:</b> Eğer T &lt; 100 ise 3. adıma geri dön.<br><b>6. Adım:</b> Sayacı ve T'yi yazdır.<br><b>7. Adım:</b> Bitir.", "a": ["1. tur: T = 15, sayaç 1; 15 &lt; 100 → geri dön.", "2. tur: T = 45, sayaç 2; 3. tur: T = 135, sayaç 3; 135 &lt; 100 değil → döngüden çık.", "Çıktı: sayaç 3, T = 135."], "c": "3 tur; 3 ve 135"}, {"k": "Defne'nin biriktirme hesabında 130 TL vardır; her hafta hesabına 75 TL ekleyecektir. Hesap 600 TL'ye ulaşınca bisiklet alacaktır. Kaçıncı haftada bisiklet alabileceğini bulan döngülü algoritmayı yazınız ve çalıştırınız.", "a": ["1. Adım: Başla. 2. Adım: Para = 130, hafta = 0 olarak gir. 3. Adım: Parayı 75 artır. 4. Adım: Haftayı 1 artır.", "5. Adım: Eğer para &lt; 600 ise 3. adıma geri dön. 6. Adım: Haftayı yazdır. 7. Adım: Bitir.", "Turlar: 205, 280, 355, 430, 505, 580, 655. 6. haftada 580 TL, 7. haftada 655 TL olur."], "c": "7. haftada"}]}, {"no": 6, "bas": "Cebirsel ifadelerle algoritma", "q": [{"k": "Bir fotoğrafçı vesikalık çekim için 60 TL ve her baskı için 15 TL almaktadır. n baskı için ücreti hesaplayan sözde kodu cebirsel ifadeyle yazınız.", "a": ["Girdi baskı sayısıdır; n ile gösterilir.", "1. Adım: Başla. 2. Adım: Baskı sayısını (n) gir. 3. Adım: Ücret = 60 + 15 · n hesapla.", "4. Adım: Ücreti yazdır. 5. Adım: Bitir."], "c": "Ücret = 60 + 15 · n"}, {"k": "Bir halı yıkama firmasının ücret algoritmasının işlem kutusunda “Ücret = 30 + 25 · m” yazmaktadır (m: halının metrekare olarak alanı). 30 ve 25 sayılarının bu durumdaki anlamını açıklayınız.", "a": ["25, m'nin katsayısıdır: halının her metrekaresi için alınan ücrettir.", "30 sabit terimdir: halının büyüklüğü ne olursa olsun bir kez alınan ücrettir (servis ücreti gibi).", "Örneğin 4 m²'lik halı için 30 + 25 · 4 = 130 TL ödenir."], "c": "25: metrekare ücreti; 30: bir kez ödenen ücret"}]}, {"no": 7, "bas": "Farklı yöntem, kısaltma, karşılaştırma", "q": [{"k": "Aşağıdaki sözde kodun akış şemasını hangi şekillerle çizeceğinizi sırasıyla yazınız.<br><b>1. Adım:</b> Başla.<br><b>2. Adım:</b> Puanı (p) gir.<br><b>3. Adım:</b> Eğer p ≥ 70 ise “Geçti” yazdır, değilse “Kaldı” yazdır.<br><b>4. Adım:</b> Bitir.", "a": ["Başla: oval; puanı gir: paralelkenar.", "“p ≥ 70 mi?” eşkenar dörtgen; Evet çıkışında “Geçti”, Hayır çıkışında “Kaldı” yazan iki belge şekli.", "İki belge şeklinden çıkan oklar Bitir ovaline gider."], "c": "Oval, paralelkenar, eşkenar dörtgen, iki belge şekli, oval"}, {"k": "Dikdörtgenin çevresi için iki algoritma yazılmıştır: A: “Ç = a + b + a + b hesapla.” B: “Ç = 2 · (a + b) hesapla.” İki algoritmayı iki ölçütle karşılaştırınız.", "a": ["Doğruluk: a = 3, b = 5 için A: 16, B: 16; iki algoritma da her girdide aynı sonucu verir.", "İşlem sayısı: A'da 3 toplama, B'de 1 toplama ve 1 çarpma vardır; B daha kısadır.", "Okunurluk: A kenarları tek tek gösterir; B çevrenin iki kenarın toplamının 2 katı olduğunu açıkça söyler."], "c": "İkisi de doğru; B daha kısa"}]}, {"no": 8, "bas": "Hatalı algoritmalar", "q": [{"k": "Aşağıdaki algoritmadaki hatayı bulup düzeltiniz.<br><b>1. Adım:</b> Başla.<br><b>2. Adım:</b> T = a + b + c hesapla.<br><b>3. Adım:</b> a, b ve c'yi gir.<br><b>4. Adım:</b> T'yi yazdır.<br><b>5. Adım:</b> Bitir.", "a": ["2. adımda a, b ve c kullanılmıştır ama bu değerler 3. adımda girilmektedir.", "Bu bir sıra hatasıdır: değer girilmeden kullanılmıştır.", "Düzeltme: 2. ve 3. adımların yeri değiştirilir."], "c": "Sıra hatası; 2. ve 3. adımlar yer değiştirir"}, {"k": "“Boyu 140 cm ve üstü olanlar oyuncağa binebilir.” kuralı için yazılan algoritmada karar adımı “Boy > 140 mı?” biçimindedir. Bu hata hangi girdilerde sonucu değiştirir? Açıklayınız.", "a": ["141 cm ve üstü: iki koşul da sağlanır, sonuç doğrudur. 139 cm ve altı: iki koşul da sağlanmaz, sonuç doğrudur.", "140 cm: doğru koşul (Boy ≥ 140) sağlanır ama yazılan koşul (140 > 140) sağlanmaz; çocuk yanlışlıkla binemez.", "Hata yalnız sınır değer olan 140 cm'de ortaya çıkar."], "c": "Yalnız 140 cm'de"}]}, {"no": 9, "bas": "Gerçek yaşam sorunları", "q": [{"k": "Bir okulun önündeki hız ekranı yaklaşan aracın hızını (h, km/sa.) ölçmektedir. Hız 30 km/sa.'ten büyükse ekranda “Yavaşla”, değilse “Teşekkürler” yazmaktadır. Bu trafik önlemi için girdisi, karar adımı ve çıktısı olan bir sözde kod yazınız.", "a": ["Girdi: aracın hızı h. Karar: h > 30 mu? Çıktılar: “Yavaşla” ya da “Teşekkürler”.", "1. Adım: Başla. 2. Adım: Hızı (h) gir. 3. Adım: Eğer h > 30 ise “Yavaşla” yazdır, değilse “Teşekkürler” yazdır. 4. Adım: Bitir.", "Sınır değerle deneyiniz: h = 30 için “Teşekkürler” yazar."], "c": "Girdi h; karar h > 30; iki çıktı"}, {"k": "Bir arkadaşınız geri dönüşüm kutusu için şu algoritmayı yazmıştır: “1. Adım: Başla. 2. Adım: Kutudaki şişe sayısını (ş) gir. 3. Adım: Eğer ş ≥ 50 ise “Boşalt” yazdır. 4. Adım: Bitir.” Algoritmayı ş = 50 ve ş = 49 ile deneyip arkadaşınıza bir öneri yazınız.", "a": ["ş = 50: 50 ≥ 50 doğrudur → “Boşalt” yazdırılır.", "ş = 49: koşul sağlanmaz; algoritma hiçbir şey yazdırmadan biter.", "Öneri: Hayır durumu için de bir çıktı (“Bekle” gibi) eklenirse kutuyu denetleyen kişi algoritmanın çalıştığını görür."], "c": "50: Boşalt; 49: çıktı yok; Hayır dalına çıktı eklenmeli"}]}], "k": [{"no": 1, "bas": "Algoritmayı çalıştırınız", "yon": "Her satırdaki algoritmayı verilen girdiyle çalıştırıp çıktıyı yazınız.", "r": [{"n": "“100 ile çarp, n'yi çıkar” algoritması; n = 36", "c": "3 564"}, {"n": "“10 ile çarp, yarısını ekle” algoritması; n = 26", "c": "390"}, {"n": "“100 ile çarp, 4'e böl” algoritması; n = 52", "c": "1 300"}, {"n": "A = 6 − 11; B = A · 3; C = B + 8. C kaçtır?", "c": "−7"}, {"n": "Kesirle bölme algoritması: 1 2/3 : 5/6", "c": "2"}, {"n": "Kesirle bölme algoritması: 4 1/2 : 3/2", "c": "3"}]}, {"no": 2, "bas": "Döngüyü izleyiniz", "yon": "Her döngüyü adım tablosuyla izleyip istenen değeri yazınız.", "r": [{"n": "T = 0; her turda T'yi 9 artır; T ≥ 50 olunca dur. Kaç tur çalışır?", "c": "6"}, {"n": "Sayı = 3; her turda sayıyı 2 ile çarp; sayı > 70 olunca dur. Son sayı kaçtır?", "c": "96"}, {"n": "Sayı = 50; her turda sayıyı 8 azalt; sayı &lt; 0 olunca dur. Son sayı kaçtır?", "c": "−6"}, {"n": "Sayaç = 1; her turda sayacı yazdır, sonra 3 artır; sayaç > 13 olunca dur. Kaç sayı yazdırılır?", "c": "5"}, {"n": "T = 2, sayaç = 0; her turda T'yi sayaç kadar artır, sonra sayacı 1 artır; sayaç 5'e eşit olunca dur. T kaçtır?", "c": "12"}]}, {"no": 3, "bas": "Cebirsel ifadeli algoritmalar", "yon": "Çıktıyı bulunuz ya da işlem kutusuna yazılacak ifadeyi yazınız.", "r": [{"n": "Ücret = 25 + 9 · n; n = 7 için çıktı", "c": "88"}, {"n": "Çevre = 2 · a + 2 · b + 16; a = 11, b = 5 için çıktı", "c": "48"}, {"n": "“2 ile çarp, 9 çıkar” algoritması 31 yazdırdı. Girdi kaçtır?", "c": "20"}, {"n": "Tanesi 14 TL olan n bilet ve 30 TL servis ücretinin tutarı", "c": "14 · n + 30"}, {"n": "“n'ye 5 ekle, sonucu 4 ile çarp” algoritmasının tek ifadesi", "c": "4 · n + 20"}, {"n": "İlk saati 60 TL, sonraki her saati 15 TL olan park ücreti (s saat)", "c": "60 + 15 · (s − 1)"}]}, {"no": 4, "bas": "Hatayı bulunuz ve düzeltiniz", "yon": "Her satırdaki hatalı adımın doğrusunu yazınız.", "r": [{"n": "Karenin alanı için “Alan = 4 · a hesapla.” yazılmış.", "c": "Alan = a · a"}, {"n": "“En az 15 kişi” koşulu için “Kişi > 15 mi?” sorulmuş.", "c": "Kişi ≥ 15 mi?"}, {"n": "“2. Adım: Ortalamayı yazdır. 3. Adım: O = T : 5 hesapla.”", "c": "2. ve 3. adımlar yer değiştirir"}, {"n": "Sayı 1'den başlayıp her turda 4 artıyor; durma koşulu “Sayı 20'ye eşit mi?”", "c": "Sayı > 20 mi?"}]}], "b": [{"no": 1, "on": "<p>Bir kargo şubesi, gönderilecek paketin ücretini aşağıdaki akış şemasına göre hesaplamaktadır. Şemada k, paketin kilogram olarak kütlesidir.</p>", "g": "<svg viewBox=\"-84 0 169 244\" width=\"169\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><path d=\"M0.0 36.0 L0.0 47.5\" fill=\"none\" stroke=\"#3b3f4a\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"0.0,47.5 -4.2,39.2 4.2,39.2\" fill=\"#3b3f4a\"/><path d=\"M0.0 97.5 L0.0 109.0\" fill=\"none\" stroke=\"#3b3f4a\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"0.0,109.0 -4.2,100.7 4.2,100.7\" fill=\"#3b3f4a\"/><path d=\"M0.0 141.5 L0.0 153.0\" fill=\"none\" stroke=\"#3b3f4a\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"0.0,153.0 -4.2,144.7 4.2,144.7\" fill=\"#3b3f4a\"/><path d=\"M0.0 191.5 L0.0 203.0\" fill=\"none\" stroke=\"#3b3f4a\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"0.0,203.0 -4.2,194.7 4.2,194.7\" fill=\"#3b3f4a\"/><ellipse cx=\"0.0\" cy=\"21.0\" rx=\"39.0\" ry=\"15.0\" fill=\"#fff3bf\" stroke=\"#3b3f4a\" stroke-width=\"1.5\"/><text x=\"0.0\" y=\"25.9\" font-family=\"Liberation Sans\",Arial,sans-serif font-size=\"13.5\" font-weight=\"600\" fill=\"#111111\" text-anchor=\"middle\">Başla</text><polygon points=\"-63.3,48.0 76.3,48.0 63.3,97.5 -76.3,97.5\" fill=\"#ffe8cc\" stroke=\"#3b3f4a\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"0.0\" y=\"68.9\" font-family=\"Liberation Sans\",Arial,sans-serif font-size=\"13.5\" font-weight=\"600\" fill=\"#111111\" text-anchor=\"middle\">Paketin kütlesini</text><text x=\"0.0\" y=\"86.4\" font-family=\"Liberation Sans\",Arial,sans-serif font-size=\"13.5\" font-weight=\"600\" fill=\"#111111\" text-anchor=\"middle\">(k) gir</text><rect x=\"-65.7\" y=\"109.5\" width=\"131.3\" height=\"32.0\" fill=\"#e5dbff\" stroke=\"#3b3f4a\" stroke-width=\"1.5\"/><text x=\"0.0\" y=\"130.4\" font-family=\"Liberation Sans\",Arial,sans-serif font-size=\"13.5\" font-weight=\"600\" fill=\"#111111\" text-anchor=\"middle\">Ücret = 30 + 8 · k</text><path d=\"M-53.5 153.5 H53.5 V185.0 C30.0 169.4 5.4 183.7 0.0 188.9 S-32.1 201.9 -53.5 186.3 Z\" fill=\"#ffdeeb\" stroke=\"#3b3f4a\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"0.0\" y=\"174.4\" font-family=\"Liberation Sans\",Arial,sans-serif font-size=\"13.5\" font-weight=\"600\" fill=\"#111111\" text-anchor=\"middle\">Ücreti yazdır</text><ellipse cx=\"0.0\" cy=\"218.5\" rx=\"39.0\" ry=\"15.0\" fill=\"#fff3bf\" stroke=\"#3b3f4a\" stroke-width=\"1.5\"/><text x=\"0.0\" y=\"223.4\" font-family=\"Liberation Sans\",Arial,sans-serif font-size=\"13.5\" font-weight=\"600\" fill=\"#111111\" text-anchor=\"middle\">Bitir</text></svg>", "son": "<p>Elif, kütlesi 6 kg olan bir paket göndermiştir.</p>", "k": "Buna göre, Elif'in ödeyeceği ücret kaç TL'dir?", "sec": ["228", "78", "44", "48"], "secg": null, "c": "B", "a": ["Şemaya k = 6 girilir.", "İşlem kutusunda önce çarpma yapılır: 8 · 6 = 48.", "Ücret = 30 + 48 = 78 TL."], "t": "228: önce 30 ile 8 toplanmış; 44: çarpma yerine toplama yapılmış; 48: sabit ücret eklenmemiş", "d": "İşlem kutusunda önce çarpma yapılır. Sabit ücret (30 TL) paketin kütlesinden bağımsızdır ve bir kez eklenir.", "ses": "b01"}, {"no": 2, "on": "<p>Ece, çay demlemenin adımlarını kartlara yazmış ama kartları karıştırmıştır.</p>", "g": "<svg viewBox=\"0 0 520 102\" width=\"520\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"118\" height=\"86\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H118 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"67.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">K</text><text x=\"67.0\" y=\"69.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Suyu kaynat</text><rect x=\"136\" y=\"8\" width=\"118\" height=\"86\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M136 36 V16 q0 -8 8 -8 H246 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"195.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">L</text><text x=\"195.0\" y=\"69.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Demliğe çay koy</text><rect x=\"264\" y=\"8\" width=\"118\" height=\"86\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M264 36 V16 q0 -8 8 -8 H374 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"323.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">M</text><text x=\"323.0\" y=\"60.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Kaynar suyu</text><text x=\"323.0\" y=\"79.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">demliğe dök</text><rect x=\"392\" y=\"8\" width=\"118\" height=\"86\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M392 36 V16 q0 -8 8 -8 H502 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"451.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">N</text><text x=\"451.0\" y=\"60.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Demlenmesini</text><text x=\"451.0\" y=\"79.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">bekle</text></svg>", "son": "<p>Ece, bir adımın önceki bir adımın sonucunu kullanıp kullanmadığına bakarak kartları sıraya dizecektir.</p>", "k": "Buna göre, kartların sıralaması aşağıdakilerden hangisi olabilir?", "sec": ["L, K, M, N", "K, M, N, L", "M, K, L, N", "K, L, N, M"], "secg": null, "c": "A", "a": ["M adımı, K'nin sonucunu (kaynamış su) kullanır; N adımı M'nin sonucunu (suyu dökülmüş demlik) kullanır.", "K ile L birbirinin sonucunu kullanmaz; yerleri değişebilir.", "Bu yüzden M, K'den; N, M'den sonra gelmelidir. Seçeneklerden yalnız L, K, M, N bu koşulları sağlar."], "t": "K, M, N, L: çay demliğe su döküldükten sonra konmuş; M, K, L, N: su kaynatılmadan dökülmüş; K, L, N, M: su dökülmeden demlenmesi beklenmiş", "d": "Bir adım önceki bir adımın sonucunu kullanıyorsa ondan sonra gelmelidir. Birbirinin sonucunu kullanmayan adımların yeri değişebilir.", "ses": "b02"}, {"no": 3, "on": "<p>Bir sinema salonunun gişesindeki ekran, 13 yaş ve üstü için uygun bir filmde aşağıdaki algoritmayı kullanmaktadır.</p>", "g": "<svg viewBox=\"-87 0 363 242\" width=\"363\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><path d=\"M0.0 36.0 L0.0 47.5\" fill=\"none\" stroke=\"#3b3f4a\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"0.0,47.5 -4.2,39.2 4.2,39.2\" fill=\"#3b3f4a\"/><path d=\"M0.0 80.0 L0.0 91.5\" fill=\"none\" stroke=\"#3b3f4a\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"0.0,91.5 -4.2,83.2 4.2,83.2\" fill=\"#3b3f4a\"/><path d=\"M0.0 139.5 L0.0 151.0\" fill=\"none\" stroke=\"#3b3f4a\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"0.0,151.0 -4.2,142.7 4.2,142.7\" fill=\"#3b3f4a\"/><text x=\"7.0\" y=\"150.5\" font-family=\"Liberation Sans\",Arial,sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">Hayır</text><path d=\"M0.0 189.5 L0.0 201.0\" fill=\"none\" stroke=\"#3b3f4a\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"0.0,201.0 -4.2,192.7 4.2,192.7\" fill=\"#3b3f4a\"/><path d=\"M78.7 115.8 L124.2 115.8\" fill=\"none\" stroke=\"#3b3f4a\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"124.2,115.8 115.9,111.6 115.9,119.9\" fill=\"#3b3f4a\"/><text x=\"84.7\" y=\"109.8\" font-family=\"Liberation Sans\",Arial,sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">Evet</text><path d=\"M124.7 96.8 H268.5 V128.2 C236.9 112.7 203.8 127.0 196.6 132.2 S153.5 145.2 124.7 129.6 Z\" fill=\"#ffdeeb\" stroke=\"#3b3f4a\" stroke-width=\"1.5\" stroke-linejoin=\"roun e Deniz 11 yaşındadır.</p>", "k": "Buna göre, bu dört kişiden kaçı için ekranda “İzleyebilir” yazar?", "sec": ["3", "1", "4", "2"], "secg": null, "c": "D", "a": ["Ali: 12 ≥ 13 yanlıştır. Deniz: 11 ≥ 13 yanlıştır.", "Buse: 13 ≥ 13 doğrudur (sınır değer). Can: 15 ≥ 13 doğrudur.", "“İzleyebilir” yazdırılan kişi sayısı 2'dir."], "t": "1: sınır değerdeki Buse unutulmuş; 3: 12 yaşındaki Ali de sayılmış; 4: karar adımı dikkate alınmamış", "d": "≥ “büyük ya da eşit” demektir. Karar adımında sınırdaki yaşı (13) mutlaka deneyiniz.", "ses": "b03"}, {"no": 4, "on": "<p>Bir manavda elmanın kilogramı 19 TL'dir. Manav, tutarı hesaplarken aşağıdaki algoritmayı kullanmaktadır.</p>", "g": "<svg viewBox=\"-87 0 174 288\" width=\"174\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><path d=\"M0.0 36.0 L0.0 47.5\" fill=\"none\" stroke=\"#3b3f4a\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"0.0,47.5 -4.2,39.2 4.2,39.2\" fill=\"#3b3f4a\"/><path d=\"M0.0 97.5 L0.0 109.0\" fill=\"none\" stroke=\"#3b3f4a\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"0.0,109.0 -4.2,100.7 4.2,100.7\" fill=\"#3b3f4a\"/><path d=\"M0.0 141.5 L0.0 153.0\" fill=\"none\" stroke=\"#3b3f4a\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"0.0,153.0 -4.2,144.7 4.2,144.7\" fill=\"#3b3f4a\"/><path d=\"M0.0 185.5 L0.0 197.0\" fill=\"none\" stroke=\"#3b3f4a\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"0.0,197.0 -4.2,188.7 4.2,188.7\" fill=\"#3b3f4a\"/><path d=\"M0.0 235.5 L0.0 247.0\" fill=\"none\" stroke=\"#3b3f4a\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"0.0,247.0 -4.2,238.7 4.2,238.7\" fill=\"#3b3f4a\"/><ellipse cx=\"0.0\" cy=\"21.0\" rx=\"39.0\" ry=\"15.0\" fill=\"#fff3bf\" stroke=\"#3b3f4a\" stroke-width=\"1.5\"/><text x=\"0.0\" y=\"25.9\" font-family=\"Liberation Sans\",Arial,sans-serif font-size=\"13.5\" font-weight=\"600\" fill=\"#111111\" text-anchor=\"middle\">Başla</text><polygon points=\"-65.9,48.0 eyiniz.", "ses": "b12"}, {"no": 13, "on": "<p>Bir market kasasında 8 ürünün toplam tutarını hesaplamak için üç algoritma önerilmiştir.</p>", "g": "<svg viewBox=\"0 0 578 120\" width=\"578\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"180\" height=\"104\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H180 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"98.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><text x=\"98.0\" y=\"59.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">T = 0; her ürün için</text><text x=\"98.0\" y=\"78.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">T'yi fiyat kadar</text><text x=\"98.0\" y=\"97.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">artır (8 ayrı adım)</text><rect x=\"198\" y=\"8\" width=\"180\" height=\"104\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M198 36 V16 q0 -8 8 -8 H370 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"288.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><text x=\"288.0\" y=\"59.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">T = 0; sayaçlı</text><text x=\"288.0\" y=\"78.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">döngüyle 8 tur</text><text x=\"288.0\" y=\"97.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">T'yi fiyat kadar artır</text><rect x=\"388\" y=\"8\" width=\"180\" height=\"104\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M388 36 V16 q0 -8 8 -8 H560 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"478.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><text x=\"478.0\" y=\"66.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">T = 8 · (ilk ürünün</text><text x=\"478.0\" y=\"91.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">fiyatı)</text></svg>", "son": "<div style=\"margin:1mm 0 1mm 2mm\"><div style=\"margin:.6mm 0\">I. A ve B her girdide aynı sonucu verir.</div><div style=\"margin:.6mm 0\">II. C yalnız bütün ürünlerin fiyatı aynıysa doğru sonuç verir.</div><div style=\"margin:.6mm 0\">III. Ürün sayısı 20 olursa B'nin adım sayısı artar.</div></div>", "k": "Buna göre, verilen ifadelerden hangileri doğrudur?", "sec": ["I ve II", "Yalnız I", "I ve III", "I, II ve III"], "secg": null, "c": "A", "a": ["I: A ile B aynı toplamayı yapar; biri adımları tek tek yazar, öbürü döngüyle tekrarlar. Doğrudur.", "II: C, ilk fiyatı 8 kez sayar; fiyatlar eşitse doğru, değilse yanlış sonuç verir. Doğrudur.", "III: B'de yalnız durma koşulundaki 8 sayısı 20 olur; adım sayısı değişmez. Yanlıştır."], "t": "Yalnız I: C'nin bazı girdilerde doğru çıktığı gözden kaçmış; III'ü içeren seçenekler: döngünün adım sayısını sabit tuttuğu unutulmuş", "d": "Bir algoritmanın doğru sayılması için her girdide doğru sonuç vermesi gerekir. Döngü, ürün sayısı artsa da adım sayısını değiştirmez.", "ses": "b13"}, {"no": 14, "on": "<p>Dört arkadaş bir kafede yedikleri yemeğin hesabını ve bıraktıkları bahşişi eşit paylaşacaktır. Kişi başı ödemeyi hesaplamak için yazılan algoritma aşağıda veril  183.7 0.0 188.9 S-54.8 201.9 -91.4 186.3 Z\" fill=\"#ffdeeb\" stroke=\"#3b3f4a\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"0.0\" y=\"174.4\" font-family=\"Liberation Sans\",Arial,sans-serif font-size=\"13.5\" font-weight=\"600\" fill=\"#111111\" text-anchor=\"middle\">Kişi başı ödemeyi yazdır</text><ellipse cx=\"0.0\" cy=\"218.5\" rx=\"39.0\" ry=\"15.0\" fill=\"#fff3bf\" stroke=\"#3b3f4a\" stroke-width=\"1.5\"/><text x=\"0.0\" y=\"223.4\" font-family=\"Liberation Sans\",Arial,sans-serif font-size=\"13.5\" font-weight=\"600\" fill=\"#111111\" text-anchor=\"middle\">Bitir</text></svg>", "son": "<p>Hesap 360 TL, bahşiş 40 TL'dir.</p>", "k": "Buna göre, algoritmanın yazdırdığı tutar ile her kişinin ödemesi gereken tutar arasındaki fark kaç TL'dir?", "sec": ["40", "10", "130", "30"], "secg": null, "c": "D", "a": ["Algoritma: 360 : 4 + 40 = 90 + 40 = 130 TL bulur.", "Olması gereken: (360 + 40) : 4 = 400 : 4 = 100 TL.", "Fark 130 − 100 = 30 TL. Hata, ayraç unutulduğu için bahşişin bölünmemesidir."], "t": "40: bahşişin tamamı fark sanılmış; 10: kişi başı bahşiş fark sanılmış; 130: algoritmanın bulduğu tutar yazılmış", "d": "Bahşiş de kişilere paylaştırılır. Ayraç unutulursa yalnız hesap bölünür, bahşiş her kişiye tam eklenir.", "ses": "b14"}, {"no": 15, "on": "<p>Ela'nın biriktirme hesabında 260 TL, Can'ın hesabında 80 TL vardır. Ela her hafta hesabına 40 TL, Can 70 TL eklemektedir. Can'ın parasının Ela'nınkini ilk kez geçtiği haftayı bulmak için aşağıdaki algoritma yazılmıştır.</p>", "g": "<svg viewBox=\"-135 0 226 320\" width=\"226\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><path d=\"M0.0 36.0 L0.0 47.5\" fill=\"none\" stroke=\"#3b3f4a\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"0.0,47.5 -4.2,39.2 4.2,39.2\" fill=\"#3b3f4a\"/><path d=\"M0.0 97.5 L0.0 109.0\" fill=\"none\" stroke=\"#3b3f4a\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"0.0,109.0 -4.2,100.7 4.2,100.7\" fill=\"#3b3f4a\"/><path d=\"M0.0 1 =\"0.0\" y=\"130.4\" font-family=\"Liberation Sans\",Arial,sans-serif font-size=\"13.5\" font-weight=\"600\" fill=\"#111111\" text-anchor=\"middle\">E'yi 40, C'yi 70 artır;</text><text x=\"0.0\" y=\"147.9\" font-family=\"Liberation Sans\",Arial,sans-serif font-size=\"13.5\" font-weight=\"600\" fill=\"#111111\" text-anchor=\"middle\">haftayı 1 artır</text><polygon points=\"0.0,171.0 60.1,194.8 0.0,218.5 -60.1,194.8\" fill=\"#d0ebff\" stroke=\"#3b3f4a\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"0.0\" y=\"199.6\" font-family=\"Liberation Sans\",Arial,sans-serif font-size=\"13.5\" font-weight=\"600\" fill=\"#111111\" text-anchor=\"middle\">C &gt; E mi?</text><path d=\"M-56.9 230.5 H56.9 V262.0 C31.9 246.4 5.7 260.7 0.0 265.9 S-34.1 278.9 -56.9 263.3 Z\" fill=\"#ffdeeb\" stroke=\"#3b3f4a\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"0.0\" y=\"251.4\" font-family=\"Liberation Sans\",Arial,sans-serif font-size=\"13.5\" font-weight=\"600\" fill=\"#111111\" text-anchor=\"middle\">Haftayı yazdır</text><ellipse cx=\"0.0\" cy=\"295.5\" rx=\"39.0\" ry=\"15.0\" fill=\"#fff3bf\" stroke=\"#3b3f4a\" stroke-width=\"1.5\"/><text x=\"0.0\" y=\"300.4\" font-family=\"Liberation Sans\",Arial,sans-serif font-size=\"13.5\" font-weight=\"600\" fill=\"#111111\" text-anchor=\"middle\">Bitir</text></svg>", "son": "", "k": "Buna göre, bu algoritma hangi sayıyı yazdırır?", "sec": ["6", "7", "5", "8"], "secg": null, "c": "B", "a": ["Her hafta aradaki fark 70 − 40 = 30 TL kapanır; başlangıçtaki fark 180 TL'dir.", "6. haftada E = C = 500 TL olur; 500 &gt; 500 yanlıştır, döngü sürer.", "7. haftada E = 540, C = 570 olur; 570 &gt; 540 doğrudur. 7 yazdırılır. (Eşitlenme haftası 260 + 40 · h = 80 + 70 · h denkleminin çözümüdür: 6.)"], "t": "6: eşitlenme haftası yazılmış; koşul “geçer” demektedir; 5: bir tur eksik; 8: bir tur fazla", "d": "Koşul “geçer” demektedir; iki paranın eşit olduğu hafta koşulu sağlamaz.", "ses": "b15"}, {"no": 16, "on": "<p>Bir oyun parkındaki tırmanm çocuk."], "t": "2: iki sınır değer de dışarıda sanılmış; 3: sınır değerlerden biri unutulmuş; 5: koşullardan yalnız biri denetlenmiş", "d": "“ve” ile bağlı iki koşulun ikisi de sağlanmalıdır. 110 cm ve 150 cm dâhildir.", "ses": "b16"}, {"no": 17, "on": "<p>Bir robot süpürge evdeki 6 odayı temizleyip şarj istasyonuna dönecektir. Robotun algoritması aşağıdaki akış şemasıyla verilmiştir. Robot çalıştırıldığında 6 odayı temizlemiş ama durmadan yeniden temizlemeye devam etmiştir.</p>", "g": "<svg viewBox=\"-161 0 277 280\" width=\"277\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><path d=\"M0.0 36.0 L0.0 47.5\" fill=\"none\" stroke=\"#3b3f4a\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"0.0,47.5 -4.2,39.2 4.2,39.2\" fill=\"#3b3f4a\"/><path d=\"M0.0 80.0 L0.0 91.5\" fill=\"none\" stroke=\"#3b3f4a\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"0.0,91.5 -4.2,83.2 4.2,83.2\" fill=\"#3b3f4a\"/><path d=\"M0.0 124.0 L0.0 135.5\" fill=\"none\" stroke=\"#3b3f4a\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"0.0,135.5 -4.2,127.2 4.2,127.2\" fill=\"#3b3f4a\"/><path d=\"M0.0 183.5 L0.0 195.0\" fill=\"none\" stroke=\"#3b3f4a\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"0.0,195.0 -4.2,186.7 4.2,186.7\" fill=\"#3b3f4a\"/><text x=\"7.0\" y=\"194.5\" font-family=\"Liberation Sans\",Arial,sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">Evet</text><path d=\"M0.0 227.5 L0.0 239.0\" fill=\"none\" stroke=\"#3b3f4a\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"0.0,239.0 -4.2,230.7 4.2,230.7\" fill=\"#3b3f4a\"/><path d=\"M-108.7 159.8 L-152.7 159.8 L-152.7 108.0 L-83.0 108.0\" fill=\"none\" stroke=\"#3b3f4a\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"-83.0,108.0 -91.3,103.8 -91.3,112.2\" fill=\"#3b3f4a\"/><text x=\"-114.7\" y=\"153.8\" font-family=\"Liberation Sans\",Arial,sans-serif font-size=\"13\" font-weight=\"700\ /* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
