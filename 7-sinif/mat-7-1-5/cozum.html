ource Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"start\">Ali</text><circle cx=\"166.0\" cy=\"144.0\" r=\"5\" fill=\"#6741d9\" stroke=\"#fff\" stroke-width=\"1.2\"/><text x=\"174.0\" y=\"137.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"start\">Bekir</text><circle cx=\"226.0\" cy=\"84.0\" r=\"5\" fill=\"#6741d9\" stroke=\"#fff\" stroke-width=\"1.2\"/><text x=\"234.0\" y=\"77.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"start\">Cemal</text></svg>", "son": "<p>Her ustanın noktasından başlangıç noktasına bir ışın çizildiğinde ışın dikey doğruya ne kadar yakınsa çay o kadar koyu olmaktadır.</p>", "k": "Buna göre, en koyu çayı demleyen usta ile en açık çayı demleyen usta aşağıdakilerin hangisinde birlikte verilmiştir?", "sec": ["Cemal Usta · Ali Usta", "Bekir Usta · Ali Usta", "Cemal Usta · Bekir Usta", "Ali Usta · Bekir Usta"], "secg": null, "c": "D", "a": ["Her ustanın bir bardak suya düşen çay miktarı: Ali 2 : 2 = 1, Bekir 3 : 4 = 3/4, Cemal 5 : 6 = 5/6 kaşık.", "Bir bardağa en çok çay Ali Usta'nın demliğinde düşer; ışını dikey doğruya en yakındır, çayı en koyudur.", "En az çay Bekir Usta'nınkinde düşer (3/4 = 9/12, 5/6 = 10/12); ışını yatay doğruya en yakındır, çayı en açıktır."], "t": "Cemal Usta en koyu: en çok çay kaşığı kullanan usta seçilmiş, miktar oran sanılmış; Bekir · Ali: koyu ve açık ters okunmuş", "d": "Koyuluk, kullanılan çay miktarına değil, bir bardak suya düşen çaya bağlıdır. En çok çay kullanan ustanın çayı en koyu olmayabilir.", "ses": "b10"}, {"no": 11, "on": "<p>Bir spor salonunda koşu bandında koşan Zeynep'in ekranında aşağıdaki değerler görünmektedir.</p>", "g": "<svg viewBox=\"0 0 336 92\" width=\"336\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"150\" height=\"76\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H150 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"83.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Süre</text><text x=\"83.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">25 dk.</text><rect x=\"172\" y=\"8\" width=\"150\" height=\"76\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M172 36 V16 q0 -8 8 -8 H314 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"247.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Mesafe</text><text x=\"247.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">4 km</text></svg>", "son": "<p>Zeynep, koşu bandında hiç durmadan aynı hızla koşmaya devam edecektir.</p>", "k": "Buna göre, Zeynep 10 km'yi koşmayı başlangıçtan itibaren kaç dakikada tamamlar?", "sec": ["40", "62,5", "31", "2,5"], "secg": null, "c": "B", "a": ["Kilometre başına süre: 25 : 4 = 6,25 dk./km.", "10 km için 10 · 6,25 = 62,5 dakika gerekir.", "Kontrol: 62,5 : 10 = 6,25 dk./km."], "t": "40: mesafe ile süre karıştırılıp 4 · 10 yapılmış; 31: 25'e 6 eklenmiş; 2,5: 10 : 4 yapılmış", "d": "Kilometre başına süreyi bulmak için süreyi kilometreye bölünüz. Sonucu istenen kilometreyle çarpınız; dakikaya ve kilometreye dikkat ediniz.", "ses": "b11"}, {"no": 12, "on": "<p>Bir markette aynı marka zeytinyağı dört farklı boyda şişede satılmaktadır. Raftaki şişelerin hacimleri ve fiyatları aşağıda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 560 92\" width=\"560\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"128\" height=\"76\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H128 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"72.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">0,5 L</text><text x=\"72.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">160 TL</text><rect x=\"146\" y=\"8\" width=\"128\" height=\"76\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M146 36 V16 q0 -8 8 -8 H266 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"210.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">1 L</text><text x=\"210.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">300 TL</text><rect x=\"284\" y=\"8\" width=\"128\" height=\"76\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M284 36 V16 q0 -8 8 -8 H404 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"348.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2 L</text><text x=\"348.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">580 TL</text><rect x=\"422\" y=\"8\" width=\"128\" height=\"76\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M422 36 V16 q0 -8 8 -8 H542 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"486.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">5 L</text><text x=\"486.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">1 500 TL</text></svg>", "son": "<p>Bir aile, litresi en ucuz olan şişeyi almak istemektedir.</p>", "k": "Buna göre, ailenin alacağı şişe hangisidir?", "sec": ["0,5 L", "5 L", "2 L", "1 L"], "secg": null, "c": "C", "a": ["Birim fiyatlar: 160 : 0,5 = 320 TL/L; 300 : 1 = 300 TL/L.", "580 : 2 = 290 TL/L; 1 500 : 5 = 300 TL/L.", "En küçük birim fiyat 290 TL/L'dir; 2 litrelik şişe alınır."], "t": "0,5 L: fiyatı en düşük şişe seçilmiş; 5 L: en büyük şişenin her zaman en ekonomik olduğu sanılmış; 1 L: 5 L ile aynı birim fiyatta olduğu için en ucuz sanılmış", "d": "En ekonomik şişe en ucuz şişe değil, litresi en ucuz olandır. 0,5 L'lik şişenin birim fiyatını bulurken fiyatı 0,5'e bölünüz.", "ses": "b12"}, {"no": 13, "on": "<p>Bir okulun lavabosundaki damlayan bir musluktan 1 saatte 0,6 L su boşa akmaktadır.</p>", "g": "<svg viewBox=\"0 0 252 92\" width=\"252\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"230\" height=\"76\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H230 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"123.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Damlayan musluk</text><text x=\"123.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">1 saatte 0,6 L</text></svg>", "son": "<p>Musluk tamir edilene kadar gece gündüz aynı biçimde damlamaya devam edecektir.</p>", "k": "Buna göre, musluk 30 gün boyunca tamir edilmezse kaç litre su boşa akar?", "sec": ["432", "18", "43,2", "360"], "secg": null, "c": "A", "a": ["Bir günde 24 saat vardır: 24 · 0,6 = 14,4 L su boşa akar.", "30 günde 30 · 14,4 = 432 L su boşa akar.", "Bu, 30 gün boyunca saatte 0,6 L'lik bir birim oranın sonucudur."], "t": "18: gün sayısı saat sayısı gibi kullanılmış, 30 · 0,6; 43,2: ondalık basamak yanlış yazılmış; 360: saatte 0,5 L alınmış", "d": "Saat başına verilen birim oranı önce bir güne (24 saat), sonra 30 güne çeviriniz. Gün ile saati karıştırmayınız.", "ses": "b13"}, {"no": 14, "on": "<p>Bir okulun satranç ve resim kulüplerinin her birinde 40 öğrenci vardır. Kulüplerdeki kız ve erkek öğrencilerin sayılarının oranları kartlarda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 456 116\" width=\"456\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"210\" height=\"100\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H210 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"113.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Satranç Kulübü</text><text x=\"113.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">40 öğrenci</text><text x=\"113.0\" y=\"88.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Kız : Erkek = 2 : 3</text><rect x=\"232\" y=\"8\" width=\"210\" height=\"100\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M232 36 V16 q0 -8 8 -8 H434 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"337.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Resim Kulübü</text><text x=\"337.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">40 öğrenci</text><text x=\"337.0\" y=\"88.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Kız : Erkek = 5 : 3</text></svg>", "son": "<p>Bir öğrenci yalnız bir kulübe üyedir.</p>", "k": "Buna göre, iki kulüpteki kız öğrencilerin toplam sayısı kaçtır?", "sec": ["7", "40", "39", "41"], "secg": null, "c": "D", "a": ["Satranç: her 2 + 3 = 5 öğrencinin 2'si kızdır; kızlar kulübün 2/5'idir: 40 · 2/5 = 16.", "Resim: her 5 + 3 = 8 öğrencinin 5'i kızdır; kızlar kulübün 5/8'idir: 40 · 5/8 = 25.", "Toplam kız öğrenci: 16 + 25 = 41."], "t": "7: oranların terimleri sayı sanılmış, 2 + 5; 40: kız öğrencilerin kulüplerin yarısı olduğu sanılmış; 39: erkek öğrencilerin toplamı bulunmuş", "d": "Oranın terimleri öğrenci sayısı değildir. Her kulüpte önce kızların kulübün kaçta kaçı olduğunu bulunuz, sonra 40 ile çarpınız.", "ses": "b14"}, {"no": 15, "on": "<p>Üç ortaokulun katıldığı bir fidan dikme kampanyasında okulların öğrenci sayıları ve diktikleri fidan sayıları aşağıdaki tabloda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 450 176\" width=\"450\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><text x=\"225.0\" y=\"18.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">Tablo: Fidan Dikme Kampanyası</text><rect x=\"10.0\" y=\"30.0\" width=\"430.0\" height=\"36.0\" rx=\"0\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.3\"/><text x=\"55.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">Okul</text><text x=\"185.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">Öğrenci sayısı</text><text x=\"355.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">Dikilen fidan</text><rect x=\"10.0\" y=\"66.0\" width=\"430.0\" height=\"34.0\" rx=\"0\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"55.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"1       const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
