en iki istasyon arasındaki 165 km'lik yolu 3/4 saatte almıştır. Trenin yolculuk bilgileri aşağıdaki kartlarda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 356 102\" width=\"356\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"160\" height=\"86\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H160 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"88.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Süre (saat)</text><g class=\"frac\"><text x=\"88.0\" y=\"61.9\" text-anchor=\"middle\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\">3</text><line x1=\"81.6\" y1=\"65.0\" x2=\"94.4\" y2=\"65.0\" stroke=\"#111111\" stroke-width=\"1.05\"/><text x=\"88.0\" y=\"77.3\" text-anchor=\"middle\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\">4</text></g><rect x=\"182\" y=\"8\" width=\"160\" height=\"86\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M182 36 V16 q0 -8 8 -8 H334 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"262.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Yol</text><text x=\"262.0\" y=\"69.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">165 km</text></svg>", "son": "<p>Tren bir sonraki yolculuğunda aynı hızla 2 saat yol alacaktır.</p>", "k": "Buna göre, tren bu yolculukta kaç kilometre yol alır?", "sec": ["440", "330", "220", "247,5"], "secg": null, "c": "A", "a": ["Saat başına yol için iki terim 3/4'e bölünür: 165 : 3/4 = 165 · 4/3 = 220 km/sa.", "2 saatte 2 · 220 = 440 km yol alınır.", "Kontrol: 440 km, 165 km'nin 8/3 katıdır; 2 saat de 3/4 saatin 8/3 katıdır."], "t": "330: 3/4 saat 1 saat sanılıp 165 · 2 yapılmış; 220: birim oran cevap sanılmış; 247,5: 165 · 3/2 yapılmış", "d": "Süre kesirle verildiğinde birim oran için yolu 3/4'e bölünüz; 3/4 ile çarpmayınız. 3/4 saat 1 saatten kısadır; saatte alınan yol 165 km'den fazla olmalıdır.", "ses": "b17"}, {"no": 18, "on": "<p>Bir kafede üç sürahide ayran hazırlanmıştır. Sürahilerdeki yoğurt ve su miktarları kartlarda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 554 112\" width=\"554\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"170\" height=\"96\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H170 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"93.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">1. sürahi</text><text x=\"93.0\" y=\"63.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">3 bardak yoğurt</text><text x=\"93.0\" y=\"86.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">2 bardak su</text><rect x=\"190\" y=\"8\" width=\"170\" height=\"96\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M190 36 V16 q0 -8 8 -8 H352 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"275.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2. sürahi</text><text x=\"275.0\" y=\"63.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">6 bardak yoğurt</text><text x=\"275.0\" y=\"86.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">4 bardak su</text><rect x=\"372\" y=\"8\" width=\"170\" height=\"96\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M372 36 V16 q0 -8 8 -8 H534 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"457.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">3. sürahi</text><text x=\"457.0\" y=\"63.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">4 bardak yoğurt</text><text x=\"457.0\" y=\"86.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">4 bardak su</text></svg>", "son": "<p>Kafede bazı sürahilerdeki ayranlar büyük bir kazanda birleştirilecektir. Bu durumla ilgili aşağıdaki ifadeler yazılmıştır.<div style=\"margin:1mm 0 1mm 2mm\"><div style=\"margin:.6mm 0\">I. 1. ve 2. sürahi birleştirilirse kazandaki ayran 1. sürahideki ayranla aynı tatta olur.</div><div style=\"margin:.6mm 0\">II. 1. ve 3. sürahi birleştirilirse kazandaki yoğurt miktarının su miktarına oranı 7 : 6 olur.</div><div style=\"margin:.6mm 0\">III. 2. ve 3. sürahi birleştirilirse kazandaki ayran 1. sürahideki ayranla aynı tatta olur.</div></div></p>", "k": "Buna göre, verilen ifadelerden hangileri doğrudur?", "sec": ["Yalnız I", "I ve II", "II ve III", "I, II ve III"], "secg": null, "c": "B", "a": ["1. sürahi 3 : 2, 2. sürahi 6 : 4 = 3 : 2; iki oran denktir. Birleşince 9 : 6 = 3 : 2 olur; tat aynıdır. I doğrudur.", "1. ve 3. sürahi: yoğurt 3 + 4 = 7, su 2 + 4 = 6; oran 7 : 6. II doğrudur.", "2. ve 3. sürahi: yoğurt 10, su 8; 10 : 8 = 5 : 4 ile 3 : 2 denk değildir. III yanlıştır; (a + c) : (b + d) kuralı yalnız denk oranlar için geçerlidir."], "t": "Yalnız I: II'deki toplamalar yapılmamış; III'ü içeren seçenekler: denk olmayan oranlar toplanınca da tadın korunacağı sanılmış", "d": "(a + c) : (b + d) kuralı yalnız denk oranlar için geçerlidir. Denk olmayan iki karışım birleşince yeni karışımın tadı ikisinden de farklı olur.", "ses": "b18"}, {"no": 19, "on": "<p>Bir markette raf etiketlerinde ürünlerin fiyatıyla birlikte birim fiyatları da yazılıdır. 400 g'lık peynir paketinin etiketinde paket fiyatının yazılı olduğu kısım yırtılmıştır.</p>", "g": "<svg viewBox=\"0 0 476 112\" width=\"476\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"220\" height=\"96\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H220 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"118.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Peynir · 400 g</text><text x=\"118.0\" y=\"63.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Paket fiyatı: ?</text><text x=\"118.0\" y=\"86.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">1 kg'ın fiyatı: 85 TL</text><rect x=\"242\" y=\"8\" width=\"220\" height=\"96\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M242 36 V16 q0 -8 8 -8 H454 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"352.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Peynir · 1 kg</text><text x=\"352.0\" y=\"74.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Paket fiyatı: 80 TL</text></svg>", "son": "<p>Ece aynı peynirden tam 2 kg alacaktır. Ece ya yalnız 400 g'lık paketlerden ya da yalnız 1 kg'lık paketlerden alabilir.</p>", "k": "Buna göre, Ece 400 g'lık paketleri alırsa 1 kg'lık paketleri almasına göre kaç TL fazla öder?", "sec": ["5", "2", "25", "10"], "secg": null, "c": "D", "a": ["400 g = 0,4 kg; 400 g'lık paketin fiyatı 0,4 · 85 = 34 TL'dir.", "2 kg için 5 tane 400 g'lık paket gerekir: 5 · 34 = 170 TL.", "2 kg için 2 tane 1 kg'lık paket: 2 · 80 = 160 TL. Fark 170 − 160 = 10 TL. (Birim fiyat farkı 85 − 80 = 5 TL/kg; 2 kg için 10 TL.)"], "t": "5: birim fiyat farkı 1 kg için bırakılmış; 2: 0,4 · 5 yapılmış; 25: birim fiyat farkı paket sayısıyla çarpılmış", "d": "400 g = 0,4 kg'dır; paket fiyatı birim fiyatın 0,4 katıdır. 2 kg için kaç paket gerektiğini bulup iki seçeneğin toplam tutarlarını karşılaştırınız.", "ses": "b19"}, {"no": 20, "on": "<p>Bir musluk dakikada 3 L su akıtmaktadır. Üç öğrenci bu musluğun birim oranıyla ilgili birer önerme sunmuştur.</p>", "g": "<svg viewBox=\"0 0 242 92\" width=\"242\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"220\" height=\"76\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H220 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"118.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Musluk</text><text x=\"118.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Dakikada 3 L su</text></svg>", "son": "<b>Ali:</b> “Bir birim oranda niceliklerden biri 1'e eşittir; 3 L su : 1 dakika bir birim orandır.”<br><b>Berk:</b> “Bu musluğun öbür birim oranı 3 dakika : 1 L sudur.”<br><b>Can:</b> “Musluk 4 dakikada 12 L su akıtır; süre kaç katına çıkarsa akan su da o katına çıkar.”", "k": "Buna göre, hangi öğrencilerin önermesi doğrudur?", "sec": ["Yalnız Ali", "Ali ve Berk", "Ali ve Can", "Berk ve Can"], "secg": null, "c": "C", "a": ["Ali: 3 L : 1 dk. oranında süre 1'dir; birim orandır. Doğrudur.", "Berk: 1 L su için iki terim 3'e bölünür: 1 dk. : 3 L = 1/3 dk. : 1 L. 1 L su 1/3 dakikada akar; 3 dakikada değil. Yanlıştır.", "Can: 4 dakikada 4 · 3 = 12 L; süre 4 katına çıkınca su da 4 katına çıkar. Doğrudur."], "t": "Ali ve Berk ile Berk ve Can: birim oranın tersi alınırken terimler ters bölünmüş; Yalnız Ali: Can'ın denk oran gerekçesi denenmemiş", "d": "Birim oranın tersini bulurken iki terim öbür niceliğe bölünür: 3 L : 1 dk. ise 1 L : 1/3 dk. olur. Her önermeyi ayrı ayrı sınayınız.", "ses": "b20"}]};
const $=s=>document.querySelector(s);$("#kod").textContent=V.kod;$("#bas").textContent=V.baslik+" · Çözümler";
const q=new URLSearchParams(location.search);const tek=["s","k","b"].find(x=>q.has(x));
const esc=s=>String(s);
function sesKutu(ad){return document.createComment("");}   /* 06.10.2026: ses kaldırıldı */
function adimAdim(kap,list,son){let i=0;const dd=document.createElement("div");dd.className="dug";
  const n=document.createElement("button");n.className="btn";n.type="button";const t=document.createElement("button");t.className="btn ghost";t.type="button";t.textContent="Bütün adımları göster";
  const ciz=()=>{n.textContent=i<list.length?`${i+1}. adımı göster (${list.length} adım)`:"Çözüm tamamlandı";n.disabled=i>=list.length;t.hidden=i>=list.length;};
  const ekle=()=>{const x=document.createElement("div");x.className="adim";x.innerHTML=`<b>${i+1}. adım</b> · ${list[i]}`;kap.insertBefore(x,dd);i++;if(i>=list.length&&son)son();ciz();};
  n.onclick=ekle;t.onclick=()=>{while(i<list.length)ekle();};dd.append(n,t);kap.appendChild(dd);ciz();}
function kartS(s){const k=document.createElement("section");k.className="kart";k.style.setProperty("--c","var(--ss)");k.id="s"+s.no;
  k.innerHTML=`<span class="et">SIRA SENDE · ${s.no}</span><h2>${s.bas}</h2>`;
  s.q.forEach((x,j)=>{const w=document.createElement("div");w.innerHTML=`<div class="soru"><b>${j+1}.</b> ${x.k}</div>`;k.appendChild(w);
    k.appendChild(sesKutu(`s${s.no}-${j+1}`));adimAdim(w,x.a,()=>{const c=document.createElement("p");c.className="cevap";c.innerHTML="<b>Cevap:</b> "+x.c;w.appendChild(c);});});return k;}
function kartK(s){const k=document.createElement("section");k.className="kart";k.style.setProperty("--c","var(--kk)");k.id="k"+s.no;
  k.innerHTML=`<span class="et">KALEM KÂĞIT · ${s.no}</span><h2>${s.bas}</h2><p>${s.yon}</p><table><thead><tr><th>SAYI</th><th>CEVAP</th></tr></thead><tbody>${s.r.map(r=>`<tr><td><b>${r.n}</b></td><td>${r.c}</td></tr>`).join("")}</tbody></table>`;return k;}
function kartB(s){const k=document.createElement("section");k.className="kart";k.style.setProperty("--c","var(--b)");k.id="b"+s.no;
  const L="ABCD";const sec=s.sec?`<ol class="sec">${s.sec.map((x,i)=>`<li class="${L[i]===s.c?"":""}" data-h="${L[i]}"><b>${L[i]})</b> ${x}</li>`).join("")}</ol>`:"";
  k.innerHTML=`<span class="et">${V.bet||"BAĞLAM TEMELLİ SORU"} · ${s.no}</span><h2>${window.CANL&&CANL[s.no]?"Canlandırın, deneyin, çözümü görün":"Adım adım çözüm"}</h2><div class="soru">${s.on||""}${s.g?`<div>${s.g}</div>`:""}${s.son||""}<p><b>${s.k}</b></p>${sec}${s.secg?'<p><i>Seçenekler kitaptaki görsellerdir.</i></p>':""}</div>`;
  let cozKap=k;
  if(window.CANL&&CANL[s.no]){const sek=document.createElement("div");sek.className="sek";sek.setAttribute("role","tablist");
    sek.innerHTML=`<button type="button" role="tab" aria-selected="true">▶ Canlandır ve dene<span class="yeni">YENİ</span></button><button type="button" role="tab" aria-selected="false">Adım adım çözüm</button>`;
    const p1=document.createElement("div");p1.className="cn";p1.setAttribute("role","tabpanel");const p2=document.createElement("div");p2.setAttribute("role","tabpanel");p2.hidden=true;
    k.append(sesKutu(s.ses),sek,p1,p2);let kur=false;const ac=i=>{sek.querySelectorAll("button").forEach((b,j)=>b.setAttribute("aria-selected",i===j));p1.hidden=i!==0;p2.hidden=i!==1;if(i===0&&!kur){kur=true;CANL[s.no](p1);}};
    sek.querySelectorAll("button").forEach((b,i)=>b.onclick=()=>ac(i));ac(q.get("g")==="cozum"?1:0);cozKap=p2;}
  if(cozKap===k)k.appendChild(sesKutu(s.ses));const w=document.createElement("div");cozKap.appendChild(w);
  adimAdim(w,s.a,()=>{const c=document.createElement("p");c.className="cevap";c.innerHTML=`<b>Doğru cevap:</b> ${s.c}`;w.appendChild(c);
    k.querySelectorAll("ol.sec li").forEach(li=>{if(li.dataset.h===s.c)li.classList.add("dogru");});
    if(s.t){const t=document.createElement("p");t.className="tuzak";t.innerHTML="<b>Diğer seçenekler neden yanlış?</b> "+s.t;w.appendChild(t);}});
  const d=document.createElement("div");d.className="dikkat";d.innerHTML=`<b>Dikkat!</b> ${s.d}`;cozKap.appendChild(d);return k;}
const ic=$("#ic");
const BOL=[["s","Sıra Sende",V.s,kartS],["k","Kalem Kâğıt",V.k,kartK],["b",V.bad||"Bağlam Soruları",V.b,kartB]].filter(x=>x[2].length);
if(tek&&BOL.some(x=>x[0]===tek)){const n=+q.get(tek);const [,,L,f]=BOL.find(x=>x[0]===tek);const s=L.find(x=>x.no===n)||L[0];ic.appendChild(f(s));$("#tum").hidden=false;$("#nav").remove();}
else{let akt=BOL[0][0];const nav=$("#nav");const ciz=()=>{ic.innerHTML="";nav.innerHTML=BOL.map(([k,a,L])=>`<button type="button" data-k="${k}" aria-pressed="${k===akt}">${a} (${L.length})</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{akt=b.dataset.k;ciz();});const [,,L,f]=BOL.find(x=>x[0]===akt);L.forEach(s=>ic.appendChild(f(s)));};ciz();}
</script></body></html>
