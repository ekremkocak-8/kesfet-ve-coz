<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* ANA_KURALLAR §4.y-3: Etkinliklerde bütün kesirler kesir çizgisiyle (alt alta pay/payda) gösterilir. Düz yazılmış a/b biçimleri otomatik dönüştürülür. */
(function(){
  if (window.__kesirCizgi) return; window.__kesirCizgi = 1;
  const RX = /(^|[^\w\/.,:%])([−-])?(?:(\d+) )?(\d{1,4})\/(\d{1,4})(?![\w\/.,]\d|\w)/g;
  const ATLA = "script,style,svg,textarea,input,select,code,.ilr,.frac,[data-duz]";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function donustur(kok){
    if (!kok || !kok.nodeType) return;
    if (kok.nodeType === 3) kok = kok.parentElement;
    if (!kok || (kok.closest && kok.closest(ATLA))) return;
    const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      if (!/\d\/\d/.test(t.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = t.parentElement; if (!p || p.closest(ATLA)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const L = []; let t; while ((t = w.nextNode())) L.push(t);
    L.forEach(t => {
      let deg = false;
      const h = esc(t.nodeValue).replace(RX, (m, a, s, tam, p, q) => { deg = true;
        return a + (s ? "−" : "") + (tam ? tam + " " : "") + '<span class="frac"><span>' + p + "</span><span>" + q + "</span></span>"; });
      if (!deg) return;
      const k = document.createElement("span"); k.innerHTML = h; t.replaceWith(...k.childNodes);
    });
  }
  let bekleyen = new Set(), plan = 0;
  const calis = () => { plan = 0; const b = bekleyen; bekleyen = new Set(); b.forEach(donustur); };
  const gozcu = new MutationObserver(ms => { ms.forEach(m => {
      if (m.type === "characterData") bekleyen.add(m.target); else m.addedNodes.forEach(n => bekleyen.add(n)); });
    if (!plan) plan = requestAnimationFrame(calis); });
  const bas = () => { donustur(document.body); gozcu.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bas); else bas();
  const st = document.createElement("style");
  st.textContent = ".frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}.frac>span{display:block;text-align:center;padding:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor}";
  document.head.appendChild(st);
})();

/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {

    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });

    async function dagit(k) {

      const kolon = Math.min(k, 6), satirK = Math.ceil(k / kolon), gw = kolon * 14 + 16, gh = satirK * 14 + 26;

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */
  function ATLA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Sonuç"] });
    let k = o.k, L = o.son; const W = 660, sol = 22, sag = 22, sk = (W - sol - sag) / L;

    const bA = dug("▶ Oynat"), bB = dug("+1 " + (o.adimAd || "adım"), "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bB, bS);
    let kA = null;
    if (o.kSec) { kA = adimci(o.kEtiket || "Adım:", 2, Math.floor(L / 2), k, v => { k = v; sifirla(); }); kut.prepend(kA.w); }

    const bT = dug(o.testDugme || "Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test);
    const ti = test.querySelector("input");
    function taban() {
      let sv = `<line x1="${sol}" y1="62" x2="${sol + L * sk}" y2="62" class="cn-ek"/>`;

      for (let v = 0; v <= L; v += adimT) sv += `<line x1="${sol + v * sk}" y1="${v % et ? 58 : 54}" x2="${sol + v * sk}" y2="66" class="cn-ek"/>` + (v % et ? "" : `<text x="${sol + v * sk}" y="82" text-anchor="middle" class="cn-et">${o.etYaz ? o.etYaz(v) : v}</text>`);
      sv += `<line x1="${sol + L * sk}" y1="30" x2="${sol + L * sk}" y2="70" class="cn-sinir"/><text x="${sol + L * sk}" y="24" text-anchor="end" class="cn-et">${o.sonEt || L}</text>`;

    }

      izle.forEach((v, i) => {

        sv += `<path d="M${x1} 62 Q${(x1 + x2) / 2} ${yy} ${x2} 62" class="cn-yay"/><circle cx="${x2}" cy="62" r="4.5" class="${o.renk ? o.renk(v, i + 1) : "cn-o"}"/>`;
        if (izle.length <= 14 || i === izle.length - 1 || i % Math.ceil(izle.length / 10) === 0) sv += `<text x="${x2}" y="${98}" text-anchor="middle" class="cn-et2">${v}</text>`;
      });

      const son = izle.length ? izle[izle.length - 1] : 0, ix = sol + son * sk;
      sv += `<text x="${ix}" y="50" text-anchor="middle" class="cn-kis">${o.simge || "●"}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W} 104" role="img" aria-label="${k} birimlik adımlarla ilerleme">${sv}</svg>`;
    }
    const ileri = () => {
      const v = (n + 1) * k;
      if (v > L) { durdur(); s.dur.innerHTML = `<span class="kotu">■</span> Sonraki ${o.adimAd || "adım"} ${k} ${x} ${n + 1} = <b>${v}</b> olurdu; bu ${E(L,"den")} büyük. ${o.bitti ? o.bitti(n, k, L) : `Toplam ${n} ${o.adimAd || "adım"}; son değer ${n * k}.`}`; if (!izle.length) ciz(); return false; }
      n++; izle.push(v); ciz(); s.dur.innerHTML = o.durum ? o.durum(n, v, k) : `${n}. ${o.adimAd || "adım"}: ${k} ${x} ${n} = <b>${v}</b>`; return true;

      s.dur.innerHTML = m; s.yaz("t" + v, [v, r === 0 ? (ic ? `${k} ${x} ${b} ✔` : `${k} ${x} ${b} (sınır dışı)`) : `kalan ${r} ✘`], r === 0 && ic);

  }

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || [o.kAd || "k", "Boyanan", "En büyük"] });
    let k = o.k || 2, son = o.son;
    const kut = h("div", "cn-satir");

    if (o.sonSec) { const sw = h("div", "cn-hazir"); o.sonSec.forEach(v => { const b = dug(v + " gün", "ghost"); b.onclick = () => { son = v; kur(); temiz(); }; sw.appendChild(b); }); s.den.append(kut, sw); }

      const g = h("div", "cn-izg" + (o.takvim ? " cn-tak" : "")); g.style.gridTemplateColumns = `repeat(${o.sutunSay},1fr)`;

    function temiz() { hucre.forEach(c => c && c.classList.remove("on", "yeni")); s.dur.innerHTML = o.ilk || "Sayıyı seçip Boya düğmesine basın."; }

      }

      s.yaz(k + ":" + son, o.satir ? o.satir(k, say, enb, son) : [k, say, enb], o.iyi ? o.iyi(k, say, enb, son) : null);
      calis = false; bB.disabled = false;

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */
  function ASANSOR(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Açık asansörler", "Gidilen kat", "Gidilemeyen kat"] });
    const ac = o.asansor.map(() => false);
    const kut = h("div", "cn-satir"); const bt = o.asansor.map((a, i) => { const b = dug(a.ad, "ghost"); b.style.setProperty("--ac", a.renk); b.setAttribute("aria-pressed", "false"); b.onclick = () => { ac[i] = !ac[i]; b.setAttribute("aria-pressed", ac[i]); ciz(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    function ciz() {
      let sv = ""; const H = o.kat * 17 + 40; let git = 0, gitme = [];
      for (let f = o.kat; f >= 0; f--) {

        sv += `<rect x="60" y="${y}" width="150" height="15" rx="2" class="${f === 0 ? "cn-zem" : herhangi ? "cn-katon" : (ac.some(Boolean) ? "cn-katoff" : "cn-kat")}"/><text x="52" y="${y + 12}" text-anchor="end" class="cn-et">${f === 0 ? "Z" : f}</text>`;
        o.asansor.forEach((a, i) => { if (dur[i]) sv += `<circle cx="${230 + i * 22}" cy="${y + 7.5}" r="6" fill="${a.renk}"/>`; });
      }
      s.sah.innerHTML = `<svg viewBox="0 0 300 ${H}" style="max-height:440px" role="img" aria-label="${o.kat} katlı bina">${sv}</svg>`;
      const acik = o.asansor.filter((a, i) => ac[i]).map(a => a.ad);

      s.yaz(acik.join("+"), [acik.join(" + "), git, gitme.length], null);

    ciz();
  }

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */
  function SAAT(el, o) {

      let onc = null, snr = null;
      for (let m = bas; m <= bit + ara; m += ara) { if (m <= var_) onc = m; if (m >= var_ && snr == null) snr = m; if (m <= bit) sv += `<text x="${20 + (m - bas) * sk}" y="40" text-anchor="middle" class="cn-bus">🚌</text>`; }

      if (snr != null && snr <= bit + ara) { const sx = 20 + (Math.min(snr, bit) - bas) * sk; sv += `<path d="M${vx} 56 L${sx} 56" class="cn-bek"/>`; }

      const gec = var_ - bas;
      s.dur.innerHTML = `${o.kisi} durağa ${saDa(var_)} geliyor: ilk seferden <b>${gec} dakika</b> sonra. Seferler ${E(ara,"in")} katı olan dakikalarda: ${ara} ${x} ${Math.floor(gec / ara)} = ${Math.floor(gec / ara) * ara}` + (gec % ara ? `, ${ara} ${x} ${Math.floor(gec / ara) + 1} = ${(Math.floor(gec / ara) + 1) * ara}. Sonraki otobüs ${saDa(snr)}; bekleme <b>${snr - var_} dakika</b>.` : `. Tam sefer saatinde geldi; bekleme <b>0 dakika</b>.`);
      s.yaz(ara + ":" + var_, [ara + " dk", sa(var_), sa(onc), sa(snr), (snr - var_) + " dk"], null);
    }
    ciz();
  }

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Çarpanlar", "Çarpan sayısı"] });
    let N = o.N || o.hazir[0]; let bul = new Set(), denendi = new Set();
    const kut = h("div", "cn-satir");
    const sA = adimci("Sayı:", 2, o.max || 200, N, v => { N = v; yeni(); });
    kut.appendChild(sA.w);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => sA.ayarla(n); hz.appendChild(b); }); kut.appendChild(hz); }
    s.den.appendChild(kut);
    const bolen = h("div", "cn-satir cn-test"); bolen.innerHTML = `<label>Bölen deneyin: <input type="number" inputmode="numeric" min="1"></label>`;
    const bD = dug("Böl"), bS = dug("Sıradakini dene", "ghost"); bolen.append(bD, bS); s.den.appendChild(bolen);
    const bi = bolen.querySelector("input");
    let bK = null; if (o.katlar) { bK = dug(o.katDugme || "Katlarını say ▶", "ghost"); s.den.appendChild(bK); }
    const ciftler = h("div", "cn-cift"); const katlar = h("div", "cn-katlar");
    function yeni() { bul = new Set(); denendi = new Set(); ciz(); s.dur.innerHTML = `${N} sayısını 1, 2, 3, … sayılarına bölerek çarpan çiftlerini bulun.`; katlar.textContent = ""; }
    function ciz() {
      const L = [...bul].sort((a, b) => a - b);
      s.sah.innerHTML = ""; const kartlar = h("div", "cn-kartlar");
      L.forEach(v => kartlar.appendChild(h("span", "cn-kart" + (v * v === N ? " kare" : ""), v)));
      if (!L.length) kartlar.appendChild(h("span", "cn-bosk", "Henüz çarpan bulunmadı"));
      s.sah.append(kartlar, ciftler, katlar);
      ciftler.innerHTML = L.filter(v => v * v <= N).map(v => `<span>${v} ${x} ${N / v}${v * v === N ? " <i>(aynı sayı: bir kez yazılır)</i>" : ""}</span>`).join("");
    }
    const tamamMi = () => { for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) return false; return true; };
    const eksik = () => { const L = []; for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) L.push(i); return ` <br>Henüz denenmeyen küçük bölenler var: <b>${L.join(", ")}</b>. Bunları da deneyin.`; };
    function dene(d) {
      if (!d || d < 1) return; denendi.add(d);
      const b = Math.floor(N / d), r = N % d;
      if (d > N) { s.dur.innerHTML = `${d} > ${N}: ${E(N,"den")} büyük sayı ${E(N,"in")} çarpanı olamaz.`; return; }
      if (r === 0) { bul.add(d); bul.add(b); ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${N} : ${d} = ${b}, kalan 0 → <b>${d} ${x} ${b} = ${N}</b>. ${d} ve ${b} çarpandır.` + (d * d >= N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} ${d * d === N ? "=" : ">"} ${N}. Artık yeni çift çıkmaz; bütün çarpanlar bulundu.` : eksik() : ""); }
      else { s.dur.innerHTML = `<span class="kotu">✘</span> ${N} : ${d} işleminde bölüm ${b}, <b>kalan ${r}</b>. ${d}, ${E(N,"in")} çarpanı değildir.` + (d * d > N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} > ${N}. Daha büyük bölen denemeye gerek yok; çarpan listesi tamam.` : eksik() : ""); }
      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));
      if (tamam) s.yaz("n" + N, [N, [...bul].sort((a, b) => a - b).join(", "), bul.size], true);
    }
    bD.onclick = () => dene(Math.round(+bi.value));
    bS.onclick = () => { let d = 1; while (denendi.has(d)) d++; bi.value = d; dene(d); };
    if (bK) bK.onclick = async () => {
      bK.disabled = true; katlar.textContent = ""; const sat = h("div", "cn-katsat"); katlar.append(h("b", "", `${E(N,"in")} katları: `), sat);
      for (let i = 1; i <= (o.katSay || 12); i++) { sat.appendChild(h("span", "cn-kat2", `${N * i}`)); await bekle(220); }
      sat.appendChild(h("span", "cn-sonsuz", "… ve sonsuza kadar sürer"));
      bK.disabled = false;
    };
    yeni();
  }

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */
  function KUMBARA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Para", "Sonuç"] });
    const k = o.k; let hafta = 0, tmr = null;
    const kut = h("div", "cn-satir"); const bA = dug("Bir hafta geçsin +"), bO = dug("▶ Haftaları oynat", "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bO, bS); s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Kumbarada şu para olabilir mi? <input type="number" inputmode="numeric" min="1" max="500"> TL</label>`;
    const bT = dug("Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test); const ti = test.querySelector("input");
    function ciz() {
      const top = hafta * k, sv = [];
      const yuk = Math.min(150, top * 1.4);
      sv.push(`<rect x="110" y="20" width="120" height="160" rx="22" class="cn-kum"/><rect x="150" y="14" width="40" height="8" rx="3" class="cn-kum2"/>`);
      sv.push(`<rect x="116" y="${176 - yuk}" width="108" height="${yuk}" rx="10" class="cn-para"/>`);
      sv.push(`<text x="170" y="110" text-anchor="middle" class="cn-buyuk">${top} TL</text><text x="170" y="134" text-anchor="middle" class="cn-et">${hafta}. hafta</text>`);
      let cizgi = ""; for (let i = 1; i <= hafta && i <= 16; i++) cizgi += `<text x="${260 + ((i - 1) % 4) * 52}" y="${40 + Math.floor((i - 1) / 4) * 34}" class="cn-et2">${k}${x}${i}=${k * i}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 480 190" role="img" aria-label="Kumbara">${sv.join("")}${cizgi}</svg>`;
      s.dur.innerHTML = hafta ? `${hafta}. hafta sonunda kumbarada ${k} ${x} ${hafta} = <b>${top} TL</b> var.` : `Kumbara boş. Her hafta ${k} TL atılıyor.`;
    }
    bA.onclick = () => { hafta++; ciz(); };
    bO.onclick = () => { if (tmr) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } bO.textContent = "❚❚ Durdur"; tmr = setInterval(() => { if (hafta >= 15) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } hafta++; ciz(); }, az ? 50 : 500); };
    bS.onclick = () => { hafta = 0; ciz(); };
    bT.onclick = () => {
      const v = Math.round(+ti.value); if (!v) return; const b = Math.floor(v / k), r = v % k;
      s.dur.innerHTML = r ? `<span class="kotu">✘</span> ${k} ${x} ${b} = ${k * b} TL, ${k} ${x} ${b + 1} = ${k * (b + 1)} TL. ${v} TL arada kalır (${v} : ${k} → kalan ${r}). Kumbarada hiçbir hafta ${v} TL olmaz.`
        : `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · ${b}. hafta sonunda kumbarada tam ${v} TL olur.`;
      if (!r) { hafta = b; ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · <b>${b}. hafta</b> sonunda kumbarada tam ${v} TL olur.`; }
      s.yaz("t" + v, [v + " TL", r ? `kalan ${r} ✘` : `${k} ${x} ${b} ✔`], !r);
    };
    ciz();
  }

  /* 9) ÖNERME LABORATUVARI: önermeyi farklı sayılarla sınama */
  function ONERME(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Önerme", "Sayı", "Sonuç"] });
    let akt = 0; const kut = h("div", "cn-hazir");
    const bt = o.onermeler.map((on, i) => { const b = dug(on.ad, "ghost"); b.setAttribute("aria-pressed", i === 0); b.onclick = () => { akt = i; bt.forEach((x, j) => x.setAttribute("aria-pressed", j === i)); goster(); }; kut.appendChild(b); return b; });

    const bT = dug("Sına"), bR = dug("Rastgele sayı", "ghost"); test.append(bT, bR); s.den.appendChild(test); const ti = test.querySelector("input");
    function goster() { s.sah.innerHTML = `<div class="cn-onr"><b>${o.onermeler[akt].ad}:</b> “${o.onermeler[akt].metin}”</div>`; s.dur.innerHTML = "Bir sayı yazıp Sına düğmesine basın. Önerme her sayıda doğru mu?"; }
    function sina(n) {
      const on = o.onermeler[akt], r = on.sina(n);
      s.sah.innerHTML = `<div class="cn-onr"><b>${on.ad}:</b> “${on.metin}”</div><div class="cn-kanit">${r.goster}</div>`;
      s.dur.innerHTML = (r.ok ? `<span class="iyi">✔</span> ${n} için önerme doğru.` : `<span class="kotu">✘</span> ${n} için önerme yanlış! Bir karşı örnek bulundu.`) + (r.not ? " " + r.not : "");

  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →
     koşullar tek tek denetlenir (✔/✘) → deney defterine yazılır. Doğru cevap verilmez; öğrenci uygun girdiyi kendisi arar.
     o.girdi: [{ad, min, max, bas} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → SVG/HTML · o.kosullar: [{ad, f(v) → bool | {ok, not}}]
     o.dugme: düğme yazısı (false → her değişiklikte denetlenir) · o.sonuc(v, hepsi, L) · o.satir(v, hepsi, L) · o.iyi(v, L) · o.ek: [{ad, deger(v) → v}] */
  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);
      s.dur.innerHTML = m;
      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);
    }
    kur = true; ciz();
    if (bS) s.dur.innerHTML = o.ilk || "Değerleri seçip Sına düğmesine basın."; else sina();
  }

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

/* MAT.7.1.5 · Oran — bağlam sorularının "Canlandır" düzenekleri (06.10.2026) — ortak motor: canlandir.js (CN.KOSUL); yeni motor yok.
   Her düzenek: öğrenci seçim düğmeleri ya da − / + sayaçlarıyla durumu değiştirir → sahne anında çizilir → koşullar denetlenir →
   deneme deney defterine yazılır → yeniden dener. Doğru cevap bir düğmeyle verilmez; denemelerden çıkar (§4.k, §19-10).
   Birimsiz oranlar "2 : 3" biçiminde; kesirler metinde a/b yazılır, kesir_cizgi.js üst üste çizer (SVG içinde kesir kullanılmaz). */
window.CANL = (() => {
  if (!document.getElementById("c715-stil")) { const st = document.createElement("style"); st.id = "c715-stil";
    st.textContent = ".cn-btn{min-width:44px;min-height:44px}.cn-adimci button{min-width:44px;min-height:44px}.c715-k{text-align:center;font-size:17px;font-weight:800;margin:8px auto;max-width:640px;line-height:1.6}"; document.head.appendChild(st); }
  const M = "−", gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const O = (a, b) => `${a} : ${b}`, S = (a, b) => { const g = gcd(a, b); return O(a / g, b / g); };
  const K = (p, q) => { const g = gcd(p, q); p /= g; q /= g; return q === 1 ? String(p) : `${p}/${q}`; };
  const D = v => String(Math.round(v * 1000) / 1000).replace(".", ",");
  const svg = (w, h, ic, ad) => `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;height:auto;display:block;margin:0 auto" role="img" aria-label="${ad}">${ic}</svg>`;
  const tx = (x, y, s, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.an || "middle"}" style="font-size:${o.fs || 14}px;font-weight:800;fill:${o.r || "#1d2433"}">${s}</text>`;
  const kutu = h => `<div class="c715-k">${h}</div>`;
  /* yatay çubuklar: [[ad, değer, renk]] (aynı ölçek) */
  function cubuklar(L, W = 380, olc) { const mx = olc || Math.max(...L.map(x => x[1])), u = (W - 190) / mx; let s = "";
    L.forEach(([ad, v, r], i) => { const y = 14 + i * 44; s += tx(8, y + 22, ad, { an: "start", fs: 13 }) + `<rect x="130" y="${y}" width="${Math.max(2, v * u)}" height="30" rx="5" fill="${r}" stroke="#495057" stroke-opacity=".5"/>` + tx(138 + v * u, y + 21, D(v), { an: "start", fs: 13 }); });
    return svg(W, 22 + L.length * 44, s, "Çubuklar"); }
  /* eş kutulu çubuk diyagramı: [[ad, kutu sayısı, renk]], kutunun değeri u */
  function kutular(L, u, W = 400) { const kw = Math.min(46, (W - 170) / Math.max(...L.map(x => x[1]))); let s = "";
    L.forEach(([ad, n, r], i) => { const y = 12 + i * 46; s += tx(8, y + 22, ad, { an: "start", fs: 13 });
      for (let j = 0; j < n; j++) s += `<rect x="${118 + j * kw}" y="${y}" width="${kw}" height="32" fill="${r}" stroke="#495057"/>` + tx(118 + j * kw + kw / 2, y + 21, u, { fs: 13 });
      s += tx(126 + n * kw, y + 21, `= ${n * u}`, { an: "start", fs: 13 }); });
    return svg(W, 20 + L.length * 46, s, "Çubuk diyagramı"); }
  /* grafik: başlangıç noktasından ışınlar [[x, y, renk, ad, kalın]] */
  function isinlar(L, mx, my, xad, yad, W = 360) { const Hh = 300, l = 40, b = Hh - 34, u = Math.min((W - l - 70) / mx, (b - 30) / my), X = v => l + v * u, Y = v => b - v * u; let s = "";
    for (let i = 0; i <= mx; i++) for (let j = 0; j <= my; j++) s += `<circle cx="${X(i)}" cy="${Y(j)}" r="1.8" fill="#adb5bd"/>`;
    s += `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(mx) + 12}" y2="${Y(0)}" stroke="#495057" stroke-width="2"/><line x1="${X(0)}" y1="${Y(0)}" x2="${X(0)}" y2="${Y(my) - 12}" stroke="#495057" stroke-width="2"/>`;
    s += tx(X(mx) + 14, Y(0) + 20, xad, { an: "end", fs: 12 }) + tx(X(0) + 4, Y(my) - 16, yad, { an: "start", fs: 12 });
    for (let i = 0; i <= mx; i++) s += tx(X(i), Y(0) + 16, i, { fs: 11 }); for (let j = 1; j <= my; j++) s += tx(X(0) - 8, Y(j) + 4, j, { an: "end", fs: 11 });
    L.forEach(([x, y, r, ad, kal]) => { const t = Math.min(mx / x, my / y); s += `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(x * t)}" y2="${Y(y * t)}" stroke="${r}" stroke-width="${kal ? 4 : 2}" opacity="${kal ? 1 : .45}"/><circle cx="${X(x)}" cy="${Y(y)}" r="6" fill="${r}"/>` + tx(X(x * t) + 4, Y(y * t) - 6, ad, { an: "start", fs: 13, r }); });
    return svg(W, Hh, s, "Işın grafiği"); }
  /* çift sayı doğrusu */
  function cift(ust, alt, ua, aa, isaret, W = 400) { const L = 96, R = W - 24, mx = Math.max(...ust), X = v => L + v / mx * (R - L); let s = tx(6, 40, ua, { an: "start", fs: 13 }) + tx(6, 104, aa, { an: "start", fs: 13 });
    s += `<line x1="${L}" y1="36" x2="${R}" y2="36" stroke="#1c7ed6" stroke-width="2.5"/><line x1="${L}" y1="100" x2="${R}" y2="100" stroke="#e8590c" stroke-width="2.5"/>`;
    ust.forEach((v, i) => { s += `<line x1="${X(v)}" y1="30" x2="${X(v)}" y2="42" stroke="#495057" stroke-width="2"/><line x1="${X(v)}" y1="94" x2="${X(v)}" y2="106" stroke="#495057" stroke-width="2"/>` + tx(X(v), 24, D(v), { fs: 13 }) + tx(X(v), 124, D(alt[i]), { fs: 13 }); });
    if (isaret != null) s += `<line x1="${X(isaret)}" y1="36" x2="${X(isaret)}" y2="100" stroke="#2b8a3e" stroke-width="3" stroke-dasharray="6 4"/>`;
    return svg(W, 134, s, "Çift sayı doğrusu"); }
  const KO = (el, o) => CN.KOSUL(el, Object.assign({ dugme: false }, o));

  return {
    /* 1 · Fidanlar: fark mı, kat mı? */
    1: el => { const F = { "A fidanı": [40, 60], "B fidanı": [90, 120] }, SO = ["Kaç cm uzadı?", "Boyu kaç katına çıktı?"];
      const deg = (f, s) => { const [a, b] = F[f]; return s === SO[0] ? b - a : b / a; };
      return KO(el, { girdi: [{ ad: "Fidan:", sec: Object.keys(F), bas: "A fidanı" }, { ad: "Soru:", sec: SO, bas: SO[0] }],
        ciz: v => { const [a, b] = F[v[0]]; return cubuklar([["Geçen yıl", a, "#d3f9d8"], ["Bu yıl", b, "#69db7c"]], 380, 130) +
          kutu(v[1] === SO[0] ? `${v[0]}: ${b} − ${a} = <b>${b - a} cm</b> uzadı.` : `${v[0]}: ${b} : ${a} = <b>${K(b, a)}</b> katına çıktı.`); },
        kosullar: [{ ad: v => `Bu soruda ${v[0]} öbür fidandan daha büyük sonuç veriyor.`, f: v => { const o = v[0] === "A fidanı" ? "B fidanı" : "A fidanı"; return deg(v[0], v[1]) > deg(o, v[1]); } }],
        sutun: ["Fidan", "Soru", "Sonuç"], satir: v => [v[0], v[1], v[1] === SO[0] ? `${deg(v[0], v[1])} cm` : `${K(F[v[0]][1], F[v[0]][0])} katı`],
        yon: "Fidanı ve soruyu değiştirerek dört durumu da deneyin. Her denemede hangi fidanın daha büyük sonuç verdiğine bakın; toplamsal ve çarpımsal karşılaştırmanın farklı fidanları öne çıkardığını defterden görün.",
        bitis: "Dört durumu da denediğinizde ve hangi soruda hangi fidanın öne çıktığını bulduğunuzda." }); },

    /* 2 · Manav: parça–bütün */
    2: el => { const C = ["Biber : Domates", "Biber : Patlıcan", "Biber : Domates ve patlıcan", "Biber : Bütün kasalar"], B = [9, 5, 14, 20];
      return KO(el, { girdi: [{ ad: "Karşılaştırma:", sec: C, bas: C[0] }],
        ciz: v => { const i = C.indexOf(v[0]); return cubuklar([["Domates", 9, "#ffa8a8"], ["Biber", 6, "#8ce99a"], ["Patlıcan", 5, "#d0bfff"]], 380, 10) + kutu(`Oran: 6 : ${B[i]} = <b>${S(6, B[i])}</b>`); },
        kosullar: [{ ad: "Bu oran bir parça–bütün oranıdır (ikinci terim bütün kasalardır).", f: v => v[0] === C[3] }],
        sutun: ["Karşılaştırma", "Oran", "En sade"], satir: v => { const i = C.indexOf(v[0]); return [v[0], O(6, B[i]), S(6, B[i])]; },
        yon: "Biberleri farklı kasalarla karşılaştırın. Hangisinde ikinci terimin bütün kasalar olduğuna dikkat edin ve oranı en sade hâliyle okuyun.", bitis: "Parça–bütün oranını bulduğunuzda." }); },

    /* 3 · Oran kartları: birimli mi? */
    3: el => { const C = { "1. kart": ["14 kız", "16 erkek", false, "14 : 16 = 7 : 8"], "2. kart": ["18 L su", "3 dakika", true, "6 L/dk."], "3. kart": ["240 cm perde", "2 m pencere", false, "240 cm : 200 cm = 6 : 5"], "4. kart": ["940 TL", "20 L benzin", true, "47 TL/L"] };
      return KO(el, { girdi: [{ ad: "Kart:", sec: Object.keys(C), bas: "1. kart" }],
        ciz: v => { const c = C[v[0]]; return kutu(`${v[0]}: ${c[0]} ile ${c[1]}<br>${c[2] ? "Birimler farklı türdedir." : "Birimler aynı türdendir; gerekirse aynı birime çevrilir."}<br>Oran: <b>${c[3]}</b>`); },
        kosullar: [{ ad: v => `${v[0]} birimli bir orandır.`, f: v => C[v[0]][2] }],
        sutun: ["Kart", "Oran", "Birimli mi?"], satir: v => [v[0], C[v[0]][3], C[v[0]][2] ? "birimli" : "birimsiz"],
        yon: "Kartları tek tek seçin; her kartın oranı ve birimli olup olmadığı deftere yazılır. Defterde kaç birimli oran olduğunu sayın.", bitis: "Dört kartı da incelediğinizde." }); },

    /* 4 · Geri dönüşüm panosu */
    4: el => { const Y = ["Her 1 kg cam atıktan 2,5 şişe üretilir.", "Her şişe için 2,5 kg cam atık gerekir.", "Toplam 2,5 kg cam atık toplanmıştır.", "Her şişe 2,5 kg gelir."];
      return KO(el, { girdi: [{ ad: "Cam atık (kg):", sec: ["2", "100", "600", "1 000"], bas: "600" }, { ad: "Yorum:", sec: Y, bas: Y[1] }],
        ciz: v => { const kg = +v[0].replace(" ", ""); return kutu(`${v[0]} kg cam atık → ${D(kg * 2.5)} şişe<br>Şişe : kg = ${D(kg * 2.5)} : ${v[0]} = <b>2,5 : 1</b> (2,5 şişe/kg)`); },
        kosullar: [{ ad: "Seçilen yorum, şişe/kg oranının anlamına uyuyor.", f: v => v[1] === Y[0] }],
        sutun: ["Cam atık", "Şişe", "Yorum", "Uygun mu?"], satir: (v, ok) => [`${v[0]} kg`, D(+v[0].replace(" ", "") * 2.5), v[1], ok ? "uygun" : "uygun değil"],
        yon: "Cam atık miktarını değiştirin; kilogram başına şişe sayısının hep 2,5 kaldığını görün. Sonra yorumları tek tek seçip hangisinin bu oranı doğru anlattığını bulun.", bitis: "Doğru yorumu bulduğunuzda." }); },

    /* 5 · Limonata tarifi */
    5: el => KO(el, { girdi: [{ ad: "Su (su bardağı)", min: 5, max: 25, bas: 5 }],
        ciz: v => { const k = v[0] / 5; return kutu(`Su ${v[0]} bardak → tarifin ${K(v[0], 5)} katı<br>Limon: 4 · ${K(v[0], 5)} = <b>${K(4 * v[0], 5)}</b> &nbsp; Şeker: 6 · ${K(v[0], 5)} = <b>${K(6 * v[0], 5)} kaşık</b>`); },
        kosullar: [{ ad: "Sürahideki su 15 su bardağıdır.", f: v => v[0] === 15 }],
        sutun: ["Su", "Kaç katı?", "Limon", "Şeker"], satir: v => [v[0], K(v[0], 5), K(4 * v[0], 5), K(6 * v[0], 5)],
        yon: "Su miktarını − / + ile değiştirin; bütün malzemeler aynı katta artar. 15 bardak suya gelince gereken şekeri okuyun.", bitis: "15 su bardağı suyla hesap yaptığınızda." }),

    /* 6 · Bisiklet dişlileri: en sade oran */
    6: el => KO(el, { girdi: [{ ad: "İki terimi böl:", sec: ["2", "3", "4", "6", "12"], bas: "2" }],
        ciz: v => { const n = +v[0]; return kutu(`48 : 36 → iki terim ${n}'${{ 2: "ye", 3: "e", 4: "e", 6: "ya", 12: "ye" }[n]} bölünür → <b>${O(48 / n, 36 / n)}</b><br>Terimlerin ortak böleni: ${gcd(48 / n, 36 / n) === 1 ? "yalnız 1" : `1 ve ${gcd(48 / n, 36 / n)}`}`); },
        kosullar: [{ ad: "Elde edilen oranın terimleri aralarında asaldır (en sade hâl).", f: v => gcd(48 / +v[0], 36 / +v[0]) === 1 }],
        sutun: ["Bölen", "Oran", "En sade mi?"], satir: (v, ok) => [v[0], O(48 / +v[0], 36 / +v[0]), ok ? "evet" : "hayır"],
        yon: "48 : 36 oranının terimlerini farklı sayılara bölün. Hangi bölmede terimlerin 1'den başka ortak böleni kalmadığına bakın.", bitis: "En sade oranı bulduğunuzda." }),

    /* 7 · Kermes: çubuk diyagramı */
    7: el => KO(el, { girdi: [{ ad: "1 kutunun değeri", min: 1, max: 20, bas: 5 }],
        ciz: v => kutular([["Kurabiye", 5, "#ffd8a8"], ["Pasta dilimi", 3, "#e5dbff"]], v[0]) + kutu(`Fark: 2 kutu = ${2 * v[0]} &nbsp; Toplam: 8 kutu = <b>${8 * v[0]}</b>`),
        kosullar: [{ ad: v => `Kurabiye pasta diliminden 26 fazla (şimdi ${2 * v[0]} fazla).`, f: v => 2 * v[0] === 26 }],
        sutun: ["1 kutu", "Kurabiye", "Pasta", "Fark", "Toplam"], satir: v => [v[0], 5 * v[0], 3 * v[0], 2 * v[0], 8 * v[0]],
        yon: "Bir kutunun değerini değiştirin; iki çubuk ve aradaki fark birlikte değişir. Fark 26 olunca toplamı okuyun.", bitis: "Fark 26 olduğunda." }),

    /* 8 · Fırın: çift sayı doğrusu */
    8: el => KO(el, { girdi: [{ ad: "Un (kg):", sec: ["2", "4", "6", "8", "10", "12"], bas: "4" }],
        ciz: v => { const u = +v[0]; return cift([0, 4, 8, 12], [0, 2.5, 5, 7.5], "Un (kg)", "Su (L)", u) + kutu(`${u} kg un için su: ${u} · 0,625 = <b>${D(u * 0.625)} L</b> (her 1 kg una 0,625 L)`); },
        kosullar: [{ ad: "Fırıncının kullanacağı 10 kg un seçildi.", f: v => v[0] === "10" }],
        sutun: ["Un (kg)", "Su (L)"], satir: v => [v[0], D(+v[0] * 0.625)],
        yon: "Un miktarını seçin; yeşil çizgi iki doğruda birlikte kayar. Su miktarının her seferinde aynı oranla bulunduğunu görün ve 10 kg un için suyu okuyun.", bitis: "10 kg una karşılık gelen suyu bulduğunuzda." }),

    /* 9 · Boyacı: oran tablosu */
    9: el => { const H = { "9 kutu beyaz": [9, null], "5 kutu mavi": [null, 5], "21 kutu beyaz": [21, null] };
      return KO(el, { girdi: [{ ad: "Boş hücre:", sec: Object.keys(H), bas: "9 kutu beyaz" }, { ad: "Yazılacak sayı", min: 1, max: 30, bas: 1 }],
        ciz: v => { const [b, m] = H[v[0]]; const be = b ?? v[1], ma = m ?? v[1]; return kutu(`Sütun: <b>${be}</b> kutu beyaz, <b>${ma}</b> kutu mavi → ${O(be, ma)} ${be * 1 === ma * 3 ? "= 3 : 1 ✔" : "≠ 3 : 1"}`); },
        kosullar: [{ ad: "Bu sütun 3 : 1 oranına denktir.", f: v => { const [b, m] = H[v[0]]; return (b ?? v[1]) === 3 * (m ?? v[1]); } }],
        sutun: ["Hücre", "Sayı", "Sütun", "Denk mi?"], satir: (v, ok) => [v[0], v[1], (() => { const [b, m] = H[v[0]]; return O(b ?? v[1], m ?? v[1]); })(), ok ? "evet" : "hayır"],
        yon: "Bir boş hücre seçin ve sayıyı − / + ile değiştirin. Sütun 3 : 1'e denk olunca defterde “evet” yazar. Üç hücreyi bulup sayılarını toplayın.", bitis: "Üç boş hücrenin de sayısını bulduğunuzda." }); },

    /* 10 · Çay ocakları: ışın */
    10: el => { const U = { "Ali Usta": [2, 2, "#e8590c"], "Bekir Usta": [4, 3, "#1c7ed6"], "Cemal Usta": [6, 5, "#2b8a3e"] };
      return KO(el, { girdi: [{ ad: "Usta:", sec: Object.keys(U), bas: "Cemal Usta" }],
        ciz: v => isinlar(Object.entries(U).map(([k, [s, c, r]]) => [s, c, r, k.split(" ")[0], k === v[0]]), 7, 6, "Su (bardak)", "Çay (kaşık)") +
          kutu(`${v[0]}: 1 bardak suya ${K(U[v[0]][1], U[v[0]][0])} kaşık çay`),
        kosullar: [{ ad: "Bu ustanın ışını dikey doğruya en yakındır (en koyu çay).", f: v => v[0] === "Ali Usta" }, { ad: "Bu ustanın ışını yatay doğruya en yakındır (en açık çay).", f: v => v[0] === "Bekir Usta" }],
        sutun: ["Usta", "Su : Çay", "Bardak başına çay"], satir: v => [v[0], O(U[v[0]][0], U[v[0]][1]), K(U[v[0]][1], U[v[0]][0]) + " kaşık"],
        yon: "Ustaları tek tek seçin; seçilen ustanın ışını kalın çizilir. Bardak başına düşen çayı karşılaştırarak en koyu ve en açık çayı bulun.", bitis: "En koyu ve en açık çayın ustalarını bulduğunuzda." }); },

    /* 11 · Koşu bandı */
    11: el => KO(el, { girdi: [{ ad: "Mesafe (km)", min: 1, max: 12, bas: 4 }],
        ciz: v => cift([0, 1, 2, 4, 8, 12].filter(x => x <= 12), [0, 6.25, 12.5, 25, 50, 75], "Yol (km)", "Süre (dk.)", v[0]) + kutu(`${v[0]} km için süre: ${v[0]} · 6,25 = <b>${D(v[0] * 6.25)} dakika</b> (25 : 4 = 6,25 dk./km)`),
        kosullar: [{ ad: "Zeynep'in hedefi olan 10 km seçildi.", f: v => v[0] === 10 }],
        sutun: ["Mesafe", "Süre"], satir: v => [`${v[0]} km`, `${D(v[0] * 6.25)} dk.`],
        yon: "Mesafeyi − / + ile değiştirin; süre her kilometre için 6,25 dakika artar. 10 km için süreyi okuyun.", bitis: "10 km'nin süresini bulduğunuzda." }),

    /* 12 · Zeytinyağı rafı */
    12: el => { const Z = { "0,5 L": [0.5, 160], "1 L": [1, 300], "2 L": [2, 580], "5 L": [5, 1500] };
      return KO(el, { girdi: [{ ad: "Şişe:", sec: Object.keys(Z), bas: "0,5 L" }],
        ciz: v => cubuklar(Object.entries(Z).map(([k, [h, f]]) => [`${k} şişe`, f / h, k === v[0] ? "#ffd43b" : "#e9ecef"]), 380, 340) + kutu(`${v[0]}: ${Z[v[0]][1]} : ${String(Z[v[0]][0]).replace(".", ",")} = <b>${D(Z[v[0]][1] / Z[v[0]][0])} TL/L</b>`),
        kosullar: [{ ad: "Bu şişenin litresi en ucuzdur.", f: v => v[0] === "2 L" }],
        sutun: ["Şişe", "Fiyat", "Birim fiyat"], satir: v => [v[0], `${Z[v[0]][1]} TL`, `${D(Z[v[0]][1] / Z[v[0]][0])} TL/L`],
        yon: "Şişeleri tek tek seçin; çubuklar litre başına fiyatı gösterir. En kısa çubuk litresi en ucuz şişedir.", bitis: "Litresi en ucuz şişeyi bulduğunuzda." }); },

    /* 13 · Damlayan musluk */
    13: el => KO(el, { girdi: [{ ad: "Gün sayısı", min: 1, max: 30, bas: 1 }],
        ciz: v => kutu(`1 saat: 0,6 L → 1 gün (24 saat): 24 · 0,6 = 14,4 L<br>${v[0]} gün: ${v[0]} · 14,4 = <b>${D(v[0] * 14.4)} L</b>`),
        kosullar: [{ ad: "30 günlük israf hesaplandı.", f: v => v[0] === 30 }],
        sutun: ["Gün", "Boşa akan su"], satir: v => [v[0], `${D(v[0] * 14.4)} L`],
        yon: "Gün sayısını − / + ile değiştirin; boşa akan su her gün 14,4 L artar. 30 güne kadar ilerleyin.", bitis: "30 gündeki israfı bulduğunuzda." }),

    /* 14 · Kulüpler */
    14: el => { const KL = { "Satranç": [2, 3], "Resim": [5, 3] };
      return KO(el, { girdi: [{ ad: "Kulüp:", sec: Object.keys(KL), bas: "Satranç" }, { ad: "Kız öğrenci sayısı", min: 0, max: 40, bas: 20 }],
        ciz: v => { const [a, b] = KL[v[0]], n = a + b; return kutular([["Kız", a, "#ffc9c9"], ["Erkek", b, "#a5d8ff"]], 40 / n) + kutu(`40 öğrenci ${n} eş kutuya bölünür: 1 kutu = ${40 / n} öğrenci<br>Sizin denemeniz: ${v[1]} kız, ${40 - v[1]} erkek → ${O(v[1], 40 - v[1])}`); },
        kosullar: [{ ad: v => `${v[0]} kulübünde kız : erkek oranı ${O(...KL[v[0]])} tutuyor.`, f: v => { const [a, b] = KL[v[0]]; return v[1] * b === (40 - v[1]) * a; } }],
        sutun: ["Kulüp", "Kız", "Erkek", "Oran tutuyor mu?"], satir: (v, ok) => [v[0], v[1], 40 - v[1], ok ? "evet" : "hayır"],
        yon: "Kulübü seçin ve kız öğrenci sayısını değiştirin. Oran tuttuğunda defterde “evet” yazar. İki kulübün kız sayılarını bulup toplayın.", bitis: "İki kulübün de kız sayısını bulduğunuzda." }); },

    /* 15 · Fidan kampanyası: mutlak ve bağıl */
    15: el => { const OK = { "A": [240, 180], "B": [160, 128], "C": [300, 210] };
      return KO(el, { girdi: [{ ad: "Okul:", sec: Object.keys(OK), bas: "A" }],
        ciz: v => cubuklar(Object.entries(OK).map(([k, [o, f]]) => [`${k} · fidan`, f, k === v[0] ? "#8ce99a" : "#e9ecef"]), 380, 230) +
          kutu(`${v[0]} okulu: ${OK[v[0]][1]} fidan; öğrenci başına ${OK[v[0]][1]} : ${OK[v[0]][0]} = <b>${K(OK[v[0]][1], OK[v[0]][0])}</b> fidan`),
        kosullar: [{ ad: "En çok fidanı bu okul dikti.", f: v => v[0] === "C" }, { ad: "Öğrenci başına en çok fidanı bu okul dikti.", f: v => v[0] === "B" }],
        sutun: ["Okul", "Fidan", "Öğrenci başına"], satir: v => [v[0], OK[v[0]][1], K(OK[v[0]][1], OK[v[0]][0])],
        yon: "Okulları tek tek seçin. Çubuklar dikilen fidan sayısını (mutlak), alttaki satır öğrenci başına fidanı (bağıl) gösterir. İki ödülün sahibini ayrı ayrı bulun.", bitis: "İki ödülün okulunu bulduğunuzda." }); },

    /* 16 · Pano: ölçekli büyütme */

    17: el => { const T = { "3/4 saat": 0.75, "1 saat": 1, "1 1/2 saat": 1.5, "2 saat": 2 };

        yon: "Üç birleştirmeyi de deneyin. Hangisinde kazandaki oranın 3 : 2'ye denk kaldığına bakın; I, II ve III'ü defterle karşılaştırın.", bitis: "Üç birleştirmeyi de denediğinizde." }); },

    /* 19 · Raf etiketi */
    19: el => KO(el, { girdi: [{ ad: "400 g'lık paket sayısı", min: 1, max: 8, bas: 1 }],

        yon: "400 g'lık paket sayısını değiştirin; toplam kütle ve iki seçenekteki tutar yan yana görünür. Tam 2 kg'a ulaşınca farkı hesaplayın.", bitis: "2 kg için iki tutarı karşılaştırdığınızda." }),

    /* 20 · Musluk önermeleri */

        kosullar: [{ ad: "Bu sürede tam 1 L su akıyor.", f: v => v[0] === "1/3" }],
        sutun: ["Süre", "Akan su"], satir: v => [`${v[0]} dk.`, `${D((v[0] === "1/3" ? 1 / 3 : +v[0]) * 3)} L`],

  };

<script>
const V={"baslik": "Oran", "kod": "7. SINIF · MAT.7.1.5", "ses": "", "bet": "BAĞLAM TEMELLİ SORU", "bad": "Bağlam Soruları", "s": [{"no": 1, "bas": "Toplamsal ve çarpımsal karşılaştırma", "q": [{"k": "Elif'in 15, Can'ın 5 kitabı vardır. Bu durum için bir toplamsal ve bir çarpımsal soru yazınız ve sorularınızı cevaplayınız.", "a": ["Toplamsal soru: “Elif'in Can'dan kaç kitabı fazladır?” 15 − 5 = 10.", "Çarpımsal soru: “Elif'in kitap sayısı Can'ınkinin kaç katıdır?” 15 : 5 = 3.", "Ters yönden: Can'ın kitap sayısı Elif'inkinin 1/3'üdür."], "c": "10 kitap fazla; 3 katı"}, {"k": "Aşağıdaki sorulardan hangileri çarpımsal karşılaştırma ister?<br>I. Bir ağacın bu yılki boyu geçen yılki boyunun kaç katıdır?<br>II. Bir sınıftaki kızlar erkeklerden kaç kişi fazladır?<br>III. Bir çocuğun yaşı babasının yaşının kaçta kaçıdır?<br>IV. İki odanın sıcaklıkları arasında kaç derece fark vardır?", "a": ["“Kaç katı” ve “kaçta kaçı” soruları bölümü sorar; çarpımsaldır: I ve III.", "“Kaç fazla” ve “kaç fark” soruları farkı sorar; toplamsaldır: II ve IV."], "c": "I ve III"}]}, {"no": 2, "bas": "Oran", "q": [{"k": "Bir otoparkta 9 beyaz ve 4 gri araç vardır. Beyaz araçların sayısının gri araçların sayısına oranını ve gri araçların sayısının bütün araçların sayısına oranını yazınız. Oranların türünü belirtiniz.", "a": ["Beyaz : gri = 9 : 4. İki parça karşılaştırılmıştır: parça–parça oranı.", "Otoparkta 9 + 4 = 13 araç vardır.", "Gri : bütün = 4 : 13. Parça bütünle karşılaştırılmıştır: parça–bütün oranı; gri araçlar otoparktakilerin 4/13'üdür."], "c": "9 : 4 (parça–parça); 4 : 13 (parça–bütün)"}, {"k": "Bir okulda öğretmen sayısının öğrenci sayısına oranı 1 : 18'dir. Bu oranı kendi cümlelerinizle açıklayınız. Öğretmenler okuldaki bütün öğretmen ve öğrencilerin kaçta kaçıdır?", "a": ["1 : 18 oranı, her 1 öğretmene 18 öğrenci düştüğünü anlatır.", "Her 1 öğretmen ve 18 öğrenciden oluşan grupta 1 + 18 = 19 kişi vardır.", "Öğretmenlerin bütüne oranı 1 : 19'dur; öğretmenler okuldakilerin 1/19'udur."], "c": "Her öğretmene 18 öğrenci düşer; 1/19"}]}, {"no": 3, "bas": "Birimli ve birimsiz oran", "q": [{"k": "Aşağıdaki oranların birimli mi, birimsiz mi olduğunu belirleyiniz; birimli olanları birimiyle yazınız.<br>a) 240 km yolun 3 saate oranı &nbsp; b) 6 kg'ın 9 kg'a oranı &nbsp; c) 36 TL'nin 4 kaleme oranı", "a": ["a) Birimler farklıdır (km ve saat): birimli oran; 240 : 3 = 80, yani 80 km/sa.", "b) Birimler aynıdır (kg): birimsiz oran; 6 : 9 = 2 : 3.", "c) Birimler farklıdır (TL ve kalem): birimli oran; 36 : 4 = 9, yani 9 TL/kalem."], "c": "a) birimli, 80 km/sa. b) birimsiz, 2 : 3 c) birimli, 9 TL/kalem"}, {"k": "1,5 m uzunluğundaki bir ip ile 60 cm uzunluğundaki bir ipin uzunluklarının oranını en sade hâlde yazınız.", "a": ["Uzunlukları aynı birime çeviriniz: 1,5 m = 150 cm.", "Oranı yazınız: 150 : 60.", "Terimleri 30'a bölünüz: 150 : 60 = 5 : 2."], "c": "5 : 2"}]}, {"no": 4, "bas": "Denk oranlar", "q": [{"k": "5 : 7 oranına denk üç oran yazınız.", "a": ["Terimleri aynı sayıyla çarpınız: 2 ile çarpılırsa 10 : 14.", "3 ile çarpılırsa 15 : 21.", "10 ile çarpılırsa 50 : 70. (Terimleri aynı sayıyla çarpılan her oran kabul edilir.)"], "c": "10 : 14, 15 : 21, 50 : 70"}, {"k": "48 : 72 oranını en sade hâlde yazınız.", "a": ["48 ile 72'nin ortak bölenlerinden en büyüğü 24'tür.", "Terimleri 24'e bölünüz: 48 : 72 = 2 : 3.", "2 ile 3 aralarında asal olduğundan oran en sade hâldedir."], "c": "2 : 3"}]}, {"no": 5, "bas": "Temsiller", "q": [{"k": "Bir yazıcı 4 dakikada 52 sayfa basmaktadır. Yazıcının aynı hızla 1, 3 ve 8 dakikada kaç sayfa basacağını oran tablosuyla bulunuz.", "a": ["4 dakikadan 1 dakikaya inmek için iki satır 4'e bölünür: 1 dakikada 13 sayfa.", "1 dakikanın sütunu 3 ile çarpılır: 39 sayfa.", "1 dakikanın sütunu 8 ile çarpılır: 104 sayfa."], "c": "13, 39, 104 sayfa"}, {"k": "Bir bahçedeki kırmızı güllerin sayısının beyaz güllerin sayısına oranı 3 : 5'tir. Bahçede 40 beyaz gül olduğuna göre kaç kırmızı gül vardır? Çubuk diyagramıyla gösteriniz.", "a": ["Kırmı 0\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" data-maxw=\"316\" data-grup=\"nk22140\">Bu yıl: 60 cm</text><text x=\"200.0\" y=\"388.0\" font-size=\"31.0\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-maxw=\"316\" data-grup=\"nk22140\">B fidanı</text><text x=\"200.0\" y=\"436.1\" font-size=\"31.0\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" data-maxw=\"316\" data-grup=\"nk22140\">Geçen yıl: 90 cm</text><text x=\"200.0\" y=\"484.1\" font-size=\"31.0\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" data-maxw=\"316\" data-grup=\"nk22140\">Bu yıl: 120 cm</text></g></svg>", "son": "<p>Kulüp üyeleri iki fidanın uzamasını hem “kaç santimetre uzadı?” hem de “boyu kaç katına çıktı?” sorularıyla karşılaştırmıştır.</p>", "k": "Buna göre, aşağıdakilerden hangisi doğrudur?", "sec": ["A fidanı hem daha çok santimetre uzamış hem de boyu daha çok katına çıkmıştır.", "B fidanı daha çok santimetre uzamış, A fidanının boyu ise daha çok katına çıkmıştır.", "B fidanı hem daha çok santimetre uzamış hem de boyu daha çok katına çıkmıştır.", "İki fidan aynı miktarda uzamış, boyları aynı katına çıkmıştır."], "secg": null, "c": "B", "a": ["Toplamsal karşılaştırma: A fidanı 60 − 40 = 20 cm, B fidanı 120 − 90 = 30 cm uzamıştır. B daha çok santimetre uzamıştır.", "Çarpımsal karşılaştırma: A'nın boyu 60 : 40 = 3/2 katına, B'nin boyu 120 : 90 = 4/3 katına çıkmıştır.", "3/2 = 9/6 ve 4/3 = 8/6 olduğundan A'nın boyu daha çok katına çıkmıştır."], "t": "A için iki karşılaştırma: A'nın 3/2 katı doğru ama B'nin daha çok santimetre uzadığı gözden kaçmış; B için iki karşılaştırma: daha çok uzayan fidanın boyunun da daha çok katına çıkacağı sanılmış; aynı miktar: iki fidanın da 1 basamak uzadığı düşünülmüş", "d": "“Kaç santimetre uzadı?” bir fark (toplamsal), “boyu kaç katına çıktı?” bir bölüm (çarpımsal) sorusudur. Daha çok uzayan fidanın boyu her zaman daha çok katına çıkmaz; iki karşılaştırmayı ayrı ayrı yapınız.", "ses": "b01"}, {"no": 2, "on": "<p>Bir manav, tezgâhındaki sebze kasalarını türlerine göre saymış ve kartlara yazmıştır.</p>", "g": "<svg viewBox=\"0 0 500 92\" width=\"500\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"150\" height=\"76\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H150 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"83.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Domates</text><text x=\"83.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">9 kasa</text><rect x=\"172\" y=\"8\" width=\"150\" height=\"76\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M172 36 V16 q0 -8 8 -8 H314 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"247.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Biber</text><text x=\"247.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">6 kasa</text><rect x=\"336\" y=\"8\" width=\"150\" height=\"76\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M336 36 V16 q0 -8 8 -8 H478 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"411.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Patlıcan</text><text x=\"411.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">5 kasa</text></svg>", "son": "<p>Tezgâhta yalnız kartlarda yazan kasalar vardır.</p>", "k": "Buna göre, biber kasalarının sayısının tezgâhtaki bütün kasaların sayısına oranının en sade hâli aşağıdakilerden hangisidir?", "sec": ["2 : 3", "3 : 7", "6 : 5", "3 : 10"], "secg": null, "c": "D", "a": ["Tezgâhtaki bütün kasalar: 9 + 6 + 5 = 20.", "Biber kasaları : bütün kasalar = 6 : 20.", "Terimler 2'ye bölünür: 6 : 20 = 3 : 10."], "t": "2 : 3: biberler domateslerle karşılaştırılmış; 3 : 7: biberler öbür kasalarla karşılaştırılmış, 6 : 14; 6 : 5: biberler patlıcanlarla karşılaştırılmış", "d": "Parça–bütün oranında ikinci terim bütündür: biberleri bütün kasalarla karşılaştırınız. Önce bütün kasaları toplayınız, sonra oranı en sade hâle getiriniz.", "ses": "b02"}, {"no": 3, "on": "<p>İki öğrenci, sınıftaki tahtaya dört kart asmıştır. Her kartta iki nicelik verilmiş ve arkadaşlarından bu iki niceliğin oranını yazmaları istenmiştir.</p>", "g": "<svg class=\"foto715\" viewBox=\"0 0 1010 490\" width=\"1010\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAFxAvgDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAUGAQMEBwII/8QAVhAAAQMCAgMHDgkICgIDAAMAAAECAwQFBhESITETFkFRcZGUBxQVIjJSVWF0gbGy0dI0NUJkZXWhs8EjMzZTcpKToiQlQ0VUYmOCwuEmRHOj8CeD8f/EABoBAQADAQEBAAAAAAAAAAAAAAABAgMEBQb/xAAmEQEBAAICAgICAgMBAQAAAAAAAQIRAzESIQQyQVETIhRSYSNC/9oADAMBAAIRAxEAPwD2YAAAAAAAAAAAAAAAAAAAAAAAAGDzF1RXdkKuuuNzuLbc6slh3SnqHN63Vrsk0kT5K8fATJsengpyWNHNRzb1d1RUzRUrVyVDPYL6ZvHTXE+KNrgCn9gvpi8dNcOwX0xeOmuHibXAFP7A/TF46a4dgfpm8dNcPE2uAKf2C+mbx01w7A/TN46a4eJtcAU7sD9M3jprh2B+mLx01w8Ta4gp3YH6ZvHTXDsD9M3jprh4m1xBTuwSeGLx01w7BfTF46a4eJtcQU7sD9M3jprh2B+mLx01w8Ta4gp3YH6ZvHTXDsF9M3jpqjxNriCndgfpm8dNcOwP0zeOmuHibXEFO7A/TN46ao7A/TN46ao8Ta4gp3YL6ZvHTXDsCnhm8dNcPE2uIKd2BTwzeOmuHYH6ZvHTXDxNriCndgfpm8dNcOwSeGbx01w8Ta4gp3YL6ZvHTXDsF9M3jprh4m1xBTuwX0zeOmuHYL6ZvHTXDxNriCndgk8M3jprh2B+mbx01w8Ta4 1\" text-anchor=\"middle\" data-maxw=\"184\" data-grup=\"r03\">940 TL</text><text x=\"762.0\" y=\"405.1\" font-size=\"28\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" data-maxw=\"184\" data-grup=\"r03\">20 L benzin</text></g></svg>", "son": "<p>Her kartta üstteki niceliğin alttaki niceliğe oranı yazılacaktır.</p>", "k": "Buna göre, kartlardaki oranlardan kaç tanesi birimli orandır?", "sec": ["2", "1", "3", "4"], "secg": null, "c": "A", "a": ["1. kart: iki nicelik de kişi sayısıdır; oran birimsizdir (14 : 16 = 7 : 8).", "2. kart: litre ve dakika farklı birimlerdir; oran birimlidir (6 L/dk.). 4. kart: lira ve litre farklıdır; oran birimlidir (47 TL/L).", "3. kart: santimetre ve metre aynı türden uzunluk birimleridir; 2 m = 200 cm yazılınca oran birimsizdir (240 : 200 = 6 : 5). Birimli oran 2 tanedir."], "t": "3: 3. karttaki farklı yazılmış uzunluk birimleri birimli oran sanılmış; 1: yalnız 2. kart sayılmış; 4: bütün oranların birimi olduğu sanılmış", "d": "Birimleri farklı yazılmış iki uzunluk (cm ve m) aynı türden niceliklerdir; aynı birime çevrilince oran birimsiz olur. Birimli oranda iki niceliğin türü farklıdır.", "ses": "b03"}, {"no": 4, "on": "<p>Bir cam geri dönüşüm tesisinin girişindeki bilgi panosunda geçen ayın verileri yazılıdır.</p>", "g": "<svg viewBox=\"0 0 352 116\" width=\"352\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"330\" height=\"100\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H330 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"173.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Bilgi Panosu</text><text x=\"173.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Toplanan cam atık: 600 kg</text><text x=\"173.0\" y=\"88.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Üretilen yeni şişe: 1 500</text></svg>", "son": "<p>Panonun altında “Bu ay her şey 2,5 şişe/kg oranıyla gerçekleşti.” yazmaktadır.</p>", "k": "Buna göre, panodaki 2,5 şişe/kg oranı aşağıdakilerden hangisini ifade eder?", "sec": ["Her şişe için 2,5 kg cam atık gerektiğini", "Tesiste toplam 2,5 kg cam atık toplandığını", "Her 1 kg cam atıktan 2,5 şişe üretildiğini", "Üretilen her şişenin 2,5 kg geldiğini"], "secg": null, "c": "C", "a": ["Oran, üretilen şişe sayısının toplanan atığa oranıdır: 1 500 şişe : 600 kg.", "İki terim 600'e bölünür: 2,5 şişe : 1 kg. Birim “şişe/kg” kilogram başına şişe diye okunur.", "Oran, onu oluşturan 1 500 ve 600 sayılarından farklı bir anlam taşır: her 1 kg cam atıktan 2,5 şişe üretilir."], "t": "şişe başına 2,5 kg: birimin sırası ters okunmuş; toplam 2,5 kg ve şişenin kütlesi: oran, onu oluşturan niceliklerden biri sanılmış", "d": "Birimli oranın birimini okuyunuz: “şişe/kg”, kilogram başına şişe demektir. Oran, onu oluşturan iki sayıdan farklı, yeni bir niceliktir.", "ses": "b04"}, {"no": 5, "on": "<p>Okul şenliğinde satılacak limonata, öğretmenin tahtaya yazdığı tarife göre hazırlanacaktır.</p>", "g": "<svg class=\"foto715\" viewBox=\"0 0 880 480\" width=\"880\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAGfAvgDASIAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAEFAgMGBAf/xABUEAABAgMCAxEMBgoBBAMBAAAAAQMCBAUGERNS0RIUFRYhMTZBUVR0kZKTlLGyFzM1U1VhcXJzgaHhIjRFYoLBIyQyQkNEY2SDoiYHJWbwRoTCVv/EABkBAQEBAQEBAAAAAAAAAAAAAAABBAUCA//EACYRAQACAQQDAQADAAMBAAAAAAABEQIDEzJRBBIxISJBYRQzcVL/2gAMAwEAAhEDEQA/APswAAAAAQSQAvABBJAAAABAAAAAAvF4AUAAQuAAUBJBQJIAEkXkgCCQAABGqB 0\" fill=\"#f4f1e8\" text-anchor=\"middle\" data-maxw=\"640\" data-grup=\"r05\">5 su bardağı su</text></g></svg>", "son": "<p>Şenlik için aynı tatta, 15 su bardağı su kullanılarak büyük bir sürahi limonata hazırlanacaktır.</p>", "k": "Buna göre, bu sürahi limonata için kaç kaşık şeker kullanılmalıdır?", "sec": ["18", "16", "12", "30"], "secg": null, "c": "A", "a": ["15 su bardağı su, tarifteki 5 su bardağının 3 katıdır.", "Tadın değişmemesi için bütün malzemeler 3 katına çıkar: 6 · 3 = 18 kaşık şeker.", "Kontrol: 18 : 15 = 6 : 5 oranı tarifteki şeker–su oranıyla aynıdır."], "t": "16: suya eklenen 10 bardak kadar şekere de 10 eklenmiş; 12: limon sayısı hesaplanmış; 30: şeker su sayısıyla çarpılmış", "d": "Tadın değişmemesi için bütün malzemeler aynı sayıyla çarpılır. Suya eklenen miktarı şekere de eklemek tadı bozar.", "ses": "b05"}, {"no": 6, "on": "<p>Vitesli bir bisikletin pedala bağlı ön dişlisinde 48, tekerleğe bağlı arka dişlisinde 36 diş vardır.</p>", "g": "<svg viewBox=\"0 0 356 92\" width=\"356\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"160\" height=\"76\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H160 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"88.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Ön dişli</text><text x=\"88.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">48 diş</text><rect x=\"182\" y=\"8\" width=\"160\" height=\"76\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M182 36 V16 q0 -8 8 -8 H334 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"262.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Arka dişli</text><text x=\"262.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">36 diş</text></svg>", "son": "<p>Bisiklet ustası, ön dişlinin diş sayısının arka dişlinin diş sayısına oranını en sade hâlde yazacaktır.</p>", "k": "Buna göre, ustanın yazacağı oran aşağıdakilerden hangisidir?", "sec": ["12 : 9", "3 : 4", "24 : 18", "4 : 3"], "secg": null, "c": "D", "a": ["Oran: ön dişli : arka dişli = 48 : 36.", "48 ile 36'nın en büyük ortak böleni 12'dir; terimler 12'ye bölünür: 4 : 3.", "4 ile 3 aralarında asal olduğu için oran en sade hâldedir."], "t": "12 : 9 ve 24 : 18: denk ama sadeleştirme bitmemiş; 3 : 4: oranın sırası ters yazılmış", "d": "En sade oranın terimleri aralarında asaldır. 12 : 9 ya da 24 : 18 denk oranlardır ama sadeleştirme bitmemiştir. Oranın sırasına (ön dişli : arka dişli) dikkat ediniz.", "ses": "b06"}, {"no": 7, "on": "<p>Bir okulun kermesinde satılan kurabiye sayısının satılan pasta dilimi sayısına oranı 5 : 3'tür. Kermes görevlisi bu durumu aşağıdaki çubuk diyagramıyla göstermiştir.</p>", "g": "<svg viewBox=\"0 0 340 96\" width=\"340\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><text x=\"110.0\" y=\"32.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">Kurabiye</text><rect x=\"120\" y=\"12\" width=\"40\" height=\"30\" fill=\"#ffd8a8\" stroke=\"#111111\" stroke-width=\"1.3\"/><rect x=\"160\" y=\"12\" width=\"40\" height=\"30\" fill=\"#ffd8a8\" stroke=\"#111111\" stroke-width=\"1.3\"/><rect x=\"200\" y=\"12\" width=\"40\" height=\"30\" fill=\"#ffd8a8\" stroke=\"#111111\" stroke-width=\"1.3\"/><rect x=\"240\" y=\"12\" width=\"40\" height=\"30\" fill=\"#ffd8a8\" stroke=\"#111111\" stroke-width=\"1.3\"/><rect x=\"280\" y=\"12\" width=\"40\" height=\"30\" fill=\"#ffd8a8\" stroke=\"#111111\" stroke-width=\"1.3\"/><text x=\"110.0\" y=\"74.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">Pasta dilimi</text><rect x=\"120\" y=\"54\" width=\"40\" height=\"30\" fill=\"#e5dbff\" stroke=\"#111111\" stroke-width=\"1.3\"/><rect x=\"160\" y=\"54\" width=\"40\" height=\"30\" fill=\"#e5dbff\" stroke=\"#111111\" stroke-width=\"1.3\"/><rect x=\"200\" y=\"54\" width=\"40\" height=\"30\" fill=\"#e5dbff\" stroke=\"#111111\" stroke-width=\"1.3\"/></svg>", "son": "<p>Diyagramdaki kutuların hepsi eş sayıda ürünü göstermektedir. Kermeste satılan kurabiye sayısı, pasta dilimi sayısından 26 fazladır.</p>", "k": "Buna göre, kermeste satılan kurabiye ve pasta dilimlerinin toplam sayısı kaçtır?", "sec": ["65", "104", "39", "52"], "secg": null, "c": "B", "a": ["Kurabiyeler 5, pasta dilimleri 3 eş kutudur; fark 5 − 3 = 2 kutudur.", "2 kutu 26 ürün olduğundan 1 kutu 26 : 2 = 13 üründür.", "Toplam 5 + 3 = 8 kutu: 8 · 13 = 104. Kontrol: 65 − 39 = 26."], "t": "65: yalnız kurabiye sayısı bulunmuş; 39: pasta dilimi sayısı; 52: farkın 2 katı alınmış", "d": "Çubuk diyagramında fark, iki çubuktaki kutu sayılarının farkıdır. Önce bir kutunun değerini bulunuz; sorulan toplam mı, bir nicelik mi, dikkat ediniz.", "ses": "b07"}, {"no": 8, "on": "<p>Bir fırında ekmek hamuru hazırlanırken her 4 kg una 2,5 L su katılmaktadır. Fırıncı, un ve su miktarlarını aşağıdaki çift sayı doğrusunda göstermiştir.</p>", "g": "<svg viewBox=\"0 0 476.0 144\" width=\"476\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><text x=\"68.0\" y=\"45.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">Un (kg)</text><line x1=\"86\" y1=\"40\" x2=\"460.0\" y2=\"40\" stroke=\"#1c5fbf\" stroke-width=\"2.2\"/><polygon points=\"466.0,40 457.0,35.5 457.0,44.5\" fill=\"#1c5fbf\"/><text x=\"68.0\" y=\"109.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">Su (L)</text><line x1=\"86\" y1=\"104\" x2=\"460.0\" y2=\"104\" st =\"4\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"1.3\"/><text x=\"426.0\" y=\"131.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">?</text></svg>", "son": "<p>Fırıncı 10 kg unla hamur hazırlayacaktır.</p>", "k": "Buna göre, fırıncının kullanacağı su miktarı kaç litredir?", "sec": ["6", "7,5", "6,25", "6,5"], "secg": null, "c": "C", "a": ["4 kg una 2,5 L su düşer; 1 kg una 2,5 : 4 = 0,625 L su düşer.", "10 kg un için 10 · 0,625 = 6,25 L su gerekir.", "Kontrol: 8 kg una 5 L, 2 kg una 1,25 L su düşer; 5 + 1,25 = 6,25."], "t": "6: 8 kg'dan 10 kg'a 2 arttığı için suya 1 eklenmiş; 7,5: 2,5'in 3 katı alınmış; 6,5: 5'e 1,5 eklenmiş", "d": "Çift sayı doğrusunda karşılıklı değerler denk oranlardır. 8'den 10'a 2 artarken suya da 2 ekleyemezsiniz; birim oranı ya da 2 kg'a düşen suyu bulunuz.", "ses": "b08"}, {"no": 9, "on": "<p>Bir boyacı açık mavi boya hazırlarken her 3 kutu beyaz boyaya 1 kutu mavi boya karıştırmaktadır. Matematik öğretmeni, aynı tonda farklı miktarlar için tahtaya aşağıdaki oran tablosunu çizmeye başlamıştır.</p>", "g": "<svg class=\"foto715\" viewBox=\"0 0 750 480\" width=\"750\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAHmAvgDASIAAhEBAxEB/8QAHAABAAEFAQEAAAAAAAAAAAAAAAEDBAUGBwII/8QAUhAAAQMCAgIKDgcFBgYDAQEAAAECAwQFBhEhMQcSFBdBUVRVkpMTFSI2VmFxc4GRobHR4RYyNTdSdMEjM0Jy8CQmQ1NisiUnNGOi8UVGZESC/8QAGQEBAAMBAQAAAAAAAAAAAAAAAAEDBAIF/8QAIxEBAAICAQQDAQEBAAAAAAAAAAECAxEyEhQhMQQiUTMTQf/aAAwDAQACEQMRAD8A7MAW9ZW01BTOqKudkELdb5HZIgFwDV3bJGE2uyW7MXyRu+BG+ThPnVvVu+A2nUtpBq2+ThPnZvVu+A3ycJ87N6t3wI2altINX3yMJ87N6t3wG+RhPnZvVu+A2altANX3yMJ86t6t3wG+RhPnVvVu+A2altANW3ycJ86t6t3wG+ThPnVvVu+BOzUtpBq2+ThPnVvV ı kullanan usta seçilmiş, miktar oran sanılmış; Bekir · Ali: koyu ve açık ters okunmuş", "d": "Koyuluk, kullanılan çay miktarına değil, bir bardak suya düşen çaya bağlıdır. En çok çay kullanan ustanın çayı en koyu olmayabilir.", "ses": "b10"}, {"no": 11, "on": "<p>Bir spor salonunda koşu bandında koşan Zeynep'in ekranında aşağıdaki değerler görünmektedir.</p>", "g": "<svg viewBox=\"0 0 336 92\" width=\"336\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"150\" height=\"76\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H150 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"83.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Süre</text><text x=\"83.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">25 dk.</text><rect x=\"172\" y=\"8\" width=\"150\" height=\"76\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M172 36 V16 q0 -8 8 -8 H314 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"247.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Mesafe</text><text x=\"247.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">4 km</text></svg>", "son": "<p>Zeynep, koşu bandında hiç durmadan aynı hızla koşmaya devam edecektir.</p>", "k": "Buna göre, Zeynep 10 km'yi koşmayı başlangıçtan itibaren kaç dakikada tamamlar?", "sec": ["40", "62,5", "31", "2,5"], "secg": null, "c": "B", "a": ["Kilometre başına süre: 25 : 4 = 6,25 dk./km.", "10 km için 10 · 6,25 = 62,5 dakika gerekir.", "Kontrol: 62,5 : 10 = 6,25 dk./km."], "t": "40: mesafe ile süre karıştırılıp 4 · 10 yapılmış; 31: 25'e 6 eklenmiş; 2,5: 10 : 4 yapılmış", "d": "Kilometre başına süreyi bulmak için süreyi kilometreye bölünüz. Sonucu istenen kilometreyle çarpınız; dakikaya ve kilometreye dikkat ediniz.", "ses": "b11"}, {"no": 12, "on": "<p>Bir markette aynı marka zeytinyağı dört farklı boyda şişede satılmaktadır. Raftaki şişelerin hacimleri ve fiyatları aşağıda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 560 92\" width=\"560\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"128\" height=\"76\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H128 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"72.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">0,5 L</text><text x=\"72.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">160 TL</text><rect x=\"146\" y=\"8\" width=\"128\" height=\"76\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M146 36 V16 q0 -8 8 -8 H266 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"210.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">1 L</text><text x=\"210.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">300 TL</text><rect x=\"284\" y=\"8\" width=\"128\" height=\"76\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M284 36 V16 q0 -8 8 -8 H404 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"348.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2 L</text><text x=\"348.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">580 TL</text><rect x=\"422\" y=\"8\" width=\"128\" height=\"76\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M422 36 V16 q0 -8 8 -8 H542 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"486.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">5 L</text><text x=\"486.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">1 500 TL</text></svg>", "son": "<p>Bir aile, litresi en ucuz olan şişeyi almak istemektedir.</p>", "k": "Buna göre, ailenin alacağı şişe hangisidir?", "sec": ["0,5 L", "5 L", "2 L", "1 L"], "secg": null, "c": "C", "a": ["Birim fiyatlar: 160 : 0,5 = 320 TL/L; 300 : 1 = 300 TL/L.", "580 : 2 = 290 TL/L; 1 500 : 5 = 300 TL/L.", "En küçük birim fiyat 290 TL/L'dir; 2 litrelik şişe alınır."], "t": "0,5 L: fiyatı en düşük şişe seçilmiş; 5 L: en büyük şişenin her zaman en ekonomik olduğu sanılmış; 1 L: 5 L ile aynı birim fiyatta olduğu için en ucuz sanılmış", "d": "En ekonomik şişe en ucuz şişe değil, litresi en ucuz olandır. 0,5 L'lik şişenin birim fiyatını bulurken fiyatı 0,5'e bölünüz.", "ses": "b12"}, {"no": 13, "on": "<p>Bir okulun lavabosundaki damlayan bir musluktan 1 saatte 0,6 L su boşa akmaktadır.</p>", "g": "<svg viewBox=\"0 0 252 92\" width=\"252\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"230\" height=\"76\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H230 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"123.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Damlayan musluk</text><text x=\"123.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">1 saatte 0,6 L</text></svg>", "son": "<p>Musluk tamir edilene kadar gece gündüz aynı biçimde damlamaya devam edecektir.</p>", "k": "Buna göre, musluk 30 gün boyunca tamir edilmezse kaç litre su boşa akar?", "sec": ["432", "18", "43,2", "360"], "secg": null, "c": "A", "a": ["Bir günde 24 saat vardır: 24 · 0,6 = 14,4 L su boşa akar.", "30 günde 30 · 14,4 = 432 L su boşa akar.", "Bu, 30 gün boyunca saatte 0,6 L'lik bir birim oranın sonucudur."], "t": "18: gün sayısı saat sayısı gibi kullanılmış, 30 · 0,6; 43,2: ondalık basamak yanlış yazılmış; 360: saatte 0,5 L alınmış", "d": "Saat başına verilen birim oranı önce bir güne (24 saat), sonra 30 güne çeviriniz. Gün ile saati karıştırmayınız.", "ses": "b13"}, {"no": 14, "on": "<p>Bir okulun satranç ve resim kulüplerinin her birinde 40 öğrenci vardır. Kulüplerdeki kız ve erkek öğrencilerin sayılarının oranları okul panosuna asılan kartlarda verilmiştir.</p>", "g": "<svg class=\"foto715\" viewBox=\"0 0 960 470\" width=\"960\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAF0AvgDASIAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAEFAgMGBwT/xABWEAABAwIBBAoOBgcGBQMFAAAAAQIDBAURBhIhMRQVQVZxdJOUstETFiIyNDVRU1RVYXKRoQc2UnWBsSMzQkaSosEkJSZEYoJDZHPC4Rdjo0WEs9Lw/8QAGgEBAQADAQEAAAAAAAAAAAAAAAECAwQFBv/EACkRAQABAgUDBQEBAQEBAAAAAAABAgMEERMxURIUMgUhM1JhQSJxI4H/2gAMAwEAAhEDEQA/APZgAAAAAAAAAAAAAAgCQQAJAAAEACQQSAAAAAAACAJAAAAAAQAJAAAEACQCAJBBIAAgCQQAJBBIAEACQAABAAkEEgAQAJAAAAAACAJAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA5/LWvr7dk+slsmbBVSTxxMkc1FRuc5E1KdAc1l4mNig49T9NDGucqZlYjOXN2y5X24JJG7KSpgq4FzZ6d9LFnMXypo0ou4pYI3KHfPUc1i6jVdbOtV
