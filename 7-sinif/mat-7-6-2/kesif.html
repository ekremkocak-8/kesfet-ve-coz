const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;};

const facM=n=>{const m={};fac(n).forEach(p=>m[p]=(m[p]||0)+1);return m;};

const uslS=n=>{const U="⁰¹²³⁴⁵⁶⁷⁸⁹",m=facM(n);return Object.keys(m).map(p=>m[p]>1?p+String(m[p]).split("").map(c=>U[+c]).join(""):p).join(" · ")||"1";};
const usl=n=>{const m=facM(n);return Object.keys(m).map(p=>m[p]>1?`${p}<sup>${m[p]}</sup>`:p).join(" · ")||"1";};

function bip(f,sure=.18,tip="sine",h=.16){if(!sesAcik())return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
  const o=AC.createOscillator(),g=AC.createGain();o.type=tip;o.frequency.value=f;g.gain.setValueAtTime(.0001,AC.currentTime);g.gain.exponentialRampToValueAtTime(h,AC.currentTime+.012);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+sure);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+sure+.02);}catch(e){}}
/* Sayıya Türkçe ek: "i" belirtme (18'i), "e" yönelme (4'e), "in" ilgi (6'nın), "de" bulunma (12'de) */
function ek(n,tur){const son=n%10,on=Math.floor(n/10)%10;let s;
  if(son)s=["","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"][son];else if(on)s=["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"][on];else s=n%1000===0?"bin":"yüz";
  const u=[...s].reverse().find(c=>"aeıioöuü".includes(c));const kalin="aıou".includes(u),yuv="ouöü".includes(u),unlu="aeıioöuü".includes(s[s.length-1]);
  const I=kalin?(yuv?"u":"ı"):(yuv?"ü":"i"),A=kalin?"a":"e";const sert="çfhkpsşt".includes(s[s.length-1]);
  if(tur==="i")return n+"'"+(unlu?"y":"")+I;if(tur==="e")return n+"'"+(unlu?"y":"")+A;if(tur==="in")return n+"'"+(unlu?"n":"")+I+"n";
  if(tur==="de")return n+"'"+(sert?"t":"d")+A;return String(n);}

  function ciz(){d.innerHTML=`<div class="gbas">Görevler <b>${Math.min(i,liste.length)} / ${liste.length}</b></div><ol>`+liste.map((g,j)=>j<i?`<li class="tamam"><span>✓</span><div>${g.m}${sonuc[j]?`<small>${sonuc[j]}</small>`:""}</div></li>`:j===i?`<li class="simdi"><span>${j+1}</span><div>${g.m}</div></li>`:`<li class="sonra"><span>${j+1}</span><div>Sıradaki görev</div></li>`).join("")+`</ol>`;
    if(i<liste.length)yonlendir(liste[i].m);}

  return {kontrol(){let deg=false;while(i<liste.length&&liste[i].ok()){sonuc[i]=liste[i].s?liste[i].s():"";i++;deg=true;bip(760,.12);}if(deg){ciz();if(i===liste.length&&bitince){const f=bitince;bitince=null;setTimeout(f,400);}}}};

function sor(kap,soru,secs,dogru,okMsg,sonra){

const sat=(m,n)=>{const w=String(m).split(" ");const L=[];let c="";for(const x of w){if(c&&(c+" "+x).length>n){L.push(c);c=x;}else c=(c?c+" ":"")+x;}if(c)L.push(c);return L;};

/* Çizgi grafiği: o.x etiketler, o.xk konumlar (yoksa eşit), o.v değerler, o.v2 ikinci seri, o.ymin/ymax/step, o.kirik, o.L/o.T/o.pw/o.ph, o.fmt, o.vurgu: [indis] */
function cizgiG(o){const L=o.L||58,Tp=o.T||40,pw=o.pw||250,ph=o.ph||150,y0=Tp+ph+(o.kirik?24:0);
  const kon=o.xk||o.x.map((_,i)=>i),k0=kon[0],k1=kon[kon.length-1];const X=c=>L+16+(c-k0)/(k1-k0)*(pw-32);const Y=v=>Tp+ph-(v-o.ymin)/(o.ymax-o.ymin)*ph;
  let h="";const n=Math.round((o.ymax-o.ymin)/o.step),eh=o.et||1;
  for(let j=0;j<=n;j++){const v=o.ymin+j*o.step,y=Y(v);if(j||o.kirik)h+=`<line x1="${L}" y1="${y.toFixed(1)}" x2="${L+pw}" y2="${y.toFixed(1)}" stroke="#dee2e6"/>`;if(j%eh===0)h+=tx(L-7,y+5,(o.fmt||Sn)(v),{fs:13,an:"end",w:700});}
  if(o.kirik)h+=tx(L-7,y0+5,"0",{fs:13,an:"end",w:700});
  h+=eksen(L,y0,L+pw+14,Tp-12,o.xad||"",o.yad||"",o.kirik);
  o.x.forEach((e,i)=>{const x=X(kon[i]);h+=`<line x1="${x.toFixed(1)}" y1="${y0}" x2="${x.toFixed(1)}" y2="${y0+5}" stroke="${INK}" stroke-width="1.4"/>`+tx(x,y0+20,e,{fs:13,w:700});});
  const seri=(v,r,d)=>{const P=v.map((a,i)=>[X(kon[i]),Y(a)]);return `<polyline points="${P.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" fill="none" stroke="${r}" stroke-width="2.6"${d?' stroke-dasharray="7 5"':""}/>`+
    P.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${(o.vurgu||[]).includes(i)&&!d?7:4.6}" fill="${(o.vurgu||[]).includes(i)&&!d?(o.vrenk||YES):r}"/>`).join("");};
  h+=seri(o.v,o.renk||MAV);if(o.v2)h+=seri(o.v2,TURU,true);return h;}
/* Nokta grafiği: o.v, o.xmin/xmax/step, o.et, o.cizgiler [{v,ad,r}], o.isaret [v], o.renk, o.L/o.pw/o.y0 */
function noktaG(o){const L=o.L||20,pw=o.pw||300,y0=o.y0||130,n=Math.round((o.xmax-o.xmin)/o.step);const X=v=>L+12+(v-o.xmin)/(o.xmax-o.xmin)*(pw-24);
  let h=`<line x1="${L}" y1="${y0}" x2="${L+pw}" y2="${y0}" stroke="${INK}" stroke-width="1.8"/><polygon points="${L+pw+8},${y0} ${L+pw-1},${y0-4.5} ${L+pw-1},${y0+4.5}" fill="${INK}"/>`+(o.xad?tx(L+pw+12,y0+5,o.xad,{fs:13,an:"start"}):"");
  for(let i=0;i<=n;i++){const v=o.xmin+i*o.step,x=X(v);if(i%(o.et||1)===0)h+=`<line x1="${x.toFixed(1)}" y1="${y0}" x2="${x.toFixed(1)}" y2="${y0+5}" stroke="${INK}" stroke-width="1.3"/>`+tx(x,y0+20,Sn(v),{fs:13,w:700});}
  const say={};o.v.forEach(v=>{const k=String(v);say[k]=(say[k]||0)+1;const j=say[k]-1;const isr=(o.isaret||[]).includes(v);
    h+=`<circle cx="${X(v).toFixed(1)}" cy="${(y0-10-j*(o.dy||13)).toFixed(1)}" r="${o.r||5.5}" fill="${isr?KIRM:(o.renk||MAV)}" stroke="#fff" stroke-width="1"/>`;});
  (o.cizgiler||[]).forEach((c,i)=>{const x=X(c.v),ty=(o.ust||22)+i*16;h+=`<line x1="${x.toFixed(1)}" y1="${ty+5}" x2="${x.toFixed(1)}" y2="${y0}" stroke="${c.r}" stroke-width="2" stroke-dasharray="6 4"/>`+tx(x+(i%2?-5:5),ty,c.ad,{fs:13,r:c.r,an:i%2?"end":"start"});});
  return h;}
/* Sütun grafiği */
function sutunG(o){const L=o.L||56,Tp=o.T||40,pw=o.pw||240,ph=o.ph||150,y0=Tp+ph,n=o.k.length,sb=pw/n;const Y=v=>Tp+ph-(v-(o.ymin||0))/(o.ymax-(o.ymin||0))*ph;

  o.k.forEach((e,i)=>{const x=L+i*sb+sb*.18;h+=`<rect x="${x.toFixed(1)}" y="${Y(o.v[i]).toFixed(1)}" width="${(sb*.64).toFixed(1)}" height="${(y0-Y(o.v[i])).toFixed(1)}" fill="#d0ebff" stroke="${MAV}" stroke-width="1.4"/>`+tx(L+i*sb+sb/2,y0+20,e,{fs:13,w:700});});
  return h+eksen(L,y0,L+pw+14,Tp-12,o.xad||"",o.yad||"",o.kirik);}
const kartS=(x,y,w,h0,bas,L,renk,o={})=>{const h=Math.max(h0,(bas?46:22)+(L.length-1)*(o.ah||18)+10);return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${o.dolgu||"#fff"}" stroke="${renk}" stroke-width="${o.k||2}"/>`+(bas?`<rect x="${x}" y="${y}" width="${w}" height="26" rx="10" fill="${renk}"/><rect x="${x}" y="${y+16}" width="${w}" height="10" fill="${renk}"/>`+tx(x+w/2,y+18,bas,{fs:13.5,r:"#fff"}):"")+

        ciz:s=>{let h=tx(180,16,"Okula yürüme süreleri (dk)",{fs:14});KYT.forEach((r,j)=>{const y=30+j*28,on=s.r===j,kr=KAR[j]||"k",d=deg(j);

      kuralA(D,[["Bir grafiğin bir parçasından yapılan yorum ne zaman geçerlidir?",["Yalnız o parça için; bütün veri için söylenecekse bütün grafiğe bakılmalıdır.","Her zaman bütün veri için","Hiçbir zaman"],"Doğru! Yorum verinin tamamını mı bir parçasını mı anlattığını belirtmelidir.",["Temmuzdan sonra eğilim değişti.","Parça için yapılan yorum o parçada doğruydu."]]],"Parçadan bütüne yorumu sınadınız."),
      kendi("Bir öğrenci, bir şehrin son on yıllık nüfus grafiğinin yalnız son iki yılına bakıp “Şehrin nüfusu hep azalmış.” demiştir. Bu yorumdaki sorun nedir?",["Verinin yalnız bir parçasına bakıp bütün dönem için konuşmuştur.","Grafik türü uygun değildir.","Nüfus kategorik veridir."],"Doğru! Önceki yıllarda nüfus artmış olabilir.",["Çizgi grafiği zamana göre değişen veri için uygundur.","Nüfus sayılarla ifade edilir."])],
    kural:"Bir yorum, verinin <b>tamamına</b> mı yoksa yalnız bir <b>parçasına</b> mı dayandığına göre değerlendirilir. Bir aralıktaki eğilim bütün veride sürmeyebilir; “hep”, “sürekli” gibi sözler bütün veriyle sınanır."});}

/* 16 · TAHMİN UZATICI — eğilim çizgisini ileri uzatıp tahmini gerçek hayat sınırlarıyla karşılaştırmak */
const TU={b:{ad:"Ayçiçeği fidesi",v:[12,18,24,30],d:6,bir:"cm",zb:"hafta",sinir:200,sad:"Bu tür ayçiçeği en fazla yaklaşık 200 cm boylanır."},
  z:{ad:"Buz kalıbı",v:[500,460,420,380],d:-40,bir:"g",zb:"10 dakika",sinir:0,sad:"Buzun kütlesi 0 g'ın altına inemez."}};
function e_tahmin(p){const D=defterY(["Durum","Kaç adım ileri","Tahmin","Gerçek hayatla"]);
  const tah=s=>{const T=TU[s.t];return T.v[3]+T.d*s.n;};const cel=s=>{const T=TU[s.t],v=tah(s);return T.d>0?v>T.sinir:v<T.sinir;};
  asamali(p,{tahmin:{giris:["Bir fidenin boyu her hafta 6 cm uzamaktadır; şu an 30 cm'dir."],soru:"Bu eğilimle 30 hafta sonrası için yapılan tahmin güvenilir midir?",secs:[["h","Değildir; eğilim o kadar uzun sürmeyebilir"],["e","Kesinlikle güvenilirdir"],["k","Tahmin hiç yapılamaz"]],dogru:"h",neden:"Bitkiler bir noktadan sonra uzamayı bırakır."},
    asamalar:[asm(4,"Durumu ve tahminin kaç adım ileriye uzatılacağını seçiniz; eğilim çizgisi uzar ve tahmin gerçek hayat sınırıyla karşılaştırılır. Görev kartındaki durumları deftere yazınız.",(k,A)=>lab(k,A,D,{st:{t:"b",n:1},W:360,H:254,
        kont:[{t:"sec",key:"t",ad:"Durum:",liste:Object.entries(TU).map(([a,b])=>[a,b.ad])},{t:"sec",key:"n",ad:"Kaç adım ileri:",liste:[[1,"1"],[3,"3"],[10,"10"],[30,"30"]],num:1}],
        ciz:s=>{const T=TU[s.t],v=tah(s),c=cel(s);let h=kartS(8,6,344,76,T.ad,[`Ölçümler: ${T.v.join(", ")} ${T.bir} (her ${T.zb})`,T.sad],"#0f7f86",{fs:13,w:600,ah:17});
          const X=j=>40+j*(280/(3+s.n)),mn=Math.min(...T.v,v,T.sinir),mx=Math.max(...T.v,v,T.sinir),Y=x=>212-(x-mn)/(mx-mn||1)*104;
          h+=`<line x1="30" y1="${Y(T.sinir)}" x2="340" y2="${Y(T.sinir)}" stroke="${KIRM}" stroke-width="2" stroke-dasharray="6 4"/>`+tx(34,Y(T.sinir)-6,"Gerçek hayat sınırı",{fs:13,r:KIRM,an:"start"});
          h+=`<polyline points="${T.v.map((x,j)=>X(j)+","+Y(x)).join(" ")}" fill="none" stroke="${MAV}" stroke-width="2.6"/>`+T.v.map((x,j)=>`<circle cx="${X(j)}" cy="${Y(x)}" r="4.5" fill="${MAV}"/>`).join("");
          h+=`<line x1="${X(3)}" y1="${Y(T.v[3])}" x2="${X(3+s.n)}" y2="${Y(v)}" stroke="${c?KIRM:YES}" stroke-width="2.4" stroke-dasharray="7 5"/><circle cx="${X(3+s.n)}" cy="${Y(v)}" r="6" fill="${c?KIRM:YES}"/>`;
          return h+tx(180,244,`Tahmin: ${Sn(v)} ${T.bir} · ${c?"Gerçek hayatla çelişir":"Gerçek hayatla uyumlu"}`,{fs:13.5,r:c?KIRM:YES});},
        bilgi:s=>`<span>Tahmin: <b>${Sn(tah(s))} ${TU[s.t].bir}</b></span>`,
        satir:s=>[TU[s.t].ad,s.n,`${Sn(tah(s))} ${TU[s.t].bir}`,cel(s)?"Çelişir":"Uyumlu"],anahtar:s=>s.t+s.n,
        gorev:[{m:"Ayçiçeği fidesinin boyunu <b>1 adım</b> ileri tahmin ediniz.",st0:{t:"z",n:10},ist:{t:"b",n:1},yan:()=>"Durum ve adım sayısını görev kartına göre seçiniz."},
          {m:"Ayçiçeği fidesinin boyunu <b>30 adım</b> ileri tahmin ediniz.",st0:{t:"b",n:1},ist:{t:"b",n:30},yan:()=>"Adım sayısı 30 olmalıdır."},
          {m:"Buz kalıbının kütlesini <b>3 adım</b> ileri tahmin ediniz.",st0:{t:"b",n:30},ist:{t:"z",n:3},yan:()=>"Durum buz kalıbı, adım 3 olmalıdır."},
          {m:"Buz kalıbının kütlesini <b>10 adım</b> ileri tahmin ediniz.",st0:{t:"z",n:3},ist:{t:"z",n:10},yan:()=>"Adım sayısı 10 olmalıdır.",
            soru:"Defterdeki tahminlere göre hangisi doğrudur?",secs:["Tahmin ne kadar uzağa uzatılırsa gerçek hayatla çelişme olasılığı o kadar artar.","Eğilim her zaman sonsuza kadar sürer.","Kısa süreli tahmin hiç yapılamaz."],ip:["30 adımda ayçiçeği 200 cm'yi geçti.","1 adımlık tahminler gerçek hayatla uyumluydu."],dm:"Tahmin kısa süre için ve yaklaşık söylenir."}]})),
      kuralA(D,[["Veri ötesi tahmin nasıl yapılmalıdır?",["Kısa süre için ve yaklaşık; eğilimin süremeyeceği gerçek hayat sınırları düşünülerek","Olabildiğince uzağa ve kesin","Eğilime bakmadan"],"Doğru! Eğilim her zaman aynı biçimde sürmez.",["30 adımlık tahmin çelişti.","Tahmin eğilimden yapılır."]]],"Tahminin sınırını buldunuz."),
      kendi("Bir mumun boyu her saat 2 cm kısalmaktadır; şu an 9 cm'dir. Hangi tahmin veriye dayanır ve gerçek hayatla çelişmez?",["1 saat sonra yaklaşık 7 cm","10 saat sonra −11 cm","Mum hiç bitmez"],"Doğru! Kısa süreli ve yaklaşık bir tahmindir.",["Uzunluk eksi olamaz.","Mum bir süre sonra biter."])],
    kural:"Veri ötesi tahmin <b>kısa süre için ve yaklaşık</b> söylenir. Eğilimi çok uzağa uzatmak, eğilimin her zaman süreceğini varsaymaktır ve gerçek hayatla (en uzun boy, sıfırın altına inemeyen kütle gibi) çelişebilir."});}

/* 17 · TARTIŞMA MASASI — iddiaya karar verip gerekçe kartı eklemek; arkadaşların itirazlarına veriyle cevap vermek */
const TRT=[{id:"“Bu takımın bütün oyuncuları 1,70 m'den uzundur.”",v:"Boylar (m): 1,74; 1,78; 1,69; 1,81; 1,76",k:"c",g:"k"},
 {id:"“Bu ilçede kışın tipik kar kalınlığı 30 cm'dir.” (ortalamaya bakılarak)",v:"Beş kışın kar kalınlıkları (cm): 12, 14, 15, 16, 93 · ortalama 30 · ortanca 15",k:"m",g:"o"},
 {id:"“Ülkemizdeki öğrenciler günde 2 saat satranç oynuyor.”",v:"Veri: Bir satranç kulübünün 15 üyesinden toplandı; ortalama 2 saat.",k:"c",g:"e"},
 {id:"“Köyümüzde yıllık yağış genel olarak azaldı.”",v:"Beş yılın yağışı (mm): 640, 610, 625, 580, 560",k:"a",g:"g"}];
const TK={a:"Kabul",c:"Çürüt",m:"Kısmen kabul"},TG={k:"Karşı örnek",o:"Özet değer",g:"Grafik (eğilim)",e:"Evren"};
const ITZ={k:"“Bir oyuncu kısa diye bütün iddia yanlış mı olur?”",o:"“Ortalama 30 cm; hesap doğru değil mi?”",e:"“15 kişi az değil, sonuç doğru olabilir!”",g:"“625 mm'lik yıl artış değil mi?”"};
const CVP={k:"“Evet; “bütün” sözü tek bir karşı örnekle çürür: 1,69 m.”",o:"“Hesap doğru ama 93 cm uç değer; tipik kalınlığı ortanca (15 cm) gösterir.”",e:"“Örneklem tek bir kulüpten; ülkedeki öğrencileri temsil etmez.”",g:"“Bir yıl artmış ama genel eğilim azalma; ilk yıl 640, son yıl 560 mm.”"};
function e_tartisma(p){const D=defterY(["İddia","Karar","Gerekçe"]);
  asamali(p,{tahmin:{giris:["İddia: “Bu sınıftaki herkes en az 8 saat uyuyor.”","Veri: Bir öğrenci 7 saat uyuyor."],soru:"Bu iddia için kararınız nedir?",secs:[["c","Çürütülür"],["a","Kabul edilir"],["m","Kısmen kabul edilir"]],dogru:"c",neden:"Tek bir karşı örnek “herkes” sözünü bozar."},
    asamalar:[asm(4,"Kurallar: Dört iddia vardır. Her iddia için bir <b>karar</b> ve bir <b>gerekçe kartı</b> seçiniz; seçtiğiniz gerekçeye bir arkadaşınız itiraz eder, sizin cevabınız ekranda görünür. Karar ve gerekçe doğruysa deftere yazınca iddia kapanır. Örnek: “Herkes” içeren bir iddiada karşı örnek bulunursa karar “Çürüt”, gerekçe “Karşı örnek” olur.",(k,A)=>lab(k,A,D,{st:{i:0,k:"-",g:"-"},W:360,H:310,
        kont:[{t:"sec",key:"k",ad:"Karar:",liste:Object.entries(TK)},{t:"sec",key:"g",ad:"Gerekçe kartı:",liste:Object.entries(TG)}],
        ciz:s=>{const I=TRT[s.i];let h=kartS(8,4,344,80,`İddia ${s.i+1} / 4`,sat(I.id,48),"#5f3dc4",{fs:13,w:800});h+=kartS(8,90,344,50,"",sat(I.v,50),"#868e96",{fs:13,w:600,ah:17});
          if(s.g!=="-"){h+=`<rect x="8" y="150" width="250" height="58" rx="14" fill="#fff4e6" stroke="${TURU}"/>`+tx(18,168,"Arkadaşınız:",{fs:13,an:"start",r:TURU})+satirlar(18,186,sat(ITZ[s.g],34),{fs:13,an:"start",w:600,ah:16});
            const dogru=s.g===I.g;h+=`<rect x="100" y="218" width="252" height="${dogru?84:58}" rx="14" fill="${dogru?"#ebfbee":"#f8f9fa"}" stroke="${dogru?YES:"#adb5bd"}"/>`+tx(110,236,"Siz:",{fs:13,an:"start",r:dogru?YES:"#495057"})+
              satirlar(110,254,sat(dogru?CVP[s.g]:"“Bu gerekçe bu iddiaya pek uymuyor; başka bir kart düşüneyim.”",34),{fs:13,an:"start",w:600,ah:16});}
          return h;},
        bilgi:s=>`<span>Karar: <b>${s.k==="-"?"?":TK[s.k]}</b></span><span>Gerekçe: <b>${s.g==="-"?"?":TG[s.g]}</b></span>`,
        yazKos:s=>s.k==="-"||s.g==="-"?"Önce karar ve gerekçe kartı seçiniz.":"",
        satir:s=>[s.i+1,TK[s.k],TG[s.g]],anahtar:s=>s.i+s.k+s.g,
        gorev:TRT.map((I,i)=>({m:`İddia ${i+1}: ${I.id}`,st0:{i,k:"-",g:"-"},ist:{k:I.k,g:I.g},
          yan:s=>s.k!==I.k?(I.k==="m"?"Sayı doğru ama vurgu yanıltıcı olabilir.":I.k==="a"?"Veri iddiayı destekliyor; genel eğilime bakınız.":"Veri bu iddiayı desteklemiyor."):"Kararınız doğru; arkadaşınızın itirazına en iyi cevap veren gerekçe kartını seçiniz."}))})),
      kuralA(D,[["Tartışmada hangi tutum doğrudur?",["Kişiyi değil iddiayı değerlendirmek; gerekçeyi veriden getirmek; yeni kanıta açık olmak","Karşıdakinin yanlış olduğunu yüksek sesle söylemek","Kararı hiç değiştirmemek"],"Doğru! “Bu veri bu iddiayı desteklemiyor, çünkü …” denir.",["Tartışmada kişiye değil iddiaya bakılır.","Yeni bir kanıt kararı değiştirebilir."]]],"İddiaları tartıştınız."),
      kendi("Bir arkadaşınız “Bu sınıfta kimse bisiklet sürmüyor.” demiştir. Sınıftaki 20 öğrenciden 6'sı bisiklet sürmektedir. En uygun cevap hangisidir?",["“Bu veri iddiayı desteklemiyor, çünkü 20 öğrenciden 6'sı bisiklet sürüyor.”","“Sen hep yanlış konuşuyorsun.”","“Belki haklısındır.”"],"Doğru! Gerekçe veriden gelir ve kişi değil iddia değerlendirilir.",["Kişiyi hedef almak tartışma değildir.","Veri varken kararsız kalmaya gerek yok."])],
    kural:"Bir iddiaya <b>kabul</b>, <b>çürütme</b> ya da <b>kısmen kabul</b> kararı verilir ve gerekçe veriden getirilir: karşı örnek, özet değer, eğilim ya da evren. Tartışmada kişi değil iddia değerlendirilir; yeni kanıt karşısında karar değiştirilebilir."});}

/* 18 · HABER SÜZGECİ — paylaşımları dört denetim süzgecinden geçirmek */
const HBR=[{b:"Yeni araştırma: Kahvaltı yapmayanlar daha uzun yaşıyor!",a:"Kaynak yok. Kimin araştırdığı yazmıyor.",s:"k"},
 {b:"İlimizdeki barajlarda su yüksekliği geçen yılın aynı gününe göre 2 m düşük.",a:"Bir kamu kurumunun sitesi; ölçüm tarihi ve yöntemi verilmiş; başka resmî kaynaklar da aynı değeri veriyor.",s:"x"},
 {b:"Bütün çocuklar artık tablete bağımlı!",a:"Bir haber sitesi; alt satırda: “Bir okulda 20 öğrenciye soruldu.”",s:"b"},
 {b:"Öğrencilerin çoğu okul formasını seviyor.",a:"Bir dergi; kaç öğrenciye, nerede ve nasıl sorulduğu yazmıyor.",s:"v"},
 {b:"Bu yaz son yüz yılın en sıcak yazı olacak!",a:"Bir kişinin hesabı; resmî hava tahminlerinde ve başka hiçbir güvenilir kaynakta böyle bir bilgi yok.",s:"d"}];
const SZG={k:"Kaynak",v:"Veri ve yöntem",b:"Başlık–veri uyumu",d:"Başka kaynaklar",x:"Hepsinden geçer"};
function e_haber(p){const D=defterY(["Paylaşım","Takıldığı süzgeç","Paylaşılır mı?"]);
  asamali(p,{tahmin:{giris:["Bir paylaşımda “Uzmanlar uyardı!” yazıyor; uzmanın kim olduğu yazmıyor."],soru:"Bu paylaşım hangi süzgeçte takılır?",secs:[["k","Kaynak"],["b","Başlık–veri uyumu"],["x","Hiçbirinde"]],dogru:"k",neden:"Kaynağı belli olmayan bilgi doğrulanamaz."},
    asamalar:[asm(5,"Her paylaşımı dört süzgeçten sırayla geçiriniz: <b>kaynak</b>, <b>veri ve yöntem</b>, <b>başlık–veri uyumu</b>, <b>başka kaynaklar</b>. Paylaşımın ilk takıldığı süzgeci (ya da hepsinden geçtiğini) seçip deftere yazınız.",(k,A)=>lab(k,A,D,{st:{i:0,s:"-"},W:360,H:230,
        kont:[{t:"sec",key:"s",ad:"Süzgeç:",liste:Object.entries(SZG)}],
        ciz:s=>{const H=HBR[s.i];let h=`<rect x="8" y="6" width="344" height="${40+20*sat(H.b,38).length+18*sat(H.a,46).length}" rx="12" fill="#fff" stroke="#495057" stroke-width="1.8"/><circle cx="28" cy="26" r="9" fill="#dee2e6"/>`+tx(44,31,`Paylaşım ${s.i+1} / 5`,{fs:13,an:"start",r:"#495057"});
          h+=satirlar(18,56,sat(H.b,38),{fs:15,an:"start",ah:20})+satirlar(18,62+20*sat(H.b,38).length,sat(H.a,46),{fs:13,an:"start",w:600,ah:18});
          const sz=["k","v","b","d"];sz.forEach((z,j)=>{const x=20+j*84,on=s.s===z,gec=s.s==="x"||sz.indexOf(s.s)>j;h+=`<path d="M${x} 170 h70 l-14 22 h-42z" fill="${on?"#ffe3e3":gec?"#d3f9d8":"#f1f3f5"}" stroke="${on?KIRM:gec?YES:"#adb5bd"}" stroke-width="2"/>`+tx(x+35,214,SZG[z].split(" ")[0],{fs:13});});
          return h;},
        bilgi:s=>`<span>Seçiminiz: <b>${s.s==="-"?"?":SZG[s.s]}</b></span>`,
        yazKos:s=>s.s==="-"?"Önce bir süzgeç seçiniz.":"",
        satir:s=>[s.i+1,SZG[s.s],s.s==="x"?"Evet":"Doğrulanmadan hayır"],anahtar:s=>s.i+s.s,
        gorev:HBR.map((H,i)=>({m:`Paylaşım ${i+1}: “${H.b}”`,st0:{i,s:"-"},ist:{s:H.s},yan:s=>({k:"Kaynağı belli mi?",v:"Kaç kişiye, nerede, nasıl sorulduğu yazıyor mu?",b:"Başlık verinin söylediğinden fazlasını mı söylüyor?",d:"Başka güvenilir kaynaklar ne diyor?",x:"Bu paylaşım bir süzgeçte takılıyor; sırayla deneyiniz."})[H.s]}))})),
      kuralA(D,[["Paylaşılabilecek haberin ortak özelliği nedir?",["Kaynağı güvenilir, veri ve yöntemi belli, başlığı veriyle uyumlu ve başka kaynaklarla doğrulanmış olması","Çok paylaşılmış olması","Başlığının dikkat çekici olması"],"Doğru! Doğrulanmamış haber paylaşılmaz.",["Beğeni ve paylaşım sayısı doğruluk göstermez.","Dikkat çekici başlık çoğu zaman abartılıdır."]]],"Haberleri süzdünüz."),
      kendi("Bir paylaşımda “Bir okulda 10 öğrenciye soruldu: Herkes yeni oyunu seviyor!” yazmaktadır. Bu paylaşım hangi süzgeçte takılır?",["Başlık–veri uyumu","Kaynak","Hiçbirinde"],"Doğru! 10 öğrencilik veriden “herkes” sonucu çıkmaz.",["Kaynak ve örneklem yazılmış.","Başlık veriyi aşıyor."])],
    kural:"Bir haber ya da paylaşım dört soruyla denetlenir: <b>Kaynağı</b> belli ve güvenilir mi? <b>Veri ve yöntem</b> verilmiş mi? <b>Başlık</b> verinin söylediğinden fazlasını mı söylüyor? <b>Başka güvenilir kaynaklar</b> ne diyor? Doğrulanmamış haber paylaşılmaz."});}

/* 19 · İZİN AYARLARI — uygulamaların izinlerini açıp kapatarak en az izinli doğru ayarı bulmak */
const IZN=[["konum","Konum"],["kamera","Kamera"],["mikrofon","Mikrofon"],["rehber","Rehber"]];

function e_izin(p){const D=defterY(["Uygulama","Açık izinler","Özellik çalışıyor mu?","Dışarı aktarılan"]);
  const acik=s=>IZN.filter(([k])=>s[k]==="a").map(([k])=>k);
  asamali(p,{tahmin:{giris:["Bir el feneri uygulaması rehberinize ve konumunuza erişmek istemektedir."],soru:"El fenerinin çalışması için bu izinler gerekli midir?",secs:[["h","Gerekli değildir"],["e","İkisi de gereklidir"],["r","Yalnız rehber gereklidir"]],dogru:"h",neden:"El feneri yalnız telefonun ışığını kullanır."},

/* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.

(function(){
  const NB=" ";

    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;

      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});

      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

<script>
(function(){
const D=document, H=D.documentElement, $=s=>D.querySelector(s);
const ANAHTAR="kb-ayar", ILR="kb-ilerleme:"+(D.title||location.pathname);
const oku=(k,v)=>{try{const s=localStorage.getItem(k);return s===null?v:JSON.parse(s)}catch(e){return v}};
const yaz=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const VARS={ses:true,boy:0,karsit:false,rahat:false,azhareket:matchMedia("(prefers-reduced-motion: reduce)").matches,tema:""};
let A=Object.assign({},VARS,oku(ANAHTAR,{}));

/* --- Düzen: başlık bandı, yan liste, gezinti --- */
const wrap=$(".wrap");
if(wrap){
  const h1=wrap.querySelector("h1"); let ust=h1; while(ust&&ust.parentElement!==wrap)ust=ust.parentElement;
  let hero;
  if(ust&&ust!==h1&&!ust.matches(".eyebrow,.lead")){ hero=ust; hero.classList.add("kb-hero"); wrap.prepend(hero); }
  else { hero=D.createElement("header"); hero.className="kb-hero";
    [...wrap.children].filter(e=>e.matches(".eyebrow,h1,.lead")).forEach(e=>hero.appendChild(e)); wrap.prepend(hero); }
  const idx=$("#index"), pan=$("#panel");
  if(idx&&pan){
    const d=D.createElement("div"); d.className="kb-duzen";
    const yan=D.createElement("aside"); yan.className="kb-yan"; yan.setAttribute("aria-label","Etkinlik listesi");
    const ana=D.createElement("main");
    pan.before(d); yan.appendChild(idx); ana.appendChild(pan); d.append(yan,ana);
    const g=D.createElement("nav"); g.className="kb-gezinti"; g.setAttribute("aria-label","Etkinlikler arası geçiş");
    g.innerHTML='<button class="ghost" id="kbOnce">‹ Önceki</button><span id="kbSira"></span><button class="primary" id="kbSonra">Sonraki ›</button>';
    ana.appendChild(g);
    const pr=D.createElement("div"); pr.className="kb-ilerleme"; pr.innerHTML='<div class="kb-bar"><i id="kbBar"></i></div><span id="kbSay"></span>'; hero.appendChild(pr);
  }
}
const linkler=()=>[...D.querySelectorAll("#index a[data-i]")];
const simdiki=()=>{const a=$('#index a[aria-current="true"]');return a?+a.dataset.i:-1};
let tamam=new Set(oku(ILR,[]));
function ilerleme(){const L=linkler(); if(!L.length)return;
  L.forEach(a=>a.classList.toggle("kb-tamam",tamam.has(+a.dataset.i)));
  const n=L.filter(a=>tamam.has(+a.dataset.i)).length;
  const b=$("#kbBar"); if(b)b.style.width=(100*n/L.length)+"%";
  const s=$("#kbSay"); if(s)s.textContent=n+" / "+L.length+" etkinlik tamamlandı";
  const i=simdiki(), r=$("#kbSira"); if(r)r.textContent=(i+1)+" / "+L.length;
  const o=$("#kbOnce"), z=$("#kbSonra"); if(o)o.disabled=i<=0; if(z)z.disabled=i>=L.length-1;}
let gecis=0;
function git(d){const L=linkler(), i=simdiki()+d; if(L[i]){gecis=Date.now(); L[i].click();}}
$("#kbOnce")&&($("#kbOnce").onclick=()=>git(-1)); $("#kbSonra")&&($("#kbSonra").onclick=()=>git(1));
const idx=$("#index"); if(idx){ idx.addEventListener("click",()=>{gecis=Date.now()},true);
  new MutationObserver(()=>setTimeout(ilerleme,0)).observe(idx,{subtree:true,attributes:true,attributeFilter:["aria-current"]}); }
window.addEventListener("hashchange",()=>{gecis=Date.now()});
setTimeout(ilerleme,50);

/* --- Ses --- */
let ac=null;
function ton(f,t0,sure,tip,hacim){const c=ac;const o=c.createOscillator(),g=c.createGain();o.type=tip;o.frequency.setValueAtTime(f[0],c.currentTime+t0);
  if(f[1])o.frequency.exponentialRampToValueAtTime(f[1],c.currentTime+t0+sure);
  g.gain.setValueAtTime(0.0001,c.currentTime+t0);g.gain.exponentialRampToValueAtTime(hacim,c.currentTime+t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t0+sure);
  o.connect(g).connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+sure+0.02);}
function sesCal(tur){ if(!A.ses)return; try{ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended")ac.resume();
  if(tur==="ok"){ton([659],0,.13,"sine",.22);ton([880],.11,.16,"sine",.22);ton([1319],.22,.22,"sine",.12);}
  else if(tur==="no"){ton([260,180],0,.28,"triangle",.2);}
  else ton([1200],0,.04,"sine",.06); }catch(e){} }
function kutla(el){ if(A.azhareket||!el)return; const r=el.getBoundingClientRect(); const k=D.createElement("div"); k.className="kb-kutlama";
  k.style.left=(r.left+Math.min(60,r.width/2))+"px"; k.style.top=(r.top+r.height/2)+"px";
  const renk=["var(--p1)","var(--p2)","var(--p3)","var(--p4)","var(--p5)","var(--p6)"];
  for(let i=0;i<18;i++){const p=D.createElement("i");const a=Math.random()*Math.PI*2,m=50+Math.random()*70;
    p.style.background=renk[i%6];p.style.setProperty("--x",Math.cos(a)*m+"px");p.style.setProperty("--y",(Math.sin(a)*m-30)+"px");k.appendChild(p);}
  D.body.appendChild(k); setTimeout(()=>k.remove(),900); }

/* Doğru / yanlış geri bildirimini yakala: etkinlik kodu fb(...) ya da .ok/.no sınıfı kullanır */
let sonEylem=0; ["click","keydown"].forEach(t=>D.addEventListener(t,e=>{ if(t==="click"||e.key==="Enter"||e.key===" ")sonEylem=Date.now(); },true));
let kuyruk=[], zam=null;
const has=(s,t)=>(" "+(s||"")+" ").includes(" "+t+" ");
new MutationObserver(ms=>{ const now=Date.now(); if(now-sonEylem>900||now-gecis<450)return;
  ms.forEach(m=>{ const el=m.target; if(!(el instanceof Element)||el.closest(".kb-menu,.kb-yonerge,#index"))return;
    const fb=el.classList.contains("fb"), ok=el.classList.contains("ok"), no=el.classList.contains("no");
    if(!ok&&!no)return; if(!fb&&((ok&&has(m.oldValue,"ok"))||(no&&has(m.oldValue,"no"))))return;
    kuyruk.push({el,fb,ok}); });
  if(kuyruk.length&&!zam)zam=setTimeout(()=>{ const f=kuyruk.filter(x=>x.fb).pop(); let ok, el;
      if(f){ok=f.ok;el=f.el}else{ok=!kuyruk.some(x=>!x.ok);el=kuyruk[kuyruk.length-1].el}
      kuyruk=[];zam=null; sesCal(ok?"ok":"no");
      if(ok){ kutla(el); const i=simdiki(); if(i>=0&&(f||!$("#panel .fb"))){tamam.add(i);yaz(ILR,[...tamam]);ilerleme();} }
      const d=$("#kbDuyuru"); if(d)d.textContent=ok?"Doğru.":"Yeniden deneyiniz."; },110);
}).observe(D.body,{subtree:true,attributes:true,attributeFilter:["class"],attributeOldValue:true});

/* --- Ayarları uygula --- */
function uygula(){ H.classList.toggle("kb-sesyok",!A.ses);
  ["karsit","rahat","azhareket"].forEach(k=>H.classList.toggle("kb-"+k,!!A[k]));
  H.classList.toggle("kb-y1",A.boy===1); H.classList.toggle("kb-y2",A.boy===2);
  if(A.tema)H.setAttribute("data-theme",A.tema); else H.removeAttribute("data-theme");
  const s=$("#kbSes"); s.setAttribute("aria-pressed",A.ses); $("#kbSesY").textContent=A.ses?"Ses açık":"Ses kapalı";
  s.querySelector(".on").style.display=A.ses?"":"none"; s.querySelector(".off").style.display=A.ses?"none":"";
  D.querySelectorAll(".kb-anahtar").forEach(b=>b.setAttribute("aria-checked",!!A[b.dataset.k]));
  D.querySelectorAll("#kbBoy button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.v===A.boy));
  D.querySelectorAll("#kbTema button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===A.tema));
  yaz(ANAHTAR,A); }
uygula();
const dug=$("#kbDugme"), men=$("#kbMenu");
function menu(ac_){ men.hidden=!ac_; dug.setAttribute("aria-expanded",ac_); if(ac_)men.querySelector("button").focus(); }
dug.onclick=()=>menu(men.hidden);
D.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!men.hidden){menu(false);dug.focus();} });
D.addEventListener("click",e=>{ if(!men.hidden&&!men.contains(e.target)&&!dug.contains(e.target))menu(false); });
$("#kbSes").onclick=()=>{A.ses=!A.ses;uygula();sesCal("ok");};
D.querySelectorAll(".kb-anahtar").forEach(b=>b.onclick=()=>{A[b.dataset.k]=!A[b.dataset.k];uygula();});
D.querySelectorAll("#kbBoy button").forEach(b=>b.onclick=()=>{A.boy=+b.dataset.v;uygula();});
D.querySelectorAll("#kbTema button").forEach(b=>b.onclick=()=>{A.tema=b.dataset.v;uygula();});
$("#kbSifir").onclick=()=>{A=Object.assign({},VARS);uygula();};
const tam=$("#kbTam"); if(!D.fullscreenEnabled)tam.hidden=true;
tam.onclick=()=>{ try{ D.fullscreenElement?D.exitFullscreen():H.requestFullscreen(); }catch(e){} };

/* --- Yönerge ve sesli okuma --- */
const metin=el=>{ if(!el)return ""; const c=el.cloneNode(true); c.querySelectorAll(".frac").forEach(f=>{const s=f.querySelectorAll("span"); if(s.length>1)f.replaceWith(s[0].textContent+"/"+s[1].textContent);}); return c.textContent.replace(/\s+/g," ").trim(); };
const PAYDA={2:"ikide",3:"üçte",4:"dörtte",5:"beşte",6:"altıda",7:"yedide",8:"sekizde",9:"dokuzda",10:"onda",12:"on ikide",20:"yirmide",100:"yüzde"};
const okunus=t=>String(t).replace(/(−|-)?(\d+)\/(\d+)/g,(m,sg,a,b)=>(sg?"eksi ":"")+(PAYDA[b]||b+"'te")+" "+a).replace(/\|([^|]+)\|/g,"$1'in mutlak değeri").replace(/(^|[\s(])−\s?(\d)/g,"$1eksi $2").replace(/°C/g," derece");
const kesH=t=>String(t).replace(/(−|-)?(\d+)\/(\d+)/g,(m,sg,a,b)=>(sg?"−":"")+'<span class="frac"><span>'+a+'</span><span>'+b+'</span></span>');
const sesPuan=v=>(/natural|online|neural/i.test(v.name)?4:/google/i.test(v.name)?3:/enhanced|premium|geliş|siri/i.test(v.name)?3:1);
function yonergeMetni(){ const p=$("#panel")||D.body, h=p.querySelector("h2"), g=[];
  p.querySelectorAll(".intro,.task").forEach(e=>{const t=metin(e); if(t&&!g.includes(t)&&g.length<2)g.push(t);});
  if(!g.length&&$(".lead"))g.push(metin($(".lead")));
  return {baslik:metin(h)||D.title, gorev:g}; }
function yonergeAc(){ const y=yonergeMetni(); $("#kbYB").textContent=y.baslik;
  $("#kbYIc").innerHTML='<p class="gorev"></p><ol><li>Görevi okuyunuz; şekil ya da sayı doğrusu üzerinde deneme yapabilirsiniz.</li><li>Cevabınızı yazıp ya da seçip <b>Kontrol edin</b> düğmesine basınız.</li><li>Geri bildirimi okuyunuz. Yanlışsa ipucuyla yeniden deneyiniz.</li><li><b>Yeni soru</b> ile aynı etkinliği farklı sayılarla tekrarlayabilir, <b>Sonraki</b> ile ilerleyebilirsiniz.</li></ol><p style="font-size:14px;color:var(--muted)">Klavye: Tab ile düğmeler arasında geçiniz, Enter ile seçiniz. Esc menüyü kapatır.</p>';
  $("#kbYIc .gorev").innerHTML=kesH(y.gorev.join(" ").replace(/[<>&]/g,""));
  const d=$("#kbYonerge"); menu(false); if(d.showModal)d.showModal(); else d.setAttribute("open",""); }
$("#kbYon").onclick=yonergeAc;
$("#kbYKapat").onclick=()=>{ const d=$("#kbYonerge"); speechSynthesis&&speechSynthesis.cancel(); d.close?d.close():d.removeAttribute("open"); };
const konusabilir="speechSynthesis" in window;
function sesliOku(t){ if(!konusabilir)return; speechSynthesis.cancel();
  const v=speechSynthesis.getVoices().filter(v=>/^tr/i.test(v.lang)).sort((a,b)=>sesPuan(b)-sesPuan(a))[0];
  (okunus(t).match(/[^.!?]+[.!?]?/g)||[t]).forEach(c=>{ const u=new SpeechSynthesisUtterance(c.trim()); u.lang="tr-TR"; u.rate=.95; if(v)u.voice=v; speechSynthesis.speak(u); }); }
function okuPanel(){ const y=yonergeMetni(); sesliOku(y.baslik+". "+y.gorev.join(" ")); }
if(!konusabilir){ $("#kbOku").hidden=true; $("#kbYOku").hidden=true; }
$("#kbOku").onclick=()=>{ const b=$("#kbOku"); if(b.getAttribute("aria-pressed")==="true"){speechSynthesis.cancel();b.setAttribute("aria-pressed","false");return;}
  b.setAttribute("aria-pressed","true"); okuPanel(); const t=setInterval(()=>{ if(!speechSynthesis.speaking){b.setAttribute("aria-pressed","false");clearInterval(t);} },400); };
$("#kbYOku").onclick=()=>sesliOku(metin($("#kbYB"))+". "+metin($("#kbYIc")));
})();

<script id="kesir-cizgi">
/* ANA_KURALLAR §4.y-3: Etkinliklerde bütün kesirler kesir çizgisiyle (alt alta pay/payda) gösterilir. Düz yazılmış a/b biçimleri otomatik dönüştürülür. */
(function(){
  if (window.__kesirCizgi) return; window.__kesirCizgi = 1;
  const RX = /(^|[^\w\/.,:%])([−-])?(?:(\d+) )?(\d{1,4})\/(\d{1,4})(?![\w\/.,]\d|\w)/g;
  const ATLA = "script,style,svg,textarea,input,select,code,.ilr,.frac,[data-duz]";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function donustur(kok){
    if (!kok || !kok.nodeType) return;
    if (kok.nodeType === 3) kok = kok.parentElement;
    if (!kok || (kok.closest && kok.closest(ATLA))) return;
    const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      if (!/\d\/\d/.test(t.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = t.parentElement; if (!p || p.closest(ATLA)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const L = []; let t; while ((t = w.nextNode())) L.push(t);
    L.forEach(t => {
      let deg = false;
      const h = esc(t.nodeValue).replace(RX, (m, a, s, tam, p, q) => { deg = true;
        return a + (s ? "−" : "") + (tam ? tam + " " : "") + '<span class="frac"><span>' + p + "</span><span>" + q + "</span></span>"; });
      if (!deg) return;
      const k = document.createElement("span"); k.innerHTML = h; t.replaceWith(...k.childNodes);
    });
  }
  let bekleyen = new Set(), plan = 0;
  const calis = () => { plan = 0; const b = bekleyen; bekleyen = new Set(); b.forEach(donustur); };
  const gozcu = new MutationObserver(ms => { ms.forEach(m => {
      if (m.type === "characterData") bekleyen.add(m.target); else m.addedNodes.forEach(n => bekleyen.add(n)); });
    if (!plan) plan = requestAnimationFrame(calis); });
  const bas = () => { donustur(document.body); gozcu.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bas); else bas();
  const st = document.createElement("style");
  st.textContent = ".frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}.frac>span{display:block;text-align:center;padding:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor}";
  document.head.appendChild(st);
})();
</script>
