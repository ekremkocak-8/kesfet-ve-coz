<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çözümler · Keşfet ve Çöz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--muted:#5b6478;--line:#dfe5ef;--bg:#f5f7fb;--card:#fff;--ss:#6741d9;--kk:#0b7285;--b:#d0700f;--ok:#2b8a3e;--warn:#c92a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif}
header{background:linear-gradient(135deg,#1c5fbf,#2f8fe0);color:#fff;padding:18px 16px 22px}

main{max-width:780px;margin:14px auto 40px;padding:0 16px}
nav.sec{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}nav.sec button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}

ol.sec{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
ol.sec li{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}ol.sec li.dogru{border-color:var(--ok);background:#ebfbee;font-weight:800}
.adim{border-left:4px solid var(--c);padding:6px 12px;margin:8px 0;background:#fff;border-radius:0 10px 10px 0;animation:gel .35s ease-out}
.adim b{color:var(--c)}@keyframes gel{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dug{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
button.btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.dikkat{background:#fff4e6;border:2px solid #f59f00;border-radius:12px;padding:10px 14px;margin:12px 0 4px}.dikkat b{color:#d9480f}
.tuzak{font-size:15px;color:var(--muted);margin-top:8px}
.cevap{font-weight:900;color:var(--ok);margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid var(--line);padding:8px 10px;text-align:left}th{background:#e3fafc;color:#0b7285;font-size:13px;letter-spacing:.06em}
.ses{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border-radius:12px;background:#eef2ff}

.ses span{font-size:14px;color:var(--muted)}
.gizli{display:none}
.tum{margin:4px 0 14px;font-size:14px}.tum a{color:#1c5fbf;font-weight:800}
@media (prefers-reduced-motion:reduce){.adim{animation:none}}
/* Canlandır (05.10.2026) */
.sek{display:flex;gap:6px;margin:12px 0 0;border-bottom:2px solid var(--line)}
.sek button{border:0;background:none;font:inherit;font-weight:900;font-size:15px;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);min-height:44px;position:relative;top:2px;border-bottom:3px solid transparent}
.sek button[aria-selected=true]{color:var(--c);border-bottom-color:var(--c);background:#fff8f0}
.sek .yeni{display:inline-block;font-size:10px;background:#2b8a3e;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.06em}
.cn{padding-top:10px}
.cn-yon{background:#eef6ff;border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:10px}
.cn-sahne{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;min-height:120px;overflow-x:auto}

.cn-adimci input,.cn-test input{width:84px;height:44px;border:2px solid var(--line);border-radius:12px;font:inherit;font-weight:900;text-align:center;font-size:18px}
.cn-test label{font-weight:800;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.cn-btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
.cn-btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.cn-btn[aria-pressed=true]{background:var(--ac,var(--c));color:#fff;border-color:var(--ac,var(--c))}
.cn-btn:disabled{opacity:.5}
.cn-hazir{display:flex;flex-wrap:wrap;gap:6px}

.cn-dur .iyi{color:var(--ok);font-weight:900}.cn-dur .kotu{color:var(--warn);font-weight:900}
.cn-df{margin-top:10px;overflow-x:auto}@media(max-width:480px){.cn-adimci>span{flex-basis:100%}.cn-h{font-size:12px;padding:5px 0}.cn-izg{gap:3px}.cn-sahne{padding:6px}}@media(max-width:480px){.cn-df table{font-size:13px}.cn-df td,.cn-df th{padding:4px 5px}}.cn-df summary{font-weight:900;cursor:pointer;padding:6px 0}.cn-say{color:var(--muted);font-weight:700}
.cn-df table{font-size:15px}.cn-df td{padding:5px 8px}.cn-df tr.cn-iyi td{background:#ebfbee}.cn-df tr.cn-kotu td{background:#fff5f5}.cn-df tr.cn-son td{outline:2px solid var(--c);outline-offset:-2px}
.cn-p{animation:cnGel .35s ease-out both}@keyframes cnGel{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cn-o{fill:#ffa94d;stroke:#d9480f;stroke-width:1}.cn-o2{fill:#e8590c}.cn-k{fill:#ffc9c9;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:3 2}
.cn-cerceve{stroke:#2b8a3e;stroke-width:3}.cn-et{font-size:13px;font-weight:800;fill:#5b6478}.cn-et.b,.cn-et2b{font-weight:900;fill:#1d2433}.cn-et2{font-size:11px;fill:#5b6478;font-weight:700}.cn-et2b{font-size:13px;fill:#fff}
.cn-ku{fill:#fff4e6;stroke:#ffa94d;stroke-width:1.5}.cn-kk{fill:#fff5f5;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:4 3}
.cn-tahta0{fill:#f1f3f5;stroke:#ced4da}.cn-tahta{fill:#c08552;stroke:#8d5a2b}
.cn-ek{stroke:#868e96;stroke-width:2}.cn-sinir{stroke:#c92a2a;stroke-width:3;stroke-dasharray:5 4}.cn-yay{fill:none;stroke:#f76707;stroke-width:2}
.cn-v1{stroke:#2b8a3e;stroke-width:3}.cn-v2{stroke:#c92a2a;stroke-width:3}.cn-kis{font-size:20px}.cn-bus{font-size:16px}.cn-bek{stroke:#c92a2a;stroke-width:5;stroke-linecap:round;opacity:.6}
.cn-kum{fill:#ffe8cc;stroke:#e8590c;stroke-width:3}.cn-kum2{fill:#495057}.cn-para{fill:#ffd43b;opacity:.85}.cn-buyuk{font-size:26px;font-weight:900;fill:#1d2433}
.cn-zem{fill:#adb5bd}.cn-kat{fill:#f1f3f5;stroke:#ced4da}.cn-katon{fill:#d3f9d8;stroke:#2b8a3e}.cn-katoff{fill:#ffe3e3;stroke:#e03131}
.cn-izg{display:grid;gap:4px}.cn-h,.cn-gb{border-radius:8px;text-align:center;font-weight:800;font-size:14px;padding:6px 0}.cn-h{background:#f1f3f5;transition:background .25s,transform .25s}
.cn-gb{background:none;color:var(--muted);font-size:12px}.cn-h.on{background:#ffa94d;color:#1d2433}.cn-h.yeni{transform:scale(1.18);box-shadow:0 0 0 3px #e8590c}
.cn-kartlar{display:flex;flex-wrap:wrap;gap:6px;padding:4px}.cn-kart{min-width:44px;padding:8px 10px;text-align:center;border-radius:10px;background:#fff4e6;border:2px solid #ffa94d;font-weight:900;animation:cnGel .3s}
.cn-kart.kare{background:#e7f5ff;border-color:#1c7ed6}.cn-bosk{color:var(--muted)}
.cn-cift{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 4px;font-weight:800}.cn-cift i{font-weight:600;color:#1c7ed6}
.cn-katlar{padding:4px}.cn-katsat{display:inline-flex;flex-wrap:wrap;gap:6px}.cn-kat2{background:#e6fcf5;border:1.5px solid #12b886;border-radius:8px;padding:3px 8px;font-weight:800;animation:cnGel .3s}.cn-sonsuz{font-weight:800;color:#0b7285}
.cn-onr{background:#f8f0fc;border:2px solid #ae3ec9;border-radius:12px;padding:10px 14px}.cn-kanit{padding:10px 4px 2px}
.cn-kay{display:inline-flex;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap}.cn-kay{max-width:100%}.cn-kay input{width:min(220px,70vw);accent-color:#d0700f}.cn-satir>*{min-width:0;max-width:100%}
@media (prefers-reduced-motion:reduce){.cn-p,.cn-kart,.cn-kat2{animation:none}.cn-h{transition:none}}
/* 05.10.2026 · KOŞUL ve LABİRENT motorları (SB 6.1.1) */
@media(max-width:560px){.soru [style*="grid-template-columns:repeat"]{grid-template-columns:1fr!important}}   /* çok sütunlu konuşma balonları telefonda alt alta */
.cn-kl{list-style:none;padding:0;margin:0;display:grid;gap:4px}.cn-not{color:var(--muted);font-size:14px}.cn-sonuc{margin-top:6px;font-weight:800}
.cn-secg{gap:6px}.cn-secad{font-weight:800;flex-basis:100%}.cn-secg .cn-btn{padding:8px 12px}
.cn-mv{fill:#74c0fc;stroke:#1c7ed6;stroke-width:1}.cn-tl{fill:#69db7c;stroke:#2b8a3e;stroke-width:1.5}
.cn-lab{display:grid;gap:4px;align-items:center;max-width:460px;margin:0 auto}
.cn-lc{min-height:44px;border-radius:8px;border:1.5px solid #ced4da;background:#fff;font:inherit;font-weight:900;font-size:16px;cursor:pointer;padding:0;color:var(--ink)}
.cn-lc.yol{background:#d3f9d8;border-color:#2b8a3e}.cn-lc.simdi{background:#2b8a3e;color:#fff;box-shadow:0 0 0 3px #b2f2bb}.cn-lc.kapali{background:#ffe3e3;border-color:#e03131;color:#c92a2a;text-decoration:line-through}
.cn-lok{color:#2b8a3e;font-weight:900;text-align:center}.cn-lcik{min-height:44px;border:0;background:none;font:inherit;font-weight:900;color:#d9480f;cursor:pointer;padding:0;white-space:nowrap;font-size:14px}.cn-lcik:disabled{cursor:default}

</style></head><body>
<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }
      if (!art && !o.sandalye) sv += `<rect x="10" y="10" width="${gen * hc}" height="${sira * hc}" fill="none" class="cn-cerceve"/>
        <text x="${10 + gen * hc / 2}" y="${H + 4}" class="cn-et" text-anchor="middle">${gen} ${o.birim || ""}</text>
        <text x="${W + 4}" y="${10 + sira * hc / 2}" class="cn-et" dominant-baseline="middle">${sira} ${o.birim || ""}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W + 70} ${H + 22}" role="img" aria-label="${N} ${o.ad || "kare"}, her sırada ${gen}">${sv}</svg>`;
      const r = o.kural ? o.kural(gen, sira, art, N) : null;
      let m;
      if (art) m = `<span class="kotu">✘</span> ${N} ${o.ad || "kare"} her sırada ${gen} olacak biçimde dizilince ${sira} tam sıra oluşur, <b>${art} ${o.ad || "kare"} artar</b>. Dikdörtgen olmaz: ${N} : ${gen} işleminde kalan ${art}.`;
      else m = `<span class="iyi">✔</span> <b>${N} = ${gen} ${x} ${sira}</b> · ${sira} sıra, her sırada ${gen} ${o.ad || "kare"}; hiç artmadı.` + (gen === sira ? ` <b>Kare oldu!</b> İki kenar aynı: ${gen}.` : "");
      if (!art && o.cevre) m += ` Çevre = 2 ${x} (${gen} + ${sira}) = <b>${2 * (gen + sira)} m</b>.`;
      if (r && r.msg) m += `<br>${r.msg}`;
      s.dur.innerHTML = m;
      const sutunlar = o.satir ? o.satir(gen, sira, art, N, r) : [gen, art ? `${sira} (+ ${art} artan)` : sira, art, art ? "olmaz" : (gen === sira ? "kare" : "dikdörtgen")];
      s.yaz(N + ":" + gen, sutunlar, !art && (!r || r.ok !== false));
    }
    ciz(g.get());
  }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {
    const N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });
    const g = adimci(o.etiket, 1, o.max || N, o.bas || 2, v => { sonK = v; });

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {

const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };
function iskelet(el, o) {
  el.innerHTML = "";
  const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
  const sah = h("div", "cn-sahne"), den = h("div", "cn-den"), dur = h("div", "cn-dur", o.ilk || "Bir deneme yapınız.");
  dur.setAttribute("aria-live", "polite");
  const df = h("details", "cn-df"); df.open = true;
  df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
  el.append(y, sah, den, dur, df);
  const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"), kayit = new Set();
  const yaz = (k, hc, iyi) => { if (kayit.has(k)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === k)); return; }
    kayit.add(k); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = k; tr.innerHTML = hc.map(c => `<td>${c}</td>`).join("");
    [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son"); tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`; };
  return { sah, den, dur, yaz };
}
function adimci(etiket, min, max, deger, deg) {
  const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
  const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
  const ayarla = (v, sessiz) => { v = Math.max(min, Math.min(max, Math.round(+v || 0))); i.value = v; if (!sessiz) deg(v); };
  a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
  return { w, ayarla, get: () => +i.value };
}

/* ===== YENİ MOTOR · BÖLME: uzun bölme makinesi =====
   o: {pay, payda, minPay, maxPay, maxPayda, hazir:[[p, q, ad]], cizim(p,q)→html, numarala, isaretle:[basamak no], kontrol(r)→{ok,msg}|null,
       satir(r, K)→hücreler, sutun, yon, bitis, ilk} */
CN.BOLME = function (el, o) {
  const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kesir", "Ondalık gösterim", "Sonlu mu, devirli mi?"], ilk: o.ilk || "Bir adım böl düğmesine basınız." });
  let P = o.pay, Q = o.payda, R = null, n = 0;
  const kut = h("div", "cn-satir");
  const aP = adimci("Pay:", o.minPay ?? 0, o.maxPay || 99, P, v => { P = v; yeni(); }), aQ = adimci("Payda:", 1, o.maxPayda || 99, Q, v => { Q = v; yeni(); });
  kut.append(aP.w, aQ.w); s.den.appendChild(kut);
  if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(([p, q, ad]) => { const b = dug(`${ad ? ad + ": " : ""}${kesH(p, q)}`, "ghost"); b.onclick = () => { P = p; Q = q; aP.ayarla(p, true); aQ.ayarla(q, true); yeni(); }; hz.appendChild(b); }); s.den.appendChild(hz); }
  const alt = h("div", "cn-satir"), bA = dug("Bir adım böl ▶"), bT = dug("Bölmeyi bitir ⏩", "ghost"); alt.append(bA, bT); s.den.appendChild(alt);
  const bitti = () => n >= R.adim.length;
  function ciz() {
    const A = R.adim.slice(0, n), B = A.map(x => x.d), son = bitti();
    let bolum;
    if (son && !R.sonlu) bolum = R.html + (o.numarala ? "" : "");
    else bolum = `<span class="nw">${R.s ? M : ""}${R.tam}${B.length || !son ? "," : ""}${B.map((d, i) => `<span class="${i === B.length - 1 ? "yeni" : ""}">${d}</span>`).join("")}${!son ? "<span style='color:#adb5bd'>…</span>" : ""}</span>`;
    if (o.numarala) bolum = `<span class="nw">${R.s ? M : ""}${R.tam},</span>` + B.map((d, i) => `<span class="bm-no${(o.isaretle || []).includes(i + 1) ? " on" : ""}">${d}<small>${i + 1}.</small></span>`).join("") + (!son ? "…" : "");
    const tekrar = son && !R.sonlu ? R.dev : -1;
    const satir = A.map((x, i) => `<tr class="${tekrar >= 0 && i >= tekrar ? "dv1" : ""}${tekrar >= 0 && i === tekrar ? " tek" : ""}"><td>${i + 1}</td><td>${x.bl} : ${R.q}</td><td><b>${x.d}</b></td><td>${x.k}</td></tr>`).join("");
    s.sah.innerHTML = `${o.cizim ? `<div class="bm-cz">${o.cizim(R.p, R.q)}</div>` : ""}<div class="bm-ust"><span>${kesH(R.p, R.q)} = ${T(R.p)} : ${R.q}</span><span class="bm-bol">= ${bolum}</span></div>
      <table class="bm-tab"><thead><tr><th>Adım</th><th>Bölme</th><th>Bölüme yazılan</th><th>Kalan</th></tr></thead><tbody><tr><td>0</td><td>${Math.abs(R.p)} : ${R.q}</td><td><b>${R.tam}</b> (tam kısım)</td><td>${R.adim.length ? R.adim[0].r0 : 0}</td></tr>${satir}</tbody></table>`;
    const [sp, sq] = sade(R.p, R.q);
    if (!son) { s.dur.innerHTML = n ? `${n}. adım: kalan ${A[n - 1].k}. ${A[n - 1].k ? "Kalanın sağına 0 yazılır, bölmeye devam edilir." : ""}` : `${Math.abs(R.p)} : ${R.q}: bölüm ${R.tam}, kalan ${R.adim.length ? R.adim[0].r0 : 0}. ${R.adim.length ? "Bölüme virgül konur." : ""}`; return; }
    let m = R.sonlu ? `<span class="iyi">■</span> Kalan 0 oldu; bölme bitti. <b>${kesH(R.p, R.q)} = ${R.html}</b> → <b>sonlu</b> ondalık gösterim.`
      : `<span class="kotu">↻</span> Kalan <b>${R.adim[R.dev].r0}</b> yeniden geldi: bölme bundan sonra aynı adımları tekrar eder. Devreden basamak${R.adim.length - R.dev > 1 ? "lar" : ""}: <b>${R.metin.split("[")[1].replace("]", "")}</b>. <b>${kesH(R.p, R.q)} = ${R.html}</b> → <b>devirli</b> ondalık gösterim.`;
    m += `<div class="bm-oz">${sq === 1 ? `Kesir bir tam sayıya eşittir: ${T(sp)}.` : `En sade hâli ${kesH(sp, sq)}; paydası ${sq} = ${asalC(sq).join(" · ")}.`}</div>`;
    const K = o.kontrol ? o.kontrol(R) : null; if (K) m += `<div class="cn-sonuc">${K.ok === true ? '<span class="iyi">✔</span> ' : K.ok === false ? '<span class="kotu">✘</span> ' : ""}${K.msg}</div>`;
    s.dur.innerHTML = m;
    s.yaz(R.p + "/" + R.q, o.satir ? o.satir(R, K) : [kesH(R.p, R.q), R.html, R.sonlu ? "sonlu" : "devirli"], K && K.ok != null ? K.ok : null);
  }
  function yeni() { R = bol(P, Q, o.sinir || 120, !!o.numarala); n = 0; bA.disabled = bT.disabled = false; ciz(); }
  bA.onclick = () => { if (bitti()) return; n++; if (bitti()) bA.disabled = bT.disabled = true; ciz(); };
  bT.onclick = () => { n = R.adim.length; bA.disabled = bT.disabled = true; ciz(); };
  yeni();
};

const tx = (x, y, s, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.a || "middle"}" font-size="${o.fs || 14}" font-weight="${o.w || 800}" fill="${o.renk || "#1d2433"}">${s}</text>`;
const nok = (x, y, renk, r = 7) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${renk}" stroke="#fff" stroke-width="2"/>`;
const sonucP = s => `<p class="cn-sonuc">${s}</p>`;
const evet = b => b ? "evet" : "hayır";
function pasta(p, q) { if (q > 24) return ""; const cx = 80, cy = 80, r = 66; let s = "";
  for (let i = 0; i < q; i++) { const a1 = i / q * 2 * Math.PI - Math.PI / 2, a2 = (i + 1) / q * 2 * Math.PI - Math.PI / 2, ye = i < p;
    s += `<path d="M${cx} ${cy}L${cx + r * Math.cos(a1)} ${cy + r * Math.sin(a1)}A${r} ${r} 0 ${q === 1 ? 1 : 0} 1 ${cx + r * Math.cos(a2)} ${cy + r * Math.sin(a2)}Z" fill="${ye ? "#fff" : "#ffd8a8"}" stroke="${ye ? "#868e96" : "#d9480f"}" stroke-width="2" ${ye ? 'stroke-dasharray="5 4"' : ""}/>`; }
  return `<svg viewBox="0 0 360 160" role="img" aria-label="pasta">${s}${tx(170, 70, `${q} eş dilim`, { a: "start", fs: 15 })}${tx(170, 96, `${Math.min(p, q)} dilim yendi (kesikli)`, { a: "start", fs: 15, renk: "#5b6478" })}</svg>`; }

an>5</span><span>10</span></span></span> = <span class=\"nw\">12<span class=\"frac\"><span>1</span><span>2</span></span></span>; 12,75 = <span class=\"nw\">12<span class=\"frac\"><span>75</span><span>100</span></span></span> = <span class=\"nw\">12<span class=\"frac\"><span>3</span><span>4</span></span></span>. Efe, Ali ve Can'ın dereceleri doğru yazılmıştır.", "13,2 = <span class=\"nw\">13<span class=\"frac\"><span>2</span><span>10</span></span></span> = <span class=\"nw\">13<span class=\"frac\"><span>1</span><span>5</span></span></span>'tir. Hakem Defne'nin derecesini <span class=\"nw\">13<span class=\"frac\"><span>1</span><span>2</span></span></span> olarak yazmıştır; <span class=\"nw\">13<span class=\"frac\"><span>1</span><span>2</span></span></span> = 13,5'tir."], "t": "Efe: <span class=\"nw\">12<span class=\"frac\"><span>2</span><span>5</span></span></span>'in paydası 5 olduğu için yanlış sanılabilir; Can: virgülden sonra iki basamak olduğu için <span class=\"nw\">12<span class=\"frac\"><span>75</span><span>10</span></span></span> yazılması gerektiği sanılabilir.", "d": "Kronometredeki sayıyı önce paydası 10 ya da 100 olan tam sayılı kesre çevirip sadeleştirin: 13,2 = <span class=\"nw\">13<span class=\"frac\"><span>2</span><span>10</span></span></span> = <span class=\"nw\">13<span class=\"frac\"><span>1</span><span>5</span></span></span>'tir. Paydası 5 olan yazılış da doğru olabilir; karşılaştırırken sadeleştirilmiş hâle bakın.", "ses": "b02"}, {"no": 3, "on": "<p>Ayşe'nin telefonundaki ajanda uygulaması, etkinliklerin sürelerini dakika olarak kaydetmekte; günün özetinde ise saat cinsinden ondalık gösterimle göstermektedir. Ondalık gösterimi devirli olan süreler devir çizgisiyle yazılmaktadır.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1096 440\" width=\"1096\" style=\"width:150mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAA ill=\"#ffffff\" stroke=\"#e5dbff\" stroke-width=\"1\"/><text x=\"882.0\" y=\"497.0\" font-size=\"22.0\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\" data-sabit=\"1\">Satranç</text><text x=\"1034.0\" y=\"524.0\" font-size=\"23.0\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\" data-sabit=\"1\">15 dk</text></g></svg>", "son": "<p>1 saat 60 dakikadır; bir etkinliğin saat cinsinden süresi, dakika cinsinden süresinin 60'a bölünmesiyle bulunur.</p>", "k": "Buna göre, günün özetinde hangi etkinliklerin süresi devir çizgisiyle yazılır?", "sec": ["Yürüyüş ve satranç", "Kitap okuma ve satranç", "Kitap okuma ve piyano", "Piyano ve yürüyüş"], "secg": null, "c": "C", "a": ["Süreler saat cinsinden kesirle yazılıp sadeleştirilir: <span class=\"nw\"><span class=\"frac\"><span>20</span><span>60</span></span></span> = <span class=\"nw\"><span class=\"frac\"><span>1</span><span>3</span></span></span>, <span class=\"nw\"><span class=\"frac\"><span>30</span><span>60</span></span></span> = <span class=\"nw\"><span class=\"frac\"><span>1</span><span>2</span></span></span>, <span class=\"nw\"><span class=\"frac\"><span>50</span><span>60</span></span></span> = <span class=\"nw\"><span class=\"frac\"><span>5</span><span>6</span></span></span>, <span class=\"nw\"><span class=\"frac\"><span>15</span><span>60</span></span></span> = <span class=\"nw\"><span class=\"frac\"><span>1</span><span>4</span></span></span>.", "Paydasında 3 çarpanı kalan <span class=\"nw\"><span class=\"frac\"><span>1</span><span>3</span></span></span> ve <span class=\"nw\"><span class=\"frac\"><span>5</span><span>6</span></span></span> devirlidir: <span class=\"nw\">0,<span class=\"dv\">3</span></span> ve <span class=\"nw\">0,8<span class=\"dv\">3</span></span> saat. Kitap okuma ve piyano devir çizgisiyle yazılır.", "<span class=\"nw\"><span class=\"frac\"><span>1</span><span>2</span></span></span> = 0,5 ve <span class=\"nw\"><span class=\"frac\"><span>1</span><span>4</span></span></span> = 0,25 sonludur."], "t": "Yürüyüş ve satranç: sonlu olanlar seçilmiş; Kitap okuma ve satranç: <span class=\"nw\"><span class=\"frac\"><span>15</span><span>60</span></span></span>'ın paydası 60 olduğu için devirli sanılmış; Piyano ve yürüyüş: <span class=\"nw\"><span class=\"frac\"><span>30</span><span>60</span></span></span> sadeleştirilmemiş.", "d": "Dakikayı saate çevirmek için 60'a bölün ve kesri sadeleştirin. Devirli olup olmadığına en sade kesrin paydasına bakarak karar verin: <span class=\"nw\"><span class=\"frac\"><span>15</span><span>60</span></span></span> = <span class=\"nw\"><span class=\"frac\"><span>1</span><span>4</span></span></span> sonludur, 60'ın 3 çarpanı sadeleşince gider.", "ses": "b03"}, {"no": 4, "on": "<p>Bir robotik kulübünde “bölme robotu” programlanmıştır. Robot, kendisine verilen kesrin payını paydasına uzun bölmeyle bölmekte ve her adımda kalanı ekranına yazmaktadır.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1100 580\" width=\"1100\" style=\"width:132.8mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAGRAvgDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAAIDBAUGAQcI/8QAThAAAQMCAwMHCQUEBwgCAgMAAQACAwQRBRIhBjFREzJBYXGBkQcUIjNScqGxwSM0QmLRFSRDghZEU4OSouElNUVjc7LC8FTxNmSEk9L/xAAaAQEAAwEBAQAAAAAAAAAAAAAAAQIDBAUG/8QALxEAAgIBBAICAgEEAQUBAQAAAAECEQMSEyExBEEyURRhIgUjM0KBUnGRofCxwf/aAAwDAQACEQMRAD8AyXn8Td5R+1GDm3RTbPVU7A/LlaeKlDZ98XOaXdi5dlI6t5t0iKMWkv6MZKmUNXLUzhrmZG+0pEGCuJ9GncVYw4JVkWbCGjrVdC9ItrftiWTywOs2U9xU2PFp2gB1nLkeztS7nPa1S49nLc6cnsVNmT9F92K7YRYu085pCnRVsMm6SxTceBUzecXO71Jjwylj3RhT+PL7KPPEcjcHXsQexOEIZE2MeiLJdl1Qi4xpnNOSk7QgBBCXZFlcoN2XLJyy5ZSBuy4Wpyy4QhA3ZcsnLLlkAiy5ZLIRZSQN2RZLsuWQkTZJITltFwhCBshJLU6Qk2QDLmXTXpMN2uI7FJITTw =\"#1f3a1c\" text-anchor=\"start\" data-sabit=\"1\">Aynı kalan tekrar edince</text></g><g transform=\"matrix(0.8159 0.0403 -0.0476 0.9331 801.2 443.9)\"><text x=\"0.0\" y=\"0.0\" font-size=\"26.0\" font-weight=\"700\" fill=\"#1f3a1c\" text-anchor=\"start\" data-sabit=\"1\">robot durur.</text></g></g></svg>", "son": "<p>Kalan 0 olursa ya da daha önce yazılmış bir kalan yeniden ortaya çıkarsa robot bölmeyi durdurur ve sonucu ekrana yazar; devreden basamakları devir çizgisiyle gösterir.</p>", "k": "Buna göre, robotun ekranına yazacağı sonuç aşağıdakilerden hangisidir?", "sec": ["<span class=\"nw\">0,91<span class=\"dv\">6</span></span>", "<span class=\"nw\">0,<span class=\"dv\">916</span></span>", "<span class=\"nw\">0,9<span class=\"dv\">16</span></span>", "0,916"], "secg": null, "c": "A", "a": ["11 : 12 → 0; 110 : 12 → 9, kalan 2; 20 : 12 → 1, kalan 8; 80 : 12 → 6, kalan 8.", "Kalan 8 yeniden ortaya çıktığı için bundan sonra bölüme hep 6 yazılır.", "Sonuç 0,91666… = <span class=\"nw\">0,91<span class=\"dv\">6</span></span>'dır; 9 ve 1 devretmez."], "t": "<span class=\"nw\">0,<span class=\"dv\">916</span></span> ve <span class=\"nw\">0,9<span class=\"dv\">16</span></span>: devir çizgisi devretmeyen basamakların da üstüne çizilmiş; 0,916: robotun durması bölmenin bittiği sanılmış.", "d": "Robot, aynı kalan yeniden gelince durur; bu, bölmenin bittiği anlamına gelmez. 11 : 12 bölmesinde 9 ve 1 bir kez yazılır, 6 sürekli tekrar eder; devir çizgisi yalnız 6'nın üstüne çizilir.", "ses": "b04"}, {"no": 5, "on": "<p>Bir su altı fotoğrafçısı, fotoğrafını çekeceği canlıların deniz seviyesine göre bulundukları derinlikleri gözlem defterine metre cinsinden tam sayılı kesirle yazmıştır. Deniz seviyesinin altındaki konumlar negatif sayılarla gösterilmiştir.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1536 804\" width=\"1536\" style=\"width:133.7mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href= 00\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">12 ürün</text><rect x=\"462.6\" y=\"284.0\" width=\"150.7\" height=\"36.0\" rx=\"8.399999999999999\" fill=\"#ffffff\" stroke=\"#495057\" stroke-width=\"1.6800000000000002\" fill-opacity=\".95\"/><text x=\"538.0\" y=\"310.6\" font-size=\"24.0\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">B makinesi</text><text x=\"855.0\" y=\"452.0\" font-size=\"30.0\" font-weight=\"800\" fill=\"#b2f2bb\" text-anchor=\"middle\" data-sabit=\"1\">– – –</text><text x=\"861.0\" y=\"598.0\" font-size=\"24.0\" font-weight=\"700\" fill=\"#495057\" text-anchor=\"middle\" data-sabit=\"1\">1 saatte</text><text x=\"861.0\" y=\"636.0\" font-size=\"30.0\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">20 ürün</text><rect x=\"779.6\" y=\"284.0\" width=\"150.7\" height=\"36.0\" rx=\"8.399999999999999\" fill=\"#ffffff\" stroke=\"#495057\" stroke-width=\"1.6800000000000002\" fill-opacity=\".95\"/><text x=\"855.0\" y=\"310.6\" font-size=\"24.0\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">C makinesi</text><text x=\"1172.0\" y=\"452.0\" font-size=\"30.0\" font-weight=\"800\" fill=\"#b2f2bb\" text-anchor=\"middle\" data-sabit=\"1\">– – –</text><text x=\"1185.0\" y=\"598.0\" font-size=\"24.0\" font-weight=\"700\" fill=\"#495057\" text-anchor=\"middle\" data-sabit=\"1\">1 saatte</text><text x=\"1185.0\" y=\"636.0\" font-size=\"30.0\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">15 ürün</text><rect x=\"1096.6\" y=\"284.0\" width=\"150.7\" height=\"36.0\" rx=\"8.399999999999999\" fill=\"#ffffff\" stroke=\"#495057\" stroke-width=\"1.6800000000000002\" fill-opacity=\".95\"/><text x=\"1172.0\" y=\"310.6\" font-size=\"24.0\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">D makinesi</text></g></svg>", "son": "<p>Makinelerin ekranları, bir ürünün üretim süresini saat cinsinden ondalık gösterimle göstermektedir. Ekranlar devir çizgisi gösteremediği için ondalık gösterimi devirli olan süreler ekranda tam olarak gösterilememektedir.</p>", "k": "Buna göre, hangi makinelerin ekranında bir ürünün üretim süresi tam olarak gösterilebilir?", "sec": ["A ve C", "B ve D", "A ve B", "C ve D"], "secg": null, "c": "A", "a": ["Bir ürünün üretim süresi: A <span class=\"nw\"><span class=\"frac\"><span>1</span><span>8</span></span></span> saat, B <span class=\"nw\"><span class=\"frac\"><span>1</span><span>12</span></span></span> saat, C <span class=\"nw\"><span class=\"frac\"><span>1</span><span>20</span></span></span> saat, D <span class=\"nw\"><span class=\"frac\"><span>1</span><span>15</span></span></span> saat.", "8 = 2 · 2 · 2 ve 20 = 2 · 2 · 5 olduğundan <span class=\"nw\"><span class=\"frac\"><span>1</span><span>8</span></span></span> = 0,125 ve <span class=\"nw\"><span class=\"frac\"><span>1</span><span>20</span></span></span> = 0,05 sonludur. 12 ve 15'in 3 çarpanı vardır; <span class=\"nw\"><span class=\"frac\"><span>1</span><span>12</span></span></span> ve <span class=\"nw\"><span class=\"frac\"><span>1</span><span>15</span></span></span> devirlidir."], "t": "B ve D: devirli olanlar seçilmiş; C ve D: 15'in 5 çarpanı olduğu için sonlu sanılmış; A ve B: 12'nin 2 çarpanı olduğu için sonlu sanılmış.", "d": "Bir saatte n ürün üreten makinede bir ürün <span class=\"nw\"><span class=\"frac\"><span>1</span><span>n</span></span></span> saatte üretilir. Paydanın asal çarpanlarına bakın: paydada 2 ve 5'ten başka bir asal çarpan (3 gibi) varsa ondalık gösterim devirlidir; 15'in 5 çarpanı olması yetmez.", "ses": "b07"}, {"no": 8, "on": "<p>Bir yüzme antrenörü, sporcularının tur sürelerini dakika cinsinden ondalık gösterimle antrenman tablosuna yazmaktadır. Ondalık gösterimi devirli olan süreleri devir çizgisiyle yazmaktadır.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1376 728\" width=\"1376\" style=\"width:90.7mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/s f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Takım</th><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Maç sayısı</th><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Gol sayısı</th><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Ortalama</th></tr></thead><tbody><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Kartal</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">12</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">20</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">1,6</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Şahin</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">15</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">18</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">1,2</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Doğan</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">8</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">13</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">1,625</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Atmaca</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">9</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">14</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\"><span class=\"nw\">1,<span class=\"dv\">5</span></span></td></tr></tbody></table></div>", "son": "<p>Maç başına gol ortalaması, gol sayısının maç sayısına bölünmesiyle bulunur. Tablodaki ortalamalardan yalnız biri yanlış yazılmıştır.</p>", "k": "Buna göre, ortalaması yanlış yazılan takım hangisidir?", "sec": ["Şahin", "Doğan", "Atmaca", "Kartal"], "secg": null, "c": "D", "a": ["Kartal: <span class=\"nw\"><span class=\"frac\"><span>20</span><span>12</span></span></span> = <span class=\"nw\"><span class=\"frac\"><span>5</span><span>3</span></span></span> = 1,666… = <span class=\"nw\">1,<span class=\"dv\">6</span></span>. Tabloda 1,6 yazılmıştır; devir gözden kaçmıştır.", "Şahin: <span class=\"nw\"><span class=\"frac\"><span>18</span><span>15</span></span></span> = <span class=\"nw\"><span class=\"frac\"><span>6</span><span>5</span></span></span> = 1,2; Doğan: <span class=\"nw\"><span class=\"frac\"><span>13</span><span>8</span></span></span> = 1,625; Atmaca: <span class=\"nw\"><span class=\"frac\"><span>14</span><span>9</span></span></span> = 1,555… = <span class=\"nw\">1,<span class=\"dv\">5</span></span>. Bu ortalamalar doğrudur."], "t": "Doğan: virgülden sonra üç basamak olduğu için yanlış sanılabilir; Atmaca: devir çizgisi gereksiz sanılabilir.", "d": "Ortalamayı bölerek bulun ve tablodakiyle karşılaştırın. Virgülden sonra çok basamak olması (1,625) yanlışlık göstermez; asıl hata devreden basamağın gözden kaçmasıdır (<span class=\"nw\"><span class=\"frac\"><span>20</span><span>12</span></span></span> = <span class=\"nw\">1,<span class=\"dv\">6</span></span>).", "ses": "b09"}, {"no": 10, "on": "<p>Bir okulda yapılan meclis başkanlığı seçiminde dört aday yarışmış ve toplam 80 oy kullanılmıştır. Adayların aldıkları oylar aşağıdaki panoda gösterilmiştir.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1460 700\" width=\"1460\" style=\"width:146.0mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7O "#7048e8\" text-anchor=\"middle\" data-sabit=\"1\">SEÇİMİ</text><line x1=\"990.0\" y1=\"264.0\" x2=\"1306.0\" y2=\"264.0\" stroke=\"#d0bfff\" stroke-width=\"2.5\"/><text x=\"1148.0\" y=\"305.0\" font-size=\"30.0\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">Toplam oy: 80</text><text x=\"978.0\" y=\"362.0\" font-size=\"30.0\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\" data-sabit=\"1\">Ali</text><rect x=\"1078.0\" y=\"338.0\" width=\"150.0\" height=\"30.0\" rx=\"4\" fill=\"#d0bfff\" stroke=\"#7048e8\" stroke-width=\"1.5\"/><text x=\"1322.0\" y=\"362.0\" font-size=\"30.0\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\" data-sabit=\"1\">30 oy</text><text x=\"978.0\" y=\"416.0\" font-size=\"30.0\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\" data-sabit=\"1\">Ece</text><rect x=\"1078.0\" y=\"392.0\" width=\"100.0\" height=\"30.0\" rx=\"4\" fill=\"#d0bfff\" stroke=\"#7048e8\" stroke-width=\"1.5\"/><text x=\"1322.0\" y=\"416.0\" font-size=\"30.0\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\" data-sabit=\"1\">20 oy</text><text x=\"978.0\" y=\"470.0\" font-size=\"30.0\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\" data-sabit=\"1\">Can</text><rect x=\"1078.0\" y=\"446.0\" width=\"90.0\" height=\"30.0\" rx=\"4\" fill=\"#d0bfff\" stroke=\"#7048e8\" stroke-width=\"1.5\"/><text x=\"1322.0\" y=\"470.0\" font-size=\"30.0\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\" data-sabit=\"1\">18 oy</text><text x=\"978.0\" y=\"524.0\" font-size=\"30.0\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\" data-sabit=\"1\">Defne</text><rect x=\"1078.0\" y=\"500.0\" width=\"60.0\" height=\"30.0\" rx=\"4\" fill=\"#d0bfff\" stroke=\"#7048e8\" stroke-width=\"1.5\"/><text x=\"1322.0\" y=\"524.0\" font-size=\"30.0\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\" data-sabit=\"1\">12 oy</text></g></svg>", "son": "<p>Her adayın aldığı oy sayısı toplam oy sayısına bölünecek ve bölüm, okul panosuna ondalık gösterimle yazılacaktır. Devirli olan ondalık gösterimler devir çizgisiyle yazılacaktır.</p>", "k": "Buna göre, kaç adayın sonucu devir çizgisiyle yazılır?", "sec": ["0", "1", "2", "3"], "secg": null, "c": "A", "a": ["Bölümler: Ali <span class=\"nw\"><span class=\"frac\"><span>30</span><span>80</span></span></span> = <span class=\"nw\"><span class=\"frac\"><span>3</span><span>8</span></span></span>, Ece <span class=\"nw\"><span class=\"frac\"><span>20</span><span>80</span></span></span> = <span class=\"nw\"><span class=\"frac\"><span>1</span><span>4</span></span></span>, Can <span class=\"nw\"><span class=\"frac\"><span>18</span><span>80</span></span></span> = <span class=\"nw\"><span class=\"frac\"><span>9</span><span>40</span></span></span>, Defne <span class=\"nw\"><span class=\"frac\"><span>12</span><span>80</span></span></span> = <span class=\"nw\"><span class=\"frac\"><span>3</span><span>20</span></span></span>.", "80 = 2 · 2 · 2 · 2 · 5'tir. Paydası 80 olan bir kesir sadeleşse de paydasında 2 ve 5'ten başka asal çarpan olmaz.", "Ondalık gösterimlerin hepsi sonludur: 0,375; 0,25; 0,225; 0,15. Devir çizgisiyle yazılan sonuç yoktur."], "t": "1, 2 ya da 3: oy sayılarında 3'ün katları (30, 18, 12) olduğu için ondalık gösterimlerin devirli olduğu sanılmış; karar paydaya göre verilir.", "d": "Oranı sadeleştirdikten sonra paydaya bakın. 80 = 2 · 2 · 2 · 2 · 5 olduğundan paydası 80 olan kesrin paydasında sadeleşmeden sonra da 3 çarpanı oluşmaz; payın 3'ün katı olması önemli değildir.", "ses": "b10"}, {"no": 11, "on": "<p>Bir domino oyununda her taşın sol yarısında bir ondalık gösterim, sağ yarısında bir kesir vardır (ilk ve son taşlarda BAŞLA ve BİTİR yazar). Taşlar, yan yana gelen yarılardaki sayılar birbirine eşit olacak şekilde dizilmelidir.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1410 325\" width=\"1410\" style=\"width:150mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial 15</span></span></span>: <span class=\"nw\"><span class=\"frac\"><span>14</span><span>15</span></span></span> = <span class=\"nw\">0,9<span class=\"dv\">3</span></span>'tür, devreden basamağı 3'tür.", "d": "İpuçlarını tek tek uygulayın ve her adımda kalan kesirleri yazın. 1. ipucu için kesir sadeleşmemelidir; 3. ipucunda virgülden sonraki ilk basamağa, 4. ipucunda paya bakın.", "ses": "b15"}, {"no": 16, "on": "<p>Ece'nin matematik dersinden aldığı ilk iki sınav puanı ve henüz açıklanmamış üçüncü sınav puanı aşağıda gösterilmiştir. Ece'nin ortalaması, üç sınav puanının toplamının 3'e bölünmesiyle bulunacaktır.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1300 670\" width=\"1300\" style=\"width:135.8mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAGIAvgDASIAAhEBAxEB/8QAHAAAAgIDAQEAAAAAAAAAAAAABAUDBgABAgcI/8QARhAAAQMCBAIHBAgEBQQCAwEBAQACAwQRBRIhMUFRBhMiMmFxgRRCUpEHIzNyobHB0RUkQ2I0U4KS4RaD8PFEYyVzorLC/8QAGQEAAwEBAQAAAAAAAAAAAAAAAQIDBAAF/8QALBEAAgIBBAICAwADAAEFAAAAAAECEQMEEiExE0EyURQiYSMzQgVDUnGBkf/aAAwDAQACEQMRAD8ADpsXa94adE3jc2RmYKlg2N1ZcHmdJCLrKnZ6mfCoq0HSZWMLiNlDBURzuLdFDilSIoiAUooKkxVFydHFa4Yd0Gzz5ZKlRZDAw8FxljjKkEmeDMEvkcXPNysWSewvGO4YNex2iGxCJopjZQMeWEaomqPWUZXY8imdONIprm9s+awt0Ur22kd5rRbotJ55ZcK1pB5KeVwYwlQ4R/hB5KHEJi0ZRdeZnjeQ3qe3HZDDVk1Jadk1aczbqttLmvDtbp7QyiSOxU8ka5RLTZdzaZ3JIGriKa51WVEdjdQtGoAUqPUjBOIxaA5jvJIaxn8y5P4Gnqzfkkta21S5acfwIr5AuVS0jbVLVyApacfzDPNUj2GXQwqxo1RxSBm4U9UOwwoR5yhexGtvJ4sr38BJmYVgcwoFstzZTt1F0IqL6DLdH5IJAYtuAtcOKgAK7ymyDcU6bCoyatI6ie/rQMxso8UZ2WnxUkI+tat4o36tvmoan4mjS3upisCykijMt/Bc2UkLzGTbivPbdcHog1TGWBzSoqAdooqp7bXHwQ9B9oVo0vZl1XwLTg7ewE2ASvBx2E4DdEcvyJ4/iR2Wy3RdlqzKpDlcxRtpQfFbhDTHqpcVZ2/VAtc4CwW5Q3wRklPbNhRDAo     // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
