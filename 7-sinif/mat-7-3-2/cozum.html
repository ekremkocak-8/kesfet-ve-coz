<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* ANA_KURALLAR §4.y-3: Etkinliklerde bütün kesirler kesir çizgisiyle (alt alta pay/payda) gösterilir. Düz yazılmış a/b biçimleri otomatik dönüştürülür. */
(function(){
  if (window.__kesirCizgi) return; window.__kesirCizgi = 1;
  const RX = /(^|[^\w\/.,:%])([−-])?(?:(\d+) )?(\d{1,4})\/(\d{1,4})(?![\w\/.,]\d|\w)/g;
  const ATLA = "script,style,svg,textarea,input,select,code,.ilr,.frac,[data-duz]";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function donustur(kok){
    if (!kok || !kok.nodeType) return;
    if (kok.nodeType === 3) kok = kok.parentElement;
    if (!kok || (kok.closest && kok.closest(ATLA))) return;
    const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      if (!/\d\/\d/.test(t.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = t.parentElement; if (!p || p.closest(ATLA)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const L = []; let t; while ((t = w.nextNode())) L.push(t);
    L.forEach(t => {
      let deg = false;
      const h = esc(t.nodeValue).replace(RX, (m, a, s, tam, p, q) => { deg = true;
        return a + (s ? "−" : "") + (tam ? tam + " " : "") + '<span class="frac"><span>' + p + "</span><span>" + q + "</span></span>"; });
      if (!deg) return;
      const k = document.createElement("span"); k.innerHTML = h; t.replaceWith(...k.childNodes);
    });
  }
  let bekleyen = new Set(), plan = 0;
  const calis = () => { plan = 0; const b = bekleyen; bekleyen = new Set(); b.forEach(donustur); };
  const gozcu = new MutationObserver(ms => { ms.forEach(m => {
      if (m.type === "characterData") bekleyen.add(m.target); else m.addedNodes.forEach(n => bekleyen.add(n)); });
    if (!plan) plan = requestAnimationFrame(calis); });
  const bas = () => { donustur(document.body); gozcu.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bas); else bas();
  const st = document.createElement("style");
  st.textContent = ".frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}.frac>span{display:block;text-align:center;padding:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor}";
  document.head.appendChild(st);
})();

/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {

    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });

    async function dagit(k) {

      const kolon = Math.min(k, 6), satirK = Math.ceil(k / kolon), gw = kolon * 14 + 16, gh = satirK * 14 + 26;

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */
  function ATLA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Sonuç"] });
    let k = o.k, L = o.son; const W = 660, sol = 22, sag = 22, sk = (W - sol - sag) / L;

    const bA = dug("▶ Oynat"), bB = dug("+1 " + (o.adimAd || "adım"), "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bB, bS);
    let kA = null;
    if (o.kSec) { kA = adimci(o.kEtiket || "Adım:", 2, Math.floor(L / 2), k, v => { k = v; sifirla(); }); kut.prepend(kA.w); }

    const bT = dug(o.testDugme || "Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test);
    const ti = test.querySelector("input");
    function taban() {
      let sv = `<line x1="${sol}" y1="62" x2="${sol + L * sk}" y2="62" class="cn-ek"/>`;

      for (let v = 0; v <= L; v += adimT) sv += `<line x1="${sol + v * sk}" y1="${v % et ? 58 : 54}" x2="${sol + v * sk}" y2="66" class="cn-ek"/>` + (v % et ? "" : `<text x="${sol + v * sk}" y="82" text-anchor="middle" class="cn-et">${o.etYaz ? o.etYaz(v) : v}</text>`);
      sv += `<line x1="${sol + L * sk}" y1="30" x2="${sol + L * sk}" y2="70" class="cn-sinir"/><text x="${sol + L * sk}" y="24" text-anchor="end" class="cn-et">${o.sonEt || L}</text>`;

    }

      izle.forEach((v, i) => {

        sv += `<path d="M${x1} 62 Q${(x1 + x2) / 2} ${yy} ${x2} 62" class="cn-yay"/><circle cx="${x2}" cy="62" r="4.5" class="${o.renk ? o.renk(v, i + 1) : "cn-o"}"/>`;
        if (izle.length <= 14 || i === izle.length - 1 || i % Math.ceil(izle.length / 10) === 0) sv += `<text x="${x2}" y="${98}" text-anchor="middle" class="cn-et2">${v}</text>`;
      });

      const son = izle.length ? izle[izle.length - 1] : 0, ix = sol + son * sk;
      sv += `<text x="${ix}" y="50" text-anchor="middle" class="cn-kis">${o.simge || "●"}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W} 104" role="img" aria-label="${k} birimlik adımlarla ilerleme">${sv}</svg>`;
    }
    const ileri = () => {
      const v = (n + 1) * k;
      if (v > L) { durdur(); s.dur.innerHTML = `<span class="kotu">■</span> Sonraki ${o.adimAd || "adım"} ${k} ${x} ${n + 1} = <b>${v}</b> olurdu; bu ${E(L,"den")} büyük. ${o.bitti ? o.bitti(n, k, L) : `Toplam ${n} ${o.adimAd || "adım"}; son değer ${n * k}.`}`; if (!izle.length) ciz(); return false; }
      n++; izle.push(v); ciz(); s.dur.innerHTML = o.durum ? o.durum(n, v, k) : `${n}. ${o.adimAd || "adım"}: ${k} ${x} ${n} = <b>${v}</b>`; return true;

      s.dur.innerHTML = m; s.yaz("t" + v, [v, r === 0 ? (ic ? `${k} ${x} ${b} ✔` : `${k} ${x} ${b} (sınır dışı)`) : `kalan ${r} ✘`], r === 0 && ic);

  }

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || [o.kAd || "k", "Boyanan", "En büyük"] });
    let k = o.k || 2, son = o.son;
    const kut = h("div", "cn-satir");

    if (o.sonSec) { const sw = h("div", "cn-hazir"); o.sonSec.forEach(v => { const b = dug(v + " gün", "ghost"); b.onclick = () => { son = v; kur(); temiz(); }; sw.appendChild(b); }); s.den.append(kut, sw); }

      const g = h("div", "cn-izg" + (o.takvim ? " cn-tak" : "")); g.style.gridTemplateColumns = `repeat(${o.sutunSay},1fr)`;

    function temiz() { hucre.forEach(c => c && c.classList.remove("on", "yeni")); s.dur.innerHTML = o.ilk || "Sayıyı seçip Boya düğmesine basın."; }

      }

      s.yaz(k + ":" + son, o.satir ? o.satir(k, say, enb, son) : [k, say, enb], o.iyi ? o.iyi(k, say, enb, son) : null);
      calis = false; bB.disabled = false;

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */
  function ASANSOR(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Açık asansörler", "Gidilen kat", "Gidilemeyen kat"] });
    const ac = o.asansor.map(() => false);
    const kut = h("div", "cn-satir"); const bt = o.asansor.map((a, i) => { const b = dug(a.ad, "ghost"); b.style.setProperty("--ac", a.renk); b.setAttribute("aria-pressed", "false"); b.onclick = () => { ac[i] = !ac[i]; b.setAttribute("aria-pressed", ac[i]); ciz(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    function ciz() {
      let sv = ""; const H = o.kat * 17 + 40; let git = 0, gitme = [];
      for (let f = o.kat; f >= 0; f--) {

        sv += `<rect x="60" y="${y}" width="150" height="15" rx="2" class="${f === 0 ? "cn-zem" : herhangi ? "cn-katon" : (ac.some(Boolean) ? "cn-katoff" : "cn-kat")}"/><text x="52" y="${y + 12}" text-anchor="end" class="cn-et">${f === 0 ? "Z" : f}</text>`;
        o.asansor.forEach((a, i) => { if (dur[i]) sv += `<circle cx="${230 + i * 22}" cy="${y + 7.5}" r="6" fill="${a.renk}"/>`; });
      }
      s.sah.innerHTML = `<svg viewBox="0 0 300 ${H}" style="max-height:440px" role="img" aria-label="${o.kat} katlı bina">${sv}</svg>`;
      const acik = o.asansor.filter((a, i) => ac[i]).map(a => a.ad);

      s.yaz(acik.join("+"), [acik.join(" + "), git, gitme.length], null);

    ciz();
  }

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */
  function SAAT(el, o) {

      let onc = null, snr = null;
      for (let m = bas; m <= bit + ara; m += ara) { if (m <= var_) onc = m; if (m >= var_ && snr == null) snr = m; if (m <= bit) sv += `<text x="${20 + (m - bas) * sk}" y="40" text-anchor="middle" class="cn-bus">🚌</text>`; }

      if (snr != null && snr <= bit + ara) { const sx = 20 + (Math.min(snr, bit) - bas) * sk; sv += `<path d="M${vx} 56 L${sx} 56" class="cn-bek"/>`; }

      const gec = var_ - bas;
      s.dur.innerHTML = `${o.kisi} durağa ${saDa(var_)} geliyor: ilk seferden <b>${gec} dakika</b> sonra. Seferler ${E(ara,"in")} katı olan dakikalarda: ${ara} ${x} ${Math.floor(gec / ara)} = ${Math.floor(gec / ara) * ara}` + (gec % ara ? `, ${ara} ${x} ${Math.floor(gec / ara) + 1} = ${(Math.floor(gec / ara) + 1) * ara}. Sonraki otobüs ${saDa(snr)}; bekleme <b>${snr - var_} dakika</b>.` : `. Tam sefer saatinde geldi; bekleme <b>0 dakika</b>.`);
      s.yaz(ara + ":" + var_, [ara + " dk", sa(var_), sa(onc), sa(snr), (snr - var_) + " dk"], null);
    }
    ciz();
  }

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Çarpanlar", "Çarpan sayısı"] });
    let N = o.N || o.hazir[0]; let bul = new Set(), denendi = new Set();
    const kut = h("div", "cn-satir");
    const sA = adimci("Sayı:", 2, o.max || 200, N, v => { N = v; yeni(); });
    kut.appendChild(sA.w);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => sA.ayarla(n); hz.appendChild(b); }); kut.appendChild(hz); }
    s.den.appendChild(kut);
    const bolen = h("div", "cn-satir cn-test"); bolen.innerHTML = `<label>Bölen deneyin: <input type="number" inputmode="numeric" min="1"></label>`;
    const bD = dug("Böl"), bS = dug("Sıradakini dene", "ghost"); bolen.append(bD, bS); s.den.appendChild(bolen);
    const bi = bolen.querySelector("input");
    let bK = null; if (o.katlar) { bK = dug(o.katDugme || "Katlarını say ▶", "ghost"); s.den.appendChild(bK); }
    const ciftler = h("div", "cn-cift"); const katlar = h("div", "cn-katlar");
    function yeni() { bul = new Set(); denendi = new Set(); ciz(); s.dur.innerHTML = `${N} sayısını 1, 2, 3, … sayılarına bölerek çarpan çiftlerini bulun.`; katlar.textContent = ""; }
    function ciz() {
      const L = [...bul].sort((a, b) => a - b);
      s.sah.innerHTML = ""; const kartlar = h("div", "cn-kartlar");
      L.forEach(v => kartlar.appendChild(h("span", "cn-kart" + (v * v === N ? " kare" : ""), v)));
      if (!L.length) kartlar.appendChild(h("span", "cn-bosk", "Henüz çarpan bulunmadı"));
      s.sah.append(kartlar, ciftler, katlar);
      ciftler.innerHTML = L.filter(v => v * v <= N).map(v => `<span>${v} ${x} ${N / v}${v * v === N ? " <i>(aynı sayı: bir kez yazılır)</i>" : ""}</span>`).join("");
    }
    const tamamMi = () => { for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) return false; return true; };
    const eksik = () => { const L = []; for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) L.push(i); return ` <br>Henüz denenmeyen küçük bölenler var: <b>${L.join(", ")}</b>. Bunları da deneyin.`; };
    function dene(d) {
      if (!d || d < 1) return; denendi.add(d);
      const b = Math.floor(N / d), r = N % d;
      if (d > N) { s.dur.innerHTML = `${d} > ${N}: ${E(N,"den")} büyük sayı ${E(N,"in")} çarpanı olamaz.`; return; }
      if (r === 0) { bul.add(d); bul.add(b); ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${N} : ${d} = ${b}, kalan 0 → <b>${d} ${x} ${b} = ${N}</b>. ${d} ve ${b} çarpandır.` + (d * d >= N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} ${d * d === N ? "=" : ">"} ${N}. Artık yeni çift çıkmaz; bütün çarpanlar bulundu.` : eksik() : ""); }
      else { s.dur.innerHTML = `<span class="kotu">✘</span> ${N} : ${d} işleminde bölüm ${b}, <b>kalan ${r}</b>. ${d}, ${E(N,"in")} çarpanı değildir.` + (d * d > N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} > ${N}. Daha büyük bölen denemeye gerek yok; çarpan listesi tamam.` : eksik() : ""); }
      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));
      if (tamam) s.yaz("n" + N, [N, [...bul].sort((a, b) => a - b).join(", "), bul.size], true);
    }
    bD.onclick = () => dene(Math.round(+bi.value));
    bS.onclick = () => { let d = 1; while (denendi.has(d)) d++; bi.value = d; dene(d); };
    if (bK) bK.onclick = async () => {
      bK.disabled = true; katlar.textContent = ""; const sat = h("div", "cn-katsat"); katlar.append(h("b", "", `${E(N,"in")} katları: `), sat);
      for (let i = 1; i <= (o.katSay || 12); i++) { sat.appendChild(h("span", "cn-kat2", `${N * i}`)); await bekle(220); }

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */
  function KUMBARA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Para", "Sonuç"] });
    const k = o.k; let hafta = 0, tmr = null;
    const kut = h("div", "cn-satir"); const bA = dug("Bir hafta geçsin +"), bO = dug("▶ Haftaları oynat", "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bO, bS); s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Kumbarada şu para olabilir mi? <input type="number" inputmode="numeric" min="1" max="500"> TL</label>`;
    const bT = dug("Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test); const ti = test.querySelector("input");
    function ciz() {
      const top = hafta * k, sv = [];
      const yuk = Math.min(150, top * 1.4);
      sv.push(`<rect x="110" y="20" width="120" height="160" rx="22" class="cn-kum"/><rect x="150" y="14" width="40" height="8" rx="3" class="cn-kum2"/>`);
      sv.push(`<rect x="116" y="${176 - yuk}" width="108" height="${yuk}" rx="10" class="cn-para"/>`);
      sv.push(`<text x="170" y="110" text-anchor="middle" class="cn-buyuk">${top} TL</text><text x="170" y="134" text-anchor="middle" class="cn-et">${hafta}. hafta</text>`);
      let cizgi = ""; for (let i = 1; i <= hafta && i <= 16; i++) cizgi += `<text x="${260 + ((i - 1) % 4) * 52}" y="${40 + Math.floor((i - 1) / 4) * 34}" class="cn-et2">${k}${x}${i}=${k * i}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 480 190" role="img" aria-label="Kumbara">${sv.join("")}${cizgi}</svg>`;
      s.dur.innerHTML = hafta ? `${hafta}. hafta sonunda kumbarada ${k} ${x} ${hafta} = <b>${top} TL</b> var.` : `Kumbara boş. Her hafta ${k} TL atılıyor.`;
    }
    bA.onclick = () => { hafta++; ciz(); };
    bO.onclick = () => { if (tmr) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } bO.textContent = "❚❚ Durdur"; tmr = setInterval(() => { if (hafta >= 15) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } hafta++; ciz(); }, az ? 50 : 500); };
    bS.onclick = () => { hafta = 0; ciz(); };
    bT.onclick = () => {
      const v = Math.round(+ti.value); if (!v) return; const b = Math.floor(v / k), r = v % k;
      s.dur.innerHTML = r ? `<span class="kotu">✘</span> ${k} ${x} ${b} = ${k * b} TL, ${k} ${x} ${b + 1} = ${k * (b + 1)} TL. ${v} TL arada kalır (${v} : ${k} → kalan ${r}). Kumbarada hiçbir hafta ${v} TL olmaz.`
        : `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · ${b}. hafta sonunda kumbarada tam ${v} TL olur.`;

      s.yaz("t" + v, [v + " TL", r ? `kalan ${r} ✘` : `${k} ${x} ${b} ✔`], !r);
    };
    ciz();
  }

  /* 9) ÖNERME LABORATUVARI: önermeyi farklı sayılarla sınama */
  function ONERME(el, o) {

    const bT = dug("Sına"), bR = dug("Rastgele sayı", "ghost"); test.append(bT, bR); s.den.appendChild(test); const ti = test.querySelector("input");
    function goster() { s.sah.innerHTML = `<div class="cn-onr"><b>${o.onermeler[akt].ad}:</b> “${o.onermeler[akt].metin}”</div>`; s.dur.innerHTML = "Bir sayı yazıp Sına düğmesine basın. Önerme her sayıda doğru mu?"; }
    function sina(n) {
      const on = o.onermeler[akt], r = on.sina(n);
      s.sah.innerHTML = `<div class="cn-onr"><b>${on.ad}:</b> “${on.metin}”</div><div class="cn-kanit">${r.goster}</div>`;
      s.dur.innerHTML = (r.ok ? `<span class="iyi">✔</span> ${n} için önerme doğru.` : `<span class="kotu">✘</span> ${n} için önerme yanlış! Bir karşı örnek bulundu.`) + (r.not ? " " + r.not : "");

  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →
     koşullar tek tek denetlenir (✔/✘) → deney defterine yazılır. Doğru cevap verilmez; öğrenci uygun girdiyi kendisi arar.
     o.girdi: [{ad, min, max, bas} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → SVG/HTML · o.kosullar: [{ad, f(v) → bool | {ok, not}}]
     o.dugme: düğme yazısı (false → her değişiklikte denetlenir) · o.sonuc(v, hepsi, L) · o.satir(v, hepsi, L) · o.iyi(v, L) · o.ek: [{ad, deger(v) → v}] */
  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);
      s.dur.innerHTML = m;
      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);
    }
    kur = true; ciz();
    if (bS) s.dur.innerHTML = o.ilk || "Değerleri seçip Sına düğmesine basın."; else sina();
  }

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

/* MAT.7.3.2 · Orta Dikme ve Açıortay İnşası — bağlam sorularının "Canlandır" düzenekleri (14.10.2026) — ortak motor: canlandir.js (CN.KOSUL); yeni motor yok,
   çizimler bu dosyadaki küçük geometri yardımcılarıyla yapılır. Her düzenek: öğrenci düğmelerle ya da − / + sayaçlarıyla durumu değiştirir → sahne anında
   çizilir → koşullar denetlenir → deneme deney defterine yazılır → yeniden dener. Doğru cevap bir düğmeyle verilmez; denemelerden çıkar (§4.k, §19-10). */
window.CANL = (() => {
  if (!document.getElementById("c732-stil")) { const st = document.createElement("style"); st.id = "c732-stil";
    st.textContent = ".cn-btn{min-width:44px;min-height:44px}.cn-adimci button{min-width:44px;min-height:44px}.cn-secg button{min-height:44px}.c732-k{text-align:center;font-size:17px;font-weight:800;margin:8px auto;max-width:640px;line-height:1.6}"; document.head.appendChild(st); }
  const D = v => String(Math.round(v * 10) / 10).replace(".", ",");
  const yon = (a, r = 1) => [r * Math.cos(a * Math.PI / 180), -r * Math.sin(a * Math.PI / 180)];
  const ek = (P, v, k = 1) => [P[0] + k * v[0], P[1] + k * v[1]];
  const uz = (P, Q) => Math.hypot(Q[0] - P[0], Q[1] - P[1]);
  const kes = (C1, r1, C2, r2) => { const d = uz(C1, C2); if (d > r1 + r2 || d < Math.abs(r1 - r2)) return []; const a = (r1 * r1 - r2 * r2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, r1 * r1 - a * a)), ex = (C2[0] - C1[0]) / d, ey = (C2[1] - C1[1]) / d, M = [C1[0] + a * ex, C1[1] + a * ey]; return h < .5 ? [M] : [[M[0] - h * ey, M[1] + h * ex], [M[0] + h * ey, M[1] - h * ex]]; };
  const svg = (w, h, ic) => `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w * 1.4}px;height:auto;display:block;margin:0 auto">${ic}</svg>`;
  const tx = (x, y, s, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.an || "middle"}" style="font-size:${o.fs || 14}px;font-weight:800;fill:${o.r || "#1d2433"};paint-order:stroke;stroke:#fff;stroke-width:4px">${s}</text>`;
  const dp = (P, Q, r = "#1d2433", w = 2.6, k = "") => `<line x1="${P[0]}" y1="${P[1]}" x2="${Q[0]}" y2="${Q[1]}" stroke="${r}" stroke-width="${w}" stroke-linecap="round"${k ? ` stroke-dasharray="${k}"` : ""}/>`;
  const isin = (O, a, L, r, w) => dp(O, ek(O, yon(a, L)), r, w);
  const cem = (C, r, renk = "#7048e8") => `<circle cx="${C[0]}" cy="${C[1]}" r="${r}" fill="none" stroke="${renk}" stroke-width="1.6" stroke-dasharray="6 5"/>`;
  const nok = (P, ad, a = 90, r = "#1d2433") => `<circle cx="${P[0]}" cy="${P[1]}" r="5" fill="${r}"/>` + (ad ? tx(...ek(P, yon(a, 17)).map((v, i) => v + (i ? 5 : 0)), ad, { r }) : "");
  const yay = (C, r, a0, a1, renk = "#e8590c") => { const P0 = ek(C, yon(a0, r)), P1 = ek(C, yon(a1, r)); return `<path d="M${P0} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 0 ${P1}" fill="none" stroke="${renk}" stroke-width="2.4"/>`; };
  const kutu = h => `<div class="c732-k">${h}</div>`;
  const KO = (el, o) => CN.KOSUL(el, Object.assign({ dugme: false }, o));
  const ac = (P, Q) => Math.atan2(-(Q[1] - P[1]), Q[0] - P[0]) * 180 / Math.PI;

  return {
    /* 1 · Dört öğrencinin araçları */

      return KO(el, { yon: "Bir öğrenci seçiniz; kullandığı araçlar ve çizimi gösterilir.", bitis: "Dört öğrenciyi de deneyip yalnız inşa araçlarını kullananı bulunca.",

      kosullar: [{ ad: "İki parça eşit uzunlukta.", f: v => v[0] === 96 - v[0] }], sutun: ["Kesim yeri", "1. parça", "2. parça"], satir: v => [`${v[0]} cm`, `${v[0]} cm`, `${96 - v[0]} cm`] }),

        sutun: ["Ev", "A'ya", "B'ye", "Sınırın tarafı"], satir: v => [v[0], D(uz(E[v[0]], A) / 20), D(uz(E[v[0]], B) / 20), E[v[0]][0] < 220 ? "A tarafı" : "B tarafı"] }); },

    5: el => KO(el, { yon: "Dilimin kesim çizgisini seçiniz; iki parçanın açısı gösterilir. Dilimin merkez açısı 8 eş dilimden biridir.", bitis: "Dilimi iki eş parçaya ayıran kesimi bulunca.",

      const k = 1.8 / uz(C, A); const P = i => ek(C, u, i * 30);
      return KO(el, { yon: "Yol üzerindeki noktayı − / + ile kaydırınız; noktanın iki köye uzaklığı (km) hesaplanır.", bitis: "İki köye eşit uzaklıktaki noktayı ve P'nin hangi köye yakın olduğunu bulunca.",

    /* 8 · Kaleci */
    8: el => { const T = [210, 210], a1 = 90 + 21, a2 = 90 - 21, Ad = { "K ve L merkezli eş yayları kesiştirip T ile birleştirmek": "ao", "K ile L'yi birleştirmek": "kl", "T ile D₁'in ortasını birleştirmek": "orta" };

        girdi: [{ ad: "Adım:", sec: Object.keys(Ad), bas: "K ile L'yi birleştirmek" }],

          let s1 = "—", s2 = "—"; if (t === "ao") { h += isin(T, 90, 190, "#2b8a3e", 3); s1 = s2 = "21°"; } else if (t === "kl") h += dp(K, L, "#c92a2a", 3); else { const D1 = ek(T, yon(a1, 170)); h += dp(T, ek(T, [(D1[0] - T[0]) / 2, (D1[1] - T[1]) / 2]), "#c92a2a", 3); }
          return svg(420, 230, h) + kutu(t === "ao" ? `D₁ tarafı: ${s1} · D₂ tarafı: ${s2}` : "Çizgi T'den çıkıp açıyı ikiye ayırmıyor."); },
        kosullar: [{ ad: "Çizgi açıyı iki eş açıya ayırıyor (açıortay).", f: v => Ad[v[0]] === "ao" }], sutun: ["Adım", "Sonuç"], satir: (v, ok) => [v[0], ok ? "Açıortay" : "Açıortay değil"] }); },
    /* 9 · Direk */
    9: el => { const K = [40, 196], a = 58, Y = { "Açıortay üzerinde": 12, "1. yola daha yakın": 8, "2. yola daha yakın": 16 };
      return KO(el, { yon: "Direğin yerini seçiniz; direğin 1. yola uzaklığı 12 m tutulur, 2. yola uzaklığı hesaplanır.", bitis: "İki yola eşit uzaklıktaki yeri bulunca.",
        girdi: [{ ad: "Direğin yeri:", sec: Object.keys(Y), bas: "1. yola daha yakın" }],
        ciz: v => { const d2 = Y[v[0]]; const b = Math.atan2(12, (12 * Math.cos(a * Math.PI / 180) + d2) / Math.sin(a * Math.PI / 180)) * 180 / Math.PI; const P = ek(K, yon(v[0] === "Açıortay üzerinde" ? a / 2 : v[0] === "1. yola daha yakın" ? a / 2 - 9 : a / 2 + 9, 190));
          return svg(430, 236, isin(K, 0, 380, "#868e96", 10) + isin(K, a, 230, "#868e96", 10) + isin(K, a / 2, 300, "#2b8a3e", 1.6) + nok(P, "direk", 60, "#e8590c")) + kutu(`1. yola 12 m · 2. yola ${v[0] === "Açıortay üzerinde" ? 12 : v[0] === "1. yola daha yakın" ? "12 m'den fazla" : "12 m'den az"}`); },
        kosullar: [{ ad: "Direk iki yola eşit uzaklıkta.", f: v => v[0] === "Açıortay üzerinde" }], sutun: ["Yer", "1. yola", "2. yola"], satir: v => [v[0], "12 m", v[0] === "Açıortay üzerinde" ? "12 m" : v[0] === "1. yola daha yakın" ? "12 m'den fazla" : "12 m'den az"] }); },
    /* 10 · Bahçede ip */
    10: el => KO(el, { yon: "İpin uzunluğunu − / + ile değiştiriniz; iki ağaçtan çizilen yaylar gösterilir. Ağaçlar arası 12 m'dir.", bitis: "Yayların iki noktada kesiştiği en kısa ipi bulunca.",
      girdi: [{ ad: "İp uzunluğu (m)", min: 4, max: 10, bas: 5 }],
      ciz: v => { const A = [110, 120], B = [350, 120], r = v[0] * 20, K = kes(A, r, B, r); return svg(460, 240, cem(A, r, "#e8590c") + cem(B, r, "#e8590c") + nok(A, "A", 270, "#2b8a3e") + nok(B, "B", 270, "#2b8a3e") + K.map(p => nok(p, "", 0, "#7048e8")).join("")) + kutu(`${K.length} kesişim noktası`); },
      kosullar: [{ ad: "Yaylar iki noktada kesişiyor (orta dikme çizilebilir).", f: v => v[0] > 6 }], sutun: ["İp", "12 m'nin yarısına göre", "Kesişim"], satir: v => [`${v[0]} m`, v[0] < 6 ? "küçük" : v[0] === 6 ? "eşit" : "büyük", v[0] < 6 ? "0" : v[0] === 6 ? "1" : "2"] }),
    /* 11 · Kilim */
    11: el => { const P = { A: [60, 120], B: [200, 40], C: [340, 120], D: [200, 200] }, I = { "AC'nin orta dikmesi": [[200, 0], [200, 240]], "BD'nin orta dikmesi": [[0, 120], [400, 120]], "AB'nin orta dikmesi": [[90, -30], [310, 170]] };
      return KO(el, { yon: "Bir inşa seçiniz; inşanın verdiği doğru çizilir.", bitis: "B ve D'den geçen simetri doğrusunu veren inşayı bulunca.",
        girdi: [{ ad: "İnşa:", sec: Object.keys(I), bas: "BD'nin orta dikmesi" }],
        ciz: v => svg(400, 240, `<polygon points="${P.A} ${P.B} ${P.C} ${P.D}" fill="#ffdeeb" stroke="#a61e4d" stroke-width="3"/>` + dp(...I[v[0]], "#2b8a3e", 3) + Object.keys(P).map(a => nok(P[a], a, { A: 180, B: 90, C: 0, D: 270 }[a])).join("")),
        kosullar: [{ ad: "Doğru B ve D köşelerinden geçiyor.", f: v => v[0] === "AC'nin orta dikmesi" }], sutun: ["İnşa", "B ve D'den geçiyor mu?"], satir: (v, ok) => [v[0], ok ? "Evet" : "Hayır"] }); },

    12: el => { const S = { "Birleştir → ortala → dik çiz": 3, "Dik çiz → birleştir → ortala": 0, "Ortala → birleştir → dik çiz": 1 };

        let h = `<path d="M${O2} L${K2} A180 180 0 0 0 ${L2} Z" fill="#fff3bf" stroke="#1d2433" stroke-width="2.4"/>` + nok(O2, "O", 270) + nok(K2, "K", 0) + nok(L2, "L", 180);

    /* 15 · Sınır üzerindeki P */
    15: el => { const A = [80, 80], B = [360, 80]; return KO(el, { yon: "P noktasını sınır üzerinde − / + ile kaydırınız; P'nin iki eczaneye uzaklığı ölçülür (1 birim = 100 m).", bitis: "P nerede olursa olsun uzaklıkların eşit kaldığını görünce.",
      girdi: [{ ad: "P'nin yüksekliği", min: 1, max: 6, bas: 3 }],
      ciz: v => { const P = [220, 40 + v[0] * 30]; return svg(440, 240, dp([220, 6], [220, 226], "#7048e8", 2, "6 5") + nok(A, "A eczanesi", 90, "#c92a2a") + nok(B, "B eczanesi", 90, "#c92a2a") + dp(P, A, "#1c5fbf", 1.6, "4 4") + dp(P, B, "#e8590c", 1.6, "4 4") + nok(P, "P", 0, "#7048e8")) + kutu(`PA = ${D(uz(P, A) / 20 * 100 / 1)} m · PB = ${D(uz(P, B) / 20 * 100)} m`); },
      kosullar: [{ ad: "P'nin iki eczaneye uzaklığı eşit.", f: v => true }], sutun: ["P", "PA", "PB"], satir: v => { const P = [220, 40 + v[0] * 30]; return [v[0], D(uz(P, A) / 20 * 100) + " m", D(uz(P, B) / 20 * 100) + " m"]; } }); },

      girdi: [{ ad: "B ucundaki ip (cm)", min: 30, max: 50, bas: 45 }],
      ciz: v => { const k = 3.2, A = [90, 150], B = [330, 150], r1 = 30 * k, r2 = v[0] * k, K = kes(A, r1, B, r2), x = K.length > 1 ? (K[0][0] + K[1][0]) / 2 : 210;

      kosullar: [{ ad: "Çizgi tahtayı ortalıyor (iki parça eşit).", f: v => v[0] === 30 }], sutun: ["B ucundaki ip", "Kesim A'dan", "Ortada mı?"], satir: (v, ok) => { const k = 3.2, K = kes([90, 150], 96, [330, 150], v[0] * k); const x = K.length > 1 ? (K[0][0] + K[1][0]) / 2 : 210; return [`${v[0]} cm`, D((x - 90) / k) + " cm", ok ? "Evet" : "Hayır"]; } }),

    17: el => { const ac_ = [180, 150, 120, 80, 40, 20, 0]; return KO(el, { yon: "Bir çubuk seçiniz; iki yanındaki açılar gösterilir.", bitis: "Açıortay olan bütün çubukları bulunca.",

    /* 18 · Çini motifleri */
    18: el => { const M1 = [[1, 1], [1, 4], [3, 3], [3, 1]], M2 = M1.map(([i, j]) => [i + 6, j]), X = (i, j) => [30 + i * 30, 200 - j * 30], AD = ["A", "B", "C", "D"];

        girdi: [{ ad: "Nokta çifti:", sec: ["BB′", "CC′", "DD′"], bas: "BB′" }],
        ciz: v => { const j = AD.indexOf(v[0][0]), xm = (M1[j][0] + M2[j][0]) / 2; let h = `<polygon points="${M1.map(p => X(...p)).join(" ")}" fill="#ffdeeb" stroke="#1d2433" stroke-width="2.4"/><polygon points="${M2.map(p => X(...p)).join(" ")}" fill="#d3f9d8" stroke="#1d2433" stroke-width="2.4"/>`;

 ortalar ama dik kesmez."], "c": "d₂"}]}, {"no": 4, "bas": "Açıortay inşası", "q": [{"k": "Defterinize geniş bir açı çiziniz ve açıortayını inşa ediniz. İnşanızı iki farklı yolla nasıl kontrol edersiniz?", "a": ["Açıortay 4. bölümdeki dört adımla inşa edilir.", "1. kontrol: Kâğıt açıortay boyunca katlanır; kollar çakışmalıdır.", "2. kontrol: İki parçanın ölçüsü açıölçerle ölçülür; eşit olmalıdır."], "c": "Katlama ve açıölçerle ölçme"}, {"k": "Bir öğrenci açıortay inşasında A merkezli yayı 3 cm, K ve L merkezli eş yayları 5 cm açıklıkla çizmiştir. Bu inşa doğru mudur? Açıklayınız.", "a": ["A merkezli yay K ve L'yi köşeye eşit uzaklıkta verir: |AK| = |AL| = 3 cm.", "K ve L merkezli yayların eş olması yeterlidir; yarıçapları A merkezli yayınkinden farklı olabilir.", "Kesişim noktası KL'nin orta dikmesi üzerindedir; A ile birleştirilince açıortay elde edilir."], "c": "Doğrudur"}]}, {"no": 5, "bas": "Açıortayın özellikleri", "q": [{"k": "AD ışını BAC açısının açıortayıdır ve m(BAD) = 41°'dir. BAC açısının bütünlerinin ölçüsü kaç derecedir?", "a": ["m(BAC) = 2 · 41 = 82.", "Bütünler: 180 − 82 = 98.", "BAC açısının bütünleri 98°'dir."], "c": "98°"}, {"k": "AD ışını BAC açısının açıortayıdır. M noktasının AB koluna uzaklığı 2 cm, AC koluna uzaklığı 3 cm'dir. M noktası AD üzerinde olabilir mi? Gerekçesiyle açıklayınız.", "a": ["Açıortay üzerindeki her nokta iki kola eşit uzaklıktadır.", "M'nin kollara uzaklıkları (2 cm ve 3 cm) eşit değildir.", "Bu nedenle M açıortay üzerinde olamaz."], "c": "Olamaz"}]}, {"no": 6, "bas": "Şekillerin simetri doğruları", "q": [{"k": "Tepe açısı 46° olan bir ikizkenar üçgen çiziniz. Simetri doğrusunu önce tabanın orta dikmesi, sonra tepe açısının açıortayı olarak inşa ediniz. İki inşa için ne gözlersiniz? Tepe açısı hangi ölçülere ayrılır?", "a": ["Taban uçları birbirinin görüntüsüdür: tabanın orta dikmesi simetri doğrusudur.", "Tepe açısının kolları birbirinin görüntüsüdür: tepe açısının açıortayı da simetri doğrusudur.", "İki inşa aynı doğruyu verir; tepe açısı 46 : 2 = 23 derecelik iki açıya ayrılır."], "c": "Aynı doğru; 23° ve 23°"}, {"k": "ABC ve A′B′C′ eş üçgenleri verilmiştir. AA′ doğru parçasının orta dikmesi d inşa edilmiş; B'nin d'ye göre görüntüsünün B′ olmadığı görülmüştür. Bu üçgenler d'ye göre simetrik midir? Başka bir doğruya göre simetrik olabilirler mi?", "a": ["Üçgenler simetrik olsaydı simetri doğrusu A ile A′'yü birleştiren doğru parçasının orta dikmesi, yani d olurdu.", "B'nin d'ye göre görüntüsü B′ olmadığı için üçgenler d'ye göre simetrik değildir.", "Simetri doğrusu yalnız d olabileceğinden üçgenler hiçbir doğruya göre simetrik değildir (A ile A′'nün karşılıklı olduğu düşünüldüğünde)."], "c": "Simetrik değildir"}]}, {"no": 7, "bas": "İnşayı değerlendirmek", "q": [{"k": "Bir öğrencinin BAC açısının açıortayı için yaptığı inşa şöyledir: 1. adım: A merkezli 3 cm'lik yayla AB üzerinde K'yi işaretledi. 2. adım: A merkezli 4 cm'lik yayla AC üzerinde L'yi işaretledi. 3. adım: K ve L merkezli eş yayların kesişim noktası D'yi buldu. 4. adım: A ile D'yi birleştirdi. İlk hatalı adım hangisidir? Nasıl düzeltilir?", "a": ["Açıortay inşasında K ve L köşeye eşit uzaklıkta olmalıdır.", "2. adımda farklı açıklık kullanıldığı için |AK| ≠ |AL| olmuştur; AKL ikizkenar değildir.", "Düzeltme: L de aynı 3 cm'lik yayla işaretlenmelidir."], "c": "2. adım; aynı yay kullanılmalı"}, {"k": "AB doğru parçası için A ve B merkezli eş çemberler çizilmiş; çemberlerin kesişim noktalarından yalnız P işaretlenmiştir. Öbür kesişim noktası kâğıdın dışında kalmaktadır. İnşayı nasıl tamamlarsınız?", "a": ["Orta dikmeyi çizmek için iki nokta gerekir.", "Pergel başka bir açıklıkla açılıp A ve B merkezli yeni eş yaylar AB'nin P ile aynı yanında kesiştirilir; Q bulunur.", "P ile Q ölçüsüz cetvelle birleştirilir; PQ, AB'nin orta dikmesidir."], "c": "Yeni bir eş çember çiftiyle"}]}], "k": [{"no": 1, "bas": "Orta dikmeyi inşa ediniz", "yon": "Her doğru parçasının orta dikmesini yalnız pergel ve ölçüsüz cetvelle doğrudan çizim üzerinde inşa ediniz. Orta dikmenin AB'yi kestiği M noktasını işaretleyip kontrol için |AM| uzunluğunu milimetre olarak ölçüp yazınız.", "r": [{"n": "<span class=\"kk732-no\">1</span><svg viewBox=\"0 0 232 192\" width=\"58mm\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"20.0\" y1=\"96.0\" x2=\"212.0\" y2=\"96.0\" stroke=\"#111111\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><circle cx=\"20.0\" cy=\"96.0\" r=\"4\" fill=\"#111111\"/><text x=\"4.0\" y=\"101.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"212.0\" cy=\"96.0\" r=\"4\" fill=\"#111111\"/><text x=\"228.0\" y=\"101.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text></svg>", "c": "24"}, {"n": "<span class=\"kk732-no\">2</span><svg viewBox=\"0 0 232 192\" width=\"58mm\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"25.9\" y1=\"148.0\" x2=\"206.1\" y2=\"44.0\" stroke=\"#111111\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><circle cx=\"25.9\" cy=\"148.0\" r=\"4\" fill=\"#111111\"/><text x=\"12.1\" y=\"161.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"206.1\" cy=\"44.0\" r=\"4\" fill=\"#111111\"/><text x=\"219.9\" y=\"41.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text></svg>", "c": "26"}, {"n": "<span class=\"kk732-no\">3</span><svg viewBox=\"0 0 232 192\" width=\"58mm\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"116.0\" y1=\"172.0\" x2=\"116.0\" y2=\"20.0\" stroke=\"#111111\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><circle cx=\"116.0\" cy=\"172.0\" r=\"4\" fill=\"#111111\"/><text x=\"116.0\" y=\"193.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-a eyi düşünmektedir.</p>", "g": "<svg viewBox=\"0 0 420 220\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"0\" y=\"0\" width=\"420\" height=\"220\" fill=\"#f8f9fa\"/><rect x=\"94\" y=\"142\" width=\"32\" height=\"20\" fill=\"#ced4da\" stroke=\"#495057\"/><circle cx=\"110\" cy=\"124\" r=\"16\" fill=\"#adb5bd\" stroke=\"#495057\"/><text x=\"110.0\" y=\"184.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><rect x=\"294\" y=\"142\" width=\"32\" height=\"20\" fill=\"#ced4da\" stroke=\"#495057\"/><circle cx=\"310\" cy=\"124\" r=\"16\" fill=\"#adb5bd\" stroke=\"#495057\"/><text x=\"310.0\" y=\"184.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A′</text><text x=\"210.0\" y=\"30.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Park girişi</text></svg>", "son": "", "k": "Buna göre, görevlinin yapacağı işlerin sırası aşağıdakilerden hangisidir?", "sec": ["Orta noktadan dik doğru çizmek → A ile A′'yü birleştirmek → orta noktayı bulmak", "A'dan A′'ye dik doğru çizmek → A ile A′'yü birleştirmek → orta noktayı bulmak", "Orta noktayı bulmak → A ile A′'yü birleştirmek → dik doğru çizmek", "A ile A′'yü birleştirmek → orta noktayı ölçerek bulmak → orta noktadan dik doğru çizmek"], "secg": null, "c": "D", "a": ["Simetrik noktaları birleştiren doğru parçası çizilir.", "Bu doğru parçasının orta noktası belirlenir.", "Orta noktadan doğru parçasına dik doğru çizilir."], "t": "Öbür sıralamalarda orta nokta, doğru parçası çizilmeden ya da dik doğru, orta nokta bulunmadan aranmıştır", "d": "Simetri doğrusunu oluşturmanın üç işi sırayla yapılır: önce doğru parçası çizilir, sonra orta noktası bulunur, en son orta noktadan dik doğru çizilir.", "ses": "b12"}, {"no": 13, "on": "<p>Bir parkta daire dilimi biçiminde bir çiçek tarhı vardır. Tarhın merkez açısı 136°'dir. Bahçıvan, tarhı iki eş parçaya ayıran bir yürüme yolunu ip ve kazıkla inşa edecektir. Tarhın yarıçaplarının uçları K ve L'dir.</p>", "g": "<svg viewBox=\"0 0 403.58285411713166 276\" width=\"404\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><g transform=\"translate(154 0)\"><path d=\"M40.0 250.0 L209.1 188.4 A180 180 0 0 0 -124.4 176.8 Z\" fill=\"#fff3bf\" stroke=\"#111111\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><circle cx=\"40.0\" cy=\"250.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"28.7\" y=\"266.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">O</text><circle cx=\"209.1\" cy=\"188.4\" r=\"3.3\" fill=\"#111111\"/><text x=\"221.4\" y=\"204.1\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">K</text><circle cx=\"-124.4\" cy=\"176.8\" r=\"3.3\" fill=\"#111111\"/><text x=\"-137.4\" y=\"191.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">L</text></g></svg>", "son": "", "k": "Buna göre, aşağıdakilerden hangisi doğrudur?", "sec": ["Yol, K ile L'yi birleştiren çizgidir; merkez açısını 68°'lik iki açıya ayırır.", "Yol, K ve L merkezli eş yayların kesişim noktası ile O'dan geçer; merkez açısını 68°'lik iki açıya ayırır.", "Yol, O merkezli bir yayın orta noktasından geçer; merkez açısını 136°'lik iki açıya ayırır.", "Yol, K ve L merkezli eş yayların kesişim noktası ile O'dan geçer; merkez açısını 44°'lik iki açıya ayırır."], "secg": null, "c": "B", "a": ["|OK| = |OL| olduğu için açıortay inşasının 1. adımına gerek yoktur.", "K ve L merkezli eş yaylar kesiştirilir; kesişim noktası O ile birleştirilir.", "Açıortay merkez açısını 136 : 2 = 68 derecelik iki açıya ayırır."], "t": "KL çizgisi açıortaya diktir; 136: açının tamamı; 44: bütünleri alınıp ikiye bölünmüş", "d": "Tarhın iki yarıçapı eşittir; K ve L zaten merkeze eşit uzaklıktadır. Açıortay merkez açısını ikiye böler.", "ses": "b13"}, {"no": 14, "on": "<p>Ela'nın uçurtmasında |AB| = |AD| ve |CB| = |CD|'dir. Ela, uçurtmanın simetri doğrusu olan AC doğrusunu kâğıda pergel ve işaretsiz cetvelle inşa etmek istemektedir. Aşağıdaki inşalar önerilmiştir.</p>", "g": "<svg viewBox=\"0 0 400 384\" width=\"400\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"200.0,30.0 120.0,110.0 200.0,290.0 280.0,110.0\" fill=\"#d0ebff\" stroke=\"#1c5fbf\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><line x1=\"164.9\" y1=\"74.9\" x2=\"155.1\" y2=\"65.1\" stroke=\"#111111\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"244.9\" y1=\"65.1\" x2=\"235.1\" y2=\"74.9\" stroke=\"#111111\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"165.4\" y1=\"194.9\" x2=\"152.6\" y2=\"200.6\" stroke=\"#111111\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"167.4\" y1=\"199.4\" x2=\"154.6\" y2=\"205.1\" stroke=\"#111111\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"247.4\" y1=\"200.6\" x2=\"234.6\" y2=\"194.9\" stroke=\"#111111\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"245.4\" y1=\"205.1\" x2=\"232.6\" y2=\"199.4\" stroke=\"#111111\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><path d=\"M200 290 q-30 30 0 50 q30 20 -10 40\" fill=\"none\" stroke=\"#495057\" stroke-width=\"1.6\"/><circle cx=\"200.0\" cy=\"30.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"200.0\" y=\"19.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"120.0\" cy=\"110.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"104.0\" y=\"115.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"200.0\" cy=\"290.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"216.0\" y=\"295.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><circle cx=\"280.0\" cy=\"110.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"296.0\" y=\"115.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">D</text></svg>", "son": "<div style=\"margin:1mm 0 1mm 2mm\"><div style=\"margin:.6mm 0\">I. BD doğru parçasının orta dikmesini inşa etmek</div><div style=\"margin:.6mm 0\">II. BAD açısının açıortayını inşa etmek</div><div style=\"margin:.6mm 0\">III. AB doğru parçasının orta dikmesini inşa etmek</div></div>", "k": "Buna göre, önerilen inşalardan hangileri AC doğrusunu verir?", "sec": ["I ve II", "Yalnız I", "Yalnız II", "I, II ve III"], "secg": null, "c": "A", "a": ["AC doğrusuna göre B'nin görüntüsü D'dir; BD'nin orta dikmesi AC doğrusudur.", "AB ve AD kolları AC'ye göre birbirinin görüntüsüdür; BAD açısının açıortayı da AC doğrusudur.", "AB'nin orta dikmesi C'den geçmez."], "t": "Yalnız I ya da Yalnız II: iki genellemeden biri unutulmuş; III'ü içeren seçenek: her orta dikme simetri doğrusu sanılmış", "d": "Uçurtmada hangi köşelerin ve hangi kenarların birbirinin görüntüsü olduğunu belirleyiniz. Her doğru parçasının orta dikmesi simetri doğrusu değildir.", "ses": "b14"}, {"no": 15, "on": "<p>Haritada A ve B eczanelerini birleştiren doğru parçasının orta dikmesi “sınır” olarak çizilmiştir. Bir evin A eczanesine uzaklığı 900 m, B eczanesine uzaklığı 750 m'dir. Sınır üzerindeki P noktasının A eczanesine uzaklığı 620 m'dir.</p>", "g": "<svg viewBox=\"0 0 440 230\" width=\"440\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"220.0\" y1=\"6.0\" x2=\"220.0\" y2=\"226.0\" stroke=\"#6741d9\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><text x=\"226.0\" y=\"22.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#6741d9\" text-anchor=\"start\">sınır</text><rect x=\"67\" y=\"67\" width=\"26\" height=\"26\" rx=\"5\" fill=\"#fff\" stroke=\"#c92a2a\" stroke-width eczanesine uzaklığı 750 m'dir.", "Ev sınırın B tarafındadır; P'nin B eczanesine uzaklığı 620 m'dir."], "secg": null, "c": "D", "a": ["Ev B'ye daha yakındır (750 &lt; 900); orta dikmenin B tarafındadır.", "P orta dikme üzerindedir; iki eczaneye eşit uzaklıktadır: PB = PA = 620 m."], "t": "A tarafı: uzaklıklar ters okunmuş; 470 m: uzaklık farkı çıkarılmış; sınırın üzerinde: eşit uzaklık için iki uzaklık eşit olmalıdır", "d": "Ev hangi eczaneye daha yakınsa sınırın o tarafındadır. Sınır üzerindeki bir nokta iki eczaneye eşit uzaklıktadır; uzaklıkları birbirinden çıkarmayınız.", "ses": "b15"}, {"no": 16, "on": "<p>Bir çırak, uzunluğu 75 cm olan bir tahtanın orta dikmesini iple inşa etmek istemiştir. İpin bir ucunu A'ya sabitleyip 30 cm'lik yaylar, B'ye sabitleyip 45 cm'lik yaylar çizmiş ve yayların kesişim noktalarını birleştirmiştir.</p>", "g": "<svg class=\"foto732\" viewBox=\"0 0 1340 864\" width=\"1340\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\" text-rendering=\"geometricPrecision\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAHqAvgDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAQIAAwQFBgf/xABOEAABBAAEAwQGCAIGBwcEAwABAAIDEQQSITEFQVETImFxBhQygZGhFSMzQlKxwdFi4RYkQ3KT8ERFU1Rzg5I0NVVkgqLxB2OElCVldP/EABkBAQEBAQEBAAAAAAAAAAAAAAABAgMEBf/EACQRAQEAAgIDAQEBAQADAQAAAAABAhESIQMTMVFBMiIUQmGB/9oADAMBAAIRAxEAPwDxoNqVqq2vFBO11rxvS3RDuhbMONVjgPdW6Aaq4/TL408k7RogBoiNF2cyuGqgT1aWkEpCkyhQIQhSYo0gRGk1I0gAURUtAKURvRBBEQoBaICA0hSYKUgSqRCJUAQCkQNUVAEBURpRAtKJlKQBqNKAJkAUCiiAE0oDaNWpVIAVAomAQAhQCk9IFAtI0iiAgFKIkKUgCCakaQKgQnpSkCAKEIlC1AtUjam6lIAQEKTIbIARokTFBAhXN43xhnCsJmADppNI238/JbsRNHh4XSyvDGNFlx5BfO+JY5/EMY+d5JvRoPIcgrIlrPJO+acySuLnuOpKSRxOgQIAfYN1yQLdC7ktsmjiL2Eg6pRFJ0VkclNcAVY0h5BByu6hESGGcjTY8locyRjO8wuPKgjFnbqdVY575O62z5aIrC6fEZizLdfJa ktaları iki uca eşit uzaklıkta olmaz. Çizgi tahtayı dik keser ama ortalamaz; küçük yayın merkezine yakın olan uca bakınız.", "ses": "b16"}, {"no": 17, "on": "<p>Yarım daire biçimindeki bir pencerede, alt kenarın orta noktası O'dan çıkan beş çubuk vardır. Çubukların ve alt kenarın oluşturduğu açılar pencerede gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 400 226\" width=\"400\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><path d=\"M20 200 A180 180 0 0 1 380 200 Z\" fill=\"#e7f5ff\" stroke=\"#495057\" stroke-width=\"5\"/><line x1=\"200.0\" y1=\"200.0\" x2=\"44.1\" y2=\"110.0\" stroke=\"#495057\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"200.0\" y1=\"200.0\" x2=\"110.0\" y2=\"44.1\" stroke=\"#495057\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"200.0\" y1=\"200.0\" x2=\"231.3\" y2=\"22.7\" stroke=\"#495057\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"200.0\" y1=\"200.0\" x2=\"337.9\" y2=\"84.3\" stroke=\"#495057\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"200.0\" y1=\"200.0\" x2=\"369.1\" y2=\"138.4\" stroke=\"#495057\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"84.1\" y=\"168.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#d9480f\" text-anchor=\"middle\">30°</text><text x=\"115.1\" y=\"115.1\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#d9480f\" text-anchor=\"middle\">30°</text><text x=\"179.2\" y=\"81.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#d9480f\" text-anchor=\"middle\">40°</text><text x=\"260.0\" y=\"96.1\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#d9480f\" text-anchor=\"middle\">40°</text><text x=\"329.9\" y=\"125.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#d9480f\" text-anchor=\"middle\">20°</text><text x=\"347.7\" y=\"174.0\" font-family=\"Source Sans 3\",sans-serif fon 0\" font-size=\"36\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">D′</text></g></g></svg>", "son": "<div style=\"margin:1mm 0 1mm 2mm\"><div style=\"margin:.6mm 0\">I. AA′ ve BB′ doğru parçalarının orta dikmeleri aynı doğrudur.</div><div style=\"margin:.6mm 0\">II. CC′ doğru parçasının orta dikmesi, AA′'nün orta dikmesiyle aynı doğru değildir.</div><div style=\"margin:.6mm 0\">III. Motifler bir doğruya göre simetriktir.</div></div>", "k": "Buna göre, verilen ifadelerden hangileri doğrudur?", "sec": ["Yalnız I", "I ve II", "Yalnız III", "I, II ve III"], "secg": null, "c": "B", "a": ["AA′ ve BB′ yataydır, uzunlukları 6 birimdir; orta noktaları A ve B'nin 3 birim sağındadır. İkisinin orta dikmesi aynı dikey doğrudur (I doğru).", "CC′ de yataydır; orta noktası C'nin 3 birim sağındadır. C, A'dan 2 birim sağda olduğundan bu orta dikme öbüründen farklı bir dikey doğrudur (II doğru).", "Bir nokta çifti uymadığı için motifler simetrik değildir (III yanlış)."], "t": "Yalnız I: II'deki sınama yapılmamış; III'ü içeren seçenekler: iki nokta çiftine bakılıp karar verilmiş", "d": "Simetri için bütün karşılıklı nokta çiftlerinin orta dikmesi aynı doğru olmalıdır. İki çiftin uyması yetmez; üçüncü çifti de sınayınız.", "ses": "b18"}, {"no": 19, "on": "<p>Bir bahçe mimarı, düz bir duvarın dibindeki O noktasından çıkan ve duvarla 22,5°'lik açı yapan bir çiçek sırası planlamaktadır. Mimarın açıölçeri yoktur; yalnız ip ve kazıkla (pergel ve işaretsiz cetvel gibi) açıortay inşa edebilmektedir.</p>", "g": "<svg class=\"foto732\" viewBox=\"0 0 1536 804\" width=\"1536\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\" text-rendering=\"geometricPrecision\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAGOAvgDASIAAhEB     kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
