=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"190.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Mert</text><text x=\"190.0\" y=\"60.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">pergel</text><text x=\"190.0\" y=\"80.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">ölçüsüz cetvel</text><rect x=\"260\" y=\"8\" width=\"112\" height=\"88\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M260 36 V16 q0 -8 8 -8 H364 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"316.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Ayşe</text><text x=\"316.0\" y=\"60.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">açıölçer</text><text x=\"316.0\" y=\"80.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">cetvel</text><rect x=\"386\" y=\"8\" width=\"112\" height=\"88\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M386 36 V16 q0 -8 8 -8 H490 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"442.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Kaan</text><text x=\"442.0\" y=\"60.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">pergel</text><text x=\"442.0\" y=\"80.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">cetvel ile ölçüm</text></svg>", "son": "", "k": "Buna göre, hangi öğrencinin yaptığı çizim bir inşadır?", "sec": ["Ece", "Mert", "Ayşe", "Kaan"], "secg": null, "c": "B", "a": ["İnşada yalnız pergel ve ölçüsüz cetvel kullanılır.", "Ece, Ayşe ve Kaan ölçme aracı (ölçülü cetvel, gönye, açıölçer) kullanmıştır.", "Yalnız Mert'in çizimi inşadır."], "t": "Kaan: pergel kullanıldığı için inşa sanılmış, ölçüm unutulmuş; Ece ve Ayşe: ölçerek çizim inşa sanılmış", "d": "Bir çizimin inşa olup olmadığına kullanılan araçlara bakarak karar veriniz. Pergel kullanılması yetmez; ölçülü cetvel, gönye ya da açıölçer kullanılırsa çizim ölçerek çizim olur.", "ses": "b01"}, {"no": 2, "on": "<p>Bir marangoz, uzunluğu 96 cm olan bir çıtayı hiçbir şey ölçmeden tam ortasından kesmek istemektedir. Bunun için pergel ve işaretsiz bir cetvelle çıtanın orta dikmesini inşa etmiş, kesimi orta dikmenin çıtayı kestiği noktadan yapmıştır.</p>", "g": "<svg viewBox=\"0 0 460 146\" width=\"460\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"40\" y=\"82\" width=\"380\" height=\"20\" rx=\"3\" fill=\"#f3d9a4\" stroke=\"#8a6d1d\" stroke-width=\"1.4\"/><line x1=\"40.0\" y1=\"128.0\" x2=\"420.0\" y2=\"128.0\" stroke=\"#8a93a6\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><line x1=\"40.0\" y1=\"122.0\" x2=\"40.0\" y2=\"134.0\" stroke=\"#8a93a6\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><line x1=\"420.0\" y1=\"122.0\" x2=\"420.0\" y2=\"134.0\" stroke=\"#8a93a6\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><rect x=\"200\" y=\"119\" width=\"60\" height=\"18\" fill=\"#fff\"/><text x=\"230.0\" y=\"133.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">96 cm</text><circle cx=\"40.0\" cy=\"92.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"26.0\" y=\"97.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"420.0\" cy=\"92.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"434.0\" y=\"97.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text></svg>", "son": "", "k": "Buna göre, kesimden sonra elde edilen parçalardan biri kaç santimetredir?", "sec": ["48", "96", "24", "32"], "secg": null, "c": "A", "a": ["Orta dikme çıtayı iki eş parçaya ayırır.", "96 : 2 = 48."], "t": "96: çıtanın tamamı; 24: dörde bölünmüş; 32: üçe bölünmüş", "d": "Orta dikme doğru parçasını iki eş parçaya ayırır. Parçalardan birini bulmak için uzunluğu ikiye bölünüz; ikiye bölmeyi unutup uzunluğun tamamını yazmayınız.", "ses": "b02"}, {"no": 3, "on": "<p>Bir ilçede herkesin kendisine daha yakın olan eczaneye gitmesi önerilmektedir. Haritada A ve B eczanelerini birleştiren doğru parçasının orta dikmesi “sınır” olarak çizilmiştir. K, L ve M evleri haritada gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 440 218\" width=\"440\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"220.0\" y1=\"6.0\" x2=\"220.0\" y2=\"214.0\" stroke=\"#6741d9\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><text x=\"226.0\" y=\"22.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#6741d9\" text-anchor=\"start\">sınır</text><rect x=\"77\" y=\"57\" width=\"26\" height=\"26\" rx=\"5\" fill=\"#fff\" stroke=\"#c92a2a\" stroke-width=\"1.8\"/><path d=\"M87 62h6v5h5v6h-5v5h-6v-5h-5v-6h5z\" fill=\"#c92a2a\"/><text x=\"90.0\" y=\"102.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A eczanesi</text><rect x=\"337\" y=\"57\" width=\"26\" height=\"26\" rx=\"5\" fill=\"#fff\" stroke=\"#c92a2a\" stroke-width=\"1.8\"/><path d=\"M347 62h6v5h5v6h-5v5h-6v-5h-5v-6h5z\" fill=\"#c92a2a\"/><text x=\"350.0\" y=\"102.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B eczanesi</text><rect x=\"140\" y=\"162\" width=\"20\" height=\"15\" fill=\"#fff4e6\" stroke=\"#d9480f\" stroke-width=\"1.4\"/><polygon points=\"137,162 150,150 163,162\" fill=\"#d9480f\"/><text x=\"150.0\" y=\"195.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">K</text><rect x=\"246\" y=\"144\" width=\"20\" height=\"15\" fill=\"#fff4e6\" stroke=\"#d9480f\" stroke-width=\"1.4\"/><polygon points=\"243,144 256,132 269,144\" fill=\"#d9480f\"/><text x=\"256.0\" y=\"177.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">L</text><rect x=\"320\" y=\"180\" width=\"20\" height=\"15\" fill=\"#fff4e6\" stroke=\"#d9480f\" stroke-width=\"1.4\"/><polygon points=\"317,180 330,168 343,180\" fill=\"#d9480f\"/><text x=\"330.0\" y=\"213.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">M</text></svg>", "son": "", "k": "Buna göre, hangi ev A eczanesine B eczanesinden daha yakındır?", "sec": ["Yalnız L", "K ve L", "L ve M", "Yalnız K"], "secg": null, "c": "D", "a": ["Orta dikme üzerindeki noktalar iki eczaneye eşit uzaklıktadır.", "Sınırın hangi tarafındaki ev, o taraftaki eczaneye daha yakındır.", "Sınırın A tarafında yalnız K vardır; L ve M B tarafındadır."], "t": "L'yi içeren seçenekler: L sınıra yakın olduğu için A tarafında sanılmış; M: evlerin haritadaki üst–alt konumuna bakılmış", "d": "Sınır, iki eczaneyi birleştiren doğru parçasının orta dikmesidir. Evin sınırın hangi tarafında olduğuna bakınız; haritada yukarıda ya da aşağıda olması önemli değildir.", "ses": "b03"}, {"no": 4, "on": "<p>Düz bir aynaya gelen ışın ile aynadan yansıyan ışın arasındaki açı 70°'dir. Aynaya ışının geldiği noktada dik olan çizgi (normal), bu açının açıortayıdır.</p>", "g": "<svg viewBox=\"0 0 400 210\" width=\"400\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"40\" y=\"170\" width=\"320\" height=\"10\" fill=\"#d0ebff\" stroke=\"#1c5fbf\" stroke-width=\"1.4\"/><text x=\"352.0\" y=\"200.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#1c5fbf\" text-anchor=\"end\">ayna</text><line x1=\"200.0\" y1=\"170.0\" x2=\"200.0\" y2=\"30.0\" stroke=\"#8a93a6\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><text x=\"206.0\" y=\"40.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#495057\" text-anchor=\"start\">normal</text><line x1=\"119.7\" y1=\"55.3\" x2=\"200.0\" y2=\"170.0\" stroke=\"#d9480f\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><line x1=\"200.0\" y1=\"170.0\" x2=\"280.3\" y2=\"55.3\" stroke=\"#d9480f\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><path d=\"M226.4 132.3 A46.0 46.0 0 0 0 173.6 132.3\" fill=\"none\" stroke=\"#6741d9\" stroke-width=\"1.6\"/><text x=\"200.0\" y=\"104.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#6741d9\" text-anchor=\"middle\">70°</text><text x=\"113.7\" y=\"49.3\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"end\">gelen ışın</text><text x=\"286.3\" y=\"49.3\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">yansıyan ışın</text></svg>", "son": "", "k": "Buna göre, gelen ışın ile normal arasındaki açı kaç derecedir?", "sec": ["70", "20", "35", "110"], "secg": null, "c": "C", "a": ["Normal, gelen ve yansıyan ışın arasındaki açının açıortayıdır.", "Açıortay açıyı iki eş açıya ayırır: 70 : 2 = 35."], "t": "70: açının tamamı; 20: tümleri alınmış; 110: bütünleri alınmış", "d": "Normal, gelen ve yansıyan ışın arasındaki açının açıortayıdır. Açıyı ikiye bölünüz; ayna ile ışın arasındaki açıyı sorulan açıyla karıştırmayınız.", "ses": "b04"}, {"no": 5, "on": "<p>Yuvarlak bir pizza merkezden geçen kesimlerle 8 eş dilime ayrılmıştır. Nehir, turuncu ile gösterilen dilimi de hiçbir şey ölçmeden simetri doğrusu boyunca iki eş parçaya ayırmak istemektedir.</p>", "g": "<svg viewBox=\"0 0 300 260\" width=\"300\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><circle cx=\"150\" cy=\"130\" r=\"110\" fill=\"#ffe8a3\" stroke=\"#b07a1f\" stroke-width=\"3\"/><line x1=\"150.0\" y1=\"130.0\" x2=\"150.0\" y2=\"20.0\" stroke=\"#b07a1f\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"150.0\" y1=\"130.0\" x2=\"72.2\" y2=\"52.2\" stroke=\"#b07a1f\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"150.0\" y1=\"130.0\" x2=\"40.0\" y2=\"130.0\" stroke=\"#b07a1f\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"150.0\" y1=\"130.0\" x2=\"72.2\" y2=\"207.8\" stroke=\"#b07a1f\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"150.0\" y1=\"130.0\" x2=\"150.0\" y2=\"240.0\" stroke=\"#b07a1f\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"150.0\" y1=\"130.0\" x2=\"227.8\" y2=\"207.8\" stroke=\"#b07a1f\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"150.0\" y1=\"130.0\" x2=\"260.0\" y2=\"130.0\" stroke=\"#b07a1f\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"150.0\" y1=\"130.0\" x2=\"227.8\" y2=\"52.2\" stroke=\"#b07a1f\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><path d=\"M150.0 130.0 L150.0 20.0 A110 110 0 0 0 72.2 52.2 Z\" fill=\"#ffd8a8\" stroke=\"#d9480f\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><circle cx=\"125\" cy=\"69\" r=\"8\" fill=\"#e8590c\" opacity=\".55\"/><circle cx=\"89\" cy=\"105\" r=\"8\" fill=\"#e8590c\" opacity=\".55\"/><circle cx=\"89\" cy=\"155\" r=\"8\" fill=\"#e8590c\" opacity=\".55\"/><circle cx=\"125\" cy=\"191\" r=\"8\" fill=\"#e8590c\" opacity=\".55\"/><circle cx=\"175\" cy=\"191\" r=\"8\" fill=\"#e8590c\" opacity=\".55\"/><circle cx=\"211\" cy=\"155\" r=\"8\" fill=\"#e8590c\" opacity=\".55\"/><circle cx=\"211\" cy=\"105\" r=\"8\" fill=\"#e8590c\" opacity=\".55\"/><circle cx=\"175\" cy=\"69\" r=\"8\" fill=\"#e8590c\" opacity=\".55\"/></svg>", "son": "", "k": "Buna göre, Nehir'in kesimiyle dilimin merkez açısı kaçar derecelik iki açıya ayrılır?", "sec": ["22,5", "45", "40", "11,25"], "secg": null, "c": "A", "a": ["8 eş dilimin her birinin merkez açısı 360 : 8 = 45°'dir.", "Dilimin simetri doğrusu merkez açısının açıortayıdır: 45 : 2 = 22,5."], "t": "45: açının tamamı; 40: 360'ın dokuza bölündüğü sanılmış; 11,25: iki kez yarılanmış", "d": "Önce bir dilimin merkez açısını bulunuz: tam açı 360°'dir. Simetri doğrusu bu açıyı ikiye böler.", "ses": "b05"}, {"no": 6, "on": "<p>Defne, kâğıda çizdiği BAC açısını AB kolu AC kolunun tam üzerine gelecek şekilde katlamıştır. Kâğıdı açtığında A'dan geçen bir katlama izi oluşmuştur.</p>", "g": "<svg viewBox=\"0 0 340 214\" width=\"340\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"40.0\" y1=\"190.0\" x2=\"300.0\" y2=\"190.0\" stroke=\"#111111\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"40.0\" y1=\"190.0\" x2=\"98.7\" y2=\"9.3\" stroke=\"#111111\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"40.0\" y1=\"190.0\" x2=\"226.1\" y2=\"54.8\" stroke=\"#6741d9\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-dasharray=\"7 5\"/><path d=\"M210 120 q36 -30 6 -86\" fill=\"none\" stroke=\"#495057\" stroke-width=\"1.6\"/><polygon points=\"216,34 213.0,40.0 219.0,40.0\" fill=\"#495057\"/><circle cx=\"40.0\" cy=\"190.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"28.7\" y=\"206.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><text x=\"292.0\" y=\"206.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><text x=\"106.0\" y=\"18.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><text x=\"232.0\" y=\"140.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#6741d9\" text-anchor=\"start\">katlama izi</text></svg>", "son": "", "k": "Buna göre, katlama izi için aşağıdakilerden hangisi doğrudur?", "sec": ["AB koluna diktir.", "BAC açısını iki eş açıya ayırır.", "BAC açısını farklı ölçülerde iki açıya ayırır.", "Yalnız ölçülerek çizilebilir."], "secg": null, "c": "B", "a": ["Katlama bir yansımadır; AB kolunun görüntüsü AC koludur.", "Çakışan iki parça eş açılardır; katlama izi açıortaydır."], "t": "Diklik: katlama izi kola dik olmak zorunda değildir; farklı ölçüler: kollar çakıştığı için olamaz; ölçme: açıortay pergel ve ölçüsüz cetvelle de inşa edilir", "d": "Katlama bir yansımadır: kollar çakışıyorsa iki parça eş açılardır. Katlama izinin kollardan birine dik olması gerekmez.", "ses": "b06"}, {"no": 7, "on": "<p>A ve B köylerinin yakınından düz bir yol geçmektedir. Yolun üzerinde iki köye eşit uzaklıkta Ç noktasına bir çeşme yapılmıştır. Çeşmenin A köyüne uzaklığı 1,8 km'dir. Yolda çeşmeden B köyü tarafına doğru bir P noktasında bir otobüs durağı vardır.</p>", "g": "<svg viewBox=\"0 0 440 260\" width=\"440\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"20.0\" y1=\"236.0\" x2=\"430.0\" y2=\"196.0\" stroke=\"#868e96\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"20.0\" y1=\"236.0\" x2=\"430.0\" y2=\"196.0\" stroke=\"#fff\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><text x=\"36.0\" y=\"226.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">yol</text><rect x=\"101\" y=\"54\" width=\"18\" height=\"14\" fill=\"#fff4e6\" stroke=\"#d9480f\" stroke-width=\"1.4\"/><polygon points=\"98,54 110,43 122,54\" fill=\"#d9480f\"/><rect x=\"321\" y=\"122\" width=\"18\" height=\"14\" fill=\"#fff4e6\" stroke=\"#d9480f\" stroke-width=\"1.4\"/><polygon points=\"318,122 330,111 342,122\" fill=\"#d9480f\"/><circle cx=\"181.0\" cy=\"220.3\" r=\"4.5\" fill=\"#d9480f\"/><text x=\"181.0\" y=\"207.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Ç</text><circle cx=\"250.6\" cy=\"213.5\" r=\"4.5\" fill=\"#6741d9\"/><text x=\"250.6\" y=\"200.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">P</text><circle cx=\"110.0\" cy=\"60.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"66.0\" y=\"65.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A köyü</text><circle cx=\"330.0\" cy=\"128.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"372.0\" y=\"133.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B köyü</text></svg>", "son": "", "k": "Buna göre, çeşmenin B köyüne uzaklığı ve P durağının hangi köye daha yakın olduğu aşağıdakilerden hangisinde birlikte doğru verilmiştir?", "sec": ["1,8 km · A köyü", "0,9 km · B köyü", "3,6 km · A köyü", "1,8 km · B köyü"], "secg": null, "c": "D", "a": ["Ç iki köye eşit uzaklıkta olduğundan AB'nin orta dikmesi üzerindedir: ÇB = ÇA = 1,8 km.", "P, orta dikmenin B tarafındadır; B köyüne daha yakındır."], "t": "A köyü: taraf ters okunmuş; 0,9 km: uzaklık yarıya bölünmüş; 3,6 km: iki uzaklık toplanmış", "d": "Çeşme orta dikme üzerindedir; iki köye uzaklığı eşittir. Yol üzerindeki bir noktanın hangi köye yakın olduğunu orta dikmenin hangi tarafında kaldığına bakarak bulunuz.", "ses": "b07"}, {"no": 8, "on": "<p>Bir antrenör, kalecinin top T noktasındayken durması gereken çizgiyi sahada işaretleyecektir. Kaleci, T ile iki direği (D₁ ve D₂) birleştiren çizgiler arasındaki açının açıortayı üzerinde durmalıdır. Antrenörün elinde yalnız bir ip ve bir tebeşir vardır; ipi pergel gibi kullanacaktır. Antrenör önce T merkezli ip yayıyla iki çizgi üzerinde K ve L noktalarını işaretlemiştir.</p>", "g": "<svg viewBox=\"0 0 420 230\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"0\" y=\"0\" width=\"420\" height=\"230\" fill=\"#ebfbee\"/><line x1=\"149.1\" y1=\"51.3\" x2=\"270.9\" y2=\"51.3\" stroke=\"#495057\" stroke-width=\"5\" stroke-linecap=\"round\"/><line x1=\"210.0\" y1=\"210.0\" x2=\"149.1\" y2=\"51.3\" stroke=\"#8a93a6\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><line x1=\"210.0\" y1=\"210.0\" x2=\"270.9\" y2=\"51.3\" stroke=\"#8a93a6\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><circle cx=\"210\" cy=\"206\" r=\"9\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"1.6\"/><text x=\"226.0\" y=\"210.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"start\">T (top)</text><circle cx=\"149.1\" cy=\"51.3\" r=\"3.3\" fill=\"#111111\"/><text x=\"127.1\" y=\"56.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">D₁</text><circle cx=\"270.9\" cy=\"51.3\" r=\"3.3\" fill=\"#111111\"/><text x=\"292.9\" y=\"56.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">D₂</text><path d=\"M227.9 163.3 A50.0 50.0 0 0 0 192.1 163.3\" fill=\"none\" stroke=\"#6741d9\" stroke-width=\"1.6\"/></svg>", "son": "", "k": "Buna göre, antrenörün bundan sonra yapması gereken işlem aşağıdakilerden hangisidir?", "sec": ["K ile L'yi birleştirip bu çizgiyi kalecinin çizgisi saymak", "K'den D₁D₂ çizgisine dik inmek", "K ve L merkezli, eşit uzunlukta ip yaylarını kesiştirip kesişim noktasını T ile birleştirmek", "T ile direklerden birinin ortasını birleştirmek"], "secg": null, "c": "C", "a": ["T merkezli yay, açının kollarından eşit uzunlukta parçalar keser (|TK| = |TL|).", "Açıortay inşasının sıradaki adımı K ve L merkezli eş yayların kesişim noktasını bulmaktır.", "Kesişim noktası T ile birleştirilince açıortay elde edilir."], "t": "KL çizgisi açıortaya diktir; dik inmek ve bir direğin ortası açıortayı vermez", "d": "İp burada pergel gibi kullanılır. Açıortay inşasında önce kollardan eşit parçalar kesilir, sonra K ve L merkezli eş yaylar kesiştirilir.", "ses": "b08"}, {"no": 9, "on": "<p>K kavşağında kesişen iki yolun arasındaki parka bir aydınlatma direği dikilecektir. Direk iki yola eşit uzaklıkta olacak ve 1. yola uzaklığı 12 m olacaktır.</p>", "g": "<svg viewBox=\"0 0 430 236\" width=\"430\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"40.0\" y1=\"196.0\" x2=\"420.0\" y2=\"196.0\" stroke=\"#868e96\" stroke-width=\"12\" stroke-linecap=\"round\"/><line x1=\"40.0\" y1=\"196.0\" x2=\"161.9\" y2=\"0.9\" stroke=\"#868e96\" stroke-width=\"12\" stroke-linecap=\"round\"/><line x1=\"40.0\" y1=\"196.0\" x2=\"420.0\" y2=\"196.0\" stroke=\"#fff\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><line x1=\"40.0\" y1=\"196.0\" x2=\"161.9\" y2=\"0.9\" stroke=\"#fff\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><text x=\"390.0\" y=\"222.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">1. yol</text><text x=\"143.5\" y=\"-16.1\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2. yol</text><text x=\"36.0\" y=\"222.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"start\">K kavşağı</text><rect x=\"257\" y=\"110\" width=\"6\" height=\"16\" fill=\"#8d5524\"/><circle cx=\"260\" cy=\"104\" r=\"14\" fill=\"#8ce99a\" stroke=\"#2b8a3e\" stroke-width=\"1.4\"/><text x=\"260.0\" y=\"144.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\"></text><rect x=\"297\" y=\"140\" width=\"6\" height=\"16\" fill=\"#8d5524\"/><circle cx=\"300\" cy=\"134\" r=\"14\" fill=\"#8ce99a\" stroke=\"#2b8a3e\" stroke-width=\"1.4\"/><text x=\"300.0\" y=\"174.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\"></text><text x=\"272.0\" y=\"82.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#2b8a3e\" text-anchor=\"middle\">park</text></svg>", "son": "", "k": "Buna göre, direğin yeri ve 2. yola uzaklığı için aşağıdakilerden hangisi doğrudur?", "sec": ["Yolların oluşturduğu açının açıortayı üzerindedir; 2. yola uzaklığı 6 m'dir.", "Yolların oluşturduğu açının açıortayı üzerindedir; 2. yola uzaklığı 12 m'dir.", "K kavşağına 12 m uzaklıktadır; 2. yola uzaklığı 12 m'dir.", "1. yola dik bir doğru üzerindedir; 2. yola uzaklığı 24 m'dir."], "secg": null, "c": "B", "a": ["Açıortay üzerindeki her nokta açının kollarına eşit uzaklıktadır.", "Direk iki yola eşit uzaklıkta olacağı için açıortay üzerinde seçilir.", "2. yola uzaklığı da 12 m olur."], "t": "6 m: uzaklık yarıya bölünmüş; kavşağa uzaklık kollara uzaklık sanılmış; 24 m: iki katı alınmış", "d": "İki yola eşit uzaklıktaki noktalar yolların oluşturduğu açının açıortayı üzerindedir. Kavşağa uzaklık ile yola uzaklık farklı şeylerdir.", "ses": "b09"}, {"no": 10, "on": "<p>Bir bahçıvan, aralarındaki uzaklık 12 m olan A ve B ağaçlarını birleştiren çizginin orta dikmesini iple inşa etmek istemektedir. 5 m'lik ipin bir ucunu önce A ağacının dibine, sonra B ağacının dibine sabitleyip ipin öbür ucuyla yerde yaylar çizmiştir.</p>", "g": "<svg viewBox=\"0 0 460 230\" width=\"460\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"0\" y=\"0\" width=\"460\" height=\"230\" fill=\"#f4fce3\"/><rect x=\"117\" y=\"120\" width=\"6\" height=\"16\" fill=\"#8d5524\"/><circle cx=\"120\" cy=\"114\" r=\"14\" fill=\"#8ce99a\" stroke=\"#2b8a3e\" stroke-width=\"1.4\"/><text x=\"120.0\" y=\"154.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><rect x=\"337\" y=\"120\" width=\"6\" height=\"16\" fill=\"#8d5524\"/><circle cx=\"340\" cy=\"114\" r=\"14\" fill=\"#8ce99a\" stroke=\"#2b8a3e\" stroke-width=\"1.4\"/><text x=\"340.0\" y=\"154.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><line x1=\"120.0\" y1=\"186.0\" x2=\"340.0\" y2=\"186.0\" stroke=\"#8a93a6\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><rect x=\"200\" y=\"177\" width=\"60\" height=\"18\" fill=\"#f4fce3\"/><text x=\"230.0\" y=\"191.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">12 m</text><circle cx=\"120.0\" cy=\"120.0\" r=\"92.0\" fill=\"none\" stroke=\"#d9480f\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><circle cx=\"340.0\" cy=\"120.0\" r=\"92.0\" fill=\"none\" stroke=\"#d9480f\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/></svg>", "son": "", "k": "Buna göre, aşağıdakilerden hangisi doğrudur?", "sec": ["Yaylar kesişmez; ipin uzunluğu 6 m'den fazla olmalıdır.", "Yaylar iki noktada kesişir; orta dikme çizilebilir.", "Yaylar yalnız orta noktada değer; orta dikme çizilebilir.", "Yaylar kesişmez; ipin uzunluğu 12 m'den fazla olmalıdır."], "secg": null, "c": "A", "a": ["Yayların iki noktada kesişmesi için yarıçap |AB|'nin yarısından büyük olmalıdır: 12 : 2 = 6 m.", "5 m &lt; 6 m olduğundan yaylar kesişmez."], "t": "İki ya da bir noktada kesişme: 5 m yeterli sanılmış; 12 m: yarıçapın |AB|'den büyük olması gerektiği sanılmış", "d": "Yayların kesişmesi için ip, iki ağaç arasındaki uzaklığın yarısından uzun olmalıdır. Uzaklığın tamamından uzun olması gerekmez.", "ses": "b10"}, {"no": 11, "on": "<p>Bir kilim ustası, eşkenar dörtgen biçimindeki ABCD motifinin B ve D köşelerinden geçen simetri doğrusunu, motifi bozmadan pergel ve işaretsiz cetvelle inşa edecektir.</p>", "g": "<svg viewBox=\"0 0 400 240\" width=\"400\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"10\" y=\"10\" width=\"380\" height=\"220\" rx=\"8\" fill=\"#fff4e6\" stroke=\"#d9480f\" stroke-width=\"2\"/><polygon points=\"60.0,120.0 200.0,40.0 340.0,120.0 200.0,200.0\" fill=\"#ffdeeb\" stroke=\"#a61e4d\" stroke-width=\"3\" stroke-linejoin=\"round\"/><polygon points=\"130.0,120.0 200.0,80.0 270.0,120.0 200.0,160.0\" fill=\"#d0ebff\" stroke=\"#1c5fbf\" stroke-width=\"2\" stroke-linejoin=\"round\"/><circle cx=\"60.0\" cy=\"120.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"44.0\" y=\"125.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"200.0\" cy=\"40.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"200.0\" y=\"29.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"340.0\" cy=\"120.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"356.0\" y=\"125.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><circle cx=\"200.0\" cy=\"200.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"200.0\" y=\"221.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">D</text></svg>", "son": "", "k": "Buna göre, usta bu simetri doğrusunu aşağıdaki inşalardan hangisiyle elde eder?", "sec": ["BD doğru parçasının orta dikmesini inşa ederek", "ABC açısının açıortayını inşa ederek", "AC doğru parçasının orta dikmesini inşa ederek", "A köşesinden BD'ye dik inerek"], "secg": null, "c": "C", "a": ["B ve D'den geçen doğruya göre A'nın görüntüsü C'dir.", "Bir nokta ile görüntüsünü birleştiren doğru parçasının orta dikmesi simetri doğrusudur: AC'nin orta dikmesi BD doğrusudur."], "t": "BD'nin orta dikmesi öbür simetri doğrusunu, yani AC doğrusunu verir; ABC açısının açıortayı BD doğrusu boyunca uzanır ama B'den geçer, inşası için başka adım gerekir; dik inmek bir ölçerek çizim adımıdır", "d": "B ve D'den geçen simetri doğrusuna göre hangi iki köşenin birbirinin görüntüsü olduğunu bulunuz. Simetri doğrusu, bu iki köşeyi birleştiren doğru parçasının orta dikmesidir.", "ses": "b11"}, {"no": 12, "on": "<p>Bir parkın girişine birbirine göre simetrik iki heykel (A ve A′) konmuştur. Görevli, heykeller arasındaki simetri doğrusu boyunca bir yol yapmak için önce bu doğruyu cetvel ve gönyeyle ölçerek çizmeyi düşünmektedir.</p>", "g": "<svg viewBox=\"0 0 420 220\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"0\" y=\"0\" width=\"420\" height=\"220\" fill=\"#f8f9fa\"/><rect x=\"94\" y=\"142\" width=\"32\" height=\"20\" fill=\"#ced4da\" stroke=\"#495057\"/><circle cx=\"110\" cy=\"124\" r=\"16\" fill=\"#adb5bd\" stroke=\"#495057\"/><text x=\"110.0\" y=\"184.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><rect x=\"294\" y=\"142\" width=\"32\" height=\"20\" fill=\"#ced4da\" stroke=\"#495057\"/><circle cx=\"310\" cy=\"124\" r=\"16\" fill=\"#adb5bd\" stroke=\"#495057\"/><text x=\"310.0\" y=\"184.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A′</text><text x=\"210.0\" y=\"30.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Park girişi</text></svg>", "son": "", "k": "Buna göre, görevlinin yapacağı işlerin sırası aşağıdakilerden hangisidir?", "sec": ["Orta noktadan dik doğru çizmek → A ile A′'yü birleştirmek → orta noktayı bulmak", "A'dan A′'ye dik doğru çizmek → A ile A′'yü birleştirmek → orta noktayı bulmak", "Orta noktayı bulmak → A ile A′'yü birleştirmek → dik doğru çizmek", "A ile A′'yü birleştirmek → orta noktayı ölçerek bulmak → orta noktadan dik doğru çizmek"], "secg": null, "c": "D", "a": ["Simetrik noktaları birleştiren doğru parçası çizilir.", "Bu doğru parçasının orta noktası belirlenir.", "Orta noktadan doğru parçasına dik doğru çizilir."], "t": "Öbür sıralamalarda orta nokta, doğru parçası çizilmeden ya da dik doğru, orta nokta bulunmadan aranmıştır", "d": "Simetri doğrusunu oluşturmanın üç işi sırayla yapılır: önce doğru parçası çizilir, sonra orta noktası bulunur, en son orta noktadan dik doğru çizilir.", "ses": "b12"}, {"no": 13, "on": "<p>Bir parkta daire dilimi biçiminde bir çiçek tarhı vardır. Tarhın merkez açısı 136°'dir. Bahçıvan, tarhı iki eş parçaya ayıran bir yürüme yolunu ip ve kazıkla inşa edecektir. Tarhın yarıçaplarının uçları K ve L'dir.</p>", "g": "<svg viewBox=\"0 0 403.58285411713166 276\" width=\"404\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><g transform=\"translate(154 0)\"><path d=\"M40.0 250.0 L209.1 188.4 A180 180 0 0 0 -124.4 176.8 Z\" fill=\"#fff3bf\" stroke=\"#111111\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><circle cx=\"40.0\" cy=\"250.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"28.7\" y=\"266.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">O</text><circle cx=\"209.1\" cy=\"188.4\" r=\"3.3\" fill=\"#111111\"/><text x=\"221.4\" y=\"204.1\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">K</text><circle cx=\"-124.4\" cy=\"176.8\" r=\"3.3\" fill=\"#111111\"/><text x=\"-137.4\" y=\"191.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">L</text></g></svg>", "son": "", "k": "Buna göre, aşağıdakilerden hangisi doğrudur?", "sec": ["Yol, K ile L'yi birleştiren çizgidir; merkez açısını 68°'lik iki açıya ayırır.", "Yol, K ve L merkezli eş yayların kesişim noktası ile O'dan geçer; merkez açısını 68°'lik iki açıya ayırır.", "Yol, O merkezli bir yayın orta noktasından geçer; merkez açısını 136°'lik iki açıya ayırır.", "Yol, K ve L merkezli eş yayların kesişim noktası ile O'dan geçer; merkez açısını 44°'lik iki açıya ayırır."], "secg": null, "c": "B", "a": ["|OK| = |OL| olduğu için açıortay inşasının 1. adımına gerek yoktur.", "K ve L merkezli eş yaylar kesiştirilir; kesişim noktası O ile birleştirilir.", "Açıortay merkez açısını 136 : 2 = 68 derecelik iki açıya ayırır."], "t": "KL çizgisi açıortaya diktir; 136: açının tamamı; 44: bütünleri alınıp ikiye bölünmüş", "d": "Tarhın iki yarıçapı eşittir; K ve L zaten merkeze eşit uzaklıktadır. Açıortay merkez açısını ikiye böler.", "ses": "b13"}, {"no": 14, "on": "<p>Ela'nın uçurtmasında |AB| = |AD| ve |CB| = |CD|'dir. Ela, uçurtmanın simetri doğrusu olan AC doğrusunu kâğıda pergel ve işaretsiz cetvelle inşa etmek istemektedir. Aşağıdaki inşalar önerilmiştir.</p>", "g": "<svg viewBox=\"0 0 400 384\" width=\"400\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"200.0,30.0 120.0,110.0 200.0,290.0 280.0,110.0\" fill=\"#d0ebff\" stroke=\"#1c5fbf\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><line x1=\"164.9\" y1=\"74.9\" x2=\"155.1\" y2=\"65.1\" stroke=\"#111111\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"244.9\" y1=\"65.1\" x2=\"235.1\" y2=\"74.9\" stroke=\"#111111\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"165.4\" y1=\"194.9\" x2=\"152.6\" y2=\"200.6\" stroke=\"#111111\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"167.4\" y1=\"199.4\" x2=\"154.6\" y2=\"205.1\" stroke=\"#111111\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"247.4\" y1=\"200.6\" x2=\"234.6\" y2=\"194.9\" stroke=\"#111111\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"245.4\" y1=\"205.1\" x2=\"232.6\" y2=\"199.4\" stroke=\"#111111\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><path d=\"M200 290 q-30 30 0 50 q30 20 -10 40\" fill=\"none\" stroke=\"#495057\" stroke-width=\"1.6\"/><circle cx=\"200.0\" cy=\"30.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"200.0\" y=\"19.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"120.0\" cy=\"110.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"104.0\" y=\"115.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"200.0\" cy=\"290.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"216.0\" y=\"295.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><circle cx=\"280.0\" cy=\"110.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"296.0\" y=\"115.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">D</text></svg>", "son": "<div style=\"margin:1mm 0 1mm 2mm\"><div style=\"margin:.6mm 0\">I. BD doğru parçasının orta dikmesini inşa etmek</div><div style=\"margin:.6mm 0\">II. BAD açısının açıortayını inşa etmek</div><div style=\"margin:.6mm 0\">III. AB doğru parçasının orta dikmesini inşa etmek</div></div>", "k": "Buna göre, önerilen inşalardan hangileri AC doğrusunu verir?", "sec": ["I ve II", "Yalnız I", "Yalnız II", "I, II ve III"], "secg": null, "c": "A", "a": ["AC doğrusuna göre B'nin görüntüsü D'dir; BD'nin orta dikmesi AC doğrusudur.", "AB ve AD kolları AC'ye göre birbirinin görüntüsüdür; BAD açısının açıortayı da AC doğrusudur.", "AB'nin orta dikmesi C'den geçmez."], "t": "Yalnız I ya da Yalnız II: iki genellemeden biri unutulmuş; III'ü içeren seçenek: her orta dikme simetri doğrusu sanılmış", "d": "Uçurtmada hangi köşelerin ve hangi kenarların birbirinin görüntüsü olduğunu belirleyiniz. Her doğru parçasının orta dikmesi simetri doğrusu değildir.", "ses": "b14"}, {"no": 15, "on": "<p>Haritada A ve B eczanelerini birleştiren doğru parçasının orta dikmesi “sınır” olarak çizilmiştir. Bir evin A eczanesine uzaklığı 900 m, B eczanesine uzaklığı 750 m'dir. Sınır üzerindeki P noktasının A eczanesine uzaklığı 620 m'dir.</p>", "g": "<svg viewBox=\"0 0 440 230\" width=\"440\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"220.0\" y1=\"6.0\" x2=\"220.0\" y2=\"226.0\" stroke=\"#6741d9\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><text x=\"226.0\" y=\"22.0\" font-famil /* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}

          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);

      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}

  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
