<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* ANA_KURALLAR §4.y-3: Etkinliklerde bütün kesirler kesir çizgisiyle (alt alta pay/payda) gösterilir. Düz yazılmış a/b biçimleri otomatik dönüştürülür. */
(function(){
  if (window.__kesirCizgi) return; window.__kesirCizgi = 1;
  const RX = /(^|[^\w\/.,:%])([−-])?(?:(\d+) )?(\d{1,4})\/(\d{1,4})(?![\w\/.,]\d|\w)/g;
  const ATLA = "script,style,svg,textarea,input,select,code,.ilr,.frac,[data-duz]";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function donustur(kok){
    if (!kok || !kok.nodeType) return;
    if (kok.nodeType === 3) kok = kok.parentElement;
    if (!kok || (kok.closest && kok.closest(ATLA))) return;
    const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      if (!/\d\/\d/.test(t.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = t.parentElement; if (!p || p.closest(ATLA)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const L = []; let t; while ((t = w.nextNode())) L.push(t);
    L.forEach(t => {
      let deg = false;
      const h = esc(t.nodeValue).replace(RX, (m, a, s, tam, p, q) => { deg = true;
        return a + (s ? "−" : "") + (tam ? tam + " " : "") + '<span class="frac"><span>' + p + "</span><span>" + q + "</span></span>"; });
      if (!deg) return;
      const k = document.createElement("span"); k.innerHTML = h; t.replaceWith(...k.childNodes);
    });
  }
  let bekleyen = new Set(), plan = 0;
  const calis = () => { plan = 0; const b = bekleyen; bekleyen = new Set(); b.forEach(donustur); };
  const gozcu = new MutationObserver(ms => { ms.forEach(m => {
      if (m.type === "characterData") bekleyen.add(m.target); else m.addedNodes.forEach(n => bekleyen.add(n)); });
    if (!plan) plan = requestAnimationFrame(calis); });
  const bas = () => { donustur(document.body); gozcu.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bas); else bas();
  const st = document.createElement("style");
  st.textContent = ".frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}.frac>span{display:block;text-align:center;padding:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor}";
  document.head.appendChild(st);
})();

/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {

    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });

    async function dagit(k) {

      const kolon = Math.min(k, 6), satirK = Math.ceil(k / kolon), gw = kolon * 14 + 16, gh = satirK * 14 + 26;

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */
  function ATLA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Sonuç"] });
    let k = o.k, L = o.son; const W = 660, sol = 22, sag = 22, sk = (W - sol - sag) / L;

    const bA = dug("▶ Oynat"), bB = dug("+1 " + (o.adimAd || "adım"), "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bB, bS);
    let kA = null;
    if (o.kSec) { kA = adimci(o.kEtiket || "Adım:", 2, Math.floor(L / 2), k, v => { k = v; sifirla(); }); kut.prepend(kA.w); }

    const bT = dug(o.testDugme || "Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test);
    const ti = test.querySelector("input");
    function taban() {
      let sv = `<line x1="${sol}" y1="62" x2="${sol + L * sk}" y2="62" class="cn-ek"/>`;

      for (let v = 0; v <= L; v += adimT) sv += `<line x1="${sol + v * sk}" y1="${v % et ? 58 : 54}" x2="${sol + v * sk}" y2="66" class="cn-ek"/>` + (v % et ? "" : `<text x="${sol + v * sk}" y="82" text-anchor="middle" class="cn-et">${o.etYaz ? o.etYaz(v) : v}</text>`);
      sv += `<line x1="${sol + L * sk}" y1="30" x2="${sol + L * sk}" y2="70" class="cn-sinir"/><text x="${sol + L * sk}" y="24" text-anchor="end" class="cn-et">${o.sonEt || L}</text>`;

    }

      izle.forEach((v, i) => {

        sv += `<path d="M${x1} 62 Q${(x1 + x2) / 2} ${yy} ${x2} 62" class="cn-yay"/><circle cx="${x2}" cy="62" r="4.5" class="${o.renk ? o.renk(v, i + 1) : "cn-o"}"/>`;
        if (izle.length <= 14 || i === izle.length - 1 || i % Math.ceil(izle.length / 10) === 0) sv += `<text x="${x2}" y="${98}" text-anchor="middle" class="cn-et2">${v}</text>`;
      });

      const son = izle.length ? izle[izle.length - 1] : 0, ix = sol + son * sk;
      sv += `<text x="${ix}" y="50" text-anchor="middle" class="cn-kis">${o.simge || "●"}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W} 104" role="img" aria-label="${k} birimlik adımlarla ilerleme">${sv}</svg>`;
    }
    const ileri = () => {
      const v = (n + 1) * k;
      if (v > L) { durdur(); s.dur.innerHTML = `<span class="kotu">■</span> Sonraki ${o.adimAd || "adım"} ${k} ${x} ${n + 1} = <b>${v}</b> olurdu; bu ${E(L,"den")} büyük. ${o.bitti ? o.bitti(n, k, L) : `Toplam ${n} ${o.adimAd || "adım"}; son değer ${n * k}.`}`; if (!izle.length) ciz(); return false; }
      n++; izle.push(v); ciz(); s.dur.innerHTML = o.durum ? o.durum(n, v, k) : `${n}. ${o.adimAd || "adım"}: ${k} ${x} ${n} = <b>${v}</b>`; return true;

      s.dur.innerHTML = m; s.yaz("t" + v, [v, r === 0 ? (ic ? `${k} ${x} ${b} ✔` : `${k} ${x} ${b} (sınır dışı)`) : `kalan ${r} ✘`], r === 0 && ic);

  }

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || [o.kAd || "k", "Boyanan", "En büyük"] });
    let k = o.k || 2, son = o.son;
    const kut = h("div", "cn-satir");

    if (o.sonSec) { const sw = h("div", "cn-hazir"); o.sonSec.forEach(v => { const b = dug(v + " gün", "ghost"); b.onclick = () => { son = v; kur(); temiz(); }; sw.appendChild(b); }); s.den.append(kut, sw); }

      const g = h("div", "cn-izg" + (o.takvim ? " cn-tak" : "")); g.style.gridTemplateColumns = `repeat(${o.sutunSay},1fr)`;

    function temiz() { hucre.forEach(c => c && c.classList.remove("on", "yeni")); s.dur.innerHTML = o.ilk || "Sayıyı seçip Boya düğmesine basın."; }

      }

      s.yaz(k + ":" + son, o.satir ? o.satir(k, say, enb, son) : [k, say, enb], o.iyi ? o.iyi(k, say, enb, son) : null);
      calis = false; bB.disabled = false;

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */
  function ASANSOR(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Açık asansörler", "Gidilen kat", "Gidilemeyen kat"] });
    const ac = o.asansor.map(() => false);
    const kut = h("div", "cn-satir"); const bt = o.asansor.map((a, i) => { const b = dug(a.ad, "ghost"); b.style.setProperty("--ac", a.renk); b.setAttribute("aria-pressed", "false"); b.onclick = () => { ac[i] = !ac[i]; b.setAttribute("aria-pressed", ac[i]); ciz(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    function ciz() {
      let sv = ""; const H = o.kat * 17 + 40; let git = 0, gitme = [];
      for (let f = o.kat; f >= 0; f--) {

        sv += `<rect x="60" y="${y}" width="150" height="15" rx="2" class="${f === 0 ? "cn-zem" : herhangi ? "cn-katon" : (ac.some(Boolean) ? "cn-katoff" : "cn-kat")}"/><text x="52" y="${y + 12}" text-anchor="end" class="cn-et">${f === 0 ? "Z" : f}</text>`;
        o.asansor.forEach((a, i) => { if (dur[i]) sv += `<circle cx="${230 + i * 22}" cy="${y + 7.5}" r="6" fill="${a.renk}"/>`; });
      }
      s.sah.innerHTML = `<svg viewBox="0 0 300 ${H}" style="max-height:440px" role="img" aria-label="${o.kat} katlı bina">${sv}</svg>`;
      const acik = o.asansor.filter((a, i) => ac[i]).map(a => a.ad);

      s.yaz(acik.join("+"), [acik.join(" + "), git, gitme.length], null);

    ciz();
  }

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */
  function SAAT(el, o) {

      let onc = null, snr = null;
      for (let m = bas; m <= bit + ara; m += ara) { if (m <= var_) onc = m; if (m >= var_ && snr == null) snr = m; if (m <= bit) sv += `<text x="${20 + (m - bas) * sk}" y="40" text-anchor="middle" class="cn-bus">🚌</text>`; }

      if (snr != null && snr <= bit + ara) { const sx = 20 + (Math.min(snr, bit) - bas) * sk; sv += `<path d="M${vx} 56 L${sx} 56" class="cn-bek"/>`; }

      const gec = var_ - bas;
      s.dur.innerHTML = `${o.kisi} durağa ${saDa(var_)} geliyor: ilk seferden <b>${gec} dakika</b> sonra. Seferler ${E(ara,"in")} katı olan dakikalarda: ${ara} ${x} ${Math.floor(gec / ara)} = ${Math.floor(gec / ara) * ara}` + (gec % ara ? `, ${ara} ${x} ${Math.floor(gec / ara) + 1} = ${(Math.floor(gec / ara) + 1) * ara}. Sonraki otobüs ${saDa(snr)}; bekleme <b>${snr - var_} dakika</b>.` : `. Tam sefer saatinde geldi; bekleme <b>0 dakika</b>.`);
      s.yaz(ara + ":" + var_, [ara + " dk", sa(var_), sa(onc), sa(snr), (snr - var_) + " dk"], null);
    }
    ciz();
  }

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Çarpanlar", "Çarpan sayısı"] });
    let N = o.N || o.hazir[0]; let bul = new Set(), denendi = new Set();
    const kut = h("div", "cn-satir");
    const sA = adimci("Sayı:", 2, o.max || 200, N, v => { N = v; yeni(); });
    kut.appendChild(sA.w);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => sA.ayarla(n); hz.appendChild(b); }); kut.appendChild(hz); }
    s.den.appendChild(kut);
    const bolen = h("div", "cn-satir cn-test"); bolen.innerHTML = `<label>Bölen deneyin: <input type="number" inputmode="numeric" min="1"></label>`;
    const bD = dug("Böl"), bS = dug("Sıradakini dene", "ghost"); bolen.append(bD, bS); s.den.appendChild(bolen);
    const bi = bolen.querySelector("input");
    let bK = null; if (o.katlar) { bK = dug(o.katDugme || "Katlarını say ▶", "ghost"); s.den.appendChild(bK); }
    const ciftler = h("div", "cn-cift"); const katlar = h("div", "cn-katlar");
    function yeni() { bul = new Set(); denendi = new Set(); ciz(); s.dur.innerHTML = `${N} sayısını 1, 2, 3, … sayılarına bölerek çarpan çiftlerini bulun.`; katlar.textContent = ""; }
    function ciz() {
      const L = [...bul].sort((a, b) => a - b);
      s.sah.innerHTML = ""; const kartlar = h("div", "cn-kartlar");
      L.forEach(v => kartlar.appendChild(h("span", "cn-kart" + (v * v === N ? " kare" : ""), v)));
      if (!L.length) kartlar.appendChild(h("span", "cn-bosk", "Henüz çarpan bulunmadı"));
      s.sah.append(kartlar, ciftler, katlar);
      ciftler.innerHTML = L.filter(v => v * v <= N).map(v => `<span>${v} ${x} ${N / v}${v * v === N ? " <i>(aynı sayı: bir kez yazılır)</i>" : ""}</span>`).join("");
    }
    const tamamMi = () => { for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) return false; return true; };
    const eksik = () => { const L = []; for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) L.push(i); return ` <br>Henüz denenmeyen küçük bölenler var: <b>${L.join(", ")}</b>. Bunları da deneyin.`; };
    function dene(d) {
      if (!d || d < 1) return; denendi.add(d);
      const b = Math.floor(N / d), r = N % d;
      if (d > N) { s.dur.innerHTML = `${d} > ${N}: ${E(N,"den")} büyük sayı ${E(N,"in")} çarpanı olamaz.`; return; }
      if (r === 0) { bul.add(d); bul.add(b); ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${N} : ${d} = ${b}, kalan 0 → <b>${d} ${x} ${b} = ${N}</b>. ${d} ve ${b} çarpandır.` + (d * d >= N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} ${d * d === N ? "=" : ">"} ${N}. Artık yeni çift çıkmaz; bütün çarpanlar bulundu.` : eksik() : ""); }
      else { s.dur.innerHTML = `<span class="kotu">✘</span> ${N} : ${d} işleminde bölüm ${b}, <b>kalan ${r}</b>. ${d}, ${E(N,"in")} çarpanı değildir.` + (d * d > N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} > ${N}. Daha büyük bölen denemeye gerek yok; çarpan listesi tamam.` : eksik() : ""); }
      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));
      if (tamam) s.yaz("n" + N, [N, [...bul].sort((a, b) => a - b).join(", "), bul.size], true);
    }
    bD.onclick = () => dene(Math.round(+bi.value));
    bS.onclick = () => { let d = 1; while (denendi.has(d)) d++; bi.value = d; dene(d); };
    if (bK) bK.onclick = async () => {
      bK.disabled = true; katlar.textContent = ""; const sat = h("div", "cn-katsat"); katlar.append(h("b", "", `${E(N,"in")} katları: `), sat);
      for (let i = 1; i <= (o.katSay || 12); i++) { sat.appendChild(h("span", "cn-kat2", `${N * i}`)); await bekle(220); }
      sat.appendChild(h("span", "cn-sonsuz", "… ve sonsuza kadar sürer"));

  }

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */
  function KUMBARA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Para", "Sonuç"] });
    const k = o.k; let hafta = 0, tmr = null;
    const kut = h("div", "cn-satir"); const bA = dug("Bir hafta geçsin +"), bO = dug("▶ Haftaları oynat", "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bO, bS); s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Kumbarada şu para olabilir mi? <input type="number" inputmode="numeric" min="1" max="500"> TL</label>`;
    const bT = dug("Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test); const ti = test.querySelector("input");
    function ciz() {
      const top = hafta * k, sv = [];
      const yuk = Math.min(150, top * 1.4);
      sv.push(`<rect x="110" y="20" width="120" height="160" rx="22" class="cn-kum"/><rect x="150" y="14" width="40" height="8" rx="3" class="cn-kum2"/>`);
      sv.push(`<rect x="116" y="${176 - yuk}" width="108" height="${yuk}" rx="10" class="cn-para"/>`);
      sv.push(`<text x="170" y="110" text-anchor="middle" class="cn-buyuk">${top} TL</text><text x="170" y="134" text-anchor="middle" class="cn-et">${hafta}. hafta</text>`);
      let cizgi = ""; for (let i = 1; i <= hafta && i <= 16; i++) cizgi += `<text x="${260 + ((i - 1) % 4) * 52}" y="${40 + Math.floor((i - 1) / 4) * 34}" class="cn-et2">${k}${x}${i}=${k * i}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 480 190" role="img" aria-label="Kumbara">${sv.join("")}${cizgi}</svg>`;
      s.dur.innerHTML = hafta ? `${hafta}. hafta sonunda kumbarada ${k} ${x} ${hafta} = <b>${top} TL</b> var.` : `Kumbara boş. Her hafta ${k} TL atılıyor.`;
    }
    bA.onclick = () => { hafta++; ciz(); };
    bO.onclick = () => { if (tmr) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } bO.textContent = "❚❚ Durdur"; tmr = setInterval(() => { if (hafta >= 15) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } hafta++; ciz(); }, az ? 50 : 500); };
    bS.onclick = () => { hafta = 0; ciz(); };
    bT.onclick = () => {
      const v = Math.round(+ti.value); if (!v) return; const b = Math.floor(v / k), r = v % k;
      s.dur.innerHTML = r ? `<span class="kotu">✘</span> ${k} ${x} ${b} = ${k * b} TL, ${k} ${x} ${b + 1} = ${k * (b + 1)} TL. ${v} TL arada kalır (${v} : ${k} → kalan ${r}). Kumbarada hiçbir hafta ${v} TL olmaz.`
        : `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · ${b}. hafta sonunda kumbarada tam ${v} TL olur.`;
      if (!r) { hafta = b; ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · <b>${b}. hafta</b> sonunda kumbarada tam ${v} TL olur.`; }
      s.yaz("t" + v, [v + " TL", r ? `kalan ${r} ✘` : `${k} ${x} ${b} ✔`], !r);
    };
    ciz();
  }

  /* 9) ÖNERME LABORATUVARI: önermeyi farklı sayılarla sınama */
  function ONERME(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Önerme", "Sayı", "Sonuç"] });
    let akt = 0; const kut = h("div", "cn-hazir");
    const bt = o.onermeler.map((on, i) => { const b = dug(on.ad, "ghost"); b.setAttribute("aria-pressed", i === 0); b.onclick = () => { akt = i; bt.forEach((x, j) => x.setAttribute("aria-pressed", j === i)); goster(); }; kut.appendChild(b); return b; });

    const bT = dug("Sına"), bR = dug("Rastgele sayı", "ghost"); test.append(bT, bR); s.den.appendChild(test); const ti = test.querySelector("input");
    function goster() { s.sah.innerHTML = `<div class="cn-onr"><b>${o.onermeler[akt].ad}:</b> “${o.onermeler[akt].metin}”</div>`; s.dur.innerHTML = "Bir sayı yazıp Sına düğmesine basın. Önerme her sayıda doğru mu?"; }
    function sina(n) {
      const on = o.onermeler[akt], r = on.sina(n);
      s.sah.innerHTML = `<div class="cn-onr"><b>${on.ad}:</b> “${on.metin}”</div><div class="cn-kanit">${r.goster}</div>`;
      s.dur.innerHTML = (r.ok ? `<span class="iyi">✔</span> ${n} için önerme doğru.` : `<span class="kotu">✘</span> ${n} için önerme yanlış! Bir karşı örnek bulundu.`) + (r.not ? " " + r.not : "");

  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →
     koşullar tek tek denetlenir (✔/✘) → deney defterine yazılır. Doğru cevap verilmez; öğrenci uygun girdiyi kendisi arar.
     o.girdi: [{ad, min, max, bas} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → SVG/HTML · o.kosullar: [{ad, f(v) → bool | {ok, not}}]
     o.dugme: düğme yazısı (false → her değişiklikte denetlenir) · o.sonuc(v, hepsi, L) · o.satir(v, hepsi, L) · o.iyi(v, L) · o.ek: [{ad, deger(v) → v}] */
  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);
      s.dur.innerHTML = m;
      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);
    }
    kur = true; ciz();
    if (bS) s.dur.innerHTML = o.ilk || "Değerleri seçip Sına düğmesine basın."; else sina();
  }

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

/* SORU BANKASI · MAT.7.3.2 · Orta Dikme ve Açıortay İnşası — yeni nesil soruların "Canlandır" düzenekleri (14.10.2026) — ortak motor: canlandir.js (CN.KOSUL); yeni motor yok.
   Her düzenek: öğrenci seçim düğmeleri ya da − / + sayaçlarıyla durumu değiştirir → sahne anında çizilir → koşullar denetlenir →
   deneme deney defterine yazılır → yeniden dener. Doğru cevap bir düğmeyle verilmez; denemelerden çıkar (§4.k, §19-10).
   Geometri yardımcıları canlandir_732.js'teki gibi bu dosyada ayrıca yazıldı (canlandir_732.js de window.CANL tanımladığı için gömülmez). */
window.CANL = (() => {
  if (!document.getElementById("csb732-stil")) { const st = document.createElement("style"); st.id = "csb732-stil";
    st.textContent = ".cn-btn{min-width:44px;min-height:44px}.cn-adimci button{min-width:44px;min-height:44px}.cn-secg button{min-height:44px}.csb732-k{text-align:center;font-size:17px;font-weight:800;margin:8px auto;max-width:640px;line-height:1.6}"; document.head.appendChild(st); }
  const D = (v, n = 1) => String(Math.round(v * 10 ** n) / 10 ** n).replace(".", ",");
  const yon = (a, r = 1) => [r * Math.cos(a * Math.PI / 180), -r * Math.sin(a * Math.PI / 180)];
  const ek = (P, v, k = 1) => [P[0] + k * v[0], P[1] + k * v[1]];
  const uz = (P, Q) => Math.hypot(Q[0] - P[0], Q[1] - P[1]);
  const kes = (C1, r1, C2, r2) => { const d = uz(C1, C2); if (d > r1 + r2 || d < Math.abs(r1 - r2)) return []; const a = (r1 * r1 - r2 * r2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, r1 * r1 - a * a)), ex = (C2[0] - C1[0]) / d, ey = (C2[1] - C1[1]) / d, M = [C1[0] + a * ex, C1[1] + a * ey]; return h < .5 ? [M] : [[M[0] - h * ey, M[1] + h * ex], [M[0] + h * ey, M[1] - h * ex]]; };
  const svg = (w, h, ic, ad) => `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${Math.round(w * 1.3)}px;height:auto;display:block;margin:0 auto" role="img" aria-label="${ad || "Çizim"}">${ic}</svg>`;
  const tx = (x, y, s, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.an || "middle"}" style="font-size:${o.fs || 14}px;font-weight:800;fill:${o.r || "#1d2433"};paint-order:stroke;stroke:#fff;stroke-width:4px">${s}</text>`;
  const dp = (P, Q, r = "#1d2433", w = 2.6, k = "") => `<line x1="${P[0]}" y1="${P[1]}" x2="${Q[0]}" y2="${Q[1]}" stroke="${r}" stroke-width="${w}" stroke-linecap="round"${k ? ` stroke-dasharray="${k}"` : ""}/>`;
  const isin = (O, a, L, r, w, k) => dp(O, ek(O, yon(a, L)), r, w, k);
  const cem = (C, r, renk = "#7048e8") => `<circle cx="${C[0]}" cy="${C[1]}" r="${r}" fill="none" stroke="${renk}" stroke-width="1.6" stroke-dasharray="6 5"/>`;
  const nok = (P, ad, a = 90, r = "#1d2433") => `<circle cx="${P[0]}" cy="${P[1]}" r="5" fill="${r}"/>` + (ad ? tx(...ek(P, yon(a, 18)).map((v, i) => v + (i ? 5 : 0)), ad, { r }) : "");
  const yay = (C, r, a0, a1, renk = "#e8590c", w = 2.4) => { const P0 = ek(C, yon(a0, r)), P1 = ek(C, yon(a1, r)); return `<path d="M${P0} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 0 ${P1}" fill="none" stroke="${renk}" stroke-width="${w}"/>`; };
  const dilim = (O, r, a0, a1, f = "#b2f2bb", s = "#2b8a3e") => `<path d="M${O} L${ek(O, yon(a0, r))} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 0 ${ek(O, yon(a1, r))} Z" fill="${f}" stroke="${s}" stroke-width="2.4"/>`;
  const kutu = h => `<div class="csb732-k">${h}</div>`;
  const KO = (el, o) => CN.KOSUL(el, Object.assign({ dugme: false }, o));
  const sayi = s => +String(s).replace("°", "").replace(" cm", "").replace(",", ".");

  return {
    /* 1 · Geometri yazılımı: hangi araçlar inşa aracıdır? */
    1: el => { const A = [120, 120], B = [300, 120], r = 120, K = kes(A, r, B, r);
      const T = { "Çember": ["inşa", cem(A, r) + cem(B, r)], "Doğru": ["inşa", dp([210, 6], [210, 234], "#2b8a3e", 3)],
        "Uzunluk ölç": ["ölçme", dp(A, B, "#c92a2a", 2) + tx(210, 108, "|AB| = 6,0 birim", { r: "#c92a2a" })],
        "Açı ölç": ["ölçme", yay(A, 40, 0, 90, "#c92a2a") + tx(160, 70, "90°", { r: "#c92a2a" })],
        "Orta nokta": ["ölçme", nok([210, 120], "M (hesaplandı)", 90, "#c92a2a")] };
      return KO(el, { yon: "Araç çubuğundan bir araç seçiniz; aracın ekranda yaptığı iş gösterilir. Pergel ve ölçüsüz cetvelin yerini hangi araçlar tutar?", bitis: "Beş aracı da deneyip inşa araçlarını bulduğunuzda.",
        girdi: [{ ad: "Araç:", sec: Object.keys(T), bas: "Uzunluk ölç" }],
        ciz: v => svg(420, 240, `<rect x="2" y="2" width="416" height="236" rx="10" fill="#fff" stroke="#adb5bd"/>` + T[v[0]][1] + (v[0] === "Doğru" ? K.map(p => nok(p, "", 0, "#7048e8")).join("") : "") + nok(A, "A", 200) + nok(B, "B", -20), "Yazılım ekranı")
          + kutu(`${v[0]}: ${T[v[0]][0] === "inşa" ? "pergel ya da ölçüsüz cetvelin işini yapar" : "ölçme yapar; inşada kullanılmaz"}`),
        kosullar: [{ ad: v => `${v[0]} aracı inşada kullanılabilir.`, f: v => T[v[0]][0] === "inşa" }],
        sutun: ["Araç", "Yaptığı iş", "İnşa aracı mı?"], satir: (v, ok) => [v[0], T[v[0]][0], ok ? "Evet" : "Hayır"] }); },

    /* 2 · Salon: halının kenarında koltuk; A ve B'ye uzaklıklar (m) */
    2: el => { const s = 60, A = [210 - 1.8 * s, 40], B = [210 + 1.8 * s, 40], hy = 40 + 1.735 * s;
      const P = k => [210 + k * .3 * s, hy];
      return KO(el, { yon: "Koltuğu halının kenarı boyunca − / + ile kaydırınız (her adım 30 cm). Koltuğun iki hoparlöre uzaklığı ölçülür.", bitis: "İki hoparlöre eşit uzaklıktaki yeri bulduğunuzda.",
        girdi: [{ ad: "Koltuğun yeri", min: -5, max: 5, bas: 3 }],
        ciz: v => { const p = P(v[0]), a = uz(p, A) / s, b = uz(p, B) / s;
          return svg(420, 170, dp([10, 34], [410, 34], "#495057", 8) + dp([20, hy], [400, hy], "#7048e8", 2, "8 6") + dp([210, 30], [210, 160], "#2b8a3e", 1.6, "4 4") + nok(A, "A", 270) + nok(B, "B", 270)
            + dp(p, A, "#1c5fbf", 1.6, "4 4") + dp(p, B, "#e8590c", 1.6, "4 4") + `<rect x="${p[0] - 14}" y="${hy - 10}" width="28" height="20" rx="5" fill="#ffa94d" stroke="#495057"/>`, "Salon planı")
            + kutu(`A'ya ${D(a, 2)} m · B'ye ${D(b, 2)} m`); },
        kosullar: [{ ad: "Koltuk iki hoparlöre eşit uzaklıkta (yeşil kesik çizgi: AB'nin orta dikmesi).", f: v => v[0] === 0 }],
        sutun: ["Yer", "A'ya", "B'ye", "Eşit mi?"], satir: (v, ok) => { const p = P(v[0]); return [v[0], D(uz(p, A) / s, 2) + " m", D(uz(p, B) / s, 2) + " m", ok ? "Evet" : "Hayır"]; } }); },

    /* 3 · Sahil: yüzücü A'ya hep 140 m; B'ye uzaklık */
    3: el => { const k = 1.1, A = [110, 190], B = [330, 190];
      const P = t => ek(A, yon(t, 140 * k));
      return KO(el, { yon: "Yüzücü A kulesinden hep 140 m uzakta kalacak şekilde yüzüyor. Yerini − / + ile değiştiriniz; B kulesine uzaklığı ve şamandıra çizgisinin hangi tarafında olduğu yazılır.", bitis: "Yüzücü B tarafındayken B'ye uzaklığın 140 m'den az olduğunu birkaç denemede görünce.",
        girdi: [{ ad: "Yüzücünün yeri", min: 20, max: 80, bas: 60 }],
        ciz: v => { const p = P(v[0]), b = uz(p, B) / k;
          return svg(440, 230, `<rect x="2" y="2" width="436" height="160" fill="#d0ebff"/><rect x="2" y="162" width="436" height="66" fill="#ffe8cc"/>` + dp([220, 4], [220, 226], "#ff922b", 3, "3 9") + nok(A, "A kulesi", 270) + nok(B, "B kulesi", 270)
            + dp(p, A, "#1c5fbf", 1.6, "4 4") + dp(p, B, "#e8590c", 1.6, "4 4") + nok(p, "", 0, "#c92a2a"), "Sahil")
            + kutu(`A'ya 140 m · B'ye ${Math.round(b)} m · ${p[0] < 219 ? "A tarafı" : p[0] > 221 ? "B tarafı" : "çizginin üzerinde"}`); },
        kosullar: [{ ad: "Yüzücü B tarafında ve B'ye daha yakın.", f: v => P(v[0])[0] > 221 }],
        sutun: ["Yer", "A'ya", "B'ye", "Taraf"], satir: (v, ok) => { const p = P(v[0]); return [v[0], "140 m", Math.round(uz(p, B) / k) + " m", ok ? "B tarafı" : p[0] < 219 ? "A tarafı" : "çizgi"]; } }); },

    /* 4 · Gemi: orta dikme üzerinde rota */
    4: el => { const s = 34, A = [210 - 3 * s, 120], B = [210 + 3 * s, 120], P = t => [210, 120 - t * 25];
      return KO(el, { yon: "Gemiyi rotası üzerinde − / + ile ilerletiniz. Geminin iki fenere uzaklığı (km) her konumda ölçülür.", bitis: "Rota üzerinde en az dört konumu deneyince.",
        girdi: [{ ad: "Geminin konumu", min: -4, max: 4, bas: 3 }],
        ciz: v => { const p = P(v[0]), a = uz(p, A) / s, b = uz(p, B) / s;
          return svg(420, 240, `<rect x="2" y="2" width="416" height="236" rx="10" fill="#d0ebff"/>` + dp(A, B, "#495057", 1.6, "5 4") + dp([210, 6], [210, 234], "#2b8a3e", 2, "8 6") + nok(A, "A feneri", 270) + nok(B, "B feneri", 270) + nok([210, 120], "M", 225, "#495057")
            + dp(p, A, "#1c5fbf", 1.6, "4 4") + dp(p, B, "#e8590c", 1.6, "4 4") + `<path d="M${p[0] - 16} ${p[1]} L${p[0] + 16} ${p[1]} L${p[0] + 10} ${p[1] + 10} L${p[0] - 10} ${p[1] + 10} Z" fill="#495057"/>`, "Deniz haritası")
            + kutu(`A'ya ${D(a, 2)} km · B'ye ${D(b, 2)} km · |AM| = 3 km`); },
        kosullar: [{ ad: "Gemi iki fenere eşit uzaklıkta.", f: v => true }, { ad: "Gemi A fenerine 3 km uzaklıkta.", f: v => v[0] === 0 }],
        sutun: ["Konum", "A'ya", "B'ye", "A'ya 3 km mi?"], satir: v => { const p = P(v[0]); return [v[0], D(uz(p, A) / s, 2) + " km", D(uz(p, B) / s, 2) + " km", v[0] === 0 ? "Evet" : "Hayır"]; } }); },

    /* 5 · A4 kâğıdı: katlama yeri */
    5: el => { const Y = ["10,5", "14", "14,85", "15,5", "21"], k = 12;
      return KO(el, { yon: "Katlama izinin sol kısa kenara uzaklığını seçiniz. Sol kenar, katlama izi boyunca katlanınca nereye gelir?", bitis: "İki kısa kenarın tam çakıştığı katlamayı bulunca.",
        girdi: [{ ad: "Katlama izi (cm):", sec: Y, bas: "14" }],
        ciz: v => { const x = sayi(v[0]), yeni = 2 * x, X = c => 30 + c * k;
          return svg(420, 200, `<rect x="${X(0)}" y="30" width="${29.7 * k}" height="${21 * k * .6}" fill="#fff" stroke="#495057" stroke-width="2"/>` + dp([X(x), 20], [X(x), 40 + 21 * k * .6], "#7048e8", 2.4, "6 4")
            + dp([X(yeni), 26], [X(yeni), 34 + 21 * k * .6], "#e8590c", 3) + tx(X(yeni), 190, "sol kenarın yeni yeri", { fs: 13, r: "#e8590c" }) + tx(X(29.7), 190, "sağ kenar", { fs: 13, an: "end" }), "A4 kâğıdı")
            + kutu(`Sol kenar ${D(yeni, 2)} cm'ye gelir · sağ kenar 29,7 cm'de`); },
        kosullar: [{ ad: "İki kısa kenar çakıştı (katlama izi uzun kenarın orta dikmesi).", f: v => Math.abs(2 * sayi(v[0]) - 29.7) < .001 }],
        sutun: ["Katlama izi", "Sol kenarın yeni yeri", "Çakıştı mı?"], satir: (v, ok) => [v[0] + " cm", D(2 * sayi(v[0]), 2) + " cm", ok ? "Evet" : "Hayır"] }); },

    /* 6 · Saat: açıortayın gösterdiği sayı */
    6: el => { const sa = { "4.00": 4, "8.00": 8, "2.00": 2, "10.00": 10 };
      return KO(el, { yon: "Bir saat seçiniz ve açıortayın göstereceğini düşündüğünüz sayıyı − / + ile değiştiriniz. Işının iki yanında kalan aralık sayıları yazılır.", bitis: "4.00 ve 8.00 için açıortayın gösterdiği sayıyı bulunca.",
        girdi: [{ ad: "Saat:", sec: Object.keys(sa), bas: "4.00" }, { ad: "Işının gösterdiği sayı", min: 1, max: 12, bas: 1 }],
        ciz: v => { const O = [130, 120], r = 100, h = sa[v[0]], n = v[1]; let s = `<circle cx="${O[0]}" cy="${O[1]}" r="${r}" fill="#fff" stroke="#495057" stroke-width="3"/>`;
          for (let i = 1; i <= 12; i++) s += tx(...ek(O, yon(90 - 30 * i, r - 18)).map((u, j) => u + (j ? 5 : 0)), i, { fs: 14 });
          s += isin(O, 90 - 30 * h, r * .5, "#1d2433", 6) + isin(O, 90, r * .78, "#1d2433", 3.4) + isin(O, 90 - 30 * n, r - 30, "#2b8a3e", 3, "6 4");
          const kucuk = h <= 6 ? [0, h] : [h, 12], sol = ((n - kucuk[0]) + 12) % 12, sag = ((kucuk[1] - n) + 12) % 12;
          return svg(260, 240, s, "Saat") + kutu(`Saat ${v[0]} · ışın ${n}'i gösteriyor · iki yanında ${sol} ve ${sag} aralık`); },
        kosullar: [{ ad: v => `Işın saat ${v[0]}'teki küçük açıyı iki eş açıya ayırıyor.`, f: v => { const h = sa[v[0]]; return h <= 6 ? v[1] * 2 === h : (v[1] - h) * 2 === 12 - h; } }],
        sutun: ["Saat", "Işın", "Açıortay mı?"], satir: (v, ok) => [v[0], v[1], ok ? "Evet" : "Hayır"] }); },

    /* 7 · Rüzgâr gülü: art arda açıortay */
    7: el => KO(el, { yon: "K ve D yönleri çizildi. Açıortay inşası sayısını − / + ile değiştiriniz; her inşa, K ile son çizilen yön arasındaki açıyı yarılar.", bitis: "KKD yönünü (K ile 22,5°) bulduğunuzda.",
      girdi: [{ ad: "Açıortay inşası sayısı", min: 0, max: 3, bas: 0 }],
      ciz: v => { const O = [150, 150], r = 120; let s = `<circle cx="150" cy="150" r="${r}" fill="#f8f9fa" stroke="#495057"/>` + isin(O, 90, r, "#1d2433", 3) + isin(O, 0, r, "#1d2433", 3) + tx(150, 22, "K") + tx(282, 155, "D");
        let a = 90; for (let i = 1; i <= v[0]; i++) { const b = 90 - 90 / 2 ** i; s += isin(O, b, r - 6, i === v[0] ? "#2b8a3e" : "#adb5bd", i === v[0] ? 3 : 1.6); a = b; }
        return svg(300, 290, s, "Rüzgâr gülü") + kutu(v[0] ? `Son yön ile K arası: <b>${D(90 / 2 ** v[0], 2)}°</b>` : "K ile D arası 90°"); },
      kosullar: [{ ad: "K ile son yön arasındaki açı 22,5°.", f: v => 90 / 2 ** v[0] === 22.5 }],
      sutun: ["İnşa sayısı", "K ile açı"], satir: v => [v[0], D(90 / 2 ** Math.max(v[0], 0), 2) + "°"] }),

    /* 8 · Saksı: açıortay üzerinde kollara uzaklık */
    8: el => { const O = [40, 220], k = 3;
      return KO(el, { yon: "Saksıyı köşedeki açının açıortayı üzerinde − / + ile kaydırınız (1. duvara uzaklığı cm). İki duvara ve köşeye uzaklıklar ölçülür.", bitis: "Saksının 1. duvara uzaklığı 40 cm iken ölçüleri karşılaştırınca.",
        girdi: [{ ad: "1. duvara uzaklık (cm)", min: 20, max: 60, bas: 25 }],
        ciz: v => { const d = v[0], P = [O[0] + d * k, O[1] - d * k];
          return svg(300, 240, `<rect x="30" y="10" width="10" height="220" fill="#ced4da"/><rect x="30" y="220" width="250" height="10" fill="#ced4da"/>` + isin(O, 45, 260, "#7048e8", 1.6, "6 5")
            + dp(P, [O[0], P[1]], "#1c5fbf", 2) + dp(P, [P[0], O[1]], "#e8590c", 2) + dp(P, O, "#adb5bd", 1.4, "3 4") + `<circle cx="${P[0]}" cy="${P[1]}" r="12" fill="#8ce99a" stroke="#2b8a3e"/>`, "Oda köşesi")
            + kutu(`1. duvara ${d} cm · 2. duvara ${d} cm · köşeye ${D(d * Math.SQRT2)} cm`); },
        kosullar: [{ ad: "Saksının 1. duvara uzaklığı 40 cm.", f: v => v[0] === 40 }],
        sutun: ["1. duvara", "2. duvara", "Köşeye"], satir: v => [v[0] + " cm", v[0] + " cm", D(v[0] * Math.SQRT2) + " cm"] }); },

    /* 9 · Çatı makası: direğin yeri */
    9: el => { const A = [30, 200], B = [390, 200], T = [210, 200 - 180 * Math.tan(36 * Math.PI / 180)], ac = (P, Q) => Math.atan2(-(Q[1] - P[1]), Q[0] - P[0]) * 180 / Math.PI;
      return KO(el, { yon: "Direğin tabana oturduğu yeri − / + ile kaydırınız. Direk tepeden tabana iner; tepede iki yanında kalan açılar ölçülür. Tepe açısı 108°'dir.", bitis: "İki açının eşit olduğu yeri bulunca.",
        girdi: [{ ad: "Direğin yeri (orta: 0)", min: -4, max: 4, bas: 2 }],
        ciz: v => { const F = [210 + v[0] * 30, 200], s = ac(T, F), sol = ac(T, A) - s, sag = s - ac(T, B);
          return svg(420, 220, `<polygon points="${A} ${T} ${B}" fill="#fff4e6" stroke="#8a5a2b" stroke-width="6" stroke-linejoin="round"/>` + dp(T, F, "#2b8a3e", 5) + (v[0] === 0 ? `<rect x="210" y="186" width="14" height="14" fill="none" stroke="#1d2433"/>` : ""), "Çatı makası")
            + kutu(`Sol kiriş ile direk: ${D(sol)}° · sağ kiriş ile direk: ${D(sag)}°`); },
        kosullar: [{ ad: "Direk tepe açısını iki eş açıya ayırıyor.", f: v => v[0] === 0 }],
        sutun: ["Yer", "Sol açı", "Sağ açı"], satir: v => { const F = [210 + v[0] * 30, 200], s = ac(T, F); return [v[0], D(ac(T, A) - s) + "°", D(s - ac(T, B)) + "°"]; } }); },

    /* 10 · Fıskiye: yolun açısı */
    10: el => KO(el, { yon: "Yolun dilimin sol kenarıyla yaptığı açıyı seçiniz; iki parçanın açısı ve yolun uzunluğu gösterilir. Sulama açısı 140°, menzil 6 m'dir.", bitis: "Çim alanı iki eş parçaya ayıran yolu bulunca.",
      girdi: [{ ad: "Sol kenarla açı:", sec: ["50°", "60°", "70°", "80°", "90°"], bas: "50°" }],
      ciz: v => { const a = sayi(v[0]), O = [210, 210], r = 180; return svg(420, 230, dilim(O, r, 20, 160) + isin(O, 160 - a, r, "#8a5a2b", 6) + nok(O, "fıskiye", 270), "Çim alanı")
        + kutu(`Parçalar: ${a}° ve ${140 - a}° · yolun uzunluğu 6 m`); },
      kosullar: [{ ad: "Yol çim alanı iki eş parçaya ayırıyor.", f: v => sayi(v[0]) === 70 }],
      sutun: ["Sol parça", "Sağ parça", "Eş mi?"], satir: (v, ok) => [v[0], (140 - sayi(v[0])) + "°", ok ? "Evet" : "Hayır"] }),

    /* 11 · Origami: B'yi C'ye götüren katlama */
    11: el => { const Y = ["5", "6", "7,5", "9", "10"], k = 18, B = [40, 240], Cc = [40 + 15 * k, 240], A = [40 + 7.5 * k, 240 - 15 * k * Math.sqrt(3) / 2];
      return KO(el, { yon: "Katlama izinin BC kenarını kestiği noktanın B'ye uzaklığını seçiniz. Katlama izi A'dan geçer; B köşesi katlanınca nereye gelir?", bitis: "B'nin tam C'nin üzerine geldiği katlamayı bulunca.",
        girdi: [{ ad: "B'ye uzaklık (cm):", sec: Y, bas: "6" }],
        ciz: v => { const x = sayi(v[0]), F = [40 + x * k, 240], ac = (P, Q) => Math.atan2(-(Q[1] - P[1]), Q[0] - P[0]) * 180 / Math.PI;
          const sol = ac(A, B) - ac(A, F), sag = ac(A, F) - ac(A, Cc);
          return svg(380, 270, `<polygon points="${A} ${B} ${Cc}" fill="#d0ebff" stroke="#1d2433" stroke-width="2.4"/>` + dp(A, F, "#7048e8", 2.4, "6 4") + nok(A, "A", 90) + nok(B, "B", 225) + nok(Cc, "C", -45) + nok(F, "", 0, "#7048e8"), "Üçgen kâğıt")
            + kutu(`BAC açısının parçaları: ${D(sol)}° ve ${D(sag)}° · BC'nin parçaları: ${D(x)} cm ve ${D(15 - x)} cm`); },
        kosullar: [{ ad: "B köşesi C köşesinin üzerine geliyor.", f: v => sayi(v[0]) === 7.5 }],
        sutun: ["B'ye uzaklık", "BC parçaları", "Çakıştı mı?"], satir: (v, ok) => [v[0] + " cm", `${v[0]} ve ${D(15 - sayi(v[0]))}`, ok ? "Evet" : "Hayır"] }); },

    /* 12 · Banklar: karşılıklı uçların orta dikmeleri */
    12: el => { const s_ = 28, X = (i, j) => [20 + i * s_, 170 - j * s_], P = { A: [1, 1], B: [3, 4], C: [11, 1], D: [9, 4] };
      const od = (p, q) => { const M = [(X(...P[p])[0] + X(...P[q])[0]) / 2, (X(...P[p])[1] + X(...P[q])[1]) / 2], dx = X(...P[q])[0] - X(...P[p])[0], dy = X(...P[q])[1] - X(...P[p])[1], L = Math.hypot(dx, dy); return [ek(M, [-dy / L, dx / L], 200), ek(M, [-dy / L, dx / L], -200), M, [-dy / L, dx / L]]; };
      const E = { "AC ve BD": ["AC", "BD"], "AD ve BC": ["AD", "BC"], "AB ve CD": ["AB", "CD"] };

lar o noktaları birleştiren doğru parçasının orta dikmesi üzerindedir.", "Koltuk halının kenarı üzerinde de olacağından yeri, AB'nin orta dikmesi ile halının kenarının kesiştiği noktadır.", "Koltuk orta dikme üzerinde olduğundan B'ye uzaklığı da A'ya uzaklığına eşittir: 2,5 m."], "t": "1,8 m, hoparlörler arasındaki uzaklığın yarısıdır; koltuk AB'nin üzerinde değildir.", "d": "İki yere eşit uzaklıktaki noktalar orta dikme üzerindedir. Koltuğun yeri, orta dikme ile halının kenarının kesişim noktasıdır; koltuğun hoparlörlere uzaklığı AB'nin yarısı değildir.", "ses": "b02"}, {"no": 3, "on": "<p>Bir sahilde A ve B cankurtaran kuleleri vardır. Görevliler, kuleleri birleştiren doğru parçasının orta dikmesini kumda ve denizde turuncu şamandıralarla işaretlemiştir. Her yüzücüye, kendisine daha yakın olan kuledeki görevli bakmaktadır.</p>", "g": "<svg viewBox=\"0 0 680 260\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8.0\" y=\"8.0\" width=\"664.0\" height=\"120.0\" rx=\"8\" fill=\"#a5d8ff\" stroke=\"#74c0fc\" stroke-width=\"1\"/><rect x=\"8.0\" y=\"128.0\" width=\"664.0\" height=\"124.0\" rx=\"8\" fill=\"#ffe8cc\" stroke=\"#f2c48d\" stroke-width=\"1\"/><line x1=\"112.0\" y1=\"210.0\" x2=\"122.0\" y2=\"140.0\" stroke=\"#495057\" stroke-width=\"3\"/><line x1=\"148.0\" y1=\"210.0\" x2=\"138.0\" y2=\"140.0\" stroke=\"#495057\" stroke-width=\"3\"/><line x1=\"116.0\" y1=\"180.0\" x2=\"144.0\" y2=\"180.0\" stroke=\"#495057\" stroke-width=\"2\"/><rect x=\"108.0\" y=\"114.0\" width=\"44.0\" height=\"28.0\" rx=\"3\" fill=\"#ffa94d\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M102 114 L130 94 L158 114 Z\" fill=\"#fff4e6\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"130.0\" y=\"232.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A kulesi</text><line x1=\"392.0\" y1=\"210.0\" x2=\"402.0\" y2=\"140.0\" stroke=\"#495057\" stroke-width=\"3\"/><line x1=\"428.0\" y1=\"210.0\ " stroke-width=\"1.2\"/><text x=\"576.0\" y=\"56.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">TELSİZ</text><text x=\"576.0\" y=\"84.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">A'ya 140 m</text></svg>", "son": "<p>Şekildeki yüzücü şamandıra çizgisinin B kulesi tarafındadır. Telsiz ekranında yüzücünün A kulesine uzaklığı görülmektedir.</p>", "k": "Buna göre, yüzücünün B kulesine uzaklığı kaç metre olabilir?", "sec": ["120", "140", "160", "180"], "secg": null, "c": "A", "a": ["Şamandıra çizgisi AB'nin orta dikmesidir; üzerindeki her nokta iki kuleye eşit uzaklıktadır.", "Orta dikmenin B tarafındaki bir nokta B'ye daha yakındır: yüzücünün B'ye uzaklığı 140 m'den azdır.", "Seçeneklerden yalnız 120 m bu koşulu sağlar."], "t": "140: yüzücü çizginin üzerinde olurdu; 160 ve 180: yüzücü A tarafında olurdu.", "d": "Orta dikmenin hangi tarafındaki nokta, o taraftaki uca daha yakındır. Yüzücü B tarafında olduğuna göre B'ye uzaklığı A'ya uzaklığından (140 m) azdır.", "ses": "b03"}, {"no": 4, "on": "<p>Bir gemi gece boyunca A ve B fenerlerine her an eşit uzaklıkta kalacak şekilde düz bir rotada ilerlemiştir. Fenerler arasındaki uzaklık 6 km'dir. Geminin rotası, fenerleri birleştiren doğru parçasını M noktasında kesmektedir.</p>", "g": "<svg viewBox=\"0 0 680 260\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8.0\" y=\"8.0\" width=\"664.0\" height=\"244.0\" rx=\"10\" fill=\"#d0ebff\" stroke=\"#74c0fc\" stroke-width=\"1.2\"/><path d=\"M8 120 Q60 96 150 112 Q190 120 200 150 L8 170 Z\" fill=\"#d8f5a2\" stroke=\"#82c91e\" stroke-width=\"1.4\"/><path d=\"M672 150 Q600 140 520 170 Q500 190 520 252 L672 252 Z\" fill=\"#d8f5a2\" stroke=\"#82c91e\" stroke-width=\"1.4\"/><path d=\"M126 122 L131 62 L149 62 L154 122 Z\" fill=\"#ffffff\" stroke=\"#495057\" stroke-width=\"1.6\"/><rect x=\"131.0\" y=\"78.0\" width= 3 km'dir; rota üzerinde ilerledikçe değişir (III yanlış)."], "t": "Orta dikme üzerindeki noktaların iki fenere uzaklığı birbirine eşittir; bu uzaklık her noktada aynı değildir.", "d": "Orta dikme üzerindeki her nokta iki uca EŞİT uzaklıktadır; ama bu uzaklık her noktada aynı sayı değildir. Gemi yalnız M noktasındayken A'ya 3 km uzaklıktadır.", "ses": "b04"}, {"no": 5, "on": "<p>Bir A4 kâğıdının kenar uzunlukları 29,7 cm ve 21 cm'dir. Defne bu kâğıdı, iki kısa kenarı tam üst üste gelecek şekilde katlamıştır.</p>", "g": "<svg viewBox=\"0 0 527.49 227.8\" width=\"527\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"40.0\" y=\"24.0\" width=\"231.7\" height=\"163.8\" rx=\"2\" fill=\"#ffffff\" stroke=\"#495057\" stroke-width=\"1.8\"/><text x=\"155.8\" y=\"211.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">29,7 cm</text><text x=\"30.0\" y=\"110.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">21 cm</text><line x1=\"301.7\" y1=\"105.9\" x2=\"371.7\" y2=\"105.9\" stroke=\"#111111\" stroke-width=\"2.4\"/><polygon points=\"371.7,105.9 364.4,109.2 364.4,102.6\" fill=\"#111111\"/><rect x=\"391.7\" y=\"24.0\" width=\"115.8\" height=\"163.8\" rx=\"2\" fill=\"#ffffff\" stroke=\"#495057\" stroke-width=\"1.8\"/><rect x=\"397.7\" y=\"30.0\" width=\"109.8\" height=\"151.8\" rx=\"0\" fill=\"#f1f3f5\" stroke=\"none\" stroke-width=\"0\"/><text x=\"449.6\" y=\"211.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">katlanmış</text></svg>", "son": "<p>Kâğıt açıldığında katlama izinin uzun kenarlardan birini kestiği nokta T'dir.</p>", "k": "Buna göre, T noktasının bu uzun kenarın uçlarından birine uzaklığı kaç santimetredir?", "sec": ["10,5", "14,85", "21", "29,7"], "secg": null, "c": "B", "a": ["Kısa kenarlar üst üste gelince uzun kenarın iki ucu çakışır; uçları çakıştıran katlamanın izi uzun kenarın orta dikmesidir.", "Orta dikme uzun kenarı iki eş parçaya ayırır: 29,7 : 2 = 14,85 cm."], "t": "10,5: kısa kenarın yarısı; 21 ve 29,7: kenarların kendisi.", "d": "Uçları çakıştıran katlamanın izi, o kenarın orta dikmesidir. Hangi kenarın ikiye bölündüğüne dikkat edin: kısa kenarlar üst üste gelince uzun kenar ikiye bölünür.", "ses": "b05"}, {"no": 6, "on": "<p>Ela, duvar saatinin akrebi ile yelkovanı arasındaki küçük açının açıortayını düşünmektedir. Bu açıortay saatin merkezinden çıkan bir ışındır. Saatin 4.00 ve 8.00'deki görünümü aşağıda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 620 290\" width=\"620\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><circle cx=\"150.0\" cy=\"130.0\" r=\"110.0\" fill=\"#ffffff\" stroke=\"#495057\" stroke-width=\"3\"/><circle cx=\"150.0\" cy=\"130.0\" r=\"104.0\" fill=\"none\" stroke=\"#dee2e6\" stroke-width=\"1\"/><text x=\"193.0\" y=\"61.5\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">1</text><text x=\"224.5\" y=\"93.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2</text><text x=\"236.0\" y=\"136.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">3</text><text x=\"224.5\" y=\"179.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">4</text><text x=\"193.0\" y=\"210.5\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">5</text><text x=\"150.0\" y=\"222.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">6</text><text x=\"107.0\" y=\"210.5\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">7</text><text x  ve 10", "1 ve 11"], "secg": null, "c": "A", "a": ["Saat 4.00'te yelkovan 12'yi, akrep 4'ü gösterir; aradaki küçük açıda 4 eş aralık vardır. Açıortay bu açıyı 2'şer aralığa ayırır ve 2'yi gösterir.", "Saat 8.00'de küçük açı 8 ile 12 arasındadır (4 aralık). Açıortay 8'den 2 aralık sonraki 10'u gösterir."], "t": "4: 8.00'deki büyük açı alınmış; 8: 4.00'teki büyük açı alınmış; 1 ve 11: aralık sayısı yanlış yarılanmış.", "d": "Saatte iki ibre arasında iki açı oluşur; soruda küçük açı isteniyor. Açıortay, küçük açıdaki aralık sayısını iki eşit parçaya ayırır.", "ses": "b06"}, {"no": 7, "on": "<p>Rüzgâr gülünde kuzey (K) ile doğu (D) yönleri arasındaki açı dik açıdır. Kuzeydoğu (KD) yönü bu dik açının açıortayıdır. Kuzey-kuzeydoğu (KKD) yönü ise K ile KD yönleri arasındaki açının açıortayıdır.</p>", "g": "<svg viewBox=\"0 0 620 270\" width=\"620\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><circle cx=\"150.0\" cy=\"130.0\" r=\"104.0\" fill=\"#f8f9fa\" stroke=\"#495057\" stroke-width=\"2\"/><path d=\"M150 130 L145.8 100.3 L150.0 30.0 Z\" fill=\"#495057\"/><text x=\"150.0\" y=\"14.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">K</text><path d=\"M150 130 L179.7 125.8 L250.0 130.0 Z\" fill=\"#495057\"/><text x=\"272.0\" y=\"136.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">D</text><path d=\"M150 130 L154.2 159.7 L150.0 230.0 Z\" fill=\"#495057\"/><text x=\"150.0\" y=\"258.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">G</text><path d=\"M150 130 L120.3 134.2 L50.0 130.0 Z\" fill=\"#495057\"/><text x=\"28.0\" y=\"136.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"150.0\" cy=\"130.0\" r=\"6.0\" fill=\"#ffffff\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M360 250 L470 190 L580 250 Z\" fill=\"#ffc9c9\" stroke=\"#495057\" stroke-width=\"1.6\"/><line x1=\"470.0\" y1=\"190.0\" x2=\"470.0\" y2=\"70.0\" stroke=\"#495057\" stroke-width=\"3\"/><line x1=\"410.0\" y1=\"110.0\" x2=\"530.0\" y2=\"110.0\" stroke=\"#495057\" stroke-width=\"2\"/><line x1=\"470.0\" y1=\"80.0\" x2=\"470.0\" y2=\"140.0\" stroke=\"#495057\" stroke-width=\"2\"/><path d=\"M420 76 L510 76 L510 64 L532 82 L510 100 L510 88 L420 88 Z\" fill=\"#ffa94d\" stroke=\"#495057\" stroke-width=\"1.2\"/></svg>", "son": "<p>Bir öğrenci, K ve D yönlerini çizdikten sonra rüzgâr gülünü kâğıda yalnız pergel ve ölçüsüz cetvelle tamamlayacaktır.</p>", "k": "Buna göre, KKD yönü ile K yönü arasındaki açı kaç derecedir ve KKD yönü <u>en az</u> kaç açıortay inşasıyla elde edilir?", "sec": ["45° · 1 inşa", "22,5° · 3 inşa", "11,25° · 3 inşa", "22,5° · 2 inşa"], "secg": null, "c": "D", "a": ["K ile D arasındaki dik açının açıortayı inşa edilince KD yönü elde edilir: 90 : 2 = 45° (1. inşa).", "K ile KD arasındaki 45°'lik açının açıortayı inşa edilince KKD yönü elde edilir: 45 : 2 = 22,5° (2. inşa)."], "t": "45°: KD yönüdür; 11,25°: bir kez daha yarılanmış; 3 inşa: dik açının kendisi de açıortayla bulunuyor sanılmış.", "d": "Her açıortay inşası açıyı yarılar: 90° → 45° → 22,5°. K ve D yönleri verildiği için dik açı için ayrıca açıortay inşası yapılmaz.", "ses": "b07"}, {"no": 8, "on": "<p>Bir odanın köşesindeki iki duvar dik açı oluşturmaktadır. Bir saksı, odanın planında köşedeki dik açının açıortayı üzerine yerleştirilmiştir. Mimarın notunda saksının 1. duvara uzaklığı yazmaktadır.</p>", "g": "<svg viewBox=\"0 0 680 262\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"40.0\" y=\"20.0\" width=\"16.0\" height=\"210.0\" rx=\"0\" fill=\"#ced4da\" stroke=\"#495057\" stroke-width=\"1.2\"/><rect x=\"40.0\" y=\"214.0\" width=\"290.0\" height=\"16.0\" rx=\"0\" fill=\"#ced4da\" stroke=\"#495057\" stroke-width=\"1.2\"/><text x=\"185.0\" y=\"252.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2. duvar</text><text x=\"72.0\" y=\"34.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"start\">1. duvar</text><circle cx=\"146.0\" cy=\"108.0\" r=\"22.0\" fill=\"#8ce99a\" stroke=\"#2b8a3e\" stroke-width=\"1.6\"/><circle cx=\"146.0\" cy=\"108.0\" r=\"12.0\" fill=\"#2f9e44\" stroke=\"none\" stroke-width=\"0\"/><rect x=\"380.0\" y=\"50.0\" width=\"280.0\" height=\"100.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"380.0\" y=\"50.0\" width=\"280.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"520.0\" y=\"72.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">MİMARIN NOTU</text><text x=\"520.0\" y=\"103.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Saksının 1. duvara</text><text x=\"520.0\" y=\"129.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">uzaklığı: 40 cm</text></svg>", "son": "<p>Bu durumla ilgili aşağıdaki ifadeler yazılmıştır.<div style=\"margin:1mm 0 1mm 2mm\"><div style=\"margin:.6mm 0\">I. Saksı iki duvara eşit uzaklıktadır.</div><div style=\"margin:.6mm 0\">II. Saksının 2. duvara uzaklığı 40 cm'dir.</div><div style=\"margin:.6mm 0\">III. Saksının odanın köşesine uzaklığı 40 cm'dir.</div></div></p>", "k": "Buna göre, verilen ifadelerden hangileri doğrudur?", "sec": ["Yalnız I", "Yalnız II", "I ve II", "I, II ve III"], "secg": null, "c": "C", "a": ["Açıortay üzerindeki bir noktadan bir kola inen dikmenin açıortaya göre görüntüsü, öbür kola inen dikmedir; iki dikme eşit uzunluktadır (I doğru).", "Saksının 2. duvara uzaklığı da 40 cm'dir (II doğru).", "Bir noktanın duvara uzaklığı dikmenin uzunluğudur; köşeye uzaklık bundan uzundur, 40 cm olamaz (III yanlış)."], "t": "Duvara uzaklık ile köşeye uzaklık karıştırılmamalıdır.", "d": "Bir noktanın duvara uzaklığı, noktadan duvara inen dikmenin uzunluğudur. Açıortay üzerindeki saksı iki duvara eşit uzaklıktadır; köşeye uzaklığı bundan uzundur.", "ses": "b08"}, {"no": 9, "on": "<p>Bir evin çatı makası, eşit uzunluktaki iki eğik kiriş ve yatay bir tabandan oluşan ikizkenar üçgen biçimindedir. Kirişler arasındaki tepe açısı 108°'dir. Ortadaki dikey direk, tabanın orta dikmesi boyunca yerleştirilmiştir.</p>", "g": "<svg viewBox=\"0 0 680 262\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"40,236 340.0,18.0 640,236\" fill=\"#fff4e6\" stroke=\"#8a5a2b\" stroke-width=\"7\" stroke-linejoin=\"round\"/><line x1=\"340.0\" y1=\"24.0\" x2=\"340.0\" y2=\"236.0\" stroke=\"#8a5a2b\" stroke-width=\"6\"/><line x1=\"40.0\" y1=\"246.0\" x2=\"640.0\" y2=\"246.0\" stroke=\"#ced4da\" stroke-width=\"6\"/><path d=\"M307.6 41.5 A40.0 40.0 0 0 0 372.4 41.5\" fill=\"none\" stroke=\"#d9480f\" stroke-width=\"1.6\"/><text x=\"382.0\" y=\"80.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">108°</text><text x=\"150.0\" y=\"196.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">kiriş</text><text x=\"530.0\" y=\"196.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">kiriş</text><text x=\"352.0\" y=\"200.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"start\">orta direk</text></svg>", "son": "", "k": "Buna göre, orta direk ile eğik kirişlerden biri arasındaki açı kaç derecedir?", "sec": ["36", "54", "72", "108"], "secg": null, "c": "B", "a": ["İkizkenar üçgenin simetri doğrusu hem tabanın orta dikmesi hem de tepe açısının açıortayıdır; orta direk bu doğru üzerindedir.", "Açıortay tepe açısını iki eş açıya ayırır: 108 : 2 = 54°."], "t": "36: kirişin tabanla yaptığı açı; 72: 36'nın iki katı; 108: tepe açısının tamamı.", "d": "İkizkenar üçgende tabanın orta dikmesi tepe açısının açıortayıdır. Direk ile kiriş arasındaki açı tepe açısının yarısıdır; kirişin tabanla yaptığı açıyla karıştırmayın.", "ses": "b09"}, {"no": 10, "on": "<p>Bir parkta dönen bir fıskiye, daire dilimi biçimindeki bir çim alanı sulamaktadır. Fıskiyenin etiketinde sulama açısı ve menzili yazmaktadır. Görevli, çim alanı iki eş parçaya ayıran düz bir yürüme yolunu fıskiyeden başlatıp dilimin yayına kadar yapacaktır.</p>", "g": "<svg viewBox=\"0 0 680 266\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><path d=\"M210.0 236.0 L397.9 167.6 A200 200 0 0 0 22.1 167.6 Z\" fill=\"#b2f2bb\" stroke=\"#2b8a3e\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><circle cx=\"210.0\" cy=\"236.0\" r=\"9.0\" fill=\"#74c0fc\" stroke=\"#495057\" stroke-width=\"1.4\"/><rect x=\"440.0\" y=\"60.0\" width=\"220.0\" height=\"100.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"440.0\" y=\"60.0\" width=\"220.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"550.0\" y=\"82.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">FISKİYE</text><text x=\"550.0\" y=\"113.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Sulama açısı: 140°</text><text x=\"550.0\" y=\"139.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Menzil: 6 m</text><text x=\"210.0\" y=\"258.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">fıskiye</text></svg>", "son": "", "k": "Buna göre, yolun dilimin kenarlarından biriyle yaptığı açı ve yolun uzunluğu aşağıdakilerden hangisidir?", "sec": ["70° ve 3 m", "70° ve 6 m", "140° ve 6 m", "35° ve 6 m"], "secg": null, "c": "B", "a": ["Daire diliminin simetri doğrusu merkez açısının açıortayıdır: 140 : 2 = 70°.", "Yol fıskiyeden (merkezden) yayın üzerindeki bir noktaya uzanır; uzunluğu dilimin yarıçapına, yani menzile eşittir: 6 m."], "t": "3 m: yarıçap ikiye bölünmüş; 140°: açının tamamı; 35°: iki kez yarılanmış.", "d": "Daire diliminin simetri doğrusu merkez açısının açıortayıdır. Yol merkezden yaya kadar uzandığı için uzunluğu yarıçapa (menzile) eşittir; yarıya inmez.", "ses": "b10"}, {"no": 11, "on": "<p>Bir origami çalışmasında kenar uzunluğu 15 cm olan eşkenar üçgen biçimindeki ABC kâğıdı, B köşesi C köşesinin tam üzerine gelecek şekilde katlanmıştır. Kâğıt açılınca A köşesinden geçen bir katlama izi oluşmuştur.</p>", "g": "<svg viewBox=\"0 0 620 239.20508075688772\" width=\"620\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"130.0,20.0 30.0,193.2 230.0,193.2\" fill=\"#d0ebff\" stroke=\"#495057\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/><circle cx=\"130.0\" cy=\"20.0\" r=\"0\" fill=\"#111111\"/><text x=\"130.0\" y=\"9.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"30.0\" cy=\"193.2\" r=\"0\" fill=\"#111111\"/><text x=\"16.1\" y=\"206.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"230.0\" cy=\"193.2\" r=\"0\" fill=\"#111111\"/><text x=\"243.9\" y=\"206.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><line x1=\"270.0\" y1=\"110.0\" x2=\"350.0\" y2=\"110.0\" stroke=\"#111111\" stroke-width=\"2.4\"/><polygon points=\"350.0,110.0 342.7,113.3 342.7,106.7\" fill=\"#111111\"/><polygon points=\"440.0,20.0 440.0,193.2 540.0,193.2\" fill=\" (function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
