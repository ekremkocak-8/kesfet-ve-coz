<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* ANA_KURALLAR §4.y-3: Etkinliklerde bütün kesirler kesir çizgisiyle (alt alta pay/payda) gösterilir. Düz yazılmış a/b biçimleri otomatik dönüştürülür. */
(function(){
  if (window.__kesirCizgi) return; window.__kesirCizgi = 1;
  const RX = /(^|[^\w\/.,:%])([−-])?(?:(\d+) )?(\d{1,4})\/(\d{1,4})(?![\w\/.,]\d|\w)/g;
  const ATLA = "script,style,svg,textarea,input,select,code,.ilr,.frac,[data-duz]";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function donustur(kok){
    if (!kok || !kok.nodeType) return;
    if (kok.nodeType === 3) kok = kok.parentElement;
    if (!kok || (kok.closest && kok.closest(ATLA))) return;
    const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      if (!/\d\/\d/.test(t.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = t.parentElement; if (!p || p.closest(ATLA)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const L = []; let t; while ((t = w.nextNode())) L.push(t);
    L.forEach(t => {
      let deg = false;
      const h = esc(t.nodeValue).replace(RX, (m, a, s, tam, p, q) => { deg = true;
        return a + (s ? "−" : "") + (tam ? tam + " " : "") + '<span class="frac"><span>' + p + "</span><span>" + q + "</span></span>"; });
      if (!deg) return;
      const k = document.createElement("span"); k.innerHTML = h; t.replaceWith(...k.childNodes);
    });
  }
  let bekleyen = new Set(), plan = 0;
  const calis = () => { plan = 0; const b = bekleyen; bekleyen = new Set(); b.forEach(donustur); };
  const gozcu = new MutationObserver(ms => { ms.forEach(m => {
      if (m.type === "characterData") bekleyen.add(m.target); else m.addedNodes.forEach(n => bekleyen.add(n)); });
    if (!plan) plan = requestAnimationFrame(calis); });
  const bas = () => { donustur(document.body); gozcu.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bas); else bas();
  const st = document.createElement("style");
  st.textContent = ".frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}.frac>span{display:block;text-align:center;padding:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor}";
  document.head.appendChild(st);
})();

/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {

    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });

    async function dagit(k) {

      const kolon = Math.min(k, 6), satirK = Math.ceil(k / kolon), gw = kolon * 14 + 16, gh = satirK * 14 + 26;

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */
  function ATLA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Sonuç"] });
    let k = o.k, L = o.son; const W = 660, sol = 22, sag = 22, sk = (W - sol - sag) / L;

    const bA = dug("▶ Oynat"), bB = dug("+1 " + (o.adimAd || "adım"), "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bB, bS);
    let kA = null;
    if (o.kSec) { kA = adimci(o.kEtiket || "Adım:", 2, Math.floor(L / 2), k, v => { k = v; sifirla(); }); kut.prepend(kA.w); }

    const bT = dug(o.testDugme || "Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test);
    const ti = test.querySelector("input");
    function taban() {
      let sv = `<line x1="${sol}" y1="62" x2="${sol + L * sk}" y2="62" class="cn-ek"/>`;

      for (let v = 0; v <= L; v += adimT) sv += `<line x1="${sol + v * sk}" y1="${v % et ? 58 : 54}" x2="${sol + v * sk}" y2="66" class="cn-ek"/>` + (v % et ? "" : `<text x="${sol + v * sk}" y="82" text-anchor="middle" class="cn-et">${o.etYaz ? o.etYaz(v) : v}</text>`);
      sv += `<line x1="${sol + L * sk}" y1="30" x2="${sol + L * sk}" y2="70" class="cn-sinir"/><text x="${sol + L * sk}" y="24" text-anchor="end" class="cn-et">${o.sonEt || L}</text>`;

    }

      izle.forEach((v, i) => {

        sv += `<path d="M${x1} 62 Q${(x1 + x2) / 2} ${yy} ${x2} 62" class="cn-yay"/><circle cx="${x2}" cy="62" r="4.5" class="${o.renk ? o.renk(v, i + 1) : "cn-o"}"/>`;
        if (izle.length <= 14 || i === izle.length - 1 || i % Math.ceil(izle.length / 10) === 0) sv += `<text x="${x2}" y="${98}" text-anchor="middle" class="cn-et2">${v}</text>`;
      });

      const son = izle.length ? izle[izle.length - 1] : 0, ix = sol + son * sk;
      sv += `<text x="${ix}" y="50" text-anchor="middle" class="cn-kis">${o.simge || "●"}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W} 104" role="img" aria-label="${k} birimlik adımlarla ilerleme">${sv}</svg>`;
    }
    const ileri = () => {
      const v = (n + 1) * k;
      if (v > L) { durdur(); s.dur.innerHTML = `<span class="kotu">■</span> Sonraki ${o.adimAd || "adım"} ${k} ${x} ${n + 1} = <b>${v}</b> olurdu; bu ${E(L,"den")} büyük. ${o.bitti ? o.bitti(n, k, L) : `Toplam ${n} ${o.adimAd || "adım"}; son değer ${n * k}.`}`; if (!izle.length) ciz(); return false; }
      n++; izle.push(v); ciz(); s.dur.innerHTML = o.durum ? o.durum(n, v, k) : `${n}. ${o.adimAd || "adım"}: ${k} ${x} ${n} = <b>${v}</b>`; return true;

      s.dur.innerHTML = m; s.yaz("t" + v, [v, r === 0 ? (ic ? `${k} ${x} ${b} ✔` : `${k} ${x} ${b} (sınır dışı)`) : `kalan ${r} ✘`], r === 0 && ic);

  }

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || [o.kAd || "k", "Boyanan", "En büyük"] });
    let k = o.k || 2, son = o.son;
    const kut = h("div", "cn-satir");

    if (o.sonSec) { const sw = h("div", "cn-hazir"); o.sonSec.forEach(v => { const b = dug(v + " gün", "ghost"); b.onclick = () => { son = v; kur(); temiz(); }; sw.appendChild(b); }); s.den.append(kut, sw); }

      const g = h("div", "cn-izg" + (o.takvim ? " cn-tak" : "")); g.style.gridTemplateColumns = `repeat(${o.sutunSay},1fr)`;

    function temiz() { hucre.forEach(c => c && c.classList.remove("on", "yeni")); s.dur.innerHTML = o.ilk || "Sayıyı seçip Boya düğmesine basın."; }

      }

      s.yaz(k + ":" + son, o.satir ? o.satir(k, say, enb, son) : [k, say, enb], o.iyi ? o.iyi(k, say, enb, son) : null);
      calis = false; bB.disabled = false;

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */
  function ASANSOR(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Açık asansörler", "Gidilen kat", "Gidilemeyen kat"] });
    const ac = o.asansor.map(() => false);
    const kut = h("div", "cn-satir"); const bt = o.asansor.map((a, i) => { const b = dug(a.ad, "ghost"); b.style.setProperty("--ac", a.renk); b.setAttribute("aria-pressed", "false"); b.onclick = () => { ac[i] = !ac[i]; b.setAttribute("aria-pressed", ac[i]); ciz(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    function ciz() {
      let sv = ""; const H = o.kat * 17 + 40; let git = 0, gitme = [];
      for (let f = o.kat; f >= 0; f--) {

        sv += `<rect x="60" y="${y}" width="150" height="15" rx="2" class="${f === 0 ? "cn-zem" : herhangi ? "cn-katon" : (ac.some(Boolean) ? "cn-katoff" : "cn-kat")}"/><text x="52" y="${y + 12}" text-anchor="end" class="cn-et">${f === 0 ? "Z" : f}</text>`;
        o.asansor.forEach((a, i) => { if (dur[i]) sv += `<circle cx="${230 + i * 22}" cy="${y + 7.5}" r="6" fill="${a.renk}"/>`; });
      }
      s.sah.innerHTML = `<svg viewBox="0 0 300 ${H}" style="max-height:440px" role="img" aria-label="${o.kat} katlı bina">${sv}</svg>`;
      const acik = o.asansor.filter((a, i) => ac[i]).map(a => a.ad);

      s.yaz(acik.join("+"), [acik.join(" + "), git, gitme.length], null);

    ciz();
  }

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */
  function SAAT(el, o) {

      let onc = null, snr = null;
      for (let m = bas; m <= bit + ara; m += ara) { if (m <= var_) onc = m; if (m >= var_ && snr == null) snr = m; if (m <= bit) sv += `<text x="${20 + (m - bas) * sk}" y="40" text-anchor="middle" class="cn-bus">🚌</text>`; }

      if (snr != null && snr <= bit + ara) { const sx = 20 + (Math.min(snr, bit) - bas) * sk; sv += `<path d="M${vx} 56 L${sx} 56" class="cn-bek"/>`; }

      const gec = var_ - bas;
      s.dur.innerHTML = `${o.kisi} durağa ${saDa(var_)} geliyor: ilk seferden <b>${gec} dakika</b> sonra. Seferler ${E(ara,"in")} katı olan dakikalarda: ${ara} ${x} ${Math.floor(gec / ara)} = ${Math.floor(gec / ara) * ara}` + (gec % ara ? `, ${ara} ${x} ${Math.floor(gec / ara) + 1} = ${(Math.floor(gec / ara) + 1) * ara}. Sonraki otobüs ${saDa(snr)}; bekleme <b>${snr - var_} dakika</b>.` : `. Tam sefer saatinde geldi; bekleme <b>0 dakika</b>.`);
      s.yaz(ara + ":" + var_, [ara + " dk", sa(var_), sa(onc), sa(snr), (snr - var_) + " dk"], null);
    }
    ciz();
  }

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Çarpanlar", "Çarpan sayısı"] });
    let N = o.N || o.hazir[0]; let bul = new Set(), denendi = new Set();
    const kut = h("div", "cn-satir");
    const sA = adimci("Sayı:", 2, o.max || 200, N, v => { N = v; yeni(); });
    kut.appendChild(sA.w);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => sA.ayarla(n); hz.appendChild(b); }); kut.appendChild(hz); }
    s.den.appendChild(kut);
    const bolen = h("div", "cn-satir cn-test"); bolen.innerHTML = `<label>Bölen deneyin: <input type="number" inputmode="numeric" min="1"></label>`;
    const bD = dug("Böl"), bS = dug("Sıradakini dene", "ghost"); bolen.append(bD, bS); s.den.appendChild(bolen);
    const bi = bolen.querySelector("input");
    let bK = null; if (o.katlar) { bK = dug(o.katDugme || "Katlarını say ▶", "ghost"); s.den.appendChild(bK); }
    const ciftler = h("div", "cn-cift"); const katlar = h("div", "cn-katlar");
    function yeni() { bul = new Set(); denendi = new Set(); ciz(); s.dur.innerHTML = `${N} sayısını 1, 2, 3, … sayılarına bölerek çarpan çiftlerini bulun.`; katlar.textContent = ""; }
    function ciz() {
      const L = [...bul].sort((a, b) => a - b);
      s.sah.innerHTML = ""; const kartlar = h("div", "cn-kartlar");
      L.forEach(v => kartlar.appendChild(h("span", "cn-kart" + (v * v === N ? " kare" : ""), v)));
      if (!L.length) kartlar.appendChild(h("span", "cn-bosk", "Henüz çarpan bulunmadı"));
      s.sah.append(kartlar, ciftler, katlar);
      ciftler.innerHTML = L.filter(v => v * v <= N).map(v => `<span>${v} ${x} ${N / v}${v * v === N ? " <i>(aynı sayı: bir kez yazılır)</i>" : ""}</span>`).join("");
    }
    const tamamMi = () => { for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) return false; return true; };
    const eksik = () => { const L = []; for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) L.push(i); return ` <br>Henüz denenmeyen küçük bölenler var: <b>${L.join(", ")}</b>. Bunları da deneyin.`; };
    function dene(d) {
      if (!d || d < 1) return; denendi.add(d);
      const b = Math.floor(N / d), r = N % d;
      if (d > N) { s.dur.innerHTML = `${d} > ${N}: ${E(N,"den")} büyük sayı ${E(N,"in")} çarpanı olamaz.`; return; }
      if (r === 0) { bul.add(d); bul.add(b); ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${N} : ${d} = ${b}, kalan 0 → <b>${d} ${x} ${b} = ${N}</b>. ${d} ve ${b} çarpandır.` + (d * d >= N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} ${d * d === N ? "=" : ">"} ${N}. Artık yeni çift çıkmaz; bütün çarpanlar bulundu.` : eksik() : ""); }
      else { s.dur.innerHTML = `<span class="kotu">✘</span> ${N} : ${d} işleminde bölüm ${b}, <b>kalan ${r}</b>. ${d}, ${E(N,"in")} çarpanı değildir.` + (d * d > N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} > ${N}. Daha büyük bölen denemeye gerek yok; çarpan listesi tamam.` : eksik() : ""); }
      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));
      if (tamam) s.yaz("n" + N, [N, [...bul].sort((a, b) => a - b).join(", "), bul.size], true);
    }
    bD.onclick = () => dene(Math.round(+bi.value));
    bS.onclick = () => { let d = 1; while (denendi.has(d)) d++; bi.value = d; dene(d); };
    if (bK) bK.onclick = async () => {
      bK.disabled = true; katlar.textContent = ""; const sat = h("div", "cn-katsat"); katlar.append(h("b", "", `${E(N,"in")} katları: `), sat);
      for (let i = 1; i <= (o.katSay || 12); i++) { sat.appendChild(h("span", "cn-kat2", `${N * i}`)); await bekle(220); }
      sat.appendChild(h("span", "cn-sonsuz", "… ve sonsuza kadar sürer"));

  }

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */
  function KUMBARA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Para", "Sonuç"] });
    const k = o.k; let hafta = 0, tmr = null;
    const kut = h("div", "cn-satir"); const bA = dug("Bir hafta geçsin +"), bO = dug("▶ Haftaları oynat", "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bO, bS); s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Kumbarada şu para olabilir mi? <input type="number" inputmode="numeric" min="1" max="500"> TL</label>`;
    const bT = dug("Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test); const ti = test.querySelector("input");
    function ciz() {
      const top = hafta * k, sv = [];
      const yuk = Math.min(150, top * 1.4);
      sv.push(`<rect x="110" y="20" width="120" height="160" rx="22" class="cn-kum"/><rect x="150" y="14" width="40" height="8" rx="3" class="cn-kum2"/>`);
      sv.push(`<rect x="116" y="${176 - yuk}" width="108" height="${yuk}" rx="10" class="cn-para"/>`);
      sv.push(`<text x="170" y="110" text-anchor="middle" class="cn-buyuk">${top} TL</text><text x="170" y="134" text-anchor="middle" class="cn-et">${hafta}. hafta</text>`);
      let cizgi = ""; for (let i = 1; i <= hafta && i <= 16; i++) cizgi += `<text x="${260 + ((i - 1) % 4) * 52}" y="${40 + Math.floor((i - 1) / 4) * 34}" class="cn-et2">${k}${x}${i}=${k * i}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 480 190" role="img" aria-label="Kumbara">${sv.join("")}${cizgi}</svg>`;
      s.dur.innerHTML = hafta ? `${hafta}. hafta sonunda kumbarada ${k} ${x} ${hafta} = <b>${top} TL</b> var.` : `Kumbara boş. Her hafta ${k} TL atılıyor.`;
    }
    bA.onclick = () => { hafta++; ciz(); };
    bO.onclick = () => { if (tmr) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } bO.textContent = "❚❚ Durdur"; tmr = setInterval(() => { if (hafta >= 15) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } hafta++; ciz(); }, az ? 50 : 500); };
    bS.onclick = () => { hafta = 0; ciz(); };
    bT.onclick = () => {
      const v = Math.round(+ti.value); if (!v) return; const b = Math.floor(v / k), r = v % k;
      s.dur.innerHTML = r ? `<span class="kotu">✘</span> ${k} ${x} ${b} = ${k * b} TL, ${k} ${x} ${b + 1} = ${k * (b + 1)} TL. ${v} TL arada kalır (${v} : ${k} → kalan ${r}). Kumbarada hiçbir hafta ${v} TL olmaz.`
        : `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · ${b}. hafta sonunda kumbarada tam ${v} TL olur.`;
      if (!r) { hafta = b; ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · <b>${b}. hafta</b> sonunda kumbarada tam ${v} TL olur.`; }
      s.yaz("t" + v, [v + " TL", r ? `kalan ${r} ✘` : `${k} ${x} ${b} ✔`], !r);
    };
    ciz();
  }

  /* 9) ÖNERME LABORATUVARI: önermeyi farklı sayılarla sınama */
  function ONERME(el, o) {

    function sina(n) {
      const on = o.onermeler[akt], r = on.sina(n);

  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →
     koşullar tek tek denetlenir (✔/✘) → deney defterine yazılır. Doğru cevap verilmez; öğrenci uygun girdiyi kendisi arar.
     o.girdi: [{ad, min, max, bas} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → SVG/HTML · o.kosullar: [{ad, f(v) → bool | {ok, not}}]
     o.dugme: düğme yazısı (false → her değişiklikte denetlenir) · o.sonuc(v, hepsi, L) · o.satir(v, hepsi, L) · o.iyi(v, L) · o.ek: [{ad, deger(v) → v}] */
  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);
      s.dur.innerHTML = m;
      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);
    }
    kur = true; ciz();
    if (bS) s.dur.innerHTML = o.ilk || "Değerleri seçip Sına düğmesine basın."; else sina();
  }

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

/* SORU BANKASI · MAT.7.1.4 · yeni nesil soruların "Canlandır" düzenekleri (06.10.2026) — ortak motor: canlandir.js (CN.KOSUL).
   Yeni motor yok; bu dosya yalnız 16 düzeneği ve çizim yardımcılarını (kesin rasyonel sayı, ondalık yazım, SVG kesir) kurar.
   §4.k / §19-10: öğrenci düzeneği elle değiştirir (seçim düğmeleri, − / + sayaçları), sonucu anında görür, her deneme deney defterine
   yazılır, yeniden dener; doğru cevap bir düğmeyle verilmez, denemelerden çıkar. Kesirler metinde a/b yazılır, kesir_cizgi.js üst üste çizer;
   SVG içindeki kesirleri sy() kendisi çizer. Ondalık hesaplar tam sayı (yüzde birler) ile yapılır, kayan nokta hatası olmaz. */
window.CANL = (() => {
  if (!document.getElementById("sb714-stil")) { const st = document.createElement("style"); st.id = "sb714-stil"; st.textContent = `
.s714-svg{display:block;width:100%;height:auto;margin:0 auto}
.s714-not{text-align:center;font-size:15px;margin:6px auto 0;max-width:620px;line-height:1.5}
.s714-kutu{text-align:center;font-size:17px;font-weight:800;margin:8px auto;max-width:620px;line-height:1.5}
.cn-secg .cn-btn,.cn-adimci button{min-width:44px;min-height:44px}
`; document.head.appendChild(st); }
  const M = "−";
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const Q = (p, q = 1) => { if (q < 0) { p = -p; q = -q; } const g = gcd(p, q); return [p / g, q / g]; };
  const ek = (a, b) => Q(a[0] * b[1] + b[0] * a[1], a[1] * b[1]), cik = (a, b) => Q(a[0] * b[1] - b[0] * a[1], a[1] * b[1]);
  const kat = (a, b) => Q(a[0] * b[0], a[1] * b[1]), bol = (a, b) => Q(a[0] * b[1], a[1] * b[0]);
  const N = a => a[0] / a[1];
  const T = n => n < 0 ? M + (-n) : String(n);
  /* rasyonel → "−2 7/24" (tam sayılı) */
  const R = a => { const [p, q] = Q(a[0], a[1]); if (q === 1) return T(p); const s = p < 0 ? M : "", m = Math.abs(p);
    return m > q ? `${s}${Math.floor(m / q)} ${m % q}/${q}` : `${s}${m}/${q}`; };

    /* 9 · Hedef oyunu: üç atışın toplamı */
    9: el => { const P = { İç: [5, 2], Orta: [3, 4], Dış: [-2, 3] }, B = Object.keys(P);
      return CN.KOSUL(el, { girdi: [{ ad: "1. atış:", sec: B, bas: "Dış" }, { ad: "2. atış:", sec: B, bas: "Dış" }, { ad: "3. atış:", sec: B, bas: "Dış" }], dugme: false,
        ciz: v => { const t = v.reduce((s, x) => ek(s, P[x]), [0, 1]); let g = "";
          [[92, "#e7f5ff"], [62, "#d0bfff"], [32, "#ffd8a8"]].forEach(([r, f]) => { g += `<circle cx="120" cy="104" r="${r}" fill="${f}" stroke="#495057" stroke-width="1.6"/>`; });
          const yer = { İç: [[120, 104], [108, 112], [132, 96]], Orta: [[120, 58], [168, 120], [72, 120]], Dış: [[120, 22], [200, 104], [40, 104]] };
          v.forEach((x, i) => { const [cx, cy] = yer[x][i]; g += `<circle cx="${cx}" cy="${cy}" r="7" fill="#c92a2a" stroke="#fff" stroke-width="2"/>` + txt(cx, cy + 4, i + 1, 10, "middle", "#fff"); });
          g += txt(330, 54, "İç:", 14, "start") + sy(420, 54, "2 1/2", { fs: 14 }) + txt(330, 104, "Orta:", 14, "start") + sy(420, 104, "3/4", { fs: 14 }) + txt(330, 154, "Dış:", 14, "start") + sy(420, 154, `${M}2/3`, { fs: 14 });
          return svg(520, 210, g, "Hedef tahtası") + kutu(`${v.map(x => RP(P[x])).join(" + ")} = <b>${R(t)}</b>`) + not(`On ikide birler cinsinden: ${v.map(x => { const n = Math.round(N(P[x]) * 12); return n < 0 ? `(${T(n)})` : T(n); }).join(" + ")} = ${T(Math.round(N(t) * 12))} on ikide bir`); },
        kosullar: [{ ad: "Toplam puan 1 oldu mu?", f: v => { const t = v.reduce((s, x) => ek(s, P[x]), [0, 1]); return t[0] === 1 && t[1] === 1; } }],
        sutun: ["Atışlar", "Toplam puan"], satir: v => [[...v].sort().join(", "), R(v.reduce((s, x) => ek(s, P[x]), [0, 1]))], iyi: () => null,
        yon: "Üç atışın her biri için bölge seçin. Toplam puan kesirle ve on ikide birler cinsinden hesaplanır. Farklı atış üçlülerini deneyin; elde ettiğiniz puanlar deftere yazılır. Hangi puanların hiç çıkmadığına dikkat edin.",
        bitis: "On farklı üçlünün hepsini (sıra önemsiz) denediğinizde." }); },

    /* 10 · Pizzalar: kalan miktarları toplama */
    10: el => { const PZ = [["Ali", 6, 4], ["Bora", 8, 5], ["Cem", 12, 7]];
      return CN.KOSUL(el, { girdi: [{ ad: "Hesaba katılan pizza sayısı:", min: 1, max: 3, bas: 1 }], dugme: false,
        ciz: v => { const k = v[0]; let g = "", top = [0, 1];
          PZ.forEach(([ad, n, y], i) => { const cx = 90 + i * 170, cy = 80, r = 62, aktif = i < k;
            for (let j = 0; j < n; j++) { const a1 = 2 * Math.PI * j / n - Math.PI / 2, a2 = 2 * Math.PI * (j + 1) / n - Math.PI / 2, dol = j >= y;
              g += `<path d="M${cx} ${cy} L${(cx + r * Math.cos(a1)).toFixed(1)} ${(cy + r * Math.sin(a1)).toFixed(1)} A${r} ${r} 0 0 1 ${(cx + r * Math.cos(a2)).toFixed(1)} ${(cy + r * Math.sin(a2)).toFixed(1)} Z" fill="${dol ? (aktif ? "#ffa94d" : "#ffe8cc") : "#fff"}" stroke="#495057" stroke-width="1.2"${dol ? "" : ' stroke-dasharray="4 3"'}/>`; }
            g += sy(cx, cy + r + 34, `${n - y}/${n}`, { fs: 14 }) + txt(cx, cy + r + 62, ad, 13, "middle", "#5b6478", 700);
            if (aktif) top = ek(top, [n - y, n]); });
          return svg(520, 214, g, "Pizzalar") + kutu(`Kalan: ${PZ.slice(0, k).map(([, n, y]) => `${n - y}/${n}`).join(" + ")} = <b>${R(top)}</b> pizza`); },
        kosullar: [{ ad: "Üç pizza da hesaba katıldı.", f: v => v[0] === 3 }],
        sutun: ["Pizza sayısı", "Kalan pizza"], satir: v => { let t = [0, 1]; PZ.slice(0, v[0]).forEach(([, n, y]) => t = ek(t, [n - y, n])); return [v[0], R(t)]; }, iyi: () => null,
        yon: "+ düğmesiyle pizzaları sırayla hesaba katın. Turuncu dilimler kalan dilimlerdir; her pizzadan kalan miktar kesirle yazılır ve toplanır. Sonuçları deftere yazın.",
        bitis: "Üç pizzayı da hesaba katıp sonucu deftere yazdığınızda." }); },

    /* 11 · Bina ve merdiven basamakları */
    11: el => CN.KOSUL(el, { girdi: [{ ad: "Merdivenle çıkılan kat sayısı:", min: 0, max: 7, bas: 0 }], dugme: false,
      ciz: v => { const k = v[0], kat_ = -2 + k; let g = ""; const h = 24;
        for (let i = 0; i < 8; i++) { const no = 5 - i, y = 10 + i * h; g += rect(170, y, 180, h, no < 0 ? "#f1f3f5" : "#fff") + txt(160, y + 17, T(no), 13, "end"); if (no === kat_) g += `<circle cx="300" cy="${y + 12}" r="8" fill="#e8590c"/>`; }
        g += `<line x1="140" y1="${10 + 6 * h}" x2="380" y2="${10 + 6 * h}" stroke="#2b8a3e" stroke-width="2.4"/>` + txt(386, 10 + 6 * h + 5, "giriş katı", 12, "start", "#2b8a3e", 700);
        g += rect(400, 20, 130, 90, "#fffdf5", "#495057", 8) + txt(465, 44, "1 kat =", 13) + txt(465, 70, "280 : 17,5", 14) + txt(465, 96, "= 16 basamak", 14);
        return svg(540, 214, g, "Bina kesiti") + kutu(`Ece ${T(kat_)}. katta · çıkılan basamak: ${k} · 16 = <b>${k * 16}</b>`); },
      kosullar: [{ ad: "Ece 5. kata ulaştı mı?", f: v => v[0] === 7 }],
      sutun: ["Çıkılan kat", "Bulunulan kat", "Basamak sayısı"], satir: v => [v[0], T(-2 + v[0]), v[0] * 16], iyi: v => v[0] === 7 ? true : null,
      yon: "+ düğmesiyle Ece'yi kat kat yukarı çıkarın. Bir kattan ötekine 280 cm : 17 1/2 cm = 16 basamak vardır. Ece'nin bulunduğu katı ve çıktığı basamak sayısını deftere yazın.",
      bitis: "Ece 5. kata ulaştığında ve basamak sayısını deftere yazdığınızda." }),

    /* 12 · Dara: tencerenin kütlesini deneyerek bulma */
    12: el => CN.KOSUL(el, { girdi: [{ ad: "Tencerenin kütlesi tahmini (g):", min: 500, max: 2000, bas: 1000 }], dugme: false,
      ciz: v => { const g_ = v[0], ekran = g_ - 280; let g = "";
        g += rect(40, 120, 240, 46, "#dee2e6", "#495057", 8) + rect(70, 112, 180, 10, "#adb5bd", "#495057", 3) + rect(110, 128, 100, 30, "#1d2433", "#0b0f17", 4) + txt(160, 150, D(Math.round(ekran / 10), 2), 17, "middle", "#fff");
        g += rect(90, 62, 140, 48, "#ced4da", "#495057", 6) + txt(160, 92, `${g_} g`, 15);
        g += rect(320, 40, 200, 110, "#fffdf5", "#495057", 8) + txt(420, 66, "Dara: kase (280 g)", 13) + txt(420, 96, "Ekran = kütle − 280 g", 13) + txt(420, 128, "Hedef ekran: 1,14", 14, "middle", "#d9480f");
        return svg(540, 176, g, "Terazi") + kutu(`${g_} g − 280 g = ${ekran} g → ekranda <b>${D(Math.round(ekran / 10), 2)}</b> kg`); },
      kosullar: [{ ad: "Terazinin ekranı 1,14 gösteriyor mu?", f: v => v[0] - 280 === 1140 }],
      sutun: ["Tahmin (g)", "Ekran (kg)", "Hedefle aynı mı?"], satir: (v, ok) => [v[0], D(Math.round((v[0] - 280) / 10), 2), ok ? "evet ✔" : "hayır"], iyi: (v, L) => L[0].ok ? true : null,
      yon: "Tencerenin kütlesi için gram cinsinden bir tahmin yazın. Terazi dara yapıldığı için ekranda tahmininizden kasenin kütlesi (280 g) çıkarılmış değer görünür. Ekran 1,14 olana kadar tahmininizi değiştirin.",
      bitis: "Ekran 1,14 kg gösterdiğinde ve tahminlerinizi deftere yazdığınızda." }),

    /* 13 · Fidanın boyu */
    13: el => { const DG = [[9, 4], [5, 3], [-3, 4], [5, 2]];
      return CN.KOSUL(el, { girdi: [{ ad: "Geçen hafta sayısı:", min: 0, max: 4, bas: 0 }], dugme: false,
        ciz: v => { const k = v[0]; let b = [14, 1]; const L = [[14, 1]]; DG.slice(0, k).forEach(d => { b = ek(b, d); L.push(b); });
          let g = ""; L.forEach((x, i) => { const h = N(x) * 7, xx = 40 + i * 95; g += rect(xx, 190 - h, 50, h, i === k ? "#69db7c" : "#b2f2bb") + sy(xx + 25, 190 - h - 12, R(x), { fs: 13 }) + txt(xx + 25, 208, i ? `${i}. hafta` : "başlangıç", 12, "middle", "#5b6478", 700); });
          return svg(520, 214, g, "Fidanın boyu") + kutu(k ? `14 + ${DG.slice(0, k).map(RP).join(" + ")} = <b>${R(b)} cm</b>` : "Başlangıç boyu: 14 cm"); },
        kosullar: [{ ad: "Dört haftanın değişimleri eklendi.", f: v => v[0] === 4 }],
        sutun: ["Hafta", "Değişim (cm)", "Boy (cm)"], satir: v => { let b = [14, 1]; DG.slice(0, v[0]).forEach(d => b = ek(b, d)); return [v[0], v[0] ? R(DG[v[0] - 1]) : "—", R(b)]; }, iyi: () => null,
        yon: "+ düğmesiyle haftaları ilerletin. Her haftanın değişimi fidanın boyuna eklenir; budanan haftada değişim negatiftir. Her haftanın sonundaki boyu deftere yazın.",
        bitis: "4. haftanın sonundaki boyu deftere yazdığınızda." }); },

    /* 14 · Çatıdaki kar */
    14: el => CN.KOSUL(el, { girdi: [{ ad: "06.00'dan sonra geçen saat:", min: 0, max: 8, bas: 0 }], dugme: false,
      ciz: v => { const k = v[0], y = Math.min(k, 4), e = Math.max(0, k - 4), d = ek(ek([12, 1], kat([9, 4], [y, 1])), kat([-5, 3], [e, 1]));
        let g = `<path d="M60 150 L260 60 L460 150 Z" fill="#e9ecef" stroke="#495057" stroke-width="1.6"/>`;
        const kal = N(d) * 3; g += `<path d="M60 150 L260 60 L460 150 L460 ${150 - kal} L260 ${60 - kal} L60 ${150 - kal} Z" fill="#e7f5ff" stroke="#74c0fc" stroke-width="1.4"/>`;
        g += rect(196, 150, 128, 50, "#fff", "#495057") + txt(470, 40, String(6 + k).padStart(2, "0") + ".00", 18, "end", k <= 4 ? "#1864ab" : "#d9480f") + txt(470, 62, k === 0 ? "" : k <= 4 ? "kar yağıyor" : "güneşli, eriyor", 13, "end", "#5b6478", 700);
        return svg(520, 206, g, "Çatıdaki kar") + kutu(`12 + ${y} · 2 1/4 − ${e} · 1 2/3 = <b>${R(d)} cm</b>`); },
      kosullar: [{ ad: "Saat 14.00'e gelindi.", f: v => v[0] === 8 }],
      sutun: ["Saat", "Kar kalınlığı (cm)"], satir: v => { const y = Math.min(v[0], 4), e = Math.max(0, v[0] - 4); return [String(6 + v[0]).padStart(2, "0") + ".00", R(ek(ek([12, 1], kat([9, 4], [y, 1])), kat([-5, 3], [e, 1])))]; }, iyi: () => null,
      yon: "+ düğmesiyle zamanı saat saat ilerletin. 06.00–10.00 arasında kar her saat 2 1/4 cm kalınlaşır, 10.00–14.00 arasında her saat 1 2/3 cm incelir. Her saatteki kalınlığı deftere yazın.",
      bitis: "Saat 14.00'teki kalınlığı deftere yazdığınızda." }),

    /* 15 · Fidan sulama: bidon sayısını deneme */
    15: el => CN.KOSUL(el, { girdi: [{ ad: "Taşınan bidon sayısı:", min: 1, max: 14, bas: 6 }], dugme: false,
      ciz: v => { const n = v[0], su = 5 * n; let g = "";
        for (let i = 0; i < n; i++) g += rect(20 + i * 36, 30, 30, 50, "#a5d8ff", "#495057", 5) + txt(35 + i * 36, 60, "5", 12);
        g += rect(20, 100, 480, 26, "#f1f3f5") + rect(20, 100, Math.min(480, 480 * su / 60), 26, su >= 48 ? "#69db7c" : "#ffc078", "none") + rect(20, 100, 480, 26, "none");
        g += `<line x1="${20 + 480 * 48 / 60}" y1="92" x2="${20 + 480 * 48 / 60}" y2="134" stroke="#c92a2a" stroke-width="2.4"/>` + txt(20 + 480 * 48 / 60, 150, "gereken su", 12, "middle", "#c92a2a");
        return svg(520, 158, g, "Bidonlar") + kutu(`Gereken: 18 · 2/3 · 4 = 48 L · Taşınan: ${n} · 5 = <b>${su} L</b>`); },
      kosullar: [{ ad: "Taşınan su, 4 günlük ihtiyaca yetiyor mu?", f: v => 5 * v[0] >= 48 }],
      sutun: ["Bidon", "Taşınan su (L)", "Yetiyor mu?"], satir: (v, ok) => [v[0], 5 * v[0], ok ? "evet" : "hayır"], iyi: (v, L) => L[0].ok,
      yon: "Bidon sayısını − / + düğmeleriyle değiştirin. Şerit taşınan suyu, kırmızı çizgi 4 günde gereken suyu gösterir. Suyun yettiği en küçük bidon sayısını defterden bulun.",
      bitis: "Su yetmeyen ve yeten bidon sayılarını deneyip deftere yazdığınızda." }),

    /* 16 · Piknik hesaplaşması */
    16: el => { const O = { Ali: 210, Berk: 0, Cem: 96, Deniz: 134 }, pay = 110;
      return CN.KOSUL(el, { girdi: [{ ad: "Arkadaş:", sec: Object.keys(O), bas: "Berk" }], dugme: false,
        ciz: v => { const d = Object.values(O).map(x => (x - pay) * 100); return cubuk(d, Object.keys(O), { fmt: x => (x > 0 ? "+" : "") + D(x), renk: (i, x) => Object.keys(O)[i] === v[0] ? (x >= 0 ? "#2b8a3e" : "#c92a2a") : (x >= 0 ? "#b2f2bb" : "#ffc9c9"), ad: "Durumlar" }) +
          kutu(`Toplam 440 TL · kişi başı 440 : 4 = 110 TL · ${v[0]}: ${O[v[0]]} − 110 = <b>${T(O[v[0]] - pay)} TL</b>`); },
        kosullar: [{ ad: v => `${v[0]} payından fazla ödedi (geri alacak).`, f: v => O[v[0]] > pay }],
        sutun: ["Arkadaş", "Ödediği (TL)", "Durum (TL)"], satir: v => [v[0], O[v[0]], T(O[v[0]] - pay)], iyi: () => null,
        yon: "Arkadaşları tek tek seçin. Her arkadaşın durumu, ödediği tutardan kişi başına düşen payın çıkarılmasıyla bulunur; pozitif durum geri alacağı, negatif durum ödeyeceği parayı gösterir. Durumları deftere yazın.",
        bitis: "Dört arkadaşı da seçip durumların toplamını kontrol ettiğinizde." }); },
  };
})();

">0,9 km</text><rect x=\"808.5\" y=\"505.0\" width=\"115.0\" height=\"40.0\" rx=\"8\" fill=\"#ffffff\" stroke=\"#495057\" stroke-width=\"2.4\"/><text x=\"866.0\" y=\"534.0\" font-size=\"26\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">2,6 km</text></g></svg>", "son": "<p>Ece yolculuğu boyunca haritadaki noktaların her birinden en fazla bir kez geçmektedir.</p>", "k": "Buna göre, Ece'nin evinden kütüphaneye gidebileceği <u>en kısa</u> yol kaç kilometredir?", "sec": ["3,5", "3,65", "3,95", "4,8"], "secg": null, "c": "A", "a": ["Kesirle verilen uzunluklar ondalık gösterime çevrilir: <span class=\"nw\">1<span class=\"frac\"><span>2</span><span>5</span></span></span> = 1,4 km; <span class=\"nw\">2<span class=\"frac\"><span>1</span><span>4</span></span></span> = 2,25 km.", "Olası yollar: Ev–Park–Kütüphane 1,4 + 2,25 = 3,65; Ev–Çarşı–Kütüphane 0,9 + 2,6 = 3,5; Ev–Park–Çarşı–Kütüphane 1,4 + 0,8 + 2,6 = 4,8; Ev–Çarşı–Park–Kütüphane 0,9 + 0,8 + 2,25 = 3,95.", "En kısa yol 3,5 km'dir."], "t": "3,65: en kısa tek parça yolun (Ev–Çarşı) dışındaki rota seçilmiş; 3,95: Park'a uğrayan rota; 4,8: en uzun rota.", "d": "Kesirle ve ondalık gösterimle verilen uzunlukları karşılaştırmadan ya da toplamadan önce aynı gösterime çevirin (2 1/4 = 2,25). Bütün rotaları tek tek hesaplayın; kısa görünen yol her zaman en kısa olmayabilir.", "ses": "b04"}, {"no": 5, "on": "<p>Bir havayolu şirketinin uçuş ekranında bazı şehirlerin saatinin Türkiye saatinden kaç saat ileri (+) ya da geri (−) olduğu gösterilmektedir.</p>", "g": "<svg class=\"foto511 foto714\" viewBox=\"0 0 1076 650\" width=\"1076\" style=\"width:115.9mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs mlerini defterine şöyle yazmıştır: “Kalem: 3,2 cm çizgisinden 16,1 cm çizgisine kadar. Silgi: <span class=\"nw\">6<span class=\"frac\"><span>1</span><span>4</span></span></span> cm çizgisinden <span class=\"nw\">10<span class=\"frac\"><span>1</span><span>2</span></span></span> cm çizgisine kadar.”</p>", "k": "Buna göre, kalemin uzunluğu silginin uzunluğundan kaç santimetre fazladır?", "sec": ["2,4", "5,6", "6,65", "8,65"], "secg": null, "c": "D", "a": ["Kalemin uzunluğu bitiş ve başlangıç çizgilerinin farkıdır: 16,1 − 3,2 = 12,9 cm.", "Silginin uzunluğu <span class=\"nw\">10<span class=\"frac\"><span>1</span><span>2</span></span></span> − <span class=\"nw\">6<span class=\"frac\"><span>1</span><span>4</span></span></span> = 10,5 − 6,25 = 4,25 cm'dir.", "12,9 − 4,25 = 8,65 cm."], "t": "5,6: yalnız bitiş çizgileri karşılaştırılmış; 2,4: silginin uzunluğu yerine bitiş çizgisi kullanılmış; 6,65: silginin uzunluğu yerine başlangıç çizgisi kullanılmış.", "d": "Kırık cetvelde ölçüm 0'dan başlamaz; uzunluk, bitiş çizgisinden başlangıç çizgisi çıkarılarak bulunur. Önce her nesnenin uzunluğunu bulun, sonra uzunlukları karşılaştırın.", "ses": "b08"}, {"no": 9, "on": "<p>Bir okul şenliğinde kurulan hedef oyununda tahta üç bölgeye ayrılmıştır. Her bölgenin puanı yanındaki panoda yazmaktadır.</p>", "g": "<svg class=\"foto511 foto714\" viewBox=\"0 0 1075 605\" width=\"1075\" style=\"width:124.4mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAGsAvgDASIAAhEBAxEB/8QAGwAAAQUBAQAAAAAAAAAAAAAABgABAgQFAwf/xABTEAABAwIDBAQJBgoIBQQCAwABAAIDBBEFEiEGMUFREyJhcRQVMkKBkaGxwSMzUlNy0QcWJDRDYnOCkuElNURjg5Oy8EVUdKLxJjZkwoSUF1XS/8QAGwEAAgMBAQEAAAAAAAAAAAAAAAECAwQFBgf/xAAsEQACAgEE "a": ["Bölge puanları ondalık ya da ortak paydayla düşünülür: <span class=\"nw\">2<span class=\"frac\"><span>1</span><span>2</span></span></span> = <span class=\"nw\"><span class=\"frac\"><span>30</span><span>12</span></span></span>, <span class=\"nw\"><span class=\"frac\"><span>3</span><span>4</span></span></span> = <span class=\"nw\"><span class=\"frac\"><span>9</span><span>12</span></span></span>, <span class=\"nw\">−<span class=\"frac\"><span>2</span><span>3</span></span></span> = <span class=\"nw\">−<span class=\"frac\"><span>8</span><span>12</span></span></span>.", "Olası toplamlar: üç dış bölge −2; iç + orta + dış <span class=\"nw\"><span class=\"frac\"><span>30</span><span>12</span></span></span> + <span class=\"nw\"><span class=\"frac\"><span>9</span><span>12</span></span></span> − <span class=\"nw\"><span class=\"frac\"><span>8</span><span>12</span></span></span> = <span class=\"nw\"><span class=\"frac\"><span>31</span><span>12</span></span></span> = <span class=\"nw\">2<span class=\"frac\"><span>7</span><span>12</span></span></span>; bir iç + iki orta 4.", "Puan 1 = <span class=\"nw\"><span class=\"frac\"><span>12</span><span>12</span></span></span> olsaydı üç puanın on ikide birler cinsinden toplamı 12 olmalıydı; 30, 9 ve −8'den üç tanesinin toplamı 12 olmaz. 1 puan alınamaz."], "t": "−2, <span class=\"nw\">2<span class=\"frac\"><span>7</span><span>12</span></span></span> ve 4: üç atışla elde edilebilen puanlardır.", "d": "“Olamaz” sorulduğunda olabilen bütün toplamları düzenli bir biçimde listeleyin. Kesirleri ortak paydada (on ikide birler) yazmak, hangi toplamların elde edilebileceğini görmeyi kolaylaştırır.", "ses": "b09"}, {"no": 10, "on": "<p>Ali, Bora ve Cem aynı büyüklükte üç pizza sipariş etmiştir. Pizzalardan biri 6, biri 8, biri 12 eş dilime bölünmüştür. Ali 6 dilimli pizzadan, Bora 8 dilimli pizzadan, Cem 12 dilimli pizzadan yemiştir.</p>", "g": "<svg class=\"foto511 foto714\" viewBox=\"0 0 1304 500\" width=\"1304\" style=\"width:150mm;max-wi g>", "son": "<p>Şekilde zeytinli ve mantarlı dilimler kalan dilimleri, malzemesiz açık renkli dilimler yenen dilimleri göstermektedir.</p>", "k": "Buna göre, üç pizzadan geriye kalan pizza miktarı kaç bütün pizzaya eşittir?", "sec": ["<span class=\"nw\"><span class=\"frac\"><span>8</span><span>13</span></span></span>", "<span class=\"nw\">1<span class=\"frac\"><span>1</span><span>8</span></span></span>", "<span class=\"nw\">1<span class=\"frac\"><span>7</span><span>8</span></span></span>", "<span class=\"nw\">2<span class=\"frac\"><span>5</span><span>13</span></span></span>"], "secg": null, "c": "B", "a": ["Yenen miktarlar kesirle yazılır: Ali <span class=\"nw\"><span class=\"frac\"><span>4</span><span>6</span></span></span> = <span class=\"nw\"><span class=\"frac\"><span>2</span><span>3</span></span></span>, Bora <span class=\"nw\"><span class=\"frac\"><span>5</span><span>8</span></span></span>, Cem <span class=\"nw\"><span class=\"frac\"><span>7</span><span>12</span></span></span>.", "Paydalar 24'te eşitlenir: <span class=\"nw\"><span class=\"frac\"><span>16</span><span>24</span></span></span> + <span class=\"nw\"><span class=\"frac\"><span>15</span><span>24</span></span></span> + <span class=\"nw\"><span class=\"frac\"><span>14</span><span>24</span></span></span> = <span class=\"nw\"><span class=\"frac\"><span>45</span><span>24</span></span></span> = <span class=\"nw\">1<span class=\"frac\"><span>7</span><span>8</span></span></span> pizza yenmiştir.", "3 − <span class=\"nw\">1<span class=\"frac\"><span>7</span><span>8</span></span></span> = <span class=\"nw\">1<span class=\"frac\"><span>1</span><span>8</span></span></span> pizza kalmıştır."], "t": "<span class=\"nw\">1<span class=\"frac\"><span>7</span><span>8</span></span></span>: yenen miktar bulunup bırakılmış; <span class=\"nw\"><span class=\"frac\"><span>8</span><span>13</span></span></span> ve <span class=\"nw\">2<span class=\"frac\"><span>5</span><span>13</span></span></span>: dilim sayıları toplanıp (<spa 0\" fill=\"#111111\" text-anchor=\"start\" data-sabit=\"1\">cm</text></g></svg>", "son": "<p>Binanın her katının yüksekliği eşittir ve katlar arasındaki merdivenlerin basamakları eş yüksekliktedir. Ece arabadan −2. katta inmiş, 5. kattaki evine merdivenle çıkmıştır.</p>", "k": "Buna göre, Ece kaç basamak çıkmıştır?", "sec": ["48", "96", "112", "128"], "secg": null, "c": "C", "a": ["Bir katın yüksekliği <span class=\"nw\">2<span class=\"frac\"><span>4</span><span>5</span></span></span> m = 280 cm'dir. Bir kattan diğerine 280 : <span class=\"nw\">17<span class=\"frac\"><span>1</span><span>2</span></span></span> = 280 · <span class=\"nw\"><span class=\"frac\"><span>2</span><span>35</span></span></span> = 16 basamak vardır.", "−2. kattan 5. kata çıkarken 5 − (−2) = 7 kat çıkılır.", "7 · 16 = 112 basamak."], "t": "48: kat farkı 5 − 2 = 3 alınmış; 96: giriş katı sayılmayıp 6 kat bulunmuş; 128: kat numaraları sayılarak 8 kat bulunmuş.", "d": "Negatif kat numaralarında çıkılan kat sayısı, iki kat numarasının farkıdır: 5 − (−2) = 7. Bir kattaki basamak sayısını bulurken metreyi santimetreye çevirmeyi unutmayın.", "ses": "b11"}, {"no": 12, "on": "<p>Selin mutfak terazisinin üzerine boş bir kase koymuş ve terazinin “dara” tuşuna basmıştır. Sonra kaseyi teraziden almış, en son teraziye boş bir tencere koymuştur. Üç ölçümde terazinin ekranı aşağıdaki gibidir.</p>", "g": "<svg class=\"foto511 foto714\" viewBox=\"0 0 1190 325\" width=\"1190\" style=\"width:150mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCADPAvgDASIAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAUGAQQHAwL/xABXEAAABQECBgwICgcHAwQDAAAAAQIDBAUGERIVITFU0RMUMkFRYXGBkZOUsRYiM1VWcqHBBxdCQ0VSYnOS0iM0RlNjgsIk pan><span>3</span></span></span>", "<span class=\"nw\">21<span class=\"frac\"><span>1</span><span>6</span></span></span>"], "secg": null, "c": "C", "a": ["Değişimler toplanır: <span class=\"nw\">2<span class=\"frac\"><span>1</span><span>4</span></span></span> + <span class=\"nw\">1<span class=\"frac\"><span>2</span><span>3</span></span></span> + (<span class=\"nw\">−<span class=\"frac\"><span>3</span><span>4</span></span></span>) + <span class=\"nw\">2<span class=\"frac\"><span>1</span><span>2</span></span></span>. Paydalar 12'de eşitlenir: <span class=\"nw\"><span class=\"frac\"><span>27</span><span>12</span></span></span> + <span class=\"nw\"><span class=\"frac\"><span>20</span><span>12</span></span></span> − <span class=\"nw\"><span class=\"frac\"><span>9</span><span>12</span></span></span> + <span class=\"nw\"><span class=\"frac\"><span>30</span><span>12</span></span></span> = <span class=\"nw\"><span class=\"frac\"><span>68</span><span>12</span></span></span> = <span class=\"nw\">5<span class=\"frac\"><span>2</span><span>3</span></span></span> cm.", "Fidanın boyu 14 + <span class=\"nw\">5<span class=\"frac\"><span>2</span><span>3</span></span></span> = <span class=\"nw\">19<span class=\"frac\"><span>2</span><span>3</span></span></span> cm olur."], "t": "<span class=\"nw\">21<span class=\"frac\"><span>1</span><span>6</span></span></span>: budama da uzama gibi eklenmiş; <span class=\"nw\">17<span class=\"frac\"><span>1</span><span>6</span></span></span>: 4. haftadaki uzama eklenmemiş; <span class=\"nw\">5<span class=\"frac\"><span>2</span><span>3</span></span></span>: başlangıç boyu eklenmemiş.", "d": "Budama gibi kısalmalar negatif sayıyla gösterilir ve boydan çıkarılır. Tam sayılı kesirleri toplarken paydaları eşitleyin ve başlangıç boyunu eklemeyi unutmayın.", "ses": "b13"}, {"no": 14, "on": "<p>Bir dağ evinin çatısındaki kar kalınlığı saat 06.00'da 12 cm'dir. 06.00 ile 10.00 arasında kar yağmış, 10.00 ile 14.00 arasında güneş çıkmış ve kar erimiştir.</p>", "g /* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
