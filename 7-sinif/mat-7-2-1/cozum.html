c078\" stroke=\"#d9480f\" stroke-width=\"1.6\"/><text x=\"656.0\" y=\"85.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">−1</text><text x=\"136.0\" y=\"61.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">Masadaki karolar</text><rect x=\"150\" y=\"101\" width=\"16\" height=\"16\" rx=\"3\" fill=\"#a5d8ff\" stroke=\"#1c7ed6\" stroke-width=\"1.4\"/><text x=\"174.0\" y=\"114.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">pozitif</text><rect x=\"250\" y=\"101\" width=\"16\" height=\"16\" rx=\"3\" fill=\"#ffc078\" stroke=\"#d9480f\" stroke-width=\"1.4\"/><text x=\"274.0\" y=\"114.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">negatif</text></svg>", "son": "<p>Dört öğrenci masadaki karoların gösterdiği ifadeyi farklı biçimlerde yazmıştır: 5x − 2x + 4 − 6, 3(x − 1) + 1, x + 2(x − 1) ve 3x + 2.</p>", "k": "Buna göre, öğrencilerin yazdığı ifadelerden hangisi masadaki karoların gösterdiği ifadeye denk değildir?", "sec": ["5x − 2x + 4 − 6", "3(x − 1) + 1", "x + 2(x − 1)", "3x + 2"], "secg": null, "c": "D", "a": ["Masada 5 pozitif ve 2 negatif x şeridi, 4 pozitif ve 6 negatif birim kare vardır; sıfır çiftleri kaldırılınca 3x − 2 kalır.", "5x − 2x + 4 − 6 = 3x − 2; 3(x − 1) + 1 = 3x − 3 + 1 = 3x − 2; x + 2(x − 1) = x + 2x − 2 = 3x − 2.", "3x + 2 ise denk değildir: x = 0 için 2 ile −2 farklıdır."], "t": "Öbür üç ifade sadeleştirildiğinde 3x − 2 olur; masadaki karolara denktir", "d": "Karolardaki sıfır çiftlerini kaldırıp kalan ifadeyi bulunuz. Sonra her öğrencinin ifadesini sadeleştirip bununla karşılaştırınız.", "ses": "b14"}, {"no": 15, "on": "<p>Bir spor salonunun duvarındaki dikdörtgen biçimli bir bölümün kenarları 6 m ve (2x + 7) m'dir. Bu bölüme kenarları 2 m ve 3 m olan dikdörtgen biçimli 2 eş afiş asılacaktır.</p>", "g": "<svg viewBox=\"0 0 410 198\" width=\"410\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"120\" y=\"16\" width=\"270\" height=\"150\" fill=\"#c9ecd8\" stroke=\"#111111\" stroke-width=\"2.4\"/><text x=\"255.0\" y=\"188.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">(2x + 7) m</text><text x=\"110.0\" y=\"96.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">6 m</text><rect x=\"266\" y=\"46\" width=\"84\" height=\"58\" rx=\"6\" fill=\"#a5d8ff\" stroke=\"#1c5fbf\" stroke-width=\"1.8\"/><text x=\"308.0\" y=\"80.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">afiş</text><text x=\"308.0\" y=\"39.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">3 m</text><text x=\"259.0\" y=\"80.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">2 m</text></svg>", "son": "<p>Şekilde afişlerden yalnız biri gösterilmiştir.</p>", "k": "Buna göre, duvar bölümünün afişlerle örtülmeyen kısmının alanını metrekare cinsinden gösteren ifade aşağıdakilerden hangisidir?", "sec": ["12x + 36", "12x + 30", "12x − 5", "2x + 30"], "secg": null, "c": "B", "a": ["Duvar bölümünün alanı: 6(2x + 7) = 12x + 42.", "İki afişin alanı: 2 · (2 · 3) = 12.", "Örtülmeyen alan: 12x + 42 − 12 = 12x + 30."], "t": "12x + 36: yalnız bir afiş çıkarılmış; 12x − 5: 6 yalnız ilk terimle çarpılmış; 2x + 30: 6 yalnız sabit terimle çarpılmış", "d": "Örtülmeyen alan, duvar bölümünün alanından iki afişin alanının çıkarılmasıyla bulunur. Afiş sayısını unutmayınız.", "ses": "b15"}, {"no": 16, "on": "<p>Bir düğün salonunda kare masalar yan yana birleştirilerek uzun masalar oluşturulmakta ve çevrelerine sandalyeler konmaktadır. 1, 2 ve 3 masalık dizilimler aşağıda gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 482 128\" width=\"482\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"20\" y=\"26\" width=\"46\" height=\"46\" fill=\"#f3d9b1\" stroke=\"#8d5a2b\" stroke-width=\"1.6\"/><circle cx=\"43.0\" cy=\"14\" r=\"8\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"1.4\"/><circle cx=\"43.0\" cy=\"84\" r=\"8\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"1.4\"/><circle cx=\"8\" cy=\"49.0\" r=\"8\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"1.4\"/><circle cx=\"78\" cy=\"49.0\" r=\"8\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"1.4\"/><text x=\"43.0\" y=\"118.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">1 masa</text><rect x=\"128\" y=\"26\" width=\"46\" height=\"46\" fill=\"#f3d9b1\" stroke=\"#8d5a2b\" stroke-width=\"1.6\"/><circle cx=\"151.0\" cy=\"14\" r=\"8\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"1.4\"/><circle cx=\"151.0\" cy=\"84\" r=\"8\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"1.4\"/><rect x=\"174\" y=\"26\" width=\"46\" height=\"46\" fill=\"#f3d9b1\" stroke=\"#8d5a2b\" stroke-width=\"1.6\"/><circle cx=\"197.0\" cy=\"14\" r=\"8\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"1.4\"/><circle cx=\"197.0\" cy=\"84\" r=\"8\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"1.4\"/><circle cx=\"116\" cy=\"49.0\" r=\"8\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"1.4\"/><circle cx=\"232\" cy=\"49.0\" r=\"8\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"1.4\"/><text x=\"174.0\" y=\"118.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2 masa</text><rect x=\"282\" y=\"26\" width=\"46\" height=\"46\" fill=\"#f3d9b1\" stroke=\"#8d5a2b\" stroke-width=\"1.6\"/><circle cx=\"305.0\" cy=\"14\" r=\"8\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"1.4\"/><circle cx=\"305.0\" cy=\"84\" r=\"8\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"1.4\"/><rect x=\"328\" y=\"26\" width=\"46\" height=\"46\" fill=\"#f3d9b1\" stroke=\"#8d5a2b\" stroke-width=\"1.6\"/><circle cx=\"351.0\" cy=\"14\" r=\"8\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"1.4\"/><circle cx=\"351.0\" cy=\"84\" r=\"8\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"1.4\"/><rect x=\"374\" y=\"26\" width=\"46\" height=\"46\" fill=\"#f3d9b1\" stroke=\"#8d5a2b\" stroke-width=\"1.6\"/><circle cx=\"397.0\" cy=\"14\" r=\"8\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"1.4\"/><circle cx=\"397.0\" cy=\"84\" r=\"8\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"1.4\"/><circle cx=\"270\" cy=\"49.0\" r=\"8\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"1.4\"/><circle cx=\"432\" cy=\"49.0\" r=\"8\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"1.4\"/><text x=\"351.0\" y=\"118.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">3 masa</text></svg>", "son": "<p>Dört öğrenci n masa birleştirildiğinde konan sandalye sayısını şu ifadelerle göstermiştir: 2(n + 1), 4n − 2(n − 1), 4n − 2 ve n + n + 2.</p>", "k": "Buna göre, bu ifadelerden hangisi n masa için sandalye sayısını <u>göstermez</u>?", "sec": ["2(n + 1)", "4n − 2(n − 1)", "4n − 2", "n + n + 2"], "secg": null, "c": "C", "a": ["Şekilde n masa için üstte n, altta n, iki uçta birer sandalye vardır: 2n + 2.", "2(n + 1) = 2n + 2; 4n − 2(n − 1) = 4n − 2n + 2 = 2n + 2; n + n + 2 = 2n + 2.", "4n − 2 ise denk değildir: n = 1 için 2 bulunur ama 1 masada 4 sandalye vardır."], "t": "Öbür ifadeler farklı düşünülerek yazılmıştır ama hepsi 2n + 2'ye denktir", "d": "Her ifadeyi sadeleştirip 2n + 2 ile karşılaştırınız. Şüpheli ifadeyi 1 masa için sınayınız: Şekilde 4 sandalye vardır.", "ses": "b16"}, {"no": 17, "on": "<p>Bir okulun 7. sınıflarındaki kız ve erkek öğrenci sayıları aşağıdaki tabloda gösterilmiştir. Tablodaki bir hücre okunamamaktadır.</p>", "g": "<svg viewBox=\"0 0 470 176\" width=\"470\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><text x=\"235.0\" y=\"18.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Tablo: 7. Sınıflar</text><rect x=\"10\" y=\"30\" width=\"450\" height=\"36\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Şube</text><text x=\"235.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Kız</text><text x=\"385.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Erkek</text><rect x=\"10\" y=\"66\" width=\"450\" height=\"34\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"85.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">7-A</text><text x=\"235.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">2a + 3</text><text x=\"385.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">a − 1</text><rect x=\"10\" y=\"100\" width=\"450\" height=\"34\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"85.0\" y=\"122.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">7-B</text><text x=\"235.0\" y=\"122.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">a + 4</text><rect x=\"372.0\" y=\"105.0\" width=\"26\" height=\"24\" rx=\"4\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"1.3\"/><text x=\"385.0\" y=\"122.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">?</text><rect x=\"10\" y=\"134\" width=\"450\" height=\"34\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"85.0\" y=\"156.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Toplam</text><text x=\"235.0\" y=\"156.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">3a + 7</text><text x=\"385.0\" y=\"156.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">3a + 2</text><line x1=\"160\" y1=\"30\" x2=\"160\" y2=\"168\" stroke=\"#495057\" stroke-width=\"1\"/><line x1=\"310\" y1=\"30\" x2=\"310\" y2=\"168\" stroke=\"#495057\" stroke-width=\"1\"/></svg>", "son": "", "k": "Buna göre, 7-B şubesindeki toplam öğrenci sayısını gösteren ifade aşağıdakilerden hangisidir?", "sec": ["3a + 7", "3a + 5", "4a + 6", "2a + 3"], "secg": null, "c": "A", "a": ["7-B'deki erkek öğrenciler: (3a + 2) − (a − 1) = 3a + 2 − a + 1 = 2a + 3.", "7-B'nin toplamı: (a + 4) + (2a + 3).", "3a + 7."], "t": "3a + 5: −(a − 1) yazılırken −1'in işareti değiştirilmemiş; 4a + 6: erkekler toplamı 7-B'nin erkekleri sanılmış; 2a + 3: yalnız erkekler bulunmuş", "d": "Önce 7-B'deki erkek öğrenci sayısını toplamdan çıkarma ile bulunuz: −(a − 1) = −a + 1.", "ses": "b17"}, {"no": 18, "on": "<p>Melis defterine bir işlemin sonucunu yazmış, ancak işlemdeki bir sayının üstüne mürekkep damlamıştır. Mürekkep lekesinin altındaki sayı bir doğal sayıdır.</p>", "g": "<svg viewBox=\"0 0 470 98\" width=\"470\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"6\" y=\"6\" width=\"458\" height=\"86\" rx=\"8\" fill=\"#fffef6\" stroke=\"#adb5bd\" stroke-width=\"1.4\"/><line x1=\"48\" y1=\"10\" x2=\"48\" y2=\"88\" stroke=\"#ffa8a8\" stroke-width=\"1.4\"/><text x=\"60.0\" y=\"34.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"start\">Melis'in defteri</text><line x1=\"14\" y1=\"92\" x2=\"456\" y2=\"92\" stroke=\"#d0ebff\" stroke-width=\"1.2\"/><text x=\"30.0\" y=\"84.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">1.</text><text x=\"60.0\" y=\"84.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">3(2x − ■) + 4x = 10x − 6</text></svg>", "son": "<p>Eşitliğin iki yanındaki ifadeler denktir.</p>", "k": "Buna göre, mürekkep lekesinin altındaki sayı kaçtır?", "sec": ["6", "2", "3", "1"], "secg": null, "c": "B", "a": ["3(2x − ■) + 4x = 6x − 3 · ■ + 4x = 10x − 3 · ■.", "Sabit terimler aynı olmalıdır: 3 · ■ = 6.", "■ = 2."], "t": "6: 3 yalnız ilk terimle çarpılmış; 3: 6 sayısı 2'ye bölünmüş; 1: 6'dan 5 çıkarılmış gibi tahmin edilmiş", "d": "Sol taraftaki ifadeyi sadeleştiriniz; sağ tarafla denk olması için x'li terimler ve sabit terimler ayrı ayrı eşit olmalıdır.", "ses": "b18"}, {"no": 19, "on": "<p>Öğretmen 5(2x − 1) − 3(x − 4) ifadesinin en sade hâlini sormuş, üç öğrenci çözümlerini şöyle açıklamıştır:</p>", "g": "<svg viewBox=\"0 0 280 62\" width=\"280\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"260\" height=\"46\" rx=\"9\" fill=\"#e7f5ff\" stroke=\"#1c5fbf\" stroke-width=\"1.6\"/><text x=\"138.0\" y=\"36.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">5(2x − 1) − 3(x − 4)</text></svg>", "son": "<b>Ali:</b> “10x − 1 − 3x − 4 = 7x − 5”<br><b>Ayşe:</b> “10x − 5 − 3x + 12 = 7x + 7”<br><b>Can:</b> “10x − 5 − 3x − 12 = 7x − 17”", "k": "Buna göre, hangi öğrencinin çözümü doğrudur?", "sec": ["Yalnız Can", "Ali ve Ayşe", "Ayşe ve Can", "Yalnız Ayşe"], "secg": null, "c": "D", "a": ["5(2x − 1) = 10x − 5; −3(x − 4) = −3x + 12.", "10x − 5 − 3x + 12 = 7x + 7. Ayşe haklıdır.", "Ali yalnız ilk terimleri çarpmıştır; Can −3 ile −4'ün çarpımının işaretini yanlış almıştır."], "t": "Can'ı içeren seçenekler: (−3) · (−4) = −12 sanılmış; Ali'yi içeren seçenek: dağılmada yalnız ilk terim çarpılmış", "d": "−3(x − 4) çarpımında −3 ile −4'ün çarpımı pozitiftir. Her öğrencinin ilk adımını tek tek denetleyiniz.", "ses": "b19"}, {"no": 20, "on": "<p>Bir şehir içi otobüsünde ilk duraktan sonra (3y + 8) yolcu vardır. İkinci durakta (y + 5) yolcu inmiş, (2y − 3) yolcu binmiştir (y, 1'den büyük bir doğal sayıdır).</p>", "g": "<svg viewBox=\"0 0 476 116\" width=\"476\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"220\" height=\"100\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H220 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"118.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">1. duraktan sonra</text><text x=\"118.0\" y=\"76.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">(3y + 8) yolcu</text><rect x=\"242\" y=\"8\" width=\"220\" height=\"100\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M242 36 V16 q0 -8 8 -8 H454 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"352.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2. durakta</text><text x=\"352.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">İnen: (y + 5)</text><text x=\"352.0\" y=\"88.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Binen: (2y − 3)</text></svg>", "son": "", "k": "Buna göre, ikinci duraktan sonra otobüsteki yolcu sayısıyla ilgili aşağıdakilerden hangisi <u>kesinlikle</u> doğrudur?", "sec": ["Tek sayıdır.", "İlk duraktan sonraki yolcu sayısından 8 fazladır.", "4'ün katıdır.", "y'den 13 fazladır."], "secg": null, "c": "C", "a": ["Yolcu sayısı: (3y + 8) − (y + 5) + (2y − 3).", "3y + 8 − y − 5 + 2y − 3 = 4y.", "4y, y hangi doğal sayı olursa olsun 4'ün katıdır."], "t": "Tek sayıdır: 4y her zaman çifttir; 8 fazladır: sabit terimler toplanmış; 13 fazladır: inen yolcuların sabit terimi eklenmiş", "d": "İnen yolcular parantez içinde çıkarılır, binenler eklenir. Sonucu en sade hâle getirip y'nin her değeri için ne söylenebileceğini düşününüz.", "ses": "b20"}]};

/* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
