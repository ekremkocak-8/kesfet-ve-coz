<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* ANA_KURALLAR §4.y-3: Etkinliklerde bütün kesirler kesir çizgisiyle (alt alta pay/payda) gösterilir. Düz yazılmış a/b biçimleri otomatik dönüştürülür. */
(function(){
  if (window.__kesirCizgi) return; window.__kesirCizgi = 1;
  const RX = /(^|[^\w\/.,:%])([−-])?(?:(\d+) )?(\d{1,4})\/(\d{1,4})(?![\w\/.,]\d|\w)/g;
  const ATLA = "script,style,svg,textarea,input,select,code,.ilr,.frac,[data-duz]";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function donustur(kok){
    if (!kok || !kok.nodeType) return;
    if (kok.nodeType === 3) kok = kok.parentElement;
    if (!kok || (kok.closest && kok.closest(ATLA))) return;
    const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      if (!/\d\/\d/.test(t.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = t.parentElement; if (!p || p.closest(ATLA)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const L = []; let t; while ((t = w.nextNode())) L.push(t);
    L.forEach(t => {
      let deg = false;
      const h = esc(t.nodeValue).replace(RX, (m, a, s, tam, p, q) => { deg = true;
        return a + (s ? "−" : "") + (tam ? tam + " " : "") + '<span class="frac"><span>' + p + "</span><span>" + q + "</span></span>"; });
      if (!deg) return;
      const k = document.createElement("span"); k.innerHTML = h; t.replaceWith(...k.childNodes);
    });
  }
  let bekleyen = new Set(), plan = 0;
  const calis = () => { plan = 0; const b = bekleyen; bekleyen = new Set(); b.forEach(donustur); };
  const gozcu = new MutationObserver(ms => { ms.forEach(m => {
      if (m.type === "characterData") bekleyen.add(m.target); else m.addedNodes.forEach(n => bekleyen.add(n)); });
    if (!plan) plan = requestAnimationFrame(calis); });
  const bas = () => { donustur(document.body); gozcu.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bas); else bas();
  const st = document.createElement("style");
  st.textContent = ".frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}.frac>span{display:block;text-align:center;padding:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor}";
  document.head.appendChild(st);
})();

/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {

    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });

    async function dagit(k) {

      const kolon = Math.min(k, 6), satirK = Math.ceil(k / kolon), gw = kolon * 14 + 16, gh = satirK * 14 + 26;

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */
  function ATLA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Sonuç"] });
    let k = o.k, L = o.son; const W = 660, sol = 22, sag = 22, sk = (W - sol - sag) / L;

    const bA = dug("▶ Oynat"), bB = dug("+1 " + (o.adimAd || "adım"), "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bB, bS);
    let kA = null;
    if (o.kSec) { kA = adimci(o.kEtiket || "Adım:", 2, Math.floor(L / 2), k, v => { k = v; sifirla(); }); kut.prepend(kA.w); }

    const bT = dug(o.testDugme || "Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test);
    const ti = test.querySelector("input");
    function taban() {
      let sv = `<line x1="${sol}" y1="62" x2="${sol + L * sk}" y2="62" class="cn-ek"/>`;

      for (let v = 0; v <= L; v += adimT) sv += `<line x1="${sol + v * sk}" y1="${v % et ? 58 : 54}" x2="${sol + v * sk}" y2="66" class="cn-ek"/>` + (v % et ? "" : `<text x="${sol + v * sk}" y="82" text-anchor="middle" class="cn-et">${o.etYaz ? o.etYaz(v) : v}</text>`);
      sv += `<line x1="${sol + L * sk}" y1="30" x2="${sol + L * sk}" y2="70" class="cn-sinir"/><text x="${sol + L * sk}" y="24" text-anchor="end" class="cn-et">${o.sonEt || L}</text>`;

    }

      izle.forEach((v, i) => {

        sv += `<path d="M${x1} 62 Q${(x1 + x2) / 2} ${yy} ${x2} 62" class="cn-yay"/><circle cx="${x2}" cy="62" r="4.5" class="${o.renk ? o.renk(v, i + 1) : "cn-o"}"/>`;
        if (izle.length <= 14 || i === izle.length - 1 || i % Math.ceil(izle.length / 10) === 0) sv += `<text x="${x2}" y="${98}" text-anchor="middle" class="cn-et2">${v}</text>`;
      });

      const son = izle.length ? izle[izle.length - 1] : 0, ix = sol + son * sk;
      sv += `<text x="${ix}" y="50" text-anchor="middle" class="cn-kis">${o.simge || "●"}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W} 104" role="img" aria-label="${k} birimlik adımlarla ilerleme">${sv}</svg>`;
    }
    const ileri = () => {
      const v = (n + 1) * k;
      if (v > L) { durdur(); s.dur.innerHTML = `<span class="kotu">■</span> Sonraki ${o.adimAd || "adım"} ${k} ${x} ${n + 1} = <b>${v}</b> olurdu; bu ${E(L,"den")} büyük. ${o.bitti ? o.bitti(n, k, L) : `Toplam ${n} ${o.adimAd || "adım"}; son değer ${n * k}.`}`; if (!izle.length) ciz(); return false; }
      n++; izle.push(v); ciz(); s.dur.innerHTML = o.durum ? o.durum(n, v, k) : `${n}. ${o.adimAd || "adım"}: ${k} ${x} ${n} = <b>${v}</b>`; return true;

      s.dur.innerHTML = m; s.yaz("t" + v, [v, r === 0 ? (ic ? `${k} ${x} ${b} ✔` : `${k} ${x} ${b} (sınır dışı)`) : `kalan ${r} ✘`], r === 0 && ic);

  }

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || [o.kAd || "k", "Boyanan", "En büyük"] });
    let k = o.k || 2, son = o.son;
    const kut = h("div", "cn-satir");

    if (o.sonSec) { const sw = h("div", "cn-hazir"); o.sonSec.forEach(v => { const b = dug(v + " gün", "ghost"); b.onclick = () => { son = v; kur(); temiz(); }; sw.appendChild(b); }); s.den.append(kut, sw); }

      const g = h("div", "cn-izg" + (o.takvim ? " cn-tak" : "")); g.style.gridTemplateColumns = `repeat(${o.sutunSay},1fr)`;

    function temiz() { hucre.forEach(c => c && c.classList.remove("on", "yeni")); s.dur.innerHTML = o.ilk || "Sayıyı seçip Boya düğmesine basın."; }

      }

      s.yaz(k + ":" + son, o.satir ? o.satir(k, say, enb, son) : [k, say, enb], o.iyi ? o.iyi(k, say, enb, son) : null);
      calis = false; bB.disabled = false;

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */
  function ASANSOR(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Açık asansörler", "Gidilen kat", "Gidilemeyen kat"] });
    const ac = o.asansor.map(() => false);
    const kut = h("div", "cn-satir"); const bt = o.asansor.map((a, i) => { const b = dug(a.ad, "ghost"); b.style.setProperty("--ac", a.renk); b.setAttribute("aria-pressed", "false"); b.onclick = () => { ac[i] = !ac[i]; b.setAttribute("aria-pressed", ac[i]); ciz(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    function ciz() {
      let sv = ""; const H = o.kat * 17 + 40; let git = 0, gitme = [];
      for (let f = o.kat; f >= 0; f--) {

        sv += `<rect x="60" y="${y}" width="150" height="15" rx="2" class="${f === 0 ? "cn-zem" : herhangi ? "cn-katon" : (ac.some(Boolean) ? "cn-katoff" : "cn-kat")}"/><text x="52" y="${y + 12}" text-anchor="end" class="cn-et">${f === 0 ? "Z" : f}</text>`;
        o.asansor.forEach((a, i) => { if (dur[i]) sv += `<circle cx="${230 + i * 22}" cy="${y + 7.5}" r="6" fill="${a.renk}"/>`; });
      }
      s.sah.innerHTML = `<svg viewBox="0 0 300 ${H}" style="max-height:440px" role="img" aria-label="${o.kat} katlı bina">${sv}</svg>`;
      const acik = o.asansor.filter((a, i) => ac[i]).map(a => a.ad);

      s.yaz(acik.join("+"), [acik.join(" + "), git, gitme.length], null);

    ciz();
  }

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */
  function SAAT(el, o) {

      let onc = null, snr = null;
      for (let m = bas; m <= bit + ara; m += ara) { if (m <= var_) onc = m; if (m >= var_ && snr == null) snr = m; if (m <= bit) sv += `<text x="${20 + (m - bas) * sk}" y="40" text-anchor="middle" class="cn-bus">🚌</text>`; }

      if (snr != null && snr <= bit + ara) { const sx = 20 + (Math.min(snr, bit) - bas) * sk; sv += `<path d="M${vx} 56 L${sx} 56" class="cn-bek"/>`; }

      const gec = var_ - bas;
      s.dur.innerHTML = `${o.kisi} durağa ${saDa(var_)} geliyor: ilk seferden <b>${gec} dakika</b> sonra. Seferler ${E(ara,"in")} katı olan dakikalarda: ${ara} ${x} ${Math.floor(gec / ara)} = ${Math.floor(gec / ara) * ara}` + (gec % ara ? `, ${ara} ${x} ${Math.floor(gec / ara) + 1} = ${(Math.floor(gec / ara) + 1) * ara}. Sonraki otobüs ${saDa(snr)}; bekleme <b>${snr - var_} dakika</b>.` : `. Tam sefer saatinde geldi; bekleme <b>0 dakika</b>.`);
      s.yaz(ara + ":" + var_, [ara + " dk", sa(var_), sa(onc), sa(snr), (snr - var_) + " dk"], null);
    }
    ciz();
  }

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Çarpanlar", "Çarpan sayısı"] });
    let N = o.N || o.hazir[0]; let bul = new Set(), denendi = new Set();
    const kut = h("div", "cn-satir");
    const sA = adimci("Sayı:", 2, o.max || 200, N, v => { N = v; yeni(); });
    kut.appendChild(sA.w);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => sA.ayarla(n); hz.appendChild(b); }); kut.appendChild(hz); }
    s.den.appendChild(kut);
    const bolen = h("div", "cn-satir cn-test"); bolen.innerHTML = `<label>Bölen deneyin: <input type="number" inputmode="numeric" min="1"></label>`;
    const bD = dug("Böl"), bS = dug("Sıradakini dene", "ghost"); bolen.append(bD, bS); s.den.appendChild(bolen);
    const bi = bolen.querySelector("input");
    let bK = null; if (o.katlar) { bK = dug(o.katDugme || "Katlarını say ▶", "ghost"); s.den.appendChild(bK); }
    const ciftler = h("div", "cn-cift"); const katlar = h("div", "cn-katlar");
    function yeni() { bul = new Set(); denendi = new Set(); ciz(); s.dur.innerHTML = `${N} sayısını 1, 2, 3, … sayılarına bölerek çarpan çiftlerini bulun.`; katlar.textContent = ""; }
    function ciz() {
      const L = [...bul].sort((a, b) => a - b);
      s.sah.innerHTML = ""; const kartlar = h("div", "cn-kartlar");
      L.forEach(v => kartlar.appendChild(h("span", "cn-kart" + (v * v === N ? " kare" : ""), v)));
      if (!L.length) kartlar.appendChild(h("span", "cn-bosk", "Henüz çarpan bulunmadı"));
      s.sah.append(kartlar, ciftler, katlar);
      ciftler.innerHTML = L.filter(v => v * v <= N).map(v => `<span>${v} ${x} ${N / v}${v * v === N ? " <i>(aynı sayı: bir kez yazılır)</i>" : ""}</span>`).join("");
    }
    const tamamMi = () => { for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) return false; return true; };
    const eksik = () => { const L = []; for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) L.push(i); return ` <br>Henüz denenmeyen küçük bölenler var: <b>${L.join(", ")}</b>. Bunları da deneyin.`; };
    function dene(d) {
      if (!d || d < 1) return; denendi.add(d);
      const b = Math.floor(N / d), r = N % d;
      if (d > N) { s.dur.innerHTML = `${d} > ${N}: ${E(N,"den")} büyük sayı ${E(N,"in")} çarpanı olamaz.`; return; }
      if (r === 0) { bul.add(d); bul.add(b); ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${N} : ${d} = ${b}, kalan 0 → <b>${d} ${x} ${b} = ${N}</b>. ${d} ve ${b} çarpandır.` + (d * d >= N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} ${d * d === N ? "=" : ">"} ${N}. Artık yeni çift çıkmaz; bütün çarpanlar bulundu.` : eksik() : ""); }
      else { s.dur.innerHTML = `<span class="kotu">✘</span> ${N} : ${d} işleminde bölüm ${b}, <b>kalan ${r}</b>. ${d}, ${E(N,"in")} çarpanı değildir.` + (d * d > N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} > ${N}. Daha büyük bölen denemeye gerek yok; çarpan listesi tamam.` : eksik() : ""); }
      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));
      if (tamam) s.yaz("n" + N, [N, [...bul].sort((a, b) => a - b).join(", "), bul.size], true);
    }
    bD.onclick = () => dene(Math.round(+bi.value));
    bS.onclick = () => { let d = 1; while (denendi.has(d)) d++; bi.value = d; dene(d); };
    if (bK) bK.onclick = async () => {
      bK.disabled = true; katlar.textContent = ""; const sat = h("div", "cn-katsat"); katlar.append(h("b", "", `${E(N,"in")} katları: `), sat);
      for (let i = 1; i <= (o.katSay || 12); i++) { sat.appendChild(h("span", "cn-kat2", `${N * i}`)); await bekle(220); }
      sat.appendChild(h("span", "cn-sonsuz", "… ve sonsuza kadar sürer"));
      bK.disabled = false;
    };
    yeni();
  }

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */
  function KUMBARA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Para", "Sonuç"] });
    const k = o.k; let hafta = 0, tmr = null;
    const kut = h("div", "cn-satir"); const bA = dug("Bir hafta geçsin +"), bO = dug("▶ Haftaları oynat", "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bO, bS); s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Kumbarada şu para olabilir mi? <input type="number" inputmode="numeric" min="1" max="500"> TL</label>`;
    const bT = dug("Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test); const ti = test.querySelector("input");
    function ciz() {
      const top = hafta * k, sv = [];
      const yuk = Math.min(150, top * 1.4);
      sv.push(`<rect x="110" y="20" width="120" height="160" rx="22" class="cn-kum"/><rect x="150" y="14" width="40" height="8" rx="3" class="cn-kum2"/>`);
      sv.push(`<rect x="116" y="${176 - yuk}" width="108" height="${yuk}" rx="10" class="cn-para"/>`);
      sv.push(`<text x="170" y="110" text-anchor="middle" class="cn-buyuk">${top} TL</text><text x="170" y="134" text-anchor="middle" class="cn-et">${hafta}. hafta</text>`);
      let cizgi = ""; for (let i = 1; i <= hafta && i <= 16; i++) cizgi += `<text x="${260 + ((i - 1) % 4) * 52}" y="${40 + Math.floor((i - 1) / 4) * 34}" class="cn-et2">${k}${x}${i}=${k * i}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 480 190" role="img" aria-label="Kumbara">${sv.join("")}${cizgi}</svg>`;
      s.dur.innerHTML = hafta ? `${hafta}. hafta sonunda kumbarada ${k} ${x} ${hafta} = <b>${top} TL</b> var.` : `Kumbara boş. Her hafta ${k} TL atılıyor.`;
    }
    bA.onclick = () => { hafta++; ciz(); };
    bO.onclick = () => { if (tmr) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } bO.textContent = "❚❚ Durdur"; tmr = setInterval(() => { if (hafta >= 15) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } hafta++; ciz(); }, az ? 50 : 500); };
    bS.onclick = () => { hafta = 0; ciz(); };
    bT.onclick = () => {
      const v = Math.round(+ti.value); if (!v) return; const b = Math.floor(v / k), r = v % k;
      s.dur.innerHTML = r ? `<span class="kotu">✘</span> ${k} ${x} ${b} = ${k * b} TL, ${k} ${x} ${b + 1} = ${k * (b + 1)} TL. ${v} TL arada kalır (${v} : ${k} → kalan ${r}). Kumbarada hiçbir hafta ${v} TL olmaz.`
        : `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · ${b}. hafta sonunda kumbarada tam ${v} TL olur.`;
      if (!r) { hafta = b; ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · <b>${b}. hafta</b> sonunda kumbarada tam ${v} TL olur.`; }
      s.yaz("t" + v, [v + " TL", r ? `kalan ${r} ✘` : `${k} ${x} ${b} ✔`], !r);
    };
    ciz();
  }

  /* 9) ÖNERME LABORATUVARI: önermeyi farklı sayılarla sınama */
  function ONERME(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Önerme", "Sayı", "Sonuç"] });
    let akt = 0; const kut = h("div", "cn-hazir");
    const bt = o.onermeler.map((on, i) => { const b = dug(on.ad, "ghost"); b.setAttribute("aria-pressed", i === 0); b.onclick = () => { akt = i; bt.forEach((x, j) => x.setAttribute("aria-pressed", j === i)); goster(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Sınanacak sayı: <input type="number" inputmode="numeric" min="1" max="200" value="12"></label>`;
    const bT = dug("Sına"), bR = dug("Rastgele sayı", "ghost"); test.append(bT, bR); s.den.appendChild(test); const ti = test.querySelector("input");
    function goster() { s.sah.innerHTML = `<div class="cn-onr"><b>${o.onermeler[akt].ad}:</b> “${o.onermeler[akt].metin}”</div>`; s.dur.innerHTML = "Bir sayı yazıp Sına düğmesine basın. Önerme her sayıda doğru mu?"; }
    function sina(n) {
      const on = o.onermeler[akt], r = on.sina(n);
      s.sah.innerHTML = `<div class="cn-onr"><b>${on.ad}:</b> “${on.metin}”</div><div class="cn-kanit">${r.goster}</div>`;
      s.dur.innerHTML = (r.ok ? `<span class="iyi">✔</span> ${n} için önerme doğru.` : `<span class="kotu">✘</span> ${n} için önerme yanlış! Bir karşı örnek bulundu.`) + (r.not ? " " + r.not : "");
      s.yaz(akt + ":" + n, [on.ad, n, r.ok ? "doğru" : "yanlış (karşı örnek)"], r.ok);
    }
    bT.onclick = () => { const n = Math.round(+ti.value); if (n > 0) sina(n); };
    bR.onclick = () => { const n = 2 + Math.floor(Math.random() * 59); ti.value = n; sina(n); };
    goster();
  }


  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →
     koşullar tek tek denetlenir (✔/✘) → deney defterine yazılır. Doğru cevap verilmez; öğrenci uygun girdiyi kendisi arar.
     o.girdi: [{ad, min, max, bas} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → SVG/HTML · o.kosullar: [{ad, f(v) → bool | {ok, not}}]
     o.dugme: düğme yazısı (false → her değişiklikte denetlenir) · o.sonuc(v, hepsi, L) · o.satir(v, hepsi, L) · o.iyi(v, L) · o.ek: [{ad, deger(v) → v}] */
  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);
      s.dur.innerHTML = m;
      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);
    }
    kur = true; ciz();
    if (bS) s.dur.innerHTML = o.ilk || "Değerleri seçip Sına düğmesine basın."; else sina();
  }

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

/* MAT.7.2.1 · Cebirsel İfadelerle İşlemler — bağlam sorularının "Canlandır" düzenekleri (14.10.2026) — ortak motor: canlandir.js (CN.KOSUL); yeni motor yok.
   Her düzenek: öğrenci değişkenin değerini ya da bir seçimi − / + sayaçlarıyla ya da düğmelerle değiştirir → sahne anında çizilir → koşullar denetlenir →
   deneme deney defterine yazılır → yeniden dener. Doğru cevap bir düğmeyle verilmez; denemelerden çıkar (§4.k, §19-10).
   İfadeler düz metinle (3x + 2) yazılır; kesirler a/b biçiminde, kesir_cizgi.js üst üste çizer. Eksi U+2212. */
window.CANL = (() => {
  if (!document.getElementById("c721-stil")) { const st = document.createElement("style"); st.id = "c721-stil";
    st.textContent = ".cn-btn{min-width:44px;min-height:44px}.cn-adimci button{min-width:44px;min-height:44px}.c721-k{text-align:center;font-size:17px;font-weight:800;margin:8px auto;max-width:640px;line-height:1.6}.c721-t{margin:6px auto;border-collapse:collapse;font-size:15px}.c721-t td,.c721-t th{border:1px solid #ced4da;padding:4px 10px;text-align:center}.c721-t th{background:#eef7f2}"; document.head.appendChild(st); }
  const E = "−";
  const S = n => (n < 0 ? E + (-n) : String(n));
  const ifd = (a, b, v = "x") => { let s = a === 0 ? "" : a === 1 ? v : a === -1 ? E + v : S(a) + v; if (b) s += s ? (b < 0 ? " − " + (-b) : " + " + b) : S(b); return s || "0"; };
  const svg = (w, h, ic, ad) => `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;height:auto;display:block;margin:0 auto" role="img" aria-label="${ad}">${ic}</svg>`;
  const tx = (x, y, s, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.an || "middle"}" style="font-size:${o.fs || 14}px;font-weight:800;fill:${o.r || "#1d2433"}">${s}</text>`;
  const kutu = h => `<div class="c721-k">${h}</div>`;
  const tablo = (bas, sat) => `<table class="c721-t"><tr>${bas.map(b => `<th>${b}</th>`).join("")}</tr>${sat.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;
  function karolar(px, nx, pu, nu, W = 420) { let s = "", x = 10; const k = (X, Y, w, h, p, et) => `<rect x="${X}" y="${Y}" width="${w}" height="${h}" rx="3" fill="${p ? "#a5d8ff" : "#ffc078"}" stroke="${p ? "#1c7ed6" : "#d9480f"}" stroke-width="1.5"/>` + tx(X + w / 2, Y + h / 2 + 5, (p ? "" : E) + et, { fs: 12 });
    for (let i = 0; i < px; i++) { s += k(x, 10, 20, 60, 1, "x"); x += 25; } for (let i = 0; i < nx; i++) { s += k(x, 10, 20, 60, 0, "x"); x += 25; }
    x = 10; for (let i = 0; i < pu; i++) { s += k(x, 80, 20, 20, 1, "1"); x += 25; } for (let i = 0; i < nu; i++) { s += k(x, 80, 20, 20, 0, "1"); x += 25; }
    return svg(W, 110, s, "Karolar"); }
  function cubuklar(L, W = 420) { const top = L.reduce((t, p) => t + p[1], 0), u = (W - 20) / Math.max(top, 1); let x = 10, s = "";
    L.forEach(([et, l, r]) => { s += `<rect x="${x}" y="14" width="${l * u - 2}" height="34" rx="4" fill="${r}" stroke="#495057" stroke-opacity=".6"/>` + tx(x + l * u / 2, 37, et, { fs: 12 }); x += l * u; });
    return svg(W, 60, s, "Çubuklar"); }
  function dik(en, boy, parca, W = 420) { const u = Math.min((W - 80) / en, 120 / boy); let s = `<rect x="50" y="10" width="${en * u}" height="${boy * u}" fill="#d0e3fb" stroke="#1d2433" stroke-width="2"/>`;
    if (parca) s += `<line x1="${50 + parca * u}" y1="10" x2="${50 + parca * u}" y2="${10 + boy * u}" stroke="#1d2433" stroke-width="2" stroke-dasharray="6 4"/>`;
    return svg(W, boy * u + 24, s, "Dikdörtgen"); }
  const KO = (el, o) => CN.KOSUL(el, Object.assign({ dugme: false }, o));

  return {
    /* 1 · Su faturası: katsayının anlamı */
    1: el => KO(el, { girdi: [{ ad: "Kullanılan su (m³)", min: 0, max: 8, bas: 3 }],
        ciz: v => { const m = v[0], t = 45 + 18 * m, t2 = 45 + 18 * (m + 1); return kutu(`m = ${m}: 45 + 18 · ${m} = ${t} TL<br>m = ${m + 1}: 45 + 18 · ${m + 1} = ${t2} TL<br>Fark: ${t2 - t} TL`); },
        kosullar: [{ ad: "Su 1 m³ arttığında fatura katsayı (18) kadar artıyor.", f: v => 18 * (v[0] + 1) - 18 * v[0] === 18 }, { ad: "Hiç su kullanılmadığında (m = 0) yalnız sabit terim ödeniyor.", f: v => v[0] === 0 }],
        sutun: ["m", "Tutar", "1 m³ fazlasının tutarı", "Fark"], satir: v => [v[0], `${45 + 18 * v[0]} TL`, `${45 + 18 * (v[0] + 1)} TL`, "18 TL"],
        yon: "Kullanılan suyu değiştirin. Her denemede m ile m + 1 için faturayı karşılaştırın; m = 0'ı da deneyin.", bitis: "18 sayısının ve 45 sayısının ne anlattığını defterden çıkardığınızda." }),

    /* 2 · Kırtasiye fişi: para üstü */
    2: el => KO(el, { girdi: [{ ad: "Kalemin fiyatı (k):", sec: ["8", "10", "12"], bas: "8" }, { ad: "Defterin fiyatı (d):", sec: ["15", "20", "25"], bas: "15" }],
        ciz: v => { const k = +v[0], d = +v[1], o = 4 * k + 3 * d; return kutu(`Alışveriş: 4 · ${k} + 3 · ${d} = ${o} TL<br>Para üstü: 200 − ${o} = <b>${200 - o} TL</b><br>200 − 4k − 3d = ${200 - 4 * k - 3 * d} · 200 − 4k + 3d = ${200 - 4 * k + 3 * d}`); },
        kosullar: [{ ad: "200 − 4k − 3d gerçek para üstünü veriyor.", f: v => true }, { ad: "200 − 4k + 3d gerçek para üstünü veriyor.", f: v => 3 * (+v[1]) === 0 }],
        sutun: ["k", "d", "Para üstü", "200 − 4k + 3d"], satir: v => [v[0], v[1], 200 - 4 * v[0] - 3 * v[1], 200 - 4 * v[0] + 3 * v[1]],
        yon: "Kalem ve defter fiyatlarını değiştirin; para üstünü iki ifadeyle karşılaştırın.", bitis: "Hangi ifadenin her fiyatta doğru olduğunu defterden çıkardığınızda." }),

    /* 3 · Karo modeli: sıfır çiftleri */
    3: el => KO(el, { girdi: [{ ad: "Kaldırılan x sıfır çifti", min: 0, max: 2, bas: 0 }, { ad: "Kaldırılan birim sıfır çifti", min: 0, max: 3, bas: 0 }],
        ciz: v => karolar(4 - v[0], 2 - v[0], 3 - v[1], 5 - v[1]) + kutu(`Tezgâh: (4x + 3) + (−2x − 5) → değeri hep aynı`),
        kosullar: [{ ad: "Bütün x sıfır çiftleri kaldırıldı.", f: v => v[0] === 2 }, { ad: "Bütün birim sıfır çiftleri kaldırıldı.", f: v => v[1] === 3 }],
        sutun: ["x çifti", "Birim çifti", "Kalan karolar"], satir: v => [v[0], v[1], `${4 - v[0]} mavi, ${2 - v[0]} turuncu x · ${3 - v[1]} mavi, ${5 - v[1]} turuncu birim`],
        yon: "Sıfır çiftlerini birer birer kaldırın. Sıfır çifti kalmayınca kalan karolar toplamın en sade hâlini gösterir.", bitis: "Sıfır çifti kalmayıp kalan karoları ifade olarak okuduğunuzda." }),

    /* 4 · Oyuncak trenler */
    4: el => KO(el, { girdi: [{ ad: "Vagon uzunluğu v (cm)", min: 4, max: 12, bas: 6 }],
        ciz: v => { const a = v[0]; return cubuklar([["9", 9, "#ced4da"], ["v", a, "#a5d8ff"], ["v", a, "#a5d8ff"], ["14", 14, "#ced4da"], ["v", a, "#a5d8ff"], ["v", a, "#a5d8ff"], ["v", a, "#a5d8ff"]]) + kutu(`Ölçülen: ${9 + 14 + 5 * a} cm · 5v + 23 = ${5 * a + 23} cm · 28v = ${28 * a} cm`); },
        kosullar: [{ ad: "5v + 23 ölçülen uzunluğa eşit.", f: v => true }, { ad: "28v ölçülen uzunluğa eşit.", f: v => 28 * v[0] === 5 * v[0] + 23 }],
        sutun: ["v", "Ölçülen", "5v + 23", "28v"], satir: v => [v[0], 5 * v[0] + 23, 5 * v[0] + 23, 28 * v[0]],
        yon: "Vagon uzunluğunu değiştirin; birleşen treni ölçün ve iki ifadeyle karşılaştırın.", bitis: "Hangi ifadenin her uzunlukta doğru olduğunu bulduğunuzda." }),

    /* 5 · Pastane kutuları */
    5: el => KO(el, { girdi: [{ ad: "Bir paketteki kurabiye (k)", min: 2, max: 9, bas: 4 }],
        ciz: v => { const k = v[0], b = 4 * k + 3; return kutu(`Bir kutu: 4 · ${k} + 3 = ${b} tatlı<br>5 kutu: 5 · ${b} = <b>${5 * b}</b><br>20k + 15 = ${20 * k + 15} · 20k + 3 = ${20 * k + 3}`); },
        kosullar: [{ ad: "20k + 15 toplamı veriyor.", f: v => true }, { ad: "20k + 3 toplamı veriyor.", f: v => false }],
        sutun: ["k", "5 kutu", "20k + 15", "20k + 3"], satir: v => [v[0], 5 * (4 * v[0] + 3), 20 * v[0] + 15, 20 * v[0] + 3],
        yon: "k'yi değiştirin; 5 kutudaki tatlıları sayıp iki ifadeyle karşılaştırın.", bitis: "Dağılmada 3'ün de 5 ile çarpılması gerektiğini defterden gördüğünüzde." }),

    /* 6 · Bahçe çevresi */
    6: el => KO(el, { girdi: [{ ad: "x (m)", min: 1, max: 9, bas: 3 }],
        ciz: v => { const x = v[0]; return dik(x + 7, x) + kutu(`Kenarlar: ${x + 7} m ve ${x} m · Tel: ${2 * (2 * x + 7)} m<br>Deniz: 2(x + 7 + x) = ${2 * (2 * x + 7)} · Emre: 4x + 14 = ${4 * x + 14}`); },
        kosullar: [{ ad: "Deniz'in ifadesi tel uzunluğunu veriyor.", f: v => true }, { ad: "Emre'nin ifadesi tel uzunluğunu veriyor.", f: v => true }],
        sutun: ["x", "Tel", "Deniz", "Emre"], satir: v => [v[0], 2 * (2 * v[0] + 7), 2 * (2 * v[0] + 7), 4 * v[0] + 14],
        yon: "x'i değiştirin; iki öğrencinin ifadesini gerçek tel uzunluğuyla karşılaştırın.", bitis: "İki ifadenin her x için aynı sonucu verdiğini gördüğünüzde." }),

    /* 7 · Fidanlık */
    7: el => KO(el, { girdi: [{ ad: "f", min: 5, max: 15, bas: 8 }],
        ciz: v => { const f = v[0], a = 6 * f + 15, s = 2 * f - 4; return kutu(`Fidan: ${a} · Satılan: ${s} · Kalan: <b>${a - s}</b><br>4f + 19 = ${4 * f + 19} · 4f + 11 = ${4 * f + 11}`); },
        kosullar: [{ ad: "4f + 19 kalan fidanı veriyor.", f: v => true }, { ad: "4f + 11 kalan fidanı veriyor.", f: v => false }],
        sutun: ["f", "Kalan", "4f + 19", "4f + 11"], satir: v => [v[0], 4 * v[0] + 19, 4 * v[0] + 19, 4 * v[0] + 11],
        yon: "f'yi değiştirin; kalan fidanı iki ifadeyle karşılaştırın.", bitis: "−(2f − 4) yazarken −4'ün işaretinin neden değiştiğini fark ettiğinizde." }),

    /* 8 · İki parselli tarla */
    8: el => KO(el, { girdi: [{ ad: "x (m)", min: 2, max: 9, bas: 4 }],
        ciz: v => { const x = v[0]; return dik(2 * x + 5, 9, 2 * x) + kutu(`Domates: 9 · ${2 * x} = ${18 * x} m² · Biber: 9 · 5 = 45 m²<br>Toplam: ${18 * x + 45} m² · 18x + 45 = ${18 * x + 45}`); },
        kosullar: [{ ad: "18x + 45 iki parselin toplam alanına eşit.", f: v => true }],
        sutun: ["x", "Domates", "Biber", "Toplam"], satir: v => [v[0], 18 * v[0], 45, 18 * v[0] + 45],
        yon: "x'i değiştirin; iki parselin alanlarını toplayıp ifadeyle karşılaştırın.", bitis: "9'un iki parçayla da çarpıldığını gördüğünüzde." }),

    /* 9 · Reçel kolileri */
    9: el => KO(el, { girdi: [{ ad: "m", min: 1, max: 8, bas: 2 }],
        ciz: v => { const m = v[0], t = 15 * m + 20; return kutu(`Kavanoz: ${t} · 5 koli: her biri ${t} : 5 = <b>${t / 5}</b><br>3m + 4 = ${3 * m + 4} · 3m + 20 = ${3 * m + 20}`); },
        kosullar: [{ ad: "3m + 4 bir kolideki kavanoz sayısını veriyor.", f: v => true }, { ad: "3m + 20 bir kolideki kavanoz sayısını veriyor.", f: v => false }],
        sutun: ["m", "Bir koli", "3m + 4", "3m + 20"], satir: v => [v[0], (15 * v[0] + 20) / 5, 3 * v[0] + 4, 3 * v[0] + 20],
        yon: "m'yi değiştirin; kavanozları 5 koliye paylaştırıp iki ifadeyle karşılaştırın.", bitis: "5'e bölmenin iki terime de uygulandığını gördüğünüzde." }),

    /* 10 · L biçimli oda */
    10: el => KO(el, { girdi: [{ ad: "a (m)", min: 2, max: 6, bas: 3 }],
        ciz: v => { const a = v[0], k = [5 * a + 2, a + 1, 3 * a + 2, 2 * a, 2 * a, 3 * a + 1]; const top = k.reduce((s, x) => s + x, 0);
          return kutu(`Kenarlar: ${k.join(" + ")} = <b>${top}</b> m<br>16a + 6 = ${16 * a + 6} · 11a + 4 = ${11 * a + 4}`); },
        kosullar: [{ ad: "16a + 6 bütün kenarların toplamına eşit.", f: v => true }, { ad: "11a + 4 bütün kenarların toplamına eşit.", f: v => false }],
        sutun: ["a", "Kenarların toplamı", "16a + 6", "11a + 4"], satir: v => [v[0], 16 * v[0] + 6, 16 * v[0] + 6, 11 * v[0] + 4],
        yon: "a'yı değiştirin; altı kenarın hepsini toplayıp iki ifadeyle karşılaştırın.", bitis: "Verilmeyen iki kenarı da toplamaya kattığınızda." }),

    /* 11 · Bora'nın sonucu: karşı örnek */
    11: el => KO(el, { girdi: [{ ad: "k:", sec: ["−1", "0", "1", "2", "3"], bas: "1" }],
        ciz: v => { const k = +v[0].replace(E, "-"); return kutu(`4(k − 1) + 2 = ${S(4 * (k - 1) + 2)} · Selin: 4k − 2 = ${S(4 * k - 2)} · Bora: 6k − 4 = ${S(6 * k - 4)}`); },
        kosullar: [{ ad: v => `k = ${v[0]} Bora'nın ifadesi için karşı örnek.`, f: v => { const k = +v[0].replace(E, "-"); return 6 * k - 4 !== 4 * (k - 1) + 2; } }],
        sutun: ["k", "Başlangıç", "Bora", "Karşı örnek mi?"], satir: v => { const k = +v[0].replace(E, "-"); return [v[0], S(4 * (k - 1) + 2), S(6 * k - 4), 6 * k - 4 !== 4 * (k - 1) + 2 ? "Evet" : "Hayır"]; },
        yon: "k'ye farklı değerler verin; Bora'nın ifadesinin başlangıçtaki ifadeden farklı değer verdiği sayıları bulun.", bitis: "Karşı örnek olmayan değeri defterden bulduğunuzda." }),

    /* 12 · Bilgi yarışması */
    12: el => KO(el, { girdi: [{ ad: "Doğru cevap (d)", min: 0, max: 20, bas: 12 }],
        ciz: v => { const d = v[0], y = 20 - d, p = 4 * d - y; return kutu(`Doğru: ${d} · Yanlış: ${y}<br>Puan: 4 · ${d} − ${y} = <b>${S(p)}</b><br>5d − 20 = ${S(5 * d - 20)} · 3d − 20 = ${S(3 * d - 20)}`); },
        kosullar: [{ ad: "5d − 20 puanı veriyor.", f: v => true }, { ad: "3d − 20 puanı veriyor.", f: v => v[0] === 0 }],
        sutun: ["d", "Puan", "5d − 20", "3d − 20"], satir: v => [v[0], S(5 * v[0] - 20), S(5 * v[0] - 20), S(3 * v[0] - 20)],
        yon: "Doğru cevap sayısını değiştirin; puanı hesaplayıp iki ifadeyle karşılaştırın.", bitis: "−(20 − d) = −20 + d olduğunu fark ettiğinizde." }),

    /* 13 · İki fesleğen */
    13: el => KO(el, { girdi: [{ ad: "Hafta (h)", min: 0, max: 7, bas: 0 }],
        ciz: v => { const h = v[0], A = 13 + 2 * h, B = 6 + 3 * h, u = 300 / 30; return svg(420, 96, `<rect x="40" y="10" width="${A * u}" height="30" rx="4" fill="#b2f2bb" stroke="#2b8a3e"/>${tx(28, 31, "A")}<rect x="40" y="54" width="${B * u}" height="30" rx="4" fill="#d0e3fb" stroke="#1c5fbf"/>${tx(28, 75, "B")}`, "Boylar") + kutu(`A: ${A} cm · B: ${B} cm · Fark: ${S(A - B)} cm · 7 − h = ${S(7 - h)}`); },
        kosullar: [{ ad: "Fark 7 − h ifadesine eşit.", f: v => true }],
        sutun: ["h", "A", "B", "Fark"], satir: v => [v[0], 13 + 2 * v[0], 6 + 3 * v[0], S(7 - v[0])],
        yon: "Haftayı birer birer artırın; farkın her hafta nasıl değiştiğini defterden izleyin.", bitis: "Farkın her hafta kaç santimetre değiştiğini bulduğunuzda." }),

    /* 14 · Karoların gösterdiği ifade */
    14: el => KO(el, { girdi: [{ ad: "İfade:", sec: ["5x − 2x + 4 − 6", "3(x − 1) + 1", "x + 2(x − 1)", "3x + 2"], bas: "3x + 2" }, { ad: "x:", sec: ["−1", "0", "2"], bas: "0" }],
        ciz: v => { const x = +v[1].replace(E, "-"); const f = { "5x − 2x + 4 − 6": 3 * x - 2, "3(x − 1) + 1": 3 * (x - 1) + 1, "x + 2(x − 1)": x + 2 * (x - 1), "3x + 2": 3 * x + 2 }[v[0]];
          return karolar(5, 2, 4, 6) + kutu(`Karolar (3x − 2): ${S(3 * x - 2)} · ${v[0]}: ${S(f)}`); },
        kosullar: [{ ad: "Seçilen ifade bu x için karolarla aynı değeri veriyor.", f: v => { const x = +v[1].replace(E, "-"); return ({ "5x − 2x + 4 − 6": 3 * x - 2, "3(x − 1) + 1": 3 * (x - 1) + 1, "x + 2(x − 1)": x + 2 * (x - 1), "3x + 2": 3 * x + 2 })[v[0]] === 3 * x - 2; } }],
        sutun: ["İfade", "x", "Karolar", "İfade"], satir: v => { const x = +v[1].replace(E, "-"); return [v[0], v[1], S(3 * x - 2), S({ "5x − 2x + 4 − 6": 3 * x - 2, "3(x − 1) + 1": 3 * (x - 1) + 1, "x + 2(x − 1)": x + 2 * (x - 1), "3x + 2": 3 * x + 2 }[v[0]])]; },
        yon: "Bir ifade ve bir x değeri seçin; karoların değeriyle karşılaştırın. Her ifadeyi birkaç değerle deneyin.", bitis: "Denk olmayan ifadeyi bir karşı örnekle bulduğunuzda." }),

    /* 15 · Spor salonu duvarı */
    15: el => KO(el, { girdi: [{ ad: "x (m)", min: 1, max: 6, bas: 2 }, { ad: "Asılan afiş", min: 0, max: 2, bas: 0 }],
        ciz: v => { const x = v[0], a = 6 * (2 * x + 7) - 6 * v[1]; return dik(2 * x + 7, 6) + kutu(`Duvar: 6 · ${2 * x + 7} = ${6 * (2 * x + 7)} m² · Afişler: ${v[1]} · 6 = ${6 * v[1]} m²<br>Örtülmeyen: <b>${a}</b> m² · 12x + 30 = ${12 * x + 30}`); },
        kosullar: [{ ad: "İki afiş de asıldı.", f: v => v[1] === 2 }, { ad: "12x + 30 örtülmeyen alana eşit.", f: v => 6 * (2 * v[0] + 7) - 6 * v[1] === 12 * v[0] + 30 }],
        sutun: ["x", "Afiş", "Örtülmeyen", "12x + 30"], satir: v => [v[0], v[1], 6 * (2 * v[0] + 7) - 6 * v[1], 12 * v[0] + 30],
        yon: "x'i ve asılan afiş sayısını değiştirin; örtülmeyen alanı ifadeyle karşılaştırın.", bitis: "İki afiş asılınca alanın 12x + 30 olduğunu gördüğünüzde." }),

    /* 16 · Düğün salonu masaları */
    16: el => KO(el, { girdi: [{ ad: "Masa (n)", min: 1, max: 6, bas: 1 }, { ad: "İfade:", sec: ["2(n + 1)", "4n − 2(n − 1)", "4n − 2", "n + n + 2"], bas: "4n − 2" }],
        ciz: v => { const n = v[0]; const f = { "2(n + 1)": 2 * (n + 1), "4n − 2(n − 1)": 4 * n - 2 * (n - 1), "4n − 2": 4 * n - 2, "n + n + 2": 2 * n + 2 }[v[1]];
          let s = ""; for (let i = 0; i < n; i++) s += `<rect x="${40 + i * 44}" y="30" width="44" height="44" fill="#f3d9b1" stroke="#8d5a2b"/><circle cx="${62 + i * 44}" cy="18" r="8" fill="#d0e3fb" stroke="#1c5fbf"/><circle cx="${62 + i * 44}" cy="86" r="8" fill="#d0e3fb" stroke="#1c5fbf"/>`;
          s += `<circle cx="26" cy="52" r="8" fill="#d0e3fb" stroke="#1c5fbf"/><circle cx="${54 + n * 44}" cy="52" r="8" fill="#d0e3fb" stroke="#1c5fbf"/>`;
          return svg(360, 100, s, "Masalar") + kutu(`Sayılan sandalye: ${2 * n + 2} · ${v[1]} = ${f}`); },
        kosullar: [{ ad: "Seçilen ifade sayılan sandalyelere eşit.", f: v => ({ "2(n + 1)": 2 * (v[0] + 1), "4n − 2(n − 1)": 4 * v[0] - 2 * (v[0] - 1), "4n − 2": 4 * v[0] - 2, "n + n + 2": 2 * v[0] + 2 })[v[1]] === 2 * v[0] + 2 }],
        sutun: ["n", "İfade", "Sayılan", "İfadenin değeri"], satir: v => [v[0], v[1], 2 * v[0] + 2, ({ "2(n + 1)": 2 * (v[0] + 1), "4n − 2(n − 1)": 4 * v[0] - 2 * (v[0] - 1), "4n − 2": 4 * v[0] - 2, "n + n + 2": 2 * v[0] + 2 })[v[1]]],
        yon: "Masa sayısını ve öğrencilerin ifadelerini değiştirin; sayılan sandalyelerle karşılaştırın.", bitis: "Sandalye sayısını göstermeyen ifadeyi bulduğunuzda." }),

    /* 17 · Şube tablosu */
    17: el => KO(el, { girdi: [{ ad: "a", min: 3, max: 9, bas: 5 }],
        ciz: v => { const a = v[0]; return kutu(tablo(["Şube", "Kız", "Erkek"], [["7-A", 2 * a + 3, a - 1], ["7-B", a + 4, `${3 * a + 2} − ${a - 1} = ${2 * a + 3}`], ["Toplam", 3 * a + 7, 3 * a + 2]]) + `7-B'nin toplamı: ${a + 4} + ${2 * a + 3} = <b>${3 * a + 7}</b> · 3a + 7 = ${3 * a + 7} · 3a + 5 = ${3 * a + 5}`); },
        kosullar: [{ ad: "3a + 7, 7-B'nin toplamına eşit.", f: v => true }, { ad: "3a + 5, 7-B'nin toplamına eşit.", f: v => false }],
        sutun: ["a", "7-B erkek", "7-B toplam", "3a + 5"], satir: v => [v[0], 2 * v[0] + 3, 3 * v[0] + 7, 3 * v[0] + 5],

const V={"baslik": "Cebirsel İfadelerle İşlemler", "kod": "7. SINIF · MAT.7.2.1", "ses": "", "bet": "BAĞLAM TEMELLİ SORU", "bad": "Bağlam Soruları", "s": [{"no": 1, "bas": "Cebirsel ifadenin öğeleri", "q": [{"k": "Bir fırında simidin tanesi s TL, poğaçanın tanesi p TL'dir. Bir öğrenci 3 simit ve 2 poğaça alıp 100 TL'lik banknotla ödeme yapmıştır. Para üstünü gösteren ifadeyi yazınız; terimlerini, katsayılarını ve sabit terimini bir tabloda gösteriniz.", "a": ["Ödenen tutar 3s + 2p'dir; para üstü 100 − (3s + 2p) = 100 − 3s − 2p.", "Terimler: 100, −3s ve −2p.", "s'nin katsayısı −3, p'nin katsayısı −2, sabit terim 100'dür."], "c": "100 − 3s − 2p"}, {"k": "Bir fırın açıldıktan d dakika sonra içindeki sıcaklık (22 + 18d) °C olmaktadır (ilk birkaç dakika için). İfadedeki 18 ve 22 sayılarının bu bağlamdaki anlamını açıklayınız.", "a": ["Sabit terim 22: d = 0 iken, yani fırın açıldığı anda sıcaklık 22 °C'dir.", "Katsayı 18: Her dakika sıcaklık 18 °C artar.", "Katsayı pozitif olduğu için sıcaklık artmaktadır."], "c": "22: başlangıç sıcaklığı; 18: dakikadaki artış"}]}, {"no": 2, "bas": "Benzer terimler", "q": [{"k": "9y, −2,7x, <span class=\"frac\"><span>y</span><span>2</span></span>, 4x<sup>2</sup>, −x, <span class=\"frac\"><span>x<sup>2</sup></span><span>3</span></span> ve 9 terimlerini benzer terim gruplarına ayırınız.", "a": ["Değişkeni y olanlar: 9y ve <span class=\"frac\"><span>y</span><span>2</span></span>.", "Değişkeni x olanlar: −2,7x ve −x. Değişkeni x<sup>2</sup> olanlar: 4x<sup>2</sup> ve <span class=\"frac\"><span>x<sup>2</sup></span><span>3</span></span>; x ile x<sup>2</sup> benzer değildir.", "Sabit terim: 9. 9y ile 9'un katsayısı aynı görünse de benzer değildir."], "c": "4 grup: y'li, x'li, x<sup>2</sup>'li ve sabit terim"}, {"k": "5m − 3n + 2 + 4mn − 7m + n ifadesinde benzer terimi olmayan terimleri gerekçesiyle belirleyiniz.", "a": ["5m ile −7m benzerdir; −3n ile n benzerdir.", "2 tek sabit terimdir; başka sabit terim yoktur.", "4mn'nin değişkenleri m ve n'd ke=\"#d9480f\" stroke-width=\"1.4\"/><text x=\"224.0\" y=\"214.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">negatif</text></svg>", "son": "", "k": "Buna göre, iki ifadenin toplamının en sade hâli aşağıdakilerden hangisidir?", "sec": ["6x + 8", "2x + 2", "6x − 2", "2x − 2"], "secg": null, "c": "D", "a": ["1. ifade 4x + 3, 2. ifade −2x − 5'tir.", "İki x çifti ve üç birim çifti sıfır çiftidir; kaldırılır.", "Geriye 2 tane x ve 2 tane −1 kalır: 2x − 2."], "t": "6x + 8: turuncu karolar da pozitif sayılmış; 2x + 2: birim karolarda işaret karıştırılmış; 6x − 2: x şeritlerinin işareti yok sayılmış", "d": "Önce her ifadeyi karolardan okuyunuz. Bir pozitif ile bir negatif karo sıfır çiftidir; kaldırınca kalan karolar sonucu verir.", "ses": "b03"}, {"no": 4, "on": "<p>Ali ve Can oyuncak trenlerini uç uca birleştirmiştir. Ali'nin treni 9 cm uzunluğunda bir lokomotif ile her biri v cm olan 2 vagondan, Can'ın treni 14 cm uzunluğunda bir lokomotif ile her biri v cm olan 3 vagondan oluşmaktadır.</p>", "g": "<svg viewBox=\"0 0 352 96\" width=\"352\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><text x=\"48.0\" y=\"30.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">Ali</text><rect x=\"60\" y=\"10\" width=\"54\" height=\"30\" rx=\"3\" fill=\"#f1f3f5\" stroke=\"#495057\" stroke-width=\"1.6\"/><text x=\"87.0\" y=\"30.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">9 cm</text><rect x=\"114\" y=\"10\" width=\"70\" height=\"30\" rx=\"3\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"1.6\"/><text x=\"149.0\" y=\"30.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">v</text><rect x=\"184\" y=\"10\" width=\"70\" height=\"30\" rx=\"3\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"1.6\"/><text x=\"219.0\" y=\"30.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">v</text><text x=\"48.0\" y=\"76.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">Can</text><rect x=\"60\" y=\"56\" width=\"70\" height=\"30\" rx=\"3\" fill=\"#f1f3f5\" stroke=\"#495057\" stroke-width=\"1.6\"/><text x=\"95.0\" y=\"76.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">14 cm</text><rect x=\"130\" y=\"56\" width=\"70\" height=\"30\" rx=\"3\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"1.6\"/><text x=\"165.0\" y=\"76.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">v</text><rect x=\"200\" y=\"56\" width=\"70\" height=\"30\" rx=\"3\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"1.6\"/><text x=\"235.0\" y=\"76.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">v</text><rect x=\"270\" y=\"56\" width=\"70\" height=\"30\" rx=\"3\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"1.6\"/><text x=\"305.0\" y=\"76.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">v</text></svg>", "son": "", "k": "Buna göre, birleşen trenin uzunluğunu santimetre cinsinden gösteren ifade aşağıdakilerden hangisidir?", "sec": ["28v", "5v + 9", "5v + 23", "6v + 23"], "secg": null, "c": "C", "a": ["Ali'nin treni (2v + 9) cm, Can'ın treni (3v + 14) cm'dir.", "Benzer terimleri toplayınız: 2v + 3v = 5v; 9 + 14 = 23.", "Birleşen tren (5v + 23) cm'dir."], "t": "28v: benzer olmayan terimler birleştirilmiş; 5v + 9: Can'ın lokomotifi unutulmuş; 6v + 23: vagonlar 2 · 3 diye çarpılmış", "d": "Yalnız benzer terimler toplanır: v'li terimler kendi aralarında, sayılar kendi aralarında. 5v ile 23 birleşmez.", "ses": "b04"}, {"no": 5, "on": "<p>Bir pastane hediye kutularının her birine (4k + 3) tatlı koymaktadır (k: bir paketteki kurabiye sayısı). Pastane bu kutulardan 5 tane hazırlamıştır.</p>", "g": "<svg viewBox=\"0 0 668 62\" width=\"668\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"120\" height=\"46\" rx=\"9\" fill=\"#e7f5ff\" stroke=\"#1c5fbf\" stroke-width=\"1.6\"/><text x=\"68.0\" y=\"36.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">4k + 3</text><rect x=\"140\" y=\"8\" width=\"120\" height=\"46\" rx=\"9\" fill=\"#e7f5ff\" stroke=\"#1c5fbf\" stroke-width=\"1.6\"/><text x=\"200.0\" y=\"36.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">4k + 3</text><rect x=\"272\" y=\"8\" width=\"120\" height=\"46\" rx=\"9\" fill=\"#e7f5ff\" stroke=\"#1c5fbf\" stroke-width=\"1.6\"/><text x=\"332.0\" y=\"36.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">4k + 3</text><rect x=\"404\" y=\"8\" width=\"120\" height=\"46\" rx=\"9\" fill=\"#e7f5ff\" stroke=\"#1c5fbf\" stroke-width=\"1.6\"/><text x=\"464.0\" y=\"36.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">4k + 3</text><rect x=\"536\" y=\"8\" width=\"120\" height=\"46\" rx=\"9\" fill=\"#e7f5ff\" stroke=\"#1c5fbf\" stroke-width=\"1.6\"/><text x=\"596.0\" y=\"36.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">4k + 3</text></svg>", "son": "<p>Kartların her biri bir kutuyu ve kutudaki tatlı sayısını göstermektedir.</p>", "k": "Buna göre, 5 kutudaki toplam tatlı sayısını gösteren ifade aşağıdakilerden hangisidir?", "sec": ["20k + 15", "20k + 3", "9k + 8", "4k + 15"], "secg": null, "c": "A", "a": ["Toplam: 5 · (4k + 3).", "Dağılma özelliğiyle 5 her terimle çarpılır: 5 · 4k + 5 · 3.", "20k + 15."], "t": "20k + 3: yalnız ilk terim çarpılmış; 9k + 8: çarpma yerine toplama yapılmış; 4k + 15: yalnız sabit terim çarpılmış", "d": "Dağılma özelliğinde sayı parantezin içindeki her terimle çarpılır; yalnız ilk terimi çarpmak sık yapılan bir hatadır.", "ses": "b05"}, {"no": 6, "on": "<p>Kenarları (x + 7) m ve x m olan dikdörtgen biçimindeki bir bahçenin çevresi tel örgüyle çevrilecektir. İki öğrenci tel örgünün uzunluğunu farklı biçimlerde yazmıştır.</p>", "g": "<svg viewBox=\"0 0 374 136\" width=\"374\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"120\" y=\"14\" width=\"230\" height=\"90\" fill=\"#fff8e1\" stroke=\"#111111\" stroke-width=\"2.4\"/><text x=\"235.0\" y=\"126.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">(x + 7) m</text><text x=\"110.0\" y=\"64.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">x m</text></svg>", "son": "<b>Deniz:</b> “Tel örgünün uzunluğu 2(x + 7 + x) metredir.”<br><b>Emre:</b> “Tel örgünün uzunluğu (4x + 14) metredir.”", "k": "Buna göre, aşağıdakilerden hangisi doğrudur?", "sec": ["Yalnız Deniz'in ifadesi doğrudur.", "Yalnız Emre'nin ifadesi doğrudur.", "İki ifade de yanlıştır; çevre (2x + 7) metredir.", "İki öğrencinin yazdığı ifadeler de doğrudur ve denktir."], "secg": null, "c": "D", "a": ["Deniz iki kenarı toplayıp 2 ile çarpmıştır: 2(x + 7 + x) = 2(2x + 7) = 4x + 14.", "Emre dört kenarı ayrı ayrı toplamıştır: (x + 7) + x + (x + 7) + x = 4x + 14.", "İki ifade de aynı en sade hâle ulaşır; denktir."], "t": "Yalnız birinin doğru olduğunu söyleyen seçenekler: farklı görünen ifadelerin denk olabileceği fark edilmemiş; 2x + 7: yalnız iki kenar toplanmış", "d": "Farklı görünen iki ifade denk olabilir. İkisini de en sade hâle getirip karşılaştırınız ya da birkaç değer vererek sınayınız.", "ses": "b06"}, {"no": 7, "on": "<p>Bir fidanlıktaki çam fidanlarının sayısı (6f + 15) ifadesiyle gösterilmektedir. Bu fidanlardan (2f − 4) tanesi satılmıştır.</p>", "g": "<svg viewBox=\"0 0 456 116\" width=\"456\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"210\" height=\"100\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H210 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"113.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Fidanlık</text><text x=\"113.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Çam fidanı:</text><text x=\"113.0\" y=\"88.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">(6f + 15) tane</text><rect x=\"232\" y=\"8\" width=\"210\" height=\"100\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M232 36 V16 q0 -8 8 -8 H434 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"337.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Satış</text><text x=\"337.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Satılan fidan:</text><text x=\"337.0\" y=\"88.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">(2f − 4) tane</text></svg>", "son": "", "k": "Buna göre, fidanlıkta kalan çam fidanlarının sayısını gösteren ifade aşağıdakilerden hangisidir?", "sec": ["4f + 11", "4f + 19", "8f + 11", "4f + 15"], "secg": null, "c": "B", "a": ["Kalan: (6f + 15) − (2f − 4).", "Çıkarılan ifadenin her teriminin ters işaretlisi eklenir: 6f + 15 − 2f + 4.", "Benzer terimler: 4f + 19."], "t": "4f + 11: −4'ün işareti değiştirilmemiş; 8f + 11: çıkarma yerine toplama yapılmış; 4f + 15: sabit terimler işleme alınmamış", "d": "Satılan fidanlar parantez içinde çıkarılır: −(2f − 4) = −2f + 4. −4'ün işaretini değiştirmeyi unutmayınız.", "ses": "b07"}, {"no": 8, "on": "<p>Bir çiftçi, kenarları 9 m ve (2x + 5) m olan dikdörtgen biçimindeki tarlasını bir patikayla domates ve biber parsellerine ayırmıştır.</p>", "g": "<svg viewBox=\"0 0 392 142\" width=\"392\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"96\" y=\"34\" width=\"190\" height=\"96\" fill=\"#d0e3fb\" stroke=\"#111111\" stroke-width=\"1.6\"/><text x=\"191.0\" y=\"24.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2x m</text><text x=\"191.0\" y=\"87.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Domates</text><rect x=\"286\" y=\"34\" width=\"90\" height=\"96\" fill=\"#ffd8a8\" stroke=\"#111111\" stroke-width=\"1.6\"/><text x=\"331.0\" y=\"24.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">5 m</text><text x=\"331.0\" y=\"87.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Biber</text><rect x=\"96\" y=\"34\" width=\"280\" height=\"96\" fill=\"none\" stroke=\"#111111\" stroke-width=\"2.4\"/><text x=\"86.0\" y=\"87.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">9 m</text></svg>", "son": "<p>Patikanın genişliği önemsenmeyecektir.</p>", "k": "Buna göre, tarlanın alanını metrekare cinsinden gösteren ifade aşağıdakilerden hangisidir?", "sec": ["18x + 5", "11x + 14", "18x + 45", "9x + 45"], "secg": null, "c": "C", "a": ["Tarlanın alanı 9 · (2x + 5)'tir.", "Domates parseli 9 · 2x = 18x, biber parseli 9 · 5 = 45 m²'dir.", "Toplam alan (18x + 45) m²'dir."], "t": "18x + 5: biber parselinin alanı yalnız 5 alınmış; 11x + 14: kenarlar toplanmış; 9x + 45: 9 ile 2x çarpılırken katsayı unutulmuş", "d": "Tarlanın alanı parsellerin alanlarının toplamıdır. 9'u parantezin içindeki iki terimle de çarpınız.", "ses": "b08"}, {"no": 9, "on": "<p>Bir kooperatifte (15m + 20) kavanoz reçel üretilmiştir. Kavanozlar, her kolide eşit sayıda kavanoz olacak ve hiç kavanoz artmayacak şekilde 5 koliye yerleştirilecektir.</p>", "g": "<svg viewBox=\"0 0 496 112\" width=\"496\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"230\" height=\"96\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H230 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"123.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Üretim</text><text x=\"123.0\" y=\"74.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">(15m + 20) kavanoz</text><rect x=\"252\" y=\"8\" width=\"230\" height=\"96\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M252 36 V16 q0 -8 8 -8 H474 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"367.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Paketleme</text><text x=\"367.0\" y=\"63.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">5 eş koli</text><text x=\"367.0\" y=\"86.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Her koliye eşit sayıda</text></svg>", "son": "", "k": "Buna göre, bir koliye kaç kavanoz reçel konur?", "sec": ["3m + 4", "3m + 20", "15m + 4", "10m + 15"], "secg": null, "c": "A", "a": ["5 koliye eşit paylaştırmak 5'e bölmek, yani <span class=\"frac\"><span>1</span><span>5</span></span> ile çarpmaktır.", "<span class=\"frac\"><span>1</span><span>5</span></span> · (15m + 20) = <span class=\"frac\"><span>1</span><span>5</span></span> · 15m + <span class=\"frac\"><span>1</span><span>5</span></span> · 20.", "3m + 4."], "t": "3m + 20: yalnız ilk terim bölünmüş; 15m + 4: yalnız sabit terim bölünmüş; 10m + 15: bölme yerine çıkarma yapılmış", "d": "5 koliye eşit paylaştırmak 5'e bölmek, yani <span class=\"frac\"><span>1</span><span>5</span></span> ile çarpmaktır. Paydaki her terimi 5'e bölünüz.", "ses": "b09"}, {"no": 10, "on": "<p>Bir odanın planı aşağıda verilmiştir. Planda bütün köşeler diktir ve kenar uzunlukları metre cinsindendir.</p>", "g": "<svg viewBox=\"0 0 460.5 244\" width=\"460\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"120,20 250,20 250,130 400,130 400,210 120,210\" fill=\"#e7f5ff\" stroke=\"#111111\" stroke-width=\"2.4\"/><text x=\"185.0\" y=\"12.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2a</text><text x=\"410.0\" y=\"175.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"start\">a + 1</text><text x=\"260.0\" y=\"232.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">5a + 2</text><text x=\"110.0\" y=\"120.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">3a + 1</text></svg>", "son": "<p>Odanın bütün duvar diplerine süpürgelik döşenecektir. Kapı ve pencereler önemsenmeyecektir.</p>", "k": "Buna göre, döşenecek süpürgeliğin uzunluğunu metre cinsinden gösteren ifade aşağıdakilerden hangisidir?", "sec": ["11a + 4", "8a + 3", "14a + 6", "16a + 6"], "secg": null, "c": "D", "a": ["Verilmeyen kenarlar: yatay (5a + 2) − 2a = 3a + 2; dikey (3a + 1) − (a + 1) = 2a.", "Bütün kenarlar: (5a + 2) + (a + 1) + (3a + 2) + 2a + 2a + (3a + 1).", "Toplam 16a + 6'dır. (Denetim: 2 · ((5a + 2) + (3a + 1)) = 16a + 6.)"], "t": "11a + 4: yalnız verilen kenarlar toplanmış; 8a + 3: çevrenin yarısı alınmış; 14a + 6: kısa dikey kenar unutulmuş", "d": "Verilmeyen kenarları karşısındaki kenarlardan bulunuz. Bütün kenarları toplamadan çevreyi yazmayınız.", "ses": "b10"}, {"no": 11, "on": "<p>Öğretmen tahtaya 4(k − 1) + 2 ifadesini yazıp en sade hâlini istemiştir. Selin 4k − 2, Bora 6k − 4 sonucunu bulmuştur.</p>", "g": "<svg viewBox=\"0 0 470 132\" width=\"470\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"6\" y=\"6\" width=\"458\" height=\"120\" rx=\"8\" fill=\"#fffef6\" stroke=\"#adb5bd\" stroke-width=\"1.4\"/><line x1=\"48\" y1=\"10\" x2=\"48\" y2=\"122\" stroke=\"#ffa8a8\" stroke-width=\"1.4\"/><text x=\"60.0\" y=\"34.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"start\">Tahtadaki ifade: 4(k − 1) + 2</text><line x1=\"14\" y1=\"92\" x2=\"456\" y2=\"92\" stroke=\"#d0ebff\" stroke-width=\"1.2\"/><text x=\"30.0\" y=\"84.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">1.</text><text x=\"60.0\" y=\"84.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">Selin: 4k − 2</text><line x1=\"14\" y1=\"126\" x2=\"456\" y2=\"126\" stroke=\"#d0ebff\" stroke-width=\"1.2\"/><text x=\"30.0\" y=\"118.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2.</text><text x=\"60.0\" y=\"118.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">Bora: 6k − 4</text></svg>", "son": "<p>Bora, kendi ifadesinin başlangıçtaki ifadeye denk olup olmadığını k yerine bir sayı yazarak sınayacaktır.</p>", "k": "Buna göre, Bora'nın ifadesinin denk olmadığını göstermek için k yerine aşağıdakilerden hangisi <u>yazılamaz</u>?", "sec": ["−1", "1", "0", "2"], "secg": null, "c": "B", "a": ["Selin'in sonucu doğrudur: 4(k − 1) + 2 = 4k − 4 + 2 = 4k − 2.", "k = 1 için 4k − 2 = 2 ve 6k − 4 = 2; değerler eşittir, karşı örnek olmaz.", "k = −1, 0, 2 için sonuçlar farklıdır (−6 ve −10; −2 ve −4; 6 ve 8); bunlar karşı örnektir."], "t": "−1, 0 ve 2: iki ifadenin farklı değer verdiği sayılardır; denk olmadığını gösterirler", "d": "Karşı örnek, iki ifadenin farklı değer verdiği sayıdır. Değerlerin eşit çıktığı sayı denk olmadığını göstermez.", "ses": "b11"}, {"no": 12, "on": "<p>Bir bilgi yarışmasında her doğru cevap 4 puan kazandırmakta, her yanlış cevap 1 puan kaybettirmektedir. Ece yarışmadaki 20 sorunun hepsini cevaplamış, bunların d tanesini doğru cevaplamıştır.</p>", "g": "<svg viewBox=\"0 0 496 116\" width=\"496\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"230\" height=\"100\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H230 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"123.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Kurallar</text><text x=\"123.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Doğru cevap: +4 puan</text><text x=\"123.0\" y=\"88.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Yanlış cevap: −1 puan</text><rect x=\"252\" y=\"8\" width=\"230\" height=\"100\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M252 36 V16 q0 -8 8 -8 H474 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"367.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Ece</text><text x=\"367.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Cevapladığı: 20 soru</text><text x=\"367.0\" y=\"88.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Doğru cevabı: d tane</text></svg>", "son": "", "k": "Buna göre, Ece'nin puanını gösteren ifadenin en sade hâli aşağıdakilerden hangisidir?", "sec": ["3d − 20", "3d + 20", "5d − 20", "5d + 20"], "secg": null, "c": "C", "a": ["Yanlış cevap sayısı (20 − d)'dir.", "Puan: 4d − 1 · (20 − d) = 4d − 20 + d.", "5d − 20."], "t": "3d − 20: −(20 − d) yazılırken d'nin işareti değiştirilmemiş; 3d + 20 ve 5d + 20: sabit terimin işareti yanlış alınmış", "d": "Yanlış cevap sayısı (20 − d)'dir ve puandan bu sayı kadar düşülür: −(20 − d) = −20 + d.", "ses": "b12"}, {"no": 13, "on": "<p>Bir öğrenci iki saksıdaki fesleğenlerin boyunu her hafta ölçmektedir. Ölçmeye başladıktan h hafta sonra A saksısındaki fesleğenin boyu (13 + 2h) cm, B saksısındakinin boyu (6 + 3h) cm olmaktadır.</p>", "g": "<svg viewBox=\"0 0 456 96\" width=\"456\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"210\" height=\"80\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H210 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"113.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A saksısı</text><text x=\"113.0\" y=\"66.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Boy: (13 + 2h) cm</text><rect x=\"232\" y=\"8\" width=\"210\" height=\"80\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M232 36 V16 q0 -8 8 -8 H434 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"337.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B saksısı</text><text x=\"337.0\" y=\"66.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Boy: (6 + 3h) cm</text></svg>", "son": "<p>Öğrenci A'daki fesleğenin boyundan B'dekinin boyunu çıkarıp farkı gösteren ifadeyi en sade hâlde yazmıştır.</p>", "k": "Buna göre, bu farkla ilgili aşağıdakilerden hangisi doğrudur?", "sec": ["Fark her hafta 1 cm azalır.", "Fark her hafta 1 cm artar.", "Fark her hafta 7 cm'dir.", "Fark her hafta 5 cm azalır."], "secg": null, "c": "A", "a": ["Fark: (13 + 2h) − (6 + 3h) = 13 + 2h − 6 − 3h.", "En sade hâl: 7 − h.", "h'nin katsayısı −1'dir; h 1 arttıkça fark 1 cm azalır."], "t": "Fark her hafta 1 cm artar: katsayının işareti okunmamış; 7 cm: sabit terim değişim sanılmış; 5 cm: katsayılar toplanmış", "d": "Farkı en sade hâle getirip h'nin katsayısına bakınız. Katsayının işareti farkın arttığını mı azaldığını mı gösterir?", "ses": "b13"}, {"no": 14, "on": "<p>Zeynep masaya aşağıdaki karoları dizmiştir. Uzun karolar x'i, küçük kareler 1'i göstermektedir; mavi karolar pozitif, turuncu karolar negatiftir.</p>", "g": "<svg viewBox=\"0 0 684 130\" width=\"684\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"150\" y=\"18\" width=\"24\" height=\"74\" rx=\"3\" fill=\"#a5d8ff\" stroke=\"#1c7ed6\" stroke-width=\"1.6\"/><text x=\"162.0\" y=\"60.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">x</text><rect x=\"180\" y=\"18\" width=\"24\" height=\"74\" rx=\"3\" fill=\"#a5d8ff\" stroke=\"#1c7ed6\" stroke-width=\"1.6\"/><text x=\"192.0\" y=\"60.0\" font-family=\"Source Sans 3\",sans-serif
