<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* ANA_KURALLAR §4.y-3: Etkinliklerde bütün kesirler kesir çizgisiyle (alt alta pay/payda) gösterilir. Düz yazılmış a/b biçimleri otomatik dönüştürülür. */
(function(){
  if (window.__kesirCizgi) return; window.__kesirCizgi = 1;
  const RX = /(^|[^\w\/.,:%])([−-])?(?:(\d+) )?(\d{1,4})\/(\d{1,4})(?![\w\/.,]\d|\w)/g;
  const ATLA = "script,style,svg,textarea,input,select,code,.ilr,.frac,[data-duz]";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function donustur(kok){
    if (!kok || !kok.nodeType) return;
    if (kok.nodeType === 3) kok = kok.parentElement;
    if (!kok || (kok.closest && kok.closest(ATLA))) return;
    const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      if (!/\d\/\d/.test(t.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = t.parentElement; if (!p || p.closest(ATLA)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const L = []; let t; while ((t = w.nextNode())) L.push(t);
    L.forEach(t => {
      let deg = false;
      const h = esc(t.nodeValue).replace(RX, (m, a, s, tam, p, q) => { deg = true;
        return a + (s ? "−" : "") + (tam ? tam + " " : "") + '<span class="frac"><span>' + p + "</span><span>" + q + "</span></span>"; });
      if (!deg) return;
      const k = document.createElement("span"); k.innerHTML = h; t.replaceWith(...k.childNodes);
    });
  }
  let bekleyen = new Set(), plan = 0;
  const calis = () => { plan = 0; const b = bekleyen; bekleyen = new Set(); b.forEach(donustur); };
  const gozcu = new MutationObserver(ms => { ms.forEach(m => {
      if (m.type === "characterData") bekleyen.add(m.target); else m.addedNodes.forEach(n => bekleyen.add(n)); });
    if (!plan) plan = requestAnimationFrame(calis); });
  const bas = () => { donustur(document.body); gozcu.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bas); else bas();
  const st = document.createElement("style");
  st.textContent = ".frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}.frac>span{display:block;text-align:center;padding:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor}";
  document.head.appendChild(st);
})();

/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {

    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });

    async function dagit(k) {

      const kolon = Math.min(k, 6), satirK = Math.ceil(k / kolon), gw = kolon * 14 + 16, gh = satirK * 14 + 26;

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */
  function ATLA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Sonuç"] });
    let k = o.k, L = o.son; const W = 660, sol = 22, sag = 22, sk = (W - sol - sag) / L;

    const bA = dug("▶ Oynat"), bB = dug("+1 " + (o.adimAd || "adım"), "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bB, bS);
    let kA = null;
    if (o.kSec) { kA = adimci(o.kEtiket || "Adım:", 2, Math.floor(L / 2), k, v => { k = v; sifirla(); }); kut.prepend(kA.w); }

    const bT = dug(o.testDugme || "Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test);
    const ti = test.querySelector("input");
    function taban() {
      let sv = `<line x1="${sol}" y1="62" x2="${sol + L * sk}" y2="62" class="cn-ek"/>`;

      for (let v = 0; v <= L; v += adimT) sv += `<line x1="${sol + v * sk}" y1="${v % et ? 58 : 54}" x2="${sol + v * sk}" y2="66" class="cn-ek"/>` + (v % et ? "" : `<text x="${sol + v * sk}" y="82" text-anchor="middle" class="cn-et">${o.etYaz ? o.etYaz(v) : v}</text>`);
      sv += `<line x1="${sol + L * sk}" y1="30" x2="${sol + L * sk}" y2="70" class="cn-sinir"/><text x="${sol + L * sk}" y="24" text-anchor="end" class="cn-et">${o.sonEt || L}</text>`;

    }

      izle.forEach((v, i) => {

        sv += `<path d="M${x1} 62 Q${(x1 + x2) / 2} ${yy} ${x2} 62" class="cn-yay"/><circle cx="${x2}" cy="62" r="4.5" class="${o.renk ? o.renk(v, i + 1) : "cn-o"}"/>`;
        if (izle.length <= 14 || i === izle.length - 1 || i % Math.ceil(izle.length / 10) === 0) sv += `<text x="${x2}" y="${98}" text-anchor="middle" class="cn-et2">${v}</text>`;
      });

      const son = izle.length ? izle[izle.length - 1] : 0, ix = sol + son * sk;
      sv += `<text x="${ix}" y="50" text-anchor="middle" class="cn-kis">${o.simge || "●"}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W} 104" role="img" aria-label="${k} birimlik adımlarla ilerleme">${sv}</svg>`;
    }
    const ileri = () => {
      const v = (n + 1) * k;
      if (v > L) { durdur(); s.dur.innerHTML = `<span class="kotu">■</span> Sonraki ${o.adimAd || "adım"} ${k} ${x} ${n + 1} = <b>${v}</b> olurdu; bu ${E(L,"den")} büyük. ${o.bitti ? o.bitti(n, k, L) : `Toplam ${n} ${o.adimAd || "adım"}; son değer ${n * k}.`}`; if (!izle.length) ciz(); return false; }
      n++; izle.push(v); ciz(); s.dur.innerHTML = o.durum ? o.durum(n, v, k) : `${n}. ${o.adimAd || "adım"}: ${k} ${x} ${n} = <b>${v}</b>`; return true;

      s.dur.innerHTML = m; s.yaz("t" + v, [v, r === 0 ? (ic ? `${k} ${x} ${b} ✔` : `${k} ${x} ${b} (sınır dışı)`) : `kalan ${r} ✘`], r === 0 && ic);

  }

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || [o.kAd || "k", "Boyanan", "En büyük"] });
    let k = o.k || 2, son = o.son;
    const kut = h("div", "cn-satir");

    if (o.sonSec) { const sw = h("div", "cn-hazir"); o.sonSec.forEach(v => { const b = dug(v + " gün", "ghost"); b.onclick = () => { son = v; kur(); temiz(); }; sw.appendChild(b); }); s.den.append(kut, sw); }

      const g = h("div", "cn-izg" + (o.takvim ? " cn-tak" : "")); g.style.gridTemplateColumns = `repeat(${o.sutunSay},1fr)`;

    function temiz() { hucre.forEach(c => c && c.classList.remove("on", "yeni")); s.dur.innerHTML = o.ilk || "Sayıyı seçip Boya düğmesine basın."; }

      }

      s.yaz(k + ":" + son, o.satir ? o.satir(k, say, enb, son) : [k, say, enb], o.iyi ? o.iyi(k, say, enb, son) : null);
      calis = false; bB.disabled = false;

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */
  function ASANSOR(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Açık asansörler", "Gidilen kat", "Gidilemeyen kat"] });
    const ac = o.asansor.map(() => false);
    const kut = h("div", "cn-satir"); const bt = o.asansor.map((a, i) => { const b = dug(a.ad, "ghost"); b.style.setProperty("--ac", a.renk); b.setAttribute("aria-pressed", "false"); b.onclick = () => { ac[i] = !ac[i]; b.setAttribute("aria-pressed", ac[i]); ciz(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    function ciz() {
      let sv = ""; const H = o.kat * 17 + 40; let git = 0, gitme = [];
      for (let f = o.kat; f >= 0; f--) {

        sv += `<rect x="60" y="${y}" width="150" height="15" rx="2" class="${f === 0 ? "cn-zem" : herhangi ? "cn-katon" : (ac.some(Boolean) ? "cn-katoff" : "cn-kat")}"/><text x="52" y="${y + 12}" text-anchor="end" class="cn-et">${f === 0 ? "Z" : f}</text>`;
        o.asansor.forEach((a, i) => { if (dur[i]) sv += `<circle cx="${230 + i * 22}" cy="${y + 7.5}" r="6" fill="${a.renk}"/>`; });
      }
      s.sah.innerHTML = `<svg viewBox="0 0 300 ${H}" style="max-height:440px" role="img" aria-label="${o.kat} katlı bina">${sv}</svg>`;
      const acik = o.asansor.filter((a, i) => ac[i]).map(a => a.ad);

      s.yaz(acik.join("+"), [acik.join(" + "), git, gitme.length], null);

    ciz();
  }

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */
  function SAAT(el, o) {

      let onc = null, snr = null;
      for (let m = bas; m <= bit + ara; m += ara) { if (m <= var_) onc = m; if (m >= var_ && snr == null) snr = m; if (m <= bit) sv += `<text x="${20 + (m - bas) * sk}" y="40" text-anchor="middle" class="cn-bus">🚌</text>`; }

      if (snr != null && snr <= bit + ara) { const sx = 20 + (Math.min(snr, bit) - bas) * sk; sv += `<path d="M${vx} 56 L${sx} 56" class="cn-bek"/>`; }

      const gec = var_ - bas;
      s.dur.innerHTML = `${o.kisi} durağa ${saDa(var_)} geliyor: ilk seferden <b>${gec} dakika</b> sonra. Seferler ${E(ara,"in")} katı olan dakikalarda: ${ara} ${x} ${Math.floor(gec / ara)} = ${Math.floor(gec / ara) * ara}` + (gec % ara ? `, ${ara} ${x} ${Math.floor(gec / ara) + 1} = ${(Math.floor(gec / ara) + 1) * ara}. Sonraki otobüs ${saDa(snr)}; bekleme <b>${snr - var_} dakika</b>.` : `. Tam sefer saatinde geldi; bekleme <b>0 dakika</b>.`);
      s.yaz(ara + ":" + var_, [ara + " dk", sa(var_), sa(onc), sa(snr), (snr - var_) + " dk"], null);
    }
    ciz();
  }

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Çarpanlar", "Çarpan sayısı"] });
    let N = o.N || o.hazir[0]; let bul = new Set(), denendi = new Set();
    const kut = h("div", "cn-satir");
    const sA = adimci("Sayı:", 2, o.max || 200, N, v => { N = v; yeni(); });
    kut.appendChild(sA.w);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => sA.ayarla(n); hz.appendChild(b); }); kut.appendChild(hz); }
    s.den.appendChild(kut);
    const bolen = h("div", "cn-satir cn-test"); bolen.innerHTML = `<label>Bölen deneyin: <input type="number" inputmode="numeric" min="1"></label>`;
    const bD = dug("Böl"), bS = dug("Sıradakini dene", "ghost"); bolen.append(bD, bS); s.den.appendChild(bolen);
    const bi = bolen.querySelector("input");
    let bK = null; if (o.katlar) { bK = dug(o.katDugme || "Katlarını say ▶", "ghost"); s.den.appendChild(bK); }
    const ciftler = h("div", "cn-cift"); const katlar = h("div", "cn-katlar");
    function yeni() { bul = new Set(); denendi = new Set(); ciz(); s.dur.innerHTML = `${N} sayısını 1, 2, 3, … sayılarına bölerek çarpan çiftlerini bulun.`; katlar.textContent = ""; }
    function ciz() {
      const L = [...bul].sort((a, b) => a - b);
      s.sah.innerHTML = ""; const kartlar = h("div", "cn-kartlar");
      L.forEach(v => kartlar.appendChild(h("span", "cn-kart" + (v * v === N ? " kare" : ""), v)));
      if (!L.length) kartlar.appendChild(h("span", "cn-bosk", "Henüz çarpan bulunmadı"));
      s.sah.append(kartlar, ciftler, katlar);
      ciftler.innerHTML = L.filter(v => v * v <= N).map(v => `<span>${v} ${x} ${N / v}${v * v === N ? " <i>(aynı sayı: bir kez yazılır)</i>" : ""}</span>`).join("");
    }
    const tamamMi = () => { for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) return false; return true; };
    const eksik = () => { const L = []; for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) L.push(i); return ` <br>Henüz denenmeyen küçük bölenler var: <b>${L.join(", ")}</b>. Bunları da deneyin.`; };
    function dene(d) {
      if (!d || d < 1) return; denendi.add(d);
      const b = Math.floor(N / d), r = N % d;
      if (d > N) { s.dur.innerHTML = `${d} > ${N}: ${E(N,"den")} büyük sayı ${E(N,"in")} çarpanı olamaz.`; return; }
      if (r === 0) { bul.add(d); bul.add(b); ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${N} : ${d} = ${b}, kalan 0 → <b>${d} ${x} ${b} = ${N}</b>. ${d} ve ${b} çarpandır.` + (d * d >= N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} ${d * d === N ? "=" : ">"} ${N}. Artık yeni çift çıkmaz; bütün çarpanlar bulundu.` : eksik() : ""); }
      else { s.dur.innerHTML = `<span class="kotu">✘</span> ${N} : ${d} işleminde bölüm ${b}, <b>kalan ${r}</b>. ${d}, ${E(N,"in")} çarpanı değildir.` + (d * d > N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} > ${N}. Daha büyük bölen denemeye gerek yok; çarpan listesi tamam.` : eksik() : ""); }
      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));
      if (tamam) s.yaz("n" + N, [N, [...bul].sort((a, b) => a - b).join(", "), bul.size], true);
    }
    bD.onclick = () => dene(Math.round(+bi.value));
    bS.onclick = () => { let d = 1; while (denendi.has(d)) d++; bi.value = d; dene(d); };
    if (bK) bK.onclick = async () => {
      bK.disabled = true; katlar.textContent = ""; const sat = h("div", "cn-katsat"); katlar.append(h("b", "", `${E(N,"in")} katları: `), sat);
      for (let i = 1; i <= (o.katSay || 12); i++) { sat.appendChild(h("span", "cn-kat2", `${N * i}`)); await bekle(220); }
      sat.appendChild(h("span", "cn-sonsuz", "… ve sonsuza kadar sürer"));
      bK.disabled = false;
    };
    yeni();
  }

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */
  function KUMBARA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Para", "Sonuç"] });
    const k = o.k; let hafta = 0, tmr = null;
    const kut = h("div", "cn-satir"); const bA = dug("Bir hafta geçsin +"), bO = dug("▶ Haftaları oynat", "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bO, bS); s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Kumbarada şu para olabilir mi? <input type="number" inputmode="numeric" min="1" max="500"> TL</label>`;
    const bT = dug("Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test); const ti = test.querySelector("input");
    function ciz() {
      const top = hafta * k, sv = [];
      const yuk = Math.min(150, top * 1.4);
      sv.push(`<rect x="110" y="20" width="120" height="160" rx="22" class="cn-kum"/><rect x="150" y="14" width="40" height="8" rx="3" class="cn-kum2"/>`);
      sv.push(`<rect x="116" y="${176 - yuk}" width="108" height="${yuk}" rx="10" class="cn-para"/>`);
      sv.push(`<text x="170" y="110" text-anchor="middle" class="cn-buyuk">${top} TL</text><text x="170" y="134" text-anchor="middle" class="cn-et">${hafta}. hafta</text>`);
      let cizgi = ""; for (let i = 1; i <= hafta && i <= 16; i++) cizgi += `<text x="${260 + ((i - 1) % 4) * 52}" y="${40 + Math.floor((i - 1) / 4) * 34}" class="cn-et2">${k}${x}${i}=${k * i}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 480 190" role="img" aria-label="Kumbara">${sv.join("")}${cizgi}</svg>`;
      s.dur.innerHTML = hafta ? `${hafta}. hafta sonunda kumbarada ${k} ${x} ${hafta} = <b>${top} TL</b> var.` : `Kumbara boş. Her hafta ${k} TL atılıyor.`;
    }
    bA.onclick = () => { hafta++; ciz(); };
    bO.onclick = () => { if (tmr) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } bO.textContent = "❚❚ Durdur"; tmr = setInterval(() => { if (hafta >= 15) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } hafta++; ciz(); }, az ? 50 : 500); };
    bS.onclick = () => { hafta = 0; ciz(); };
    bT.onclick = () => {
      const v = Math.round(+ti.value); if (!v) return; const b = Math.floor(v / k), r = v % k;
      s.dur.innerHTML = r ? `<span class="kotu">✘</span> ${k} ${x} ${b} = ${k * b} TL, ${k} ${x} ${b + 1} = ${k * (b + 1)} TL. ${v} TL arada kalır (${v} : ${k} → kalan ${r}). Kumbarada hiçbir hafta ${v} TL olmaz.`
        : `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · ${b}. hafta sonunda kumbarada tam ${v} TL olur.`;
      if (!r) { hafta = b; ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · <b>${b}. hafta</b> sonunda kumbarada tam ${v} TL olur.`; }
      s.yaz("t" + v, [v + " TL", r ? `kalan ${r} ✘` : `${k} ${x} ${b} ✔`], !r);
    };
    ciz();
  }

  /* 9) ÖNERME LABORATUVARI: önermeyi farklı sayılarla sınama */
  function ONERME(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Önerme", "Sayı", "Sonuç"] });
    let akt = 0; const kut = h("div", "cn-hazir");
    const bt = o.onermeler.map((on, i) => { const b = dug(on.ad, "ghost"); b.setAttribute("aria-pressed", i === 0); b.onclick = () => { akt = i; bt.forEach((x, j) => x.setAttribute("aria-pressed", j === i)); goster(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Sınanacak sayı: <input type="number" inputmode="numeric" min="1" max="200" value="12"></label>`;
    const bT = dug("Sına"), bR = dug("Rastgele sayı", "ghost"); test.append(bT, bR); s.den.appendChild(test); const ti = test.querySelector("input");
    function goster() { s.sah.innerHTML = `<div class="cn-onr"><b>${o.onermeler[akt].ad}:</b> “${o.onermeler[akt].metin}”</div>`; s.dur.innerHTML = "Bir sayı yazıp Sına düğmesine basın. Önerme her sayıda doğru mu?"; }
    function sina(n) {
      const on = o.onermeler[akt], r = on.sina(n);
      s.sah.innerHTML = `<div class="cn-onr"><b>${on.ad}:</b> “${on.metin}”</div><div class="cn-kanit">${r.goster}</div>`;
      s.dur.innerHTML = (r.ok ? `<span class="iyi">✔</span> ${n} için önerme doğru.` : `<span class="kotu">✘</span> ${n} için önerme yanlış! Bir karşı örnek bulundu.`) + (r.not ? " " + r.not : "");
      s.yaz(akt + ":" + n, [on.ad, n, r.ok ? "doğru" : "yanlış (karşı örnek)"], r.ok);
    }
    bT.onclick = () => { const n = Math.round(+ti.value); if (n > 0) sina(n); };
    bR.onclick = () => { const n = 2 + Math.floor(Math.random() * 59); ti.value = n; sina(n); };
    goster();
  }


  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →
     koşullar tek tek denetlenir (✔/✘) → deney defterine yazılır. Doğru cevap verilmez; öğrenci uygun girdiyi kendisi arar.
     o.girdi: [{ad, min, max, bas} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → SVG/HTML · o.kosullar: [{ad, f(v) → bool | {ok, not}}]
     o.dugme: düğme yazısı (false → her değişiklikte denetlenir) · o.sonuc(v, hepsi, L) · o.satir(v, hepsi, L) · o.iyi(v, L) · o.ek: [{ad, deger(v) → v}] */
  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);
      s.dur.innerHTML = m;
      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);
    }
    kur = true; ciz();
    if (bS) s.dur.innerHTML = o.ilk || "Değerleri seçip Sına düğmesine basın."; else sina();
  }

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

/* SORU BANKASI · MAT.7.2.1 · Cebirsel İfadelerle İşlemler — yeni nesil soruların "Canlandır" düzenekleri (14.10.2026) — ortak motor: canlandir.js (CN.KOSUL); yeni motor yok.
   Her düzenek: öğrenci değişkenin değerini ya da bir durumu − / + sayaçlarıyla ya da seçim düğmeleriyle değiştirir → sahne anında çizilir →
   koşullar denetlenir → deneme deney defterine yazılır → yeniden dener. Doğru cevap bir düğmeyle verilmez; denemelerden çıkar (§4.k, §19-10).
   Çizim yardımcıları bu dosyada ayrıca yazıldı (canlandir_721.js de window.CANL tanımladığı için gömülmez). Eksi U+2212; kesirler a/b yazılır,
   kesir_cizgi.js üst üste çizer. */
window.CANL = (() => {
  if (!document.getElementById("csb721-stil")) { const st = document.createElement("style"); st.id = "csb721-stil";
    st.textContent = ".cn-btn{min-width:44px;min-height:44px}.cn-adimci button{min-width:44px;min-height:44px}.csb721-k{text-align:center;font-size:17px;font-weight:800;margin:8px auto;max-width:640px;line-height:1.6}.csb721-t{margin:6px auto;border-collapse:collapse;font-size:15px;max-width:100%}.csb721-t td,.csb721-t th{border:1px solid #ced4da;padding:4px 8px;text-align:center}.csb721-t th{background:#eef7f2}"; document.head.appendChild(st); }
  const E = "−";
  const D = v => { const r = Math.round(v * 1000) / 1000; return (r < 0 ? E : "") + String(Math.abs(r)).replace(".", ","); };
  const svg = (w, h, ic, ad) => `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;height:auto;display:block;margin:0 auto" role="img" aria-label="${ad}">${ic}</svg>`;
  const tx = (x, y, s, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.an || "middle"}" style="font-size:${o.fs || 14}px;font-weight:800;fill:${o.r || "#1d2433"}">${s}</text>`;
  const rc = (x, y, w, h, f, s = "#495057", r = 3) => `<rect x="${x}" y="${y}" width="${Math.max(0, w)}" height="${Math.max(0, h)}" rx="${r}" fill="${f}" stroke="${s}" stroke-width="1.5"/>`;
  const B = v => String(v).replace(/\B(?=(\d{3})+(?!\d))/g, "\u00a0");
  const kutu = h => `<div class="csb721-k">${h}</div>`;
  const tablo = (bas, sat) => `<table class="csb721-t"><tr>${bas.map(b => `<th>${b}</th>`).join("")}</tr>${sat.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;
  /* yatay parçalı şerit: [[ad, değer, renk]] (toplam W'ye ölçeklenir) */
  function serit(L, W = 420, yaz = x => D(x)) { const top = L.reduce((t, p) => t + p[1], 0) || 1, u = (W - 20) / top; let x = 10, s = "";
    L.forEach(([ad, v, r]) => { s += rc(x, 14, v * u - 2, 40, r) + tx(x + v * u / 2, 32, ad, { fs: 12 }) + tx(x + v * u / 2, 48, yaz(v), { fs: 12 }); x += v * u; });
    return svg(W, 66, s, "Şerit"); }
  /* yan yana sütunlar: [[ad, değer, renk]] aynı ölçek */
  function sutunlar(L, W = 420, H = 170, mx) { const m = mx || Math.max(...L.map(x => x[1]), 1), g = (W - 20) / L.length; let s = "";
    L.forEach(([ad, v, r], i) => { const h = v / m * (H - 50); s += rc(10 + i * g + g * .2, H - 26 - h, g * .6, h, r) + tx(10 + i * g + g / 2, H - 30 - h, D(v), { fs: 13 }) + tx(10 + i * g + g / 2, H - 8, ad, { fs: 12 }); });
    return svg(W, H, s, "Sütunlar"); }
  const KO = (el, o) => CN.KOSUL(el, Object.assign({ dugme: false }, o));
  return {
    /* 1 · Bilim kulübü projesi: toplam (18g + 12) saat; Ece 1/3, Can 1/2, Deniz kalan */
    1: el => KO(el, { girdi: [{ ad: "g", min: 1, max: 6, bas: 2 }],
        ciz: v => { const g = v[0], T = 18 * g + 12, e = T / 3, c = T / 2, d = T - e - c;
          return serit([["Ece", e, "#a5d8ff"], ["Can", c, "#ffc078"], ["Deniz", d, "#d0bfff"]], 420, x => D(x) + " sa")
            + kutu(`Toplam: 18 · ${g} + 12 = ${T} saat<br>Ece: 1/3 · ${T} = ${D(e)} · Can: 1/2 · ${T} = ${D(c)}<br>Deniz: ${T} ${E} ${D(e)} ${E} ${D(c)} = <b>${D(d)}</b> saat · 3g + 2 = ${3 * g + 2}`); },
        kosullar: [{ ad: "Deniz'in süresi 3g + 2 ifadesinin değerine eşit çıktı.", f: v => { const T = 18 * v[0] + 12; return Math.abs(T - T / 3 - T / 2 - (3 * v[0] + 2)) < 1e-9; } },
                   { ad: "g = 4 için Deniz'in süresi bulundu.", f: v => v[0] === 4 }],
        sutun: ["g", "Toplam", "Ece", "Can", "Deniz", "3g + 2"], satir: v => { const T = 18 * v[0] + 12; return [v[0], T, D(T / 3), D(T / 2), D(T / 6), 3 * v[0] + 2]; },
        yon: "g değerini değiştirin. Her denemede toplam işi, Ece'nin (1/3) ve Can'ın (1/2) payını hesaplayıp Deniz'e kalanı 3g + 2 ile karşılaştırın; g = 4'ü de deneyin.", bitis: "Deniz'in süresinin her g için 3g + 2 olduğunu defterden gördüğünüzde." }),

    /* 2 · Park alanı: n otomobil, aralar 1 m, uçlar 2 m */
    2: el => KO(el, { girdi: [{ ad: "Otomobil sayısı", min: 2, max: 8, bas: 3 }, { ad: "Bir otomobilin boyu a (m):", sec: ["4", "4,5", "5"], bas: "4" }],
        ciz: v => { const n = v[0], a = +v[1].replace(",", "."), L = n * a + (n - 1) + 4, u = 520 / (8 * 5 + 7 + 4); let s = "", x = 10 + 2 * u;
          s += rc(10, 60, 520, 10, "#ced4da", "#868e96", 0);
          for (let i = 0; i < n; i++) { s += rc(x, 30, a * u, 28, i % 2 ? "#ffc078" : "#a5d8ff", "#495057", 6); x += a * u + u; }
          s += tx(10 + u, 92, "2 m", { fs: 12 }) + (n > 1 ? tx(10 + 2 * u + a * u + u / 2, 92, "1 m", { fs: 12 }) : "") + tx(x - u + u, 92, "2 m", { fs: 12 });
          return svg(540, 100, s, "Park alanı") + kutu(`${n} otomobil: ${n} · ${D(a)} = ${D(n * a)} m · ara boşluk sayısı ${n - 1} → ${n - 1} m · uçlar 4 m<br>Uzunluk: <b>${D(L)} m</b>`); },
        kosullar: [{ ad: "6 otomobil için uzunluk bulundu; ara boşluk sayısı 5'tir.", f: v => v[0] === 6 }],
        sutun: ["Otomobil", "a", "Ara boşluk", "Uzunluk (m)"], satir: v => [v[0], v[1], v[0] - 1, D(v[0] * +v[1].replace(",", ".") + v[0] + 3)],
        yon: "Otomobil sayısını ve bir otomobilin boyunu değiştirin. Ara boşluk sayısı otomobil sayısından kaç eksik? 6 otomobili farklı a değerleriyle deneyip uzunluğu 6a + 9 ile karşılaştırın.", bitis: "6 otomobil için uzunluğun 6a + 9 olduğunu gördüğünüzde." }),

    /* 3 · İç içe bardaklar: mavi h + 1,6(n − 1), turuncu (h + 2) + (n − 1) */
    3: el => KO(el, { girdi: [{ ad: "Yığındaki bardak", min: 1, max: 10, bas: 3 }, { ad: "Bir mavi bardağın boyu h (cm):", sec: ["8", "10", "12"], bas: "10" }],
        ciz: v => { const n = v[0], h = +v[1], m = h + 1.6 * (n - 1), t = h + 2 + (n - 1);
          return sutunlar([["Mavi yığın", m, "#a5d8ff"], ["Turuncu yığın", t, "#ffc078"]], 360, 190, 30)
            + kutu(`Mavi: ${h} + ${n - 1} · 1,6 = ${D(m)} cm<br>Turuncu: ${h + 2} + ${n - 1} · 1 = ${D(t)} cm<br>Fark: <b>${D(m - t)} cm</b>`); },
        kosullar: [{ ad: "8 bardaklık yığınlar karşılaştırıldı.", f: v => v[0] === 8 }],
        sutun: ["Bardak", "h", "Mavi", "Turuncu", "Fark"], satir: v => { const n = v[0], h = +v[1]; return [n, h, D(h + 1.6 * (n - 1)), D(h + 2 + n - 1), D(0.6 * (n - 1) - 2)]; },
        yon: "Bardak sayısını ve h'yi değiştirin. 8 bardaklık yığınları farklı h değerleriyle karşılaştırın: fark h'ye bağlı mı? İlk bardağın üstüne kaç bardak eklendiğine dikkat edin.", bitis: "8 bardakta farkın h'den bağımsız olduğunu gördüğünüzde." }),

    /* 4 · Fotoğraf: x × 15 → 3 parça (x × 5) uç uca: 3x × 5 */
    4: el => KO(el, { girdi: [{ ad: "x (cm):", sec: ["18", "20", "25", "30"], bas: "20" }, { ad: "Görünüm:", sec: ["Fotoğraf", "Uç uca dizilim"], bas: "Fotoğraf" }],
        ciz: v => { const x = +v[0], f = 2 * x + 30, y = 6 * x + 10, u = 4.4; let s = "";
          if (v[1] === "Fotoğraf") { s += rc(10, 10, x * u, 15 * u, "#e7f5ff", "#1d2433", 0) + `<line x1="10" y1="${10 + 5 * u}" x2="${10 + x * u}" y2="${10 + 5 * u}" stroke="#1d2433" stroke-dasharray="6 4"/><line x1="10" y1="${10 + 10 * u}" x2="${10 + x * u}" y2="${10 + 10 * u}" stroke="#1d2433" stroke-dasharray="6 4"/>`; }
          else { const k = Math.min(1, 520 / (3 * x * u)); for (let i = 0; i < 3; i++) s += rc(10 + i * x * u * k, 30, x * u * k, 5 * u * k, "#e7f5ff", "#1d2433", 0); }
          return svg(540, 90, s, "Fotoğraf") + kutu(`Fotoğrafın çevresi: 2 · ${x} + 2 · 15 = ${f} cm<br>Yeni dikdörtgen: ${3 * x} cm ve 5 cm → çevre ${y} cm<br>Fark: <b>${y - f} cm</b> · 4x ${E} 20 = ${4 * x - 20}`); },
        kosullar: [{ ad: "Uç uca dizilim incelendi.", f: v => v[1] === "Uç uca dizilim" }, { ad: "Fark 4x − 20 ile aynı çıktı.", f: v => 6 * v[0] + 10 - 2 * v[0] - 30 === 4 * v[0] - 20 }],
        sutun: ["x", "Fotoğraf", "Yeni çevre", "Fark"], satir: v => [v[0], 2 * v[0] + 30, 6 * v[0] + 10, 4 * v[0] - 20],
        yon: "x'i seçin ve iki görünüm arasında geçiş yapın. Her parçanın kenarları kaçar santimetre? Farkı farklı x değerlerinde 4x − 20 ile karşılaştırın.", bitis: "Dizilimi en az iki x değeriyle incelediğinizde." }),

    /* 5 · İki kova: (4s + 3) ve (2s − 1), aktarılan (s + 2) */
    5: el => KO(el, { girdi: [{ ad: "s", min: 2, max: 9, bas: 3 }, { ad: "Zaman:", sec: ["Aktarmadan önce", "Aktarmadan sonra"], bas: "Aktarmadan önce" }],
        ciz: v => { const s = v[0], son = v[1] === "Aktarmadan sonra", a = son ? 3 * s + 1 : 4 * s + 3, b = son ? 3 * s + 1 : 2 * s - 1;
          return sutunlar([["1. kova", a, "#74c0fc"], ["2. kova", b, "#a5d8ff"]], 360, 190, 40)
            + kutu(son ? `1. kova: ${4 * s + 3} ${E} ${s + 2} = ${a} L · 2. kova: ${2 * s - 1} + ${s + 2} = ${b} L<br>Fark: <b>${a - b} L</b>` : `1. kova ${a} L · 2. kova ${b} L · Fark ${a - b} L`); },
        kosullar: [{ ad: "Aktarmadan sonraki durum incelendi.", f: v => v[1] === "Aktarmadan sonra" }],
        sutun: ["s", "Zaman", "1. kova", "2. kova", "Fark"], satir: v => { const s = v[0], son = v[1] === "Aktarmadan sonra"; return [s, son ? "sonra" : "önce", son ? 3 * s + 1 : 4 * s + 3, son ? 3 * s + 1 : 2 * s - 1, son ? 0 : 2 * s + 4]; },
        yon: "s'yi değiştirin; her s için aktarmadan önceki ve sonraki durumu karşılaştırın. Aktarılan su hangi kovadan çıkar, hangisine eklenir?", bitis: "Aktarmadan sonra iki kovanın her s için eşit olduğunu gördüğünüzde." }),

    /* 6 · Karton: (4a + 7) × (a + 6), köşeden 3 cm kare kesilip uzun kenarın ortasına yapıştırılıyor */
    6: el => KO(el, { girdi: [{ ad: "a", min: 1, max: 6, bas: 2 }, { ad: "Adım:", sec: ["Dikdörtgen", "Köşe kesildi", "Kare yapıştırıldı"], bas: "Dikdörtgen" }],
        ciz: v => { const a = v[0], W = 4 * a + 7, H = a + 6, u = Math.min(14, 380 / W), k = 3 * u, x0 = 20, y0 = 40, ad = v[1];
          let p = ad === "Dikdörtgen" ? `${x0},${y0} ${x0 + W * u},${y0} ${x0 + W * u},${y0 + H * u} ${x0},${y0 + H * u}`
            : `${x0},${y0} ` + (ad === "Kare yapıştırıldı" ? `${x0 + W * u / 2 - k / 2},${y0} ${x0 + W * u / 2 - k / 2},${y0 - k} ${x0 + W * u / 2 + k / 2},${y0 - k} ${x0 + W * u / 2 + k / 2},${y0} ` : "") + `${x0 + W * u - k},${y0} ${x0 + W * u - k},${y0 + k} ${x0 + W * u},${y0 + k} ${x0 + W * u},${y0 + H * u} ${x0},${y0 + H * u}`;
          const c = 2 * W + 2 * H + (ad === "Kare yapıştırıldı" ? 6 : 0);
          return svg(420, y0 + H * u + 12, `<polygon points="${p}" fill="#fff3bf" stroke="#1d2433" stroke-width="2"/>`, "Karton")
            + kutu(`Kenarlar: ${W} cm ve ${H} cm · Çevre: <b>${c} cm</b><br>10a + 26 = ${10 * a + 26} · 10a + 32 = ${10 * a + 32}`); },
        kosullar: [{ ad: "Köşe kesilince çevrenin değişmediği görüldü.", f: v => v[1] !== "Dikdörtgen" }, { ad: "Kare yapıştırılınca çevre bulundu.", f: v => v[1] === "Kare yapıştırıldı" }],
        sutun: ["a", "Adım", "Çevre (cm)"], satir: v => [v[0], v[1], 10 * v[0] + 26 + (v[1] === "Kare yapıştırıldı" ? 6 : 0)],
        yon: "a'yı seçin ve üç adımı sırayla inceleyin. Köşeden kare kesilince çevre değişiyor mu? Kare kenarın ortasına yapıştırılınca çevre ne kadar artıyor?", bitis: "Üç adımın çevrelerini defterde karşılaştırdığınızda." }),

    /* 7 · Kulüpler: S = n, R = n + 8, D = (n + 8)/2, M = D − 6 */
    7: el => KO(el, { girdi: [{ ad: "Satranç kulübü n:", sec: ["10", "12", "14", "16", "18", "20"], bas: "12" }],
        ciz: v => { const n = +v[0], r = n + 8, d = r / 2, m = d - 6, t = n + r + d + m;
          return sutunlar([["Satranç", n, "#a5d8ff"], ["Robotik", r, "#ffc078"], ["Drama", d, "#d0bfff"], ["Müzik", m, "#b2f2bb"]], 420, 180, 30)
            + kutu(`Drama: (${n} + 8) : 2 = ${d} · Müzik: ${d} ${E} 6 = ${m}<br>Toplam: <b>${t}</b> · 3n + 10 = ${3 * n + 10}`); },
        kosullar: [{ ad: "Toplam 3n + 10 ifadesinin değerine eşit.", f: v => { const n = +v[0]; return n + (n + 8) + (n + 8) / 2 + (n + 8) / 2 - 6 === 3 * n + 10; } }],
        sutun: ["n", "Robotik", "Drama", "Müzik", "Toplam", "3n + 10"], satir: v => { const n = +v[0]; return [n, n + 8, (n + 8) / 2, (n + 8) / 2 - 6, 3 * n + 10, 3 * n + 10]; },
        yon: "Satranç kulübündeki öğrenci sayısını değiştirin. Dramayı bulurken (n + 8)'in tamamının yarısını alın. Toplamı her denemede 3n + 10 ile karşılaştırın.", bitis: "En az üç n değerinde toplamın 3n + 10 olduğunu gördüğünüzde." }),

    /* 8 · İki apartman: A 6 kat (h + 0,3), B 8 kat h */
    8: el => KO(el, { girdi: [{ ad: "Bir katın yüksekliği h (m):", sec: ["2,7", "2,8", "2,9", "3"], bas: "2,8" }],
        ciz: v => { const h = +v[0].replace(",", "."), A = 6 * (h + 0.3), B = 8 * h;
          return sutunlar([["A (6 kat)", A, "#ffe8cc"], ["B (8 kat)", B, "#d0ebff"]], 360, 200, 26)
            + kutu(`A: 6 · (${D(h)} + 0,3) = ${D(A)} m · B: 8 · ${D(h)} = ${D(B)} m<br>B ${E} A = <b>${D(B - A)} m</b> · 2h ${E} 1,8 = ${D(2 * h - 1.8)}`); },
        kosullar: [{ ad: "B − A farkı 2h − 1,8 ile aynı çıktı.", f: v => { const h = +v[0].replace(",", "."); return Math.abs(8 * h - 6 * (h + 0.3) - (2 * h - 1.8)) < 1e-9; } }],
        sutun: ["h", "A", "B", "B − A"], satir: v => { const h = +v[0].replace(",", "."); return [v[0], D(6 * (h + 0.3)), D(8 * h), D(2 * h - 1.8)]; },
        yon: "Bir katın yüksekliğini değiştirin. A'nın her katı 0,3 m daha yüksektir; 6 kat için 0,3'ün de 6 ile çarpıldığına dikkat edin.", bitis: "Farkın her h için 2h − 1,8 olduğunu gördüğünüzde." }),

    /* 9 · Dart: Ece 2 iç + 3 dış, Ali 1 iç + 2 orta + 2 dış */
    9: el => KO(el, { girdi: [{ ad: "x", min: 2, max: 9, bas: 2 }],
        ciz: v => { const x = v[0], ic = 3 * x + 2, or = 2 * x, dis = x - 1, e = 2 * ic + 3 * dis, a = ic + 2 * or + 2 * dis;
          return tablo(["Halka", "Puan", "Ece", "Ali"], [["İç", ic, 2, 1], ["Orta", or, 0, 2], ["Dış", dis, 3, 2]])
            + kutu(`Ece: 2 · ${ic} + 3 · ${dis} = ${e} · Ali: ${ic} + 2 · ${or} + 2 · ${dis} = ${a}<br>Ece ${E} Ali = <b>${e - a}</b>`); },
        kosullar: [{ ad: "Fark hesaplandı.", f: v => true }, { ad: "x = 9 da denendi.", f: v => v[0] === 9 }],
        sutun: ["x", "Ece", "Ali", "Fark"], satir: v => { const x = v[0]; return [x, 9 * x + 1, 9 * x, 1]; },
        yon: "x'i değiştirin; her denemede iki oyuncunun puanını ve farkı hesaplayın. Fark x'e bağlı mı? Küçük ve büyük x değerlerini deneyin.", bitis: "Farkın her x için aynı olduğunu defterden gördüğünüzde." }),

    /* 10 · Kitaplık: yükseklik 4(x + 6) + 5 · 2, genişlik 70 */
    10: el => KO(el, { girdi: [{ ad: "Raf aralığı için x (cm)", min: 20, max: 34, bas: 26 }],
        ciz: v => { const x = v[0], H = 4 * (x + 6) + 10, A = 70 * H, u = 0.9; let s = "", y = 8;
          for (let i = 0; i < 5; i++) { s += rc(40, y, 70 * u * 2, 2 * u * 2, "#a0522d", "#5c3317", 0); y += 2 * u * 2; if (i < 4) { s += tx(40 + 70 * u + 0, y + (x + 6) * u * .5 + 5, `${x + 6} cm`, { fs: 12 }); y += (x + 6) * u; } }
          return svg(300, y + 10, s, "Kitaplık") + kutu(`Yükseklik: 4 · ${x + 6} + 5 · 2 = ${H} cm<br>Alan: 70 · ${H} = <b>${B(A)} cm²</b> · 280x + 2 380 = ${B(280 * x + 2380)}`); },
        kosullar: [{ ad: "Alan 280x + 2 380 ifadesinin değerine eşit.", f: v => 70 * (4 * (v[0] + 6) + 10) === 280 * v[0] + 2380 }],
        sutun: ["x", "Yükseklik", "Alan", "280x + 2 380"], satir: v => [v[0], 4 * v[0] + 34, B(70 * (4 * v[0] + 34)), B(280 * v[0] + 2380)],
        yon: "x'i değiştirin. Yükseklikte 4 raf aralığını ve 5 tahtayı birlikte toplayın; sonra 70 ile çarpın. Sonucu 280x + 2 380 ile karşılaştırın.", bitis: "Birkaç x değerinde alanın 280x + 2 380 olduğunu gördüğünüzde." }),

    /* 11 · Raf: (8w + 20), 3 kutu w, 2 kutu (2w − 3) */
    11: el => KO(el, { girdi: [{ ad: "w (cm)", min: 10, max: 20, bas: 12 }],
        ciz: v => { const w = v[0], L = 8 * w + 20, K = 3 * w + 2 * (2 * w - 3), u = 500 / L; let s = rc(10, 66, L * u, 8, "#a0522d", "#5c3317", 0), x = 10;
          for (let i = 0; i < 5; i++) { const b = i < 3 ? w : 2 * w - 3; s += rc(x, 26, b * u, 40, i < 3 ? "#d0ebff" : "#ffe8cc") + tx(x + b * u / 2, 52, b, { fs: 12 }); x += b * u; }
          s += tx((x + 10 + L * u) / 2, 52, L - K, { fs: 13, r: "#2b8a3e" });
          return svg(520, 84, s, "Raf") + kutu(`Raf: ${L} cm · Kutular: 3 · ${w} + 2 · ${2 * w - 3} = ${K} cm<br>Boş kısım: <b>${L - K} cm</b> · w + 26 = ${w + 26}`); },
        kosullar: [{ ad: "Boş kısım w + 26 ile aynı çıktı.", f: v => 8 * v[0] + 20 - 7 * v[0] + 6 === v[0] + 26 }],
        sutun: ["w", "Raf", "Kutular", "Boş kısım"], satir: v => [v[0], 8 * v[0] + 20, 7 * v[0] - 6, v[0] + 26],
        yon: "w'yi değiştirin; kutuların toplam genişliğini ve kalan boş kısmı hesaplayın. Boş kısmı her denemede w + 26 ile karşılaştırın.", bitis: "En az üç w değerinde boş kısmın w + 26 olduğunu gördüğünüzde." }),

    /* 12 · Kantin: su s, meyve suyu 3s, poğaça 3s − 5 */
    12: el => KO(el, { girdi: [{ ad: "Suyun fiyatı s (TL):", sec: ["6", "8", "10", "12"], bas: "8" }],
        ciz: v => { const s = +v[0], m = 3 * s, p = 3 * s - 5, e = 2 * s + p, c = m + 2 * p;
          return tablo(["Ürün", "Fiyat (TL)"], [["Su", s], ["Meyve suyu", m], ["Poğaça", p]])
            + kutu(`Ece: 2 · ${s} + ${p} = ${e} TL · Can: ${m} + 2 · ${p} = ${c} TL<br>Can ${E} Ece = <b>${c - e} TL</b> · 4s ${E} 5 = ${4 * s - 5}`); },
        kosullar: [{ ad: "Fark 4s − 5 ile aynı çıktı.", f: v => { const s = +v[0]; return (3 * s + 2 * (3 * s - 5)) - (2 * s + 3 * s - 5) === 4 * s - 5; } }],
        sutun: ["s", "Ece", "Can", "Fark"], satir: v => { const s = +v[0]; return [s, 5 * s - 5, 9 * s - 10, 4 * s - 5]; },
        yon: "Suyun fiyatını değiştirin. Önce meyve suyu ve poğaçanın fiyatını bulun, sonra iki fişin tutarını hesaplayın. Farkı 4s − 5 ile karşılaştırın.", bitis: "Farkın her s için 4s − 5 olduğunu gördüğünüzde." }),

    /* 13 · Boya: (8b + 12) + (4b + 6), 3/4'ü kullanıldı */
    13: el => KO(el, { girdi: [{ ad: "b", min: 1, max: 8, bas: 2 }, { ad: "Gösterilen:", sec: ["Karışım", "Kullanılan", "Kalan"], bas: "Karışım" }],
        ciz: v => { const b = v[0], T = 12 * b + 18, k = T / 4;
          return serit([["Kullanılan (3/4)", T - k, "#74c0fc"], ["Kalan (1/4)", k, "#e7f5ff"]], 420, x => D(x) + " L")

", "son": "<p>Mavi bardaklardan 8 bardaklık, turuncu bardaklardan da 8 bardaklık birer yığın yapılmıştır.</p>", "k": "Buna göre, mavi yığının boyu turuncu yığının boyundan kaç santimetre fazladır?", "sec": ["0,6", "2,2", "2,8", "4,2"], "secg": null, "c": "B", "a": ["8 bardaklık yığında ilk bardağın üstüne 7 bardak eklenir. Mavi yığın h + 7 · 1,6 = h + 11,2 cm'dir.", "Turuncu yığın (h + 2) + 7 · 1 = h + 9 cm'dir.", "(h + 11,2) − (h + 9) = h + 11,2 − h − 9 = 2,2. Fark h'ye bağlı değildir."], "t": "0,6: yalnız bir bardağın eklediği fark alınmış; 4,2: turuncu bardağın 2 cm uzun olduğu unutulmuş; 2,8: 8 ekleme sayılmış.", "d": "8 bardaklık yığında ilk bardak tam boyuyla, sonraki 7 bardak yalnız eklediği miktarla sayılır. Farkı bulurken turuncu bardağın 2 cm uzun olduğunu unutmayın; h, farkta kaybolur.", "ses": "b03"}, {"no": 4, "on": "<p>Kenarları x cm ve 15 cm olan dikdörtgen biçimindeki bir fotoğraf, x cm'lik kenarına paralel iki kesik çizgi boyunca 3 eş dikdörtgen parçaya kesilmiştir (x, 15'ten büyüktür). Parçalar, kısa kenarları birleşecek şekilde uç uca dizilerek yeni bir dikdörtgen elde edilmiştir.</p>", "g": "<svg viewBox=\"0 0 758 172\" width=\"758\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"110.0\" y=\"20.0\" width=\"220.0\" height=\"120.0\" rx=\"0\" fill=\"#e7f5ff\" stroke=\"#111111\" stroke-width=\"2.2\"/><line x1=\"104\" y1=\"60\" x2=\"336\" y2=\"60\" stroke=\"#111111\" stroke-width=\"1.6\" stroke-dasharray=\"7 5\"/><line x1=\"104\" y1=\"100\" x2=\"336\" y2=\"100\" stroke=\"#111111\" stroke-width=\"1.6\" stroke-dasharray=\"7 5\"/><text x=\"220.0\" y=\"162.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">x cm</text><text x=\"100.0\" y=\"85.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">15 cm</text><line x1=\"350.0\" y1=\"80.0\" x2=\"400.0\" y2=\"80.0\" stroke=\"#111111\" stroke-width=\"2.2\"/><polygon points=\"400.0,80.0 392.7,83.3 392.7,76.7\" fill=\"#111111\"/><rect x=\"414.0\" y=\"62.0\" width=\"110.0\" height=\"40.0\" rx=\"0\" fill=\"#e7f5ff\" stroke=\"#111111\" stroke-width=\"2\"/><rect x=\"524.0\" y=\"62.0\" width=\"110.0\" height=\"40.0\" rx=\"0\" fill=\"#e7f5ff\" stroke=\"#111111\" stroke-width=\"2\"/><rect x=\"634.0\" y=\"62.0\" width=\"110.0\" height=\"40.0\" rx=\"0\" fill=\"#e7f5ff\" stroke=\"#111111\" stroke-width=\"2\"/></svg>", "son": "", "k": "Buna göre, yeni dikdörtgenin çevresi fotoğrafın çevresinden kaç santimetre fazladır?", "sec": ["4x + 20", "4x − 10", "8x − 20", "4x − 20"], "secg": null, "c": "D", "a": ["Her parçanın kenarları x cm ve 15 : 3 = 5 cm'dir. Yeni dikdörtgenin kenarları 3x cm ve 5 cm'dir; çevresi 6x + 10.", "Fotoğrafın çevresi 2x + 30'dur.", "(6x + 10) − (2x + 30) = 4x − 20."], "t": "4x + 20: 30'un işareti değiştirilmemiş; 4x − 10: yeni çevrede 5 cm'lik kenar bir kez alınmış; 8x − 20: fotoğrafın çevresindeki 2x eklenmiş.", "d": "Her parçanın kenarları x cm ve 5 cm'dir (15 cm üçe bölünür). Parçalar uç uca dizilince x'li kenarlar art arda gelir: 3x cm. İki çevreyi ayrı ayrı yazıp çıkarın; çıkarılan ifadenin her teriminin işareti değişir.", "ses": "b04"}, {"no": 5, "on": "<p>Bir bahçıvanın iki kovasından birincisinde (4s + 3) L, ikincisinde (2s − 1) L su vardır (s, 1'den büyük bir doğal sayıdır). Bahçıvan birinci kovadan ikinci kovaya (s + 2) L su aktarmıştır.</p>", "g": "<svg viewBox=\"0 0 690 178\" width=\"690\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><path d=\"M60 70 L150 70 L138 166 L72 166 Z\" fill=\"#f1f3f5\" stroke=\"#495057\" stroke-width=\"2\"/><path d=\"M64.8 108.4 L145.2 108.4 L138 166 L72 166 Z\" fill=\"#d0ebff\" stroke=\"none\"/><path d=\"M64 70 Q 105.0 24 146 70\" fill=\"none\" stroke=\"#495057\" stroke-width=\"2\"/><path d=\"M400 70 L490 70 L478 166 L412 166 Z\" fill=\"#f1f3f5\" stroke=\"#495057\" stroke-width=\"2\"/><path d=\"M407.8 132.4 L482.2 132.4 L478 166 L412 166 Z\" fill=\"#d0ebff\" stroke=\"none\"/><path d=\"M404 70 Q 445.0 24 486 70\" fill=\"none\" stroke=\"#495057\" stroke-width=\"2\"/><rect x=\"160.0\" y=\"92.0\" width=\"170.0\" height=\"66.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"160.0\" y=\"92.0\" width=\"170.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"245.0\" y=\"114.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">1. KOVA</text><text x=\"245.0\" y=\"145.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">(4s + 3) L</text><rect x=\"500.0\" y=\"92.0\" width=\"170.0\" height=\"66.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"500.0\" y=\"92.0\" width=\"170.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"585.0\" y=\"114.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2. KOVA</text><text x=\"585.0\" y=\"145.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">(2s − 1) L</text><line x1=\"170.0\" y1=\"40.0\" x2=\"390.0\" y2=\"40.0\" stroke=\"#1c7ed6\" stroke-width=\"2.4\"/><polygon points=\"390.0,40.0 382.7,43.3 382.7,36.7\" fill=\"#1c7ed6\"/><text x=\"280.0\" y=\"30.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">aktarılan su: (s + 2) L</text></svg>", "son": "", "k": "Buna göre, su aktarıldıktan sonra kovalardaki su miktarlarıyla ilgili aşağıdakilerden hangisi doğrudur?", "sec": ["Birinci kovada ikinciden (2s + 4) L fazla su vardır.", "Birinci kovada ikinciden (s + 2) L fazla su vardır.", "İki kovadaki su miktarı eşittir.", "Birinci kovada ikinciden 4 L fazla su vardır."], "secg": null, "c": "C", "a": ["Birinci kovada (4s + 3) − (s + 2) = 3s + 1 L su kalır.", "İkinci kovada (2s − 1) + (s + 2) = 3s + 1 L su olur.", "İki ifade aynıdır; s'nin her değeri için kovalardaki su miktarı eşittir."], "t": "(2s + 4): aktarmadan önceki fark; (s + 2): aktarılan su yalnız birinci kovadan çıkarılmış; 4 L: −(s + 2) yazılırken 2'nin işareti değiştirilmemiş.", "d": "Aktarılan su bir kovadan çıkar, öbürüne eklenir: birinci kova (s + 2) azalır, ikinci kova (s + 2) artar. Aradaki fark 2(s + 2) kadar değişir.", "ses": "b05"}, {"no": 6, "on": "<p>Kenarları (4a + 7) cm ve (a + 6) cm olan dikdörtgen biçimindeki bir kartonun bir köşesinden, kenarı 3 cm olan kare biçiminde bir parça kesilmiştir. Kesilen parça, kartonun (4a + 7) cm'lik bir kenarının ortasına şekildeki gibi yapıştırılmıştır.</p>", "g": "<svg viewBox=\"0 0 706 184\" width=\"706\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"104,30 330,30 330,54 354,54 354,150 104,150\" fill=\"#fff3bf\" stroke=\"#111111\" stroke-width=\"2.2\"/><rect x=\"330.0\" y=\"30.0\" width=\"24.0\" height=\"24.0\" rx=\"0\" fill=\"none\" stroke=\"#111111\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/><text x=\"229.0\" y=\"172.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">(4a + 7) cm</text><text x=\"94.0\" y=\"95.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">(a + 6) cm</text><text x=\"342.0\" y=\"22.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">3 cm</text><line x1=\"372.0\" y1=\"90.0\" x2=\"420.0\" y2=\"90.0\" stroke=\"#111111\" stroke-width=\"2.2\"/><polygon points=\"420.0,90.0 412.7,93.3 412.7,86.7\" fill=\"#111111\"/><polygon points=\"440,30 553.0,30 553.0,6 577.0,6 577.0,30 666,30 666,54 690,54 690,150 440,150\" fill=\"#fff3bf\" stroke=\"#111111\" stroke-width=\"2.2\"/><text x=\"565.0\" y=\"172.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">yeni şekil</text></svg>", "son": "", "k": "Buna göre, oluşan yeni şeklin çevresini santimetre cinsinden gösteren ifade aşağıdakilerden hangisidir?", "sec": ["10a + 32", "10a + 26", "10a + 20", "10a + 38"], "secg": null, "c": "A", "a": ["Kartonun çevresi 2(4a + 7) + 2(a + 6) = 10a + 26'dır.", "Köşeden kare kesmek çevreyi değiştirmez: kaybolan iki kenarın yerine aynı uzunlukta iki kenar gelir.", "Kenarın ortasına yapıştırılan kare çevreye iki yan kenarını ekler: 10a + 26 + 2 · 3 = 10a + 32."], "t": "10a + 26: yapıştırılan karenin etkisi unutulmuş; 10a + 20: köşeden kesilen parça çevreden çıkarılmış; 10a + 38: köşe kesimi de çevreyi artırıyor sanılmış.", "d": "Köşeden kare kesmek çevreyi değiştirmez: kaybolan iki kenarın yerine aynı uzunlukta iki kenar gelir. Kenarın ortasına yapıştırılan kare ise çevreye iki yan kenarı kadar (3 + 3 = 6 cm) ekler.", "ses": "b06"}, {"no": 7, "on": "<p>Bir okulun dört kulübündeki öğrenci sayıları arasındaki ilişkiler okul panosunda yazılıdır. Satranç kulübünde n öğrenci vardır (n bir çift sayıdır).</p>", "g": "<svg viewBox=\"0 0 760 120\" width=\"760\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8.0\" y=\"10.0\" width=\"176.0\" height=\"100.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"8.0\" y=\"10.0\" width=\"176.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"96.0\" y=\"32.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">SATRANÇ</text><text x=\"96.0\" y=\"63.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14.5\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">n öğrenci</text><rect x=\"194.0\" y=\"10.0\" width=\"176.0\" height=\"100.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"194.0\" y=\"10.0\" width=\"176.0\" height=\"32.0\" rx  fill=\"#111111\" text-anchor=\"middle\">6 öğrenci az</text></svg>", "son": "", "k": "Buna göre, dört kulüpteki toplam öğrenci sayısını gösteren ifade aşağıdakilerden hangisidir?", "sec": ["3n + 18", "<span class=\"frac\"><span>5n</span><span>2</span></span> + 12", "3n + 22", "3n + 10"], "secg": null, "c": "D", "a": ["Robotik n + 8, drama <span class=\"frac\"><span>1</span><span>2</span></span>(n + 8) = <span class=\"frac\"><span>n</span><span>2</span></span> + 4, müzik (<span class=\"frac\"><span>n</span><span>2</span></span> + 4) − 6 = <span class=\"frac\"><span>n</span><span>2</span></span> − 2 öğrencidir.", "Toplam: n + (n + 8) + (<span class=\"frac\"><span>n</span><span>2</span></span> + 4) + (<span class=\"frac\"><span>n</span><span>2</span></span> − 2).", "n + n + <span class=\"frac\"><span>n</span><span>2</span></span> + <span class=\"frac\"><span>n</span><span>2</span></span> = 3n; 8 + 4 − 2 = 10. Toplam 3n + 10."], "t": "3n + 18: dramada yalnız n yarıya bölünmüş; <span class=\"frac\"><span>5n</span><span>2</span></span> + 12: müzik kulübü unutulmuş; 3n + 22: müzik dramadan 6 fazla alınmış.", "d": "Drama, robotiğin yarısıdır: (n + 8)'in yarısı n/2 + 4'tür; parantezdeki her terim 1/2 ile çarpılır. Müzik için drama ifadesinden 6 çıkarın.", "ses": "b07"}, {"no": 8, "on": "<p>Bir sitedeki iki apartmanın kat sayıları ve bir katının yüksekliği aşağıdaki tabloda verilmiştir. Apartmanların yüksekliği, katlarının yüksekliklerinin toplamıdır.</p>", "g": "<svg viewBox=\"0 0 696.0 232\" width=\"696\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"30.0\" y=\"68.0\" width=\"90.0\" height=\"132.0\" rx=\"2\" fill=\"#ffe8cc\" stroke=\"#495057\" stroke-width=\"1.8\"/><line x1=\"30.0\" y1=\"90.0\" x2=\"120.0\" y2=\"90.0\" stroke=\"#495057\" stroke-width=\"1\"/><line x1=\"30.0\" y1=\"112.0\" x2=\"120.0\" y2=\"112.0\" stroke=\"#495057\" stroke-width=\"1\"/><line x1=\"30.0\" y1=\"134.0\" x2=\"120.0\" y2=\"134.0\" stroke=\"#495057\" stroke-width=\"1\"/><line x1=\"30 ": ["280x + 2 240", "280x + 1 680", "280x + 34", "280x + 2 380"], "secg": null, "c": "D", "a": ["Yükseklik 4(x + 6) + 5 · 2 = 4x + 24 + 10 = 4x + 34 cm'dir.", "Alan 70(4x + 34) = 70 · 4x + 70 · 34 = 280x + 2 380 santimetrekaredir."], "t": "280x + 2 240: 4 tahta sayılmış; 280x + 1 680: tahtalar unutulmuş; 280x + 34: 70 yalnız 4x ile çarpılmış.", "d": "Yüksekliği bulurken raf aralıklarını ve tahtaları birlikte toplayın: 4(x + 6) + 5 · 2. Sonra 70'i ifadenin her terimiyle çarpın; yalnız 4x'i çarpmak yetmez.", "ses": "b10"}, {"no": 11, "on": "<p>Bir mağaza vitrinindeki rafın uzunluğu (8w + 20) cm'dir. Rafa genişliği w cm olan 3 kutu ile genişliği (2w − 3) cm olan 2 kutu, aralarında boşluk kalmayacak şekilde yan yana dizilmiştir.</p>", "g": "<svg viewBox=\"0 0 740 156\" width=\"740\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"14.0\" y=\"96.0\" width=\"712.0\" height=\"12.0\" rx=\"2\" fill=\"#a0522d\" stroke=\"#5c3317\" stroke-width=\"1.4\"/><rect x=\"14.0\" y=\"40.0\" width=\"70.0\" height=\"56.0\" rx=\"2\" fill=\"#d0ebff\" stroke=\"#495057\" stroke-width=\"1.6\"/><text x=\"49.0\" y=\"74.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">w</text><rect x=\"84.0\" y=\"40.0\" width=\"70.0\" height=\"56.0\" rx=\"2\" fill=\"#d0ebff\" stroke=\"#495057\" stroke-width=\"1.6\"/><text x=\"119.0\" y=\"74.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">w</text><rect x=\"154.0\" y=\"40.0\" width=\"70.0\" height=\"56.0\" rx=\"2\" fill=\"#d0ebff\" stroke=\"#495057\" stroke-width=\"1.6\"/><text x=\"189.0\" y=\"74.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">w</text><rect x=\"224.0\" y=\"40.0\" width=\"128.0\" height=\"56.0\" rx=\"2\" fill=\"#ffe8cc\" stroke=\"#495057\" stroke-width=\"1.6\"/><text x=\"288.0\" y=\"74.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2w − 3</text><rect x=\"352.0\" y=\"40.0\" width=\"128.0\" height=\"56.0\" rx=\"2\" fill=\"#ffe8cc\" stroke=\"#495057\" stroke-width=\"1.6\"/><text x=\"416.0\" y=\"74.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2w − 3</text><text x=\"603.0\" y=\"74.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"900\" fill=\"#111111\" text-anchor=\"middle\">?</text><path d=\"M14 120 v7 H726 v-7\" fill=\"none\" stroke=\"#111111\" stroke-width=\"1.5\"/><text x=\"370.0\" y=\"146.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">(8w + 20) cm</text><text x=\"370.0\" y=\"22.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Kutuların genişlikleri santimetre cinsindendir.</text></svg>", "son": "", "k": "Buna göre, rafta kalan boş kısmın uzunluğunu santimetre cinsinden gösteren ifade aşağıdakilerden hangisidir?", "sec": ["w + 26", "w + 14", "w + 17", "3w + 23"], "secg": null, "c": "A", "a": ["Kutuların toplam genişliği 3w + 2(2w − 3) = 3w + 4w − 6 = 7w − 6'dır.", "Boş kısım (8w + 20) − (7w − 6) = 8w + 20 − 7w + 6 = w + 26."], "t": "w + 14: −6'nın işareti değiştirilmemiş; w + 17: 2(2w − 3) = 4w − 3 alınmış; 3w + 23: (2w − 3) cm'lik kutulardan biri sayılmış.", "d": "Kutuların toplam genişliğini önce tek bir ifade olarak yazın: 3w + 2(2w − 3) = 7w − 6. Bu ifadeyi raftan çıkarırken −6'nın işareti değişir.", "ses": "b11"}, {"no": 12, "on": "<p>Bir okul kantininde bir şişe suyun fiyatı s TL'dir. Bir kutu meyve suyu bir şişe sudan 3 kat pahalı, bir poğaça da bir kutu meyve suyundan 5 TL ucuzdur.</p>", "g": "<svg viewBox=\"0 0 716 140\" width=\"716\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"10.0\" y=\"10.0\" width=\"330.0\" height=\"118.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"10.0\" y=\"10.0\" width=\"330.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"175.0\" y=\"32.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">KANTİN FİYAT LİSTESİ</text><text x=\"175.0\" y=\"63.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14.5\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Su: s TL</text><text x=\"175.0\" y=\"89.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14.5\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Meyve suyu: suyun 3 katı</text><text x=\"175.0\" y=\"115.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14.5\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Poğaça: meyve suyundan 5 TL ucuz</text><rect x=\"360.0\" y=\"10.0\" width=\"160.0\" height=\"92.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"360.0\" y=\"10.0\" width=\"160.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"440.0\" y=\"32.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Ece'nin fişi</text><text x=\"440.0\" y=\"63.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14.5\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">2 su</text><text x=\"440.0\" y=\"89.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14.5\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">1 poğaça</text><rect x=\"536.0\" y=\"10.0\" width=\"170.0\" height=\"92.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"536.0\" y=\"10.0\" width=\"170.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"621.0\" y=\"32.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Can'ın fişi</text><text x=\"621.0\" y=\"63.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14.5\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">1 meyve suyu</text><text x=\"621.0\" y=\"89.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14.5\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">2 poğaça</text></svg>", "son": "<p>Ece ile Can'ın aldıkları ürünler fişlerinde yazılıdır.</p>", "k": "Buna göre, Can'ın ödediği tutar Ece'nin ödediği tutardan kaç TL fazladır?", "sec": ["4s − 15", "4s + 5", "4s − 5", "14s − 15"], "secg": null, "c": "C", "a": ["Meyve suyu 3s TL, poğaça (3s − 5) TL'dir.", "Ece: 2s + (3s − 5) = 5s − 5. Can: 3s + 2(3s − 5) = 9s − 10.", "(9s − 10) − (5s − 5) = 9s − 10 − 5s + 5 = 4s − 5."], "t": "4s − 15: Ece'nin tutarındaki −5'in işareti değiştirilmemiş; 4s + 5: −10 ile 5 yer değiştirmiş; 14s − 15: tutarlar toplanmış.", "d": "Önce her ürünün fiyatını s ile yazın: meyve suyu 3s, poğaça 3s − 5. Farkı alırken Ece'nin tutarının tamamını parantez içinde çıkarın; −5'in işareti değişir.", "ses": "b12"}, {"no": 13, "on": "<p>Bir boyacı açık mavi boya elde etmek için (8b + 12) L beyaz boya ile (4b + 6) L mavi boyayı karıştırmıştır. Hazırlanan karışımın <span class=\"frac\"><span>3</span><span>4</span></span>'ünü bir salonu boyamak için kullanmıştır.</p>", "g": "<svg viewBox=\"0 0 680 248\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><path d=\"M40 70 L130 70 L118 166 L52 166 Z\" fill=\"#f1f3f5\" stroke=\"#495057\" stroke-width=\"2\"/><path d=\"M43.6 98.80000000000001 L126.4 98.80000000000001 L118 166 L52 166 Z\" fill=\"#f8f9fa\" stroke=\"none\"/><path d=\"M44 70 Q 85.0 24 126 70\" fill=\"none\" stroke=\"#495057\" stroke-width=\"2\"/><path d=\"M260 70 L350 70 L338 166 L272 166 Z\" fill=\"#f1f3f5\" stroke=\"#495057\" stroke-width=\"2\"/><path d=\"M263.6 98.80000000000001 L346.4 98.80000000000001 L338 166 L272 166 Z\" fill=\"#74c0fc\" stroke=\"none\"/><path d=\"M264 70 Q 305.0 24 346 70\" fill=\"none\" stroke=\"#495057\" stroke-width=\"2\"/><path d=\"M520 70 L630 70 L618 166 L532 166 Z\" fill=\"#f1f3f5\" stroke=\"#495057\" stroke-width=\"2\"/><path d=\"M523.0 94.0 L627.0 94.0 L618 166 L532 166 Z\" fill=\"#a5d8ff\" stroke=\"none\"/><path d=\"M524 70 Q 575.0 24 626 70\" fill=\"none\" stroke=\"#495057\" stroke-width=\"2\"/><text x=\"195.0\" y=\"120.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"26\" font-weight=\"900\" fill=\"#111111\" text-anchor=\"middle\">+</text><line x1=\"380.0\" y1=\"118.0\" x2=\"500.0\" y2=\"118.0\" stroke=\"#111111\" stroke-width=\"2.2\"/><polygon points=\"500.0,118.0 492.7,121.3 492.7,114.7\" fill=\"#111111\"/><rect x=\"20.0\" y=\"176.0\" width=\"150.0\" height=\"66.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"20.0\" y=\"176.0\" width=\"150.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"95.0\" y=\"198.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">BEYAZ BOYA</text><text x=\"95.0\" y=\"229.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14.5\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">(8b + 12) L</text><rect x=\"240.0\" y=\"176.0\" width=\"150.0\" height=\"66.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"240.0\" y=\"176.0\" width=\"150.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"315.0\" y=\"198.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">MAVİ BOYA</text><text x=\"315.0\" y=\"229.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14.5\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">(4b + 6) L</text><rect x=\"500.0\" y=\"176.0\" width=\"150.0\" height=\"66.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\" ext x=\"395.0\" y=\"90.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">2. parsel</text><text x=\"308.0\" y=\"42.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"start\">çit</text><text x=\"300.0\" y=\"174.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">(3x + 6) m</text><text x=\"100.0\" y=\"90.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">11 m</text></svg>", "son": "", "k": "Buna göre, iki parselin çevreleri toplamı arsanın çevresinden kaç metre fazladır?", "sec": ["11", "22", "44", "3x + 28"], "secg": null, "c": "B", "a": ["Her parselin kenarları 11 m ve <span class=\"frac\"><span>1</span><span>2</span></span>(3x + 6) m'dir; bir parselin çevresi 2 · 11 + (3x + 6) = 3x + 28 m'dir.", "İki parselin çevreleri toplamı 6x + 56, arsanın çevresi 2 · 11 + 2(3x + 6) = 6x + 34 m'dir.", "(6x + 56) − (6x + 34) = 22. Çit iki parselde de sayıldığı için fark çitin 2 katıdır ve x'e bağlı değildir."], "t": "11: çit bir kez sayılmış; 44: çit dört kez sayılmış; 3x + 28: bir parselin çevresi.", "d": "Çit, iki parselin ortak kenarıdır: parsellerin çevreleri toplanınca çit iki kez sayılır. Bu yüzden fark çitin 2 katıdır ve x'e bağlı değildir.", "ses": "b14"}, {"no": 15, "on": "<p>Bir öğrencinin şehir içi ulaşım kartında hafta başında (5b + 40) TL vardır. Bir biniş ücreti (b − 4) TL'dir (b, 4'ten büyüktür). Kartın üç günlük hareketleri tabloda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 604.0 208\" width=\"604\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"14.0\" y=\"30.0\" width=\"220.0\" height=\"136.0\" rx=\"14\" fill=\"#d0ebff\" stroke=\"#1c7ed6\" stroke-width=\"2\"/><rect x=\"30.0\" y=\"60.0\" width=\"46.0\" height=\"34.0\" rx=\"4\" fill=\"#ffd43b\" stroke=\"#a07800\" stroke-width=\"1.2 /* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
