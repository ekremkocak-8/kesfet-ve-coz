<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çözümler · Keşfet ve Çöz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--muted:#5b6478;--line:#dfe5ef;--bg:#f5f7fb;--card:#fff;--ss:#6741d9;--kk:#0b7285;--b:#d0700f;--ok:#2b8a3e;--warn:#c92a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif}
header{background:linear-gradient(135deg,#1c5fbf,#2f8fe0);color:#fff;padding:18px 16px 22px}

main{max-width:780px;margin:14px auto 40px;padding:0 16px}
nav.sec{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}nav.sec button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}

ol.sec{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
ol.sec li{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}ol.sec li.dogru{border-color:var(--ok);background:#ebfbee;font-weight:800}
.adim{border-left:4px solid var(--c);padding:6px 12px;margin:8px 0;background:#fff;border-radius:0 10px 10px 0;animation:gel .35s ease-out}
.adim b{color:var(--c)}@keyframes gel{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dug{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
button.btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.dikkat{background:#fff4e6;border:2px solid #f59f00;border-radius:12px;padding:10px 14px;margin:12px 0 4px}.dikkat b{color:#d9480f}
.tuzak{font-size:15px;color:var(--muted);margin-top:8px}
.cevap{font-weight:900;color:var(--ok);margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid var(--line);padding:8px 10px;text-align:left}th{background:#e3fafc;color:#0b7285;font-size:13px;letter-spacing:.06em}
.ses{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border-radius:12px;background:#eef2ff}

.ses span{font-size:14px;color:var(--muted)}
.gizli{display:none}
.tum{margin:4px 0 14px;font-size:14px}.tum a{color:#1c5fbf;font-weight:800}
@media (prefers-reduced-motion:reduce){.adim{animation:none}}
/* Canlandır (05.10.2026) */
.sek{display:flex;gap:6px;margin:12px 0 0;border-bottom:2px solid var(--line)}
.sek button{border:0;background:none;font:inherit;font-weight:900;font-size:15px;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);min-height:44px;position:relative;top:2px;border-bottom:3px solid transparent}
.sek button[aria-selected=true]{color:var(--c);border-bottom-color:var(--c);background:#fff8f0}
.sek .yeni{display:inline-block;font-size:10px;background:#2b8a3e;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.06em}
.cn{padding-top:10px}
.cn-yon{background:#eef6ff;border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:10px}
.cn-sahne{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;min-height:120px;overflow-x:auto}

.cn-adimci input,.cn-test input{width:84px;height:44px;border:2px solid var(--line);border-radius:12px;font:inherit;font-weight:900;text-align:center;font-size:18px}
.cn-test label{font-weight:800;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.cn-btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
.cn-btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.cn-btn[aria-pressed=true]{background:var(--ac,var(--c));color:#fff;border-color:var(--ac,var(--c))}
.cn-btn:disabled{opacity:.5}
.cn-hazir{display:flex;flex-wrap:wrap;gap:6px}

.cn-dur .iyi{color:var(--ok);font-weight:900}.cn-dur .kotu{color:var(--warn);font-weight:900}
.cn-df{margin-top:10px;overflow-x:auto}@media(max-width:480px){.cn-adimci>span{flex-basis:100%}.cn-h{font-size:12px;padding:5px 0}.cn-izg{gap:3px}.cn-sahne{padding:6px}}@media(max-width:480px){.cn-df table{font-size:13px}.cn-df td,.cn-df th{padding:4px 5px}}.cn-df summary{font-weight:900;cursor:pointer;padding:6px 0}.cn-say{color:var(--muted);font-weight:700}
.cn-df table{font-size:15px}.cn-df td{padding:5px 8px}.cn-df tr.cn-iyi td{background:#ebfbee}.cn-df tr.cn-kotu td{background:#fff5f5}.cn-df tr.cn-son td{outline:2px solid var(--c);outline-offset:-2px}
.cn-p{animation:cnGel .35s ease-out both}@keyframes cnGel{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cn-o{fill:#ffa94d;stroke:#d9480f;stroke-width:1}.cn-o2{fill:#e8590c}.cn-k{fill:#ffc9c9;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:3 2}
.cn-cerceve{stroke:#2b8a3e;stroke-width:3}.cn-et{font-size:13px;font-weight:800;fill:#5b6478}.cn-et.b,.cn-et2b{font-weight:900;fill:#1d2433}.cn-et2{font-size:11px;fill:#5b6478;font-weight:700}.cn-et2b{font-size:13px;fill:#fff}
.cn-ku{fill:#fff4e6;stroke:#ffa94d;stroke-width:1.5}.cn-kk{fill:#fff5f5;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:4 3}
.cn-tahta0{fill:#f1f3f5;stroke:#ced4da}.cn-tahta{fill:#c08552;stroke:#8d5a2b}
.cn-ek{stroke:#868e96;stroke-width:2}.cn-sinir{stroke:#c92a2a;stroke-width:3;stroke-dasharray:5 4}.cn-yay{fill:none;stroke:#f76707;stroke-width:2}
.cn-v1{stroke:#2b8a3e;stroke-width:3}.cn-v2{stroke:#c92a2a;stroke-width:3}.cn-kis{font-size:20px}.cn-bus{font-size:16px}.cn-bek{stroke:#c92a2a;stroke-width:5;stroke-linecap:round;opacity:.6}
.cn-kum{fill:#ffe8cc;stroke:#e8590c;stroke-width:3}.cn-kum2{fill:#495057}.cn-para{fill:#ffd43b;opacity:.85}.cn-buyuk{font-size:26px;font-weight:900;fill:#1d2433}
.cn-zem{fill:#adb5bd}.cn-kat{fill:#f1f3f5;stroke:#ced4da}.cn-katon{fill:#d3f9d8;stroke:#2b8a3e}.cn-katoff{fill:#ffe3e3;stroke:#e03131}
.cn-izg{display:grid;gap:4px}.cn-h,.cn-gb{border-radius:8px;text-align:center;font-weight:800;font-size:14px;padding:6px 0}.cn-h{background:#f1f3f5;transition:background .25s,transform .25s}
.cn-gb{background:none;color:var(--muted);font-size:12px}.cn-h.on{background:#ffa94d;color:#1d2433}.cn-h.yeni{transform:scale(1.18);box-shadow:0 0 0 3px #e8590c}
.cn-kartlar{display:flex;flex-wrap:wrap;gap:6px;padding:4px}.cn-kart{min-width:44px;padding:8px 10px;text-align:center;border-radius:10px;background:#fff4e6;border:2px solid #ffa94d;font-weight:900;animation:cnGel .3s}
.cn-kart.kare{background:#e7f5ff;border-color:#1c7ed6}.cn-bosk{color:var(--muted)}
.cn-cift{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 4px;font-weight:800}.cn-cift i{font-weight:600;color:#1c7ed6}
.cn-katlar{padding:4px}.cn-katsat{display:inline-flex;flex-wrap:wrap;gap:6px}.cn-kat2{background:#e6fcf5;border:1.5px solid #12b886;border-radius:8px;padding:3px 8px;font-weight:800;animation:cnGel .3s}.cn-sonsuz{font-weight:800;color:#0b7285}
.cn-onr{background:#f8f0fc;border:2px solid #ae3ec9;border-radius:12px;padding:10px 14px}.cn-kanit{padding:10px 4px 2px}
.cn-kay{display:inline-flex;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap}.cn-kay{max-width:100%}.cn-kay input{width:min(220px,70vw);accent-color:#d0700f}.cn-satir>*{min-width:0;max-width:100%}
@media (prefers-reduced-motion:reduce){.cn-p,.cn-kart,.cn-kat2{animation:none}.cn-h{transition:none}}
/* 05.10.2026 · KOŞUL ve LABİRENT motorları (SB 6.1.1) */
@media(max-width:560px){.soru [style*="grid-template-columns:repeat"]{grid-template-columns:1fr!important}}   /* çok sütunlu konuşma balonları telefonda alt alta */
.cn-kl{list-style:none;padding:0;margin:0;display:grid;gap:4px}.cn-not{color:var(--muted);font-size:14px}.cn-sonuc{margin-top:6px;font-weight:800}
.cn-secg{gap:6px}.cn-secad{font-weight:800;flex-basis:100%}.cn-secg .cn-btn{padding:8px 12px}
.cn-mv{fill:#74c0fc;stroke:#1c7ed6;stroke-width:1}.cn-tl{fill:#69db7c;stroke:#2b8a3e;stroke-width:1.5}
.cn-lab{display:grid;gap:4px;align-items:center;max-width:460px;margin:0 auto}
.cn-lc{min-height:44px;border-radius:8px;border:1.5px solid #ced4da;background:#fff;font:inherit;font-weight:900;font-size:16px;cursor:pointer;padding:0;color:var(--ink)}
.cn-lc.yol{background:#d3f9d8;border-color:#2b8a3e}.cn-lc.simdi{background:#2b8a3e;color:#fff;box-shadow:0 0 0 3px #b2f2bb}.cn-lc.kapali{background:#ffe3e3;border-color:#e03131;color:#c92a2a;text-decoration:line-through}
.cn-lok{color:#2b8a3e;font-weight:900;text-align:center}.cn-lcik{min-height:44px;border:0;background:none;font:inherit;font-weight:900;color:#d9480f;cursor:pointer;padding:0;white-space:nowrap;font-size:14px}.cn-lcik:disabled{cursor:default}

</style></head><body>
<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }
      if (!art && !o.sandalye) sv += `<rect x="10" y="10" width="${gen * hc}" height="${sira * hc}" fill="none" class="cn-cerceve"/>
        <text x="${10 + gen * hc / 2}" y="${H + 4}" class="cn-et" text-anchor="middle">${gen} ${o.birim || ""}</text>
        <text x="${W + 4}" y="${10 + sira * hc / 2}" class="cn-et" dominant-baseline="middle">${sira} ${o.birim || ""}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W + 70} ${H + 22}" role="img" aria-label="${N} ${o.ad || "kare"}, her sırada ${gen}">${sv}</svg>`;
      const r = o.kural ? o.kural(gen, sira, art, N) : null;
      let m;
      if (art) m = `<span class="kotu">✘</span> ${N} ${o.ad || "kare"} her sırada ${gen} olacak biçimde dizilince ${sira} tam sıra oluşur, <b>${art} ${o.ad || "kare"} artar</b>. Dikdörtgen olmaz: ${N} : ${gen} işleminde kalan ${art}.`;
      else m = `<span class="iyi">✔</span> <b>${N} = ${gen} ${x} ${sira}</b> · ${sira} sıra, her sırada ${gen} ${o.ad || "kare"}; hiç artmadı.` + (gen === sira ? ` <b>Kare oldu!</b> İki kenar aynı: ${gen}.` : "");
      if (!art && o.cevre) m += ` Çevre = 2 ${x} (${gen} + ${sira}) = <b>${2 * (gen + sira)} m</b>.`;
      if (r && r.msg) m += `<br>${r.msg}`;
      s.dur.innerHTML = m;
      const sutunlar = o.satir ? o.satir(gen, sira, art, N, r) : [gen, art ? `${sira} (+ ${art} artan)` : sira, art, art ? "olmaz" : (gen === sira ? "kare" : "dikdörtgen")];
      s.yaz(N + ":" + gen, sutunlar, !art && (!r || r.ok !== false));
    }
    ciz(g.get());
  }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {
    const N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });
    const g = adimci(o.etiket, 1, o.max || N, o.bas || 2, v => { sonK = v; });

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {

    if (alt.children.length) s.den.appendChild(alt);

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;

    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }

      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

    ciz: ([a]) => { const v = YUK.find(y => y[0] === a)[1], lo = -500, hi = 500, vv = Math.max(lo, Math.min(hi, v));
      return cizgi({ min: lo, max: hi, adim: 100, etAdim: 500, W: 420, H: 166, y: 96, bant: [{ a: -100, b: 100, renk: "#2b8a3e" }],
        nok: [{ v: vv, renk: "#c2255c", ad: `${T(v)} m${v > hi ? " (doğrunun dışında)" : ""}`, ust: 30 }],
        ek: X => tx(X(0), 156, "yeşil bant: deniz seviyesine uzaklığı 100 m'den az", { fs: 15, renk: "#2b8a3e" }) }); },
    kosullar: [{ ad: "Deniz seviyesine uzaklığı 100 m'den az.", f: ([a]) => { const v = YUK.find(y => y[0] === a)[1]; return { ok: Math.abs(v) < 100, not: `|${T(v)}| = ${Math.abs(v)}` }; } }],
    sutun: ["Yer", "Yükselti", "Deniz seviyesine uzaklık", "Fotoğraf"],
    satir: ([a], h) => { const v = YUK.find(y => y[0] === a)[1]; return [a, T(v) + " m", Math.abs(v) + " m", h ? "sergilenir ✔" : "—"]; },
    yon: "Panodaki yerleri tek tek seçin; yükselti sayı doğrusunda işaretlensin (çok yüksek yerler doğrunun sağ ucunda gösterilir). Hangi yerlerin noktası yeşil bandın içinde? Deniz seviyesindeki yeri unutmayın.",
    bitis: "Altı yeri de denediğinizde." }),

  /* 9 · kavram kartı (Frayer): her ifade kutusuna uyuyor mu? */
  9: el => CN.KOSUL(el, { dugme: false,
    girdi: [{ ad: "İfade:", sec: FRAYER.map((f, i) => i), bas: 0, yaz: i => yazH(FRAYER[i][1]) }],
    ciz: ([i]) => { const [kutu, s] = FRAYER[i], [p, q] = oku(s); const tanimsiz = q === 0;
      return `<div style="font-size:18px;line-height:1.9;padding:6px 4px"><b>${yazH(s)}</b> · ${kutu}<br>${tanimsiz ? "Paydası 0 → <b>tanımsız</b>, rasyonel sayı değil." : `= ${rH(p, q, true)} → <b>rasyonel sayı</b> (${tur(p, q)})`}</div>`; },
    kosullar: [{ ad: "İfade, yazıldığı kutuya uyuyor.", f: ([i]) => { const [kutu, s] = FRAYER[i], q = oku(s)[1]; const rasyonel = q !== 0; return kutu.startsWith("3") ? rasyonel : !rasyonel; } }],
    sutun: ["İfade", "Kutu", "Rasyonel mi?", "Doğru kutuda mı?"],
    satir: ([i], h) => { const [kutu, s] = FRAYER[i]; return [yazH(s), kutu, oku(s)[1] === 0 ? "hayır (tanımsız)" : "evet", h ? "✔" : "✘ yanlış kutu"]; },
    yon: "Ece'nin 3. ve 4. kutulara yazdığı ifadeleri tek tek seçin. Her ifadenin değeri ve rasyonel sayı olup olmadığı gösterilsin. Hangi ifade yanlış kutuya yazılmış?",
    bitis: "Beş ifadeyi de denediğinizde." }),

  /* 10 · halat çekme */
  10: el => CN.KOSUL(el, { dugme: false,
    girdi: [{ ad: "Ölçüm:", sec: HALAT.map(h => h[0]), bas: HALAT[0][0] }],
    ciz: ([z]) => { const s = HALAT.find(h => h[0] === z)[1], [p, q] = oku(s), v = p / q;
      return cizgi({ min: -3, max: 3, bol: 4, W: 420, H: 166, y: 100, bant: [{ a: -3, b: -2, renk: "#1c7ed6" }, { a: 2, b: 3, renk: "#e8590c" }],
        yay: [{ a: 0, b: v, renk: Math.abs(v) >= 2 ? "#c92a2a" : "#2b8a3e" }], nok: [{ v, renk: "#e64980", kes: [p, q], karma: true, ust: 44 }],
        ek: X => tx(X(-2.5), 158, "Mavi kazanır", { fs: 15, renk: "#1c5fbf" }) + tx(X(2.5), 158, "Turuncu kazanır", { fs: 15, renk: "#d9480f" }) }); },
    kosullar: [{ ad: "Kurdele 0'a 2 m ya da daha fazla uzaklaştı (yarışma biter).", f: ([z]) => { const [p, q] = oku(HALAT.find(h => h[0] === z)[1]); return { ok: Math.abs(p / q) >= 2, not: `0'a uzaklık ${rH(Math.abs(p), q, true)} m` }; } }],
    sonuc: ([z], h) => { const [p, q] = oku(HALAT.find(x => x[0] === z)[1]); return h ? sonucP(`Kurdele ${p < 0 ? "sola: <b>Mavi takım</b>" : "sağa: <b>Turuncu takım</b>"} kazanır.`) : sonucP("Yarışma sürüyor."); },
    sutun: ["Ölçüm", "Konum", "0'a uzaklık", "Durum"],
    satir: ([z], h) => { const s = HALAT.find(x => x[0] === z)[1], [p, q] = oku(s); return [z, yazH(s), rH(Math.abs(p), q, true) + " m", h ? "bitti" : "sürüyor"]; },
    yon: "Hakemin ölçümlerini sırayla seçin; kurdelenin yeri sayı doğrusunda gösterilsin. Kurdele renkli bölgelerden birine girdiğinde yarışma biter. Hangi ölçümde ve hangi yönde bitiyor?",
    bitis: "Dört ölçümü de sırayla denediğinizde." }),

  /* 11 · uzun atlama */
  11: el => CN.KOSUL(el, { dugme: false,
    girdi: [{ ad: "Sporcu:", sec: ATLA.map(a => a[0]), bas: "Ece" }],
    ciz: ([ad]) => { const v = ATLA.find(a => a[0] === ad)[1];
      return cizgi({ min: -10, max: 4, adim: 1, etAdim: 2, W: 420, H: 166, y: 96, bant: [{ a: 0, b: 4, renk: "#e03131" }, { a: -5, b: 0, renk: "#2b8a3e" }],
        yay: v ? [{ a: 0, b: v, renk: "#7048e8", metin: `${Math.abs(v)} cm` }] : [], nok: [{ v, renk: "#c2255c", ad: TI(v), ust: 60 }],
        ek: X => tx(X(2), 156, "faul bölgesi", { fs: 15, renk: "#c92a2a" }) + tx(X(-2.5), 156, "iyi basış bölgesi", { fs: 15, renk: "#2b8a3e" }) }); },
    kosullar: [{ ad: "Faul değil (ayak ucu çizgiyi geçmemiş).", f: ([ad]) => ATLA.find(a => a[0] === ad)[1] <= 0 },
      { ad: "Çizgiye uzaklık 5 cm'den az.", f: ([ad]) => { const v = ATLA.find(a => a[0] === ad)[1]; return { ok: Math.abs(v) < 5, not: `|${TI(v)}| = ${Math.abs(v)}` }; } }],
    sutun: ["Sporcu", "Konum", "Çizgiye uzaklık", "İyi basış mı?"],
    satir: ([ad], h) => { const v = ATLA.find(a => a[0] === ad)[1]; return [ad, TI(v) + " cm", Math.abs(v) + " cm", h ? "evet ✔" : "hayır"]; },
    yon: "Sporcuları tek tek seçin; ayak ucunun yeri sayı doğrusunda gösterilsin. İki koşulu da sağlayan atlayışları sayın. Tam 5 cm uzaktaki atlayışa dikkat!",
    bitis: "Altı sporcuyu da denediğinizde." }),

  /* 12 · iskele cetveli: parçaları sayarak okuma */
  12: el => CN.KOSUL(el, { dugme: false,
    girdi: [{ ad: "Ay:", sec: Object.keys(ISK), bas: "Mart (K)" }, { ad: "0'dan kaç parça? (yukarı +, aşağı −)", min: -8, max: 4, bas: 0 }],
    ciz: ([ay, n]) => { const [p, q] = ISK[ay];
      return dikey({ min: -2, max: 1, bol: 4, H: 400, W: 360, x: 110,
        nok: [{ v: p / q, renk: "#c2255c", ad: ay, adRenk: "#c2255c" }, ...(n !== p ? [{ v: n / 4, renk: "#1c7ed6", ad: `sizin: ${rH(n, 4, true)}`, adRenk: "#1c5fbf", r: 5 }] : [])] }); },
    kosullar: [{ ad: "Saydığınız parça sayısı işaretin yerini gösteriyor.", f: ([ay, n]) => n === ISK[ay][0] }],
    sonuc: ([ay, n], h) => h ? sonucP(`${ay}: su seviyesi <b>${rH(n, 4, true)} m</b>; normal seviyeye uzaklığı ${rH(Math.abs(n), 4, true)} m.`) : sonucP("Mavi nokta işaretle çakışana kadar parça sayısını değiştirin."),
    sutun: ["Ay", "Parça", "Seviye (m)", "Uzaklık (m)"],
    satir: ([ay, n], h) => h ? [ay, n, rH(n, 4, true), rH(Math.abs(n), 4, true)] : [ay, n, "—", "—"],
    yon: "Bir ay seçin. Sonra 0'dan başlayarak kaç parça yukarı (+) ya da aşağı (−) sayılacağını ayarlayın; mavi noktayı ayın işaretiyle çakıştırın. Dört ayın seviyesini bulup öğrencinin üç ifadesini sınayın.",
    bitis: "Dört ayın seviyesini de deney defterine yazdırdığınızda." }),

  /* 13 · dart */
  13: el => CN.KOSUL(el, { dugme: false,
    girdi: [{ ad: "Bölge:", sec: DART, bas: DART[0], yaz: yazH }],
    ciz: ([s]) => { const [p, q] = oku(s), pu = tur(p, q) === "doğal sayı" ? 3 : tur(p, q).startsWith("doğal sayı olmayan") ? 2 : 1;
      return `<div style="font-size:19px;line-height:2;padding:6px"><b>${yazH(s)}</b> = <b>${rH(p, q, true)}</b><br>Sayı türü: ${tur(p, q)}<br>Puan: <b>${pu}</b></div>`; },
    kosullar: [],
    sutun: ["Bölge", "Değeri", "Türü", "Puan"],
    satir: ([s]) => { const [p, q] = oku(s), t_ = tur(p, q); return [yazH(s), rH(p, q, true), t_, t_ === "doğal sayı" ? 3 : t_.startsWith("doğal sayı olmayan") ? 2 : 1]; },
    yon: "Tahtadaki sekiz bölgeyi tek tek seçin; ifadenin değeri, türü ve puanı deney defterine yazılsın. Sonra tablodaki her öğrencinin üç atışının puanlarını defterden bulup toplayın.",
    bitis: "Sekiz bölgeyi de denediğinizde." }),

  /* 14 · basketbol skor farkı */
  14: el => CN.KOSUL(el, { dugme: false,
    girdi: [{ ad: "Çeyrek sonu:", sec: [1, 2, 3, 4], bas: 1, yaz: x => x + ". çeyrek" }],
    ciz: ([c]) => { const v = BSK[c - 1], once = c > 1 ? BSK[c - 2] : 0;
      return cizgi({ min: -8, max: 8, adim: 1, etAdim: 2, W: 420, H: 166, y: 96, yay: [{ a: once, b: v, renk: "#7048e8", metin: `${Math.abs(v - once)} sayı ${v >= once ? "lehine" : "aleyhine"}` }],
        nok: [{ v: once, renk: "#adb5bd", r: 5 }, { v, renk: "#c2255c", ad: TI(v), ust: 60 }],
        ek: X => tx(X(-4), 156, "Kartallar geride", { fs: 15, renk: "#c92a2a" }) + tx(X(4), 156, "Kartallar önde", { fs: 15, renk: "#2b8a3e" }) }); },
    kosullar: [],
    sonuc: ([c]) => { const v = BSK[c - 1]; return sonucP(`${c}. çeyrek sonunda fark ${TI(v)}: ${v > 0 ? `Kartallar <b>${v} sayı önde</b>` : v < 0 ? `Kartallar <b>${-v} sayı geride</b>` : "<b>skor eşit</b>"}.`); },
    sutun: ["Çeyrek sonu", "Fark", "Durum", "Çeyrekteki değişim"],
    satir: ([c]) => { const v = BSK[c - 1], once = c > 1 ? BSK[c - 2] : 0; return [c + ".", TI(v), v > 0 ? "önde" : v < 0 ? "geride" : "eşit", (v - once > 0 ? "+" : "") + T(v - once)]; },
    yon: "Çeyrek sonlarını sırayla seçin; farkın sayı doğrusundaki yeri ve bir önceki çeyrek sonuna göre değişimi (mor yay) gösterilsin. Seçeneklerdeki dört ifadeyi deney defterine bakarak sınayın.",
    bitis: "Dört çeyrek sonunu da denediğinizde." }),

  /* 15 · gizli sayı: ipuçlarını sınama */
  15: el => CN.KOSUL(el, { dugme: false,
    girdi: [{ ad: "−3'ten sağa kaç parça?", min: 0, max: 20, bas: 3 }],
    ciz: ([n]) => { const p = -15 + n; return cizgi({ min: -3, max: 1, bol: 5, W: 420, H: 140, y: 92, nok: [{ v: p / 5, renk: "#e8590c", kes: [p, 5], karma: true, ust: 42 }] }); },
    kosullar: [
      { ad: "1. ipucu: tam sayı değil ve −2 ile −1 arasında", f: ([n]) => { const p = -15 + n; return p % 5 !== 0 && p > -10 && p < -5; } },
      { ad: "2. ipucu: −1'e, −2'den daha yakın", f: ([n]) => { const v = (-15 + n) / 5; return Math.abs(v + 1) < Math.abs(v + 2); } },
      { ad: "3. ipucu: tam sayılı kesirde kesir kısmının payı çift", f: ([n]) => { const p = Math.abs(-15 + n), [a, b] = sade(p % 5, 5); return { ok: p % 5 !== 0 && a % 2 === 0, not: p % 5 ? `kesir kısmı ${kH(a, b)}` : "" }; } }],
    sutun: ["Nokta", "1. ipucu", "2. ipucu", "3. ipucu"],
    satir: ([n], h, L) => [rH(-15 + n, 5, true), ...L.map(r => r.ok ? "✔" : "✘")],
    yon: "Noktayı −3'ten başlayarak parça parça sağa kaydırın. Her konumda üç ipucu ✔ ya da ✘ olarak denetlensin. Üç ipucunu birden sağlayan tek çentiği arayın.",
    bitis: "−2 ile −1 arasındaki dört çentiğin hepsini denediğinizde." }),

  /* 16 · metro hattı */
  16: el => CN.KOSUL(el, { dugme: false,
    girdi: [{ ad: "İstasyon:", sec: METRO.map(m => m[0]), bas: "Çamlık" }],
    ciz: ([a]) => { const [, p, q] = METRO.find(m => m[0] === a), v = p / q;
      return cizgi({ min: -5, max: 5, bol: 4, etAdim: 1, W: 420, H: 166, y: 96, bant: [{ a: -4, b: -2, renk: "#2b8a3e" }, { a: 2, b: 4, renk: "#2b8a3e" }],
        yay: v ? [{ a: 0, b: v, renk: "#7048e8" }] : [], nok: [{ v, renk: "#c2255c", kes: [p, q], karma: true, ust: 46 }],
        ek: X => tx(X(0), 156, "yeşil: 2 km'den fazla, 4 km'den az", { fs: 15, renk: "#2b8a3e" }) }); },
    kosullar: [{ ad: "Merkez'e uzaklık 2 km'den fazla.", f: ([a]) => { const [, p, q] = METRO.find(m => m[0] === a); return { ok: Math.abs(p / q) > 2, not: `|${rH(p, q, true)}| = ${rH(Math.abs(p), q, true)}` }; } },
      { ad: "Merkez'e uzaklık 4 km'den az.", f: ([a]) => { const [, p, q] = METRO.find(m => m[0] === a); return Math.abs(p / q) < 4; } }],
    sutun: ["İstasyon", "Konum", "Uzaklık", "Otobüs"],
    satir: ([a], h) => { const [, p, q] = METRO.find(m => m[0] === a); return [a, rH(p, q, true) + " km", rH(Math.abs(p), q, true) + " km", h ? "konur ✔" : "—"]; },
    yon: "İstasyonları tek tek seçin; konumu sayı doğrusunda, Merkez'e uzaklığı mor yayla gösterilsin. İki koşulu birden sağlayan istasyonları sayın; güneydeki (negatif) istasyonları unutmayın.",
    bitis: "Altı istasyonu da denediğinizde." }),
};
})();

 "son": "<p>Bu programda, sabah sıcaklığının 0 °C'ye uzaklığı 5 dereceden az olan illerde yollarda buzlanma olabileceği için sürücülere uyarı yapılmaktadır.</p>", "k": "Buna göre, ekrandaki illerden hangilerinde sürücülere uyarı yapılır?", "sec": ["Ankara ve Van", "Kars ve Erzurum", "Ankara, İstanbul ve Van", "Ankara ve İstanbul"], "secg": null, "c": "D", "a": ["Bir sıcaklığın 0 °C'ye uzaklığı, o sıcaklığın mutlak değeridir: <span class=\"nw\">|−13| = 13</span>, <span class=\"nw\">|−16| = 16</span>, <span class=\"nw\">|−2| = 2</span>, <span class=\"nw\">|4| = 4</span>, <span class=\"nw\">|14| = 14</span>, <span class=\"nw\">|−7| = 7.</span>", "Mutlak değeri 5'ten küçük olan sıcaklıklar Ankara'nın (−2 °C) ve İstanbul'un (4 °C) sıcaklıklarıdır."], "t": "Ankara ve Van: yalnız 0 °C'nin altındaki sıcaklıklar düşünülmüş; Kars ve Erzurum: en soğuk iller seçilmiş; Ankara, İstanbul ve Van: −7 °C'nin 0 °C'ye uzaklığı 5'ten az sanılmış.", "d": "0 °C'ye uzaklık, sıcaklığın mutlak değeridir; −2 °C ile 4 °C'nin ikisi de 0'a yakındır. Yalnız 0'ın altındaki sıcaklıklara bakmayın: −7 °C'nin 0 °C'ye uzaklığı 7 derecedir.", "ses": "b02"}, {"no": 3, "on": "<p>Bir köyde su kuyusu açan sondaj makinesinde, borular uç uca eklenerek toprağın içine indirilmektedir. Yer yüzeyi 0 kabul edilerek yer yüzeyinin üstündeki konumlar pozitif, altındaki konumlar negatif tam sayılarla gösterilmektedir. Görsel temsilîdir.</p>", "g": "<svg viewBox=\"0 0 680 270\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"0.0\" y=\"150.0\" width=\"680.0\" height=\"120.0\" rx=\"0\" fill=\"#e8d5b5\" stroke=\"none\" stroke-width=\"0\"/><rect x=\"0.0\" y=\"146.0\" width=\"680.0\" height=\"6.0\" rx=\"0\" fill=\"#8c6d46\" stroke=\"none\" stroke-width=\"0\"/><text x=\"16.0\" y=\"140.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#5c3d1e\" text-anchor=\"start\">Yer yüzeyi (0)</text><path d=\"M260,146 L300,20 L340,146\" fill=\"none\" stroke=\"#e8590c\" stro at izlerinden kaç tanesi negatif bir rasyonel sayıyı gösteren noktaya karşılık gelir?", "sec": ["3", "4", "7", "8"], "secg": null, "c": "A", "a": ["Her katlamada parça sayısı iki katına çıkar: 1. katlamadan sonra 2, 2. katlamadan sonra 4, 3. katlamadan sonra 8 eş parça oluşur.", "2 birimlik şerit 8 eş parçaya ayrılır; her parça <span class=\"nw\"><span class=\"frac\"><span>2</span><span>8</span></span></span> = <span class=\"nw\"><span class=\"frac\"><span>1</span><span>4</span></span></span> birimdir. Kat izleri <span class=\"nw\">−<span class=\"frac\"><span>3</span><span>4</span></span></span>, <span class=\"nw\">−<span class=\"frac\"><span>1</span><span>2</span></span></span>, <span class=\"nw\">−<span class=\"frac\"><span>1</span><span>4</span></span></span>, 0, <span class=\"nw\"><span class=\"frac\"><span>1</span><span>4</span></span></span>, <span class=\"nw\"><span class=\"frac\"><span>1</span><span>2</span></span></span> ve <span class=\"nw\"><span class=\"frac\"><span>3</span><span>4</span></span></span> noktalarındadır (7 iz).", "Negatif sayıları gösteren izler <span class=\"nw\">−<span class=\"frac\"><span>3</span><span>4</span></span></span>, <span class=\"nw\">−<span class=\"frac\"><span>1</span><span>2</span></span></span> ve <span class=\"nw\">−<span class=\"frac\"><span>1</span><span>4</span></span></span>'tür: 3 tane."], "t": "4: ortadaki 0 izi de negatif sanılmış; 7: bütün kat izleri sayılmış; 8: parça sayısı ile iz sayısı karıştırılmış.", "d": "Her katlamada parça sayısı iki katına çıkar; kat izlerinin sayısı parça sayısından 1 eksiktir. Tam ortadaki (0'daki) kat izi ne pozitif ne de negatif bir sayıyı gösterir.", "ses": "b07"}, {"no": 8, "on": "<p>Bir bilim merkezindeki panoda, yeryüzündeki bazı yerlerin deniz seviyesine göre yükseltileri verilmiştir. Deniz seviyesi 0 kabul edilmiş; deniz seviyesinin üstündeki yükseltiler pozitif, altındaki yükseltiler negatif tam sayılarla gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 680 274\" width=\"680\" x ", "100 m'den az olanlar Akdeniz kıyısı (0 m), Hazar Denizi yüzeyi (28 m) ve Ölüm Vadisi'dir (86 m): 3 yer."], "t": "2: deniz seviyesindeki Akdeniz kıyısının uzaklığının 0 olduğu düşünülmemiş; 4: Ölü Deniz kıyısı da negatif olduğu için sayılmış; 6: bütün yerler sayılmış.", "d": "Deniz seviyesine uzaklık yükseltinin mutlak değeridir. Deniz seviyesindeki yerin uzaklığı 0'dır ve 100'den azdır; negatif yükseltilerin hepsi yakın değildir (−430 m'nin uzaklığı 430 m'dir).", "ses": "b08"}, {"no": 9, "on": "<p>Ece, “rasyonel sayı” kavramı için aşağıdaki dört kutulu kavram kartını hazırlamıştır. Ece her kutuya iki bilgi ya da örnek yazmıştır.</p>", "g": "<div style=\"position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:3mm;row-gap:9mm;margin:1mm 0\"><div style=\"border:.45mm solid #128a5a;border-radius:3mm;padding:2mm 3mm;background:#fff;min-height:16mm\"><b style=\"color:#128a5a\">1. Tanım</b><br>a bir tam sayı, b sıfırdan farklı bir tam sayı olmak üzere <span class=\"nw\"><span class=\"frac\"><span>a</span><span>b</span></span></span> biçiminde yazılabilen sayılardır.</div><div style=\"border:.45mm solid #128a5a;border-radius:3mm;padding:2mm 3mm;background:#fff;min-height:16mm\"><b style=\"color:#128a5a\">2. Özellikler</b><br>Her tam sayı bir rasyonel sayıdır.<br>Payı 0, paydası 0'dan farklı olan kesir 0'a eşittir.</div><div style=\"border:.45mm solid #128a5a;border-radius:3mm;padding:2mm 3mm;background:#fff;min-height:16mm\"><b style=\"color:#128a5a\">3. Örnekler</b><br><span class=\"nw\">−3<span class=\"frac\"><span>3</span><span>4</span></span></span>;&nbsp;&nbsp; <span class=\"nw\"><span class=\"frac\"><span>0</span><span>8</span></span></span>;&nbsp;&nbsp; 12</div><div style=\"border:.45mm solid #128a5a;border-radius:3mm;padding:2mm 3mm;background:#fff;min-height:16mm\"><b style=\"color:#128a5a\">4. Örnek olmayanlar</b><br><span class=\"nw\"><span class=\"frac\"><span>7</span><span>0</span></span></span>;&nbsp;&nbsp; <span class=\"nw\">−<span class=\"frac\"><span>6</span><span>−2</span></span></span></div><div style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#eaf7f1;border:.5mm solid #128a5a;border-radius:50%;padding:1mm 5mm;font-weight:800;color:#128a5a;white-space:nowrap\">Rasyonel sayı</div></div>", "son": "<p>Öğretmen, Ece'nin kutulardan yalnız birine yazdıklarından birinin yanlış olduğunu söylemiştir.</p>", "k": "Buna göre, yanlış bilgi ya da örnek hangi kutudadır?", "sec": ["1. kutu", "2. kutu", "3. kutu", "4. kutu"], "secg": null, "c": "D", "a": ["1. kutudaki tanım ve 2. kutudaki iki özellik doğrudur.", "3. kutudaki <span class=\"nw\">−3<span class=\"frac\"><span>3</span><span>4</span></span></span>, <span class=\"nw\"><span class=\"frac\"><span>0</span><span>8</span></span></span> (= 0) ve 12 rasyonel sayıdır; bu kutu da doğrudur.", "4. kutudaki <span class=\"nw\"><span class=\"frac\"><span>7</span><span>0</span></span></span> tanımsızdır, rasyonel sayı değildir; ancak <span class=\"nw\">−<span class=\"frac\"><span>6</span><span>−2</span></span></span> = 3'tür ve bir rasyonel sayıdır. Rasyonel sayı olan bir sayı “örnek olmayanlar” kutusuna yazılmıştır."], "t": "3. kutu: payı 0 olan <span class=\"nw\"><span class=\"frac\"><span>0</span><span>8</span></span></span>'in tanımsız sanılması; 2. kutu: “payı 0 olan kesir 0'a eşittir” bilgisinin yanlış sanılması; 1. kutu: tanımda b'nin 0'dan farklı olması gerektiğinin gözden kaçması bu seçenekleri işaretletir.", "d": "Bir ifadenin rasyonel sayı olup olmadığına karar vermeden önce değerini bulun: <span class=\"nw\">−<span class=\"frac\"><span>6</span><span>−2</span></span></span> = 3'tür. Payı 0 olan kesir 0'a eşittir; yalnız paydası 0 olan ifade tanımsızdır.", "ses": "b09"}, {"no": 10, "on": "<p>Okul şenliğinde halat çekme yarışması yapılmaktadır. Halatın ortasına bir kurdele bağlanmıştır. Başlangıçta kurdele, yere çizilmiş sayı doğrusunun 0 noktasının tam üstündedir. Mavi takım halatı sola (negatif yön), Turuncu takım sağa (p e\" style=\"font:700 15px 'Liberation Sans',sans-serif;fill:#000000\">4</text></g></svg>", "son": "<p>Hakem her 10 saniyede bir kurdelenin konumunu defterine yazmaktadır. Kurdele 0'a 2 m ya da daha fazla uzaklaştığında yarışma biter ve kurdelenin gittiği yöndeki takım kazanır.</p>", "k": "Buna göre, yarışma hangi ölçümde bitmiş ve hangi takım kazanmıştır?", "sec": ["40. saniyede; Mavi takım", "20. saniyede; Mavi takım", "30. saniyede; Turuncu takım", "40. saniyede; Turuncu takım"], "secg": null, "c": "A", "a": ["Kurdelenin 0'a uzaklıkları: |<span class=\"nw\">1<span class=\"frac\"><span>1</span><span>4</span></span></span>| = <span class=\"nw\">1<span class=\"frac\"><span>1</span><span>4</span></span></span>, <span class=\"nw\">|<span class=\"nw\">−<span class=\"frac\"><span>3</span><span>2</span></span></span>| = 1</span> <span class=\"nw\"><span class=\"frac\"><span>1</span><span>2</span></span></span>, <span class=\"nw\">|<span class=\"nw\"><span class=\"frac\"><span>7</span><span>4</span></span></span>| = 1</span> <span class=\"nw\"><span class=\"frac\"><span>3</span><span>4</span></span></span> ve <span class=\"nw\">|<span class=\"nw\">−<span class=\"frac\"><span>9</span><span>4</span></span></span>| = 2</span> <span class=\"nw\"><span class=\"frac\"><span>1</span><span>4</span></span></span> m'dir.", "Uzaklığın ilk kez 2 m'ye ulaştığı ya da 2 m'yi geçtiği ölçüm 40. saniyedeki ölçümdür (<span class=\"nw\">2<span class=\"frac\"><span>1</span><span>4</span></span></span> m).", "Bu ölçümde kurdelenin konumu negatiftir; kurdele sola, Mavi takımın yönüne gitmiştir."], "t": "20. saniyede: <span class=\"nw\">−<span class=\"frac\"><span>3</span><span>2</span></span></span>'nin payı 3 olduğu için 2'den uzak sanılmış; 30. saniyede: <span class=\"nw\"><span class=\"frac\"><span>7</span><span>4</span></span></span>'ün 2'den büyük olduğu sanılmış, oysa <span class=\"nw\"><span class=\"frac\"><span>7</span><span>4</span></span></span> = <span class=\"nw\">1<span class=\"frac\"><span>3</span><span>4</span></span></span>'tür; 40. saniyede Turuncu: mutlak değer doğru bulunmuş ama işaretin gösterdiği yön karıştırılmış.", "d": "Kurdelenin 0'a uzaklığı konumun mutlak değeridir; <span class=\"nw\"><span class=\"frac\"><span>7</span><span>4</span></span></span> = <span class=\"nw\">1<span class=\"frac\"><span>3</span><span>4</span></span></span> olduğundan 2'ye ulaşmaz. Kazananı uzaklık değil işaret belirler: negatif konum sola, Mavi takımın yönüne doğrudur.", "ses": "b10"}, {"no": 11, "on": "<p>Uzun atlama antrenmanında antrenör, sporcuların sıçrarken bastıkları ayağın ucunun basma çizgisine göre konumunu ölçmektedir. Basma çizgisi 0 kabul edilmiş; çizginin gerisindeki konumlar negatif, çizginin ilerisindeki (kum havuzu yönündeki) konumlar pozitif tam sayılarla gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 680 232\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"0.0\" y=\"80.0\" width=\"400.0\" height=\"70.0\" rx=\"0\" fill=\"#f4a261\" stroke=\"none\" stroke-width=\"0\"/><rect x=\"250.0\" y=\"80.0\" width=\"150.0\" height=\"70.0\" rx=\"0\" fill=\"#ffe8cc\" stroke=\"none\" stroke-width=\"0\"/><rect x=\"244.0\" y=\"80.0\" width=\"10.0\" height=\"70.0\" rx=\"0\" fill=\"#ffffff\" stroke=\"#868e96\" stroke-width=\"1\"/><text x=\"120.0\" y=\"70.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">koşu yolu</text><text x=\"330.0\" y=\"70.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">kum havuzu</text><line x1=\"40.0\" y1=\"172.0\" x2=\"200.0\" y2=\"172.0\" stroke=\"#000000\" stroke-width=\"1.6\"/><path d=\"M200.0,172.0 L192.8,175.5 L192.8,168.5 Z\" fill=\"#000000\"/><text x=\"120.0\" y=\"190.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"700\" fill=\"#333333\" text-anchor=\"middle\">koşu yönü</text><line x1=\"249.0\" y1=\"160.0\" x2=\"249.0\" y2=\"176.0\" stroke=\"#c92a2a\" stroke-width=\"2\"/><text x=\"249.0\" y=\"194.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12\" font-weight=\"800\" fill=\"#c92a2a\" text-anchor=\"middle\">basma çizgisi (0)</text><rect x=\"420.0\" y=\"6.0\" width=\"250.0\" height=\"220.0\" rx=\"14\" fill=\"#212529\" stroke=\"#000000\" stroke-width=\"2\"/><rect x=\"430.0\" y=\"16.0\" width=\"230.0\" height=\"200.0\" rx=\"8\" fill=\"#ffffff\" stroke=\"none\" stroke-width=\"0\"/><text x=\"545.0\" y=\"38.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">Ayak ucunun konumu (cm)</text><text x=\"450.0\" y=\"64.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Ece</text><text x=\"630.0\" y=\"64.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"end\">−7</text><text x=\"450.0\" y=\"89.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Ali</text><text x=\"630.0\" y=\"89.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"end\">+2</text><text x=\"450.0\" y=\"114.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Can</text><text x=\"630.0\" y=\"114.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"end\">−3</text><text x=\"450.0\" y=\"139.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Defne</text><text x=\"630.0\" y=\"139.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"end\">−4</text><text x=\"450.0\" y=\"164.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\ \"frac\"><span>3</span><span>4</span></span></span> m'dir; III doğrudur."], "t": "I'i doğru sanan öğrenci M'nin −1 ile −2 arasında olduğunu görüp kaç parça aşağıda olduğunu yanlış saymıştır; III'ü yanlış sanan öğrenci işaretleri farklı olan iki sayının 0'a eşit uzaklıkta olabileceğini düşünmemiştir.", "d": "Cetvelde bir parça <span class=\"nw\"><span class=\"frac\"><span>1</span><span>4</span></span></span> m'dir. −1'in altındaki bir noktayı okurken −1'den aşağıya doğru parça sayın: <span class=\"nw\">−1<span class=\"frac\"><span>1</span><span>4</span></span></span>, −1'in 1 parça altıdır. İşaretleri farklı iki sayı 0'a eşit uzaklıkta olabilir.", "ses": "b12"}, {"no": 13, "on": "<p>Bir dart tahtası sekiz eş bölgeye ayrılmış ve her bölgeye bir ifade yazılmıştır. Okun saplandığı bölgedeki ifadenin eşit olduğu sayının türüne göre puan kazanılmaktadır.</p>", "g": "<svg viewBox=\"0 0 680 284\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><path d=\"M140,140 L140.0,12.0 A128,128 0 0 1 230.5,49.5 Z\" fill=\"#fff3bf\" stroke=\"#495057\" stroke-width=\"1.2\"/><g class=\"frac\"><text x=\"163.4\" y=\"67.6\" text-anchor=\"end\" style=\"font:700 15px 'Liberation Sans',sans-serif;fill:#000000\">−</text><text x=\"178.1\" y=\"59.1\" text-anchor=\"middle\" style=\"font:700 15px 'Liberation Sans',sans-serif;fill:#000000\">12</text><line x1=\"166.4\" y1=\"62.4\" x2=\"189.8\" y2=\"62.4\" class=\"fracln\" style=\"stroke:#000000;stroke-width:1.12\"/><text x=\"178.1\" y=\"75.6\" text-anchor=\"middle\" style=\"font:700 15px 'Liberation Sans',sans-serif;fill:#000000\">4</text></g><path d=\"M140,140 L230.5,49.5 A128,128 0 0 1 268.0,140.0 Z\" fill=\"#d0ebff\" stroke=\"#495057\" stroke-width=\"1.2\"/><g class=\"frac\"><text x=\"217.6\" y=\"104.6\" text-anchor=\"middle\" style=\"font:700 15px 'Liberation Sans',sans-serif;fill:#000000\">0</text><line x1=\"210.3\" y1=\"107.9\" x2=\"225.0\" y2=\"107.9\" class=\"fracln\" style=\"stroke:#000000;stroke-width:1.12\"/><text x=\"217.6 8</span></span></span></td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\"><span class=\"nw\"><span class=\"frac\"><span>9</span><span>2</span></span></span></td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Can</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\"><span class=\"nw\"><span class=\"frac\"><span>7</span><span>−1</span></span></span></td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\"><span class=\"nw\"><span class=\"frac\"><span>5</span><span>6</span></span></span></td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\"><span class=\"nw\">−<span class=\"frac\"><span>12</span><span>4</span></span></span></td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Defne</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\"><span class=\"nw\"><span class=\"frac\"><span>8</span><span>8</span></span></span></td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\"><span class=\"nw\"><span class=\"frac\"><span>5</span><span>6</span></span></span></td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\"><span class=\"nw\"><span class=\"frac\"><span>9</span><span>2</span></span></span></td></tr></tbody></table></div>", "son": "<p>Dört öğrenci üçer atış yapmıştır; okların saplandığı bölgelerdeki ifadeler tabloda verilmiştir. Her öğrencinin puanı, üç atışta kazandığı puanların toplamıdır.</p>", "k": "Buna göre, <u>en fazla</u> puanı alan öğrenci kimdir?", "sec": ["Ali", "Can", "Ece", "Defne"], "secg": null, "c": "C", "a": ["Bölgelerdeki sayılar: <span class=\"nw\">−<span class=\"frac\"><span>12</span><span>4</span></span></span> = −3 (2 puan), <span class=\"nw\"><span class=\"frac\"><span>0</span><span>7</span></span></span> = 0 (3 puan), <span class=\"nw\"><span class=\"frac\"><span>15</span><span>5</span></span></span> = 3 (3 p /* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
