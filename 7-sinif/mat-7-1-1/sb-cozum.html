<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çözümler · Keşfet ve Çöz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--muted:#5b6478;--line:#dfe5ef;--bg:#f5f7fb;--card:#fff;--ss:#6741d9;--kk:#0b7285;--b:#d0700f;--ok:#2b8a3e;--warn:#c92a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif}
header{background:linear-gradient(135deg,#1c5fbf,#2f8fe0);color:#fff;padding:18px 16px 22px}

main{max-width:780px;margin:14px auto 40px;padding:0 16px}
nav.sec{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}nav.sec button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}

ol.sec{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
ol.sec li{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}ol.sec li.dogru{border-color:var(--ok);background:#ebfbee;font-weight:800}
.adim{border-left:4px solid var(--c);padding:6px 12px;margin:8px 0;background:#fff;border-radius:0 10px 10px 0;animation:gel .35s ease-out}
.adim b{color:var(--c)}@keyframes gel{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dug{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
button.btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.dikkat{background:#fff4e6;border:2px solid #f59f00;border-radius:12px;padding:10px 14px;margin:12px 0 4px}.dikkat b{color:#d9480f}
.tuzak{font-size:15px;color:var(--muted);margin-top:8px}
.cevap{font-weight:900;color:var(--ok);margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid var(--line);padding:8px 10px;text-align:left}th{background:#e3fafc;color:#0b7285;font-size:13px;letter-spacing:.06em}
.ses{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border-radius:12px;background:#eef2ff}

.ses span{font-size:14px;color:var(--muted)}
.gizli{display:none}
.tum{margin:4px 0 14px;font-size:14px}.tum a{color:#1c5fbf;font-weight:800}
@media (prefers-reduced-motion:reduce){.adim{animation:none}}
/* Canlandır (05.10.2026) */
.sek{display:flex;gap:6px;margin:12px 0 0;border-bottom:2px solid var(--line)}
.sek button{border:0;background:none;font:inherit;font-weight:900;font-size:15px;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);min-height:44px;position:relative;top:2px;border-bottom:3px solid transparent}
.sek button[aria-selected=true]{color:var(--c);border-bottom-color:var(--c);background:#fff8f0}
.sek .yeni{display:inline-block;font-size:10px;background:#2b8a3e;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.06em}
.cn{padding-top:10px}
.cn-yon{background:#eef6ff;border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:10px}
.cn-sahne{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;min-height:120px;overflow-x:auto}

.cn-adimci input,.cn-test input{width:84px;height:44px;border:2px solid var(--line);border-radius:12px;font:inherit;font-weight:900;text-align:center;font-size:18px}
.cn-test label{font-weight:800;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.cn-btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer;background:var(--c);color:#fff;min-height:44px}
.cn-btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.cn-btn[aria-pressed=true]{background:var(--ac,var(--c));color:#fff;border-color:var(--ac,var(--c))}
.cn-btn:disabled{opacity:.5}
.cn-hazir{display:flex;flex-wrap:wrap;gap:6px}

.cn-dur .iyi{color:var(--ok);font-weight:900}.cn-dur .kotu{color:var(--warn);font-weight:900}
.cn-df{margin-top:10px;overflow-x:auto}@media(max-width:480px){.cn-adimci>span{flex-basis:100%}.cn-h{font-size:12px;padding:5px 0}.cn-izg{gap:3px}.cn-sahne{padding:6px}}@media(max-width:480px){.cn-df table{font-size:13px}.cn-df td,.cn-df th{padding:4px 5px}}.cn-df summary{font-weight:900;cursor:pointer;padding:6px 0}.cn-say{color:var(--muted);font-weight:700}
.cn-df table{font-size:15px}.cn-df td{padding:5px 8px}.cn-df tr.cn-iyi td{background:#ebfbee}.cn-df tr.cn-kotu td{background:#fff5f5}.cn-df tr.cn-son td{outline:2px solid var(--c);outline-offset:-2px}
.cn-p{animation:cnGel .35s ease-out both}@keyframes cnGel{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cn-o{fill:#ffa94d;stroke:#d9480f;stroke-width:1}.cn-o2{fill:#e8590c}.cn-k{fill:#ffc9c9;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:3 2}
.cn-cerceve{stroke:#2b8a3e;stroke-width:3}.cn-et{font-size:13px;font-weight:800;fill:#5b6478}.cn-et.b,.cn-et2b{font-weight:900;fill:#1d2433}.cn-et2{font-size:11px;fill:#5b6478;font-weight:700}.cn-et2b{font-size:13px;fill:#fff}
.cn-ku{fill:#fff4e6;stroke:#ffa94d;stroke-width:1.5}.cn-kk{fill:#fff5f5;stroke:#c92a2a;stroke-width:1.5;stroke-dasharray:4 3}
.cn-tahta0{fill:#f1f3f5;stroke:#ced4da}.cn-tahta{fill:#c08552;stroke:#8d5a2b}
.cn-ek{stroke:#868e96;stroke-width:2}.cn-sinir{stroke:#c92a2a;stroke-width:3;stroke-dasharray:5 4}.cn-yay{fill:none;stroke:#f76707;stroke-width:2}
.cn-v1{stroke:#2b8a3e;stroke-width:3}.cn-v2{stroke:#c92a2a;stroke-width:3}.cn-kis{font-size:20px}.cn-bus{font-size:16px}.cn-bek{stroke:#c92a2a;stroke-width:5;stroke-linecap:round;opacity:.6}
.cn-kum{fill:#ffe8cc;stroke:#e8590c;stroke-width:3}.cn-kum2{fill:#495057}.cn-para{fill:#ffd43b;opacity:.85}.cn-buyuk{font-size:26px;font-weight:900;fill:#1d2433}
.cn-zem{fill:#adb5bd}.cn-kat{fill:#f1f3f5;stroke:#ced4da}.cn-katon{fill:#d3f9d8;stroke:#2b8a3e}.cn-katoff{fill:#ffe3e3;stroke:#e03131}
.cn-izg{display:grid;gap:4px}.cn-h,.cn-gb{border-radius:8px;text-align:center;font-weight:800;font-size:14px;padding:6px 0}.cn-h{background:#f1f3f5;transition:background .25s,transform .25s}
.cn-gb{background:none;color:var(--muted);font-size:12px}.cn-h.on{background:#ffa94d;color:#1d2433}.cn-h.yeni{transform:scale(1.18);box-shadow:0 0 0 3px #e8590c}
.cn-kartlar{display:flex;flex-wrap:wrap;gap:6px;padding:4px}.cn-kart{min-width:44px;padding:8px 10px;text-align:center;border-radius:10px;background:#fff4e6;border:2px solid #ffa94d;font-weight:900;animation:cnGel .3s}
.cn-kart.kare{background:#e7f5ff;border-color:#1c7ed6}.cn-bosk{color:var(--muted)}
.cn-cift{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 4px;font-weight:800}.cn-cift i{font-weight:600;color:#1c7ed6}
.cn-katlar{padding:4px}.cn-katsat{display:inline-flex;flex-wrap:wrap;gap:6px}.cn-kat2{background:#e6fcf5;border:1.5px solid #12b886;border-radius:8px;padding:3px 8px;font-weight:800;animation:cnGel .3s}.cn-sonsuz{font-weight:800;color:#0b7285}
.cn-onr{background:#f8f0fc;border:2px solid #ae3ec9;border-radius:12px;padding:10px 14px}.cn-kanit{padding:10px 4px 2px}
.cn-kay{display:inline-flex;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap}.cn-kay{max-width:100%}.cn-kay input{width:min(220px,70vw);accent-color:#d0700f}.cn-satir>*{min-width:0;max-width:100%}
@media (prefers-reduced-motion:reduce){.cn-p,.cn-kart,.cn-kat2{animation:none}.cn-h{transition:none}}
/* 05.10.2026 · KOŞUL ve LABİRENT motorları (SB 6.1.1) */
@media(max-width:560px){.soru [style*="grid-template-columns:repeat"]{grid-template-columns:1fr!important}}   /* çok sütunlu konuşma balonları telefonda alt alta */
.cn-kl{list-style:none;padding:0;margin:0;display:grid;gap:4px}.cn-not{color:var(--muted);font-size:14px}.cn-sonuc{margin-top:6px;font-weight:800}
.cn-secg{gap:6px}.cn-secad{font-weight:800;flex-basis:100%}.cn-secg .cn-btn{padding:8px 12px}
.cn-mv{fill:#74c0fc;stroke:#1c7ed6;stroke-width:1}.cn-tl{fill:#69db7c;stroke:#2b8a3e;stroke-width:1.5}
.cn-lab{display:grid;gap:4px;align-items:center;max-width:460px;margin:0 auto}
.cn-lc{min-height:44px;border-radius:8px;border:1.5px solid #ced4da;background:#fff;font:inherit;font-weight:900;font-size:16px;cursor:pointer;padding:0;color:var(--ink)}
.cn-lc.yol{background:#d3f9d8;border-color:#2b8a3e}.cn-lc.simdi{background:#2b8a3e;color:#fff;box-shadow:0 0 0 3px #b2f2bb}.cn-lc.kapali{background:#ffe3e3;border-color:#e03131;color:#c92a2a;text-decoration:line-through}
.cn-lok{color:#2b8a3e;font-weight:900;text-align:center}.cn-lcik{min-height:44px;border:0;background:none;font:inherit;font-weight:900;color:#d9480f;cursor:pointer;padding:0;white-space:nowrap;font-size:14px}.cn-lcik:disabled{cursor:default}

</style></head><body>
<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }
      if (!art && !o.sandalye) sv += `<rect x="10" y="10" width="${gen * hc}" height="${sira * hc}" fill="none" class="cn-cerceve"/>
        <text x="${10 + gen * hc / 2}" y="${H + 4}" class="cn-et" text-anchor="middle">${gen} ${o.birim || ""}</text>
        <text x="${W + 4}" y="${10 + sira * hc / 2}" class="cn-et" dominant-baseline="middle">${sira} ${o.birim || ""}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W + 70} ${H + 22}" role="img" aria-label="${N} ${o.ad || "kare"}, her sırada ${gen}">${sv}</svg>`;
      const r = o.kural ? o.kural(gen, sira, art, N) : null;
      let m;
      if (art) m = `<span class="kotu">✘</span> ${N} ${o.ad || "kare"} her sırada ${gen} olacak biçimde dizilince ${sira} tam sıra oluşur, <b>${art} ${o.ad || "kare"} artar</b>. Dikdörtgen olmaz: ${N} : ${gen} işleminde kalan ${art}.`;
      else m = `<span class="iyi">✔</span> <b>${N} = ${gen} ${x} ${sira}</b> · ${sira} sıra, her sırada ${gen} ${o.ad || "kare"}; hiç artmadı.` + (gen === sira ? ` <b>Kare oldu!</b> İki kenar aynı: ${gen}.` : "");
      if (!art && o.cevre) m += ` Çevre = 2 ${x} (${gen} + ${sira}) = <b>${2 * (gen + sira)} m</b>.`;
      if (r && r.msg) m += `<br>${r.msg}`;
      s.dur.innerHTML = m;
      const sutunlar = o.satir ? o.satir(gen, sira, art, N, r) : [gen, art ? `${sira} (+ ${art} artan)` : sira, art, art ? "olmaz" : (gen === sira ? "kare" : "dikdörtgen")];
      s.yaz(N + ":" + gen, sutunlar, !art && (!r || r.ok !== false));
    }
    ciz(g.get());
  }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {
    const N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });
    const g = adimci(o.etiket, 1, o.max || N, o.bas || 2, v => { sonK = v; });

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {

    if (alt.children.length) s.den.appendChild(alt);

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;

    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }

      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

    ciz: ([a]) => { const v = YUK.find(y => y[0] === a)[1], lo = -500, hi = 500, vv = Math.max(lo, Math.min(hi, v));
      return cizgi({ min: lo, max: hi, adim: 100, etAdim: 500, W: 420, H: 166, y: 96, bant: [{ a: -100, b: 100, renk: "#2b8a3e" }],
        nok: [{ v: vv, renk: "#c2255c", ad: `${T(v)} m${v > hi ? " (doğrunun dışında)" : ""}`, ust: 30 }],
        ek: X => tx(X(0), 156, "yeşil bant: deniz seviyesine uzaklığı 100 m'den az", { fs: 15, renk: "#2b8a3e" }) }); },
    kosullar: [{ ad: "Deniz seviyesine uzaklığı 100 m'den az.", f: ([a]) => { const v = YUK.find(y => y[0] === a)[1]; return { ok: Math.abs(v) < 100, not: `|${T(v)}| = ${Math.abs(v)}` }; } }],
    sutun: ["Yer", "Yükselti", "Deniz seviyesine uzaklık", "Fotoğraf"],
    satir: ([a], h) => { const v = YUK.find(y => y[0] === a)[1]; return [a, T(v) + " m", Math.abs(v) + " m", h ? "sergilenir ✔" : "—"]; },
    yon: "Panodaki yerleri tek tek seçin; yükselti sayı doğrusunda işaretlensin (çok yüksek yerler doğrunun sağ ucunda gösterilir). Hangi yerlerin noktası yeşil bandın içinde? Deniz seviyesindeki yeri unutmayın.",
    bitis: "Altı yeri de denediğinizde." }),

  /* 9 · kavram kartı (Frayer): her ifade kutusuna uyuyor mu? */
  9: el => CN.KOSUL(el, { dugme: false,
    girdi: [{ ad: "İfade:", sec: FRAYER.map((f, i) => i), bas: 0, yaz: i => yazH(FRAYER[i][1]) }],
    ciz: ([i]) => { const [kutu, s] = FRAYER[i], [p, q] = oku(s); const tanimsiz = q === 0;
      return `<div style="font-size:18px;line-height:1.9;padding:6px 4px"><b>${yazH(s)}</b> · ${kutu}<br>${tanimsiz ? "Paydası 0 → <b>tanımsız</b>, rasyonel sayı değil." : `= ${rH(p, q, true)} → <b>rasyonel sayı</b> (${tur(p, q)})`}</div>`; },
    kosullar: [{ ad: "İfade, yazıldığı kutuya uyuyor.", f: ([i]) => { const [kutu, s] = FRAYER[i], q = oku(s)[1]; const rasyonel = q !== 0; return kutu.startsWith("3") ? rasyonel : !rasyonel; } }],
    sutun: ["İfade", "Kutu", "Rasyonel mi?", "Doğru kutuda mı?"],
    satir: ([i], h) => { const [kutu, s] = FRAYER[i]; return [yazH(s), kutu, oku(s)[1] === 0 ? "hayır (tanımsız)" : "evet", h ? "✔" : "✘ yanlış kutu"]; },
    yon: "Ece'nin 3. ve 4. kutulara yazdığı ifadeleri tek tek seçin. Her ifadenin değeri ve rasyonel sayı olup olmadığı gösterilsin. Hangi ifade yanlış kutuya yazılmış?",
    bitis: "Beş ifadeyi de denediğinizde." }),

  /* 10 · halat çekme */
  10: el => CN.KOSUL(el, { dugme: false,
    girdi: [{ ad: "Ölçüm:", sec: HALAT.map(h => h[0]), bas: HALAT[0][0] }],
    ciz: ([z]) => { const s = HALAT.find(h => h[0] === z)[1], [p, q] = oku(s), v = p / q;
      return cizgi({ min: -3, max: 3, bol: 4, W: 420, H: 166, y: 100, bant: [{ a: -3, b: -2, renk: "#1c7ed6" }, { a: 2, b: 3, renk: "#e8590c" }],
        yay: [{ a: 0, b: v, renk: Math.abs(v) >= 2 ? "#c92a2a" : "#2b8a3e" }], nok: [{ v, renk: "#e64980", kes: [p, q], karma: true, ust: 44 }],
        ek: X => tx(X(-2.5), 158, "Mavi kazanır", { fs: 15, renk: "#1c5fbf" }) + tx(X(2.5), 158, "Turuncu kazanır", { fs: 15, renk: "#d9480f" }) }); },
    kosullar: [{ ad: "Kurdele 0'a 2 m ya da daha fazla uzaklaştı (yarışma biter).", f: ([z]) => { const [p, q] = oku(HALAT.find(h => h[0] === z)[1]); return { ok: Math.abs(p / q) >= 2, not: `0'a uzaklık ${rH(Math.abs(p), q, true)} m` }; } }],
    sonuc: ([z], h) => { const [p, q] = oku(HALAT.find(x => x[0] === z)[1]); return h ? sonucP(`Kurdele ${p < 0 ? "sola: <b>Mavi takım</b>" : "sağa: <b>Turuncu takım</b>"} kazanır.`) : sonucP("Yarışma sürüyor."); },
    sutun: ["Ölçüm", "Konum", "0'a uzaklık", "Durum"],
    satir: ([z], h) => { const s = HALAT.find(x => x[0] === z)[1], [p, q] = oku(s); return [z, yazH(s), rH(Math.abs(p), q, true) + " m", h ? "bitti" : "sürüyor"]; },
    yon: "Hakemin ölçümlerini sırayla seçin; kurdelenin yeri sayı doğrusunda gösterilsin. Kurdele renkli bölgelerden birine girdiğinde yarışma biter. Hangi ölçümde ve hangi yönde bitiyor?",
    bitis: "Dört ölçümü de sırayla denediğinizde." }),

  /* 11 · uzun atlama */
  11: el => CN.KOSUL(el, { dugme: false,
    girdi: [{ ad: "Sporcu:", sec: ATLA.map(a => a[0]), bas: "Ece" }],
    ciz: ([ad]) => { const v = ATLA.find(a => a[0] === ad)[1];
      return cizgi({ min: -10, max: 4, adim: 1, etAdim: 2, W: 420, H: 166, y: 96, bant: [{ a: 0, b: 4, renk: "#e03131" }, { a: -5, b: 0, renk: "#2b8a3e" }],
        yay: v ? [{ a: 0, b: v, renk: "#7048e8", metin: `${Math.abs(v)} cm` }] : [], nok: [{ v, renk: "#c2255c", ad: TI(v), ust: 60 }],
        ek: X => tx(X(2), 156, "faul bölgesi", { fs: 15, renk: "#c92a2a" }) + tx(X(-2.5), 156, "iyi basış bölgesi", { fs: 15, renk: "#2b8a3e" }) }); },
    kosullar: [{ ad: "Faul değil (ayak ucu çizgiyi geçmemiş).", f: ([ad]) => ATLA.find(a => a[0] === ad)[1] <= 0 },
      { ad: "Çizgiye uzaklık 5 cm'den az.", f: ([ad]) => { const v = ATLA.find(a => a[0] === ad)[1]; return { ok: Math.abs(v) < 5, not: `|${TI(v)}| = ${Math.abs(v)}` }; } }],
    sutun: ["Sporcu", "Konum", "Çizgiye uzaklık", "İyi basış mı?"],
    satir: ([ad], h) => { const v = ATLA.find(a => a[0] === ad)[1]; return [ad, TI(v) + " cm", Math.abs(v) + " cm", h ? "evet ✔" : "hayır"]; },
    yon: "Sporcuları tek tek seçin; ayak ucunun yeri sayı doğrusunda gösterilsin. İki koşulu da sağlayan atlayışları sayın. Tam 5 cm uzaktaki atlayışa dikkat!",
    bitis: "Altı sporcuyu da denediğinizde." }),

  /* 12 · iskele cetveli: parçaları sayarak okuma */
  12: el => CN.KOSUL(el, { dugme: false,
    girdi: [{ ad: "Ay:", sec: Object.keys(ISK), bas: "Mart (K)" }, { ad: "0'dan kaç parça? (yukarı +, aşağı −)", min: -8, max: 4, bas: 0 }],
    ciz: ([ay, n]) => { const [p, q] = ISK[ay];
      return dikey({ min: -2, max: 1, bol: 4, H: 400, W: 360, x: 110,
        nok: [{ v: p / q, renk: "#c2255c", ad: ay, adRenk: "#c2255c" }, ...(n !== p ? [{ v: n / 4, renk: "#1c7ed6", ad: `sizin: ${rH(n, 4, true)}`, adRenk: "#1c5fbf", r: 5 }] : [])] }); },
    kosullar: [{ ad: "Saydığınız parça sayısı işaretin yerini gösteriyor.", f: ([ay, n]) => n === ISK[ay][0] }],
    sonuc: ([ay, n], h) => h ? sonucP(`${ay}: su seviyesi <b>${rH(n, 4, true)} m</b>; normal seviyeye uzaklığı ${rH(Math.abs(n), 4, true)} m.`) : sonucP("Mavi nokta işaretle çakışana kadar parça sayısını değiştirin."),
    sutun: ["Ay", "Parça", "Seviye (m)", "Uzaklık (m)"],
    satir: ([ay, n], h) => h ? [ay, n, rH(n, 4, true), rH(Math.abs(n), 4, true)] : [ay, n, "—", "—"],
    yon: "Bir ay seçin. Sonra 0'dan başlayarak kaç parça yukarı (+) ya da aşağı (−) sayılacağını ayarlayın; mavi noktayı ayın işaretiyle çakıştırın. Dört ayın seviyesini bulup öğrencinin üç ifadesini sınayın.",
    bitis: "Dört ayın seviyesini de deney defterine yazdırdığınızda." }),

  /* 13 · dart */
  13: el => CN.KOSUL(el, { dugme: false,
    girdi: [{ ad: "Bölge:", sec: DART, bas: DART[0], yaz: yazH }],
    ciz: ([s]) => { const [p, q] = oku(s), pu = tur(p, q) === "doğal sayı" ? 3 : tur(p, q).startsWith("doğal sayı olmayan") ? 2 : 1;
      return `<div style="font-size:19px;line-height:2;padding:6px"><b>${yazH(s)}</b> = <b>${rH(p, q, true)}</b><br>Sayı türü: ${tur(p, q)}<br>Puan: <b>${pu}</b></div>`; },
    kosullar: [],
    sutun: ["Bölge", "Değeri", "Türü", "Puan"],
    satir: ([s]) => { const [p, q] = oku(s), t_ = tur(p, q); return [yazH(s), rH(p, q, true), t_, t_ === "doğal sayı" ? 3 : t_.startsWith("doğal sayı olmayan") ? 2 : 1]; },
    yon: "Tahtadaki sekiz bölgeyi tek tek seçin; ifadenin değeri, türü ve puanı deney defterine yazılsın. Sonra tablodaki her öğrencinin üç atışının puanlarını defterden bulup toplayın.",
    bitis: "Sekiz bölgeyi de denediğinizde." }),

  /* 14 · basketbol skor farkı */
  14: el => CN.KOSUL(el, { dugme: false,
    girdi: [{ ad: "Çeyrek sonu:", sec: [1, 2, 3, 4], bas: 1, yaz: x => x + ". çeyrek" }],
    ciz: ([c]) => { const v = BSK[c - 1], once = c > 1 ? BSK[c - 2] : 0;
      return cizgi({ min: -8, max: 8, adim: 1, etAdim: 2, W: 420, H: 166, y: 96, yay: [{ a: once, b: v, renk: "#7048e8", metin: `${Math.abs(v - once)} sayı ${v >= once ? "lehine" : "aleyhine"}` }],
        nok: [{ v: once, renk: "#adb5bd", r: 5 }, { v, renk: "#c2255c", ad: TI(v), ust: 60 }],
        ek: X => tx(X(-4), 156, "Kartallar geride", { fs: 15, renk: "#c92a2a" }) + tx(X(4), 156, "Kartallar önde", { fs: 15, renk: "#2b8a3e" }) }); },
    kosullar: [],
    sonuc: ([c]) => { const v = BSK[c - 1]; return sonucP(`${c}. çeyrek sonunda fark ${TI(v)}: ${v > 0 ? `Kartallar <b>${v} sayı önde</b>` : v < 0 ? `Kartallar <b>${-v} sayı geride</b>` : "<b>skor eşit</b>"}.`); },
    sutun: ["Çeyrek sonu", "Fark", "Durum", "Çeyrekteki değişim"],
    satir: ([c]) => { const v = BSK[c - 1], once = c > 1 ? BSK[c - 2] : 0; return [c + ".", TI(v), v > 0 ? "önde" : v < 0 ? "geride" : "eşit", (v - once > 0 ? "+" : "") + T(v - once)]; },
    yon: "Çeyrek sonlarını sırayla seçin; farkın sayı doğrusundaki yeri ve bir önceki çeyrek sonuna göre değişimi (mor yay) gösterilsin. Seçeneklerdeki dört ifadeyi deney defterine bakarak sınayın.",
    bitis: "Dört çeyrek sonunu da denediğinizde." }),

  /* 15 · gizli sayı: ipuçlarını sınama */
  15: el => CN.KOSUL(el, { dugme: false,
    girdi: [{ ad: "−3'ten sağa kaç parça?", min: 0, max: 20, bas: 3 }],
    ciz: ([n]) => { const p = -15 + n; return cizgi({ min: -3, max: 1, bol: 5, W: 420, H: 140, y: 92, nok: [{ v: p / 5, renk: "#e8590c", kes: [p, 5], karma: true, ust: 42 }] }); },
    kosullar: [
      { ad: "1. ipucu: tam sayı değil ve −2 ile −1 arasında", f: ([n]) => { const p = -15 + n; return p % 5 !== 0 && p > -10 && p < -5; } },
      { ad: "2. ipucu: −1'e, −2'den daha yakın", f: ([n]) => { const v = (-15 + n) / 5; return Math.abs(v + 1) < Math.abs(v + 2); } },
      { ad: "3. ipucu: tam sayılı kesirde kesir kısmının payı çift", f: ([n]) => { const p = Math.abs(-15 + n), [a, b] = sade(p % 5, 5); return { ok: p % 5 !== 0 && a % 2 === 0, not: p % 5 ? `kesir kısmı ${kH(a, b)}` : "" }; } }],
    sutun: ["Nokta", "1. ipucu", "2. ipucu", "3. ipucu"],
    satir: ([n], h, L) => [rH(-15 + n, 5, true), ...L.map(r => r.ok ? "✔" : "✘")],
    yon: "Noktayı −3'ten başlayarak parça parça sağa kaydırın. Her konumda üç ipucu ✔ ya da ✘ olarak denetlensin. Üç ipucunu birden sağlayan tek çentiği arayın.",
    bitis: "−2 ile −1 arasındaki dört çentiğin hepsini denediğinizde." }),

  /* 16 · metro hattı */
  16: el => CN.KOSUL(el, { dugme: false,
    girdi: [{ ad: "İstasyon:", sec: METRO.map(m => m[0]), bas: "Çamlık" }],
    ciz: ([a]) => { const [, p, q] = METRO.find(m => m[0] === a), v = p / q;
      return cizgi({ min: -5, max: 5, bol: 4, etAdim: 1, W: 420, H: 166, y: 96, bant: [{ a: -4, b: -2, renk: "#2b8a3e" }, { a: 2, b: 4, renk: "#2b8a3e" }],
        yay: v ? [{ a: 0, b: v, renk: "#7048e8" }] : [], nok: [{ v, renk: "#c2255c", kes: [p, q], karma: true, ust: 46 }],
        ek: X => tx(X(0), 156, "yeşil: 2 km'den fazla, 4 km'den az", { fs: 15, renk: "#2b8a3e" }) }); },
    kosullar: [{ ad: "Merkez'e uzaklık 2 km'den fazla.", f: ([a]) => { const [, p, q] = METRO.find(m => m[0] === a); return { ok: Math.abs(p / q) > 2, not: `|${rH(p, q, true)}| = ${rH(Math.abs(p), q, true)}` }; } },
      { ad: "Merkez'e uzaklık 4 km'den az.", f: ([a]) => { const [, p, q] = METRO.find(m => m[0] === a); return Math.abs(p / q) < 4; } }],
    sutun: ["İstasyon", "Konum", "Uzaklık", "Otobüs"],
    satir: ([a], h) => { const [, p, q] = METRO.find(m => m[0] === a); return [a, rH(p, q, true) + " km", rH(Math.abs(p), q, true) + " km", h ? "konur ✔" : "—"]; },
    yon: "İstasyonları tek tek seçin; konumu sayı doğrusunda, Merkez'e uzaklığı mor yayla gösterilsin. İki koşulu birden sağlayan istasyonları sayın; güneydeki (negatif) istasyonları unutmayın.",
    bitis: "Altı istasyonu da denediğinizde." }),
};
})();

</script>

0f\"/><text x=\"1532.0\" y=\"404.0\" font-size=\"32\" font-weight=\"800\" fill=\"#d9480f\" text-anchor=\"start\" data-maxw=\"272\" data-grup=\"sb711a\">B (balık sürüsü)</text><circle cx=\"1508\" cy=\"676.5\" r=\"10\" fill=\"#c2255c\"/><text x=\"1532.0\" y=\"687.5\" font-size=\"32\" font-weight=\"800\" fill=\"#c2255c\" text-anchor=\"start\" data-maxw=\"272\" data-grup=\"sb711a\">K (kamera)</text></g></svg>", "son": "<p>Ekranda kameranın yeri K, kameranın görüntülediği bir balık sürüsünün yeri B harfiyle gösterilmiştir. Ölçeğin birimi metredir.</p>", "k": "Buna göre, kameranın deniz seviyesine uzaklığı, balık sürüsünün deniz seviyesine uzaklığından kaç metre fazladır?", "sec": ["7 m", "14 m", "26 m", "38 m"], "secg": null, "c": "B", "a": ["0 ile −10 arasında 5 çentik aralığı vardır; ardışık iki çentik arası 10 : 5 = 2 m'dir.", "Balık sürüsü 0'ın 6 çentik altındadır: −12 m. Kamera 0'ın 13 çentik altındadır: −26 m.", "Kameranın deniz seviyesine uzaklığı 26 m, balık sürüsününki 12 m'dir; fark 26 − 12 = 14 m'dir."], "t": "7: iki nokta arasındaki çentik sayısı yazılmış, bir çentiğin 2 m olduğu unutulmuş; 26: yalnız kameranın deniz seviyesine uzaklığı yazılmış; 38: iki uzaklık toplanmış.", "d": "Ekranda yalnız iki çentiğin değeri yazılıdır: önce 0 ile −10 arasındaki aralıkları sayarak bir çentiğin kaç metre olduğunu bulun. Çentik sayılarını değil metreleri karşılaştırın; konum negatif olsa da deniz seviyesine uzaklık pozitiftir.", "ses": "b01"}, {"no": 2, "on": "<p>Bir televizyon kanalının hava durumu programında bazı illerde sabah ölçülen hava sıcaklıkları aşağıdaki ekranda gösterilmiştir.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 950 570\" width=\"950\" style=\"width:116.7mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw n class=\"nw\">|14| = 14</span>, <span class=\"nw\">|−7| = 7.</span>", "Mutlak değeri 5'ten küçük olan sıcaklıklar Ankara'nın (−2 °C) ve İstanbul'un (4 °C) sıcaklıklarıdır."], "t": "Ankara ve Van: yalnız 0 °C'nin altındaki sıcaklıklar düşünülmüş; Kars ve Erzurum: en soğuk iller seçilmiş; Ankara, İstanbul ve Van: −7 °C'nin 0 °C'ye uzaklığı 5'ten az sanılmış.", "d": "0 °C'ye uzaklık, sıcaklığın mutlak değeridir; −2 °C ile 4 °C'nin ikisi de 0'a yakındır. Yalnız 0'ın altındaki sıcaklıklara bakmayın: −7 °C'nin 0 °C'ye uzaklığı 7 derecedir.", "ses": "b02"}, {"no": 3, "on": "<p>Bir köyde su kuyusu açan sondaj makinesinde, borular uç uca eklenerek toprağın içine indirilmektedir. Yer yüzeyi 0 kabul edilerek yer yüzeyinin üstündeki konumlar pozitif, altındaki konumlar negatif tam sayılarla gösterilmektedir. Görsel temsilîdir.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1376 715\" width=\"1376\" style=\"width:134.7mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAGLAvgDASIAAhEBAxEB/8QAGwAAAQUBAQAAAAAAAAAAAAAABQECAwQGAAf/xABTEAACAQMDAQUFBAUGCwYFBAMBAgMABBEFEiExBhNBUWEUIjJxgZGhscEHFSNC0TNSYnKy8BYkJTVDc3SCkpPhNERUg6LxFyZTY8I2ZJSj0lVl/8QAGgEAAwEBAQEAAAAAAAAAAAAAAAECAwQFBv/EAC8RAAICAQMEAgEDBAMAAwAAAAABAhEDEiExBBNBUSIyFDNhcQUjQlKBsfAVQ2L/2gAMAwEAAhEDEQA/APQcgUg5pK7NbmY7xqZXwKgBpS1S0NCzPnxqLNcxzSU0IcOtTIvFQip48+NJjRMopwFco4pwFZMscOlOHWkVakVM1FlCg8U0MM0roQOKjxSAmDc1IKrg4qRWoAkqtdQCRDxzVmmuMinF07FJWqM3NEYpCDUeKJajGBg1QxXpwlqjZ5k46ZUNrsZpcUtUSJzXYpa4igBK7FLilxQA3FdinYrsUAJiuxTq7FADcUuKWuxSATFdS4rsUAJiuPAJ8qcBTJTthkbyRj91A0ef24x2fhPnp+ftlah2k/5/tv8AWD8RRRBjs/aeulRn7XJoXpX+frb/AFg/EV04voY5PsxNb2/rTVslQe6TGQc9B0/hT/0fH/K91/VT+0KbrOf1nrABI/ZR5AfGeB1HjTv0ff53uf6qf2h ><g transform=\"matrix(0.9965 -0.0176 0.0117 1.0103 1122.2 275.1)\"><text x=\"0.0\" y=\"0.0\" font-size=\"29\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" data-maxw=\"160\" data-sabit=\"1\">uzunluğu</text></g><g transform=\"matrix(0.9946 -0.0084 0.0116 1.0064 1122.7 318.4)\"><text x=\"0.0\" y=\"0.0\" font-size=\"44\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-maxw=\"160\" data-sabit=\"1\">6 m</text></g><line x1=\"8.0\" y1=\"522.0\" x2=\"584.0\" y2=\"503.0\" stroke=\"#212529\" stroke-width=\"3.5\" stroke-dasharray=\"7 6\"/><rect x=\"27.1\" y=\"542.8\" width=\"245.9\" height=\"46.5\" rx=\"10.85\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"2.1700000000000004\" fill-opacity=\".95\"/><text x=\"150.0\" y=\"577.2\" font-size=\"31\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">Yer yüzeyi (0)</text></g></svg>", "son": "<p>Makineye uç uca eklenmiş 7 boru takılmıştır. Boruların hepsi aynı uzunluktadır ve en üstteki borunun 4 m'si yer yüzeyinin üstünde kalmıştır.</p>", "k": "Buna göre, boru hattının en alt ucunun konumunu gösteren tam sayı kaçtır?", "sec": ["−46", "−42", "−38", "38"], "secg": null, "c": "C", "a": ["7 borunun toplam uzunluğu 7 · 6 = 42 m'dir.", "Bu uzunluğun 4 m'si yer yüzeyinin üstündedir; yer yüzeyinin altında 42 − 4 = 38 m kalır.", "En alt uç yer yüzeyinin 38 m altındadır: −38."], "t": "−42: yer yüzeyinin üstünde kalan 4 m çıkarılmamış; −46: 4 m çıkarılacağı yerde eklenmiş; 38: yer yüzeyinin altındaki konumların negatif olduğu unutulmuş.", "d": "Önce boruların toplam uzunluğunu bulun, sonra yer üstünde kalan kısmı çıkarın. Alt uç yer yüzeyinin altında olduğu için konumu negatif tam sayıyla gösterilir.", "ses": "b03"}, {"no": 4, "on": "<p>“Sayı Avı” oyununda tahtaya bir sayı doğrusu çizilmiştir. Sayı doğrusunda −2 ile 2 arası gösterilmiş ve ardışık iki tam sayı arası 4 eş parçaya ayrılmıştır. Oyuncular sırayla bir kart çekmekte ve karttaki sayıyı gösteren çentiğin üstüne pullarını koyma 1.0075 0.0000 0.4212 0.6740 920.2 672.8)\"><g class=\"frac\"><text x=\"0.0\" y=\"-6.9\" font-size=\"44.16\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">7</text><line x1=\"-16.8\" y1=\"2.3\" x2=\"16.8\" y2=\"2.3\" stroke=\"#111111\" stroke-width=\"3.45\"/><text x=\"0.0\" y=\"43.7\" font-size=\"44.16\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">4</text></g></g></g></svg>", "son": "<p>Karttaki sayı tahtadaki çentiklerden birine karşılık gelmiyorsa oyuncu pulunu koyamaz ve sırası geçer. Dört oyuncu, yukarıdaki kartları çekmiştir.</p>", "k": "Buna göre, hangi kartı çeken oyuncu pulunu tahtaya koyamaz?", "sec": ["<span class=\"nw\">−<span class=\"frac\"><span>6</span><span>8</span></span></span>", "<span class=\"nw\">−1<span class=\"frac\"><span>1</span><span>2</span></span></span>", "<span class=\"nw\"><span class=\"frac\"><span>7</span><span>4</span></span></span>", "<span class=\"nw\"><span class=\"frac\"><span>10</span><span>12</span></span></span>"], "secg": null, "c": "D", "a": ["Tahtadaki çentikler, paydası 4 olan sayıları (…, <span class=\"nw\">−<span class=\"frac\"><span>1</span><span>4</span></span></span>, 0, <span class=\"nw\"><span class=\"frac\"><span>1</span><span>4</span></span></span>, <span class=\"nw\"><span class=\"frac\"><span>2</span><span>4</span></span></span>, …) gösterir.", "<span class=\"nw\">−<span class=\"frac\"><span>6</span><span>8</span></span></span> = <span class=\"nw\">−<span class=\"frac\"><span>3</span><span>4</span></span></span>, <span class=\"nw\">−1<span class=\"frac\"><span>1</span><span>2</span></span></span> = <span class=\"nw\">−1<span class=\"frac\"><span>2</span><span>4</span></span></span> ve <span class=\"nw\"><span class=\"frac\"><span>7</span><span>4</span></span></span> sayıları birer çentiğe karşılık gelir.", "<span class=\"nw\"><span class=\"frac\"><span>10</span><span>12</span></span></span> = <span class=\"nw\"><span class=\"frac\"><span>5</span><span>6</span></span></span>'dır; <span class=\"nw\"><span class=\"frac\"><span>5</span><span>6</span></span></span> paydası 4 olan bir kesre denk değildir (<span class=\"nw\"><span class=\"frac\"><span>3</span><span>4</span></span></span> ile 1 arasındadır). Bu kartı çeken oyuncu pulunu koyamaz."], "t": "<span class=\"nw\">−<span class=\"frac\"><span>6</span><span>8</span></span></span>: paydası 8 olduğu için çentiğe gelmeyeceği sanılmış, oysa sadeleşince <span class=\"nw\">−<span class=\"frac\"><span>3</span><span>4</span></span></span> olur; <span class=\"nw\">−1<span class=\"frac\"><span>1</span><span>2</span></span></span>: <span class=\"nw\"><span class=\"frac\"><span>1</span><span>2</span></span></span> = <span class=\"nw\"><span class=\"frac\"><span>2</span><span>4</span></span></span> olduğu görülmemiş; <span class=\"nw\"><span class=\"frac\"><span>7</span><span>4</span></span></span>: 1'den büyük olduğu için tahtada yeri olmadığı sanılmış.", "d": "Bir kesrin çentiğe denk gelip gelmediğine karar vermeden önce kesri sadeleştirin: <span class=\"nw\">−<span class=\"frac\"><span>6</span><span>8</span></span></span> = <span class=\"nw\">−<span class=\"frac\"><span>3</span><span>4</span></span></span>'tür. Paydası 4 olan bir kesre denk getirilemeyen sayı (<span class=\"nw\"><span class=\"frac\"><span>5</span><span>6</span></span></span>) iki çentiğin arasında kalır.", "ses": "b04"}, {"no": 5, "on": "<p>Çatısında güneş panelleri bulunan bir ev, gün boyunca ürettiği elektriğin fazlasını şebekeye vermekte, yetmediği zaman şebekeden elektrik almaktadır. Evin akıllı sayacının telefon uygulamasında, her gün şebekeye verilen elektrik pozitif, şebekeden alınan elektrik negatif sayıyla gösterilmektedir.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1328 620\" width=\"1328\" style=\"width:149.9mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABA n sayılmaz.", "ses": "b05"}, {"no": 6, "on": "<p>Bir müzede eserler, yapıldıkları yıla göre bir zaman şeridinin üstüne yerleştirilmiştir. Şeritte Milat 0 ile gösterilmiştir; Milattan önceki yıllar 0'ın solunda, sonraki yıllar sağındadır. Şeritteki ardışık iki çentik arası eşit sayıda yılı göstermektedir.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1076 330\" width=\"1076\" style=\"width:150mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCADpAvgDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAQIAAwUEBgf/xABMEAACAQIBBgYMCwgCAwEBAQAAAQIDEQQFEiExQZEGExRRU5IVIjJSVGFxc4GTobEWIyQzNEJDcqKywSVEVWKCg9HhB2M1RfHwZHT/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/xAAjEQEBAAICAwEAAwEBAQAAAAAAAQIREiEDMVETMkFhIiME/9oADAMBAAIRAxEAPwDBRs8GV8vq+a/VGOkbXBpfLqvmv1Rwd69Mh4iIsiVDoeIqHRFOiyJXEsRBZEdCIk69Gi0qtWEG9WdJK4F6LInLy7Bx0SxdBeWohllDBbMZQ9YiJuOpIdI5Vj8G/wB7o+sRYsbhH+9UeugL0glSxmE8Jo9dB5XhPCqPXQNxZYFhOV4Xwml10DlmF8Jo9dA6PYDQqxWGnLNhiKUm9SU1cdgI0K0OxWgpANDWIULYlgksALEsGxLBACiBAKQyRzcvwa14ugtmmohllDBPVjKHrEDcdCQyRQsdg3+90fWIdYzCeFUeuiG1qQyRSsXhfCaXXQ3K8L4TS66BuLbEK+V4Xwml10TleF8JpddA2ssQr5ZhPCaPXRZCcKsc6nOM488XdAQgQBUCAp5dg07PF0F/cQReQp5dg3+9UfWIPLcI/wB6o+sQNxaCxVy3CeFUeuictwnhVHroG4saFYnLML4VR66A8ZhPCqPXQNw7FaEeNwnhVHroR4/B+F0fWIG4doRjRqQrQz6c4zi9Uou6FZQkhGWSEYVWxGWMRoCtoVosaEaARgHsCxQobEsGwAsFIlhkgAkOkBIZIgKHQqHSAZDoRDoBkWIRDxIGQ6QNCi5SaSWtsrWLwvhVHroIuQbFXK8L4TR66JyvCr95pddA3FtgWK+WYXwml10DlmE8JpddA3FjFaEeMwvhNLroV4zC+E0eugbOxGI8bhPCqPXQrxuE8Ko9dA3DMrkLPHYNa8XRXlqIreNwdr8qo21/OIpuGkVyLLqUU0001dNCSCqpCMskJICpiMsZXJFRWzynCp2yjS80vez1bPJcLL9kaPmf1ZqIx84hWmQqO1I2uDa+XVfNfqjJSNjg4vltTzf6o5xt6NFkdQqWkdGkMh0hUOiKdFiEiWIgZGdjoQqZYw0akFJcRN6VfajSSOHFRvlnDP8A6J+9ESlWCoXuqUPI4JlfJ8OpNcV .5 Z\" fill=\"#1f7a8c\"/><rect x=\"290.2\" y=\"46.0\" width=\"795.6\" height=\"48.0\" rx=\"11.2\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"2.24\" fill-opacity=\".95\"/><text x=\"688.0\" y=\"81.5\" font-size=\"32\" font-weight=\"800\" fill=\"#1f7a8c\" text-anchor=\"middle\" data-sabit=\"1\">1. katlama: sağ uç sol ucun üstüne getirilecek</text></g></svg>", "son": "<p>Üç katlamadan sonra şerit açılıp yeniden sayı doğrusunun üzerine aynı yere konacaktır. Şeritteki her kat izi, sayı doğrusunda bir noktaya karşılık gelecektir.</p>", "k": "Buna göre, kat izlerinden kaç tanesi negatif bir rasyonel sayıyı gösteren noktaya karşılık gelir?", "sec": ["3", "4", "7", "8"], "secg": null, "c": "A", "a": ["Her katlamada parça sayısı iki katına çıkar: 1. katlamadan sonra 2, 2. katlamadan sonra 4, 3. katlamadan sonra 8 eş parça oluşur.", "2 birimlik şerit 8 eş parçaya ayrılır; her parça <span class=\"nw\"><span class=\"frac\"><span>2</span><span>8</span></span></span> = <span class=\"nw\"><span class=\"frac\"><span>1</span><span>4</span></span></span> birimdir. Kat izleri <span class=\"nw\">−<span class=\"frac\"><span>3</span><span>4</span></span></span>, <span class=\"nw\">−<span class=\"frac\"><span>1</span><span>2</span></span></span>, <span class=\"nw\">−<span class=\"frac\"><span>1</span><span>4</span></span></span>, 0, <span class=\"nw\"><span class=\"frac\"><span>1</span><span>4</span></span></span>, <span class=\"nw\"><span class=\"frac\"><span>1</span><span>2</span></span></span> ve <span class=\"nw\"><span class=\"frac\"><span>3</span><span>4</span></span></span> noktalarındadır (7 iz).", "Negatif sayıları gösteren izler <span class=\"nw\">−<span class=\"frac\"><span>3</span><span>4</span></span></span>, <span class=\"nw\">−<span class=\"frac\"><span>1</span><span>2</span></span></span> ve <span class=\"nw\">−<span class=\"frac\"><span>1</span><span>4</span></span></span>'tür: 3 tane."], "t": "4: ortadaki 0 izi de negatif sanılmış; 7: bütün kat izleri sayılmış; 8: parça sayısı ile iz sayısı karıştırılmış.", "d": "Her katlamada parça sayısı iki katına çıkar; kat izlerinin sayısı parça sayısından 1 eksiktir. Tam ortadaki (0'daki) kat izi ne pozitif ne de negatif bir sayıyı gösterir.", "ses": "b07"}, {"no": 8, "on": "<p>Bir bilim merkezindeki panoda, yeryüzündeki bazı yerlerin deniz seviyesine göre yükseltileri verilmiştir. Deniz seviyesi 0 kabul edilmiş; deniz seviyesinin üstündeki yükseltiler pozitif, altındaki yükseltiler negatif tam sayılarla gösterilmiştir.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1110 470\" width=\"1110\" style=\"width:150mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAFCAvgDASIAAhEBAxEB/8QAHAAAAgIDAQEAAAAAAAAAAAAAAAECBQMEBgcI/8QAUxAAAQMCAwMGBwsJBgUEAwEAAQACAwQRBRIhBjFBEyJRYXHRFBUycoGRsSMzQlJTVHOSk6HBFiQ0NTZVlLLSByVDdKThJmJjgrNEg6LwRaPC4v/EABkBAQEBAQEBAAAAAAAAAAAAAAABAwIEBf/EACoRAQACAQMEAwEAAgIDAQAAAAABAhEDITESE0FRBBQyIgVhI0IVUnGB/9oADAMBAAIRAxEAPwC8AWRiiApNCxbMzVkAWNqyAoJgKQCTdym1FMBTCiApBQSCmFEKQRUgphRG9TCiJBNLepBAwpBRCkEVIKQCiFIIiQTCSYQMKSimgkgJJoGmkmgE0IQNCEIGhJCqGhCEDQkmgEIQqGhJHUgaEXSUDCaEKoEkIQCSEIBJCECSKaRVCSTSRSSKaRQRKRCaSBKJUiolVCSUioogKiQpJFURSTQqEkpJFAkuKaSrmTG8LdstIbwt+y203m1/CFkWU7IstsvLhCyYGilZMBTK4Y3BZWjmhRIWRo5oSZIVW0g/uGp80e1eb7JD/iJ/04XpO0gtgNT5v4rzfZIf8RP+nCeIa14l3+0Q/MW+cuUgHunpXWbRD8xb5y5SAe6rLU5ejQ/Ls8M95Z2Laxf9UzeatXDPem9i2sW/VM3mrz+W08PKKXy8Q+md7F6bsz+g1PnN/lC8zpvfMQ+md7F6Xsx+g1PnN/lC0hxK2A5oUHjRZQOaFB40W0S8s8IM8kKVkMGilZWWeEbJ21TsnbVDDzD/APIV3+bk9qvtlBpSfQy/+QqiP6xrv81J7VfbJ7qT6GX/AMhUn9PRP4dbCOYhTiHMQpM7sYhwoCmAogKYXkfSSasrViCytRWRqmFBqmFJExdTseCiN4UwoAKYUd5UrKKmFIKIUggkFIKICmEQwpAJBSCBgdakAogqQQMKSimEDT4pJoGmkmgaaSYQNCSaATSQqGhAQiGjgkmgE0kIGhJCoaEIQCa \" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">7</text><line x1=\"1677.5\" y1=\"529.1\" x2=\"1702.5\" y2=\"529.1\" stroke=\"#111111\" stroke-width=\"2.55\"/><text x=\"1690.0\" y=\"559.7\" font-size=\"32.64\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">4</text></g><line x1=\"1410.0\" y1=\"700.0\" x2=\"1746.0\" y2=\"700.0\" stroke=\"#cfd8e8\" stroke-width=\"2\"/><text x=\"1460.0\" y=\"656.0\" font-size=\"32.3\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\" data-maxw=\"170\" data-grup=\"sb711i\">40. saniye</text><g class=\"frac\"><text x=\"1685.8\" y=\"656.0\" font-size=\"34\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"end\" data-sabit=\"1\">−</text><text x=\"1701.6\" y=\"638.3\" font-size=\"32.64\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">9</text><line x1=\"1689.2\" y1=\"645.1\" x2=\"1714.1\" y2=\"645.1\" stroke=\"#111111\" stroke-width=\"2.55\"/><text x=\"1701.6\" y=\"675.7\" font-size=\"32.64\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\" data-sabit=\"1\">4</text></g></g></svg>", "son": "<p>Hakem her 10 saniyede bir kurdelenin konumunu defterine yazmaktadır. Kurdele 0'a 2 m ya da daha fazla uzaklaştığında yarışma biter ve kurdelenin gittiği yöndeki takım kazanır.</p>", "k": "Buna göre, yarışma hangi ölçümde bitmiş ve hangi takım kazanmıştır?", "sec": ["40. saniyede; Mavi takım", "20. saniyede; Mavi takım", "30. saniyede; Turuncu takım", "40. saniyede; Turuncu takım"], "secg": null, "c": "A", "a": ["Kurdelenin 0'a uzaklıkları: |<span class=\"nw\">1<span class=\"frac\"><span>1</span><span>4</span></span></span>| = <span class=\"nw\">1<span class=\"frac\"><span>1</span><span>4</span></span></span>, <span class=\"nw\">|<span class=\"nw\">−<span class=\"frac\"><span>3</span><span>2</span></span></span>| = 1</span> <span class=\"nw\"><span class=\"frac\"><span>1</span><span>2</span></span></span>, <span class=\"nw\">|<span class=\"nw\"><span class=\"frac\"><span>7</span><span>4</span></span></span>| = 1</span> <span class=\"nw\"><span class=\"frac\"><span>3</span><span>4</span></span></span> ve <span class=\"nw\">|<span class=\"nw\">−<span class=\"frac\"><span>9</span><span>4</span></span></span>| = 2</span> <span class=\"nw\"><span class=\"frac\"><span>1</span><span>4</span></span></span> m'dir.", "Uzaklığın ilk kez 2 m'ye ulaştığı ya da 2 m'yi geçtiği ölçüm 40. saniyedeki ölçümdür (<span class=\"nw\">2<span class=\"frac\"><span>1</span><span>4</span></span></span> m).", "Bu ölçümde kurdelenin konumu negatiftir; kurdele sola, Mavi takımın yönüne gitmiştir."], "t": "20. saniyede: <span class=\"nw\">−<span class=\"frac\"><span>3</span><span>2</span></span></span>'nin payı 3 olduğu için 2'den uzak sanılmış; 30. saniyede: <span class=\"nw\"><span class=\"frac\"><span>7</span><span>4</span></span></span>'ün 2'den büyük olduğu sanılmış, oysa <span class=\"nw\"><span class=\"frac\"><span>7</span><span>4</span></span></span> = <span class=\"nw\">1<span class=\"frac\"><span>3</span><span>4</span></span></span>'tür; 40. saniyede Turuncu: mutlak değer doğru bulunmuş ama işaretin gösterdiği yön karıştırılmış.", "d": "Kurdelenin 0'a uzaklığı konumun mutlak değeridir; <span class=\"nw\"><span class=\"frac\"><span>7</span><span>4</span></span></span> = <span class=\"nw\">1<span class=\"frac\"><span>3</span><span>4</span></span></span> olduğundan 2'ye ulaşmaz. Kazananı uzaklık değil işaret belirler: negatif konum sola, Mavi takımın yönüne doğrudur.", "ses": "b10"}, {"no": 11, "on": "<p>Uzun atlama antrenmanında antrenör, sporcuların sıçrarken bastıkları ayağın ucunun basma çizgisine göre konumunu ölçmektedir. Basma çizgisi 0 kabul edilmiş; çizginin gerisindeki konumlar negatif, çizginin ilerisindeki (kum havuzu yönündeki) konumlar pozitif tam sayılarla gösterilmiştir.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1796 768\" width=\"1796\" style=\"width:150mm;max-width:100%;height:auto\" xmlns=\"http://www.w3. e Mert (+1). Kalan atlayışlar Ece (−7), Can (−3), Defne (−4) ve Zeynep'in (−5) atlayışlarıdır.", "Bunların çizgiye uzaklıkları 7, 3, 4 ve 5 cm'dir. 5 cm'den az olanlar Can (3 cm) ve Defne'dir (4 cm): 2 atlayış. Zeynep'in uzaklığı tam 5 cm'dir; 5 cm'den az değildir."], "t": "3: Zeynep'in 5 cm'lik uzaklığı da sayılmış; 4: faul olan Ali ve Mert'in atlayışları ayrılmadan çizgiye uzaklığı 5 cm'den az olanlar sayılmış; 6: bütün atlayışlar sayılmış.", "d": "İki koşulu birlikte denetleyin: önce pozitif konumdaki (faul) atlayışları ayırın, sonra kalanların çizgiye uzaklığına bakın. “5 cm'den az” koşulunda tam 5 cm sayılmaz.", "ses": "b11"}, {"no": 12, "on": "<p>Bir gölün kıyısındaki iskelede su seviyesini izlemek için suyun içine dikey bir ölçü cetveli yerleştirilmiştir. Cetvelde normal su seviyesi 0 ile gösterilmiştir. Cetvelde ardışık iki tam sayı arası 4 eş parçaya ayrılmıştır. Dört farklı ayda su seviyesinin cetveldeki yeri aşağıda K, L, M ve N harfleriyle gösterilmiştir.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 720 508\" width=\"720\" style=\"width:99.2mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAIYAvgDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAAIBAwQFBgf/xABNEAABBAECAwQGBAoIBQMEAwABAAIDEQQSIQUxQRMiUWEGFDJxgZEVI0JSM0Nyc4KSobHB0RYkNDVEU2JjB0WDk+ElVPBVZHSUNqKj/8QAGgEBAQEBAQEBAAAAAAAAAAAAAAECAwQFBv/EACcRAQEAAgICAgIDAQEBAQEAAAABAhEDEiExQVEEExQiMmEzI0Jx/9oADAMBAAIRAxEAPwD6QCpcdkgTLtHLKbisqFYQFGi12mUea4VDBZV7ccOFpI4zqW2MU3dYzz16b48N+2V2NQ2CQY+24XQNKs14LM5K6Xijnvj0nkq+S2vAKzvaF1mTz5YaUopNShbcyoTUoV2IpQQmQgVQmpCbQqKU0ikQqE1KKVEEIU0ik2IUbJkUm0KoTUilVKhTSKQQhTSKREUopNSFAtIpTW6mlQtIpSikC0ik1FFIhaRSmkUgWkUmpFIFQpSySRwgGV7WA8tRq1LlJ7WY2+omlCq9exLA9ahs n></span> m ile gösterilir.<br>II. Haziran ayında su, normal seviyenin <span class=\"nw\"><span class=\"frac\"><span>1</span><span>4</span></span></span> m altındadır.<br>III. Mart ve Ekim aylarındaki su seviyelerinin normal seviyeye uzaklıkları eşittir.</p>", "k": "Buna göre, öğrencinin yazdığı ifadelerden hangileri doğrudur?", "sec": ["Yalnız II", "I ve II", "I, II ve III", "II ve III"], "secg": null, "c": "D", "a": ["Bir parça <span class=\"nw\"><span class=\"frac\"><span>1</span><span>4</span></span></span> m'dir. K, 0'ın 3 parça üstündedir: <span class=\"nw\"><span class=\"frac\"><span>3</span><span>4</span></span></span> m. L, 0'ın 1 parça altındadır: <span class=\"nw\">−<span class=\"frac\"><span>1</span><span>4</span></span></span> m. N, 0'ın 3 parça altındadır: <span class=\"nw\">−<span class=\"frac\"><span>3</span><span>4</span></span></span> m.", "M, −1'in 1 parça altındadır: <span class=\"nw\">−1<span class=\"frac\"><span>1</span><span>4</span></span></span> m. I yanlıştır (<span class=\"nw\">−1<span class=\"frac\"><span>1</span><span>2</span></span></span> m, −1'in 2 parça altıdır).", "II doğrudur. Mart (<span class=\"nw\"><span class=\"frac\"><span>3</span><span>4</span></span></span>) ve Ekim (<span class=\"nw\">−<span class=\"frac\"><span>3</span><span>4</span></span></span>) seviyelerinin normal seviyeye uzaklıkları <span class=\"nw\"><span class=\"frac\"><span>3</span><span>4</span></span></span> m'dir; III doğrudur."], "t": "I'i doğru sanan öğrenci M'nin −1 ile −2 arasında olduğunu görüp kaç parça aşağıda olduğunu yanlış saymıştır; III'ü yanlış sanan öğrenci işaretleri farklı olan iki sayının 0'a eşit uzaklıkta olabileceğini düşünmemiştir.", "d": "Cetvelde bir parça <span class=\"nw\"><span class=\"frac\"><span>1</span><span>4</span></span></span> m'dir. −1'in altındaki bir noktayı okurken −1'den aşağıya doğru parça sayın: <span class=\"nw\">−1<span class=\"frac\"><span>1</span><span>4</span></span></span>, −1'in 1 parça altıdır. İşaretleri farklı iki sayı 0'a eşit uzaklıkta olabilir.", "ses": "b12"}, {"no": 13, "on": "<p>Bir dart tahtası sekiz eş bölgeye ayrılmış ve her bölgeye bir ifade yazılmıştır. Okun saplandığı bölgedeki ifadenin eşit olduğu sayının türüne göre puan kazanılmaktadır.</p>", "g": "<div style=\"display:flex;flex-direction:column;align-items:center;gap:2mm;width:100%\"><svg class=\"foto511\" viewBox=\"0 0 1090 650\" width=\"1090\" style=\"width:117.4mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAHFAvgDASIAAhEBAxEB/8QAHAABAQADAQEBAQAAAAAAAAAAAAECAwQFBgcI/8QATxAAAgEDAQUCBwwJAgQFBAMAAAECAwQRIQUSMUFRYXETIjJSgZGxBhQVNEJDU3SSocHRIzM2YnJzlMLhFvAkNVWyB1RjgoMlJkSiRWSE/8QAGgEBAQADAQEAAAAAAAAAAAAAAAECAwQFBv/EACcRAQACAgIBBAIDAQEBAAAAAAABAgMRBDESEyEzUTJBIlJhBRRx/9oADAMBAAIRAxEAPwD9WBQYqgA6EVAAwBCgAQpAAAYAMEAJEKGRdoAyA2EZhUrUqKzVqwpr96SRz/ClnnEKrqv/ANOEp+xE3EK6wcjv2/1dldy/+NR9rRPfVy1ps6sv4qkF+JPOv2updYyeRc7aq2t3Stamzq3hK0JThipBrEcZ59qJ8NVPlbNuPROD/EzrE2jcMJtFfaXr5RN48j4epry7O8h/8al7GRe6LZ3CdaVJ/wDq05R9qL4zH6IvE/t7G8sjeOCjtG1uP1NzSqfwzTN6qmLJvyMmnwnaXf7QNuU0GzWpJFcsoDPmR8SJjIFHIjYyQGVkBRQTQcCAwB3gR8AGOwAQoWoEHIcxzAcwMAAQPgAI9SgcwIARclxApMDiUCcCFIBF3jmUhAJxL2jAE4j2ovAJcwqcshcMjs5E4oBgcWUhARMFAEJgy4kAnPgQrXPJHFPTtyFR6cNQufUuBjiBjNeRLzX+BHrhGUo+EhKGcN6pmCbkstYaCwyGR2Ea1APkGHqgAYyTtDf3EE4aDOrWdVxDknJRzrjOOqG6srKWUAzlImefUdpOCXYA5dpH2FD0yBi9CLPhUs4WDLvADGoHMAfQgMG5qQAoEADAgLzIQCMrBRAykIHIhW0lryOWV46ni2lPwz89vdgvTz9BJmI7IjbpOed7QjNwjJ1ai+RSW816uHpMPesq2t1WlV/9OPiw9XF+lm6EY047kIqEVwUVhHPbPH6bIp9tDqXtV+JSpUI9aj35epafeR2cqn6+6r1P3Yy3I+qP5nSGaLZbT+2UViGinY2lF5p29JPzt3L9bN2XjARTXuZZIAwQeDtl490Fh9Wr/wBhi2y7Z/aCw+r1/wCwh7fC+J5vK/NiTGTMh2OVzVbG0ra1LenJ9d1Z9ZI2k6Pxa8uKPZv70fVLJ0tEJNaz3DKLWjqWpXm1 .5mm;text-align:center\"><span class=\"nw\"><span class=\"frac\"><span>5</span><span>6</span></span></span></td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\"><span class=\"nw\"><span class=\"frac\"><span>9</span><span>2</span></span></span></td></tr></tbody></table></div></div>", "son": "<p>Dört öğrenci üçer atış yapmıştır; okların saplandığı bölgelerdeki ifadeler tabloda verilmiştir. Her öğrencinin puanı, üç atışta kazandığı puanların toplamıdır.</p>", "k": "Buna göre, <u>en fazla</u> puanı alan öğrenci kimdir?", "sec": ["Ali", "Can", "Ece", "Defne"], "secg": null, "c": "C", "a": ["Bölgelerdeki sayılar: <span class=\"nw\">−<span class=\"frac\"><span>12</span><span>4</span></span></span> = −3 (2 puan), <span class=\"nw\"><span class=\"frac\"><span>0</span><span>7</span></span></span> = 0 (3 puan), <span class=\"nw\"><span class=\"frac\"><span>15</span><span>5</span></span></span> = 3 (3 puan), <span class=\"nw\"><span class=\"frac\"><span>9</span><span>2</span></span></span> (1 puan), <span class=\"nw\">−1<span class=\"frac\"><span>1</span><span>3</span></span></span> (1 puan), <span class=\"nw\"><span class=\"frac\"><span>8</span><span>8</span></span></span> = 1 (3 puan), <span class=\"nw\"><span class=\"frac\"><span>7</span><span>−1</span></span></span> = −7 (2 puan), <span class=\"nw\"><span class=\"frac\"><span>5</span><span>6</span></span></span> (1 puan).", "Ece: 3 + 1 + 3 = 7; Ali: 2 + 3 + 1 = 6; Can: 2 + 1 + 2 = 5; Defne: 3 + 1 + 1 = 5 puan.", "En fazla puanı Ece almıştır."], "t": "Ali: <span class=\"nw\"><span class=\"frac\"><span>0</span><span>7</span></span></span>'nin doğal sayı olduğu unutulursa Ece'nin puanı 6'ya düşer ve Ali'ninkiyle eşit görünür; Can ve Defne: <span class=\"nw\"><span class=\"frac\"><span>8</span><span>8</span></span></span>, <span class=\"nw\">−<span class=\"frac\"><span>12</span><span>4</span></span></span> ve <span class=\"nw\"><span class=\"frac\"><span>7</span><span>−1</span></span></span> ifadelerinin birer tam sayıya eşit olduğu görülmezse puanlar yanlış hesaplanır.", "d": "Her ifadeyi önce sadeleştirin: <span class=\"nw\"><span class=\"frac\"><span>0</span><span>7</span></span></span> = 0 bir doğal sayıdır; <span class=\"nw\"><span class=\"frac\"><span>8</span><span>8</span></span></span> = 1 ve <span class=\"nw\"><span class=\"frac\"><span>15</span><span>5</span></span></span> = 3 de doğal sayıdır. <span class=\"nw\">−<span class=\"frac\"><span>12</span><span>4</span></span></span> ve <span class=\"nw\"><span class=\"frac\"><span>7</span><span>−1</span></span></span> tam sayıdır ama doğal sayı değildir.", "ses": "b13"}, {"no": 14, "on": "<p>Bir basketbol maçında Kartallar takımının her çeyreğin sonundaki skor durumu, rakibinin skoruna göre aşağıdaki grafikte gösterilmiştir. Kartallar öndeyse fark pozitif, gerideyse negatif bir tam sayıyla gösterilmiştir.</p>", "g": "<div style=\"display:flex;flex-direction:column;align-items:center;gap:2mm;width:100%\"><svg class=\"foto511\" viewBox=\"0 0 1376 768\" width=\"1376\" style=\"width:93.2mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAGoAvgDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAwQCBQYBAAf/xABSEAACAQMCAgcDCQQHBAkEAQUBAgMABBEFIRIxBhMiQVFhcYGRoRQjMkJSkrHB0RVTYnIWJDNDVKLhY4KT8AclNERkc5Sy8YOjs9I1wiZVhOL/xAAaAQACAwEBAAAAAAAAAAAAAAABAgADBAUG/8QALREAAgIBBAEDBAICAwEBAAAAAAECEQMEEiExQRMiUQUUMmEjcUKBM1KxJKH/2gAMAwEAAhEDEQA/AMdiokZomKiRWM3C7wKTleyfKgukicxkeIp0iuYo2CimvWBt33qrFaW5tIp0IdefeNjSC6ZB/F76tjJJFMoNsq6lGRnt5A/hq6XSrcKGUHPma4bOOP8Aux60d6F9NiUdzbx/Rt2J8W3pgal/4dz6miGFOYUCvZVfpIB6CpaDtkiH7Uf/AA59M4r37VkGwtwPLNGHB9lfdSMl5LFO6qEZQdgyiiqfgNS+Rj9rS90Cj2139qz8xCg99RtLwzzCN4o8YzkDFPjA5Ko9lVzyRg6aGjjk <span>6</span><span>5</span></span></span>: bileşik kesrin payı çift diye seçilmiş; <span class=\"nw\">−<span class=\"frac\"><span>8</span><span>5</span></span></span>: −2'ye daha yakındır; <span class=\"nw\">−<span class=\"frac\"><span>3</span><span>5</span></span></span>: <span class=\"nw\">−1<span class=\"frac\"><span>2</span><span>5</span></span></span>, −1 + <span class=\"nw\"><span class=\"frac\"><span>2</span><span>5</span></span></span> sanılmış.", "d": "Negatif tam sayılı kesirde eksi işareti sayının tamamına aittir: <span class=\"nw\">−1<span class=\"frac\"><span>2</span><span>5</span></span></span>, −1'in 2 parça solundadır. 3. ipucunda bileşik kesrin payına değil, tam sayılı kesrin kesir kısmının payına bakın.", "ses": "b15"}, {"no": 16, "on": "<p>Bir şehrin metro hattındaki istasyonların konumları, hattın panosunda Merkez istasyonu 0 kabul edilerek kilometre cinsinden rasyonel sayılarla gösterilmiştir. Merkez'in kuzeyindeki konumlar pozitif, güneyindekiler negatif sayılarla gösterilmiştir.</p>", "g": "<svg class=\"foto511\" viewBox=\"0 0 1184 225\" width=\"1184\" style=\"width:150mm;max-width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'Liberation Sans', Arial, sans-serif\"><image href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCACQAvgDASIAAhEBAxEB/8QAGgAAAgMBAQAAAAAAAAAAAAAAAAECBAYFA//EADoQAAEDAwMCBQMDAgUEAwEBAAECAxEABAUSITETQQYUIlFhFTJxI0KBUpEkM2KhsRbB8PGC0eFDcv/EABgBAQEBAQEAAAAAAAAAAAAAAAABAgME/8QAKREAAgIDAAEDAwQDAQAAAAAAAAECERIhMUEDImFRcYGxwfDxEzJCof/aAAwDAQACEQMRAD8A7D+Ptr+8+r4q/Xaou0BYU79qnVKI0hU7HUBKT7yKgh9nwvZhixd6+VyLpZSt0+gpSdOqJ+2f7n4p5IYfFssYhQ+oOMALU202kFKwrUuVdpEjSOBXrf2tt4htGcjiXW7q6ZUepbuoQHNBOyPyN9J712io3vhJSniULPPvYN/Xc3zl/ZPOaLlLghSFEka0cQNjKe1ezvhgsOrtbDLdC3fWkDrkS4nSVFSIO4jbeOOa8mrC7zzybVsI0oVLzvl4DPqJJVP7zMaRxvV   const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
