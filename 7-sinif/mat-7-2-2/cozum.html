<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* ANA_KURALLAR §4.y-3: Etkinliklerde bütün kesirler kesir çizgisiyle (alt alta pay/payda) gösterilir. Düz yazılmış a/b biçimleri otomatik dönüştürülür. */
(function(){
  if (window.__kesirCizgi) return; window.__kesirCizgi = 1;
  const RX = /(^|[^\w\/.,:%])([−-])?(?:(\d+) )?(\d{1,4})\/(\d{1,4})(?![\w\/.,]\d|\w)/g;
  const ATLA = "script,style,svg,textarea,input,select,code,.ilr,.frac,[data-duz]";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function donustur(kok){
    if (!kok || !kok.nodeType) return;
    if (kok.nodeType === 3) kok = kok.parentElement;
    if (!kok || (kok.closest && kok.closest(ATLA))) return;
    const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      if (!/\d\/\d/.test(t.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = t.parentElement; if (!p || p.closest(ATLA)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const L = []; let t; while ((t = w.nextNode())) L.push(t);
    L.forEach(t => {
      let deg = false;
      const h = esc(t.nodeValue).replace(RX, (m, a, s, tam, p, q) => { deg = true;
        return a + (s ? "−" : "") + (tam ? tam + " " : "") + '<span class="frac"><span>' + p + "</span><span>" + q + "</span></span>"; });
      if (!deg) return;
      const k = document.createElement("span"); k.innerHTML = h; t.replaceWith(...k.childNodes);
    });
  }
  let bekleyen = new Set(), plan = 0;
  const calis = () => { plan = 0; const b = bekleyen; bekleyen = new Set(); b.forEach(donustur); };
  const gozcu = new MutationObserver(ms => { ms.forEach(m => {
      if (m.type === "characterData") bekleyen.add(m.target); else m.addedNodes.forEach(n => bekleyen.add(n)); });
    if (!plan) plan = requestAnimationFrame(calis); });
  const bas = () => { donustur(document.body); gozcu.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bas); else bas();
  const st = document.createElement("style");
  st.textContent = ".frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}.frac>span{display:block;text-align:center;padding:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor}";
  document.head.appendChild(st);
})();

/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {

    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });

    async function dagit(k) {

      const kolon = Math.min(k, 6), satirK = Math.ceil(k / kolon), gw = kolon * 14 + 16, gh = satirK * 14 + 26;

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */
  function ATLA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Sonuç"] });
    let k = o.k, L = o.son; const W = 660, sol = 22, sag = 22, sk = (W - sol - sag) / L;

    const bA = dug("▶ Oynat"), bB = dug("+1 " + (o.adimAd || "adım"), "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bB, bS);
    let kA = null;
    if (o.kSec) { kA = adimci(o.kEtiket || "Adım:", 2, Math.floor(L / 2), k, v => { k = v; sifirla(); }); kut.prepend(kA.w); }

    const bT = dug(o.testDugme || "Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test);
    const ti = test.querySelector("input");
    function taban() {
      let sv = `<line x1="${sol}" y1="62" x2="${sol + L * sk}" y2="62" class="cn-ek"/>`;

      for (let v = 0; v <= L; v += adimT) sv += `<line x1="${sol + v * sk}" y1="${v % et ? 58 : 54}" x2="${sol + v * sk}" y2="66" class="cn-ek"/>` + (v % et ? "" : `<text x="${sol + v * sk}" y="82" text-anchor="middle" class="cn-et">${o.etYaz ? o.etYaz(v) : v}</text>`);
      sv += `<line x1="${sol + L * sk}" y1="30" x2="${sol + L * sk}" y2="70" class="cn-sinir"/><text x="${sol + L * sk}" y="24" text-anchor="end" class="cn-et">${o.sonEt || L}</text>`;

    }

      izle.forEach((v, i) => {

        sv += `<path d="M${x1} 62 Q${(x1 + x2) / 2} ${yy} ${x2} 62" class="cn-yay"/><circle cx="${x2}" cy="62" r="4.5" class="${o.renk ? o.renk(v, i + 1) : "cn-o"}"/>`;
        if (izle.length <= 14 || i === izle.length - 1 || i % Math.ceil(izle.length / 10) === 0) sv += `<text x="${x2}" y="${98}" text-anchor="middle" class="cn-et2">${v}</text>`;
      });

      const son = izle.length ? izle[izle.length - 1] : 0, ix = sol + son * sk;
      sv += `<text x="${ix}" y="50" text-anchor="middle" class="cn-kis">${o.simge || "●"}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W} 104" role="img" aria-label="${k} birimlik adımlarla ilerleme">${sv}</svg>`;
    }
    const ileri = () => {
      const v = (n + 1) * k;
      if (v > L) { durdur(); s.dur.innerHTML = `<span class="kotu">■</span> Sonraki ${o.adimAd || "adım"} ${k} ${x} ${n + 1} = <b>${v}</b> olurdu; bu ${E(L,"den")} büyük. ${o.bitti ? o.bitti(n, k, L) : `Toplam ${n} ${o.adimAd || "adım"}; son değer ${n * k}.`}`; if (!izle.length) ciz(); return false; }
      n++; izle.push(v); ciz(); s.dur.innerHTML = o.durum ? o.durum(n, v, k) : `${n}. ${o.adimAd || "adım"}: ${k} ${x} ${n} = <b>${v}</b>`; return true;

      s.dur.innerHTML = m; s.yaz("t" + v, [v, r === 0 ? (ic ? `${k} ${x} ${b} ✔` : `${k} ${x} ${b} (sınır dışı)`) : `kalan ${r} ✘`], r === 0 && ic);

  }

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || [o.kAd || "k", "Boyanan", "En büyük"] });
    let k = o.k || 2, son = o.son;
    const kut = h("div", "cn-satir");

    if (o.sonSec) { const sw = h("div", "cn-hazir"); o.sonSec.forEach(v => { const b = dug(v + " gün", "ghost"); b.onclick = () => { son = v; kur(); temiz(); }; sw.appendChild(b); }); s.den.append(kut, sw); }

      const g = h("div", "cn-izg" + (o.takvim ? " cn-tak" : "")); g.style.gridTemplateColumns = `repeat(${o.sutunSay},1fr)`;

    function temiz() { hucre.forEach(c => c && c.classList.remove("on", "yeni")); s.dur.innerHTML = o.ilk || "Sayıyı seçip Boya düğmesine basın."; }

      }

      s.yaz(k + ":" + son, o.satir ? o.satir(k, say, enb, son) : [k, say, enb], o.iyi ? o.iyi(k, say, enb, son) : null);
      calis = false; bB.disabled = false;

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */
  function ASANSOR(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Açık asansörler", "Gidilen kat", "Gidilemeyen kat"] });
    const ac = o.asansor.map(() => false);
    const kut = h("div", "cn-satir"); const bt = o.asansor.map((a, i) => { const b = dug(a.ad, "ghost"); b.style.setProperty("--ac", a.renk); b.setAttribute("aria-pressed", "false"); b.onclick = () => { ac[i] = !ac[i]; b.setAttribute("aria-pressed", ac[i]); ciz(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    function ciz() {
      let sv = ""; const H = o.kat * 17 + 40; let git = 0, gitme = [];
      for (let f = o.kat; f >= 0; f--) {

        sv += `<rect x="60" y="${y}" width="150" height="15" rx="2" class="${f === 0 ? "cn-zem" : herhangi ? "cn-katon" : (ac.some(Boolean) ? "cn-katoff" : "cn-kat")}"/><text x="52" y="${y + 12}" text-anchor="end" class="cn-et">${f === 0 ? "Z" : f}</text>`;
        o.asansor.forEach((a, i) => { if (dur[i]) sv += `<circle cx="${230 + i * 22}" cy="${y + 7.5}" r="6" fill="${a.renk}"/>`; });
      }
      s.sah.innerHTML = `<svg viewBox="0 0 300 ${H}" style="max-height:440px" role="img" aria-label="${o.kat} katlı bina">${sv}</svg>`;
      const acik = o.asansor.filter((a, i) => ac[i]).map(a => a.ad);

      s.yaz(acik.join("+"), [acik.join(" + "), git, gitme.length], null);

    ciz();
  }

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */
  function SAAT(el, o) {

      let onc = null, snr = null;
      for (let m = bas; m <= bit + ara; m += ara) { if (m <= var_) onc = m; if (m >= var_ && snr == null) snr = m; if (m <= bit) sv += `<text x="${20 + (m - bas) * sk}" y="40" text-anchor="middle" class="cn-bus">🚌</text>`; }

      if (snr != null && snr <= bit + ara) { const sx = 20 + (Math.min(snr, bit) - bas) * sk; sv += `<path d="M${vx} 56 L${sx} 56" class="cn-bek"/>`; }

      const gec = var_ - bas;
      s.dur.innerHTML = `${o.kisi} durağa ${saDa(var_)} geliyor: ilk seferden <b>${gec} dakika</b> sonra. Seferler ${E(ara,"in")} katı olan dakikalarda: ${ara} ${x} ${Math.floor(gec / ara)} = ${Math.floor(gec / ara) * ara}` + (gec % ara ? `, ${ara} ${x} ${Math.floor(gec / ara) + 1} = ${(Math.floor(gec / ara) + 1) * ara}. Sonraki otobüs ${saDa(snr)}; bekleme <b>${snr - var_} dakika</b>.` : `. Tam sefer saatinde geldi; bekleme <b>0 dakika</b>.`);
      s.yaz(ara + ":" + var_, [ara + " dk", sa(var_), sa(onc), sa(snr), (snr - var_) + " dk"], null);
    }
    ciz();
  }

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Çarpanlar", "Çarpan sayısı"] });
    let N = o.N || o.hazir[0]; let bul = new Set(), denendi = new Set();
    const kut = h("div", "cn-satir");
    const sA = adimci("Sayı:", 2, o.max || 200, N, v => { N = v; yeni(); });
    kut.appendChild(sA.w);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => sA.ayarla(n); hz.appendChild(b); }); kut.appendChild(hz); }
    s.den.appendChild(kut);
    const bolen = h("div", "cn-satir cn-test"); bolen.innerHTML = `<label>Bölen deneyin: <input type="number" inputmode="numeric" min="1"></label>`;
    const bD = dug("Böl"), bS = dug("Sıradakini dene", "ghost"); bolen.append(bD, bS); s.den.appendChild(bolen);
    const bi = bolen.querySelector("input");
    let bK = null; if (o.katlar) { bK = dug(o.katDugme || "Katlarını say ▶", "ghost"); s.den.appendChild(bK); }
    const ciftler = h("div", "cn-cift"); const katlar = h("div", "cn-katlar");
    function yeni() { bul = new Set(); denendi = new Set(); ciz(); s.dur.innerHTML = `${N} sayısını 1, 2, 3, … sayılarına bölerek çarpan çiftlerini bulun.`; katlar.textContent = ""; }
    function ciz() {
      const L = [...bul].sort((a, b) => a - b);
      s.sah.innerHTML = ""; const kartlar = h("div", "cn-kartlar");
      L.forEach(v => kartlar.appendChild(h("span", "cn-kart" + (v * v === N ? " kare" : ""), v)));
      if (!L.length) kartlar.appendChild(h("span", "cn-bosk", "Henüz çarpan bulunmadı"));
      s.sah.append(kartlar, ciftler, katlar);
      ciftler.innerHTML = L.filter(v => v * v <= N).map(v => `<span>${v} ${x} ${N / v}${v * v === N ? " <i>(aynı sayı: bir kez yazılır)</i>" : ""}</span>`).join("");
    }
    const tamamMi = () => { for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) return false; return true; };
    const eksik = () => { const L = []; for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) L.push(i); return ` <br>Henüz denenmeyen küçük bölenler var: <b>${L.join(", ")}</b>. Bunları da deneyin.`; };
    function dene(d) {
      if (!d || d < 1) return; denendi.add(d);
      const b = Math.floor(N / d), r = N % d;
      if (d > N) { s.dur.innerHTML = `${d} > ${N}: ${E(N,"den")} büyük sayı ${E(N,"in")} çarpanı olamaz.`; return; }
      if (r === 0) { bul.add(d); bul.add(b); ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${N} : ${d} = ${b}, kalan 0 → <b>${d} ${x} ${b} = ${N}</b>. ${d} ve ${b} çarpandır.` + (d * d >= N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} ${d * d === N ? "=" : ">"} ${N}. Artık yeni çift çıkmaz; bütün çarpanlar bulundu.` : eksik() : ""); }
      else { s.dur.innerHTML = `<span class="kotu">✘</span> ${N} : ${d} işleminde bölüm ${b}, <b>kalan ${r}</b>. ${d}, ${E(N,"in")} çarpanı değildir.` + (d * d > N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} > ${N}. Daha büyük bölen denemeye gerek yok; çarpan listesi tamam.` : eksik() : ""); }
      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));
      if (tamam) s.yaz("n" + N, [N, [...bul].sort((a, b) => a - b).join(", "), bul.size], true);
    }
    bD.onclick = () => dene(Math.round(+bi.value));
    bS.onclick = () => { let d = 1; while (denendi.has(d)) d++; bi.value = d; dene(d); };
    if (bK) bK.onclick = async () => {
      bK.disabled = true; katlar.textContent = ""; const sat = h("div", "cn-katsat"); katlar.append(h("b", "", `${E(N,"in")} katları: `), sat);
      for (let i = 1; i <= (o.katSay || 12); i++) { sat.appendChild(h("span", "cn-kat2", `${N * i}`)); await bekle(220); }
      sat.appendChild(h("span", "cn-sonsuz", "… ve sonsuza kadar sürer"));
      bK.disabled = false;
    };
    yeni();
  }

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */
  function KUMBARA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Para", "Sonuç"] });
    const k = o.k; let hafta = 0, tmr = null;
    const kut = h("div", "cn-satir"); const bA = dug("Bir hafta geçsin +"), bO = dug("▶ Haftaları oynat", "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bO, bS); s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Kumbarada şu para olabilir mi? <input type="number" inputmode="numeric" min="1" max="500"> TL</label>`;
    const bT = dug("Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test); const ti = test.querySelector("input");
    function ciz() {
      const top = hafta * k, sv = [];
      const yuk = Math.min(150, top * 1.4);
      sv.push(`<rect x="110" y="20" width="120" height="160" rx="22" class="cn-kum"/><rect x="150" y="14" width="40" height="8" rx="3" class="cn-kum2"/>`);
      sv.push(`<rect x="116" y="${176 - yuk}" width="108" height="${yuk}" rx="10" class="cn-para"/>`);
      sv.push(`<text x="170" y="110" text-anchor="middle" class="cn-buyuk">${top} TL</text><text x="170" y="134" text-anchor="middle" class="cn-et">${hafta}. hafta</text>`);
      let cizgi = ""; for (let i = 1; i <= hafta && i <= 16; i++) cizgi += `<text x="${260 + ((i - 1) % 4) * 52}" y="${40 + Math.floor((i - 1) / 4) * 34}" class="cn-et2">${k}${x}${i}=${k * i}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 480 190" role="img" aria-label="Kumbara">${sv.join("")}${cizgi}</svg>`;
      s.dur.innerHTML = hafta ? `${hafta}. hafta sonunda kumbarada ${k} ${x} ${hafta} = <b>${top} TL</b> var.` : `Kumbara boş. Her hafta ${k} TL atılıyor.`;
    }
    bA.onclick = () => { hafta++; ciz(); };
    bO.onclick = () => { if (tmr) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } bO.textContent = "❚❚ Durdur"; tmr = setInterval(() => { if (hafta >= 15) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } hafta++; ciz(); }, az ? 50 : 500); };
    bS.onclick = () => { hafta = 0; ciz(); };
    bT.onclick = () => {
      const v = Math.round(+ti.value); if (!v) return; const b = Math.floor(v / k), r = v % k;
      s.dur.innerHTML = r ? `<span class="kotu">✘</span> ${k} ${x} ${b} = ${k * b} TL, ${k} ${x} ${b + 1} = ${k * (b + 1)} TL. ${v} TL arada kalır (${v} : ${k} → kalan ${r}). Kumbarada hiçbir hafta ${v} TL olmaz.`
        : `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · ${b}. hafta sonunda kumbarada tam ${v} TL olur.`;
      if (!r) { hafta = b; ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · <b>${b}. hafta</b> sonunda kumbarada tam ${v} TL olur.`; }
      s.yaz("t" + v, [v + " TL", r ? `kalan ${r} ✘` : `${k} ${x} ${b} ✔`], !r);
    };
    ciz();
  }

  /* 9) ÖNERME LABORATUVARI: önermeyi farklı sayılarla sınama */
  function ONERME(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Önerme", "Sayı", "Sonuç"] });
    let akt = 0; const kut = h("div", "cn-hazir");
    const bt = o.onermeler.map((on, i) => { const b = dug(on.ad, "ghost"); b.setAttribute("aria-pressed", i === 0); b.onclick = () => { akt = i; bt.forEach((x, j) => x.setAttribute("aria-pressed", j === i)); goster(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Sınanacak sayı: <input type="number" inputmode="numeric" min="1" max="200" value="12"></label>`;
    const bT = dug("Sına"), bR = dug("Rastgele sayı", "ghost"); test.append(bT, bR); s.den.appendChild(test); const ti = test.querySelector("input");
    function goster() { s.sah.innerHTML = `<div class="cn-onr"><b>${o.onermeler[akt].ad}:</b> “${o.onermeler[akt].metin}”</div>`; s.dur.innerHTML = "Bir sayı yazıp Sına düğmesine basın. Önerme her sayıda doğru mu?"; }
    function sina(n) {
      const on = o.onermeler[akt], r = on.sina(n);
      s.sah.innerHTML = `<div class="cn-onr"><b>${on.ad}:</b> “${on.metin}”</div><div class="cn-kanit">${r.goster}</div>`;
      s.dur.innerHTML = (r.ok ? `<span class="iyi">✔</span> ${n} için önerme doğru.` : `<span class="kotu">✘</span> ${n} için önerme yanlış! Bir karşı örnek bulundu.`) + (r.not ? " " + r.not : "");
      s.yaz(akt + ":" + n, [on.ad, n, r.ok ? "doğru" : "yanlış (karşı örnek)"], r.ok);
    }
    bT.onclick = () => { const n = Math.round(+ti.value); if (n > 0) sina(n); };
    bR.onclick = () => { const n = 2 + Math.floor(Math.random() * 59); ti.value = n; sina(n); };
    goster();
  }


  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →
     koşullar tek tek denetlenir (✔/✘) → deney defterine yazılır. Doğru cevap verilmez; öğrenci uygun girdiyi kendisi arar.
     o.girdi: [{ad, min, max, bas} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → SVG/HTML · o.kosullar: [{ad, f(v) → bool | {ok, not}}]
     o.dugme: düğme yazısı (false → her değişiklikte denetlenir) · o.sonuc(v, hepsi, L) · o.satir(v, hepsi, L) · o.iyi(v, L) · o.ek: [{ad, deger(v) → v}] */
  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);
      s.dur.innerHTML = m;
      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);
    }
    kur = true; ciz();
    if (bS) s.dur.innerHTML = o.ilk || "Değerleri seçip Sına düğmesine basın."; else sina();
  }

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

/* MAT.7.2.2 · Denklem ve Eşitsizlikler — bağlam sorularının "Canlandır" düzenekleri (14.10.2026) — ortak motor: canlandir.js (CN.KOSUL); yeni motor yok.
   Her düzenek: öğrenci bilinmeyene − / + sayaçlarıyla ya da seçim düğmeleriyle değer verir → sahne ve iki taraf anında hesaplanır → koşullar denetlenir →
   deneme deney defterine yazılır → yeniden dener. Doğru cevap bir düğmeyle verilmez; denemelerden çıkar (§4.k, §19-10).
   "<" ve ">" HTML'de &lt; &gt;; kesirler metinde a/b yazılır, kesir_cizgi.js üst üste çizer. */
window.CANL = (() => {
  if (!document.getElementById("c722-stil")) { const st = document.createElement("style"); st.id = "c722-stil";
    st.textContent = ".cn-btn{min-width:44px;min-height:44px}.cn-adimci button{min-width:44px;min-height:44px}.c722-k{text-align:center;font-size:17px;font-weight:800;margin:8px auto;max-width:640px;line-height:1.6}.c722-t{margin:6px auto;border-collapse:collapse;font-size:15px}.c722-t td,.c722-t th{border:1px solid #ced4da;padding:4px 10px;text-align:center}.c722-t th{background:#eef7f2}"; document.head.appendChild(st); }
  const LT = "&lt;", GT = "&gt;", M = "−";
  const D = v => (v < 0 ? M : "") + String(Math.round(Math.abs(v) * 1000) / 1000).replace(".", ",");
  const B = n => { const s = n < 0 ? M : ""; const [t, o] = String(Math.round(Math.abs(n) * 1000) / 1000).split("."); return s + t.replace(/\B(?=(\d{3})+(?!\d))/g, " ") + (o ? "," + o : ""); };
  const N = s => +String(s).replace(/[\s ]/g, "").replace(",", ".").replace(M, "-");
  const svg = (w, h, ic, ad) => `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;height:auto;display:block;margin:0 auto" role="img" aria-label="${ad}">${ic}</svg>`;
  const tx = (x, y, s, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.an || "middle"}" style="font-size:${o.fs || 14}px;font-weight:800;fill:${o.r || "#1d2433"}">${s}</text>`;
  const kutu = h => `<div class="c722-k">${h}</div>`;
  const tablo = (bas, sat) => `<table class="c722-t"><tr>${bas.map(b => `<th>${b}</th>`).join("")}</tr>${sat.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;
  const sym = (a, b) => a < b ? LT : a > b ? GT : "=";
  /* iki çubuk: iki tarafın değerini yan yana gösterir */
  function cubuklar(L, olc) { const W = 400, mx = olc || Math.max(...L.map(x => Math.abs(x[1])), 1), u = (W - 190) / mx; let s = "";
    L.forEach(([ad, v, r], i) => { const y = 14 + i * 44; s += tx(8, y + 22, ad, { an: "start", fs: 13 }) + `<rect x="130" y="${y}" width="${Math.max(2, Math.abs(v) * u)}" height="30" rx="5" fill="${r}" stroke="#495057" stroke-opacity=".5"/>` + tx(138 + Math.abs(v) * u, y + 21, B(v), { an: "start", fs: 13 }); });
    return svg(W, 22 + L.length * 44, s, "Karşılaştırma çubukları"); }
  /* terazi: sol ve sağ değerlere göre eğilir */
  function terazi(solEt, sagEt, sol, sag) { const W = 360, cx = 180, e = Math.sign(sag - sol), d = 14 * e, yl = 40 - d, yr = 40 + d;

    [[cx - 110, yl, solEt], [cx + 110, yr, sagEt]].forEach(([x, y, et]) => { s += `<line x1="${x}" y1="${y}" x2="${x - 50}" y2="${y + 70}" stroke="#8a93a6"/><line x1="${x}" y1="${y}" x2="${x + 50}" y2="${y + 70}" stroke="#8a93a6"/><path d="M${x - 60} ${y + 70} Q${x} ${y + 88} ${x + 60} ${y + 70}" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>` + `<rect x="${x - 52}" y="${y + 38}" width="104" height="28" rx="6" fill="#fff3bf" stroke="#495057"/>` + tx(x, y + 57, et, { fs: 14 }); });
    return svg(W, 170, s, "Terazi"); }
  const KO = (el, o) => CN.KOSUL(el, Object.assign({ dugme: false }, o));

eight=\"96\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H160 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"88.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Mavi kalem</text><text x=\"88.0\" y=\"74.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Tanesi 12 TL</text><rect x=\"182\" y=\"8\" width=\"160\" height=\"96\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M182 36 V16 q0 -8 8 -8 H334 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"262.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Yeşil kalem</text><text x=\"262.0\" y=\"74.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Tanesi 20 TL</text><rect x=\"356\" y=\"8\" width=\"160\" height=\"96\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M356 36 V16 q0 -8 8 -8 H508 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"436.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Ödeme</text><text x=\"436.0\" y=\"63.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">24 kalem</text><text x=\"436.0\" y=\"86.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">352 TL</text></svg>", "son": "<b>Ece:</b> “Kalemlerin hepsi mavi olsaydı 288 TL ödenirdi. Her mavi kalemi yeşille değiştirmek tutarı aynı miktarda artırır.”", "k": "Ece'nin stratejisine göre, öğretmen kaç yeşil kalem almıştır?", "sec": ["8", "16", "64", "11"], "secg": null, "c": "A", "a": ["Hepsi mavi olsaydı 24 · 12 = 288 TL ödenirdi; fark 352 − 288 = 64 TL'dir.", "Bir maviyi yeşille değiştirmek tutarı 20 − 12 = 8 TL artırır: 64 : 8 = 8 yeşil kalem.", "Denklemle: 12(24 − y) + 20y = 352 → 288 + 8y = 352 → y = 8."], "t": "16: mavi kalem sayısı; 64: tutar farkı; 11: 352, 32'ye bölünmüş", "d": "Varsayımda önce hepsini ucuz kalem kabul ediniz. Farkı, bir kalemi değiştirmenin getirdiği artışa bölünüz.", "ses": "b09"}, {"no": 10, "on": "<p>Üç kardeşin yaşları toplamı 37'dir. Kardeşlerin yaşları arasındaki ilişkiler aşağıdaki kartlarda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 578 112\" width=\"578\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"176\" height=\"96\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H176 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"96.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Büyük kardeş</text><text x=\"96.0\" y=\"74.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">b yaşında</text><rect x=\"198\" y=\"8\" width=\"176\" height=\"96\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M198 36 V16 q0 -8 8 -8 H366 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"286.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Ortanca kardeş</text><text x=\"286.0\" y=\"74.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Büyükten 4 yaş küçük</text><rect x=\"388\" y=\"8\" width=\"176\" height=\"96\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M388 36 V16 q0 -8 8 -8 H556 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"476.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Küçük kardeş</text><text x=\"476.0\" y=\"74.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Ortancadan 3 yaş küçük</text></svg>", "son": "", "k": "Buna göre, küçük kardeş kaç yaşındadır?", "sec": ["16", "9", "12", "10"], "secg": null, "c": "B", "a": ["Ortanca b − 4, küçük (b − 4) − 3 = b − 7 yaşındadır.", "b + (b − 4) + (b − 7) = 37 → 3b − 11 = 37 → b = 16.", "Bulunan b büyük kardeşin yaşıdır; istenen küçük kardeş: 16 − 7 = 9."], "t": "16: bulunan bilinmeyen istenen sonuç sanılmış; 12: ortanca kardeşin yaşı; 10: küçük kardeş büyükten 6 yaş küçük alınmış", "d": "Denklemi çözünce bulduğunuz b büyük kardeşin yaşıdır. Soru küçük kardeşi sorduğu için son bir adım daha gerekir.", "ses": "b10"}, {"no": 11, "on": "<p>Bir yüzme kursunun afişinde “9 yaşından küçük olmayan ve 14 yaşından büyük olmayan çocuklar kayıt olabilir.” yazmaktadır.</p>", "g": "<svg viewBox=\"0 0 272 112\" width=\"272\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"250\" height=\"96\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H250 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"133.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Yüzme kursu</text><text x=\"133.0\" y=\"57.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Kayıt koşulu:</text><text x=\"133.0\" y=\"74.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">9 yaşından küçük olmayan,</text><text x=\"133.0\" y=\"91.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">14 yaşından büyük olmayan</text></svg>", "son": "", "k": "Kayıt olabilecek bir çocuğun yaşı y olduğuna göre, bu koşul aşağıdakilerden hangisiyle gösterilir?", "sec": ["9 &lt; y &lt; 14", "9 ≤ y &lt; 14", "9 &lt; y ≤ 14", "9 ≤ y ≤ 14"], "secg": null, "c": "D", "a": ["“9 yaşından küçük olmayan” 9 ve daha büyük demektir: y ≥ 9.", "“14 yaşından büyük olmayan” 14 ve daha küçük demektir: y ≤ 14.", "İki koşul birlikte: 9 ≤ y ≤ 14."], "t": "9 &lt; y &lt; 14: iki sınır da dışarıda bırakılmış; 9 ≤ y &lt; 14: 14 yaş dışarıda bırakılmış; 9 &lt; y ≤ 14: 9 yaş dışarıda bırakılmış", "d": "“Küçük olmayan” ve “büyük olmayan” ifadeleri sınır değerleri de kapsar. İki sınıra da ≤ gelir.", "ses": "b11"}, {"no": 12, "on": "<p>Bir telefon hattının tarifesi aşağıda verilmiştir. Mert, aylık faturasının 360 TL'yi geçmemesini istemektedir.</p>", "g": "<svg viewBox=\"0 0 428 112\" width=\"428\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"196\" height=\"96\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H196 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"106.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Aylık sabit ücret</text><text x=\"106.0\" y=\"74.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">180 TL</text><rect x=\"218\" y=\"8\" width=\"196\" height=\"96\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M218 36 V16 q0 -8 8 -8 H406 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"316.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Her GB internet</text><text x=\"316.0\" y=\"74.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">12 TL</text></svg>", "son": "", "k": "Buna göre, Mert bir ayda en fazla kaç GB internet kullanabilir?", "sec": ["30", "16", "15", "14"], "secg": null, "c": "C", "a": ["g GB kullanılırsa fatura 180 + 12g TL olur: 180 + 12g ≤ 360.", "12g ≤ 180 → g ≤ 15.", "Kontrol: 15 GB için fatura 360 TL'dir (360 ≤ 360); 16 GB için 372 TL'dir."], "t": "30: sabit ücret unutulmuş, 360 : 12; 16: sınırın bir fazlası alınmış; 14: sınır değerin koşulu sağlamadığı sanılmış", "d": "Sabit ücreti unutmayınız: önce 180 TL'yi çıkarınız, kalan parayı GB ücretine bölünüz.", "ses": "b12"}, {"no": 13, "on": "<p>Matematik kulübündeki bir oyunda dört denklem kartı vardır. Oyuncular, değişkenin her değeri için doğru olan kartları toplayacaktır.</p>", "g": "<svg viewBox=\"0 0 768 86\" width=\"768\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"176\" height=\"70\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H176 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"96.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">K1</text><text x=\"96.0\" y=\"61.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">3(x − 2) = 3x − 6</text><rect x=\"198\" y=\"8\" width=\"176\" height=\"70\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M198 36 V16 q0 -8 8 -8 H366 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"286.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">K2</text><text x=\"286.0\" y=\"61.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">2x + 7 = 2(x + 3)</text><rect x=\"388\" y=\"8\" width=\"176\" height=\"70\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M388 36 V16 q0 -8 8 -8 H556 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"476.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">K3</text><text x=\"476.0\" y=\"61.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">5x − 1 = 4x + 2</text><rect x=\"578\" y=\"8\" width=\"176\" height=\"70\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M578 36 V16 q0 -8 8 -8 H746 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"666.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">K4</text><text x=\"666.0\" y=\"61.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">4(x + 1) − x = 3x + 4</text></svg>", "son": "", "k": "Buna göre, oyuncuların toplaması gereken kartlar hangileridir?", "sec": ["K1 ve K4", "K1 ve K2", "K3 ve K4", "K1, K2 ve K4"], "secg": null, "c": "A", "a": ["K1: 3x − 6 = 3x − 6 → 0 = 0; her değer doğrudur.", "K2: 2x + 7 = 2x + 6 → 7 = 6 yanlış; hiçbir değer. K3: x = 3; yalnız bir değer.", "K4: 4x + 4 − x = 3x + 4 → 3x + 4 = 3x + 4; her değer doğrudur."], "t": "K2'yi içeren seçenekler: sadeleşen son satırdaki 7 = 6 yanlışlığı gözden kaçmış; K3'ü içeren seçenek: yalnız bir değerin sağladığı denklem her değer için doğru sanılmış", "d": "Her kartı sadeleştirip son satıra bakınız: 0 = 0 gibi doğru bir eşitlik her değer için doğrudur.", "ses": "b13"}, {"no": 14, "on": "<p>Zeynep harçlığının 1/4'ü ile bir kitap, 1/3'ü ile defter almıştır. Zeynep'in 75 TL'si kalmıştır.</p>", "g": "<svg viewBox=\"0 0 426 96\" width=\"426\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"10\" width=\"102\" height=\"40\" fill=\"#d0e3fb\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"59.0\" y=\"35.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Kitap</text><rect x=\"110\" y=\"10\" width=\"136\" height=\"40\" fill=\"#fff3bf\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"178.0\" y=\"35.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Defter</text><rect x=\"246\" y=\"10\" width=\"170\" height=\"40\" fill=\"#e9ecef\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"331.0\" y=\"35.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Kalan: 75 TL</text><path d=\"M8 58 v8 H416 v-8\" fill=\"none\" stroke=\"#111111\" stroke-width=\"1.3\"/><text x=\"212.0\" y=\"86.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Harçlığın tamamı: ?</text></svg>", "son": "", "k": "Buna göre, Zeynep'in harçlığı kaç TL'dir?", "sec": ["105", "180", "225", "300"], "secg": null, "c": "B", "a": ["Harçlık x olsun: x − <span class=\"frac\"><span>x</span><span>4</span></span> − <span class=\"frac\"><span>x</span><span>3</span></span> = 75.", "İki taraf 12 ile çarpılır: 12x − 3x − 4x = 900 → 5x = 900.", "x = 180. Kontrol: 45 + 60 + 75 = 180."], "t": "105: 1/4 ile 1/3 toplanırken paylar ve paydalar toplanmış, kalan 5/7 alınmış; 225: kalan para harçlığın 1/3'ü sanılmış; 300: kalan para harçlığın 1/4'ü sanılmış", "d": "Kesirli terimlerden kurtulmak için iki tarafı paydaların ortak katıyla çarpınız; kesirli olmayan 75'i de çarpınız.", "ses": "b14"}, {"no": 15, "on": "<p>Matematik panosuna üç öğrenci, doğru bir eşitsizlik üzerinde yapılan işlemlerle ilgili birer genelleme asmıştır.</p>", "g": "<svg viewBox=\"0 0 566 112\" width=\"566\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"172\" height=\"96\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H172 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"94.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Ece</text><text x=\"94.0\" y=\"63.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">İki tarafa aynı</text><text x=\"94.0\" y=\"86.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">sayıyı eklemek</text><rect x=\"194\" y=\"8\" width=\"172\" height=\"96\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M194 36 V16 q0 -8 8 -8 H358 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"280.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Can</text><text x=\"280.0\" y=\"63.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">İki tarafı aynı</text><text x=\"280.0\" y=\"86.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">sayıyla çarpmak</text><rect x=\"380\" y=\"8\" width=\"172\" height=\"96\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M380 36 V16 q0 -8 8 -8 H544 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"466.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Ada</text><text x=\"466.0\" y=\"63.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">İki taraftan aynı</text><text x=\"466.0\" y=\"86.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">sayıyı çıkarmak</text></svg>", "son": "<b>Ece:</b> “İki tarafa aynı sayıyı eklersek eşitsizliğin yönü değişmez.”<br><b>Can:</b> “İki tarafı aynı sayıyla çarparsak eşitsizliğin yönü değişmez.”<br><b>Ada:</b> “İki taraftan aynı negatif sayıyı çıkarırsak eşitsizliğin yönü değişir.”", "k": "Buna göre, hangi öğrencinin genellemesi her zaman doğrudur?", "sec": ["Can", "Ece ve Ada", "Ece ve Can", "Ece"], "secg": null, "c": "D", "a": ["Ece: −2 &lt; 3 iken iki tarafa 5 eklenirse 3 &lt; 8; toplama ve çıkarma yönü değiştirmez. Genelleme doğrudur.", "Can: −2 &lt; 3 iken iki taraf −3 ile çarpılırsa 6 ve −9 bulunur; 6 &gt; −9 olduğundan yön değişir. Genelleme yanlıştır (karşı örnek).", "Ada: −2 &lt; 3 iken iki taraftan −4 çıkarılırsa 2 &lt; 7; yön değişmez. Genelleme yanlıştır."], "t": "Can'ı içeren seçenekler: yalnız pozitif sayılarla denenmiş; Ada'yı içeren seçenek: negatif sayı çıkarmak, negatif sayıyla çarpmakla karıştırılmış", "d": "Bir genellemeyi negatif sayılarla da deneyiniz. Tek bir karşı örnek genellemenin yanlış olduğunu gösterir.", "ses": "b15"}, {"no": 16, "on": "<p>Bir belediye, enerji tasarrufu için bir parktaki lambaların en az %45'inin güneş enerjili olmasını hedeflemektedir. Parktaki lamba bilgileri aşağıda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 584 112\" width=\"584\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"178\" height=\"96\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H178 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"97.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Parktaki lambalar</text><text x=\"97.0\" y=\"74.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Toplam 160 lamba</text><rect x=\"200\" y=\"8\" width=\"178\" height=\"96\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M200 36 V16 q0 -8 8 -8 H370 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"289.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Güneş enerjili</text><text x=\"289.0\" y=\"74.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Şu an 18 lamba</text><rect x=\"392\" y=\"8\" width=\"178\" height=\"96\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M392 36 V16 q0 -8 8 -8 H562 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"481.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Her ay</text><text x=\"481.0\" y=\"63.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">9 lamba güneş</text><text x=\"481.0\" y=\"86.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">enerjiliyle değişir</text></svg>", "son": "<p>Toplam lamba sayısı değişmeyecektir.</p>", "k": "Buna göre, belediye hedefine en az kaç ay sonra ulaşır?", "sec": ["5", "8", "6", "10"], "secg": null, "c": "C", "a": ["Hedef: 160 lambanın %45'i = 72 lamba.", "a ay sonra güneş enerjili lamba sayısı 18 + 9a olur: 18 + 9a ≥ 72 → 9a ≥ 54 → a ≥ 6.", "Kontrol: 6 ay sonra 72 lamba (hedef tutar), 5 ay sonra 63 lamba (tutmaz)."], "t": "5: sınır değer koşulu sağlamıyor sanılmış ya da 45, 9'a bölünmüş; 8: şu anki 18 lamba unutulmuş, 72 : 9; 10: hedef 90 lamba sanılmış", "d": "Önce hedefi bulunuz (160 lambanın %45'i). Şu an var olan güneş enerjili lambaları da hesaba katınız.", "ses": "b16"}, {"no": 17, "on": "<p>Bugün dede 67, torunu 11 yaşındadır. Ali ve Ece, kaç yıl sonra dedenin yaşının torununun yaşının 3 katı olacağını bulmak istemektedir. Ali bir denklem kurmuş, Ece ise aşağıdaki tabloyla denemeler yapmıştır.</p>", "g": "<svg viewBox=\"0 0 528 136\" width=\"528\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"4\" y=\"4\" width=\"150\" height=\"32\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.2\"/><text x=\"79.0\" y=\"25.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Yıl sonra (t)</text><rect x=\"154\" y=\"4\" width=\"150\" height=\"32\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.2\"/><text x=\"229.0\" y=\"25.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Dedenin yaşı</text><rect x=\"304\" y=\"4\" width=\"220\" height=\"32\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.2\"/><text x=\"414.0\" y=\"25.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Torunun yaşının 3 katı</text><rect x=\"4\" y=\"36\" width=\"150\" height=\"32\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"79.0\" y=\"56.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">10</text><rect x=\"154\" y=\"36\" width=\"150\" height=\"32\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"229.0\" y=\"56.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">77</text><rect x=\"304\" y=\"36\" width=\"220\" height=\"32\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"414.0\" y=\"56.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">63</text><rect x=\"4\" y=\"68\" width=\"150\" height=\"32\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"79.0\" y=\"88.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">15</text><rect x=\"154\" y=\"68\" width=\"150\" height=\"32\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"229.0\" y=\"88.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">82</text><rect x=\"304\" y=\"68\" width=\"220\" height=\"32\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"414.0\" y=\"88.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">78</text><rect x=\"4\" y=\"100\" width=\"150\" height=\"32\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><rect x=\"66.0\" y=\"104\" width=\"26\" height=\"24\" rx=\"4\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"1.3\"/><text x=\"79.0\" y=\"121.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">?</text><rect x=\"154\" y=\"100\" width=\"150\" height=\"32\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><rect x=\"216.0\" y=\"104\" width=\"26\" height=\"24\" rx=\"4\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"1.3\"/><text x=\"229.0\" y=\"121.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">?</text><rect x=\"304\" y=\"100\" width=\"220\" height=\"32\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><rect x=\"401.0\" y=\"104\" width=\"26\" height=\"24\" rx=\"4\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"1.3\"/><text x=\"414.0\" y=\"121.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">?</text></svg>", "son": "", "k": "Buna göre, aradıkları yıl sayısı kaçtır?", "sec": ["16", "20", "28", "17"], "secg": null, "c": "D", "a": ["Ali'nin denklemi: 67 + t = 3(11 + t) → 67 + t = 33 + 3t → 34 = 2t → t = 17.", "Ece'nin tablosu: t her 5 arttığında fark 14'ten 4'e iner (her yıl 2 azalır); farkın 0 olması için 15'ten 2 yıl daha gerekir: t = 17.", "Kontrol: 17 yıl sonra dede 84, torun 28 yaşında; 84 = 3 · 28."], "t": "16: farkın her yıl 4 azaldığı sanılmış; 20: tablo 5'er yıl ilerletilip ilk geçilen değer alınmış; 28: torunun o zamanki yaşı", "d": "Yaş problemlerinde iki kişinin yaşına da aynı yıl eklenir. Dedenin yaşı 3(11 + t) ile karşılaştırılır.", "ses": "b17"}, {"no": 18, "on": "<p>Bir öğrenci 4x + 7 = 2x + 20 denklemini bir uygulamada tam sayılar deneyerek çözmeye çalışmıştır. Uygulamanın gösterdiği sonuçlar aşağıdaki tabloda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 478 104\" width=\"478\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"4\" y=\"4\" width=\"80\" height=\"32\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.2\"/><text x=\"44.0\" y=\"25.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">x</text><rect x=\"84\" y=\"4\" width=\"190\" height=\"32\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.2\"/><text x=\"179.0\" y=\"25.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Sol taraf: 4x + 7</text><rect x=\"274\" y=\"4\" width=\"200\" height=\"32\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.2\"/><text x=\"374.0\" y=\"25.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Sağ taraf: 2x + 20</text><rect x=\"4\" y=\"36\" width=\"80\" height=\"32\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"44.0\" y=\"56.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">6</text><rect x=\"84\" y=\"36\" width=\"190\" height=\"32\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"179.0\" y=\"56.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">31</text><rect x=\"274\" y=\"36\" width=\"200\" height=\"32\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"374.0\" y=\"56.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">32</text><rect x=\"4\" y=\"68\" width=\"80\" height=\"32\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"44.0\" y=\"88.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">7</text><rect x=\"84\" y=\"68\" width=\"190\" height=\"32\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"179.0\" y=\"88.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">35</text><rect x=\"274\" y=\"68\" width=\"200\" height=\"32\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"374.0\" y=\"88.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">34</text></svg>", "son": "<p>Öğrenci hiçbir tam sayıda iki tarafı eşit bulamayınca stratejisini değiştirmiştir.</p>", "k": "Buna göre, denklemi sağlayan değer kaçtır?", "sec": ["6,5", "6", "7", "13"], "secg": null, "c": "A", "a": ["x = 6'da sol taraf küçük, x = 7'de büyük çıkmıştır; çözüm 6 ile 7 arasındadır, tam sayı değildir.", "Eşitliğin korunumu: 4x − 2x = 20 − 7 → 2x = 13 → x = 6,5.", "Kontrol: 4 · 6,5 + 7 = 33 ve 2 · 6,5 + 20 = 33."], "t": "6 ve 7: yalnız tam sayı denemeleri sonuç sanılmış; 13: 2x bulunup ikiye bölünmemiş", "d": "Tam sayılarda eşi /* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
