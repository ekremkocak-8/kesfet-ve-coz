<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* ANA_KURALLAR §4.y-3: Etkinliklerde bütün kesirler kesir çizgisiyle (alt alta pay/payda) gösterilir. Düz yazılmış a/b biçimleri otomatik dönüştürülür. */
(function(){
  if (window.__kesirCizgi) return; window.__kesirCizgi = 1;
  const RX = /(^|[^\w\/.,:%])([−-])?(?:(\d+) )?(\d{1,4})\/(\d{1,4})(?![\w\/.,]\d|\w)/g;
  const ATLA = "script,style,svg,textarea,input,select,code,.ilr,.frac,[data-duz]";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function donustur(kok){
    if (!kok || !kok.nodeType) return;
    if (kok.nodeType === 3) kok = kok.parentElement;
    if (!kok || (kok.closest && kok.closest(ATLA))) return;
    const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      if (!/\d\/\d/.test(t.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = t.parentElement; if (!p || p.closest(ATLA)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const L = []; let t; while ((t = w.nextNode())) L.push(t);
    L.forEach(t => {
      let deg = false;
      const h = esc(t.nodeValue).replace(RX, (m, a, s, tam, p, q) => { deg = true;
        return a + (s ? "−" : "") + (tam ? tam + " " : "") + '<span class="frac"><span>' + p + "</span><span>" + q + "</span></span>"; });
      if (!deg) return;
      const k = document.createElement("span"); k.innerHTML = h; t.replaceWith(...k.childNodes);
    });
  }
  let bekleyen = new Set(), plan = 0;
  const calis = () => { plan = 0; const b = bekleyen; bekleyen = new Set(); b.forEach(donustur); };
  const gozcu = new MutationObserver(ms => { ms.forEach(m => {
      if (m.type === "characterData") bekleyen.add(m.target); else m.addedNodes.forEach(n => bekleyen.add(n)); });
    if (!plan) plan = requestAnimationFrame(calis); });
  const bas = () => { donustur(document.body); gozcu.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bas); else bas();
  const st = document.createElement("style");
  st.textContent = ".frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}.frac>span{display:block;text-align:center;padding:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor}";
  document.head.appendChild(st);
})();

/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {

    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });

    async function dagit(k) {

      const kolon = Math.min(k, 6), satirK = Math.ceil(k / kolon), gw = kolon * 14 + 16, gh = satirK * 14 + 26;

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */
  function ATLA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Sonuç"] });
    let k = o.k, L = o.son; const W = 660, sol = 22, sag = 22, sk = (W - sol - sag) / L;

    const bA = dug("▶ Oynat"), bB = dug("+1 " + (o.adimAd || "adım"), "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bB, bS);
    let kA = null;
    if (o.kSec) { kA = adimci(o.kEtiket || "Adım:", 2, Math.floor(L / 2), k, v => { k = v; sifirla(); }); kut.prepend(kA.w); }

    const bT = dug(o.testDugme || "Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test);
    const ti = test.querySelector("input");
    function taban() {
      let sv = `<line x1="${sol}" y1="62" x2="${sol + L * sk}" y2="62" class="cn-ek"/>`;

      for (let v = 0; v <= L; v += adimT) sv += `<line x1="${sol + v * sk}" y1="${v % et ? 58 : 54}" x2="${sol + v * sk}" y2="66" class="cn-ek"/>` + (v % et ? "" : `<text x="${sol + v * sk}" y="82" text-anchor="middle" class="cn-et">${o.etYaz ? o.etYaz(v) : v}</text>`);
      sv += `<line x1="${sol + L * sk}" y1="30" x2="${sol + L * sk}" y2="70" class="cn-sinir"/><text x="${sol + L * sk}" y="24" text-anchor="end" class="cn-et">${o.sonEt || L}</text>`;

    }

      izle.forEach((v, i) => {

        sv += `<path d="M${x1} 62 Q${(x1 + x2) / 2} ${yy} ${x2} 62" class="cn-yay"/><circle cx="${x2}" cy="62" r="4.5" class="${o.renk ? o.renk(v, i + 1) : "cn-o"}"/>`;
        if (izle.length <= 14 || i === izle.length - 1 || i % Math.ceil(izle.length / 10) === 0) sv += `<text x="${x2}" y="${98}" text-anchor="middle" class="cn-et2">${v}</text>`;
      });

      const son = izle.length ? izle[izle.length - 1] : 0, ix = sol + son * sk;
      sv += `<text x="${ix}" y="50" text-anchor="middle" class="cn-kis">${o.simge || "●"}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W} 104" role="img" aria-label="${k} birimlik adımlarla ilerleme">${sv}</svg>`;
    }
    const ileri = () => {
      const v = (n + 1) * k;
      if (v > L) { durdur(); s.dur.innerHTML = `<span class="kotu">■</span> Sonraki ${o.adimAd || "adım"} ${k} ${x} ${n + 1} = <b>${v}</b> olurdu; bu ${E(L,"den")} büyük. ${o.bitti ? o.bitti(n, k, L) : `Toplam ${n} ${o.adimAd || "adım"}; son değer ${n * k}.`}`; if (!izle.length) ciz(); return false; }
      n++; izle.push(v); ciz(); s.dur.innerHTML = o.durum ? o.durum(n, v, k) : `${n}. ${o.adimAd || "adım"}: ${k} ${x} ${n} = <b>${v}</b>`; return true;

      s.dur.innerHTML = m; s.yaz("t" + v, [v, r === 0 ? (ic ? `${k} ${x} ${b} ✔` : `${k} ${x} ${b} (sınır dışı)`) : `kalan ${r} ✘`], r === 0 && ic);

  }

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || [o.kAd || "k", "Boyanan", "En büyük"] });
    let k = o.k || 2, son = o.son;
    const kut = h("div", "cn-satir");

    if (o.sonSec) { const sw = h("div", "cn-hazir"); o.sonSec.forEach(v => { const b = dug(v + " gün", "ghost"); b.onclick = () => { son = v; kur(); temiz(); }; sw.appendChild(b); }); s.den.append(kut, sw); }

      const g = h("div", "cn-izg" + (o.takvim ? " cn-tak" : "")); g.style.gridTemplateColumns = `repeat(${o.sutunSay},1fr)`;

    function temiz() { hucre.forEach(c => c && c.classList.remove("on", "yeni")); s.dur.innerHTML = o.ilk || "Sayıyı seçip Boya düğmesine basın."; }

      }

      s.yaz(k + ":" + son, o.satir ? o.satir(k, say, enb, son) : [k, say, enb], o.iyi ? o.iyi(k, say, enb, son) : null);
      calis = false; bB.disabled = false;

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */
  function ASANSOR(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Açık asansörler", "Gidilen kat", "Gidilemeyen kat"] });
    const ac = o.asansor.map(() => false);
    const kut = h("div", "cn-satir"); const bt = o.asansor.map((a, i) => { const b = dug(a.ad, "ghost"); b.style.setProperty("--ac", a.renk); b.setAttribute("aria-pressed", "false"); b.onclick = () => { ac[i] = !ac[i]; b.setAttribute("aria-pressed", ac[i]); ciz(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    function ciz() {
      let sv = ""; const H = o.kat * 17 + 40; let git = 0, gitme = [];
      for (let f = o.kat; f >= 0; f--) {

        sv += `<rect x="60" y="${y}" width="150" height="15" rx="2" class="${f === 0 ? "cn-zem" : herhangi ? "cn-katon" : (ac.some(Boolean) ? "cn-katoff" : "cn-kat")}"/><text x="52" y="${y + 12}" text-anchor="end" class="cn-et">${f === 0 ? "Z" : f}</text>`;
        o.asansor.forEach((a, i) => { if (dur[i]) sv += `<circle cx="${230 + i * 22}" cy="${y + 7.5}" r="6" fill="${a.renk}"/>`; });
      }
      s.sah.innerHTML = `<svg viewBox="0 0 300 ${H}" style="max-height:440px" role="img" aria-label="${o.kat} katlı bina">${sv}</svg>`;
      const acik = o.asansor.filter((a, i) => ac[i]).map(a => a.ad);

      s.yaz(acik.join("+"), [acik.join(" + "), git, gitme.length], null);

    ciz();
  }

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */
  function SAAT(el, o) {

      let onc = null, snr = null;
      for (let m = bas; m <= bit + ara; m += ara) { if (m <= var_) onc = m; if (m >= var_ && snr == null) snr = m; if (m <= bit) sv += `<text x="${20 + (m - bas) * sk}" y="40" text-anchor="middle" class="cn-bus">🚌</text>`; }

      if (snr != null && snr <= bit + ara) { const sx = 20 + (Math.min(snr, bit) - bas) * sk; sv += `<path d="M${vx} 56 L${sx} 56" class="cn-bek"/>`; }

      const gec = var_ - bas;
      s.dur.innerHTML = `${o.kisi} durağa ${saDa(var_)} geliyor: ilk seferden <b>${gec} dakika</b> sonra. Seferler ${E(ara,"in")} katı olan dakikalarda: ${ara} ${x} ${Math.floor(gec / ara)} = ${Math.floor(gec / ara) * ara}` + (gec % ara ? `, ${ara} ${x} ${Math.floor(gec / ara) + 1} = ${(Math.floor(gec / ara) + 1) * ara}. Sonraki otobüs ${saDa(snr)}; bekleme <b>${snr - var_} dakika</b>.` : `. Tam sefer saatinde geldi; bekleme <b>0 dakika</b>.`);
      s.yaz(ara + ":" + var_, [ara + " dk", sa(var_), sa(onc), sa(snr), (snr - var_) + " dk"], null);
    }
    ciz();
  }

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Çarpanlar", "Çarpan sayısı"] });
    let N = o.N || o.hazir[0]; let bul = new Set(), denendi = new Set();
    const kut = h("div", "cn-satir");
    const sA = adimci("Sayı:", 2, o.max || 200, N, v => { N = v; yeni(); });
    kut.appendChild(sA.w);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => sA.ayarla(n); hz.appendChild(b); }); kut.appendChild(hz); }
    s.den.appendChild(kut);
    const bolen = h("div", "cn-satir cn-test"); bolen.innerHTML = `<label>Bölen deneyin: <input type="number" inputmode="numeric" min="1"></label>`;
    const bD = dug("Böl"), bS = dug("Sıradakini dene", "ghost"); bolen.append(bD, bS); s.den.appendChild(bolen);
    const bi = bolen.querySelector("input");
    let bK = null; if (o.katlar) { bK = dug(o.katDugme || "Katlarını say ▶", "ghost"); s.den.appendChild(bK); }
    const ciftler = h("div", "cn-cift"); const katlar = h("div", "cn-katlar");
    function yeni() { bul = new Set(); denendi = new Set(); ciz(); s.dur.innerHTML = `${N} sayısını 1, 2, 3, … sayılarına bölerek çarpan çiftlerini bulun.`; katlar.textContent = ""; }
    function ciz() {
      const L = [...bul].sort((a, b) => a - b);
      s.sah.innerHTML = ""; const kartlar = h("div", "cn-kartlar");
      L.forEach(v => kartlar.appendChild(h("span", "cn-kart" + (v * v === N ? " kare" : ""), v)));
      if (!L.length) kartlar.appendChild(h("span", "cn-bosk", "Henüz çarpan bulunmadı"));
      s.sah.append(kartlar, ciftler, katlar);
      ciftler.innerHTML = L.filter(v => v * v <= N).map(v => `<span>${v} ${x} ${N / v}${v * v === N ? " <i>(aynı sayı: bir kez yazılır)</i>" : ""}</span>`).join("");
    }
    const tamamMi = () => { for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) return false; return true; };
    const eksik = () => { const L = []; for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) L.push(i); return ` <br>Henüz denenmeyen küçük bölenler var: <b>${L.join(", ")}</b>. Bunları da deneyin.`; };
    function dene(d) {
      if (!d || d < 1) return; denendi.add(d);
      const b = Math.floor(N / d), r = N % d;
      if (d > N) { s.dur.innerHTML = `${d} > ${N}: ${E(N,"den")} büyük sayı ${E(N,"in")} çarpanı olamaz.`; return; }
      if (r === 0) { bul.add(d); bul.add(b); ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${N} : ${d} = ${b}, kalan 0 → <b>${d} ${x} ${b} = ${N}</b>. ${d} ve ${b} çarpandır.` + (d * d >= N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} ${d * d === N ? "=" : ">"} ${N}. Artık yeni çift çıkmaz; bütün çarpanlar bulundu.` : eksik() : ""); }
      else { s.dur.innerHTML = `<span class="kotu">✘</span> ${N} : ${d} işleminde bölüm ${b}, <b>kalan ${r}</b>. ${d}, ${E(N,"in")} çarpanı değildir.` + (d * d > N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} > ${N}. Daha büyük bölen denemeye gerek yok; çarpan listesi tamam.` : eksik() : ""); }
      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));
      if (tamam) s.yaz("n" + N, [N, [...bul].sort((a, b) => a - b).join(", "), bul.size], true);
    }
    bD.onclick = () => dene(Math.round(+bi.value));
    bS.onclick = () => { let d = 1; while (denendi.has(d)) d++; bi.value = d; dene(d); };
    if (bK) bK.onclick = async () => {
      bK.disabled = true; katlar.textContent = ""; const sat = h("div", "cn-katsat"); katlar.append(h("b", "", `${E(N,"in")} katları: `), sat);
      for (let i = 1; i <= (o.katSay || 12); i++) { sat.appendChild(h("span", "cn-kat2", `${N * i}`)); await bekle(220); }
      sat.appendChild(h("span", "cn-sonsuz", "… ve sonsuza kadar sürer"));
      bK.disabled = false;
    };
    yeni();
  }

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */
  function KUMBARA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Para", "Sonuç"] });
    const k = o.k; let hafta = 0, tmr = null;
    const kut = h("div", "cn-satir"); const bA = dug("Bir hafta geçsin +"), bO = dug("▶ Haftaları oynat", "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bO, bS); s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Kumbarada şu para olabilir mi? <input type="number" inputmode="numeric" min="1" max="500"> TL</label>`;
    const bT = dug("Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test); const ti = test.querySelector("input");
    function ciz() {
      const top = hafta * k, sv = [];
      const yuk = Math.min(150, top * 1.4);
      sv.push(`<rect x="110" y="20" width="120" height="160" rx="22" class="cn-kum"/><rect x="150" y="14" width="40" height="8" rx="3" class="cn-kum2"/>`);
      sv.push(`<rect x="116" y="${176 - yuk}" width="108" height="${yuk}" rx="10" class="cn-para"/>`);
      sv.push(`<text x="170" y="110" text-anchor="middle" class="cn-buyuk">${top} TL</text><text x="170" y="134" text-anchor="middle" class="cn-et">${hafta}. hafta</text>`);
      let cizgi = ""; for (let i = 1; i <= hafta && i <= 16; i++) cizgi += `<text x="${260 + ((i - 1) % 4) * 52}" y="${40 + Math.floor((i - 1) / 4) * 34}" class="cn-et2">${k}${x}${i}=${k * i}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 480 190" role="img" aria-label="Kumbara">${sv.join("")}${cizgi}</svg>`;
      s.dur.innerHTML = hafta ? `${hafta}. hafta sonunda kumbarada ${k} ${x} ${hafta} = <b>${top} TL</b> var.` : `Kumbara boş. Her hafta ${k} TL atılıyor.`;
    }
    bA.onclick = () => { hafta++; ciz(); };
    bO.onclick = () => { if (tmr) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } bO.textContent = "❚❚ Durdur"; tmr = setInterval(() => { if (hafta >= 15) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } hafta++; ciz(); }, az ? 50 : 500); };
    bS.onclick = () => { hafta = 0; ciz(); };
    bT.onclick = () => {
      const v = Math.round(+ti.value); if (!v) return; const b = Math.floor(v / k), r = v % k;
      s.dur.innerHTML = r ? `<span class="kotu">✘</span> ${k} ${x} ${b} = ${k * b} TL, ${k} ${x} ${b + 1} = ${k * (b + 1)} TL. ${v} TL arada kalır (${v} : ${k} → kalan ${r}). Kumbarada hiçbir hafta ${v} TL olmaz.`
        : `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · ${b}. hafta sonunda kumbarada tam ${v} TL olur.`;
      if (!r) { hafta = b; ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · <b>${b}. hafta</b> sonunda kumbarada tam ${v} TL olur.`; }
      s.yaz("t" + v, [v + " TL", r ? `kalan ${r} ✘` : `${k} ${x} ${b} ✔`], !r);
    };
    ciz();
  }

  /* 9) ÖNERME LABORATUVARI: önermeyi farklı sayılarla sınama */
  function ONERME(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Önerme", "Sayı", "Sonuç"] });
    let akt = 0; const kut = h("div", "cn-hazir");
    const bt = o.onermeler.map((on, i) => { const b = dug(on.ad, "ghost"); b.setAttribute("aria-pressed", i === 0); b.onclick = () => { akt = i; bt.forEach((x, j) => x.setAttribute("aria-pressed", j === i)); goster(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Sınanacak sayı: <input type="number" inputmode="numeric" min="1" max="200" value="12"></label>`;
    const bT = dug("Sına"), bR = dug("Rastgele sayı", "ghost"); test.append(bT, bR); s.den.appendChild(test); const ti = test.querySelector("input");
    function goster() { s.sah.innerHTML = `<div class="cn-onr"><b>${o.onermeler[akt].ad}:</b> “${o.onermeler[akt].metin}”</div>`; s.dur.innerHTML = "Bir sayı yazıp Sına düğmesine basın. Önerme her sayıda doğru mu?"; }
    function sina(n) {
      const on = o.onermeler[akt], r = on.sina(n);
      s.sah.innerHTML = `<div class="cn-onr"><b>${on.ad}:</b> “${on.metin}”</div><div class="cn-kanit">${r.goster}</div>`;
      s.dur.innerHTML = (r.ok ? `<span class="iyi">✔</span> ${n} için önerme doğru.` : `<span class="kotu">✘</span> ${n} için önerme yanlış! Bir karşı örnek bulundu.`) + (r.not ? " " + r.not : "");
      s.yaz(akt + ":" + n, [on.ad, n, r.ok ? "doğru" : "yanlış (karşı örnek)"], r.ok);
    }
    bT.onclick = () => { const n = Math.round(+ti.value); if (n > 0) sina(n); };
    bR.onclick = () => { const n = 2 + Math.floor(Math.random() * 59); ti.value = n; sina(n); };
    goster();
  }


  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →
     koşullar tek tek denetlenir (✔/✘) → deney defterine yazılır. Doğru cevap verilmez; öğrenci uygun girdiyi kendisi arar.
     o.girdi: [{ad, min, max, bas} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → SVG/HTML · o.kosullar: [{ad, f(v) → bool | {ok, not}}]
     o.dugme: düğme yazısı (false → her değişiklikte denetlenir) · o.sonuc(v, hepsi, L) · o.satir(v, hepsi, L) · o.iyi(v, L) · o.ek: [{ad, deger(v) → v}] */
  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);
      s.dur.innerHTML = m;
      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);
    }
    kur = true; ciz();
    if (bS) s.dur.innerHTML = o.ilk || "Değerleri seçip Sına düğmesine basın."; else sina();
  }

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

/* SORU BANKASI · MAT.7.2.2 · Denklem ve Eşitsizlikler — yeni nesil soruların "Canlandır" düzenekleri (14.10.2026) — ortak motor: canlandir.js (CN.KOSUL); yeni motor yok.
   Her düzenek: öğrenci bilinmeyene − / + sayaçlarıyla ya da seçim düğmeleriyle değer verir → sahne ve iki taraf anında çizilir/hesaplanır →
   koşullar denetlenir → deneme deney defterine yazılır → yeniden dener. Doğru cevap bir düğmeyle verilmez; denemelerden çıkar (§4.k, §19-10).
   Çizim yardımcıları bu dosyada ayrıca yazıldı (canlandir_722.js de window.CANL tanımladığı için gömülmez). "<" ve ">" HTML'de &lt; &gt;. */
window.CANL = (() => {
  if (!document.getElementById("csb722-stil")) { const st = document.createElement("style"); st.id = "csb722-stil";
    st.textContent = ".cn-btn{min-width:44px;min-height:44px}.cn-adimci button{min-width:44px;min-height:44px}.cn-secg button{min-height:44px}"
      + ".csb722-k{text-align:center;font-size:17px;font-weight:800;margin:8px auto;max-width:640px;line-height:1.6}"
      + ".csb722-t{margin:6px auto;border-collapse:collapse;font-size:15px}.csb722-t th,.csb722-t td{border:1px solid #8a93a6;padding:5px 10px;text-align:center}.csb722-t th{background:#eaf7f1}";
    document.head.appendChild(st); }
  const LT = "&lt;", GT = "&gt;", M = "−";
  const D = v => (v < 0 ? M : "") + String(Math.round(Math.abs(v) * 1000) / 1000).replace(".", ",");
  const B = n => { const s = n < 0 ? M : ""; const [t, o] = String(Math.round(Math.abs(n) * 1000) / 1000).split("."); return s + t.replace(/\B(?=(\d{3})+(?!\d))/g, " ") + (o ? "," + o : ""); };
  const svg = (w, h, ic, ad) => `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;height:auto;display:block;margin:0 auto" role="img" aria-label="${ad}">${ic}</svg>`;
  const tx = (x, y, s, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.an || "middle"}" style="font-size:${o.fs || 14}px;font-weight:800;fill:${o.r || "#1d2433"}">${s}</text>`;
  const kutu = h => `<div class="csb722-k">${h}</div>`;
  const tablo = (bas, sat, vurgu = -1) => `<table class="csb722-t"><tr>${bas.map(b => `<th>${b}</th>`).join("")}</tr>${sat.map((r, i) => `<tr${i === vurgu ? ' style="background:#fff3bf"' : ""}>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;
  const sym = (a, b) => a < b ? LT : a > b ? GT : "=";
  const TL = v => B(v) + " TL";
  /* yatay çubuklar: [[ad, değer, renk, yazı?]] (aynı ölçek) */
  function cubuklar(L, olc, W = 400) { const mx = olc || Math.max(...L.map(x => Math.abs(x[1])), 1), u = (W - 210) / mx; let s = "";
    L.forEach(([ad, v, r, y], i) => { const yy = 14 + i * 44, w = Math.max(2, Math.abs(v) * u); s += tx(8, yy + 22, ad, { an: "start", fs: 13 }) + `<rect x="140" y="${yy}" width="${w}" height="30" rx="5" fill="${r}" stroke="#495057" stroke-opacity=".5"/>` + tx(148 + w, yy + 21, y || D(v), { an: "start", fs: 13 }); });
    return svg(W, 22 + L.length * 44, s, "Karşılaştırma çubukları"); }
  /* iki kefeli terazi: sol ve sağ toplam kütleye göre eğilir; et: kefelerin yazısı */
  function terazi(solEt, sagEt, sol, sag) { const W = 380, cx = 190, e = Math.sign(sag - sol), d = 14 * e, yl = 40 - d, yr = 40 + d;
    let s = `<line x1="${cx}" y1="160" x2="${cx}" y2="40" stroke="#495057" stroke-width="4"/><path d="M${cx - 34} 172 H${cx + 34} L${cx + 20} 160 H${cx - 20} Z" fill="#ced4da"/>`
      + `<line x1="${cx - 120}" y1="${yl}" x2="${cx + 120}" y2="${yr}" stroke="#495057" stroke-width="4" stroke-linecap="round"/><circle cx="${cx}" cy="40" r="5" fill="#495057"/>`;
    [[cx - 120, yl, solEt], [cx + 120, yr, sagEt]].forEach(([x, y, et]) => { s += `<line x1="${x}" y1="${y}" x2="${x - 56}" y2="${y + 74}" stroke="#8a93a6"/><line x1="${x}" y1="${y}" x2="${x + 56}" y2="${y + 74}" stroke="#8a93a6"/>`
      + `<path d="M${x - 66} ${y + 74} Q${x} ${y + 94} ${x + 66} ${y + 74}" fill="#f1f3f5" stroke="#495057" stroke-width="1.6"/>`
      + (Array.isArray(et) ? et : [et]).map((t, i, L) => tx(x, y + 70 - (L.length - 1 - i) * 17, t, { fs: 13 })).join(""); });
    return svg(W, 180, s, "Terazi"); }
  /* sayı doğrusu: a…b, işaretler [[değer, true/false]] (✓ yeşil / ✗ kırmızı), seçili değer turuncu */
  function dogru(a, b, isaretler, secili, W = 400) { const L = 26, R = W - 26, X = v => L + (v - a) / (b - a) * (R - L), y = 70; let s = `<line x1="${L - 10}" y1="${y}" x2="${R + 10}" y2="${y}" stroke="#495057" stroke-width="2"/>`;
    for (let v = a; v <= b; v++) s += `<line x1="${X(v)}" y1="${y - 6}" x2="${X(v)}" y2="${y + 6}" stroke="#495057" stroke-width="1.6"/>` + tx(X(v), y + 26, D(v), { fs: 13 });
    isaretler.forEach(([v, ok]) => { const r = ok ? "#2b8a3e" : "#c92a2a"; s += `<circle cx="${X(v)}" cy="${y}" r="5" fill="${r}"/>` + tx(X(v), y - 22, ok ? "✓" : "✗", { fs: 17, r }); });
    if (secili != null) s += `<circle cx="${X(secili)}" cy="${y}" r="9" fill="none" stroke="#e8590c" stroke-width="3"/>`;
    return svg(W, 108, s, "Sayı doğrusu"); }
  const KO = (el, o) => CN.KOSUL(el, Object.assign({ dugme: false }, o));

  return {
    /* 1 · Kütüphane gecikme ücreti: ilk gün 5 TL, sonraki her gün 2 TL; ödenen 33 TL */
    1: el => KO(el, { girdi: [{ ad: "Gecikme (gün)", min: 1, max: 20, bas: 3 }],
        ciz: v => { const g = v[0], u = 5 + 2 * (g - 1); let s = "";
          for (let i = 0; i < g; i++) s += `<rect x="${8 + (i % 10) * 38}" y="${8 + Math.floor(i / 10) * 40}" width="34" height="32" rx="5" fill="${i ? "#d0ebff" : "#ffd8a8"}" stroke="#495057"/>` + tx(25 + (i % 10) * 38, 30 + Math.floor(i / 10) * 40, i ? "2" : "5", { fs: 13 });
          return svg(390, 92, s, "Günlük ücretler") + kutu(`${g} gün: 5 + 2 · (${g} − 1) = <b>${u} TL</b> ${u === 33 ? "✔ makbuzdaki tutar" : u < 33 ? "(makbuzdan az)" : "(makbuzdan fazla)"}<br>5 + 2 · ${g} = ${5 + 2 * g} TL olmaz: ilk gün iki kez sayılır.`); },
        kosullar: [{ ad: v => `Ücret 33 TL (şimdi ${5 + 2 * (v[0] - 1)} TL).`, f: v => 5 + 2 * (v[0] - 1) === 33 }],
        sutun: ["Gün", "Sonraki gün sayısı", "Ücret"], satir: v => [v[0], v[0] - 1, TL(5 + 2 * (v[0] - 1))],
        yon: "Gecikme gün sayısını değiştirin. Turuncu kutu ilk gün (5 TL), mavi kutular sonraki günlerdir (2'şer TL). Kaç günde makbuzdaki 33 TL'ye ulaşılır? Sonraki gün sayısının g − 1 olduğuna dikkat edin.", bitis: "Ücret 33 TL olduğunda." }),

    /* 2 · Manav terazisi: 3k + 500 g = k + 3 000 g */
    2: el => KO(el, { girdi: [{ ad: "Bir kavun (50'şer g)", min: 16, max: 40, bas: 20 }],
        ciz: v => { const k = v[0] * 50, sol = 3 * k + 500, sag = k + 3000;
          return terazi(["3 kavun + 500 g", `= ${B(sol)} g`], ["1 kavun + 3 kg", `= ${B(sag)} g`], sol, sag) + kutu(`Bir kavun ${B(k)} g → sol ${B(sol)} g ${sym(sol, sag)} sağ ${B(sag)} g`); },
        kosullar: [{ ad: "Terazi dengede.", f: v => 3 * v[0] * 50 + 500 === v[0] * 50 + 3000 }],
        sutun: ["Bir kavun", "Sol kefe", "Sağ kefe", "Durum"], satir: v => { const k = v[0] * 50, a = 3 * k + 500, b = k + 3000; return [B(k) + " g", B(a) + " g", B(b) + " g", a === b ? "denge" : a > b ? "sol ağır" : "sağ ağır"]; },
        yon: "Bir kavunun kütlesini 50'şer gram değiştirin. Terazi hangi tarafa eğiliyor? Kütleyi büyütünce hangi kefe daha hızlı ağırlaşıyor? Teraziyi dengeye getirin.", bitis: "Terazi dengeye geldiğinde." }),

    /* 3 · Kabin bagajı: k ≤ 8 ve u ≤ 115 */
    3: el => { const P = { A: [7.5, 110], B: [8, 118], C: [8.2, 100], D: [6, 115] };
      return KO(el, { girdi: [{ ad: "Bavul:", sec: Object.keys(P), bas: "A" }],
        ciz: v => { const [k, u] = P[v[0]], a = k <= 8, b = u <= 115;
          return cubuklar([["Kütle (kg)", k, a ? "#b2f2bb" : "#ffc9c9", D(k) + " kg"], ["Sınır", 8, "#dee2e6", "8 kg"]], 10)
            + cubuklar([["Üç kenar (cm)", u, b ? "#b2f2bb" : "#ffc9c9", u + " cm"], ["Sınır", 115, "#dee2e6", "115 cm"]], 130)
            + kutu(`${v[0]} bavulu: ${D(k)} ≤ 8 ${a ? "✔" : "✘"} · ${u} ≤ 115 ${b ? "✔" : "✘"} → <b>${a && b ? "kabine alınır" : "kabine alınmaz"}</b>`); },
        kosullar: [{ ad: "Kütle koşulu (en fazla 8 kg)", f: v => P[v[0]][0] <= 8 }, { ad: "Boyut koşulu (en fazla 115 cm)", f: v => P[v[0]][1] <= 115 }],
        iyi: v => P[v[0]][0] <= 8 && P[v[0]][1] <= 115,
        sutun: ["Bavul", "Kütle", "Üç kenar", "Kabin"], satir: v => { const [k, u] = P[v[0]]; return [v[0], D(k) + " kg", u + " cm", k <= 8 && u <= 115 ? "alınır" : "alınmaz"]; },
        yon: "Bavulları tek tek seçin. “En fazla” sınırın kendisini de kapsar: 8 kg ve 115 cm'lik bavullar sınırı aşmaz. İki koşulu da sağlayan bavulları deney defterinden bulun.", bitis: "Dört bavulu da incelediğinizde." }); },

    /* 4 · Hediye: Ali x, Can 2x, Ece x + 40; toplam 480 */
    4: el => KO(el, { girdi: [{ ad: "Ali'nin ödediği (10'ar TL)", min: 5, max: 20, bas: 8 }],
        ciz: v => { const x = v[0] * 10, t = 4 * x + 40;
          return cubuklar([["Ali", x, "#a5d8ff", TL(x)], ["Can", 2 * x, "#a5d8ff", TL(2 * x)], ["Ece", x + 40, "#ffe066", TL(x + 40)]], 300)
            + kutu(`Toplam: ${TL(x)} + ${TL(2 * x)} + ${TL(x + 40)} = <b>${TL(t)}</b> ${t === 480 ? "✔" : t < 480 ? "(480 TL'den az)" : "(480 TL'den fazla)"}`); },
        kosullar: [{ ad: v => `Toplam 480 TL (şimdi ${4 * v[0] * 10 + 40} TL).`, f: v => 4 * v[0] * 10 + 40 === 480 }],
        sutun: ["Ali", "Can", "Ece", "Toplam"], satir: v => { const x = v[0] * 10; return [TL(x), TL(2 * x), TL(x + 40), TL(4 * x + 40)]; },
        yon: "Ali'nin ödediği parayı değiştirin; Can bunun 2 katını, Ece 40 TL fazlasını öder. Toplam 480 TL olduğunda Can kaç TL ödemiştir? Sorulan kişinin Can olduğunu unutmayın.", bitis: "Toplam 480 TL olduğunda." }),

    /* 5 · Şeker kavanozu: yarısını ver, +8, kalanın üçte birini ver → 14 */
    5: el => KO(el, { girdi: [{ ad: "Başlangıçtaki şeker (2'şer)", min: 5, max: 25, bas: 10 }],
        ciz: v => { const a = v[0] * 2, b = a / 2, c = b + 8, d = c * 2 / 3;
          return tablo(["Başlangıç", "Yarısı verildi", "8 eklendi", "Üçte biri verildi"], [[a, b, c, Number.isInteger(d) ? d : D(d)]])
            + kutu(`Son durum: <b>${Number.isInteger(d) ? d : D(d)}</b> şeker ${d === 14 ? "✔" : d < 14 ? "(14'ten az)" : "(14'ten fazla)"}<br>Geriye doğru: 14 → 14 · 3 : 2 = 21 → 21 − 8 = 13 → 13 · 2 = ?`); },
        kosullar: [{ ad: "Son durumda 14 şeker kaldı.", f: v => (v[0] + 8) * 2 / 3 === 14 }],
        sutun: ["Başlangıç", "Son durum"], satir: v => { const d = (v[0] + 8) * 2 / 3; return [v[0] * 2, Number.isInteger(d) ? d : D(d)]; },
        yon: "Başlangıçtaki şeker sayısını değiştirin; düzenek kartlardaki üç olayı sırayla uygular. Son durum 14 olana kadar deneyin; sonra aynı sonucu geriye doğru çalışarak (ters işlemler, ters sıra) bulun.", bitis: "Son durumda 14 şeker kaldığında." }),

    /* 6 · Fidanlar: A 40 + 6h, B 64 + 3h */
    6: el => KO(el, { girdi: [{ ad: "Geçen hafta", min: 0, max: 12, bas: 2 }],
        ciz: v => { const h = v[0], a = 40 + 6 * h, b = 64 + 3 * h;
          return cubuklar([["A fidanı", a, "#b2f2bb", a + " cm"], ["B fidanı", b, "#d8f5a2", b + " cm"]], 120)
            + kutu(`${h} hafta sonra: A ${a} cm ${sym(a, b)} B ${b} cm${a === b ? " → <b>boylar eşit</b>" : ""}`); },
        kosullar: [{ ad: "İki fidanın boyu eşit.", f: v => 40 + 6 * v[0] === 64 + 3 * v[0] }],
        sutun: ["Hafta", "A", "B", "Fark"], satir: v => [v[0], 40 + 6 * v[0] + " cm", 64 + 3 * v[0] + " cm", Math.abs(24 - 3 * v[0]) + " cm"],
        yon: "Haftaları ilerletin. Her hafta aradaki fark kaç santimetre kapanıyor? Boylar eşit olduğunda hafta sayısını ve fidanların boyunu ayrı ayrı yazın; soru hangisini istiyor?", bitis: "Boylar eşit olduğunda." }),

    /* 7 · Kırtasiye fişi: kalem k, defter 2k + 4; 4 defter + 3 kalem = 192 */
    7: el => KO(el, { girdi: [{ ad: "Kalem fiyatı (TL)", min: 8, max: 24, bas: 10 }],
        ciz: v => { const k = v[0], d = 2 * k + 4, t = 4 * d + 3 * k;
          return tablo(["Ürün", "Birim fiyat", "Adet", "Tutar"], [["Defter", TL(d), 4, TL(4 * d)], ["Kalem", TL(k), 3, TL(3 * k)], ["TOPLAM", "", "", TL(t)]], 2)
            + kutu(`Kalem ${TL(k)} → defter 2 · ${k} + 4 = ${TL(d)} → toplam <b>${TL(t)}</b> ${t === 192 ? "✔ fişle aynı" : ""}`); },
        kosullar: [{ ad: v => `Toplam 192 TL (şimdi ${4 * (2 * v[0] + 4) + 3 * v[0]} TL).`, f: v => 4 * (2 * v[0] + 4) + 3 * v[0] === 192 }],
        sutun: ["Kalem", "Defter", "Toplam"], satir: v => [TL(v[0]), TL(2 * v[0] + 4), TL(11 * v[0] + 16)],
        yon: "Kalemin fiyatını değiştirin; defterin fiyatı nottaki ilişkiden hesaplanır. Toplam fişteki 192 TL olduğunda defterin fiyatını okuyun.", bitis: "Toplam 192 TL olduğunda." }),

    /* 8 · Şarj: 30 + 8k ≤ 410 */
    8: el => KO(el, { girdi: [{ ad: "Şarj (kWh)", min: 40, max: 56, bas: 44 }],
        ciz: v => { const k = v[0], t = 30 + 8 * k;
          return cubuklar([["Ödenecek", t, t <= 410 ? "#b2f2bb" : "#ffc9c9", TL(t)], ["Bütçe", 410, "#dee2e6", "410 TL"]], 480)
            + kutu(`30 + 8 · ${k} = <b>${TL(t)}</b> ${t <= 410 ? "≤ 410 ✔" : GT + " 410 ✘"}`); },
        kosullar: [{ ad: "Ödeme 410 TL'yi geçmiyor.", f: v => 30 + 8 * v[0] <= 410 }, { ad: "1 kWh daha eklenirse 410 TL aşılıyor (en fazla).", f: v => 30 + 8 * (v[0] + 1) > 410 }],
        sutun: ["kWh", "Ödeme", "Bütçe içinde mi?"], satir: v => [v[0], TL(30 + 8 * v[0]), 30 + 8 * v[0] <= 410 ? "evet" : "hayır"],
        yon: "Şarj miktarını 1'er kWh değiştirin. Ödeme bütçeyi aşmasın; bir kWh daha eklenince aşsın. Bağlantı ücretini unutursanız sonuç ne olurdu?", bitis: "İki koşul da sağlandığında." }),

    /* 9 · Sayı doğrusu: 7 − 2x ≤ x + 13 */
    9: el => KO(el, { girdi: [{ ad: "Denenen sayı", min: -4, max: 3, bas: 0 }],
        ciz: v => { const x = v[0], a = 7 - 2 * x, b = x + 13, ok = a <= b;
          return dogru(-4, 3, [[-3, false], [-2, false], [0, true], [2, true]], x)
            + kutu(`x = ${D(x)}: sol 7 − 2 · (${D(x)}) = ${D(a)} · sağ ${D(x)} + 13 = ${D(b)} → ${D(a)} ${ok ? "≤" : GT} ${D(b)} ${ok ? "✓ sağlar" : "✗ sağlamaz"}<br>Öğrencinin işareti: ${({ "-3": "✗", "-2": "✗", "0": "✓", "2": "✓" })[x] || "işaret yok"}`); },
        kosullar: [{ ad: "Yanlış işaretlenen sayı bulundu.", f: v => v[0] === -2 }],
        sutun: ["x", "Sol", "Sağ", "Sağlar mı?", "Öğrenci"], satir: v => { const x = v[0]; return [D(x), D(7 - 2 * x), D(x + 13), 7 - 2 * x <= x + 13 ? "✓" : "✗", ({ "-3": "✗", "-2": "✗", "0": "✓", "2": "✓" })[x] || "—"]; },
        yon: "Sayıları tek tek eşitsizlikte deneyin ve sonucu öğrencinin işaretiyle karşılaştırın. Sınır değerde iki taraf eşitse “≤” sembolü sağlanır mı?", bitis: "Yanlış işaretlenen sayıyı bulduğunuzda." }),

    /* 10 · Toplu taşıma: 640 + 6b < 22b */
    10: el => KO(el, { girdi: [{ ad: "Aylık biniş", min: 30, max: 50, bas: 34 }],
        ciz: v => { const b = v[0], t = 22 * b, a = 640 + 6 * b;
          return cubuklar([["Tek biniş", t, "#ffd8a8", TL(t)], ["Abonman", a, "#a5d8ff", TL(a)]], 1000)
            + kutu(`${b} biniş: tek biniş ${TL(t)} · abonman ${TL(a)} → ${a < t ? "<b>abonman daha az</b>" : a === t ? "<b>eşit</b>" : "tek biniş daha az"}`); },
        kosullar: [{ ad: "Abonman daha az tutuyor.", f: v => 640 + 6 * v[0] < 22 * v[0] }, { ad: "Bir biniş azken abonman daha az değil (en az).", f: v => !(640 + 6 * (v[0] - 1) < 22 * (v[0] - 1)) }],
        sutun: ["Biniş", "Tek biniş", "Abonman", "Fark"], satir: v => [v[0], TL(22 * v[0]), TL(640 + 6 * v[0]), TL(22 * v[0] - 640 - 6 * v[0])],
        yon: "Biniş sayısını değiştirin. Her binişte abonman 16 TL avantaj sağlar; 640 TL'lik aylık ücret kaç binişte geri kazanılır? Eşit oldukları biniş sayısı “daha az” sayılır mı?", bitis: "İki koşul da sağlandığında." }),

    /* 11 · Çubuk modeli: 3x + 6 = x + 18 */
    11: el => KO(el, { girdi: [{ ad: "Mavi çubuk (x)", min: 1, max: 12, bas: 3 }],
        ciz: v => { const x = v[0], u = 12, s1 = 3 * x + 6, s2 = x + 18; let s = "";
          for (let i = 0; i < 3; i++) s += `<rect x="${70 + i * x * u}" y="10" width="${x * u}" height="30" fill="#a5d8ff" stroke="#1c5fbf"/>` + tx(70 + i * x * u + x * u / 2, 30, "x", { fs: 13 });
          s += `<rect x="${70 + 3 * x * u}" y="10" width="${6 * u}" height="30" fill="#ffe066" stroke="#b08900"/>` + tx(70 + 3 * x * u + 3 * u, 30, "6", { fs: 13 });
          s += `<rect x="70" y="54" width="${x * u}" height="30" fill="#a5d8ff" stroke="#1c5fbf"/>` + tx(70 + x * u / 2, 74, "x", { fs: 13 }) + `<rect x="${70 + x * u}" y="54" width="${18 * u}" height="30" fill="#ffe066" stroke="#b08900"/>` + tx(70 + x * u + 9 * u, 74, "18", { fs: 13 });
          s += tx(8, 30, "1. satır", { an: "start", fs: 13 }) + tx(8, 74, "2. satır", { an: "start", fs: 13 });
          return svg(Math.max(400, 80 + Math.max(s1, s2) * u), 92, s, "Çubuk modeli") + kutu(`1. satır 3 · ${x} + 6 = ${s1} · 2. satır ${x} + 18 = ${s2} → ${s1 === s2 ? "<b>eşit uzunlukta</b>" : "eşit değil"}`); },
        kosullar: [{ ad: "İki satır aynı uzunlukta.", f: v => 3 * v[0] + 6 === v[0] + 18 }],
        sutun: ["x", "1. satır", "2. satır"], satir: v => [v[0], 3 * v[0] + 6, v[0] + 18],
        yon: "Mavi çubuğun değerini değiştirin. İki satır ne zaman aynı uzunlukta olur? Modelin denklemi 3x + 6 = x + 18'dir; seçeneklerdeki hangi durum bu denkleme uyar?", bitis: "İki satır eşitlendiğinde." }),

    /* 12 · İki kırtasiye: 5d − 10 ile 5(d − 2) */
    12: el => KO(el, { girdi: [{ ad: "Defter fiyatı d (TL)", min: 4, max: 40, bas: 12 }],
        ciz: v => { const d = v[0], a = 5 * d - 10, b = 5 * (d - 2);
          return cubuklar([["A (5 defter)", a, "#a5d8ff", TL(a)], ["B (5 defter)", b, "#ffd8a8", TL(b)]], 200)
            + kutu(`d = ${d}: A 5 · ${d} − 10 = ${TL(a)} · B 5 · (${d} − 2) = ${TL(b)} → fark <b>${TL(Math.abs(a - b))}</b>`); },
        kosullar: [{ ad: v => `d = ${v[0]} için iki tutar karşılaştırıldı (fark ${Math.abs(5 * v[0] - 10 - 5 * (v[0] - 2))} TL).`, f: v => true }],
        sutun: ["d", "A", "B", "Fark"], satir: v => [v[0], TL(5 * v[0] - 10), TL(5 * (v[0] - 2)), TL(0)],
        yon: "Defterin fiyatını birkaç kez değiştirin ve deney defterindeki “Fark” sütununa bakın. Fark hiç değişiyor mu? 5d − 10 = 5(d − 2) eşitliğini hangi d değerleri sağlar?", bitis: "Farkın her denemede aynı kaldığını gördüğünüzde." }),

    /* 13 · LED ampul: 6 · 80 = 480 TL; ayda 72 TL tasarruf */
    13: el => KO(el, { girdi: [{ ad: "Geçen ay", min: 0, max: 12, bas: 3 }],
        ciz: v => { const m = v[0], t = 72 * m;
          return cubuklar([["Ampul parası", 480, "#ffc9c9", "480 TL"], ["Tasarruf", t, t > 480 ? "#b2f2bb" : "#d0ebff", TL(t)]], 900)
            + kutu(`${m} ay: 6 · 12 · ${m} = <b>${TL(t)}</b> ${t > 480 ? GT : t === 480 ? "=" : LT} 480 TL`); },
        kosullar: [{ ad: "Tasarruf ampul parasından fazla.", f: v => 72 * v[0] > 480 }, { ad: "Bir ay önce fazla değildi (en az).", f: v => !(72 * (v[0] - 1) > 480) }],
        sutun: ["Ay", "Tasarruf", "Ampul parası"], satir: v => [v[0], TL(72 * v[0]), "480 TL"],
        yon: "Ayları ilerletin. Bir ayda 6 ampulün toplam tasarrufu kaç TL'dir? Tasarruf ampul parasını ilk kez hangi ayda geçiyor?", bitis: "İki koşul da sağlandığında." }),

    /* 14 · Otel: 2x + 3(24 − x) = 58 */
    14: el => KO(el, { girdi: [{ ad: "2 kişilik oda (x)", min: 0, max: 24, bas: 6 }],
        ciz: v => { const x = v[0], y = 24 - x, m = 2 * x + 3 * y; let s = "";
          for (let i = 0; i < 24; i++) s += `<rect x="${8 + (i % 12) * 32}" y="${8 + Math.floor(i / 12) * 36}" width="28" height="30" rx="4" fill="${i < x ? "#a5d8ff" : "#ffd8a8"}" stroke="#495057"/>` + tx(22 + (i % 12) * 32, 28 + Math.floor(i / 12) * 36, i < x ? "2" : "3", { fs: 13 });

        kosullar: [{ ad: v => `Misafir sayısı 58 (şimdi ${2 * v[0] + 3 * (24 - v[0])}).`, f: v => 2 * v[0] + 3 * (24 - v[0]) === 58 }],

.800000000000004\" height=\"34\" rx=\"3\" fill=\"#fff3bf\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"193.9\" y=\"124.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">40</text></g><g transform=\"translate(306 0)\"><rect x=\"6.0\" y=\"30.0\" width=\"208.0\" height=\"92.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"6.0\" y=\"30.0\" width=\"208.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"110.0\" y=\"52.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">HEDİYE</text><text x=\"110.0\" y=\"83.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Toplam ödenen</text><text x=\"110.0\" y=\"109.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">480 TL</text></g></svg>", "son": "<p>Can, Ali'nin ödediğinin 2 katını; Ece ise Ali'nin ödediğinden 40 TL fazlasını ödemiştir.</p>", "k": "Buna göre, Can kaç TL ödemiştir?", "sec": ["110", "150", "220", "240"], "secg": null, "c": "C", "a": ["Ali x TL ödemişse Can 2x, Ece x + 40 TL ödemiştir. Modelde 4 mavi çubuk ve 40 TL'lik bir parça 480 TL'dir: 4x + 40 = 480.", "4x = 440; x = 110. Can 2 · 110 = 220 TL ödemiştir.", "Kontrol: 110 + 220 + 150 = 480."], "t": "110: Ali'nin ödediği; 150: Ece'nin ödediği; 240: toplamın yarısı.", "d": "Çubuk modelinde eş çubuklar aynı bilinmeyeni gösterir. 4x + 40 = 480 denkleminden bulduğunuz x, Ali'nin ödediğidir; soru Can'ın ödediğini (2x) istemektedir.", "ses": "b04"}, {"no": 5, "on": "<p>Ela'nın kavanozundaki şekerlerle ilgili olaylar sırasıyla aşağıdaki kartlarda gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 720 118\" width=\"720\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"10.0\" y=\"20.0\" width=\"122.4\" height=\"78.0\" rx=\"9\" fill=\"#ffffff\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"71.2\" y=\"64.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"18\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">?</text><line x1=\"135.4\" y1=\"59.0\" x2=\"151.4\" y2=\"59.0\" stroke=\"#111111\" stroke-width=\"2\"/><polygon points=\"151.4,59.0 144.1,62.3 144.1,55.7\" fill=\"#111111\"/><rect x=\"154.4\" y=\"20.0\" width=\"122.4\" height=\"78.0\" rx=\"9\" fill=\"#e7f5ff\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"215.6\" y=\"54.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Yarısını</text><text x=\"215.6\" y=\"74.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">kardeşine verdi</text><line x1=\"279.8\" y1=\"59.0\" x2=\"295.8\" y2=\"59.0\" stroke=\"#111111\" stroke-width=\"2\"/><polygon points=\"295.8,59.0 288.5,62.3 288.5,55.7\" fill=\"#111111\"/><rect x=\"298.8\" y=\"20.0\" width=\"122.4\" height=\"78.0\" rx=\"9\" fill=\"#e7f5ff\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"360.0\" y=\"54.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Annesi</text><text x=\"360.0\" y=\"74.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">8 şeker ekledi</text><line x1=\"424.2\" y1=\"59.0\" x2=\"440.2\" y2=\"59.0\" stroke=\"#111111\" stroke-width=\"2\"/><polygon points=\"440.2,59.0 432.9,62.3 432.9,55.7\" fill=\"#111111\"/><rect x=\"443.2\" y=\"20.0\" width=\"122.4\" height=\"78.0\" rx=\"9\" fill=\"#e7f5ff\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"504.4\" y=\"54.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Kalanın üçte birini</text><text x=\"504.4\" y=\"74.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">arkadaşına verdi</text><line x1=\"568.6\" y1=\"59.0\" x2=\"584.6\" y2=\"59.0\" stroke=\"#111111\" stroke-width=\"2\"/><polygon points=\"584.6,59.0 577.3,62.3 577.3,55.7\" fill=\"#111111\"/><rect x=\"587.6\" y=\"20.0\" width=\"122.4\" height=\"78.0\" rx=\"9\" fill=\"#ffffff\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"648.8\" y=\"64.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"18\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">14</text></svg>", "son": "<p>Kavanozda son durumda 14 şeker kalmıştır.</p>", "k": "Buna göre, kavanozda başlangıçta kaç şeker vardı?", "sec": ["26", "30", "34", "68"], "secg": null, "c": "A", "a": ["Geriye doğru çalışılır. Kalanın üçte biri verildikten sonra üçte ikisi (14) kalmıştır; o anda 14 · 3 : 2 = 21 şeker vardı.", "Annesi 8 şeker eklemeden önce 21 − 8 = 13 şeker vardı.", "Yarısı verilmeden önce 13 · 2 = 26 şeker vardı. Kontrol: 26 → 13 → 21 → 14."], "t": "68: 14'ün üçte biri verilmiş gibi 14 · 3 alınmış; 34: aynı hata ve 2 ile çarpma unutulmuş; 30: 8 eklenip çıkarılmamış.", "d": "Geriye doğru çalışırken ters işlemleri ters sırayla yapın. “Kalanın üçte biri verildi” ise geriye üçte iki kalmıştır; 14'ü 3 ile değil, 3/2 ile çarpın.", "ses": "b05"}, {"no": 6, "on": "<p>Bir fidanlıkta iki fidanın boyları ölçülmüş, saksılarına bilgi kartları asılmıştır. Fidanlar her hafta kartta yazan kadar uzamaktadır.</p>", "g": "<svg viewBox=\"0 0 700 226\" width=\"700\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"10.0\" y1=\"196.0\" x2=\"700.0\" y2=\"196.0\" stroke=\"#495057\" stroke-width=\"2\"/><path d=\"M40 156 h60 l-8 40 h-44 Z\" fill=\"#e8a87c\" stroke=\"#495057\" stroke-width=\"1.4\"/><line x1=\"70.0\" y1=\"156.0\" x2=\"70.0\" y2=\"96.0\" stroke=\"#2b8a3e\" stroke-width=\"4\"/><ellipse cx=\"56\" cy=\"144\" rx=\"14\" ry=\"6\" fill=\"#8ce99a\" stroke=\"#2b8a3e\" stroke-width=\"1\"/><ellipse cx=\"84\" cy=\"132\" rx=\"14\" ry=\"6\" fill=\"#8ce99a\" stroke=\"#2b8a3e\" stroke-width=\"1\"/><ellipse cx=\"56\" cy=\"120\" rx=\"14\" ry=\"6\" fill=\"#8ce99a\" stroke=\"#2b8a3e\" stroke-width=\"1\"/><ellipse cx=\"84\" cy=\"108\" rx=\"14\" ry=\"6\" fill=\"#8ce99a\" stroke=\"#2b8a3e\" stroke-width=\"1\"/><text x=\"70.0\" y=\"182.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><path d=\"M230 156 h60 l-8 40 h-44 Z\" fill=\"#e8a87c\" stroke=\"#495057\" stroke-width=\"1.4\"/><line x1=\"260.0\" y1=\"156.0\" x2=\"260.0\" y2=\"60.0\" stroke=\"#2b8a3e\" stroke-width=\"4\"/><ellipse cx=\"246\" cy=\"137\" rx=\"14\" ry=\"6\" fill=\"#8ce99a\" stroke=\"#2b8a3e\" stroke-width=\"1\"/><ellipse cx=\"274\" cy=\"118\" rx=\"14\" ry=\"6\" fill=\"#8ce99a\" stroke=\"#2b8a3e\" stroke-width=\"1\"/><ellipse cx=\"246\" cy=\"98\" rx=\"14\" ry=\"6\" fill=\"#8ce99a\" stroke=\"#2b8a3e\" stroke-width=\"1\"/><ellipse cx=\"274\" cy=\"79\" rx=\"14\" ry=\"6\" fill=\"#8ce99a\" stroke=\"#2b8a3e\" stroke-width=\"1\"/><text x=\"260.0\" y=\"182.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><rect x=\"330.0\" y=\"18.0\" width=\"170.0\" height=\"96.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"330.0\" y=\"18.0\" width=\"170.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"415.0\" y=\"40.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A FİDANI</text><text x=\"415.0\" y=\"71.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Bugün: 40 cm</text><text x=\"415.0\" y=\"97.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Her hafta: 6 cm uzar</text><rect x=\"515.0\" y=\"18.0\" width=\"170.0\" height=\"96.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"515.0\" y=\"18.0\" width=\"170.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"600.0\" y=\"40.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B FİDANI</text><text x=\"600.0\" y=\"71.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Bugün: 64 cm</text><text x=\"600.0\" y=\"97.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Her hafta: 3 cm uzar</text></svg>", "son": "", "k": "Buna göre, iki fidanın boyu eşit olduğunda fidanların her biri kaç santimetre olur?", "sec": ["8", "72", "88", "96"], "secg": null, "c": "C", "a": ["h hafta sonra A fidanı 40 + 6h, B fidanı 64 + 3h cm olur. Boyların eşit olduğu durum: 40 + 6h = 64 + 3h.", "3h = 24 → h = 8 hafta.", "Bilinmeyen (8) istenen sonuç değildir: 8 hafta sonra her fidan 40 + 48 = 88 cm olur (64 + 24 = 88)."], "t": "8: hafta sayısı; 72: 64 + 8; 96: 8 haftada A'nın uzama miktarına 48 eklenmiş.", "d": "Bilinmeyen her zaman istenen sonuç değildir. Denklemden bulduğunuz 8, hafta sayısıdır; soru fidanların o andaki boyunu istemektedir.", "ses": "b06"}, {"no": 7, "on": "<p>Mert kırtasiyeden defter ve kalem almıştır. Mert'in fişindeki birim fiyatlar silinmiştir; fiş ve Mert'in fiyatlarla ilgili notu aşağıda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 700 160\" width=\"700\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><path d=\"M10 6 H310 V140 l-25.0 7 l-25.0 -7 l-25.0 7 l-25.0 -7 l-25.0 7 l-25.0 -7 l-25.0 7 l-25.0 -7 l-25.0 7 l-25.0 -7 l-25.0 7 l-25.0 -7 Z\" fill=\"#ffffff\" stroke=\"#868e96\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"32.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">KIRTASİYE FİŞİ</text><text x=\"24.0\" y=\"60.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">4 defter</text><text x=\"296.0\" y=\"60.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"end\">…</text><text x=\"24.0\" y=\"84.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">3 kalem</text><text x=\"296.0\" y=\"84.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"end\">…</text><line x1=\"20.0\" y1=\"96.0\" x2=\"300.0\" y2=\"96.0\" stroke=\"#868e96\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><text x=\"24.0\" y=\"116.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"start\">TOPLAM</text><text x=\"296.0\" y=\"116.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">192 TL</text><rect x=\"350.0\" y=\"26.0\" width=\"330.0\" height=\"96.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"350.0\" y=\"26.0\" width=\"330.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"515.0\" y=\"48.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">MERT'İN NOTU</text><text x=\"515.0\" y=\"79.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Defterin fiyatı, kalemin</text><text x=\"515.0\" y=\"105.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">fiyatının 2 katından 4 TL fazladır.</text></svg>", "son": "", "k": "Buna göre, bir defterin fiyatı kaç TL'dir?", "sec": ["16", "32", "36", "44"], "secg": null, "c": "C", "a": ["Kalem k TL ise defter 2k + 4 TL'dir. Fiş: 4(2k + 4) + 3k = 192.", "8k + 16 + 3k = 192 → 11k = 176 → k = 16. Defter 2 · 16 + 4 = 36 TL'dir.", "Kontrol: 4 · 36 + 3 · 16 = 144 + 48 = 192."], "t": "16: kalemin fiyatı; 32: 4 TL eklenmemiş; 44: 192 : 4 − 4.", "d": "İki niceliği tek harfle yazın: kalem k ise defter 2k + 4'tür. 4 defterin tutarı 4(2k + 4)'tür; parantezdeki her terimi 4 ile çarpmayı unutmayın.", "ses": "b07"}, {"no": 8, "on": "<p>Ayşe Hanım elektrikli otomobilini bir şarj istasyonunda şarj edecektir. İstasyonun ekranındaki ücret bilgileri aşağıda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 700 186\" width=\"700\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"20.0\" y=\"10.0\" width=\"300.0\" height=\"108.0\" rx=\"12\" fill=\"#343a40\" stroke=\"#495057\" stroke-width=\"1.6\"/><rect x=\"32.0\" y=\"22.0\" width=\"276.0\" height=\"84.0\" rx=\"6\" fill=\"#e7f5ff\" stroke=\"#495057\" stroke-width=\"1.2\"/><text x=\"170.0\" y=\"46.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">ŞARJ İSTASYONU</text><text x=\"170.0\" y=\"74.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Bağlantı: 30 TL</text><text x=\"170.0\" y=\"102.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">kWh başına: 8 TL</text><rect x=\"420.0\" y=\"96.0\" width=\"230.0\" height=\"60.0\" rx=\"18\" fill=\"#a5d8ff\" stroke=\"#495057\" stroke-width=\"1.6\"/><rect x=\"470.0\" y=\"66.0\" width=\"120.0\" height=\"40.0\" rx=\"12\" fill=\"#a5d8ff\" stroke=\"#495057\" stroke-width=\"1.6\"/><rect x=\"482.0\" y=\"72.0\" width=\"46.0\" height=\"28.0\" rx=\"4\" fill=\"#e7f5ff\" stroke=\"#495057\" stroke-width=\"1\"/><rect x=\"534.0\" y=\"72.0\" width=\"46.0\" height=\"28.0\" rx=\"4\" fill=\"#e7f5ff\" stroke=\"#495057\" stroke-width=\"1\"/><circle cx=\"470.0\" cy=\"158.0\" r=\"18.0\" fill=\"#495057\" stroke=\"#495057\" stroke-width=\"1.4\"/><circle cx=\"470.0\" cy=\"158.0\" r=\"7.6\" fill=\"#ced4da\" stroke=\"#495057\" stroke-width=\"1\"/><circle cx=\"600.0\" cy=\"158.0\" r=\"18.0\" fill=\"#495057\" stroke=\"#495057\" stroke-width=\"1.4\"/><circle cx=\"600.0\" cy=\"158.0\" r=\"7.6\" fill=\"#ced4da\" stroke=\"#495057\" stroke-width=\"1\"/><path d=\"M320 90 C 360 90, 380 120, 420 118\" fill=\"none\" stroke=\"#495057\" stroke-width=\"4\"/></svg>", "son": "<p>Ayşe Hanım şarj için 410 TL'den fazla ödemek istememektedir. Şarj miktarı tam kWh olarak seçilmektedir.</p>", "k": "Buna göre, Ayşe Hanım <u>en fazla</u> kaç kWh şarj yaptırabilir?", "sec": ["47", "48", "51", "55"], "secg": null, "c": "A", "a": ["k kWh şarj için 30 + 8k TL ödenir; ödeme 410 TL'yi geçmemelidir: 30 + 8k ≤ 410.", "8k ≤ 380 → k ≤ 47,5. Şarj miktarı tam kWh olduğu için en fazla 47 kWh.", "Kontrol: 47 kWh için 406 TL (geçmez); 48 kWh için 414 TL (geçer)."], "t": "48: yukarı yuvarlanmış; 51: bağlantı ücreti hesaba katılmamış (410 : 8); 55: bağlantı ücreti eklenmiş (440 : 8).", "d": "Sabit ücreti (bağlantı) unutmayın: 30 + 8k ≤ 410. Sonuç 47,5 çıktığında “en fazla” sorusu için aşağı yuvarlayın; 48 kWh bütçeyi aşar.", "ses": "b08"}, {"no": 9, "on": "<p>Bir öğrenci, defterindeki eşitsizliği sağlayan değerleri incelemek için −3, −2, 0 ve 2 sayılarını denemiş; sağlayan sayıları ✓, sağlamayan sayıları ✗ ile sayı doğrusunda işaretlemiştir.</p>", "g": "<svg viewBox=\"0 0 704.0 108.0\" width=\"704\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><g transform=\"translate(0 0)\"><rect x=\"6.0\" y=\"14.0\" width=\"208.0\" height=\"74.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"6.0\" y=\"14.0\" width=\"208.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"110.0\" y=\"36.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">DENENEN EŞİ \" stroke-width=\"1.4\"/><text x=\"372.9\" y=\"100.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">2</text><line x1=\"430.0\" y1=\"67\" x2=\"430.0\" y2=\"81\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"430.0\" y=\"100.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">3</text><circle cx=\"87.1\" cy=\"74\" r=\"4.5\" fill=\"#c92a2a\"/><circle cx=\"87.1\" cy=\"44\" r=\"11\" fill=\"#fff\" stroke=\"#c92a2a\" stroke-width=\"2\"/><path d=\"M82.6 39.5 l9 9 M91.6 39.5 l-9 9\" stroke=\"#c92a2a\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><circle cx=\"144.3\" cy=\"74\" r=\"4.5\" fill=\"#c92a2a\"/><circle cx=\"144.3\" cy=\"44\" r=\"11\" fill=\"#fff\" stroke=\"#c92a2a\" stroke-width=\"2\"/><path d=\"M139.8 39.5 l9 9 M148.8 39.5 l-9 9\" stroke=\"#c92a2a\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><circle cx=\"258.6\" cy=\"74\" r=\"4.5\" fill=\"#2b8a3e\"/><circle cx=\"258.6\" cy=\"44\" r=\"11\" fill=\"#fff\" stroke=\"#2b8a3e\" stroke-width=\"2\"/><path d=\"M253.6 44 l3.5 4 l6.5 -8\" fill=\"none\" stroke=\"#2b8a3e\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><circle cx=\"372.9\" cy=\"74\" r=\"4.5\" fill=\"#2b8a3e\"/><circle cx=\"372.9\" cy=\"44\" r=\"11\" fill=\"#fff\" stroke=\"#2b8a3e\" stroke-width=\"2\"/><path d=\"M367.9 44 l3.5 4 l6.5 -8\" fill=\"none\" stroke=\"#2b8a3e\" stroke-width=\"2.4\" stroke-linecap=\"round\"/></g></svg>", "son": "<p>Öğretmen, öğrencinin işaretlemelerinden yalnız birinin yanlış olduğunu söylemiştir.</p>", "k": "Buna göre, öğrencinin yanlış işaretlediği sayı hangisidir?", "sec": ["−3", "−2", "0", "2"], "secg": null, "c": "B", "a": ["Eşitsizlik çözülür: 7 − 2x ≤ x + 13 → −3x ≤ 6 → x ≥ −2 (−3'e bölünce yön değişir).", "−3 sağlamaz (13 ≤ 10 ✗); 0 ve 2 sağlar.", "−2 için 7 + 4 = 11 ve −2 + 13 = 11; 11 ≤ 11 doğrudur. Sınır değer ≤ ile yazılan eşitsizliği sağlar; öğrenci −2'yi ✗ işaretlemiştir."], "t": "−3: doğru işaretlenmiştir; 0 ve 2: doğru işaretlenmiştir.", "d": "Sınır değeri yerine yazarak deneyin: iki taraf eşitse “≤” ve “≥” sağlanır, “<” ve “>” sağlanmaz. Negatif sayıya bölerken eşitsizliğin yönü değişir.", "ses": "b09"}, {"no": 10, "on": "<p>Bir şehirde toplu taşıma için iki ödeme seçeneği vardır. Seçenekler duraktaki bilgi panosunda aşağıdaki gibi yazılıdır.</p>", "g": "<svg viewBox=\"0 0 700 130\" width=\"700\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"10.0\" y=\"14.0\" width=\"300.0\" height=\"80.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"10.0\" y=\"14.0\" width=\"300.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"160.0\" y=\"36.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">TEK BİNİŞ</text><text x=\"160.0\" y=\"67.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Her biniş: 22 TL</text><rect x=\"340.0\" y=\"14.0\" width=\"350.0\" height=\"104.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"340.0\" y=\"14.0\" width=\"350.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"515.0\" y=\"36.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">AYLIK ABONMAN</text><text x=\"515.0\" y=\"67.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Aylık ücret: 640 TL</text><text x=\"515.0\" y=\"93.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Her biniş: 6 TL</text></svg>", "son": "<p>Can bir ay boyunca toplu taşıma kullanacaktır.</p>", "k": "Buna göre, Can'ın aylık abonmanla daha az ödemesi için o ay <u>en az</u> kaç biniş yapması gerekir?", "sec": ["29", "40", "41", "107"], "secg": null, "c": "C", "a": ["b biniş için tek binişle 22b TL, abonmanla 640 + 6b TL ödenir. Abonmanın daha az olduğu durum: 640 + 6b &lt; 22b.", "640 &lt; 16b → b &gt; 40. Biniş sayısı doğal sayıdır; en az 41 biniş.", "Kontrol: 40 binişte iki seçenek de 880 TL (eşit); 41 binişte abonman 886 TL, tek biniş 902 TL."], "t": "40: eşit oldukları biniş sayısı; 29: 640 : 22; 107: 640 : 6.", "d": "Önce iki seçeneğin eşit olduğu biniş sayısını bulun (40). Eşitlikte abonman “daha az” değildir; en az 41 biniş gerekir.", "ses": "b10"}, {"no": 11, "on": "<p>Bir öğretmen tahtaya iki satırlık bir çubuk modeli çizmiştir. Mavi çubukların her biri aynı miktarı (x) gösterir; sarı parçaların değerleri üzerlerinde yazılıdır.</p>", "g": "<svg viewBox=\"0 0 590.0 102.0\" width=\"590\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><g transform=\"translate(0 0)\"><text x=\"64.0\" y=\"32.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">1. satır</text><rect x=\"72.0\" y=\"10.0\" width=\"66.0\" height=\"34\" rx=\"3\" fill=\"#d0e3fb\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"105.0\" y=\"32.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">x</text><rect x=\"138.0\" y=\"10.0\" width=\"66.0\" height=\"34\" rx=\"3\" fill=\"#d0e3fb\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"171.0\" y=\"32.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">x</text><rect x=\"204.0\" y=\"10.0\" width=\"66.0\" height=\"34\" rx=\"3\" fill=\"#d0e3fb\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"237.0\" y=\"32.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">x</text><rect x=\"270.0\" y=\"10.0\" width=\"66.0\" height=\"34\" rx=\"3\" fill=\"#fff3bf\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"303.0\" y=\"32.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">6</text><text x=\"64.0\" y=\"78.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">2. satır</text><rect x=\"72.0\" y=\"56.0\" width=\"66.0\" height=\"34\" rx=\"3\" fill=\"#d0e3fb\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"105.0\" y=\"78.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">x</text><rect x=\"138.0\" y=\"56.0\" width=\"198.0\" height=\"34\" rx=\"3\" fill=\"#fff3bf\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"237.0\" y=\"78.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">18</text></g><g transform=\"translate(370 5)\"><rect x=\"6.0\" y=\"10.0\" width=\"208.0\" height=\"74.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"110.0\" y=\"35.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">İki satırın</text><text x=\"110.0\" y=\"61.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">uzunluğu eşittir.</text></g></svg>", "son": "<p>Öğretmen öğrencilerinden bu modele uygun bir problem seçmelerini istemiştir.</p>", "k": "Buna göre, aşağıdaki problemlerden hangisi bu modele uygundur?", "sec": ["3 özdeş paket ile 6 TL'lik bir ürünün toplam fiyatı, aynı paketlerden 1 tanesi ile 18 TL'lik bir ürünün toplam fiyatına eşittir.", "3 özdeş paketin toplam fiyatı ile 6 TL'nin toplamı 18 TL'dir.", "3 özdeş paketin toplam fiyatı, 1 paket ile 18 TL'lik bir ürünün toplam fiyatından 6 TL fazladır.", "Bir paketin fiyatının 3 katının 6 fazlası, 18'in 1 fazlasına eşittir."], "secg": null, "c": "A", "a": ["1. satır 3x + 6, 2. satır x + 18'dir. İki satır eşit uzunlukta olduğundan model 3x + 6 = x + 18 denklemini gösterir.", "Bu denklem “3 paket ve 6 TL'lik ürün, 1 paket ve 18 TL'lik ürüne eşit” durumuna uyar.", "Çözüm: iki satırdan birer x atılırsa 2x + 6 = 18, x = 6 TL."], "t": "3x + 6 = 18: 2. satırdaki x unutulmuş; “6 TL fazladır”: 3x = x + 24 olur, 6 TL'lik parça yanlış satıra yazılmış; “18'in 1 fazlası”: x yerine 1 alınmış.", "d": "Modeldeki iki satır eşit uzunluktadır; bu bir eşitliktir: 3x + 6 = x + 18. Problemi seçerken iki taraftaki bütün parçaların (x'ler ve sayılar) problemde yer aldığına bakın.", "ses": "b11"}, {"no": 12, "on": "<p>Aynı defteri satan iki kırtasiyenin vitrinlerindeki tabelalar aşağıda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 700 130\" width=\"700\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"10.0\" y=\"14.0\" width=\"330.0\" height=\"104.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"10.0\" y=\"14.0\" width=\"330.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"175.0\" y=\"36.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A KIRTASİYESİ</text><text x=\"175.0\" y=\"67.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Defter: tanesi d TL</text><text x=\"175.0\" y=\"93.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">5 defter alana toplamda 10 TL indirim</text><rect x=\"360.0\" y=\"14.0\" width=\"330.0\" height=\"104.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"360.0\" y=\"14.0\" width=\"330.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"525.0\" y=\"36.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B KIRTASİYESİ</text><text x=\"525.0\" y=\"67.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Defter: tanesi (d − 2) TL</text><text x=\"525.0\" y=\"93.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Kampanya yok</text></svg>", "son": "<p>Ali 5 defter alacaktır. Defterin A kırtasiyesindeki fiyatı d TL'dir.</p>", "k": "Buna göre, aşağıdakilerden hangisi doğrudur?", "sec": ["d &gt; 10 ise Ali A kırtasiyesinden alırsa daha az öder.", "Ali B kırtasiyesinden alırsa her zaman daha az öder.", "Ali A kırtasiyesinden alırsa her zaman daha az öder.", "Ali iki kırtasiyede de aynı tutarı öder; 5d − 10 = 5(d − 2) eşitliğini d'nin her değeri sağlar."], "secg": null, "c": "D", "a": ["A kırtasiyesinde 5 defter 5d − 10 TL, B kırtasiyesinde 5(d − 2) TL'dir.", "5(d − 2) = 5d − 10 olduğundan iki ifade denktir; 5d − 10 = 5d − 10 sadeleşince 0 = 0 kalır.", "Denklemi d'nin her değeri sağlar: Ali hangi kırtasiyeden alırsa alsın aynı tutarı öder. Örneğin d = 30 için iki tutar da 140 TL'dir."], "t": "A ya da B'nin daha ucuz olduğunu söyleyen seçeneklerde iki ifadenin denk olduğu fark edilmemiştir.", "d": "İki ifade denkse (5d − 10 ile 5(d − 2)) hangi değeri verirseniz verin aynı sonucu verir. Sadeleştirince 0 = 0 gibi her zaman doğru bir eşitlik kalıyorsa denklemi her değer sağlar.", "ses": "b12"}, {"no": 13, "on": "<p>Bir aile, evindeki eski ampullerin yerine LED ampul takmaya karar vermiştir. Elektrik tasarrufuyla ilgili bilgiler ampul kutusunda yazılıdır.</p>", "g": "<svg viewBox=\"0 0 700 144\" width=\"700\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><circle cx=\"50.0\" cy=\"60.0\" r=\"20.0\" fill=\"#fff3bf\" stroke=\"#b08900\" stroke-width=\"1.4\"/><rect x=\"41.0\" y=\"80.0\" width=\"18.0\" height=\"18.0\" rx=\"3\" fill=\"#adb5bd\" stroke=\"#495057\" stroke-width=\"1.1\"/><line x1=\"43.0\" y1=\"86.0\" x2=\"57.0\"
