<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* ANA_KURALLAR §4.y-3: Etkinliklerde bütün kesirler kesir çizgisiyle (alt alta pay/payda) gösterilir. Düz yazılmış a/b biçimleri otomatik dönüştürülür. */
(function(){
  if (window.__kesirCizgi) return; window.__kesirCizgi = 1;
  const RX = /(^|[^\w\/.,:%])([−-])?(?:(\d+) )?(\d{1,4})\/(\d{1,4})(?![\w\/.,]\d|\w)/g;
  const ATLA = "script,style,svg,textarea,input,select,code,.ilr,.frac,[data-duz]";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function donustur(kok){
    if (!kok || !kok.nodeType) return;
    if (kok.nodeType === 3) kok = kok.parentElement;
    if (!kok || (kok.closest && kok.closest(ATLA))) return;
    const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      if (!/\d\/\d/.test(t.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = t.parentElement; if (!p || p.closest(ATLA)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const L = []; let t; while ((t = w.nextNode())) L.push(t);
    L.forEach(t => {
      let deg = false;
      const h = esc(t.nodeValue).replace(RX, (m, a, s, tam, p, q) => { deg = true;
        return a + (s ? "−" : "") + (tam ? tam + " " : "") + '<span class="frac"><span>' + p + "</span><span>" + q + "</span></span>"; });
      if (!deg) return;
      const k = document.createElement("span"); k.innerHTML = h; t.replaceWith(...k.childNodes);
    });
  }
  let bekleyen = new Set(), plan = 0;
  const calis = () => { plan = 0; const b = bekleyen; bekleyen = new Set(); b.forEach(donustur); };
  const gozcu = new MutationObserver(ms => { ms.forEach(m => {
      if (m.type === "characterData") bekleyen.add(m.target); else m.addedNodes.forEach(n => bekleyen.add(n)); });
    if (!plan) plan = requestAnimationFrame(calis); });
  const bas = () => { donustur(document.body); gozcu.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bas); else bas();
  const st = document.createElement("style");
  st.textContent = ".frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}.frac>span{display:block;text-align:center;padding:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor}";
  document.head.appendChild(st);
})();

/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {

    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });

    async function dagit(k) {

      const kolon = Math.min(k, 6), satirK = Math.ceil(k / kolon), gw = kolon * 14 + 16, gh = satirK * 14 + 26;

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */
  function ATLA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Sonuç"] });
    let k = o.k, L = o.son; const W = 660, sol = 22, sag = 22, sk = (W - sol - sag) / L;

    const bA = dug("▶ Oynat"), bB = dug("+1 " + (o.adimAd || "adım"), "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bB, bS);
    let kA = null;
    if (o.kSec) { kA = adimci(o.kEtiket || "Adım:", 2, Math.floor(L / 2), k, v => { k = v; sifirla(); }); kut.prepend(kA.w); }

    const bT = dug(o.testDugme || "Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test);
    const ti = test.querySelector("input");
    function taban() {
      let sv = `<line x1="${sol}" y1="62" x2="${sol + L * sk}" y2="62" class="cn-ek"/>`;

      for (let v = 0; v <= L; v += adimT) sv += `<line x1="${sol + v * sk}" y1="${v % et ? 58 : 54}" x2="${sol + v * sk}" y2="66" class="cn-ek"/>` + (v % et ? "" : `<text x="${sol + v * sk}" y="82" text-anchor="middle" class="cn-et">${o.etYaz ? o.etYaz(v) : v}</text>`);
      sv += `<line x1="${sol + L * sk}" y1="30" x2="${sol + L * sk}" y2="70" class="cn-sinir"/><text x="${sol + L * sk}" y="24" text-anchor="end" class="cn-et">${o.sonEt || L}</text>`;

    }

      izle.forEach((v, i) => {

        sv += `<path d="M${x1} 62 Q${(x1 + x2) / 2} ${yy} ${x2} 62" class="cn-yay"/><circle cx="${x2}" cy="62" r="4.5" class="${o.renk ? o.renk(v, i + 1) : "cn-o"}"/>`;
        if (izle.length <= 14 || i === izle.length - 1 || i % Math.ceil(izle.length / 10) === 0) sv += `<text x="${x2}" y="${98}" text-anchor="middle" class="cn-et2">${v}</text>`;
      });

      const son = izle.length ? izle[izle.length - 1] : 0, ix = sol + son * sk;
      sv += `<text x="${ix}" y="50" text-anchor="middle" class="cn-kis">${o.simge || "●"}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W} 104" role="img" aria-label="${k} birimlik adımlarla ilerleme">${sv}</svg>`;
    }
    const ileri = () => {
      const v = (n + 1) * k;
      if (v > L) { durdur(); s.dur.innerHTML = `<span class="kotu">■</span> Sonraki ${o.adimAd || "adım"} ${k} ${x} ${n + 1} = <b>${v}</b> olurdu; bu ${E(L,"den")} büyük. ${o.bitti ? o.bitti(n, k, L) : `Toplam ${n} ${o.adimAd || "adım"}; son değer ${n * k}.`}`; if (!izle.length) ciz(); return false; }
      n++; izle.push(v); ciz(); s.dur.innerHTML = o.durum ? o.durum(n, v, k) : `${n}. ${o.adimAd || "adım"}: ${k} ${x} ${n} = <b>${v}</b>`; return true;

      s.dur.innerHTML = m; s.yaz("t" + v, [v, r === 0 ? (ic ? `${k} ${x} ${b} ✔` : `${k} ${x} ${b} (sınır dışı)`) : `kalan ${r} ✘`], r === 0 && ic);

  }

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || [o.kAd || "k", "Boyanan", "En büyük"] });
    let k = o.k || 2, son = o.son;
    const kut = h("div", "cn-satir");

    if (o.sonSec) { const sw = h("div", "cn-hazir"); o.sonSec.forEach(v => { const b = dug(v + " gün", "ghost"); b.onclick = () => { son = v; kur(); temiz(); }; sw.appendChild(b); }); s.den.append(kut, sw); }

      const g = h("div", "cn-izg" + (o.takvim ? " cn-tak" : "")); g.style.gridTemplateColumns = `repeat(${o.sutunSay},1fr)`;

    function temiz() { hucre.forEach(c => c && c.classList.remove("on", "yeni")); s.dur.innerHTML = o.ilk || "Sayıyı seçip Boya düğmesine basın."; }

      }

      s.yaz(k + ":" + son, o.satir ? o.satir(k, say, enb, son) : [k, say, enb], o.iyi ? o.iyi(k, say, enb, son) : null);
      calis = false; bB.disabled = false;

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */
  function ASANSOR(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Açık asansörler", "Gidilen kat", "Gidilemeyen kat"] });
    const ac = o.asansor.map(() => false);
    const kut = h("div", "cn-satir"); const bt = o.asansor.map((a, i) => { const b = dug(a.ad, "ghost"); b.style.setProperty("--ac", a.renk); b.setAttribute("aria-pressed", "false"); b.onclick = () => { ac[i] = !ac[i]; b.setAttribute("aria-pressed", ac[i]); ciz(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    function ciz() {
      let sv = ""; const H = o.kat * 17 + 40; let git = 0, gitme = [];
      for (let f = o.kat; f >= 0; f--) {

        sv += `<rect x="60" y="${y}" width="150" height="15" rx="2" class="${f === 0 ? "cn-zem" : herhangi ? "cn-katon" : (ac.some(Boolean) ? "cn-katoff" : "cn-kat")}"/><text x="52" y="${y + 12}" text-anchor="end" class="cn-et">${f === 0 ? "Z" : f}</text>`;
        o.asansor.forEach((a, i) => { if (dur[i]) sv += `<circle cx="${230 + i * 22}" cy="${y + 7.5}" r="6" fill="${a.renk}"/>`; });
      }
      s.sah.innerHTML = `<svg viewBox="0 0 300 ${H}" style="max-height:440px" role="img" aria-label="${o.kat} katlı bina">${sv}</svg>`;
      const acik = o.asansor.filter((a, i) => ac[i]).map(a => a.ad);

      s.yaz(acik.join("+"), [acik.join(" + "), git, gitme.length], null);

    ciz();
  }

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */
  function SAAT(el, o) {

      let onc = null, snr = null;
      for (let m = bas; m <= bit + ara; m += ara) { if (m <= var_) onc = m; if (m >= var_ && snr == null) snr = m; if (m <= bit) sv += `<text x="${20 + (m - bas) * sk}" y="40" text-anchor="middle" class="cn-bus">🚌</text>`; }

      if (snr != null && snr <= bit + ara) { const sx = 20 + (Math.min(snr, bit) - bas) * sk; sv += `<path d="M${vx} 56 L${sx} 56" class="cn-bek"/>`; }

      const gec = var_ - bas;
      s.dur.innerHTML = `${o.kisi} durağa ${saDa(var_)} geliyor: ilk seferden <b>${gec} dakika</b> sonra. Seferler ${E(ara,"in")} katı olan dakikalarda: ${ara} ${x} ${Math.floor(gec / ara)} = ${Math.floor(gec / ara) * ara}` + (gec % ara ? `, ${ara} ${x} ${Math.floor(gec / ara) + 1} = ${(Math.floor(gec / ara) + 1) * ara}. Sonraki otobüs ${saDa(snr)}; bekleme <b>${snr - var_} dakika</b>.` : `. Tam sefer saatinde geldi; bekleme <b>0 dakika</b>.`);
      s.yaz(ara + ":" + var_, [ara + " dk", sa(var_), sa(onc), sa(snr), (snr - var_) + " dk"], null);
    }
    ciz();
  }

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Çarpanlar", "Çarpan sayısı"] });
    let N = o.N || o.hazir[0]; let bul = new Set(), denendi = new Set();
    const kut = h("div", "cn-satir");
    const sA = adimci("Sayı:", 2, o.max || 200, N, v => { N = v; yeni(); });
    kut.appendChild(sA.w);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => sA.ayarla(n); hz.appendChild(b); }); kut.appendChild(hz); }
    s.den.appendChild(kut);
    const bolen = h("div", "cn-satir cn-test"); bolen.innerHTML = `<label>Bölen deneyin: <input type="number" inputmode="numeric" min="1"></label>`;
    const bD = dug("Böl"), bS = dug("Sıradakini dene", "ghost"); bolen.append(bD, bS); s.den.appendChild(bolen);
    const bi = bolen.querySelector("input");
    let bK = null; if (o.katlar) { bK = dug(o.katDugme || "Katlarını say ▶", "ghost"); s.den.appendChild(bK); }
    const ciftler = h("div", "cn-cift"); const katlar = h("div", "cn-katlar");
    function yeni() { bul = new Set(); denendi = new Set(); ciz(); s.dur.innerHTML = `${N} sayısını 1, 2, 3, … sayılarına bölerek çarpan çiftlerini bulun.`; katlar.textContent = ""; }
    function ciz() {
      const L = [...bul].sort((a, b) => a - b);
      s.sah.innerHTML = ""; const kartlar = h("div", "cn-kartlar");
      L.forEach(v => kartlar.appendChild(h("span", "cn-kart" + (v * v === N ? " kare" : ""), v)));
      if (!L.length) kartlar.appendChild(h("span", "cn-bosk", "Henüz çarpan bulunmadı"));
      s.sah.append(kartlar, ciftler, katlar);
      ciftler.innerHTML = L.filter(v => v * v <= N).map(v => `<span>${v} ${x} ${N / v}${v * v === N ? " <i>(aynı sayı: bir kez yazılır)</i>" : ""}</span>`).join("");
    }
    const tamamMi = () => { for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) return false; return true; };
    const eksik = () => { const L = []; for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) L.push(i); return ` <br>Henüz denenmeyen küçük bölenler var: <b>${L.join(", ")}</b>. Bunları da deneyin.`; };
    function dene(d) {
      if (!d || d < 1) return; denendi.add(d);
      const b = Math.floor(N / d), r = N % d;
      if (d > N) { s.dur.innerHTML = `${d} > ${N}: ${E(N,"den")} büyük sayı ${E(N,"in")} çarpanı olamaz.`; return; }
      if (r === 0) { bul.add(d); bul.add(b); ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${N} : ${d} = ${b}, kalan 0 → <b>${d} ${x} ${b} = ${N}</b>. ${d} ve ${b} çarpandır.` + (d * d >= N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} ${d * d === N ? "=" : ">"} ${N}. Artık yeni çift çıkmaz; bütün çarpanlar bulundu.` : eksik() : ""); }
      else { s.dur.innerHTML = `<span class="kotu">✘</span> ${N} : ${d} işleminde bölüm ${b}, <b>kalan ${r}</b>. ${d}, ${E(N,"in")} çarpanı değildir.` + (d * d > N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} > ${N}. Daha büyük bölen denemeye gerek yok; çarpan listesi tamam.` : eksik() : ""); }
      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));
      if (tamam) s.yaz("n" + N, [N, [...bul].sort((a, b) => a - b).join(", "), bul.size], true);
    }
    bD.onclick = () => dene(Math.round(+bi.value));
    bS.onclick = () => { let d = 1; while (denendi.has(d)) d++; bi.value = d; dene(d); };
    if (bK) bK.onclick = async () => {
      bK.disabled = true; katlar.textContent = ""; const sat = h("div", "cn-katsat"); katlar.append(h("b", "", `${E(N,"in")} katları: `), sat);
      for (let i = 1; i <= (o.katSay || 12); i++) { sat.appendChild(h("span", "cn-kat2", `${N * i}`)); await bekle(220); }
      sat.appendChild(h("span", "cn-sonsuz", "… ve sonsuza kadar sürer"));
      bK.disabled = false;
    };
    yeni();
  }

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */
  function KUMBARA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Para", "Sonuç"] });
    const k = o.k; let hafta = 0, tmr = null;
    const kut = h("div", "cn-satir"); const bA = dug("Bir hafta geçsin +"), bO = dug("▶ Haftaları oynat", "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bO, bS); s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Kumbarada şu para olabilir mi? <input type="number" inputmode="numeric" min="1" max="500"> TL</label>`;
    const bT = dug("Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test); const ti = test.querySelector("input");
    function ciz() {
      const top = hafta * k, sv = [];
      const yuk = Math.min(150, top * 1.4);
      sv.push(`<rect x="110" y="20" width="120" height="160" rx="22" class="cn-kum"/><rect x="150" y="14" width="40" height="8" rx="3" class="cn-kum2"/>`);
      sv.push(`<rect x="116" y="${176 - yuk}" width="108" height="${yuk}" rx="10" class="cn-para"/>`);
      sv.push(`<text x="170" y="110" text-anchor="middle" class="cn-buyuk">${top} TL</text><text x="170" y="134" text-anchor="middle" class="cn-et">${hafta}. hafta</text>`);
      let cizgi = ""; for (let i = 1; i <= hafta && i <= 16; i++) cizgi += `<text x="${260 + ((i - 1) % 4) * 52}" y="${40 + Math.floor((i - 1) / 4) * 34}" class="cn-et2">${k}${x}${i}=${k * i}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 480 190" role="img" aria-label="Kumbara">${sv.join("")}${cizgi}</svg>`;
      s.dur.innerHTML = hafta ? `${hafta}. hafta sonunda kumbarada ${k} ${x} ${hafta} = <b>${top} TL</b> var.` : `Kumbara boş. Her hafta ${k} TL atılıyor.`;
    }
    bA.onclick = () => { hafta++; ciz(); };
    bO.onclick = () => { if (tmr) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } bO.textContent = "❚❚ Durdur"; tmr = setInterval(() => { if (hafta >= 15) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } hafta++; ciz(); }, az ? 50 : 500); };
    bS.onclick = () => { hafta = 0; ciz(); };
    bT.onclick = () => {
      const v = Math.round(+ti.value); if (!v) return; const b = Math.floor(v / k), r = v % k;
      s.dur.innerHTML = r ? `<span class="kotu">✘</span> ${k} ${x} ${b} = ${k * b} TL, ${k} ${x} ${b + 1} = ${k * (b + 1)} TL. ${v} TL arada kalır (${v} : ${k} → kalan ${r}). Kumbarada hiçbir hafta ${v} TL olmaz.`
        : `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · ${b}. hafta sonunda kumbarada tam ${v} TL olur.`;
      if (!r) { hafta = b; ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · <b>${b}. hafta</b> sonunda kumbarada tam ${v} TL olur.`; }
      s.yaz("t" + v, [v + " TL", r ? `kalan ${r} ✘` : `${k} ${x} ${b} ✔`], !r);
    };
    ciz();
  }

  /* 9) ÖNERME LABORATUVARI: önermeyi farklı sayılarla sınama */
  function ONERME(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Önerme", "Sayı", "Sonuç"] });
    let akt = 0; const kut = h("div", "cn-hazir");
    const bt = o.onermeler.map((on, i) => { const b = dug(on.ad, "ghost"); b.setAttribute("aria-pressed", i === 0); b.onclick = () => { akt = i; bt.forEach((x, j) => x.setAttribute("aria-pressed", j === i)); goster(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Sınanacak sayı: <input type="number" inputmode="numeric" min="1" max="200" value="12"></label>`;
    const bT = dug("Sına"), bR = dug("Rastgele sayı", "ghost"); test.append(bT, bR); s.den.appendChild(test); const ti = test.querySelector("input");
    function goster() { s.sah.innerHTML = `<div class="cn-onr"><b>${o.onermeler[akt].ad}:</b> “${o.onermeler[akt].metin}”</div>`; s.dur.innerHTML = "Bir sayı yazıp Sına düğmesine basın. Önerme her sayıda doğru mu?"; }
    function sina(n) {
      const on = o.onermeler[akt], r = on.sina(n);
      s.sah.innerHTML = `<div class="cn-onr"><b>${on.ad}:</b> “${on.metin}”</div><div class="cn-kanit">${r.goster}</div>`;
      s.dur.innerHTML = (r.ok ? `<span class="iyi">✔</span> ${n} için önerme doğru.` : `<span class="kotu">✘</span> ${n} için önerme yanlış! Bir karşı örnek bulundu.`) + (r.not ? " " + r.not : "");
      s.yaz(akt + ":" + n, [on.ad, n, r.ok ? "doğru" : "yanlış (karşı örnek)"], r.ok);
    }
    bT.onclick = () => { const n = Math.round(+ti.value); if (n > 0) sina(n); };
    bR.onclick = () => { const n = 2 + Math.floor(Math.random() * 59); ti.value = n; sina(n); };
    goster();
  }


  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →
     koşullar tek tek denetlenir (✔/✘) → deney defterine yazılır. Doğru cevap verilmez; öğrenci uygun girdiyi kendisi arar.
     o.girdi: [{ad, min, max, bas} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → SVG/HTML · o.kosullar: [{ad, f(v) → bool | {ok, not}}]
     o.dugme: düğme yazısı (false → her değişiklikte denetlenir) · o.sonuc(v, hepsi, L) · o.satir(v, hepsi, L) · o.iyi(v, L) · o.ek: [{ad, deger(v) → v}] */
  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);
      s.dur.innerHTML = m;
      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);
    }
    kur = true; ciz();
    if (bS) s.dur.innerHTML = o.ilk || "Değerleri seçip Sına düğmesine basın."; else sina();
  }

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

/* MAT.7.4.9 · Eşkenar Dörtgenin ve Yamuğun Alanı — bağlam sorularının "Canlandır" düzenekleri (16.10.2026) — ortak motor: canlandir.js (CN.KOSUL); yeni motor yok.
   Her düzenek: öğrenci düğmelerle ya da − / + sayaçlarıyla durumu değiştirir → şekil anında çizilir → koşullar denetlenir → deneme deney defterine
   yazılır → yeniden dener. Doğru cevap bir düğmeyle verilmez; denemelerden çıkar (§4.k, §19-10). Sıra bag749.BAGLAM sırasıdır (r01 … r20). */
window.CANL = (() => {
  if (!document.getElementById("c749-stil")) { const st = document.createElement("style"); st.id = "c749-stil";
    st.textContent = ".cn-btn{min-width:44px;min-height:44px}.cn-adimci button{min-width:44px;min-height:44px}.cn-secg button{min-height:44px}.c749-k{text-align:center;font-size:17px;font-weight:800;margin:8px auto;max-width:640px;line-height:1.6}"; document.head.appendChild(st); }
  const D = v => String(Math.round(v * 100) / 100).replace(".", ",");
  const svg = (w, h, ic) => `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w * 1.4}px;height:auto;display:block;margin:0 auto">${ic}</svg>`;
  const tx = (x, y, s, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.an || "middle"}" style="font-size:${o.fs || 14}px;font-weight:800;fill:${o.r || "#1d2433"};paint-order:stroke;stroke:#fff;stroke-width:4px">${s}</text>`;
  const pl = (P, r = "#1c5fbf", f = "#d0e3fb", w = 2.4, k = "") => `<polygon points="${P.map(p => p.join(",")).join(" ")}" fill="${f}" stroke="${r}" stroke-width="${w}" stroke-linejoin="round"${k ? ` stroke-dasharray="${k}"` : ""}/>`;
  const dp = (P, Q, r = "#1d2433", w = 2.2, k = "") => `<line x1="${P[0]}" y1="${P[1]}" x2="${Q[0]}" y2="${Q[1]}" stroke="${r}" stroke-width="${w}" stroke-linecap="round"${k ? ` stroke-dasharray="${k}"` : ""}/>`;
  const zem = (n, m, u, ox = 10, oy = 10) => { let g = ""; for (let i = 0; i <= n; i++) g += dp([ox + i * u, oy], [ox + i * u, oy + m * u], "#d5dbe7", 1); for (let j = 0; j <= m; j++) g += dp([ox, oy + j * u], [ox + n * u, oy + j * u], "#d5dbe7", 1); return g; };
  const alan = P => { let s = 0; P.forEach((p, i) => { const q = P[(i + 1) % P.length]; s += p[0] * q[1] - q[0] * p[1]; }); return Math.abs(s) / 2; };

    18: el => { const A = { I: ["Dikdörtgen: 8 · 6 = 48", true], II: ["Üçgenin tabanı 6, yüksekliği 2", true], III: ["Üçgen: 6 · 2 = 12", false], IV: ["Toplam: 48 + 12 = 60", true] };
      return KO(el, { yon: "Bir adım seçiniz; adım kareli zemindeki şekille sınanır.", bitis: "Hatalı adımı bulup doğru alanı görünce.",
        girdi: [{ ad: "Adım:", sec: Object.keys(A), bas: "I" }],
        ciz: v => { const X = G(20, 6); return svg(240, 140, zem(10, 6, 20) + pl([[0, 0], [8, 0], [10, 3], [8, 6], [0, 6]].map(X)) + dp(X([8, 0]), X([8, 6]), "#d9480f", 2, "5 4")) + kutu(`${v[0]}. adım: ${A[v[0]][0]}` + (v[0] === "III" ? " · Doğrusu 6 · 2 : 2 = 6; alan 48 + 6 = 54 br²" : "")); },
        kosullar: [{ ad: v => `${v[0]}. adımda hata var.`, f: v => !A[v[0]][1] }], sutun: ["Adım", "Yazılan", "Hata"], satir: (v, ok) => [v[0], A[v[0]][0], ok ? "Var" : "Yok"] }); },
    /* 19 · Dört dik üçgenden dikdörtgen */
    19: el => { const R = { "8 cm × 10 cm": [8, 10, true], "16 cm × 5 cm": [16, 5, true], "16 cm × 10 cm": [16, 10, false] };
      return KO(el, { yon: "Bir dikdörtgen düzeni seçiniz; dört dik üçgenin (dik kenarlar 8 cm ve 5 cm) onu doldurup doldurmadığı gösterilir.", bitis: "Uzun kenarı 16 cm olan dikdörtgenin çevresini bulunca.",
        girdi: [{ ad: "Dikdörtgen:", sec: Object.keys(R), bas: "16 cm × 10 cm" }],
        ciz: v => { const [a, b, ok] = R[v[0]], k = 12; let h = `<rect x="10" y="10" width="${a * k}" height="${b * k}" fill="${ok ? "#d3f9d8" : "#ffe3e3"}" stroke="#495057" stroke-width="2"/>`; return svg(a * k + 20, b * k + 20, h) + kutu(`Alan ${a * b} cm² (gereken 80 cm²) · Çevre 2 · (${a} + ${b}) = ${2 * (a + b)} cm`); },
        kosullar: [{ ad: "Dört üçgen dikdörtgeni boşluksuz dolduruyor.", f: v => R[v[0]][2] }, { ad: "Uzun kenar 16 cm.", f: v => R[v[0]][0] === 16 }], sutun: ["Dikdörtgen", "Alan", "Çevre"], satir: v => [v[0], R[v[0]][0] * R[v[0]][1], 2 * (R[v[0]][0] + R[v[0]][1])] }); },
    /* 20 · Kutu oyunu kartları */
    20: el => { const S = { "Kare biçimli eşkenar dörtgen": [[0, 2], [2, 4], [4, 2], [2, 0]], "Tabanları 5 ve 3 olan yamuk": [[0, 0], [5, 0], [4, 2], [1, 2]], "Tabanları 6 ve 2 olan yamuk": [[0, 0], [6, 0], [4, 2], [2, 2]], "Tabanları 4 ve 2 olan yamuk": [[0, 0], [4, 0], [3, 3], [1, 3]] };
      return KO(el, { yon: "Bir kart seçiniz; şeklin alanı kareli zeminden hesaplanır.", bitis: "Alanı öbürlerinden farklı kartı bulunca.",
        girdi: [{ ad: "Kart:", sec: Object.keys(S), bas: "Kare biçimli eşkenar dörtgen" }],
        ciz: v => { const X = G(24, 4); return svg(180, 120, zem(6, 4, 24) + pl(S[v[0]].map(X))) + kutu(`${v[0]}: ${D(alan(S[v[0]]))} br²`); },
        kosullar: [{ ad: "Alanı 8 br²'den farklı.", f: v => alan(S[v[0]]) !== 8 }], sutun: ["Kart", "Alan"], satir: v => [v[0], D(alan(S[v[0]]))] }); },
  };

const V={"baslik": "Eşkenar Dörtgenin ve Yamuğun Alanı", "kod": "7. SINIF · MAT.7.4.9", "ses": "", "bet": "BAĞLAM TEMELLİ SORU", "bad": "Bağlam Soruları", "s": [{"no": 1, "bas": "Varsayımdan başlamak", "q": [{"k": "Kareli zeminde yatay köşegeni 8 birim, dikey köşegeni 4 birim olan bir eşkenar dörtgen çiziniz. Birim kareleri sayarak alanın hangi iki sayı arasında olduğunu bulunuz ve alanı tahmin ediniz.", "a": ["Tamamı içeride kalan kareler 8, parçalı kareler 16 tanedir.", "Alan 8 br² ile 24 br² arasındadır.", "Parçalı kareler ikişer ikişer birleştirilir: 8 + 16 : 2 = 16. Tahmin yaklaşık 16 br²."], "c": "8 br² ile 24 br² arasında; yaklaşık 16 br²"}, {"k": "Kareli zeminde kenarları 5 birim olan iki eşkenar dörtgen çizilmiştir. Hangisinin alanı daha büyüktür? Çevreleyen dikdörtgenlerden yararlanarak gerekçesiyle açıklayınız.<br><svg style=\"width:74mm;max-width:100%;height:auto;display:block;margin:1mm 0\" viewBox=\"0 0 364 108\" width=\"364\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"22.0\" y1=\"22\" x2=\"22.0\" y2=\"86\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"38.0\" y1=\"22\" x2=\"38.0\" y2=\"86\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"54.0\" y1=\"22\" x2=\"54.0\" y2=\"86\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"70.0\" y1=\"22\" x2=\"70.0\" y2=\"86\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"86.0\" y1=\"22\" x2=\"86.0\" y2=\"86\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"102.0\" y1=\"22\" x2=\"102.0\" y2=\"86\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"118.0\" y1=\"22\" x2=\"118.0\" y2=\"86\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"134.0\" y1=\"22\" x2=\"134.0\" y2=\"86\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"150.0\" y1=\"22\" x2=\"150.0\" y2=\"86\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"166.0\" y1=\"22\" x2=\"166.0\" y2=\"86\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"182.0\" y1=\"22\" x2=\"182.0\" y2=\"86\" stroke=\"#d5dbe7\" stroke-width= 0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"270.0\" y=\"58.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#d9480f\" text-anchor=\"middle\">2. şekil</text></svg>", "a": ["1. şekil: Çevreleyen dikdörtgen 9 · 3 = 27 br²; iki yandaki dik üçgenler 2 · (4 · 3 : 2) = 12 br². Alan 27 − 12 = 15 br².", "2. şekil: Çevreleyen dikdörtgen 8 · 4 = 32 br²; iki dik üçgen 2 · (3 · 4 : 2) = 12 br². Alan 32 − 12 = 20 br².", "Kenarlar eşit olsa da daha az yatırılmış olan 2. şeklin alanı daha büyüktür."], "c": "2. şekil (20 br² > 15 br²)"}]}, {"no": 2, "bas": "Eşkenar dörtgenin alan bağıntısı", "q": [{"k": "Bir eşkenar dörtgenin köşegenlerinin yarıları 4 cm ve 5 cm'dir. Alanını iki farklı yolla bulunuz.", "a": ["1. yol: Dört dik üçgen, her biri 4 · 5 : 2 = 10 cm²; 4 · 10 = 40 cm².", "2. yol: Köşegenler 8 cm ve 10 cm; 8 · 10 : 2 = 40 cm².", "İki yol aynı sonucu verir."], "c": "40 cm²"}, {"k": "Alanı 39 cm², köşegenlerinden biri 6 cm olan eşkenar dörtgenin öbür köşegeni kaç santimetredir?", "a": ["Köşegenlerin çarpımı alanın iki katıdır: 2 · 39 = 78.", "Öbür köşegen 78 : 6 = 13 cm.", "Kontrol: 6 · 13 : 2 = 39."], "c": "13 cm"}]}, {"no": 3, "bas": "Kenar, yükseklik ve kare", "q": [{"k": "Bir eşkenar dörtgenin bir kenarı 9 cm, bu kenara ait yüksekliği 7 cm'dir. Eşkenar dörtgenin alanı kaç santimetrekaredir? Öbür kenarlara ait yükseklikler kaç santimetredir?", "a": ["Eşkenar dörtgen bir paralelkenardır: alan = 9 · 7 = 63 cm².", "Dört kenar eşit, alan aynı olduğundan bütün yükseklikler eşittir.", "Öbür yükseklikler de 7 cm'dir."], "c": "63 cm²; 7 cm"}, {"k": "Bir eşkenar dörtgenin bir kenarı 10 cm, bir yüksekliği 9,6 cm'dir. Köşegenlerinden biri 12 cm ise öbür köşegeni kaç santimetredir?", "a": ["Kenar ve yükseklikle alan: 10 · 9,6 = 96 cm².", "Köşegenlerle alan: 12 · x : 2 = 96, 6 · x = 96.", "x = 16 cm."], "c": "16 cm"}]}, {"no": 4, "bas": "Yamuk için varsayım", "q": [{"k": "Kareli zeminde ABCD ve KLMN yamukları çizilmiştir. Her yamu h=\".9\"/><line x1=\"326.0\" y1=\"22\" x2=\"326.0\" y2=\"86\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"342.0\" y1=\"22\" x2=\"342.0\" y2=\"86\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"22\" y1=\"22.0\" x2=\"342\" y2=\"22.0\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"22\" y1=\"38.0\" x2=\"342\" y2=\"38.0\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"22\" y1=\"54.0\" x2=\"342\" y2=\"54.0\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"22\" y1=\"70.0\" x2=\"342\" y2=\"70.0\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"22\" y1=\"86.0\" x2=\"342\" y2=\"86.0\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><polygon points=\"22.0,86.0 118.0,86.0 86.0,38.0 38.0,38.0\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/><polygon points=\"198.0,86.0 262.0,86.0 326.0,22.0 278.0,22.0\" fill=\"#ffd8a8\" stroke=\"#d9480f\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/><circle cx=\"22.0\" cy=\"86.0\" r=\"3.2\" fill=\"#111111\"/><text x=\"12.1\" y=\"101.3\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"118.0\" cy=\"86.0\" r=\"3.2\" fill=\"#111111\"/><text x=\"127.9\" y=\"101.3\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"86.0\" cy=\"38.0\" r=\"3.2\" fill=\"#111111\"/><text x=\"95.9\" y=\"33.5\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><circle cx=\"38.0\" cy=\"38.0\" r=\"3.2\" fill=\"#111111\"/><text x=\"28.1\" y=\"33.5\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">D</text><circle cx=\"198.0\" cy=\"86.0\" r=\"3.2\" fill=\"#111111\"/><text x=\"188.1\" y=\"101.3\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">K</text><circle cx=\"262.0\" cy=\"86.0\" r=\"3.2\" fill=\"#111111\"/><text x=\"271.9\" y=\"101.3\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">L</text><circle cx=\"326.0\" cy=\"22.0\" r=\"3.2\" fill=\"#111111\"/><text x=\"335.9\" y=\"17.5\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">M</text><circle cx=\"278.0\" cy=\"22.0\" r=\"3.2\" fill=\"#111111\"/><text x=\"268.1\" y=\"17.5\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">N</text></svg>", "a": ["ABCD: Tabanlar AB = 6 birim ve DC = 3 birim; yükseklik 3 birim.", "KLMN: Tabanlar KL = 4 birim ve NM = 3 birim; yükseklik 4 birim.", "KLMN'de üst taban alt tabanın sağına taşar; N'den indirilen dikme KL'nin uzantısına düşer."], "c": "ABCD: 6, 3, h 3; KLMN: 4, 3, h 4; KLMN'de dışarı düşer"}, {"k": "Tabanları 2 cm ve 8 cm, yüksekliği 7 cm olan bir yamuğun alanı hangi iki değer arasındadır? Alanı “tabanların ortalaması · yükseklik” varsayımıyla tahmin ediniz.", "a": ["Kısa tabanlı dikdörtgen: 2 · 7 = 14 cm²; uzun tabanlı dikdörtgen: 8 · 7 = 56 cm².", "Alan 14 cm² ile 56 cm² arasındadır.", "Tabanların ortalaması (2 + 8) : 2 = 5; 5 · 7 = 35 cm²."], "c": "14 cm² ile 56 cm² arasında; tahmin 35 cm²"}]}, {"no": 5, "bas": "Yamuğun alan bağıntısı", "q": [{"k": "Tabanları 8 cm ve 14 cm, yüksekliği 5 cm olan bir yamuğun alanını bir köşegenle iki üçgene ayırarak bulunuz. Sonucu yamuğun alan bağıntısıyla karşılaştırınız.", "a": ["Uzun tabanlı üçgen: 14 · 5 : 2 = 35 cm².", "Kısa tabanlı üçgen: 8 · 5 : 2 = 20 cm². Toplam 55 cm².", "Bağıntı: (8 + 14) · 5 : 2 = 55 cm². Sonuçlar eşittir."], "c": "55 cm²"}, {"k": "Bir öğrenci yamuğu bir köşegenle iki üçgene ayırmış ve iki üçgenin de yüksekliğini yamuğun yüksekliği olarak almıştır. Bu neden doğrudur? Açıklayınız.", "a": ["Bir üçgenin tabanı alt taban, tepesi üst tabanın üzerindedir; öbür üçgenin tabanı üst taban, tepesi alt tabanın üzerindedir.", "Tabanlar paralel olduğundan tepeden karşı tabana inen dikme, iki paralel doğru arasındaki uzaklıktır.", "Aynı paralel doğrular arasındaki dikmeler eşittir; ikisi de yamuğun yüksekliğidir."], "c": "Tabanlar paralel; dikmeler eşit"}]}, {"no": 6, "bas": "Eksik uzunluk ve özel yamuklar", "q": [{"k": "Alanı 70 cm², tabanları 9 cm ve 5 cm olan bir yamuğun yüksekliği kaç santimetredir?", "a": ["Tabanların toplamı 9 + 5 = 14 cm.", "(9 + 5) · h = 2 · 70 = 140.", "h = 140 : 14 = 10 cm."], "c": "10 cm"}, {"k": "Kare, paralelkenar, eşkenar dörtgen, yalnız bir çift karşılıklı kenarı paralel olan dörtgen ve hiçbir kenarı paralel olmayan dörtgenden hangileri yamuktur? Alanları yamuğun alan bağıntısıyla bulunabilir mi? Gerekçesiyle açıklayınız.", "a": ["Yamuğun en az bir çift karşılıklı kenarı paraleldir.", "Kare, paralelkenar, eşkenar dörtgen ve bir çift kenarı paralel dörtgen bu özelliği taşır; dördü de yamuktur ve alanları yamuk bağıntısıyla bulunabilir.", "Hiçbir kenarı paralel olmayan dörtgen yamuk değildir; tabanı olmadığı için bağıntı kullanılamaz."], "c": "İlk dördü yamuk; sonuncusu değil"}]}, {"no": 7, "bas": "Başka şekillerin alanı", "q": [{"k": "Kareli zemindeki beşgenin alanını önce bir kare ve bir üçgene, sonra iki yamuğa ayırarak bulunuz. Sonuçları karşılaştırınız.<br><svg style=\"width:40mm;max-width:100%;height:auto;display:block;margin:1mm 0\" viewBox=\"0 0 188 140\" width=\"188\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"22.0\" y1=\"22\" x2=\"22.0\" y2=\"118\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"38.0\" y1=\"22\" x2=\"38.0\" y2=\"118\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"54.0\" y1=\"22\" x2=\"54.0\" y2=\"118\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"70.0\" y1=\"22\" x2=\"70.0\" y2=\"118\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"86.0\" y1=\"22\" x2=\"86.0\" y2=\"118\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line umda kare biçimindedir. Çerçeve yana doğru yatırılarak 2. durumdaki eşkenar dörtgen biçimine getirilmiştir. 2. durumda alt ve üst kenarlar arasındaki uzaklık 6 cm'dir.</p>", "g": "<svg viewBox=\"0 0 388.7895340876794 162\" width=\"389\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"26.0,130.0 130.0,130.0 130.0,26.0 26.0,26.0\" fill=\"#fff4e6\" stroke=\"#8a6d1d\" stroke-width=\"3\" stroke-linejoin=\"round\"/><rect x=\"58.9\" y=\"135.5\" width=\"38.2\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"78.0\" y=\"149.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">8 cm</text><text x=\"78.0\" y=\"18.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">1. durum</text><polygon points=\"190.0,130.0 294.0,130.0 362.8,52.0 258.8,52.0\" fill=\"#fff4e6\" stroke=\"#8a6d1d\" stroke-width=\"3\" stroke-linejoin=\"round\"/><line x1=\"258.8\" y1=\"52.0\" x2=\"258.8\" y2=\"130.0\" stroke=\"#6741d9\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><polyline points=\"265.8,130.0 265.8,123.0 258.8,123.0\" fill=\"none\" stroke=\"#6741d9\" stroke-width=\"1.4\"/><rect x=\"222.9\" y=\"135.5\" width=\"38.2\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"242.0\" y=\"149.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">8 cm</text><rect x=\"261.7\" y=\"81.5\" width=\"38.2\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"280.8\" y=\"95.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">6 cm</text><text x=\"276.4\" y=\"18.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2. durum</text></svg>", "son": "", "k": "Buna göre, çerçevenin içinde kalan alan 1. durumdan 2. duruma geçince kaç santimetrekare azalmıştır?", "sec": ["0", "28", "16", "36"], "secg": null, "c": "C", "a": ["1. durum: Kare, 8 · 8 = 64 cm².", "2. durum: Eşkenar dörtgen bir paralelkenardır; alan = kenar · yükseklik = 8 · 6 = 48 cm².", "Azalma: 64 − 48 = 16 cm²."], "t": "0: kenarlar değişmediği için alanın da değişmediği sanılmış; 28: 64 − 36 yapılmış; 36: yükseklik kenar sanılıp 6 · 6 alınmış", "d": "Kenarlar değişmese de alan değişir. Yatırılmış çerçevenin alanı kenar ile o kenara ait yüksekliğin çarpımıdır; eğik kenarı yükseklik sanmayınız.", "ses": "b04"}, {"no": 5, "on": "<p>Yusuf, eş iki yamuk kartondan birini yarım tur döndürüp öbürünün yanına yerleştirerek bir paralelkenar oluşturmuştur. Paralelkenarın alanı 96 cm², yüksekliği 6 cm'dir. Yamukların alt tabanı 9 cm'dir.</p>", "g": "<svg viewBox=\"0 0 177 138\" width=\"177\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"30.0,108.0 147.0,108.0 108.0,30.0 56.0,30.0\" fill=\"#e7f5ff\" stroke=\"#1c5fbf\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/><line x1=\"56.0\" y1=\"30.0\" x2=\"56.0\" y2=\"108.0\" stroke=\"#6741d9\" stroke-width=\"2\" stroke-linecap=\"round\"/><polyline points=\"64.0,108.0 64.0,100.0 56.0,100.0\" fill=\"none\" stroke=\"#6741d9\" stroke-width=\"1.4\"/><rect x=\"60.9\" y=\"59.5\" width=\"38.2\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"80.0\" y=\"73.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">6 cm</text><rect x=\"69.4\" y=\"113.5\" width=\"38.2\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"88.5\" y=\"127.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">9 cm</text><rect x=\"62.9\" y=\"5.5\" width=\"38.2\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"82.0\" y=\"19.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">? cm</text></svg>", "son": "", "k": "Buna göre, yamuğun üst tabanı kaç santimetredir?", "sec": ["7", "16", "23", "8"], "secg": null, "c": "A", "a": ["Paralelkenarın tabanı yamuğun iki tabanının toplamıdır: 96 : 6 = 16 cm.", "Üst taban 16 − 9 = 7 cm."], "t": "16: tabanların toplamı yazılmış; 23: 96 yamuğun alanı sanılıp (9 + x) · 6 : 2 = 96 çözülmüş; 8: alan önce ikiye bölünüp 48 : 6 tabanların toplamı sanılmış", "d": "Paralelkenarın tabanı, yamuğun iki tabanının toplamıdır. Paralelkenarın alanını yüksekliğe bölünce tabanların toplamı bulunur.", "ses": "b05"}, {"no": 6, "on": "<p>Bir sınıfta öğrenciler eşkenar dörtgen ve yamuğun alan bağıntılarıyla ilgili önermeleri kartlara yazmıştır. Uzunluklar santimetre, alanlar santimetrekare cinsindendir.</p>", "g": "<svg viewBox=\"0 0 470 194\" width=\"470\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"14\" y=\"14\" width=\"216\" height=\"72\" rx=\"10\" fill=\"#fff\" stroke=\"#6741d9\" stroke-width=\"1.8\"/><text x=\"28.0\" y=\"35.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"900\" fill=\"#6741d9\" text-anchor=\"start\">A</text><text x=\"122.0\" y=\"58.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Köşegenleri 6 ve 10 olan eşkenar</text><text x=\"122.0\" y=\"77.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">dörtgenin alanı 30'dur.</text><rect x=\"242\" y=\"14\" width=\"216\" height=\"72\" rx=\"10\" fill=\"#fff\" stroke=\"#6741d9\" stroke-width=\"1.8\"/><text x=\"256.0\" y=\"35.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"900\" fill=\"#6741d9\" text-anchor=\"start\">B</text><text x=\"350.0\" y=\"58.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Tabanları 3 ve 7, yüksekliği 4</text><text x=\"350.0\" y=\"77.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">olan yamuğun alanı 20'dir.</text><rect x=\"14\" y=\"98\" width=\"216\" height=\"72\" rx=\"10\" fill=\"#fff\" stroke=\"#6741d9\" stroke-width=\"1.8\"/><text x=\"28.0\" y=\"119.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"900\" fill=\"#6741d9\" text-anchor=\"start\">C</text><text x=\"122.0\" y=\"142.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Kenarı 5 olan her eşkenar</text><text x=\"122.0\" y=\"161.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">dörtgenin alanı 25'tir.</text><rect x=\"242\" y=\"98\" width=\"216\" height=\"72\" rx=\"10\" fill=\"#fff\" stroke=\"#6741d9\" stroke-width=\"1.8\"/><text x=\"256.0\" y=\"119.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"900\" fill=\"#6741d9\" text-anchor=\"start\">D</text><text x=\"350.0\" y=\"142.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Köşegeni 6 olan karenin</text><text x=\"350.0\" y=\"161.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">alanı 18'dir.</text></svg>", "son": "", "k": "Buna göre, hangi karttaki önerme <u>yanlıştır</u>?", "sec": ["A", "C", "B", "D"], "secg": null, "c": "B", "a": ["A: 6 · 10 : 2 = 30, doğru. B: (3 + 7) · 4 : 2 = 20, doğru. D: 6 · 6 : 2 = 18, doğru.", "C: Kenarı 5 cm olan eşkenar dörtgenin alanı ne kadar yatırıldığına bağlıdır; yalnız kare ise 25 cm²'dir. Önerme yanlıştır."], "t": "A, B ve D bağıntılarla doğrulanır; C'de kenar · kenar yalnız karede geçerlidir", "d": "Bir önermenin doğru olması için her durumda doğru olması gerekir. Kenar · kenar bağıntısının hangi eşkenar dörtgende geçerli olduğunu düşününüz.", "ses": "b06"}, {"no": 7, "on": "<p>Bir çini atölyesinde kenarı 18 cm olan kare bir karonun kenarlarının orta noktaları birleştirilerek mavi bir eşkenar dörtgen çizilmiştir. Eşkenar dörtgenin ortasına kenarı 6 cm olan beyaz bir kare yerleştirilmiştir.</p>", "g": "<svg viewBox=\"0 0 214 220\" width=\"214\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"26\" y=\"26\" width=\"162\" height=\"162\" fill=\"#fff4e6\" stroke=\"#8a6d1d\" stroke-width=\"2\"/><polygon points=\"26.0,107.0 107.0,26.0 188.0,107.0 107.0,188.0\" fill=\"#a5d8ff\" stroke=\"#1c5fbf\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"80.0,80.0 134.0,80.0 134.0,134.0 80.0,134.0\" fill=\"#fff\" stroke=\"#8a6d1d\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><rect x=\"84.2\" y=\"193.5\" width=\"45.7\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"107.0\" y=\"207.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">18 cm</text><rect x=\"87.9\" y=\"137.5\" width=\"38.2\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"107.0\" y=\"151.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">6 cm</text></svg>", "son": "", "k": "Buna göre, karonun mavi boyalı kısmının alanı kaç santimetrekaredir?", "sec": ["162", "288", "45", "126"], "secg": null, "c": "D", "a": ["Eşkenar dörtgenin köşegenleri karonun kenarına eşittir: 18 cm ve 18 cm.", "Eşkenar dörtgen: <span class=\"frac\"><span>18 · 18</span><span>2</span></span> = 162 cm².", "Beyaz kare 6 · 6 = 36 cm²; mavi kısım 162 − 36 = 126 cm²."], "t": "162: beyaz kare çıkarılmamış; 288: karonun alanından 36 çıkarılmış; 45: eşkenar dörtgen karonun dörtte biri (81 cm²) sanılmış", "d": "Kenar orta noktalarını birleştiren eşkenar dörtgenin köşegenleri karonun kenarlarına eşittir. Mavi kısım için b dle\">C</text><circle cx=\"176.0\" cy=\"154.0\" r=\"3.2\" fill=\"#111111\"/><text x=\"186.6\" y=\"170.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">D</text></svg>", "son": "", "k": "Buna göre, flamanın yüksekliği kaç birimdir ve alanı kaç br²'dir?", "sec": ["3 birim · 13,5 br²", "6 birim · 27 br²", "6 birim · 54 br²", "7 birim · 31,5 br²"], "secg": null, "c": "B", "a": ["Paralel kenarlar AB ve DC dikeydir; tabanlardır: |AB| = 6, |DC| = 3 birim.", "Yükseklik, iki dikey taban arasındaki yatay uzaklıktır: 6 birim.", "Alan = <span class=\"frac\"><span>(6 + 3) · 6</span><span>2</span></span> = 27 br²."], "t": "3 birim: kısa taban yükseklik sanılmış; 54 br²: ikiye bölünmemiş; 7 birim: eğik yan kenar uzunluğu tahminle yükseklik sanılmış", "d": "Flamada paralel kenarlar dikeydir; bunlar tabanlardır. Yükseklik, tabanlar arasındaki yatay uzaklıktır.", "ses": "b09"}, {"no": 10, "on": "<p>Bir okul tiyatrosunun dekoru için yamuk biçiminde bir duvar maketi hazırlanacaktır. Maketin tabanları 13 m ve 5 m, yüksekliği 6 m olan gerçek bir duvarı temsil ettiği biliniyor. Öğrenciler gerçek duvarın alanını hesaplamadan önce alanın hangi iki değer arasında olduğunu belirlemiştir.</p>", "g": "<svg viewBox=\"0 0 242 144\" width=\"242\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"30.0,114.0 212.0,114.0 142.0,30.0 72.0,30.0\" fill=\"#e9ecef\" stroke=\"#495057\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/><line x1=\"72.0\" y1=\"30.0\" x2=\"72.0\" y2=\"114.0\" stroke=\"#6741d9\" stroke-width=\"2\" stroke-linecap=\"round\"/><polyline points=\"80.0,114.0 80.0,106.0 72.0,106.0\" fill=\"none\" stroke=\"#6741d9\" stroke-width=\"1.4\"/><rect x=\"76.7\" y=\"62.5\" width=\"30.6\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"92.0\" y=\"76.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">6 m</text><rec \" stroke-linecap=\"round\"/><polyline points=\"176.2,75.9 171.4,82.3 177.8,87.1\" fill=\"none\" stroke=\"#6741d9\" stroke-width=\"1.4\"/><circle cx=\"34.0\" cy=\"98.8\" r=\"3.2\" fill=\"#111111\"/><text x=\"19.0\" y=\"104.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"120.4\" cy=\"34.0\" r=\"3.2\" fill=\"#111111\"/><text x=\"120.4\" y=\"24.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"206.8\" cy=\"98.8\" r=\"3.2\" fill=\"#111111\"/><text x=\"221.8\" y=\"104.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><circle cx=\"120.4\" cy=\"163.6\" r=\"3.2\" fill=\"#111111\"/><text x=\"120.4\" y=\"184.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">D</text><circle cx=\"182.6\" cy=\"80.7\" r=\"3.2\" fill=\"#111111\"/><text x=\"193.2\" y=\"75.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">H</text></svg>", "son": "", "k": "Buna göre, levhanın masadan en üst noktasının yüksekliği (levhanın bir kenarına ait yüksekliği) kaç santimetredir?", "sec": ["30", "36", "28,8", "18"], "secg": null, "c": "C", "a": ["Köşegenlerle alan: <span class=\"frac\"><span>48 · 36</span><span>2</span></span> = 864 cm².", "Eşkenar dörtgen bir paralelkenardır: 30 · h = 864.", "h = 864 : 30 = 28,8 cm."], "t": "30: kenar yükseklik sanılmış; 36: kısa köşegen yükseklik sanılmış; 18: kısa köşegenin yarısı yükseklik sanılmış", "d": "Aynı alanı köşegenlerle ve kenar · yükseklikle yazıp eşitleyiniz. Kenar yükseklikten uzundur; kenarı yükseklik yerine kullanmayınız.", "ses": "b11"}, {"no": 12, "on": "<p>Bir sınıf panosu 40 cm'ye 30 cm boyutlarında dikdörtgendir. Panonun kenarlarının orta noktaları m b13"}, {"no": 14, "on": "<p>Kâğıttan yapılmış bir yelpaze açıldığında, yan yana dizilmiş 5 eş yamuk dilimden oluşmaktadır. Her dilimin tabanları 8 cm ve 5 cm, yüksekliği 10 cm'dir.</p>", "g": "<svg viewBox=\"0 0 452 160\" width=\"452\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"26.0,126.0 106.0,126.0 91.0,26.0 41.0,26.0\" fill=\"#ffd8a8\" stroke=\"#d9480f\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"121.0,126.0 171.0,126.0 186.0,26.0 106.0,26.0\" fill=\"#ffe8cc\" stroke=\"#d9480f\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"186.0,126.0 266.0,126.0 251.0,26.0 201.0,26.0\" fill=\"#ffd8a8\" stroke=\"#d9480f\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"281.0,126.0 331.0,126.0 346.0,26.0 266.0,26.0\" fill=\"#ffe8cc\" stroke=\"#d9480f\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><polygon points=\"346.0,126.0 426.0,126.0 411.0,26.0 361.0,26.0\" fill=\"#ffd8a8\" stroke=\"#d9480f\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><rect x=\"46.9\" y=\"131.5\" width=\"38.2\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"66.0\" y=\"145.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">8 cm</text><rect x=\"46.9\" y=\"3.5\" width=\"38.2\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"66.0\" y=\"17.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">5 cm</text><rect x=\"1.2\" y=\"66.5\" width=\"45.7\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"24.0\" y=\"80.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">10 cm</text></svg>", "son": "", "k": "Buna göre, yelpazenin kâğıt kısmının alanı kaç santimetrekaredir?", "sec": ["325", "65", "650", "400"], "secg": null, "c": "A", "a": ["Bir dilim: <span class=\"frac\"><span>(8 + 5) · 10</span><span>2</span></span> = 65 cm².", "5 dilim: 5 · 65 = 325 cm²."], "t": "65: bir dilim; 650: ikiye bölünmemiş; 400: uzun taban · yükseklik · 5 alınmış", "d": "Önce bir dilimin alanını yamuk bağıntısıyla bulunuz, sonra dilim sayısıyla çarpınız. Tabanları toplayınız, çarpmayınız.", "ses": "b14"}, {"no": 15, "on": "<p>Kare biçimindeki bir kâğıt peçetenin köşegeni 22 cm'dir. Peçetenin dört köşesi merkeze doğru katlanınca daha küçük, kare biçiminde bir peçete katı oluşmuştur. Katlanan dört köşe üçgeni, küçük karenin tam üstüne oturmaktadır.</p>", "g": "<svg viewBox=\"0 0 328.8944443027283 168.89444430272832\" width=\"329\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"30\" y=\"30\" width=\"108.9\" height=\"108.9\" fill=\"#fff\" stroke=\"#1c5fbf\" stroke-width=\"2.4\"/><line x1=\"30.0\" y1=\"30.0\" x2=\"138.9\" y2=\"138.9\" stroke=\"#d9480f\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><rect x=\"83.6\" y=\"62.9\" width=\"45.7\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"106.4\" y=\"77.1\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">22 cm</text><polygon points=\"205.1,84.4 238.9,50.7 272.7,84.4 238.9,118.2\" fill=\"#e7f5ff\" stroke=\"#1c5fbf\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/><text x=\"158.9\" y=\"76.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">katla</text><line x1=\"142.9\" y1=\"84.4\" x2=\"172.9\" y2=\"84.4\" stroke=\"#111111\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"178.89444430272832,84.44722215136416 169.89444430272832,79.44722215136416 169.89444430272832,89.44722215136416\" fill=\"#111111\"/></svg>", "son": "", "k": "Buna göre, oluşan küçük karenin alanı kaç santimetrekaredir?", "sec": ["242", "484", "121", "60,5"], "secg": null, "c": "C", "a": ["Kare bir eşkenar dörtgendir; peçetenin alanı <span class=\"frac\"><span>22 · 22</span><span>2</span></span> = 242 cm².", "Dört köşe üçgeni katlanınca küçük karenin üstünü tam örter; küçük kare peçetenin yarısıdır.", "242 : 2 = 121 cm²."], "t": "242: peçetenin tamamı; 484: köşegenin karesi alan sanılmış; 60,5: iki kez yarılanmış", "d": "Kare de bir eşkenar dörtgendir; köşegeni bilinen karenin alanı köşegenin kendisiyle çarpımının yarısıdır. Katlanan köşeler küçük karenin üstünü tam örter.", "ses": "b15"}, {"no": 16, "on": "<p>Bir logo tasarımında ABCD yamuğunun AC ve BD köşegenleri K noktasında kesişmiştir. AB ve DC tabanları paraleldir. Tasarımcı, pembe boyanan AKD üçgeninin alanını 18 cm² olarak hesaplamıştır.</p>", "g": "<svg viewBox=\"0 0 204 168\" width=\"204\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"30.0,138.0 102.0,66.0 66.0,30.0\" fill=\"#ffc9c9\" stroke=\"#495057\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"174.0,138.0 102.0,66.0 138.0,30.0\" fill=\"#ffc9c9\" stroke=\"#495057\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"30.0,138.0 174.0,138.0 102.0,66.0\" fill=\"#d0ebff\" stroke=\"#495057\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"66.0,30.0 102.0,66.0 138.0,30.0\" fill=\"#d3f9d8\" stroke=\"#495057\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polygon points=\"30.0,138.0 174.0,138.0 138.0,30.0 66.0,30.0\" fill=\"none\" stroke=\"#111111\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/><circle cx=\"30.0\" cy=\"138.0\" r=\"3.2\" fill=\"#111111\"/><text x=\"19.4\" y=\"154.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"174.0\" cy=\"138.0\" r=\"3.2\" fill=\"#111111\"/><text x=\"184.6\" y=\"154.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"138.0\" cy=\"30.0\" r=\"3.2\" fill=\"#111111\"/><text x=\"148.6\" y=\"24.8\" font-   if(cozKap===k)k.appendChild(sesKutu(s.ses));const w=document.createElement("div");cozKap.appendChild(w);
  adimAdim(w,s.a,()=>{const c=document.createElement("p");c.className="cevap";c.innerHTML=`<b>Doğru cevap:</b> ${s.c}`;w.appendChild(c);
    k.querySelectorAll("ol.sec li").forEach(li=>{if(li.dataset.h===s.c)li.classList.add("dogru");});
    if(s.t){const t=document.createElement("p");t.className="tuzak";t.innerHTML="<b>Diğer seçenekler neden yanlış?</b> "+s.t;w.appendChild(t);}});
  const d=document.createElement("div");d.className="dikkat";d.innerHTML=`<b>Dikkat!</b> ${s.d}`;cozKap.appendChild(d);return k;}
const ic=$("#ic");
const BOL=[["s","Sıra Sende",V.s,kartS],["k","Kalem Kâğıt",V.k,kartK],["b",V.bad||"Bağlam Soruları",V.b,kartB]].filter(x=>x[2].length);
if(tek&&BOL.some(x=>x[0]===tek)){const n=+q.get(tek);const [,,L,f]=BOL.find(x=>x[0]===tek);const s=L.find(x=>x.no===n)||L[0];ic.appendChild(f(s));$("#tum").hidden=false;$("#nav").remove();}
else{let akt=BOL[0][0];const nav=$("#nav");const ciz=()=>{ic.innerHTML="";nav.innerHTML=BOL.map(([k,a,L])=>`<button type="button" data-k="${k}" aria-pressed="${k===akt}">${a} (${L.length})</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{akt=b.dataset.k;ciz();});const [,,L,f]=BOL.find(x=>x[0]===akt);L.forEach(s=>ic.appendChild(f(s)));};ciz();}

/* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
