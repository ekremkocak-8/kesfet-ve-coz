<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* ANA_KURALLAR §4.y-3: Etkinliklerde bütün kesirler kesir çizgisiyle (alt alta pay/payda) gösterilir. Düz yazılmış a/b biçimleri otomatik dönüştürülür. */
(function(){
  if (window.__kesirCizgi) return; window.__kesirCizgi = 1;
  const RX = /(^|[^\w\/.,:%])([−-])?(?:(\d+) )?(\d{1,4})\/(\d{1,4})(?![\w\/.,]\d|\w)/g;
  const ATLA = "script,style,svg,textarea,input,select,code,.ilr,.frac,[data-duz]";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function donustur(kok){
    if (!kok || !kok.nodeType) return;
    if (kok.nodeType === 3) kok = kok.parentElement;
    if (!kok || (kok.closest && kok.closest(ATLA))) return;
    const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      if (!/\d\/\d/.test(t.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = t.parentElement; if (!p || p.closest(ATLA)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const L = []; let t; while ((t = w.nextNode())) L.push(t);
    L.forEach(t => {
      let deg = false;
      const h = esc(t.nodeValue).replace(RX, (m, a, s, tam, p, q) => { deg = true;
        return a + (s ? "−" : "") + (tam ? tam + " " : "") + '<span class="frac"><span>' + p + "</span><span>" + q + "</span></span>"; });
      if (!deg) return;
      const k = document.createElement("span"); k.innerHTML = h; t.replaceWith(...k.childNodes);
    });
  }
  let bekleyen = new Set(), plan = 0;
  const calis = () => { plan = 0; const b = bekleyen; bekleyen = new Set(); b.forEach(donustur); };
  const gozcu = new MutationObserver(ms => { ms.forEach(m => {
      if (m.type === "characterData") bekleyen.add(m.target); else m.addedNodes.forEach(n => bekleyen.add(n)); });
    if (!plan) plan = requestAnimationFrame(calis); });
  const bas = () => { donustur(document.body); gozcu.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bas); else bas();
  const st = document.createElement("style");
  st.textContent = ".frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}.frac>span{display:block;text-align:center;padding:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor}";
  document.head.appendChild(st);
})();

/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {

    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });

    async function dagit(k) {

      const kolon = Math.min(k, 6), satirK = Math.ceil(k / kolon), gw = kolon * 14 + 16, gh = satirK * 14 + 26;

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */
  function ATLA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Sonuç"] });
    let k = o.k, L = o.son; const W = 660, sol = 22, sag = 22, sk = (W - sol - sag) / L;

    const bA = dug("▶ Oynat"), bB = dug("+1 " + (o.adimAd || "adım"), "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bB, bS);
    let kA = null;
    if (o.kSec) { kA = adimci(o.kEtiket || "Adım:", 2, Math.floor(L / 2), k, v => { k = v; sifirla(); }); kut.prepend(kA.w); }

    const bT = dug(o.testDugme || "Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test);
    const ti = test.querySelector("input");
    function taban() {
      let sv = `<line x1="${sol}" y1="62" x2="${sol + L * sk}" y2="62" class="cn-ek"/>`;

      for (let v = 0; v <= L; v += adimT) sv += `<line x1="${sol + v * sk}" y1="${v % et ? 58 : 54}" x2="${sol + v * sk}" y2="66" class="cn-ek"/>` + (v % et ? "" : `<text x="${sol + v * sk}" y="82" text-anchor="middle" class="cn-et">${o.etYaz ? o.etYaz(v) : v}</text>`);
      sv += `<line x1="${sol + L * sk}" y1="30" x2="${sol + L * sk}" y2="70" class="cn-sinir"/><text x="${sol + L * sk}" y="24" text-anchor="end" class="cn-et">${o.sonEt || L}</text>`;

    }

      izle.forEach((v, i) => {

        sv += `<path d="M${x1} 62 Q${(x1 + x2) / 2} ${yy} ${x2} 62" class="cn-yay"/><circle cx="${x2}" cy="62" r="4.5" class="${o.renk ? o.renk(v, i + 1) : "cn-o"}"/>`;
        if (izle.length <= 14 || i === izle.length - 1 || i % Math.ceil(izle.length / 10) === 0) sv += `<text x="${x2}" y="${98}" text-anchor="middle" class="cn-et2">${v}</text>`;
      });

      const son = izle.length ? izle[izle.length - 1] : 0, ix = sol + son * sk;
      sv += `<text x="${ix}" y="50" text-anchor="middle" class="cn-kis">${o.simge || "●"}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W} 104" role="img" aria-label="${k} birimlik adımlarla ilerleme">${sv}</svg>`;
    }
    const ileri = () => {
      const v = (n + 1) * k;
      if (v > L) { durdur(); s.dur.innerHTML = `<span class="kotu">■</span> Sonraki ${o.adimAd || "adım"} ${k} ${x} ${n + 1} = <b>${v}</b> olurdu; bu ${E(L,"den")} büyük. ${o.bitti ? o.bitti(n, k, L) : `Toplam ${n} ${o.adimAd || "adım"}; son değer ${n * k}.`}`; if (!izle.length) ciz(); return false; }
      n++; izle.push(v); ciz(); s.dur.innerHTML = o.durum ? o.durum(n, v, k) : `${n}. ${o.adimAd || "adım"}: ${k} ${x} ${n} = <b>${v}</b>`; return true;

      s.dur.innerHTML = m; s.yaz("t" + v, [v, r === 0 ? (ic ? `${k} ${x} ${b} ✔` : `${k} ${x} ${b} (sınır dışı)`) : `kalan ${r} ✘`], r === 0 && ic);

  }

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || [o.kAd || "k", "Boyanan", "En büyük"] });
    let k = o.k || 2, son = o.son;
    const kut = h("div", "cn-satir");

    if (o.sonSec) { const sw = h("div", "cn-hazir"); o.sonSec.forEach(v => { const b = dug(v + " gün", "ghost"); b.onclick = () => { son = v; kur(); temiz(); }; sw.appendChild(b); }); s.den.append(kut, sw); }

      const g = h("div", "cn-izg" + (o.takvim ? " cn-tak" : "")); g.style.gridTemplateColumns = `repeat(${o.sutunSay},1fr)`;

    function temiz() { hucre.forEach(c => c && c.classList.remove("on", "yeni")); s.dur.innerHTML = o.ilk || "Sayıyı seçip Boya düğmesine basın."; }

      }

      s.yaz(k + ":" + son, o.satir ? o.satir(k, say, enb, son) : [k, say, enb], o.iyi ? o.iyi(k, say, enb, son) : null);
      calis = false; bB.disabled = false;

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */
  function ASANSOR(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Açık asansörler", "Gidilen kat", "Gidilemeyen kat"] });
    const ac = o.asansor.map(() => false);
    const kut = h("div", "cn-satir"); const bt = o.asansor.map((a, i) => { const b = dug(a.ad, "ghost"); b.style.setProperty("--ac", a.renk); b.setAttribute("aria-pressed", "false"); b.onclick = () => { ac[i] = !ac[i]; b.setAttribute("aria-pressed", ac[i]); ciz(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    function ciz() {
      let sv = ""; const H = o.kat * 17 + 40; let git = 0, gitme = [];
      for (let f = o.kat; f >= 0; f--) {

        sv += `<rect x="60" y="${y}" width="150" height="15" rx="2" class="${f === 0 ? "cn-zem" : herhangi ? "cn-katon" : (ac.some(Boolean) ? "cn-katoff" : "cn-kat")}"/><text x="52" y="${y + 12}" text-anchor="end" class="cn-et">${f === 0 ? "Z" : f}</text>`;
        o.asansor.forEach((a, i) => { if (dur[i]) sv += `<circle cx="${230 + i * 22}" cy="${y + 7.5}" r="6" fill="${a.renk}"/>`; });
      }
      s.sah.innerHTML = `<svg viewBox="0 0 300 ${H}" style="max-height:440px" role="img" aria-label="${o.kat} katlı bina">${sv}</svg>`;
      const acik = o.asansor.filter((a, i) => ac[i]).map(a => a.ad);

      s.yaz(acik.join("+"), [acik.join(" + "), git, gitme.length], null);

    ciz();
  }

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */
  function SAAT(el, o) {

      let onc = null, snr = null;
      for (let m = bas; m <= bit + ara; m += ara) { if (m <= var_) onc = m; if (m >= var_ && snr == null) snr = m; if (m <= bit) sv += `<text x="${20 + (m - bas) * sk}" y="40" text-anchor="middle" class="cn-bus">🚌</text>`; }

      if (snr != null && snr <= bit + ara) { const sx = 20 + (Math.min(snr, bit) - bas) * sk; sv += `<path d="M${vx} 56 L${sx} 56" class="cn-bek"/>`; }

      const gec = var_ - bas;
      s.dur.innerHTML = `${o.kisi} durağa ${saDa(var_)} geliyor: ilk seferden <b>${gec} dakika</b> sonra. Seferler ${E(ara,"in")} katı olan dakikalarda: ${ara} ${x} ${Math.floor(gec / ara)} = ${Math.floor(gec / ara) * ara}` + (gec % ara ? `, ${ara} ${x} ${Math.floor(gec / ara) + 1} = ${(Math.floor(gec / ara) + 1) * ara}. Sonraki otobüs ${saDa(snr)}; bekleme <b>${snr - var_} dakika</b>.` : `. Tam sefer saatinde geldi; bekleme <b>0 dakika</b>.`);
      s.yaz(ara + ":" + var_, [ara + " dk", sa(var_), sa(onc), sa(snr), (snr - var_) + " dk"], null);
    }
    ciz();
  }

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Çarpanlar", "Çarpan sayısı"] });
    let N = o.N || o.hazir[0]; let bul = new Set(), denendi = new Set();
    const kut = h("div", "cn-satir");
    const sA = adimci("Sayı:", 2, o.max || 200, N, v => { N = v; yeni(); });
    kut.appendChild(sA.w);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => sA.ayarla(n); hz.appendChild(b); }); kut.appendChild(hz); }
    s.den.appendChild(kut);
    const bolen = h("div", "cn-satir cn-test"); bolen.innerHTML = `<label>Bölen deneyin: <input type="number" inputmode="numeric" min="1"></label>`;
    const bD = dug("Böl"), bS = dug("Sıradakini dene", "ghost"); bolen.append(bD, bS); s.den.appendChild(bolen);
    const bi = bolen.querySelector("input");
    let bK = null; if (o.katlar) { bK = dug(o.katDugme || "Katlarını say ▶", "ghost"); s.den.appendChild(bK); }
    const ciftler = h("div", "cn-cift"); const katlar = h("div", "cn-katlar");
    function yeni() { bul = new Set(); denendi = new Set(); ciz(); s.dur.innerHTML = `${N} sayısını 1, 2, 3, … sayılarına bölerek çarpan çiftlerini bulun.`; katlar.textContent = ""; }
    function ciz() {
      const L = [...bul].sort((a, b) => a - b);
      s.sah.innerHTML = ""; const kartlar = h("div", "cn-kartlar");
      L.forEach(v => kartlar.appendChild(h("span", "cn-kart" + (v * v === N ? " kare" : ""), v)));
      if (!L.length) kartlar.appendChild(h("span", "cn-bosk", "Henüz çarpan bulunmadı"));
      s.sah.append(kartlar, ciftler, katlar);
      ciftler.innerHTML = L.filter(v => v * v <= N).map(v => `<span>${v} ${x} ${N / v}${v * v === N ? " <i>(aynı sayı: bir kez yazılır)</i>" : ""}</span>`).join("");
    }
    const tamamMi = () => { for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) return false; return true; };
    const eksik = () => { const L = []; for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) L.push(i); return ` <br>Henüz denenmeyen küçük bölenler var: <b>${L.join(", ")}</b>. Bunları da deneyin.`; };
    function dene(d) {
      if (!d || d < 1) return; denendi.add(d);
      const b = Math.floor(N / d), r = N % d;
      if (d > N) { s.dur.innerHTML = `${d} > ${N}: ${E(N,"den")} büyük sayı ${E(N,"in")} çarpanı olamaz.`; return; }
      if (r === 0) { bul.add(d); bul.add(b); ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${N} : ${d} = ${b}, kalan 0 → <b>${d} ${x} ${b} = ${N}</b>. ${d} ve ${b} çarpandır.` + (d * d >= N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} ${d * d === N ? "=" : ">"} ${N}. Artık yeni çift çıkmaz; bütün çarpanlar bulundu.` : eksik() : ""); }
      else { s.dur.innerHTML = `<span class="kotu">✘</span> ${N} : ${d} işleminde bölüm ${b}, <b>kalan ${r}</b>. ${d}, ${E(N,"in")} çarpanı değildir.` + (d * d > N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} > ${N}. Daha büyük bölen denemeye gerek yok; çarpan listesi tamam.` : eksik() : ""); }
      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));
      if (tamam) s.yaz("n" + N, [N, [...bul].sort((a, b) => a - b).join(", "), bul.size], true);
    }
    bD.onclick = () => dene(Math.round(+bi.value));
    bS.onclick = () => { let d = 1; while (denendi.has(d)) d++; bi.value = d; dene(d); };
    if (bK) bK.onclick = async () => {
      bK.disabled = true; katlar.textContent = ""; const sat = h("div", "cn-katsat"); katlar.append(h("b", "", `${E(N,"in")} katları: `), sat);
      for (let i = 1; i <= (o.katSay || 12); i++) { sat.appendChild(h("span", "cn-kat2", `${N * i}`)); await bekle(220); }
      sat.appendChild(h("span", "cn-sonsuz", "… ve sonsuza kadar sürer"));
      bK.disabled = false;
    };
    yeni();
  }

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */
  function KUMBARA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Para", "Sonuç"] });
    const k = o.k; let hafta = 0, tmr = null;
    const kut = h("div", "cn-satir"); const bA = dug("Bir hafta geçsin +"), bO = dug("▶ Haftaları oynat", "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bO, bS); s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Kumbarada şu para olabilir mi? <input type="number" inputmode="numeric" min="1" max="500"> TL</label>`;
    const bT = dug("Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test); const ti = test.querySelector("input");
    function ciz() {
      const top = hafta * k, sv = [];
      const yuk = Math.min(150, top * 1.4);
      sv.push(`<rect x="110" y="20" width="120" height="160" rx="22" class="cn-kum"/><rect x="150" y="14" width="40" height="8" rx="3" class="cn-kum2"/>`);
      sv.push(`<rect x="116" y="${176 - yuk}" width="108" height="${yuk}" rx="10" class="cn-para"/>`);
      sv.push(`<text x="170" y="110" text-anchor="middle" class="cn-buyuk">${top} TL</text><text x="170" y="134" text-anchor="middle" class="cn-et">${hafta}. hafta</text>`);
      let cizgi = ""; for (let i = 1; i <= hafta && i <= 16; i++) cizgi += `<text x="${260 + ((i - 1) % 4) * 52}" y="${40 + Math.floor((i - 1) / 4) * 34}" class="cn-et2">${k}${x}${i}=${k * i}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 480 190" role="img" aria-label="Kumbara">${sv.join("")}${cizgi}</svg>`;
      s.dur.innerHTML = hafta ? `${hafta}. hafta sonunda kumbarada ${k} ${x} ${hafta} = <b>${top} TL</b> var.` : `Kumbara boş. Her hafta ${k} TL atılıyor.`;
    }
    bA.onclick = () => { hafta++; ciz(); };
    bO.onclick = () => { if (tmr) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } bO.textContent = "❚❚ Durdur"; tmr = setInterval(() => { if (hafta >= 15) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } hafta++; ciz(); }, az ? 50 : 500); };
    bS.onclick = () => { hafta = 0; ciz(); };
    bT.onclick = () => {
      const v = Math.round(+ti.value); if (!v) return; const b = Math.floor(v / k), r = v % k;
      s.dur.innerHTML = r ? `<span class="kotu">✘</span> ${k} ${x} ${b} = ${k * b} TL, ${k} ${x} ${b + 1} = ${k * (b + 1)} TL. ${v} TL arada kalır (${v} : ${k} → kalan ${r}). Kumbarada hiçbir hafta ${v} TL olmaz.`
        : `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · ${b}. hafta sonunda kumbarada tam ${v} TL olur.`;
      if (!r) { hafta = b; ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · <b>${b}. hafta</b> sonunda kumbarada tam ${v} TL olur.`; }
      s.yaz("t" + v, [v + " TL", r ? `kalan ${r} ✘` : `${k} ${x} ${b} ✔`], !r);
    };
    ciz();
  }

  /* 9) ÖNERME LABORATUVARI: önermeyi farklı sayılarla sınama */
  function ONERME(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Önerme", "Sayı", "Sonuç"] });
    let akt = 0; const kut = h("div", "cn-hazir");
    const bt = o.onermeler.map((on, i) => { const b = dug(on.ad, "ghost"); b.setAttribute("aria-pressed", i === 0); b.onclick = () => { akt = i; bt.forEach((x, j) => x.setAttribute("aria-pressed", j === i)); goster(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Sınanacak sayı: <input type="number" inputmode="numeric" min="1" max="200" value="12"></label>`;
    const bT = dug("Sına"), bR = dug("Rastgele sayı", "ghost"); test.append(bT, bR); s.den.appendChild(test); const ti = test.querySelector("input");
    function goster() { s.sah.innerHTML = `<div class="cn-onr"><b>${o.onermeler[akt].ad}:</b> “${o.onermeler[akt].metin}”</div>`; s.dur.innerHTML = "Bir sayı yazıp Sına düğmesine basın. Önerme her sayıda doğru mu?"; }
    function sina(n) {
      const on = o.onermeler[akt], r = on.sina(n);
      s.sah.innerHTML = `<div class="cn-onr"><b>${on.ad}:</b> “${on.metin}”</div><div class="cn-kanit">${r.goster}</div>`;
      s.dur.innerHTML = (r.ok ? `<span class="iyi">✔</span> ${n} için önerme doğru.` : `<span class="kotu">✘</span> ${n} için önerme yanlış! Bir karşı örnek bulundu.`) + (r.not ? " " + r.not : "");
      s.yaz(akt + ":" + n, [on.ad, n, r.ok ? "doğru" : "yanlış (karşı örnek)"], r.ok);
    }
    bT.onclick = () => { const n = Math.round(+ti.value); if (n > 0) sina(n); };
    bR.onclick = () => { const n = 2 + Math.floor(Math.random() * 59); ti.value = n; sina(n); };
    goster();
  }


  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →
     koşullar tek tek denetlenir (✔/✘) → deney defterine yazılır. Doğru cevap verilmez; öğrenci uygun girdiyi kendisi arar.
     o.girdi: [{ad, min, max, bas} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → SVG/HTML · o.kosullar: [{ad, f(v) → bool | {ok, not}}]
     o.dugme: düğme yazısı (false → her değişiklikte denetlenir) · o.sonuc(v, hepsi, L) · o.satir(v, hepsi, L) · o.iyi(v, L) · o.ek: [{ad, deger(v) → v}] */
  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);
      s.dur.innerHTML = m;
      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);
    }
    kur = true; ciz();
    if (bS) s.dur.innerHTML = o.ilk || "Değerleri seçip Sına düğmesine basın."; else sina();
  }

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

/* MAT.7.5.1 · Üçgende Kenarortay, Açıortay ve Yükseklik — bağlam sorularının "Canlandır" düzenekleri (16.10.2026) — ortak motor: canlandir.js (CN.KOSUL).
   Her düzenek: öğrenci düğmelerle ya da − / + sayaçlarıyla durumu değiştirir → sahne anında çizilir → koşullar denetlenir → deneme deney defterine yazılır.
   Doğru cevap bir düğmeyle verilmez; denemelerden çıkar (§4.k, §19-10). Renk kodu: yükseklik turuncu, açıortay mor, kenarortay mavi, kenar orta dikme yeşil. */
window.CANL = (() => {
  if (!document.getElementById("c751-stil")) { const st = document.createElement("style"); st.id = "c751-stil";
    st.textContent = ".cn-btn{min-width:44px;min-height:44px}.cn-adimci button{min-width:44px;min-height:44px}.cn-secg button{min-height:44px}.c751-k{text-align:center;font-size:17px;font-weight:800;margin:8px auto;max-width:640px;line-height:1.6}"; document.head.appendChild(st); }
  const D = v => String(Math.round(v * 10) / 10).replace(".", ",");
  const yon = (a, r = 1) => [r * Math.cos(a * Math.PI / 180), -r * Math.sin(a * Math.PI / 180)];
  const ek = (P, v, k = 1) => [P[0] + k * v[0], P[1] + k * v[1]];
  const uz = (P, Q) => Math.hypot(Q[0] - P[0], Q[1] - P[1]);
  const orta = (P, Q) => [(P[0] + Q[0]) / 2, (P[1] + Q[1]) / 2];
  const ac = (P, Q) => Math.atan2(-(Q[1] - P[1]), Q[0] - P[0]) * 180 / Math.PI;
  const ayak = (X, P, Q) => { const dx = Q[0] - P[0], dy = Q[1] - P[1], t = ((X[0] - P[0]) * dx + (X[1] - P[1]) * dy) / (dx * dx + dy * dy); return [P[0] + t * dx, P[1] + t * dy]; };
  const aoAyak = (A, B, C) => { const b = uz(A, C), c = uz(A, B); return [B[0] + (C[0] - B[0]) * c / (b + c), B[1] + (C[1] - B[1]) * c / (b + c)]; };
  const aci = (V, P, Q) => { let a = Math.abs(ac(V, P) - ac(V, Q)) % 360; return a > 180 ? 360 - a : a; };

      return KO(el, { yon: "Bir motif türü seçiniz; motifte simetri doğrusu olan kenarortaylar çizilir ve sayılır.", bitis: "Üç motif türünü de deneyince; sonra 3 eşkenar, 3 ikizkenar, 1 çeşitkenar için toplamı hesaplayınız.",
        girdi: [{ ad: "Motif:", sec: Object.keys(M), bas: "İkizkenar" }],
        ciz: v => { let A, B, C; if (v[0] === "Eşkenar") { B = [60, 200]; C = [240, 200]; A = [150, 200 - 90 * Math.sqrt(3)]; } else if (v[0] === "İkizkenar") { B = [90, 200]; C = [210, 200]; A = [150, 30]; } else { B = [50, 200]; C = [250, 200]; A = [100, 60]; }
          let h = ucg(A, B, C, "#e5dbff"); const L = v[0] === "Eşkenar" ? [[A, orta(B, C)], [B, orta(A, C)], [C, orta(A, B)]] : v[0] === "İkizkenar" ? [[A, orta(B, C)]] : [];
          L.forEach(([P, Q]) => h += dp(P, Q, KR, 2.6, "6 4")); return svg(300, 220, h) + kutu(`Simetri doğrusu: ${M[v[0]]}`); },
        kosullar: [{ ad: v => `${v[0]} motifte ${M[v[0]]} ip işlenir.`, f: () => true }], sutun: ["Motif", "İp sayısı"], satir: v => [v[0], M[v[0]]] }); },
    /* 16 · Arsa çitleri */
    16: el => { const B = [20, 210], C = [560, 210], A = [160, 40], H = ayak(A, B, C), Dd = aoAyak(A, B, C), M = orta(B, C);
      const N = { "Yükseklik": H, "Açıortay": Dd, "Kenarortay": M };
      return KO(el, { yon: "Bir çit türü seçiniz; çit çizilir, uzunluğu ve ayırdığı iki parçanın alanı karşılaştırılır.", bitis: "Alanları eşit iki parça veren çiti ve uzunluk sırasını bulunca.",
        girdi: [{ ad: "Çit:", sec: Object.keys(N), bas: "Yükseklik" }],
        ciz: v => { const P = N[v[0]], a1 = (P[0] - B[0]) * 170 / 2, a2 = (C[0] - P[0]) * 170 / 2;
          return svg(590, 240, `<polygon points="${A} ${B} ${P}" fill="#fff3bf" stroke="#1d2433" stroke-width="2"/><polygon points="${A} ${P} ${C}" fill="#d0ebff" stroke="#1d2433" stroke-width="2"/>` + dp(A, P, v[0] === "Yükseklik" ? HR : v[0] === "Açıortay" ? AO : KR, 3) + nok(A, "A", 90) + nok(B, "B", 200) + nok(C, "C", -20))
            + kutu(`Çit: ${D(uz(A, P) / 4)} birim · Alanlar: ${D(a1 / 400)} ve ${D(a2 / 400)}`); },
        kosullar: [{ ad: "Parçaların alanları eşit.", f: v => v[0] === "Kenarortay" }], sutun: ["Çit", "Uzunluk", "Alanlar eşit mi?"], satir: (v, ok) => [v[0], D(uz(A, N[v[0]]) / 4), ok ? "Evet" : "Hayır"] }); },
    /* 17 · Kulübeler */
    17: el => { const B = [30, 280], C = [330, 280], A = [180, 280 - 150 * Math.sqrt(3)], h = 150 * Math.sqrt(3);
      return KO(el, { yon: "Kulübeyi ok sayaçlarıyla gezdiriniz; üç kenara dik yolların uzunlukları ve toplamı yazılır.", bitis: "En az üç farklı yerde toplamı karşılaştırınca.",
        girdi: [{ ad: "Sağa", min: 3, max: 12, bas: 6 }, { ad: "Yukarı", min: 1, max: 8, bas: 3 }],
        ciz: v => { const P = [30 + v[0] * 25, 280 - v[1] * 22]; const L = [[B, C], [A, B], [A, C]].map(([X, Y]) => ayak(P, X, Y)); const ic = L.every(Q => true);
          const t = L.reduce((s, Q) => s + uz(P, Q), 0); let g = ucg(A, B, C, "#ebfbee"); L.forEach(Q => g += dp(P, Q, HR, 2.2));
          return svg(360, 300, g + nok(P, "K", 0, "#d9480f")) + kutu(`Yollar: ${L.map(Q => D(uz(P, Q) / 10)).join(" + ")} = ${D(t / 10)} · Parkın yüksekliği: ${D(h / 10)}`); },
        kosullar: [{ ad: "Kulübe parkın içinde.", f: v => { const P = [30 + v[0] * 25, 280 - v[1] * 22]; const s = (X, Y) => (Y[0] - X[0]) * (P[1] - X[1]) - (Y[1] - X[1]) * (P[0] - X[0]); return s(B, C) * s(C, A) > 0 && s(C, A) * s(A, B) > 0; } }],
        sutun: ["Konum", "Toplam", "Yükseklik"], satir: v => { const P = [30 + v[0] * 25, 280 - v[1] * 22]; const t = [[B, C], [A, B], [A, C]].reduce((s, [X, Y]) => s + uz(P, ayak(P, X, Y)), 0); return [`${v[0]}, ${v[1]}`, D(t / 10), D(h / 10)]; } }); },
    /* 18 · Ağaçta yol */
    18: el => { const Y = { "1": ["2", "3"], "2": ["4", "5"], "3": ["6", "Ç7"], "4": ["Ç1", "Ç2"], "5": ["Ç3", "Ç4"], "6": ["Ç5", "Ç6"] };
      const yol = v => { let n = "1"; const L = ["1"]; while (!n.startsWith("Ç")) { n = Y[n][v[+n - 1] === "D" ? 0 : 1]; L.push(n); } return L; };
      return KO(el, { yon: "Her ifade için D ya da Y seçiniz; ağaçta izlenen yol ve ulaşılan çıkış yazılır. Kararlarınızı yanınızdaki üçgen çizimleriyle sınayınız.", bitis: "Bütün kararları doğru verip doğru çıkışa ulaşınca.",
        girdi: [1, 2, 3, 4, 5, 6].map(i => ({ ad: `${i}. ifade:`, sec: ["D", "Y"], bas: "D" })),
        ciz: v => kutu(`İzlenen yol: ${yol(v).join(" → ")}`),
        kosullar: [{ ad: "Yol üzerindeki bütün kararlar doğru.", f: v => { const d = ["D", "Y", "Y", "Y", "D", "Y"]; return yol(v).filter(n => !n.startsWith("Ç")).every(n => v[+n - 1] === d[+n - 1]); } }],
        sutun: ["Yol", "Çıkış"], satir: v => { const L = yol(v); return [L.join(" → "), L[L.length - 1]]; } }); },
    /* 19 · Bayrakçık */
    19: el => KO(el, { yon: "L'den geçen doğrunun AL ile yaptığı açıyı − / + ile değiştiriniz; B ve C, L'ye eşit uzaklıkta kalır. |AB| ve |AC| ölçülür.", bitis: "|AB| = |AC| olan durumu bulup o zaman AL'nin BC ile açısına bakınca.",
      girdi: [{ ad: "Doğru ile AL arası (°)", min: 50, max: 130, bas: 70 }],
      ciz: v => { const A = [60, 140], L = [220, 140], d = yon(180 - v[0], 1), B = ek(L, d, 90), C = ek(L, d, -90);
        return svg(300, 280, ucg(A, B, C, "#ffe8cc") + dp(A, L, KR, 2.6) + nok(A, "A", 180) + nok(L, "L", 0, KR) + nok(B, "B", 90) + nok(C, "C", 270)) + kutu(`|AB| = ${D(uz(A, B) / 40)} · |AC| = ${D(uz(A, C) / 40)}`); },
      kosullar: [{ ad: "|AB| = |AC|", f: v => v[0] === 90 }], sutun: ["Açı", "|AB|", "|AC|"], satir: v => { const A = [60, 140], L = [220, 140], d = yon(180 - v[0], 1); return [`${v[0]}°`, D(uz(A, ek(L, d, 90)) / 40), D(uz(A, ek(L, d, -90)) / 40)]; } }),
    /* 20 · Sulama hatları */
    20: el => KO(el, { yon: "B açısını − / + ile değiştiriniz (A açısı 60° sabit); yükseklik (turuncu) ile açıortay (mor) arasındaki açı ölçülür.", bitis: "m(B) = 76° iken iki hat arasındaki açıyı bulunca.",
      girdi: [{ ad: "m(B) (°)", min: 62, max: 100, bas: 70 }],
      ciz: v => { const B = [40, 220], C = [380, 220], A = ucgenA(B, C, v[0], 120 - v[0]), H = ayak(A, B, C), Dd = aoAyak(A, B, C);
        return svg(420, 250, ucg(A, B, C, "#ebfbee") + dp(A, H, HR, 2.6) + dp(A, Dd, AO, 2.6) + nok(A, "A", 90) + nok(B, "B", 200) + nok(C, "C", -20)) + kutu(`m(BAD) = 30° · m(BAH) = ${90 - v[0]}° · m(HAD) = ${Math.abs(30 - (90 - v[0]))}°`); },
      kosullar: [{ ad: "m(B) = 76°", f: v => v[0] === 76 }], sutun: ["m(B)", "m(BAH)", "m(HAD)"], satir: v => [`${v[0]}°`, `${90 - v[0]}°`, `${Math.abs(30 - (90 - v[0]))}°`] }),
  };
})();

const V={"baslik": "Üçgende Kenarortay, Açıortay ve Yükseklik", "kod": "7. SINIF · MAT.7.5.1", "ses": "", "bet": "BAĞLAM TEMELLİ SORU", "bad": "Bağlam Soruları", "s": [{"no": 1, "bas": "Temel ve yardımcı elemanlar, yükseklik", "q": [{"k": "Bir üçgen kartında şu bilgiler yazılıdır: |DE| = 8 cm; m(F) = 61°; E köşesinden DF kenarına inen dikme 6 cm; D açısını iki eş açıya bölen doğru parçası 7 cm. Hangi bilgiler temel elemanlara, hangileri yardımcı elemanlara aittir?", "a": ["Kenar uzunluğu (|DE|) ve açı ölçüsü (m(F)) temel elemanlara aittir.", "E'den inen dikme yüksekliktir; açıyı bölen doğru parçası açıortaydır.", "Bu ikisi yardımcı elemanlara aittir."], "c": "Temel: 8 cm, 61° · Yardımcı: 6 cm, 7 cm"}, {"k": "Kareli zeminde verilen ABC üçgeninde C köşesinden AB kenarına ait yüksekliği çiziniz. Yüksekliğin ayağı nereye düşer?<br><svg style=\"width:48mm;max-width:100%;height:auto;display:block;margin:1mm 0\" viewBox=\"0 0 216 136\" width=\"216\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"18\" y1=\"18\" x2=\"18\" y2=\"118\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"38\" y1=\"18\" x2=\"38\" y2=\"118\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"58\" y1=\"18\" x2=\"58\" y2=\"118\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"78\" y1=\"18\" x2=\"78\" y2=\"118\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"98\" y1=\"18\" x2=\"98\" y2=\"118\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"118\" y1=\"18\" x2=\"118\" y2=\"118\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"138\" y1=\"18\" x2=\"138\" y2=\"118\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"158\" y1=\"18\" x2=\"158\" y2=\"118\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"178\" y1=\"18\" x2=\"178\" y2=\"118\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"198\" y1=\"18\" x2=\"198\" y2=\"118\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"18\" y1=\"18\" x2=\"198\" y2=\"18\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"18\" y1=\"38\" x2=\"198\" y2=\"38\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"18\" y1=\"58\" x2=\"198\" y2=\"58\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"18\" y1=\"78\" x2=\"198\" y2=\"78\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"18\" y1=\"98\" x2=\"198\" y2=\"98\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"18\" y1=\"118\" x2=\"198\" y2=\"118\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><polygon points=\"18.0,98.0 138.0,98.0 178.0,38.0\" fill=\"#ffffff88\" stroke=\"#111111\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><circle cx=\"18.0\" cy=\"98.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"2.4\" y=\"106.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"138.0\" cy=\"98.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"150.8\" y=\"113.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"178.0\" cy=\"38.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"191.7\" y=\"35.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text></svg>", "a": ["AB yataydır; C'den AB doğrusuna dik inilir, ayak C'nin tam altındadır.", "C, B'nin 2 kare sağındadır.", "Ayak AB'nin B'den sonraki uzantısına, B'den 2 kare sağa düşer; yükseklik dış bölgededir."], "c": "AB'nin uzantısında, B'den 2 kare sağda"}]}, {"no": 2, "bas": "Üçgende açıortay", "q": [{"k": "ABC üçgeninde m(B) = 66°, m(C) = 32°'dir. A açısının açıortayı BC'yi D noktasında kesmektedir. ADB ve ADC açılarının ölçülerini bulunuz.", "a": ["m(A) = 180 − 66 − 32 = 82°.", "m(BAD) = 82 : 2 = 41°.", "m(ADB) = 180 − 66 − 41 = 73°; m(ADC) = 180 − 73 = 107°."], "c": "73° ve 107°"}, {"k": "Bir üçgen kâğıtta A köşesinden çıkan üç kat izi vardır. d₁ izi AB ile 24°, AC ile 34°; d₂ izi AB ile 29°, AC ile 29°; d₃ izi AB ile 41°, AC ile 17° açı yapmaktadır. Hangi iz A açısının açıortayıdır? Gerekçesiyle yazınız.", "a": ["Açıortay A açısını iki eş açıya ayırır.", "Yalnız d₂ izinde iki açı eşittir (29° ve 29°).", "d₁ ve d₃ açıyı farklı ölçülere ayırır; açıortay değildir."], "c": "d₂"}]}, {"no": 3, "bas": "Kenar orta dikme ve kenarortay", "q": [{"k": "Kareli zeminde A köşesi B'den 1 kare sağda ve 5 kare yukarıda, C köşesi B'den 6 kare sağda ve 2 kare yukarıdadır. AC kenarına ait kenarortayı nasıl çizersiniz? AC'nin orta noktası B'den kaç kare sağda ve yukarıdadır?", "a": ["A'dan C'ye gitmek için 5 kare sağa, 3 kare aşağı gidilir.", "Yarıları: 2,5 kare sağa, 1,5 kare aşağı. Orta nokta B'den 1 + 2,5 = 3,5 kare sağda, 5 − 1,5 = 3,5 kare yukarıdadır.", "Bu nokta B ile birleştirilir; AC'ye ait kenarortay çizilmiş olur."], "c": "3,5 kare sağda, 3,5 kare yukarıda"}, {"k": "Üçgen bir kâğıtta A köşesinden geçen bir kat izi BC kenarını tam orta noktasında kesmekte ve BC ile 72°'lik açı yapmaktadır. Bu kat izi kenar orta dikme midir, kenarortay mıdır? Gerekçesiyle yazınız.", "a": ["Kat izi BC'nin orta noktasından ve A köşesinden geçmektedir.", "BC ile yaptığı açı 90° değildir; kenar orta dikme olamaz.", "Köşeyi karşı kenarın orta noktasına birleştirdiği için kenarortaydır."], "c": "Kenarortay"}]}, {"no": 4, "bas": "Aynı kenara ait elemanlar", "q": [{"k": "Kareli zeminde verilen ABC üçgeninde BC kenarına ait yüksekliğin ve kenarortayın ayakları arasındaki uzaklık kaç karedir?<br><svg style=\"width:48mm;max-width:100%;height:auto;display:block;margin:1mm 0\" viewBox=\"0 0 236 156\" width=\"236\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"18\" y1=\"18\" x2=\"18\" y2=\"138\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"38\" y1=\"18\" x2=\"38\" y2=\"138\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"58\" y1=\"18\" x2=\"58\" y2=\"138\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"78\" y1=\"18\" x2=\"78\" y2=\"138\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"98\" y1=\"18\" x2=\"98\" y2=\"138\" stroke=\"#d5dbe7\" stroke-width=\".9 kare sağda.", "Kenarortayın ayağı BC'nin orta noktasıdır: B'den 10 : 2 = 5 kare sağda.", "Aradaki uzaklık 5 − 3 = 2 karedir."], "c": "2 kare"}, {"k": "Çeşitkenar bir üçgende aynı köşeden çizilen yükseklik, açıortay ve kenarortayın uzunlukları karışık olarak 6,2 cm, 5,7 cm ve 5,9 cm'dir. Hangi uzunluk hangi elemana aittir? Gerekçesiyle eşleştiriniz.", "a": ["Yükseklik dik olduğu için en kısadır: 5,7 cm.", "Kenarortay en uzundur: 6,2 cm.", "Açıortay ikisinin arasındadır: 5,9 cm."], "c": "Yükseklik 5,7 · açıortay 5,9 · kenarortay 6,2"}]}, {"no": 5, "bas": "İkizkenar ve eşkenar üçgen", "q": [{"k": "|PR| = |PS| = 7 cm ve |RS| = 5 cm olan PRS üçgeninde RS'ye ait yükseklik, P açısının açıortayı, RS'ye ait kenarortay ve PR'ye ait kenarortay çizilmiştir. Bu çizgilerden hangileri aynı doğru parçası üzerindedir? Açıklayınız.", "a": ["RS farklı uzunluktaki kenardır (taban).", "Tabana ait yükseklik, tepe açısının açıortayı ve tabana ait kenarortay simetri doğrusu üzerindedir; çakışır.", "PR eşit kenarlardan biridir; ona ait kenarortay bu doğru üzerinde değildir."], "c": "İlk üçü çakışır; PR'ye ait kenarortay çakışmaz"}, {"k": "Bir üçgenin bir kenarına ait kenarortay aynı zamanda o kenara ait yüksekliktir. Ali: “Üçgen kesinlikle eşkenardır.” Zeynep: “Üçgen kesinlikle ikizkenardır.” Can: “Bu üçgen dik üçgen olamaz.” Hangi öğrencinin söylediği doğrudur?", "a": ["Kenarortay ile yükseklik çakışıyorsa üçgen o çizgi boyunca katlanınca iki yarı çakışır; üçgen ikizkenardır: Zeynep doğrudur.", "Eşkenar olması kesin değildir: Ali yanlıştır.", "İkizkenar dik üçgen (açıları 90°, 45°, 45°) de olabilir: Can yanlıştır."], "c": "Zeynep"}]}, {"no": 6, "bas": "Kesişim noktaları ve ağırlık merkezi", "q": [{"k": "Kareli zeminde verilen dik üçgende yüksekliklerin kesişim noktasını ve ağırlık merkezini gösteriniz. Ağırlık merkezi B'den kaç kare sağda ve yukarıdadır?<br><svg style=\"width:48mm;max-width:100%;height:auto;display:block;margin:1mm 0\" viewBox=\"0 0 216 156\" width=\"216\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"18\" y1=\"18\" x2=\"18\" y2=\"138\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"38\" y1=\"18\" x2=\"38\" y2=\"138\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"58\" y1=\"18\" x2=\"58\" y2=\"138\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"78\" y1=\"18\" x2=\"78\" y2=\"138\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"98\" y1=\"18\" x2=\"98\" y2=\"138\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"118\" y1=\"18\" x2=\"118\" y2=\"138\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"138\" y1=\"18\" x2=\"138\" y2=\"138\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"158\" y1=\"18\" x2=\"158\" y2=\"138\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"178\" y1=\"18\" x2=\"178\" y2=\"138\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"198\" y1=\"18\" x2=\"198\" y2=\"138\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"18\" y1=\"18\" x2=\"198\" y2=\"18\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"18\" y1=\"38\" x2=\"198\" y2=\"38\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"18\" y1=\"58\" x2=\"198\" y2=\"58\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"18\" y1=\"78\" x2=\"198\" y2=\"78\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"18\" y1=\"98\" x2=\"198\" y2=\"98\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"18\" y1=\"118\" x2=\"198\" y2=\"118\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"18\" y1=\"138\" x2=\"198\" y2=\"138\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><polygon points=\"18.0,18.0 18.0,138.0 198.0,138.0\" fill=\"#ffffff88\" stroke=\"#111111\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><circle cx=\"18.0\" cy=\"18.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"8.4\" y=\"10.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"18.0\" cy=\"138.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"4.7\" y=\"152.3\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"198.0\" cy=\"138.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"213.2\" y=\"148.5\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text></svg>", "a": ["B açısı diktir; dik kenarlar birbirine ait yüksekliktir. Yüksekliklerin kesişim noktası B'dir.", "BC'nin orta noktası B'den 4,5 kare sağdadır; AB'nin orta noktası 3 kare yukarıdadır. İki kenarortay çizilir.", "Kenarortaylar B'den 3 kare sağda, 2 kare yukarıda kesişir."], "c": "Yükseklikler B'de · ağırlık merkezi 3 kare sağda, 2 kare yukarıda"}, {"k": "Yüksekliklerinin uzantıları dış bölgede kesişen bir üçgen için hangisi kesinlikle doğrudur? I. Bir açısı geniştir. II. Açıortayları dış bölgede kesişir. III. Ağırlık merkezi iç bölgededir.", "a": ["Yükseklikler (uzantıları) dışarıda kesişiyorsa üçgen geniş açılıdır: I doğrudur.", "Açıortaylar her üçgende içeride kesişir: II yanlıştır.", "Ağırlık merkezi her üçgende içeridedir: III doğrudur."], "c": "I ve III"}]}, {"no": 7, "bas": "Elemanları çözümlemek", "q": [{"k": "Kısa bir ağaçta 1. ifade D ise 2. ifadeye, Y ise 3. ifadeye gidilir; 2. ifade D ise Ç1'e, Y ise Ç2'ye; 3. ifade D ise 4. ifadeye, Y ise Ç3'e; 4. ifade D ise Ç4'e, Y ise Ç5'e gidilir. 1: Ağırlık merkezi kenarortayların kesişim noktasıdır. 2: Geniş açılı üçgende açıortaylar dış bölgede kesişir. 3: Kenar orta dikme her zaman köşeden geçer. 4: Yükseklik her zaman kenara dik iner. Doğru çıkış hangisidir?", "a": ["1. ifade tanımdır: D → 2. ifade.", "2. ifade yanlıştır; açıortaylar her üçgende içeride kesişir: Y → Ç2.", "3 ve 4. ifadeler bu yolda değerlendirilmez."], "c": "Ç2"}, {"k": "Uzunluğu 4,4 cm olan AL doğru parçası, A'dan çizilen kenarortay olacak şekilde gönye ve cetvelle bir dik açılı üçgen çiziniz. Hangi köşede dik açı oluşur? Çiziminizin adımlarını yazınız.", "a": ["L'den bir doğru çizilir; A'dan bu doğruya gönyeyle dikme inilir, ayak B olarak alınır.", "|LB| cetvelle ölçülür; C, L'nin öbür yanında |LC| = |LB| olacak şekilde işaretlenir.", "AB, BC'ye dik olduğu için dik açı B köşesindedir; L, BC'nin orta noktası olduğu için AL kenarortaydır."], "c": "B köşesinde"}]}], "k": [{"no": 1, "bas": "Açıortaylı üçgenlerde açıları bulunuz", "yon": "Her maddedeki açı ölçüsünü bulup yazınız. Her maddede en çok üç işlem yeterlidir.", "r": [{"n": "<span class=\"kk751-no\">1</span>ABC'de m(A) = 118°, AD açıortay. m(BAD) = ?", "c": "59°"}, {"n": "<span class=\"kk751-no\">2</span>ABC'de m(B) = 62°, m(C) = 44°, AD açıortay. m(BAD) = ?", "c": "37°"}, {"n": "<span class=\"kk751-no\">3</span>ABC'de m(B) = 57°, m(C) = 35°, AD açıortay. m(ADB) = ?", "c": "79°"}, {"n": "<span class=\"kk751-no\">4</span>m(B) = 68°, m(C) = 48°; B ve C açılarının açıortayları K'de kesişiyor. m(BKC) = ?", "c": "122°"}, {"n": "<span class=\"kk751-no\">5</span>AD, A açısının açıortayı; m(BAD) = 33°, m(B) = 71°. m(C) = ?", "c": "43°"}, {"n": "<span class=\"kk751-no\">6</span>Gelen ışın ayna ile 27°'lik açı yapıyor. Gelen ve yansıyan ışın arasındaki açı = ?", "c": "126°"}]}, {"no": 2, "bas": "Kareli zeminde orta noktayı işaretleyip kenarortayı çiziniz", "yon": "Her üçgende BC kenarının orta noktası M'yi işaretleyip AM kenarortayını çiziniz. M'nin B'den kaç kare sağda ve kaç kare yukarıda ya da aşağıda olduğunu yazınız.", "r": [{"n": "<span class=\"kk751-no\">1</span><svg style=\"width:34mm;height:auto;display:block\" viewBox=\"0 0 164 116\" width=\"164\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"18\" y1=\"18\" x2=\"18\" y2=\"98\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"34\" y1=\"18\" x2=\"34\" y2=\"98\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"50\" y1=\"18\" x2=\"50\" y2=\"98\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"66\" y1=\"18\" x2=\"66\" y2=\"98\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"82\" y1=\"18\" x2=\"82\" y2=\"98\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\" = m(C) = 70° olan ABC üçgeninde AB kenarı", "c": "Hiçbiri"}]}], "b": [{"no": 1, "on": "<p>Üçgen biçimli bir bahçenin A köşesinde bir çeşme vardır. Bahçenin BC kenarı boyunca bir duvar uzanmaktadır. Çeşmeden duvara düz bir su borusu döşenecek; boru duvara K, L, M ya da N noktalarından birinde ulaşacaktır. Bahçıvan en kısa boruyu döşemek istemektedir.</p>", "g": "<svg viewBox=\"0 0 430 232\" width=\"430\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"120.0,30.0 30.0,200.0 400.0,200.0\" fill=\"#ebfbee\" stroke=\"#2b8a3e\" stroke-width=\"3\" stroke-linejoin=\"round\"/><line x1=\"120.0\" y1=\"30.0\" x2=\"70.0\" y2=\"200.0\" stroke=\"#868e96\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><circle cx=\"70.0\" cy=\"200.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"70.0\" y=\"221.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">K</text><line x1=\"120.0\" y1=\"30.0\" x2=\"160.0\" y2=\"200.0\" stroke=\"#868e96\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><circle cx=\"160.0\" cy=\"200.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"160.0\" y=\"221.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">L</text><line x1=\"120.0\" y1=\"30.0\" x2=\"260.0\" y2=\"200.0\" stroke=\"#868e96\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><circle cx=\"260.0\" cy=\"200.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"260.0\" y=\"221.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">M</text><line x1=\"120.0\" y1=\"30.0\" x2=\"340.0\" y2=\"200.0\" stroke=\"#868e96\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><circle cx=\"340.0\" cy=\"200.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"340.0\" y=\"221.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" f na dik inmekte ve BC'nin uzantısındaki güverteye kadar uzanmaktadır. Yelkenin BC kenarı 3,4 m'dir.</p>", "g": "<svg viewBox=\"0 0 360 280\" width=\"360\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><path d=\"M30 236 Q180 268 340 236 L320 250 Q180 276 50 250 Z\" fill=\"#c9d2e3\" stroke=\"#495057\"/><polygon points=\"110.0,30.0 110.0,220.0 320.0,220.0\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><line x1=\"104.0\" y1=\"30.0\" x2=\"104.0\" y2=\"240.0\" stroke=\"#8a6d1d\" stroke-width=\"6\" stroke-linecap=\"round\"/><circle cx=\"110.0\" cy=\"30.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"110.0\" y=\"19.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"110.0\" cy=\"220.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"95.0\" y=\"230.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"320.0\" cy=\"220.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"335.0\" y=\"230.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><text x=\"215.0\" y=\"242.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">3,4 m</text><text x=\"94.0\" y=\"140.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#8a6d1d\" text-anchor=\"end\">direk</text></svg>", "son": "", "k": "Buna göre, yelkenin direk boyunca uzanan kenarı ile ilgili aşağıdakilerden hangisi doğrudur?", "sec": ["BC kenarına ait kenarortaydır.", "A açısının açıortayıdır.", "BC kenarına ait yüksekliktir; B açısı dik açıdır.", "BC kenarına ait kenar orta dikmedir."], "secg": null, "c": "C", "a": ["Direk boyunca uzanan AB kenarı BC'ye diktir.", "Köşeden karşı kenara dik inen doğru parçası yüksekliktir; dik kenarlar birbirine ait yüksekliktir."], "t": "Kenarortay BC'nin orta noktasına gider; açıortay A açısını böler; kenar orta dikme BC'yi ortalamalıdır", "d": "Direk kenarı ile taban arasındaki açı diktir; köşeden karşı kenara dik inen doğru parçası yüksekliktir. Dik kenarlar birbirine ait yüksekliktir.", "ses": "b04"}, {"no": 5, "on": "<p>Bir evin çatı makası, |AB| = |AC| olan ABC ikizkenar üçgeni biçimindedir. Makasın ortasındaki dikme A köşesinden BC tabanına dik inmekte ve BC'yi H noktasında kesmektedir.</p>", "g": "<svg viewBox=\"0 0 400 238\" width=\"400\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"20\" y=\"190\" width=\"360\" height=\"14\" fill=\"#e9ecef\" stroke=\"#868e96\"/><polygon points=\"200.0,50.0 40.0,190.0 360.0,190.0\" fill=\"#fff3bf\" stroke=\"#8a6d1d\" stroke-width=\"5\" stroke-linejoin=\"round\"/><line x1=\"200.0\" y1=\"50.0\" x2=\"200.0\" y2=\"190.0\" stroke=\"#8a6d1d\" stroke-width=\"5\" stroke-linecap=\"round\"/><circle cx=\"200.0\" cy=\"50.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"200.0\" y=\"39.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"40.0\" cy=\"190.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"25.0\" y=\"200.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"360.0\" cy=\"190.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"375.0\" y=\"200.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><circle cx=\"200.0\" cy=\"190.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"200.0\" y=\"213.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">H</text><text x=\"200.0\" y=\"228.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">BC = 7,6 m</text></svg>", "son": "", "k": "Buna göre, |BH| kaç metredir?", "sec": ["7,6", "3,8", "1,9", "2,5"], "secg": null, "c": "B", "a": ["İkizkenar üçgende tabana ait yükseklik aynı zamanda kenarortaydır.", "H, BC'nin orta noktasıdır: 7,6 : 2 = 3,8 m."], "t": "7,6: tabanın tamamı; 1,9: dörde bölünmüş; 2,5: üçe bölünmüş", "d": "İkizkenar üçgende tabana ait yükseklik aynı zamanda kenarortaydır; tabanı iki eşit parçaya ayırır.", "ses": "b05"}, {"no": 6, "on": "<p>Mert, üçgen biçimli düzgün bir kartonu kalemin ucunda dengede tutmak istemektedir. Bunun için kartonun üzerine bazı çizgiler çizecek ve çizgilerin kesiştiği noktayı kalemin ucuna koyacaktır.</p>", "g": "<svg viewBox=\"0 0 370 256\" width=\"370\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"150.0,30.0 40.0,200.0 330.0,170.0\" fill=\"#ffe8cc\" stroke=\"#111111\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><circle cx=\"150.0\" cy=\"30.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"146.5\" y=\"20.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"40.0\" cy=\"200.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"25.7\" y=\"212.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"330.0\" cy=\"170.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"345.6\" y=\"179.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><line x1=\"200\" y1=\"210\" x2=\"200\" y2=\"250\" stroke=\"#495057\" stroke-width=\"4\"/><text x=\"208.0\" y=\"246.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#495057\" text-anchor=\"start\">kalem</text></svg>", "son": "", "k": "Buna göre, Mert'in çizmesi gereken çizgiler aşağıdakilerden hangisidir?", "sec": ["İki kenarortay", "İki yükseklik", "İki kenar orta dikme", "İki açıortay"], "secg": null, "c": "A", "a": ["Karton ağırlık merkezinden desteklenince dengede durur.", "Ağırlık merkezi kenarortayların kesişim noktasıdır; iki kenarortay yeter."], "t": "Yüksekliklerin, kenar orta dikmelerin ve açıortayların kesişim noktası çeşitkenar üçgende ağırlık merkezi değildir", "d": "Denge noktası ağırlık merkezidir; ağırlık merkezi yalnız kenarortayların kesişim noktasıdır. Öbür elemanların kesişim noktası çeşitkenar üçgende farklı yerdedir.", "ses": "b06"}, {"no": 7, "on": "<p>İki kardeş, ABC üçgeni biçimindeki bir tarlayı A köşesinden BC kenarına çekilecek düz bir çitle alanları eşit iki parçaya ayıracaktır. Tarlanın BC kenarı 58 m, A köşesinden BC'ye inen yüksekliği 34 m'dir.</p>", "g": "<svg viewBox=\"0 0 420 240\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"150.0,40.0 40.0,200.0 380.0,200.0\" fill=\"#d3f9d8\" stroke=\"#2b8a3e\" stroke-width=\"3\" stroke-linejoin=\"round\"/><line x1=\"150.0\" y1=\"40.0\" x2=\"150.0\" y2=\"200.0\" stroke=\"#d9480f\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><polyline points=\"159.0,200.0 159.0,191.0 150.0,191.0\" fill=\"none\" stroke=\"#d9480f\" stroke-width=\"1.4\"/><text x=\"144.0\" y=\"130.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#d9480f\" text-anchor=\"end\">34 m</text><line x1=\"40.0\" y1=\"224.0\" x2=\"380.0\" y2=\"224.0\" stroke=\"#8a93a6\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><rect x=\"186\" y=\"214\" width=\"48\" height=\"20\" fill=\"#fff\"/><text x=\"210.0\" y=\"229.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">58 m</text><circle cx=\"150.0\" cy=\"40.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"150.0\" y=\"29.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"40.0\" cy=\"200.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"25.0\" y=\"210.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"380.0\" cy=\"200.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"395.0\" y=\"210.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><circle cx=\"150.0\" cy=\"200.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"150.0\" y=\"221.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">H</text></svg>", "son": "", "k": "Buna göre, çitin BC kenarına ulaştığı nokta ve bir parçanın alanı aşağıdakilerden hangisinde birlikte doğru verilmiştir?", "sec": ["H noktası · 493 m²", "BC'nin orta noktası · 986 m²", "A açısının açıortayının ayağı · 493 m²", "BC'nin orta noktası · 493 m²"], "secg": null, "c": "D", "a": ["Çit A'yı BC'nin orta noktasına birleştirirse kenarortay olur; iki parçanın tabanları eşit (29 m), yükseklikleri ortaktır.", "Bir parçanın alanı 29 · 34 : 2 = 493 m²."], "t": "H noktası: yükseklik ayağı tabanı ikiye bölmez; 986 m²: tarlanın tamamı; açıortay ayağı çeşitkenar üçgende orta nokta değildir", "d": "Alanı ikiye bölen çit kenarortaydır: iki parçanın tabanları eşittir, yükseklikleri ortaktır. Yarım tabanla alanı hesaplamayı unutmayınız.", "ses": "b07"}, {"no": 8, "on": "<p>Üç ev, birleştirildiğinde geniş açılı bir üçgen oluşturacak şekilde konumlanmıştır. Bir telefon şirketi, üç eve eşit uzaklıkta bir anten kuracaktır. Antenin yeri, evleri birleştiren doğru parçalarının kenar orta dikmelerinin kesişim noktasıdır.</p>", "g": "<svg viewBox=\"0 0 430 210\" width=\"430\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"49\" y=\"144\" width=\"22\" height=\"16\" fill=\"#fff4e6\" stroke=\"#d9480f\" stroke-width=\"1.4\"/><polygon points=\"46,144 60,131 74,144\" fill=\"#d9480f\"/><rect x=\"169\" y=\"64\" width=\"22\" height=\"16\" fill=\"#fff4e6\" stroke=\"#d9480f\" stroke-width=\"1.4\"/><polygon points=\"166,64 180,51 194,64\" fill=\"#d9480f\"/><rect x=\"369\" y=\"154\" width=\"22\" height=\"16\" fill=\"#fff4e6\" stroke=\"#d9480f\" stroke-width=\"1.4\"/><polygon points=\"366,154 380,141 394,154\" fill=\"#d9480f\"/><text x=\"60.0\" y=\"186.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">1. ev</text><text x=\"180.0\" y=\"106.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2. ev</text><text x=\"380.0\" y=\"196.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">3. ev</text><polygon points=\"60.0,150.0 180.0,70.0 380.0,160.0\" fill=\"none\" stroke=\"#868e96\" stroke-width=\"1.4\" stroke-dasharray=\"6 5\" stroke-linejoin=\"round\"/><text x=\"195.0\" y=\"96.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\"></text></svg>", "son": "", "k": "Buna göre, antenin yeri için aşağıdakilerden hangisi doğrudur?", "sec": ["Evlerin oluşturduğu üçgenin iç bölgesindedir.", "1. ev ile 3. evi birleştiren doğru parçasının üzerindedir.", "Evlerin oluşturduğu üçgenin dış bölgesindedir.", "2. evin bulunduğu yerdedir."], "secg": null, "c": "C", "a": ["Kenar orta dikmelerin kesişim noktası dar açılı üçgende iç bölgede, dik üçgende dik açının karşısındaki kenarın üzerinde, geniş açılı üçgende dış bölgededir.", "Evlerin oluşturduğu üçgen geniş açılıdır."], "t": "İç bölge dar açılı üçgen içindir; kenar üzerinde olması için üçgen dik olmalıdır; köşe yüksekliklerin kesişimi için dik üçgende geçerlidir", "d": "Kenar orta dikmelerin kesişim noktasının yeri üçgenin açılarına bağlıdır: geniş açılı üçgende dış bölgededir.", "ses": "b08"}, {"no": 9, "on": "<p>Bir köyün haritası kareli zemine çizilmiştir. A köyü ile B ve C kasabalarını birleştiren BC yolu gösterilmiştir. Haritada bir karenin kenarı 50 m'yi göstermektedir. A köyünden BC yoluna en kısa bağlantı yolu yapılacaktır.</p>", "g": "<svg viewBox=\"0 0 256 212\" width=\"256\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"18\" y1=\"18\" x2=\"18\" y2=\"194\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"40\" y1=\"18\" x2=\"40\" y2=\"194\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"62\" y1=\"18\" x2=\"62\" y2=\"194\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"84\" y1=\"18\" x2=\"84\" y2=\"194\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"106\" y1=\"18\" x2=\"106\" y2=\"194\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"128\" y1=\"18\" x2=\"128\" y2=\"194\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"150\" y1=\"18\" x2=\"150\" y2=\"194\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"172\" y1=\"18\" x2=\"172\" y2=\"194\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"194\" y1=\"18\" x2=\"194\" y2=\"194\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"216\" y1=\"18\" x2=\"216\" y2=\"194\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"238\" y1=\"18\" x2=\"238\" y2=\"194\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"18\" y1=\"18\" x2=\"238\" y2=\"18\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"18\" y1=\"40\" x2=\"238\" y2=\"40\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"18\" y1=\"62\" x2=\"238\" y2=\"62\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"18\" y1=\"84\" x2=\"238\" y2=\"84\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"18\" y1=\"106\" x2=\"238\" y2=\"106\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"18\" y1=\"128\" x2=\"238\" y2=\"128\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"18\" y1=\"150\" x2=\"238\" y2=\"150\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"18\" y1=\"172\" x2=\"238\" y2=\"172\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"18\" y1=\"194\" x2=\"238\" y2=\"194\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><polygon points=\"84.0,40.0 18.0,172.0 216.0,172.0\" fill=\"#ffffff88\" stroke=\"#111111\" stroke-width=\"2.6\" stroke-linejo "#111111\" text-anchor=\"middle\">R</text><circle cx=\"412.9\" cy=\"164.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"428.9\" y=\"169.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">K</text></svg>", "son": "", "k": "Buna göre, ışının 2. aynaya çarptığı açı kaç derecedir?", "sec": ["35", "80", "55", "65"], "secg": null, "c": "D", "a": ["Yansıyan ışın 1. ayna ile de 35° yapar.", "OPR üçgeninde m(O) = 80°, m(P) = 35°: m(R) = 180 − 80 − 35 = 65°."], "t": "35: 1. aynadaki açı; 80: aynalar arasındaki açı; 55: 35'in tümleri alınmış", "d": "Yansıyan ışın aynayla, gelen ışınla aynı açıyı yapar. Sonra aynalar ve ışının oluşturduğu üçgende iç açılar toplamını kullanınız.", "ses": "b11"}, {"no": 12, "on": "<p>Eşkenar üçgen biçimindeki bir masanın üzerine bir vazo konacaktır. Ayşe vazoyu masanın üç kenarına eşit uzaklıkta, Can ise üç köşesine eşit uzaklıkta bir yere koymak istemektedir.</p>", "g": "<svg viewBox=\"0 0 300 240\" width=\"300\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"150.0,29.5 40.0,220.0 260.0,220.0\" fill=\"#f3d9a4\" stroke=\"#8a6d1d\" stroke-width=\"4\" stroke-linejoin=\"round\"/><circle cx=\"150.0\" cy=\"29.5\" r=\"3.3\" fill=\"#111111\"/><text x=\"150.0\" y=\"18.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"40.0\" cy=\"220.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"25.0\" y=\"230.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"260.0\" cy=\"220.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"275.0\" y=\"230.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text></svg>", "son": "", "k": "Buna göre, aşağıdakilerden hangisi doğrudur?", "sec": ["Ayşe'nin istediği nokta masanın ağırlık merkezidir; Can'ınki başka bir noktadır.", "Can'ın istediği nokta masanın dışındadır.", "İkisinin istediği nokta aynıdır; bu nokta masanın ağırlık merkezidir.", "Ayşe'nin istediği nokta bir kenarın orta noktasıdır."], "secg": null, "c": "C", "a": ["Kenarlara eşit uzaklıktaki nokta açıortayların, köşelere eşit uzaklıktaki nokta kenar orta dikmelerin kesişim noktasıdır.", "Eşkenar üçgende her kenarortay aynı zamanda açıortay ve kenar orta dikmedir; bu noktaların hepsi ağırlık merkezidir."], "t": "Eşkenar üçgende iki nokta farklı olamaz; kenar orta dikmelerin kesişimi yalnız geniş açılı üçgende dışarıdadır; kenarın orta noktası kenarlara eşit uzaklıkta değildir", "d": "Eşkenar üçgende kenarortay, açıortay, yükseklik ve kenar orta dikme aynı doğrulardır; bu yüzden bütün kesişim noktaları aynı noktadır.", "ses": "b12"}, {"no": 13, "on": "<p>Bir kamp çadırının ön yüzü, |AB| = |AC| = 2,5 m ve |BC| = 3 m olan ABC üçgeni biçimindedir. Çadırın orta direği A köşesinden BC'ye dik inmekte ve yeri H noktasında tutmaktadır.</p>", "g": "<svg viewBox=\"0 0 360 258\" width=\"360\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"180.0,40.0 60.0,210.0 300.0,210.0\" fill=\"#ffe8cc\" stroke=\"#d9480f\" stroke-width=\"3\" stroke-linejoin=\"round\"/><line x1=\"180.0\" y1=\"40.0\" x2=\"180.0\" y2=\"210.0\" stroke=\"#495057\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle cx=\"180.0\" cy=\"40.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"180.0\" y=\"29.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"60.0\" cy=\"210.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"45.0\" y=\"220.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"300.0\" cy=\"210.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"315.0\" y=\"220.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\" r arasındaki uzaklık kaç santimetredir?", "sec": ["3", "1,5", "2,5", "5"], "secg": null, "c": "B", "a": ["Yüksekliğin ayağı A'nın tam altındadır: B'den 2 kare sağda.", "Kenarortayın ayağı BC'nin orta noktasıdır: B'den 10 : 2 = 5 kare sağda.", "Aradaki uzaklık 5 − 2 = 3 kare = 3 · 0,5 = 1,5 cm."], "t": "3: kare sayısı santimetre sanılmış; 2,5: orta nokta B'ye uzaklık olarak alınmış; 5: orta noktanın kare sayısı", "d": "Yükseklik ayağı köşenin tam altında, kenarortay ayağı kenarın ortasındadır. Kare sayısını bulduktan sonra santimetreye çeviriniz.", "ses": "b14"}, {"no": 15, "on": "<p>Bir kilim ustası şeritteki üçgen motiflerin her birine, motifin kenarortayı olan simetri doğrularını iple işleyecektir. Şeritte 3 eşkenar, 3 ikizkenar (eşkenar olmayan) ve 1 çeşitkenar üçgen motif vardır. Ustanın işleyeceği her ip bir simetri doğrusudur.</p>", "g": "<svg viewBox=\"0 0 470 140\" width=\"470\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"6\" y=\"20\" width=\"458\" height=\"112\" rx=\"6\" fill=\"#fff\" stroke=\"#c92a2a\" stroke-width=\"2\"/><polygon points=\"20.0,120.0 70.0,120.0 45.0,76.7\" fill=\"#e5dbff\" stroke=\"#111111\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"80.0,120.0 130.0,120.0 105.0,40.0\" fill=\"#d0ebff\" stroke=\"#111111\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"140.0,120.0 190.0,120.0 165.0,76.7\" fill=\"#e5dbff\" stroke=\"#111111\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"200.0,120.0 270.0,120.0 215.0,50.0\" fill=\"#ffe8cc\" stroke=\"#111111\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"280.0,120.0 330.0,120.0 305.0,40.0\" fill=\"#d0ebff\" stroke=\"#111111\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"340.0,120.0 390.0,120.0 365.0,76.7\" fill=\"#e5dbff\" stroke=\"#111111\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"400.0,120.0 450.0,120.0 425.0,30.0\" fill=\"#d0ebff\" stroke=\"#111111\" stroke-width=\"2\" stroke-linejoin=\"round\"/></svg>", "son": "", "k": "Buna göre, usta toplam kaç ip işler?", "sec": ["7", "9", "15", "12"], "secg": null, "c": "D", "a": ["Eşkenar üçgende üç kenarortayın üçü de simetri doğrusudur: 3 · 3 = 9.", "İkizkenar üçgende yalnız tabana ait kenarortay simetri doğrusudur: 3 · 1 = 3.", "Çeşitkenar üçgenin simetri doğrusu yoktur: 0. Toplam 9 + 3 = 12."], "t": "7: her motife bir ip; 9: yalnız eşkenarlar sayılmış; 15: ikizkenarlara da üçer ip verilmiş", "d": "Eşkenar üçgende üç, ikizkenar üçgende bir, çeşitkenar üçgende hiç simetri doğrusu yoktur. Her motif türünü ayrı sayınız.", "ses": "b15"}, {"no": 16, "on": "<p>Çeşitkenar ABC üçgeni biçimli bir arsada A köşesinden BC kenarına üç çit çekilmiştir: biri BC kenarına ait yükseklik, biri A açısının açıortayı, biri BC kenarına ait kenarortaydır. Çitlerin uzunlukları karışık sırayla 43 m, 49 m ve 45 m'dir.</p>", "g": "<svg viewBox=\"0 0 590 244\" width=\"590\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"160.0,40.0 20.0,210.0 560.0,210.0\" fill=\"#ebfbee\" stroke=\"#2b8a3e\" stroke-width=\"3\" stroke-linejoin=\"round\"/><line x1=\"160.0\" y1=\"40.0\" x2=\"160.0\" y2=\"210.0\" stroke=\"#495057\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><text x=\"160.0\" y=\"232.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">1. çit</text><line x1=\"160.0\" y1=\"40.0\" x2=\"201.6\" y2=\"210.0\" stroke=\"#495057\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><text x=\"201.6\" y=\"232.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2. çit</text><line x1=\"160.0\" y1=\"40.0\" x2=\"290.0\" y2=\"210.0\" stroke=\"#495057\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><text x=\"290.0\" y=\"232.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\       const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
