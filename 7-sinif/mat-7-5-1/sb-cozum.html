<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* ANA_KURALLAR §4.y-3: Etkinliklerde bütün kesirler kesir çizgisiyle (alt alta pay/payda) gösterilir. Düz yazılmış a/b biçimleri otomatik dönüştürülür. */
(function(){
  if (window.__kesirCizgi) return; window.__kesirCizgi = 1;
  const RX = /(^|[^\w\/.,:%])([−-])?(?:(\d+) )?(\d{1,4})\/(\d{1,4})(?![\w\/.,]\d|\w)/g;
  const ATLA = "script,style,svg,textarea,input,select,code,.ilr,.frac,[data-duz]";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function donustur(kok){
    if (!kok || !kok.nodeType) return;
    if (kok.nodeType === 3) kok = kok.parentElement;
    if (!kok || (kok.closest && kok.closest(ATLA))) return;
    const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      if (!/\d\/\d/.test(t.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = t.parentElement; if (!p || p.closest(ATLA)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const L = []; let t; while ((t = w.nextNode())) L.push(t);
    L.forEach(t => {
      let deg = false;
      const h = esc(t.nodeValue).replace(RX, (m, a, s, tam, p, q) => { deg = true;
        return a + (s ? "−" : "") + (tam ? tam + " " : "") + '<span class="frac"><span>' + p + "</span><span>" + q + "</span></span>"; });
      if (!deg) return;
      const k = document.createElement("span"); k.innerHTML = h; t.replaceWith(...k.childNodes);
    });
  }
  let bekleyen = new Set(), plan = 0;
  const calis = () => { plan = 0; const b = bekleyen; bekleyen = new Set(); b.forEach(donustur); };
  const gozcu = new MutationObserver(ms => { ms.forEach(m => {
      if (m.type === "characterData") bekleyen.add(m.target); else m.addedNodes.forEach(n => bekleyen.add(n)); });
    if (!plan) plan = requestAnimationFrame(calis); });
  const bas = () => { donustur(document.body); gozcu.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bas); else bas();
  const st = document.createElement("style");
  st.textContent = ".frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}.frac>span{display:block;text-align:center;padding:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor}";
  document.head.appendChild(st);
})();

/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {

    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });

    async function dagit(k) {

      const kolon = Math.min(k, 6), satirK = Math.ceil(k / kolon), gw = kolon * 14 + 16, gh = satirK * 14 + 26;

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */
  function ATLA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Sonuç"] });
    let k = o.k, L = o.son; const W = 660, sol = 22, sag = 22, sk = (W - sol - sag) / L;

    const bA = dug("▶ Oynat"), bB = dug("+1 " + (o.adimAd || "adım"), "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bB, bS);
    let kA = null;
    if (o.kSec) { kA = adimci(o.kEtiket || "Adım:", 2, Math.floor(L / 2), k, v => { k = v; sifirla(); }); kut.prepend(kA.w); }

    const bT = dug(o.testDugme || "Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test);
    const ti = test.querySelector("input");
    function taban() {
      let sv = `<line x1="${sol}" y1="62" x2="${sol + L * sk}" y2="62" class="cn-ek"/>`;

      for (let v = 0; v <= L; v += adimT) sv += `<line x1="${sol + v * sk}" y1="${v % et ? 58 : 54}" x2="${sol + v * sk}" y2="66" class="cn-ek"/>` + (v % et ? "" : `<text x="${sol + v * sk}" y="82" text-anchor="middle" class="cn-et">${o.etYaz ? o.etYaz(v) : v}</text>`);
      sv += `<line x1="${sol + L * sk}" y1="30" x2="${sol + L * sk}" y2="70" class="cn-sinir"/><text x="${sol + L * sk}" y="24" text-anchor="end" class="cn-et">${o.sonEt || L}</text>`;

    }

      izle.forEach((v, i) => {

        sv += `<path d="M${x1} 62 Q${(x1 + x2) / 2} ${yy} ${x2} 62" class="cn-yay"/><circle cx="${x2}" cy="62" r="4.5" class="${o.renk ? o.renk(v, i + 1) : "cn-o"}"/>`;
        if (izle.length <= 14 || i === izle.length - 1 || i % Math.ceil(izle.length / 10) === 0) sv += `<text x="${x2}" y="${98}" text-anchor="middle" class="cn-et2">${v}</text>`;
      });

      const son = izle.length ? izle[izle.length - 1] : 0, ix = sol + son * sk;
      sv += `<text x="${ix}" y="50" text-anchor="middle" class="cn-kis">${o.simge || "●"}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W} 104" role="img" aria-label="${k} birimlik adımlarla ilerleme">${sv}</svg>`;
    }
    const ileri = () => {
      const v = (n + 1) * k;
      if (v > L) { durdur(); s.dur.innerHTML = `<span class="kotu">■</span> Sonraki ${o.adimAd || "adım"} ${k} ${x} ${n + 1} = <b>${v}</b> olurdu; bu ${E(L,"den")} büyük. ${o.bitti ? o.bitti(n, k, L) : `Toplam ${n} ${o.adimAd || "adım"}; son değer ${n * k}.`}`; if (!izle.length) ciz(); return false; }
      n++; izle.push(v); ciz(); s.dur.innerHTML = o.durum ? o.durum(n, v, k) : `${n}. ${o.adimAd || "adım"}: ${k} ${x} ${n} = <b>${v}</b>`; return true;

      s.dur.innerHTML = m; s.yaz("t" + v, [v, r === 0 ? (ic ? `${k} ${x} ${b} ✔` : `${k} ${x} ${b} (sınır dışı)`) : `kalan ${r} ✘`], r === 0 && ic);

  }

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || [o.kAd || "k", "Boyanan", "En büyük"] });
    let k = o.k || 2, son = o.son;
    const kut = h("div", "cn-satir");

    if (o.sonSec) { const sw = h("div", "cn-hazir"); o.sonSec.forEach(v => { const b = dug(v + " gün", "ghost"); b.onclick = () => { son = v; kur(); temiz(); }; sw.appendChild(b); }); s.den.append(kut, sw); }

      const g = h("div", "cn-izg" + (o.takvim ? " cn-tak" : "")); g.style.gridTemplateColumns = `repeat(${o.sutunSay},1fr)`;

    function temiz() { hucre.forEach(c => c && c.classList.remove("on", "yeni")); s.dur.innerHTML = o.ilk || "Sayıyı seçip Boya düğmesine basın."; }

      }

      s.yaz(k + ":" + son, o.satir ? o.satir(k, say, enb, son) : [k, say, enb], o.iyi ? o.iyi(k, say, enb, son) : null);
      calis = false; bB.disabled = false;

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */
  function ASANSOR(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Açık asansörler", "Gidilen kat", "Gidilemeyen kat"] });
    const ac = o.asansor.map(() => false);
    const kut = h("div", "cn-satir"); const bt = o.asansor.map((a, i) => { const b = dug(a.ad, "ghost"); b.style.setProperty("--ac", a.renk); b.setAttribute("aria-pressed", "false"); b.onclick = () => { ac[i] = !ac[i]; b.setAttribute("aria-pressed", ac[i]); ciz(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    function ciz() {
      let sv = ""; const H = o.kat * 17 + 40; let git = 0, gitme = [];
      for (let f = o.kat; f >= 0; f--) {

        sv += `<rect x="60" y="${y}" width="150" height="15" rx="2" class="${f === 0 ? "cn-zem" : herhangi ? "cn-katon" : (ac.some(Boolean) ? "cn-katoff" : "cn-kat")}"/><text x="52" y="${y + 12}" text-anchor="end" class="cn-et">${f === 0 ? "Z" : f}</text>`;
        o.asansor.forEach((a, i) => { if (dur[i]) sv += `<circle cx="${230 + i * 22}" cy="${y + 7.5}" r="6" fill="${a.renk}"/>`; });
      }
      s.sah.innerHTML = `<svg viewBox="0 0 300 ${H}" style="max-height:440px" role="img" aria-label="${o.kat} katlı bina">${sv}</svg>`;
      const acik = o.asansor.filter((a, i) => ac[i]).map(a => a.ad);

      s.yaz(acik.join("+"), [acik.join(" + "), git, gitme.length], null);

    ciz();
  }

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */
  function SAAT(el, o) {

      let onc = null, snr = null;
      for (let m = bas; m <= bit + ara; m += ara) { if (m <= var_) onc = m; if (m >= var_ && snr == null) snr = m; if (m <= bit) sv += `<text x="${20 + (m - bas) * sk}" y="40" text-anchor="middle" class="cn-bus">🚌</text>`; }

      if (snr != null && snr <= bit + ara) { const sx = 20 + (Math.min(snr, bit) - bas) * sk; sv += `<path d="M${vx} 56 L${sx} 56" class="cn-bek"/>`; }

      const gec = var_ - bas;
      s.dur.innerHTML = `${o.kisi} durağa ${saDa(var_)} geliyor: ilk seferden <b>${gec} dakika</b> sonra. Seferler ${E(ara,"in")} katı olan dakikalarda: ${ara} ${x} ${Math.floor(gec / ara)} = ${Math.floor(gec / ara) * ara}` + (gec % ara ? `, ${ara} ${x} ${Math.floor(gec / ara) + 1} = ${(Math.floor(gec / ara) + 1) * ara}. Sonraki otobüs ${saDa(snr)}; bekleme <b>${snr - var_} dakika</b>.` : `. Tam sefer saatinde geldi; bekleme <b>0 dakika</b>.`);
      s.yaz(ara + ":" + var_, [ara + " dk", sa(var_), sa(onc), sa(snr), (snr - var_) + " dk"], null);
    }
    ciz();
  }

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Çarpanlar", "Çarpan sayısı"] });
    let N = o.N || o.hazir[0]; let bul = new Set(), denendi = new Set();
    const kut = h("div", "cn-satir");
    const sA = adimci("Sayı:", 2, o.max || 200, N, v => { N = v; yeni(); });
    kut.appendChild(sA.w);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => sA.ayarla(n); hz.appendChild(b); }); kut.appendChild(hz); }
    s.den.appendChild(kut);
    const bolen = h("div", "cn-satir cn-test"); bolen.innerHTML = `<label>Bölen deneyin: <input type="number" inputmode="numeric" min="1"></label>`;
    const bD = dug("Böl"), bS = dug("Sıradakini dene", "ghost"); bolen.append(bD, bS); s.den.appendChild(bolen);
    const bi = bolen.querySelector("input");
    let bK = null; if (o.katlar) { bK = dug(o.katDugme || "Katlarını say ▶", "ghost"); s.den.appendChild(bK); }
    const ciftler = h("div", "cn-cift"); const katlar = h("div", "cn-katlar");
    function yeni() { bul = new Set(); denendi = new Set(); ciz(); s.dur.innerHTML = `${N} sayısını 1, 2, 3, … sayılarına bölerek çarpan çiftlerini bulun.`; katlar.textContent = ""; }
    function ciz() {
      const L = [...bul].sort((a, b) => a - b);
      s.sah.innerHTML = ""; const kartlar = h("div", "cn-kartlar");
      L.forEach(v => kartlar.appendChild(h("span", "cn-kart" + (v * v === N ? " kare" : ""), v)));
      if (!L.length) kartlar.appendChild(h("span", "cn-bosk", "Henüz çarpan bulunmadı"));
      s.sah.append(kartlar, ciftler, katlar);
      ciftler.innerHTML = L.filter(v => v * v <= N).map(v => `<span>${v} ${x} ${N / v}${v * v === N ? " <i>(aynı sayı: bir kez yazılır)</i>" : ""}</span>`).join("");
    }
    const tamamMi = () => { for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) return false; return true; };
    const eksik = () => { const L = []; for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) L.push(i); return ` <br>Henüz denenmeyen küçük bölenler var: <b>${L.join(", ")}</b>. Bunları da deneyin.`; };
    function dene(d) {
      if (!d || d < 1) return; denendi.add(d);
      const b = Math.floor(N / d), r = N % d;
      if (d > N) { s.dur.innerHTML = `${d} > ${N}: ${E(N,"den")} büyük sayı ${E(N,"in")} çarpanı olamaz.`; return; }
      if (r === 0) { bul.add(d); bul.add(b); ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${N} : ${d} = ${b}, kalan 0 → <b>${d} ${x} ${b} = ${N}</b>. ${d} ve ${b} çarpandır.` + (d * d >= N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} ${d * d === N ? "=" : ">"} ${N}. Artık yeni çift çıkmaz; bütün çarpanlar bulundu.` : eksik() : ""); }
      else { s.dur.innerHTML = `<span class="kotu">✘</span> ${N} : ${d} işleminde bölüm ${b}, <b>kalan ${r}</b>. ${d}, ${E(N,"in")} çarpanı değildir.` + (d * d > N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} > ${N}. Daha büyük bölen denemeye gerek yok; çarpan listesi tamam.` : eksik() : ""); }
      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));
      if (tamam) s.yaz("n" + N, [N, [...bul].sort((a, b) => a - b).join(", "), bul.size], true);
    }
    bD.onclick = () => dene(Math.round(+bi.value));
    bS.onclick = () => { let d = 1; while (denendi.has(d)) d++; bi.value = d; dene(d); };
    if (bK) bK.onclick = async () => {
      bK.disabled = true; katlar.textContent = ""; const sat = h("div", "cn-katsat"); katlar.append(h("b", "", `${E(N,"in")} katları: `), sat);
      for (let i = 1; i <= (o.katSay || 12); i++) { sat.appendChild(h("span", "cn-kat2", `${N * i}`)); await bekle(220); }
      sat.appendChild(h("span", "cn-sonsuz", "… ve sonsuza kadar sürer"));
      bK.disabled = false;
    };
    yeni();
  }

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */
  function KUMBARA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Para", "Sonuç"] });
    const k = o.k; let hafta = 0, tmr = null;
    const kut = h("div", "cn-satir"); const bA = dug("Bir hafta geçsin +"), bO = dug("▶ Haftaları oynat", "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bO, bS); s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Kumbarada şu para olabilir mi? <input type="number" inputmode="numeric" min="1" max="500"> TL</label>`;
    const bT = dug("Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test); const ti = test.querySelector("input");
    function ciz() {
      const top = hafta * k, sv = [];
      const yuk = Math.min(150, top * 1.4);
      sv.push(`<rect x="110" y="20" width="120" height="160" rx="22" class="cn-kum"/><rect x="150" y="14" width="40" height="8" rx="3" class="cn-kum2"/>`);
      sv.push(`<rect x="116" y="${176 - yuk}" width="108" height="${yuk}" rx="10" class="cn-para"/>`);
      sv.push(`<text x="170" y="110" text-anchor="middle" class="cn-buyuk">${top} TL</text><text x="170" y="134" text-anchor="middle" class="cn-et">${hafta}. hafta</text>`);
      let cizgi = ""; for (let i = 1; i <= hafta && i <= 16; i++) cizgi += `<text x="${260 + ((i - 1) % 4) * 52}" y="${40 + Math.floor((i - 1) / 4) * 34}" class="cn-et2">${k}${x}${i}=${k * i}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 480 190" role="img" aria-label="Kumbara">${sv.join("")}${cizgi}</svg>`;
      s.dur.innerHTML = hafta ? `${hafta}. hafta sonunda kumbarada ${k} ${x} ${hafta} = <b>${top} TL</b> var.` : `Kumbara boş. Her hafta ${k} TL atılıyor.`;
    }
    bA.onclick = () => { hafta++; ciz(); };
    bO.onclick = () => { if (tmr) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } bO.textContent = "❚❚ Durdur"; tmr = setInterval(() => { if (hafta >= 15) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } hafta++; ciz(); }, az ? 50 : 500); };
    bS.onclick = () => { hafta = 0; ciz(); };
    bT.onclick = () => {
      const v = Math.round(+ti.value); if (!v) return; const b = Math.floor(v / k), r = v % k;
      s.dur.innerHTML = r ? `<span class="kotu">✘</span> ${k} ${x} ${b} = ${k * b} TL, ${k} ${x} ${b + 1} = ${k * (b + 1)} TL. ${v} TL arada kalır (${v} : ${k} → kalan ${r}). Kumbarada hiçbir hafta ${v} TL olmaz.`
        : `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · ${b}. hafta sonunda kumbarada tam ${v} TL olur.`;
      if (!r) { hafta = b; ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · <b>${b}. hafta</b> sonunda kumbarada tam ${v} TL olur.`; }
      s.yaz("t" + v, [v + " TL", r ? `kalan ${r} ✘` : `${k} ${x} ${b} ✔`], !r);
    };
    ciz();
  }

  /* 9) ÖNERME LABORATUVARI: önermeyi farklı sayılarla sınama */
  function ONERME(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Önerme", "Sayı", "Sonuç"] });
    let akt = 0; const kut = h("div", "cn-hazir");
    const bt = o.onermeler.map((on, i) => { const b = dug(on.ad, "ghost"); b.setAttribute("aria-pressed", i === 0); b.onclick = () => { akt = i; bt.forEach((x, j) => x.setAttribute("aria-pressed", j === i)); goster(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Sınanacak sayı: <input type="number" inputmode="numeric" min="1" max="200" value="12"></label>`;
    const bT = dug("Sına"), bR = dug("Rastgele sayı", "ghost"); test.append(bT, bR); s.den.appendChild(test); const ti = test.querySelector("input");
    function goster() { s.sah.innerHTML = `<div class="cn-onr"><b>${o.onermeler[akt].ad}:</b> “${o.onermeler[akt].metin}”</div>`; s.dur.innerHTML = "Bir sayı yazıp Sına düğmesine basın. Önerme her sayıda doğru mu?"; }
    function sina(n) {
      const on = o.onermeler[akt], r = on.sina(n);
      s.sah.innerHTML = `<div class="cn-onr"><b>${on.ad}:</b> “${on.metin}”</div><div class="cn-kanit">${r.goster}</div>`;
      s.dur.innerHTML = (r.ok ? `<span class="iyi">✔</span> ${n} için önerme doğru.` : `<span class="kotu">✘</span> ${n} için önerme yanlış! Bir karşı örnek bulundu.`) + (r.not ? " " + r.not : "");
      s.yaz(akt + ":" + n, [on.ad, n, r.ok ? "doğru" : "yanlış (karşı örnek)"], r.ok);
    }
    bT.onclick = () => { const n = Math.round(+ti.value); if (n > 0) sina(n); };
    bR.onclick = () => { const n = 2 + Math.floor(Math.random() * 59); ti.value = n; sina(n); };
    goster();
  }


  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →
     koşullar tek tek denetlenir (✔/✘) → deney defterine yazılır. Doğru cevap verilmez; öğrenci uygun girdiyi kendisi arar.
     o.girdi: [{ad, min, max, bas} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → SVG/HTML · o.kosullar: [{ad, f(v) → bool | {ok, not}}]
     o.dugme: düğme yazısı (false → her değişiklikte denetlenir) · o.sonuc(v, hepsi, L) · o.satir(v, hepsi, L) · o.iyi(v, L) · o.ek: [{ad, deger(v) → v}] */
  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);
      s.dur.innerHTML = m;
      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);
    }
    kur = true; ciz();
    if (bS) s.dur.innerHTML = o.ilk || "Değerleri seçip Sına düğmesine basın."; else sina();
  }

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

/* SORU BANKASI · MAT.7.5.1 · Üçgende Kenarortay, Açıortay ve Yükseklik — yeni nesil soruların "Canlandır" düzenekleri (16.10.2026) — ortak motor: canlandir.js (CN.KOSUL); yeni motor yok.
   Her düzenek: öğrenci seçim düğmeleri ya da − / + sayaçlarıyla durumu değiştirir → sahne anında çizilir → koşullar denetlenir →
   deneme deney defterine yazılır → yeniden dener. Doğru cevap bir düğmeyle verilmez; denemelerden çıkar (§4.k, §19-10).
   Üçgen geometrisi (ayak, açıortay ayağı, ağırlık merkezi, kesişim noktaları) bu dosyada ayrıca yazıldı (fasikülün canlandir_751.js dosyası gömülmez). */
window.CANL = (() => {
  if (!document.getElementById("csb751-stil")) { const st = document.createElement("style"); st.id = "csb751-stil";
    st.textContent = ".cn-btn{min-width:44px;min-height:44px}.cn-adimci button{min-width:44px;min-height:44px}.cn-secg button{min-height:44px}.csb751-k{text-align:center;font-size:17px;font-weight:800;margin:8px auto;max-width:640px;line-height:1.6}"; document.head.appendChild(st); }
  const D = (v, n = 1) => String(Math.round(v * 10 ** n) / 10 ** n).replace(".", ",");
  const R = a => a * Math.PI / 180, G_ = r => r * 180 / Math.PI;
  const yon = (a, r = 1) => [r * Math.cos(R(a)), -r * Math.sin(R(a))];
  const ek = (P, v, k = 1) => [P[0] + k * v[0], P[1] + k * v[1]];
  const uz = (P, Q) => Math.hypot(Q[0] - P[0], Q[1] - P[1]);
  const orta = (P, Q) => [(P[0] + Q[0]) / 2, (P[1] + Q[1]) / 2];
  const aci = (V, P, Q) => { let a = Math.abs(Math.atan2(-(P[1] - V[1]), P[0] - V[0]) - Math.atan2(-(Q[1] - V[1]), Q[0] - V[0])); a = G_(a); return a > 180 ? 360 - a : a; };
  const ayak = (X, P, Q) => { const dx = Q[0] - P[0], dy = Q[1] - P[1], t = ((X[0] - P[0]) * dx + (X[1] - P[1]) * dy) / (dx * dx + dy * dy); return [[P[0] + t * dx, P[1] + t * dy], t]; };
  const uzD = (X, P, Q) => uz(X, ayak(X, P, Q)[0]);
  const kesD = (P, Q, S, T) => { const d = (Q[0] - P[0]) * (T[1] - S[1]) - (Q[1] - P[1]) * (T[0] - S[0]); if (Math.abs(d) < 1e-9) return null; const t = ((S[0] - P[0]) * (T[1] - S[1]) - (S[1] - P[1]) * (T[0] - S[0])) / d; return [P[0] + t * (Q[0] - P[0]), P[1] + t * (Q[1] - P[1])]; };
  const aoAyak = (A, B, C) => { const b = uz(A, C), c = uz(A, B); return [B[0] + (C[0] - B[0]) * c / (b + c), B[1] + (C[1] - B[1]) * c / (b + c)]; };
  const agirlik = (A, B, C) => [(A[0] + B[0] + C[0]) / 3, (A[1] + B[1] + C[1]) / 3];
  const icM = (A, B, C) => { const a = uz(B, C), b = uz(A, C), c = uz(A, B), s = a + b + c; return [(a * A[0] + b * B[0] + c * C[0]) / s, (a * A[1] + b * B[1] + c * C[1]) / s]; };
  const disM = (A, B, C) => { const M1 = orta(A, B), M2 = orta(B, C); return kesD(M1, [M1[0] - (B[1] - A[1]), M1[1] + (B[0] - A[0])], M2, [M2[0] - (C[1] - B[1]), M2[1] + (C[0] - B[0])]); };
  const yukM = (A, B, C) => { const Ha = ayak(A, B, C)[0], Hb = ayak(B, A, C)[0]; return kesD(A, Ha, B, Hb); };
  const svg = (w, h, ic, ad) => `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${Math.round(w * 1.3)}px;height:auto;display:block;margin:0 auto" role="img" aria-label="${ad || "Çizim"}">${ic}</svg>`;
  const tx = (x, y, s, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.an || "middle"}" style="font-size:${o.fs || 14}px;font-weight:800;fill:${o.r || "#1d2433"};paint-order:stroke;stroke:#fff;stroke-width:4px">${s}</text>`;
  const dp = (P, Q, r = "#1d2433", w = 2.6, k = "") => `<line x1="${P[0]}" y1="${P[1]}" x2="${Q[0]}" y2="${Q[1]}" stroke="${r}" stroke-width="${w}" stroke-linecap="round"${k ? ` stroke-dasharray="${k}"` : ""}/>`;
  const pol = (L, f = "#f1f6ff", s = "#1d2433", w = 2.6) => `<polygon points="${L.map(p => p.join(",")).join(" ")}" fill="${f}" stroke="${s}" stroke-width="${w}" stroke-linejoin="round"/>`;
  const nok = (P, ad, a = 90, r = "#1d2433", rr = 5) => `<circle cx="${P[0]}" cy="${P[1]}" r="${rr}" fill="${r}"/>` + (ad ? tx(...ek(P, yon(a, 18)).map((v, i) => v + (i ? 5 : 0)), ad, { r: "#1d2433" }) : "");
  const adlar = (P, d = 18) => { const G = agirlik(P.A, P.B, P.C); return Object.keys(P).map(k => { const v = [P[k][0] - G[0], P[k][1] - G[1]], L = Math.hypot(...v); return tx(P[k][0] + v[0] / L * d, P[k][1] + v[1] / L * d + 5, k, { fs: 16 }); }).join(""); };
  const dik = (H, P, r = "#1d2433", s = 9) => { const v = [P[0] - H[0], P[1] - H[1]], L = Math.hypot(...v), u = [v[0] / L * s, v[1] / L * s], n = [-u[1], u[0]]; return `<polyline points="${ek(H, u)} ${ek(ek(H, u), n)} ${ek(H, n)}" fill="none" stroke="${r}" stroke-width="1.4"/>`; };
  const kutu = h => `<div class="csb751-k">${h}</div>`;
  const KO = (el, o) => CN.KOSUL(el, Object.assign({ dugme: false }, o));
  const KO_ = "#1c5fbf", AO = "#6741d9", YK = "#d9480f", OD = "#2b8a3e";

  return {
    /* 1 · Kumaş: kesim noktası; iki parçanın alanı (cm²) */
    1: el => { const k = 8, X = (x, y) => [30 + x * k, 226 - y * k], A = X(10, 24), B = X(0, 0), C = X(28, 0);
      return KO(el, { yon: "Kesimin BC kenarına ulaştığı noktayı − / + ile kaydırınız (B'ye uzaklığı, cm). İki parçanın alanı hesaplanır. Kumaşın alanı 336 cm²'dir.", bitis: "İki parçanın alanını eşit yapan kesimi bulduğunuzda.",
        girdi: [{ ad: "B'ye uzaklık (cm)", min: 2, max: 26, bas: 8 }],
        ciz: v => { const P = X(v[0], 0), s = 12 * v[0];
          return svg(300, 250, pol([A, B, P], "#d0ebff", "#1c5fbf") + pol([A, P, C], "#ffe8cc", "#1c5fbf") + dp(A, P, "#c92a2a", 3, "7 5") + adlar({ A, B, C }) + nok(P, "", 0, "#c92a2a"), "Kumaş")
            + kutu(`Sol parça: ${s} cm² · sağ parça: ${336 - s} cm²`); },
        kosullar: [{ ad: "İki parçanın alanı eşit.", f: v => v[0] === 14 }],
        sutun: ["B'ye uzaklık", "Sol parça", "Sağ parça"], satir: v => [v[0] + " cm", 12 * v[0] + " cm²", 336 - 12 * v[0] + " cm²"] }); },

    /* 2 · Geometri yazılımı: araç sırası */
    2: el => { const A = [150, 50], B = [40, 200], C = [360, 200], M = orta(B, C);
      const T = { "Orta nokta → Doğru parçası": () => [dp(A, M, KO_, 3), true, true], "Dik doğru → Doğru parçası": () => { const H = ayak(A, B, C)[0]; return [dp(A, H, KO_, 3) + dik(H, C), true, false]; },
        "Açıortay → Orta nokta": () => { const Dd = aoAyak(A, B, C); return [dp(A, Dd, KO_, 3) + nok(M, "", 0, "#c92a2a"), true, false]; },
        "Orta nokta → Dik doğru": () => [dp([M[0], 20], [M[0], 220], KO_, 3) + dik(M, C), false, true] };
      return KO(el, { yon: "Araçların kullanılma sırasını seçiniz; yazılım çizimi yapar. Kenarortay A köşesinden geçmeli ve BC'nin orta noktasına varmalıdır.", bitis: "BC kenarına ait kenarortayı çizen sırayı bulduğunuzda.",
        girdi: [{ ad: "Sıra:", sec: Object.keys(T), bas: "Dik doğru → Doğru parçası" }],
        ciz: v => { const [s] = T[v[0]](); return svg(400, 230, `<rect x="2" y="2" width="396" height="226" rx="10" fill="#fff" stroke="#adb5bd"/>` + pol([A, B, C]) + s + adlar({ A, B, C }) + nok(M, "", 0, "#868e96", 3), "Yazılım ekranı"); },
        kosullar: [{ ad: "Çizgi A köşesinden geçiyor.", f: v => T[v[0]]()[1] }, { ad: "Çizgi BC'nin orta noktasından geçiyor.", f: v => T[v[0]]()[2] }],
        sutun: ["Sıra", "A'dan geçer mi?", "Orta noktadan geçer mi?"], satir: v => { const r = T[v[0]](); return [v[0], r[1] ? "Evet" : "Hayır", r[2] ? "Evet" : "Hayır"]; } }); },

    /* 3 · Trafik adası: üç caddeye eşit uzaklık */
    3: el => { const A = [190, 30], B = [40, 220], C = [380, 210], P = { A, B, C };
      const T = { "İki açıortay": () => { const I = icM(A, B, C); return [dp(A, aoAyak(A, B, C), AO, 2.4) + dp(B, aoAyak(B, C, A), AO, 2.4), I]; },
        "İki kenar orta dikme": () => { const O = disM(A, B, C), M1 = orta(B, C), M2 = orta(A, C); return [dp(M1, O, OD, 2.4, "7 5") + dp(M2, O, OD, 2.4, "7 5"), O]; },
        "İki kenarortay": () => { const G = agirlik(A, B, C); return [dp(A, orta(B, C), KO_, 2.4) + dp(B, orta(A, C), KO_, 2.4), G]; } };
      const u = X => [uzD(X, A, B), uzD(X, B, C), uzD(X, A, C)].map(d => d / 10);
      return KO(el, { yon: "Planda hangi iki çizginin çizileceğini seçiniz. Kesişim noktası işaretlenir ve bu noktanın üç caddeye (kenarlara) uzaklığı ölçülür (m).", bitis: "Üç caddeye eşit uzaklıktaki noktayı veren çizgileri bulduğunuzda.",
        girdi: [{ ad: "Çizgiler:", sec: Object.keys(T), bas: "İki kenarortay" }],
        ciz: v => { const [s, X] = T[v[0]](), d = u(X); return svg(420, 240, pol([A, B, C], "#d3f9d8", "#2b8a3e", 3) + s + adlar(P) + nok(X, "", 0, "#c92a2a", 6), "Trafik adası planı")
          + kutu(`Uzaklıklar: ${D(d[0])} m · ${D(d[1])} m · ${D(d[2])} m`); },
        kosullar: [{ ad: "Nokta üç caddeye eşit uzaklıkta.", f: v => { const d = u(T[v[0]]()[1]); return Math.max(...d) - Math.min(...d) < .05; } }],
        sutun: ["Çizgiler", "Uzaklıklar (m)"], satir: v => [v[0], u(T[v[0]]()[1]).map(x => D(x)).join(" · ")] }); },

    /* 4 · Merdiven: tepeden yere inen doğru */
    4: el => { const h = 70 / Math.tan(R(17)), X = (x, y) => [120 + x, 255 - y], T0 = X(70, h), L = X(0, 0), Rr = X(140, 0);
      return KO(el, { yon: "Tepeden yere inen doğrunun yere değdiği noktayı − / + ile kaydırınız (sol ayaktan uzaklık, 10 cm'lik adımlarla). Doğrunun yerle ve iki ayakla yaptığı açılar ölçülür.", bitis: "Çekülün ineceği yeri (yere dik doğru) bulduğunuzda.",
        girdi: [{ ad: "Sol ayaktan (×10 cm)", min: 3, max: 11, bas: 4 }],
        ciz: v => { const P = X(10 * v[0], 0), ag = aci(P, T0, Rr), s1 = aci(T0, L, P), s2 = aci(T0, P, Rr);
          return svg(380, 270, dp([20, 255], [360, 255], "#868e96", 4) + dp(T0, L, "#8a5a2b", 8) + dp(T0, Rr, "#8a5a2b", 8) + dp(T0, P, "#495057", 2, "5 4") + nok(T0, "", 0, "#495057", 7) + nok(P, "", 0, "#c92a2a"), "Merdiven")
            + kutu(`Yerle açı: ${D(ag)}° · sol ayakla: ${D(s1)}° · sağ ayakla: ${D(s2)}°<br>Ayaklara uzaklık: ${D(v[0] / 10)} m ve ${D(1.4 - v[0] / 10)} m`); },
        kosullar: [{ ad: "Doğru yere dik (çekül böyle iner).", f: v => v[0] === 7 }],
        sutun: ["Sol ayaktan", "Yerle açı", "Sol ayakla", "Sağ ayakla"], satir: v => { const P = X(10 * v[0], 0); return [D(v[0] / 10) + " m", D(aci(P, T0, Rr)) + "°", D(aci(T0, L, P)) + "°", D(aci(T0, P, Rr)) + "°"]; } }); },

    /* 5 · Patikalar: yükseklik 412 m, açıortay 436 m, kenarortay 459 m (ölçekli üçgen) */
    5: el => { const k = .6, X = (x, y) => [30 + x * k, 270 - y * k], A = X(85.8, 412), B = X(0, 0), C = X(576.3, 0);
      const T = { Kırmızı: [ayak(A, B, C)[0], 412, "#e03131"], Mavi: [aoAyak(A, B, C), 436, "#1c5fbf"], Turuncu: [orta(B, C), 459, "#e8590c"] };
      const bilgi = c => { const [F, L] = T[c], a1 = aci(F, A, B), a2 = aci(F, A, C), dB = uz(B, F) / k; return { a1, a2, dB, orta: Math.abs(uz(B, F) - uz(F, C)) < 1, dik: Math.abs(a1 - 90) < .5, L }; };
      return KO(el, { yon: "Bir patika seçiniz; patika çizilir. Uzunluğu, yolla yaptığı açılar ve yola ulaştığı noktanın B'ye ve C'ye uzaklığı yazılır.", bitis: "Yolun ortasına inen ve yola dik inen patikaları bulduğunuzda.",
        girdi: [{ ad: "Patika:", sec: Object.keys(T), bas: "Mavi" }],
        ciz: v => { const [F, L, r] = T[v[0]], b = bilgi(v[0]);
          return svg(420, 300, pol([A, B, C], "#ebfbee", "#2b8a3e", 2) + dp([10, 270], [410, 270], "#495057", 6) + dp(A, F, r, 4) + nok(A, "A", 90) + nok(B, "B", 135) + nok(C, "C", 45) + nok(F, "", 0, r), "Göl kıyısı")
            + kutu(`${v[0]} patika: ${L} m · yolla açılar ${D(b.a1)}° ve ${D(b.a2)}°<br>B'ye ${Math.round(b.dB)} m · C'ye ${Math.round(576.3 - b.dB)} m`); },
        kosullar: [{ ad: "Patika yolun tam ortasına iniyor.", f: v => bilgi(v[0]).orta }, { ad: "Patika yola dik iniyor.", f: v => bilgi(v[0]).dik }],
        iyi: (v, L) => L.some(r => r.ok),
        sutun: ["Patika", "Uzunluk", "Ortaya mı?", "Dik mi?"], satir: v => { const b = bilgi(v[0]); return [v[0], b.L + " m", b.orta ? "Evet" : "Hayır", b.dik ? "Evet" : "Hayır"]; } }); },

    /* 6 · Askı: alt teldeki nokta */
    6: el => { const k = 9, h = 21 / Math.tan(R(59)), X = (x, y) => [20 + x * k, 210 - y * k], T0 = X(21, h), L = X(0, 0), Rr = X(42, 0);
      return KO(el, { yon: "Tepeden alt tele inen doğrunun alt teli kestiği noktayı − / + ile kaydırınız (sol uca uzaklık, cm). Doğrunun kollarla ve alt telle yaptığı açılar ölçülür.", bitis: "Kancadan inen düşey doğrunun yerini bulduğunuzda.",
        girdi: [{ ad: "Sol uca uzaklık (cm)", min: 9, max: 33, bas: 14 }],
        ciz: v => { const P = X(v[0], 0), a1 = aci(T0, L, P), a2 = aci(T0, P, Rr), al = aci(P, T0, Rr);
          return svg(420, 240, dp([20, 30], [400, 30], "#868e96", 5) + `<path d="M${T0[0]} ${T0[1]} L${T0[0]} 52 Q${T0[0]} 30 ${T0[0] + 16} 36" fill="none" stroke="#495057" stroke-width="4"/>` + pol([T0, L, Rr], "none", "#868e96", 5) + dp(T0, P, "#c92a2a", 2.4, "6 4") + nok(P, "", 0, "#c92a2a"), "Askı")
            + kutu(`Sol kolla: ${D(a1)}° · sağ kolla: ${D(a2)}° · alt telle: ${D(al)}°`); },
        kosullar: [{ ad: "Doğru alt tele dik (düşey).", f: v => v[0] === 21 }],
        sutun: ["Sol uca", "Sol kolla", "Sağ kolla", "Alt telle"], satir: v => { const P = X(v[0], 0); return [v[0] + " cm", D(aci(T0, L, P)) + "°", D(aci(T0, P, Rr)) + "°", D(aci(P, T0, Rr)) + "°"]; } }); },

    /* 7 · Sehpa: ayağın yeri */
    7: el => { const s = 30, X = (i, j) => [20 + i * s, 230 - j * s], A = X(1, 1), B = X(10, 1), C = X(4, 7), G = agirlik(A, B, C);
      let gr = ""; for (let i = 0; i <= 11; i++) gr += dp([20 + i * s, 20], [20 + i * s, 260], "#dee2e6", 1); for (let j = 0; j <= 8; j++) gr += dp([20, 20 + j * s], [350, 20 + j * s], "#dee2e6", 1);
      return KO(el, { yon: "Ayağın A köşesinden sağa ve yukarı uzaklığını kare sayısıyla seçiniz (1 kare = 10 cm). Camın hangi yöne eğileceği gösterilir. İsterseniz kenarortayları çizdirin.", bitis: "Camın dengede kaldığı yeri bulduğunuzda.",
        girdi: [{ ad: "Sağa (kare)", min: 0, max: 8, bas: 2 }, { ad: "Yukarı (kare)", min: 0, max: 5, bas: 1 }, { ad: "Kenarortaylar:", sec: ["Gizle", "Göster"], bas: "Gizle" }],
        ciz: v => { const P = X(1 + v[0], 1 + v[1]), d = [G[0] - P[0], G[1] - P[1]], L = Math.hypot(...d);
          const km = v[2] === "Göster" ? dp(A, orta(B, C), KO_, 2) + dp(B, orta(A, C), KO_, 2) + dp(C, orta(A, B), KO_, 2) : "";
          const ok_ = L < 1 ? "" : dp(P, ek(P, [d[0] / L * 40, d[1] / L * 40]), "#c92a2a", 3);
          return svg(370, 270, gr + pol([A, B, C], "#d0ebff88", "#1c5fbf") + km + adlar({ A, B, C }) + nok(P, "", 0, "#495057", 7) + ok_, "Sehpa planı")
            + kutu(L < 1 ? "Cam dengede!" : "Cam kırmızı ok yönüne eğilir."); },
        kosullar: [{ ad: "Ayak ağırlık merkezinde; cam dengede.", f: v => v[0] === 4 && v[1] === 2 }],
        sutun: ["Sağa", "Yukarı", "Durum"], satir: (v, ok) => [v[0] * 10 + " cm", v[1] * 10 + " cm", ok ? "Dengede" : "Eğilir"] }); },

    /* 8 · Şamandıralar: üç köşeye eşit uzaklıktaki nokta */
    8: el => { const B = [80, 200], C = [340, 200];
      const ucg = a => { const bA = 41, cA = 180 - 41 - a, Lc = uz(B, C) * Math.sin(R(cA)) / Math.sin(R(a)); return ek(B, yon(bA, Lc)); };
      const yer = a => a < 90 ? "iç bölgede" : a === 90 ? "BC kenarının üzerinde" : "dış bölgede";
      return KO(el, { yon: "A şamandırasındaki açıyı seçiniz (B'deki açı 41°). Kenar orta dikmeler çizilir ve üç şamandıraya eşit uzaklıktaki nokta işaretlenir.", bitis: "Ekrandaki üçgen (A: 104°) için noktanın yerini bulduğunuzda.",
        girdi: [{ ad: "A açısı:", sec: [70, 90, 104], yaz: x => x + "°", bas: 70 }],
        ciz: v => { const A = ucg(v[0]), O = disM(A, B, C), M1 = orta(B, C), M2 = orta(A, B), M3 = orta(A, C);
          return svg(420, 280, `<rect x="2" y="2" width="416" height="276" rx="10" fill="#d0ebff"/>` + pol([A, B, C], "#e7f5ff", "#1d2433", 2) + dp(M1, O, OD, 2, "6 4") + dp(M2, O, OD, 2, "6 4") + dp(M3, O, OD, 2, "6 4")
            + nok(A, "A", 90) + nok(B, "B", 180) + nok(C, "C", 0) + nok(O, "", 0, "#c92a2a", 6), "Deniz haritası") + kutu(`Bot noktası üçgenin ${yer(v[0])} · uzaklıklar eşit: ${D(uz(O, A) / 10)} birim`); },
        kosullar: [{ ad: "Ekrandaki üçgen (A: 104°) deneniyor.", f: v => v[0] === 104 }],
        sutun: ["A açısı", "Noktanın yeri"], satir: v => [v[0] + "°", yer(v[0])] }); },

    /* 9 · Oyun alanı: yolun açısı */
    9: el => { const B = [40, 250], C = [380, 250], a = 74, Lc = uz(B, C) * Math.sin(R(44)) / Math.sin(R(a)), A = ek(B, yon(62, Lc));
      const Dn = t => { const yAB = Math.atan2(-(B[1] - A[1]), B[0] - A[0]) * 180 / Math.PI, d = yAB + t; return kesD(A, ek(A, yon(d, 100)), B, C); };
      return KO(el, { yon: "Yolun AB kenarıyla yaptığı açıyı − / + ile değiştiriniz (derece). Yolun AC ile yaptığı açı ve BC kenarıyla oluşturduğu açılar ölçülür.", bitis: "A açısını iki eş açıya bölen yolu bulduğunuzda.",
        girdi: [{ ad: "AB ile açı (°)", min: 30, max: 44, bas: 32 }],
        ciz: v => { const P = Dn(v[0]); return svg(420, 275, pol([A, B, C], "#ffe8cc", "#e8590c") + dp(A, P, "#495057", 4) + adlar({ A, B, C }) + nok(P, "D", 270), "Oyun alanı")
          + kutu(`AB ile ${v[0]}° · AC ile ${a - v[0]}° · BC ile: ${D(aci(P, A, B), 0)}° ve ${D(aci(P, A, C), 0)}°`); },
        kosullar: [{ ad: "Yol A açısını iki eş açıya bölüyor.", f: v => v[0] === 37 }],
        sutun: ["AB ile", "AC ile", "m(ADB)", "m(ADC)"], satir: v => { const P = Dn(v[0]); return [v[0] + "°", a - v[0] + "°", D(aci(P, A, B), 0) + "°", D(aci(P, A, C), 0) + "°"]; } }); },

    /* 10 · Koşucular: buluşma noktası ve kenarortaylar */
    10: el => { const A = [190, 30], B = [40, 230], C = [390, 220], G = agirlik(A, B, C);
      const H = { "Selin ile aynı": .5, "Selin'den hızlı": .38, "Selin'den yavaş": .62 };
      return KO(el, { yon: "Deniz'in hızını seçiniz; iki koşucunun buluştuğu nokta ve Ömer'in yolu çizilir. Oyunu öbür kenarlarda da oynatmak için “Öbür kenarlar” düğmesini kullanınız.", bitis: "Ömer'in yolunun hangi eleman olduğunu ve üç yolun kesiştiği noktayı bulduğunuzda.",
        girdi: [{ ad: "Deniz'in hızı:", sec: Object.keys(H), bas: "Selin'den hızlı" }, { ad: "Öbür kenarlar:", sec: ["Oynatma", "Oynat"], bas: "Oynatma" }],
        ciz: v => { const t = H[v[0]], P = [B[0] + (C[0] - B[0]) * t, B[1] + (C[1] - B[1]) * t];

          return svg(420, 250, s + adlar({ A, B, C }), "Koşu alanı") + kutu(`Buluşma noktasının B'ye uzaklığı: ${Math.round(t * 100)} birim · C'ye: ${Math.round((1 - t) * 100)} birim${v[1] === "Oynat" ? (t === .5 ? " · üç yol tek noktada kesişti" : " · üç yol tek noktada kesişmedi") : ""}`); },

    /* 11 · Levha: vidanın yeri */
    11: el => { const u = 240, B = [60, 260], C = [60 + u, 260], A = [60 + u / 2, 260 - u * Math.sqrt(3) / 2], O = agirlik(A, B, C), k = 90 / u, adim = 12;

    /* 13 · Tahta: yüksekliğin ayağı ve alan */

=\"middle\">Ayaklar eşit uzunlukta</text><text x=\"525.0\" y=\"149.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Ayaklar arası açı: 34°</text><text x=\"525.0\" y=\"175.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Ayaklar arası uzaklık: 1,4 m</text></svg>", "son": "<p>Merdivenin etiketinde ayaklar arasındaki açı ve uzaklık yazmaktadır.</p>", "k": "Buna göre, çekülün yere değeceği noktanın ayaklardan birine uzaklığı ve çekül ile bir ayak arasındaki açı aşağıdakilerden hangisidir?", "sec": ["0,7 m · 34°", "1,4 m · 17°", "0,7 m · 17°", "0,7 m · 73°"], "secg": null, "c": "C", "a": ["Merdiven ve yer ikizkenar bir üçgen oluşturur; çekül tepeden tabana inen yüksekliktir.", "İkizkenar üçgende tabana ait yükseklik aynı zamanda kenarortay ve tepe açısının açıortayıdır.", "Çekül tabanı ortalar: 1,4 : 2 = 0,7 m; tepe açısını yarılar: 34 : 2 = 17°."], "t": "34°: tepe açısının tamamı; 1,4 m: ayaklar arası; 73°: ayağın yerle yaptığı açı.", "d": "İkizkenar üçgende tabana inen yükseklik tabanı ortalar ve tepe açısını yarılar. Çekül ile ayak arasındaki açı tepe açısının yarısıdır; ayağın yerle yaptığı açıyla karıştırmayın.", "ses": "b04"}, {"no": 5, "on": "<p>Bir göl kıyısında A kulesinden düz iskele yoluna (BC) üç patika iner. Patikalardan biri A'dan yola dik iner, biri A'daki açıyı iki eş açıya böler, biri de yolun B ve C uçlarının tam ortasına iner. A, B ve C noktaları çeşitkenar bir üçgenin köşeleridir.</p>", "g": "<svg viewBox=\"0 0 680 290\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8.0\" y=\"8.0\" width=\"664.0\" height=\"274.0\" rx=\"10\" fill=\"#e6fcf5\" stroke=\"#96f2d7\" stroke-width=\"1.2\"/><path d=\"M8 230 Q200 150 340 70 Q420 140 672 210 L672 282 L8 282 Z\" fill=\"#d8f5a2\" stroke=\"#82c91e\" stroke-width=\"1.4\"/><rect x=\"8.0\" y=\"244.0\" width=\"664.0\" height=\"38.0\" rx=\"0\" fill= #111111\" text-anchor=\"middle\">Turuncu: 459 m</text></svg>", "son": "<p>Tabelada patikaların uzunlukları yazmaktadır.</p>", "k": "Buna göre, yolun tam ortasına inen patika ve yola dik inen patika sırasıyla hangileridir?", "sec": ["Kırmızı · Turuncu", "Turuncu · Kırmızı", "Mavi · Kırmızı", "Turuncu · Mavi"], "secg": null, "c": "B", "a": ["Üç patika aynı köşeden çizilen kenarortay, açıortay ve yüksekliktir.", "Çeşitkenar üçgende yükseklik en kısa, kenarortay en uzun, açıortay ikisinin arasındadır.", "Yolun ortasına inen (kenarortay) en uzun patika Turuncu (459 m), yola dik inen (yükseklik) en kısa patika Kırmızıdır (412 m)."], "t": "Mavi patika açıortaydır.", "d": "Çeşitkenar üçgende aynı köşeden çizilen yükseklik en kısa, kenarortay en uzundur; açıortay ikisinin arasındadır. Renklere değil uzunluklara bakın.", "ses": "b05"}, {"no": 6, "on": "<p>Bir elbise askısının gövdesi, eşit uzunluktaki iki eğik kol ve yatay bir alt telden oluşan bir üçgendir. Askı kancasından asıldığında kancadan geçen düşey doğru, alt tele dik iner.</p>", "g": "<svg viewBox=\"0 0 680 290\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8.0\" y=\"8.0\" width=\"664.0\" height=\"274.0\" rx=\"10\" fill=\"#fff9db\" stroke=\"#ffe066\" stroke-width=\"1.2\"/><line x1=\"20.0\" y1=\"24.0\" x2=\"400.0\" y2=\"24.0\" stroke=\"#868e96\" stroke-width=\"5\"/><path d=\"M210 70 L210 46 Q210 24 228 30\" fill=\"none\" stroke=\"#495057\" stroke-width=\"4\"/><polygon points=\"210.0,70.0 43.6,170.0 376.4,170.0\" fill=\"none\" stroke=\"#adb5bd\" stroke-width=\"5\" stroke-linejoin=\"round\"/><path d=\"M180.9 87.5 A34.0 34.0 0 0 0 239.1 87.5\" fill=\"none\" stroke=\"#111111\" stroke-width=\"1.4\"/><text x=\"210.0\" y=\"128.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">118°</text><line x1=\"43.6\" y1=\"192.0\" x2=\"376.4\" y2=\"192.0\" stroke=\"#495057\" stroke-width=\"1.2\"/><line x1=\"43.6\" y1=\"184.0\" x2=\"43.6\  tamamı; 118°: tepe açısının tamamı.", "d": "Askı ikizkenar üçgendir: düşey doğru alt teli ortalar ve tepe açısını yarılar. 118°'nin yarısı 59°'dir; 31° alt tel ile kol arasındaki açıdır.", "ses": "b06"}, {"no": 7, "on": "<p>Üçgen biçimli bir cam sehpanın tek ayağı, cam dengede durabilsin diye camın ağırlık merkezine yerleştirilecektir. Sehpanın camı kareli plan üzerinde ABC üçgeni olarak çizilmiştir.</p>", "g": "<svg viewBox=\"0 0 670 224\" width=\"670\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"4.0\" y=\"4.0\" width=\"282.0\" height=\"216.0\" rx=\"8\" fill=\"#ffffff\" stroke=\"#c9d2e3\" stroke-width=\"1.2\"/><line x1=\"24\" y1=\"24\" x2=\"24\" y2=\"200\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"46\" y1=\"24\" x2=\"46\" y2=\"200\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"68\" y1=\"24\" x2=\"68\" y2=\"200\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"90\" y1=\"24\" x2=\"90\" y2=\"200\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"112\" y1=\"24\" x2=\"112\" y2=\"200\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"134\" y1=\"24\" x2=\"134\" y2=\"200\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"156\" y1=\"24\" x2=\"156\" y2=\"200\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"178\" y1=\"24\" x2=\"178\" y2=\"200\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"200\" y1=\"24\" x2=\"200\" y2=\"200\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"222\" y1=\"24\" x2=\"222\" y2=\"200\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"244\" y1=\"24\" x2=\"244\" y2=\"200\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"266\" y1=\"24\" x2=\"266\" y2=\"200\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"24\" y1=\"24\" x2=\"266\" y2=\"24\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"24\" y1=\"46\" x2=\"266\" y2=\"46\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"24\" y1=\"68\" x2=\"266\" y2=\"68\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"24\" y1=\"90\" x2=\"266\" y2=\" le\">Tek ayak camın altında</text></svg>", "son": "", "k": "Buna göre, ayak A köşesinin kaç santimetre sağında ve kaç santimetre yukarısında olmalıdır?", "sec": ["60 cm sağında, 30 cm yukarısında", "30 cm sağında, 15 cm yukarısında", "15 cm sağında, 30 cm yukarısında", "40 cm sağında, 20 cm yukarısında"], "secg": null, "c": "D", "a": ["Ağırlık merkezi kenarortayların kesişim noktasıdır; iki kenarortay yeter.", "BC'nin orta noktası A'dan 6 kare sağda, 3 kare yukarıdadır; AB'nin orta noktası A'dan 4,5 kare sağdadır ve C'ye birleştirilir.", "İki kenarortay A'dan 4 kare sağda, 2 kare yukarıda kesişir: 40 cm sağında, 20 cm yukarısında."], "t": "60 ve 30: BC'nin orta noktası; 30 ve 15: A'dan çıkan kenarortayın orta noktası; 15 ve 30: AC'nin orta noktası.", "d": "Ağırlık merkezini en az iki kenarortayın kesişimiyle bulun. Bir kenarın orta noktası ya da bir kenarortayın ortası ağırlık merkezi değildir.", "ses": "b07"}, {"no": 8, "on": "<p>Denizde üç şamandıra (A, B ve C) bir üçgenin köşelerindedir. Kurtarma botu, üç şamandıraya eşit uzaklıktaki noktada bekleyecektir. Botun ekranında şamandıraların oluşturduğu üçgenin açıları görülmektedir.</p>", "g": "<svg viewBox=\"0 0 680 290\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8.0\" y=\"8.0\" width=\"664.0\" height=\"274.0\" rx=\"10\" fill=\"#d0ebff\" stroke=\"#74c0fc\" stroke-width=\"1.2\"/><circle cx=\"210.0\" cy=\"160.0\" r=\"12.0\" fill=\"#ff922b\" stroke=\"#495057\" stroke-width=\"1.4\"/><rect x=\"208.0\" y=\"130.0\" width=\"4.0\" height=\"18.0\" rx=\"0\" fill=\"#495057\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"232.0\" y=\"166.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"start\">A</text><circle cx=\"80.0\" cy=\"236.0\" r=\"12.0\" fill=\"#ff922b\" stroke=\"#495057\" stroke-width=\"1.4\"/><rect x=\"78.0\" y=\"206.0\" width=\"4.0\" height=\"18.0\" rx=\"0\" fill=\"#495057\" stroke=\"#495057\" stroke-width=\"1\"/><text x= n kesişim noktasıdır; BC kenarının üzerindedir."], "secg": null, "c": "A", "a": ["Üç köşeye eşit uzaklıktaki nokta kenar orta dikmelerin kesişim noktasıdır.", "A açısı 104° olduğu için üçgen geniş açılıdır; geniş açılı üçgende bu nokta dış bölgededir."], "t": "Açıortayların kesişim noktası kenarlara eşit uzaklıktadır; kenarortayların kesişim noktası her zaman içeridedir.", "d": "Üç köşeye eşit uzaklıktaki nokta kenar orta dikmelerin kesişimidir. Bu nokta dar açılı üçgende içeride, dik üçgende bir kenarın üzerinde, geniş açılı üçgende dışarıdadır.", "ses": "b08"}, {"no": 9, "on": "<p>Üçgen biçimli bir oyun alanı, A köşesindeki açıyı iki eş açıya bölen düz bir yürüyüş yoluyla iki bölüme ayrılacaktır. Yol BC kenarına D noktasında ulaşacaktır. Planda B ve C köşelerindeki açılar yazılıdır.</p>", "g": "<svg viewBox=\"0 0 680 290\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8.0\" y=\"8.0\" width=\"664.0\" height=\"274.0\" rx=\"10\" fill=\"#f4fce3\" stroke=\"#c0eb75\" stroke-width=\"1.2\"/><polygon points=\"182.1,10.3 60.0,240.0 420.0,240.0\" fill=\"#ffe8cc\" stroke=\"#e8590c\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><text x=\"43.8\" y=\"253.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><text x=\"436.8\" y=\"252.5\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><text x=\"177.7\" y=\"-1.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><path d=\"M90.0 240.0 A30.0 30.0 0 0 0 74.1 213.5\" fill=\"none\" stroke=\"#111111\" stroke-width=\"1.3\"/><text x=\"112.0\" y=\"228.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">62°</text><path d=\"M398.4 219.2 A30.0 30.0 0 0 0 390.0 240.0\" fill=\"none\" stroke=\"#111111\" stroke-width=\"1.3\"/><text x=\"366.0\" y=\"230.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">44°</text><rect x=\"480.0\" y=\"60.0\" width=\"180.0\" height=\"66.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"570.0\" y=\"85.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Oyun alanı</text><text x=\"570.0\" y=\"111.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">(plan)</text></svg>", "son": "", "k": "Buna göre, yol ile BC kenarı arasında oluşan açılardan <u>küçük</u> olanı kaç derecedir?", "sec": ["37", "74", "81", "99"], "secg": null, "c": "C", "a": ["m(A) = 180 − 62 − 44 = 74°; yol bu açıyı ikiye böler: m(BAD) = 37°.", "ABD üçgeninde m(ADB) = 180 − 62 − 37 = 81°; m(ADC) = 180 − 81 = 99°. Küçük olanı 81°'dir."], "t": "99°: büyük olanı; 37°: yolun AB ile yaptığı açı; 74°: A açısı.", "d": "Önce A açısını bulun, sonra yarılayın; ardından açıortayın ayırdığı küçük üçgende iç açılar toplamını kullanın. Yolun BC ile yaptığı iki açı bütünlerdir.", "ses": "b09"}, {"no": 10, "on": "<p>Bir koşu alanında üç direk (A, B ve C) bir üçgenin köşelerindedir. Selin B direğinden, Deniz C direğinden aynı anda ve aynı hızla BC kenarı boyunca birbirine doğru koşup buluşur. Ömer de A direğinden buluşma noktasına düz bir çizgi boyunca koşar.</p>", "g": "<svg viewBox=\"0 0 680 290\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8.0\" y=\"8.0\" width=\"664.0\" height=\"274.0\" rx=\"10\" fill=\"#fff4e6\" stroke=\"#ffd8a8\" stroke-width=\"1.2\"/><polygon points=\"230.0,50.0 70.0,236.0 470.0,236.0\" fill=\"none\" stroke=\"#ffa8a8\" stroke-width=\"10\" stroke-linejoin=\"round\"/><polygon points=\"230.0,50.0 70.0,236.0 470.0,236.0\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"1.2\" stroke-linejoin=\"round\"/><rect x=\"227.0\" y=\"10.0\" width=\"6.0\" height=\"40.0\" rx=\"0\" fill=\"#495057\" stroke=\"#495057\" stroke-width=\"1\"/><circle cx=\"230.0\" cy=\"6.0\" r=\"6.0\" fill=\"#ff922b\" stroke=\"#495057\" stroke-width=\"1.2\"/><rect x=\"67.0\" y=\"196.0\" width=\"6.0\" height=\"40.0\" rx=\"0\" fill=\"#495057\" stroke=\"#495057\" stroke-width=\"1\"/><circle cx=\"70.0\" cy=\"192.0\" r=\"6.0\" fill=\"#ff922b\" stroke=\"#495057\" stroke-width=\"1.2\"/><rect x=\"467.0\" y=\"196.0\" width=\"6.0\" height=\"40.0\" rx=\"0\" fill=\"#495057\" stroke=\"#495057\" stroke-width=\"1\"/><circle cx=\"470.0\" cy=\"192.0\" r=\"6.0\" fill=\"#ff922b\" stroke=\"#495057\" stroke-width=\"1.2\"/><text x=\"230.0\" y=\"32.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A direği</text><text x=\"70.0\" y=\"262.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B direği</text><text x=\"470.0\" y=\"262.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C direği</text><rect x=\"520.0\" y=\"50.0\" width=\"140.0\" height=\"118.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"520.0\" y=\"50.0\" width=\"140.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"590.0\" y=\"72.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">BAŞLANGIÇ</text><text x=\"590.0\" y=\"103.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Selin: B</text><text x=\"590.0\" y=\"129.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Deniz: C</text><text x=\"590.0\" y=\"155.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Ömer: A</text></svg>", "son": "<p>Aynı oyun öbür iki kenar için de oynanıp üç koşucunun A, B ve C'den çizdiği üç yol işaretlenmiştir.</p>", "k": "Buna göre, Ömer'in yolu üçgenin hangi elemanıdır ve işaretlenen üç yolun kesiştiği nokta neyi gösterir?", "sec": ["Açıortay · açıortayların kesişim noktasını", "Kenarortay · ağırlık merkezini", "Yükseklik · yüksekliklerin kesişim noktasını", "Kenarortay · kenar orta dikmelerin kesişim noktasını"], "secg": null, "c": "B", "a": ["Selin ile Deniz aynı sürede eşit yol koşar ve BC'nin orta noktasında buluşur; Ömer'in yolu A'yı bu noktaya birleştiren kenarortaydır.", "Öbür yollar da birer kenarortaydır; kenarortayların kesiştiği nokta ağırlık merkezidir."], "t": "Kenar orta dikmeler köşelerden geçmek zorunda değildir; yükseklik ve açıortay orta noktaya gitmek zorunda değildir.", "d": "Eşit hızla aynı anda koşanlar eşit yol alır ve kenarın tam ortasında buluşur. Kenarortayların kesiştiği nokta ağırlık merkezidir; kenar orta dikmelerle karıştırmayın.", "ses": "b10"}, {"no": 11, "on": "<p>Eşkenar üçgen biçimindeki bir uyarı levhası direğe tek vidayla tutturulacaktır. Vida, levhanın üç kenarına eşit uzaklıktaki noktaya takılacaktır.</p>", "g": "<svg viewBox=\"0 0 680 290\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8.0\" y=\"8.0\" width=\"664.0\" height=\"274.0\" rx=\"10\" fill=\"#f1f3f5\" stroke=\"#dee2e6\" stroke-width=\"1.2\"/><rect x=\"206.0\" y=\"140.0\" width=\"8.0\" height=\"142.0\" rx=\"0\" fill=\"#868e96\" stroke=\"#495057\" stroke-width=\"1\"/><polygon points=\"210.0,59.5 100.0,250.0 320.0,250.0\" fill=\"#ffffff\" stroke=\"#e8590c\" stroke-width=\"14\" stroke-linejoin=\"round\"/><polygon points=\"210.0,59.5 100.0,250.0 320.0,250.0\" fill=\"none\" stroke=\"#e8590c\" stroke-width=\"3\" stroke-linejoin=\"round\"/><text x=\"210.0\" y=\"45.5\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><text x=\"80.0\" y=\"256.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><text x=\"340.0\" y=\"256.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><rect x=\"400.0\" y=\"60.0\" width=\"260.0\" height=\"92.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"400.0\" y=\"60.0\" width=\"260.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"530.0\" y=\"82.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">UYARI LEVHASI</text><text x=\"530.0\" y=\"113.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Eşkenar üçgen levha</text><text x=\"530.0\" y=\"139.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Tek vidayla tutturulacak</text></svg>", "son": "<p>Bu durumla ilgili aşağıdaki ifadeler yazılmıştır.<div style=\"margin:1mm 0 1mm 2mm\"><div style=\"margin:.6mm 0\">I. Vida, levhanın açıortaylarının kesişim noktasındadır.</div><div style=\"margin:.6mm 0\">II. Vida, levhanın ağırlık merkezindedir.</div><div style=\"margin:.6mm 0\">III. Vida, levhanın üç köşesine eşit uzaklıktadır.</div></div></p>", "k": "Buna göre, verilen ifadelerden hangileri doğrudur?", "sec": ["Yalnız I", "I ve II", "II ve III", "I, II ve III"], "secg": null, "c": "D", "a": ["Üç kenara eşit uzaklıktaki nokta açıortayların kesişim noktasıdır (I doğru).", "Eşkenar üçgende her açıortay aynı zamanda kenarortay ve kenar orta dikmedir; dört türün kesişim noktası aynıdır.", "Bu nokta ağırlık merkezidir (II doğru) ve kenar orta dikmelerin kesişim noktası olarak köşelere eşit uzaklıktadır (III doğru)."], "t": "Bu çakışma yalnız eşkenar üçgende vardır.", "d": "Eşkenar üçgende her kenara ait kenarortay, açıortay, yükseklik ve kenar orta dikme aynı doğrudadır; dört türün kesişim noktası aynı noktadır. Bu çakışma yalnız eşkenar üçgende üç kenarın hepsi için geçerlidir.", "ses": "b11"}, {"no": 12, "on": "<p>Bir mimar, kareli plan üzerine üçgen biçimli bir çiçeklik çizmektedir. Planda çizilen AL doğru parçası, çiçekliğin BC kenarına ait kenarortayı olacaktır. Mimar B köşesini yerleştirmiştir.</p>", "g": "<svg viewBox=\"0 0 670 236\" width=\"670\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"4.0\" y=\"4.0\" width=\"284.0\" height=\"228.0\" rx=\"8\" fill=\"#ffffff\" stroke=\"#c9d2e3\" stroke-width=\"1.2\"/><line x1=\"24\" y1=\"20\" x2=\"24\" y2=\"212\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"48\" y1=\"20\" x2=\"48\" y2=\"212\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"72\" y1=\"20\" x2=\"72\" y2=\"212\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"96\" y1=\"20\" x2=\"96\" y2=\"212\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"120\" y1=\"20\" x2=\"120\" y2=\"212\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"144\" y1=\"20\" x2=\"144\" y2=\"212\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"168\" y1=\"20\" x2=\"168\" y2=\"212\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"192\" y1=\"20\" x2=\"192\" y2=\"212\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"216\" y1=\"20\" x2=\"216\" y2=\"212\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"240\" y1=\"20\" x2=\"240\" y2=\"212\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"264\" y1=\"20\" x2=\"264\" y2=\"212\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"24\" y1=\"20\" x2=\"264\" y2=\"20\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"24\" y1=\"44\" x2=\"264\" y2=\"44\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"24\" y1=\"68\" x2=\"264\" y2=\"68\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"24\" y1=\"92\" x2=\"264\" y2=\"92\" stroke=\"#d5dbe7\" stroke-width=\".9\"/><line x1=\"24\   const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
