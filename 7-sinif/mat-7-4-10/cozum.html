<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* ANA_KURALLAR §4.y-3: Etkinliklerde bütün kesirler kesir çizgisiyle (alt alta pay/payda) gösterilir. Düz yazılmış a/b biçimleri otomatik dönüştürülür. */
(function(){
  if (window.__kesirCizgi) return; window.__kesirCizgi = 1;
  const RX = /(^|[^\w\/.,:%])([−-])?(?:(\d+) )?(\d{1,4})\/(\d{1,4})(?![\w\/.,]\d|\w)/g;
  const ATLA = "script,style,svg,textarea,input,select,code,.ilr,.frac,[data-duz]";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function donustur(kok){
    if (!kok || !kok.nodeType) return;
    if (kok.nodeType === 3) kok = kok.parentElement;
    if (!kok || (kok.closest && kok.closest(ATLA))) return;
    const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      if (!/\d\/\d/.test(t.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = t.parentElement; if (!p || p.closest(ATLA)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const L = []; let t; while ((t = w.nextNode())) L.push(t);
    L.forEach(t => {
      let deg = false;
      const h = esc(t.nodeValue).replace(RX, (m, a, s, tam, p, q) => { deg = true;
        return a + (s ? "−" : "") + (tam ? tam + " " : "") + '<span class="frac"><span>' + p + "</span><span>" + q + "</span></span>"; });
      if (!deg) return;
      const k = document.createElement("span"); k.innerHTML = h; t.replaceWith(...k.childNodes);
    });
  }
  let bekleyen = new Set(), plan = 0;
  const calis = () => { plan = 0; const b = bekleyen; bekleyen = new Set(); b.forEach(donustur); };
  const gozcu = new MutationObserver(ms => { ms.forEach(m => {
      if (m.type === "characterData") bekleyen.add(m.target); else m.addedNodes.forEach(n => bekleyen.add(n)); });
    if (!plan) plan = requestAnimationFrame(calis); });
  const bas = () => { donustur(document.body); gozcu.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bas); else bas();
  const st = document.createElement("style");
  st.textContent = ".frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}.frac>span{display:block;text-align:center;padding:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor}";
  document.head.appendChild(st);
})();

/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {

    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });

    async function dagit(k) {

      const kolon = Math.min(k, 6), satirK = Math.ceil(k / kolon), gw = kolon * 14 + 16, gh = satirK * 14 + 26;

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */
  function ATLA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Sonuç"] });
    let k = o.k, L = o.son; const W = 660, sol = 22, sag = 22, sk = (W - sol - sag) / L;

    const bA = dug("▶ Oynat"), bB = dug("+1 " + (o.adimAd || "adım"), "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bB, bS);
    let kA = null;
    if (o.kSec) { kA = adimci(o.kEtiket || "Adım:", 2, Math.floor(L / 2), k, v => { k = v; sifirla(); }); kut.prepend(kA.w); }

    const bT = dug(o.testDugme || "Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test);
    const ti = test.querySelector("input");
    function taban() {
      let sv = `<line x1="${sol}" y1="62" x2="${sol + L * sk}" y2="62" class="cn-ek"/>`;

      for (let v = 0; v <= L; v += adimT) sv += `<line x1="${sol + v * sk}" y1="${v % et ? 58 : 54}" x2="${sol + v * sk}" y2="66" class="cn-ek"/>` + (v % et ? "" : `<text x="${sol + v * sk}" y="82" text-anchor="middle" class="cn-et">${o.etYaz ? o.etYaz(v) : v}</text>`);
      sv += `<line x1="${sol + L * sk}" y1="30" x2="${sol + L * sk}" y2="70" class="cn-sinir"/><text x="${sol + L * sk}" y="24" text-anchor="end" class="cn-et">${o.sonEt || L}</text>`;

    }

      izle.forEach((v, i) => {

        sv += `<path d="M${x1} 62 Q${(x1 + x2) / 2} ${yy} ${x2} 62" class="cn-yay"/><circle cx="${x2}" cy="62" r="4.5" class="${o.renk ? o.renk(v, i + 1) : "cn-o"}"/>`;
        if (izle.length <= 14 || i === izle.length - 1 || i % Math.ceil(izle.length / 10) === 0) sv += `<text x="${x2}" y="${98}" text-anchor="middle" class="cn-et2">${v}</text>`;
      });

      const son = izle.length ? izle[izle.length - 1] : 0, ix = sol + son * sk;
      sv += `<text x="${ix}" y="50" text-anchor="middle" class="cn-kis">${o.simge || "●"}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W} 104" role="img" aria-label="${k} birimlik adımlarla ilerleme">${sv}</svg>`;
    }
    const ileri = () => {
      const v = (n + 1) * k;
      if (v > L) { durdur(); s.dur.innerHTML = `<span class="kotu">■</span> Sonraki ${o.adimAd || "adım"} ${k} ${x} ${n + 1} = <b>${v}</b> olurdu; bu ${E(L,"den")} büyük. ${o.bitti ? o.bitti(n, k, L) : `Toplam ${n} ${o.adimAd || "adım"}; son değer ${n * k}.`}`; if (!izle.length) ciz(); return false; }
      n++; izle.push(v); ciz(); s.dur.innerHTML = o.durum ? o.durum(n, v, k) : `${n}. ${o.adimAd || "adım"}: ${k} ${x} ${n} = <b>${v}</b>`; return true;

      s.dur.innerHTML = m; s.yaz("t" + v, [v, r === 0 ? (ic ? `${k} ${x} ${b} ✔` : `${k} ${x} ${b} (sınır dışı)`) : `kalan ${r} ✘`], r === 0 && ic);

  }

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || [o.kAd || "k", "Boyanan", "En büyük"] });
    let k = o.k || 2, son = o.son;
    const kut = h("div", "cn-satir");

    if (o.sonSec) { const sw = h("div", "cn-hazir"); o.sonSec.forEach(v => { const b = dug(v + " gün", "ghost"); b.onclick = () => { son = v; kur(); temiz(); }; sw.appendChild(b); }); s.den.append(kut, sw); }

      const g = h("div", "cn-izg" + (o.takvim ? " cn-tak" : "")); g.style.gridTemplateColumns = `repeat(${o.sutunSay},1fr)`;

    function temiz() { hucre.forEach(c => c && c.classList.remove("on", "yeni")); s.dur.innerHTML = o.ilk || "Sayıyı seçip Boya düğmesine basın."; }

      }

      s.yaz(k + ":" + son, o.satir ? o.satir(k, say, enb, son) : [k, say, enb], o.iyi ? o.iyi(k, say, enb, son) : null);
      calis = false; bB.disabled = false;

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */
  function ASANSOR(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Açık asansörler", "Gidilen kat", "Gidilemeyen kat"] });
    const ac = o.asansor.map(() => false);
    const kut = h("div", "cn-satir"); const bt = o.asansor.map((a, i) => { const b = dug(a.ad, "ghost"); b.style.setProperty("--ac", a.renk); b.setAttribute("aria-pressed", "false"); b.onclick = () => { ac[i] = !ac[i]; b.setAttribute("aria-pressed", ac[i]); ciz(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    function ciz() {
      let sv = ""; const H = o.kat * 17 + 40; let git = 0, gitme = [];
      for (let f = o.kat; f >= 0; f--) {

        sv += `<rect x="60" y="${y}" width="150" height="15" rx="2" class="${f === 0 ? "cn-zem" : herhangi ? "cn-katon" : (ac.some(Boolean) ? "cn-katoff" : "cn-kat")}"/><text x="52" y="${y + 12}" text-anchor="end" class="cn-et">${f === 0 ? "Z" : f}</text>`;
        o.asansor.forEach((a, i) => { if (dur[i]) sv += `<circle cx="${230 + i * 22}" cy="${y + 7.5}" r="6" fill="${a.renk}"/>`; });
      }
      s.sah.innerHTML = `<svg viewBox="0 0 300 ${H}" style="max-height:440px" role="img" aria-label="${o.kat} katlı bina">${sv}</svg>`;
      const acik = o.asansor.filter((a, i) => ac[i]).map(a => a.ad);

      s.yaz(acik.join("+"), [acik.join(" + "), git, gitme.length], null);

    ciz();
  }

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */
  function SAAT(el, o) {

      let onc = null, snr = null;
      for (let m = bas; m <= bit + ara; m += ara) { if (m <= var_) onc = m; if (m >= var_ && snr == null) snr = m; if (m <= bit) sv += `<text x="${20 + (m - bas) * sk}" y="40" text-anchor="middle" class="cn-bus">🚌</text>`; }

      if (snr != null && snr <= bit + ara) { const sx = 20 + (Math.min(snr, bit) - bas) * sk; sv += `<path d="M${vx} 56 L${sx} 56" class="cn-bek"/>`; }

      const gec = var_ - bas;
      s.dur.innerHTML = `${o.kisi} durağa ${saDa(var_)} geliyor: ilk seferden <b>${gec} dakika</b> sonra. Seferler ${E(ara,"in")} katı olan dakikalarda: ${ara} ${x} ${Math.floor(gec / ara)} = ${Math.floor(gec / ara) * ara}` + (gec % ara ? `, ${ara} ${x} ${Math.floor(gec / ara) + 1} = ${(Math.floor(gec / ara) + 1) * ara}. Sonraki otobüs ${saDa(snr)}; bekleme <b>${snr - var_} dakika</b>.` : `. Tam sefer saatinde geldi; bekleme <b>0 dakika</b>.`);
      s.yaz(ara + ":" + var_, [ara + " dk", sa(var_), sa(onc), sa(snr), (snr - var_) + " dk"], null);
    }
    ciz();
  }

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Çarpanlar", "Çarpan sayısı"] });
    let N = o.N || o.hazir[0]; let bul = new Set(), denendi = new Set();
    const kut = h("div", "cn-satir");
    const sA = adimci("Sayı:", 2, o.max || 200, N, v => { N = v; yeni(); });
    kut.appendChild(sA.w);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => sA.ayarla(n); hz.appendChild(b); }); kut.appendChild(hz); }
    s.den.appendChild(kut);
    const bolen = h("div", "cn-satir cn-test"); bolen.innerHTML = `<label>Bölen deneyin: <input type="number" inputmode="numeric" min="1"></label>`;
    const bD = dug("Böl"), bS = dug("Sıradakini dene", "ghost"); bolen.append(bD, bS); s.den.appendChild(bolen);
    const bi = bolen.querySelector("input");
    let bK = null; if (o.katlar) { bK = dug(o.katDugme || "Katlarını say ▶", "ghost"); s.den.appendChild(bK); }
    const ciftler = h("div", "cn-cift"); const katlar = h("div", "cn-katlar");
    function yeni() { bul = new Set(); denendi = new Set(); ciz(); s.dur.innerHTML = `${N} sayısını 1, 2, 3, … sayılarına bölerek çarpan çiftlerini bulun.`; katlar.textContent = ""; }
    function ciz() {
      const L = [...bul].sort((a, b) => a - b);
      s.sah.innerHTML = ""; const kartlar = h("div", "cn-kartlar");
      L.forEach(v => kartlar.appendChild(h("span", "cn-kart" + (v * v === N ? " kare" : ""), v)));
      if (!L.length) kartlar.appendChild(h("span", "cn-bosk", "Henüz çarpan bulunmadı"));
      s.sah.append(kartlar, ciftler, katlar);
      ciftler.innerHTML = L.filter(v => v * v <= N).map(v => `<span>${v} ${x} ${N / v}${v * v === N ? " <i>(aynı sayı: bir kez yazılır)</i>" : ""}</span>`).join("");
    }
    const tamamMi = () => { for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) return false; return true; };
    const eksik = () => { const L = []; for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) L.push(i); return ` <br>Henüz denenmeyen küçük bölenler var: <b>${L.join(", ")}</b>. Bunları da deneyin.`; };
    function dene(d) {
      if (!d || d < 1) return; denendi.add(d);
      const b = Math.floor(N / d), r = N % d;
      if (d > N) { s.dur.innerHTML = `${d} > ${N}: ${E(N,"den")} büyük sayı ${E(N,"in")} çarpanı olamaz.`; return; }
      if (r === 0) { bul.add(d); bul.add(b); ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${N} : ${d} = ${b}, kalan 0 → <b>${d} ${x} ${b} = ${N}</b>. ${d} ve ${b} çarpandır.` + (d * d >= N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} ${d * d === N ? "=" : ">"} ${N}. Artık yeni çift çıkmaz; bütün çarpanlar bulundu.` : eksik() : ""); }
      else { s.dur.innerHTML = `<span class="kotu">✘</span> ${N} : ${d} işleminde bölüm ${b}, <b>kalan ${r}</b>. ${d}, ${E(N,"in")} çarpanı değildir.` + (d * d > N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} > ${N}. Daha büyük bölen denemeye gerek yok; çarpan listesi tamam.` : eksik() : ""); }
      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));
      if (tamam) s.yaz("n" + N, [N, [...bul].sort((a, b) => a - b).join(", "), bul.size], true);
    }
    bD.onclick = () => dene(Math.round(+bi.value));
    bS.onclick = () => { let d = 1; while (denendi.has(d)) d++; bi.value = d; dene(d); };
    if (bK) bK.onclick = async () => {
      bK.disabled = true; katlar.textContent = ""; const sat = h("div", "cn-katsat"); katlar.append(h("b", "", `${E(N,"in")} katları: `), sat);
      for (let i = 1; i <= (o.katSay || 12); i++) { sat.appendChild(h("span", "cn-kat2", `${N * i}`)); await bekle(220); }
      sat.appendChild(h("span", "cn-sonsuz", "… ve sonsuza kadar sürer"));
      bK.disabled = false;
    };
    yeni();
  }

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */
  function KUMBARA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Para", "Sonuç"] });
    const k = o.k; let hafta = 0, tmr = null;
    const kut = h("div", "cn-satir"); const bA = dug("Bir hafta geçsin +"), bO = dug("▶ Haftaları oynat", "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bO, bS); s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Kumbarada şu para olabilir mi? <input type="number" inputmode="numeric" min="1" max="500"> TL</label>`;
    const bT = dug("Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test); const ti = test.querySelector("input");
    function ciz() {
      const top = hafta * k, sv = [];
      const yuk = Math.min(150, top * 1.4);
      sv.push(`<rect x="110" y="20" width="120" height="160" rx="22" class="cn-kum"/><rect x="150" y="14" width="40" height="8" rx="3" class="cn-kum2"/>`);
      sv.push(`<rect x="116" y="${176 - yuk}" width="108" height="${yuk}" rx="10" class="cn-para"/>`);
      sv.push(`<text x="170" y="110" text-anchor="middle" class="cn-buyuk">${top} TL</text><text x="170" y="134" text-anchor="middle" class="cn-et">${hafta}. hafta</text>`);
      let cizgi = ""; for (let i = 1; i <= hafta && i <= 16; i++) cizgi += `<text x="${260 + ((i - 1) % 4) * 52}" y="${40 + Math.floor((i - 1) / 4) * 34}" class="cn-et2">${k}${x}${i}=${k * i}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 480 190" role="img" aria-label="Kumbara">${sv.join("")}${cizgi}</svg>`;
      s.dur.innerHTML = hafta ? `${hafta}. hafta sonunda kumbarada ${k} ${x} ${hafta} = <b>${top} TL</b> var.` : `Kumbara boş. Her hafta ${k} TL atılıyor.`;
    }
    bA.onclick = () => { hafta++; ciz(); };
    bO.onclick = () => { if (tmr) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } bO.textContent = "❚❚ Durdur"; tmr = setInterval(() => { if (hafta >= 15) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } hafta++; ciz(); }, az ? 50 : 500); };
    bS.onclick = () => { hafta = 0; ciz(); };
    bT.onclick = () => {
      const v = Math.round(+ti.value); if (!v) return; const b = Math.floor(v / k), r = v % k;
      s.dur.innerHTML = r ? `<span class="kotu">✘</span> ${k} ${x} ${b} = ${k * b} TL, ${k} ${x} ${b + 1} = ${k * (b + 1)} TL. ${v} TL arada kalır (${v} : ${k} → kalan ${r}). Kumbarada hiçbir hafta ${v} TL olmaz.`
        : `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · ${b}. hafta sonunda kumbarada tam ${v} TL olur.`;
      if (!r) { hafta = b; ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · <b>${b}. hafta</b> sonunda kumbarada tam ${v} TL olur.`; }
      s.yaz("t" + v, [v + " TL", r ? `kalan ${r} ✘` : `${k} ${x} ${b} ✔`], !r);
    };
    ciz();
  }

  /* 9) ÖNERME LABORATUVARI: önermeyi farklı sayılarla sınama */
  function ONERME(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Önerme", "Sayı", "Sonuç"] });
    let akt = 0; const kut = h("div", "cn-hazir");
    const bt = o.onermeler.map((on, i) => { const b = dug(on.ad, "ghost"); b.setAttribute("aria-pressed", i === 0); b.onclick = () => { akt = i; bt.forEach((x, j) => x.setAttribute("aria-pressed", j === i)); goster(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Sınanacak sayı: <input type="number" inputmode="numeric" min="1" max="200" value="12"></label>`;
    const bT = dug("Sına"), bR = dug("Rastgele sayı", "ghost"); test.append(bT, bR); s.den.appendChild(test); const ti = test.querySelector("input");
    function goster() { s.sah.innerHTML = `<div class="cn-onr"><b>${o.onermeler[akt].ad}:</b> “${o.onermeler[akt].metin}”</div>`; s.dur.innerHTML = "Bir sayı yazıp Sına düğmesine basın. Önerme her sayıda doğru mu?"; }
    function sina(n) {
      const on = o.onermeler[akt], r = on.sina(n);
      s.sah.innerHTML = `<div class="cn-onr"><b>${on.ad}:</b> “${on.metin}”</div><div class="cn-kanit">${r.goster}</div>`;
      s.dur.innerHTML = (r.ok ? `<span class="iyi">✔</span> ${n} için önerme doğru.` : `<span class="kotu">✘</span> ${n} için önerme yanlış! Bir karşı örnek bulundu.`) + (r.not ? " " + r.not : "");
      s.yaz(akt + ":" + n, [on.ad, n, r.ok ? "doğru" : "yanlış (karşı örnek)"], r.ok);
    }
    bT.onclick = () => { const n = Math.round(+ti.value); if (n > 0) sina(n); };
    bR.onclick = () => { const n = 2 + Math.floor(Math.random() * 59); ti.value = n; sina(n); };
    goster();
  }


  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →
     koşullar tek tek denetlenir (✔/✘) → deney defterine yazılır. Doğru cevap verilmez; öğrenci uygun girdiyi kendisi arar.
     o.girdi: [{ad, min, max, bas} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → SVG/HTML · o.kosullar: [{ad, f(v) → bool | {ok, not}}]
     o.dugme: düğme yazısı (false → her değişiklikte denetlenir) · o.sonuc(v, hepsi, L) · o.satir(v, hepsi, L) · o.iyi(v, L) · o.ek: [{ad, deger(v) → v}] */
  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);
      s.dur.innerHTML = m;
      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);
    }
    kur = true; ciz();
    if (bS) s.dur.innerHTML = o.ilk || "Değerleri seçip Sına düğmesine basın."; else sina();
  }

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

/* MAT.7.4.10 · Daire, Daire Dilimi, Eşkenar Dörtgen ve Yamuk Problemleri — bağlam sorularının "Canlandır" düzenekleri (16.10.2026) — ortak motor: canlandir.js (CN.KOSUL); yeni motor yok.
   Her düzenek: öğrenci düğmelerle ya da − / + sayaçlarıyla durumu değiştirir → şekil anında çizilir → koşullar denetlenir → deneme deney defterine
   yazılır → yeniden dener. Doğru cevap bir düğmeyle verilmez; denemelerden çıkar (§4.k, §19-10). Sıra bag7410.BAGLAM sırasıdır (r01 … r20). π = 3. */
window.CANL = (() => {
  if (!document.getElementById("c7410-stil")) { const st = document.createElement("style"); st.id = "c7410-stil";
    st.textContent = ".cn-btn{min-width:44px;min-height:44px}.cn-adimci button{min-width:44px;min-height:44px}.cn-secg button{min-height:44px}.c7410-k{text-align:center;font-size:17px;font-weight:800;margin:8px auto;max-width:640px;line-height:1.6}"; document.head.appendChild(st); }
  const D = v => String(Math.round(v * 100) / 100).replace(".", ",");
  const B = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  const svg = (w, h, ic) => `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w * 1.4}px;height:auto;display:block;margin:0 auto">${ic}</svg>`;
  const tx = (x, y, s, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.an || "middle"}" style="font-size:${o.fs || 14}px;font-weight:800;fill:${o.r || "#1d2433"};paint-order:stroke;stroke:#fff;stroke-width:4px">${s}</text>`;
  const pl = (P, r = "#1c5fbf", f = "#d0e3fb", w = 2.4, k = "") => `<polygon points="${P.map(p => p.join(",")).join(" ")}" fill="${f}" stroke="${r}" stroke-width="${w}" stroke-linejoin="round"${k ? ` stroke-dasharray="${k}"` : ""}/>`;
  const dp = (P, Q, r = "#1d2433", w = 2.2, k = "") => `<line x1="${P[0]}" y1="${P[1]}" x2="${Q[0]}" y2="${Q[1]}" stroke="${r}" stroke-width="${w}" stroke-linecap="round"${k ? ` stroke-dasharray="${k}"` : ""}/>`;
  const yv = (a, r) => [r * Math.cos(a * Math.PI / 180), -r * Math.sin(a * Math.PI / 180)];
  const ar = (P, v) => [P[0] + v[0], P[1] + v[1]];
  const dl = (C, r, a0, a1, s = "#1c5fbf", f = "rgba(165,216,255,.75)", w = 2) => { if (a1 < a0) a1 += 360; if (a1 - a0 >= 359.99) return `<circle cx="${C[0]}" cy="${C[1]}" r="${r}" fill="${f}" stroke="${s}" stroke-width="${w}"/>`;

        sutun: ["Kartlar", "Sonuç"], satir: v => [v[0] + " ve " + v[1], hes(v) ? hes(v) + " m²" : "bulunamaz"] }); },
    /* 20 · Dört havuz planı */
    20: el => { const S = { A: ["Kenarlara değen daire", 25], B: ["Dört köşede dörtte bir daire", 25], C: ["Bir köşede büyük dörtte bir daire", 25], D: ["Bir kenarda yarım daire", 62.5] };

<script>
const V={"baslik": "Daire, Daire Dilimi, Eşkenar Dörtgen ve Yamuk Problemleri", "kod": "7. SINIF · MAT.7.4.10", "ses": "", "bet": "BAĞLAM TEMELLİ SORU", "bad": "Bağlam Soruları", "s": [{"no": 1, "bas": "Bileşenleri belirlemek", "q": [{"k": "Altı kanatlı bir döner kapının kanatları 2 m uzunluğundadır ve eşit aralıklarla dizilmiştir. Bir bölmenin zemininin alanı kaç metrekaredir? Önce bileşen tablosunu (nesne, şekil, verilen, eleman) doldurunuz. (π = 3 alınız.)", "a": ["Bileşenler: Bölme bir daire dilimidir; kanat yarıçaptır (r = 2 m); merkez açı 360° : 6 = 60°'dir.", "Kapının döndüğü zemin: 3 · 2 · 2 = 12 m².", "Bir bölme: 12 : 6 = 2 m²."], "c": "2 m²"}, {"k": "Bir rampanın yan yüzü yamuk biçimindedir. Paralel kenarları 3 m ve 5 m, eğik kenarı 2,5 m, rampanın genişliği 1,5 m'dir. Yan yüzün alanını bulmak için hangi bilgi eksiktir? Hangi bilgiler gereksizdir?", "a": ["Yamuğun alanı için iki taban ve yükseklik gerekir.", "Tabanlar verilmiştir (3 m ve 5 m); paralel kenarlar arasındaki dik uzaklık (yükseklik) verilmemiştir.", "Eğik kenar ve rampanın genişliği yan yüzün alanında kullanılmaz."], "c": "Eksik: yükseklik; gereksiz: eğik kenar ve genişlik"}]}, {"no": 2, "bas": "Tahmin ve kontrol", "q": [{"k": "Çapı 12 m olan dairesel bir çim alanın alanı hangi iki değer arasındadır? Alanı hesaplayıp tahmininizle karşılaştırınız. (π = 3 alınız.)", "a": ["İç kare (köşegenleri 12 m): 12 · 12 : 2 = 72 m². Dış kare (kenarı 12 m): 12 · 12 = 144 m².", "Hesap: r = 6 m; 3 · 6 · 6 = 108 m².", "108 m², 72 m² ile 144 m² arasındadır; sonuç tahminle uyumludur."], "c": "72 m² ile 144 m² arasında; 108 m²"}, {"k": "Yarıçapı 6 cm, merkez açısı 125° olan daire diliminin alanını önce “yaklaşık üçte bir daire” diye tahmin ediniz, sonra hesaplayınız. (π = 3 alınız.)", "a": ["Daire: 3 · 6 · 6 = 108 cm². 125° ile 120°'ye yakındır; tahmin 108 : 3 = 36 cm².", "Hesap: 108 · <span class=\"frac\"><span>125</span><span>360</span></span> = 37,5 cm².", "Sonuç tahminden biraz büyüktür; çünkü 125° > 120°."], " 9\" stroke-linecap=\"round\"/><line x1=\"129.0\" y1=\"168.0\" x2=\"140.5\" y2=\"168.0\" stroke=\"#fff\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"152.0\" y1=\"168.0\" x2=\"163.5\" y2=\"168.0\" stroke=\"#fff\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"175.0\" y1=\"168.0\" x2=\"186.5\" y2=\"168.0\" stroke=\"#fff\" stroke-width=\"9\" stroke-linecap=\"round\"/><rect x=\"112.8\" y=\"180.0\" width=\"32.4\" height=\"20.0\" rx=\"7.7\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"129.0\" y=\"195.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">3 m</text><text x=\"100.0\" y=\"138.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">90°</text></svg>", "son": "", "k": "Buna göre, bariyer kolunun dönerken taradığı bölgenin alanı kaç metrekaredir?", "sec": ["27", "6,75", "13,5", "2,25"], "secg": null, "c": "B", "a": ["Kol bir ucunun çevresinde döner; kolun uzunluğu yarıçap (3 m), dönme açısı merkez açıdır (90°).", "Daire 3 · 3 · 3 = 27 m²; 90°, tam açının dörtte biridir.", "27 : 4 = 6,75 m²."], "t": "27: tam daire; 13,5: yarım daire; 2,25: 3 · 3 : 4 yapılmış, π ile çarpılmamış", "d": "Dönen kol bir daire dilimi tarar: Kolun uzunluğu yarıçap, dönme açısı merkez açıdır. Önce dairenin alanını bulup açının payını alınız.", "ses": "b01"}, {"no": 2, "on": "<p>Daire biçimindeki bir yemek masasının çapı 12 dm'dir. Masaya örtülen daire biçimindeki örtü, masanın kenarından her yönde 2 dm sarkmaktadır. Örtü yere serildiğinde bir daire oluşturur. (π = 3 alınız.)</p>", "g": "<svg viewBox=\"0 0 276 276\" width=\"276\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><circle cx=\"138.0\" cy=\"138.0\" r=\"112.0\" fill=\"#fff0f6\" stroke=\"#c2255c\" stroke-width=\"2.2\" stroke-dasharray=\"6 4\"/><circle cx=\"138.0\" cy=\"138.0\" r=\"84.0\" fill=\"#f3d9a4\" stroke=\"#8a6d1d\" stroke-width=\"2.4\"/><line x1=\"54.0\" y1=\"138.0\" 7.7\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"213.0\" y=\"223.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">90 cm</text><rect x=\"7.7\" y=\"139.0\" width=\"48.6\" height=\"20.0\" rx=\"7.7\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"32.0\" y=\"154.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">30 cm</text><rect x=\"371.7\" y=\"105.0\" width=\"48.6\" height=\"20.0\" rx=\"7.7\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"396.0\" y=\"120.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">50 cm</text><polyline points=\"68.0,200.0 68.0,192.0 60.0,192.0\" fill=\"none\" stroke=\"#111111\" stroke-width=\"1.4\"/><polyline points=\"366.0,192.0 358.0,192.0 358.0,200.0\" fill=\"none\" stroke=\"#111111\" stroke-width=\"1.4\"/></svg>", "son": "", "k": "Buna göre, boyanacak yüzeyin alanı kaç santimetrekaredir?", "sec": ["3 600", "14 400", "4 500", "7 200"], "secg": null, "c": "D", "a": ["Yan yüz bir yamuktur; dikey kenarlar tabanlar (30 cm ve 50 cm), aralarındaki yatay uzaklık yüksekliktir (90 cm).", "Bir yan yüz <span class=\"frac\"><span>(30 + 50) · 90</span><span>2</span></span> = 3 600 cm².", "İki yan yüz 2 · 3 600 = 7 200 cm²."], "t": "3 600: tek yüz; 14 400: ikiye bölünmemiş; 4 500: uzun taban ile yükseklik çarpılmış", "d": "Rampanın yan yüzünde paralel kenarlar dikeydir; tabanlar bunlardır. Yükseklik, aralarındaki yatay uzaklıktır. İki yüzü unutmayınız.", "ses": "b03"}, {"no": 4, "on": "<p>Bir sitenin bahçesindeki dairesel göletin çapı 16 m'dir. Kış aylarında gölet bir örtüyle kapatılacaktır. Mağazada alanı farklı olan dört örtü vardır. Görevli, göletin alanını önce iç ve dış karelerle tahmin edip sonra hesaplamıştır. (π = 3 alınız.)</p>", "g": "<svg viewBox=\"0 0 228 228\" width=\"228\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><circle cx=\"114.0\" cy=\"114.0\" r=\"88.0\" fill=\"#a5d8ff\" stroke=\"#1c7ed6\" stroke-width=\"2.4\"/><line x1=\"26.0\" y1=\"114.0\" x2=\"202.0\" y2=\"114.0\" stroke=\"#111111\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><rect x=\"93.8\" y=\"90.0\" width=\"40.5\" height=\"20.0\" rx=\"7.7\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"114.0\" y=\"105.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">16 m</text></svg>", "son": "", "k": "Buna göre, göletin tamamını örten en küçük örtü hangisidir?", "sec": ["150 m²'lik örtü", "128 m²'lik örtü", "200 m²'lik örtü", "256 m²'lik örtü"], "secg": null, "c": "C", "a": ["İç kare (köşegenleri 16 m): 16 · 16 : 2 = 128 m²; dış kare (kenarı 16 m): 256 m². Gölet bu ikisinin arasındadır.", "Hesap: yarıçap 8 m; 3 · 8 · 8 = 192 m².", "192 m²'den büyük en küçük örtü 200 m²'liktir."], "t": "150 m² ve 128 m²: gölete yetmez; 256 m²: örter ama gereğinden büyüktür", "d": "Dairenin alanı iç karenin ve dış karenin alanları arasındadır. Hesapladığınız alandan büyük olan en küçük örtüyü seçiniz.", "ses": "b04"}, {"no": 5, "on": "<p>Bir evin giriş kapısı, genişliği 2 m ve yüksekliği 3 m olan dikdörtgen bir kapı ile kapının üstüne oturan, çapı kapının genişliği kadar olan yarım daire biçiminde bir camlıktan oluşmaktadır. (π = 3 alınız.)</p>", "g": "<svg viewBox=\"0 0 242 302\" width=\"242\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"56\" y=\"86\" width=\"120\" height=\"180\" fill=\"#e9d8a6\" stroke=\"#8a6d1d\" stroke-width=\"2.4\"/><path d=\"M116.0 86.0 L176.0 86.0 A60.0 60.0 0 0 0 56.0 86.0 Z\" fill=\"#d0ebff\" stroke=\"#1c7ed6\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><line x1=\"116.0\" y1=\"86.0\" x2=\"158.4\" y2=\"43.6\" stroke=\"#1c7ed6\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><line x1=\"116.0\" y1=\"86.0\" x2=\"116.0\" y2=\"26.0\" stroke=\"#1c7ed6\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><line x1=\"116.0\" y1=\"86.0\" x2=\"73.6\" y2=\"43.6\" stroke=\"#1c7ed6\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><rect x=\"99.8\" y=\"272.0\" width=\"32.4\" height=\"20.0\" rx=\"7.7\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"116.0\" y=\"287.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2 m</text><rect x=\"185.8\" y=\"166.0\" width=\"32.4\" height=\"20.0\" rx=\"7.7\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"202.0\" y=\"181.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">3 m</text></svg>", "son": "", "k": "Buna göre, kapı ile camlığın toplam ön yüzünün alanı kaç metrekaredir?", "sec": ["7,5", "9", "12", "6"], "secg": null, "c": "A", "a": ["Kapı bir dikdörtgendir: 2 · 3 = 6 m².", "Camlık yarım dairedir; çap 2 m, yarıçap 1 m: <span class=\"frac\"><span>3 · 1 · 1</span><span>2</span></span> = 1,5 m².", "6 + 1,5 = 7,5 m²."], "t": "9: camlık tam daire alınmış; 12: yarıçap 2 m alınmış, 6 + 6; 6: camlık eklenmemiş", "d": "Şekli dikdörtgen ve yarım daire diye iki parçaya ayırınız. Yarım dairenin çapı kapının genişliğidir.", "ses": "b05"}, {"no": 6, "on": "<p>Çapı 24 cm olan daire biçimindeki bir pizza, merkezden geçen kesimlerle 8 eş dilime ayrılmıştır. (π = 3 alınız.)</p>", "g": "<svg viewBox=\"0 0 244 244\" width=\"244\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><circle cx=\"122.0\" cy=\"122.0\" r=\"96.0\" fill=\"#ffe8a3\" stroke=\"#b07a1f\" stroke-width=\"2.6\"/><line x1=\"122.0\" y1=\"122.0\" x2=\"210.7\" y2=\"85.3\" stroke=\"#b07a1f\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"122.0\" y1=\"122.0\" x2=\"158.7\" y2=\"33.3\" stroke=\"#b07a1f\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"122.0\" y1=\"122.0\" x2=\"85.3\" y2=\"33.3\" stroke=\"#b07a1f\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"122.0\" y1=\"122.0\" x2=\"33.3\" y2=\"85.3\" stroke=\"#b07a1f\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"122.0\" y1=\"122.0\" x2=\"33.3\" y2=\"158.7\" stroke=\"#b07a1f\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"122.0\" y1=\"122.0\" x2=\"85.3\" y2=\"210.7\" stroke=\"#b07a1f\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"122.0\" y1=\"122.0\" x2=\"158.7\" y2=\"210.7\" stroke=\"#b07a1f\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"122.0\" y1=\"122.0\" x2=\"210.7\" y2=\"158.7\" stroke=\"#b07a1f\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><path d=\"M122.0 122.0 L210.7 85.3 A96.0 96.0 0 0 0 158.7 33.3 Z\" fill=\"rgba(255,192,120,.8)\" stroke=\"#e8590c\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"33.3\" y1=\"158.7\" x2=\"210.7\" y2=\"85.3\" stroke=\"#111111\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><rect x=\"53.4\" y=\"130.4\" width=\"48.6\" height=\"20.0\" rx=\"7.7\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"77.7\" y=\"145.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">24 cm</text></svg>", "son": "", "k": "Buna göre, bir dilimin üst yüzeyinin alanı kaç santimetrekaredir?", "sec": ["216", "54", "18", "108"], "secg": null, "c": "B", "a": ["Yarıçap 24 : 2 = 12 cm; pizza 3 · 12 · 12 = 432 cm².", "8 eş dilim vardır; her dilim pizzanın sekizde biridir.", "432 : 8 = 54 cm²."], "t": "216: çap yarıçap gibi kullanılmış; 18: π ile çarpılmamış, 12 · 12 : 8; 108: dörde bölünmüş", "d": "Pizzanın çapı verilmiştir; önce yarıçapı bulunuz. Eş dilimlerden biri pizzanın sekizde biridir.", "ses": "b06"}, {"no": 7, "on": "<p>Bir okulun koşu pistinin içindeki çim alan, kenarları 40 m ve 20 m olan bir dikdörtgen ile dikdörtgenin kısa kenarlarına eklenmiş, çapı bu kenar olan iki yarım daireden oluşmaktadır. (π = 3 alınız.)</p>", "g": "<svg viewBox=\"0 0 412 186\" width=\"412\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><path d=\"M86 26 L326 26 A60 60 0 0 1 326 146 L86 146 A60 60 0 0 1 86 26 Z\" fill=\"#c3e6b4\" stroke=\"#c92a2a\" stroke-width=\"5\"/><line x1=\"86.0\" y1=\"26.0\" x2=\"86.0\" y2=\"146.0\" stroke=\"#fff\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><line x1=\"326.0\" y1=\"26.0\" x2=\"326.0\" y2=\"146.0\" stroke=\"#fff\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><rect x=\"185.8\" y=\"154.0\" width=\"40.5\" height=\"20.0\" rx=\"7.7\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"206.0\" y=\"169.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">40 m</text><rect x=\"215.8\" y=\"76.0\" width=\"40.5\" height=\"20.0\" rx=\"7.7\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"236.0\" y=\"91.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">20 m</text><line x1=\"206.0\" y1=\"26.0\" x2=\"206.0\" y2=\"146.0\" stroke=\"#111111\" stroke-width=\"1.2\" stroke-linecap=\"round\"/></svg>", "son": "", "k": "Buna göre, çim alanın alanı kaç metrekaredir?", "sec": ["800", "2 000", "950", "1 100"], "secg": null, "c": "D", "a": ["Dikdörtgen 40 · 20 = 800 m².", "İki yarım daire bir tam daire eder; yarıçap 10 m: 3 · 10 · 10 = 300 m².", "800 + 300 = 1 100 m²."], "t": "800: yarım daireler eklenmemiş; 2 000: yarıçap 20 m alınmış; 950: tek yarım daire eklenmiş", "d": "İki yarım daire bir tam daire eder. Yarım dairelerin çapı dikdörtgenin kısa kenarıdır.", "ses": "b07"}, {"no": 8, "on": "<p>Bir bahçe kapısının iki kanadı vardır. Kanatlar kapı boşluğunun iki ucundaki menteşelere bağlıdır; biri 2 m, öbürü 1 m genişliğindedir. Kanatlar bahçeye doğru 90° açılmaktadır. Kanatların açılırken taradığı zemine saksı konmayacaktır. (π = 3 alınız.)</p>", "g": "<svg viewBox=\"0 0 280 200\" width=\"280\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"20.0\" y1=\"150.0\" x2=\"40.0\" y2=\"150.0\" stroke=\"#495057\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"220.0\" y1=\"150.0\" r kanat kendi menteşesi çevresinde döner. İki dilimin yarıçapları farklı olduğu için alanları ayrı ayrı bulunuz.", "ses": "b08"}, {"no": 9, "on": "<p>6 m²'lik bir yürüyüş yolu, tabanları 30 cm ve 20 cm, yüksekliği 12 cm olan eş yamuk biçimli taşlarla boşluksuz döşenecektir. Taşlar 25'li paketlerle satılmaktadır. (1 m² = 10 000 cm²)</p>", "g": "<svg viewBox=\"0 0 240 132\" width=\"240\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"30.0,102.0 210.0,102.0 180.0,30.0 60.0,30.0\" fill=\"#ced4da\" stroke=\"#495057\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/><line x1=\"60.0\" y1=\"30.0\" x2=\"60.0\" y2=\"102.0\" stroke=\"#6741d9\" stroke-width=\"2\" stroke-linecap=\"round\"/><polyline points=\"68.0,102.0 68.0,94.0 60.0,94.0\" fill=\"none\" stroke=\"#6741d9\" stroke-width=\"1.4\"/><rect x=\"65.2\" y=\"56.5\" width=\"45.7\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"88.0\" y=\"70.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">12 cm</text><rect x=\"97.2\" y=\"107.5\" width=\"45.7\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"120.0\" y=\"121.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">30 cm</text><rect x=\"97.2\" y=\"5.5\" width=\"45.7\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"120.0\" y=\"19.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">20 cm</text></svg>", "son": "", "k": "Buna göre, en az kaç paket taş alınmalıdır?", "sec": ["200", "8", "4", "16"], "secg": null, "c": "B", "a": ["6 m² = 60 000 cm².", "Bir taş <span class=\"frac\"><span>(30 + 20) · 12</span><span>2</span></span> = 300 cm²; taş sayısı 60 000 : 300 = 200.", "Paket sayısı 200 : 25 = 8."], "t": "200: taş sayısı; 4: taşın alanı ikiye bölünmemiş, 600 cm²; 16: paket sayısı iki ile çarpılmış", "d": "Alanları aynı birime çeviriniz: 1 m² = 10 000 cm². Taş sayısını bulduktan sonra paket sayısına geçiniz.", "ses": "b09"}, {"no": 10, "on": "<p>Yarıçapı 15 cm olan daire biçimindeki bir duvar saatinin kadranında, merkezden 12 ve 2 rakamlarına çizilen iki doğru parçası arasındaki bölge turuncuya boyanmıştır. Kadrandaki 12 rakam eşit aralıklarla dizilmiştir. (π = 3 alınız.)</p>", "g": "<svg viewBox=\"0 0 244.0 244.0\" width=\"244\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><circle cx=\"122.0\" cy=\"122.0\" r=\"96.0\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"3\"/><path d=\"M122.0 122.0 L203.4 75.0 A94.0 94.0 0 0 0 122.0 28.0 Z\" fill=\"rgba(255,192,120,.75)\" stroke=\"#e8590c\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><text x=\"159.0\" y=\"62.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">1</text><text x=\"186.1\" y=\"90.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2</text><text x=\"196.0\" y=\"127.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">3</text><text x=\"186.1\" y=\"164.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">4</text><text x=\"159.0\" y=\"191.1\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">5</text><text x=\"122.0\" y=\"201.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">6</text><text x=\"85.0\" y=\"191.1\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">7</text><text x=\"57.9\" y=\"164.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\" değer arası 270° : 6 = 45°'dir; 2'den 4'e iki aralık vardır: 2 · 45° = 90°.", "Daire 3 · 4 · 4 = 48 cm².", "90° dörtte birdir: 48 : 4 = 12 cm²."], "t": "24: 180° alınmış; 36: 270°'nin tamamı alınmış; 4: π ile çarpılmamış", "d": "Değerler eşit aralıklı olduğundan önce bir aralığın açısını bulunuz. İbrenin döndüğü açı kaç aralık geçtiğine bağlıdır.", "ses": "b14"}, {"no": 15, "on": "<p>Kenarı 3 m olan kare biçimindeki bir kulübenin bir köşesine 4 m'lik iple bir keçi bağlanmıştır. Kulübenin çevresi otlarla kaplıdır. İp gergin olarak kulübenin iki yanından da dolaşabilmektedir; arkadaki dilimler üst üste binmemektedir. (π = 3 alınız.)</p>", "g": "<svg viewBox=\"0 0 326 268\" width=\"326\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"132.0,122.0 204.0,122.0 204.0,194.0 132.0,194.0\" fill=\"#e9d8a6\" stroke=\"#8a6d1d\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/><circle cx=\"132\" cy=\"122\" r=\"6\" fill=\"#111111\"/><line x1=\"132.0\" y1=\"122.0\" x2=\"48.9\" y2=\"74.0\" stroke=\"#495057\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><rect x=\"56.9\" y=\"85.0\" width=\"56.7\" height=\"20.0\" rx=\"7.7\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"85.2\" y=\"100.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">ip 4 m</text><rect x=\"139.6\" y=\"148.0\" width=\"56.7\" height=\"20.0\" rx=\"7.7\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"168.0\" y=\"163.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">kulübe</text><rect x=\"151.8\" y=\"98.0\" width=\"32.4\" height=\"20.0\" rx=\"7.7\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"168.0\" y=\"113.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">3 m</text><rect x=\"209.8\" y=\"148.0\" width=\"32.4\" height=\"20.0\" rx=\"7.7\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"226.0\" y=\"163.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">3 m</text></svg>", "son": "", "k": "Buna göre, keçinin otlayabileceği bölgenin alanı kaç metrekaredir?", "sec": ["36,75", "36", "37,5", "48"], "secg": null, "c": "C", "a": ["Bağlandığı köşede ip 270° döner: 3 · 4 · 4 · <span class=\"frac\"><span>270</span><span>360</span></span> = 36 m².", "İp iki kenarı da aşar; her iki köşede kalan 4 − 3 = 1 m ile 90°'lik birer dilim: 3 · 1 · 1 : 4 = 0,75 m².", "36 + 0,75 + 0,75 = 37,5 m²."], "t": "36,75: yalnız bir yandaki dilim eklenmiş; 36: arka dilimler unutulmuş; 48: kulübenin içi de sayılmış", "d": "Kulübenin içi otlanmaz; ilk dilimin açısı 270°'dir. İp kenarları aşınca kalan iple köşelerde yeni dilimler oluşur.", "ses": "b15"}, {"no": 16, "on": "<p>Daire biçimindeki bir göletin çevresine 1 m genişliğinde bir yürüme yolu yapılmıştır. Yolun alanı 51 m²'dir. Bir öğrenci göletin yarıçapını bulmak için seçeneklerdeki değerleri tek tek denemiştir. (π = 3 alınız.)</p>", "g": "<svg viewBox=\"0 0 288 268\" width=\"288\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><path d=\"M242.0 134.0 A108 108 0 1 0 26.0 134.0 A108 108 0 1 0 242.0 134.0 Z M230.0 134.0 A96 96 0 1 0 38.0 134.0 A96 96 0 1 0 230.0 134.0 Z\" fill=\"#ced4da\" fill-rule=\"evenodd\" stroke=\"#495057\" stroke-width=\"2\"/><circle cx=\"134.0\" cy=\"134.0\" r=\"96.0\" fill=\"#a5d8ff\" stroke=\"#1c7ed6\" stroke-width=\"2\"/><line x1=\"134.0\" y1=\"134.0\" x2=\"224.2\" y2=\"101.2\" stroke=\"#111111\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><rect x=\"162.9\" y=\"107.6\" width=\"32.4\" height=\"20.0\" rx=\"7.7\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"179.1\" y=\"122.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">? m</text><line x1=\"212.6\" y1=\"189.1\" x2=\"222.5\" y2=\"195.9\" stroke=\"#111111\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><rect x=\"228.3\" y=\"195.9\" width=\"32.4\" height=\"20.0\" rx=\"7.7\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"244.5\" y=\"211.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">1 m</text></svg>", "son": "", "k": "Buna göre, göletin yarıçapı kaç metredir?", "sec": ["7", "9", "17", "8"], "secg": null, "c": "D", "a": ["Yarıçap r ise yolun alanı 3 · (r + 1) · (r + 1) − 3 · r · r'dir.", "r = 7: 3 · 64 − 3 · 49 = 45. r = 9: 3 · 100 − 3 · 81 = 57. Uymaz.", "r = 8: 3 · 81 − 3 · 64 = 243 − 192 = 51. Göletin yarıçapı 8 m'dir."], "t": "7 ve 9: deneme yolu alanını tutturmaz; 17: 51 : 3 bulunup yarıçap sanılmış", "d": "Seçeneklerdeki yarıçapları tek tek deneyiniz: Büyük dairenin alanından küçük dairenin alanını çıkarınca 51 m² bulunmalıdır.", "ses": "b16"}, {"no": 17, "on": "<p>Kenarı 8 m olan kare bir bahçe için iki sulama planı hazırlanmıştır. 1. planda bahçenin ortasına suyu 4 m uzağa ulaştıran ve tam tur dönen bir fıskiye konacaktır. 2. planda bahçenin dört köşesine suyu 4 m uzağa ulaştıran ve köşenin iki kenarı arasında dönen birer fıskiye konacaktır. Sulanan bölgeler üst üste binmemektedir. (π = 3 alınız.)</p>", "g": "<svg viewBox=\"0 0 374 228\" width=\"374\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"26\" y=\"50\" width=\"136\" height=\"136\" fill=\"#ebfbee\" stroke=\"#5c940d\" stroke-width=\"2.2\"/><text x=\"94.0\" y=\"40.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">1. plan</text><circle cx=\"94.0\" cy=\"118.0\" r=\"68.0\" fill=\"rgba(165,216,255,.75)\" stroke=\"#1c7ed6\" stroke-width=\"1.6\"/><circle cx=\"94.0\" cy=\"118.0\" r=\"5\" fill=\"#1c7ed6\"/><rect x=\"77.8\" y=\"192.0\" width=\"32.4\" height=\"20.0\" rx=\"7.7\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"94.0\" y=\"207.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anch köşeleri 90°'dir; dört köşedeki dilimler birlikte bir tam daire eder. İki planda sulanan alanları karşılaştırınız.", "ses": "b17"}, {"no": 18, "on": "<p>Paralel kenarları 12 cm ve 8 cm, yüksekliği 5 cm olan yamuk biçimindeki bir süs levhasının kısa kenarına, çapı bu kenar olan yarım daire eklenmiştir. Ali levhanın alanını aşağıdaki gibi hesaplamıştır. (π = 3 alınız.)</p>", "g": "<svg viewBox=\"0 0 470 120\" width=\"470\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"4\" y=\"4\" width=\"462\" height=\"112\" rx=\"12\" fill=\"#fff\" stroke=\"#1c5fbf\" stroke-width=\"1.8\"/><text x=\"22.0\" y=\"36.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"900\" fill=\"#1c5fbf\" text-anchor=\"start\">1. adım:</text><text x=\"112.0\" y=\"36.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">(12 + 8) · 5 : 2 = 50 cm²</text><text x=\"22.0\" y=\"66.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"900\" fill=\"#1c5fbf\" text-anchor=\"start\">2. adım:</text><text x=\"112.0\" y=\"66.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">3 · 8 · 8 : 2 = 96 cm²</text><text x=\"22.0\" y=\"96.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"900\" fill=\"#1c5fbf\" text-anchor=\"start\">3. adım:</text><text x=\"112.0\" y=\"96.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">50 + 96 = 146 cm²</text></svg>", "son": "", "k": "Buna göre, Ali hangi adımda hata yapmıştır ve levhanın doğru alanı kaç santimetrekaredir?", "sec": ["1. adım; 74", "2. adım; 98", "2. adım; 74", "3. adım; 146"], "secg": null, "c": "C", "a": ["1. adım doğrudur: yamuk 50 cm².", "2. adımda çap (8 cm) yarıçap gibi kullanılmıştır. Yarıçap 4 cm: <span class=\"frac\"><span>3 · 4 · 4</span><span>2</span></span> = 24 cm².", "Doğru alan 50 + 24 = 74 cm²."], "t": "98: hata yarım dairenin tam daire alınması sanılmış, 50 + 48; 146: Ali'nin sonucu", "d": "Her adımda hangi uzunluğun kullanıldığını denetleyiniz. Yarım dairenin çapı kısa kenardır; alan hesabında yarıçap kullanılır.", "ses": "b18"}, {"no": 19, "on": "<p>Selin, bir sulama fıskiyesinin suladığı daire dilimi biçimindeki bölge için bir problem kuracaktır. Problemine aşağıdaki veri kartlarından tam iki tanesini yazacak ve sonucun 18 m² çıkmasını istemektedir. (π = 3 alınız.)</p>", "g": "<svg viewBox=\"0 0 470 194\" width=\"470\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"14\" y=\"14\" width=\"216\" height=\"72\" rx=\"10\" fill=\"#fff\" stroke=\"#6741d9\" stroke-width=\"1.8\"/><text x=\"28.0\" y=\"35.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"900\" fill=\"#6741d9\" text-anchor=\"start\">A</text><text x=\"122.0\" y=\"58.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">yarıçap</text><text x=\"122.0\" y=\"77.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">6 m</text><rect x=\"242\" y=\"14\" width=\"216\" height=\"72\" rx=\"10\" fill=\"#fff\" stroke=\"#6741d9\" stroke-width=\"1.8\"/><text x=\"256.0\" y=\"35.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"900\" fill=\"#6741d9\" text-anchor=\"start\">B</text><text x=\"350.0\" y=\"58.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">çap</text><text x=\"350.0\" y=\"77.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">12 m</text><rect x=\"14\" y=\"98\" width=\"216\" height=\"72\" rx=\"10\" fill=\"#fff\" stroke=\"#6741d9\" stroke-width=\"1.8\"/><text x=\"28.0\" y=\"119.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"900\" fill=\"#6741d9\" text-anchor=\"start\">C</text><text x=\"122.0\" y=\"142.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">merkez açı</text><text x=\"122.0\" y=\"161.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">60°</text><rect x=\"242\" y=\"98\" width=\"216\" height=\"72\" rx=\"10\" fill=\"#fff\" stroke=\"#6741d9\" stroke-width=\"1.8\"/><text x=\"256.0\" y=\"119.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"900\" fill=\"#6741d9\" text-anchor=\"start\">D</text><text x=\"350.0\" y=\"142.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">çevre</text><text x=\"350.0\" y=\"161.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">36 m</text></svg>", "son": "", "k": "Buna göre, Selin hangi iki kartı seçmelidir?", "sec": ["A ve C", "A ve B", "B ve D", "C ve D"], "secg": null, "c": "A", "a": ["Daire diliminin alanı için yarıçap (ya da çap) ve merkez açı gerekir.", "A ve C: 3 · 6 · 6 · <span class=\"frac\"><span>60</span><span>360</span></span> = 18 m².", "A ve B yalnız uzunluk verir, açı yoktur; D'deki çevre dilimin alanını vermez. C ve D'de yarıçap yoktur."], "t": "A ve B: açı eksik; B ve D: açı eksik; C ve D: yarıçap eksik", "d": "Daire diliminin alanı için hem yarıçap hem merkez açı gerekir. Seçtiğiniz kartlarla alanı hesaplayıp 18 m² çıkıp çıkmadığını kontrol ediniz.", "ses": "b19"}, {"no": 20, "on": "<p>Kenarı 10 m olan kare biçimindeki dört bahçe için havuz planları çizilmiştir. Mavi bölgeler havuz, yeşil bölgeler çimdir. Havuzların hepsi daire, daire dilimi ya da yarım daire biçimindedir ve yarıçapları planlarda kenarlardan anlaşılmaktadır. (π = 3 alınız.)</p>", "g": "", "son": "", "k": "Buna göre, hangi planın çimli alanı öbür üçünden farklıdır?", "sec": null, "secg": ["<svg style=\"width:26mm;height:auto\" viewBox=\"0 0 124 124\" width=\"124\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"12\" y=\"12\" width=\"100\" height=\"100\" fill=\"#c3e6b4\" stroke=\"#5c940d\" stroke-width=\"2.2\"/><circle cx=\"62.0\" cy=\"62.0\" r=\"50.0\" fill=\"#a5d8ff\" stroke=\"#1c7ed6\" stroke-width=\"1.8\"/></svg>", "<svg style=\"width:26mm;height:auto\" viewBox=\"0 0 124 124\" width=\"124\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"12\" y=\"12\" width=\"100\" height=\"100\" fill=\"#c3e6b4\" stroke=\"#5c940d\" stroke-width=\"2.2\"/><path d=\"M12.0 12.0 L12.0 62.0 A50.0 50.0 0 0 0 62.0 12.0 Z\" fill=\"#a5d8ff\" stroke=\"#1c7ed6\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><path d=\"M112.0 12.0 L62.0 12.0 A50.0 50.0 0 0 0 112.0 62.0 Z\" fill=\"#a5d8ff\" stroke=\"#1c7ed6\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><path d=\"M112.0 112.0 L112.0 62.0 A50.0 50.0 0 0 0 62.0 112.0 Z\" fill=\"#a5d8ff\" stroke=\"#1c7ed6\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><path d=\"M12.0 112.0 L62.0 112.0 A50.0 50.0 0 0 0 12.0 62.0 Z\" fill=\"#a5d8ff\" stroke=\"#1c7ed6\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/></svg>", "<svg style=\"width:26mm;height:auto\" viewBox=\"0 0 124 124\" width=\"124\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"12\" y=\"12\" width=\"100\" height=\"100\" fill=\"#c3e6b4\" stroke=\"#5c940d\" stroke-width=\"2.2\"/><path d=\"M12.0 112.0 L112.0 112.0 A100.0 100.0 0 0 0 12.0 12.0 Z\" fill=\"#a5d8ff\" stroke=\"#1c7ed6\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/></svg>", "<svg style=\"width:26mm;height:auto\" viewBox=\"0 0 124 124\" width=\"124\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"12\" y=\"12\" width=\"100\" height=\"100\" fill=\"#c3e6b4\" stroke=\"#5c940d\" stroke-width=\"2.2\"/><path d=\"M62.0 112.0 L112.0 112.0 A50.0 50.0 0 0 0 12.0 112.0 Z\" fill=\"#a5d8ff\" stroke=\"#1c7ed6\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/></svg>"], "c": "D", "a": ["A: Kenarlara değen daire, yarıçap 5 m: 100 − 75 = 25 m². B: Dört köşede yarıçapı 5 m olan dörtte bir daireler, toplam bir tam daire: 100 − 75 = 25 m².", "C: Bir köşede yarıçapı 10 m olan dörtte bir daire: 100 − 300 : 4 = 25 m².", "D: Bir kenarda yarıçapı 5 m olan yarım daire: 100 − 37,5 = 62,5 m². Farklı olan D'dir."], "t": "", "d": "Her planda havuzun yarıçapını kenardan bulunuz. Dörtte bir daireleri birleştirerek tam daire ya da yarım daire elde edip karşılaştırınız.", "ses": "b20"}]};
const $=s=>document.querySelector(s);$("#kod").textContent=V.kod;$("#bas").textContent=V.baslik+" · Çözümler";

  const L="ABCD";const sec=s.sec?`<ol class="sec">${s.sec.map((x,i)=>`<li class="${L[i]===s.c?"":""}" data-h="${L[i]}"><b>${L[i]})</b> ${x}</li>`).join("")}</ol>`:"";

  let cozKap=k;

    const p1=document.createElement("div");p1.className="cn";p1.setAttribute("role","tabpanel");const p2=document.createElement("div");p2.setAttribute("role","tabpanel");p2.hidden=true;
    k.append(sesKutu(s.ses),sek,p1,p2);let kur=false;const ac=i=>{sek.querySelectorAll("button").forEach((b,j)=>b.setAttribute("aria-selected",i===j));p1.hidden=i!==0;p2.hidden=i!==1;if(i===0&&!kur){kur=true;CANL[s.no](p1);}};
    sek.querySelectorAll("button").forEach((b,i)=>b.onclick=()=>ac(i));ac(q.get("g")==="cozum"?1:0);cozKap=p2;}
  if(cozKap===k)k.appendChild(sesKutu(s.ses));const w=document.createElement("div");cozKap.appendChild(w);
  adimAdim(w,s.a,()=>{const c=document.createElement("p");c.className="cevap";c.innerHTML=`<b>Doğru cevap:</b> ${s.c}`;w.appendChild(c);
    k.querySelectorAll("ol.sec li").forEach(li=>{if(li.dataset.h===s.c)li.classList.add("dogru");});
    if(s.t){const t=document.createElement("p");t.className="tuzak";t.innerHTML="<b>Diğer seçenekler neden yanlış?</b> "+s.t;w.appendChild(t);}});
  const d=document.createElement("div");d.className="dikkat";d.innerHTML=`<b>Dikkat!</b> ${s.d}`;cozKap.appendChild(d);return k;}
const ic=$("#ic");
const BOL=[["s","Sıra Sende",V.s,kartS],["k","Kalem Kâğıt",V.k,kartK],["b",V.bad||"Bağlam Soruları",V.b,kartB]].filter(x=>x[2].length);
if(tek&&BOL.some(x=>x[0]===tek)){const n=+q.get(tek);const [,,L,f]=BOL.find(x=>x[0]===tek);const s=L.find(x=>x.no===n)||L[0];ic.appendChild(f(s));$("#tum").hidden=false;$("#nav").remove();}

/* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
