<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* ANA_KURALLAR §4.y-3: Etkinliklerde bütün kesirler kesir çizgisiyle (alt alta pay/payda) gösterilir. Düz yazılmış a/b biçimleri otomatik dönüştürülür. */
(function(){
  if (window.__kesirCizgi) return; window.__kesirCizgi = 1;
  const RX = /(^|[^\w\/.,:%])([−-])?(?:(\d+) )?(\d{1,4})\/(\d{1,4})(?![\w\/.,]\d|\w)/g;
  const ATLA = "script,style,svg,textarea,input,select,code,.ilr,.frac,[data-duz]";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function donustur(kok){
    if (!kok || !kok.nodeType) return;
    if (kok.nodeType === 3) kok = kok.parentElement;
    if (!kok || (kok.closest && kok.closest(ATLA))) return;
    const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      if (!/\d\/\d/.test(t.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = t.parentElement; if (!p || p.closest(ATLA)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const L = []; let t; while ((t = w.nextNode())) L.push(t);
    L.forEach(t => {
      let deg = false;
      const h = esc(t.nodeValue).replace(RX, (m, a, s, tam, p, q) => { deg = true;
        return a + (s ? "−" : "") + (tam ? tam + " " : "") + '<span class="frac"><span>' + p + "</span><span>" + q + "</span></span>"; });
      if (!deg) return;
      const k = document.createElement("span"); k.innerHTML = h; t.replaceWith(...k.childNodes);
    });
  }
  let bekleyen = new Set(), plan = 0;
  const calis = () => { plan = 0; const b = bekleyen; bekleyen = new Set(); b.forEach(donustur); };
  const gozcu = new MutationObserver(ms => { ms.forEach(m => {
      if (m.type === "characterData") bekleyen.add(m.target); else m.addedNodes.forEach(n => bekleyen.add(n)); });
    if (!plan) plan = requestAnimationFrame(calis); });
  const bas = () => { donustur(document.body); gozcu.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bas); else bas();
  const st = document.createElement("style");
  st.textContent = ".frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}.frac>span{display:block;text-align:center;padding:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor}";
  document.head.appendChild(st);
})();

/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {

    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });

    async function dagit(k) {

      const kolon = Math.min(k, 6), satirK = Math.ceil(k / kolon), gw = kolon * 14 + 16, gh = satirK * 14 + 26;

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */
  function ATLA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Sonuç"] });
    let k = o.k, L = o.son; const W = 660, sol = 22, sag = 22, sk = (W - sol - sag) / L;

    const bA = dug("▶ Oynat"), bB = dug("+1 " + (o.adimAd || "adım"), "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bB, bS);
    let kA = null;
    if (o.kSec) { kA = adimci(o.kEtiket || "Adım:", 2, Math.floor(L / 2), k, v => { k = v; sifirla(); }); kut.prepend(kA.w); }

    const bT = dug(o.testDugme || "Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test);
    const ti = test.querySelector("input");
    function taban() {
      let sv = `<line x1="${sol}" y1="62" x2="${sol + L * sk}" y2="62" class="cn-ek"/>`;

      for (let v = 0; v <= L; v += adimT) sv += `<line x1="${sol + v * sk}" y1="${v % et ? 58 : 54}" x2="${sol + v * sk}" y2="66" class="cn-ek"/>` + (v % et ? "" : `<text x="${sol + v * sk}" y="82" text-anchor="middle" class="cn-et">${o.etYaz ? o.etYaz(v) : v}</text>`);
      sv += `<line x1="${sol + L * sk}" y1="30" x2="${sol + L * sk}" y2="70" class="cn-sinir"/><text x="${sol + L * sk}" y="24" text-anchor="end" class="cn-et">${o.sonEt || L}</text>`;

    }

      izle.forEach((v, i) => {

        sv += `<path d="M${x1} 62 Q${(x1 + x2) / 2} ${yy} ${x2} 62" class="cn-yay"/><circle cx="${x2}" cy="62" r="4.5" class="${o.renk ? o.renk(v, i + 1) : "cn-o"}"/>`;
        if (izle.length <= 14 || i === izle.length - 1 || i % Math.ceil(izle.length / 10) === 0) sv += `<text x="${x2}" y="${98}" text-anchor="middle" class="cn-et2">${v}</text>`;
      });

      const son = izle.length ? izle[izle.length - 1] : 0, ix = sol + son * sk;
      sv += `<text x="${ix}" y="50" text-anchor="middle" class="cn-kis">${o.simge || "●"}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W} 104" role="img" aria-label="${k} birimlik adımlarla ilerleme">${sv}</svg>`;
    }
    const ileri = () => {
      const v = (n + 1) * k;
      if (v > L) { durdur(); s.dur.innerHTML = `<span class="kotu">■</span> Sonraki ${o.adimAd || "adım"} ${k} ${x} ${n + 1} = <b>${v}</b> olurdu; bu ${E(L,"den")} büyük. ${o.bitti ? o.bitti(n, k, L) : `Toplam ${n} ${o.adimAd || "adım"}; son değer ${n * k}.`}`; if (!izle.length) ciz(); return false; }
      n++; izle.push(v); ciz(); s.dur.innerHTML = o.durum ? o.durum(n, v, k) : `${n}. ${o.adimAd || "adım"}: ${k} ${x} ${n} = <b>${v}</b>`; return true;

      s.dur.innerHTML = m; s.yaz("t" + v, [v, r === 0 ? (ic ? `${k} ${x} ${b} ✔` : `${k} ${x} ${b} (sınır dışı)`) : `kalan ${r} ✘`], r === 0 && ic);

  }

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || [o.kAd || "k", "Boyanan", "En büyük"] });
    let k = o.k || 2, son = o.son;
    const kut = h("div", "cn-satir");

    if (o.sonSec) { const sw = h("div", "cn-hazir"); o.sonSec.forEach(v => { const b = dug(v + " gün", "ghost"); b.onclick = () => { son = v; kur(); temiz(); }; sw.appendChild(b); }); s.den.append(kut, sw); }

      const g = h("div", "cn-izg" + (o.takvim ? " cn-tak" : "")); g.style.gridTemplateColumns = `repeat(${o.sutunSay},1fr)`;

    function temiz() { hucre.forEach(c => c && c.classList.remove("on", "yeni")); s.dur.innerHTML = o.ilk || "Sayıyı seçip Boya düğmesine basın."; }

      }

      s.yaz(k + ":" + son, o.satir ? o.satir(k, say, enb, son) : [k, say, enb], o.iyi ? o.iyi(k, say, enb, son) : null);
      calis = false; bB.disabled = false;

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */
  function ASANSOR(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Açık asansörler", "Gidilen kat", "Gidilemeyen kat"] });
    const ac = o.asansor.map(() => false);
    const kut = h("div", "cn-satir"); const bt = o.asansor.map((a, i) => { const b = dug(a.ad, "ghost"); b.style.setProperty("--ac", a.renk); b.setAttribute("aria-pressed", "false"); b.onclick = () => { ac[i] = !ac[i]; b.setAttribute("aria-pressed", ac[i]); ciz(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    function ciz() {
      let sv = ""; const H = o.kat * 17 + 40; let git = 0, gitme = [];
      for (let f = o.kat; f >= 0; f--) {

        sv += `<rect x="60" y="${y}" width="150" height="15" rx="2" class="${f === 0 ? "cn-zem" : herhangi ? "cn-katon" : (ac.some(Boolean) ? "cn-katoff" : "cn-kat")}"/><text x="52" y="${y + 12}" text-anchor="end" class="cn-et">${f === 0 ? "Z" : f}</text>`;
        o.asansor.forEach((a, i) => { if (dur[i]) sv += `<circle cx="${230 + i * 22}" cy="${y + 7.5}" r="6" fill="${a.renk}"/>`; });
      }
      s.sah.innerHTML = `<svg viewBox="0 0 300 ${H}" style="max-height:440px" role="img" aria-label="${o.kat} katlı bina">${sv}</svg>`;
      const acik = o.asansor.filter((a, i) => ac[i]).map(a => a.ad);

      s.yaz(acik.join("+"), [acik.join(" + "), git, gitme.length], null);

    ciz();
  }

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */
  function SAAT(el, o) {

      let onc = null, snr = null;
      for (let m = bas; m <= bit + ara; m += ara) { if (m <= var_) onc = m; if (m >= var_ && snr == null) snr = m; if (m <= bit) sv += `<text x="${20 + (m - bas) * sk}" y="40" text-anchor="middle" class="cn-bus">🚌</text>`; }

      if (snr != null && snr <= bit + ara) { const sx = 20 + (Math.min(snr, bit) - bas) * sk; sv += `<path d="M${vx} 56 L${sx} 56" class="cn-bek"/>`; }

      const gec = var_ - bas;
      s.dur.innerHTML = `${o.kisi} durağa ${saDa(var_)} geliyor: ilk seferden <b>${gec} dakika</b> sonra. Seferler ${E(ara,"in")} katı olan dakikalarda: ${ara} ${x} ${Math.floor(gec / ara)} = ${Math.floor(gec / ara) * ara}` + (gec % ara ? `, ${ara} ${x} ${Math.floor(gec / ara) + 1} = ${(Math.floor(gec / ara) + 1) * ara}. Sonraki otobüs ${saDa(snr)}; bekleme <b>${snr - var_} dakika</b>.` : `. Tam sefer saatinde geldi; bekleme <b>0 dakika</b>.`);
      s.yaz(ara + ":" + var_, [ara + " dk", sa(var_), sa(onc), sa(snr), (snr - var_) + " dk"], null);
    }
    ciz();
  }

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Çarpanlar", "Çarpan sayısı"] });
    let N = o.N || o.hazir[0]; let bul = new Set(), denendi = new Set();
    const kut = h("div", "cn-satir");
    const sA = adimci("Sayı:", 2, o.max || 200, N, v => { N = v; yeni(); });
    kut.appendChild(sA.w);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => sA.ayarla(n); hz.appendChild(b); }); kut.appendChild(hz); }
    s.den.appendChild(kut);
    const bolen = h("div", "cn-satir cn-test"); bolen.innerHTML = `<label>Bölen deneyin: <input type="number" inputmode="numeric" min="1"></label>`;
    const bD = dug("Böl"), bS = dug("Sıradakini dene", "ghost"); bolen.append(bD, bS); s.den.appendChild(bolen);
    const bi = bolen.querySelector("input");
    let bK = null; if (o.katlar) { bK = dug(o.katDugme || "Katlarını say ▶", "ghost"); s.den.appendChild(bK); }
    const ciftler = h("div", "cn-cift"); const katlar = h("div", "cn-katlar");
    function yeni() { bul = new Set(); denendi = new Set(); ciz(); s.dur.innerHTML = `${N} sayısını 1, 2, 3, … sayılarına bölerek çarpan çiftlerini bulun.`; katlar.textContent = ""; }
    function ciz() {
      const L = [...bul].sort((a, b) => a - b);
      s.sah.innerHTML = ""; const kartlar = h("div", "cn-kartlar");
      L.forEach(v => kartlar.appendChild(h("span", "cn-kart" + (v * v === N ? " kare" : ""), v)));
      if (!L.length) kartlar.appendChild(h("span", "cn-bosk", "Henüz çarpan bulunmadı"));
      s.sah.append(kartlar, ciftler, katlar);
      ciftler.innerHTML = L.filter(v => v * v <= N).map(v => `<span>${v} ${x} ${N / v}${v * v === N ? " <i>(aynı sayı: bir kez yazılır)</i>" : ""}</span>`).join("");
    }
    const tamamMi = () => { for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) return false; return true; };
    const eksik = () => { const L = []; for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) L.push(i); return ` <br>Henüz denenmeyen küçük bölenler var: <b>${L.join(", ")}</b>. Bunları da deneyin.`; };
    function dene(d) {
      if (!d || d < 1) return; denendi.add(d);
      const b = Math.floor(N / d), r = N % d;
      if (d > N) { s.dur.innerHTML = `${d} > ${N}: ${E(N,"den")} büyük sayı ${E(N,"in")} çarpanı olamaz.`; return; }
      if (r === 0) { bul.add(d); bul.add(b); ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${N} : ${d} = ${b}, kalan 0 → <b>${d} ${x} ${b} = ${N}</b>. ${d} ve ${b} çarpandır.` + (d * d >= N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} ${d * d === N ? "=" : ">"} ${N}. Artık yeni çift çıkmaz; bütün çarpanlar bulundu.` : eksik() : ""); }
      else { s.dur.innerHTML = `<span class="kotu">✘</span> ${N} : ${d} işleminde bölüm ${b}, <b>kalan ${r}</b>. ${d}, ${E(N,"in")} çarpanı değildir.` + (d * d > N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} > ${N}. Daha büyük bölen denemeye gerek yok; çarpan listesi tamam.` : eksik() : ""); }
      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));
      if (tamam) s.yaz("n" + N, [N, [...bul].sort((a, b) => a - b).join(", "), bul.size], true);
    }
    bD.onclick = () => dene(Math.round(+bi.value));
    bS.onclick = () => { let d = 1; while (denendi.has(d)) d++; bi.value = d; dene(d); };
    if (bK) bK.onclick = async () => {
      bK.disabled = true; katlar.textContent = ""; const sat = h("div", "cn-katsat"); katlar.append(h("b", "", `${E(N,"in")} katları: `), sat);
      for (let i = 1; i <= (o.katSay || 12); i++) { sat.appendChild(h("span", "cn-kat2", `${N * i}`)); await bekle(220); }
      sat.appendChild(h("span", "cn-sonsuz", "… ve sonsuza kadar sürer"));
      bK.disabled = false;
    };
    yeni();
  }

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */
  function KUMBARA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Para", "Sonuç"] });
    const k = o.k; let hafta = 0, tmr = null;
    const kut = h("div", "cn-satir"); const bA = dug("Bir hafta geçsin +"), bO = dug("▶ Haftaları oynat", "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bO, bS); s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Kumbarada şu para olabilir mi? <input type="number" inputmode="numeric" min="1" max="500"> TL</label>`;
    const bT = dug("Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test); const ti = test.querySelector("input");
    function ciz() {
      const top = hafta * k, sv = [];
      const yuk = Math.min(150, top * 1.4);
      sv.push(`<rect x="110" y="20" width="120" height="160" rx="22" class="cn-kum"/><rect x="150" y="14" width="40" height="8" rx="3" class="cn-kum2"/>`);
      sv.push(`<rect x="116" y="${176 - yuk}" width="108" height="${yuk}" rx="10" class="cn-para"/>`);
      sv.push(`<text x="170" y="110" text-anchor="middle" class="cn-buyuk">${top} TL</text><text x="170" y="134" text-anchor="middle" class="cn-et">${hafta}. hafta</text>`);
      let cizgi = ""; for (let i = 1; i <= hafta && i <= 16; i++) cizgi += `<text x="${260 + ((i - 1) % 4) * 52}" y="${40 + Math.floor((i - 1) / 4) * 34}" class="cn-et2">${k}${x}${i}=${k * i}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 480 190" role="img" aria-label="Kumbara">${sv.join("")}${cizgi}</svg>`;
      s.dur.innerHTML = hafta ? `${hafta}. hafta sonunda kumbarada ${k} ${x} ${hafta} = <b>${top} TL</b> var.` : `Kumbara boş. Her hafta ${k} TL atılıyor.`;
    }
    bA.onclick = () => { hafta++; ciz(); };
    bO.onclick = () => { if (tmr) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } bO.textContent = "❚❚ Durdur"; tmr = setInterval(() => { if (hafta >= 15) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } hafta++; ciz(); }, az ? 50 : 500); };
    bS.onclick = () => { hafta = 0; ciz(); };
    bT.onclick = () => {
      const v = Math.round(+ti.value); if (!v) return; const b = Math.floor(v / k), r = v % k;
      s.dur.innerHTML = r ? `<span class="kotu">✘</span> ${k} ${x} ${b} = ${k * b} TL, ${k} ${x} ${b + 1} = ${k * (b + 1)} TL. ${v} TL arada kalır (${v} : ${k} → kalan ${r}). Kumbarada hiçbir hafta ${v} TL olmaz.`
        : `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · ${b}. hafta sonunda kumbarada tam ${v} TL olur.`;
      if (!r) { hafta = b; ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · <b>${b}. hafta</b> sonunda kumbarada tam ${v} TL olur.`; }
      s.yaz("t" + v, [v + " TL", r ? `kalan ${r} ✘` : `${k} ${x} ${b} ✔`], !r);
    };
    ciz();
  }

  /* 9) ÖNERME LABORATUVARI: önermeyi farklı sayılarla sınama */
  function ONERME(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Önerme", "Sayı", "Sonuç"] });
    let akt = 0; const kut = h("div", "cn-hazir");
    const bt = o.onermeler.map((on, i) => { const b = dug(on.ad, "ghost"); b.setAttribute("aria-pressed", i === 0); b.onclick = () => { akt = i; bt.forEach((x, j) => x.setAttribute("aria-pressed", j === i)); goster(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Sınanacak sayı: <input type="number" inputmode="numeric" min="1" max="200" value="12"></label>`;
    const bT = dug("Sına"), bR = dug("Rastgele sayı", "ghost"); test.append(bT, bR); s.den.appendChild(test); const ti = test.querySelector("input");
    function goster() { s.sah.innerHTML = `<div class="cn-onr"><b>${o.onermeler[akt].ad}:</b> “${o.onermeler[akt].metin}”</div>`; s.dur.innerHTML = "Bir sayı yazıp Sına düğmesine basın. Önerme her sayıda doğru mu?"; }
    function sina(n) {
      const on = o.onermeler[akt], r = on.sina(n);
      s.sah.innerHTML = `<div class="cn-onr"><b>${on.ad}:</b> “${on.metin}”</div><div class="cn-kanit">${r.goster}</div>`;
      s.dur.innerHTML = (r.ok ? `<span class="iyi">✔</span> ${n} için önerme doğru.` : `<span class="kotu">✘</span> ${n} için önerme yanlış! Bir karşı örnek bulundu.`) + (r.not ? " " + r.not : "");
      s.yaz(akt + ":" + n, [on.ad, n, r.ok ? "doğru" : "yanlış (karşı örnek)"], r.ok);
    }
    bT.onclick = () => { const n = Math.round(+ti.value); if (n > 0) sina(n); };
    bR.onclick = () => { const n = 2 + Math.floor(Math.random() * 59); ti.value = n; sina(n); };
    goster();
  }


  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →
     koşullar tek tek denetlenir (✔/✘) → deney defterine yazılır. Doğru cevap verilmez; öğrenci uygun girdiyi kendisi arar.
     o.girdi: [{ad, min, max, bas} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → SVG/HTML · o.kosullar: [{ad, f(v) → bool | {ok, not}}]
     o.dugme: düğme yazısı (false → her değişiklikte denetlenir) · o.sonuc(v, hepsi, L) · o.satir(v, hepsi, L) · o.iyi(v, L) · o.ek: [{ad, deger(v) → v}] */
  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);
      s.dur.innerHTML = m;
      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);
    }
    kur = true; ciz();
    if (bS) s.dur.innerHTML = o.ilk || "Değerleri seçip Sına düğmesine basın."; else sina();
  }

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

/* SORU BANKASI · MAT.7.4.10 · Daire, Daire Dilimi, Eşkenar Dörtgen ve Yamuk Problemleri — yeni nesil soruların "Canlandır" düzenekleri (16.10.2026) — ortak motor: canlandir.js (CN.KOSUL); yeni motor yok.
   Her düzenek: öğrenci seçim düğmeleri ya da − / + sayaçlarıyla durumu değiştirir → şekil anında çizilir → koşullar denetlenir →
   deneme deney defterine yazılır → yeniden dener. Doğru cevap bir düğmeyle verilmez; denemelerden çıkar (§4.k, §19-10). π = 3 alınır.
   Çizim yardımcıları bu dosyada ayrıca yazıldı (fasikülün canlandir_7410.js dosyası da window.CANL tanımladığı için gömülmez). */
window.CANL = (() => {
  if (!document.getElementById("csb7410-stil")) { const st = document.createElement("style"); st.id = "csb7410-stil";
    st.textContent = ".cn-btn{min-width:44px;min-height:44px}.cn-adimci button{min-width:44px;min-height:44px}.cn-secg button{min-height:44px}.csb7410-k{text-align:center;font-size:17px;font-weight:800;margin:8px auto;max-width:640px;line-height:1.6}"; document.head.appendChild(st); }
  const D = (v, n = 2) => String(Math.round(v * 10 ** n) / 10 ** n).replace(".", ",");
  const yon = (a, r = 1) => [r * Math.cos(a * Math.PI / 180), -r * Math.sin(a * Math.PI / 180)];
  const ek = (P, v) => [P[0] + v[0], P[1] + v[1]];
  const svg = (w, h, ic, ad) => `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${Math.round(w * 1.3)}px;height:auto;display:block;margin:0 auto" role="img" aria-label="${ad || "Çizim"}">${ic}</svg>`;
  const tx = (x, y, s, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.an || "middle"}" style="font-size:${o.fs || 14}px;font-weight:800;fill:${o.r || "#1d2433"};paint-order:stroke;stroke:#fff;stroke-width:4px">${s}</text>`;
  const dp = (P, Q, r = "#1d2433", w = 2.6, k = "") => `<line x1="${P[0]}" y1="${P[1]}" x2="${Q[0]}" y2="${Q[1]}" stroke="${r}" stroke-width="${w}" stroke-linecap="round"${k ? ` stroke-dasharray="${k}"` : ""}/>`;
  const pol = (L, f = "#d0e3fb", s = "#1c5fbf", w = 2.4) => `<polygon points="${L.map(p => p.join(",")).join(" ")}" fill="${f}" stroke="${s}" stroke-width="${w}" stroke-linejoin="round"/>`;
  const dai = (C, r, f = "#d0ebff", s = "#1c7ed6", w = 2.2) => `<circle cx="${C[0]}" cy="${C[1]}" r="${r}" fill="${f}" stroke="${s}" stroke-width="${w}"/>`;
  const dil = (C, r, a0, a1, f = "#d3f9d8", s = "#2b8a3e", w = 2) => { if (a1 - a0 >= 359.9) return dai(C, r, f, s, w); const P0 = ek(C, yon(a0, r)), P1 = ek(C, yon(a1, r)); return `<path d="M${C} L${P0} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 0 ${P1} Z" fill="${f}" stroke="${s}" stroke-width="${w}"/>`; };
  const kutu = h => `<div class="csb7410-k">${h}</div>`;
  const KO = (el, o) => CN.KOSUL(el, Object.assign({ dugme: false }, o));
  const A = r => 3 * r * r;
  const N = n => { const [t, k] = String(Math.round(n * 100) / 100).split("."); return t.replace(/\B(?=(\d{3})+(?!\d))/g, "\u00a0") + (k ? "," + k : ""); };

  return {
    /* 1 · Döner sergi platformu */
    1: el => KO(el, { yon: "Platformun bölme sayısını seçiniz; bir bölmenin alanı hesaplanır. Platformun yarıçapı 4 m'dir (π = 3).", bitis: "Sergi bilgisindeki bölme sayısıyla bir bölmenin alanını bulunca.",
      girdi: [{ ad: "Bölme sayısı:", sec: ["4", "5", "6", "8"], bas: "4" }],
      ciz: v => { const n = +v[0], C = [150, 150], r = 120; let h = dai(C, r, "#e9ecef", "#495057");
        for (let i = 0; i < n; i++) h += dp(C, ek(C, yon(90 + 360 / n * i, r)), "#495057", 3);
        h += dil(C, r, 90, 90 + 360 / n, "#ffe8cc", "#e8590c");
        return svg(300, 300, h, "Platform") + kutu(`Platform 48 m² · bir bölme 48 : ${n} = ${D(48 / n)} m²`); },
      kosullar: [{ ad: "Platform 6 eş bölmeye ayrıldı.", f: v => v[0] === "6" }],
      sutun: ["Bölme", "Bir bölme"], satir: v => [v[0], D(48 / +v[0]) + " m²"] }),

    /* 2 · Havuz örtüsü */
    2: el => KO(el, { yon: "Bir örtü seçiniz; örtünün alanı havuzun alanıyla (çap 16 m, π = 3) karşılaştırılır.", bitis: "Havuzu kapatan en küçük örtüyü bulunca.",
      girdi: [{ ad: "Örtü (m²):", sec: ["170", "190", "210", "260"], bas: "170" }],
      ciz: v => { const o = +v[0], k = 5; const C = [140, 130], r = 8 * k * 1.9, s = Math.sqrt(o) * k * 1.9;
        return svg(280, 260, `<rect x="${C[0] - s / 2}" y="${C[1] - s / 2}" width="${s}" height="${s}" fill="rgba(255,169,77,.35)" stroke="#e8590c" stroke-width="2"/>` + dai(C, r, "rgba(165,216,255,.6)"), "Havuz ve örtü")
          + kutu(`Havuz 3 · 8 · 8 = 192 m² · örtü ${o} m² · ${o >= 192 ? "yeter" : "yetmez"}`); },
      kosullar: [{ ad: "Örtü havuzu kapatıyor.", f: v => +v[0] >= 192 }, { ad: "Örtü yetenlerin en küçüğü.", f: v => +v[0] === 210 }],
      sutun: ["Örtü", "Yeter mi?"], satir: v => [v[0] + " m²", +v[0] >= 192 ? "Evet" : "Hayır"] }),

    /* 3 · Gökkuşağı çıkartması */
    3: el => KO(el, { yon: "Çıkartmanın genişliğini − / + ile değiştiriniz. İçteki yarım dairenin yarıçapı 4 dm'dir; çıkartmanın alanı hesaplanır (π = 3).", bitis: "Karttaki genişlikle çıkartmanın alanını bulunca.",
      girdi: [{ ad: "Genişlik (dm)", min: 1, max: 4, bas: 1 }],
      ciz: v => { const R = 4 + v[0], k = 22, C = [200, 190]; const a = (A(R) - A(4)) / 2;
        return svg(400, 210, dil(C, R * k, 0, 180, "#ffd8a8", "#e8590c") + dil(C, 4 * k, 0, 180, "#fff", "#495057", 1.6) + dp([0, 190], [400, 190], "#1d2433", 2), "Çıkartma")
          + kutu(`Dış yarım daire ${D(A(R) / 2)} dm² − iç yarım daire 24 dm² = ${D(a)} dm²`); },
      kosullar: [{ ad: "Genişlik 2 dm.", f: v => v[0] === 2 }],
      sutun: ["Genişlik", "Dış yarıçap", "Alan"], satir: v => [v[0] + " dm", 4 + v[0] + " dm", D((A(4 + v[0]) - A(4)) / 2) + " dm²"] }),

    /* 4 · Dans pisti */
    4: el => KO(el, { yon: "Sahnenin çapını − / + ile değiştiriniz. Pist kenarı 8 m olan karedir; parke döşenecek alan hesaplanır (π = 3).", bitis: "Çapı 4 m olan sahneyle parke alanını bulunca.",
      girdi: [{ ad: "Sahnenin çapı (m)", min: 2, max: 6, bas: 2 }],
      ciz: v => { const k = 26, r = v[0] / 2; return svg(260, 260, `<rect x="26" y="26" width="${8 * k}" height="${8 * k}" fill="#e6c79c" stroke="#8a5a2b" stroke-width="2.4"/>` + dai([130, 130], r * k, "#ced4da", "#495057"), "Dans pisti")
        + kutu(`Pist 64 m² · sahne ${D(A(r))} m² · parke ${D(64 - A(r))} m²`); },
      kosullar: [{ ad: "Sahnenin çapı 4 m.", f: v => v[0] === 4 }],
      sutun: ["Çap", "Sahne", "Parke"], satir: v => [v[0] + " m", D(A(v[0] / 2)) + " m²", D(64 - A(v[0] / 2)) + " m²"] }),

    /* 5 · Ahıra bağlı at */
    5: el => KO(el, { yon: "İpin uzunluğunu − / + ile değiştiriniz. Ahır kenarı 8 m olan karedir; at bağlandığı köşede 270°'lik dilimde, ip yeterse ahırın iki yanından dolanıp küçük dilimlerde otlar (π = 3).", bitis: "10 m'lik iple otlama alanını bulunca.",
      girdi: [{ ad: "İp (m)", min: 6, max: 11, bas: 7 }],
      ciz: v => { const ip = v[0], k = 9, O = [120, 120], kal = Math.max(0, ip - 8);
        let h = dil(O, ip * k, 0, 270, "#c3e6b4", "#5c940d", 1.6);
        if (kal) { h += dil([O[0] + 8 * k, O[1]], kal * k, 270, 360, "#d3f9a0", "#5c940d", 1.4) + dil([O[0], O[1] + 8 * k], kal * k, 180, 270, "#d3f9a0", "#5c940d", 1.4); }
        h += `<rect x="${O[0]}" y="${O[1]}" width="${8 * k}" height="${8 * k}" fill="#e9d8a6" stroke="#8a6d1d" stroke-width="2.4"/>` + tx(O[0] + 4 * k, O[1] + 4 * k + 5, "ahır");
        const a = A(ip) * 3 / 4 + 2 * A(kal) / 4;
        return svg(300, 300, `<g transform="translate(20 20)">${h}</g>`, "Otlama bölgesi") + kutu(`270°'lik dilim ${D(A(ip) * 3 / 4)} m² + arka dilimler ${D(2 * A(kal) / 4)} m² = ${D(a)} m²`); },
      kosullar: [{ ad: "İp 10 m.", f: v => v[0] === 10 }],
      sutun: ["İp", "Arka ip", "Alan"], satir: v => [v[0] + " m", Math.max(0, v[0] - 8) + " m", D(A(v[0]) * 3 / 4 + 2 * A(Math.max(0, v[0] - 8)) / 4) + " m²"] }),

    /* 6 · Hız göstergesi */
    6: el => KO(el, { yon: "İbrenin başladığı ve bittiği değeri seçiniz. 0–90 km/sa. değerleri 270°'lik yaya eşit aralıklarla dizilidir; ibre 8 cm'dir (π = 3).", bitis: "30'dan 60'a dönüşte taranan alanı bulunca.",
      girdi: [{ ad: "Başlangıç:", sec: ["0", "30", "60"], bas: "0" }, { ad: "Bitiş:", sec: ["30", "60", "90"], bas: "90" }],
      ciz: v => { const b = +v[0], s = +v[1], C = [150, 160], r = 110, top = 270, bas = 90 + top / 2, a0 = bas - top * s / 90, a1 = bas - top * b / 90;
        let h = ""; if (s > b) h += dil(C, r, a0, a1, "#ffe8cc", "#e8590c");
        for (const t of [0, 30, 60, 90]) { const P = ek(C, yon(bas - top * t / 90, r + 22)); h += tx(P[0], P[1] + 5, t); }
        const aci = s > b ? 3 * (s - b) : 0; return svg(300, 300, h + `<circle cx="150" cy="160" r="6" fill="#495057"/>`, "Gösterge") + kutu(`Açı ${aci}° · taranan alan ${D(A(8) * aci / 360)} cm²`); },
      kosullar: [{ ad: "İbre 30'dan 60'a döndü.", f: v => v[0] === "30" && v[1] === "60" }],
      sutun: ["Başlangıç", "Bitiş", "Alan"], satir: v => [v[0], v[1], +v[1] > +v[0] ? D(A(8) * 3 * (+v[1] - +v[0]) / 360) + " cm²" : "—"] }),

    /* 7 · Kerem'in adımları */
    7: el => { const S = ["Yarıçap 10 m.", "Dairenin alanı 3 · 10 · 10 = 300 m².", "Dilimin alanı 300 · 60 = 18 000 m²."];
      return KO(el, { yon: "Kerem'in adımlarını − / + ile tek tek inceleyiniz; her adımın doğru olup olmadığı ve şekil gösterilir.", bitis: "İlk hatalı adımı ve doğru alanı bulunca.",
        girdi: [{ ad: "Adım", min: 1, max: 3, bas: 1 }],
        ciz: v => { const n = v[0], C = [40, 200]; let h = dai(C, 160, "none", "#adb5bd", 1.2) + dil(C, 160, 0, 60, "#e5dbff", "#7048e8");
          return svg(240, 220, h, "Dilim") + kutu(`${n}. adım: ${S[n - 1]}<br>${n < 3 ? "Bu adım doğru." : "Hatalı: 60°, tam açının altıda biridir. Doğru alan 300 : 6 = 50 m²."}`); },
        kosullar: [{ ad: "İlk hatalı adım bulundu.", f: v => v[0] === 3 }],
        sutun: ["Adım", "Durum"], satir: v => [v[0], v[0] < 3 ? "doğru" : "hatalı"] }); },

    /* 8 · Kare tarh ve köşe gülleri */
    8: el => KO(el, { yon: "Köşelerdeki çeyrek dairelerin yarıçapını − / + ile değiştiriniz. Tarh kenarı 6 m olan karedir; çim bölgesinin alanı hesaplanır (π = 3).", bitis: "Yarıçap 3 m iken çim alanını bulunca.",
      girdi: [{ ad: "Yarıçap (m)", min: 1, max: 3, bas: 1 }],
      ciz: v => { const r = v[0], k = 36, x0 = 20, a = 6 * k; let h = `<rect x="${x0}" y="${x0}" width="${a}" height="${a}" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.4"/>`;
        for (const [cx, cy, a0] of [[x0, x0, 270], [x0 + a, x0, 180], [x0 + a, x0 + a, 90], [x0, x0 + a, 0]]) h += dil([cx, cy], r * k, a0, a0 + 90, "#fcc2d7", "#c2255c", 1.6);
        return svg(260, 260, h, "Tarh") + kutu(`Dört çeyrek daire = bir daire: ${A(r)} m² · çim ${36 - A(r)} m²`); },
      kosullar: [{ ad: "Yarıçap 3 m.", f: v => v[0] === 3 }],
      sutun: ["Yarıçap", "Güller", "Çim"], satir: v => [v[0] + " m", A(v[0]) + " m²", 36 - A(v[0]) + " m²"] }),

    /* 9 · Projektörle büyütme */
    9: el => KO(el, { yon: "Büyütme katını seçiniz; simgenin köşegenleri (6 cm ve 8 cm) bu katla büyür ve alan hesaplanır.", bitis: "3 katlık büyütmede alanı bulunca.",
      girdi: [{ ad: "Kat:", sec: ["1", "2", "3"], bas: "1" }],
      ciz: v => { const k = +v[0], s = 8, C = [160, 120]; const a = 6 * k * s / 2, b = 8 * k * s / 2;
        return svg(320, 240, pol([[C[0] - a, C[1]], [C[0], C[1] - b], [C[0] + a, C[1]], [C[0], C[1] + b]]), "Simge") + kutu(`Köşegenler ${6 * k} ve ${8 * k} cm · alan ${6 * k * 8 * k / 2} cm² (ilk alanın ${k * k} katı)`); },
      kosullar: [{ ad: "Uzunluklar 3 katına çıktı.", f: v => v[0] === "3" }],
      sutun: ["Kat", "Alan", "Alan kaç katı?"], satir: v => [v[0], 24 * (+v[0]) ** 2 + " cm²", (+v[0]) ** 2] }),

    /* 10 · Yamuk taşlar */
    10: el => KO(el, { yon: "Taş sayısını − / + ile değiştiriniz (10'ar). Bir taş (30 + 20) · 16 : 2 = 400 cm²'dir; taşların kapladığı alan holün alanıyla (2 m²) karşılaştırılır.", bitis: "Holü tam kaplayan taş sayısını bulunca.",
      girdi: [{ ad: "Taş sayısı (× 10)", min: 1, max: 8, bas: 2 }],
      ciz: v => { const n = v[0] * 10, a = n * 400; return svg(320, 60, `<rect x="10" y="20" width="300" height="24" fill="#f1f3f5" stroke="#495057"/><rect x="10" y="20" width="${Math.min(300, 300 * a / 20000)}" height="24" fill="#ffa94d"/>`, "Kaplanan alan")
        + kutu(`${n} taş · ${N(a)} cm² · hol 20 000 cm²`); },
      kosullar: [{ ad: "Taşlar holü tam kaplıyor.", f: v => v[0] * 10 * 400 === 20000 }],
      sutun: ["Taş", "Alan", "Durum"], satir: v => [v[0] * 10, N((v[0] * 4000)) + " cm²", v[0] * 4000 === 20000 ? "tam" : v[0] * 4000 < 20000 ? "eksik" : "fazla"] }),

    /* 11 · Halılar ve birim fiyat */
    11: el => { const H = { "1. halı (daire, çap 2 m)": [3, 2700], "2. halı (yamuk 3 m, 1 m, 2 m)": [4, 3200] };
      return KO(el, { yon: "Bir halı seçiniz; alanı ve 1 m²'sinin fiyatı hesaplanır (π = 3).", bitis: "1 m²'si daha ucuz olan halıyı bulunca.",
        girdi: [{ ad: "Halı:", sec: Object.keys(H), bas: "1. halı (daire, çap 2 m)" }],
        ciz: v => { const [a, f] = H[v[0]]; return svg(300, 160, v[0].startsWith("1") ? dai([150, 80], 70, "#e5dbff", "#5f3dc4") : pol([[60, 140], [240, 140], [180, 20], [120, 20]], "#ffe8cc", "#e8590c"), "Halı")
          + kutu(`Alan ${a} m² · fiyat ${N(f)} TL · 1 m²: ${f / a} TL`); },
        kosullar: [{ ad: "1 m² fiyatı daha düşük olan halı.", f: v => v[0].startsWith("2") }],
        sutun: ["Halı", "Alan", "1 m²"], satir: v => [v[0].slice(0, 7), H[v[0]][0] + " m²", H[v[0]][1] / H[v[0]][0] + " TL"] }); },

    /* 12 · Uçurtma kâğıdı */
    12: el => { const Y = { "Çıtaların çarpımının yarısı": 120, "Kenar · kenar": 169, "Çıtaların çarpımı": 240, "Kenar · uzun çıta : 2": 156 };
      return KO(el, { yon: "Bir hesap yolu seçiniz; sonuç, uçurtmayı dört dik üçgene ayırarak bulunan alanla karşılaştırılır (çıtalar 24 cm ve 10 cm, kenar 13 cm).", bitis: "Dört üçgenle aynı sonucu veren yolu bulunca.",
        girdi: [{ ad: "Yol:", sec: Object.keys(Y), bas: "Kenar · kenar" }],
        ciz: v => svg(300, 200, pol([[30, 100], [150, 50], [270, 100], [150, 150]], "#ffe8cc", "#e8590c") + dp([30, 100], [270, 100], "#8a5a2b", 3) + dp([150, 50], [150, 150], "#8a5a2b", 3), "Uçurtma")
          + kutu(`Seçilen yol: ${Y[v[0]]} cm² · dört dik üçgen: 4 · (12 · 5 : 2) = 120 cm²`),
        kosullar: [{ ad: "Sonuç dört üçgenle aynı.", f: v => Y[v[0]] === 120 }],
        sutun: ["Yol", "Sonuç"], satir: v => [v[0], Y[v[0]] + " cm²"] }); },

    /* 13 · Plan ölçeği */
    13: el => KO(el, { yon: "Plandaki bir birim karenin kenarının gerçekte kaç metre olduğunu seçiniz. Çiçeklik planda 15 birim karedir; gerçek alan hesaplanır.", bitis: "Plan ölçeğiyle gerçek alanı bulunca.",
      girdi: [{ ad: "Birim karenin kenarı (m):", sec: ["1", "5", "10"], bas: "1" }],
      ciz: v => { const k = +v[0]; return svg(300, 140, pol([[30, 120], [210, 120], [180, 30], [60, 30]], "#c3e6b4", "#5c940d"), "Plan") + kutu(`Bir birim kare ${k * k} m² · gerçek alan 15 · ${k * k} = ${15 * k * k} m²`); },
      kosullar: [{ ad: "Ölçek kartla aynı (5 m).", f: v => v[0] === "5" }],
      sutun: ["Kenar", "Birim kare", "Alan"], satir: v => [v[0] + " m", (+v[0]) ** 2 + " m²", 15 * (+v[0]) ** 2 + " m²"] }),

    /* 14 · Havuz yolları */
    14: el => KO(el, { yon: "Havuzun yarıçapını − / + ile değiştiriniz. Yolun genişliği hep 1 m'dir; yolun alanı hesaplanır (π = 3).", bitis: "1 m ve 4 m'lik havuzların yollarını karşılaştırınca.",
      girdi: [{ ad: "Havuzun yarıçapı (m)", min: 1, max: 6, bas: 1 }],
      ciz: v => { const r = v[0], k = 20, C = [150, 150]; return svg(300, 300, dai(C, (r + 1) * k, "#ced4da", "#495057") + dai(C, r * k), "Havuz ve yol") + kutu(`Yol: 3 · ${r + 1} · ${r + 1} − 3 · ${r} · ${r} = ${A(r + 1) - A(r)} m²`); },
      kosullar: [{ ad: "Yarıçapı 4 m olan havuz denendi (yol 27 m²).", f: v => v[0] === 4 }],
      sutun: ["Yarıçap", "Yol"], satir: v => [v[0] + " m", A(v[0] + 1) - A(v[0]) + " m²"] }),

    /* 15 · İki baklava dilimi */
    15: el => { const Y = { "Ayrı ayrı hesapla": 140, "Açıları topla, 12 cm ile": 180, "Açıları topla, 8 cm ile": 80 };
      return KO(el, { yon: "Bir hesap yolu seçiniz. 1. dilim: yarıçap 12 cm, 90°; 2. dilim: yarıçap 8 cm, 60° (π = 3).", bitis: "Doğru toplamı veren yolu bulunca.",
        girdi: [{ ad: "Yol:", sec: Object.keys(Y), bas: "Açıları topla, 12 cm ile" }],
        ciz: v => svg(320, 170, dil([40, 150], 120, 0, 90, "#ffe8a3", "#b07a1f") + dil([200, 150], 80, 0, 60, "#ffe8a3", "#b07a1f"), "Dilimler") + kutu(`Seçilen yolla toplam: ${Y[v[0]]} cm² · doğru: 108 + 32 = 140 cm²`),
        kosullar: [{ ad: "Yarıçaplar farklı; dilimler ayrı hesaplandı.", f: v => v[0] === "Ayrı ayrı hesapla" }],
        sutun: ["Yol", "Toplam"], satir: v => [v[0], Y[v[0]] + " cm²"] }); },

    /* 16 · Kıyıdaki radar */
    16: el => KO(el, { yon: "Radarın taradığı bölgenin biçimini ve yarıçapını seçiniz; bölge çizilir ve alanı hesaplanır (π = 3).", bitis: "Radarın gerçekte taradığı bölgeyi bulunca.",
      girdi: [{ ad: "Bölge:", sec: ["Tam daire", "Yarım daire", "Çeyrek daire"], bas: "Tam daire" }, { ad: "Yarıçap (km):", sec: ["15", "30"], bas: "15" }],
      ciz: v => { const r = +v[1], aci = v[0] === "Tam daire" ? 360 : v[0] === "Yarım daire" ? 180 : 90, C = [160, 150], k = 3.6;
        return svg(320, 200, `<rect x="0" y="0" width="320" height="150" fill="#a5d8ff"/><rect x="0" y="150" width="320" height="50" fill="#d8f5a2"/>` + dil(C, r * k, 0, aci, "rgba(255,255,255,.55)", "#1c7ed6"), "Radar")
          + kutu(`${v[0]} · alan ${N((A(r) * aci / 360))} km²${aci === 360 ? " (kara tarafı da sayıldı)" : ""}`); },
      kosullar: [{ ad: "Yalnız deniz tarafı (yarım daire).", f: v => v[0] === "Yarım daire" }, { ad: "Yarıçap 30 km.", f: v => v[1] === "30" }],
      sutun: ["Bölge", "Yarıçap", "Alan"], satir: v => [v[0], v[1] + " km", N((A(+v[1]) * (v[0] === "Tam daire" ? 1 : v[0] === "Yarım daire" ? .5 : .25))) + " km²"] }),
  };
})();

</script>
<script>
const V={"baslik": "Daire, Daire Dilimi, Eşkenar Dörtgen ve Yamuk Problemleri · Soru Bankası", "kod": "7. SINIF · MAT.7.4.10 · SORU BANKASI", "ses": "", "bet": "YENİ NESİL SORU", "bad": "Yeni Nesil Sorular", "s": [], "k": [], "b": [{"no": 1, "on": "<p>Bir müzedeki döner sergi platformu, yarıçapı 4 m olan bir dairedir. Platform, merkezden çıkan bölme duvarlarıyla eş bölmelere ayrılmıştır. (π = 3 alınız.)</p>", "g": "<svg viewBox=\"0 0 570.0 216.0\" width=\"570\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><g transform=\"translate(0 0)\"><circle cx=\"108.0\" cy=\"108.0\" r=\"88.0\" fill=\"#e9ecef\" stroke=\"#495057\" stroke-width=\"2.4\"/><line x1=\"108.0\" y1=\"108.0\" x2=\"108.0\" y2=\"20.0\" stroke=\"#495057\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"108.0\" y1=\"108.0\" x2=\"31.8\" y2=\"64.0\" stroke=\"#495057\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"108.0\" y1=\"108.0\" x2=\"31.8\" y2=\"152.0\" stroke=\"#495057\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"108.0\" y1=\"108.0\" x2=\"108.0\" y2=\"196.0\" stroke=\"#495057\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"108.0\" y1=\"108.0\" x2=\"184.2\" y2=\"152.0\" stroke=\"#495057\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"108.0\" y1=\"108.0\" x2=\"184.2\" y2=\"64.0\" stroke=\"#495057\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M108.0 108.0 L108.0 20.0 A88.0 88.0 0 0 0 31.8 64.0 Z\" fill=\"#ffe8cc\" stroke=\"#d9480f\" stroke-width=\"2\" stroke-linejoin=\"round\"/><circle cx=\"108\" cy=\"108\" r=\"6\" fill=\"#495057\"/><rect x=\"129.9\" y=\"76.0\" width=\"32.4\" height=\"20.0\" rx=\"7.7\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"146.1\" y=\"91.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">4 m</text></g><g transform=\"translate(240 0)\"><rect x=\"6.0\" y=\"34.0\" width=\"318.0\" height=\"148.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-wid 0 m² yine yeterlidir."], "t": "170 ve 190 m²'lik örtüler küçük kalır; 260 m² yeterli ama en küçüğü değildir.", "d": "Örtünün havuzu kapatması için alanı en az havuzun alanı kadar olmalıdır. π yerine 3 alındığında bulunan alan gerçek alandan biraz küçüktür; örtü seçerken bunu göz önüne alın.", "ses": "b02"}, {"no": 3, "on": "<p>Bir çocuk odasının duvarına gökkuşağı biçiminde bir çıkartma yapıştırılacaktır. Çıkartma, aynı merkezli iki yarım daire arasında kalan bölgedir; içteki yarım dairenin yarıçapı 4 dm, çıkartmanın genişliği 2 dm'dir. (π = 3 alınız.)</p>", "g": "<svg viewBox=\"0 0 658.0 178.0\" width=\"658\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><g transform=\"translate(0 0)\"><path d=\"M152.0 152.0 L284.0 152.0 A132.0 132.0 0 0 0 20.0 152.0 Z\" fill=\"#ffd8a8\" stroke=\"#e8590c\" stroke-width=\"2\" stroke-linejoin=\"round\"/><path d=\"M152.0 152.0 L240.0 152.0 A88.0 88.0 0 0 0 64.0 152.0 Z\" fill=\"#ffffff\" stroke=\"#495057\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><line x1=\"10.0\" y1=\"152.0\" x2=\"294.0\" y2=\"152.0\" stroke=\"#111111\" stroke-width=\"2\" stroke-linecap=\"round\"/><rect x=\"242.9\" y=\"157.5\" width=\"38.2\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"262.0\" y=\"171.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2 dm</text><rect x=\"88.9\" y=\"157.5\" width=\"38.2\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"108.0\" y=\"171.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">4 dm</text><circle cx=\"152\" cy=\"152\" r=\"4\" fill=\"#111111\"/></g><g transform=\"translate(328 0)\"><rect x=\"6.0\" y=\"28.0\" width=\"318.0\" height=\"122.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"6.0\" y=\"28.0\" width=\"318.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"165.0\" y=\"50.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">ÇIKARTMA</text><text x=\"165.0\" y=\"83.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Çıkartma, aynı merkezli iki</text><text x=\"165.0\" y=\"109.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">yarım daire arasında kalan</text><text x=\"165.0\" y=\"135.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">turuncu bölgedir.</text></g></svg>", "son": "", "k": "Buna göre, çıkartmanın alanı kaç desimetrekaredir?", "sec": ["6", "15", "24", "30"], "secg": null, "c": "D", "a": ["Dıştaki yarım dairenin yarıçapı 4 + 2 = 6 dm'dir.", "Dıştaki yarım daire 3 · 6 · 6 : 2 = 54 dm², içteki 3 · 4 · 4 : 2 = 24 dm²'dir.", "Çıkartma 54 − 24 = 30 dm²."], "t": "24: içteki yarım daire; 6: genişlik yarıçap gibi kullanılmış; 15: yarıya iki kez bölünmüş.", "d": "Çıkartma iki yarım daire arasındaki bölgedir: büyük yarım daireden küçüğünü çıkarın. Genişliği yarıçap gibi kullanmayın; dış yarıçap iç yarıçap ile genişliğin toplamıdır.", "ses": "b03"}, {"no": 4, "on": "<p>Kare biçimindeki bir dans pistinin kenarı 8 m'dir. Pistin ortasındaki çapı 4 m olan daire biçimli sahne dışında kalan bölgeye parke döşenecektir. (π = 3 alınız.)</p>", "g": "<svg viewBox=\"0 0 580.0 222.0\" width=\"580\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><g transform=\"translate(0 0)\"><rect x=\"20.0\" y=\"20.0\" width=\"176.0\" height=\"176.0\" rx=\"0\" fill=\"#e6c79c\" stroke=\"#8a5a2b\" stroke-width=\"2.4\"/><circle cx=\"108.0\" cy=\"108.0\" r=\"44.0\" fill=\"#ced4da\" stroke=\"#495057\" stroke-width=\"2\"/><line x1=\"64.0\" y1=\"108.0\" x2=\"152.0\" y2=\"108.0\" stroke=\"#111111\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><rect x=\"92.7\" y=\"86.5\" width=\"30.6\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"108.0\" y=\"100.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">4 m</text><rect x=\"91.8\" y=\"202.0\" width=\"32.4\" height=\"20.0\" rx=\"7.7\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"108.0\" y=\"217.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">8 m</text></g><g transform=\"translate(240 0)\"><rect x=\"6.0\" y=\"50.0\" width=\"328.0\" height=\"122.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"6.0\" y=\"50.0\" width=\"328.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"170.0\" y=\"72.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">DANS PİSTİ</text><text x=\"170.0\" y=\"105.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Kare pist: kenarı 8 m</text><text x=\"170.0\" y=\"131.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Ortadaki daire sahne</text><text x=\"170.0\" y=\"157.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">parkeyle kaplanmayacak.</text></g></svg>", "son": "", "k": "Buna göre, kaç metrekare parke döşenecektir?", "sec": ["16", "52", "60", "64"], "secg": null, "c": "B", "a": ["Pistin alanı 8 · 8 = 64 m²'dir.", "Sahnenin yarıçapı 2 m; alanı 3 · 2 · 2 = 12 m²'dir.", "Parke 64 − 12 = 52 m²."], "t": "16: çap yarıçap alınmış; 64: sahne çıkarılmamış; 60: sahne π ile çarpılmadan çıkarılmış.", "d": "Sahnenin çapı verilmiştir; alan hesabında yarıçap (çapın yarısı) kullanılır. Parke alanı, pistin alanından sahnenin alanı çıkarılarak bulunur.", "ses": "b04"}, {"no": 5, "on": "<p>Bir çiftlikte bir at, her kenarı 8 m olan kare biçimli ahırın dış köşesine çakılmış bir kazığa 10 m'lik iple bağlıdır. İp gergin kaldıkça at ahırın iki yanından arkaya dolanabilmektedir; arkada oluşan bölgeler üst üste binmez. Ahırın çevresi çayırdır. (π = 3 alınız.)</p>", "g": "<svg viewBox=\"0 0 603.0 240.0\" width=\"603\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><g transform=\"translate(0 0)\"><rect x=\"4.0\" y=\"4.0\" width=\"241.0\" height=\"232.0\" rx=\"8\" fill=\"#c3e6b4\" stroke=\"#5c940d\" stroke-width=\"1\"/><rect x=\"129.0\" y=\"120.0\" width=\"72.0\" height=\"72.0\" rx=\"0\" fill=\"#e9d8a6\" stroke=\"#8a6d1d\" stroke-width=\"2.4\"/><circle cx=\"129\" cy=\"120\" r=\"5\" fill=\"#111111\"/><rect x=\"145.9\" y=\"146.5\" width=\"38.2\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"165.0\" y=\"160.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">ahır</text><rect x=\"149.7\" y=\"97.5\" width=\"30.6\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"165.0\" y=\"111.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">8 m</text><rect x=\"205.7\" y=\"146.5\" width=\"30.6\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"221.0\" y=\"160.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">8 m</text><line x1=\"129.0\" y1=\"120.0\" x2=\"51.1\" y2=\"75.0\" stroke=\"#495057\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><rect x=\"49.2\" y=\"82.0\" width=\"60.8\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"79.6\" y=\"96.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">ip 10 m</text></g><g transform=\"translate(273 0)\"><rect x=\"6.0\" y=\"46.0\" width=\"318.0\" height=\"148.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"6.0\" y=\"46.0\" width=\"318.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"165.0\" y=\"68.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">ÇİFTLİK NOTU</text><text x=\"165.0\" y=\"101.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Ahır kare biçimlidir.</text><text x=\"165.0\" y=\"127.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">İp ahırın köşesine</text><text x=\"165.0\" y=\"153.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">bağlıdır; at ahırın</text><text x=\"165.0\" y=\"179.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">içine giremez.</text></g></svg>", "son": "", "k": "Buna göre, atın otlayabileceği bölgenin alanı kaç metrekaredir?", "sec": ["225", "228", "231", "300"], "secg": null, "c": "C", "a": ["Bağlandığı köşede 270°'lik, 10 m yarıçaplı dilim: 3 · 10 · 10 · 3 : 4 = 225 m².", "İp iki yanda da ahırın 8 m'lik kenarını dolanınca 2 m kalır; iki köşede 90°'lik, 2 m yarıçaplı dilimler: 3 + 3 = 6 m².", "Toplam 225 + 6 = 231 m²."], "t": "300: tam daire; 228: yalnız bir yan dolanılmış; 225: arka dilimler unutulmuş.", "d": "Bağlandığı köşede at ahırın içine giremez; ilk dilim 270°'liktir. İp ahırın kenarını aşarsa kalan iple köşede yeni bir dilim oluşur; bu dilimlerin merkezi ahırın köşesi, yarıçapı ipin kalan kısmıdır.", "ses": "b05"}, {"no": 6, "on": "<p>Bir aracın hız göstergesinde 0 ile 90 km/sa. arasındaki değerler, 270°'lik bir yay üzerine eşit aralıklarla dizilmiştir. Araç hızlanırken ibre 30 km/sa.'ten 60 km/sa.'e dönmüştür. (π = 3 alınız.)</p>", "g": "<svg viewBox=\"0 0 642.0 288.0\" width=\"642\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><g transform=\"translate(0 0)\"><path d=\"M223.2 223.2 A112.0 112.0 0 1 0 64.8 223.2\" fill=\"none\" stroke=\"#495057\" stroke-width=\"3\"/><line x1=\"64.8\" y1=\"223.2\" x2=\"57.7\" y2=\"230.3\" stroke=\"#495057\" stroke-width=\"2\" stroke-linecap=\"round\"/><text x=\"46.4\" y=\"246.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">0</text><line x1=\"35.8\" y1=\"173.0\" x2=\"26.2\" y2=\"175.6\" stroke=\"#495057\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"35.8\" y1=\"115.0\" x2=\"26.2\" y2=\"112.4\" stroke=\"#495057\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"64.8\" y1=\"64.8\" x2=\"57.7\" y2=\"57.7\" stroke=\"#495057\" stroke-width=\"2\" stroke-linecap=\"round\"/><text x=\"46.4\" y=\"51.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">30</text><line x1=\"115.0\" y1=\"35.8\" x2=\"112.4\" y2=\"26.2\" stroke=\"#495057\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"173.0\" y1=\"35.8\" x2=\"175.6\" y2=\"26.2\" stroke=\"#495057\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"223.2\" y1=\"64.8\" x2=\"230.3\" y2=\"57.7\" stroke=\"#495057\" stroke-width=\"2\" stroke-linecap=\"round\"/><text x=\"241.6\" y=\"51.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">60</text><line x1=\"252.2\" y1=\"115.0\" x2=\"261.8\" y2=\"112.4\" stroke=\"#495057\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"252.2\" y1=\"173.0\" x2=\"261.8\" y2=\"175.6\" stroke=\"#495057\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"223.2\" y1=\"223.2\" x2=\"230.3\" y2=\"230.3\" stroke=\"#495057\" stroke-width=\"2\" stroke-linecap=\"round\"/><text x=\"241.6\" y=\"246.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">90</text><line x1=\"144.0\" y1=\"144.0\" x2=\"70.5\" y2=\"70.5\" stroke=\"#c92a2a\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"144\" cy=\"144\" r=\"6\" fill=\"#495057\"/><text x=\"144.0\" y=\"178.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">km/sa.</text></g><g transform=\"translate(312 0)\"><rect x=\"6.0\" y=\"83.0\" width=\"318.0\" height=\"122.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"6.0\" y=\"83.0\" width=\"318.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"165.0\" y=\"105.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">GÖSTERGE</text><text x=\"165.0\" y=\"138.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">İbre: 8 cm</text><text x=\"165.0\" y=\"164.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Değerler 270°'lik yaya</text><text x=\"165.0\" y=\"190.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">eşit aralıklarla dizilmiştir.</text></g></svg>", "son": "", "k": "Buna göre, ibrenin bu sırada taradığı bölgenin alanı kaç santimetrekaredir?", "sec": ["16", "48", "64", "192"], "secg": null, "c": "B", "a": ["Her 10 km/sa. 270 : 9 = 30 derecelik açıya karşılık gelir; 30 km/sa.'lik artış 90°'dir.", "İbre 8 cm; taranan dilim 3 · 8 · 8 : 4 = 48 cm²."], "t": "192: tam daire; 64: π ile çarpılmamış; 16: açı 30° sanılmış.", "d": "Gösterge değerleri eşit aralıklıysa önce bir birimin kaç dereceye karşılık geldiğini bulun. Taranan bölge, iki değer arasındaki açının dilimidir; 0'dan başlamaz.", "ses": "b06"}, {"no": 7, "on": "<p>Kerem, yarıçapı 10 m ve merkez açısı 60° olan daire dilimi biçimindeki bir açık hava sahnesinin alanını defterine şöyle hesaplamıştır. (π = 3 alınız.)</p>", "g": "<svg viewBox=\"0 0 614.0 206.0\" width=\"614\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><g transform=\"translate(0 0)\"><path d=\"M24.0 180.0 L184.0 180.0 A160.0 160.0 0 0 0 104.0 41.4 Z\" fill=\"#e5dbff\" stroke=\"#7048e8\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><text x=\"68.0\" y=\"166.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"start\">60°</text><rect x=\"84.9\" y=\"185.5\" width=\"38.2\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"104.0\" y=\"199.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">10 m</text></g><g transform=\"translate(234 0)\"><rect x=\"6.0\" y=\"14.0\" width=\"368.0\" height=\"148.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"6.0\" y=\"14.0\" width=\"368.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"190.0\" y=\"36.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">KEREM'İN DEFTERİ</text><text x=\"20.0\" y=\"69.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">I. Yarıçap 10 m'dir.</text><text x=\"20.0\" y=\"95.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">II. Dairenin alanı: 3 · 10 · 10 = 300</text><text x=\"20.0\" y=\"121.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">III. Dilimin alanı: 300 · 60</text><text x=\"20.0\" y=\"147.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"start\">= 18 000 m²</text></g></svg>", "son": "", "k": "Buna göre, Kerem <u>ilk</u> hatayı hangi adımda yapmıştır ve sahnenin doğru alanı kaç metrekaredir?", "sec": ["I. adımda · 50 m²", "II. adımda · 300 m²", "III. adımda · 60 m²", "III. adımda · 50 m²"], "secg": null, "c": "D", "a": ["I. ve II. adımlar doğrudur: yarıçap 10 m, dairenin alanı 300 m².", "III. adımda açı, tam açının kaçta kaçı olduğuna çevrilmeden çarpılmıştır. 60°, tam açının altıda biridir.", "Doğru alan 300 : 6 = 50 m²."], "t": "Açı ile kesir karıştırılmamalıdır.", "d": "Dilimin alanı, dairenin alanının merkez açının tam açıya oranı kadarıdır. Açıyı doğrudan alanla çarpmayın; önce açının tam açının kaçta kaçı olduğunu bulun.", "ses": "b07"}, {"no": 8, "on": "<p>Kare biçimindeki bir çiçek tarhının kenarı 6 m'dir. Tarhın her köşesine, yarıçapı 3 m olan çeyrek daire biçiminde gül bölgeleri yapılacak, ortada kalan bölgeye çim ekilecektir. (π = 3 alınız.)</p>", "g": "<svg viewBox=\"0 0 538.0 190.0\" width=\"538\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><g transform=\"translate(0 0)\"><rect x=\"20.0\" y=\"20.0\" width=\"144.0\" height=\"144.0\" rx=\"0\" fill=\"#d3f9d8\" stroke=\"#5c940d\" stroke-width=\"2.4\"/><path d=\"M20.0 20.0 L20.0 92.0 A72.0 72.0 0 0 0 92.0 20.0 Z\" fill=\"#fcc2d7\" stroke=\"#c2255c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><path d=\"M164.0 20.0 L92.0 20.0 A72.0 72.0 0 0 0 164.0 92.0 Z\" fill=\"#fcc2d7\" stroke=\"#c2255c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><path d=\"M164.0 164.0 L164.0 92.0 A72.0 72.0 0 0 0 92.0 164.0 Z\" fill=\"#fcc2d7\" stroke=\"#c2255c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><path d=\"M20.0 164.0 L92.0 164.0 A72.0 72.0 0 0 0 20.0 92.0 Z\" fill=\"#fcc2d7\" stroke=\"#c2255c\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><rect x=\"75.8\" y=\"170.0\" width=\"32.4\" height=\"20.0\" rx=\"7.7\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"92.0\" y=\"185.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">6 m</text><rect x=\"40.7\" y=\"24.5\" width=\"30.6\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"56.0\" y=\"38.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">3 m</text></g><g transform=\"translate(208 0)\"><rect x=\"6.0\" y=\"21.0\" width=\"318.0\" height=\"148.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"6.0\" y=\"21.0\" width=\"318.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"165.0\" y=\"43.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">TARH PLANI</text><text x=\"165.0\" y=\"76.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Köşelerdeki pembe</text><text x=\"165.0\" y=\"102.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">bölgelere gül, ortadaki</text><text x=\"165.0\" y=\"128.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">yeşil bölgeye çim</text><text x=\"165.0\" y=\"154.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">ekilecektir.</text></g></svg>", "son": "", "k": "Buna göre, çim ekilecek bölgenin alanı kaç metrekaredir?", "sec": ["9", "18", "27", "36"], "secg": null, "c": "A", "a": ["Yarıçapları eşit dört çeyrek daire birleşince tam bir daire eder: 3 · 3 · 3 = 27 m² (kısa yol; dördü ayrı ayrı da hesaplanabilir).", "Tarh 6 · 6 = 36 m²; çim 36 − 27 = 9 m²."], "t": "27: gül bölgeleri; 36: tarhın tamamı; 18: iki çeyrek daire çıkarılmış.", "d": "Yarıçapları eşit dört çeyrek daire bir tam daire eder; bu, hesabı kısaltır. Çim bölgesi, kareden dört çeyrek dairenin çıkarılmasıyla kalan bölgedir.", "ses": "b08"}, {"no": 9, "on": "<p>Bir afişteki eşkenar dörtgen biçimli simgenin köşegenleri 6 cm ve 8 cm'dir. Afiş bir projektörle duvara yansıtılırken bütün uzunluklar 3 katına çıkmıştır.</p>", "g": "<svg viewBox=\"0 0 610.0 180.0\" width=\"610\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><g transform=\"translate(0 0)\"><polygon points=\"34.0,90.0 76.0,34.0 118.0,90.0 76.0,146.0\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/><line x1=\"34.0\" y1=\"90.0\" x2=\"118.0\" y2=\"90.0\" stroke=\"#d9480f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><line x1=\"76.0\" y1=\"34.0\" x2=\"76.0\" y2=\"146.0\" stroke=\"#d9480f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><polyline points=\"84.0,90.0 84.0,82.0 76.0,82.0\" fill=\"none\" stroke=\"#111111\" stroke-width=\"1.4\"/><rect x=\"35.9\" y=\"66.5\" width=\"38.2\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"55.0\" y=\"80.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">6 cm</text><rect x=\"82.1\" y=\"52.5\" width=\"38.2\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"101.2\" y=\"66.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">8 cm</text></g><g transform=\"translate(166 15)\"><line x1=\"10.0\" y1=\"75.0\" x2=\"100.0\" y2=\"75.0\" stroke=\"#111111\" stroke-width=\"2.4\"/><polygon points=\"100.0,75.0 92.7,78.3 92.7,71.7\" fill=\"#111111\"/><text x=\"55.0\" y=\"60.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">× 3</text></g><g transform=\"translate(290 10)\"><rect x=\"6.0\" y=\"19.0\" width=\"308.0\" height=\"122.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"6.0\" y=\"19.0\" width=\"308.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"160.0\" y=\"41.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">AFİŞ</text><text x=\"160.0\" y=\"74.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Projektörde bütün</text><text x=\"160.0\" y=\"100.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">uzunluklar 3 katına</text><text x=\"160.0\" y=\"126.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">çıkarılmıştır.</text></g></svg>", "son": "", "k": "Buna göre, duvardaki simgenin alanı kaç santimetrekaredir?", "sec": ["72", "216", "324", "432"], "secg": null, "c": "B", "a": ["Duvardaki simgenin köşegenleri 18 cm ve 24 cm'dir.", "Alan 18 · 24 : 2 = 216 cm²; ilk alan 24 cm² olduğundan alan 9 katına çıkmıştır."], "t": "72: alan da 3 katına çıktı sanılmış; 432: ikiye bölünmemiş; 324: köşegenler çarpılırken 18 iki kez alınmış.", "d": "Bütün uzunluklar 3 katına çıkınca alan 3 katına değil 9 katına çıkar. Yeni köşegenlerle alanı hesaplayarak kontrol edin.", "ses": "b09"}, {"no": 10, "on": "<p>Bir evin giriş holüne, paralel kenarları 30 cm ve 20 cm, bu kenarlar arasındaki uzaklığı 16 cm olan eş yamuk biçimli seramik taşlar boşluksuz döşenecektir. Holün alanı 2 m²'dir.</p>", "g": "<svg viewBox=\"0 0 606.0 196.0\" width=\"606\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><g transform=\"translate(0 20)\"><polygon points=\"30.0,126.0 210.0,126.0 180.0,30.0 60.0,30.0\" fill=\"#d0e3fb\" stroke=\"#1c5fbf\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/><line x1=\"60.0\" y1=\"30.0\" x2=\"60.0\" y2=\"126.0\" stroke=\"#6741d9\" stroke-width=\"2\" stroke-linecap=\"round\"/><polyline points=\"68.0,126.0 68.0,118.0 60.0,118.0\" fill=\"none\" stroke=\"#6741d9\" stroke-width=\"1.4\"/><rect x=\"65.2\" y=\"68.5\" width=\"45.7\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"88.0\" y=\"82.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">16 cm</text><rect x=\"97.2\" y=\"131.5\" width=\"45.7\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"120.0\" y=\"145.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">30 cm</text><rect x=\"97.2\" y=\"5.5\" width=\"45.7\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"120.0\" y=\"19.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">20 cm</text></g><g transform=\"translate(266 0)\"><rect x=\"6.0\" y=\"37.0\" width=\"328.0\" height=\"122.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"6.0\" y=\"37.0\" width=\"328.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"170.0\" y=\"59.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">DÖŞEME PLANI</text><text x=\"170.0\" y=\"92.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Giriş holünün alanı: 2 m²</text><text x=\"170.0\" y=\"118.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Taşlar eş ve yamuk</text><text x=\"170.0\" y=\"144.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">biçimlidir; boşluk kalmaz.</text></g></svg>", "son": "", "k": "Buna göre, kaç taş gerekir?", "sec": ["25", "50", "100", "200"], "secg": null, "c": "B", "a": ["Bir taşın alanı (30 + 20) · 16 : 2 = 400 cm²'dir.", "2 m² = 20 000 cm²; taş sayısı 20 000 : 400 = 50."], "t": "25: taş ikiye bölünmeden hesaplanmış; 100 ve 200: birim dönüşümünde hata yapılmış.", "d": "Taş sayısı için alanlar aynı birimde olmalıdır: 1 m² = 10 000 cm². Önce bir taşın alanını yamuk bağıntısıyla bulun, sonra holün alanını bir taşın alanına bölün.", "ses": "b10"}, {"no": 11, "on": "<p>Bir mağazada iki halı satılmaktadır. 1. halı çapı 2 m olan bir daire, 2. halı paralel kenarları 3 m ve 1 m, bu kenarlar arasındaki uzaklığı 2 m olan bir yamuktur. Fiyatlar etikette yazmaktadır. (π = 3 alınız.)</p>", "g": "<svg viewBox=\"0 0 704.0 200.0\" width=\"704\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><g transform=\"translate(0 0)\"><circle cx=\"80.0\" cy=\"80.0\" r=\"60.0\" fill=\"#e5dbff\" stroke=\"#5f3dc4\" stroke-width=\"2.4\"/><line x1=\"20.0\" y1=\"80.0\" x2=\"140.0\" y2=\"80.0\" stroke=\"#111111\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><rect x=\"64.7\" y=\"56.5\" width=\"30.6\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"80.0\" y=\"70.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2 m</text><text x=\"80.0\" y=\"172.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">1. halı</text><polygon points=\"190.0,140.0 340.0,140.0 290.0,40.0 240.0,40.0\" fill=\"#ffe8cc\" stroke=\"#e8590c\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/><rect x=\"249.7\" y=\"146.5\" width=\"30.6\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"265.0\" y=\"160.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">3 m</text><rect x=\"249.7\" y=\"16.5\" width=\"30.6\" height=\"19.0\" rx=\"7.3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"265.0\" y=\"30.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" f
