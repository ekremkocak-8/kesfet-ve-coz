rce Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">C, L'nin öbür yanında</text></svg>", "son": "<p>C köşesi, L merkezli |LB| yarıçaplı çemberle zemin çizgisinin öbür yanında bulunacaktır.</p>", "k": "Buna göre, |AC| ve AL doğru parçası için aşağıdakilerden hangisi doğrudur?", "sec": ["|AC| = 1,5 m · AL, A açısının açıortayıdır.", "|AC| = 2,5 m · AL, A açısını ikiye bölmez.", "|AC| = 2,5 m · AL, A açısının açıortayıdır.", "|AC| = 3 m · AL, B açısının açıortayıdır."], "secg": null, "c": "C", "a": ["AL, BC'yi L'de dik keser ve |LB| = |LC| olur; AL, BC'nin orta dikmesi üzerindedir.", "A, B ve C'ye eşit uzaklıktadır: |AC| = |AB| = 2,5 m. Üçgen ikizkenardır.", "İkizkenar üçgende tabana ait kenarortay tepe açısının açıortayıdır."], "t": "1,5 m: |LC|; 3 m: |BC|.", "d": "Zemin çizgisi L'de AL'ye dik inşa edilirse A, BC'nin orta dikmesi üzerinde olur; üçgen ikizkenardır ve AL aynı zamanda açıortay ve yüksekliktir.", "ses": "b07"}, {"no": 8, "on": "<p>Üçgen biçimli bir yüzme havuzunun A köşesinde cankurtaran kulesi vardır. Cankurtaranın BC kenarına giden en kısa yolu plan üzerinde yalnız pergel ve ölçüsüz cetvelle inşa edilecektir. İlk adımda A merkezli bir çember çizilmiş ve BC kenarını K ve N noktalarında kesmiştir.</p>", "g": "<svg viewBox=\"0 0 680 290\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8.0\" y=\"8.0\" width=\"664.0\" height=\"274.0\" rx=\"10\" fill=\"#e3fafc\" stroke=\"#99e9f2\" stroke-width=\"1.2\"/><polygon points=\"130.0,46.0 60.0,236.0 420.0,236.0\" fill=\"#74c0fc\" stroke=\"#1c7ed6\" stroke-width=\"3\" stroke-linejoin=\"round\"/><rect x=\"116.0\" y=\"20.0\" width=\"28.0\" height=\"30.0\" rx=\"3\" fill=\"#ffa94d\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"130.0\" y=\"62.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><text x=\"48.0\" y=\"252.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><text x=\"432.0\" y=\"252.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><rect x=\"460.0\" y=\"50.0\" width=\"200.0\" height=\"144.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"460.0\" y=\"50.0\" width=\"200.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"560.0\" y=\"72.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">CANKURTARAN</text><text x=\"560.0\" y=\"103.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Kule: A köşesi</text><text x=\"560.0\" y=\"129.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Kenar: BC</text><text x=\"560.0\" y=\"155.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Araçlar: pergel,</text><text x=\"560.0\" y=\"181.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">ölçüsüz cetvel</text></svg>", "son": "", "k": "Buna göre, ikinci adımda hangi noktalar merkez alınarak eş çemberler çizilmeli ve sonuçta hangi eleman elde edilir?", "sec": ["B ve C · BC kenarına ait kenarortay", "A ve K · A açısının açıortayı", "K ve N · BC kenarına ait kenarortay", "K ve N · BC kenarına ait yükseklik"], "secg": null, "c": "D", "a": ["En kısa yol A'dan BC'ye inen dikmedir; bu, BC kenarına ait yüksekliktir.", "A, K ve N'ye eşit uzaklıktadır. K ve N merkezli eş çemberlerin kesişim noktası da öyledir; bu nokta A ile birleştirilince KN'nin, yani BC'nin dikmesi elde edilir."], "t": "B ve C merkezli çemberler kenarortayı verir; K ve N'nin orta noktası BC'nin orta noktası değildir.", "d": "Yükseklik inşasında ilk çemberin merkezi köşedir ve çember karşı kenarın doğrusunu keser; ikinci adımda bu kesişim noktaları merkez alınır. B ve C merkezli çemberler kenarortayı verir.", "ses": "b08"}, {"no": 9, "on": "<p>Bir kartpostalın ortasındaki d katlama çizgisi, kartın üzerine çizilecek eşkenar ABC üçgeninin BC kenarına ait kenar orta dikmesi olacaktır. B noktası d'nin solunda, d'ye 3,5 cm uzaklıkta işaretlenmiştir.</p>", "g": "<svg viewBox=\"0 0 680 290\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8.0\" y=\"8.0\" width=\"664.0\" height=\"274.0\" rx=\"10\" fill=\"#f8f9fa\" stroke=\"#dee2e6\" stroke-width=\"1.2\"/><rect x=\"60.0\" y=\"30.0\" width=\"360.0\" height=\"230.0\" rx=\"4\" fill=\"#ffffff\" stroke=\"#495057\" stroke-width=\"1.6\"/><line x1=\"240.0\" y1=\"30.0\" x2=\"240.0\" y2=\"260.0\" stroke=\"#7048e8\" stroke-width=\"2\" stroke-dasharray=\"8 6\"/><text x=\"250.0\" y=\"52.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"start\">d</text><circle cx=\"170.0\" cy=\"200.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"163.8\" y=\"222.3\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><line x1=\"170.0\" y1=\"214.0\" x2=\"240.0\" y2=\"214.0\" stroke=\"#495057\" stroke-width=\"1.2\"/><rect x=\"186.0\" y=\"204.0\" width=\"38.0\" height=\"20.0\" rx=\"0\" fill=\"#ffffff\" stroke=\"none\" stroke-width=\"0\"/><text x=\"205.0\" y=\"220.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">3,5 cm</text><rect x=\"450.0\" y=\"50.0\" width=\"210.0\" height=\"144.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"450.0\" y=\"50.0\" width=\"210.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"555.0\" y=\"72.0\" font-family=\"Source Sans 3\ 111111\" text-anchor=\"middle\">3. çizim</text></svg>", "son": "", "k": "Buna göre, 1., 2. ve 3. çizimde inşa edilen elemanlar sırasıyla hangileridir?", "sec": ["Kenarortay · açıortay · yükseklik", "Yükseklik · kenarortay · açıortay", "Kenarortay · yükseklik · açıortay", "Açıortay · yükseklik · kenarortay"], "secg": null, "c": "C", "a": ["1. çizimde yayların merkezleri B ve C'dir; orta nokta A'ya birleştirilmiştir: kenarortay.", "2. çizimde A merkezli yay BC'yi iki noktada keser, bu noktalar merkezli yaylarla dikme çizilir: yükseklik.", "3. çizimde A merkezli yay AB ve AC kollarını keser: açıortay."], "t": "", "d": "İnşa izlerini okurken ilk çemberin merkezine bakın: merkezler kenarın uçlarıysa kenarortay; merkez köşe ve çember karşı kenarı kesiyorsa yükseklik; merkez köşe ve çember kolları kesiyorsa açıortay.", "ses": "b10"}, {"no": 11, "on": "<p>Ela, BC kenarına ait kenarortayı inşa ettiğini düşünmektedir. Kontrol için kâğıdı B köşesi C'nin üzerine gelecek şekilde katlamış, kat izinin M'den geçmediğini görmüş ve ölçüm yapmıştır.</p>", "g": "<svg viewBox=\"0 0 680 290\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8.0\" y=\"8.0\" width=\"664.0\" height=\"274.0\" rx=\"10\" fill=\"#f8f9fa\" stroke=\"#dee2e6\" stroke-width=\"1.2\"/><polygon points=\"180.0,50.0 70.0,200.0 430.0,200.0\" fill=\"#fff0f6\" stroke=\"#c2255c\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/><line x1=\"180.0\" y1=\"50.0\" x2=\"232.0\" y2=\"200.0\" stroke=\"#1c5fbf\" stroke-width=\"2.6\" stroke-linecap=\"round\"/><circle cx=\"232.0\" cy=\"200.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"225.8\" y=\"222.3\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">M</text><line x1=\"250.0\" y1=\"30.0\" x2=\"250.0\" y2=\"250.0\" stroke=\"#7048e8\" stroke-width=\"1.8\" stroke-dasharray=\"8 6\"/><text x=\"256.0\" y=\"44.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111 y=\"165.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Araçlar: pergel, ölçüsüz cetvel</text></svg>", "son": "", "k": "Buna göre, <u>en az</u> kaç çember çizilir ve hangi çizgilerin kesişimi bulunur?", "sec": ["2 çember · bir kenarortay ile bir kenar orta dikmenin", "3 çember · iki kenarortayın", "4 çember · iki kenarortayın", "3 çember · iki kenar orta dikmenin"], "secg": null, "c": "B", "a": ["Denge noktası ağırlık merkezidir; iki kenarortayın kesişimidir.", "Açıklık değişmediğinde üç köşe merkezli üç eş çember, iki kenarın orta dikmesini verir (ortak köşedeki çember iki kenarda kullanılır)."], "t": "4 çember: her kenar için ayrı açıklık; kenar orta dikmelerin kesişimi ağırlık merkezi değildir.", "d": "Tek açıklıkla üç köşeye çizilen üç çember iki kenarın orta dikmesini verir; ortak köşedeki çember iki kenarda kullanılır. Ağırlık merkezi kenarortayların, kenar orta dikmelerin değil, kesişimidir.", "ses": "b12"}, {"no": 13, "on": "<p>Bir tasarımcı, kâğıda çizdiği ABC üçgeninin eşkenar olup olmadığını pergelle kontrol etmiş ve sonucu nota yazmıştır. Ardından bir kenarortayı “tek kesişim noktası” kısa yoluyla inşa etmek istemektedir.</p>", "g": "<svg viewBox=\"0 0 680 290\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><defs><clipPath id=\"knt\"><rect x=\"8\" y=\"8\" width=\"664\" height=\"274\" rx=\"10\"/></clipPath></defs><g clip-path=\"url(#knt)\"><rect x=\"8.0\" y=\"8.0\" width=\"664.0\" height=\"274.0\" rx=\"10\" fill=\"#f1f3f5\" stroke=\"#dee2e6\" stroke-width=\"1.2\"/><polygon points=\"130.0,250.0 330.0,250.0 278.2,56.8\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><circle cx=\"330.0\" cy=\"250.0\" r=\"200.0\" fill=\"none\" stroke=\"#7048e8\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\"/><circle cx=\"278.2\" cy=\"56.8\" r=\"200.0\" fill=\"none\" stroke=\"#7048e8\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\"/><text x=\"116.0\" y=     // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
