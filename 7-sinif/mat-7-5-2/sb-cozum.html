<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* ANA_KURALLAR §4.y-3: Etkinliklerde bütün kesirler kesir çizgisiyle (alt alta pay/payda) gösterilir. Düz yazılmış a/b biçimleri otomatik dönüştürülür. */
(function(){
  if (window.__kesirCizgi) return; window.__kesirCizgi = 1;
  const RX = /(^|[^\w\/.,:%])([−-])?(?:(\d+) )?(\d{1,4})\/(\d{1,4})(?![\w\/.,]\d|\w)/g;
  const ATLA = "script,style,svg,textarea,input,select,code,.ilr,.frac,[data-duz]";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function donustur(kok){
    if (!kok || !kok.nodeType) return;
    if (kok.nodeType === 3) kok = kok.parentElement;
    if (!kok || (kok.closest && kok.closest(ATLA))) return;
    const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      if (!/\d\/\d/.test(t.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = t.parentElement; if (!p || p.closest(ATLA)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const L = []; let t; while ((t = w.nextNode())) L.push(t);
    L.forEach(t => {
      let deg = false;
      const h = esc(t.nodeValue).replace(RX, (m, a, s, tam, p, q) => { deg = true;
        return a + (s ? "−" : "") + (tam ? tam + " " : "") + '<span class="frac"><span>' + p + "</span><span>" + q + "</span></span>"; });
      if (!deg) return;
      const k = document.createElement("span"); k.innerHTML = h; t.replaceWith(...k.childNodes);
    });
  }
  let bekleyen = new Set(), plan = 0;
  const calis = () => { plan = 0; const b = bekleyen; bekleyen = new Set(); b.forEach(donustur); };
  const gozcu = new MutationObserver(ms => { ms.forEach(m => {
      if (m.type === "characterData") bekleyen.add(m.target); else m.addedNodes.forEach(n => bekleyen.add(n)); });
    if (!plan) plan = requestAnimationFrame(calis); });
  const bas = () => { donustur(document.body); gozcu.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bas); else bas();
  const st = document.createElement("style");
  st.textContent = ".frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}.frac>span{display:block;text-align:center;padding:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor}";
  document.head.appendChild(st);
})();

/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {

    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });

    async function dagit(k) {

      const kolon = Math.min(k, 6), satirK = Math.ceil(k / kolon), gw = kolon * 14 + 16, gh = satirK * 14 + 26;

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */
  function ATLA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Sonuç"] });
    let k = o.k, L = o.son; const W = 660, sol = 22, sag = 22, sk = (W - sol - sag) / L;

    const bA = dug("▶ Oynat"), bB = dug("+1 " + (o.adimAd || "adım"), "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bB, bS);
    let kA = null;
    if (o.kSec) { kA = adimci(o.kEtiket || "Adım:", 2, Math.floor(L / 2), k, v => { k = v; sifirla(); }); kut.prepend(kA.w); }

    const bT = dug(o.testDugme || "Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test);
    const ti = test.querySelector("input");
    function taban() {
      let sv = `<line x1="${sol}" y1="62" x2="${sol + L * sk}" y2="62" class="cn-ek"/>`;

      for (let v = 0; v <= L; v += adimT) sv += `<line x1="${sol + v * sk}" y1="${v % et ? 58 : 54}" x2="${sol + v * sk}" y2="66" class="cn-ek"/>` + (v % et ? "" : `<text x="${sol + v * sk}" y="82" text-anchor="middle" class="cn-et">${o.etYaz ? o.etYaz(v) : v}</text>`);
      sv += `<line x1="${sol + L * sk}" y1="30" x2="${sol + L * sk}" y2="70" class="cn-sinir"/><text x="${sol + L * sk}" y="24" text-anchor="end" class="cn-et">${o.sonEt || L}</text>`;

    }

      izle.forEach((v, i) => {

        sv += `<path d="M${x1} 62 Q${(x1 + x2) / 2} ${yy} ${x2} 62" class="cn-yay"/><circle cx="${x2}" cy="62" r="4.5" class="${o.renk ? o.renk(v, i + 1) : "cn-o"}"/>`;
        if (izle.length <= 14 || i === izle.length - 1 || i % Math.ceil(izle.length / 10) === 0) sv += `<text x="${x2}" y="${98}" text-anchor="middle" class="cn-et2">${v}</text>`;
      });

      const son = izle.length ? izle[izle.length - 1] : 0, ix = sol + son * sk;
      sv += `<text x="${ix}" y="50" text-anchor="middle" class="cn-kis">${o.simge || "●"}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W} 104" role="img" aria-label="${k} birimlik adımlarla ilerleme">${sv}</svg>`;
    }
    const ileri = () => {
      const v = (n + 1) * k;
      if (v > L) { durdur(); s.dur.innerHTML = `<span class="kotu">■</span> Sonraki ${o.adimAd || "adım"} ${k} ${x} ${n + 1} = <b>${v}</b> olurdu; bu ${E(L,"den")} büyük. ${o.bitti ? o.bitti(n, k, L) : `Toplam ${n} ${o.adimAd || "adım"}; son değer ${n * k}.`}`; if (!izle.length) ciz(); return false; }
      n++; izle.push(v); ciz(); s.dur.innerHTML = o.durum ? o.durum(n, v, k) : `${n}. ${o.adimAd || "adım"}: ${k} ${x} ${n} = <b>${v}</b>`; return true;

      s.dur.innerHTML = m; s.yaz("t" + v, [v, r === 0 ? (ic ? `${k} ${x} ${b} ✔` : `${k} ${x} ${b} (sınır dışı)`) : `kalan ${r} ✘`], r === 0 && ic);

  }

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || [o.kAd || "k", "Boyanan", "En büyük"] });
    let k = o.k || 2, son = o.son;
    const kut = h("div", "cn-satir");

    if (o.sonSec) { const sw = h("div", "cn-hazir"); o.sonSec.forEach(v => { const b = dug(v + " gün", "ghost"); b.onclick = () => { son = v; kur(); temiz(); }; sw.appendChild(b); }); s.den.append(kut, sw); }

      const g = h("div", "cn-izg" + (o.takvim ? " cn-tak" : "")); g.style.gridTemplateColumns = `repeat(${o.sutunSay},1fr)`;

    function temiz() { hucre.forEach(c => c && c.classList.remove("on", "yeni")); s.dur.innerHTML = o.ilk || "Sayıyı seçip Boya düğmesine basın."; }

      }

      s.yaz(k + ":" + son, o.satir ? o.satir(k, say, enb, son) : [k, say, enb], o.iyi ? o.iyi(k, say, enb, son) : null);
      calis = false; bB.disabled = false;

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */
  function ASANSOR(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Açık asansörler", "Gidilen kat", "Gidilemeyen kat"] });
    const ac = o.asansor.map(() => false);
    const kut = h("div", "cn-satir"); const bt = o.asansor.map((a, i) => { const b = dug(a.ad, "ghost"); b.style.setProperty("--ac", a.renk); b.setAttribute("aria-pressed", "false"); b.onclick = () => { ac[i] = !ac[i]; b.setAttribute("aria-pressed", ac[i]); ciz(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    function ciz() {
      let sv = ""; const H = o.kat * 17 + 40; let git = 0, gitme = [];
      for (let f = o.kat; f >= 0; f--) {

        sv += `<rect x="60" y="${y}" width="150" height="15" rx="2" class="${f === 0 ? "cn-zem" : herhangi ? "cn-katon" : (ac.some(Boolean) ? "cn-katoff" : "cn-kat")}"/><text x="52" y="${y + 12}" text-anchor="end" class="cn-et">${f === 0 ? "Z" : f}</text>`;
        o.asansor.forEach((a, i) => { if (dur[i]) sv += `<circle cx="${230 + i * 22}" cy="${y + 7.5}" r="6" fill="${a.renk}"/>`; });
      }
      s.sah.innerHTML = `<svg viewBox="0 0 300 ${H}" style="max-height:440px" role="img" aria-label="${o.kat} katlı bina">${sv}</svg>`;
      const acik = o.asansor.filter((a, i) => ac[i]).map(a => a.ad);

      s.yaz(acik.join("+"), [acik.join(" + "), git, gitme.length], null);

    ciz();
  }

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */
  function SAAT(el, o) {

      let onc = null, snr = null;
      for (let m = bas; m <= bit + ara; m += ara) { if (m <= var_) onc = m; if (m >= var_ && snr == null) snr = m; if (m <= bit) sv += `<text x="${20 + (m - bas) * sk}" y="40" text-anchor="middle" class="cn-bus">🚌</text>`; }

      if (snr != null && snr <= bit + ara) { const sx = 20 + (Math.min(snr, bit) - bas) * sk; sv += `<path d="M${vx} 56 L${sx} 56" class="cn-bek"/>`; }

      const gec = var_ - bas;
      s.dur.innerHTML = `${o.kisi} durağa ${saDa(var_)} geliyor: ilk seferden <b>${gec} dakika</b> sonra. Seferler ${E(ara,"in")} katı olan dakikalarda: ${ara} ${x} ${Math.floor(gec / ara)} = ${Math.floor(gec / ara) * ara}` + (gec % ara ? `, ${ara} ${x} ${Math.floor(gec / ara) + 1} = ${(Math.floor(gec / ara) + 1) * ara}. Sonraki otobüs ${saDa(snr)}; bekleme <b>${snr - var_} dakika</b>.` : `. Tam sefer saatinde geldi; bekleme <b>0 dakika</b>.`);
      s.yaz(ara + ":" + var_, [ara + " dk", sa(var_), sa(onc), sa(snr), (snr - var_) + " dk"], null);
    }
    ciz();
  }

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Çarpanlar", "Çarpan sayısı"] });
    let N = o.N || o.hazir[0]; let bul = new Set(), denendi = new Set();
    const kut = h("div", "cn-satir");
    const sA = adimci("Sayı:", 2, o.max || 200, N, v => { N = v; yeni(); });
    kut.appendChild(sA.w);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => sA.ayarla(n); hz.appendChild(b); }); kut.appendChild(hz); }
    s.den.appendChild(kut);
    const bolen = h("div", "cn-satir cn-test"); bolen.innerHTML = `<label>Bölen deneyin: <input type="number" inputmode="numeric" min="1"></label>`;
    const bD = dug("Böl"), bS = dug("Sıradakini dene", "ghost"); bolen.append(bD, bS); s.den.appendChild(bolen);
    const bi = bolen.querySelector("input");
    let bK = null; if (o.katlar) { bK = dug(o.katDugme || "Katlarını say ▶", "ghost"); s.den.appendChild(bK); }
    const ciftler = h("div", "cn-cift"); const katlar = h("div", "cn-katlar");
    function yeni() { bul = new Set(); denendi = new Set(); ciz(); s.dur.innerHTML = `${N} sayısını 1, 2, 3, … sayılarına bölerek çarpan çiftlerini bulun.`; katlar.textContent = ""; }
    function ciz() {
      const L = [...bul].sort((a, b) => a - b);
      s.sah.innerHTML = ""; const kartlar = h("div", "cn-kartlar");
      L.forEach(v => kartlar.appendChild(h("span", "cn-kart" + (v * v === N ? " kare" : ""), v)));
      if (!L.length) kartlar.appendChild(h("span", "cn-bosk", "Henüz çarpan bulunmadı"));
      s.sah.append(kartlar, ciftler, katlar);
      ciftler.innerHTML = L.filter(v => v * v <= N).map(v => `<span>${v} ${x} ${N / v}${v * v === N ? " <i>(aynı sayı: bir kez yazılır)</i>" : ""}</span>`).join("");
    }
    const tamamMi = () => { for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) return false; return true; };
    const eksik = () => { const L = []; for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) L.push(i); return ` <br>Henüz denenmeyen küçük bölenler var: <b>${L.join(", ")}</b>. Bunları da deneyin.`; };
    function dene(d) {
      if (!d || d < 1) return; denendi.add(d);
      const b = Math.floor(N / d), r = N % d;
      if (d > N) { s.dur.innerHTML = `${d} > ${N}: ${E(N,"den")} büyük sayı ${E(N,"in")} çarpanı olamaz.`; return; }
      if (r === 0) { bul.add(d); bul.add(b); ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${N} : ${d} = ${b}, kalan 0 → <b>${d} ${x} ${b} = ${N}</b>. ${d} ve ${b} çarpandır.` + (d * d >= N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} ${d * d === N ? "=" : ">"} ${N}. Artık yeni çift çıkmaz; bütün çarpanlar bulundu.` : eksik() : ""); }
      else { s.dur.innerHTML = `<span class="kotu">✘</span> ${N} : ${d} işleminde bölüm ${b}, <b>kalan ${r}</b>. ${d}, ${E(N,"in")} çarpanı değildir.` + (d * d > N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} > ${N}. Daha büyük bölen denemeye gerek yok; çarpan listesi tamam.` : eksik() : ""); }
      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));
      if (tamam) s.yaz("n" + N, [N, [...bul].sort((a, b) => a - b).join(", "), bul.size], true);
    }
    bD.onclick = () => dene(Math.round(+bi.value));
    bS.onclick = () => { let d = 1; while (denendi.has(d)) d++; bi.value = d; dene(d); };
    if (bK) bK.onclick = async () => {
      bK.disabled = true; katlar.textContent = ""; const sat = h("div", "cn-katsat"); katlar.append(h("b", "", `${E(N,"in")} katları: `), sat);
      for (let i = 1; i <= (o.katSay || 12); i++) { sat.appendChild(h("span", "cn-kat2", `${N * i}`)); await bekle(220); }
      sat.appendChild(h("span", "cn-sonsuz", "… ve sonsuza kadar sürer"));
      bK.disabled = false;
    };
    yeni();
  }

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */
  function KUMBARA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Para", "Sonuç"] });
    const k = o.k; let hafta = 0, tmr = null;
    const kut = h("div", "cn-satir"); const bA = dug("Bir hafta geçsin +"), bO = dug("▶ Haftaları oynat", "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bO, bS); s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Kumbarada şu para olabilir mi? <input type="number" inputmode="numeric" min="1" max="500"> TL</label>`;
    const bT = dug("Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test); const ti = test.querySelector("input");
    function ciz() {
      const top = hafta * k, sv = [];
      const yuk = Math.min(150, top * 1.4);
      sv.push(`<rect x="110" y="20" width="120" height="160" rx="22" class="cn-kum"/><rect x="150" y="14" width="40" height="8" rx="3" class="cn-kum2"/>`);
      sv.push(`<rect x="116" y="${176 - yuk}" width="108" height="${yuk}" rx="10" class="cn-para"/>`);
      sv.push(`<text x="170" y="110" text-anchor="middle" class="cn-buyuk">${top} TL</text><text x="170" y="134" text-anchor="middle" class="cn-et">${hafta}. hafta</text>`);
      let cizgi = ""; for (let i = 1; i <= hafta && i <= 16; i++) cizgi += `<text x="${260 + ((i - 1) % 4) * 52}" y="${40 + Math.floor((i - 1) / 4) * 34}" class="cn-et2">${k}${x}${i}=${k * i}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 480 190" role="img" aria-label="Kumbara">${sv.join("")}${cizgi}</svg>`;
      s.dur.innerHTML = hafta ? `${hafta}. hafta sonunda kumbarada ${k} ${x} ${hafta} = <b>${top} TL</b> var.` : `Kumbara boş. Her hafta ${k} TL atılıyor.`;
    }
    bA.onclick = () => { hafta++; ciz(); };
    bO.onclick = () => { if (tmr) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } bO.textContent = "❚❚ Durdur"; tmr = setInterval(() => { if (hafta >= 15) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } hafta++; ciz(); }, az ? 50 : 500); };
    bS.onclick = () => { hafta = 0; ciz(); };
    bT.onclick = () => {
      const v = Math.round(+ti.value); if (!v) return; const b = Math.floor(v / k), r = v % k;
      s.dur.innerHTML = r ? `<span class="kotu">✘</span> ${k} ${x} ${b} = ${k * b} TL, ${k} ${x} ${b + 1} = ${k * (b + 1)} TL. ${v} TL arada kalır (${v} : ${k} → kalan ${r}). Kumbarada hiçbir hafta ${v} TL olmaz.`
        : `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · ${b}. hafta sonunda kumbarada tam ${v} TL olur.`;
      if (!r) { hafta = b; ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · <b>${b}. hafta</b> sonunda kumbarada tam ${v} TL olur.`; }
      s.yaz("t" + v, [v + " TL", r ? `kalan ${r} ✘` : `${k} ${x} ${b} ✔`], !r);
    };
    ciz();
  }

  /* 9) ÖNERME LABORATUVARI: önermeyi farklı sayılarla sınama */
  function ONERME(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Önerme", "Sayı", "Sonuç"] });
    let akt = 0; const kut = h("div", "cn-hazir");
    const bt = o.onermeler.map((on, i) => { const b = dug(on.ad, "ghost"); b.setAttribute("aria-pressed", i === 0); b.onclick = () => { akt = i; bt.forEach((x, j) => x.setAttribute("aria-pressed", j === i)); goster(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Sınanacak sayı: <input type="number" inputmode="numeric" min="1" max="200" value="12"></label>`;
    const bT = dug("Sına"), bR = dug("Rastgele sayı", "ghost"); test.append(bT, bR); s.den.appendChild(test); const ti = test.querySelector("input");
    function goster() { s.sah.innerHTML = `<div class="cn-onr"><b>${o.onermeler[akt].ad}:</b> “${o.onermeler[akt].metin}”</div>`; s.dur.innerHTML = "Bir sayı yazıp Sına düğmesine basın. Önerme her sayıda doğru mu?"; }
    function sina(n) {
      const on = o.onermeler[akt], r = on.sina(n);
      s.sah.innerHTML = `<div class="cn-onr"><b>${on.ad}:</b> “${on.metin}”</div><div class="cn-kanit">${r.goster}</div>`;
      s.dur.innerHTML = (r.ok ? `<span class="iyi">✔</span> ${n} için önerme doğru.` : `<span class="kotu">✘</span> ${n} için önerme yanlış! Bir karşı örnek bulundu.`) + (r.not ? " " + r.not : "");
      s.yaz(akt + ":" + n, [on.ad, n, r.ok ? "doğru" : "yanlış (karşı örnek)"], r.ok);
    }
    bT.onclick = () => { const n = Math.round(+ti.value); if (n > 0) sina(n); };
    bR.onclick = () => { const n = 2 + Math.floor(Math.random() * 59); ti.value = n; sina(n); };
    goster();
  }


  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →
     koşullar tek tek denetlenir (✔/✘) → deney defterine yazılır. Doğru cevap verilmez; öğrenci uygun girdiyi kendisi arar.
     o.girdi: [{ad, min, max, bas} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → SVG/HTML · o.kosullar: [{ad, f(v) → bool | {ok, not}}]
     o.dugme: düğme yazısı (false → her değişiklikte denetlenir) · o.sonuc(v, hepsi, L) · o.satir(v, hepsi, L) · o.iyi(v, L) · o.ek: [{ad, deger(v) → v}] */
  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);
      s.dur.innerHTML = m;
      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);
    }
    kur = true; ciz();
    if (bS) s.dur.innerHTML = o.ilk || "Değerleri seçip Sına düğmesine basın."; else sina();
  }

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

/* SORU BANKASI · MAT.7.5.2 · Üçgende Kenarortay İnşası — yeni nesil soruların "Canlandır" düzenekleri (16.10.2026) — ortak motor: canlandir.js (CN.KOSUL); yeni motor yok.
   Her düzenek: öğrenci seçim düğmeleri ya da − / + sayaçlarıyla durumu değiştirir → sahne (pergel izleri, doğrular) anında çizilir → koşullar denetlenir →
   deneme deney defterine yazılır → yeniden dener. Doğru cevap bir düğmeyle verilmez; denemelerden çıkar (§4.k, §19-10).
   İnşa geometrisi bu dosyada ayrıca yazıldı (fasikülün canlandir_752.js dosyası gömülmez). */
window.CANL = (() => {
  if (!document.getElementById("csb752-stil")) { const st = document.createElement("style"); st.id = "csb752-stil";
    st.textContent = ".cn-btn{min-width:44px;min-height:44px}.cn-adimci button{min-width:44px;min-height:44px}.cn-secg button{min-height:44px}.csb752-k{text-align:center;font-size:17px;font-weight:800;margin:8px auto;max-width:640px;line-height:1.6}"; document.head.appendChild(st); }
  const D = (v, n = 1) => String(Math.round(v * 10 ** n) / 10 ** n).replace(".", ",");
  const R = a => a * Math.PI / 180;
  const yon = (a, r = 1) => [r * Math.cos(R(a)), -r * Math.sin(R(a))];
  const ek = (P, v, k = 1) => [P[0] + k * v[0], P[1] + k * v[1]];
  const uz = (P, Q) => Math.hypot(Q[0] - P[0], Q[1] - P[1]);
  const orta = (P, Q) => [(P[0] + Q[0]) / 2, (P[1] + Q[1]) / 2];
  const ayak = (X, P, Q) => { const dx = Q[0] - P[0], dy = Q[1] - P[1], t = ((X[0] - P[0]) * dx + (X[1] - P[1]) * dy) / (dx * dx + dy * dy); return [[P[0] + t * dx, P[1] + t * dy], t]; };
  const uzD = (X, P, Q) => uz(X, ayak(X, P, Q)[0]);
  const kesD = (P, Q, S, T) => { const d = (Q[0] - P[0]) * (T[1] - S[1]) - (Q[1] - P[1]) * (T[0] - S[0]); if (Math.abs(d) < 1e-9) return null; const t = ((S[0] - P[0]) * (T[1] - S[1]) - (S[1] - P[1]) * (T[0] - S[0])) / d; return [P[0] + t * (Q[0] - P[0]), P[1] + t * (Q[1] - P[1])]; };
  const kesC = (C1, r1, C2, r2) => { const d = uz(C1, C2); if (d > r1 + r2 + 1e-9 || d < Math.abs(r1 - r2) - 1e-9 || d === 0) return []; const a = (r1 * r1 - r2 * r2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, r1 * r1 - a * a)), ex = (C2[0] - C1[0]) / d, ey = (C2[1] - C1[1]) / d, M = [C1[0] + a * ex, C1[1] + a * ey]; return h < .5 ? [M] : [[M[0] - h * ey, M[1] + h * ex], [M[0] + h * ey, M[1] - h * ex]]; };
  const agirlik = (A, B, C) => [(A[0] + B[0] + C[0]) / 3, (A[1] + B[1] + C[1]) / 3];
  const svg = (w, h, ic, ad) => `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${Math.round(w * 1.3)}px;height:auto;display:block;margin:0 auto" role="img" aria-label="${ad || "Çizim"}">${ic}</svg>`;
  const tx = (x, y, s, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.an || "middle"}" style="font-size:${o.fs || 14}px;font-weight:800;fill:${o.r || "#1d2433"};paint-order:stroke;stroke:#fff;stroke-width:4px">${s}</text>`;
  const dp = (P, Q, r = "#1d2433", w = 2.6, k = "") => `<line x1="${P[0]}" y1="${P[1]}" x2="${Q[0]}" y2="${Q[1]}" stroke="${r}" stroke-width="${w}" stroke-linecap="round"${k ? ` stroke-dasharray="${k}"` : ""}/>`;
  const dogru = (P, Q, e = 40, r = "#2b8a3e", w = 2.2, k = "7 5") => { const L = uz(P, Q), u = [(Q[0] - P[0]) / L, (Q[1] - P[1]) / L]; return dp(ek(P, u, -e), ek(Q, u, e), r, w, k); };
  const pol = (L, f = "#f1f6ff", s = "#1d2433", w = 2.6) => `<polygon points="${L.map(p => p.join(",")).join(" ")}" fill="${f}" stroke="${s}" stroke-width="${w}" stroke-linejoin="round"/>`;
  const cem = (C, r, renk = "#7048e8") => `<circle cx="${C[0]}" cy="${C[1]}" r="${r}" fill="none" stroke="${renk}" stroke-width="1.5" stroke-dasharray="6 5"/>`;
  const nok = (P, ad, a = 90, r = "#1d2433", rr = 5) => `<circle cx="${P[0]}" cy="${P[1]}" r="${rr}" fill="${r}"/>` + (ad ? tx(...ek(P, yon(a, 18)).map((v, i) => v + (i ? 5 : 0)), ad) : "");
  const adlar = (P, d = 18) => { const G = agirlik(P.A, P.B, P.C); return ["A", "B", "C"].map(k => { const v = [P[k][0] - G[0], P[k][1] - G[1]], L = Math.hypot(...v); return tx(P[k][0] + v[0] / L * d, P[k][1] + v[1] / L * d + 5, k, { fs: 16 }); }).join(""); };
  const kutu = h => `<div class="csb752-k">${h}</div>`;
  const KO = (el, o) => CN.KOSUL(el, Object.assign({ dugme: false }, o));
  const KO_ = "#1c5fbf", OD = "#2b8a3e", PG = "#7048e8";
  const sayi = s => +String(s).replace(",", ".");

  return {
    /* 1 · Tahta pergeli: 40 cm'lik açıklıkla hangi kenarın orta dikmesi çizilir? (ölçek 1 cm = 2,2 px) */
    1: el => { const k = 2.2, a = 96, b = 85, c = 70, x = (c * c - b * b + a * a) / (2 * a), y = Math.sqrt(c * c - x * x);
      const B = [40, 240], C = [40 + a * k, 240], A = [40 + x * k, 240 - y * k], P = { A, B, C };
      const K = { "AB (70 cm)": ["A", "B", 70], "AC (85 cm)": ["A", "C", 85], "BC (96 cm)": ["B", "C", 96] };
      return KO(el, { yon: "Bir kenar seçiniz. Tahta pergeli en büyük açıklığıyla (40 cm) kenarın iki ucuna çember çizer. Çemberler iki noktada kesişirse orta dikme çizilebilir.", bitis: "Üç kenarı da denediğinizde.",
        girdi: [{ ad: "Kenar:", sec: Object.keys(K), bas: "BC (96 cm)" }],
        ciz: v => { const [p, q, L] = K[v[0]], I = kesC(P[p], 40 * k, P[q], 40 * k);
          let s = `<rect x="2" y="2" width="${a * k + 76}" height="266" rx="8" fill="#f8f9fa" stroke="#868e96"/>` + pol([A, B, C], "none", "#1c5fbf") + cem(P[p], 40 * k) + cem(P[q], 40 * k) + adlar(P);
          I.forEach(t => s += nok(t, "", 0, PG)); if (I.length === 2) s += dogru(I[0], I[1], 20);
          return svg(a * k + 80, 270, s, "Tahta") + kutu(`${v[0]}: yarısı ${D(L / 2)} cm · pergel 40 cm · ${I.length === 2 ? "çemberler iki noktada kesişti" : "çemberler kesişmedi"}`); },
        kosullar: [{ ad: v => `${v[0].split(" ")[0]} kenarının orta dikmesi bu pergelle çizilebilir.`, f: v => K[v[0]][2] / 2 < 40 }],
        iyi: () => true, sutun: ["Kenar", "Yarısı", "Kesişme"], satir: v => [v[0], D(K[v[0]][2] / 2) + " cm", K[v[0]][2] / 2 < 40 ? "iki nokta" : "yok"] }); },

    /* 2 · Seramik karo: ustanın adımları */
    2: el => { const A = [150, 46], B = [50, 230], C = [340, 230], r = 190, I = kesC(B, r, C, r), P = I.reduce((a, b) => a[1] < b[1] ? a : b), Rr = I.reduce((a, b) => a[1] > b[1] ? a : b), M = orta(B, C), N = kesD(A, P, B, C);
      const S = ["B ve C merkezli eş çemberler çizdim.", "Kesişim noktalarından birini P ile işaretledim.", "A ile P'yi birleştirip BC'ye uzattım.", "BC'yi kestiği noktaya M dedim."];
      return KO(el, { yon: "Ustanın adımlarını sırayla izleyiniz; her adımdan sonraki çizim gösterilir. Gri kesik çizgi, BC'nin gerçek orta dikmesidir (karşılaştırma için).", bitis: "İlk hatalı adımı bulduğunuzda.",
        girdi: [{ ad: "Adım", min: 1, max: 4, bas: 1 }],
        ciz: v => { const n = v[0]; let s = pol([A, B, C], "#d0ebff") + adlar({ A, B, C });
          if (n >= 1) s += cem(B, r) + cem(C, r); if (n >= 2) s += nok(P, "P", 30, PG) + nok(Rr, "", 0, PG); s += dogru(P, Rr, 10, "#adb5bd", 1.4, "4 4");
          if (n >= 3) s += dp(A, N, "#c92a2a", 3); if (n >= 4) s += nok(N, "ustanın M'si", 270, "#c92a2a") + nok(M, "", 0, "#2b8a3e");
          return svg(390, 300, `<defs><clipPath id="c2k"><rect width="390" height="300"/></clipPath></defs><g clip-path="url(#c2k)">${s}</g>`, "Karo") + kutu(`${n}. adım: ${S[n - 1]}<br>${n <= 2 ? "Bu adım doğru." : n === 3 ? "A, orta dikme üzerinde değil; AP doğrusu orta dikme olmaz." : `Ustanın noktası orta noktadan (yeşil) ${D(uz(N, M) / 10)} birim uzakta.`}`); },
        kosullar: [{ ad: "İlk hatalı adım bulundu.", f: v => v[0] === 3 }],
        sutun: ["Adım", "Yazılan", "Durum"], satir: v => [v[0], S[v[0] - 1], v[0] <= 2 ? "doğru" : "hatalı"] }); },

    /* 3 · Kum havuzu: tek kesişim noktası (ikizkenar mı, çeşitkenar mı?) */
    3: el => { const B = [80, 250], C = [320, 250], r = 150;
      const H = { "İkizkenar (|AB| = |AC|)": [200, 40], "Çeşitkenar": [140, 40] };
      return KO(el, { yon: "Havuzun biçimini ve kullanılacak kesişim noktasını seçiniz. A ile seçilen nokta birleştirilip BC'ye uzatılır; BC'yi kestiği noktanın B'ye ve C'ye uzaklığı ölçülür.", bitis: "Kısa yolun hangi havuzda doğru sonuç verdiğini bulduğunuzda.",
        girdi: [{ ad: "Havuz:", sec: Object.keys(H), bas: "Çeşitkenar" }, { ad: "Nokta:", sec: ["Üstteki (P)", "Alttaki (R)"], bas: "Üstteki (P)" }],
        ciz: v => { const A = H[v[0]], I = kesC(B, r, C, r), P = I.reduce((a, b) => a[1] < b[1] ? a : b), Rr = I.reduce((a, b) => a[1] > b[1] ? a : b), Q = v[1].startsWith("Üst") ? P : Rr, N = kesD(A, Q, B, C);
          const s = pol([A, B, C], "#ffe8a3", "#c9a227", 6) + cem(B, r) + cem(C, r) + nok(P, "P", 0, PG) + nok(Rr, "R", 0, PG) + dp(A, N, "#c92a2a", 3) + nok(N, "", 0, "#c92a2a") + adlar({ A, B, C });
          return svg(400, 420, `<g transform="translate(0 30)">${s}</g>`, "Kum havuzu") + kutu(`BC'yi kestiği nokta: B'ye ${D(uz(B, N) / 24)} birim · C'ye ${D(uz(N, C) / 24)} birim`); },
        kosullar: [{ ad: "Çizgi BC'yi tam ortasından kesiyor (kenarortay).", f: v => v[0].startsWith("İkiz") }],
        sutun: ["Havuz", "Nokta", "Ortaladı mı?"], satir: (v, ok) => [v[0].split(" ")[0], v[1].split(" ")[0], ok ? "Evet" : "Hayır"] }); },

    /* 4 · Vitray: hazır çemberlere kaç çember eklenmeli? */
    4: el => { const u = 150, B = [135, 330], C = [135 + u, 330], A = [135 + u / 2, 330 - u * Math.sqrt(3) / 2], P = { A, B, C };
      const dis = (X, Y, Z) => { const I = kesC(X, u, Y, u); return I.reduce((a, b) => uz(a, Z) > uz(b, Z) ? a : b); };
      return KO(el, { yon: "Hazır iki çembere (B ve C merkezli) eklenecek çember sayısını − / + ile seçiniz. Her çember çiftinin üçgenin dışındaki kesişim noktası karşı köşeye birleştirilir.", bitis: "Üç kenarortayın ve ağırlık merkezinin bulunduğu en az çember sayısını bulduğunuzda.",
        girdi: [{ ad: "Yeni çember", min: 0, max: 2, bas: 0 }],
        ciz: v => { let s = pol([A, B, C], "#d0ebff", "#5c3d1e", 4) + cem(B, u) + cem(C, u), say = 1; const D1 = dis(B, C, A); s += dp(A, D1, KO_, 2.6) + nok(D1, "", 0, PG);
          if (v[0] >= 1) { s += cem(A, u); const D2 = dis(A, B, C), D3 = dis(A, C, B); s += dp(C, D2, KO_, 2.6) + dp(B, D3, KO_, 2.6) + nok(D2, "", 0, PG) + nok(D3, "", 0, PG) + nok(agirlik(A, B, C), "G", 30, "#e8590c", 6); say = 3; }
          if (v[0] >= 2) s += cem(B, u * .7);
          return svg(420, 480, `<defs><clipPath id="c4v"><rect width="420" height="480"/></clipPath></defs><g clip-path="url(#c4v)">${s}${adlar(P)}</g>`, "Vitray çizimi") + kutu(`Toplam ${2 + v[0]} çember · bulunan kenarortay: ${say}`); },
        kosullar: [{ ad: "Üç kenarortay ve ağırlık merkezi bulundu.", f: v => v[0] >= 1 }, { ad: "Gereksiz çember yok.", f: v => v[0] <= 1 }],
        sutun: ["Yeni çember", "Kenarortay", "Toplam çember"], satir: v => [v[0], v[0] >= 1 ? 3 : 1, 2 + v[0]] }); },

    /* 5 · Sahne platformu: 3 m'lik pergelle hangi iki kenar? */
    5: el => { const k = 40, a = 7, b = 5, c = 4, x = (c * c - b * b + a * a) / (2 * a), y = Math.sqrt(c * c - x * x);
      const B = [40, 260], C = [40 + a * k, 260], A = [40 + x * k, 260 - y * k], P = { A, B, C }, r = 3 * k;
      const K = { "AB (4 m) ve AC (5 m)": [["A", "B"], ["A", "C"]], "AB (4 m) ve BC (7 m)": [["A", "B"], ["B", "C"]], "AC (5 m) ve BC (7 m)": [["A", "C"], ["B", "C"]] };
      const kar = { A: "C", B: "A", C: "B" };
      return KO(el, { yon: "Kenarortaylarını inşa edeceğiniz iki kenarı seçiniz. Pergel 3 m açılır; her kenarın uçlarına 3 m'lik çemberler çizilir.", bitis: "Ağırlık merkezini bulabildiğiniz kenar çiftini bulduğunuzda.",
        girdi: [{ ad: "Kenarlar:", sec: Object.keys(K), bas: "AB (4 m) ve BC (7 m)" }],
        ciz: v => { let s = pol([A, B, C], "#e9b97a", "#8a5a2b", 3), tamam = 0; const ko = [];
          K[v[0]].forEach(([p, q]) => { s += cem(P[p], r) + cem(P[q], r); const I = kesC(P[p], r, P[q], r); if (I.length === 2) { tamam++; const M = orta(P[p], P[q]), z = ["A", "B", "C"].find(t => t !== p && t !== q); s += dogru(I[0], I[1], 6, OD, 1.6) + dp(P[z], M, KO_, 3); ko.push([P[z], M]); } });
          if (ko.length === 2) s += nok(kesD(ko[0][0], ko[0][1], ko[1][0], ko[1][1]), "G", 30, "#e8590c", 6);
          return svg(380, 300, `<defs><clipPath id="c5s"><rect width="380" height="300"/></clipPath></defs><g clip-path="url(#c5s)">${s}${adlar(P)}</g>`, "Sahne planı") + kutu(`İnşa edilen kenarortay: ${tamam} · ${tamam === 2 ? "ağırlık merkezi bulundu" : "ağırlık merkezi bulunamadı"}`); },
        kosullar: [{ ad: "İki kenarortay da inşa edildi; ağırlık merkezi bulundu.", f: v => v[0].startsWith("AB (4 m) ve AC") }],
        sutun: ["Kenarlar", "Sonuç"], satir: (v, ok) => [v[0], ok ? "G bulundu" : "çemberler kesişmedi"] }); },

    /* 6 · Havuz köprüsü: C'nin yeri */
    6: el => { const A = [200, 30], L = [220, 186], d = yon(-14, 1), k = 22, B = ek(L, d, -6 * k);
      return KO(el, { yon: "C köşesinin L'ye uzaklığını (m) − / + ile seçiniz; C, L'nin öbür yanına konur. L'nin BC'nin orta noktası olup olmadığı gösterilir.", bitis: "AL'yi kenarortay yapan C'yi bulduğunuzda.",
        girdi: [{ ad: "|LC| (m)", min: 3, max: 9, bas: 4 }],
        ciz: v => { const C = ek(L, d, v[0] * k), M = orta(B, C);
          return svg(440, 260, `<rect x="2" y="2" width="436" height="256" rx="10" fill="#e7f5ff"/>` + dogru(B, C, 30, "#868e96", 1.4, "5 4") + pol([A, B, C], "#74c0fc66", "#1c7ed6") + dp(A, L, "#8a5a2b", 6) + nok(A, "A", 90) + nok(L, "L", 60) + nok(B, "B", 250) + nok(C, "C", 300) + nok(M, "", 0, "#c92a2a", 4), "Havuz planı")
            + kutu(`|LB| = 6 m · |LC| = ${v[0]} m · |BC| = ${6 + v[0]} m · BC'nin orta noktası (kırmızı) ${v[0] === 6 ? "L'dir" : "L değildir"}`); },
        kosullar: [{ ad: "L, BC'nin orta noktası; AL kenarortay.", f: v => v[0] === 6 }],
        sutun: ["|LC|", "|BC|", "Kenarortay mı?"], satir: (v, ok) => [v[0] + " m", 6 + v[0] + " m", ok ? "Evet" : "Hayır"] }); },

    /* 7 · Tente: zemin çizgisinin AL ile açısı */
    7: el => { const A = [200, 30], L = [200, 230], k = 100;
      return KO(el, { yon: "Zemin çizgisinin AL direğiyle yaptığı açıyı seçiniz. B ve C, L'den 1,5 m uzaklıkta, iki yanda işaretlenir; |AB|, |AC| ve A'daki iki açı ölçülür.", bitis: "AL'nin hem kenarortay hem açıortay olduğu durumu bulduğunuzda.",
        girdi: [{ ad: "AL ile açı:", sec: [60, 75, 90], yaz: x => x + "°", bas: 60 }],
        ciz: v => { const d = yon(-90 + v[0], 1), B = ek(L, d, -1.5 * k), C = ek(L, d, 1.5 * k), ab = uz(A, B) / k, ac = uz(A, C) / k;
          const aci = (P) => { const u = [P[0] - A[0], P[1] - A[1]], w = [L[0] - A[0], L[1] - A[1]]; return Math.acos((u[0] * w[0] + u[1] * w[1]) / Math.hypot(...u) / Math.hypot(...w)) * 180 / Math.PI; };
          return svg(400, 330, dogru(B, C, 30, "#868e96", 3, "") + pol([A, B, C], "#fff3bf88", "#e8590c") + dp(A, L, "#495057", 6) + nok(A, "A", 90) + nok(L, "L", 300) + nok(B, "B", 250) + nok(C, "C", 300), "Tente")
            + kutu(`|AB| = ${D(ab, 2)} m · |AC| = ${D(ac, 2)} m · A'da: ${D(aci(B))}° ve ${D(aci(C))}°`); },
        kosullar: [{ ad: "|AB| = |AC| ve AL, A açısını iki eş açıya bölüyor.", f: v => v[0] === 90 }],
        sutun: ["Açı", "|AB|", "|AC|"], satir: (v, ok) => [v[0] + "°", ok ? "2,5 m" : "farklı", ok ? "2,5 m" : "farklı"] }); },

    /* 8 · Cankurtaran: A merkezli çemberin yarıçapı */
    8: el => { const A = [120, 40], B = [40, 230], C = [400, 230], H = ayak(A, B, C)[0], h = uz(A, H);
      return KO(el, { yon: "A merkezli çemberin yarıçapını − / + ile seçiniz. Çember BC'yi iki noktada keserse (K, N) bu noktalar merkezli eş çemberler çizilir ve kesişim noktası A ile birleştirilir.", bitis: "En kısa yolu inşa ettiğinizde.",
        girdi: [{ ad: "Yarıçap (birim)", min: 6, max: 14, bas: 7 }],
        ciz: v => { const r = v[0] * 20, I = kesC(A, r, A, r); let s = pol([A, B, C], "#74c0fc", "#1c7ed6", 3) + cem(A, r); let ok = false;
          if (r > h) { const e = Math.sqrt(r * r - h * h), K = [H[0] - e, H[1]], N = [H[0] + e, H[1]], q = e * 1.2, J = kesC(K, q, N, q).reduce((a, b) => a[1] > b[1] ? a : b);
            s += nok(K, "K", 250, PG) + nok(N, "N", 290, PG) + cem(K, q) + cem(N, q) + nok(J, "", 0, PG) + dp(A, H, "#c92a2a", 3) + `<rect x="${H[0]}" y="${H[1] - 10}" width="10" height="10" fill="none" stroke="#1d2433"/>`; ok = true; }
          return svg(440, 340, `<defs><clipPath id="c8h"><rect width="440" height="340"/></clipPath></defs><g clip-path="url(#c8h)">${s}${nok(A, "A", 120)}${tx(30, 250, "B")}${tx(410, 250, "C")}</g>`, "Havuz") + kutu(ok ? "Çember BC'yi iki noktada kesti; A'dan BC'ye dik (en kısa yol) inşa edildi." : "Çember BC'ye ulaşmadı; yarıçap A'nın BC'ye uzaklığından büyük olmalı."); },
        kosullar: [{ ad: "Çember BC'yi iki noktada kesiyor.", f: v => v[0] * 20 > h }],
        sutun: ["Yarıçap", "Sonuç"], satir: (v, ok) => [v[0], ok ? "yükseklik inşa edildi" : "kesmedi"] }); },

    /* 9 · Kartpostal: B ve C merkezli çemberlerin yarıçapı */
    9: el => { const k = 30, B = [240 - 3.5 * k, 230], C = [240 + 3.5 * k, 230];
      return KO(el, { yon: "B ve C merkezli eş çemberlerin yarıçapını (cm) − / + ile seçiniz. Çemberlerin d üzerindeki kesişim noktası A alınır; üçgenin kenarları ölçülür.", bitis: "Eşkenar üçgeni veren yarıçapı bulduğunuzda.",
        girdi: [{ ad: "Yarıçap (cm)", min: 4, max: 9, bas: 5 }],
        ciz: v => { const r = v[0] * k, I = kesC(B, r, C, r); const A = I.length ? I.reduce((a, b) => a[1] < b[1] ? a : b) : null;
          let s = `<rect x="20" y="10" width="440" height="250" fill="#fff" stroke="#495057"/>` + dp([240, 10], [240, 260], PG, 2, "8 6") + tx(250, 30, "d", { an: "start" }) + cem(B, r) + cem(C, r) + nok(B, "B", 250) + nok(C, "C", 290);
          if (A) s += pol([A, B, C], "#ffd8a888", "#e8590c") + nok(A, "A", 120);
          return svg(480, 270, `<defs><clipPath id="c9k"><rect x="20" y="10" width="440" height="250"/></clipPath></defs><g clip-path="url(#c9k)">${s}</g>`, "Kartpostal") + kutu(`|BC| = 7 cm · |AB| = |AC| = ${v[0]} cm · ${v[0] === 7 ? "eşkenar üçgen" : "eşkenar değil"}`); },
        kosullar: [{ ad: "ABC eşkenar üçgen ve d, BC'nin kenar orta dikmesi.", f: v => v[0] === 7 }],
        sutun: ["Yarıçap", "Üçgen"], satir: (v, ok) => [v[0] + " cm", ok ? "eşkenar" : "ikizkenar"] }); },

    /* 10 · Eski çizim: izlerden eleman */
    10: el => { const A = [120, 40], B = [40, 220], C = [360, 220], P = { A, B, C };
      const T = { "1. çizim": "kenarortay", "2. çizim": "yükseklik", "3. çizim": "açıortay" };
      const iz = n => { let s = "";
        if (n === "1. çizim") { const I = kesC(B, 190, C, 190); s += cem(B, 190) + cem(C, 190) + dogru(I[0], I[1], 0, "#adb5bd", 1.4) + dp(A, orta(B, C), "#1d2433", 3); }
        else if (n === "2. çizim") { const H = ayak(A, B, C)[0], h = uz(A, H), r = h * 1.25, e = Math.sqrt(r * r - h * h), K = [H[0] - e, H[1]], N = [H[0] + e, H[1]]; s += cem(A, r) + cem(K, e * 1.2) + cem(N, e * 1.2) + dp(A, H, "#1d2433", 3); }
        else { const r1 = 70, K = ek(A, [(B[0] - A[0]) / uz(A, B) * r1, (B[1] - A[1]) / uz(A, B) * r1]), L = ek(A, [(C[0] - A[0]) / uz(A, C) * r1, (C[1] - A[1]) / uz(A, C) * r1]); const b = uz(A, C), c = uz(A, B), Dd = [B[0] + (C[0] - B[0]) * c / (b + c), B[1] + (C[1] - B[1]) * c / (b + c)]; s += cem(A, r1) + cem(K, 60) + cem(L, 60) + dp(A, Dd, "#1d2433", 3); }
        return s; };
      return KO(el, { yon: "Bir çizim ve o çizim için bir ad seçiniz. Pergel izleri yeniden çizilir; çemberlerin merkezlerine bakarak adın uyup uymadığı denetlenir.", bitis: "Üç çizimin adını da bulduğunuzda.",
        girdi: [{ ad: "Çizim:", sec: Object.keys(T), bas: "1. çizim" }, { ad: "Ad:", sec: ["kenarortay", "yükseklik", "açıortay"], bas: "yükseklik" }],
        ciz: v => svg(400, 260, `<defs><clipPath id="c10"><rect width="400" height="260"/></clipPath></defs><g clip-path="url(#c10)">${pol([A, B, C], "#fffdf5")}${iz(v[0])}${adlar(P)}</g>`, "Eski çizim")
          + kutu(v[0] === "1. çizim" ? "İlk çemberlerin merkezleri: B ve C" : v[0] === "2. çizim" ? "İlk çemberin merkezi A; çember BC'yi kesiyor" : "İlk çemberin merkezi A; çember AB ve AC'yi kesiyor"),
        kosullar: [{ ad: v => `${v[0]} için “${v[1]}” adı doğru.`, f: v => T[v[0]] === v[1] }],
        sutun: ["Çizim", "Ad", "Uygun mu?"], satir: (v, ok) => [v[0], v[1], ok ? "Evet" : "Hayır"] }); },

    /* 11 · Katlama kontrolü: M'nin yeri (mm) */
    11: el => { const k = 45, B = [40, 200], C = [40 + 8 * k, 200], A = [150, 50], kat = 40 + 4 * k;
      return KO(el, { yon: "M noktasının B'ye uzaklığını milimetre olarak − / + ile değiştiriniz. Kat izi (mor) BC'nin orta dikmesidir ve yerinde kalır.", bitis: "Kat izinin M'den geçtiği yeri bulduğunuzda.",
        girdi: [{ ad: "|BM| (mm)", min: 34, max: 46, bas: 36 }],
        ciz: v => { const x = 40 + v[0] / 10 * k, M = [x, 200];
          return svg(440, 240, pol([A, B, C], "#fff0f6", "#c2255c") + dp([kat, 20], [kat, 230], PG, 2, "8 6") + dp(A, M, KO_, 2.6) + nok(M, "M", 250) + tx(A[0], A[1] - 12, "A") + tx(28, 205, "B") + tx(C[0] + 12, 205, "C"), "Katlanan kâğıt")
            + kutu(`|BM| = ${D(v[0] / 10)} cm · |MC| = ${D(8 - v[0] / 10)} cm · ${v[0] === 40 ? "kat izi M'den geçiyor" : `M, kat izinden ${D(Math.abs(v[0] - 40) / 10)} cm uzakta`}`); },
        kosullar: [{ ad: "Kat izi M'den geçiyor; M orta nokta.", f: v => v[0] === 40 }],
        sutun: ["|BM|", "|MC|", "Orta nokta mı?"], satir: (v, ok) => [D(v[0] / 10) + " cm", D(8 - v[0] / 10) + " cm", ok ? "Evet" : "Hayır"] }); },

    /* 12 · Tepsi: açıklık seçimi ve çember sayısı */
    12: el => { const A = [180, 40], B = [50, 240], C = [380, 230], P = { A, B, C };
      return KO(el, { yon: "Açıklık yöntemini ve inşa edilecek kenarortay sayısını seçiniz. Çizilen çember sayısı ve bulunan nokta gösterilir.", bitis: "Ağırlık merkezini en az çemberle bulduğunuzda.",
        girdi: [{ ad: "Açıklık:", sec: ["Her kenar için ayrı", "Tek açıklık"], bas: "Her kenar için ayrı" }, { ad: "Kenarortay", min: 1, max: 3, bas: 1 }],
        ciz: v => { const tek = v[0] === "Tek açıklık", n = v[1], kenar = [["B", "C", "A"], ["A", "C", "B"], ["A", "B", "C"]].slice(0, n), merk = new Set(); let s = pol([A, B, C], "#f8f9fa", "#495057"), say = 0;
          kenar.forEach(([p, q, z], i) => { const r = tek ? 200 : uz(P[p], P[q]) * .62 + i * 4; if (tek) { if (!merk.has(p)) { s += cem(P[p], r); merk.add(p); say++; } if (!merk.has(q)) { s += cem(P[q], r); merk.add(q); say++; } } else { s += cem(P[p], r) + cem(P[q], r); say += 2; } s += dp(P[z], orta(P[p], P[q]), KO_, 2.6); });
          if (n >= 2) s += nok(agirlik(A, B, C), "G", 30, "#e8590c", 6);
          return svg(430, 280, `<defs><clipPath id="c12"><rect width="430" height="280"/></clipPath></defs><g clip-path="url(#c12)">${s}${adlar(P)}</g>`, "Tepsi") + kutu(`Çember: ${say} · kenarortay: ${n} · ${n >= 2 ? "ağırlık merkezi bulundu" : "tek kenarortay nokta vermez"}`); },
        kosullar: [{ ad: "Ağırlık merkezi bulundu.", f: v => v[1] >= 2 }, { ad: "En az çember (3) kullanıldı.", f: v => v[0] === "Tek açıklık" && v[1] === 2 }],
        sutun: ["Açıklık", "Kenarortay", "Çember"], satir: v => [v[0], v[1], v[0] === "Tek açıklık" ? (v[1] === 1 ? 2 : 3) : 2 * v[1]] }); },

    /* 13 · Eşkenar mi? Kısa yol hangi kenarda? (|BA| = |BC|) */
    13: el => { const A = [80, 260], B = [300, 260], C = ek(B, yon(105, 220)), P = { A, B, C };
      const K = { AB: ["A", "B", "C"], BC: ["B", "C", "A"], AC: ["A", "C", "B"] };
      return KO(el, { yon: "Kısa yolun deneneceği kenarı seçiniz. Kenarın uçlarına eş çemberler çizilir; karşı köşe yalnız bir kesişim noktasıyla birleştirilir ve kenarı kestiği nokta işaretlenir.", bitis: "Kısa yolun doğru sonuç verdiği kenarı bulduğunuzda.",
        girdi: [{ ad: "Kenar:", sec: Object.keys(K), bas: "AB" }],
        ciz: v => { const [p, q, z] = K[v[0]], r = uz(P[p], P[q]) * .75, I = kesC(P[p], r, P[q], r), Q = I.reduce((a, b) => uz(a, P[z]) > uz(b, P[z]) ? a : b), N = kesD(P[z], Q, P[p], P[q]), M = orta(P[p], P[q]);
          const s = pol([A, B, C]) + cem(P[p], r) + cem(P[q], r) + dp(P[z], Q, "#c92a2a", 2.4) + nok(Q, "", 0, PG) + nok(N, "", 0, "#c92a2a") + nok(M, "", 0, "#2b8a3e", 4) + adlar(P);
          return svg(420, 300, `<defs><clipPath id="c13"><rect width="420" height="300"/></clipPath></defs><g clip-path="url(#c13)">${s}</g>`, "Tasarımcının çizimi") + kutu(`Kırmızı nokta ile orta nokta (yeşil) arası: ${D(uz(N, M) / 20)} birim`); },
        kosullar: [{ ad: "Kısa yol kenarın orta noktasını verdi.", f: v => v[0] === "AC" }],
        sutun: ["Kenar", "Sonuç"], satir: (v, ok) => [v[0], ok ? "orta nokta" : "orta nokta değil"] }); },

    /* 14 · Meydan: yolun ucu ve iki bölümün çevre uzunlukları */
    14: el => { const k = 4, a = 72, b = 58, c = 46, x = (c * c - b * b + a * a) / (2 * a), y = Math.sqrt(c * c - x * x);
      const B = [30, 230], C = [30 + a * k, 230], A = [30 + x * k, 230 - y * k];
      return KO(el, { yon: "Yolun BC'ye ulaştığı noktanın B'ye uzaklığını (m) − / + ile değiştiriniz (|BC| = 72 m). İki bölümün çevre uzunlukları ve farkı hesaplanır.", bitis: "Yolun BC'nin tam ortasına ulaştığı durumu inceleyince.",
        girdi: [{ ad: "B'ye uzaklık (m)", min: 30, max: 42, bas: 32 }],
        ciz: v => { const Pn = [30 + v[0] * k, 230], yol = uz(A, Pn) / k, c1 = c + v[0] + yol, c2 = b + (a - v[0]) + yol;
          return svg(360, 270, pol([A, B, Pn], "#e9ecef") + pol([A, Pn, C], "#dbe4ff") + dp(A, Pn, "#c92a2a", 3) + tx(A[0], A[1] - 10, "A") + tx(18, 248, "B") + tx(C[0] + 10, 248, "C") + nok(Pn, "", 0, "#c92a2a"), "Meydan")
            + kutu(`1. bölüm: ${D(c1)} m · 2. bölüm: ${D(c2)} m · fark: ${D(Math.abs(c2 - c1))} m`); },
        kosullar: [{ ad: "Yol BC'nin tam ortasına ulaşıyor.", f: v => v[0] === 36 }],
        sutun: ["B'ye uzaklık", "Fark"], satir: v => { const Pn = [30 + v[0] * k, 230], yol = uz(A, Pn) / k; return [v[0] + " m", D(Math.abs((b + a - v[0] + yol) - (c + v[0] + yol))) + " m"]; } }); },

    /* 15 · Tuval: G ve öbür noktalar */
    15: el => { const A = [150, 40], B = [40, 240], C = [400, 210], P = { A, B, C }, G = agirlik(A, B, C);
      const icM = (() => { const a = uz(B, C), b = uz(A, C), c = uz(A, B), s = a + b + c; return [(a * A[0] + b * B[0] + c * C[0]) / s, (a * A[1] + b * B[1] + c * C[1]) / s]; })();
      const disM = (() => { const M1 = orta(A, B), M2 = orta(B, C); return kesD(M1, [M1[0] - (B[1] - A[1]), M1[1] + (B[0] - A[0])], M2, [M2[0] - (C[1] - B[1]), M2[1] + (C[0] - B[0])]); })();
      const N = { "Ağırlık merkezi (G)": G, "Açıortayların kesişim noktası": icM, "Kenar orta dikmelerin kesişim noktası": disM };
      return KO(el, { yon: "Bir nokta seçiniz; noktanın üç köşeye ve üç kenara uzaklıkları ölçülür (birim).", bitis: "Üç noktayı da karşılaştırdığınızda.",
        girdi: [{ ad: "Nokta:", sec: Object.keys(N), bas: "Ağırlık merkezi (G)" }],
        ciz: v => { const X = N[v[0]], ko = [uz(X, A), uz(X, B), uz(X, C)].map(t => t / 20), ke = [uzD(X, B, C), uzD(X, A, C), uzD(X, A, B)].map(t => t / 20);
          return svg(440, 300, `<defs><clipPath id="c15"><rect width="440" height="300"/></clipPath></defs><g clip-path="url(#c15)">${pol([A, B, C], "#ffd8a8", "#e8590c")}${nok(X, "", 0, "#1d2433", 6)}${adlar(P)}</g>`, "Tuval")
            + kutu(`Köşelere: ${ko.map(t => D(t)).join(" · ")}<br>Kenarlara: ${ke.map(t => D(t)).join(" · ")}`); },
        kosullar: [{ ad: "Seçilen nokta üç köşeye eşit uzaklıkta.", f: v => v[0].startsWith("Kenar orta") }, { ad: "Seçilen nokta üç kenara eşit uzaklıkta.", f: v => v[0].startsWith("Açıortay") }],
        iyi: () => true, sutun: ["Nokta", "Eşit uzaklık"], satir: v => [v[0], v[0].startsWith("Kenar orta") ? "köşelere" : v[0].startsWith("Açıortay") ? "kenarlara" : "yok"] }); },

    /* 16 · Afiş: üç öğrencinin üçgeni */
    16: el => { const A = [200, 40], L = [200, 170];
      const T = { Ali: 0, Beren: -30, Cem: -14 };
      return KO(el, { yon: "Bir öğrenci seçiniz; o öğrencinin yöntemiyle üçgen inşa edilir. Kenar uzunlukları ve B'deki açı ölçülür.", bitis: "Üç öğrencinin üçgenini de incelediğinizde.",
        girdi: [{ ad: "Öğrenci:", sec: Object.keys(T), bas: "Cem" }],
        ciz: v => { const d = yon(T[v[0]], 1); let B;
          if (v[0] === "Beren") B = ayak(A, ek(L, d, -200), ek(L, d, 200))[0]; else B = ek(L, d, -100);
          if (v[0] === "Cem") B = ek(L, d, -120);
          const C = [2 * L[0] - B[0], 2 * L[1] - B[1]], ab = uz(A, B) / 20, ac = uz(A, C) / 20, bc = uz(B, C) / 20;
          const u = [A[0] - B[0], A[1] - B[1]], w = [C[0] - B[0], C[1] - B[1]], aB = Math.acos((u[0] * w[0] + u[1] * w[1]) / Math.hypot(...u) / Math.hypot(...w)) * 180 / Math.PI;
          return svg(420, 270, `<defs><clipPath id="c16"><rect width="420" height="270"/></clipPath></defs><g clip-path="url(#c16)">${dogru(ek(L, d, -150), ek(L, d, 150), 0, "#868e96", 1.4, "5 4")}${pol([A, B, C], "#fff4e6", "#e8590c")}${dp(A, L, KO_, 3)}${nok(A, "A", 90)}${nok(L, "L", 30)}${nok(B, "B", 210)}${nok(C, "C", -30)}</g>`, "Afiş")
            + kutu(`|AB| = ${D(ab)} · |AC| = ${D(ac)} · |BC| = ${D(bc)} · m(B) = ${D(aB, 0)}°`); },
        kosullar: [{ ad: "Üçgen ikizkenar (|AB| = |AC|).", f: v => v[0] === "Ali" }, { ad: "B açısı dik açı.", f: v => v[0] === "Beren" }],
        iyi: () => true, sutun: ["Öğrenci", "Üçgen"], satir: v => [v[0], v[0] === "Ali" ? "ikizkenar" : v[0] === "Beren" ? "B açısı dik" : "çeşitkenar"] }); },
  };
})();

 stroke-width=\"1.5\"/><text x=\"525.0\" y=\"202.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">TAHTA PERGELİ</text><text x=\"525.0\" y=\"230.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">En fazla 40 cm açılır.</text></svg>", "son": "", "k": "Buna göre, öğretmen bu pergelle hangi kenara ait kenarortayı inşa edebilir?", "sec": ["Yalnız AB kenarına ait kenarortayı", "AB ve AC kenarlarına ait kenarortayları", "Yalnız BC kenarına ait kenarortayı", "Üç kenarortayı da"], "secg": null, "c": "A", "a": ["Bir kenarın orta dikmesi için eş çemberlerin yarıçapı o kenarın yarısından büyük olmalıdır.", "Kenarların yarıları 35 cm, 42,5 cm ve 48 cm'dir. Pergel en fazla 40 cm açıldığı için yalnız 70 cm'lik AB kenarının yarısını aşabilir."], "t": "AC ve BC kenarlarında çemberler kesişmez.", "d": "Eş çemberlerin kesişmesi için yarıçap kenarın yarısından büyük olmalıdır. Pergelin en büyük açıklığını her kenarın yarısıyla ayrı ayrı karşılaştırın.", "ses": "b01"}, {"no": 2, "on": "<p>Bir seramik ustası, kare bir karonun üzerindeki çeşitkenar ABC üçgeni motifinde BC kenarına ait kenarortayı pergel ve ölçüsüz cetvelle çizecektir. Usta yaptığı adımları nota yazmıştır.</p>", "g": "<svg viewBox=\"0 0 680 290\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8.0\" y=\"8.0\" width=\"664.0\" height=\"274.0\" rx=\"10\" fill=\"#f1f3f5\" stroke=\"#dee2e6\" stroke-width=\"1.2\"/><rect x=\"36.0\" y=\"30.0\" width=\"290.0\" height=\"236.0\" rx=\"4\" fill=\"#fff9db\" stroke=\"#c9a227\" stroke-width=\"3\"/><polygon points=\"150.0,60.0 60.0,232.0 300.0,232.0\" fill=\"#d0ebff\" stroke=\"#1c5fbf\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/><text x=\"146.9\" y=\"48.3\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><text x=\"44.0\" y=\"246.3\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><text x=\"316.5\" y=\"245.3\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><rect x=\"350.0\" y=\"22.0\" width=\"310.0\" height=\"170.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"350.0\" y=\"22.0\" width=\"310.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"505.0\" y=\"44.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">USTANIN NOTU</text><text x=\"505.0\" y=\"75.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">1. B ve C merkezli eş çemberler çizdim.</text><text x=\"505.0\" y=\"101.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">2. Kesişim noktalarından birini P</text><text x=\"505.0\" y=\"127.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">ile işaretledim.</text><text x=\"505.0\" y=\"153.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">3. A ile P'yi birleştirip BC'ye uzattım.</text><text x=\"505.0\" y=\"179.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">4. BC'yi kestiği noktaya M dedim.</text></svg>", "son": "", "k": "Buna göre, ustanın <u>ilk</u> hatası hangi adımdadır?", "sec": ["1. adım", "2. adım", "3. adım", "4. adım"], "secg": null, "c": "C", "a": ["1. ve 2. adım doğrudur; P, B ve C'ye eşit uzaklıktadır ve BC'nin orta dikmesi üzerindedir.", "Üçgen çeşitkenar olduğu için A orta dikme üzerinde değildir; A ile P'yi birleştiren doğru orta dikme olmaz ve BC'yi ortalamaz. İlk hata 3. adımdadır.", "Usta iki kesişim noktasını birleştirip M'yi bulmalı, sonra A ile M'yi birleştirmeliydi."], "t": "", "d": "Kesişim noktaları BC'nin orta dikmesi üzerindedir ama A çeşitkenar üçgende bu doğrunun üzerinde değildir. Önce iki kesişim noktasını birleştirip M'yi bulun, sonra A ile M'yi birleştirin.", "ses": "b02"}, {"no": 3, "on": "<p>Bir parktaki kum havuzu |AB| = |AC| olan ABC üçgeni biçimindedir. İşçi, tabana ait kenarortay boyunca bir bölme tahtası koyacaktır. B ve C merkezli eş yaylar çizip tabanın A ile aynı tarafındaki tek kesişim noktası P'yi A ile birleştirecek ve bu doğruyu BC'ye kadar uzatacaktır.</p>", "g": "<svg viewBox=\"0 0 680 290\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8.0\" y=\"8.0\" width=\"664.0\" height=\"274.0\" rx=\"10\" fill=\"#ebfbee\" stroke=\"#b2f2bb\" stroke-width=\"1.2\"/><polygon points=\"192.0,32.0 90.0,236.0 294.0,236.0\" fill=\"#ffe8a3\" stroke=\"#c9a227\" stroke-width=\"8\" stroke-linejoin=\"round\"/><text x=\"192.0\" y=\"16.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><text x=\"71.7\" y=\"254.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><text x=\"312.3\" y=\"254.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><rect x=\"380.0\" y=\"50.0\" width=\"280.0\" height=\"118.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"380.0\" y=\"50.0\" width=\"280.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"520.0\" y=\"72.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">KUM HAVUZU (plan)</text><text x=\"520.0\" y=\"103.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">|AB| = |AC|</text><text x=\"520.0\" y=\"129.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Tabana ait kenarortay boyunca</text><text x=\"520.0\" y=\"155.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">bölme tahtası konacak.</text></svg>", "son": "", "k": "Buna göre, işçinin yöntemi için aşağıdakilerden hangisi doğrudur?", "sec": ["Yöntem doğrudur; A ve P, BC'nin orta dikmesi üzerindedir.", "Yöntem yanlıştır; iki kesişim noktası birleştirilmelidir.", "Yöntem yalnız havuz eşkenar olsaydı doğru olurdu.", "Yöntem doğrudur; çünkü P, BC'nin orta noktasıdır."], "secg": null, "c": "A", "a": ["|AB| = |AC| olduğundan A, B ve C'ye eşit uzaklıktadır; BC'nin orta dikmesi üzerindedir.", "P de B ve C'ye eşit uzaklıktadır. A ile P orta dikmeyi belirler; bu doğru BC'yi orta noktasında keser ve tabana ait kenarortayı verir."], "t": "P, BC'nin üzerinde değildir; kısa yol ikizkenar üçgenin tabanı için yeterlidir.", "d": "Tek kesişim noktası kısa yolu, köşe kenarın iki ucuna eşit uzaklıktaysa çalışır. İkizkenar üçgende tabana ait kenarortay için bu koşul vardır.", "ses": "b03"}, {"no": 4, "on": "<p>Bir vitray ustası, eşkenar üçgen biçimli bir camı kâğıda B ve C merkezli, yarıçapı |BC| olan iki çemberle çizmiştir; izler kâğıtta durmaktadır. Usta şimdi aynı açıklığı değiştirmeden camın üç kenarortayını ve ağırlık merkezini inşa edecektir.</p>", "g": "<svg viewBox=\"0 0 680 290\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><defs><clipPath id=\"vit\"><rect x=\"8\" y=\"8\" width=\"664\" height=\"274\" rx=\"10\"/></clipPath></defs><g clip-path=\"url(#vit)\"><rect x=\"8.0\" y=\"8.0\" width=\"664.0\" height=\"274.0\" rx=\"10\" fill=\"#f8f0fc\" stroke=\"#e599f7\" stroke-width=\"1.2\"/><polygon points=\"165.0,81.5 70.0,246.0 260.0,246.0\" fill=\"#d0ebff\" stroke=\"#5c3d1e\" stroke-width=\"6\" stroke-linejoin=\"round\"/><circle cx=\"70.0\" cy=\"246.0\" r=\"190.0\" fill=\"none\" stroke=\"#7048e8\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"/><circle cx=\"260.0\" cy=\"246.0\" r=\"190.0\" fill=\"none\" stroke=\"#7048e8\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"/><text x=\"165.0\" y=\"69.5\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><text x=\"56.0\" y=\"266.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><text x=\"274.0\" y=\"266.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><rect x=\"440.0\" y=\"50.0\" width=\"220.0\" height=\"118.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"440.0\" y=\"50.0\" width=\"220.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"550.0\" y=\"72.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">VİTRAY ÇİZİMİ</text><text x=\"550.0\" y=\"103.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Eşkenar üçgen cam</text><text x=\"550.0\" y=\"129.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">B ve C merkezli çemberlerle</text><text x=\"550.0\" y=\"155.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">çizildi (izler kâğıtta).</text></g></svg>", "son": "", "k": "Buna göre, ustanın <u>en az</u> kaç yeni çember çizmesi gerekir?", "sec": ["0", "1", "2", "3"], "secg": null, "c": "B", "a": ["Hazır iki çember A'da ve BC'nin öbür yanında kesişir; ikinci kesişim noktası A ile birleştirilince BC'ye ait kenarortay bulunur.", "A merkezli, aynı yarıçaplı bir çember daha çizilirse A ile B ve A ile C merkezli çember çiftleri de üçgenin dışında birer noktada kesişir; bu noktalar karşı köşelere birleştirilince öbür iki kenarortay bulunur."], "t": "Yalnız bir yeni çember yeter; 0: iki çemberle yalnız bir kenarortay bulunur.", "d": "Eşkenar üçgeni çizen iki çember zaten bir kenarortayı verir. Aynı yarıçapla tek bir çember daha çizmek öbür iki kenarortay için yeterlidir.", "ses": "b04"}, {"no": 5, "on": "<p>Üçgen biçimli bir sahne platformu, tek bir dikme üzerinde ağırlık merkezinden taşınacaktır. Usta, ağırlık merkezini yerdeki plan üzerinde bir çubuk pergel ve işaretsiz bir çıtayla inşa edecektir. Pergel en fazla 3 m açılabilmektedir.</p>", "g": "<svg viewBox=\"0 0 680 290\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8.0\" y=\"8.0\" width=\"664.0\" height=\"274.0\" rx=\"10\" fill=\"#fff4e6\" stroke=\"#ffd8a8\" stroke-width=\"1.2\"/><polygon points=\"157.1,50.0 60.0,145.2 298.0,145.2\" fill=\"#e9b97a\" stroke=\"#8a5a2b\" stroke-width=\"3\" stroke-linejoin=\"round\"/><text x=\"153.1\" y=\"38.5\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><text x=\"42.7\" y=\"156.1\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><text x=\"315.5\" y=\"155.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><text x=\"182.6\" y=\"165.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">7 m</text><text x=\"243.0\" y=\"98.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">5 m</text><text x=\"93.1\" y=\"98.7\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">4 m</text><path d=\"M430 230 L470 120 L510 230\" fill=\"none\" stroke=\"#495057\" stroke-width=\"5\"/><circle cx=\"470.0\" cy=\"118.0\" r=\"8.0\" fill=\"#adb5bd\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"470.0\" y=\"262.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">çubuk pergel</text><rect x=\"530.0\" y=\"60.0\" width=\"136.0\" height=\"92.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"530.0\" y=\"60.0\" width=\"136.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"598.0\" y=\"82.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">PERGEL</text><text x=\"598.0\" y=\"113.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">En fazla</text><text x=\"598.0\" y=\"139.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">3 m açılır.</text></svg>", "son": "", "k": "Buna göre, aşağıdakilerden hangisi doğrudur?", "sec": ["Ağırlık merkezi bu pergelle bulunamaz; 7 m'lik kenarın orta dikmesi inşa edilemez.", "Ağırlık merkezi bulunabilir; yalnız 7 m'lik kenara ait kenarortay yeter.", "Ağırlık merkezi bulunabilir; üç kenarortay da inşa edilebilir.", "Ağırlık merkezi bulunabilir; 4 m ve 5 m'lik kenarlara ait kenarortaylar yeter."], "secg": null, "c": "D", "a": ["Kenarların yarıları 2 m, 2,5 m ve 3,5 m'dir; 3 m'lik açıklık yalnız 4 m ve 5 m'lik kenarlar için yarıdan büyüktür.", "Ağırlık merkezi için iki kenarortay yeter; bu iki kenara ait kenarortaylar inşa edilip kesiştirilir."], "t": "7 m'lik kenarın kenarortayı gerekmez; tek kenarortay nokta belirtmez.", "d": "Ağırlık merkezi için iki kenarortay yeter; kenarortayı inşa edilecek kenarları pergelin açıklığına göre seçebilirsiniz. Açıklık seçilen kenarların yarısından büyük olmalıdır.", "ses": "b05"}, {"no": 6, "on": "<p>Bir mimar, üçgen biçimli bir süs havuzunu planlamaktadır. Havuzun ortasından geçecek AL köprüsü, havuzun BC kenarına ait kenarortayı olacaktır. Mimar B köşesini L'den geçen kesik çizgi üzerine yerleştirmiştir.</p>", "g": "<svg viewBox=\"0 0 680 290\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8.0\" y=\"8.0\" width=\"664.0\" height=\"274.0\" rx=\"10\" fill=\"#e7f5ff\" stroke=\"#a5d8ff\" stroke-width=\"1.2\"/><rect x=\"40.0\" y=\"150.0\" width=\"380.0\" height=\"100.0\" rx=\"30\" fill=\"#74c0fc\" stroke=\"#4dabf7\" stroke-width=\"1\"/><line x1=\"35.6\" y1=\"150.0\" x2=\"404.4\" y2=\"242.0\" stroke=\"#495057\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><line x1=\"200.0\" y1=\"40.0\" x2=\"220.0\" y2=\"196.0\" stroke=\"#8a5a2b\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"200.0\" cy=\"40.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"200.0\" y=\"27.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"220.0\" cy=\"196.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"229.0\" y=\"185.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">L</text><circle cx=\"74.5\" cy=\"159.7\" r=\"3.3\" fill=\"#111111\"/><text x=\"68.3\" y=\"182.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><rect x=\"450.0\" y=\"40.0\" width=\"210.0\" height=\"144.0\" rx=\"7\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.5\"/><rect x=\"450.0\" y=\"40.0\" width=\"210.0\" height=\"32.0\" rx=\"7\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.5\"/><text x=\"555.0\" y=\"62.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">HAVUZ PLANI</text><text x=\"555.0\" y=\"93.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">AL: kenarortay (köprü)</text><text x=\"555.0\" y=\"119.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">B yerleştirildi:</text><text x=\"555.0\" y=\"145.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">|LB| = 6 m</text><text x=\"555.0\" y=\"171.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">C yerleştirilecek</text></svg>", "son": "<p>C köşesi de aynı kesik çizgi üzerine pergel ve ölçüsüz cetvelle yerleştirilecektir.</p>", "k": "Buna göre, C köşesinin yeri ve havuzun BC kenarının uzunluğu aşağıdakilerden hangisidir?", "sec": ["L'nin öbür yanında, L'ye 6 m uzaklıkta · 12 m", "L'nin B ile aynı yanında, L'ye 6 m uzaklıkta · 12 m", "L'nin öbür yanında, L'ye 3 m uzaklıkta · 9 m", "L'nin öbür yanında, A'ya 6 m uzaklıkta · 12 m"], "secg": null, "c": "A", "a": ["AL kenarortay olacağına göre L, BC'nin orta noktasıdır: |LC| = |LB| = 6 m.", "Pergel |LB| açıklığıyla L merkezli çember çizilir; çemberin kesik çizgiyi L'nin öbür yanında kestiği nokta C'dir. |BC| = 12 m."], "t": "B ile aynı yandaki nokta B'nin kendisidir; 3 m: |LB| yarıya bölünmüş.", "d": "AL kenarortaysa L, BC'nin orta noktasıdır: C, L'nin öbür yanında, L'ye |LB| kadar uzaktadır. B ile aynı yandaki kesişim noktası B'nin kendisidir.", "ses": "b06"}, {"no": 7, "on": "<p>Üçgen biçimli bir tente kurulacaktır. Planda AL direği, tentenin BC kenarına ait kenarortayı olacaktır. Usta, zemin çizgisini L noktasında AL'ye dik olarak inşa etmiş ve B'yi işaretlemiştir.</p>", "g": "<svg viewBox=\"0 0 680 290\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8.0\" y=\"8.0\" width=\"664.0\" height=\"274.0\" rx=\"10\" fill=\"#fff9db\" stroke=\"#
