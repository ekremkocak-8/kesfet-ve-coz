lmiştir.", "Bu, AC kenarına ait kenarortaydır."], "c": "AC'ye ait kenarortay"}, {"k": "Ece BC'ye ait kenarortay için orta dikmeyi doğru inşa etmiş, BC'yi kestiği M noktasını B köşesiyle birleştirmiştir. Ece'nin çizdiği nedir? Hatası nasıl düzeltilir?", "a": ["B ile M zaten BC kenarı üzerindedir; çizilen yalnız BC'nin bir parçasıdır.", "Kenarortay, karşı kenarın orta noktasını karşı köşeye birleştirir.", "M, A köşesiyle birleştirilmelidir."], "c": "BC'nin yarısı · M, A ile birleştirilmeli"}]}], "k": [{"no": 1, "bas": "Pergel açıklığı uygun mu?", "yon": "BC'ye ait kenarortay inşa edilecektir. Verilen açıklığın kullanılıp kullanılamayacağını “Uygun” ya da “Uygun değil” olarak yazınız.", "r": [{"n": "<span class=\"kk752-no\">1</span>|BC| = 9 cm, açıklık 5 cm", "c": "Uygun"}, {"n": "<span class=\"kk752-no\">2</span>|BC| = 12 cm, açıklık 6 cm", "c": "Uygun değil"}, {"n": "<span class=\"kk752-no\">3</span>|BC| = 7 cm, açıklık 3 cm", "c": "Uygun değil"}, {"n": "<span class=\"kk752-no\">4</span>|BC| = 13 cm, açıklık 7 cm", "c": "Uygun"}, {"n": "<span class=\"kk752-no\">5</span>|BC| = 15 cm, açıklık 8 cm", "c": "Uygun"}, {"n": "<span class=\"kk752-no\">6</span>|BC| = 10 cm, açıklık 4,5 cm", "c": "Uygun değil"}]}, {"no": 2, "bas": "İkizkenar üçgende tabana ait kenarortay", "yon": "|AB| = |AC| olan üçgende tepe açısı verilmiştir. BC'ye ait kenarortayın A açısını ayırdığı açıyı ve taban açısını yazınız.", "r": [{"n": "<span class=\"kk752-no\">1</span>m(A) = 38°", "c": "19° · 71°"}, {"n": "<span class=\"kk752-no\">2</span>m(A) = 64°", "c": "32° · 58°"}, {"n": "<span class=\"kk752-no\">3</span>m(A) = 102°", "c": "51° · 39°"}, {"n": "<span class=\"kk752-no\">4</span>m(A) = 46°", "c": "23° · 67°"}, {"n": "<span class=\"kk752-no\">5</span>m(A) = 88°", "c": "44° · 46°"}, {"n": "<span class=\"kk752-no\">6</span>m(A) = 130°", "c": "65° · 25°"}]}, {"no": 3, "bas": "Kenarortayı verilen ikizkenar üçgen", "yon": "AL kenarortaydır; B, L'den AL'ye inşa edilen dik doğru üzerinde seçilmiş, C, L merkezli |LB| yarıçaplı çemberle bulunmuştur. |BC| uzunluğunu ve üçgenin çevresini yazınız.", "r": [{"n": "<span class=\"kk752-no\">1</span>|LB| = 3 cm, |AB| = 5 cm", "c": "6 cm · 16 cm"}, {"n": "<span class=\"kk752-no\">2</span>|LB| = 4 cm, |AB| = 7 cm", "c": "8 cm · 22 cm"}, {"n": "<span class=\"kk752-no\">3</span>|LB| = 6 cm, |AB| = 9 cm", "c": "12 cm · 30 cm"}, {"n": "<span class=\"kk752-no\">4</span>|LB| = 5 cm, |AB| = 8 cm", "c": "10 cm · 26 cm"}, {"n": "<span class=\"kk752-no\">5</span>|LB| = 7 cm, |AB| = 9 cm", "c": "14 cm · 32 cm"}, {"n": "<span class=\"kk752-no\">6</span>|LB| = 2 cm, |AB| = 6 cm", "c": "4 cm · 16 cm"}]}], "b": [{"no": 1, "on": "<p>Bir marangoz, üçgen biçimli bir raf tahtasının A köşesinden BC kenarının tam ortasına bir çizgi çizecektir. Elinde yalnız bir pergel ve üzerinde hiç sayı olmayan düz bir çıta vardır.</p>", "g": "<svg viewBox=\"0 0 420 240\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"80.0,40.0 40.0,210.0 380.0,210.0\" fill=\"#f3d9a4\" stroke=\"#111111\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><circle cx=\"80.0\" cy=\"40.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"70.3\" y=\"33.1\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"40.0\" cy=\"210.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"25.4\" y=\"222.3\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"380.0\" cy=\"210.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"395.5\" y=\"219.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><text x=\"210.0\" y=\"234.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#8a6d1d\" text-anchor=\"middle\">raf tahtası</text></svg>", "son": "", "k": "Buna göre, marangozun yapması gereken ilk iş aşağıdakilerden hangisidir?", "sec": ["A'dan BC'ye dik bir çizgi çizmek", "BC'yi çıtayla ölçüp ortasını işaretlemek", "B ve C merkezli, açıklığı BC'nin yarısından büyük eş yaylar çizmek", "A açısını iki eş açıya bölmek"], "secg": null, "c": "C", "a": ["A'dan BC'nin ortasına giden çizgi kenarortaydır; önce BC'nin orta noktası bulunmalıdır.", "Orta nokta, BC'nin orta dikmesi inşa edilerek bulunur; ilk iş B ve C merkezli eş yaylardır."], "t": "Dik çizgi ve açıyı bölmek çeşitkenar üçgende ortaya gitmez; ölçme inşa değildir ve çıta işaretsizdir", "d": "Kenarortayın bir ucu köşedir; öbür ucu karşı kenarın orta noktasıdır ve önce bu nokta inşa edilir. Çıtada işaret olmadığı için ölçerek bulamazsınız.", "ses": "b01"}, {"no": 2, "on": "<p>Bir bahçıvan, 14 m uzunluğundaki BC çit hattının orta noktasını iple bulacaktır. İpin bir ucunu önce B'ye, sonra C'ye sabitleyip öbür ucuyla yerde yaylar çizecektir.</p>", "g": "<svg viewBox=\"0 0 420 210\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"60.0\" y1=\"170.0\" x2=\"360.0\" y2=\"170.0\" stroke=\"#2b8a3e\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle cx=\"60.0\" cy=\"170.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"45.0\" y=\"180.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"360.0\" cy=\"170.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"375.0\" y=\"180.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><rect x=\"184.0\" y=\"180\" width=\"52\" height=\"20\" fill=\"#fff\"/><text x=\"210.0\" y=\"195.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">14 m</text><line x1=\"60.0\" y1=\"170.0\" x2=\"130.0\" y2=\"90.0\" stroke=\"#8a6d1d\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><text x=\"100.0\" y=\"110.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#8a6d1d\" text-anchor=\"end\">ip</text></svg>", "son": "", "k": "Buna göre, aşağıdaki ip uzunluklarından hangisi <u>kullanılabilir</u>?", "sec": ["8 m", "7 m", "5 m", "6 m"], "secg": null, "c": "A", "a": ["Yayların iki noktada kesişmesi için ip, BC'nin yarısından uzun olmalıdır: 14 : 2 = 7 m.", "Yalnız 8 m, 7 m'den uzundur."], "t": "7 m: yaylar yalnız değer; 5 ve 6 m: yaylar kesişmez", "d": "Yaylar iki noktada kesişmelidir; ip, kenarın yarısından uzun olmalıdır. Tam yarısı olan ip yaylarını yalnız değdirir.", "ses": "b02"}, {"no": 3, "on": "<p>Üçgen biçimli bir cam tablanın ağırlık merkezi, yalnız pergel ve işaretsiz cetvel kullanılarak bulunacak ve tabla bu noktadan tek ayağa oturtulacaktır.</p>", "g": "<svg viewBox=\"0 0 400 240\" width=\"400\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"150.0,40.0 40.0,220.0 360.0,190.0\" fill=\"#d0ebff\" stroke=\"#111111\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><text x=\"200.0\" y=\"234.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#1c5fbf\" text-anchor=\"middle\">cam tabla</text></svg>", "son": "", "k": "Buna göre, <u>en az</u> kaç kenarortay inşa edilmelidir?", "sec": ["1", "2", "3", "4"], "secg": null, "c": "B", "a": ["Ağırlık merkezi kenarortayların kesişim noktasıdır.", "İki kenarortay bir noktada kesişir; üçüncüsü yalnız kontrol içindir."], "t": "1: tek çizgi nokta belirtmez; 3: kontrol de sayılmış", "d": "Ağırlık merkezi kenarortayların kesişim noktasıdır. İki doğru bir noktada kesişir; üçüncü kenarortay yalnız kontrol içindir.", "ses": "b03"}, {"no": 4, "on": "<p>Ela, üçgen biçimli bir kâğıtta BC kenarına ait kenarortay olarak AM'yi inşa etmiştir. İnşasını kontrol etmek için kâğıdı B köşesi C köşesinin üzerine gelecek şekilde katlayacaktır.</p>", "g": "<svg viewBox=\"0 0 370 240\" width=\"370\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"110.0,40.0 40.0,210.0 330.0,210.0\" fill=\"#ffe8cc\" stroke=\"#111111\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><circle cx=\"110.0\" cy=\"40.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"103.5\" y=\"31.1\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"40.0\" cy=\"210.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"25.5\" y=\"222.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"330.0\" cy=\"210.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"345.2\" y=\"220.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><line x1=\"110.0\" y1=\"40.0\" x2=\"185.0\" y2=\"210.0\" stroke=\"#1c5fbf\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"185.0\" cy=\"210.0\" r=\"3.3\" fill=\"#1c5fbf\"/><text x=\"185.0\" y=\"231.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">M</text></svg>", "son": "", "k": "Buna göre, inşa doğruysa kat izi için aşağıdakilerden hangisi gözlenir?", "sec": ["A köşesinden geçer.", "AM ile çakışır.", "B köşesinden geçer.", "M noktasından geçer."], "secg": null, "c": "D", "a": ["B'yi C'ye getiren kat izi BC'nin kenar orta dikmesidir ve BC'yi orta noktada keser.", "M orta noktaysa kat izi M'den geçer."], "t": "A'dan geçmesi ve AM ile çakışması yalnız |AB| = |AC| iken olur", "d": "B'yi C'ye getiren kat izi BC'nin kenar orta dikmesidir. Kenarortay doğruysa bu iz orta noktadan geçer; A'dan geçmesi gerekmez.", "ses": "b04"}, {"no": 5, "on": "<p>Bir evin çatı makası |AB| = |AC| olan ABC ikizkenar üçgeni biçimindedir; tepe açısı 118°'dir. Usta, BC'ye ait kenarortayı A açısının açıortayını inşa ederek bulmuştur.</p>", "g": "<svg viewBox=\"0 0 392 172.13769904440966\" width=\"392\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"36.0,136.1 356.0,136.1 196.0,40.0\" fill=\"#fff3bf\" stroke=\"#111111\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><path d=\"M178.9 50.3 A20.0 20.0 0 0 0 213.1 50.3\" fill=\"none\" stroke=\"#111111\" stroke-width=\"1.3\"/><text x=\"196.0\" y=\"83.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">118°</text><circle cx=\"36.0\" cy=\"136.1\" r=\"3.4\" fill=\"#111111\"/><text x=\"20.3\" y=\"145.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"356.0\" cy=\"136.1\" r=\"3.4\" fill=\"#111111\"/><text x=\"371.7\" y=\"145.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><circle cx=\"196.0\" cy=\"40.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"196.0\" y=\"29.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text></svg>", "son": "", "k": "Buna göre, ustanın çizdiği çizgi A açısını kaçar derecelik iki açıya ayırır?", "sec": ["118", "31", "59", "62"], "secg": null, "c": "C", "a": ["İkizkenar üçgende tabana ait kenarortay tepe açısının açıortayıdır; usta doğru yolu kullanmıştır.", "118 : 2 = 59."], "t": "118: açının tamamı; 31: taban açısı; 62: bütünleri alınmış", "d": "İkizkenar üçgende tabana ait kenarortay tepe açısının açıortayıdır. Açının tamamını değil, yarısını yazınız.", "ses": "b05"}, {"no": 6, "on": "<p>Bir tasarımcı eşkenar üçgen biçimli bir panoyu B ve C merkezli, yarıçapı |BC| olan iki çemberle inşa etmiştir. Çemberler A'da ve BC'nin altında D noktasında kesişmektedir.</p>", "g": "<svg viewBox=\"0 0 420 400\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><defs><clipPath id=\"ehz\"><rect width=\"420\" height=\"400\"/></clipPath></defs><g clip-path=\"url(#ehz)\"><circle cx=\"110.0\" cy=\"210.0\" r=\"160.0\" fill=\"none\" stroke=\"#7048e8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><circle cx=\"270.0\" cy=\"210.0\" r=\"160.0\" fill=\"none\" stroke=\"#7048e8\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><polygon points=\"190.0,71.4 110.0,210.0 270.0,210.0\" fill=\"#f3f0ff\" stroke=\"#111111\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/><circle cx=\"190.0\" cy=\"348.6\" r=\"3.3\" fill=\"#7048e8\"/><text x=\"208.0\" y=\"354.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">D</text><circle cx=\"190.0\" cy=\"71.4\" r=\"3.3\" fill=\"#111111\"/><text x=\"190.0\" y=\"60.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"110.0\" cy=\"210.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"95.0\" y=\"220.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"270.0\" cy=\"210.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"285.0\" y=\"220.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text></g></svg>", "son": "", "k": "Buna göre, tasarımcı yeni çember çizmeden BC'ye ait kenarortayı nasıl çizer?", "sec": ["A ile D'yi birleştirir; bu doğrunun BC'yi kestiği nokta A ile birleşen kenarortayı verir.", "B ile D'yi birleştirir.", "A ile B'yi birleştirir.", "Yeni çember çizmeden çizemez."], "secg": null, "c": "A", "a": ["A ve D, B ve C'ye eşit uzaklıktadır; AD doğrusu BC'nin orta dikmesidir.", "Eşkenar üçgende bu doğru A'dan geçtiği için BC'ye ait kenarortay AD üzerindedir."], "t": "BD bir yarıçaptır; AB bir kenardır; hazır çemberler yeterlidir", "d": "Hazır çemberlerin iki kesişim noktası B ve C'ye eşit uzaklıktadır; bu iki noktayı birleştiren doğru BC'nin orta dikmesidir.", "ses": "b06"}, {"no": 7, "on": "<p>İki kardeş, ABC üçgeni biçimindeki bir arsayı A köşesinden BC kenarına çekilecek bir çitle alanları eşit iki parçaya ayıracaktır. Çitin ucu pergel ve işaretsiz cetvelle inşa edilerek bulunacaktır. BC kenarı 62 m, A'dan BC'ye inen yükseklik 40 m'dir.</p>", "g": "<svg viewBox=\"0 0 420 256\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"130.0,40.0 30.0,220.0 390.0,220.0\" fill=\"#ebfbee\" stroke=\"#111111\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><circle cx=\"130.0\" cy=\"40.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"123.5\" y=\"31.1\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"30.0\" cy=\"220.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"15.1\" y=\"231.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"390.0\" cy=\"220.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"405.4\" y=\"230.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><line x1=\"30.0\" y1=\"240.0\" x2=\"390.0\" y2=\"240.0\" stroke=\"#8a93a6\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><rect x=\"186\" y=\"230\" width=\"48\" height=\"20\" fill=\"#fff\"/><text x=\"210.0\" y=\"245.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">62 m</text><line x1=\"130.0\" y1=\"40.0\" x2=\"130.0\" y2=\"220.0\" stroke=\"#d9480f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><polyline points=\"138.0,220.0 138.0,212.0 130.0,212.0\" fill=\"none\" stroke=\"#d9480f\" stroke-width=\"1.4\"/><text x=\"124.0\" y=\"140.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#d9480f\" text-anchor=\"end\">40 m</text></svg>", "son": "", "k": "Buna göre, çitin BC'ye ulaştığı nokta nasıl bulunur ve bir parçanın alanı kaç metrekaredir?", "sec": ["A'dan BC'ye dik inşa edilip ayağında · 620 m²", "BC'nin orta dikmesi inşa edilip BC'yi kestiği noktada · 1 240 m²", "A açısının açıortayı inşa edilip ayağında · 620 m²", "BC'nin orta dikmesi inşa edilip BC'yi kestiği noktada · 620 m²"], "secg": null, "c": "D", "a": ["Alanı ikiye bölen çit kenarortaydır; ucu BC'nin orta noktasıdır ve orta dikme inşasıyla bulunur.", "Her parçanın tabanı 31 m, yüksekliği 40 m: 31 · 40 : 2 = 620 m²."], "t": "Dikme ve açıortay çeşitkenar üçgende ortaya gitmez; 1 240 m² arsanın tamamıdır", "d": "Alanı eşit iki parçaya bölen çit kenarortaydır. Bir parçanın tabanı kenarın yarısıdır; yükseklik iki parçada ortaktır.", "ses": "b07"}, {"no": 8, "on": "<p>Bir haritada A köyünden, B ve C köylerini birleştiren yolun tam ortasına yeni bir yol yapılacaktır. Yolun yeri pergel ve işaretsiz cetvelle belirlenecektir. Yapılacak işler karışık olarak verilmiştir.</p><div style=\"margin:1mm 0 1mm 2mm\"><div style=\"margin:.6mm 0\">I. Yay kesişimlerini birleştiren çizginin BC yolunu kestiği noktayı M olarak işaretlemek</div><div style=\"margin:.6mm 0\">II. A ile M'yi birleştirmek</div><div style=\"margin:.6mm 0\">III. B ve C merkezli eş yaylar çizmek</div><div style=\"margin:.6mm 0\">IV. Yayların iki kesişim noktasını birleştirmek</div></div>", "g": "<svg viewBox=\"0 0 420 240\" width=\"420\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"60.0\" y1=\"200.0\" x2=\"380.0\" y2=\"170.0\" stroke=\"#868e96\" stroke-width=\"8\" stroke-linecap=\"round\"/><rect x=\"109\" y=\"42\" width=\"22\" height=\"16\" fill=\"#fff4e6\" stroke=\"#d9480f\" stroke-width=\"1.4\"/><polygon points=\"106,42 120,30 134,42\" fill=\"#d9480f\"/><text x=\"120.0\" y=\"78.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A köyü</text><rect x=\"49\" y=\"192\" width=\"22\" height=\"16\" fill=\"#fff4e6\" stroke=\"#d9480f\" stroke-width=\"1.4\"/><polygon points=\"46,192 60,180 74,192\" fill=\"#d9480f\"/><text x=\"60.0\" y=\"228.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B köyü</text><rect x=\"369\" y=\"162\" width=\"22\" height=\"16\" fill=\"#fff4e6\" stroke=\"#d9480f\" stroke-width=\"1.4\"/><polygon points=\"366,162 380,150 394,162\" fill=\"#d9480f\"/><text x=\"380.0\" y=\"198.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C köyü</text></svg>", "son": "", "k": "Buna göre, işlerin doğru sıralaması aşağıdakilerden hangisidir?", "sec": ["III, I, IV, II", "III, IV, I, II", "IV, III, I, II", "I, III, IV, II"], "secg": null, "c": "B", "a": ["Önce eş yaylar (III), sonra kesişimleri birleştirme (IV).", "Bu çizginin yolu kestiği nokta M (I); son olarak A ile M (II)."], "t": "Öbür sıralamalarda yay çizilmeden kesişim aranmıştır", "d": "Önce çemberler (yaylar) çizilir; kesişim noktaları ancak sonra birleştirilebilir. Köyle birleştirme en son yapılır.", "ses": "b08"}, {"no": 9, "on": "<p>İki kardeş, aynı üçgen kartonun ağırlık merkezini pergel ve işaretsiz cetvelle bulmuştur. Ayşe her kenar için ayrı açıklık seçip iki kenarortay inşa etmiştir. Kerem açıklığı en uzun kenarın yarısından büyük seçip hiç değiştirmeden üç köşe merkezli çemberler çizmiş ve üç kenarortayı da inşa etmiştir.</p>", "g": "<svg viewBox=\"0 0 400 240\" width=\"400\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"150.0,40.0 40.0,220.0 360.0,190.0\" fill=\"#d0ebff\" stroke=\"#111111\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><text x=\"200.0\" y=\"234.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#1c5fbf\" text-anchor=\"middle\">karton</text></svg>", "son": "", "k": "Buna göre, iki kardeşin çizdiği çember sayıları aşağıdakilerin hangisinde birlikte doğru verilmiştir?", "sec": ["Ayşe 4 · Kerem 6", "Ayşe 2 · Kerem 3", "Ayşe 4 · Kerem 3", "Ayşe 6 · Kerem 3"], "secg": null, "c": "C", "a": ["Ayşe: iki kenarortay, her biri iki çember: 4.", "Kerem: her köşe merkezli çember iki kenarda kullanılır: 3."], "t": "6: üç kenarortaya ikişer çember sayılmış; 2: tek kenarortay sayılmış", "d": "Tek açıklıkla her köşe merkezli çember iki kenarda kullanılır. Her kenarortaya ayrı iki çember saymayınız.", "ses": "b09"}, {"no": 10, "on": "<p>Kenarları 18 m, 24 m ve 30 m olan üçgen biçimli bir bahçede kenarortaylar iple inşa edilecektir. Bahçıvanın elinde 13 m uzunluğunda tek bir ip vardır ve ipin uzunluğunu değiştiremez.</p>", "g": "<svg viewBox=\"0 0 460 252.8\" width=\"460\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"179.6,40.0 50.0,212.8 410.0,212.8\" fill=\"#ebfbee\" stroke=\"#111111\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><text x=\"94.0\" y=\"115.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">18 m</text><text x=\"309.1\" y=\"112.3\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">24 m</text><text x=\"230.0\" y=\"232.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">30 m</text><circle cx=\"179.6\" cy=\"40.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"175.1\" y=\"30.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"50.0\" cy=\"212.8\" r=\"3.4\" fill=\"#111111\"/><text x=\"34.9\" y=\"223.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"410.0\" cy=\"212.8\" r=\"3.4\" fill=\"#111111\"/><text x=\"425.4\" y=\"223.1\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text></svg>", "son": "", "k": "Buna göre, bu iple hangi kenarlara ait kenarortaylar inşa edilebilir?", "sec": ["18 m ve 24 m'lik kenarlara ait", "Yalnız 18 m'lik kenara ait", "Üç kenara da ait", "Yalnız 30 m'lik kenara ait"], "secg": null, "c": "A", "a": ["İp kenarın yarısından uzun olmalıdır: yarılar 9 m, 12 m ve 15 m'dir.", "13 m; 9 m ve 12 m'den uzun, 15 m'den kısadır."], "t": "30 m'lik kenar için ip 15 m'den uzun olmalıdır", "d": "İp her kenarın yarısından uzun olmalıdır. Kenar uzunluklarının yarısını bulup ip uzunluğuyla karşılaştırınız.", "ses": "b10"}, {"no": 11, "on": "<p>Bir öğrenci matematik yazılımında çeşitkenar ABC üçgeninde BC'ye ait kenarortayı çember ve doğru araçlarıyla inşa edip AM'yi çizmiştir. Yanına göz kararıyla AN doğru parçasını da çizmiştir. Sonra C köşesini fareyle sürüklemiştir.</p>", "g": "<svg viewBox=\"0 0 380 250\" width=\"380\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"10\" y=\"10\" width=\"360\" height=\"230\" rx=\"10\" fill=\"#f8f9fa\" stroke=\"#adb5bd\"/><polygon points=\"120.0,50.0 40.0,210.0 330.0,210.0\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><circle cx=\"120.0\" cy=\"50.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"114.0\" y=\"40.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"40.0\" cy=\"210.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"25.3\" y=\"222.1\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"330.0\" cy=\"210.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"345.2\" y=\"220.6\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text><line x1=\"120.0\" y1=\"50.0\" x2=\"185.0\" y2=\"210.0\" stroke=\"#1c5fbf\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"120.0\" y1=\"50.0\" x2=\"220.0\" y2=\"210.0\" stroke=\"#d9480f\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><circle cx=\"185.0\" cy=\"210.0\" r=\"3.3\" fill=\"#1c5fbf\"/><text x=\"185.0\" y=\"231.4\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">M</text><circle cx=\"220.0\" cy=\"210.0\" r=\"3.3\" fill=\"#d9480f\"/><text x=\"228.0\" y=\"229.3\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">N</text></svg>", "son": "", "k": "Buna göre, sürüklemeden sonra aşağıdakilerden hangisi gözlenir?", "sec": ["İkisi de BC'nin orta noktasına gider.", "AM yine BC'nin orta noktasına gider; AN gitmez.", "İkisi de BC'nin orta noktasına gitmez.", "AN orta noktaya gider; AM gitmez."], "secg": null, "c": "B", "a": ["İnşa edilen AM, B ve C'ye bağlı orta dikmeden elde edildiği için C sürüklenince M yeniden hesaplanır.", "Göz kararı çizilen N sabit kalır; BC değişince orta nokta olmaz."], "t": "Sürükleme, inşa ile çizimi ayırmanın kontrol yoludur", "d": "İnşa edilen çizgi köşelere bağlıdır; sürüklemede orta noktayı izlemeye devam eder. Göz kararı çizgi yerinde kalır.", "ses": "b11"}, {"no": 12, "on": "<p>Bir yelkenin ön yüzü |AB| = |AC| olan ABC ikizkenar üçgeni biçimindedir. Terzi, BC'ye ait kenarortayı çizerken B ve C merkezli eş yayların yalnız bir kesişim noktasını işaretleyip bu noktayı A ile birleştirmiştir.</p>", "g": "<svg viewBox=\"0 0 360 256\" width=\"360\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"180.0,30.0 90.0,230.0 270.0,230.0\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><text x=\"110.6\" y=\"124.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\"></text><text x=\"249.4\" y=\"124.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\"></text><circle cx=\"180.0\" cy=\"30.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"180.0\" y=\"19.8\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A</text><circle cx=\"90.0\" cy=\"230.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"77.1\" y=\"245.3\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><circle cx=\"270.0\" cy=\"230.0\" r=\"3.4\" fill=\"#111111\"/><text x=\"282.9\" y=\"245.3\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text></svg>", "son": "", "k": "Buna göre, terzinin yöntemi için aşağıdakilerden hangisi doğrudur?", "sec": ["Yanlıştır; iki kesişim noktası gerekir.", "Yanlıştır; çizgi açıortaydır, kenarortay değildir.", "Doğrudur; bu yöntem her üçgende çalışır.", "Doğrudur; A da B ve C'ye eşit uzaklıkta olduğu için çizgi orta dikmedir ve BC'yi ortalar."], "secg": null, "c": "D", "a": ["|AB| = |AC| olduğu için A, BC'nin orta dikmesi üzerindedir.", "Kesişim noktası da orta dikme üzerindedir; iki nokta orta dikmeyi belirler."], "t": "Çizgi aynı zamanda açıortaydır ama kenarortaydır da; yöntem çeşitkenar üçgende çalışmaz", "d": "Köşe de B ve C'ye eşit uzaklıktaysa orta dikme üzerindedir; o zaman tek kesişim noktası yeter.", "ses": "b12"}, {"no": 13, "on": "<p>Bir çatı makası |AB| = |AC| = 8 m ve |BC| = 5 m olan ABC üçgeni biçimindedir. Usta, AC kenarının ortasına B'den bir destek çubuğu koymak için B açısının açıortayını inşa etmiştir.</p>", "g": "<svg viewBox=\"0 0 270 307.9802623035599\" width=\"270\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><polygon points=\"135.0,40.0 60.0,268.0 210.0,268.0\" fill=\"#fff3bf\" stroke=\"#111111\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><text x=\"75.8\" y=\"151.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">8 m</text><text x=\"194.2\" y=\"151.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">8 m</text><text x=\"135.0\" y=\"288.0\" font-family=\"Source Sans 3\",sans-serif font-s 0.0\" y=\"26.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#2b8a3e\" text-anchor=\"start\">d</text><circle cx=\"140.0\" cy=\"200.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"125.0\" y=\"210.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B</text><line x1=\"140.0\" y1=\"214.0\" x2=\"200.0\" y2=\"214.0\" stroke=\"#8a93a6\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><text x=\"170.0\" y=\"232.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">3 cm</text></svg>", "son": "", "k": "Buna göre, logonun çevresi kaç santimetredir?", "sec": ["18", "9", "12", "6"], "secg": null, "c": "A", "a": ["d, BC'yi dik ortaladığı için C de d'ye 3 cm uzaklıktadır: |BC| = 6 cm.", "Eşkenar üçgenin çevresi 3 · 6 = 18 cm."], "t": "9: kenar 3 cm sanılmış; 12: iki kenar; 6: yalnız bir kenar", "d": "Kenar orta dikme kenarı dik ortalar; B'nin d'ye uzaklığı kenarın yarısıdır. Önce kenarı, sonra çevreyi bulunuz.", "ses": "b14"}, {"no": 15, "on": "<p>Bir öğrenci, AL doğru parçası kenarortay olacak şekilde üçgen biçimli bir bayrak inşa edecektir. L'den AL'ye dik bir doğru inşa etmiş, bu doğru üzerinde |LB| = 5 cm olacak şekilde B'yi işaretlemiştir.</p>", "g": "<svg viewBox=\"0 0 300 270\" width=\"300\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"60.0\" y1=\"20.0\" x2=\"60.0\" y2=\"260.0\" stroke=\"#8a6d1d\" stroke-width=\"5\" stroke-linecap=\"round\"/><line x1=\"60.0\" y1=\"140.0\" x2=\"220.0\" y2=\"140.0\" stroke=\"#1c5fbf\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"220.0\" y1=\"30.0\" x2=\"220.0\" y2=\"250.0\" stroke=\"#8a93a6\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-dasharray=\"6 4\"/><polyline points=\"220.0,131.0 211.0,131.0 211.0,140.0\" fill=\"none\" stroke=\"#111111\" stroke-width=\"1.4\"/><circle cx=\"60.0\" cy=\"140.0\" r=\"3.3\" fill=\"#111111\"/><text x=\"44.0 /* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
