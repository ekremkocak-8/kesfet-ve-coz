<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* ANA_KURALLAR §4.y-3: Etkinliklerde bütün kesirler kesir çizgisiyle (alt alta pay/payda) gösterilir. Düz yazılmış a/b biçimleri otomatik dönüştürülür. */
(function(){
  if (window.__kesirCizgi) return; window.__kesirCizgi = 1;
  const RX = /(^|[^\w\/.,:%])([−-])?(?:(\d+) )?(\d{1,4})\/(\d{1,4})(?![\w\/.,]\d|\w)/g;
  const ATLA = "script,style,svg,textarea,input,select,code,.ilr,.frac,[data-duz]";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function donustur(kok){
    if (!kok || !kok.nodeType) return;
    if (kok.nodeType === 3) kok = kok.parentElement;
    if (!kok || (kok.closest && kok.closest(ATLA))) return;
    const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      if (!/\d\/\d/.test(t.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = t.parentElement; if (!p || p.closest(ATLA)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const L = []; let t; while ((t = w.nextNode())) L.push(t);
    L.forEach(t => {
      let deg = false;
      const h = esc(t.nodeValue).replace(RX, (m, a, s, tam, p, q) => { deg = true;
        return a + (s ? "−" : "") + (tam ? tam + " " : "") + '<span class="frac"><span>' + p + "</span><span>" + q + "</span></span>"; });
      if (!deg) return;
      const k = document.createElement("span"); k.innerHTML = h; t.replaceWith(...k.childNodes);
    });
  }
  let bekleyen = new Set(), plan = 0;
  const calis = () => { plan = 0; const b = bekleyen; bekleyen = new Set(); b.forEach(donustur); };
  const gozcu = new MutationObserver(ms => { ms.forEach(m => {
      if (m.type === "characterData") bekleyen.add(m.target); else m.addedNodes.forEach(n => bekleyen.add(n)); });
    if (!plan) plan = requestAnimationFrame(calis); });
  const bas = () => { donustur(document.body); gozcu.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bas); else bas();
  const st = document.createElement("style");
  st.textContent = ".frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}.frac>span{display:block;text-align:center;padding:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor}";
  document.head.appendChild(st);
})();

/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {

    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });

    async function dagit(k) {

      const kolon = Math.min(k, 6), satirK = Math.ceil(k / kolon), gw = kolon * 14 + 16, gh = satirK * 14 + 26;

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */
  function ATLA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Sonuç"] });
    let k = o.k, L = o.son; const W = 660, sol = 22, sag = 22, sk = (W - sol - sag) / L;

    const bA = dug("▶ Oynat"), bB = dug("+1 " + (o.adimAd || "adım"), "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bB, bS);
    let kA = null;
    if (o.kSec) { kA = adimci(o.kEtiket || "Adım:", 2, Math.floor(L / 2), k, v => { k = v; sifirla(); }); kut.prepend(kA.w); }

    const bT = dug(o.testDugme || "Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test);
    const ti = test.querySelector("input");
    function taban() {
      let sv = `<line x1="${sol}" y1="62" x2="${sol + L * sk}" y2="62" class="cn-ek"/>`;

      for (let v = 0; v <= L; v += adimT) sv += `<line x1="${sol + v * sk}" y1="${v % et ? 58 : 54}" x2="${sol + v * sk}" y2="66" class="cn-ek"/>` + (v % et ? "" : `<text x="${sol + v * sk}" y="82" text-anchor="middle" class="cn-et">${o.etYaz ? o.etYaz(v) : v}</text>`);
      sv += `<line x1="${sol + L * sk}" y1="30" x2="${sol + L * sk}" y2="70" class="cn-sinir"/><text x="${sol + L * sk}" y="24" text-anchor="end" class="cn-et">${o.sonEt || L}</text>`;

    }

      izle.forEach((v, i) => {

        sv += `<path d="M${x1} 62 Q${(x1 + x2) / 2} ${yy} ${x2} 62" class="cn-yay"/><circle cx="${x2}" cy="62" r="4.5" class="${o.renk ? o.renk(v, i + 1) : "cn-o"}"/>`;
        if (izle.length <= 14 || i === izle.length - 1 || i % Math.ceil(izle.length / 10) === 0) sv += `<text x="${x2}" y="${98}" text-anchor="middle" class="cn-et2">${v}</text>`;
      });

      const son = izle.length ? izle[izle.length - 1] : 0, ix = sol + son * sk;
      sv += `<text x="${ix}" y="50" text-anchor="middle" class="cn-kis">${o.simge || "●"}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W} 104" role="img" aria-label="${k} birimlik adımlarla ilerleme">${sv}</svg>`;
    }
    const ileri = () => {
      const v = (n + 1) * k;
      if (v > L) { durdur(); s.dur.innerHTML = `<span class="kotu">■</span> Sonraki ${o.adimAd || "adım"} ${k} ${x} ${n + 1} = <b>${v}</b> olurdu; bu ${E(L,"den")} büyük. ${o.bitti ? o.bitti(n, k, L) : `Toplam ${n} ${o.adimAd || "adım"}; son değer ${n * k}.`}`; if (!izle.length) ciz(); return false; }
      n++; izle.push(v); ciz(); s.dur.innerHTML = o.durum ? o.durum(n, v, k) : `${n}. ${o.adimAd || "adım"}: ${k} ${x} ${n} = <b>${v}</b>`; return true;

      s.dur.innerHTML = m; s.yaz("t" + v, [v, r === 0 ? (ic ? `${k} ${x} ${b} ✔` : `${k} ${x} ${b} (sınır dışı)`) : `kalan ${r} ✘`], r === 0 && ic);

  }

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || [o.kAd || "k", "Boyanan", "En büyük"] });
    let k = o.k || 2, son = o.son;
    const kut = h("div", "cn-satir");

    if (o.sonSec) { const sw = h("div", "cn-hazir"); o.sonSec.forEach(v => { const b = dug(v + " gün", "ghost"); b.onclick = () => { son = v; kur(); temiz(); }; sw.appendChild(b); }); s.den.append(kut, sw); }

      const g = h("div", "cn-izg" + (o.takvim ? " cn-tak" : "")); g.style.gridTemplateColumns = `repeat(${o.sutunSay},1fr)`;

    function temiz() { hucre.forEach(c => c && c.classList.remove("on", "yeni")); s.dur.innerHTML = o.ilk || "Sayıyı seçip Boya düğmesine basın."; }

      }

      s.yaz(k + ":" + son, o.satir ? o.satir(k, say, enb, son) : [k, say, enb], o.iyi ? o.iyi(k, say, enb, son) : null);
      calis = false; bB.disabled = false;

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */
  function ASANSOR(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Açık asansörler", "Gidilen kat", "Gidilemeyen kat"] });
    const ac = o.asansor.map(() => false);
    const kut = h("div", "cn-satir"); const bt = o.asansor.map((a, i) => { const b = dug(a.ad, "ghost"); b.style.setProperty("--ac", a.renk); b.setAttribute("aria-pressed", "false"); b.onclick = () => { ac[i] = !ac[i]; b.setAttribute("aria-pressed", ac[i]); ciz(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    function ciz() {
      let sv = ""; const H = o.kat * 17 + 40; let git = 0, gitme = [];
      for (let f = o.kat; f >= 0; f--) {

        sv += `<rect x="60" y="${y}" width="150" height="15" rx="2" class="${f === 0 ? "cn-zem" : herhangi ? "cn-katon" : (ac.some(Boolean) ? "cn-katoff" : "cn-kat")}"/><text x="52" y="${y + 12}" text-anchor="end" class="cn-et">${f === 0 ? "Z" : f}</text>`;
        o.asansor.forEach((a, i) => { if (dur[i]) sv += `<circle cx="${230 + i * 22}" cy="${y + 7.5}" r="6" fill="${a.renk}"/>`; });
      }
      s.sah.innerHTML = `<svg viewBox="0 0 300 ${H}" style="max-height:440px" role="img" aria-label="${o.kat} katlı bina">${sv}</svg>`;
      const acik = o.asansor.filter((a, i) => ac[i]).map(a => a.ad);

      s.yaz(acik.join("+"), [acik.join(" + "), git, gitme.length], null);

    ciz();
  }

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */
  function SAAT(el, o) {

      let onc = null, snr = null;
      for (let m = bas; m <= bit + ara; m += ara) { if (m <= var_) onc = m; if (m >= var_ && snr == null) snr = m; if (m <= bit) sv += `<text x="${20 + (m - bas) * sk}" y="40" text-anchor="middle" class="cn-bus">🚌</text>`; }

      if (snr != null && snr <= bit + ara) { const sx = 20 + (Math.min(snr, bit) - bas) * sk; sv += `<path d="M${vx} 56 L${sx} 56" class="cn-bek"/>`; }

      const gec = var_ - bas;
      s.dur.innerHTML = `${o.kisi} durağa ${saDa(var_)} geliyor: ilk seferden <b>${gec} dakika</b> sonra. Seferler ${E(ara,"in")} katı olan dakikalarda: ${ara} ${x} ${Math.floor(gec / ara)} = ${Math.floor(gec / ara) * ara}` + (gec % ara ? `, ${ara} ${x} ${Math.floor(gec / ara) + 1} = ${(Math.floor(gec / ara) + 1) * ara}. Sonraki otobüs ${saDa(snr)}; bekleme <b>${snr - var_} dakika</b>.` : `. Tam sefer saatinde geldi; bekleme <b>0 dakika</b>.`);
      s.yaz(ara + ":" + var_, [ara + " dk", sa(var_), sa(onc), sa(snr), (snr - var_) + " dk"], null);
    }
    ciz();
  }

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Çarpanlar", "Çarpan sayısı"] });
    let N = o.N || o.hazir[0]; let bul = new Set(), denendi = new Set();
    const kut = h("div", "cn-satir");
    const sA = adimci("Sayı:", 2, o.max || 200, N, v => { N = v; yeni(); });
    kut.appendChild(sA.w);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => sA.ayarla(n); hz.appendChild(b); }); kut.appendChild(hz); }
    s.den.appendChild(kut);
    const bolen = h("div", "cn-satir cn-test"); bolen.innerHTML = `<label>Bölen deneyin: <input type="number" inputmode="numeric" min="1"></label>`;
    const bD = dug("Böl"), bS = dug("Sıradakini dene", "ghost"); bolen.append(bD, bS); s.den.appendChild(bolen);
    const bi = bolen.querySelector("input");
    let bK = null; if (o.katlar) { bK = dug(o.katDugme || "Katlarını say ▶", "ghost"); s.den.appendChild(bK); }
    const ciftler = h("div", "cn-cift"); const katlar = h("div", "cn-katlar");
    function yeni() { bul = new Set(); denendi = new Set(); ciz(); s.dur.innerHTML = `${N} sayısını 1, 2, 3, … sayılarına bölerek çarpan çiftlerini bulun.`; katlar.textContent = ""; }
    function ciz() {
      const L = [...bul].sort((a, b) => a - b);
      s.sah.innerHTML = ""; const kartlar = h("div", "cn-kartlar");
      L.forEach(v => kartlar.appendChild(h("span", "cn-kart" + (v * v === N ? " kare" : ""), v)));
      if (!L.length) kartlar.appendChild(h("span", "cn-bosk", "Henüz çarpan bulunmadı"));
      s.sah.append(kartlar, ciftler, katlar);
      ciftler.innerHTML = L.filter(v => v * v <= N).map(v => `<span>${v} ${x} ${N / v}${v * v === N ? " <i>(aynı sayı: bir kez yazılır)</i>" : ""}</span>`).join("");
    }
    const tamamMi = () => { for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) return false; return true; };
    const eksik = () => { const L = []; for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) L.push(i); return ` <br>Henüz denenmeyen küçük bölenler var: <b>${L.join(", ")}</b>. Bunları da deneyin.`; };
    function dene(d) {
      if (!d || d < 1) return; denendi.add(d);
      const b = Math.floor(N / d), r = N % d;
      if (d > N) { s.dur.innerHTML = `${d} > ${N}: ${E(N,"den")} büyük sayı ${E(N,"in")} çarpanı olamaz.`; return; }
      if (r === 0) { bul.add(d); bul.add(b); ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${N} : ${d} = ${b}, kalan 0 → <b>${d} ${x} ${b} = ${N}</b>. ${d} ve ${b} çarpandır.` + (d * d >= N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} ${d * d === N ? "=" : ">"} ${N}. Artık yeni çift çıkmaz; bütün çarpanlar bulundu.` : eksik() : ""); }
      else { s.dur.innerHTML = `<span class="kotu">✘</span> ${N} : ${d} işleminde bölüm ${b}, <b>kalan ${r}</b>. ${d}, ${E(N,"in")} çarpanı değildir.` + (d * d > N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} > ${N}. Daha büyük bölen denemeye gerek yok; çarpan listesi tamam.` : eksik() : ""); }
      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));
      if (tamam) s.yaz("n" + N, [N, [...bul].sort((a, b) => a - b).join(", "), bul.size], true);
    }
    bD.onclick = () => dene(Math.round(+bi.value));
    bS.onclick = () => { let d = 1; while (denendi.has(d)) d++; bi.value = d; dene(d); };
    if (bK) bK.onclick = async () => {
      bK.disabled = true; katlar.textContent = ""; const sat = h("div", "cn-katsat"); katlar.append(h("b", "", `${E(N,"in")} katları: `), sat);
      for (let i = 1; i <= (o.katSay || 12); i++) { sat.appendChild(h("span", "cn-kat2", `${N * i}`)); await bekle(220); }
      sat.appendChild(h("span", "cn-sonsuz", "… ve sonsuza kadar sürer"));

    };
    yeni();
  }

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */
  function KUMBARA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Para", "Sonuç"] });
    const k = o.k; let hafta = 0, tmr = null;
    const kut = h("div", "cn-satir"); const bA = dug("Bir hafta geçsin +"), bO = dug("▶ Haftaları oynat", "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bO, bS); s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Kumbarada şu para olabilir mi? <input type="number" inputmode="numeric" min="1" max="500"> TL</label>`;
    const bT = dug("Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test); const ti = test.querySelector("input");
    function ciz() {
      const top = hafta * k, sv = [];
      const yuk = Math.min(150, top * 1.4);
      sv.push(`<rect x="110" y="20" width="120" height="160" rx="22" class="cn-kum"/><rect x="150" y="14" width="40" height="8" rx="3" class="cn-kum2"/>`);
      sv.push(`<rect x="116" y="${176 - yuk}" width="108" height="${yuk}" rx="10" class="cn-para"/>`);
      sv.push(`<text x="170" y="110" text-anchor="middle" class="cn-buyuk">${top} TL</text><text x="170" y="134" text-anchor="middle" class="cn-et">${hafta}. hafta</text>`);
      let cizgi = ""; for (let i = 1; i <= hafta && i <= 16; i++) cizgi += `<text x="${260 + ((i - 1) % 4) * 52}" y="${40 + Math.floor((i - 1) / 4) * 34}" class="cn-et2">${k}${x}${i}=${k * i}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 480 190" role="img" aria-label="Kumbara">${sv.join("")}${cizgi}</svg>`;
      s.dur.innerHTML = hafta ? `${hafta}. hafta sonunda kumbarada ${k} ${x} ${hafta} = <b>${top} TL</b> var.` : `Kumbara boş. Her hafta ${k} TL atılıyor.`;
    }
    bA.onclick = () => { hafta++; ciz(); };
    bO.onclick = () => { if (tmr) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } bO.textContent = "❚❚ Durdur"; tmr = setInterval(() => { if (hafta >= 15) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } hafta++; ciz(); }, az ? 50 : 500); };
    bS.onclick = () => { hafta = 0; ciz(); };
    bT.onclick = () => {
      const v = Math.round(+ti.value); if (!v) return; const b = Math.floor(v / k), r = v % k;
      s.dur.innerHTML = r ? `<span class="kotu">✘</span> ${k} ${x} ${b} = ${k * b} TL, ${k} ${x} ${b + 1} = ${k * (b + 1)} TL. ${v} TL arada kalır (${v} : ${k} → kalan ${r}). Kumbarada hiçbir hafta ${v} TL olmaz.`
        : `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · ${b}. hafta sonunda kumbarada tam ${v} TL olur.`;
      if (!r) { hafta = b; ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · <b>${b}. hafta</b> sonunda kumbarada tam ${v} TL olur.`; }
      s.yaz("t" + v, [v + " TL", r ? `kalan ${r} ✘` : `${k} ${x} ${b} ✔`], !r);
    };
    ciz();
  }

  /* 9) ÖNERME LABORATUVARI: önermeyi farklı sayılarla sınama */
  function ONERME(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Önerme", "Sayı", "Sonuç"] });

    const bt = o.onermeler.map((on, i) => { const b = dug(on.ad, "ghost"); b.setAttribute("aria-pressed", i === 0); b.onclick = () => { akt = i; bt.forEach((x, j) => x.setAttribute("aria-pressed", j === i)); goster(); }; kut.appendChild(b); return b; });

    const bT = dug("Sına"), bR = dug("Rastgele sayı", "ghost"); test.append(bT, bR); s.den.appendChild(test); const ti = test.querySelector("input");
    function goster() { s.sah.innerHTML = `<div class="cn-onr"><b>${o.onermeler[akt].ad}:</b> “${o.onermeler[akt].metin}”</div>`; s.dur.innerHTML = "Bir sayı yazıp Sına düğmesine basın. Önerme her sayıda doğru mu?"; }
    function sina(n) {
      const on = o.onermeler[akt], r = on.sina(n);
      s.sah.innerHTML = `<div class="cn-onr"><b>${on.ad}:</b> “${on.metin}”</div><div class="cn-kanit">${r.goster}</div>`;
      s.dur.innerHTML = (r.ok ? `<span class="iyi">✔</span> ${n} için önerme doğru.` : `<span class="kotu">✘</span> ${n} için önerme yanlış! Bir karşı örnek bulundu.`) + (r.not ? " " + r.not : "");
      s.yaz(akt + ":" + n, [on.ad, n, r.ok ? "doğru" : "yanlış (karşı örnek)"], r.ok);

  }


  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →
     koşullar tek tek denetlenir (✔/✘) → deney defterine yazılır. Doğru cevap verilmez; öğrenci uygun girdiyi kendisi arar.
     o.girdi: [{ad, min, max, bas} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → SVG/HTML · o.kosullar: [{ad, f(v) → bool | {ok, not}}]
     o.dugme: düğme yazısı (false → her değişiklikte denetlenir) · o.sonuc(v, hepsi, L) · o.satir(v, hepsi, L) · o.iyi(v, L) · o.ek: [{ad, deger(v) → v}] */
  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);
      s.dur.innerHTML = m;
      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);
    }
    kur = true; ciz();
    if (bS) s.dur.innerHTML = o.ilk || "Değerleri seçip Sına düğmesine basın."; else sina();
  }

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

/* MAT.7.1.3 · bağlam sorularının "Canlandır" düzenekleri (05.10.2026, Aşama 2) — ortak motorlar: canlandir.js (CN.KOSUL)
   Bu fasiküle özgü yeni motor (ortak dosyaya dokunmadan burada tanımlanır):
   CN.SIRALA7 — rasyonel sayı kartlarını ▲▼ ile sıralama; komşu kartların arasındaki sembol (gerçek karşılaştırma) anında değişir.
                Araçlar: "payda" (ortak payda sayacı: kartlar o paydayla yeniden yazılır), "ondalik" (gösterilen ondalık basamak sayısı:
                sayılar basamakları hizalı açılır, devirli sayılar devam eder), "serit" (kesir şeridi, istenirse büyüteçle bir bölümü).
   Sayı doğrusu ve termometre çizimleri CN.KOSUL ile kurulur (dogru7, termo7). Kesirler metinde a/b yazılır; kesir_cizgi.js üst üste çizer.
   Her düzenek: öğrenci elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener; doğru cevap düğmeyle verilmez. */
(() => {
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };
  const M = "−", gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  /* kesin rasyonel sayı: "−2 1/3", "−5/6", "+0,47", "0,6̄" (devirli: o.dev ile verilir), "−17" → {p,q} */
  const Q = (p, q = 1) => { if (q < 0) { p = -p; q = -q; } const g = gcd(p, q); return { p: p / g, q: q / g }; };
  function oku(s) { s = String(s).replace(/<[^>]+>/g, "").replace(/[+\s]+$/, "").trim(); const neg = /^[−-]/.test(s); s = s.replace(/^[−+-]/, "");
    let r; if (/^\d+ \d+\/\d+$/.test(s)) { const [t, k] = s.split(" "), [a, b] = k.split("/").map(Number); r = Q(+t * b + a, b); }
    else if (s.includes("/")) { const [a, b] = s.split("/").map(Number); r = Q(a, b); }
    else if (s.includes(",")) { const [t, o] = s.split(","); r = Q(+(t + o), 10 ** o.length); } else r = Q(+s, 1);
    return neg ? Q(-r.p, r.q) : r; }
  const kars = (a, b) => Math.sign(a.p * b.q - b.p * a.q);

  const serit = (n_, k, renk, yarim) => { const W = 360, w = (W - 20) / n_; let sv = "";
    for (let i = 0; i < n_; i++) sv += `<rect x="${10 + i * w}" y="8" width="${w}" height="30" fill="${i < k ? renk : "#f1f3f5"}" stroke="#495057" stroke-width="1.2"/>`;
    if (yarim) sv += `<line x1="${W / 2}" y1="0" x2="${W / 2}" y2="46" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="5 3"/><text x="${W / 2}" y="60" text-anchor="middle" class="cn-et2" style="fill:#e8590c">yarısı</text>`;
    return `<svg class="sb7-svg" viewBox="0 0 ${W} ${yarim ? 64 : 46}" role="img" aria-label="Bölmeli gösterge">${sv}</svg>`; };
  const SIRA = { yon: a => `Kartları ▲ ve ▼ düğmeleriyle yer değiştirerek <b>${a}</b> dizin. Kartların arasındaki sembol iki sayının gerçek karşılaştırmasıdır; kırmızı sembol sıranın istenen sırayla uyuşmadığını gösterir. <b>Gösterilen ondalık basamak</b> sayacıyla sayıları basamakları hizalı açabilirsiniz. Her sıralamayı deftere yazın.`,
    bitis: "Bütün semboller yeşil olunca ve sıralamayı deftere yazdığınızda." };
  return {
    1: el => CN.SIRALA7(el, { arac: "ondalik", basamak0: 1, buyukten: true, istenen: "sıcaklığı en yüksekten en düşüğe",
      ogeler: kartlar([["Kuzey", "−12,5"], ["Buzul", "−12,375"], ["Fiyort", "−12,45"], ["Kar", "−12,4"]], " °C"),
      sonuc: L => `En üstteki istasyon: <b>${L[0].ad}</b>.`, yon: SIRA.yon("sıcaklığı en yüksek olandan en düşük olana doğru"), bitis: SIRA.bitis }),
    2: el => { const D = { Ali: "0,8", Berk: "−0,1", Cem: "0,35", Deniz: "0,4" };
      return CN.KOSUL(el, { girdi: [{ ad: "Sporcu:", sec: Object.keys(D), bas: "Ali" }], dugme: false,
        ciz: v => CN.dogru7({ min: -0.2, max: 0.9, adim: 0.05, et: (x, i) => i % 2 === 0 ? yz(x) : null, bant: [0, 0.9],
          isaret: [{ v: 0, et: "çizgi", renk: "#c92a2a" }], nokta: { v: n(D[v[0]]), et: D[v[0]] }, ad: "Basma tahtası" }) +
          `<div class="sb7-not">Yeşil bölge: çizgiyi geçmeyen basışlar. Çizginin solu (negatif): faul.</div>`,
        kosullar: [{ ad: v => `${v[0]} çizgiyi geçmedi (konum 0 ya da pozitif)`, f: v => n(D[v[0]]) >= 0 },
          { ad: v => `Çizgiye uzaklığı: ${D[v[0]].replace(M, "")} cm`, f: () => true }],
        sutun: ["Sporcu", "Konum (cm)", "Faul mü?", "Çizgiye uzaklık (cm)"], satir: (v, ok, L) => [v[0], D[v[0]], L[0].ok ? "hayır" : "faul ✘", D[v[0]].replace(M, "")],
        iyi: (v, L) => L[0].ok ? null : false,
        yon: "Sporcuları sırayla seçin. Basış noktası basma tahtasında işaretlenir; faul olup olmadığı ve çizgiye uzaklığı deftere yazılır. Faul yapmayanlar arasında çizgiye en yakın olanı defterden bulun.",
        bitis: "Dört sporcuyu da denediğinizde." }); },
    3: el => { const D = { A: [7, 2], B: [10, 3], C: [11, 3], D: [13, 4] };
      return CN.KOSUL(el, { girdi: [{ ad: "Sürahi:", sec: Object.keys(D), bas: "A", yaz: k => `${k} sürahisi` }], dugme: false,
        ciz: v => { const [t, l] = D[v[0]]; return serit(t, l, "#fcc419") + `<div class="sb7-not">${v[0]} sürahisi ${t} bardak alır; sarı bölmeler ${l} bardak limon suyu.<br>Limon suyu sürahinin <b>${l}/${t} = ${CN.acilim7({ p: l, q: t }, 3)}</b> kadarıdır.</div>`; },
        kosullar: [{ ad: v => { const [t, l] = D[v[0]]; return `Kesir ${l}/${t}, 3/10'dan büyük mü? (3/10 = 0,300)`; }, f: v => kars({ p: D[v[0]][1], q: D[v[0]][0] }, { p: 3, q: 10 }) > 0 }],
        sutun: ["Sürahi", "Kesir", "Ondalık (3 basamak)"], satir: v => { const [t, l] = D[v[0]]; return [v[0], `${l}/${t}`, CN.acilim7({ p: l, q: t }, 3)]; }, iyi: () => null,
        yon: "Sürahileri sırayla seçin. Sürahinin kaç bardak aldığı bölmelerle, limon suyu sarı bölmelerle gösterilir; kesir 3 ondalık basamakla açılır. Kesirleri defterde karşılaştırarak en ekşi limonatayı bulun.",
        bitis: "Dört sürahiyi de denediğinizde." }); },
    4: el => { const D = { A: [11, 6], B: [7, 4], C: [9, 5], D: [12, 7] };
      return CN.KOSUL(el, { girdi: [{ ad: "Fener:", sec: Object.keys(D), bas: "A", yaz: k => `${k} feneri` }], dugme: false,
        ciz: v => { const [b, d] = D[v[0]]; return serit(b, d, "#51cf66", true) + `<div class="sb7-not">Gösterge ${b} bölme, ${d} bölmesi dolu: <b>${d}/${b}</b></div>`; },
        kosullar: [{ ad: v => { const [b, d] = D[v[0]]; return `${d}/${b}, 1/2'den büyük (${d} bölme, ${b} bölmenin yarısından fazla)`; }, f: v => 2 * D[v[0]][1] > D[v[0]][0] },
          { ad: v => { const [b, d] = D[v[0]]; return `1/2'den fazlası: ${d}/${b} − 1/2 = ${2 * d - b}/${2 * b}`; }, f: () => true }],
        sutun: ["Fener", "Dolu kısım", "1/2'den fazlası"], satir: v => { const [b, d] = D[v[0]]; return [v[0], `${d}/${b}`, `${2 * d - b}/${2 * b}`]; }, iyi: () => null,
        yon: "Fenerleri sırayla seçin. Şarj göstergesi ve yarısını gösteren turuncu çizgi çizilir; dolu kısmın 1/2'den ne kadar fazla olduğu hesaplanıp deftere yazılır. 1/2'den fazlası en küçük olan feneri defterden bulun.",
        bitis: "Dört feneri de denediğinizde." }); },
    5: el => CN.SIRALA7(el, { arac: "ondalik", basamak0: 1, buyukten: true, istenen: "çalışma süresi en uzundan en kısaya",
      ogeler: kartlar([["Ece", "3/4"], ["Can", "0,7"], ["Su", "5/6"], ["Ali", "0,8"]], " saat"),
      sonuc: L => `En uzun: <b>${L[0].ad}</b>, en kısa: <b>${L[3].ad}</b>.`, yon: SIRA.yon("çalışma süresi en uzun olandan en kısa olana doğru"), bitis: SIRA.bitis }),
    6: el => CN.SIRALA7(el, { arac: "ondalik", basamak0: 1, istenen: "konumu en derinden yer seviyesine doğru (küçükten büyüğe)",
      ogeler: kartlar([["K noktası", "−1,25"], ["L noktası", "−1,3"], ["M noktası", "−0,84"], ["N noktası", "−1,05"]], " m"),
      sonuc: L => `En derin nokta: <b>${L[0].ad}</b>.`, yon: SIRA.yon("konumu küçükten büyüğe doğru"), bitis: SIRA.bitis }),
    7: el => { const D = { Ece: "−12,5", Can: "+8,25", Su: "−12,75", Ali: "−2,5" };
      return CN.KOSUL(el, { girdi: [{ ad: "Arkadaş:", sec: Object.keys(D), bas: "Ece" }], dugme: false,
        ciz: v => CN.dogru7({ min: -14, max: 10, adim: 1, et: x => x % 2 === 0 ? (x < 0 ? M + (-x) : String(x)) : null, isaret: [{ v: 0, et: "hedef", renk: "#2b8a3e" }],
          nokta: { v: n(D[v[0]]), et: D[v[0]] }, ad: "Hedefe göre durum" }) + `<div class="sb7-not">0: hedef tutar. Sol taraf: hedefe ulaşamayanlar.</div>`,
        kosullar: [{ ad: v => `${v[0]} hedefe ulaşamadı (durum negatif)`, f: v => n(D[v[0]]) < 0 },
          { ad: v => n(D[v[0]]) < 0 ? `Hedefe ulaşmak için gereken para: ${D[v[0]].replace(M, "")} TL` : `Hedefini ${D[v[0]].replace("+", "")} TL aşmış`, f: () => true }],
        sutun: ["Arkadaş", "Durum (TL)", "Gereken para (TL)"], satir: v => [v[0], D[v[0]], n(D[v[0]]) < 0 ? D[v[0]].replace(M, "") : "—"], iyi: () => null,
        yon: "Arkadaşları sırayla seçin. Kumbaranın hedefe göre durumu sayı doğrusunda işaretlenir; hedefe ulaşmak için gereken para deftere yazılır. En çok paraya ihtiyacı olanı defterden bulun.",
        bitis: "Dört arkadaşı da denediğinizde." }); },
    8: el => CN.SIRALA7(el, { arac: "ondalik", basamak0: 1, buyukten: true, istenen: "ayrılan alan büyükten küçüğe (sipariş sırası)",
      ogeler: kartlar([["Buğday", "4/11"], ["Arpa", "3/8"], ["Mısır", "5/14"], ["Nohut", "1/7"]]),
      sonuc: L => `Sipariş sırası: ${L.map(x => x.ad).join(", ")}.`, yon: SIRA.yon("ayrılan alan büyükten küçüğe doğru"), bitis: SIRA.bitis }),
    9: el => { const D = { Su: "+0,2", Ece: "+0,3", Can: "−0,25", Ali: "−0,23" };
      return CN.KOSUL(el, { girdi: [{ ad: "Öğrenci:", sec: Object.keys(D), bas: "Su" }], dugme: false,
        ciz: v => { const x = n(D[v[0]]); return CN.dogru7({ min: -0.35, max: 0.35, adim: 0.01, et: (y, i) => i % 5 === 0 ? (Math.abs(y) < 1e-9 ? "0" : yz(y)) : null,
          bant: [Math.min(0, x), Math.max(0, x)], isaret: [{ v: 0, et: "50 cm", renk: "#2b8a3e" }], nokta: { v: x, et: D[v[0]] }, ad: "Ölçüm farkı" }) +
          `<div class="sb7-not">Yeşil şerit: ölçümün gerçek uzunluğa (0'a) uzaklığı.</div>`; },
        kosullar: [{ ad: v => `${v[0]} için gerçek uzunluğa uzaklık: ${D[v[0]].replace(/[+−]/, "")} cm`, f: () => true }],
        sutun: ["Öğrenci", "Fark (cm)", "0'a uzaklık (cm)"], satir: v => [v[0], D[v[0]], D[v[0]].replace(/[+−]/, "")], iyi: () => null,
        yon: "Öğrencileri sırayla seçin. Ölçüm farkı sayı doğrusunda işaretlenir; 0'a olan uzaklığı yeşil şeritle gösterilir ve deftere yazılır. Şeridi en kısa olanı defterden bulun.",
        bitis: "Dört öğrenciyi de denediğinizde." }); },
    10: el => { const K = ["−1,8", "−1,7", "−1,55", "−1,85"];
      return CN.KOSUL(el, { girdi: [{ ad: "Yeni istasyonun konumu:", sec: K, bas: "−1,8" }], dugme: false,
        ciz: v => CN.dogru7({ min: -1.9, max: -1.5, adim: 0.05, et: (y, i) => i % 2 === 0 ? yz(y) : null,
          isaret: [{ v: -1.75, et: "−1 3/4", renk: "#1c7ed6" }, { v: -1.6, et: "L", renk: "#c2255c" }], nokta: { v: n(v[0]), et: v[0] }, ad: "Tren hattı" }) +
          `<div class="sb7-not">Batı solda, doğu sağdadır.</div>`,
        kosullar: [{ ad: v => `${v[0]}, −1 3/4'ün doğusunda (sağında)`, f: v => kars(oku(v[0]), oku("−1 3/4")) > 0 },
          { ad: v => `${v[0]}, L istasyonunun (−1,6) batısında (solunda)`, f: v => kars(oku(v[0]), oku("−1,6")) < 0 }],
        sutun: ["Konum (km)", "−1 3/4'ün doğusunda mı?", "L'nin batısında mı?"], satir: (v, ok, L) => [v[0], L[0].ok ? "evet" : "hayır", L[1].ok ? "evet" : "hayır"],
        yon: "Seçeneklerdeki konumları sırayla deneyin. Konum, hattın büyütülmüş bölümünde işaretlenir ve iki koşul anında denetlenir.",
        bitis: "Dört konumu da denediğinizde." }); },
    11: el => { const O = {
        Ada: { m: "İki negatif kesirden paydası büyük olan her zaman daha büyüktür.", o: [["−1/2", "−1/4"], ["−2/5", "−2/7"], ["−1/3", "−3/4"]] },
        Bora: { m: "0 ile 1 arasındaki iki kesirden 1'e daha yakın olan daha büyüktür.", o: [["3/5", "4/7"], ["1/3", "5/6"], ["2/3", "7/10"]] },
        Cansu: { m: "Her rasyonel sayının solunda en az bir tam sayı vardır.", o: [["−2/3"], ["5/7"], ["−1 1/2"]] } };
      const payda = s => +s.split("/")[1];
      const sina = (k, j) => { const e = O[k].o[j];
        if (k === "Ada") { const [a, b] = e, buy = payda(a) > payda(b) ? a : b, kuc = buy === a ? b : a; return { ok: kars(oku(buy), oku(kuc)) > 0, t: `Paydası büyük olan ${buy}; ${buy} ${kars(oku(buy), oku(kuc)) > 0 ? "&gt;" : "&lt;"} ${kuc}` }; }
        if (k === "Bora") { const [a, b] = e, ya = 1 - n(a) < 1 - n(b) ? a : b, ob = ya === a ? b : a; return { ok: kars(oku(ya), oku(ob)) > 0, t: `1'e daha yakın olan ${ya}; ${ya} ${kars(oku(ya), oku(ob)) > 0 ? "&gt;" : "&lt;"} ${ob}` }; }
        const x = n(e[0]), t = Math.floor(x) === x ? x - 1 : Math.floor(x); return { ok: t < x, t: `${e[0]} sayısının solunda ${t < 0 ? M + (-t) : t} tam sayısı var` }; };
      return CN.KOSUL(el, { girdi: [{ ad: "Önerme:", sec: ["Ada", "Bora", "Cansu"], bas: "Ada" }, { ad: "Örnek:", sec: [1, 2, 3], bas: 1, yaz: i => `${i}. örnek` }], dugme: false,
        ciz: v => { const e = O[v[0]].o[v[1] - 1];
          return `<div class="sb7-not"><b>${v[0]}:</b> “${O[v[0]].m}”<br>${v[1]}. örnek: <b>${e.join(" ve ")}</b></div>` +
            CN.dogru7({ min: -2, max: 1, adim: 0.25, et: x => Number.isInteger(x) ? (x < 0 ? M + (-x) : String(x)) : null,
              isaret: e.map((s, i) => ({ v: n(s), et: s, renk: i ? "#c2255c" : "#1c7ed6" })), ad: "Örnekteki sayılar" }); },
        kosullar: [{ ad: v => `Önerme bu örnekte doğru: ${sina(v[0], v[1] - 1).t}`, f: v => sina(v[0], v[1] - 1).ok }],
        sutun: ["Önerme", "Örnek", "Bu örnekte doğru mu?"], satir: (v, ok) => [v[0], O[v[0]].o[v[1] - 1].join(" ve "), ok ? "doğru ✔" : "yanlış ✘ (karşı örnek)"],
        yon: "Bir önerme seçin ve üç örneği sırayla deneyin. Örnekteki sayılar sayı doğrusunda işaretlenir; önermenin bu örnekte doğru olup olmadığı anında görünür. Bir tek karşı örnek, önermenin her zaman doğru olmadığını gösterir.",
        bitis: "Üç önermenin üçer örneğini de denediğinizde." }); },
    12: el => CN.SIRALA7(el, { arac: "ondalik", basamak0: 1, istenen: "değişimi küçükten büyüğe (grafikteki sıra)",
      ogeler: kartlar([["Ocak", "−12,5"], ["Şubat", "+8,25"], ["Mart", "−12,75"], ["Nisan", "−12,7"]], " kWh"),
      sonuc: L => `Grafikteki sıra: ${L.map(x => x.ad).join(", ")}.`, yon: SIRA.yon("değişim küçükten büyüğe doğru"), bitis: SIRA.bitis }),
    13: el => { const E = { "−3/4": -0.3, "0,6": 0.6, "−0,2": -0.2, "1/3": 1 / 3 }, S = Object.keys(E);
      return CN.KOSUL(el, { girdi: [{ ad: "Sayı:", sec: S, bas: "0,6" }], dugme: false,
        ciz: v => { const x = n(v[0]), a = Math.floor(x * 5) / 5, b = a + 0.2;
          return CN.dogru7({ min: -1, max: 1, adim: 0.2, et: y => yz(Math.abs(y) < 1e-9 ? 0 : y), bant: [a, Math.min(1, b)],
            isaret: [{ v: E[v[0]], et: "Ece", renk: "#e8590c" }], nokta: { v: x, et: v[0], renk: "#2b8a3e" }, ad: "Ece'nin sayı doğrusu" }) +
            `<div class="sb7-not">Turuncu çizgi: Ece'nin koyduğu yer. Yeşil nokta: ${v[0]} = ${CN.acilim7(oku(v[0]), 2)} sayısının gerçek yeri.</div>`; },
        kosullar: [{ ad: v => `Ece'nin işareti, ${v[0]} sayısının bulunduğu parçada (yeşil bölge)`, f: v => { const x = n(v[0]), e = E[v[0]]; return Math.abs(e - x) < 0.2 && Math.floor(e * 5 + 1e-9) === Math.floor(x * 5 + 1e-9) || Math.abs(e - x) < 1e-9; } }],
        sutun: ["Sayı", "Ondalık", "Ece'nin yeri doğru mu?"], satir: (v, ok) => [v[0], CN.acilim7(oku(v[0]), 2), ok ? "doğru ✔" : "yanlış ✘"],
        yon: "Sayıları sırayla seçin. Ece'nin koyduğu yer turuncu çizgiyle, sayının gerçek yeri yeşil noktayla gösterilir. İkisinin aynı parçada olup olmadığını deftere yazın.",
        bitis: "Dört sayıyı da denediğinizde." }); },
    14: el => CN.SIRALA7(el, { arac: "ondalik", basamak0: 1, istenen: "uzunluğu en kısadan en uzuna",
      ogeler: kartlar([["Mavi kumaş", "2 3/8"], ["Yeşil kumaş", "2,4"], ["Gri kumaş", "2 1/3"], ["Krem kumaş", "2,35"]], " m"),
      sonuc: L => `Yelek: <b>${L[0].ad}</b>, pardösü: <b>${L[3].ad}</b>.`, yon: SIRA.yon("uzunluğu en kısa olandan en uzun olana doğru"), bitis: SIRA.bitis }),
    15: el => CN.SIRALA7(el, { arac: "ondalik", basamak0: 1, buyukten: true, istenen: "gözlük takanların sınıf mevcudunun kaçta kaçı olduğu büyükten küçüğe",
      ogeler: [["7-A", 18, 5], ["7-B", 22, 6], ["7-C", 28, 8], ["7-D", 30, 8]].map(([a, m, g]) => ({ ad: a, html: `<span class="c7-deg">${g}/${m}</span> <span class="cn-not">(${m} öğrenciden ${g} kişi)</span>`, deger: oku(`${g}/${m}`) })),
      sonuc: L => `Kesri en büyük sınıf: <b>${L[0].ad}</b>.`, yon: SIRA.yon("gözlük takanların kesri büyükten küçüğe doğru"), bitis: SIRA.bitis }),
    16: el => { const D = { Kaan: [9, 7], Mert: [10, 8], Emre: [14, 11], Ozan: [19, 15] }, A = Object.keys(D);
      const IK = { Kaan: "Kaan'ın", Mert: "Mert'in", Emre: "Emre'nin", Ozan: "Ozan'ın" };
      const eks = k => { const [t, g] = D[k]; return { p: t - g, q: t }; };
      return CN.KOSUL(el, { girdi: [{ ad: "1. oyuncu:", sec: A, bas: "Kaan" }, { ad: "2. oyuncu:", sec: A, bas: "Mert" }], dugme: false,
        ciz: v => v.map(k => { const [t, g] = D[k], e = eks(k), c = 12 / e.p; return `<div class="sb7-not"><b>${k}</b>: başarı ${g}/${t}, 1'den eksiği ${e.p}/${t} = ${12}/${t * c}</div>` + serit(t, g, "#74c0fc"); }).join(""),
        kosullar: [{ ad: v => v[0] === v[1] ? "Aynı oyuncu seçildi." : `${IK[v[0]]} başarısı ${IK[v[1]]} başarısından düşük`,
          f: v => v[0] !== v[1] && kars({ p: D[v[0]][1], q: D[v[0]][0] }, { p: D[v[1]][1], q: D[v[1]][0] }) < 0 }],
        sutun: ["1. oyuncu", "2. oyuncu", "1.'nin başarısı daha düşük mü?"], satir: (v, ok) => [v[0], v[1], v[0] === v[1] ? "—" : ok ? "evet" : "hayır"],
        iyi: (v, L) => v[0] === v[1] ? null : L[0].ok,
        yon: "İki oyuncu seçin. Oyuncuların gol şeritleri ve başarı kesirlerinin 1'den eksik kısmı (payları 12'de eşitlenmiş) gösterilir; hangisinin başarısının düşük olduğu anında görünür. Oyuncuları ikişer ikişer karşılaştırıp sıralamayı defterden kurun.",
        bitis: "Her oyuncuyu en az bir kez karşılaştırıp sıralamayı bulduğunuzda." }); },
  };
})();

<script>
const V={"baslik": "Rasyonel Sayılarda Karşılaştırma ve Sıralama · Soru Bankası", "kod": "7. SINIF · MAT.7.1.3 · SORU BANKASI", "ses": "", "bet": "YENİ NESİL SORU", "bad": "Yeni Nesil Sorular", "s": [], "k": [], "b": [{"no": 1, "on": "<p>Kutuplarda çalışan bir araştırma ekibi, dört ölçüm istasyonundaki hava sıcaklığını aynı anda ölçmüştür. Ölçüm sonuçları ekibin bilgisayar ekranında aşağıdaki gibi görünmektedir.</p>", "g": "<svg viewBox=\"0 0 690 232\" width=\"690\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"110.0\" y=\"4.0\" width=\"470.0\" height=\"222.0\" rx=\"12\" fill=\"#1d2433\" stroke=\"#0b0f17\" stroke-width=\"3\"/><rect x=\"124.0\" y=\"16.0\" width=\"442.0\" height=\"198.0\" rx=\"6\" fill=\"#f8fbff\" stroke=\"none\" stroke-width=\"0\"/><text x=\"345.0\" y=\"42.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#128a5a\" text-anchor=\"middle\">İSTASYONLARDA ANLIK SICAKLIK</text><line x1=\"144.0\" y1=\"54.0\" x2=\"546.0\" y2=\"54.0\" stroke=\"#ced4da\" stroke-width=\"1.2\"/><text x=\"160.0\" y=\"86.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Kuzey</text><text x=\"530.0\" y=\"86.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"17\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"end\">−12,5 °C</text><text x=\"160.0\" y=\"124.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Buzul</text><text x=\"530.0\" y=\"124.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"17\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"end\">−12,375 °C</text><text x=\"160.0\" y=\"162.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Fiyort</text><text x=\"530.0\" y=\"162.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"17\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"end\">−12,45 °C</text><text x=\"160.0\" y=\"200.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"16\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"start\">Kar</text><text x=\"530.0\" y=\"200.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"17\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"end\">−12,4 °C</text></svg>", "son": "<p>Ekrandaki sıcaklıklar dijital termometrelerden alınmıştır; termometreler ölçümü farklı sayıda ondalık basamakla göstermektedir.</p>", "k": "Buna göre, sıcaklığın <u>en yüksek</u> olduğu istasyon hangisidir?", "sec": ["Kuzey", "Buzul", "Fiyort", "Kar"], "secg": null, "c": "B", "a": ["Sıcaklıklar aynı sayıda ondalık basamakla yazılır: −12,500; −12,375; −12,450; −12,400.", "Negatif sayılarda 0'a en yakın olan en büyüktür. Pozitif hâlleri <span class=\"nw\">12,375 &lt; 12,400 &lt; 12,450 &lt; 12,500</span>'dür.", "En yüksek sıcaklık −12,375 °C ile Buzul istasyonundadır."], "t": "Kuzey: basamak sayısı az olan sayının büyük olduğu sanılmış; Fiyort ve Kar: negatif sayılarda sıranın tersine döndüğü unutulmuş.", "d": "Ondalık basamak sayısı farklı olan sayıları karşılaştırmadan önce sonlarına 0 ekleyerek basamak sayılarını eşitleyin. Negatif sayılarda 0'a en yakın olan en büyüktür; basamağı az olan sayı büyük sanılmamalıdır.", "ses": "b01"}, {"no": 2, "on": "<p>Uzun atlamada sporcunun ayağı, basma tahtasındaki çizgiyi geçerse atlayış faul sayılmaktadır. Hakem, dört sporcunun basış noktalarının çizgiye göre konumunu santimetre cinsinden tabloya yazmıştır. Çizgiyi geçmeyen basışlar pozitif, çizgiyi geçen basışlar negatif sayıyla gösterilmiştir.</p>", "g": "<div><p style=\"text-align:center;margin:0 0 1mm\"><b>Tablo:</b> Basış Noktalarının Çizgiye Göre Konumu</p><table style=\"border-collapse:collapse;font-size:10.5pt;margin:0 auto;\"><thead><tr><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Sporcu</th><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Konum (cm)</th></tr></thead><tbody><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Ali</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">0,8</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Berk</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">−0,1</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Cem</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">0,35</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Deniz</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">0,4</td></tr></tbody></table></div>", "son": "<p>Antrenör, faul yapmayan sporcular arasından çizgiye en yakın basan sporcuyu tebrik edecektir.</p>", "k": "Buna göre, antrenörün tebrik edeceği sporcu kimdir?", "sec": ["Ali", "Berk", "Cem", "Deniz"], "secg": null, "c": "C", "a": ["Berk'in konumu −0,1 cm'dir; çizgiyi geçmiştir, atlayışı faul sayılır.", "Diğer sporcuların çizgiye uzaklıkları 0,8 cm; 0,35 cm; 0,4 cm'dir. Bunlar iki ondalık basamakla karşılaştırılır: <span class=\"nw\">0,35 &lt; 0,40 &lt; 0,80</span>.", "Çizgiye en yakın basan, faul yapmamış sporcu Cem'dir."], "t": "Berk: çizgiye en yakın olduğu için seçilmiş ama faul yapmıştır; Deniz: 0,4, 0,35'ten küçük sanılmış; Ali: en büyük sayı seçilmiş.", "d": "Önce koşulu sağlamayanları ayırın: negatif konum çizgiyi geçmek, yani faul demektir. Çizgiye en yakın sporcu, faul yapmayanlar arasında aranır.", "ses": "b02"}, {"no": 3, "on": "<p>Bir pikniğe dört sürahi limonata hazırlanmıştır. Her sürahinin kaç bardak aldığı ve içine kaç bardak limon suyu konduğu sürahilerin önündeki kartlarda yazılıdır. Sürahilerin geri kalanı su ve şekerli karışımla doldurulmuştur.</p>", "g": "<svg viewBox=\"0 0 690 256\" width=\"690\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><path d=\"M60,3 \" width=\"7.0\" height=\"20.0\" rx=\"2\" fill=\"#ffffff\" stroke=\"#495057\" stroke-width=\"0.8\"/><rect x=\"628.0\" y=\"99.0\" width=\"7.0\" height=\"20.0\" rx=\"2\" fill=\"#ffffff\" stroke=\"#495057\" stroke-width=\"0.8\"/><rect x=\"637.0\" y=\"99.0\" width=\"7.0\" height=\"20.0\" rx=\"2\" fill=\"#ffffff\" stroke=\"#495057\" stroke-width=\"0.8\"/><text x=\"592.0\" y=\"162.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#000000\" text-anchor=\"middle\">D feneri</text></svg>", "son": "<p>Fenerlerin dördü de tam dolu iken aynı süre çalışmaktadır. Göstergedeki dolu kısım, fenerin kalan şarjının tam şarjın kaçta kaçı olduğunu göstermektedir.</p>", "k": "Buna göre, kalan şarjı <u>en az</u> olan fener hangisidir?", "sec": ["A", "B", "C", "D"], "secg": null, "c": "A", "a": ["Göstergeler kesir olarak okunur: A <span class=\"nw\"><span class=\"frac\"><span>6</span><span>11</span></span></span>, B <span class=\"nw\"><span class=\"frac\"><span>4</span><span>7</span></span></span>, C <span class=\"nw\"><span class=\"frac\"><span>5</span><span>9</span></span></span>, D <span class=\"nw\"><span class=\"frac\"><span>7</span><span>12</span></span></span>.", "Kesirler <span class=\"nw\"><span class=\"frac\"><span>1</span><span>2</span></span></span>'ye göre karşılaştırılır; dördü de <span class=\"nw\"><span class=\"frac\"><span>1</span><span>2</span></span></span>'den büyüktür. <span class=\"nw\"><span class=\"frac\"><span>1</span><span>2</span></span></span>'den fazlaları: <span class=\"nw\"><span class=\"frac\"><span>6</span><span>11</span></span></span> için <span class=\"nw\"><span class=\"frac\"><span>1</span><span>22</span></span></span>, <span class=\"nw\"><span class=\"frac\"><span>4</span><span>7</span></span></span> için <span class=\"nw\"><span class=\"frac\"><span>1</span><span>14</span></span></span>, <span class=\"nw\"><span class=\"frac\"><span>5</span><span>9</span></span></span> için <span class=\"nw\"><span class=\"frac\"><span>1</span><span>18</span></span></span>, <span class=\"nw\"><span class=\"frac\"><span>7</span><span>12</span></span></span> için <span class=\"nw\"><span class=\"frac\"><span>1</span><span>12</span></span></span>.", "<span class=\"nw\"><span class=\"frac\"><span>1</span><span>2</span></span></span>'den fazlası en küçük olan <span class=\"nw\"><span class=\"frac\"><span>6</span><span>11</span></span></span>'dir; kalan şarjı en az olan fener A'dır."], "t": "C: bölme sayısı az olan fenerin şarjı az sanılmış; D: dolu bölme sayısı en çok olduğu için şarjı en çok sanılmış; B: kesirler karşılaştırılmamış.", "d": "Göstergeler farklı sayıda bölmeye ayrıldığı için dolu bölme sayıları doğrudan karşılaştırılamaz. Kesirler 1/2'ye yakınsa her birinin 1/2'den ne kadar fazla olduğunu bulun.", "ses": "b04"}, {"no": 5, "on": "<p>Bir öğretmen, öğrencilerinden dün akşam proje ödevine kaç saat çalıştıklarını defterlerine yazmalarını istemiştir. Dört öğrencinin yazdıkları aşağıda verilmiştir.</p>", "g": "<div style=\"max-width:120mm;margin:0 auto;background:#fffdf2;border:.35mm solid #c9b48a;border-radius:2mm;padding:2mm 4mm 3mm;border-left:1.2mm solid #f4a6a6\"><div style=\"font-weight:700;text-align:center;margin-bottom:1mm\">Proje ödevine çalışma süresi</div><div style=\"border-bottom:.3mm solid #cfd8e8;padding:1.4mm 0 1.2mm 6mm\">Ece: 3/4 saat</div><div style=\"border-bottom:.3mm solid #cfd8e8;padding:1.4mm 0 1.2mm 6mm\">Can: 0,7 saat</div><div style=\"border-bottom:.3mm solid #cfd8e8;padding:1.4mm 0 1.2mm 6mm\">Su: 5/6 saat</div><div style=\"border-bottom:.3mm solid #cfd8e8;padding:1.4mm 0 1.2mm 6mm\">Ali: 0,8 saat</div></div>", "son": "<p>Öğretmen, en uzun ve en kısa süre çalışan öğrencilerle ödev hakkında konuşacaktır.</p>", "k": "Buna göre, en uzun ve en kısa süre çalışan öğrenciler sırasıyla aşağıdakilerin hangisinde verilmiştir?", "sec": ["Su ve Can", "Ali ve Can", "Su ve Ece", "Ali ve Ece"], "secg": null, "c": "A", "a": ["Süreler ondalık gösterimle yazılır: <span class=\"nw\"><span class=\"frac\"><span>3</span><span>4</span></span></span> = 0,75; <span class=\"nw\"><span class=\"frac\"><span>5</span><span>6</span></span></span> = 0,833…; 0,7 ve 0,8.", "Sıralama <span class=\"nw\">0,7 &lt; 0,75 &lt; 0,8 &lt; 0,833</span>…'tür.", "En uzun süre çalışan Su (<span class=\"nw\"><span class=\"frac\"><span>5</span><span>6</span></span></span> saat), en kısa süre çalışan Can'dır (0,7 saat)."], "t": "Ali: 0,8 ile <span class=\"nw\"><span class=\"frac\"><span>5</span><span>6</span></span></span> karşılaştırılırken <span class=\"nw\"><span class=\"frac\"><span>5</span><span>6</span></span></span>'nın 0,8'den büyük olduğu fark edilmemiş; Ece: <span class=\"nw\"><span class=\"frac\"><span>3</span><span>4</span></span></span>, 0,7'den küçük sanılmış.", "d": "Kesirleri ondalık gösterime çevirirken devirli olanları en az üç basamak açın: 5/6 = 0,833… sayısı 0,8'den büyüktür. İki uç değeri birlikte, sırasıyla yazmayı unutmayın.", "ses": "b05"}, {"no": 6, "on": "<p>Bir lunaparktaki hız treni, bir bölümde yerin altındaki bir tünelden geçmektedir. Tünel içindeki dört noktanın yer seviyesine göre konumları, teknik planda metre cinsinden aşağıdaki tabloda verilmiştir. Yer seviyesi 0 kabul edilmiş, yerin altındaki konumlar negatif sayılarla gösterilmiştir.</p>", "g": "<div><p style=\"text-align:center;margin:0 0 1mm\"><b>Tablo:</b> Tünel Noktalarının Konumu</p><table style=\"border-collapse:collapse;font-size:10.5pt;margin:0 auto;\"><thead><tr><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Nokta</th><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Konum (m)</th></tr></thead><tbody><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">K</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">−1,25</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">L</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">−1,3</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">M</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">−0,84</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">N</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">−1,05</td></tr></tbody></table></div>", "son": "<p>Bakım ekibi, tünelin en derin noktasına bir su pompası yerleştirecektir.</p>", "k": "Buna göre, su pompası hangi noktaya yerleştirilecektir?", "sec": ["K", "L", "M", "N"], "secg": null, "c": "B", "a": ["En derin nokta, konumu en küçük olan noktadır.", "Konumlar iki ondalık basamakla yazılır: −1,25; −1,30; −0,84; −1,05. Pozitif hâllerinin en büyüğü 1,30'dur.", "En küçük konum −1,3 m'dir; pompa L noktasına yerleştirilir."], "t": "K: −1,25'in iki ondalık basamağı olduğu için daha küçük sanılmış; M: rakamları büyük (84) olduğu için en derin sanılmış; N: 1,05 ile 1,5 karıştırılmış.", "d": "En derin nokta konumu en küçük olan noktadır. −1,3 ile −1,25 karşılaştırılırken basamaklar eşitlenir: −1,30 &lt; −1,25. Rakamları büyük olan ondalık kısım (84) sayıyı küçültmez.", "ses": "b06"}, {"no": 7, "on": "<p>Dört arkadaş, ay sonuna kadar kumbaralarında belirli bir miktar para biriktirmeyi hedeflemiştir. Ay sonunda her birinin kumbarasındaki paranın hedefe göre durumu aşağıdaki tabloda TL cinsinden verilmiştir. Hedefi aşanlar pozitif, hedefe ulaşamayanlar negatif sayıyla gösterilmiştir.</p>", "g": "<div><p style=\"text-align:center;margin:0 0 1mm\"><b>Tablo:</b> Kumbaraların Hedefe Göre Durumu</p><table style=\"border-collapse:collapse;font-size:10.5pt;margin:0 auto;\"><thead><tr><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Arkadaş</th><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Durum (TL)</th></tr></thead><tbody><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Ece</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">−12,5</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Can</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">+8,25</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Su</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">−12,75</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Ali</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">−2,5</td></tr></tbody></table></div>", "son": "<p>Hedefine ulaşmak için en fazla paraya ihtiyacı olan arkadaşa diğerleri yardım edecektir.</p>", "k": "Buna göre, yardım edilecek arkadaş kimdir?", "sec": ["Ece", "Can", "Su", "Ali"], "secg": null, "c": "C", "a": ["Hedefe ulaşamayanlar negatif sayıyla gösterilmiştir: Ece −12,5; Su −12,75; Ali −2,5.", "En fazla paraya ihtiyacı olan, durumu en küçük sayı olan arkadaştır: <span class=\"nw\">−12,75 &lt; −12,50 &lt; −2,5</span>.", "Yardım edilecek arkadaş Su'dur."], "t": "Ece: 12,5'in 12,75'ten büyük olduğu sanılmış; Can: en büyük sayı seçilmiş, oysa Can hedefini aşmıştır; Ali: tam kısımları farklı sayılarda yanılınmış.", "d": "Hedefi aşanlar pozitif sayıyla gösterilir, onların yardıma ihtiyacı yoktur. Negatif sayılar arasında en küçük olan, hedefe en uzak olandır: −12,75 &lt; −12,5.", "ses": "b07"}, {"no": 8, "on": "<p>Bir tarım kooperatifi, bu yıl tarlasının hangi kısmına hangi ürünü ekeceğini bir planla belirlemiştir. Plandaki bilgiler aşağıda verilmiştir.</p>", "g": "<div><p style=\"text-align:center;margin:0 0 1mm\"><b>Tablo:</b> Kooperatifin Ekim Planı</p><table style=\"border-collapse:collapse;font-size:10.5pt;margin:0 auto;\"><thead><tr><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Ürün</th><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Tarlanın ekilecek kısmı</th></tr></thead><tbody><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Buğday</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">4/11</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Arpa</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">3/8</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Mısır</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">5/14</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Nohut</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">1/7</td></tr></tbody></table></div>", "son": "<p>Kooperatif, ürünler için alacağı tohumları, ayrılan alan büyükten küçüğe olacak şekilde sırayla sipariş edecektir.</p>", "k": "Buna göre, tohum sipariş sırası aşağıdakilerden hangisidir?", "sec": ["Buğday, Arpa, Mısır, Nohut", "Mısır, Buğday, Arpa, Nohut", "Arpa, Mısır, Buğday, Nohut", "Arpa, Buğday, Mısır, Nohut"], "secg": null, "c": "D", "a": ["Kesirler ondalık gösterime çevrilir: <span class=\"nw\"><span class=\"frac\"><span>4</span><span>11</span></span></span> = 0,3636…; <span class=\"nw\"><span class=\"frac\"><span>3</span><span>8</span></span></span> = 0,375; <span class=\"nw\"><span class=\"frac\"><span>5</span><span>14</span></span></span> = 0,357…; <span class=\"nw\"><span class=\"frac\"><span>1</span><span>7</span></span></span> = 0,142…", "Büyükten küçüğe sıralama: <span class=\"nw\">0,375 &gt; 0,3636</span>… &gt; 0,357… &gt; 0,142…", "Sipariş sırası Arpa, Buğday, Mısır, Nohut'tur."], "t": "Buğday ile başlayan: payı büyük olan kesrin büyük olduğu sanılmış; Mısır ile başlayan: paydası en büyük kesrin en büyük olduğu sanılmış; Arpa, Mısır, …: <span class=\"nw\"><span class=\"frac\"><span>5</span><span>14</span></span></span> ile <span class=\"nw\"><span class=\"frac\"><span>4</span><span>11</span></span></span> karıştırılmış.", "d": "Paydası büyük ya da payı büyük olan kesir her zaman büyük değildir. Kesirleri ondalık gösterime çevirin ya da ortak paydada yazın; sipariş büyükten küçüğe yapılacaktır.", "ses": "b08"}, {"no": 9, "on": "<p>Fen dersinde dört öğrenci, gerçek uzunluğu 50 cm olan bir masanın kenarını ölçmüştür. Öğretmen, her öğrencinin ölçümünün gerçek uzunluktan farkını tahtaya yazmıştır. Gerçek uzunluktan fazla ölçümler pozitif, eksik ölçümler negatif sayıyla gösterilmiştir.</p>", "g": "<div><p style=\"text-align:center;margin:0 0 1mm\"><b>Tablo:</b> Ölçümlerin Gerçek Uzunluktan Farkı</p><table style=\"border-collapse:collapse;font-size:10.5pt;margin:0 auto;\"><thead><tr><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Öğrenci</th><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Fark (cm)</th></tr></thead><tbody><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Su</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">+0,2</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Ece</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">+0,3</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Can</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">−0,25</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Ali</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">−0,23</td></tr></tbody></table></div>", "son": "<p>Ölçümü gerçek uzunluğa en yakın olan öğrenci, ölçümün en doğru yapıldığı öğrencidir.</p>", "k": "Buna göre, ölçümü en doğru yapan öğrenci kimdir?", "sec": ["Ece", "Can", "Su", "Ali"], "secg": null, "c": "C", "a": ["Gerçek uzunluğa en yakın ölçüm, farkı sayı doğrusunda 0'a en yakın olan ölçümdür; işarete bakılmadan uzaklıklar karşılaştırılır.", "Uzaklıklar 0,20; 0,30; 0,25; 0,23 cm'dir. En küçüğü 0,20'dir.", "Ölçümü en doğru yapan Su'dur."], "t": "Can: en küçük sayı (−0,25) seçilmiş; Ali: negatif farkların 0'a yakın olduğu sanılmış; Ece: en büyük sayı seçilmiş.", "d": "Gerçek uzunluğa en yakın ölçüm, farkı 0'a en yakın olandır. İşarete bakmadan uzaklıkları karşılaştırın: en küçük sayı ya da en büyük sayı değil, 0'a en yakın sayı aranır.", "ses": "b09"}, {"no": 10, "on": "<p>Bir şehirdeki tren hattında merkez istasyonun konumu 0 kabul edilmiştir. Merkez istasyonun batısındaki istasyonların konumları negatif, doğusundakilerin konumları pozitif sayılarla kilometre cinsinden gösterilmiştir. Hattaki dört istasyon aşağıdaki planda gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 640 138\" width=\"640\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><line x1=\"26.0\" y1=\"92.0\" x2=\"614.0\" y2=\"92.0\" stroke=\"#495057\" stroke-width=\"5\"/><line x1=\"26.0\" y1=\"92.0\" x2=\"614.0\" y2=\"92.0\" stroke=\"#ffffff\" stroke-width=\"1.4\" stroke-dasharray=\"8 8\"/><rect x=\"55.9\" y=\"83.0\" width=\"18.0\" height=\"18.0\" rx=\"3\" fill=\"#ffffff\" stroke=\"#000000\" stroke-width=\"2\"/><rect x=\"26.9\" y=\"28.0\" width=\"76.0\" height=\"40.0\" rx=\"6\" fill=\"#ffffff\" stroke=\"#1c5fbf\" stroke-width=\"1.6\"/><text x=\"64.9\" y=\"45.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#1c5fbf\" text-anchor=\"middle\">K</text><text x=\"64.9\" y=\"62.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">−2,3 km</text><rect x=\"143.0\" y=\"83.0\" width=\"18.0\" height=\"18.0\" rx=\"3\" fill=\"#ffffff\" stroke=\"#000000\" stroke-width=\"2\"/><rect x=\"114.0\" y=\"28.0\" width=\"76.0\" height=\"40.0\" rx=\"6\" fill=\"#ffffff\" stroke=\"#1c5fbf\" stroke-width=\"1.6\"/><text x=\"152.0\" y=\"45.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#1c5fbf\" text-anchor=\"middle\">L</text><text x=\"152.0\" y=\"62.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">−1,6 km</text><rect x=\"435.4\" y=\"83.0\" width=\"18.0\" height=\"18.0\" rx=\"3\" fill=\"#ffffff\" stroke=\"#000000\" stroke-width=\"2\"/><rect x=\"406.4\" y=\"28.0\" width=\"76.0\" height=\"40.0\" rx=\"6\" fill=\"#ffffff\" stroke=\"#1c5fbf\" stroke-width=\"1.6\"/><text x=\"444.4\" y=\"45.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#1c5fbf\" text-anchor=\"middle\">M</text><text x=\"444.4\" y=\"62.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">0,75 km</text><rect x=\"541.2\" y=\"83.0\" width=\"18.0\" height=\"18.0\" rx=\"3\" fill=\"#ffffff\" stroke=\"#000000\" stroke-width=\"2\"/><rect x=\"512.2\" y=\"28.0\" width=\"76.0\" height=\"40.0\" rx=\"6\" fill=\"#ffffff\" stroke=\"#1c5fbf\" stroke-width=\"1.6\"/><text x=\"550.2\" y=\"45.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#1c5fbf\" text-anchor=\"middle\">N</text><text x=\"550.2\" y=\"62.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"12.5\" font-weight=\"700\" fill=\"#000000\" text-anchor=\"middle\">1,6 km</text><text x=\"40.0\" y=\"126.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#5c6370\" text-anchor=\"start\">Batı</text><text x=\"600.0\" y=\"126.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#5c6370\" text-anchor=\"end\">Doğu</text></svg>", "son": "<p>Hatta yeni bir istasyon yapılacaktır. Yeni istasyon, konumu <span class=\"nw\">−1<span class=\"frac\"><span>3</span><span>4</span></span></span> km olan noktanın doğusunda ve L istasyonunun batısında olacaktır.</p>", "k": "Buna göre, yeni istasyonun konumu kaç kilometre olabilir?", "sec": ["−1,8", "−1,7", "−1,55", "−1,85"], "secg": null, "c": "B", "a": ["<span class=\"nw\">−1<span class=\"frac\"><span>3</span><span>4</span></span></span> = −1,75'tir. L istasyonunun konumu −1,6 km'dir. Yeni istasyon −1,75 ile −1,6 arasında olmalıdır.", "Doğuda olmak sağda, yani daha büyük olmak demektir: −1,75 &lt; konum &lt; −1,6.", "<span class=\"nw\">−1,75 &lt; −1,70 &lt; −1,60</span> olduğundan yeni istasyon −1,7 km'de olabilir."], "t": "−1,8 ve −1,85: −1,75'in batısında kalır; −1,55: L'nin doğusunda kalır.", "d": "Doğu sağ, batı soldur; sağdaki sayı daha büyüktür. Önce −1 3/4'ü ondalık gösterimle yazın (−1,75), sonra iki sınırın arasında kalan konumu arayın.", "ses": "b10"}, {"no": 11, "on": "<p>Bir bilim şenliğindeki “Kesir Dedektifleri” standında üç öğrenci, rasyonel sayılarla ilgili birer önerme yazmıştır.</p>", "g": "<svg viewBox=\"0 0 690 86\" width=\"690\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"150.0\" y=\"8.0\" width=\"390.0\" height=\"70.0\" rx=\"10\" fill=\"#eaf7f1\" stroke=\"#128a5a\" stroke-width=\"2\"/><text x=\"345.0\" y=\"40.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"20\" font-weight=\"800\" fill=\"#128a5a\" text-anchor=\"middle\">KESİR DEDEKTİFLERİ</text><text x=\"345.0\" y=\"64.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13\" font-weight=\"700\" fill=\"#5c6370\" text-anchor=\"middle\">Önermeyi sayılarla sınayın!</text></svg>", "son": "<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:2.6mm;margin:1mm 0 .5mm\"><div style=\"border:.45mm solid #1c5fbf;border-radius:3.2mm;padding:1.8mm 2.6mm;background:#fff\"><b style=\"color:#1c5fbf\">Ada:</b> “İki negatif kesirden paydası büyük olan her zaman daha büyüktür.”</div><div style=\"border:.45mm solid #d9480f;border-radius:3.2mm;padding:1.8mm 2.6mm;background:#fff\"><b style=\"color:#d9480f\">Bora:</b> “0 ile 1 arasındaki iki kesirden sayı doğrusunda 1'e daha yakın olan daha büyüktür.”</div><div style=\"border:.45mm solid #2b8a3e;border-radius:3.2mm;padding:1.8mm 2.6mm;background:#fff\"><b style=\"color:#2b8a3e\">Cansu:</b> “Her rasyonel sayının sayı doğrusunda solunda en az bir tam sayı vardır.”</div></div>", "k": "Buna göre, hangi öğrencilerin önermesi her zaman doğrudur?", "sec": ["Bora ve Cansu", "Yalnız Bora", "Ada ve Bora", "Ada ve Cansu"], "secg": null, "c": "A", "a": ["Ada: <span class=\"nw\">−<span class=\"frac\"><span>3</span><span>4</span></span></span> ile <span class=\"nw\">−<span class=\"frac\"><span>1</span><span>3</span></span></span> karşılaştırılırsa paydası büyük olan <span class=\"nw\">−<span class=\"frac\"><span>3</span><span>4</span></span></span>'tür ama <span class=\"nw\"><span class=\"nw\">−<span class=\"frac\"><span>3</span><span>4</span></span></span> &lt; <span class=\"nw\">−<span class=\"frac\"><span>1</span><span>3</span></span></span></span>'tür. Bir karşı örnek bulunduğu için önerme her zaman doğru değildir.", "Bora: 0 ile 1 arasında, 1'e daha yakın olan nokta daha sağdadır; sağdaki sayı daha büyüktür. Önerme her zaman doğrudur.", "Cansu: Hangi rasyonel sayı seçilirse seçilsin (ör. <span class=\"nw\">−<span class=\"frac\"><span>2</span><span>3</span></span></span> için −1, <span class=\"nw\"><span class=\"frac\"><span>5</span><span>7</span></span></span> için 0), sayı doğrusunda solunda bir tam sayı bulunur. Önerme her zaman doğrudur."], "t": "Ada'yı doğru kabul eden seçenekler: payları eşit negatif kesirlerdeki durum her negatif kesre genellenmiş; Yalnız Bora: negatif sayıların solunda tam sayı olmadığı sanılmış.", "d": "“Her zaman doğrudur” denen bir önerme için tek karşı örnek, önermenin yanlış olduğunu göstermeye yeter. Önermeyi birkaç farklı örnekle, özellikle payları farklı kesirlerle sınayın.", "ses": "b11"}, {"no": 12, "on": "<p>Bir ailenin elektrik faturalarında, her ay tüketilen elektriğin bir önceki aya göre değişimi kilovatsaat (kWh) cinsinden yazılmaktadır. Artış pozitif, azalış negatif sayıyla gösterilmektedir. Dört aylık değişimler aşağıdaki tabloda verilmiştir.</p>", "g": "<div><p style=\"text-align:center;margin:0 0 1mm\"><b>Tablo:</b> Faturalara Göre Tüketim Değişimi</p><table style=\"border-collapse:collapse;font-size:10.5pt;margin:0 auto;\"><thead><tr><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Ay</th><th style=\"border:1px solid #1f7a8c;background:#e6f4f7;padding:1mm 2.5mm;font-weight:700;color:#000\">Değişim (kWh)</th></tr></thead><tbody><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Ocak</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">−12,5</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Şubat</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">+8,25</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Mart</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">−12,75</td></tr><tr><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">Nisan</td><td style=\"border:1px solid #1f7a8c;padding:1mm 2.5mm;text-align:center\">−12,7</td></tr></tbody></table></div>", "son": "<p>Aile, ayları değişim miktarı küçükten büyüğe olacak şekilde bir grafiğe yerleştirecektir.</p>", "k": "Buna göre, ayların grafikteki sırası aşağıdakilerden hangisidir?", "sec": ["Şubat, Mart, Nisan, Ocak", "Ocak, Nisan, Mart, Şubat", "Mart, Ocak, Nisan, Şubat", "Mart, Nisan, Ocak, Şubat"], "secg": null, "c": "D", "a": ["Değişimler iki ondalık basamakla yazılır: −12,50; +8,25; −12,75; −12,70.", "Negatif sayılar pozitiften küçüktür; negatiflerde 0'dan uzak olan daha küçüktür: <span class=\"nw\">−12,75 &lt; −12,70 &lt; −12,50 &lt; 8,25</span>.", "Sıra Mart, Nisan, Ocak, Şubat'tır."], "t": "Ocak, Nisan, …: negatif sayılar pozitif gibi sıralanmış; Mart, Ocak, Nisan, …: −12,7 ile −12,5 ka     k.querySelectorAll("ol.sec li").forEach(li=>{if(li.dataset.h===s.c)li.classList.add("dogru");});
    if(s.t){const t=document.createElement("p");t.className="tuzak";t.innerHTML="<b>Diğer seçenekler neden yanlış?</b> "+s.t;w.appendChild(t);}});
