rif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2</text><text x=\"365.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">3</text><text x=\"431.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">6</text><rect x=\"10\" y=\"66\" width=\"454\" height=\"34\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"105.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Ödenen tutar (TL)</text><text x=\"233.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">18</text><text x=\"299.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">36</text><text x=\"365.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">36</text><text x=\"431.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">72</text><line x1=\"200\" y1=\"30\" x2=\"200\" y2=\"100\" stroke=\"#495057\" stroke-width=\"1\"/><line x1=\"266\" y1=\"30\" x2=\"266\" y2=\"100\" stroke=\"#495057\" stroke-width=\"1\"/><line x1=\"332\" y1=\"30\" x2=\"332\" y2=\"100\" stroke=\"#495057\" stroke-width=\"1\"/><line x1=\"398\" y1=\"30\" x2=\"398\" y2=\"100\" stroke=\"#495057\" stroke-width=\"1\"/></svg>", "son": "", "k": "Buna göre, aşağıdakilerden hangisi doğrudur?", "sec": ["Ayran sayısı ile tutar orantılı değildir; çünkü 3 ayranın tutarı 1 ayranın tutarının 3 katı değildir.", "Ayran sayısı ile tutar orantılıdır; çünkü 6 ayranın tutarı 3 ayranın tutarının 2 katıdır.", "Ayran sayısı ile tutar ters orantılıdır; çünkü kampanyada ayran başına düşen tutar azalmaktadır.", "Ayran sayısı ile tutar orantılıdır; çünkü ayran sayısı artınca tutar azalmamaktadır."], "secg": null, "c": "A", "a": ["Orantılı olsaydı her satırda tutar : ayran aynı olurdu. 1 ayranda 18, 3 ayranda 36 : 3 = 12'dir.", "Ayran sayısı 1'den 3'e 3 katına çıkmış, tutar 18'den 36'ya 2 katına çıkmıştır.", "Kampanya, tutar ile ayran sayısı arasındaki sabit çarpımsal ilişkiyi bozar."], "t": "6 ve 3 ayran: yalnız iki satıra bakılmış; ters orantı: ayran başı tutarın azalması ters orantı sanılmış, çarpım sabit değildir; azalmama orantı için yeterli sanılmış", "d": "Kampanyada her ayranın ücreti ödenmez; bu yüzden ayran sayısı ile tutarın bölümü değişir. Yalnız iki satıra bakarak karar vermeyiniz.", "ses": "b13"}, {"no": 14, "on": "<p>Bir fotoğrafçı, eni 10 cm, boyu 15 cm olan bir fotoğrafı bozmadan büyütüp eni 24 cm, boyu 40 cm olan bir kâğıda basacaktır. Baskının eni kâğıdın enine, boyu kâğıdın boyuna paralel olacak ve baskı kâğıda sığan <u>en büyük</u> boyutta olacaktır.</p>", "g": "<svg viewBox=\"0 0 456 116\" width=\"456\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"210\" height=\"100\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H210 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"113.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Fotoğraf</text><text x=\"113.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">En: 10 cm</text><text x=\"113.0\" y=\"88.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Boy: 15 cm</text><rect x=\"232\" y=\"8\" width=\"210\" height=\"100\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M232 36 V16 q0 -8 8 -8 H434 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"337.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Baskı kâğıdı</text><text x=\"337.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">En: 24 cm</text><text x=\"337.0\" y=\"88.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Boy: 40 cm</text></svg>", "son": "<p>Fotoğrafın bozulmaması için baskının eni ile boyu, fotoğrafın eni ile boyuyla orantılı olmalıdır.</p>", "k": "Buna göre, baskının boyu kaç santimetredir?", "sec": ["40", "16", "29", "36"], "secg": null, "c": "D", "a": ["Fotoğrafta en : boy = 10 : 15 = 2 : 3'tür; baskıda da en : boy = 2 : 3 olmalıdır.", "Boy 40 cm olsaydı en 40 · 2/3 cm olurdu; bu, 24 cm'den büyüktür, kâğıda sığmaz.", "En 24 cm alınır: 24 = 2 · 12 olduğundan boy 3 · 12 = 36 cm olur; 36 cm kâğıda sığar."], "t": "40: kâğıdın boyu alınmış, en sığmaz; 16: oran ters kullanılmış, 24 · 2/3 hesaplanmış; 29: ene eklenen 14 cm boya da eklenmiş", "d": "Fotoğrafın bozulmaması için baskıda da en : boy = 2 : 3 olmalıdır. Hem enin hem boyun kâğıda sığıp sığmadığını denetleyiniz; boyu kâğıdın boyuna eşit almak eni taşırabilir.", "ses": "b14"}, {"no": 15, "on": "<p>Zeynep'in kumbarasında başlangıçta 30 TL vardır. Zeynep her hafta kumbarasına 15 TL atmaktadır. Kumbaradaki para tabloya yazılmıştır.</p>", "g": "<svg viewBox=\"0 0 490 108\" width=\"490\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><text x=\"245.0\" y=\"18.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Tablo: Haftalara Göre Kumbaradaki Para</text><rect x=\"10\" y=\"30\" width=\"470\" height=\"36\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Hafta</text><text x=\"270.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">0</text><text x=\"330.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">1</text><text x=\"390.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2</text><text x=\"450.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">3</text><rect x=\"10\" y=\"66\" width=\"470\" height=\"34\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"125.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Kumbaradaki para (TL)</text><text x=\"270.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">30</text><text x=\"330.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">45</text><text x=\"390.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">60</text><text x=\"450.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">75</text><line x1=\"240\" y1=\"30\" x2=\"240\" y2=\"100\" stroke=\"#495057\" stroke-width=\"1\"/><line x1=\"300\" y1=\"30\" x2=\"300\" y2=\"100\" stroke=\"#495057\" stroke-width=\"1\"/><line x1=\"360\" y1=\"30\" x2=\"360\" y2=\"100\" stroke=\"#495057\" stroke-width=\"1\"/><line x1=\"420\" y1=\"30\" x2=\"420\" y2=\"100\" stroke=\"#495057\" stroke-width=\"1\"/></svg>", "son": "<b>Ali:</b> “Hafta sayısı ile kumbaradaki para orantılı değildir; çünkü 0. haftada para 0 değildir.”<br><b>Berk:</b> “Hafta sayısı ile kumbaraya o haftaya kadar atılan toplam para doğru orantılıdır.”<br><b>Cem:</b> “Para her hafta aynı miktarda arttığı için hafta sayısı ile kumbaradaki para orantılıdır.”", "k": "Buna göre, hangi öğrencilerin söylediği doğrudur?", "sec": ["Yalnız Ali", "Ali ve Berk", "Ali ve Cem", "Berk ve Cem"], "secg": null, "c": "B", "a": ["Ali haklıdır: 0. haftada kumbarada 30 TL vardır; nicelikler orantılı olsaydı 0 olurdu.", "Berk haklıdır: Atılan para 1. hafta 15, 2. hafta 30, 3. hafta 45 TL'dir; bölüm hep 15'tir.", "Cem yanılmıştır: Düzenli artış orantı için yeterli değildir; 45 : 1 ile 60 : 2 eşit değildir."], "t": "Cem'i içeren seçenekler: eşit artış orantı sanılmış; Yalnız Ali: atılan para ile kumbaradaki para ayırt edilmemiş", "d": "Kumbarada başlangıçta para varsa 0. haftada para 0 olmaz; nicelikler orantılı değildir. Ama kumbaraya atılan toplam para hafta sayısıyla orantılı olabilir.", "ses": "b15"}, {"no": 16, "on": "<p>Bir alışveriş merkezinin yanındaki üç otoparkın ücret tarifesi aşağıdaki kartlarda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 644 116\" width=\"644\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"200\" height=\"100\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H200 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"108.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">A Otoparkı</text><text x=\"108.0\" y=\"76.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Saati: 30 TL</text><rect x=\"220\" y=\"8\" width=\"200\" height=\"100\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M220 36 V16 q0 -8 8 -8 H412 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"320.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">B Otoparkı</text><text x=\"320.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">İlk saat: 50 TL</text><text x=\"320.0\" y=\"88.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Sonraki her saat: 20 TL</text><rect x=\"432\" y=\"8\" width=\"200\" height=\"100\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M432 36 V16 q0 -8 8 -8 H624 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"532.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C Otoparkı</text><text x=\"532.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Günlük: 150 TL</text><text x=\"532.0\" y=\"88.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">(süre fark etmez)</text></svg>", "son": "<p>Otoparklarda kalınan süre tam saattir.</p>", "k": "Buna göre, aşağıdakilerden hangisi <u>kesinlikle</u> doğrudur?", "sec": ["C otoparkında kalınan süre ile ücret ters orantılıdır.", "B otoparkında kalınan süre ile ücret orantılıdır.", "Yalnız A otoparkında kalınan süre ile ücret orantılıdır.", "4 saat kalan bir sürücü en az ücreti C otoparkında öder."], "secg": null, "c": "C", "a": ["A: ücret : süre her zaman 30'dur; orantılıdır.", "B: 1 saat 50 TL, 2 saat 70 TL'dir; 2 katına çıkmaz. C: ücret süreye bağlı değildir; süre · ücret çarpımı da sabit değildir (1 saatte 150, 2 saatte 300).", "4 saat: A 120 TL, B 50 + 3 · 20 = 110 TL, C 150 TL; en az ücret B'de ödenir."], "t": "C için ters orantı: süre artarken saat başına düşen ücretin azalması ters orantı sanılmış; B: düzenli artış orantı sanılmış; C en ucuz: günlük ücret her zaman avantajlı sanılmış", "d": "Her otoparkın ücretini birkaç süre için hesaplayınız. Ücretin değişmemesi ya da saat başına düşen ücretin azalması ters orantı demek değildir.", "ses": "b16"}, {"no": 17, "on": "<p>Bir dokuma atölyesinde alanı 12 m² olan dikdörtgen biçiminde kilimler dokunmaktadır. Kilimlerin eni ile boyu aşağıdaki tabloda verilmiştir.</p>", "g": "<svg viewBox=\"0 0 430 108\" width=\"430\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><text x=\"215.0\" y=\"18.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Tablo: Kilimlerin Eni ve Boyu</text><rect x=\"10\" y=\"30\" width=\"410\" height=\"36\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">En (m)</text><text x=\"175.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2</text><text x=\"245.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">3</text><text x=\"315.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">4</text><text x=\"385.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2,5</text><rect x=\"10\" y=\"66\" width=\"410\" height=\"34\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"75.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Boy (m)</text><text x=\"175.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">6</text><text x=\"245.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">4</text><text x=\"315.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">A</text><text x=\"385.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">B</text><line x1=\"140\" y1=\"30\" x2=\"140\" y2=\"100\" stroke=\"#495057\" stroke-width=\"1\"/><line x1=\"210\" y1=\"30\" x2=\"210\" y2=\"100\" stroke=\"#495057\" stroke-width=\"1\"/><line x1=\"280\" y1=\"30\" x2=\"280\" y2=\"100\" stroke=\"#495057\" stroke-width=\"1\"/><line x1=\"350\" y1=\"30\" x2=\"350\" y2=\"100\" stroke=\"#495057\" stroke-width=\"1\"/></svg>", "son": "<p>Tabloda A ve B harfleri birer sayıyı göstermektedir.</p>", "k": "Buna göre, A + B toplamı kaçtır?", "sec": ["7,8", "9,5", "8,5", "6,4"], "secg": null, "c": "A", "a": ["Alan sabit olduğundan en · boy her kilimde 12'dir; en ile boy ters orantılıdır.", "A = 12 : 4 = 3; B = 12 : 2,5 = 4,8.", "A + B = 3 + 4,8 = 7,8."], "t": "9,5: B, 6,5 bulunmuş (eni 2,5 olan kilim için boy en farkı kadar azaltılmış); 8,5: B, 5,5 sanılmış; 6,4: A, 1,6 ve B, 4,8 alınmış, A için en ile alan karıştırılmış", "d": "En · boy çarpımı alanı verir ve her kilimde 12'dir. Eksik değeri 12'yi bilinen kenara bölerek bulunuz; 2,5'e bölerken dikkatli olunuz.", "ses": "b17"}, {"no": 18, "on": "<p>Bir simitçide eş nitelikteki fırınların her biri saatte 100 simit pişirmektedir. 600 simitlik bir sipariş için fırın sayısına göre pişirme süreleri tabloya yazılmıştır. Sonra simitçiye saatte 150 simit pişiren yeni bir fırın alınmış ve 4 fırın birlikte çalıştırılmıştır.</p>", "g": "<svg viewBox=\"0 0 530 108\" width=\"530\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><text x=\"265.0\" y=\"18.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Tablo: Fırın Sayısı ve Pişirme Süresi</text><rect x=\"10\" y=\"30\" width=\"510\" height=\"36\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Fırın sayısı</text><text x=\"200.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">1</text><text x=\"280.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">2</text><text x=\"360.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">3</text><text x=\"460.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">4</text><rect x=\"10\" y=\"66\" width=\"510\" height=\"34\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"85.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Süre</text><text x=\"200.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">6 sa.</text><text x=\"280.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">3 sa.</text><text x=\"360.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">2 sa.</text><text x=\"460.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\" /* İŞLEM BÖLÜNMEZ (01.10.2026, ANA_KURALLAR §5.x-5)
   Bir işlem (7⁰ = 1, (−4)⁰ = 1, 2/5 · 3 …) satır sonunda asla ikiye bölünmez.
   1) Metinde işlem işaretlerinin (= ≠ + − · : × < > ≤ ≥ ≈) iki yanındaki boşluklar bölünmez boşluğa çevrilir.
   2) Üs (sup/sub), kesir (.frac) ve bunlara bitişik metin tek bir "nowrap" kutuya alınır.
   Virgülden sonraki boşluk bölünebilir kalır; böylece uzun işlem dizileri satırlara işlem işlem dağılır (alt alta).
   Kitap (PDF) ve çevrim içi sayfaların hepsinde aynı betik çalışır. */
(function(){
  const NB=" ";
  const OP="=≠+−·×<>≤≥≈:";  // ":" yalnız iki yanında boşluk varken (düz yazıda iki noktadan önce boşluk olmaz)
  const reOp=new RegExp("[ \\t]+(["+OP+"])[ \\t]+","g");
  // ":" yalnız sayılar arasında bölme işaretidir (düz yazıdaki iki nokta etkilenmez)
  const reBol=/([\d)])[ \t]+:[ \t]+(?=[\d(−])/g;
  const ATOM=el=>el.nodeType===1&&(/^(SUP|SUB)$/.test(el.tagName)||el.classList.contains("frac")||el.classList.contains("kes")||el.classList.contains("krk")||el.classList.contains("nw")||el.classList.contains("nw-islem"));
  const ATLA=/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|SVG|CANVAS|CODE|PRE)$/i;
  function metin(s){return s.replace(reOp,NB+"$1"+NB).replace(reBol,"$1"+NB+":"+NB).replace(/\|\u00a0/g,"|\u2060\u00a0").replace(/([“"(\[])([+−·×:=]) (?=[\d(])/g,"$1$2"+NB);}  // "|" sonrasında satır kırılabilir; WJ ile yapıştırılır (mutlak değer)
  function isle(kok){
    if(!kok||kok.nodeType!==1||ATLA.test(kok.tagName)||kok.closest&&kok.closest("svg,.nw-islem"))return;
    // 1) metin düğümleri
    const w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return !p||p.closest("script,style,textarea,svg,code,pre")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
    const tl=[];while(w.nextNode())tl.push(w.currentNode);
    for(const t of tl){const y=metin(t.data);if(y!==t.data)t.data=y;}
    // 2) atomları bitişik metinle birleştir
    const ebeveyn=new Set();
    kok.querySelectorAll("sup,sub,.frac,.kes,.krk,.nw").forEach(a=>{if(!a.closest("svg,.nw-islem")&&a.parentElement&&!(a.parentElement.classList.contains("frac")||a.parentElement.parentElement&&a.parentElement.parentElement.classList.contains("frac")))ebeveyn.add(a.parentElement);});
    if(ATOM(kok)&&kok.parentElement)ebeveyn.add(kok.parentElement);
    ebeveyn.forEach(yapistir);
    // 3) işaretle başlayan öğeden (<small>= 16</small>) önceki boşluk da bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.previousSibling;if(!o||o.nodeType!==3||!/[ \t\n]+$/.test(o.data))return;
      if(/^[ \t\n]+$/.test(o.data)&&!o.previousSibling)return;
      const t=(el.textContent||"").trimStart();if(t&&"=≠+·×<>≤≥≈:".includes(t[0])&&/^[=≠+·×<>≤≥≈:][ \u00a0]/.test(t))o.data=o.data.replace(/[ \t\n]+$/,NB);});
    // 5) yalnız boşluktan oluşan düğüm: önceki öğe işaretle bitiyorsa ("… 3 ·" + " " + "C = 12") bölünmez
    kok.querySelectorAll("*").forEach(el=>{const o=el.nextSibling;if(!o||o.nodeType!==3||!/^[ \t\n]+$/.test(o.data)||!o.nextSibling)return;
      const t=(el.textContent||"").replace(/[ \t\n]+$/,"");if(/[ \u00a0][=≠+−·×<>≤≥≈:]$/.test(t))o.data=NB;});
    // 4) düğüm sınırında kalan işaret: "… 3 ·" + " C = 12" ya da "A = 3" + " · C"
    tl.forEach(t=>{if(!t.isConnected)return;let y=t.data;
      y=y.replace(/(^|[ \u00a0])([=≠+−·×<>≤≥≈:])[ \t\n]+$/,"$1$2"+NB);
      y=y.replace(/^[ \t\n]+([=≠+·×<>≤≥≈:])(?=[ \u00a0]|$)/,NB+"$1");
      if(y!==t.data)t.data=y;});
  }
  function yapistir(p){
    if(p.closest(".nw-islem")||p.closest(".frac"))return;
    const d=[...p.childNodes];let i=0;
    while(i<d.length){
      if(!ATOM(d[i])||d[i].classList&&d[i].classList.contains("nw-islem")){i++;continue;}
      // sola: bitişik metin parçası (son boşluktan sonrası)
      let bas=i, sagSon=i;
      let solMetin=null, solKes=0;
      if(i>0&&d[i-1].nodeType===3){const s=d[i-1].data;const m=s.match(/[^ \t\n\r]*$/);if(m&&m[0].length){solMetin=d[i-1];solKes=s.length-m[0].length;}}
      // sağa: atom/metin zinciri
      let j=i+1, sagMetin=null, sagKes=0;
      while(j<d.length){
        const n=d[j];
        if(ATOM(n)){sagSon=j;j++;continue;}
        if(n.nodeType===3){
          const m=n.data.match(/^[^ \t\n\r]*/);const k=m?m[0].length:0;
          if(k===n.data.length&&j+1<d.length&&ATOM(d[j+1])){sagSon=j;j++;continue;} // tamamı bitişik, arkasında yine atom
          if(k>0){sagMetin=n;sagKes=k;}
        }
        break;
      }
      const sp=document.createElement("span");sp.className="nw-islem";
      p.insertBefore(sp,d[bas]);
      if(solMetin){const r=solMetin.splitText(solKes);sp.appendChild(r);}
      for(let x=bas;x<=sagSon;x++)sp.appendChild(d[x]);
      if(sagMetin){const kalan=sagMetin.splitText(sagKes);sp.appendChild(sagMetin);d[j]=kalan;}
      i=sagSon+1;
    }
  }
  const st=document.createElement("style");
  st.textContent=".nw-islem{white-space:nowrap}";
  (document.head||document.documentElement).appendChild(st);
  window.islemTut=isle;
  let bekle=false;const kuyruk=new Set();
  function calis(){bekle=false;gozcu.disconnect();kuyruk.forEach(n=>{try{isle(n.nodeType===1?n:n.parentElement)}catch(e){}});kuyruk.clear();gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  const gozcu=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")kuyruk.add(m.target.parentElement);else m.addedNodes.forEach(n=>kuyruk.add(n.nodeType===1?n:n.parentElement));}if(!bekle){bekle=true;Promise.resolve().then(calis);}});
  function basla(){isle(document.body);gozcu.observe(document.body,{childList:true,subtree:true,characterData:true});}
  if(document.body)basla();else document.addEventListener("DOMContentLoaded",basla);
})();

</script>
