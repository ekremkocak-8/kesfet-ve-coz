<header><div class="ic"><small id="kod"></small><h1 id="bas">Çözümler</h1></div></header>
<main><nav class="sec" id="nav" aria-label="Bölümler"></nav><p class="tum" id="tum" hidden><a href="?">Bütün çözümleri göster</a></p><div id="ic"></div></main>
<script>
/* ANA_KURALLAR §4.y-3: Etkinliklerde bütün kesirler kesir çizgisiyle (alt alta pay/payda) gösterilir. Düz yazılmış a/b biçimleri otomatik dönüştürülür. */
(function(){
  if (window.__kesirCizgi) return; window.__kesirCizgi = 1;
  const RX = /(^|[^\w\/.,:%])([−-])?(?:(\d+) )?(\d{1,4})\/(\d{1,4})(?![\w\/.,]\d|\w)/g;
  const ATLA = "script,style,svg,textarea,input,select,code,.ilr,.frac,[data-duz]";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function donustur(kok){
    if (!kok || !kok.nodeType) return;
    if (kok.nodeType === 3) kok = kok.parentElement;
    if (!kok || (kok.closest && kok.closest(ATLA))) return;
    const w = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, { acceptNode: t => {
      if (!/\d\/\d/.test(t.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = t.parentElement; if (!p || p.closest(ATLA)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const L = []; let t; while ((t = w.nextNode())) L.push(t);
    L.forEach(t => {
      let deg = false;
      const h = esc(t.nodeValue).replace(RX, (m, a, s, tam, p, q) => { deg = true;
        return a + (s ? "−" : "") + (tam ? tam + " " : "") + '<span class="frac"><span>' + p + "</span><span>" + q + "</span></span>"; });
      if (!deg) return;
      const k = document.createElement("span"); k.innerHTML = h; t.replaceWith(...k.childNodes);
    });
  }
  let bekleyen = new Set(), plan = 0;
  const calis = () => { plan = 0; const b = bekleyen; bekleyen = new Set(); b.forEach(donustur); };
  const gozcu = new MutationObserver(ms => { ms.forEach(m => {
      if (m.type === "characterData") bekleyen.add(m.target); else m.addedNodes.forEach(n => bekleyen.add(n)); });
    if (!plan) plan = requestAnimationFrame(calis); });
  const bas = () => { donustur(document.body); gozcu.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bas); else bas();
  const st = document.createElement("style");
  st.textContent = ".frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}.frac>span{display:block;text-align:center;padding:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor}";
  document.head.appendChild(st);
})();

/* Canlandır · bağlam sorularına simülasyon motorları (05.10.2026, ANA_KURALLAR §4.k, §19)
   Her motor: öğrenci düzeneği elle değiştirir → sonucu anında görür → deney defterine yazılır → tekrar dener.
   Kullanım: CANL[no] = el => MOTOR(el, {...})
   05.10.2026 (SB 6.1.1): KOŞUL ve LABİRENT motorları; GRUPLA'ya hazır değer düğmeleri (hazir) ve özel satır (satir),
   ATLA'ya soruya özel sınama (test), nokta rengi (renk) ve çizelge adımları (tikAdim, etAdim, etYaz) eklendi (eski ayarlar aynen çalışır). */
const CN = (() => {
  const az = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const h = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; };
  const bekle = ms => new Promise(r => setTimeout(r, az ? 0 : ms));
  const x = "×";
  // Türkçe ek: E(40,"in") → 40'ın · E(58,"den") → 58'den  (ünlü uyumu sayının okunuşunun son sözcüğüne göre)
  const EKT = {bir:["in","den","e"],iki:["nin","den","ye"],"üç":["ün","ten","e"],"dört":["ün","ten","e"],"beş":["in","ten","e"],"altı":["nın","dan","ya"],yedi:["nin","den","ye"],sekiz:["in","den","e"],dokuz:["un","dan","a"],
    on:["un","dan","a"],yirmi:["nin","den","ye"],otuz:["un","dan","a"],"kırk":["ın","tan","a"],elli:["nin","den","ye"],"altmış":["ın","tan","a"],"yetmiş":["in","ten","e"],seksen:["in","den","e"],doksan:["ın","dan","a"],"yüz":["ün","den","e"],bin:["in","den","e"],"sıfır":["ın","dan","a"]};
  const BIR = ["sıfır","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"], ON = ["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
  const sonSoz = n => n === 0 ? "sıfır" : n % 10 ? BIR[n % 10] : n % 100 ? ON[(n % 100) / 10] : n % 1000 ? "yüz" : "bin";
  const E = (n, t) => { const e = EKT[sonSoz(Math.abs(n))]; const i = {in:0,nin:0,den:1,dan:1,e:2,a:2}[t]; let k = e[i];
    if (t === "de" || t === "da") k = e[1].replace("n", ""); return `${n}'${k}`; };
  // ortak iskelet: yönerge + sahne + denetimler + durum + deney defteri
  function iskelet(el, o) {
    el.innerHTML = "";
    const y = h("div", "cn-yon", `<b>Ne yapacaksınız?</b> ${o.yon}<br><b>Ne zaman biter?</b> ${o.bitis}`);
    const sah = h("div", "cn-sahne"); const den = h("div", "cn-den"); const dur = h("div", "cn-dur", o.ilk || "Bir deneme yapın.");
    dur.setAttribute("aria-live", "polite");
    const df = h("details", "cn-df"); df.open = true;
    df.innerHTML = `<summary>Deney defteri <span class="cn-say">(0 deneme)</span></summary><table><thead><tr>${o.sutun.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    el.append(y, sah, den, dur, df);
    const tb = df.querySelector("tbody"), say = df.querySelector(".cn-say"); const kayit = new Set();
    const yaz = (anahtar, hucre, iyi) => {
      if (kayit.has(anahtar)) { [...tb.rows].forEach(r => r.classList.toggle("cn-son", r.dataset.k === anahtar)); return; }
      kayit.add(anahtar); const tr = h("tr", iyi === true ? "cn-iyi" : iyi === false ? "cn-kotu" : ""); tr.dataset.k = anahtar;
      tr.innerHTML = hucre.map(c => `<td>${c}</td>`).join(""); [...tb.rows].forEach(r => r.classList.remove("cn-son")); tr.classList.add("cn-son");
      tb.appendChild(tr); say.textContent = `(${kayit.size} deneme)`;
    };
    return { sah, den, dur, yaz, sayi: () => kayit.size };
  }
  function adimci(etiket, min, max, deger, deg) {   // − [n] + denetimi
    const w = h("div", "cn-adimci"); w.innerHTML = `<span>${etiket}</span><button type="button" aria-label="azalt">−</button><input type="number" inputmode="numeric" min="${min}" max="${max}" value="${deger}"><button type="button" aria-label="artır">+</button>`;
    const [a, b] = w.querySelectorAll("button"), i = w.querySelector("input");
    const ayarla = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); i.value = v; deg(v); };
    a.onclick = () => ayarla(+i.value - 1); b.onclick = () => ayarla(+i.value + 1); i.onchange = () => ayarla(i.value);
    return { w, ayarla, get: () => +i.value };
  }
  const dug = (t, cls = "") => { const b = h("button", "cn-btn " + cls, t); b.type = "button"; return b; };

  /* 1) DİZİLİM: N birim kare/sandalye eşit sıralara dizilir */
  function DIZILIM(el, o) {
    const N0 = o.N; let N = o.N;
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Bir sıradaki", "Sıra sayısı", "Artan", "Sonuç"] });
    const kut = h("div", "cn-satir");
    let sayiA = null;
    if (o.sayiSec) { sayiA = adimci(o.sayiEtiket || "Sayı:", 2, 100, N, v => { N = v; ciz(g.get()); }); kut.appendChild(sayiA.w); }
    const g = adimci(o.etiket || "Bir sıradaki kare sayısı:", 1, o.maxG || N, o.bas || 1, v => ciz(v));
    kut.appendChild(g.w); s.den.appendChild(kut);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => { sayiA.ayarla(n); }; hz.appendChild(b); }); s.den.appendChild(hz); }
    function ciz(gen) {
      if (gen > N) { g.ayarla(N); return; }
      const sira = Math.floor(N / gen), art = N % gen, tumSira = Math.ceil(N / gen);
      const hc = Math.max(10, Math.min(30, Math.floor(560 / Math.max(gen, 1)), Math.floor(330 / tumSira)));
      const W = gen * hc + 20, H = tumSira * hc + 20; let sv = "";
      for (let k = 0; k < N; k++) {
        const r = Math.floor(k / gen), c = k % gen, kalan = r >= sira;
        const xx = 10 + c * hc, yy = 10 + r * hc, d = az ? 0 : Math.min(k * 12, 900);
        sv += o.sandalye
          ? `<g class="cn-p" style="animation-delay:${d}ms"><rect x="${xx + hc * .18}" y="${yy + hc * .1}" width="${hc * .64}" height="${hc * .5}" rx="${hc * .1}" class="${kalan ? "cn-k" : "cn-o"}"/><rect x="${xx + hc * .18}" y="${yy + hc * .62}" width="${hc * .64}" height="${hc * .18}" rx="${hc * .06}" class="${kalan ? "cn-k" : "cn-o2"}"/></g>`
          : `<rect class="cn-p ${kalan ? "cn-k" : "cn-o"}" style="animation-delay:${d}ms" x="${xx + 1}" y="${yy + 1}" width="${hc - 2}" height="${hc - 2}" rx="3"/>`;
      }

  /* 2) GRUPLA: N nesne k'şar gruplara ayrılır (nokta) ya da N cm çubuk p parçaya kesilir (cubuk) */
  function GRUPLA(el, o) {

    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || (o.cubuk ? ["Parça sayısı", "Bir parça", "Artan", "Sonuç"] : ["Bir gruptaki", "Grup sayısı", "Artan", "Sonuç"]) });

    async function dagit(k) {

      const kolon = Math.min(k, 6), satirK = Math.ceil(k / kolon), gw = kolon * 14 + 16, gh = satirK * 14 + 26;

  /* 3) ATLA: 0'dan başlayıp k'şar ilerleme (merdiven, kumbara, yol, kâğıt) */
  function ATLA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Sonuç"] });
    let k = o.k, L = o.son; const W = 660, sol = 22, sag = 22, sk = (W - sol - sag) / L;

    const bA = dug("▶ Oynat"), bB = dug("+1 " + (o.adimAd || "adım"), "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bB, bS);
    let kA = null;
    if (o.kSec) { kA = adimci(o.kEtiket || "Adım:", 2, Math.floor(L / 2), k, v => { k = v; sifirla(); }); kut.prepend(kA.w); }

    const bT = dug(o.testDugme || "Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test);
    const ti = test.querySelector("input");
    function taban() {
      let sv = `<line x1="${sol}" y1="62" x2="${sol + L * sk}" y2="62" class="cn-ek"/>`;

      for (let v = 0; v <= L; v += adimT) sv += `<line x1="${sol + v * sk}" y1="${v % et ? 58 : 54}" x2="${sol + v * sk}" y2="66" class="cn-ek"/>` + (v % et ? "" : `<text x="${sol + v * sk}" y="82" text-anchor="middle" class="cn-et">${o.etYaz ? o.etYaz(v) : v}</text>`);
      sv += `<line x1="${sol + L * sk}" y1="30" x2="${sol + L * sk}" y2="70" class="cn-sinir"/><text x="${sol + L * sk}" y="24" text-anchor="end" class="cn-et">${o.sonEt || L}</text>`;

    }

      izle.forEach((v, i) => {

        sv += `<path d="M${x1} 62 Q${(x1 + x2) / 2} ${yy} ${x2} 62" class="cn-yay"/><circle cx="${x2}" cy="62" r="4.5" class="${o.renk ? o.renk(v, i + 1) : "cn-o"}"/>`;
        if (izle.length <= 14 || i === izle.length - 1 || i % Math.ceil(izle.length / 10) === 0) sv += `<text x="${x2}" y="${98}" text-anchor="middle" class="cn-et2">${v}</text>`;
      });

      const son = izle.length ? izle[izle.length - 1] : 0, ix = sol + son * sk;
      sv += `<text x="${ix}" y="50" text-anchor="middle" class="cn-kis">${o.simge || "●"}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 ${W} 104" role="img" aria-label="${k} birimlik adımlarla ilerleme">${sv}</svg>`;
    }
    const ileri = () => {
      const v = (n + 1) * k;
      if (v > L) { durdur(); s.dur.innerHTML = `<span class="kotu">■</span> Sonraki ${o.adimAd || "adım"} ${k} ${x} ${n + 1} = <b>${v}</b> olurdu; bu ${E(L,"den")} büyük. ${o.bitti ? o.bitti(n, k, L) : `Toplam ${n} ${o.adimAd || "adım"}; son değer ${n * k}.`}`; if (!izle.length) ciz(); return false; }
      n++; izle.push(v); ciz(); s.dur.innerHTML = o.durum ? o.durum(n, v, k) : `${n}. ${o.adimAd || "adım"}: ${k} ${x} ${n} = <b>${v}</b>`; return true;

      s.dur.innerHTML = m; s.yaz("t" + v, [v, r === 0 ? (ic ? `${k} ${x} ${b} ✔` : `${k} ${x} ${b} (sınır dışı)`) : `kalan ${r} ✘`], r === 0 && ic);

  }

  /* 4) TABLO: 1..son sayılar ızgarada; k'nın katları boyanır (yüzlük tablo, takvim, bilet) */
  function TABLO(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || [o.kAd || "k", "Boyanan", "En büyük"] });
    let k = o.k || 2, son = o.son;
    const kut = h("div", "cn-satir");

    if (o.sonSec) { const sw = h("div", "cn-hazir"); o.sonSec.forEach(v => { const b = dug(v + " gün", "ghost"); b.onclick = () => { son = v; kur(); temiz(); }; sw.appendChild(b); }); s.den.append(kut, sw); }

      const g = h("div", "cn-izg" + (o.takvim ? " cn-tak" : "")); g.style.gridTemplateColumns = `repeat(${o.sutunSay},1fr)`;

    function temiz() { hucre.forEach(c => c && c.classList.remove("on", "yeni")); s.dur.innerHTML = o.ilk || "Sayıyı seçip Boya düğmesine basın."; }

      }

      s.yaz(k + ":" + son, o.satir ? o.satir(k, say, enb, son) : [k, say, enb], o.iyi ? o.iyi(k, say, enb, son) : null);
      calis = false; bB.disabled = false;

  /* 5) ASANSÖR: iki kural, katlar binada boyanır */
  function ASANSOR(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Açık asansörler", "Gidilen kat", "Gidilemeyen kat"] });
    const ac = o.asansor.map(() => false);
    const kut = h("div", "cn-satir"); const bt = o.asansor.map((a, i) => { const b = dug(a.ad, "ghost"); b.style.setProperty("--ac", a.renk); b.setAttribute("aria-pressed", "false"); b.onclick = () => { ac[i] = !ac[i]; b.setAttribute("aria-pressed", ac[i]); ciz(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    function ciz() {
      let sv = ""; const H = o.kat * 17 + 40; let git = 0, gitme = [];
      for (let f = o.kat; f >= 0; f--) {

        sv += `<rect x="60" y="${y}" width="150" height="15" rx="2" class="${f === 0 ? "cn-zem" : herhangi ? "cn-katon" : (ac.some(Boolean) ? "cn-katoff" : "cn-kat")}"/><text x="52" y="${y + 12}" text-anchor="end" class="cn-et">${f === 0 ? "Z" : f}</text>`;
        o.asansor.forEach((a, i) => { if (dur[i]) sv += `<circle cx="${230 + i * 22}" cy="${y + 7.5}" r="6" fill="${a.renk}"/>`; });
      }
      s.sah.innerHTML = `<svg viewBox="0 0 300 ${H}" style="max-height:440px" role="img" aria-label="${o.kat} katlı bina">${sv}</svg>`;
      const acik = o.asansor.filter((a, i) => ac[i]).map(a => a.ad);

      s.yaz(acik.join("+"), [acik.join(" + "), git, gitme.length], null);

    ciz();
  }

  /* 6) SAAT: eşit aralıklı seferler ve varış saati */
  function SAAT(el, o) {

      let onc = null, snr = null;
      for (let m = bas; m <= bit + ara; m += ara) { if (m <= var_) onc = m; if (m >= var_ && snr == null) snr = m; if (m <= bit) sv += `<text x="${20 + (m - bas) * sk}" y="40" text-anchor="middle" class="cn-bus">🚌</text>`; }

      if (snr != null && snr <= bit + ara) { const sx = 20 + (Math.min(snr, bit) - bas) * sk; sv += `<path d="M${vx} 56 L${sx} 56" class="cn-bek"/>`; }

      const gec = var_ - bas;
      s.dur.innerHTML = `${o.kisi} durağa ${saDa(var_)} geliyor: ilk seferden <b>${gec} dakika</b> sonra. Seferler ${E(ara,"in")} katı olan dakikalarda: ${ara} ${x} ${Math.floor(gec / ara)} = ${Math.floor(gec / ara) * ara}` + (gec % ara ? `, ${ara} ${x} ${Math.floor(gec / ara) + 1} = ${(Math.floor(gec / ara) + 1) * ara}. Sonraki otobüs ${saDa(snr)}; bekleme <b>${snr - var_} dakika</b>.` : `. Tam sefer saatinde geldi; bekleme <b>0 dakika</b>.`);
      s.yaz(ara + ":" + var_, [ara + " dk", sa(var_), sa(onc), sa(snr), (snr - var_) + " dk"], null);
    }
    ciz();
  }

  /* 7) ÇARPAN AVCISI: bir sayının çarpanlarını bölerek bulma; isteğe bağlı katlar akışı */
  function CARPAN(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Sayı", "Çarpanlar", "Çarpan sayısı"] });
    let N = o.N || o.hazir[0]; let bul = new Set(), denendi = new Set();
    const kut = h("div", "cn-satir");
    const sA = adimci("Sayı:", 2, o.max || 200, N, v => { N = v; yeni(); });
    kut.appendChild(sA.w);
    if (o.hazir) { const hz = h("div", "cn-hazir"); o.hazir.forEach(n => { const b = dug(n, "ghost"); b.onclick = () => sA.ayarla(n); hz.appendChild(b); }); kut.appendChild(hz); }
    s.den.appendChild(kut);
    const bolen = h("div", "cn-satir cn-test"); bolen.innerHTML = `<label>Bölen deneyin: <input type="number" inputmode="numeric" min="1"></label>`;
    const bD = dug("Böl"), bS = dug("Sıradakini dene", "ghost"); bolen.append(bD, bS); s.den.appendChild(bolen);
    const bi = bolen.querySelector("input");
    let bK = null; if (o.katlar) { bK = dug(o.katDugme || "Katlarını say ▶", "ghost"); s.den.appendChild(bK); }
    const ciftler = h("div", "cn-cift"); const katlar = h("div", "cn-katlar");
    function yeni() { bul = new Set(); denendi = new Set(); ciz(); s.dur.innerHTML = `${N} sayısını 1, 2, 3, … sayılarına bölerek çarpan çiftlerini bulun.`; katlar.textContent = ""; }
    function ciz() {
      const L = [...bul].sort((a, b) => a - b);
      s.sah.innerHTML = ""; const kartlar = h("div", "cn-kartlar");
      L.forEach(v => kartlar.appendChild(h("span", "cn-kart" + (v * v === N ? " kare" : ""), v)));
      if (!L.length) kartlar.appendChild(h("span", "cn-bosk", "Henüz çarpan bulunmadı"));
      s.sah.append(kartlar, ciftler, katlar);
      ciftler.innerHTML = L.filter(v => v * v <= N).map(v => `<span>${v} ${x} ${N / v}${v * v === N ? " <i>(aynı sayı: bir kez yazılır)</i>" : ""}</span>`).join("");
    }
    const tamamMi = () => { for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) return false; return true; };
    const eksik = () => { const L = []; for (let i = 1; i * i <= N; i++) if (!denendi.has(i)) L.push(i); return ` <br>Henüz denenmeyen küçük bölenler var: <b>${L.join(", ")}</b>. Bunları da deneyin.`; };
    function dene(d) {
      if (!d || d < 1) return; denendi.add(d);
      const b = Math.floor(N / d), r = N % d;
      if (d > N) { s.dur.innerHTML = `${d} > ${N}: ${E(N,"den")} büyük sayı ${E(N,"in")} çarpanı olamaz.`; return; }
      if (r === 0) { bul.add(d); bul.add(b); ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${N} : ${d} = ${b}, kalan 0 → <b>${d} ${x} ${b} = ${N}</b>. ${d} ve ${b} çarpandır.` + (d * d >= N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} ${d * d === N ? "=" : ">"} ${N}. Artık yeni çift çıkmaz; bütün çarpanlar bulundu.` : eksik() : ""); }
      else { s.dur.innerHTML = `<span class="kotu">✘</span> ${N} : ${d} işleminde bölüm ${b}, <b>kalan ${r}</b>. ${d}, ${E(N,"in")} çarpanı değildir.` + (d * d > N ? tamamMi() ? ` <br><b>Dikkat:</b> ${d} ${x} ${d} > ${N}. Daha büyük bölen denemeye gerek yok; çarpan listesi tamam.` : eksik() : ""); }
      const tamam = [...Array(N).keys()].map(i => i + 1).every(v => N % v || bul.has(v));
      if (tamam) s.yaz("n" + N, [N, [...bul].sort((a, b) => a - b).join(", "), bul.size], true);
    }
    bD.onclick = () => dene(Math.round(+bi.value));
    bS.onclick = () => { let d = 1; while (denendi.has(d)) d++; bi.value = d; dene(d); };
    if (bK) bK.onclick = async () => {
      bK.disabled = true; katlar.textContent = ""; const sat = h("div", "cn-katsat"); katlar.append(h("b", "", `${E(N,"in")} katları: `), sat);
      for (let i = 1; i <= (o.katSay || 12); i++) { sat.appendChild(h("span", "cn-kat2", `${N * i}`)); await bekle(220); }
      sat.appendChild(h("span", "cn-sonsuz", "… ve sonsuza kadar sürer"));
      bK.disabled = false;
    };
    yeni();
  }

  /* 8) KUMBARA: her hafta k TL eklenir; hedef para mümkün mü? (ATLA'nın kumbara görünümü) */
  function KUMBARA(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Para", "Sonuç"] });
    const k = o.k; let hafta = 0, tmr = null;
    const kut = h("div", "cn-satir"); const bA = dug("Bir hafta geçsin +"), bO = dug("▶ Haftaları oynat", "ghost"), bS = dug("Baştan", "ghost");
    kut.append(bA, bO, bS); s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Kumbarada şu para olabilir mi? <input type="number" inputmode="numeric" min="1" max="500"> TL</label>`;
    const bT = dug("Dene", "ghost"); test.appendChild(bT); s.den.appendChild(test); const ti = test.querySelector("input");
    function ciz() {
      const top = hafta * k, sv = [];
      const yuk = Math.min(150, top * 1.4);
      sv.push(`<rect x="110" y="20" width="120" height="160" rx="22" class="cn-kum"/><rect x="150" y="14" width="40" height="8" rx="3" class="cn-kum2"/>`);
      sv.push(`<rect x="116" y="${176 - yuk}" width="108" height="${yuk}" rx="10" class="cn-para"/>`);
      sv.push(`<text x="170" y="110" text-anchor="middle" class="cn-buyuk">${top} TL</text><text x="170" y="134" text-anchor="middle" class="cn-et">${hafta}. hafta</text>`);
      let cizgi = ""; for (let i = 1; i <= hafta && i <= 16; i++) cizgi += `<text x="${260 + ((i - 1) % 4) * 52}" y="${40 + Math.floor((i - 1) / 4) * 34}" class="cn-et2">${k}${x}${i}=${k * i}</text>`;
      s.sah.innerHTML = `<svg viewBox="0 0 480 190" role="img" aria-label="Kumbara">${sv.join("")}${cizgi}</svg>`;
      s.dur.innerHTML = hafta ? `${hafta}. hafta sonunda kumbarada ${k} ${x} ${hafta} = <b>${top} TL</b> var.` : `Kumbara boş. Her hafta ${k} TL atılıyor.`;
    }
    bA.onclick = () => { hafta++; ciz(); };
    bO.onclick = () => { if (tmr) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } bO.textContent = "❚❚ Durdur"; tmr = setInterval(() => { if (hafta >= 15) { clearInterval(tmr); tmr = null; bO.textContent = "▶ Haftaları oynat"; return; } hafta++; ciz(); }, az ? 50 : 500); };
    bS.onclick = () => { hafta = 0; ciz(); };
    bT.onclick = () => {
      const v = Math.round(+ti.value); if (!v) return; const b = Math.floor(v / k), r = v % k;
      s.dur.innerHTML = r ? `<span class="kotu">✘</span> ${k} ${x} ${b} = ${k * b} TL, ${k} ${x} ${b + 1} = ${k * (b + 1)} TL. ${v} TL arada kalır (${v} : ${k} → kalan ${r}). Kumbarada hiçbir hafta ${v} TL olmaz.`
        : `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · ${b}. hafta sonunda kumbarada tam ${v} TL olur.`;
      if (!r) { hafta = b; ciz(); s.dur.innerHTML = `<span class="iyi">✔</span> ${v} = ${k} ${x} ${b} · <b>${b}. hafta</b> sonunda kumbarada tam ${v} TL olur.`; }
      s.yaz("t" + v, [v + " TL", r ? `kalan ${r} ✘` : `${k} ${x} ${b} ✔`], !r);
    };
    ciz();
  }

  /* 9) ÖNERME LABORATUVARI: önermeyi farklı sayılarla sınama */
  function ONERME(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: ["Önerme", "Sayı", "Sonuç"] });
    let akt = 0; const kut = h("div", "cn-hazir");
    const bt = o.onermeler.map((on, i) => { const b = dug(on.ad, "ghost"); b.setAttribute("aria-pressed", i === 0); b.onclick = () => { akt = i; bt.forEach((x, j) => x.setAttribute("aria-pressed", j === i)); goster(); }; kut.appendChild(b); return b; });
    s.den.appendChild(kut);
    const test = h("div", "cn-satir cn-test"); test.innerHTML = `<label>Sınanacak sayı: <input type="number" inputmode="numeric" min="1" max="200" value="12"></label>`;
    const bT = dug("Sına"), bR = dug("Rastgele sayı", "ghost"); test.append(bT, bR); s.den.appendChild(test); const ti = test.querySelector("input");
    function goster() { s.sah.innerHTML = `<div class="cn-onr"><b>${o.onermeler[akt].ad}:</b> “${o.onermeler[akt].metin}”</div>`; s.dur.innerHTML = "Bir sayı yazıp Sına düğmesine basın. Önerme her sayıda doğru mu?"; }
    function sina(n) {
      const on = o.onermeler[akt], r = on.sina(n);
      s.sah.innerHTML = `<div class="cn-onr"><b>${on.ad}:</b> “${on.metin}”</div><div class="cn-kanit">${r.goster}</div>`;
      s.dur.innerHTML = (r.ok ? `<span class="iyi">✔</span> ${n} için önerme doğru.` : `<span class="kotu">✘</span> ${n} için önerme yanlış! Bir karşı örnek bulundu.`) + (r.not ? " " + r.not : "");
      s.yaz(akt + ":" + n, [on.ad, n, r.ok ? "doğru" : "yanlış (karşı örnek)"], r.ok);
    }
    bT.onclick = () => { const n = Math.round(+ti.value); if (n > 0) sina(n); };
    bR.onclick = () => { const n = 2 + Math.floor(Math.random() * 59); ti.value = n; sina(n); };
    goster();
  }


  /* 10) KOŞUL LABORATUVARI (05.10.2026, SB 6.1.1): girdileri (sayı ya da seçim) değiştir → sahne anında çizilir →
     koşullar tek tek denetlenir (✔/✘) → deney defterine yazılır. Doğru cevap verilmez; öğrenci uygun girdiyi kendisi arar.
     o.girdi: [{ad, min, max, bas} | {ad, sec:[…], bas, yaz?}] · o.ciz(v) → SVG/HTML · o.kosullar: [{ad, f(v) → bool | {ok, not}}]
     o.dugme: düğme yazısı (false → her değişiklikte denetlenir) · o.sonuc(v, hepsi, L) · o.satir(v, hepsi, L) · o.iyi(v, L) · o.ek: [{ad, deger(v) → v}] */
  function KOSUL(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun });
    const v = o.girdi.map(g => g.bas), ayar = [];
    o.girdi.forEach((g, i) => {
      const w = h("div", "cn-satir");
      if (g.sec) {
        w.classList.add("cn-secg"); w.appendChild(h("span", "cn-secad", g.ad));
        const bs = g.sec.map(x => { const b = dug(g.yaz ? g.yaz(x) : x, "ghost"); b.setAttribute("aria-pressed", x === v[i]); b.onclick = () => sec(x); w.appendChild(b); return b; });
        const sec = x => { v[i] = x; bs.forEach((y, j) => y.setAttribute("aria-pressed", g.sec[j] === x)); degis(); };
        ayar[i] = sec;
      } else { const a = adimci(g.ad, g.min, g.max, g.bas, x => { v[i] = x; degis(); }); ayar[i] = a.ayarla; w.appendChild(a.w); }
      s.den.appendChild(w);
    });
    const alt = h("div", "cn-satir"); let bS = null;
    if (o.dugme !== false) { bS = dug(o.dugme || "Sına ✔"); bS.onclick = () => sina(); alt.appendChild(bS); }
    (o.ek || []).forEach(e => { const b = dug(e.ad, "ghost"); b.onclick = () => { const y = e.deger(v.slice()); y.forEach((x, i) => { if (x !== v[i]) { v[i] = x; } }); y.forEach((x, i) => ayar[i](x)); }; alt.appendChild(b); });
    if (alt.children.length) s.den.appendChild(alt);
    let kur = false;
    function ciz() { s.sah.innerHTML = o.ciz(v.slice()); }
    function degis() { if (!kur) return; ciz(); if (!bS) sina(); else s.dur.innerHTML = o.bekle || "Değerleri değiştirdiniz. Sına düğmesine basın."; }
    function sina() {
      const L = o.kosullar.map(k => { const r = k.f(v.slice()); return typeof r === "object" ? r : { ok: !!r }; });
      const hepsi = L.every(r => r.ok);
      let m = `<ul class="cn-kl">` + o.kosullar.map((k, i) => `<li><span class="${L[i].ok ? "iyi" : "kotu"}">${L[i].ok ? "✔" : "✘"}</span> ${typeof k.ad === "function" ? k.ad(v.slice()) : k.ad}${L[i].not ? ` <span class="cn-not">${L[i].not}</span>` : ""}</li>`).join("") + `</ul>`;
      if (o.sonuc) m += o.sonuc(v.slice(), hepsi, L);
      s.dur.innerHTML = m;
      s.yaz(v.join("|"), o.satir(v.slice(), hepsi, L), o.iyi ? o.iyi(v.slice(), L) : hepsi);
    }
    kur = true; ciz();
    if (bS) s.dur.innerHTML = o.ilk || "Değerleri seçip Sına düğmesine basın."; else sina();
  }

  /* 11) LABİRENT (05.10.2026, SB 6.1.1): sayı ızgarasında kurala uyan karelere basarak ilerleme; çapraz geçiş yok.
     o.izgara: [[…]] · o.kural(v) → {ok, msg} · o.cikis: {satır: "ad"} (sağ kenar) · giriş sol üst kare */
  function LABIRENT(el, o) {
    const s = iskelet(el, { yon: o.yon, bitis: o.bitis, sutun: o.sutun || ["Kare", "Sonuç"] });
    const Rn = o.izgara.length, Cn = o.izgara[0].length;
    let yol = [[0, 0]], kotu = new Set(), cikti = null;
    const kut = h("div", "cn-satir"); const bG = dug("↶ Bir adım geri", "ghost"), bB = dug("Baştan", "ghost"); kut.append(bG, bB); s.den.appendChild(kut);
    const g = h("div", "cn-lab"); g.style.gridTemplateColumns = `22px repeat(${Cn},minmax(0,1fr)) 44px`; s.sah.appendChild(g);
    const hc = [];
    for (let i = 0; i < Rn; i++) {
      g.appendChild(h("div", "cn-lok", i === 0 ? "➜" : "")); hc[i] = [];
      for (let j = 0; j < Cn; j++) { const b = h("button", "cn-lc", o.izgara[i][j]); b.type = "button"; b.onclick = () => bas(i, j); g.appendChild(b); hc[i][j] = b; }
      const c = h("button", "cn-lcik", o.cikis[i] ? "→" + o.cikis[i] : ""); c.type = "button"; c.disabled = !o.cikis[i]; if (o.cikis[i]) c.onclick = () => cik(i); g.appendChild(c);
    }
    const anahtar = (i, j) => i + ":" + j, son = () => yol[yol.length - 1];
    const yoldaMi = (i, j) => yol.some(([a, b]) => a === i && b === j);
    function boya() {
      for (let i = 0; i < Rn; i++) for (let j = 0; j < Cn; j++) {
        const c = hc[i][j]; c.className = "cn-lc" + (yoldaMi(i, j) ? " yol" : "") + (kotu.has(anahtar(i, j)) ? " kapali" : "");
      }
      const [a, b] = son(); hc[a][b].classList.add("simdi");
    }
    function cikmaz() {
      const [a, b] = son();
      const ac = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([di, dj]) => { const x = a + di, y = b + dj; return x >= 0 && y >= 0 && x < Rn && y < Cn && !yoldaMi(x, y) && !kotu.has(anahtar(x, y)); });
      return !ac && !(b === Cn - 1 && o.cikis[a]);
    }
    function bas(i, j) {
      if (cikti) { s.dur.innerHTML = `Labirentten <b>${cikti}</b> çıkışından çıktınız. Yeniden denemek için Baştan düğmesine basın.`; return; }
      const [a, b] = son();
      if (yoldaMi(i, j)) { s.dur.innerHTML = "Bu kareden zaten geçtiniz. Geri dönmek için “Bir adım geri” düğmesini kullanın."; return; }
      if (Math.abs(a - i) + Math.abs(b - j) !== 1) { s.dur.innerHTML = `Yalnız bulunduğunuz karenin (<b>${o.izgara[a][b]}</b>) sağındaki, solundaki, üstündeki ya da altındaki kareye geçebilirsiniz.`; return; }
      const v = o.izgara[i][j], r = o.kural(v);
      if (!r.ok) { kotu.add(anahtar(i, j)); boya(); s.dur.innerHTML = `<span class="kotu">✘</span> ${r.msg} Bu kareye basılmaz.`; s.yaz("k" + anahtar(i, j), [v, "basılmaz ✘"], false); return; }
      yol.push([i, j]); boya();
      s.dur.innerHTML = `<span class="iyi">✔</span> ${r.msg} Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")}` + (cikmaz() ? `<br><b>Çıkmaz yol!</b> Buradan gidilebilecek yeni kare yok; geri dönün.` : "");
      s.yaz("k" + anahtar(i, j), [v, "basılır ✔"], true);
    }
    function cik(i) {
      const [a, b] = son();
      if (cikti) return;
      if (a !== i || b !== Cn - 1) { s.dur.innerHTML = `${o.cikis[i]} çıkışından çıkmak için bu çıkışın hemen solundaki karede (<b>${o.izgara[i][Cn - 1]}</b>) olmalısınız.`; return; }
      cikti = o.cikis[i]; s.dur.innerHTML = `<span class="iyi">✔</span> <b>${cikti} çıkışından çıktınız!</b> Yol: ${yol.map(([x, y]) => o.izgara[x][y]).join(" → ")} → ${cikti}`;
      s.yaz("c" + cikti + yol.length, ["çıkış " + cikti, `${yol.length} karelik yol ✔`], true);
    }
    bG.onclick = () => { if (cikti) cikti = null; else if (yol.length > 1) yol.pop(); boya(); s.dur.innerHTML = `Şu an <b>${o.izgara[son()[0]][son()[1]]}</b> yazan karedesiniz.`; };
    bB.onclick = () => { yol = [[0, 0]]; kotu = new Set(); cikti = null; boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun."; };
    boya(); s.dur.innerHTML = o.ilk || "Giriş karesindesiniz. Komşu bir kareye dokunun.";
  }

  const carp = n => { const L = []; for (let i = 1; i <= n; i++) if (n % i === 0) L.push(i); return L; };
  return { DIZILIM, GRUPLA, ATLA, TABLO, ASANSOR, SAAT, CARPAN, KUMBARA, ONERME, KOSUL, LABIRENT, carp, E };
})();

/* MAT.7.1.6 · Orantılı Durumlar — bağlam sorularının "Canlandır" düzenekleri (06.10.2026) — ortak motor: canlandir.js (CN.KOSUL); yeni motor yok.
   Her düzenek: öğrenci seçim düğmeleri ya da − / + sayaçlarıyla durumu değiştirir → sahne anında çizilir → koşullar denetlenir →
   deneme deney defterine yazılır → yeniden dener. Doğru cevap bir düğmeyle verilmez; denemelerden çıkar (§4.k, §19-10).
   Birimsiz oranlar "2 : 3" biçiminde; kesirler metinde a/b yazılır, kesir_cizgi.js üst üste çizer (SVG içinde kesir kullanılmaz). */
window.CANL = (() => {
  if (!document.getElementById("c716-stil")) { const st = document.createElement("style"); st.id = "c716-stil";
    st.textContent = ".cn-btn{min-width:44px;min-height:44px}.cn-adimci button{min-width:44px;min-height:44px}.c716-k{text-align:center;font-size:17px;font-weight:800;margin:8px auto;max-width:640px;line-height:1.6}.c716-t{margin:6px auto;border-collapse:collapse;font-size:15px}.c716-t td,.c716-t th{border:1px solid #ced4da;padding:4px 10px;text-align:center}.c716-t th{background:#eef7f2}"; document.head.appendChild(st); }
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const O = (a, b) => `${a} : ${b}`, S = (a, b) => { const g = gcd(a, b); return O(a / g, b / g); };
  const D = v => String(Math.round(v * 1000) / 1000).replace(".", ",");
  const N = s => +String(s).replace(",", ".").replace(/\s| /g, "");
  const B = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  const svg = (w, h, ic, ad) => `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;height:auto;display:block;margin:0 auto" role="img" aria-label="${ad}">${ic}</svg>`;
  const tx = (x, y, s, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.an || "middle"}" style="font-size:${o.fs || 14}px;font-weight:800;fill:${o.r || "#1d2433"}">${s}</text>`;
  const kutu = h => `<div class="c716-k">${h}</div>`;
  const tablo = (bas, sat) => `<table class="c716-t"><tr>${bas.map(b => `<th>${b}</th>`).join("")}</tr>${sat.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;
  /* yatay çubuklar: [[ad, değer, renk]] */
  function cubuklar(L, W = 380, olc) { const mx = olc || Math.max(...L.map(x => x[1])), u = (W - 190) / mx; let s = "";
    L.forEach(([ad, v, r], i) => { const y = 14 + i * 44; s += tx(8, y + 22, ad, { an: "start", fs: 13 }) + `<rect x="130" y="${y}" width="${Math.max(2, v * u)}" height="30" rx="5" fill="${r}" stroke="#495057" stroke-opacity=".5"/>` + tx(138 + v * u, y + 21, B(D(v)), { an: "start", fs: 13 }); });
    return svg(W, 22 + L.length * 44, s, "Çubuklar"); }
  /* grafik: başlangıç noktasından ışınlar ve çizgiler; nokta: [x, y, renk] */
  function grafik(o) { const W = o.W || 380, Hh = 280, l = 50, b = Hh - 34, u = (W - l - 100) / o.mx, uy = (b - 30) / o.my, X = v => l + v * u, Y = v => b - v * uy; let s = "";
    for (let i = 0; i <= o.mx; i += o.ax || 1) for (let j = 0; j <= o.my; j += o.ay) s += `<circle cx="${X(i)}" cy="${Y(j)}" r="1.8" fill="#adb5bd"/>`;
    s += `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(o.mx) + 12}" y2="${Y(0)}" stroke="#495057" stroke-width="2"/><line x1="${X(0)}" y1="${Y(0)}" x2="${X(0)}" y2="${Y(o.my) - 12}" stroke="#495057" stroke-width="2"/>`;
    s += tx(X(o.mx) + 16, Y(0) + 5, o.xad, { an: "start", fs: 12 }) + tx(X(0) + 4, Y(o.my) - 16, o.yad, { an: "start", fs: 12 });
    for (let i = 0; i <= o.mx; i += (o.ex || 1)) s += tx(X(i), Y(0) + 16, B(i), { fs: 11 }); for (let j = o.ey; j <= o.my; j += o.ey) s += tx(X(0) - 6, Y(j) + 4, B(j), { an: "end", fs: 11 });
    (o.isin || []).forEach(([x, y, r, ad]) => { const t = Math.min(o.mx / x, o.my / y); s += `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(x * t)}" y2="${Y(y * t)}" stroke="${r}" stroke-width="2.5"/>` + (ad ? tx(X(x * t) + 4, Y(y * t) - 6, ad, { an: "start", fs: 13, r }) : ""); });
    (o.cizgi || []).forEach(([x1, y1, x2, y2, r, ad]) => { s += `<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" stroke="${r}" stroke-width="2.5"/>` + (ad ? tx(X(x2) + 4, Y(y2) + 14, ad, { an: "start", fs: 13, r }) : ""); });
    (o.nokta || []).forEach(([x, y, r]) => { s += `<path d="M${X(x)} ${Y(0)} V${Y(y)} H${X(0)}" fill="none" stroke="${r}" stroke-width="1.4" stroke-dasharray="4 3"/><circle cx="${X(x)}" cy="${Y(y)}" r="6" fill="${r}"/>`; });
    return svg(W, Hh, s, "Grafik"); }
  /* çift sayı doğrusu: üst ve alt değerler, işaretli değer */
  function cift(ust, alt, ua, aa, isaret, W = 400) { const L = 100, R = W - 24, mx = Math.max(...ust), X = v => L + v / mx * (R - L); let s = tx(6, 40, ua, { an: "start", fs: 13 }) + tx(6, 104, aa, { an: "start", fs: 13 });
    s += `<line x1="${L}" y1="36" x2="${R}" y2="36" stroke="#1c7ed6" stroke-width="2.5"/><line x1="${L}" y1="100" x2="${R}" y2="100" stroke="#e8590c" stroke-width="2.5"/>`;
    ust.forEach((v, i) => { s += `<line x1="${X(v)}" y1="30" x2="${X(v)}" y2="42" stroke="#495057" stroke-width="2"/><line x1="${X(v)}" y1="94" x2="${X(v)}" y2="106" stroke="#495057" stroke-width="2"/>` + tx(X(v), 24, D(v), { fs: 13 }) + tx(X(v), 124, D(alt[i]), { fs: 13 }); });
    if (isaret != null) s += `<line x1="${X(isaret)}" y1="36" x2="${X(isaret)}" y2="100" stroke="#2b8a3e" stroke-width="3" stroke-dasharray="6 4"/>`;
    return svg(W, 134, s, "Çift sayı doğrusu"); }
  /* dikdörtgenler (en, boy) ölçekli */
  function dikd(L, k = 6, W = 420) { let x = 10, s = "", Hm = Math.max(...L.map(r => r[1])) * k + 40;
    L.forEach(([e, b, r, ad]) => { s += `<rect x="${x}" y="${Hm - 24 - b * k}" width="${e * k}" height="${b * k}" fill="${r}" stroke="#495057" stroke-width="1.5"/>` + (ad ? tx(x + e * k / 2, Hm - 6, ad, { fs: 13 }) : ""); x += e * k + 16; });
    return svg(Math.max(W, x), Hm, s, "Dikdörtgenler"); }
  const KO = (el, o) => CN.KOSUL(el, Object.assign({ dugme: false }, o));

  return {
    /* 1 · Kiralama: açılış ücreti */
    1: el => { const U = { "Scooter": t => 15 + 4 * t, "Bisiklet": t => 3 * t };
      return KO(el, { girdi: [{ ad: "Araç:", sec: Object.keys(U), bas: "Scooter" }, { ad: "Süre (dk.)", min: 5, max: 30, bas: 10 }],
        ciz: v => { const f = U[v[0]], t = v[1]; return cubuklar([[`${t} dk.`, f(t), "#a5d8ff"], [`${2 * t} dk.`, f(2 * t), "#74c0fc"]], 380, f(60)) + kutu(`${v[0]}: ${t} dk. için ${f(t)} TL, ${2 * t} dk. için ${f(2 * t)} TL<br>Ücret : süre = ${D(f(t) / t)} ve ${D(f(2 * t) / (2 * t))}`); },
        kosullar: [{ ad: v => `${v[0]}: süre 2 katına çıkınca ücret de 2 katına çıkıyor.`, f: v => U[v[0]](2 * v[1]) === 2 * U[v[0]](v[1]) }],
        sutun: ["Araç", "Süre", "Ücret", "2 katı sürede ücret"], satir: v => [v[0], `${v[1]} dk.`, `${U[v[0]](v[1])} TL`, `${U[v[0]](2 * v[1])} TL`],
        yon: "Aracı ve süreyi değiştirin. Her denemede süre 2 katına çıkınca ücretin de 2 katına çıkıp çıkmadığına bakın; iki araçta da birkaç süre deneyin.",
        bitis: "Hangi araçta süre ile ücretin orantılı olduğunu defterden çıkardığınızda." }); },

    /* 2 · Pide hamuru: orantı ve sıra */
    2: el => KO(el, { girdi: [{ ad: "Salı unu (kg):", sec: ["3", "4,5", "6"], bas: "6" }, { ad: "Salı suyu (L):", sec: ["2", "3", "4", "4,5"], bas: "2" }],
        ciz: v => { const u = N(v[0]), s = N(v[1]); return kutu(`Pazartesi un : su = 3 : 2 (her 1 L suya ${D(3 / 2)} kg un)<br>Salı un : su = ${v[0]} : ${v[1]} (her 1 L suya ${D(u / s)} kg un)`); },
        kosullar: [{ ad: "Salı hamuru pazartesi hamuruyla aynı kıvamda (un : su oranları eşit).", f: v => N(v[0]) * 2 === N(v[1]) * 3 }],
        sutun: ["Salı un", "Salı su", "1 L suya düşen un"], satir: v => [`${v[0]} kg`, `${v[1]} L`, `${D(N(v[0]) / N(v[1]))} kg`],
        yon: "Salı günkü un ve su miktarını değiştirin. Hangi miktarlarda 1 L suya düşen unun pazartesiyle aynı olduğunu bulun; Can'ın yazdığı 3 : 4,5 sırasını da deneyin.",
        bitis: "Aynı kıvamı veren miktarları bulduğunuzda." }),

    /* 3 · Leblebi: grafikten değer */
    3: el => KO(el, { girdi: [{ ad: "Leblebi (kg):", sec: ["1", "1,5", "2", "2,5", "3"], bas: "1" }],
        ciz: v => { const k = N(v[0]); return grafik({ mx: 4, my: 1200, ax: 1, ay: 150, ey: 300, xad: "Kütle (kg)", yad: "Fiyat (TL)", isin: [[1, 300, "#e8590c"]], nokta: [[k, 300 * k, "#2b8a3e"]] }) + kutu(`${v[0]} kg → ${D(300 * k)} TL`); },
        kosullar: [{ ad: "Seçilen kütle soruda istenen kütle (2,5 kg).", f: v => v[0] === "2,5" }],
        sutun: ["Kütle", "Fiyat", "Fiyat : Kütle"], satir: v => [`${v[0]} kg`, `${D(300 * N(v[0]))} TL`, "300"],
        yon: "Kütleyi değiştirin; ışın üzerindeki nokta ve kesik çizgiler fiyatı gösterir. Her denemede fiyatın kütleye oranına bakın, sonra 2,5 kg'ı seçin.",
        bitis: "2,5 kg leblebinin fiyatını okuduğunuzda." }),

    /* 4 · Otobüs: çift sayı doğrusu */
    4: el => KO(el, { girdi: [{ ad: "Süre (dk.):", sec: ["15", "30", "45", "60", "75", "90"], bas: "15" }],
        ciz: v => { const d = +v[0]; return cift([0, 15, 30, 45, 60, 75, 90], [0, 12, 24, 36, 48, 60, 72], "Süre (dk.)", "Yol (km)", d) + kutu(`${d} dk. = 15 dakikanın ${d / 15} katı → yol ${12 * d / 15} km`); },
        kosullar: [{ ad: "Seçilen süre 1 saat 15 dakika.", f: v => v[0] === "75" }],
        sutun: ["Süre", "15 dk.'nın katı", "Yol"], satir: v => [`${v[0]} dk.`, +v[0] / 15, `${12 * +v[0] / 15} km`],
        yon: "Süreyi değiştirip yeşil işaretçinin karşısındaki yolu okuyun. 1 saat 15 dakikanın kaç dakika olduğunu düşünüp o süreyi seçin.",
        bitis: "1 saat 15 dakikadaki yolu bulduğunuzda." }),

    /* 5 · Kek: eksik terim */
    5: el => KO(el, { girdi: [{ ad: "Yumurta:", sec: ["3", "6", "9", "12"], bas: "3" }, { ad: "Süt (su bardağı):", min: 1, max: 12, bas: 2 }],
        ciz: v => kutu(`Tarif 3 : 2 · Sizin karışımınız ${v[0]} : ${v[1]}<br>${N(v[0]) * 2 === v[1] * 3 ? "Kıvam tarifle aynı." : "Kıvam tarifle aynı değil."}`),
        kosullar: [{ ad: "Yumurta 9 ve kıvam tarifle aynı.", f: v => v[0] === "9" && 9 * 2 === v[1] * 3 }],
        sutun: ["Yumurta", "Süt", "Kıvam"], satir: v => [v[0], v[1], N(v[0]) * 2 === v[1] * 3 ? "aynı" : "farklı"],
        yon: "Yumurta sayısını ve süt miktarını değiştirin. Önce 6 yumurta için aynı kıvamı bulun; sonra 9 yumurta için kaç bardak süt gerektiğini deneyin.",
        bitis: "9 yumurta için aynı kıvamı bulduğunuzda." }),

    /* 6 · Gezi otobüsü: ters orantı */
    6: el => KO(el, { girdi: [{ ad: "Katılımcı:", sec: ["20", "24", "30", "36", "40", "45"], bas: "20" }, { ad: "Karar:", sec: ["Doğru orantılı", "Ters orantılı", "Orantılı değil"], bas: "Doğru orantılı" }],
        ciz: v => { const n = +v[0]; return kutu(`Kira 9 000 TL · ${n} kişi → kişi başı ${9000 / n} TL<br>Katılımcı · kişi başı = ${B(9000)} · Katılımcı : kişi başı = ${D(n / (9000 / n))}`); },
        kosullar: [{ ad: "Seçilen karar, katılımcı sayısı ile kişi başı ücret arasındaki ilişkiye uyuyor.", f: v => v[1] === "Ters orantılı" }],
        sutun: ["Katılımcı", "Kişi başı", "Çarpım", "Karar"], satir: v => [v[0], `${9000 / +v[0]} TL`, B(9000), v[1]],
        yon: "Katılımcı sayısını değiştirin; her denemede çarpımın ve bölümün ne olduğuna bakın. Sonra ilişkinin türünü seçin.",
        bitis: "İlişkinin türünü doğru seçtiğinizde." }),

    /* 7 · Kitap okuma: üç nicelik çifti */
    7: el => { const C = { "Gün ile okunan sayfa": g => 20 * g, "Gün ile kalan sayfa": g => 300 - 20 * g };
      return KO(el, { girdi: [{ ad: "Gün", min: 1, max: 15, bas: 1 }, { ad: "Çift:", sec: Object.keys(C), bas: "Gün ile okunan sayfa" }],
        ciz: v => { const g = v[0], y = C[v[1]](g); return tablo(["Gün", v[1].split(" ile ")[1], "Bölüm", "Çarpım"], [1, 2, 5].concat(g > 5 ? [g] : []).map(x => [x, C[v[1]](x), D(C[v[1]](x) / x), C[v[1]](x) * x])) + kutu(`${g}. gün: ${y}`); },
        kosullar: [{ ad: v => `${v[1]}: bölüm her satırda aynı (doğru orantılı).`, f: v => v[1] === "Gün ile okunan sayfa" }],
        sutun: ["Çift", "Gün", "Değer"], satir: v => [v[1], v[0], C[v[1]](v[0])],
        yon: "Çifti ve günü değiştirin. Tablodaki bölüm ve çarpım sütunlarına bakarak hangi çiftte neyin sabit kaldığını bulun; kalan sayfa çiftinde çarpımların değiştiğine dikkat edin.",
        bitis: "İki çifti de inceleyip hangisinin orantılı olduğunu bulduğunuzda." }); },

    /* 8 · Fide sıraları: ters orantılı tablo */
    8: el => KO(el, { girdi: [{ ad: "Sıra sayısı:", sec: ["2", "3", "4", "6", "8", "9", "12"], bas: "4" }],
        ciz: v => { const n = +v[0], f = 72 / n; let s = ""; const w = Math.min(14, 360 / f); for (let i = 0; i < Math.min(n, 12); i++) for (let j = 0; j < f; j++) s += `<circle cx="${14 + j * w}" cy="${14 + i * 16}" r="${Math.min(5, w / 2.6)}" fill="#69db7c" stroke="#2b8a3e"/>`;
          return svg(380, Math.min(n, 12) * 16 + 10, s, "Fide sıraları") + kutu(`${n} sıra · ${f} fide = 72`); },
        kosullar: [{ ad: "Seçilen sıra sayısı tablodaki ? sütunlarından biri (8 ya da 9).", f: v => v[0] === "8" || v[0] === "9" }],
        sutun: ["Sıra", "Bir sıradaki fide", "Çarpım"], satir: v => [v[0], 72 / +v[0], 72],

        bitis: "8 ve 9 sıra için bir sıradaki fide sayısını bulup topladığınızda." }),

    /* 9 · Hız ve süre: ters orantıda orantı */
    9: el => KO(el, { girdi: [{ ad: "Eşitlik:", sec: ["60 : 80 = 3 : 4", "60 : 80 = 4 : 3", "60 : 120 = 2 : 4"], bas: "60 : 80 = 4 : 3" }],
        ciz: v => { const [a, b, c, d] = v[0].match(/\d+/g).map(Number); return tablo(["Hız (km/sa.)", "Süre (sa.)", "Hız · Süre"], [[60, 4, 240], [80, 3, 240], [120, 2, 240]]) + kutu(`${a} : ${b} = ${D(a / b)} &nbsp; ${c} : ${d} = ${D(c / d)}`); },
        kosullar: [{ ad: "Seçilen eşitliğin iki yanı eşit (bir orantı).", f: v => { const [a, b, c, d] = v[0].match(/\d+/g).map(Number); return a * d === b * c; } }],
        sutun: ["Eşitlik", "Sol oran", "Sağ oran"], satir: v => { const [a, b, c, d] = v[0].match(/\d+/g).map(Number); return [v[0], D(a / b), D(c / d)]; },
        yon: "Eşitlikleri tek tek seçin; iki oranın değerleri hesaplanır. Ters orantıda hangi sırayla yazılan eşitliğin orantı olduğunu bulun.",
        bitis: "Orantı olan ve olmayan eşitlikleri ayırdığınızda." }),

    /* 10 · İnternet tarifeleri */
    10: el => KO(el, { girdi: [{ ad: "Kullanım (GB)", min: 1, max: 20, bas: 6 }],
        ciz: v => { const g = v[0], a = 150 + 10 * g, b = 23 * g; return cubuklar([["A tarifesi", a, "#ffd8a8"], ["B tarifesi", b, "#a5d8ff"]], 380, 460) + kutu(`A: ${a} TL (ücret : GB = ${D(a / g)}) · B: ${b} TL (ücret : GB = 23)`); },
        kosullar: [{ ad: "Kullanım 12 GB.", f: v => v[0] === 12 }, { ad: "Bu kullanımda A tarifesi daha ucuz.", f: v => 150 + 10 * v[0] < 23 * v[0] }],
        sutun: ["GB", "A", "B", "Ucuz olan"], satir: v => [v[0], `${150 + 10 * v[0]} TL`, `${23 * v[0]} TL`, 150 + 10 * v[0] < 23 * v[0] ? "A" : 150 + 10 * v[0] > 23 * v[0] ? "B" : "eşit"],
        yon: "Kullanımı değiştirin. Hangi tarifede ücret : GB oranının hep aynı kaldığına bakın; 12 GB için iki tarifeyi karşılaştırın.",
        bitis: "12 GB için iki tarifenin ücretini karşılaştırdığınızda." }),

    /* 11 · Yürüyüş pisti: iki çizgi */
    11: el => KO(el, { girdi: [{ ad: "Süre (dk.)", min: 1, max: 5, bas: 1 }, { ad: "Koşucu:", sec: ["Mert", "Selin"], bas: "Selin" }],
        ciz: v => { const t = v[0], m = 200 * t, s = 100 + 150 * t; return grafik({ mx: 5, my: 1000, ay: 100, ey: 200, xad: "Süre (dk.)", yad: "Uzaklık (m)", isin: [[1, 200, "#1c7ed6", "Mert"]], cizgi: [[0, 100, 5, 850, "#e8590c", "Selin"]], nokta: [[t, v[1] === "Mert" ? m : s, v[1] === "Mert" ? "#1c7ed6" : "#e8590c"]] }) + kutu(`${v[1]}: ${t}. dakikada ${v[1] === "Mert" ? m : s} m · uzaklık : süre = ${D((v[1] === "Mert" ? m : s) / t)}`); },
        kosullar: [{ ad: v => `${v[1]} için uzaklık : süre her dakika aynı (orantılı).`, f: v => v[1] === "Mert" }, { ad: "Süre 4 dakika.", f: v => v[0] === 4 }],
        sutun: ["Koşucu", "Süre", "Uzaklık", "Uzaklık : Süre"], satir: v => { const d = v[1] === "Mert" ? 200 * v[0] : 100 + 150 * v[0]; return [v[1], `${v[0]} dk.`, `${d} m`, D(d / v[0])]; },
        yon: "Koşucuyu ve süreyi değiştirin. Her koşucu için birkaç dakika deneyip uzaklık : süre oranının aynı kalıp kalmadığına bakın.",
        bitis: "Orantılı koşucuyu ve 4. dakikadaki uzaklığını bulduğunuzda." }),

    /* 12 · Çerçeveler: altın oran */
    12: el => { const F = { "21 ile 34": [21, 34], "24 ile 36": [24, 36], "30 ile 48": [30, 48], "25 ile 50": [25, 50] };
      return KO(el, { girdi: [{ ad: "Çerçeve (cm):", sec: Object.keys(F), bas: "24 ile 36" }],
        ciz: v => { const [a, b] = F[v[0]], r1 = b / a, r2 = (a + b) / b; return dikd([[b, a, "#fff3bf", ""]], 4, 380) + kutu(`Uzun : kısa = ${D(r1)} · (Uzun + kısa) : uzun = ${D(r2)}<br>Fark: ${D(Math.abs(r1 - r2))}`); },
        kosullar: [{ ad: "İki oranın farkı 0,005'ten küçük.", f: v => { const [a, b] = F[v[0]]; return Math.abs(b / a - (a + b) / b) < .005; } }],
        sutun: ["Çerçeve", "Uzun : kısa", "(Uzun + kısa) : uzun", "Fark"], satir: v => { const [a, b] = F[v[0]]; return [v[0], D(b / a), D((a + b) / b), D(Math.abs(b / a - (a + b) / b))]; },
        yon: "Çerçeveleri tek tek seçin; iki oran ve farkları hesaplanır. Farkı en küçük olan çerçeveyi bulun.",
        bitis: "İki oranı birbirine en yakın olan çerçeveyi bulduğunuzda." }); },

    /* 13 · Ayran kampanyası */
    13: el => KO(el, { girdi: [{ ad: "Ayran sayısı", min: 1, max: 9, bas: 1 }],
        ciz: v => { const n = v[0], t = 18 * (n - Math.floor(n / 3)); return cubuklar([["Kampanyalı", t, "#a5d8ff"], ["Kampanyasız", 18 * n, "#dee2e6"]], 380, 162) + kutu(`${n} ayran: ${t} TL · tutar : ayran = ${D(t / n)}`); },
        kosullar: [{ ad: "Bu alımda tutar : ayran = 18 (her ayran 18 TL).", f: v => 18 * (v[0] - Math.floor(v[0] / 3)) === 18 * v[0] }],
        sutun: ["Ayran", "Tutar", "Tutar : Ayran"], satir: v => { const t = 18 * (v[0] - Math.floor(v[0] / 3)); return [v[0], `${t} TL`, D(t / v[0])]; },
        yon: "Ayran sayısını 1'den başlayarak artırın. Tutar : ayran oranının hangi alımlarda 18 kaldığına, hangilerinde değiştiğine bakın.",
        bitis: "Kampanyanın orantıyı bozduğu alımları bulduğunuzda." }),

    /* 14 · Fotoğraf baskısı: kâğıda sığan en büyük baskı (07.10.2026 elle denetim: soru yenilendi) */
    14: el => { const KA = [24, 40], k = 5;
      const sahne = b => { const e = b * 2 / 3, sig = e <= KA[0] && b <= KA[1], W = 420, Hh = KA[1] * k + 60, x0 = 40, y0 = Hh - 30;
        let s = `<rect x="${x0}" y="${y0 - KA[1] * k}" width="${KA[0] * k}" height="${KA[1] * k}" fill="#f8f9fa" stroke="#495057" stroke-width="2" stroke-dasharray="6 4"/>`;
        s += `<rect x="${x0}" y="${y0 - b * k}" width="${e * k}" height="${b * k}" fill="${sig ? "#d3f9d8" : "#ffe8cc"}" fill-opacity=".85" stroke="${sig ? "#2b8a3e" : "#e8590c"}" stroke-width="2.5"/>`;

1111\" text-anchor=\"end\">8</text><circle cx=\"60.0\" cy=\"138.0\" r=\"5\" fill=\"#2b8a3e\" stroke=\"#fff\" stroke-width=\"1.2\"/><circle cx=\"84.0\" cy=\"102.0\" r=\"5\" fill=\"#2b8a3e\" stroke=\"#fff\" stroke-width=\"1.2\"/><circle cx=\"108.0\" cy=\"90.0\" r=\"5\" fill=\"#2b8a3e\" stroke=\"#fff\" stroke-width=\"1.2\"/></g><text x=\"521.2\" y=\"206.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">C</text></svg>", "a": ["A: Noktalar başlangıç noktasından çıkan bir ışın üzerindedir (oran hep 2).", "B: Noktalar düz bir çizgi üzerindedir ama çizgi başlangıç noktasından geçmez.", "C: Noktalar düz bir çizgi oluşturmaz. Yalnız A orantılıdır."], "c": "A"}, {"k": "Bir çift sayı doğrusunun üst doğrusunda süre (sa.) 0, 1, 2, 3; alt doğrusunda ödenen ücret (TL) 24, 41, 58, 75 yazılıdır. Süre ile ücret orantılı mıdır? Açıklayınız.", "a": ["Alt doğru 0'dan değil 24'ten başlamaktadır; iki doğrunun 0'ları hizalı değildir.", "Süre 1'den 2'ye 2 katına çıkınca ücret 41'den 58'e çıkar; 2 katına çıkmaz.", "Süre ile ücret orantılı değildir."], "c": "Orantılı değil"}]}, {"no": 5, "bas": "Doğru orantı", "q": [{"k": "Bir aracın harcadığı benzin 10 L, 20 L ve 30 L iken gittiği yol sırasıyla 130 km, 260 km ve 390 km'dir. Benzin ile yolun doğru orantılı olup olmadığını iki özelliği denetleyerek açıklayınız.", "a": ["Aynı yönlü değişim: benzin artarken yol da artmaktadır.", "Sabit çarpımsal ilişki: 130 : 10 = 260 : 20 = 390 : 30 = 13.", "İki özellik de sağlandığı için benzin ile yol doğru orantılıdır."], "c": "Doğru orantılı"}, {"k": "Aynı yönde değişen ama doğru orantılı olmayan iki niceliğe bir örnek yazınız ve neden doğru orantılı olmadığını açıklayınız.", "a": ["Örnek: bir çocuğun yaşı ile boyu.", "Yaş artarken boy da artar (aynı yön).", "Ama yaş 2 katına çıkınca boy 2 katına çıkmaz; boyun yaşa oranı sabit değildir. (Karenin kenarı ile alanı gibi başka uygun örnekler de kabul edilir.)"], "c": "ör. yaş ile boy"}]}, {"no": 6, "bas": "Ters orantı", "q": [{"k": "Bir ödül parası eşit paylaştırılmaktadır. 2 kişiye 30'ar, 4 kişiye 15'er, 5 kişiye 12'şer TL düşmektedir. Kişi sayısı ile kişi başı payın ters orantılı olup olmadığını çarpımları yazarak belirleyiniz.", "a": ["Kişi sayısı artarken pay azalmaktadır (zıt yön).", "Çarpımlar: 2 · 30 = 4 · 15 = 5 · 12 = 60.", "Çarpım sabit olduğundan kişi sayısı ile pay ters orantılıdır."], "c": "Ters orantılı"}, {"k": "A ile B ters orantılıdır. A = 3 iken B = 16'dır. A = 6 ve A = 8 iken B kaç olur?", "a": ["Sabit çarpım: 3 · 16 = 48.", "A = 6 iken B = 48 : 6 = 8.", "A = 8 iken B = 48 : 8 = 6."], "c": "8 ve 6"}]}, {"no": 7, "bas": "Durumları yorumlamak", "q": [{"k": "Aşağıdaki durumları doğru orantılı, ters orantılı ya da orantılı değil diye sınıflandırınız.<br>a) Aynı fiyattaki biletlerin sayısı ile toplam tutar<br>b) Bir pasta eşit dilimlere bölünürken dilim sayısı ile bir dilimin büyüklüğü<br>c) Bir ağacın yaşı ile boyu<br>d) Belirli bir yolu koşan birinin hızı ile koşu süresi", "a": ["a) Bölüm sabit (bir biletin fiyatı): doğru orantılı.", "b) Dilim sayısı · bir dilimin büyüklüğü = bütün pasta: ters orantılı. d) Hız · süre = yol: ters orantılı.", "c) Yaş ile boy birlikte artar ama oran sabit değildir: orantılı değil."], "c": "a) doğru b) ters c) orantılı değil d) ters"}, {"k": "Aynı fiyattaki simitlerin sayısı ile tutar doğru orantılıdır. Bu durumu orantılı olmaktan çıkaran bir koşul yazınız ve kısaca açıklayınız.", "a": ["Örnek koşul: “4 simit alana 1 simit hediye” kampanyası.", "Simit 10 TL ise 4 simit 40 TL, 5 simit de 40 TL olur.", "Tutar : simit sayısı 10'dan 8'e düşer; oran sabit kalmaz. (Paket ücreti, öğrenci indirimi gibi başka uygun koşullar da kabul edilir.)"], "c": "ör. kampanya"}]}, {"no": 8, "bas": "Önermeler ve gerçek yaşam", "q": [{"k": "“Ters orantılı iki nicelikten biri azalırken öbürü de azalır.” önermesi doğru mudur? Bir örnekle gerekçelendiriniz.", "a": ["Ters orantıda nicelikler zıt yönde değişir.", "Örnek: 60 TL eşit paylaşılırsa 2 kişiye 30'ar, 1 kişiye 60 TL düşer; kişi sayısı azalırken pay artar.", "Önerme yanlıştır."], "c": "Yanlıştır"}, {"k": "Bir arabanın deposuna aynı fiyattan alınan benzin miktarı ile ödenen tutar arasındaki ilişkiyi orantı kavramını kullanarak kendi cümlelerinizle açıklayınız.", "a": ["Benzinin litresi her alımda aynı fiyattadır.", "Benzin miktarı kaç katına çıkarsa tutar da o katına çıkar; her alımda tutar : litre oranı aynıdır.", "Bu nedenle iki alımın oranları eşittir ve bir orantı oluşturur; benzin miktarı ile tutar doğru orantılıdır."], "c": "Doğru orantılı; oranlar eşit"}]}], "k": [{"no": 1, "bas": "Orantı oluşturur mu?", "yon": "Oranlar orantı oluşturuyorsa “Oluşturur”, oluşturmuyorsa “Oluşturmaz” yazınız. Boş bırakılan terimi kat ilişkisiyle bulunuz.", "r": [{"n": "3 : 4 ile 9 : 12", "c": "Oluşturur"}, {"n": "5 : 6 ile 6 : 7", "c": "Oluşturmaz"}, {"n": "2 : 5 = ▢ : 55", "c": "22"}, {"n": "1/2 : 3/4 ile 2 : 3", "c": "Oluşturur"}, {"n": "0,6 : 1,5 ile 2 : 5", "c": "Oluşturur"}, {"n": "7 : ▢ = 21 : 24", "c": "8"}, {"n": "1,2 : 3 = 4 : ▢", "c": "10"}, {"n": "8 : 10 ile 12 : 14", "c": "Oluşturmaz"}]}, {"no": 2, "bas": "Bölüm mü sabit, çarpım mı?", "yon": "Her tablonun türünü (bölüm sabit: doğru orantı, çarpım sabit: ters orantı) yazınız ve ▢ ile gösterilen değeri bulunuz.", "r": [{"n": "A: 2, 4, 6; B: 7, 14, ▢", "c": "Bölüm sabit; 21"}, {"n": "A: 2, 3, 6; B: 9, 6, ▢", "c": "Çarpım sabit; 3"}, {"n": "A: 1, 4, 5; B: 20, 5, ▢", "c": "Çarpım sabit; 4"}, {"n": "A: 3, 6, 9; B: 4, 8, ▢", "c": "Bölüm sabit; 12"}, {"n": "A: 4, 8, 16; B: 12, 6, ▢", "c": "Çarpım sabit; 3"}, {"n": "A: 5, 10, 15; B: 2, 4, ▢", "c": "Bölüm sabit; 6"}]}, {"no": 3, "bas": "Doğru orantılı, ters orantılı ya da orantılı değil?", "yon": "Her durumdaki iki niceliğin ilişkisini yazınız ve kısa bir gerekçe ekleyiniz.", "r": [{"n": "Aynı fiyattaki elmaların kütlesi ile tutarı", "c": "Doğru orantılı"}, {"n": "Bir öğrencinin boyu ile ağırlığı", "c": "Orantılı değil"}, {"n": "Belirli bir yolu giden aracın hızı ile süresi", "c": "Ters orantılı"}, {"n": "Sabit adımla yürüyen birinin adım sayısı ile aldığı yol", "c": "Doğru orantılı"}, {"n": "Bir ipi eş parçalara bölerken parça sayısı ile bir parçanın uzunluğu", "c": "Ters orantılı"}, {"n": "İlk saati sabit ücretli otoparkta süre ile ücret", "c": "Orantılı değil"}, {"n": "Bir karenin kenar uzunluğu ile çevre uzunluğu", "c": "Doğru orantılı"}, {"n": "Eşit paylaşılan bir pizzada kişi sayısı ile bir kişinin payı", "c": "Ters orantılı"}, {"n": "Bir şehrin yıllara göre nüfusu", "c": "Orantılı değil"}, {"n": "Eni sabit dikdörtgenlerde boy ile alan", "c": "Doğru orantılı"}]}], "b": [{"no": 1, "on": "<p>Bir parkta elektrikli scooter ve bisiklet kiralanmaktadır. Kiralama ücretleri parkın girişindeki tabelada yazılıdır.</p>", "g": "<svg viewBox=\"0 0 456 116\" width=\"456\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"210\" height=\"100\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H210 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"113.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Scooter</text><text x=\"113.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Açılış: 15 TL</text><text x=\"113.0\" y=\"88.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Dakikası: 4 TL</text><rect x=\"232\" y=\"8\" width=\"210\" height=\"100\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M232 36 V16 q0 -8 8 -8 H434 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"337.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Bisiklet</text><text x=\"337.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Açılış ücreti yok</text><text x=\"337.0\" y=\"88.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Dakikası: 3 TL</text></svg>", "son": "<p>Bir öğrenci her araç için kiralama süresi ile ödenen ücret arasındaki ilişkiyi incelemiştir.</p>", "k": "Buna göre, aşağıdakilerden hangisi doğrudur?", "sec": ["Yalnız scooterda kiralama süresi ile ödenen ücret orantılıdır.", "Yalnız bisiklette kiralama süresi ile ödenen ücret orantılıdır.", "İki araçta da kiralama süresi ile ödenen ücret orantılıdır.", "İki araçta da kiralama süresi ile ödenen ücret orantılı değildir."], "secg": null, "c": "B", "a": ["Bisiklet: 10 dakika 30 TL, 20 dakika 60 TL'dir; süre 2 katına çıkınca ücret de 2 katına çıkar. Ücret : süre her zaman 3'tür.", "Scooter: 10 dakika 15 + 40 = 55 TL, 20 dakika 15 + 80 = 95 TL'dir; süre 2 katına çıkınca ücret 2 katına çıkmaz.", "Açılış ücreti, 0 dakikada bile 15 TL ödenmesine yol açar; bu yüzden scooterda süre ile ücret orantılı değildir."], "t": "Scooter için orantılı denilmesi: ücretin her dakika eşit artması orantı sanılmış; ikisinin de orantılı olmadığı: dakika ücretinin farklı olması orantıyı bozuyor sanılmış", "d": "Bir durumun orantılı olup olmadığına karar vermek için ücretin süreye bölümünü farklı süreler için hesaplayınız. Ücret her dakika eşit artsa da açılış ücreti varsa süre 2 katına çıkınca ücret 2 katına çıkmaz.", "ses": "b01"}, {"no": 2, "on": "<p>Bir fırıncı pide hamurunu un ve su karıştırarak hazırlamaktadır. Pazartesi ve salı günü kullandığı malzemeleri deftere yazmıştır.</p>", "g": "<svg viewBox=\"0 0 436 116\" width=\"436\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"200\" height=\"100\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H200 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"108.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Pazartesi</text><text x=\"108.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Un: 3 kg</text><text x=\"108.0\" y=\"88.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Su: 2 L</text><rect x=\"222\" y=\"8\" width=\"200\" height=\"100\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M222 36 V16 q0 -8 8 -8 H414 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"322.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Salı</text><text x=\"322.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Un: 4,5 kg</text><text x=\"322.0\" y=\"88.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Su: 3 L</text></svg>", "son": "<b>Ali:</b> “İki günün un : su oranları bir orantı oluşturur: 3 : 2 = 4,5 : 3.”<br><b>Ece:</b> “Salı günü daha çok su kullanıldığı için salı günkü hamur daha suludur.”<br><b>Can:</b> “3 : 2 = 3 : 4,5 eşitliği iki günün hamurlarını karşılaştıran bir orantıdır.”", "k": "Buna göre, hangi öğrencinin söylediği doğrudur?", "sec": ["Yalnız Ali", "Yalnız Ece", "Ali ve Can", "Ece ve Can"], "secg": null, "c": "A", "a": ["Pazartesi un : su = 3 : 2, salı un : su = 4,5 : 3'tür. 3'ten 4,5'e ulaşmak için 3 sayısı 1,5 ile çarpılır; 2 de 1,5 ile çarpılınca 3 olur. Oranlar eşittir; Ali haklıdır.", "Ece yalnız su miktarına bakmıştır; un da aynı katına çıktığı için iki hamurun kıvamı aynıdır.", "Can'ın eşitliğinde ikinci oranın terimleri ters sırayla yazılmıştır (su : un); 3 : 2 ile 3 : 4,5 eşit değildir."], "t": "Ece'yi içeren seçenekler: miktar ile oran karıştırılmış; Can'ı içeren seçenek: orantıda terimlerin sırası gözden kaçmış", "d": "Orantı kurarken iki oranı aynı sırayla yazınız: un : su = un : su. Daha çok su kullanılması hamurun daha sulu olduğunu göstermez; un da aynı katına çıkmış olabilir.", "ses": "b02"}, {"no": 3, "on": "<p>Bir kuruyemişçide leblebinin kütlesi ile fiyatı arasındaki ilişki aşağıdaki grafikte gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 410.8 224.0\" width=\"411\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><circle cx=\"50.0\" cy=\"190.0\" r=\"1.6\" fill=\"#8a93a6\"/><circle cx=\"50.0\" cy=\"173.0\" r=\"1.6\" fill=\"#8a93a6\"/><circle cx=\"50.0\" cy=\"156.0\" r=\"1.6\" fill=\"#8a93a6\"/><circle cx=\"50.0\" cy=\"139.0\" r=\"1.6\" fill=\"#8a93a6\"/><circle cx=\"50.0\" cy=\"122.0\" r=\"1.6\" fill=\"#8a93a6\"/><circle cx=\"50.0\" cy=\"105.0\" r=\"1.6\" fill=\"#8a93a6\"/><circle cx=\"50.0\" cy=\"88.0\" r=\"1.6\" fill=\"#8a93a6\"/><circle cx=\"50.0\" cy=\"71.0\" r=\"1.6\" fill=\"#8a93a6\"/><circle cx=\"50.0\" cy=\"54.0\" r=\"1.6\" fill=\"#8a93a6\"/><circle cx=\"106.0\" cy=\"190.0\" r=\"1.6\" fill=\"#8a93a6\"/><circle cx=\"106.0\" cy=\"173.0\" r=\"1.6\" fill=\"#8a93a6\"/><circle cx=\"106.0\" cy=\"156.0\" r=\"1.6\" fill=\"#8a93a6\"/><circle cx=\"106.0\" cy=\"139.0\" r=\"1.6\" fill=\"#8a93a6\"/><circle cx=\"106.0\" cy=\"122.0\" r=\"1.6\" fill=\"#8a93a6\"/><circle cx=\"106.0\" cy=\"105.0\" r=\"1.6\" fill=\"#8a93a6\"/><circle cx=\"106.0\" cy=\"88.0\" r=\"1.6\" fill=\"#8a93a6\"/><circle cx=\"106.0\" cy=\"71.0\" r=\"1.6\" fill=\"#8a93a6\"/><circle cx=\"106.0\" cy=\"54.0\" r=\"1.6\" fill=\"#8a93a6\"/><circle cx=\"162.0\" cy=\"190.0\" r=\"1.6\" fill=\"#8a93a6\"/><circle cx=\"162.0\" cy=\"173.0\" r=\"1.6\" fill=\"#8a93a6\"/><circle cx=\"162.0\" cy=\"156.0\" r=\"1.6\" fill=\"#8a93a6\"/><circle cx=\"162.0\" cy=\"139.0\" r=\"1.6\" fill=\"#8a93a6\"/><circl >", "k": "Buna göre, 2,5 kg leblebi kaç TL'dir?", "sec": ["600", "900", "450", "750"], "secg": null, "c": "D", "a": ["Işın başlangıç noktasından çıkmaktadır; kütle ile fiyat orantılıdır.", "Grafikten 1 kg leblebinin 300 TL olduğu okunur.", "2,5 kg leblebi 2,5 · 300 = 750 TL'dir."], "t": "600 ve 900: 2 kg ve 3 kg'ın fiyatı okunmuş; 450: 1,5 kg'ın fiyatı hesaplanmış", "d": "Grafikteki ışından 1 kg'ın fiyatını okuyunuz. 2,5 kg, 2 kg ile 3 kg arasındadır; değeri bulmak için 1 kg'ın fiyatını 2,5 ile çarpınız.", "ses": "b03"}, {"no": 4, "on": "<p>Şehirler arası bir otobüs yolun bir bölümünde sabit hızla ilerlemiştir. Otobüsün bu bölümde geçen süre ile aldığı yol aşağıdaki çift sayı doğrusunda gösterilmiştir.</p>", "g": "<svg viewBox=\"0 0 384.0 144\" width=\"384\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><text x=\"94.0\" y=\"45.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">Süre (dk.)</text><line x1=\"112\" y1=\"40\" x2=\"368.0\" y2=\"40\" stroke=\"#1c5fbf\" stroke-width=\"2.2\"/><polygon points=\"374.0,40 365.0,35.5 365.0,44.5\" fill=\"#1c5fbf\"/><text x=\"94.0\" y=\"109.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"end\">Yol (km)</text><line x1=\"112\" y1=\"104\" x2=\"368.0\" y2=\"104\" stroke=\"#d9480f\" stroke-width=\"2.2\"/><polygon points=\"374.0,104 365.0,99.5 365.0,108.5\" fill=\"#d9480f\"/><line x1=\"112.0\" y1=\"33\" x2=\"112.0\" y2=\"47\" stroke=\"#111111\" stroke-width=\"1.6\"/><line x1=\"112.0\" y1=\"97\" x2=\"112.0\" y2=\"111\" stroke=\"#111111\" stroke-width=\"1.6\"/><text x=\"112.0\" y=\"24.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">0</text><text x=\"112.0\" y=\"130.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">0</text><line x1=\"186.0\" y1=\"33\" x2=\"1  bulup yolu da o katına çıkarınız.", "ses": "b04"}, {"no": 5, "on": "<p>Bir pastacının kek tarifinde her 3 yumurta için 2 su bardağı süt kullanılmaktadır. Pastacı aynı kıvamda daha büyük bir kek için 9 yumurta kullanacaktır.</p>", "g": "<svg viewBox=\"0 0 456 116\" width=\"456\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"210\" height=\"100\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H210 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"113.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Tarif</text><text x=\"113.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">3 yumurta</text><text x=\"113.0\" y=\"88.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">2 su bardağı süt</text><rect x=\"232\" y=\"8\" width=\"210\" height=\"100\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M232 36 V16 q0 -8 8 -8 H434 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"337.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Büyük kek</text><text x=\"337.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">9 yumurta</text><text x=\"337.0\" y=\"88.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">? su bardağı süt</text></svg>", "son": "<p>Yumurta sayısının süt miktarına oranı iki kekte de aynı olacaktır.</p>", "k": "Buna göre, 3 : 2 = 9 : ? orantısında ? yerine yazılması gereken sayı kaçtır?", "sec": ["6", "8", "13,5", "4"], "secg": null, "c": "A", "a": ["3 yumurtadan 9 yumurtaya ulaşmak için 3 sayısı 3 ile çarpılır.", "Orantının korunması için süt de 3 ile çarpılır: 2 · 3 = 6.", "3 : 2 = 9 : 6; büyük kekte 6 su bardağı süt kullanılır."], "t": "8: yumurtaya eklenen 6 süte de eklenmiş; 13,5: 9 sayısı 3/2 ile çarpılmış; 4: 6 yumurtalık artış 2 bardağa bölünmüş gibi işlem yapılmış", "d": "Eksik terimi bulurken iki oranın terimleri arasındaki kat ilişkisini kullanınız. Yumurtaya eklenen sayıyı süte eklemek orantıyı bozar.", "ses": "b05"}, {"no": 6, "on": "<p>Bir okulun gezi kulübü otobüs kiralamıştır. Otobüsün kira ücreti, geziye katılan öğrenciler arasında eşit olarak paylaştırılacaktır. Kulüp başkanı farklı katılımcı sayıları için kişi başına düşen ücreti tabloya yazmıştır.</p>", "g": "<svg viewBox=\"0 0 400 176\" width=\"400\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><text x=\"200.0\" y=\"18.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Tablo: Katılımcı Sayısı ve Kişi Başı Ücret</text><rect x=\"10\" y=\"30\" width=\"380\" height=\"36\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Katılımcı sayısı</text><text x=\"290.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Kişi başı ücret (TL)</text><rect x=\"10\" y=\"66\" width=\"380\" height=\"34\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"100.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">20</text><text x=\"290.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">450</text><rect x=\"10\" y=\"100\" width=\"380\" height=\"34\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"100.0\" y=\"122.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">30</text><text x=\"290.0\" y=\"122.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">300</text><rect x=\"10\" y=\"134\" width=\"380\" height=\"34\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"100.0\" y=\"156.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">36</text><text x=\"290.0\" y=\"156.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">250</text><line x1=\"190\" y1=\"30\" x2=\"190\" y2=\"168\" stroke=\"#495057\" stroke-width=\"1\"/></svg>", "son": "", "k": "Buna göre, katılımcı sayısı ile kişi başına düşen ücret arasındaki ilişki için aşağıdakilerden hangisi doğrudur?", "sec": ["Doğru orantılıdır; her satırda bölüm aynıdır.", "Orantılı değildir; çünkü katılımcı sayısı artarken ücret azalmaktadır.", "Orantılı değildir; çünkü katılımcı sayısı her satırda farklı miktarda artmaktadır.", "Ters orantılıdır; her satırda iki niceliğin çarpımı aynıdır."], "secg": null, "c": "D", "a": ["Katılımcı sayısı artarken kişi başı ücret azalmaktadır; değişim zıt yönlüdür.", "Her satırda çarpım otobüsün kira ücretidir: 20 · 450 = 30 · 300 = 36 · 250 = 9 000.", "Zıt yönlü ve sabit çarpımsal ilişki olduğundan nicelikler ters orantılıdır."], "t": "Doğru orantılı: bölümler hesaplanmadan seçilmiş; zıt yön ya da düzensiz artış orantısızlık sanılmış", "d": "Katılımcı sayısı artarken kişi başı ücret azalıyorsa çarpımları hesaplayınız. Her satırda çarpım aynıysa nicelikler ters orantılıdır; zıt yönde değişmek tek başına yetmez.", "ses": "b06"}, {"no": 7, "on": "<p>Elif 300 sayfalık bir kitabı her gün eşit sayıda sayfa okuyarak bitirmeyi planlamıştır. İlk planına göre her gün 20 sayfa okuyacaktır.</p>", "g": "<svg viewBox=\"0 0 436 92\" width=\"436\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><rect x=\"8\" y=\"8\" width=\"200\" height=\"76\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M8 36 V16 q0 -8 8 -8 H200 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"108.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Kitap</text><text x=\"108.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">300 sayfa</text><rect x=\"222\" y=\"8\" width=\"200\" height=\"76\" rx=\"8\" fill=\"#fffdf5\" stroke=\"#495057\" stroke-width=\"1.4\"/><path d=\"M222 36 V16 q0 -8 8 -8 H414 q8 0 8 8 V36 Z\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.4\"/><text x=\"322.0\" y=\"27.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Plan</text><text x=\"322.0\" y=\"64.9\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"700\" fill=\"#111111\" text-anchor=\"middle\">Her gün 20 sayfa</text></svg>", "son": "<div style=\"margin:1mm 0 1mm 2mm\"><div style=\"margin:.6mm 0\">I. Geçen gün sayısı ile o güne kadar okunan toplam sayfa sayısı doğru orantılıdır.</div><div style=\"margin:.6mm 0\">II. Geçen gün sayısı ile okunmayı bekleyen sayfa sayısı ters orantılıdır.</div><div style=\"margin:.6mm 0\">III. Her gün okunan sayfa sayısı ile kitabın bitme süresi (gün) ters orantılıdır.</div></div>", "k": "Buna göre, verilen ifadelerden hangileri doğrudur?", "sec": ["I ve II", "I ve III", "II ve III", "I, II ve III"], "secg": null, "c": "B", "a": ["I: 1, 2, 5 günde okunan sayfa 20, 40, 100'dür; bölüm hep 20'dir. Doğrudur.", "II: Kalan sayfa 280, 260, 200'dür; gün artarken azalır ama çarpımlar 280, 520, 1 000'dir; sabit değildir. Yanlıştır.", "III: Günde 20 sayfa okunursa 15 günde, 30 sayfa okunursa 10 günde biter; günlük sayfa · gün = 300 sabittir. Doğrudur."], "t": "II'yi içeren seçenekler: zıt yönde değişim ters orantı sanılmış", "d": "Aynı durumdan farklı nicelik çiftleri çıkabilir: okunan sayfa, kalan sayfa ve günlük sayfa. Her çift için bölümü ve çarpımı ayrı ayrı denetleyiniz.", "ses": "b07"}, {"no": 8, "on": "<p>Bir bahçeye 72 fide, her sırada eşit sayıda fide olacak şekilde sıralar hâlinde dikilecektir. Bahçıvan sıra sayısına göre bir sıradaki fide sayısını tabloya yazmaya başlamıştır.</p>", "g": "<svg viewBox=\"0 0 490 108\" width=\"490\" xmlns=\"http://www.w3.org/2000/svg\" class=\"fig\"><text x=\"245.0\" y=\"18.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"14\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Tablo: Sıra Sayısı ve Bir Sıradaki Fide</text><rect x=\"10\" y=\"30\" width=\"470\" height=\"36\" fill=\"#eaf7f1\" stroke=\"#495057\" stroke-width=\"1.3\"/><text x=\"105.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">Sıra sayısı</text><text x=\"235.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">4</text><text x=\"305.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">6</text><text x=\"375.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">8</text><text x=\"445.0\" y=\"53.0\" font-family=\"Source Sans 3\",sans-serif font-size=\"13.5\" font-weight=\"800\" fill=\"#111111\" text-anchor=\"middle\">9</text><rect x=\"10\" y=\"66\" width=\"470\" height=\"34\" fill=\"#fff\" stroke=\"#495057\" stroke-width=\"1\"/><text x=\"105.0\" y=\"88.2\" font-family=\"Source Sans 3\",sans-serif font-size=\"15\" font-weight=\"700\" fill=\"#111111\" text-ancho
